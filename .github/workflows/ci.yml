name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun 1.3.8
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Acquire immutable reference cache
        run: bun run references bootstrap

      - name: Run deterministic repository gate
        run: bun run ci:verify
