source checks and a built candidate do not establish local.8 browser acceptance. No Foundry/dnd5e prototype or global status definition is changed.\n\nLocal.9 adds independent patch 0006 for the Batch 6 AL manual-APPLY `isDamaged` timing failure. With dnd5e 6 and `autoApplyDamage=\"none\"`, calculated damage still runs Midi hooks and macros, but DAE `isDamaged` expiry waits for the Midi usage card's own APPLY. The tray requires the exact originating message, a post-write `dnd5e.applyDamage` event, positive HP or temp HP loss, and matching final actor readback before recording a new application. An existing Midi GM action first stores and reads back an independent target Actor flag containing the exact effect UUIDs for this card and damage selector; only those effects can then expire. A retry or fresh client reconciles that snapshot even if HP is already zero, and does not remove an effect added later if completion marking failed. Effects already marked `duration.expired` or disabled also count as settled. If a later target's native APPLY fails, confirmed earlier targets are finalized before the original failure propagates. Cancelled, zero, mismatched, or unrecognized new applications leave the effect in place. Automatic modes retain their existing path. Manual `isDamaged.\u003ctype>` remains unexpired because the post-write hook does not prove a positive contribution from that exact type. On 2026-09-25 the ServerNext GM used a normal Dagger attack and manual damage card: before APPLY the target had HP 40 and the base `isDamaged` effect; after one APPLY it had HP 28 and the effect was removed. This closes that scoped behavior, with task fixtures cleaned. Typed-duration, temporary HP, cancel/retry, and other distinct paths remain outside that observation.\n","foundry-modules/monster-spell-resolver/README.zh-CN.md":"# 怪物法术解析器\n\n这是安装进 Foundry Virtual Tabletop（Foundry VTT）的浏览器模块。它读取本项目生成 Actor 携带的可移植法术清单，在目标世界已启用的 dnd5e 法术资料包中寻找匹配法术，并以 Actor 为单位执行全有或全无的安全解析。\n\n运行时仅接受 Foundry/dnd5e 精确配对 `14.364/5.3.3`、`14.368/5.3.3`、`14.368/6.0.2`、`14.368/6.0.5` 和 `14.368/6.0.6`。`6.0.2` 的既有水合与指定施法路径有历史运行证据；`6.0.5` 在2026-10-01独立通过资料索引、十法术自动水合完整归属、普通UI一次Undo及重载后pending／0缓存。该轮没有人工Review／Apply点击，原生Cast完整矩阵仍未执行，见[限定接受](../../docs/reviews/2026-10-01-next-605-custom-module-restoration.md)。`6.0.6` 当前对 `0.1.7` 的限定接受覆盖一个 Rat NPC 样本：原生NPC角色卡上的十条法术、生成施法入口及各自来源和缓存逐一对应；当前含 Midi-QOL 的组合中，迷踪步经正常使用窗口消耗一次；撤销上次水合及普通重载后保持待处理、零法术缓存和零生成Cast。测试角色、消息和取证工具已清理，原内容及已采范围内的设置、账号和场景状态读回通过。该结果不覆盖真实传送落点、无Midi-QOL的组合、全法术库、所有活动、玩家、长时或生产；设置比较也不代表全库原值均已采集。精确构建、运行证据与采集范围见[本轮总账](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。交叉配对及 `6.0.3`、`6.0.4` 等未列版本拒绝。\n\n## 使用帮助\n\n在“游戏设置 → 模块设置 → 目标世界法术解析器”中点击“使用帮助”。GM 在统一操作手册合集已启用且接口可用时，会定位本模块说明；合集不可用时打开模块随包的只读说明。帮助与离线手册共用 `docs/manual.json`，点击帮助不会保存设置、重建索引或执行法术解析。新入口尚待真实Foundry窗口验收。\n\n## 目录归属\n\n- `src/`：浏览器运行源码、`module.json`、语言文件、样式、模板和模块测试。\n- `build.ts`：构建可安装目录和 ZIP。\n- `lab.ts`、`labCli.ts`、`labConfig.ts`：只负责配置后的本地 Foundry Lab 构建、安装、校验、卸载和一次性测试世界准备。\n- `dist/`：可重建的本地构建产物，不提交 Git。\n\n旧目录 `src/foundry/monster-spell-resolver/` 和旧构建、安装脚本已经退役；本目录是唯一实现位置。\n\n## 常用命令\n\n在仓库根目录运行：\n\n```powershell\nbun run test:spell-resolver\nbun run typecheck:foundry-modules\nbun run build:spell-resolver\nbun run foundry:lab spell-resolver install --apply\nbun run foundry:lab spell-resolver verify-install\n```\n\n构建产物位于 `foundry-modules/monster-spell-resolver/dist/`。本地安装目标由 `FVTT_OPS_LAB_ROOT` 精确解析；当前机器的持久测试环境是 `F:\\FoundryLab\\foundry-v14`。\n\n上面的 `foundry:lab spell-resolver install` 是既有 server-mirror 安装路径。ServerNext 首次安装可用 `bun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-json-generator-spell-resolver --version=0.1.7`，先检查干跑的目标与 SHA-256，再加 `--apply`；目标已有版本时该工具拒绝覆盖，升级需单独执行受控流程。0.1.5 只是诊断版，发现正式 Rat Warlock 首条法术的原生缓存投影比较失败；只读差异仅有九条原生效果变化行 `_id` 不同。0.1.6 只忽略这些重建 ID，正式怪物十法术水合及代表性攻击、豁免、目标伤害和日次数消耗真实通过；但一次 Undo 与补偿真实失败，留下 10 个无归属原生缓存。当前已装 `0.1.7` 定点修正 Undo flags 递归合并、系统重建时间戳与效果来源、原生缓存清理。新任务怪物自动十法术水合后，单次 Undo 回到 `pending` 且0法术/0无归属缓存/0受管活动，整页重载结果相同；[现场证据](../../docs/reviews/2026-09-25-resolver-undo-source-and-fix.md)。故意故障补偿仅单测，未在运行中世界注入。文件安装、世界启用、水合、原生 Cast 与 Undo 是分别验收的步骤。\n\n## 支持与安全边界\n\n- 当前本地候选在最终保存后核对完成记录和受管法术/活动。保存被拦截、记录不完整或内容在保存期间变化时，报告提交失败并尝试恢复；恢复只替换本模块自己的记录，残留差异仍会报告。缺少必要的精确恢复接口时，在第一次文档写入前停止。本修复已完成离线事务检查；ServerNext 6.0.6 仅在上文唯一批准 Rat NPC 的限定实机链上接受。\n- 运行时仅接受上列精确组合；交叉组合和未列版本会拒绝。manifest 的 `verified` 仍是旧组合；既有十法术水合、代表性原生 Cast 与一次首次水合撤销/重载证据绑定 `6.0.2`，`6.0.5` 的限定实机接受另记。6.0.6 只接受上文 Rat NPC 的来源索引、10项水合、一次原生 Midi Use 消耗、Undo、重载和清理，不能推广为全库或完整 Cast 矩阵。\n- 固定 `6.0.6` 源码中 CastActivity、Cast数据、缓存与攻击路径未在版本差异文件内；聊天卡资源消耗在原生 Activity mixin 改为传入 `{ message }`。解析器没有自定义 `consume()` 或聊天卡资源消耗适配；本次仅接受真实 Misty Step 消耗对话与 Activity spent 0→1 的代表链，不宣称真实传送落点、纯 Core-only 矩阵或其他法术／活动的消耗行为。\n- 当前生成器的 Actor 法术清单仍以旧目标生成；Forge `0.4.0` 尚待原工作树整理。因此静态候选不能当作完整的 ServerNext 集成。\n- dnd5e `6.0.2` 的原生 Cast 缓存附魔把变更保存在 `effects[].system.changes`；解析器按原生缓存来源选择该字段，并在更新 Hook 到达后核对实际缓存。`onUpdateActivities` 源码仍以顶层 `changes` 调用 `ActiveEffect.update()`，而目标运行时的 `updateActiveEffect` 差量负载在本轮仅由上述代表链覆盖；其他 Hook、Keep/Overwrite、no-op、失败补偿、全法术库和全部活动仍需单独验收。\n- dnd5e `6.0.2` 为 Item compendium 默认索引 `system.source`；索引请求会省略其下的 `system.source.rules/book`，直接从完整的 `system.source` 读取规则世代和书籍。dnd5e `5.3.3` 没有该默认父字段，仍单独请求两个子字段。两版都须保留 2024/2014 区分，不能把缺失规则当成 2014。\n- View Report 的顶层 `status` 表示当前 Actor 状态，只有当前 manifest、目标运行时与严格管理文档仍匹配时才显示 `hydrated`。与当前 manifest 哈希及完整法术引用集合绑定的上次提交，另列为 `lastCommittedOutcome`（含 Keep/Overwrite）；无决策重新预检列为 `currentPreflightWithoutDecisions`。manifest 被替换或提交选择缺失、重复、指向错误引用时，不把旧记录当作当前提交结果。未提交 Actor 仍显示当前预检。\n- 本地安装和短时验证只针对配置后的 F 盘测试环境；完成 server-mirror 的 PID、端口、路径和运行者预检后可自主执行，被其他参与者占用时等待。\n- 唯一生产环境是远程服务器 8080 Foundry；只读 inventory/acquire 可在保留 CLI guard 和目标核对的前提下自主执行，生产安装或 Actor hydration 等写入必须再次取得明确授权。\n- 构建、单元测试和安装 hash 一致只能证明机械正确；目标世界中的实际解析行为仍需单独做运行时语义验收。\n","foundry-modules/open-session-deck/README.zh-CN.md":"# Open Session Deck / 开放式跑团副屏\n\nOpen Session Deck 是一个仅供 GM 使用的 Foundry VTT 队伍与遭遇操作台。它可以保留在 Foundry 主窗口内，也可以弹到第二块显示器。副屏由 GM 已登录的浏览器会话直接渲染，不加载第二个 Foundry 客户端、Canvas、登录页或模块 socket。\n\n## 精确支持范围\n\n- Foundry VTT `14.364` / dnd5e `5.3.3`（已完成运行时验收）\n- Foundry VTT `14.368` / dnd5e `5.3.3`（既有Mirror兼容候选，实际接受见专项记录）\n- Foundry VTT `14.368` / dnd5e `6.0.2`（历史静态迁移候选，尚待世界内验收）\n- Foundry VTT `14.368` / dnd5e `6.0.5`（原生力竭面板切片已验，其余命令和完整GM／玩家矩阵未验）\n- Foundry VTT `14.368` / dnd5e `6.0.6`（GM-only限定链已接受：TempHP自然busy/disabled、stale目标消失、玩家入口拒绝；其余GM命令、通用stale分支和完整矩阵仍未覆盖）\n\n其他版本、交叉组合和系统会 fail-closed。Daggerheart 计划在后续版本接入，本版不声明支持。\n\n6.0.5 与 6.0.6 的适配路径从 dnd5e 的 `dnd5eexhaustion0` Active Effect（由 `staticID` 补齐为 16 字符的 ID）读取力竭等级，并通过原生 `toggleStatusEffect` API 调整。2026-10-01 同一自有 Actor 的6.0.5面板与原生读回通过3→4→3、普通GM重载及精确清理；6.0.6进一步接受GM TempHP自然busy/disabled、stale目标消失，以及玩家入口和权限拒绝。状态编辑仅向GM开放，玩家入口拒绝已验；通用stale分支、其余GM命令和完整矩阵仍未覆盖。角色验收环境的额外消息已准确删除并确认原生缺席，作者和唯一whisper均为本轮TempPlayer，别名Dice So Nice!，Atlas归因假设已否证并符合已实装DSN6.3.1欢迎源；native terminal 的 Task 宏、原92宏行 hash、原7 User `_id` 读回、safeMLD/尺寸/viewport/UI、Core 与 Inspector 限定恢复均已闭合，但不等于旧A或完整User/所有Setting恢复。其余命令和完整GM／玩家矩阵未由本轮接受，见[限定恢复记录](../../docs/reviews/2026-10-01-next-605-custom-module-restoration.md)。\n\n## 功能\n\n- 主 Foundry 面板与同会话浏览器副屏共享状态\n- 由一个世界级 Actor 文件夹定义队伍，可选择包含子文件夹；临时同行 NPC 只需移入队伍文件夹\n- 直接查看和编辑当前/基础最大/最大修正/有效最大/临时 HP、AC 修正、激励、力竭、状态、专注与死亡豁免\n- 独立批量工作区只处理 HP 与状态，并明确选择目标、全部添加或全部移除\n- 队伍成员在遭遇区显示紧凑占位；NPC 使用完整操作卡\n- 编辑和交换小数先攻，单独或批量为缺少先攻的 NPC 私密投掷，并由 GM 控制玩家可见性\n- 玩家官方 Combat Tracker 在第一轮逐步揭示友方先攻；敌对单位默认隐藏\n- 显示当前遭遇、切换上一/下一回合，并在主画布定位 Token\n- 简体中文与英文界面\n\n玩家先攻隐藏属于普通界面呈现，不宣称能对检查客户端文档数据的对抗性玩家保密。模块不提供独立玩家面板、行动自动化、第二张地图、AI 功能或自定义网络协议。\n\n## 查阅帮助\n\nDeck面板或同会话副屏工具栏的“帮助”优先定位已启用统一手册中的Deck条目；合集未安装、停用或帮助接口不可用时，打开Deck自己的只读帮助窗口。Deck可独立使用，不需要启用合集。帮助只阅读说明，不保存偏好或执行游戏操作。\n\n本模块与统一手册都从`docs/manual.json`取得这一条说明；中央手册目录只保留来源指针。当前0.2.0增加可选`api.openHelp()`，仍逐次检查GM。H3帮助与状态的精确接受见[执行总账](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)，不扩大其他业务命令的旧接受范围。\n\n2026-10-12在14.368/6.0.5进一步限定接受面板/同会话副屏的实际版本配对，以及真实工具栏点击在受控设置拒绝后显示原生错误通知。通知可见性来自三个实时DOM/样式/位置样本，晚读失败及未拍到通知的截图保留原边界。此次没有禁用输入，原因提示的真实UI未执行；D3的新目标HP/力竭代表链及玩家面仍待验。\n\n## 开发验证\n\n```text\nbun run test:open-session-deck\nbun run build:open-session-deck\nbun run typecheck:foundry-modules\n```\n\n构建和安装 hash 只能证明机械结果；真实完成还需要在精确版本的 Foundry 中使用 GM 与玩家客户端验收。\n\n模块采用 MIT License，不再分发 dnd5e 或 Daggerheart 的图片、Logo 或规则文本。\n","foundry-modules/server-next-external-candidates/README.md":"# 历史测试输入复用\n\n新工作树可以通过显式绝对 `FVTT_LEGACY_NEXT_INPUT_ROOT` 只读复用已经核对的 ignored 输入，仍测试当前候选实现。适用于原始包、候选产物及历史证据；不会重定位当前源码或补丁，不操作运行世界。各包原有版本、来源 SHA 和语义断言保持。配置和接受边界见[历史输入复用说明](../../docs/runbooks/midi-qol-source-patch-build-install.md#在独立工作树复用历史测试输入)。\n\n## ServerNext external candidates\n\nThe original builds below retain the historical `NEXT-EXT-20260929-01` target,\nFoundry14.368 / dnd5e6.0.2. Current ServerNext follows the stable6.x policy and\nis now on6.0.5. Do not reuse old runtime contracts or the6.0.2-only launcher for\nthe current service. Already-accepted behavior is reused when still applicable.\nCurrent migration status remains only in `docs/plan/server-next-migration-handoff-20260927.md`.\n\nThe2026-10-02 [DAE phase-chain candidate](./dae/README.md) is a separate narrow\n14.0.14+servernext.1 correction on Core14.368/dnd5e6.0.5. It restores native\nconditions/suppression/applied-marker handling after DAE phase routing. Use\n`bun run --cwd foundry-modules/server-next-external-candidates test:dae` for the\n9 source-contract cases and `build:dae` only with the locked release input and\nauthor license prepared. Installed-file proof and actual startup/no-new-error\nacceptance are separate; paid package validation is excluded by the user.\n\n- Convenient Effects 9.2.7 uses unchanged official package files. Its archive in `dist` is a locally repacked transport; original release archive and digest are preserved in `upstream` and `upstream-lock.json`.\n- Droppables 6.2.1+servernext.1 builds fixed upstream commit with one functional patch: literal string namespace. Local source/package/manifest versions agree. Original source manifest was 1.2.5 because upstream release workflow substitutes the release tag after build.\n- Clocks 1.3.3+servernext.1 replaces its only GSAP call with native Element.animate, and removes the missing script declaration. Package allowlist follows the source release workflow's existing paths; the source has no `images` directory. MIT licenses are included in both local packages.\n- Local manifests retain author/source URLs, but remove official manifest/download update links and show a local title/version. They are not unmodified upstream releases.\n\n`acquire.py` records complete release bodies and verifies public asset SHA-256. Once `upstream-lock.json` exists it fetches those exact releases, never silently chooses a different candidate. `patch.py` requires exact source preimages and preserves functional unified diffs. In `sources/drop`, use `npm ci --ignore-scripts --no-audit --no-fund` then `npm run build` (upstream TypeScript + Vite production build). `assemble.py` packages into `dist`, verifies declared resources and records file hashes. It refuses arbitrary replacement; after a partial failure inspect its precise output before recovery.\n\n`npm test` runs package-owned Node tests against the actual built namespace/animation code and the persistent UI Macro's target, ownership, partial-write and reload behavior. These tests are not browser acceptance.\n\n`install-next.py` accepts only three absent allowlisted packages, checks exact target and offline process/listener state, checks world LOCK handles without writing database contents, verifies dependency hashes, then records every installed file. It never replaces an existing directory. A partial failure requires readback; do not blindly rerun. No Mirror or system files are changed.\n\n`acceptance-macro.js` is imported through normal Macro UI as a new, named batch tool. It stores its ledger on its own Macro document, creates only explicitly flagged fixtures, rejects collisions, resumes partial preparation without duplicate documents, and restores settings/cleans exact owned IDs once. User-visible actions remain real UI tests. It never calls module drag handlers to manufacture success. Delete the tool itself through UI only after saving cleanup evidence.\n\n`launch-next.ps1` is a prepared, bounded service operation for the executor, gated by its actual host Full Access receipt. It leaves the verified resident service running; existing lock directories are not cleared. On startup failure preserve the exact process/log state and send a blocker callback.\n\nThe [DND5E classpack candidate](./classpack/README.md) is a separate approved content adaptation for dnd5e6.0.5. It preserves the v4.3.4 pack/document identities, applies source-established link repairs, and uses explicit source-preserving native API migration with backend verification. Missing custom summons/helpers remain deferred. Use the classpack README and the unique migration ledger for current gates; code/file/source evidence and real UI/reload/cleanup acceptance remain distinct.\n","foundry-modules/server-next-external-candidates/classpack/README.md":"# DND5E不全包 ServerNext 6.0.5 候选\n\n2026-10-12新增6.0.6加载清单投影候选：`projectClasspack606LoadManifest()`只接受已核v4.3.4-next.1/Core14.368、21 packs、原upstream/迁移/来源投影身份的6.0.5 manifest，复制后仅提高系统maximum。实际准备还绑定Next原manifest/runtime/baseline SHA；不重建或覆盖已有packs、脚本，不修改迁移修订或verified。既有`preflight/migrate/confirmRecovery`仍在6.0.6数据访问前拒绝，readonly inventory保持原语义。这只准备普通加载前置，6.0.6实际加载/代表内容仍未接受，不能触发旧迁移来“修复兼容”。纯函数反证入口为包内`test:classpack-load-compatibility`；实际状态见[606预检](../../../docs/reviews/2026-10-12-next-606-preflight.md)。\n\n本候选使用官方v4.3.4固定输入，目标Core14.368、dnd5e6.0.5和当前Next的DAE14.0.14+servernext.1／Midi-QOL local.10。输入压缩包SHA-256为`8dceac980d5521c3119141ee166589a0f5ab78c13d9987f61c33f96c72fe22c1`，来源为[固定官方发布](https://api.github.com/repos/HJSmile/classpack/releases/tags/v4.3.4)。保留模块ID、21合集名（包括new-icon）、5655顶层文档和所有既有身份。upstream与dist被Git忽略。\n\n本轮按用户选择完成6.0.5兼容和来源明确的坏链修复。已有V14纯函数修12个独立Macro，按全文原SHA修13个Item的15个嵌入命令。确定内容修复包含传送头盔Cast活动指向现存Teleport，以及神莓、附盖提灯、灯油、工具锤、高档服装、祭袍六组原来源别名的17处引用；MPMM歌利亚的两处链接复用同规则的现存石之坚韧（d12+CON、熟练加值次数、长休恢复）。另将此MPMM特征与原文不符的固定1次上限修为@prof；除该明确次数修复外，其余数值、规则版本、ID和历史溯源保持。Dust Devil缺失召唤Actor、Open Hand／Sun Soul缺失辅助法术和不确定特殊物件单列后续，不创建替代内容。\n\n从仓库根使用`bun run --cwd foundry-modules/server-next-external-candidates build:classpack`，仅接受固定压缩包和不存在的候选目录及新报告，拒绝覆盖现有构建。新构建的报告写在忽略的`dist/candidate-report.json`，与`dist/dnd5e_classpack`同级；仓库内`candidate-report.json`是已接受候选的历史证据，构建不会改写。检查程序优先读取新报告，若新报告不存在则读取历史报告，并核对候选manifest、运行脚本和来源基线的SHA。原包逐行读取、变更读回、源正文／身份／引用与图片审计在相应报告及reference-source-index.json、reference-contexts.json。构建合成浏览器入口和来源保护辅助为一个完整SHA绑定的模块，不单独注入代码。\n\n运行入口在ready注册`game.modules.get('dnd5e_classpack').api`的inventory、preflight、migrate及限定confirmRecovery；不自动写合集。preflight对全部文档严格验证，逐条比较原名、正文、规则版本、进阶ID和有效授予／施法UUID，同时预投影所有16个Actor／Item合集的5530顶层文档。Core表结果字段迁移、HTML空元素序列化、模型新增空默认值和已记录18条孤立物理效果仅按精确原源及代码投影比较；原孤立效果继续不挂载。启用的Tasha初始化投影按精确版本、设置、vendor脚本SHA和每条原始记录比较，不泛放新ID。\n\nmigrate只在已授权的精确Next环境显式调用，使用dnd5e官方getMigrationData／migrateActorData／migrateItemData生成更新，写前保留每个明确原规则版本，正常完整文档API写入，逐文档强制后端回读进阶／效果身份、正文及授予／施法UUID，恢复合集锁。迁移前发现1987个旧stats的2024内嵌物品会被官方旧版本分支改成2014，因此该保护必需。重复效果只按精确核准ID正常deleteEmbeddedDocuments并回读。未审查新效果ID在任何包写入前拒绝。本包游侠在精确Tasha4.0.0条件下通过公开source hook，在其读取期间提供等价数组，之后恢复原生ID对象并核对39个进阶ID；不再依赖保存数组绕过Core清洗。Tasha代码和设置保持。DAE独立候选在调度及执行状态重整时跳过合集Actor，保护模板原效果，世界Actor的状态处理保持原行为。\n\n目标收据绑定Core／系统／依赖／源基线及运行代码SHA，按包保存完成进度；完成前再全量复核来源。任何FAILED或既有未匹配收据禁止重放。跨客户端依赖单执行器合同，不声称原子互斥。单次执行和正常客户端重载通过已有V1文件工具及正常Macro界面，实际运行、代表性车卡／活动／宏行为和批末精确清理分别接受。\n\n从仓库根使用聚焦验证入口`bun run test:classpack-next`；它委托同一包内`test:classpack`，不启动Foundry或浏览器。当前42项通过，另有4项DAE合集守卫检查；覆盖真实Core mergeObject与ForcedReplacement／ForcedDeletion、候选及后端丢进阶／效果拒绝、规则保护、源文／grant目标改变拒绝、公开source hook与独立恢复收据。这是文件及方法证据。实机已经完成单次迁移及随后唯一原效果恢复，全量来源、普通重载、公开hook平衡及95启用集合通过；原FAILED不改写，另有COMPLETE恢复收据。最新实际结果和未完成门只见[唯一迁移总表](../../../docs/plan/server-next-migration-handoff-20260927.md#515-原迁移收尾之后的新适配范围与执行顺序)，历史失败原件保留。歌利亚正常三特征授予、游侠一级PHB宿敌及自然探索者、头盔真实施法配置入口与取消均通过，正常客户端重载保持；本批角色、两条测试消息、临时Macro和owned页已精确清理，原世界与聊天ID保持；手册条目已人工核对并通过生成一致性检查。27个宏不因语法通过而全部算可用，完整Teleport和伤害反应链未执行。MPMM石之坚韧按原文将最大次数从固定1修为@prof，保留d12+CON、长休恢复、现有消耗和所有其他字段；原始与迁移后状态分别保护。离线精确单字段差异及负前像检查通过；实际正常API修复、长休回满2次、正常使用消耗1次及真实1d12+2骰子、客户端重载均通过。原partial检查把系统派生来源显示字段清洗误判为丢数据，已凭精确源码与全字段差异核清并保留原失败原件。源码在迁移分支保留本地提交，尚未合并／推送，Mirror、生产、其他服务和暂停／付费功能边界保持。\n\n文档边界：手册已生成且机械一致性检查通过，但正式Chrome拒绝本地file://协议，因此页面目视检查未执行。拒绝与空白页清理回执已保存；这不改变本包实际Foundry限定接受，也不把文件检查当视觉验收。\n","foundry-modules/session-monitor/README.zh-CN.md":"# FVTT 跑团会话监测器\n\n这是一个面向 Foundry VTT 14.364 / dnd5e 5.3.3 的轻量排障工具，manifest 也允许\nFoundry VTT 14.368 / dnd5e 6.0.2–6.0.6（manifest `verified` 为 6.0.2、`maximum` 为 6.0.6）作为 ServerNext 范围。2026-10-25 已在 14.368 / 6.0.6 完成一个真实 GM 短会话的开始、卡顿标记、普通重载、同会话恢复与停止，原有历史保持；Companion 与长时范围仍需单独接受。它把\n浏览器内的会话指标和浏览器外的 Chrome/Windows 进程指标分开记录，再在\n结束时合并成一条时间线。\n\n它只观察，不清缓存、不改设置、不删除文档，也不写 Foundry LevelDB。\nv1 只在 GM 客户端运行。\n\n本目录是一个完整 release unit，而不是只有 Foundry bundle：\n\n- `src/`：Foundry browser module、版本化 schema、IndexedDB 与 GM UI；\n- `companion/`：Chrome/CDP、Windows process、CLI、报告与端到端测试；\n- `build.ts`：确定性 module 构建及项目本地 mirror 安装保护；\n- `package.json`：产品版本、独立 typecheck/build/test/monitor 入口。\n\nmodule 与 companion 共同维护 schema v1 和产品版本 1.1.2。它们可以共享本产品的 schema，\n但不得分别成为两个漂移的发布物。上游运行时依赖为共享的只读手册正文渲染，以及\n`@fvtt-json-generator/contracts/hash` 提供的 browser-safe SHA-256；Foundry runtime 不导入\ncompanion，companion 也不导入 generator、workflow、Web 或运维实现。\n\n## 独立构建与测试\n\n在主 workspace 安装锁定依赖后，可直接从本目录运行：\n\n```powershell\nbun run typecheck\nbun test\nbun run build\n```\n\n构建产物位于：\n\n```text\nfoundry-modules/session-monitor/dist/module\nfoundry-modules/session-monitor/dist/fvtt-session-monitor.zip\n```\n\n## 安装\n\n```powershell\nbun run install:session-monitor\n```\n\n安装目标固定为：\n\n```text\n.local/foundry-v14/data/server-mirror/Data/modules/fvtt-session-monitor\n```\n\n随后在目标世界的“管理模组”中启用\n`FVTT Session Monitor / 跑团会话监测器`。MIDI-QOL 14.0.11 与\nSequencer 4.2.3 是可选的推荐依赖；未启用时只会留下对应\n`capability-gap`，不会让会话失败。\n\n## 权限与配置边界\n\n- 根命令只会把 module 安装到项目内的 `server-mirror`；生产部署仍需单独授权，\n  不会因运行 build、test 或 install 命令而发生。\n- companion 只启动并管理自己创建的专用 Chrome，不接管用户日常 Chrome；\n  它通过 CDP 和 Windows 进程接口读取性能信号，不读取 cookie、密码或浏览器凭据。\n- 专用 profile 与证据默认写入 workspace 的 `.local/`，不会写入 Foundry\n  LevelDB。可用 `--url`、`--chrome`、`--profile` 和 `--output-root` 显式覆盖。\n- 根 workspace wrapper 会传入内部的 `--workspace-root`，用于定位本地 mirror 和\n  默认 `.local/` 目录；从本 package 直接运行时也可显式传入该参数。\n- companion 必须在普通 GM 登录后才能开始握手。它不会猜测、提取或绕过 GM\n  密码；处于 join 页时只等待人工正常登录。\n\n## 模块面板与只读帮助\n\n只使用浏览器内的监测面板时，无需启动 Companion。GM 可以点击“使用帮助”：合集操作台可用时定位统一手册中的本模块条目，否则打开模块自带只读窗口。帮助正文由本模块的 `docs/manual.json` 维护，并进入完整离线手册；阅读不会开始记录或修改设置。\n\n## 一次真实记录\n\n先启动项目本地 Foundry，再运行：\n\n```powershell\nbun run monitor:session -- record\n```\n\n伴随程序会启动一个专用 Chrome profile，并等待已登录的 GM 世界。第一次\n使用该 profile 时，在新开的 Chrome 中选择 GM 并正常登录即可。登录后它会：\n\n- 调用模块 API 开始或续接一个会话；\n- 每 10 秒写一条 Chrome CDP/Windows 进程采样；\n- 每 60 秒扫描 renderer 的固定 WASM private committed allocation；\n- CDP 断开时留下 gap，并持续尝试重连；\n- 整个 Chrome 被关闭后，用同一 profile 自动启动下一代 Chrome；\n- 若 Foundry 要求重新登录，会停在登录页等待你正常登录，然后核对并续接\n  同一个 session ID；\n- 收到 `Ctrl+C` 后停止会话、生成报告并关闭自己启动的 Chrome。\n\n默认输出目录：\n\n```text\n.local/foundry-v14/evidence/cor-cotn-performance/live-sessions/\u003csession-id>/\n```\n\n主要文件：\n\n- `browser-session.json`：Foundry 模块导出；\n- `companion.jsonl`：伴随程序原始采样；\n- `companion-errors.jsonl`：隐私过滤后的 CDP 错误；\n- `companion-events.jsonl`：Chrome/renderer 代际与重启边界；\n- `session-combined.json`：合并后的完整证据；\n- `report.md`：人类可读摘要；\n- `heap-timeline.svg`：JS heap 时间线。\n\n若端口或 Chrome 路径不同：\n\n```powershell\nbun run monitor:session -- record `\n  --url http://127.0.0.1:30001/game `\n  --chrome \"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe\"\n```\n\n也可以从既有导出重新生成报告：\n\n```powershell\nbun run monitor:session -- report `\n  --browser \u003cbrowser-session.json> `\n  --companion \u003ccompanion.jsonl> `\n  --events \u003ccompanion-events.jsonl> `\n  --out \u003creport-directory>\n```\n\n## GM 面板\n\n- “开始”：建立 IndexedDB 会话并立即采样；\n- “刚才卡顿”：写入无自由文本的时间标记；\n- “停止并导出”：停止采样并下载 JSON；\n- 刷新页面：自动续接同一 world 中最后一个 active session。\n- 空闲时面板保持展开并显示“开始”；开始成功约 2 秒后自动收起为显示状态和 elapsed 的紧凑胶囊。\n- 点击胶囊或按 Enter/Space 可临时展开完整控制；拖动标题栏可移动，位置会夹紧到视口并避让可见的 Foundry 右侧 Sidebar/Combat Tracker。\n- 视口或 Sidebar 改变后会重新夹紧/避让；位置只保存到浏览器 localStorage，不调用 `game.settings`，也不写世界或 LevelDB。\n- `markJank` 注册为 Foundry 原生 GM-only 快捷键，默认没有绑定；只有活动 GM 会话接受该快捷键。\n\n单次会话最多 12 小时、4,320 个浏览器采样、10,000 个事件和 1,000 个\n错误。达到上限会标记 `truncated` 并安全停止。\n\n## 隐私与解释边界\n\n导出不包含聊天文本、骰值、Actor/Item 文本、玩家输入、cookie、密码、\n令牌、IP、原始 Scene/Combat ID 或任意对象 dump。错误消息默认写成\n`\u003cmessage-redacted>`，只保留错误类型、过滤后的栈位置、包 ID 和指纹。\n\nScene/Combat 使用单会话别名。活动模组清单只记录模组 ID 和版本，并保存\n配置哈希。\n\n报告中的 JS heap、renderer private bytes、working set、GPU/utility 进程、\ntexture 估值、DOM 数量和固定 Worker allocation 是不同信号。工具只负责\n相关性对齐，不把相关性写成因果结论。\n\n完整关闭专用 Chrome 不会结束模块中的 active session。伴随程序会自动\n重启 Chrome，并把新进程记为下一代 `browserGeneration`；renderer PID\n变化则只记为递增的 `rendererGeneration`，不会把原始系统 PID 写入报告。\nMarkdown 报告会列出每次冷重启前后的 page heap、renderer private bytes\n及差值，SVG 时间线会显示冷重启竖线。\n\n因此，遇到卡顿时可以直接关闭这个专用 Chrome 窗口；不要同时按\n`Ctrl+C`，也不要先点面板里的“停止并导出”，因为这两种操作代表你明确要\n结束本次记录。若自动重启后出现登录页，只需照常登录；伴随程序会继续等待，\n并且只有恢复到原来的 active session ID 后才会继续采样。\n\n## 验证\n\n```powershell\nbun run test:session-monitor\nbun run typecheck:production\nbun run typecheck:all\nbun run build:session-monitor\n```\n\n生产部署已于 2026-07-30 获得单独授权：部署时通过普通 Foundry 模组管理\n为线上 `cor-cotn` 启用了 `fvtt-session-monitor`。首次 1.1.0 线上点击\n“开始”暴露公网 HTTP 缺少 `crypto.subtle`；1.1.1 已改用项目既有的\n浏览器安全纯 JavaScript SHA-256，并通过 13/13 聚焦测试与远端制品校验。\n\n2026-07-31 的 8080 只读复核再次确认：当前监听进程仍使用\n`X:\\FoundryData`，该 DataPath 下存在完整 1.1.1 五文件制品，五个\n模块资源经 8080 回环均返回 HTTP 200，公网 8080 的 manifest 也返回\n`fvtt-session-monitor` 1.1.1。本次没有登录 GM 客户端或读取运行中的世界\nLevelDB，因此只重新证明“当前已部署并由 8080 提供”，没有把历史启用事件\n冒充为当前实时 `active` 证明。\n\n最终 1.1.1 的“开始 → 刚才卡顿 → 停止并导出”短烟雾测试仍需在服务器重启\n后由 GM 正常加入再完成；实际四小时跑团和非 GM 设备证据也仍未完成，不能\n由安装、HTTP 200 或短烟雾测试替代。\n\nFoundry／Chrome 工作不设固定总时长上限，单操作仍保留超时。运行前核对目标、\n服务 owner、存储与隐私边界，结束后核对导出证据及环境。四小时或其他长时测试\n仅在用户明确要求相应验收时运行；代理可负责已授权的监测与分析，真实玩家活动\n和非 GM 设备证据仍来自实际参与者及设备。模拟或多个短测试不能替代真实会话。\n\n## 会话保存与失败恢复（本地候选）\n\n并发点击“开始”只创建同一会话；“停止并导出”先停止接纳采集，再等待已经接纳的写入完成。每条采样、事件或错误与对应计数一次提交，保存失败时不会显示为已完成的导出。\n\n若面板提示操作未完成，采集会暂停。短暂存储故障解除后可点击“开始”续接同一会话；已在停止收尾阶段则重试“停止并导出”。重新载入会核对已保存记录的编号，不会补造遗漏样本；达到时长或采样上限的会话继续完成停止。GM失去权限后不再接纳新采集。\n\n单次最多12小时、4,320条采样；这两项上限会结束会话。事件10,000条、错误1,000条上限只停止追加对应类型并标记truncated，其他类型继续按各自上限工作。新保存/恢复与帮助路径已通过纯内存、模拟事务和DOM检查；6.0.6 的真实短会话另有6条采样/6条事件、一次重载恢复与一次停止的限定接受。测试归档清理后经公开list/export确认缺席，原两份历史完整hash保持。该短例不承诺长时性能或真实存储故障完全无损，精确构建与范围见[执行总账](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。\n","packages/assets-icons/AGENTS.md":"# Actor 图片、Token 和图标规则\n\n## 这个功能是做什么的\n\n本目录管理 Foundry v14 图标解析、Actor 图片、Token 图片、裁切候选、人工审阅 contact sheet，以及可选的远程图片上传适配器。\n\n## 不可违反的规则\n\n- `actor.img` 与 prototype token texture 是两个不同用途的资产，必须分别路由和验收。\n- safe icon mode 只能使用受支持目录、明确 override 或已验证 catalog；不得根据名称相似度静默替换成错误图标。\n- 自动裁切结果是候选，不是人工美术验收。共享图片、非方形主体、透明边框和图像所有权风险必须保留给审阅流程。\n- SSH/远程上传是外部写入；没有目标、凭据和明确授权时只允许 dry-run/本地计划。\n- 不得把服务器凭据放入浏览器、前端请求、仓库或生成 JSON；公开 URL、远程路径和本地文件都要经过路径/协议验证。\n\n## 修改入口\n\n- 公共出口：`packages/assets-icons/src/index.ts`。\n- `assets/` 管 Actor/Token 资产与审阅，`icons/` 管 catalog/override/报告。\n\n## 验证\n\n- `bun run typecheck:packages`\n- 运行受影响的 icon/image/CLI 测试；v14 catalog 变化时运行 `bun run build:icon-catalog:v14` 和对应 locked reference 检查。\n- 视觉结果必须查看最终 Actor 图、Token 图或 contact sheet；文件存在、尺寸正确和上传成功都不是视觉验收。\n- 影响 Actor JSON 时继续执行正式生成与 `verify:actor`。\n\n## 完成标准\n\n- 资产来源、用途和输出 URL 可追踪，Actor/Token 没有互换。\n- 自动检查通过且最终图片由人工查看，没有把候选误报为已接受。\n- 任何真实远端写入都在当前授权范围内并有读回或等价验证。\n","tools/crystalbleed-v12/README.zh-CN.md":"# 晶血龙兽 V12 重制版\n\n2026-10-02 整合说明：下面的实机结果与世界对象是 2026-09-09 的历史交付记录。本轮仅准备未发布的源代码候选，未重新安装或登录该世界；当前生成器采用 master 的独立状态 ID，旧接受 JSON 的哈希和旧 `dazed` 结果不改写为新版产物的运行时接受。正式 Actor 必须重新走 CLI 与来源验证，不能用旧 JSON 覆盖新输出。\n\n适用版本：Foundry **12.331**、dnd5e **4.3.9**。已在用户指定世界导入并完成下列战斗机制的实测。\n\n## 在当前世界使用\n\n1. 在角色目录打开 **晶血龙兽·重制验收 0909-1932** 文件夹，使用其中的 **晶血龙兽 (Crystalbleed Drakon)**。原地图上的旧龙兽保留原样，使用新版时请从这个文件夹拖入新指示物。\n2. 同目录的 **月石晶体 (Moonstone Crystal)** 是召唤模板。保留唯一一份同名模板；齐射会自动从它生成晶体。\n3. 每次进入或刷新游戏后，由 **一个 GM 客户端**运行宏目录里的 **晶血龙兽·战斗控制**。本次交付结束时它已启用。保持该 GM 客户端查看战斗所在场景。\n4. 选中新版龙兽、标选目标后，可以点击面板上的晶片齐射，也可以用控制宏的同名按钮。宏会结算豁免、扣血、恍惚、半血腐化、相邻召唤和先攻。\n5. 晶体的回合开始时自动戳刺；不要额外重复点击。重复点击会被同回合保护阻止。关闭控制窗口不停止自动处理；刷新页面会停止，需重新运行宏。\n\n“验收靶（测试专用）”子目录和“晶血龙兽·验证场 0909-1932”场景用于保留测试证据，不是参战所需内容。该测试战斗已回到未开始状态。\n\n## 本版规则\n\n| 能力 | 最终行为 |\n|---|---|\n| 原有攻击 | 保留面板实际数值：全部命中 +11；啃咬 3d10+6 穿刺＋2d8 心灵，爪击 3d8+6 挥砍＋1d8 心灵，尾击 4d6+6 钝击＋1d6 心灵 |\n| 月蚀守护 | 一次伤害结算合计超过 20 才减半，向下取整；20 及以下不减免。不同伤害类型在同次结算中合计判断。正常“应用伤害”按钮和宏伤害结算都会经过该计算；直接手改 HP 不触发 |\n| 绯晶拒绝 | 每日两次，将豁免失败改为成功；守护碎裂至龙兽下一回合开始。碎裂时无减伤，AC 不变；次数耗尽后恢复为超过 20 点只减少熟练加值（5） |\n| 腐化 | DC 18 魅力，首次失败只添加腐化标记；已腐化者再次失败才增加一级力竭。“绯晶腐化”和“月石腐化”为同一状态 |\n| 噩梦吐息 | 60 尺锥形，DC 18 感知，6d10 力场；失败恐慌 1 分钟，成功半伤且无恐慌；回合结束重复豁免，成功解除。充能 5–6 |\n| 晶片齐射 | 消耗 2 传奇动作，30 尺内可见单体，DC 18 体质；失败 2d8 心灵＋恍惚，成功半伤且无恍惚。恍惚持续至目标下一个回合结束。龙兽半血及以下时，失败目标追加腐化豁免；无论初始豁免成功或失败都召唤晶体 |\n| 月石晶体 | 中型构装体，AC 17，HP 15，所有速度 0，不能移动；生成在齐射目标旁边空位，立即投掷先攻并加入战斗，生成瞬间不戳刺 |\n| 月石戳刺 | 到晶体自己的回合，对十尺内所有其他生物（不分敌友）进行 DC 18 敏捷豁免；失败受到 2d6 穿刺，再进行独立 DC 18 魅力腐化豁免；成功则不受伤害，也不触发腐化。每回合一次，HP 0 不行动 |\n\n腐化和吐息的 DC 18 参照锁定 dnd5e 4.3.9 官方成年绿龙的毒素吐息，只借用 DC，不改变本生物的豁免属性或伤害类型。恍惚使用当前世界已有的 `dazed` 状态，并尊重目标状态免疫；不会替换为震慑或麻痹。\n\n## 仍由 GM 操作的部分\n\n- 吐息锥形朝向和目标选择：先标选合法六十尺锥形内目标，再使用吐息。宏不会替你判断朝向。\n- 普通攻击仍用原生面板掷骰，并照这个世界现有流程应用伤害。多重攻击为一次啃咬和两次爪击；传奇尾击调用普通尾击。必要时由 GM 选择不同目标。\n- 尾击推退/扫倒的二选一、具体推离路径、血液支配的反应攻击及目标选择、掠流滑翔的移动由 GM 操作。缺失的尾击扫倒条目已根据原尾击描述补齐，DC 与推退同为 19。\n- 盟友拔刺救援保留原规则：五尺内盟友使用一个动作，DC 15 运动或医药成功后，停用目标的噩梦吐息恐慌效果。\n- 对宏内部的豁免，目标若是新版龙兽且能用绯晶拒绝，宏会在后果发生前询问 GM。对普通法术/其他原生掷骰，请在应用失败后果前使用绯晶拒绝；它不会倒推撤回已经手工应用的伤害。\n- 腐化的长期移除仍按战役规则由 GM 决定。没有修改整个世界的 Midi 自动豁免、自动扣血或 OnUse 宏设置。\n- 专用宏由 GM 代目标进行暗骰豁免并应用伤害；玩家临时反应、临时加值与复杂反应链仍须 GM 裁定，这些跨玩家交互未纳入本次验收。\n\n## 文件与来源\n\n- `dragon.json`、`crystal.json` 均由项目正式 CLI 从包内 Markdown 生成，未手工修补 Actor JSON。\n- `battle-control.macro.json` 为配套宏；`battle-control.js` 是其可审阅脚本。\n- JSON 中的 `gm-assisted` / `external-rule` 表示单独 JSON 的支持边界。本文所述自动处理需要配套宏在 GM 客户端运行，不能把单独 JSON 当成完整自动化。\n- 原面板记载原始数据板作者为 **RAINING_DAYS**，来源标题为 *Made some homebrew Ruidium-corrupted enemies*。本次以用户实际面板与后续裁定为准，已保留 GM 自定义数值，而非还原上游原始数据板。\n\n机械修复与测试详情见随包的验收报告；本次没有提交、合并或推送仓库代码，也没有重启或升级 Foundry。\n","tools/forge-encounter/README.md":"# 人类 Markdown、固定自动化与战斗包\n\n输入是一份普通 Markdown：写清主生物和召唤物的完整数据、触发时机、目标、豁免、伤害以及来源没有规定的事项。不要求作者写 YAML、JSON、UUID 或 JavaScript。\n\n- 完整来源：[晶血龙兽与月石晶体](../../docs/examples/晶血龙兽与月石晶体-人类写法.md)\n- 空白写法：[召唤生物模板](../../docs/examples/召唤生物-人类写法模板.md)\n\n## 处理分工\n\n1. AI Intake 提取每个生物的证据 IR，渲染规范 Markdown；正式 workflow 生成 Actor 并对照来源审核。\n2. AI 从固定能力清单选择规则和参数，输出版本 2 的数据配置。AI 不编写宏代码，不提供任意路径、UUID 或脚本。\n3. 工具校验来源引文、能力身份、参数及引用，生成固定控制入口。DC、伤害、使用次数和 HP 继续读取正式 Actor 的原生数据。\n4. 独立审核配置与来源的对应关系；整包达到 `ready_for_gm_review` 后才输出可导入文件。\n5. GM 预览、确认并一起导入 Actor 与控制入口，再明确启用自动化。\n\n当前执行器只支持 Foundry 14.364 / dnd5e 5.3.3 / core。V12 需要独立实现和验证，不共用当前执行脚本。\n\n## 已实现的固定能力\n\n| 能力 | 范围 |\n| --- | --- |\n| 豁免能力结算后召唤 | 成功失败均召唤 1 个已绑定生物，GM 选择目标旁合法空位，独立 Token/HP 并加入先攻；可有失败恍惚及半血后续腐化 |\n| 自身回合开始范围能力 | 按原生 save/damage 执行；每回合一次，来源 HP 为零停止，生成瞬间不执行，不按敌友筛选 |\n| 腐化分支 | 首次失败加来源定义的共同腐化标记；已有标记再次失败加 1 级力竭，两者互斥 |\n| 阈值守护 | 同次伤害类型合计，严格超过阈值才减半取整；碎裂不减，削弱时减熟练加值 |\n| 守护碎裂 | 原生能力消耗后碎裂，下一次自身回合开始恢复；次数耗尽后恢复为削弱形态 |\n| 自身回合传奇资源恢复 | 只在来源明确规定的自身回合开始恢复已配置资源池 |\n\n这是有界能力清单，不承诺任意召唤、任意状态分支都能自动实现。不支持的请求须明确保留为待实现/GM处理，不能靠 AI 现场编程补齐。写法示例也不等于所有示例已通过自动化验收。\n\n## Foundry 操作\n\n在模块设置的“Forge · AI 连接”中配置并测试连接，再从角色目录“Forge 生物”工作台打开战斗包，读取原始 MD。普通“生物一：名称”“生物二：名称”标题可直接分段；其他布局由 AI 识别。支持 2 至 6 种生物、最多 24000 字符。\n\nFVTT 页面使用当前 Forge 连接设置中的 Provider 和模型，不因本地地址强制替换。API Key 默认只在当前页面内存中共享，关闭设置窗口仍可使用；刷新后需重输，持久化需明确勾选。不会把其他 Provider 的 Key 转送给 DS，也不再提供本机 Luna OAuth 桥接快捷入口。浏览器验收执行角色遵当前项目配置，与 Intake 所调用的模型分开。\n\n生成后核对生物数据、固定能力、参数、绑定与 GM 裁决项，再确认导入。生成的薄宏只调用模块的固定执行器。初次明确启用后，配置保存在模块自有 flags 中；刷新世界时重新校验身份与配置后恢复，不执行 flags 中的任意代码。\n\n关闭控制面板不会停用自动化；使用“停用自动化”按钮可持久停用。旧式专用宏属于另一条显式审核路径，仍需手动重新启动，不具有固定配置恢复语义。\n\n## 本地命令行\n\n默认使用 DS Flash。凭据由父进程的 `DEEPSEEK_API_KEY` 或本机已配置的 `FVTT_LOCAL_DS_KEY_FILE` 提供；后者只指向外部已有秘密文件，程序在内存读取，不复制到仓库、报告或世界。\n\n```powershell\nbun run tools/forge-encounter/run-human-intake.ts docs/examples/晶血龙兽与月石晶体-人类写法.md ./crystalbleed-ds-run\n```\n\n输出目录必须是新的目录。只有整包达到 `ready_for_gm_review` 才写入各 Actor 的 MD/JSON 和 `encounter.forge-encounter.zip`；未通过只保留审核诊断，退出码为 1。每个 DS 阶段最多 5 分钟，不使用持续等待策略或自动退回 Luna。\n\n可用 `--resume-draft \u003creview.json>` 读取同一来源的 IR 提案，重新验证和审阅；不会继承历史通过状态。`--review-feedback \u003cfeedback.json>` 只传递绑定来源与父报告 hash 的具体修正意见，由 AI 修正 IR，不手工编辑最终 JSON。`--configured-provider` 仅用于明确选择其他已配置 HTTPS 服务的场景。\n\n已有 `build-example.ts` 只打包预先整理的来源与专用脚本，不能替代本页的人类 MD → 真实 DS → 固定能力配置验收。\n\n预先整理的晶血样本采用受审核的专用宏路径，导入后仍需 GM 单独启动，刷新后重新启动。样本运行时 2.1.2 读取正式 Actor 中的恍惚效果和自定义条件标记；启用 Custom Conditions 时应用该模块的独立恍惚状态，遵守恍惚免疫并在目标下一个回合结束时到期。未启用时保留来源命名与期限，行动限制由 GM 裁定。样本宏与固定能力配置分别验收；候选修复和静态回归不能代替真实导入与状态结算证据。\n\n## 验收边界\n\n静态测试、来源审核、整包导入与真实回合行为分别记录。运行 server-mirror 前核对实例身份；本项目要求由受委派的 Luna Max 在外部 Chrome 进行有界操作，完成后返回报告，不持续监听或轮询。\n\n来源未指定的召唤持续时间、数量上限、召唤者死亡处理等保持 GM 裁决。原生攻击目标、战术选择、未选中的其他能力仍由 GM 正常操作。\n\n\n## 人类 MD 模板与当前能力范围\n\n可从[人类填写模板](../../docs/examples/召唤生物-人类写法模板.md)开始，按普通 Markdown 写明每种生物的完整数据、能力触发条件、结果和召唤关系。晶血龙兽是验收样例，不是名称匹配的专用分支；AI 根据本次来源提取 Actor 和能力绑定。填写模板不代表任意机制都能自动执行。\n\n当前固定能力支持：豁免结算后无论结果在目标相邻空位召唤一只；自身回合开始对范围内其他生物结算；首次腐化标记/重复失败加力竭；超过阈值减半、碎裂后恢复与耗尽后减熟练加值；来源明确的自身回合传奇资源恢复。数量、结果、放置或触发方式超出这些形态时，需要扩展能力库或明确保留 GM 操作，不能由 AI 改写为近似规则。AI 不生成执行代码。\n\n使用顺序：在 FVTT 启用本模块，在模块设置配置 Provider/API Key，再从角色目录的 Forge 生物工作台打开战斗包读取 MD，生成并审核，再导入；导入之后单独启用固定控制器。已有包的预览和导入无需再次请求 AI。Actor 蓝图保留来源 HP，未链接 Token 的随机 HP 遵从世界设置。\n\n截至 2026-09-15，本地 14.364/5.3.3 已验证包导入、齐射两分支召唤、晶体回合效果、守护阈值实际伤害与次数耗尽后的削弱。重复腐化只有部分运行证据；用户决定待独立状态设计后再明确，不视为严格单次增量验收通过。原生 Dazed 修复通过离线回归，尚无专门 Chrome 复验；FVTT 页面从 API Key 到完整 AI 生成的全链也未重新实测。CLI 真实 DS 审核与浏览器已生成包验收分开记录。此合并不等于生产部署或所有 MD/能力组合通过验收。\n","tools/foundry-mcp/README.md":"# 本地 Foundry MCP 准备与检查\n\n这个入口只处理本地 Mirror 和 ServerNext。它分别核对 Foundry 进程、MCP 后台身份与一次真实世界读取，避免把进程在线或工具列表可见误报成连接就绪。使用与项目 CI 一致的 Bun 1.3.14。\n\n## 检查连接\n\n在当前 worktree 中执行，`--config` 使用该 worktree 的绝对配置路径：\n\n```powershell\nbun run foundry:mcp check --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config I:\\OpenCode\\fvttV12JsonGenerator\\.codex\\config.toml\n```\n\n默认只读。增加 `--apply` 才把本次观察写入该实例的 `readiness.jsonl` 和 `current-readiness.json`。这会记录观察时间、状态、最后一次真实读取成功时间，以及最少的世界身份；不会保存角色资料、凭据或完整错误正文。\n\n输出状态：\n\n| 状态 | 含义 |\n| --- | --- |\n| `ready` | 已通过配置指纹检查，并实际读到预期实例、世界、Core 和系统版本 |\n| `foundry_stopped` | 该套 Foundry 没有运行 |\n| `backend_unavailable` | Foundry 已运行，但该套 MCP 后台不能响应 |\n| `gm_bridge_missing` | Foundry 已运行，但在线 GM 页面的 Bridge 未连上 |\n| `identity_mismatch` | 后台配置或读取目标与所选实例不符 |\n| `service_conflict` | 端口或数据目录被身份不明、非回环或不完整启动的进程占用 |\n| `startup_failed` | 本次启动没有通过进程归属与 HTTP 检查，进程和诊断日志保留 |\n| `read_failed` | 后台没有完成有效世界读取 |\n\n退出码 `0` 表示真实读取成功，`2` 表示尚未就绪或需要操作，`1` 表示参数、文件配置或工具执行错误。MCP 返回 `isError: true` 时绝不判为就绪。\n\n启动最多等待90秒。窗口内未确认成功时会保留进程和日志；进程可能仍在初始化，应先核对同一PID和日志，不重复启动或把超时当成进程已经退出。\n\n## 准备所选环境\n\n```powershell\nbun run foundry:mcp prepare --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config I:\\OpenCode\\fvttV12JsonGenerator\\.codex\\config.toml --apply\n```\n\n移除 `--apply` 可只查看当前状态；它不会启动服务或写日志。有 `--apply` 时，只在端口空闲、没有对应 Foundry 进程且本地文件身份符合时启动现有实例。已正确运行的服务直接复用，未知占用会拒绝；入口不停止、重启或替换已有服务，不修改 Foundry Config 或世界数据库。启动使用隐藏后台进程、仅回环监听和 `--nobackups`。\n\n`gm_bridge_missing` 的输出会给出 `browserAction`。执行代理应按项目 Chrome 规范准备**本任务拥有的 GM 页面**：Mirror 使用 `http://127.0.0.1:30001/game`，Next 使用 `http://localhost:30002/game`，按现有登录规则进入世界并保持页面在线，然后重新执行检查。保留其他任务的页面与占用；这个 CLI 自身不会创建浏览器、代替 GM 登录或声称页面已经准备。\n\n检查走已安装 MCP 后端的控制协议，属于独立 CLI 读取。需要证明当前聊天原生 MCP 可用时，仍应由当前聊天调用对应服务的 `get_world_info`；CLI 结果不能替代那一层证据。\n\n## 日志与恢复\n\n自然检查的连接成功、断开与恢复保存在 `\u003clab-root>/tools/foundry-mcp/instances/\u003cmirror|next>/readiness.jsonl`；当前观察和最后一次成功时间保存在相邻 `current-readiness.json`。失败观察保留上一次成功时间。时间是**检查发现状态的时间**，不代表准确的物理断线时刻；本入口没有定时监控或开机任务。\n\n观察时间在本次检查完成时记录。并行检查乱序写入时，较早的观察会以 `older_observation` 留在日志中，当前状态保留较新的观察，最后一次成功时间取已知成功时间的最大值。\n\n若写入锁或启动锁已存在，工具会拒绝争用，不按文件年龄抢占。先核对精确实例的进程、日志和锁归属，再按项目规则处理。\n\n聚焦安全测试：\n\n```powershell\nbun run test:foundry-mcp-readiness\n```\n","tools/foundry-ops/README.zh-CN.md":"# Foundry Ops（Foundry 运维工具）\n\n这个目录是项目内所有 Foundry 本地测试、离线世界检查和生产只读盘点的统一边界。它不是生成角色 JSON 的功能，也不是 Foundry 浏览器模块。\n\n## 这个目录现在包含什么\n\n以前，相关工具散落在 `scripts/foundry-lab` 和 `src/tools`，仅看命令名很难判断它会不会写文件、会不会连接生产服务器。现在它们已经收进一个产品目录，并共用一个入口：\n\n```powershell\nbun run foundry:ops --help\nbun run foundry:ops catalog\n```\n\n`catalog` 会用中文列出每条命令的目标和最大权限：\n\n- `read-only`：只读取目标；生产读取无需逐次对话授权，但仍须通过目标核对、外部配置、`--apply` 和 `--allow-production-read`；\n- `local-mutation`：会在本机生成报告、缓存、快照，或修改明确的本地测试镜像；\n- `production-mutation`：会安装、重启、hydrate、迁移或以其他方式写入生产环境。统一 CLI 故意不提供这种入口，只能走另行批准的操作手册，并在写入前再次取得明确授权。\n\n“生产迁移”相关的两个现有脚本只处理离线世界副本，因此被正确归类为“修改本地”；它们不会直接修改线上服务器。\n\n目录中的模块可以这样理解：\n\n| 模块 | 用途 |\n|---|---|\n| `src/cli.ts`、`src/routing.ts`、`src/commandCatalog.ts` | 统一命令入口、命令分类和权限检查 |\n| `src/config.ts` | 本地路径、生产连接配置和防止路径逃逸的安全检查 |\n| `src/process.ts` | 启动外部程序，并从命令、输出和错误中隐藏敏感值 |\n| `src/acceptance/` | 文件侧验收合同、预检、一次执行、收据读回和恢复提示；模块玩法由各消费者另行判断 |\n| `src/asset-inventory/`、`src/assetInventory.ts`、`src/localScope.ts` | 只读扫描本地 Foundry 资产，并登记整个 `.local` 顶层的所有权、隐私排除和待判断项 |\n| `src/lab/` | 本地 Foundry 实验环境、模组获取、诊断、补丁、启动和停止工具 |\n| `src/world-audit/`、`src/worldFootprintAudit.ts` | 对停止状态的本地世界建立只读快照并生成隐私安全的审计报告 |\n| `src/production-migration/`、两个 `productionMigration*.ts` | 比较三个本地世界副本并构建离线迁移候选；不会连接或修改生产服务器 |\n\n`spell-resolver` 命令仍经过 Foundry Ops 的统一权限入口，但浏览器源码、构建、本地安装生命周期和测试均由 `foundry-modules/monster-spell-resolver/` 自己维护；Foundry Ops 只负责把命令路由给该模块，不拥有解析器实现。\n\n## ServerNext 自有模块首次安装\n\n`lab install-server-next-owned-module` 复用已接受的首次安装保护，只允许代码白名单内的自有模块。包含 Trigger Engine、Custom Conditions、Weapon Mastery & Properties 和 Selected Token Sync；仅首次安装、目标存在即拒绝替换。入口不赋予其他模块的迁移授权，也不证明6.x运行兼容。\n\n先在实际候选工作树完成构建和字节核对，确认 Next 归属、世界状态和本次安装范围。显式设置本进程的 `FVTT_OPS_LAB_ROOT` 为 `F:/FoundryLab/foundry-v14` 后预览，例如：\n\n```powershell\n$env:FVTT_OPS_LAB_ROOT = 'F:/FoundryLab/foundry-v14'\nbun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-trigger-engine --version=0.2.0\n```\n\n本条命令只有显式加入 `--apply` 才写入；缺少它时只核对并返回清单。它只导向该 Lab 的 `data/server-next/Data/modules/\u003cid>`，检查源码／构建完整 manifest 一致、声明资源和逐文件 SHA，拒绝链接、路径逃逸及已有目标（包括空目录）。新构建字节先放到扫描目录外的本批 staging，再一次移入此前不存在的目标；失败保留现场供核对，不覆盖原包或创建备份。\n\n已经安装的包不能使用这个入口升级。已有包升级须另按完整旧文件集合／SHA、候选集合、明确版本和停止状态的受控流程处理。本命令不启停服务、不改世界开关、不读写 LevelDB；安装字节通过后，仍需正常客户端登记、启用和对应玩法验收。\n\nSpell Resolver 的实际模块 ID 为 `fvtt-json-generator-spell-resolver`，源码 owner 为 `foundry-modules/monster-spell-resolver`；安装参数版本必须等于本次已审查的源码及构建 manifest。Selected Token Sync 0.2.0 的本次目标为精确 Core14.368／dnd5e6.0.5，不把旧 Mirror 0.1.0 的安装入口或接受记录扩大到 Next。\n\n## 共用验收工具：文件侧第一版\n\n本版用于已审核、已授权的本地文件检查，复用上述命令分类、路径保护和子进程入口。请求中声明 `local-file-checks` 不会授予新权限，也不会把被执行命令变成沙箱；命令不得启动服务、操作浏览器或读写 Foundry 世界。生产连接环境变量不会传给这些检查。\n\n准备一个请求 JSON，字段见 [请求示例](../../docs/templates/development-feedback-request.example.json)。`workspaceRoot` 必须是实际 Git worktree 根，`candidatePaths` 和 `argv[0]` 必须是存在的绝对文件路径；`argv` 是参数数组，不经过 shell 拼接。填写目标、验收含义、case 名称、授权来源、预检和一次正式检查。工具自动生成 run／dispatch／receipt ID，读取分支、HEAD、指令基线提交、适用 AGENTS 和候选／执行程序的 SHA-256。\n\n普通本地文件检查可用一次入口；新请求表示明确执行一次，同一请求再次以 `--input` 调用会创建新合同。接续已有合同须传其绝对路径；已有收据仅核验并返回，不重新运行预检或检查；已经领取但没有收据会返回 `INSPECT`／`INCOMPLETE`，需先调查现场，不能用新 `--input` 猜测性重试。此入口拒绝 externalBatch 和 runtime 请求，不负责 Foundry／Chrome 运行验收。模块没有通用 adapter 时仍可调用既有模块脚本，选择 `json-ok` 或 `manual`；`manual` 永远保留待审，成功退出码本身不代表玩法 PASS。\n\n```powershell\nbun run foundry:ops acceptance run --input=\"I:\\实际工作树\\.local\\request.json\"\nbun run foundry:ops acceptance run --contract=\"\u003c返回的 contractAbsolutePath>\"\n```\n\n结果包含 `contractAbsolutePath`、`executionStatus`（`EXECUTED`／`REUSED_RECEIPT`／`NOT_EXECUTED`／`CLAIMED_NO_RECEIPT`／`RECEIPT_INVALID`／`UNKNOWN`）、阶段及原分层 `summary`（若有）。`UNKNOWN` 表示合同身份未能核实，历史执行状态不可推断；`RECEIPT_INVALID` 表示收据存在但读回失败。两者都返回 `INSPECT`／`INCOMPLETE`，禁止盲目重放。出错后用合同路径检查原件。下面的分步入口继续可用。\n\n```powershell\nbun run foundry:ops acceptance prepare --input=\"I:\\实际工作树\\.local\\request.json\"\nbun run foundry:ops acceptance ready --contract=\"\u003cprepare 返回的 contractAbsolutePath>\"\nbun run foundry:ops acceptance execute --contract=\"\u003c同一合同绝对路径>\"\nbun run foundry:ops acceptance collect --contract=\"\u003c同一合同绝对路径>\" --receipt=\"\u003c合同同目录的 receipt.json>\"\nbun run foundry:ops acceptance resume --contract=\"\u003c同一合同绝对路径>\"\n```\n\n每一步必须检查退出码和 JSON，成功后才继续。`prepare` 保存合同并做文件序列化读回；首个预检失败后停止余下检查并退出 1。`expectJsonOk:true` 的预检还要求一个 `ok:true` JSON。`ready` 再核对实际路径、分支、HEAD、候选、指令与执行程序；失败退出 2，不能派发。主宿主接入时应使用 `dispatchPrepared()`，它把检查和领取放在调用派发回调之前；本版没有自动发送聊天消息的命令。\n\n`execute` 原子领取一次 dispatch，运行合同中的检查并保存原始 stdout／stderr／退出码与 `receipt.json`。退出 0 只说明保存成功；行为结论由 `collect` 给出。超时或调用失败也保存收据；已领取的操作不能直接再执行。`resume` 提示检查现存状态，或读回已有收据，不自动重放、不重建 fixture。单个检查必须显式设置 1–120000 毫秒的超时；当前进程入口管理直接子进程，检查命令不得留下后台子进程或服务。\n\n`collect` 验证同一 worktree／run／dispatch／revision／case、合同指纹及原始文件指纹，拒绝旧收据、错路径和被改写的原件。摘要写入 `summary.\u003creceiptId>.json`，重复收集读回同一结果，不覆盖不同摘要。`json-ok` adapter 只判断合同明确要求的本地 JSON 检查：`ok:true` 且退出 0 为 PASS，`ok:false` 为 FAIL，空输出、只有 PASS 标签或不支持的输出为 INCOMPLETE。`manual` 保留原件并返回 INCOMPLETE，交给独立审查。\n\n摘要把 `behavior`、`evidence`、`cleanup` 和 `parentReview` 分开。本版不创建 Foundry 对象，因此 cleanup 是 `NOT_REQUIRED`；parentReview 一直是 `PENDING`，自动分类不能代替父审。收集退出码为 PASS=0、FAIL=1、INCOMPLETE／身份拒绝=2。`resume` 的退出码只表示状态读取结果，不是新的语义验收。\n\n所有产物只新建在目标 worktree 的 `.local/development-feedback/\u003crunId>/`，不修改既有证据。候选、HEAD 或指令发生变化后准备新合同。下述第二消费者已提供离线来源与参考数据 adapter，以及明确恢复后的专属运行合同／服务核对；自动推断影响范围、通用回调调度和对象清理自动化仍属后续。完整任务合同模板用于计划这些边界，不能把文件检查 PASS 升级为玩法通过。\n\n安全回归入口：`bun run test:acceptance-tools`。流程依据：[开发反馈闭环](../../docs/runbooks/development-feedback-loop.md)；进度：[试点计划](../../docs/plans/2026-09-29-development-feedback-pilot.md)。\n\n### 本批验证选择\n\n复杂批次可在 `prepare` 请求中加入可选 `validationSelection`，见[带选择约束的请求](../../docs/templates/development-feedback-selected-request.example.json)。每行只填 `id`、`layer`（`behavior`／`evidence`／`restoration`）、`decision`（`reuse`／`check`／`defer`）、理由和相关 `context`。同一行为的导出、恢复可分行；不将整体收据失败翻译成全部业务失败。旧请求不带新字段时仍兼容，原身份、预检和一次领取保护继续有效。\n\n- `reuse`：`previous` 指向[分项证据绑定记录](../../docs/templates/development-validation-evidence.example.json)的绝对路径与 SHA-256。记录含同一 case／层级、独立审查的 outcome、旧 context 和原件引用。工具读回记录及原件，要求 PASS 和上下文逐键一致，拒绝缺件、字节变化、错 case／层级、失败分项或未知适用性。旧原件格式不统一时新增小型绑定记录引用它们，保留原始 FAIL／PENDING；不能伪写原件为 PASS。\n- `check`：新场景写具体理由；引用旧场景时还须 `invalidation`，含 kind、理由和可读的差异／故障／要求记录。kind 为 `behavior-change`、`interface-change`、`new-failure`、`insufficient-evidence`、`required-integration`、`unknown-impact`、`tool-repair` 或 `restoration-gap`。旧证明不可读时只能用明确的 `insufficient-evidence` 选择窄补测；不能复用为 PASS。单纯工具／恢复缺口不能作为已过业务层的失效理由。\n- `defer`：列明本轮不做的原因；不执行，也不升级为已接受。若全批只有复用／不做项，准备和派发会拒绝新增执行，不运行前置命令。\n\n**执行范围必须对应。** 启用后，每条 `preflight` 与 `operation` 必须填写 `validationCases:[{id,layer}]`；纯语法／身份准备显式填 `[]`。前置命令只能涉及选中的 check 项；正式命令覆盖集合必须恰好等于 check 集合。包含 reuse／defer、遗漏 check、重复或未知项均拒绝。已有命令若实际运行整套而无法分离，就必须换窄入口或依据具体失效理由扩大本批，不能只改声明掩盖实际全套调用。工具能比对现有入口声明的执行项，不能自动理解任意脚本内部语义、发现隐含依赖或替 host 约束回调内部代码。\n\n`prepare` 在执行任何前置命令前检查选择及覆盖；`ready` 和 `dispatchPrepared()` 在领取前重读复用／失效证据，拒绝路径不会调用执行回调或创建领取记录。`ready` 的 `validation.check/reuse/defer` 返回实际冻结的名单。`collect`／`resume` 保持业务结果、证据完整性和恢复状态分离，不因本轮工具故障清空旧分项结论。\n\n`prepare-batch` 可传同一字段，但该 adapter 的实际正式执行项固定为 `offline-source-readback/evidence`，不会将任意业务 check 偷换成只读来源扫描。`prepare-runtime` 可传同一字段及 `executionCases:[{id,layer}]`，后者必须等于 check 集合；`ready-runtime`／`dispatchRuntimeBatch()` 在服务探针及宿主回调之前复核。宿主按返回的 executionCases 选择实际动作；本增量不新增 runtime adapter，不恢复任何暂停业务，也不绕过已有运行权限／服务检查。\n\n`context`、分项 outcome 和影响分析仍由 owner 对照相关代码、版本、目标和原证据建立；工具只证明声明及文件绑定一致，不能认证人工结论的语义真实性。只列相关事实，整包哈希或无关源码变化不能自动让所有旧结果失效；真实版本接口改变也不能被旧 PASS 免测。使用安全入口 `bun run test:acceptance-inspection` 聚焦三个慢 Git 用例所在文件，定稿后 `bun run test:acceptance-tools` 验证共用真实入口；不把固定单测预算、覆盖率 watchdog 或宿主输出 yield 混为同一种超时。\n\n### 跨聊天状态与清理前内容核对\n\n沿用项目当前任务合同与既有保留位置：`acceptance inspect-state --input=\u003c当前任务合同绝对路径>` 核对 owner、候选、显式接续和独立父审引用；`acceptance inspect-preservation --input=\u003c保留请求绝对路径>` 分别核对已提交、暂存区、工作区、untracked 与 ignored 内容。二者均只输出 JSON，退出 0 表示机械核对一致，缺件／失配／未知退出 2，不执行合同命令、不保存副本、不赋予接受或删除权限。\n\n字段、决定引用和旧收据继承见[状态和继承](../../docs/runbooks/development-feedback-loop.md#7-状态和继承)，保留范围、读回与清理门禁见[worktree 清理](../../docs/runbooks/worktree-development.md#5-清理)。单次执行的 `resume` 保持原收据层级；报告完成、父审、集成和发布分别判断。旧格式原件可人工只读核验，模板不构成新授权。聚焦回归已纳入现有 `test:acceptance-tools`。\n\n上述退出码指 acceptance 子入口的原生值；本机 Bun1.3.8 的多层 `bun run` 包装可能把非零退出归一为1。PowerShell 外层脚本没有显式传递原生退出码时也可能只报告1；需要保留该值时，先保存原生命令的 `$LASTEXITCODE`，再用 `exit` 传给调用者。接续脚本必须同时检查非零退出和输出 JSON 的 `exitCode`（若有）／`layer`／`behavior`／`parentReview`，不能把外层1直接认作业务 FAIL，也不能因为原件保存成功而继续派发。INCOMPLETE／PENDING 的人工出口由独立父审另存结论。\n\n### 第二个消费者：Vision5e + Item Macro 离线接入\n\n`prepare-batch` 读取已有 ServerNext 批次合同，复用当前文件侧内核，自动生成本任务合同与机器字段。请求只需 `workspaceRoot`、`sourceContractPath` 和 `authority:{source,scope:\"offline-batch-preparation\"}`，格式见[批次请求示例](../../docs/templates/development-feedback-batch-request.example.json)。原业务树、候选、旧合同及其回调父／子 UUID 都只读；新合同不会替代原当前状态源。\n\n```powershell\nbun run foundry:ops acceptance inspect-batch --source=\"\u003c旧批次合同绝对路径>\"\nbun run foundry:ops acceptance prepare-batch --input=\"\u003c本任务请求绝对路径>\"\nbun run foundry:ops acceptance ready --contract=\"\u003c生成的本任务合同>\"\nbun run foundry:ops acceptance execute --contract=\"\u003c同一合同>\"\nbun run foundry:ops acceptance collect --contract=\"\u003c同一合同>\" --receipt=\"\u003c同目录 receipt.json>\"\nbun run foundry:ops acceptance ready-batch --contract=\"\u003c同一合同>\"\n```\n\n`inspect-batch` 只读核对候选 ID／版本、声明资源全集及 SHA-256、ZIP 指纹、宏 JSON 的命令往返、固定目标门禁和 fixture／清理清单一致性。旧合同的“9项测试PASS”文字作为历史声明保留，不当成此次重新运行的测试结果。既有 Python 生产者的 Item Macro 哈希按 `read_text()` 规范化换行后的文本计算；工具分别校验该文本哈希与实际文件字节指纹，不能混为一个值或忽略差异。\n\n共用合同的 `readonlySources` 支持明确选择的跨工作树文件，用绝对路径与字节指纹防止混用；不复制业务源码。业务树分支／HEAD、源合同或任一绑定文件变化时拒绝继续，重新准备合同。`ready` 的 `executionScope:local-file-checks` 只允许合同内的离线检查；`ready-batch` 报告 `dispatchable:false` 并退出 2。本增量的运行授权固定为 NONE，即使源合同以后恢复，也不自动发消息、安装、启停或执行 Chrome。\n\n导入已有原生读回时，另存为 UTF-8 JSON，并提供独立观察的目标上下文 JSON：`origin`、`dataPath`、`world`、`foundry`、`system`、`systemVersion`。如果尚无实际上下文或读回，就保持未执行；不要用期待值制作一个“通过”样本。离线参考导入与下述明确恢复的实机收集是两个接受边界。\n\n```powershell\nbun run foundry:ops acceptance capture-receipt --contract=\"\u003c合同>\" --input=\"\u003c已保存原生读回>\" --context=\"\u003c独立目标上下文>\"\nbun run foundry:ops acceptance import-receipt --contract=\"\u003c合同>\" --input=\"\u003ccapture 返回的 envelopePath>\"\nbun run foundry:ops acceptance resume --contract=\"\u003c合同>\"\n```\n\ncapture 自动填写共用 run／dispatch／revision、源批次 ID 和两个合同指纹，保留原生字节，不要求手填已知 ID。import 拒绝错 run、revision、源合同、目标、版本、fixture 或原件哈希；重复回执保持同一 receiptId。部分文件已写但摘要未完成时，只读核对已有字节再补齐，不覆盖不同原件，也不重放业务操作。\n\n本版导入一律为 `REFERENCE_ONLY`，成功保存后仍退出 2，整体 behavior／evidence 为 INCOMPLETE、runtime／cleanup 为 NOT_EXECUTED、父审为 PENDING。模块 adapter 可独立核对读回中 60→90→60、命令文本、单次手动／活动记录；忽略原件中的 `pass` 标签，数据判断不代表 UI、客户端加载哈希、角色／重载或完整清理已通过。完整清理还需要对象、文件夹和辅助宏缺席的独立证据，不能仅凭 phase=cleaned 接受。\n\n消费者聚焦回归：`bun run test:acceptance-next-vm`。真实安装、Chrome、跨线程送达和业务清理在原批次明确恢复后，按其当前授权与现场证据另行执行；工具的离线成功不恢复暂停状态。\n\n实际批次曾遇到 DAE 自动生成的标准 Condition 没有本任务标记，原 fixture 清理因此保守停止。专属纯检查 `requireNextVmCleanupOwnership()` 只有在新建 Actor 的缺席／出生证据、完整持久化集合、已归属状态输入、精确 DAE 版本、实际 `dae.autoCreated` 与其源记录、固定父／ID／状态／创建时间都匹配时，才确认这一自动后代的限定归属。它不修改或删除文档，不替未知对象补标记，不能凭名称、类、静态 ID 或 `isTemporary` 放行。手动条件、缺失标记、额外对象和身份变化均拒绝；使用 `bun run test:acceptance-cleanup` 验证这些边界及实际编译入口。`buildNextVmCleanupGuard()` 显式绑定本地导出并检查调用函数存在；编译／语法成功不能替代这个入口往返。实际恢复仍由父任务准备并审核后通过正常应用入口执行。\n\n### 已明确恢复的 Vision5e + Item Macro 实机批次\n\n文件侧合同继续保持运行授权 NONE。用户明确恢复原批次后，可建立单独的运行合同；目前只支持已有 ServerNext 的这两个候选，不提供通用安装器、服务启动器或浏览器调度服务。\n\n先准备运行请求，包含 `offlineContractPath`、`authorityPath`、`executorPermissionsPath`、`serviceReceiptPath` 四个绝对路径。授权记录包含 `scope:\"local-next-vm-runtime\"`、`explicitUserResume:true`、实际授权引用 `source`、原 `resumeSourceDispatchId`、本轮 `parentThreadId`、原执行聊天 `childThreadId` 及该执行器的期望 `model`／`reasoningEffort`。当前项目普通 Chrome 默认为 `gpt-6.1-sol / medium`，主控配置独立记录；工具核对执行器实际上下文与该授权记录相符，不要求与主控effort相同。这是授权的记录，不是 JSON 文件自己授予权限。旧暂停合同只读保留，新回调目的地单独绑定。\n\n执行聊天的权限收据必须来自自身实际 `turn_context`，包含 `threadId`、`model`、`reasoningEffort`、`sandboxMode`、`approvalPolicy`、`verifiedFromActualHostContext`、`actualContextPath`、`actualTurnId`。工具重新检查该精确聊天最新上下文；主控权限或提示词不能替代。服务收据包含本轮父／子 UUID、PID、完整命令行、OS owner、UTC ISO 格式 `processCreationDate` 与启动前 `mirrorBefore`。派发前再次核对 127.0.0.1:30002、既有 ServerNext 数据路径、Foundry 14.368、实际世界／系统与候选字节。失配不调用消息派发函数。\n\n```powershell\nbun run foundry:ops acceptance prepare-runtime --input=\"\u003c本轮运行请求绝对路径>\"\nbun run foundry:ops acceptance ready-runtime --contract=\"\u003c返回的运行合同>\"\nbun run foundry:ops acceptance claim-runtime --contract=\"\u003c同一运行合同>\"\n```\n\n`claim-runtime` 在再次检查后原子领取一次派发；它自身不发送消息，返回 `transport:NOT_SENT`、`runtime:NOT_EXECUTED`。获准的宿主随后用原生聊天工具派发到合同子 UUID，并保存实际运输回执。若消息失败，保留领取状态并检查，不能自动重放；再次领取会被拒绝。执行聊天在第一项 E2E 前仍需核实自己新一轮的实际配置。派发后按 chrome-delegation-dev 等结果回调，不轮询。\n\n运行回执输入包含 `binding:{dispatchId,contractRevision,contractSha256,parentThreadId,childThreadId}`、`nativePath`、独立 `contextPath` 和非空 `evidencePaths`。使用本轮合同自动取得这些字段；原生宏仍使用旧 `sourceDispatchId`，两者分别核对。\n\n```powershell\nbun run foundry:ops acceptance collect-runtime --contract=\"\u003c本轮运行合同>\" --input=\"\u003c已保存证据清单>\"\n```\n\n工具固定原件和证据指纹、按实际数值／记录判断 API 数据观察，并幂等读回同一收据。成功收集仅为 `runtime:OBSERVED`，界面、玩家角色、刷新持久化、错误归因与完整归属清理仍需父任务查看实际证据；总体验收保持 INCOMPLETE／父审 PENDING，退出 2。截图存在、PASS 标签或 `phase:cleaned` 都不会自动变为完整接受。必要步骤完成后，由父任务另行记录语义判定及剩余范围。\n\n### 接续时怎样读验收结果\n\n先读任务的当前状态和对应独立验收记录，再决定是否执行下一步。共用工具保存的 INCOMPLETE／PENDING 表示还有人工语义出口，不等于实际任务一直未完成。独立父审可以接受已核对的限定行为、恢复和清理；原收据保持不变，两个层级分别留证。已经闭合的批次不重放，新候选、范围变化或实际缺陷另立任务边界。\n\nVision5e + Item Macro 的限定实机链已完成父审和精确清理，见 [实机闭合记录](../../docs/reviews/2026-09-30-development-feedback-next-vm-runtime.md)。这份记录证明该批次的限定接受；旧离线合同仍是 NONE，其他迁移批次仍暂停，不能由本次接受推导全部模块兼容或世界零错误。\n\n## 本地资产只读盘点\n\n运行：\n\n```powershell\nbun run foundry:ops assets inventory --hash-concurrency=4\n```\n\n它会读取已经注册的本地 Foundry Lab 资产，分别生成以下八类 manifest：\n\n- Foundry 程序和 Node 运行时；\n- 模块；\n- 游戏系统；\n- 世界；\n- 备份；\n- 验收、诊断和审计证据；\n- 历史归档；\n- 临时工作区和可重建缓存。\n\n每个普通文件都会记录相对路径、体积、SHA-256、修改时间和文件系统访问时间。访问时间只是 Windows 文件系统提供的尽力信息，可能被延迟或关闭，不能单独证明“最后一次实际使用”。模块、系统和世界还会读取顶层 manifest 中的 ID、版本和公开来源 URL；本地文件 URL 不会写入报告。\n\n报告默认写入忽略目录：\n\n```text\n.local/foundry-v14/inventory/asset-inventory/\u003ctimestamp>/\n```\n\n其中 `summary.md` 是短摘要，`manifest.\u003ccategory>.json` 是分类型实物清单，`duplicates.json` 和 `duplicates.md` 是完整的字节级重复项报告。“理论重复体积”不是删除建议；同一文件出现在 world、backup、evidence 和 archive 中，可能分别承担运行、恢复和审计职责。\n\n扫描器不会跟随符号链接或 Windows junction，也不会扫描凭据目录、认证 cookie 或 Foundry profile 的 `Config`。遇到未授权链接、扫描期间变化或读取失败时，报告会标记为不完整并返回非零退出码。生成报告本身是唯一写入行为；命令不会复制、移动、删除资产，也不会访问生产环境。\n\n## `.local` 全范围登记\n\nStage 5A 的 hash 清单只覆盖已经确认 owner 的 Foundry Lab 资产。要检查仓库里是否又出现未登记的本地目录或文件，运行：\n\n```powershell\nbun run foundry:ops assets scope\n```\n\n该命令只枚举 `.local` 顶层，并把每一项标成：\n\n- `已分类`：已经确认生产者、使用者、可重建性和保留级别；\n- `隐私排除`：知道它是什么，但不会递归读取浏览器 profile、OAuth、cookie、桥接状态或截图内容；\n- `待人工判断`：实物存在，但现有仓库证据不足以证明 owner 或 canonical copy，必须保留并等待单独决定。\n\n报告默认写到 `.local/foundry-v14/inventory/scope-coverage/\u003ctimestamp>/`。其中“范围完整”只表示当前每个顶层条目都已登记；只要仍有“待人工判断”，所有权分类就仍然不是完整状态。无论两者为何值，报告都不构成迁移或删除授权。\n\n## 外置迁移方案（只生成报告）\n\n```powershell\nbun run foundry:ops assets migration-plan\n```\n\n该命令读取最近一份完整资产清单，按“世界与备份 → 证据与归档 → 程序/模组/系统 → 可重建缓存”生成逐批复制、精确对账、旧路径兼容窗口、回滚和恢复抽样方案。没有选定目标目录时，报告会明确停在“等待选择目标”；即使指定了专用空目录，也只会标记“可以申请复制授权”，不会创建目标、复制、切换、移动或删除任何资产。\n\n目标目录以后由用户单独决定：\n\n```powershell\nbun run foundry:ops assets migration-plan --target-lab-root=J:\\fvtt-lab\n```\n\n报告默认写到 `FVTT_OPS_LAB_ROOT/inventory/migration-plans/\u003ctimestamp>/`。目标必须在仓库和当前实验环境之外，不能是磁盘根目录、链接/联接路径或混有其他内容的目录。选择目标不等于授权复制；实际复制、短时 Foundry 验收和旧目录退役分别需要后续授权。\n\n## 生产只读盘点\n\n按照 [ADR-0005](../../docs/decisions/0005-production-read-autonomy-and-write-authorization.md)，代理可以自主执行生产 inventory/acquire 等只读操作，不必先进行一轮对话确认。以下三道机械保险和目标身份核对仍然全部保留；它们用于防止误连或把计划误当执行许可，不能被命令别名或私有 handoff 绕过。\n\n生产只读命令必须同时满足三件事：\n\n1. 命令带 `--apply`，表示不再只是查看计划；\n2. 命令带 `--allow-production-read`，表示本次明确允许连接生产服务器读取；\n3. 主机、数据路径和 SSH 身份文件通过外部环境变量提供。\n\n例如：\n\n```powershell\n$env:FVTT_OPS_PRODUCTION_SSH_TARGET = '你本机 SSH 配置中的别名'\n$env:FVTT_OPS_PRODUCTION_DATA_PATH = '生产 Foundry 数据目录'\n$env:FVTT_OPS_PRODUCTION_SSH_IDENTITY = '本机私钥路径'\nbun run foundry:ops production inventory --apply --allow-production-read\n```\n\n仓库不再保存具体生产主机或生产数据路径。缺少配置时，命令会在建立连接前失败。\n\n如果下一步会安装模块、重启服务、hydrate 世界内容、迁移数据、写 LevelDB 或产生任何其他生产写入，必须在第一项写入发生前停止并向用户取得明确授权。只读盘点的许可不会自动延伸为写入许可。\n\n## 共享 Server Mirror\n\n当前配置的本地 v14 Lab 是 `F:\\FoundryLab\\foundry-v14`，默认复用的数据目录是 `F:\\FoundryLab\\foundry-v14\\data\\server-mirror`。使用前核对 PID、端口、路径和运行者；若其他参与者正在使用，等待或协调释放，不擅自停止，也不复制另一整套 Lab。\n\n- 需要现成角色、场景、物品或合集的人工/玩法语义验收，默认使用持久世界 `cor-cotn`。修改既有文档前记录原值，结束后恢复；临时对象必须可识别并清理。\n- 干净隔离、模块组合、迁移/恢复、故障注入或可能污染世界的测试，使用 `fvtt-v14-module-matrix` 或测试创建的随机临时沙箱。\n- 身份预检、本地模块安装、启停和短时测试无需再次询问；这些本地权限不代表生产授权。\n\n## 本地路径配置\n\n这些变量都是可选的；当前机器通过用户级配置指向 F 盘 Lab。未配置的其他环境仍使用代码定义的兼容默认值，不得据此重建已退役的仓库 `.local/foundry-v14`：\n\n| 环境变量 | 用途 |\n|---|---|\n| `FVTT_OPS_LAB_ROOT` | 本地 Foundry 测试根目录 |\n| `FVTT_OPS_EVIDENCE_ROOT` | 本地证据和报告根目录 |\n| `FVTT_OPS_BACKUP_ROOT` | 本地备份根目录；默认是 `FVTT_OPS_LAB_ROOT/backups` |\n| `FVTT_OPS_FOUNDRY_ZIP` | Foundry 安装包路径 |\n| `FVTT_OPS_WORLD_ID` | 默认世界标识；有精确安全限制的命令仍会校验自己的固定测试世界 |\n| `FVTT_REFERENCE_CACHE_ROOT` | 独立的大型参考资料缓存；默认仍为仓库内 `.local/references`，不会跟随 Foundry Lab 一起迁移 |\n\n所有可写根目录仍经过路径逃逸、符号链接和 Windows junction 检查。配置成磁盘根目录或仓库根目录会被拒绝。\n\n## 旧命令兼容\n\n旧的 `bun run foundry:lab ...` 仍然可用，但 `scripts/foundry-lab/cli.ts` 现在只是一个兼容入口：它先进入 Foundry Ops 权限检查，再执行这里的正式实现。旧的实现文件也只保留简短转发层，避免已有导入路径突然失效。\n\n`src/tools/world-audit`、`src/tools/production-migration` 和三个历史工具入口同样只保留兼容转发。正式测试已经和实现一起迁入本目录。\n\n## 长时间验证边界\n\nFoundry／Chrome 工作沿用根说明，不设固定总时长上限；单操作保留超时，不能用重复短测代替真实长时验收。四小时或其他长时测试只在用户明确要求相应验收时运行；真实会话仍需真实使用证据。工具回归或文件侧收据不能关闭这些门禁。\n\n## Mirror 的14.368程序选择（2026-10-03）\n\n已授权的本轮Mirror使用14.368/dnd5e5.3.3。程序选择只影响Mirror，Core Test继续14.364；生成器默认目标、Next和生产均沿各自契约。\n\n```powershell\n$env:FVTT_OPS_MIRROR_FOUNDRY_VERSION = '14.368'\nbun run foundry:lab launch server-mirror\n```\n\n该选择器只接受精确14.364或14.368，省略时保留原364选择。对正在运行的peer同时识别两个允许的Mirror程序目录；未知活PID失败关闭并保留记录。启动前仍核真实PID、端口、dataPath、World和共享占用，常驻服务不在E2E清理时停止。旧PID文件不能代替实际进程身份；当前服务收据及必要兼容/安装接受见[本轮维护记录     return mountHandbook(root, content, {
      initialRoute: window.location.hash,
      initialTheme: theme,
      idPrefix: "",
      contentDigest,
      href: (route) => "#" + route,
      onNavigate(route, { replace }) {
        const hash = "#" + route;
        if (window.location.hash === hash)
          return;
        if (replace)
          window.location.replace(hash);
        else
          window.location.hash = hash;
        renderedHash = window.location.hash;
      },
      onTitleChange(title) {
        document2.title = title;
      },
      onThemeChange(next) {
        document2.documentElement.dataset.theme = next;
        try {
          window.localStorage.setItem("handbook-theme", next);
        } catch {}
      },
      copyText(text) {
        const clipboard = window.navigator.clipboard;
        if (!clipboard?.writeText)
          throw new Error("clipboard unavailable");
        return clipboard.writeText(text);
      },
      scrollToTop() {
        window.scrollTo(0, 0);
      },
      subscribeRoute(navigate) {
        const changed = () => {
          const hash = window.location.hash;
          if (hash === renderedHash)
            return;
          renderedHash = hash;
          navigate(hash);
        };
        window.addEventListener("hashchange", changed);
        return () => window.removeEventListener("hashchange", changed);
      },
      subscribeShortcuts(keydown) {
        const globalKeydown = (event) => {
          if (!root.contains(event.target))
            keydown(event);
        };
        document2.addEventListener("keydown", globalKeydown);
        return () => document2.removeEventListener("keydown", globalKeydown);
      }
    });
  }

  // docs/handbook/client.js
  var root = document.querySelector("[data-handbook-root]");
  var content = document.getElementById("handbook-data");
  if (root instanceof HTMLElement && content) {
    mountStandaloneHandbook(root, JSON.parse(content.textContent || "null"), document.querySelector('meta[name="handbook-digest"]')?.getAttribute("content") || "");
  }
})();
</script>
</body></html>
