<script id="handbook-data" type="application/json">{"entries":[{"id":"web-workbench","title":"Web 工作台","category":"convert","summary":"用中文页面上传资料、查看转换进度，下载 JSON、Markdown 和 ZIP。","when":"希望通过页面操作，或者需要查看批量任务、警告和下载结果时，从这里开始。","requires":["本机已安装项目锁定依赖；运行命令时位于项目根目录。","实际使用需要启动 Web 服务；阅读本手册不需要。AI 任务还需按页面配置 AI 连接。"],"steps":[{"title":"启动本机工作台","text":"先构建页面，再启动仅监听本机的服务；服务运行期间保留终端。","command":"bun run web:build\nbun run web:start"},{"title":"打开页面并选择任务","text":"在浏览器打开 http://127.0.0.1:5174。按资料类型选择转换入口，核对目标版本与 effect profile，上传真实来源文件。"},{"title":"核对任务与结果","text":"查看任务摘要、来源和诊断；遇到 needs_review 或 failed 先处理问题。单文件下载 JSON，批量下载逐项结果或 ZIP。"},{"title":"需要本机 Companion 时","text":"开发入口会构建 Windows Companion 并在 5173 启动单一页面/API 服务。按 AI 连接面板下载 EXE、双击并完成配对。","command":"bun run web:dev"}],"outputs":["可下载的正式 JSON、任务对应的 Markdown、诊断和批量 ZIP。","上传任务在隔离的任务区域处理，不会按 Vault Sync 的方式修改资料库 manifest。"],"limits":["web:dev 是构建后启动，不是前端热更新；修改后需要重新运行。","网站 AI、个人 API Key 与本机 Companion 是不同连接方式，不应混用其配置；公开部署需独立配置和授权。","页面成功下载不等于来源语义或 Foundry 运行时通过。"],"keywords":["网页","上传","自动转换","下载","批处理","AI连接","Companion"],"sources":["docs/web-deployment.md","docs/web-ai-connections.md"],"watch":["apps/web/","packages/forge-gateway-protocol/"]},{"id":"markdown-convert","title":"Markdown 转 Actor / Item","category":"convert","summary":"把符合项目格式的中文 YAML/Markdown 或英文 bestiary 转为 Foundry 数据。","when":"来源已经是项目支持的结构化 Markdown，想直接生成单文件或合集时使用。杂乱 TXT 先看 AI Intake。","requires":["符合项目契约的来源 Markdown，可先参照 templates/npc-example.md。","明确 Foundry 目标与效果模式；下面示例显式选择 v14/core，并关闭图标替换。"],"steps":[{"title":"查看可用参数","text":"确认本版本 CLI 帮助，特别是版本、输出路径和输入类型。","command":"bun run cli:help"},{"title":"生成示例 Actor","text":"示例来源在仓库中；正式使用时替换来源和输出名称，保持原文可追溯。","command":"bun run src/index.ts \"templates/npc-example.md\" -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" --fvtt-version 14 --effect-profile core --icon-mode off"},{"title":"对照来源验证","text":"运行来源验证，并人工核对属性、动作、豁免、效果与施法；修改来源或生成逻辑后重新生成。","command":"bun run verify:actor \"templates/npc-example.md\" \"obsidian/dnd数据转fvttjson/output/example-v14.json\""}],"outputs":["由正式 workflow 生成的 Actor 或 Item JSON。","未通过正式检查的结果停在 needs_review / failed，不写正式 output。"],"limits":["CLI 省略版本默认 v12；本手册的示例不改变这个产品默认值。","v14 锁定 Foundry 14.364 / dnd5e 5.3.3。core 不输出专属 modded 字段；不同模块组合的兼容性需单独核实。","结构化来源的分区决定 Item 显示分区；动作分区中回合开始自动触发的 special Activity 仍显示在动作分区，特性分区中显式 action 也不迁移分区。","Bleeding / Burning 模板从特性明确给出的骰式、伤害类型和时机取值，默认回合结束，重复施加统一采用较高值。19 种 Custom Conditions 的生成状态 ID 统一使用 fvtt-custom-conditions.\u003c条件 ID>，与 dnd5e 的 bleeding/burning 及其他模块的 dazed 分开；flags 中的规则参数条件 ID 仍是 bleeding、burning 等语义 ID。自定义 Dazed / Shocked 模板采用本项目的移动、动作、附赠动作三选一说明；生成的文本和状态 ID 不代替 Foundry 内的实际回合限制。普通命中伤害和相邻其他状态不能代替缺失参数；在 FVTT 中自动执行需要 Custom Conditions 与 Trigger Engine，JSON 导入不等于状态自动命中或 E2E 通过。","状态模板 Effect ID 使用稳定的来源动作身份；重复生成保持本地引用一致，同一 Item 内的独立动作也有不同身份。生成时间戳可变化，不保证整份 JSON 字节完全相同。","不可手工修补最终 JSON 来绕过生成或审查。"],"keywords":["生成器","NPC","Actor","Item","JSON","YAML","CLI","合集"],"sources":["README.md","docs/generated-actor-verification.md","docs/acceptance/current-support-matrix.md"],"watch":["apps/cli/","packages/contracts/","packages/models/","packages/parser/","packages/generation/","packages/workflows/"]},{"id":"monster-intake","title":"AI 怪物资料整理","category":"convert","summary":"从原始 TXT 或不规则 Markdown 提取怪物证据，生成标准来源和 Actor JSON。","when":"刚拿到一段怪物资料或多个怪物的合集，尚未整理为项目格式时使用。","requires":["真实 TXT/Markdown 来源，不将截图直接交给此文本入口。","配置专用 MONSTER_INTAKE_* provider；内容会发给所选 AI 服务。凭据只保留在本地配置。"],"steps":[{"title":"检查 AI 配置","text":"API Key 模式检查配置；本机 OAuth 兼容桥模式还会检查本机健康端点。","command":"bun run src/index.ts --intake-doctor"},{"title":"先预览输入","text":"替换 source.txt 为真实文件。dry-run 检查输入与配置，估算数量，不调用 AI、不推广文件。","command":"bun run src/index.ts --intake-monsters \"source.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core --dry-run"},{"title":"执行整理并阅读审查结果","text":"移除上一条命令的 --dry-run 运行正式整理。accepted 后核对原文、标准 Markdown 与 JSON；needs_review 时使用本次 run 的 decisions 进行明确审查。"},{"title":"恢复需要审查的任务","text":"使用真实 run-id 和人工填写的 decisions.json；恢复会重新验证，不是手改候选 JSON。","command":"bun run src/index.ts --resume-intake \".local/intake-runs/\u003crun-id>\" --decisions \".local/intake-runs/\u003crun-id>/decisions.json\" --vault \"obsidian/dnd数据转fvttjson\""}],"outputs":["accepted 的来源 Markdown 写入 vault input，Actor JSON 经既有 workflow 写入 output。","审查材料保留在 .local/intake-runs/\u003crun-id>/，可追溯来源与诊断。"],"limits":["最多 50 个候选、200,000 个 UTF-16 字符；任意资料和任意模型不保证自动通过。","此入口不做 PDF/图片 OCR；请先使用文档输入流程。","空白的能力分区标题不代表已检测到“没有能力”；当前确定性 validator 仍可能以 MISSING_SOURCE_FEATURES 要求审阅。不要据此虚构特性或删掉 IR 容器。","退出码 0 为全部 accepted 或预览，2 为存在 needs_review 且无 failed，1 为存在 failed。"],"keywords":["怪物","文本","TXT","Intake","审查","resume","AI"],"sources":["README.md","docs/acceptance/current-support-matrix.md"],"watch":["packages/intake-ai/"]},{"id":"item-intake","title":"AI 物品资料整理","category":"convert","summary":"把自然语言物品资料整理成有来源证据的 Item，并核对机制和法术。","when":"物品描述是 TXT 或不规则 Markdown，包含充能、效果或施法机制，需要正式 Item Intake 时使用。","requires":["原始物品文本，单次不超过 50 项和 200,000 个 UTF-16 字符。","与 Monster Intake 共用专用 provider 配置，但使用独立 Item IR 和生成检查。"],"steps":[{"title":"确认配置和目标","text":"检查 AI provider；此入口固定为 Foundry 14.364 / dnd5e 5.3.3 / core。","command":"bun run src/index.ts --intake-doctor"},{"title":"整理物品来源","text":"替换文件路径。AI 提取证据，确定性规则生成 item-mechanics Markdown 和 Item JSON。","command":"bun run src/index.ts --intake-items \"items.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core"},{"title":"阅读机制与审查材料","text":"重点核对 AC、充能、恢复时机、Activity 消耗和法术身份。needs_review 时通过本次审查包的 decisions 恢复。","command":"bun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" --vault \"obsidian/dnd数据转fvttjson\""}],"outputs":["accepted 的 Markdown 和 JSON 分别进入 input/items 与 output/items。","独立 .local/item-intake-runs/\u003crun-id>/ 保留证据、诊断和 provider 审计。"],"limits":["法术身份必须唯一命中锁定目录；无法解析不能用空 Utility 伪装成功。","静态和应用层验收不等于每种物品已通过 Foundry AC、充能与效果生命周期实测。"],"keywords":["物品","魔法物品","充能","Ite "工程工作先遵守 worktree 规则；按改动范围选择检查。","测试绿色、文件存在、真实 Foundry 操作和生产验收分别记录。"],"steps":[{"title":"选择必要检查","text":"普通说明修改核对文义和链接；实现修改按 owner 规则运行受影响测试。完整工程门禁如下，耗时较长。","command":"bun run ci:verify"},{"title":"验证共用验收工具","text":"安全包装入口覆盖预检失败不派发、错误路径、候选／指令变化、旧收据、空输出和超时恢复。第二消费者的只读来源、参考回执与暂停门禁可用 test:acceptance-next-vm 聚焦验证；按变化选择入口。详细操作见 Foundry 环境与资产检查条目。","command":"bun run test:acceptance-tools"},{"title":"查阅锁定参考","text":"参考缓存是开发资料，不是正常生成器的运行依赖。先 dry-run 查看将获取什么。","command":"bun run references bootstrap --dry-run"},{"title":"同步工具手册","text":"功能说明与实现一起维护。status 列出需要核对的条目；人工核对后按维护文档记录，再 build 和 check。","command":"bun run handbook:status\nbun run handbook:build\nbun run handbook:check"}],"outputs":["与具体改动对应的检查证据和来源语义结论。","随代码合并更新的 工具手册.html，可直接离线打开。"],"limits":["ci:verify 包含手册一致性检查，但不自动写说明，也不保证任何发布权限。","本手册是版本快照；单独复制到其他位置的 HTML 不会自动跟随 master 更新。","内部 package 是共享能力，不是每个都需要单独启动；Forge 浏览器 runtime、法术契约与血猎手数据包由对应产品入口使用。"],"keywords":["测试","验证","verify","参考","开发","更新","手册","构建","master"],"sources":["docs/generated-actor-verification.md","docs/acceptance/current-support-matrix.md","docs/REFERENCE_INDEX.md","docs/runbooks/handbook-maintenance.md"],"watch":["package.json","src/tools/","scripts/","packages/forge-browser-runtime/","packages/spell-manifest-contracts/","packages/blood-hunter-v14/"]},{"id":"human-encounter-intake","title":"人类MD与召唤战斗包","category":"convert","summary":"人类MD经AI提取生物与固定能力配置，工具生成Actor及控制入口，并一起导入。","when":"需要生成龙兽和晶体、召唤者和红龙等多个关联生物，并携带配套自动化时。","requires":["每种生物的完整规则与明确召唤关系；未知规则保留给GM。","本地默认DS API deepseek-flash（V4.1 Flash）；当前固定执行层仅支持Foundry14.364/dnd5e5.3.3/core。"],"steps":[{"title":"填写普通资料","text":"参照人类写法模板写两份完整生物数据，说明召唤数量、位置、先攻和持续等规则。未确定的规则明确保留缺项。"},{"title":"运行并核对","text":"在Forge Intake中选择原始MD并生成；也可使用CLI。命令输出目录应为新的目录。","command":"bun run tools/forge-encounter/run-human-intake.ts docs/examples/晶血龙兽与月石晶体-人类写法.md ./crystalbleed-intake-run"},{"title":"审核后导入并启动","text":"角色来源、正式生成和固定配置审核通过后才产出整包。GM确认导入并明确启用；刷新会恢复已启用且身份正确的配置，控制面板可持久停用。"}],"outputs":["只有整包达到 ready_for_gm_review 后，才输出各生物的正式来源MD、Actor JSON和整包ZIP。","review.json 保留原始资料hash、IR、模型身份、重试元数据和审核结果；needs_review/failed 不产生可导入包。"],"limits":["AI只能选择已实现能力与参数，不能编写宏代码；能力清单外的自动化保留待实现或GM处理。","生成和预览不执行自动化；停止或关闭页面取消本次请求。草稿续跑重新校验、审阅，不继承历史通过状态。","本地CLI默认DS Flash，每阶段5分钟；不使用Luna桥接。Luna Max是本地验收操作者，与Intake模型不同。","真实DS已生成并审核样例整包，本地已测召唤、守护减伤与耗尽削弱；重复腐化保留PARTIAL，待独立状态设计；浏览器完整AI生成链尚未重测。","当前执行器只支持V14；V12需独立适配验收。未指定的召唤期限、数量上限和死亡规则不自行补全。"],"keywords":["召唤","红龙","晶体","多生物","战斗包","人类MD","配套宏"],"sources":["tools/forge-encounter/README.md","docs/examples/召唤生物-人类写法模板.md","docs/examples/晶血龙兽与月石晶体-人类写法.md"],"watch":["tools/forge-encounter/","packages/forge-browser-runtime/","packages/intake-ai/"]},{"id":"chat-memory-guard","title":"聊天内存保护","category":"maintain","summary":"限制当前浏览器中已渲染聊天卡片和头像媒体的占用，保留世界聊天记录。","when":"聊天栏长时间堆积卡片或头像媒体造成浏览器压力时，按世界默认值或当前客户端覆盖进行限制。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM（修改世界默认值时）"],"steps":[{"title":"启用并打开配置","text":"在精确支持版本的世界中启用 Chat Memory Guard；进入“游戏设置 → 模块设置 → 聊天内存保护”。模块会在世界准备完成后接管当前聊天窗口和聊天弹窗。"},{"title":"设置世界默认值","text":"GM 设置启用开关、保留的已渲染消息数（20–200）、头像来源（系统、Token、Actor 或隐藏）、原图或会话级 WebP，以及缩略图最长边（48–256 px）和质量（40–95）。保存后当前聊天立即重新渲染。"},{"title":"设置个人覆盖","text":"每位用户可以选择跟随世界默认值，或只为当前浏览器保存覆盖值。玩家的 client 设置不会改写 GM 的世界默认值。"},{"title":"观察聊天与诊断","text":"打开聊天栏或聊天弹窗观察卡片保留和头像显示；需要排障时，在浏览器控制台读取 game.modules.get(\"chat-memory-guard\").api.getStats()，只查看渲染数、裁剪数、缩略图估算字节、失败数和有效设置。"},{"title":"运行离线检查","text":"维护者从仓库根目录运行模块测试；该检查属于机械证据，不能代替真实长时间跑团观察。","command":"bun run test:chat-memory-guard"}],"outputs":["当前浏览器聊天 DOM 按有效保留数裁剪","按设置显示系统、Token 或 Actor 头像，或使用会话级 WebP 缩略图","game.modules.get(\"chat-memory-guard\").api.getStats() 诊断结果"],"limits":["只限制当前浏览器里已渲染的聊天卡片，不删除世界聊天记录。","缩略图只存在于当前页面会话，不能阻止 dnd5e 创建头像前的首次原图请求","短时 A/B、单元测试和构建不能证明长时间跑团内存永不增长","仅支持 Foundry 14.364 与 dnd5e 5.3.3"],"keywords":["聊天","内存","DOM","头像","缩略图","Chat Memory Guard"],"sources":["foundry-modules/chat-memory-guard/README.zh-CN.md"],"watch":["foundry-modules/chat-memory-guard/"],"module":"chat-memory-guard"},{"id":"fvtt-babele-rolltable-embed-translation","title":"Babele 随机表嵌入翻译兼容","category":"maintain","summary":"在 Babele 翻译已经存在时，修复 Foundry v14 的 @Embed 随机表结果仍显示英文的渲染缺口。","when":"Journal、聊天或其他文本中的 Compendium RollTable 使用 @Embed 后，表名已翻译但结果行仍为英文时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","Babele 2.9.1","libWrapper 1.13.5.1","可读取的 Babele 随机表翻译文件"],"steps":[{"title":"准备依赖并启用模块","text":"在目标世界先启用 Babele 与 libWrapper，再启用本模块并重新加载世界。模块在 init 阶段只注册 RollTable 的渲染包装；依赖缺失时不会提供翻译覆盖。"},{"title":"准备可读取的随机表","text":"确保目标 Compendium RollTable 对当前世界可读，并由 Babele 提供对应翻译。翻译源继续由现有 Babele 翻译包维护，本模块不编辑翻译文件。"},{"title":"渲染 @Embed","text":"在 Journal、聊天或其他支持富文本的地方插入目标随机表的 @Embed，再打开包含该表的页面，核对表名和各范围对应的中文结果。"},{"title":"核对结果与链接","text":"检查各个范围是否仍对应正确的结果。若使用狂野魔法浪涌或困惑术，可按原始说明逐行对照；文档型结果应仍能打开原来的目标条目。"},{"title":"运行离线检查","text":"维护者从仓库根目录运行模块测试；测试和构建只证明静态包装逻辑，实际表格行仍需在锁定版本的 Foundry UI 中复核。","command":"bun run test:fvtt-babele-rolltable-embed-translation"}],"outputs":["Compendium RollTable @Embed 中按范围显示的中文结果","文档型结果继续生成指向原 UUID 的 content-link","翻译失败时保留 Foundry 原生嵌入结果"],"limits":["只修正随机表嵌入的显示，不改写随机表、角色、物品、日志或世界设置。","Babele 或 libWrapper 不可用、翻译失败或数据无法对齐时会保持原生输出或停用覆盖","依赖版本锁定为 Foundry 14.364、dnd5e 5.3.3、Babele 2.9.1 和 libWrapper 1.13.5.1","单测、构建和安装校验不等于实际 UI 中的 25 行、5 行和文档链接验收"],"keywords":["Babele","@Embed","RollTable","随机表","翻译","content-link"],"sources":["foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md"],"watch":["foundry-modules/fvtt-babele-rolltable-embed-translation/"],"module":"fvtt-babele-rolltable-embed-translation"},{"id":"fvtt-battlefield-painter","title":"战场地形画笔","category":"play","summary":"GM 在 Foundry v14 画布上绘制可追踪、可擦除和可回滚的火焰、冰霜与荆棘地形。","when":"跑团中需要快速铺设地形、改变阶段、表达移动代价或清理本模块地形文档时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM","已打开并激活的场景和可用画布网格"],"steps":[{"title":"启用并打开场景","text":"以 GM 身份在精确支持版本的世界中启用模块，然后打开并激活要编辑的场景。非 GM、无活动场景或网格接口不可用时不会允许修改。"},{"title":"打开地形画笔","text":"在场景控制组的 Tiles 工具栏点击火焰图标“战场地形画笔”，打开 ApplicationV2 控制面板。该入口只在精确版本和 GM 客户端中出现。"},{"title":"选择地形与画笔","text":"选择火焰、冰霜或荆棘，选择阶段 I 或 II，再选择绘制、擦除或切换阶段。P1 开启时还可选择自由、直线或填充形状，以及 0–4 格笔刷半径。"},{"title":"在画布上操作","text":"点击“启用画笔”后，在地图上按住左键拖动，松开时一次创建该笔画；擦除只处理本模块拥有的文档，切换阶段作用于命中的完整笔画批次。P1 提供撤销和重做。"},{"title":"处理清除与旧声音","text":"需要清理本场景地形时先查看数量预览，再在确认框中确认；发现旧版本 AmbientSound 时也必须由 GM 显式确认清理。旧声音清理不可撤销，模块不会自动迁移或删除场景数据。"}],"outputs":["带 fvtt-battlefield-painter 所有权标记的 Tile、Region、Wall 和火焰 AmbientLight 场景文档","火焰、冰霜和荆棘的两个阶段；成熟荆棘阶段可形成 Wall 边界","Region 移动消耗、P2 火焰/冰霜画布效果，以及本模块笔画历史和回滚能力"],"limits":["版本锁定为 Foundry 14.364 与 dnd5e 5.3.3，只有 GM 能修改场景","当前是 0.3.0-alpha.1 P2 alpha；Fire B13 的完整真实 Canvas 验收仍待完成，其他运行时结论以对应 micro-batch 记录为准","不提供伤害自动结算、12 色变体、跨客户端并发锁或第三方自动化集成","新版本不创建 AmbientSound；旧环境音清理不可撤销，静态测试和构建不等于真实画布验收"],"keywords":["战场","地形","火焰","冰霜","荆棘","画笔","Canvas","Region"],"sources":["foundry-modules/fvtt-battlefield-painter/README.zh-CN.md","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md"],"watch":["foundry-modules/fvtt-battlefield-painter/"],"module":"fvtt-battlefield-painter"},{"id":"fvtt-blood-hunter-2024","title":"血猎手 2024","category":"library","summary":"提供血猎手 2024 的职业、结社和特性合集，使用 dnd5e 原生升级流程。","when":"给新角色添加血猎手职业、查看结社特性，或只读检查旧角色与当前内容差异时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM","可被 canonical flags 或严格 legacy 条件唯一匹配的 Blood Hunter Actor（迁移时）"],"steps":[{"title":"启用并检查内容包","text":"在精确支持版本的世界中启用模块，打开 Compendium 目录确认“血猎手 2024：职业”“血猎手 2024：子职”和“血猎手 2024：特性”三个 Item pack 可读。"},{"title":"给新角色添加职业","text":"从 classes（职业）合集中把“血猎手”拖入角色卡，按 dnd5e 原生 Advancement 提示完成选择。"},{"title":"按原生流程升级","text":"通过角色卡的升级流程选择结社和对应特性；需要 GM/玩家判断的规则按原文处理，不把 assisted 项当作全自动。"},{"title":"更新合集后检查角色","text":"已经加入角色卡的职业和特性是快照，模块更新不会实时替换它们。核对角色已有等级、选择和消耗，再决定是否需要另行处理。"},{"title":"旧角色仅做只读预览","text":"GM 在“游戏设置 → 模块设置”打开“血猎手 2024：角色迁移”，输入 Actor ID 或精确名称，点击 Preview 查看差异。当前 Create migrated copy 与 Apply original 流程要求创建副本和 JSON 备份，与本项目无备份规则冲突，因此停在 Preview，不继续迁移。"}],"outputs":["classes、subclasses、features 三个 dnd5e Item Compendium pack","迁移 Preview、验证后的 Actor 副本和 canonical/migration 契约证明","仅更新模块拥有 Blood Hunter Item 的原 Actor 投影，以及模块要求的 JSON backup"],"limits":["仅支持 Foundry 14.364 与 dnd5e 5.3.3；MIDI-QOL 14.0.11 和 DAE 14.0.12 是推荐依赖而非硬依赖","不会自动 ready 扫描 Actor；不修改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags","旧安装替换及角色迁移包含备份行为，与本项目无备份规则冲突。当前仅介绍已安装内容的使用和只读 Preview；执行这些旧写入流程前须先处理冲突，不能用隐藏副本绕过。","这是构建快照，不实时同步远程 homebrew、旧 side-data 或 Actor 变化；本地静态检查不等于真实游戏性验收"],"keywords":["Blood Hunter","血猎手","职业","子职","迁移","Actor","Activity","Effect"],"sources":["foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md","README.md"],"watch":["foundry-modules/fvtt-blood-hunter-2024/"],"module":"fvtt-blood-hunter-2024"},{"id":"fvtt-homebrew-species","title":"自制种族内容","category":"library","summary":"提供 accepted homebrew Species 的纯内容 Item 合集；V14 是运行目标，V12 产物只作为明确标记的静态候选。","when":"需要在精确 dnd5e v14 世界浏览或使用已接受的自制种族与种族特性时使用；V12 仅用于静态审阅。","requires":["Foundry VTT 14.364 + dnd5e 5.3.3（运行包）","Foundry VTT 12.331 + dnd5e 4.3.9 + 2024 规则（仅 V12 static candidate）"],"steps":[{"title":"启用 V14 内容包","text":"在 Foundry 14.364 / dnd5e 5.3.3 世界启用模块，打开 Compendium 目录确认“Homebrew Species / 自制种族”和“Species Features / 种族特性”两个 Item pack 可读。"},{"title":"浏览种族与特性","text":"在两个 Item pack 中查看 Species 和 features；这是 content-only 模块，没有浏览器 JavaScript、socket、设置菜单、自动迁移或世界扫描。"},{"title":"按系统流程使用","text":"在 dnd5e 角色卡使用 Add Species（添加种族）流程，选择本模块的种族条目，再按提示应用特性。已授予角色的特性是快照，更新合集不会自动替换。"},{"title":"检查 V12 静态候选","text":"维护者需要 V12 候选时可运行下面的构建命令；构建会写入 dist/v12-candidate，不能称为只读操作。它不调用安装器，也不证明 V12 角色流程可用。","command":"bun run build:homebrew-species:v12-candidate"},{"title":"核对 V14 构建","text":"维护者可从仓库根目录运行 V14 构建检查；ledger、Markdown 和 target hash 任一过期都会 fail-closed。","command":"bun run build:homebrew-species"}],"outputs":["species Item pack 和 features Item pack","V14 target-specific 的文档、UUID、logical hash、coverage ledger 与确定性 ZIP","V12/12.331 candidate 构建及 supportStatus: static-candidate 身份标记"],"limits":["V14 产物精确绑定 Foundry 14.364 / dnd5e 5.3.3；V12 候选精确绑定 Foundry 12.331 / dnd5e 4.3.9 / Core / 2024","V12 candidate build/verify 不调用安装器，也不证明 Add Species、升级、HP/AC、次数、Long Rest 或重开读回","没有浏览器运行时、socket、自动迁移和世界扫描；ItemGrant 依赖本模块 features pack，已嵌入 Actor 的 Feature 不会自动更新","ledger、Markdown、package 或 target hash 过期时拒绝构建；静态构建与 LevelDB 校验不等于 Foundry runtime、生产或长期跑团验收"],"keywords":["自制种族","Species","种族特性","Compendium","ItemGrant","V14","V12 candidate"],"sources":["foundry-modules/fvtt-homebrew-species/README.zh-CN.md"],"watch":["foundry-modules/fvtt-homebrew-species/"],"module":"fvtt-homebrew-species"},{"id":"fvtt-house-rules","title":"本团村规","category":"play","summary":"以显式标签和 GM 权威为前提，提供治疗药水、生命骰、弹药、隐匿和自然 1/重击等村规辅助。","when":"希望把本团约定接入 dnd5e 原生骰子、Activity、状态和 Document API，同时保留 GM 裁定时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","活动 GM","药水和弹药上的显式 fvtt-house-rules flags（使用对应功能时）"],"steps":[{"title":"启用并确认默认状态","text":"在精确支持版本的世界中启用模块并重新加载；首次提示说明所有会修改数据的规则默认关闭。"},{"title":"由 GM 配置规则","text":"在 Foundry“配置设置 → 模块设置”中逐项启用需要的功能，并设置低属性阈值、自然 1 后果倍率/其他 RollTable UUID 和隐匿全速等级；这些世界设置只有 GM 可改。"},{"title":"准备显式标签","text":"在 Item 数据中使用 flags.fvtt-house-rules.potion 或 flags.fvtt-house-rules.ammo 写明药水骰、弹药 key 和 tier（0–3）。模块不从中文或英文名称猜测药水、弹药、武器或特性。"},{"title":"在跑团中调用助手","text":"使用 game.fvttHouseRules 的 GM API 或对应原生事件处理药水 preview/apply/restore、生命骰赌博、弹药记录/找回、隐匿提示和自然 1 后果；GM-only 卡片确认前不会执行伤害、反击或武器损坏。"},{"title":"运行规则检查","text":"维护者从仓库根目录运行模块测试；通过只代表规则投影与构建层检查，真实 Foundry 多客户端语义仍需单独回放。","command":"bun run test:house-rules"}],"outputs":["显式模块 flags、幂等事务 ledger 和 GM 世界设置","治疗药水的三个原生 heal Activity、生命骰与弹药账本、隐匿提醒","GM 确认的自然 1 后果卡和支持路径中的重击首颗伤害骰按满值投影"],"limits":["仅支持 Foundry 14.364 与 dnd5e 5.3.3；所有修改由确定性的活动 GM 执行","缺少显式标签、来源不唯一、对象无权限或版本不精确时失败关闭；不会按名称猜测或扫描全世界","MIDI-QOL 14.0.11、DAE 14.0.12 和 Die So Nice 6.2.9 的扩展路径只在精确版本组合下使用，其他组合保持原生或失败关闭","弹药找回、自然 1 后果、武器修复和重击适配都不自动代替 GM 裁定；盲骰原始面值不写入模块 flags、消息或审计摘要"],"keywords":["村规","治疗药水","生命骰","弹药","隐匿","自然 1","重击","GM"],"sources":["foundry-modules/fvtt-house-rules/README.zh-CN.md"],"watch":["foundry-modules/fvtt-house-rules/"],"module":"fvtt-house-rules"},{"id":"fvtt-injury-fading-spirits","title":"伤势与消逝的灵魂","category":"play","summary":"以活动 GM 为权威管理 0–3 层伤势、死亡豁免扩展和 Critical Role 风格的消逝灵魂复活流程。","when":"跑团需要把倒地、恢复、伤势、复活仪式和 GM 裁定记录到 Actor 长期状态时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","活动 GM","要管理的 character Actor 或其 Token"],"steps":[{"title":"启用并配置","text":"在精确支持版本的世界启用模块；在“配置设置 → 模块设置”中启用“伤势与消逝灵魂自动化”，按需选择是否管理 NPC。首次设置提示不会自动打开修改功能。"},{"title":"打开 Actor 面板","text":"GM 可在 Actor 目录条目上右键选择“伤势与消逝的灵魂”，或先选中 Token 后在聊天输入 /ifs；模块只读取明确选择的 Actor，玩家入口会转交活动 GM 验权。"},{"title":"调整或观察伤势","text":"在面板设置 0–3 层伤势，或在 Token 状态列表中左键增加、右键减少。Token Action HUD 显示当前层数，例如 1/3。模块还会观察 HP 归零、首次恢复正 HP、成功短休/长休和死亡豁免事件，并把状态投影到 Actor flag、Active Effect 和 Token 图标。"},{"title":"开始复活仪式","text":"在复活仪式向导选择普通、最终、快速或 9 环/奇迹模式；普通/最终仪式最多填写三名不同参与者的 Actor UUID、技能、可选属性覆盖、DC 10–20 和优势状态，快速复活填写施法关键属性调整值。"},{"title":"由 GM 结算","text":"在待处理仪式卡片或面板中查看原生关联检定，逐项确认贡献成功/失败和灵魂是否愿意回归，再结算仪式。成功只记录回归和下一次恢复保护；实际 HP 恢复仍由对应法术或 Activity 完成。"},{"title":"联动自定义状态与事件引擎","text":"启用 Custom Conditions 后可从其管理器查看或调整伤势。伤势名称、现成图标和层数角标统一显示；Token Action HUD 的完整悬停说明使用 dnd5e 规则卡布局，将倒地与叠层、第三层 GM 裁定、清除方式及死亡豁免自然 19/20 分为四段。图标作者和 CC BY 3.0 许可见模块包内 CREDITS.md。自动化来源可选择内部 Hooks 或外部 Trigger Engine；外部来源缺失时提示错误，不会双重执行或静默切回。仪式提醒只通知活动 GM 选择打开向导，不自动掷骰或认定灵魂意愿。"}],"outputs":["Actor flags 中的伤势、复活尝试、锁定和历史状态","伤势 Active Effect、Token HUD 分层状态、死亡豁免自然 19/20 处理","复活贡献请求、GM-only 结算卡和不含盲骰原始面的审计摘要"],"limits":["仅支持 Foundry 14.364 与 dnd5e 5.3.3；长期状态只有活动 GM 写入","三层伤势时先让 GM 选择，不会预写死亡；直接死亡、环境例外、灵魂意愿和贡献结果都保留 GM 确认","不依赖 MIDI-QOL、DAE 或其他村规模块；外部复活 Activity 若直接恢复 HP，应由活动 GM 使用公开 suppression API 包裹事务","ChatMessage 只是交互投影，不是历史事实来源；自动测试和本地 Lab 不能代替 GM/玩家多客户端或长期跑团验收","HP 归零仅表示倒地；仪式提醒须额外满足明确死亡条件。Custom Conditions 不复制伤势 flags，不接管复活状态机。"],"keywords":["伤势","消逝的灵魂","复活","死亡豁免","倒地","Actor flag","活动 GM"],"sources":["foundry-modules/fvtt-injury-fading-spirits/README.zh-CN.md","foundry-modules/fvtt-injury-fading-spirits/CREDITS.md","docs/reviews/2026-09-22-condition-hud-localization.md","docs/reviews/2026-09-23-existing-condition-icons.md","docs/reviews/2026-09-23-condition-tooltip-native-layout.md"],"watch":["foundry-modules/fvtt-injury-fading-spirits/"],"module":"fvtt-injury-fading-spirits"},{"id":"fvtt-trigger-engine","title":"Trigger Engine / 通用触发器引擎","category":"play","summary":"由活动 GM 执行的通用 Actor 更新、回合开始和回合结束事件引擎；把稳定的 before/after 上下文交给宏或其他模块。","when":"需要把“什么时候触发”从具体规则模块中拆出来，用配置组合 Actor 更新、Combat 回合事件、结构化条件和现有宏时使用。具体状态规则由独立模块拥有。","requires":["Foundry VTT 14.364","dnd5e 5.3.3 测试目标","活动 GM","每个 Run Macro 动作对应的世界 Macro UUID","需要消费事件的模块通过 fvtt-trigger-engine.api.subscribe(listener) 接入"],"steps":[{"title":"打开 Trigger Manager","text":"以 GM 启用模块后，在模块设置中打开 Trigger Manager。配置保存在 world setting 中，读取和写入都会校验 schema；无效触发器不会进入运行时。"},{"title":"定义 Actor 或 Combat 事件","text":"新建触发器，选择 Document Update / Actor，并填写需要观察的 watched paths，例如 system.attributes.hp.value。路径匹配同时识别点路径、嵌套对象以及父子路径相关更新。"},{"title":"选择回合生命周期","text":"Combat Turn Start 和 Combat Turn End 不需要 watched paths。它们只在正向 Combat 生命周期中发出，并以 Combat、回合和 combatant 上下文交给 active GM。"},{"title":"组合结构化条件","text":"条件组选择 ALL 或 ANY；每项从 before 路径、after 路径或 literal 取值，再使用 eq、ne、gt、gte、lt、lte 比较。v1 不执行任意 JavaScript 条件。"},{"title":"添加 Run Macro 动作","text":"为动作填写 Macro UUID。命中后活动 GM 按顺序执行宏，并通过 macro.execute({ triggerContext }) 传入触发器 ID、Actor、before、after、changes、userId、时间戳与安全回写入口 updateDocument(changes, options?)。宏若要回写当前 Actor，应使用这个入口保留因果链。单个触发器内动作失败会停止该触发器剩余动作，其他触发器仍可继续。"},{"title":"接入其他模块","text":"需要消费通用事件的模块通过 fvtt-trigger-engine.api.subscribe(listener) 接入，按事件类型和文档类型筛选；Trigger Engine 不导入消费者的私有实现。"}],"outputs":["world setting 中经过校验的 TriggerDefinition 列表","Actor 更新时稳定的 before / after / changes TriggerContext","由确定性活动 GM 顺序执行的 Macro 动作"],"limits":["当前 Document Update、Combat Turn Start 和 Combat Turn End 都只支持 Actor 文档；schema 保留 documentType 以便后续扩展","v1 只有结构化 ALL/ANY 比较条件与 Run Macro 动作，不提供任意 JavaScript 条件、Convenient Effects 或 Effect Macro 依赖","执行权限定为确定性活动 GM，避免多客户端重复写入；同一 Actor 的独立更新按观察顺序排队并保留各自 before/after；宏回写当前 Actor 时通过 triggerContext.updateDocument 显式携带完整祖先因果链，链上已出现的触发器会被跳过，且不会覆盖共享 Actor.update；world setting 广播会刷新各客户端运行时缓存","本地测试和构建只能证明配置、求值和调用契约；真实世界中的宏副作用仍需在精确 Foundry 版本中单独验收"],"keywords":["Trigger","触发器","Document Update","Actor","Macro","before","after","自动化"],"sources":["foundry-modules/fvtt-trigger-engine/README.zh-CN.md","docs/runbooks/custom-conditions-and-trigger-engine-usage.md"],"watch":["foundry-modules/fvtt-trigger-engine/"],"module":"fvtt-trigger-engine"},{"id":"fvtt-custom-conditions","title":"Custom Conditions / 自定义状态","category":"play","summary":"在 Foundry 内直接施加、编辑、停用和解除 19 个自定义状态，并以统一实例参数自动结算流血、灼烧等动态规则。","when":"需要把 Monsters of Drakkenheim 的自定义状态放进 Actor 或物品模板，并希望日常调整骰式、DC、伤害类型和解除方式时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM / active GM","已安装并启用 fvtt-trigger-engine"],"steps":[{"title":"启用两个模块","text":"在精确支持版本的世界启用 Trigger Engine 和 Custom Conditions。Custom Conditions 通过 Trigger Engine 的公开事件接口接收 Actor 更新、回合开始和回合结束。"},{"title":"打开状态管理器","text":"以 GM 选中或标记 Token，从模块设置或 Token 控制栏打开“管理自定义状态”。面板可以对目标施加、编辑、停用和解除状态。"},{"title":"填写状态实例参数","text":"骰式来自施加状态的特性。Bleeding 与 Burning 跨来源只采用较高值，以骰式平均值比较，平手保留现有值；Burning 的伤害类型跟随胜出者。两者默认在自身回合结束时结算。Frozen 使用 escapeDC；Jinxed 与 Valor 使用各自骰式；Token Action HUD 以 6、4 等数字显示 1d6、1d4 的骰子面数，复合骰式显示紧凑式，过长时角标截短，完整式在管理器可查，不代表掷骰结果。"},{"title":"使用生成的物品模板","text":"生成器会在物品 ActiveEffect 中写入 flags.fvtt-custom-conditions.condition 模板。施加模板后模块生成新的 Actor 实例 ID，手工施加和生成来源使用同一套 schema。"},{"title":"用动作尝试解除 Frozen","text":"点击 Frozen 行的“破冰（动作）”按该实例 DC 做力量（运动）检定。默认由目标自己尝试；标记目标并另选中一名生物即可协助，GM 确认接触范围。完成检定后消耗动作，成功解除；取消不消耗。"},{"title":"阅读状态说明与管理伤势","text":"状态名称和悬停说明随 Foundry 界面语言显示中文或英文。Token Action HUD 的完整提示采用 dnd5e 规则卡布局，标题、状态类别与分段正文分开，图标保留在 HUD 按钮；仅名称和无提示模式仍由 TAH 设置控制。十九种自定义实例各采用选定的 Game-icons.net SVG；笨拙用 Drop Weapon，踉跄用 Foot Trip，署名和 CC BY 3.0 许可见模块包内 CREDITS.md。全部 19 项使用 fvtt-custom-conditions.\u003c条件 ID> 独立状态 ID；自定义 Dazed 的 HUD 标题只显示恍惚或 Dazed，仍与 MCDM 同名状态分开。五个必填参数状态点击后打开绑定当前 Actor、预选状态的管理器，其余十四项通过 Custom Conditions API 切换带模块 flag 的实例；Frozen 和 Shocked 的子状态由复合来源提供时不重复创建，多来源在管理器中处理。启用伤势模块时，可在同一管理器调整伤势层数或进入消逝的灵魂仪式，原有伤势与复活历史仍保存在伤势模块。"},{"title":"判读几个容易混淆的状态","text":"本模块的恍惚在自己的回合可从自主移动、动作、附赠动作中选择一种；选定后不能再执行另两种，但不额外禁止反应。震愕继承恍惚的三选一规则，同时使针对目标的攻击检定有优势、掉落手持物品；拿取、拔出或收起物品仍需要动作。三选一是本项目按用户决定调整的规则，不宣称为 Drakkenheim 正式文本。Frozen 的特殊重击限于使用造成钝击伤害的武器命中目标；不是任意钝击法术或普通徒手打击。英勇在攻击检定或豁免检定时加上实例骰值，厄运减去骰值；虚弱使武器攻击或法术伤害总值减半，实际应用到 HP 时向下取整，聊天表达式仍可能出现小数。踉跄在自己的回合最多完成一次武器或徒手攻击；加入徒手是本项目相对可公开核对的 Beta 文本所作扩展，正式版 Appendix C 尚未逐条核对。"},{"title":"区分原生状态与自定义入口","text":"选中单个 Token 后展开 Token Action HUD 的效应组：dnd5e 原生「失血」是裸 bleeding，本模块「流血」是 fvtt-custom-conditions.bleeding；原生「燃烧」是裸 burning，本模块「灼烧」是 fvtt-custom-conditions.burning。GM 点击流血、灼烧、冻结、厄运或英勇只会打开固定该 Actor、预选对应状态的管理器，不会直接施加空参数状态；填写必填骰式、伤害类型或解除 DC 后再施加。其余十四项使用模块 API 切换。本轮 CoTN 页面已确认十九个自定义入口各显示一次，也确认点击流血打开绑定 Actor、预选流血的空参数管理器；其余按钮尚未逐项点击或结算。旧 TAH 布局的 action ID 隐藏和排序偏好不保证自动迁移。"}],"outputs":["Actor 上带参数的 Custom Conditions ActiveEffect 实例","物品上的可重复使用 Condition 模板","由 active GM 和 Combat 事件驱动的流血、灼烧等结算"],"limits":["本期包含 Addled、Bewildered、Bleeding、Burning、Clumsy、Dazed、Defenseless、Distracted、Enfeebled、Frozen、Helpless、Immobilized、Jinxed、Shocked、Sickened、Slowed、Staggered、Valor 和 Weakened","Bloodied 使用 dnd5e/FVTT 原生能力；Drakkenheim Madness 与 Contamination 不在本期目录","距离、环境和坠落落点由 GM 结合地图裁定；模块不会把不明确的来源规则猜成自动化","Immobilized/Frozen 拦截拖拽、方向键以及非 GM 的 HUD/配置位置编辑；GM 坐标编辑和 API 强制位移保留用于裁定，不消耗 Dazed 自主移动选择","恍惚／震愕三选一的普通顺序行为由回合旗标拦截；攻击异常或后续 Hook 否决可能保守限制到回合结束。跨客户端同时控制同一 Actor、两个非攻击活动弹窗交错完成尚未保证严格互斥","CoTN 原模组组合验收复用常驻 server-mirror 的 cor-cotn 世界、端口 30001；历史 fvtt-v14-module-matrix 隔离 E2E 不能替代该组合验收。键盘长按受工具能力限制未验收","构建、单测和安装 hash 不能代替 Foundry v14.364 中的真实 UI、Combat、ActiveEffect 和骰式运行时验收","自定义名称保持原样；更改界面语言后重载。原生失血/燃烧按钮不等于已配置骰式的自定义流血/灼烧。CoTN 的全 19 项入口可见性已单独验收；其余 18 项点击及本轮逐项玩法结算未执行，构建或单测不替代该结果。"],"keywords":["Custom Conditions","自定义状态","Bleeding","Burning","Frozen","Jinxed","Valor","ActiveEffect","参数化"],"sources":["foundry-modules/fvtt-custom-conditions/README.zh-CN.md","foundry-modules/fvtt-custom-conditions/CREDITS.md","docs/runbooks/custom-conditions-and-trigger-engine-usage.md","docs/reviews/2026-09-22-condition-hud-localization.md","docs/reviews/2026-09-23-existing-condition-icons.md","docs/reviews/2026-09-23-condition-tooltip-native-layout.md","docs/reviews/2026-09-23-drakkenheim-condition-wording.md","docs/reviews/2026-09-23-cotn-burning-hud.md","docs/reviews/2026-09-24-custom-burning-hud.md","docs/reviews/2026-09-24-all-custom-condition-hud-audit.md"],"watch":["foundry-modules/fvtt-custom-conditions/"],"module":"fvtt-custom-conditions"},{"id":"fvtt-json-forge","title":"FVTT JSON Forge","category":"convert","summary":"在Foundry内生成并审核Actor/Item，或由人类MD提取多生物与固定自动化配置，导入后明确启用。","when":"已经打开 Foundry，希望直接把结构化资料或原始文本整理成世界中的 Actor/Item 时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM","结构化 Actor/Item 来源，或已完成审阅的 Intake 结果","AI 模式的客户端 Provider、协议、模型和 API Key（仅使用 AI 时）"],"steps":[{"title":"启用并打开三个入口","text":"在精确支持版本的世界启用模块；GM 在“配置设置 → 模块设置”中会看到 Forge Actor、Forge Item 和 Forge Intake 三个入口。非 GM、版本不符或 ApplicationV2 不可用时不会创建世界文档。"},{"title":"生成 Actor","text":"在 Forge Actor 中粘贴或导入结构化 Actor 来源，填写显示名称并完成生成。先阅读预览、来源、验证状态和诊断，只有通过检查的 accepted 结果才允许创建。"},{"title":"生成 Item","text":"在 Forge Item 中提交单一、受支持的结构化物品来源，核对预览后创建或复用世界物品。这个入口不会替你修改角色卡。"},{"title":"审阅 Intake","text":"在 Forge Intake 选择 plaintext-actor、ai-monster 或 ai-item；Analyze 只建立来源证据，Generate Candidate 后还必须同时通过 formal verification 和 review，最后由 GM 点击 Confirm Create。"},{"title":"管理复查与批量队列","text":"在 Forge Intake 管理来源库、审查包、混合 Actor/Item 合集与批量队列。历史 accepted 记录需显式开启新尝试；队列一次运行一项。刷新或关闭页面会中断任务，不会自动重发 AI 请求。"},{"title":"从人类写法MD生成战斗包","text":"读取包含2至6种生物完整数据与召唤规则的MD。AI提取生物及固定能力参数，工具生成控制入口；核对后一起导入并明确启用。已启用固定配置在刷新时恢复，可在控制面板停用。"}],"outputs":["带 Forge source/artifact identity 的 Foundry Actor 或 world Item，以及创建后的 readback 结果","正式验证、审阅、诊断、来源库、Collection 和可恢复队列数据","按 sourceId 派生的确定性 Document ID 和重复复用状态","人类MD路径可生成多个独立Actor、一份绑定宏及来源审核记录；每次召唤在场景中创建独立指示物。"],"limits":["只支持 Foundry 14.364 / dnd5e 5.3.3 / core profile，且所有创建入口只允许 GM","不支持 OCR、PDF、图片 Intake、update/overwrite、按名称合并、embedded Item 产品入口或跨 Document 原子事务","API Key 默认只在当前页面内存，显式持久化时也只写当前浏览器 local storage；不会进入世界 Document、Chat、review bundle、Collection、日志或响应","页面关闭后不会继续 AI/HTTP；本地构建或 Lab 结果不等于目标世界 runtime、生产或四小时真实会话验收","AI不编写宏代码。固定入口仅调用模块内已实现能力；旧式脚本包仍需独立代码审核。导入不自动启用，关闭控制面板也不等于停用。","0.3.0为未发布候选。本地Intake默认DS API deepseek-flash（V4.1 Flash），不转送其他Provider凭据；非本地保留原连接选择。","本地已测守护真实减伤和耗尽削弱；重复腐化证据部分通过，按用户决定留待独立状态设计。Dazed修复专项和浏览器完整AI生成链尚未复验。","人类MD模板可用于不同生物；自动化仅限已实现能力形态，不保证任意召唤数量、触发或机制均支持。","Actor蓝图保留来源HP；场上NPC Token重掷HP遵从世界设置，控制器不覆盖。已有其他来源的启用状态不由控制器接管或提前结束。"],"keywords":["Forge","Actor","Item","Intake","structured","review","accepted","readback"],"sources":["foundry-modules/fvtt-json-forge/README.zh-CN.md","tools/forge-encounter/README.md"],"watch":["foundry-modules/fvtt-json-forge/"],"module":"fvtt-json-forge"},{"id":"fvtt-selected-token-sync","title":"框选 Token 同步","category":"play","summary":"把一个 Token HUD 发起的核心状态和 Foundry v14 movementAction 同步到当前选中的其他 Token。","when":"需要对一组 Token 同时切换状态或移动方式，并希望保留每位用户独立的开关时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","至少两个可控制且可更新的 Token","当前用户拥有对应 Actor/Token 权限"],"steps":[{"title":"启用模块","text":"在精确支持版本的世界启用 Selected Token Sync；模块不会要求 libWrapper，也不修改 Foundry 或 dnd5e 原型。"},{"title":"打开同步开关","text":"在 Token 场景控制栏打开“框选 Token 同步”。这是每位用户独立保存的 client setting，默认关闭；开关打开时模块会拒绝与已启用的 multistatus 同时工作。"},{"title":"框选同步集合","text":"在画布上选中需要同步的多个 Token；模块以点击 HUD 时的选择为准，并对同一个 linked Actor 去重。"},{"title":"从一个 HUD 发起操作","text":"打开选中集合中一个 Token 的 HUD，点击核心状态图标或 movementAction（walk、fly、swim、burrow、crawl、climb 或默认）。状态、overlay 和移动方式会复制到其余合格 Token。"},{"title":"关闭并核对字段","text":"再次关闭工具栏开关即可恢复单 Token 行为；选择“默认”时核对 TokenDocument 的 movementAction 为 null，Actor 的 system.attributes.movement.walk 等速度字段不会被改写。"}],"outputs":["选中 Token 的核心 Active Effect 状态和 overlay 同步","选中 Token 的 movementAction 批量更新","按 Token/Actor 去重并带权限失败提示的同步事务"],"limits":["仅处理 Token HUD 核心状态按钮和 v14 movementAction；物品、法术、DAE、MIDI-QOL 或其他模块直接产生的 ActiveEffect 不会触发同步","只更新 TokenDocument movementAction，不修改 Actor 移动速度或 Actor system 字段","同步由发起操作的当前客户端执行，权限不足或对象不唯一时会停止；multistatus 启用时模块会拒绝同步模式","仅支持 Foundry 14.364 与 dnd5e 5.3.3；单测、构建和安装检查不代替真实 HUD/多客户端回放"],"keywords":["Token","HUD","框选","状态","overlay","movementAction","multistatus"],"sources":["foundry-modules/fvtt-selected-token-sync/README.zh-CN.md"],"watch":["foundry-modules/fvtt-selected-token-sync/"],"module":"fvtt-selected-token-sync"},{"id":"monster-spell-resolver","title":"怪物法术解析器","category":"convert","summary":"读取生成 Actor 的可移植法术清单，在目标世界可读的 dnd5e Item pack 中选择法术，并安全水合模块拥有的 Spell 与 Cast Activity。","when":"生成 Actor 已携带有效 spell manifest，需要把便携法术引用解析到当前世界的具体法术资料包时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM/活动 GM 权威","带有效 spellManifest 的生成 Actor","至少一个已启用且可读取的目标世界 dnd5e Item 法术包"],"steps":[{"title":"启用并等待来源索引","text":"在精确支持版本的世界启用模块；世界 ready 时模块读取已启用且可读的 Item pack 并建立来源索引。来源不可读、规则元数据无效或运行时不兼容时保持禁止写入。"},{"title":"配置来源优先级","text":"在“游戏设置 → 模块设置”打开“目标世界法术解析器”，按包 ID/合集 ID 调整来源顺序，查看 2024/2014 计数和诊断，并在来源变化后点击“重建来源索引”。"},{"title":"解析带清单的 Actor","text":"在带有效 spellManifest 的 Actor 目录条目中使用标题栏或右键菜单的“解析或重新解析法术”；创建或更新这类 Actor 时也可能由模块排队处理。普通无 manifest Actor 不会被扫描。"},{"title":"处理人工检查","text":"若出现法术解析检查窗口，选择一个具体目标法术来源；对模块管理内容的人工修改逐项选择“保留人工修改”或“用生成内容覆盖”，关闭窗口等同取消。"},{"title":"查看结果与回退","text":"从同一 Actor 菜单查看解析报告、来源、导出诊断或撤销上次水合；状态为 hydrated 只表示模块拥有缓存投影已完成，原生 Cast 的攻击、豁免、目标、消耗仍需单独使用验证。"}],"outputs":["Actor 内模块拥有的 embedded Spell 和与生成 feature 关联的 Cast Activity","spellResolution 状态、来源选择、投影差异、报告和撤销快照","目标世界来源索引的包信息、规则计数、哈希和阻断诊断"],"limits":["仅支持 Foundry 14.364 与 dnd5e 5.3.3；只有有效便携 manifest 的 Actor 才有资格处理","只修改模块拥有的 embedded Spells 和明确关联的 Cast Activities，不按名称扫描全世界，不修改 Compendium、Foundry/dnd5e 原型或生成阶段 manifest","水合按 Actor 全有或全无执行，中途失败尝试补偿回滚；人工 Keep/Overwrite/Cancel 未完成时不会 Apply","portable/static manifest、目标世界 hydration、native Cast runtime 和生产接受是不同层级；单测、build 或 hydration 成功不能替代后两层"],"keywords":["怪物","法术","spell manifest","水合","Cast Activity","2024","2014","来源索引"],"sources":["foundry-modules/monster-spell-resolver/README.zh-CN.md"],"watch":["foundry-modules/monster-spell-resolver/"],"module":"monster-spell-resolver"},{"id":"open-session-deck","title":"开放式跑团副屏","category":"play","summary":"GM-only 的队伍与遭遇工作台，可在 Foundry 主窗口或同会话浏览器副屏查看并处理跑团状态。","when":"GM 需要第二块显示器上的队伍、遭遇、先攻和回合操作，同时不想启动第二个 Foundry 客户端时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM","用于队伍来源的世界级 Actor 文件夹","允许浏览器打开同会话弹窗（使用副屏时）"],"steps":[{"title":"启用并确认 GM 入口","text":"在精确支持版本的世界启用模块并以 GM 进入；Token 场景控制栏会出现“开放式跑团副屏”按钮，模块也注册 GM-only 的 toggleDeck 快捷键。"},{"title":"打开工作台","text":"点击 Token 控制栏的表格图标打开上次使用的面板或副屏模式；如果弹窗被浏览器阻止，模块会回退到 Foundry 内面板。"},{"title":"设置队伍来源","text":"在工作台的队伍设置层选择世界级 Actor 文件夹，并决定是否包含子文件夹；保存后成员和临时同行 NPC 会按文件夹重新计算。"},{"title":"处理队伍与遭遇","text":"在队伍/遭遇页查看当前、基础和临时 HP、AC 修正、激励、力竭、状态、专注和死亡豁免；GM 可批量处理 HP 与显式状态、编辑/交换小数先攻、投掷缺失 NPC 先攻、切换回合和定位主画布 Token。"},{"title":"使用同会话副屏","text":"点击打开副屏后将窗口移到第二显示器；它由 GM 已登录会话渲染，关闭副屏或切回面板不会创建第二个世界连接。"}],"outputs":["Foundry 内 ApplicationV2 队伍/遭遇面板","同会话浏览器 popout 的队伍占位、NPC 操作卡和回合信息","通过原生 dnd5e Actor、Token 和 Combat API 完成的 GM 状态更新"],"limits":["仅支持 Foundry 14.364 与 dnd5e 5.3.3，所有 UI 入口和命令都重新检查 GM 权限","玩家先攻隐藏只是界面呈现，不保证对检查客户端文档数据的玩家保密","副屏不加载第二个 Foundry world URL、Canvas、登录页或模块 socket；不提供独立玩家面板、行动自动化、第二张地图、AI 或自定义网络协议","构建、安装 hash 和单测是机械证据；真实 GM/玩家运行与视觉验收仍需在精确版本中单独完成"],"keywords":["跑团副屏","队伍","遭遇","先攻","HP","Combat Tracker","GM"],"sources":["foundry-modules/open-session-deck/README.zh-CN.md"],"watch":["foundry-modules/open-session-deck/"],"module":"open-session-deck"},{"id":"session-monitor","title":"跑团会话监测器","category":"maintain","summary":"由 GM-only Foundry 模块和 Windows/Chrome companion 共同记录隐私过滤的浏览器、进程和生命周期排障时间线。","when":"需要定位跑团期间卡顿、renderer 变化、CDP 断连或浏览器内存信号时，先做短时或由用户亲自进行长时记录。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM","正常登录的 Foundry 世界","专用 Chrome profile 和可运行的 companion"],"steps":[{"title":"启用并确认 GM 面板","text":"在精确支持版本的世界启用模块并以 GM 进入；世界 ready 后页面会出现“跑团会话监测器”面板。玩家客户端不会启动监测运行时。"},{"title":"由用户启动 companion","text":"需要同时记录 Chrome/Windows 信号时，由用户从仓库根目录启动 companion；它只创建和管理自己的专用 Chrome profile，并等待 GM 正常登录，不读取日常浏览器凭据。","command":"bun run monitor:session -- record"},{"title":"开始记录","text":"在 GM 面板点击“开始”；模块建立 IndexedDB 会话并立即采样，companion 在没有 active session 时会通过模块 API 开始或续接同一 session ID。"},{"title":"标记卡顿","text":"记录期间遇到卡顿时点击“刚才卡顿”，或使用已注册但默认未绑定的 markJank GM 快捷键；关闭专用 Chrome 会被记录为下一代浏览器并尝试恢复同一会话。"},{"title":"停止并查看报告","text":"跑团记录结束后点击“停止并导出”或按 Ctrl+C 结束 companion；检查 browser-session.json、companion.jsonl、companion-events.jsonl、session-combined.json、report.md 和 heap-timeline.svg。"}],"outputs":["Foundry 模块导出的 browser-session.json","Chrome/Windows 采样、错误和浏览器/renderer 代际事件 JSONL","合并后的 session-combined.json、隐私过滤 report.md 和 heap-timeline.svg"],"limits":["仅支持 Foundry 14.364 与 dnd5e 5.3.3，v1 只在 GM 客户端运行；模块和 companion 只观察，不清缓存、不改设置、不删文档、不写 LevelDB","companion 只管理专用 Chrome profile，不接管日常 Chrome，不读取 Cookie、密码或浏览器凭据；GM 必须正常登录","单次会话最多 12 小时、4,320 个浏览器采样、10,000 个事件和 1,000 个错误，达到上限会标记 truncated 并安全停止","代理不启动、等待或拼接超过 30 分钟的监测；四小时真实跑团和非 GM 设备证据由用户完成，指标相关性不等于因果证明"],"keywords":["跑团","会话监测","卡顿","Chrome","CDP","renderer","heap","隐私"],"sources":["foundry-modules/session-monitor/README.zh-CN.md"],"watch":["foundry-modules/session-monitor/"],"module":"session-monitor"}],"reviews":{"web-workbench":{"fingerprint":"48bcc04dcc1ecea8b1a474f7b8e6773850e464c1c5becf108afd4088281f6827","reviewedOn":"2026-09-12","note":"对照 CLI 参数、Web 与 Intake 文档，区分文本和 OCR 链路、目标版本、来源验证与运行时边界"},"markdown-convert":{"fingerprint":"6d7717a78370fd4c91cb3af95b202c138978146ed3e98352981ebe1ef6cea3ce","reviewedOn":"2026-09-24","note":"已对照自定义恍惚/震愕三选一规则、生成模板说明及CoTN原组合边界：生成器只输出新描述和状态模板，Trigger Engine事件接口未变；Custom Conditions记录附赠动作并让震愕继承，攻击异步预约与未验收并发限制已写明。"},"monster-intake":{"fingerprint":"bc2be1fd07ee2abb6e691ece56b86be881807de6f36bdb7433e8b192d6d882ce","reviewedOn":"2026-09-15","note":"最终合并核对：区域模板仅保留来源明确投放距离；结构化uses验证次数周期消费且不误伤充能。共享入口及版本未变；工具说明保留通用能力边界和腐化延期，未宣称新的Lab验收"},"item-intake":{"fingerprint":"d8be6f75a1c84adb4c070059edcae117d9f117e214281171ea920307444b3306","reviewedOn":"2026-09-15","note":"最终合并核对：区域模板仅保留来源明确投放距离；结构化uses验证次数周期消费且不误伤充能。共享入口及版本未变；工具说明保留通用能力边界和腐化延期，未宣称新的Lab验收"},"species-intake":{"finge oundry v14 | dnd5e 5.3.3 | `core`、`modded-v14` | 独立 5.3.3 投影器；运行时证据按验收报告限定 |\n\n`modded-v14` 当前锁定 MIDI-QOL 14.0.11 和 DAE 14.0.12；旧的 14.0.9 实机结果保留为历史证据，不能自动升级为 14.0.11 的运行时验收。完整生产模组集合整体兼容性状态仍是 **Partial**。详见 [`docs/acceptance/current-support-matrix.md`](docs/acceptance/current-support-matrix.md)。\n\nActor、Item、单文件、合集、Vault Sync、CLI 和 Web Job 共享 `parse → canonical IR → validate IR → target projector → validate output → write` 管线。诊断状态为 `failed` 或 `needs_review` 时不会写入正式 output；`core` profile 不包含 MIDI-QOL、DAE、Times Up 或 Item Macro 专属字段。\n\n## FVTT JSON Forge（Foundry 模块）\n\n`fvtt-json-forge` 是 A–E 统一交付的 GM-only 浏览器模块，锁定 Foundry `14.364` / dnd5e `5.3.3` / `core`。它提供 Actor、Item、证据优先 Intake、review bundle 恢复、当前浏览器/世界/GM scope 的 Source Library，以及 mixed Actor/Item Collection、标准 ZIP、concurrency-1 可恢复队列和 accepted-only 批量创建/readback。\n\n正式发行版通过 Foundry Setup 的 **Install Module** 安装，manifest URL 为：\n\n```text\nhttps://raw.githubusercontent.com/bill34345/fvttV12JsonGenerator/master/foundry-modules/fvtt-json-forge/src/module.json\n```\n\n模块不是任意 JSON 导入器：只有当前、完整、decoded 且 formal verification 与 review 均为 `accepted` 的结果可以写入世界。浏览器关闭或刷新会把运行中任务标记为 `interrupted`，不会在后台继续或自动重发可能计费的请求。详细安装、操作、数据与支持边界见 [`foundry-modules/fvtt-json-forge/README.zh-CN.md`](foundry-modules/fvtt-json-forge/README.zh-CN.md)。\n\n## 安装\n\n需要 [Bun](https://bun.sh/) 1.3 或兼容版本：\n\n```powershell\ncd I:\\OpenCode\\fvttV12JsonGenerator\nbun install --frozen-lockfile\nbun run cli:help\n```\n\n仓库中的 `data/cn.json`、`data/spells.ldb` 和 v12 golden master 为现有 v12 工作流提供映射与模板。v14 正常生成不需要完整的 dnd5e/Foundry 上游仓库。\n\n## 单文件转换\n\n默认生成 Foundry v12 core JSON：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example.json\"\n```\n\n显式生成 Foundry v14：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n需要锁定的 MIDI-QOL/DAE 自动化时使用：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example-v14-modded.json\" `\n  --fvtt-version 14 `\n  --effect-profile modded-v14\n```\n\n最终 Actor/Item JSON 必须由 CLI 或项目 workflow 生成；不要手工拼装或修补最终 JSON。\n\ndnd5e 4.3.9 Item 不再输出 legacy `system.activation` 或 `uses.value/uses.per`。迁移细节见 [`docs/migrations/2026-07-30-dnd5e-4.3.9-generation-schema.md`](docs/migrations/2026-07-30-dnd5e-4.3.9-generation-schema.md)。\n\n## v14 名称驱动图标\n\nv14 可以显式启用安全的名称驱动 Item 图标解析：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" `\n  --fvtt-version 14 `\n  --effect-profile core `\n  --icon-mode safe\n```\n\n`safe` 只使用锁定的 Foundry `14.364` 核心图标和 dnd5e `5.3.3` 图标。解析顺序为外部 override、已有有效图标、精确 Compendium 名称、带来源结构证据的高置信语义匹配、dnd5e 类型默认图标；低置信候选不会强行采用。生成结果旁会写入 `*.icon-review.json`，合集和 Vault Sync 会生成聚合 `icon-review.json`。\n\n可用 `--icon-overrides \u003cpath>` 指定独立 override 文件；Web 服务器只从 `FVTT_V14_ICON_OVERRIDES` 读取该服务器端路径。v12/v13 不接受 `safe`。\n\n本地人工审阅：\n\n```powershell\nbun run review:icons:v14 `\n  --report \"obsidian/dnd数据转fvttjson/output/example-v14.icon-review.json\" `\n  --output \".local/icon-review/example-v14.html\"\n```\n\n## Obsidian 工作流\n\n默认数据路径：\n\n```text\nobsidian/dnd数据转fvttjson/input\n  → parser / generator / workflow\n  → obsidian/dnd数据转fvttjson/output\n```\n\n批量增量同步：\n\n```powershell\nbun run sync:vault\n```\n\n同步会：\n\n- 处理 `input/` 中新增或变化的 Markdown；\n- 把生成 JSON 写入 `output/`；\n- 覆盖前把旧 JSON 放入 `output_backup/`；\n- 通过 `.fvtt-sync-manifest.json` 跳过未变化输入；\n- 在源文件删除后移除过期输出。\n\n纯文本 Item 合集可以先拆分到 `middle/items`，也可以在同一次项目工作流中推广 Markdown 并生成最终 JSON：\n\n```powershell\n# 只拆分中间 Markdown\nbun run src/index.ts --ingest-items \"path/to/items.md\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n\n# 生成 middle/items、input/items 和 output/items\nbun run src/index.ts --ingest-items-json \"path/to/items.md\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nItem 专用运行只处理本次推广的 Item 文件，不会顺带重生成或清理 vault 中其他 Actor 输出。\n\n## AI Item Intake（Foundry V14/core）\n\n原始 TXT 或格式不规则的 Item Markdown 使用正式 `--intake-items`，而不是旧的 `--ingest-items` / `--ingest-items-json`。它先由 AI 提取带原文位置的 Item IR，再由确定性规则验证证据、渲染项目 Markdown 的 `item-mechanics` 契约、走既有 Item generator，并逐项验证生成 JSON。AI 从不直接写最终 JSON；任一证据、法术唯一性或机制投影不成立都会停在 `needs_review` / `failed`，不会以空能力或 Utility Activity 退化。正式法术必须由 identifier 与英文名共同唯一命中锁定 dnd5e `5.3.3` 目录，且不使用角色法术位。\n\n```powershell\nbun run src/index.ts --intake-items \"path/to/raw-item.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n此入口只接受 Foundry `14.364` / dnd5e `5.3.3` / `core`。单次最多 50 个物品、200,000 个 UTF-16 字符。accepted 的 Markdown 和 JSON 分别推广到 vault `input/items/` 与 `output/items/`；完整来源、IR、诊断、审查与 provider 审计保留在 `.local/item-intake-runs/\u003crun-id>/`。恢复审查使用：\n\n```powershell\nbun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" `\n  --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\nItem Intake 与 Monster Intake 共用 `MONSTER_INTAKE_*` 的 provider/doctor 配置、凭据隔离和本机 OAuth bridge 边界；变量名是历史兼容名称，不表示 Item 会走旧的 Monster IR。完整机械契约、已验证范围和仍待运行时验收的边界见 [`docs/item-ai-intake-v14.md`](docs/item-ai-intake-v14.md)。\n\n## Species Intake 与累计种族模块（Foundry V14/core）\n\n不规则种族 TXT 或人工编辑后的规范 Species Markdown 使用 `--intake-species`。它建立独立的来源证据 IR、确定性 Species Markdown、原生 race/feat package 和 accepted ledger；复杂规则可以诚实保留为 `gm-assisted` / `external-rule`，但不能伪装成空 Utility 或任意 Effect。单个 TXT 最多包含 50 个候选。\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\n```\n\nIntake 成功不会自动重建模块；`build:homebrew-species` 是独立显式步骤。任何 accepted Markdown 编辑都会使 ledger hash stale，必须再次经 `--intake-species` 审查，未更新前模块 build 会拒绝。模块只有 `species` 与 `features` 两个 Item Compendium，无 runtime JavaScript 或世界扫描。完整契约、食人魔自动化边界与验收层级见 [`docs/species-ai-intake-v14.md`](docs/species-ai-intake-v14.md)。\n\n## AI 怪物资料整理（推荐）\n\n第一次拿到 TXT 或格式混乱的 Markdown 时，推荐让 AI 负责发现怪物边界与提取来源证据，再由项目确定性生成标准 Markdown 和 Actor JSON。AI 不直接写最终 JSON，任一证据、覆盖、投影或独立 review 门失败都会进入 `needs_review` 或 `failed`，不会静默回退旧转换器。\n\n配置专用环境变量，不会读取 `TRANSLATION_*` 或通用 `OPENAI_*`：\n\n```text\n# Repository/GitHub-safe default: use API key mode in committed configuration.\nMONSTER_INTAKE_AUTH_MODE=api-key\nMONSTER_INTAKE_API_KEY=\u003cprovider key>\nMONSTER_INTAKE_BASE_URL=https://api.openai.com/v1\nMONSTER_INTAKE_MODEL=\u003cextraction model>\nMONSTER_INTAKE_REVIEW_MODEL=\u003coptional reviewer model; defaults to extraction model>\nMONSTER_INTAKE_TIMEOUT_MS=60000\n```\n\nFor this machine only, put the following override in the ignored local `.env`; do not commit it. The bridge owns the OAuth token.\n\n```text\nMONSTER_INTAKE_AUTH_MODE=codex-oauth\nMONSTER_INTAKE_CODEX_OAUTH_BASE_URL=http://127.0.0.1:8787/v1\nMONSTER_INTAKE_CODEX_OAUTH_BRIDGE_TOKEN=codex-oauth-local\nMONSTER_INTAKE_MODEL=gpt-5.6-luna\nMONSTER_INTAKE_CODEX_OAUTH_REASONING_EFFORT=xhigh\n```\n\n这里的 `xhigh` 对应 Codex 界面里说的 `ultra`。不填写模型时，`codex-oauth` 模式也会默认使用 `gpt-5.6-luna`；这只是旧的本机兼容桥设置，不是网页的 Companion。Companion 留空时始终使用这台电脑当前 Codex CLI 的默认模型，不会偷偷填入 Luna。\n\n运行单只或合集：\n\n```powershell\nbun run src/index.ts `\n  --intake-monsters \"path/to/raw.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n`--dry-run` 只检查配置、输入限制并估算怪物数和最大调用数，不调用 AI、不推广文件。accepted Markdown 写入 vault `input/`，Actor JSON 由现有 workflow 写入 `output/`。若结果需要确认，审查包保存在 `.local/intake-runs/\u003crun-id>/`，可提交 decisions 后完整重跑：\n\n可以用下面的命令检查 Intake。API Key 模式只检查配置；Codex OAuth 模式还会检查本机桥接服务的 `/health`：\n\n```powershell\nbun run src/index.ts --intake-doctor\n```\n\nCodex OAuth 这里指“本机 OpenAI-compatible 兼容桥接服务”，不是把 Codex OAuth token 直接当成 OpenAI Platform API key。项目默认只允许连接 `127.0.0.1`、`localhost` 或 `::1`，桥接服务没有启动时会明确失败。模型列表没有列出 `gpt-5.6-luna` 时 doctor 会给出提示，但不会武断阻止首次 Intake 请求，因为部分桥会接受模型别名但不把它列在 `/v1/models` 中。该兼容层不是本项目内置的官方 OpenAI API 认证方式。\n\n```powershell\nbun run src/index.ts `\n  --resume-intake \".local/intake-runs/\u003crun-id>\" `\n  --decisions \".local/intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\n退出码：`0` 表示全部 accepted 或仅执行预览，`2` 表示至少一个候选 needs_review 且没有执行失败，`1` 表示存在 failed。TXT/MD 内容会发送到配置的 AI provider；密钥仅保留在服务端，日志不记录请求头、密钥或隐藏推理。Monster、Item 与 Species Intake 均最多处理 50 个候选、200,000 个 JavaScript UTF-16 字符；Item 与 Species 固定为 V14/core，精确边界见各自章节。三者都不支持图片/PDF OCR，也不承诺任意模型、任意文本都能自动通过。\n\n## 血猎手 2024 原生合集模块（Foundry v14）\n\n`fvtt-blood-hunter-2024` 锁定 Foundry `14.364` / dnd5e `5.3.3`，提供 `classes`、`subclasses`、`features` 三个原生 Item 合集。它不依赖 Plutonium 或旧 classpack；旧 `build-blood-hunter-homebrew` 仍只生成标记为 `plutonium-side-data` 的历史 side-data，不是该模块的权威内容。\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"C:\\absolute\\path\\blood-hunter-2024.activities.json\"\nbun run test:blood-hunter-v14\nbun run install:blood-hunter-v14 --apply\nbun run verify:blood-hunter-v14-install\n```\n\n构建严格校验锁定源 SHA-256、94 条 coverage ledger、117 个 Activities、稳定 UUID、Advancement 引用、三个 LevelDB packs、确定性 ZIP 以及 dnd5e `5.3.3` 的 12 个官方内容 UUID。安装只允许配置后的本地 Lab，拒绝生产路径、外来同名模块、链接路径和被占用的 Pack，并在替换既有自有模块前建立恢复备份。`verify-install` 只证明安装字节和 pack 内容一致，不代表真实 Foundry 运行时或线上生产验收。\n\n玩家从模块 `classes` 合集把“血猎手”拖入角色卡，再通过 dnd5e 原生 Advancement 升级和选择结社；已经复制到 Actor 的 Item 是快照，不会随模块更新实时同步。旧角色应使用模块中的 GM-only“血猎手 2024：角色迁移”执行 Preview、迁移副本验证，再决定是否应用原角色。完整构建、安装、迁移和自动化边界见 [`foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md`](foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md)。\n\n## Foundry 目标世界法术解析（v14）\n\n带法术清单的 AI Intake Actor 会保持便携：项目生成阶段只写入带来源证据的法术清单，并将状态标为 `pending`；不会写占位 Spell、世界内 UUID 或本机 Compendium UUID。把 Actor JSON 正常导入 Foundry 后，由目标世界模块扫描所有已启用且当前 GM 可读取的 Item Compendium，完成实际法术选择和水合。\n\n当前解析器只支持 Foundry `14.364` / dnd5e `5.3.3`。匹配规则是精确身份优先：存在同名且事实一致的 2024 法术时只能选择 2024；只有不存在同键 2024 候选项时，才允许使用带明确报告的唯一 2014 回退。模糊、冲突、缺失或人工修改都会进入检查，不会部分写入。\n\n```powershell\nbun run foundry:lab spell-resolver build\nbun run foundry:lab spell-resolver install --apply\nbun run foundry:lab spell-resolver verify-install\nbun run foundry:lab spell-resolver prepare-world --world=fvtt-v14-module-matrix --apply\n```\n\n模块源码、构建和本地安装工具统一位于 [`foundry-modules/monster-spell-resolver/`](foundry-modules/monster-spell-resolver/README.zh-CN.md)。普通使用、升级、卸载、诊断和安全边界见 [`docs/foundry-spell-resolver-install.zh-CN.md`](docs/foundry-spell-resolver-install.zh-CN.md)。模块不支持 Foundry v12、生产世界自动安装或全世界批量迁移。\n\n## 旧纯文本命令兼容\n\n网页的旧“纯文本 Actor”任务已经删除；请在网页使用“自动转换”入口。CLI 仍保留下面的旧命令，方便历史脚本平滑迁移。它会先在临时区域生成标准 Actor Markdown，再走当前 Actor 流程；正式写入前会一次检查所有同名输入和输出，发现任何冲突就停止，不覆盖也不自动改名。\n\n它不会把识别失败或有警告的资料冒充正式结果，且不会在 AI Intake 不可用时偷偷改走 AI。\n\n仅拆分纯文本资料为项目 Markdown：\n\n```powershell\nbun run src/index.ts `\n  --ingest-plaintext \"path/to/collection.txt\" `\n  --emit-dir \"obsidian/dnd数据转fvttjson/input\"\n```\n\n从纯文本转换为正式 Actor：\n\n```powershell\nbun run src/index.ts `\n  --ingest-plaintext-actors \"path/to/collection.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n先用 `--dry-run` 检查识别数量和警告。`--ingest-plaintext-actors` 是兼容入口；新项目应优先使用标准 Actor Markdown 或网页“自动转换”。\n\n## GoddessFantasy 流水线\n\n采集结果默认写入 `obsidian/dnd数据转fvttjson/crawls`。cookie、账号和密码只能通过忽略文件或环境变量提供，不得提交到 Git。\n\n```powershell\n# 板块增量采集\nbun run src/tools/crawlSites.ts goddessfantasy-board `\n  --board-url \"\u003cboard-url>\" `\n  --cookie-header-file \".local/goddessfantasy.cookie\" `\n  --out-dir \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318\" `\n  --mode incremental\n\n# records.json 转换为纯文本怪物\nbun run src/tools/crawlSites.ts records-to-plaintext `\n  --records \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318/records.json\" `\n  --out-dir \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318/plaintext/monsters\"\n```\n\n`--force` 是 `--mode full` 的兼容别名。真实登录采集不属于离线验收，运行前应先 dry-run 并保护本地凭据。\n\n## Web 工作台\n\n```powershell\n# 本地开发\nbun run web:dev\n\n# API 服务\nbun run web:api\n\n# 生产构建\nbun run web:build\n```\n\n`web:api` / `web:start` 默认只监听 `127.0.0.1:5174`。非回环或反向代理公开模式必须显式启用并配置服务器端 bearer token；浏览器不能提交 VPS 凭据。Web/API 支持上传 Markdown、单文件转换、批量怪物 job、下载 ZIP、来源核对及受限的 workspace path 模式。完整部署、鉴权、可信代理与资源上限见 [`docs/web-deployment.md`](docs/web-deployment.md)；三种 AI 连接方式和 Windows Companion 见 [`docs/web-ai-connections.md`](docs/web-ai-connections.md)。\n\n## 参考缓存\n\n完整 dnd5e 5.3.3 源码、Foundry API 页面和生成索引存放在忽略的 `.local/references`，不是生成器运行依赖：\n\n```powershell\nbun run references bootstrap --dry-run\nbun run references bootstrap\nbun run references verify\nbun run src/tools/referenceIndex.ts\n```\n\n获取器先在 staging 中检出 manifest 固定的 revision，通过验证后才原子替换本地缓存。详情见 [`docs/REFERENCE_INDEX.md`](docs/REFERENCE_INDEX.md)。\n\n## 验证与验收\n\n```powershell\n# 全量测试；限制并发以避免 CLI/Crawlee 子进程在 Windows 上资源饥饿\nbun run test\n\n# parser/generator 反过拟合审计\nbun run audit:anti-overfit\n\n# Actor 来源对照\nbun run verify:actor -- \"path/to/source.md\" \"path/to/actor.json\"\n\n# Foundry Lab 单元测试\nbun run test:foundry-lab\n```\n\n测试、JSON 可解析、文件存在和命令退出 0 都只是机械验证。生成结果只有在按照 [`docs/generated-actor-verification.md`](docs/generated-actor-verification.md) 核对身份、数值、动作、豁免、效果、施法、自动化和来源覆盖后，才可以声明正确。\n\n当前 v14 真实验收边界：\n\n- 六个 core Actor 在 Foundry 14.364 / dnd5e 5.3.3 中导入并执行代表性 Activity：通过；\n- 六个 minimal modded Actor 与来源驱动的 MIDI-QOL OverTime：通过；\n- `cor-cotn` 本地副本的角色卡、豁免聊天卡、Journal、Scene 和 Token 抽样流程：通过；\n- 完整生产模组集合无错误共存：失败，仍为 Partial；\n- 来源驱动的 DAE `isDamaged` 已通过 DAE 14.0.12 + MIDI-QOL 14.0.9 的历史实机移除与 core 保留对照；当前生成目标已锁定 MIDI-QOL 14.0.11，但这项旧证据尚未在新版本重新执行。独立 Item v14 已通过导入、AC、两项 Activity、倒地、次数、专注及无文件弹框导出回读。完整生产模组共存仍为 Partial。当前分层结论见 [`docs/acceptance/current-support-matrix.md`](docs/acceptance/current-support-matrix.md)。\n\n## 更多资料\n\n- [`docs/manual.md`](docs/manual.md)：以 v12 为主的旧版详细手册；涉及版本时以本 README 和 `AGENTS.md` 为准，也包含 AI Intake、便携施法者和兼容纯文本命令说明。\n- [`docs/generated-actor-verification.md`](docs/generated-actor-verification.md)：生成 Actor 的强制语义验收清单。\n- [`tools/foundry-ops/README.zh-CN.md`](tools/foundry-ops/README.zh-CN.md)：Foundry 本地测试、离线审计、生产只读盘点的统一入口、权限分类与外部配置说明。\n- [`scripts/foundry-lab/README.md`](scripts/foundry-lab/README.md)：旧 Foundry Lab 命令的兼容说明和详细操作手册。\n- [`docs/acceptance/foundry-v14-module-compatibility.md`](docs/acceptance/foundry-v14-module-compatibility.md)：模组矩阵、已知冲突和生产世界抽样证据。\n","docs/REFERENCE_INDEX.md":"# Versioned Reference Cache\n\nLarge upstream source trees, generated indexes, API mirrors, fonts, icons, and tokens are local verification inputs. They are not runtime dependencies and are not stored in Git.\n\n## Tracked evidence\n\n- `references/reference-cache-manifest.json` pins each automatically acquired component to an immutable revision and records its license.\n- `references/dnd5e-5.3.3/system.json` records the published dnd5e package metadata.\n- `references/dnd5e-5.3.3/release-5.3.3.html` and `release-5.3.0.html` preserve the small release-note evidence used by the v14 work.\n- `references/foundry-v14-api-notes/` preserves the small official Foundry release-note snapshots and their acceptance hashes.\n- Generated v14 Item JSON uses the small locked templates under `references/item-templates/dnd5e-5.3.3`; it does not read the full upstream source tree.\n\n## Local layout\n\nThe ignored cache root defaults to `.local/references/`. Set\n`FVTT_REFERENCE_CACHE_ROOT` to move this rebuildable/reference-only tree to a\ndedicated directory without moving the Foundry Lab or tracked provenance.\n\n| Path | Purpose |\n| --- | --- |\n| `.local/references/dnd5e/5.3.3/repo` | Immutable dnd5e source checkout pinned by the manifest |\n| `.local/references/foundry/14.361/api-core` | Curated Foundry v14 API pages retained for local review |\n| `.local/references/foundry/14.361/api-core-text` | Text extracts retained from the previous local snapshot |\n| `.local/references/indexes` | Rebuildable file and token indexes |\n| `.local/references/generated-text` | Rebuildable API text extracts |\n| `references/foundry-v12-api*` | Legacy local-only v12 API mirror compatibility paths |\n\nThe small dnd5e 4.3.9 locks/templates remain tracked. The older v12 Foundry API\nHTML/text mirrors remain available in the existing local\n`references/foundry-v12-api*` compatibility paths, but those large upstream\ncopies are ignored and are no longer repository content. Removing or rebuilding\nlocal reference inputs must not change v12 or v13 output.\n\n## Commands\n\n```powershell\n# Show the immutable acquisition plan without writing files\nbun run references bootstrap --dry-run\n\n# Acquire into a staging directory, verify the exact revision, then atomically install\nbun run references bootstrap\n\n# Offline validation; never modifies the cache\nbun run references verify\n\n# Rebuild generated indexes under .local/references\nbun run src/tools/referenceIndex.ts\n```\n\nPowerShell example for an external cache:\n\n```powershell\n$env:FVTT_REFERENCE_CACHE_ROOT = 'J:\\fvtt-reference-cache'\nbun run references verify\nbun run src/tools/referenceIndex.ts\n```\n\nThe manifest continues to use the legacy `.local/references/...` logical path\nas a portable tracked identifier. The tools map that prefix under the configured\ncache root, reject absolute or escaping manifest targets, and keep dry-run\nbootstrap read-only.\n\nThe bootstrap command never replaces a valid existing cache until the staged clone has checked out the exact revision. A failed clone, checkout, or revision check leaves the existing target untouched.\n\n`references verify` reports four distinct states: `ok`, `missing`, `mismatch`, and `git-error`. `mismatch` is used only when Git successfully reads `HEAD` and the revision differs. Missing Git, unsafe-directory/ownership failures, access errors, and other unreadable-checkout failures are reported as `git-error` with the Git command, exit status, and diagnostic text; they never masquerade as a revision mismatch.\n\n## Locked v14 evidence\n\n- Foundry generated metadata: `14.364`\n- Foundry runtime acceptance: `14.364`\n- dnd5e: `5.3.3`, revision `965ad2d0cf5d063dac675ba078b5bd3c3c0dd449`\n- MIDI-QOL: `14.0.11`（当前锁定；`14.0.9` 的旧验收记录保留为历史证据）\n- DAE: `14.0.12`\n- Foundry release `14.361` snapshot SHA-256: `580F327078CAFBD6A767405ABD8AA6E9057F2E431BAD50219F60B93A6B5114CC`\n\nFull production-module coexistence is not accepted. These references support schema and narrow runtime verification only.\n","docs/acceptance/current-support-matrix.md":"# Current Support Matrix\n\n**Current as of:** 2026-08-30\n**Canonical role:** this file is the current support summary. Dated reports remain immutable evidence snapshots; later amendments clarify their present interpretation without erasing earlier failures or narrower passes.\n\n**Current v14 module lock:** MIDI-QOL `14.0.11` + DAE `14.0.12`. Rows below that name MIDI-QOL `14.0.9` describe preserved historical runtime evidence; they have not been silently promoted to `14.0.11` acceptance.\n\n**Default selection boundary (verified 2026-09-06):** CLI and workflow callers that omit the version default to v12; the Web form initially selects v14. When a user does not specify a target, Codex explicitly requests Foundry `14.364` / dnd5e `5.3.3` / `core`. These are distinct entry-point defaults and do not retroactively upgrade v14 acceptance.\n\n## Status vocabulary\n\n- **Pass:** the named layer has current mechanical and semantic evidence for the bounded scope stated in that row.\n- **Partial:** some named workflows pass, but material behavior in the same layer is unaccepted or failing.\n- **Fail:** a required behavior was reproduced as failing.\n- **Blocked external:** safe completion needs user authorization, credentials, a valid protected package, or another user-controlled state change.\n- A Pass at one layer never upgrades a deeper layer. JSON schema validity does not prove Foundry runtime behavior; sampled copied-world usability does not prove complete module coexistence; local evidence does not prove production deployment.\n\n## Current product truth\n\n| Layer | Current status | Accepted scope | Explicit boundary | Dated evidence |\n|---|---|---|---|---|\n| FVTT JSON Forge 0.1.0 | **Pass for the exact-target A–E local product slice; Partial overall** | The GM-only browser module covers separate Actor and Item create-only adapters, deterministic identity/reuse/readback, evidence-first Plaintext Actor / AI Monster / AI Item review, strict review-bundle recovery, a `worldId:userId` client-local Source Library, mixed Actor/Item Collection JSON and standard ZIP, a recoverable concurrency-1 queue, immutable accepted-only apply manifests, partial-failure reporting, explicit retry/cancel, and exact cleanup. Real Foundry `14.364` / dnd5e `5.3.3` evidence includes a bounded DeepSeek `deepseek-v4-flash` Monster accepted/create/readback path, read-only and fresh-attempt recovery, Collection/ZIP round-trip, running→interrupted recovery with zero automatic request, and two-Actor batch create/readback/reuse after a real partial failure exposed and fixed Activity reach drift. | Exact Foundry `14.364` / dnd5e `5.3.3` / `core`, GM-only. Provider presets are compatibility configurations, not equal-quality or accepted E2E claims for every provider/model. AI Item live accepted/create/lifecycle, production, arbitrary source/model correctness, multi-Document atomicity, and a Companion/Gateway owner that continues after the page closes are not claimed. Browser IndexedDB/localStorage is client-local convenience storage, not encrypted isolation. | [Module guide](../../foundry-modules/fvtt-json-forge/README.zh-CN.md); [A–E product plan](../plan/2026-08-21-forge-fvtt-module-product-execution-plan.md); [Task D evidence](../plan/2026-08-24-forge-fvtt-intake-task-d-plan.md); [Task E evidence](../plan/2026-08-30-forge-fvtt-task-e-plan.md) |\n| Source fidelity | **Pass, bounded corpus** | The 19-category corpus covers Chinese/English, Actor/Item, parser/generator, v12/v14, core/modded, positive/close-negative, effect/condition, and unrelated regressions. Real Shield and Damage-Bound Warden CLI outputs were also read against source. | This is not a claim for arbitrary Markdown or every D&D mechanic. | [Current corpus matrix](current-corpus-matrix.md); [source/JSON review](v14-source-json-full-review.md) |\n| Blood Hunter 2024 native module | **Partial, package and static semantic acceptance** | The locked source SHA-256 compiles into one class, four subclasses, 76 feature documents, three native Item packs, 94 coverage entries and 117 Activities for exact Foundry `14.364` / dnd5e `5.3.3`. Stable IDs, native Advancement references, canonical Dawn Rite `5 Activities / 2 Effects`, deterministic ZIP, guarded Lab install, and copy-first Actor migration are covered by focused tests. | The package is not yet a runtime Pass: the independent four-subclass Core/Modded matrix E2E is still required. Installed Actor Items remain snapshots and require explicit migration after module updates. No production deployment is claimed. | [Module guide](../../foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md); module identity and coverage ledgers |\n| AI Item Intake | **Partial, static and application-layer acceptance** | Natural-language TXT/irregular Markdown Item input can use a separate evidence-bearing Item IR, deterministic `item-mechanics` Markdown, existing Item generation, exact V14/core verifier checks, CLI promotion gate and isolated Web job. The bounded Jewel of Three Prayers fixture asserts explicit AC `+1`, zero-cost 15/30 light, three dawn-recovery charges and a one-charge Invisibility cast with `spellSlot: false`; unresolved spells and weak textual lookalikes are withheld. | Exact target only: Foundry `14.364` / dnd5e `5.3.3` / `core`, at most 50 items and 200,000 UTF-16 characters. This is not an arbitrary Item/text/model claim. Until the disposable Foundry Lab exercises native Apply Effect, AC lifecycle, charges, cast consumption and dawn recovery, it is not a runtime Pass. | [Item Intake guide](../item-ai-intake-v14.md); focused Item Intake fixtures |\n| V14 Species Intake / homebrew Species module | **Pass for the Ogre Intake, artifact, and bounded local Lab slice; Partial overall** | A real Codex OAuth run (`species-20260811022558-9a41c4a1`) accepted Ogre through source/IR/Markdown/JSON cross-review and promoted a hash-closed ledger. The deterministic content-only module contains one race and five features. In the protected local Lab, dnd5e's native Add Species flow applied giant/Ogre, Large, 40 ft and darkvision 60; AC changed 10→8; level-1 HP was 12+3=15; level-5 maximum HP was 40+15=55; the level-5 Bonus Action spent 2/2 uses, produced exactly two manual-check chat cards, refused a third card at 0/2, and returned to 2/2 on Long Rest. The giant-weapon rule remains explicit GM judgment with no weapon mutation, push, or Token movement. | Exact Foundry `14.364` / dnd5e `5.3.3` / `core` / 2024 boundary only. Exact 2×2 Token placement, byte-level pre/post weapon comparison, export/readback and long-session acceptance remain unperformed. | [Species Intake guide](../species-ai-intake-v14.md); accepted run and ledger; focused Species/module tests; local `fvtt-v14-module-matrix` Lab evidence |\n| V12 Species generation/build | **Pass at static candidate layer** | The shared Canonical Species/Evidence IR projects Ogre to exact Foundry `12.331` / dnd5e `4.3.9` / `core` / 2024 shapes. Locked contracts cover Race, level-0 Size `{size:\"\"}`, level-based ItemGrant, Utility `effects`, itemUses and lr/sr recoverAll, Race advancement during character level changes, and the HP-per-total-level / AC-bonus paths. Target-aware ledger v2 permits V12/V14 coexistence; deterministic candidate tests close manifest, identity, accepted package, coverage, LevelDB packs, ItemGrant UUIDs, tree/hash/ZIP repeatability, content-only surface, and cross-target document identity. | This is `static-candidate`, not a claim that Foundry V12 can install or use it. Loose package JSON remains bound to `fvtt-homebrew-species.features` UUIDs, and embedded Actor Features remain snapshots. V13, legacy/2014, modded-v12 and third-party module compatibility are excluded. | [Species Intake guide](../species-ai-intake-v14.md); [dnd5e 4.3.9 Species reference contract](../../references/dnd5e-4.3.9/species-contract.json); focused projector/CLI/module tests |\n| V12 Species runtime | **Not accepted** | No runtime behavior is claimed. | No V12 Lab exists on this machine. Token 2×2, Add Species UI, level 1→5 grant processing, HP/AC values, use depletion, Long Rest recovery, restart/readback, installation and migration remain unperformed. | Static evidence above must not be promoted to Runtime Pass. |\n| AI monster intake | **Pass, bounded Lurker and Rat Warlock workflows; review-required failures verified** | Raw TXT/MD monster input can pass AI boundary discovery, evidence-backed IR, deterministic Markdown rendering, existing project generation, deterministic source/IR/Markdown/Actor comparison, independent review, and one bounded repair. The Lurker reached accepted and its v14/core Actor passed Foundry 14.364 / dnd5e 5.3.3 import/readback. A separate messy Rat Warlock TXT reached direct Web `accepted` with one extraction, one review, zero repair/findings; the reviewed v14 Actor retained conditional AC text, full innate-spellcasting prose, three separate traits, bonus-action Skulker activation, and Bite attack mechanics. | Monster/NPC only, at most 50 creatures and 200,000 UTF-16 characters. No OCR, PDF/image, Item, arbitrary-text guarantee, or equal-quality guarantee across models. The original 2026-07-17 pre-resolver Rat artifact was not separately imported; the later source-manifest Rat runtime acceptance is the bounded resolver evidence below. Fresh stochastic evidence/coverage failures correctly enter `needs_review` and are not promoted. Codex OAuth was exercised only through an unofficial temporary localhost bridge, not claimed as OpenAI Platform API support. | [Parent remediation ledger](../remediation/2026-07-15-project-hardening/EXECPLAN.md); [operator guide](../manual.md) |\n| Schema validity | **Pass, current targets** | v12/v13 use the dedicated dnd5e 4.3.9 projector and strict structural assertions; v14 uses the independent dnd5e 5.3.3 projector. Shared verification rejects missing mechanics, save drift, duplicate IDs, dangling effects, legacy activation/uses fields, and core-profile module leakage. | Structural validation does not prove import migration, sheet rendering, or Activity execution. The 2026-07-30 checkout did not contain the listed project-local Foundry 14.364 runtime, so this milestone adds no new runtime Pass. | [Core batch](v14-core-batch-verification.md); [modded batch](v14-modded-batch-verification.md); [current corpus](current-corpus-matrix.md); parent remediation ledger |\n| CLI/workflow generation | **Pass, represented flows** | Actor, Item, single-file, collection, Vault Sync, CLI, and Web jobs share one canonical IR/projector/verification pipeline. A non-accepted result is withheld from formal output and collection ZIPs. Oregg, Shield, and Jewel v12/v14 controls were regenerated only through `src/index.ts`. | Runtime import/export is a separate layer. Generated JSON was not hand-repaired, and new Spell/Feat/Class/PC Builder product types are outside this milestone. | [Current corpus](current-corpus-matrix.md); parent remediation ledger |\n| v14 name-driven Item artwork | **Pass, opt-in safe mode** | Foundry 14.364 / dnd5e 5.3.3 metadata builds a deterministic core/dnd5e-only catalog. CLI, Actor, standalone Item, collection, Vault Sync, AI Intake reuse and Web jobs share exact/structured-safe/fallback resolution and emit separate review reports. A 1,093-Item existing-output audit resolved 328 exact, preserved 54 existing and safely fell back 711 with zero unavailable paths; the project-CLI Nightgaunt artifact imported into the locked local runtime and all six images returned HTTP 200 and decoded. | Off by default; v12/v13 fail closed. Fallback means no sufficiently safe semantic claim, not that every feature receives unique artwork. Third-party module artwork and remote URLs are excluded; custom exceptions require the external override file. The bounded runtime import was cleaned up and does not prove arbitrary future catalog versions. | Parent remediation ledger; generated Nightgaunt icon review sidecar |\n| Core Actor runtime | **Pass, six-Actor local sample** | Six v14/core Actors imported into Foundry 14.364 / dnd5e 5.3.3, opened, executed representative Activities, and re-exported with reviewed semantics retained. | This does not cover standalone Item runtime or arbitrary Actors. | [Live runtime smoke](v14-live-runtime-smoke-test.md); [source/JSON review](v14-source-json-full-review.md) |\n| Minimal modded Actor runtime | **Pass for the locked MIDI bleeding and `isDamaged` contracts; Partial overall** | MIDI-QOL 14.0.9 + DAE 14.0.12 + dependencies retain the earlier Bleeding Guardian proof and now remove a CLI-generated Dread Brand effect after actual subsequent damage. | These are two bounded module contracts, not a blanket claim for arbitrary automation or the full production module set. | [Live runtime smoke](v14-live-runtime-smoke-test.md) |\n| Source-derived `isDamaged` generation | **Pass at code/CLI/schema layer** | A neutral per-status source-duration hint is mapped only by `modded-v14` to DAE 14.0.12 `flags.dae.specialDuration: [\"isDamaged\"]`; core strips DAE flags. Core/modded fixture Actors are otherwise source-equivalent. | Locked source shows MIDI-QOL 14.0.9 consumes actual damage and removes the effect. Static evidence is not runtime proof. | [Current corpus](current-corpus-matrix.md); [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md) |\n| Source-derived `isDamaged` runtime | **Pass, locked stack** | The CLI modded-v14 Dread Brand dealt 6 damage and left Frightened active; a later CLI Stone Fist dealt 4 and DAE+MIDI expired/removed it. The CLI core artifact dealt 8, then 9 more damage, and retained the same source-derived effect without `specialDuration`. | This proves only DAE 14.0.12 + MIDI-QOL 14.0.9 with Foundry 14.364/dnd5e 5.3.3. It does not prove exact production coexistence. | [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md); [live runtime smoke](v14-live-runtime-smoke-test.md) |\n| Standalone Item generation | **Pass at source/CLI/schema layer** | The real Shield has neutral-template isolation, shield base AC 2 + magical bonus 2, correct type/properties/weight, Forceful Bash damage/prone linkage, Protective Field reaction/dawn/duration/concentration/radius, portable v14 metadata, and self-Activity use consumption. | Runtime behavior and round-trip evidence are separate layers and now also pass for the bounded Shield workflow; this row still makes only a generation-layer claim. | [Current corpus](current-corpus-matrix.md); [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md) |\n| Standalone Item v14 runtime | **Pass, bounded Shield workflow** | CLI JSON imported through Foundry's public workflow; a disposable Actor showed AC `10 -> 12 -> 14`; Forceful Bash attack/damage/prone and Protective Field 1/day depletion, 60-second concentration, second-use rejection, and runtime readback passed. A no-dialog `exportToJSON()` round trip produced a 9,727-byte artifact whose full source-relevant projection matches the CLI artifact. | This is one representative standalone Item workflow, not proof for every Item schema or arbitrary JSON. Native Chrome-extension file pickers remain unsuitable for unattended automation. | [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md); [no-dialog runbook](../runbooks/foundry-json-transfer-without-file-dialog.md) |\n| Copied-world sampled usability | **Pass, narrowly sampled** | In the local `cor-cotn` copy, a real character sheet, save/chat card, Journal, Scene documents, and Token restoration were exercised after an explicitly authorized local-only Gamemaster reset. | This is not an error-free world or complete module result. Swipe production/touch acceptance remains Partial. | [Module compatibility](foundry-v14-module-compatibility.md); [live runtime smoke](v14-live-runtime-smoke-test.md) |\n| Historical 88-module production-snapshot reproduction | **Historical Fail / Partial; not a current gate** | The 2026-07-11 mirror attempt accurately records that an older 88-active-ID production snapshot could not be reproduced exactly and that its reduced candidates still had gaps. | The user-directed 2026-07-12 cleanup later changed the intended module state locally and applied selected changes to production. The old 88-ID snapshot is therefore not the current intended package set, and its protected MCDM package is not a standing prerequisite for this project. | [Module compatibility](foundry-v14-module-compatibility.md); [local/production optimization log](foundry-v14-local-optimization-log.zh-CN.md) |\n| Production deployment state | **Partial, historical evidence only for this remediation turn** | The dated production log records deployed Swipe/Bloodsplats changes, retained/disabled modules and settings, and sampled light/heavy scene health. | The final verified local baseline was 79 enabled modules, not a production-count claim. This remediation turn did not re-inventory current production, so it claims neither 88 nor 79 production modules. Swipe session validation, Token drag, complete attack/damage, and Item Piles touch coexistence remained unaccepted. | [Local/production optimization log](foundry-v14-local-optimization-log.zh-CN.md); [module compatibility](foundry-v14-module-compatibility.md) |\n| Authenticated GoddessFantasy crawl | **Pass, bounded board sample** | With explicit user authorization, the existing Chrome session discovered 54 topics, matched/crawled 37 monster topics, emitted 47 plaintext statblocks, regenerated 47 v14/core Actors, and passed 47/47 verifier checks plus expanded semantic projections. Cookies and credentials were neither inspected nor exported. | This proves board 2318 pages available to that session at the run timestamp, not every board, future login state, arbitrary statblock syntax, or production deployment. Raw authenticated crawl state remains local and untracked. | Parent remediation ledger; tracked 47 vault inputs and live-semantic fixture |\n| Web/API deployment boundary | **Pass at application layer** | Loopback-only default, explicit authenticated public/proxied mode, trusted proxy identity, pre-materialization body checks, rate/job caps, cleanup, process probes, and real browser Actor/ZIP workflows pass. | Public TLS, reverse-proxy identity, firewalling, OS limits, and distributed quotas remain infrastructure responsibilities. | [Deployment guide](../web-deployment.md); remediation Milestone 8 evidence in the parent ledger |\n\n## Safe resume boundaries\n\n### Local Foundry Item transfers\n\nThe Shield import/behavior/export proof is complete. Future unattended transfers must follow the [no-dialog runbook](../runbooks/foundry-json-transfer-without-file-dialog.md): use Foundry's public `importFromJSON()` and `exportToJSON()` methods, transfer JSON text rather than a filesystem path, capture the exact export Blob before native download, restore temporary page instrumentation in `finally`, compare source-relevant semantics, and clean/stop/restore. Do not write LevelDB directly and do not touch production.\n\n### Authenticated GoddessFantasy crawl\n\nThe 2026-07-16 authorized run is accepted. Future authenticated reruns still require explicit authorization for the then-current session. Keep secrets out of arguments, tracked files, logs, and reports. Prefer in-place browser-session use or an ignored cookie-header file / `GODDESSFANTASY_COOKIE` environment variable. The CLI credential route remains:\n\n```powershell\nbun run src/tools/crawlSites.ts goddessfantasy-pipeline --cookie-header-env GODDESSFANTASY_COOKIE --mode incremental --content-type monster --effect-profile core --fvtt-version 14\n```\n\nDo not add `--skip-auth-probe`; the authenticated board probe is part of acceptance. Every rerun must review provenance plus representative `records.json` -> plaintext -> CLI Actor semantics and must not reuse the old authorization for a materially different session or board.\n\n### Historical module-snapshot boundary\n\nThe 88-module figure belongs only to the 2026-07-11 production inventory snapshot. The later cleanup record verifies a 79-module local `server-mirror` baseline and separately records selected 2026-07-12 production changes; it does not record a post-cleanup production active count. A future production compatibility audit must begin with a fresh read-only inventory and an explicitly agreed intended set. It must not resurrect the old 88-ID snapshot or require the protected MCDM package unless that fresh inventory and user scope actually include it.\n\n## Claim rule\n\nThe project currently supports the exact-target and bounded FVTT JSON Forge A–E product slice above, source-faithful generation for the bounded corpus, bounded TXT/MD monster AI Intake with strict `needs_review`, and the **Partial** exact-target AI Item Intake described above, v12 by default, explicit v14 generation, the exact Foundry 14.364 / dnd5e 5.3.3 target-world Rat spell-resolver workflow accepted below, core Actor runtime samples, the bounded standalone Shield v14 import/behavior/export workflow, the narrow locked MIDI bleeding workflow, the locked DAE+MIDI `isDamaged` contract, and the bounded 2026-07-16 authenticated GoddessFantasy board-2318 ingestion. It does **not** currently support a blanket claim of full Foundry v14 production compatibility, Forge on runtime versions other than exact Foundry 14.364 / dnd5e 5.3.3, arbitrary Forge provider/model/source correctness, page-closed background execution, multi-Document atomicity, a v12 spell resolver, production resolver deployment, bulk spell migration, the current production module count, OCR/PDF/image Intake, arbitrary Item Intake/runtime behavior, arbitrary authenticated boards/statblock syntax, or arbitrary standalone Item round trips.\n\n## 2026-07-15 M10 Pre-Final Audit\n\n- Mechanical repository gates: production and broad typechecks pass; 738 tests / 2,921 expectations pass; production coverage is 87.54% lines and 88.40% functions; all-source anti-overfit passes with 109 sources; dnd5e 5.3.3 reference verification and Web build pass; Foundry Lab passes 116 tests / 417 expectations; repository hygiene passes across 1,605 tracked paths.\n- Regeneration: v12/core, v14/core, and v14/modded-v14 Damage-Bound Warden Actors, the v14/core Shield, and the unrelated v12 Jewel were regenerated only through `src/index.ts` into ignored output paths.\n- Semantic review: all three Actor verifier runs have zero warnings. Explicit assertions pass for source identity/stats/type/version metadata, native attack damage and reach, exactly scoped frightened/DAE behavior, the complete Shield armor/Activity/prone/reaction/duration/range/recovery projection, and absence of Shield mechanics on the Jewel.\n- At that pre-final checkpoint, the browser upload/download smoke, Shield live behavior, and DAE+MIDI removal were unaccepted alongside authenticated crawl and exact production coexistence. The runtime amendment below supersedes the first three items while preserving the dated audit chronology.\n\n## 2026-07-15 Runtime Resume Amendment\n\n- Chrome file access unblocked Foundry's supported Import Data path. Shield import exposed and drove generalized fixes for portable `_stats.lastModifiedBy` and limited self-Activity consumption; Damage-Bound Warden exposed and drove the generalized `untilDamaged` Activity duration `spec` fix.\n- Semantic runtime acceptance now passes for Shield AC, Forceful Bash attack/damage/prone, Protective Field one-per-dawn depletion/concentration/second-use rejection/runtime readback, and the modded removal versus core retention `isDamaged` control.\n- The complete rerun passes 743 tests / 2,932 expectations, 87.55% line / 88.41% function production coverage, both typechecks, 109-source anti-overfit, 1,605-path hygiene, locked reference verification, Web build, and offline smoke. One first-run token-review timeout passed 2/2 alone and the complete rerun; it remains recorded as scheduling debt rather than hidden.\n- At this dated checkpoint, the only remaining local Item evidence gap was a downloaded UI Export Data artifact and CLI-versus-export semantic comparison; the 2026-07-16 amendment below supersedes that gap. Authenticated crawl and exact protected/full module coexistence remain external boundaries.\n\n## 2026-07-16 No-Dialog Transfer Amendment\n\n- External research confirmed that `DOM.setFileInputFiles: Not allowed` is an extension-mode transport limitation reproduced by Playwright MCP and OpenAI Codex users; Chrome's file-URL permission is not a reliable unattended fix.\n- The existing CLI Shield JSON was imported in the local matrix world through Foundry 14.364's public `importFromJSON()` method. Foundry's public `exportToJSON()` then ran unchanged, while its exact JSON Blob was captured before native download handling.\n- The 9,727-byte export matches the CLI artifact on every source-relevant field. Foundry-only differences are export provenance, timestamps/user/document identity, and schema-default expansion; no source mechanic drift was found.\n- The disposable Item was deleted, temporary page instrumentation was restored, port 30001 was released, `options.json` returned to `cor-cotn`, and production was untouched. PROD-002 and SE
