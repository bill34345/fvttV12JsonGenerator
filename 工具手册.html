一次伤害结算中包含不同伤害类型时，先把这些伤害合计，再判断是否超过 20 点。总伤害为 20 点或更少时不会减免。\n\n在绯晶拒绝造成的守护碎裂期间，月蚀守护不减免伤害。绯晶拒绝的次数耗尽后，守护恢复为削弱形态：超过 20 点的伤害只能减少熟练加值，也就是减少 5 点，不能再减半。守护碎裂和恢复为削弱形态的变化应当清晰可见。\n\n**绯晶拒绝 [2/日]（Ruidium Defiance）。** 当晶血龙兽豁免失败时，它可以把这次豁免改为成功。使用这个能力的代价是月蚀守护碎裂；守护持续失效，直到晶血龙兽的下一回合开始。这一变化清晰可见。\n\n这个能力每天可以使用两次。两次使用次数耗尽后，月蚀守护即使恢复，也只能按削弱形态运作：超过 20 点的伤害只能减去熟练加值 5，不能减半。绯晶拒绝不改变晶血龙兽的护甲等级，也不改变伤害抗性。\n\n**绯晶腐化（Ruidium Corruption）。** 只有当某个能力明确要求进行这项结算时，目标才进行一次 DC 18 魅力豁免。豁免失败时，目标受到绯晶腐化；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。豁免成功时无效果。\n\n月石晶体能力中所说的“月石腐化”使用同一个绯晶腐化标记和同一套规则，不建立一个可以与之叠加的同义状态。腐化的移除按战役规则由 GM 处理。\n\n**尾击推退（Tail Shove）。** 尾击命中一个生物后，晶血龙兽可以选择推退。目标进行 DC 19 力量豁免；失败时目标被推开 10 尺，成功时无效果且不移动。同一次尾击不能同时选择尾击扫倒。\n\n**尾击扫倒（Tail Sweep）。** 尾击命中一个生物后，晶血龙兽可以选择扫倒。目标进行 DC 19 力量豁免；失败时目标陷入倒地（Prone），成功时无效果。同一次尾击不能同时选择尾击推退。\n\n### 动作\n\n**多重攻击（Multiattack）。** 晶血龙兽发动三次攻击：一次啃咬和两次爪击。每次攻击分别选择合法目标，并分别进行命中与伤害结算。\n\n**啃咬（Bite）。** 近战武器攻击，命中 +11，触及 10 尺，一个目标。命中造成 3d10+6 穿刺伤害（平均 22 点），外加 2d8 心灵伤害（平均 9 点）。\n\n**爪击（Claw）。** 近战武器攻击，命中 +11，触及 5 尺，一个目标。命中造成 3d8+6 挥砍伤害（平均 19 点），外加 1d8 心灵伤害（平均 4 点）。\n\n**尾击（Tail）。** 近战武器攻击，命中 +11，触及 15 尺，一个目标。命中造成 4d6+6 钝击伤害（平均 20 点），外加 1d6 心灵伤害（平均 3 点）。如果目标是生物，命中后晶血龙兽可以选择尾击推退或尾击扫倒，只结算其中一个分支。\n\n**噩梦吐息（Nightmare Breath，充能 5–6）。** 晶血龙兽吐出覆盖 60 尺锥形区域的红雾。区域内的每个生物都必须进行一次 DC 18 感知豁免。\n\n- 豁免失败：受到 6d10（平均 33 点）力场伤害，并陷入恐慌（Frightened），持续 1 分钟。\n- 豁免成功：受到一半伤害，向下取整，不陷入恐慌。\n\n受影响的生物在自己每个回合结束时重复进行 DC 18 感知豁免；成功则结束恐慌。受影响生物 5 尺内的另一个生物可以使用一个动作进行 DC 15 运动或医药检定；检定成功时拔除绯晶刺并结束恐慌。\n\n### 传奇动作\n\n晶血龙兽拥有 4 个传奇动作。它只能在另一个生物的回合结束时使用下列选项中的一个；在自己的回合开始时恢复所有已消耗的传奇动作。\n\n**尾击（Tail Attack，消耗 1 个传奇动作）。** 晶血龙兽发动一次尾击。该次攻击使用尾击本身的攻击和命中后分支规则；这个传奇动作已经包含这次尾击，不再额外消耗晶血龙兽的普通动作。\n\n**血液支配（Command the Blood，消耗 1 个传奇动作）。** 晶血龙兽选择一个它能看见且位于 30 尺内的生物。目标进行 DC 18 感知豁免；生命值尚未受损的目标进行这次豁免时具有优势。\n\n豁免失败时，目标必须使用自己的反应，对另一个位于其触及范围内的生物发动一次近战武器攻击。由晶血龙兽选择这个被攻击的生物。如果没有合法目标，或者目标不能执行反应，则这个效果无效。豁免成功时无效果。\n\n**晶片齐射（Shard Salvo，消耗 2 个传奇动作）。** 晶血龙兽向一个它能看见且位于 30 尺内的生物射出水晶碎片，目标进行一次 DC 18 体质豁免。\n\n- 豁免失败：受到 2d8（平均 9 点）心灵伤害，并陷入恍惚（Dazed），持续至目标下一个回合结束。恍惚不是麻痹，也不是震慑。\n- 豁免成功：受到一半伤害，向下取整，不陷入恍惚。\n\n如果晶血龙兽当前生命值不高于生命值上限的一半，豁免失败的目标还必须进行一次 DC 18 魅力豁免，并按绯晶腐化的规则结算。\n\n无论目标的体质豁免成功还是失败，晶片齐射完成后都会在目标旁边的一个空位生成一只月石晶体。该晶体立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺，也就是不会在生成后立即进行一次月石戳刺。月石晶体的完整数据见下方“生物二”。\n\n**掠流滑翔（Current Glide，消耗 1 个传奇动作）。** 晶血龙兽移动至多等于当前所使用移动方式速度一半的距离。这次移动不会引发借机攻击。\n\n### 附赠动作与反应\n\n来源没有定义晶血龙兽的专属附赠动作或反应。\n\n## 生物二：月石晶体（Moonstone Crystal）\n\n中型构装体，无阵营。它是由晶血龙兽的晶片齐射生成的固定晶体，每一只都有独立的生命值、状态和战斗成员。\n\n- 护甲等级：17。\n- 生命值：15。资料只给出固定生命值 15，没有提供生命骰公式。\n- 速度：步行 0 尺、飞行 0 尺、游泳 0 尺、攀爬 0 尺、掘穴 0 尺；不能移动。\n- 力量 10、敏捷 10、体质 10、智力 1、感知 10、魅力 1。\n- 先攻：+0。\n- 挑战等级：0。熟练加值：+2。\n- 语言：无。\n- 伤害抗性、伤害免疫和伤害易伤：资料没有添加额外设定。状态免疫：资料没有添加额外设定。\n- 感官：来源没有列出额外感官或被动察觉值。\n- 经验值：来源未提供。\n\n### 特性\n\n**固定晶体（Immobile Crystal）。** 月石晶体是不能移动的构装体，所有速度均为 0。它由晶片齐射生成在目标旁边的一个空位中，随后立即投掷先攻并加入当前战斗。晶体被摧毁后停止行动。\n\n**月石腐化（Moonstone Corruption）。** 这项能力只在月石戳刺造成的敏捷豁免失败之后使用。目标进行一次 DC 18 魅力豁免；成功时无效果。失败时，目标受到绯晶腐化（月石腐化）；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。这里的“月石腐化”和晶血龙兽的“绯晶腐化”代表同一个状态，不互相叠加成两个不同状态。腐化的移除按战役规则由 GM 处理。\n\n### 动作\n\n**月石戳刺（Moonstone Spikes）。** 在月石晶体自己的回合开始时，它向周围 10 尺内除自身以外的所有生物伸出不规则的月石尖刺，不区分敌友。每个生物分别进行 DC 18 敏捷豁免。\n\n- 豁免失败：受到 2d6（平均 7 点）穿刺伤害，随后进行一次独立的 DC 18 魅力豁免，并按月石腐化处理。\n- 豁免成功：不受伤害，也不进行腐化豁免。\n\n每只晶体每回合只能戳刺一次。晶体刚生成时不会在生成瞬间额外戳刺；晶体生命值为 0 时不再戳刺。\n\n### 附赠动作、反应与传奇动作\n\n来源没有定义月石晶体的专属附赠动作、反应或传奇动作。\n\n## 召唤关系与希望自动完成的部分\n\n我希望生成两个独立的生物条目，并提供配套自动化。自动化应当协助完成以下来源已经定义的内容：\n\n- 处理晶血龙兽的 4 点传奇动作资源，使传奇动作在晶血龙兽自己的回合开始时全部恢复，并按各选项分别消耗 1 点或 2 点。\n- 记录绯晶拒绝每天两次的使用情况；使用后让月蚀守护碎裂到晶血龙兽下一回合开始，并在次数耗尽后让守护恢复为只能减去 5 点伤害的削弱形态。\n- 在月蚀守护触发时，把同一次伤害结算的不同伤害类型合计，只有总伤害超过 20 点才处理减免；守护完整时减半并向下取整，碎裂时不减免，削弱时减去 5 点。\n- 处理晶片齐射的两阶段豁免、伤害、恍惚和生命值不高于一半时的腐化豁免。齐射结算完成后，无论目标豁免结果如何，生成一只月石晶体，在目标旁边的一个空位立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺。\n- 为每只晶体分别记录生命值和状态。晶体在自己的回合开始时，对周围 10 尺内所有其他生物执行一次月石戳刺，先做敏捷豁免，只有敏捷豁免失败者才做后续魅力腐化豁免。晶体被摧毁后停止这项行动。\n- 只在能力文字明确要求时处理绯晶腐化；首次失败标记为腐化，已有腐化者再次失败时增加 1 级力竭。腐化的解除仍由 GM 按战役规则处理。\n\n由 GM 决定或需要 GM 确认的内容包括目标选择、不同合法空位之间的选择、攻击和传奇动作的战术选择，以及来源没有明确定义的召唤规则。\n\n## 来源未指定、需要 GM 确认的规则\n\n以下内容没有在这两份生物资料中定义，不能自行补成确定规则：\n\n- 月石晶体的召唤持续多久，以及在什么时点结束。\n- 同时存在的月石晶体数量上限；资料只写明每次晶片齐射生成一只，没有给出总上限或每个召唤者的上限。\n- 晶血龙兽死亡、失去意识、离开场景、离开当前战斗或进入其他场景时，已经生成的月石晶体是否消失、停止、继续存在或改变归属。\n- 月石晶体被摧毁后是否需要从场景中移除指示物或从战斗中移除成员；来源只明确说它停止行动。\n- 晶片齐射使用时如果当前没有战斗，如何投掷先攻以及是否仍然生成晶体。\n- 目标旁边没有合适的空位时如何处理，以及有多个空位时由谁选择；来源只要求目标旁边的一个空位。\n- 绯晶拒绝的“每天两次”在何时恢复；资料没有指定长休、每日固定时点或其他恢复方式。\n- 月石晶体是否需要专注、是否需要召唤者持续维持，以及晶体对召唤者和其他生物的友好关系、控制者和指挥方式。\n","docs/generated-actor-verification.md":"# Generated Actor / Item Verification\n\n## Required Source-To-JSON Checks\n\nFor each generated Actor JSON, manually compare the generated output against the source markdown:\n\n- Identity: name, bilingual name handling, creature type, size, and alignment.\n- Language and source fidelity: a single-language source remains in its source language, while existing bilingual text keeps its original correspondence; translation is not a prerequisite for acceptance.\n- Core stats: AC, HP, hit dice, speeds, abilities, saves, and skills.\n- Traits: senses, languages, damage resistances, damage immunities, damage vulnerabilities, and condition immunities.\n- Actions: action count, action names, attack bonuses, reach or range, damage formulas, damage types, and descriptions.\n- Saves and effects: DCs, save abilities, success and failure behavior, conditions, durations, and repeated-save rules.\n- Legendary, reaction, and bonus actions: count, cost, activation type, and descriptions.\n- Spellcasting: spell list, spell save DC, spell attack bonus, preparation or innate-casting rules, and linked UUIDs where expected.\n- Automation: activities, active effects, flags, module-specific fields, and effect-profile behavior.\n- Description fidelity: important source text is preserved or intentionally transformed.\n- Source coverage: every mechanically relevant source markdown section is represented or intentionally excluded.\n- No false effects: prerequisite-only text does not create on-hit effects unless the source explicitly applies that effect.\n- Output provenance: final JSON came from the project CLI or workflow, not manual construction or repair.\n\nWhen the source entered through document extraction, plaintext ingestion, or AI Intake, also trace the exact source identity through its source-scoped evidence/run artifacts, evidence IR where applicable, rendered Markdown, portable manifest evidence where applicable, and final JSON. Confirm that page/coordinate/language/confidence/line-order evidence for documents, and per-entity/aggregate equivalence for plaintext collections, were not replaced by an unrelated source or run.\n\nFor each generated standalone Item, also compare:\n\n- Identity and category: bilingual name, source category, normalized Foundry document type, rarity, attunement, weight, price, and equipment subtype.\n- Activities: inspect each `system.activities` entry for activation, target/range, consumption, uses/recovery, save/attack/damage, and its actual source-derived stage membership.\n- Effects: every structured embedded effect exists once, has a unique ID, and is referenced only by the Activities that apply it; check each Activity-to-Effect linkage rather than only counting effects.\n- Profile isolation: `core` contains no MIDI-QOL, DAE, Times Up, or Item Macro fields; a modded profile uses only the locked target-version contract.\n- Stage provenance: names, requirements, uses, and mechanics come from structured source data. A literal-only stage must remain `needs_review`.\n- Complex-rule boundary: if the locked target cannot express the source rule natively, the result must say `gm-assisted` or `external-rule` with preserved source text. Static JSON, a utility-shaped placeholder, or a passing verifier is not native automation acceptance.\n\n## Shared Verification Gate\n\nAll supported entry points must run the same canonical generation pipeline. Before a formal write:\n\n- Every canonical attack, damage, save outcome, activation, use, effect, range, and stage is projected once or explicitly marked `literal-only`/`unsupported`.\n- Activity/Effect IDs are stable, 16 characters, unique within their document, and map keys equal Activity `_id` values.\n- Duplicate IDs, dangling Effect references, lost mechanics, save-outcome drift, invalid target fields, or profile leakage are blocking errors.\n- `needs_review` and `failed` results do not enter formal single-file output or collection ZIP artifacts.\n- A source-scoped `needs_review`/`failed` result cannot be promoted by editing rendered Markdown or JSON by hand; regenerate from the accepted upstream chain instead.\n\n## Version-Specific Checks\n\nWhen generating for `--fvtt-version 12` or `13`, check:\n\n- Actor, embedded Item, standalone Item, and ActiveEffect `_stats.systemVersion` are dnd5e `4.3.9`.\n- Item activation lives on Activities; legacy Item-level `system.activation` is absent.\n- Uses use `spent`, `max`, and `recovery`; legacy `value` and `per` are absent.\n- The result passed locked 4.3.9 structural assertions. Do not report a Foundry runtime pass unless that exact artifact was imported and exercised in a separately recorded runtime.\n\nWhen generating for `--fvtt-version 14`, also check:\n\n- Actor, embedded Item, and ActiveEffect `_stats` use Foundry `14.364` and dnd5e `5.3.3`.\n- NPC resources use v14/dnd5e 5.x source fields such as `max` and `spent`, not legacy `value`.\n- Senses use `system.attributes.senses.ranges.\u003csense>` plus `special`, not direct legacy sense fields.\n- Item activities carry activation data; item-level `system.activation` is not used as the v14 source of truth.\n- Save activities use `save.dc.calculation` and `save.dc.formula`; `save.dc.value` is prepared by dnd5e and should not be emitted as source data.\n- Uses data omits legacy `value` and `per`; generated source should use `spent`, `max`, and `recovery`.\n- Spell fallback items use `method` and `prepared`, not legacy `preparation.mode`.\n- Active Effect changes target schema-backed v14 fields, for example AC flat/formula fields rather than legacy AC bonus fields.\n- If `--icon-mode safe` was used, every embedded/standalone Item has a catalogued Foundry core or dnd5e path, the adjacent `*.icon-review.json` records the chosen source/confidence/reasons, and fallback decisions remain explicit rather than being reported as semantic matches.\n- Review representative exact mappings and all semantic mappings visually. Confirm close negatives remain on a type default or an explicit reviewed override.\n- Runtime import/readback is a separate gate. State whether the exact project-local Foundry 14.364 runtime was available for this run.\n\nWhen generating for `--fvtt-version 14 --effect-profile modded-v14`, also check:\n\n- The current locked module target is MIDI-QOL `14.0.11` and DAE `14.0.12`. Reports executed against MIDI-QOL `14.0.9` remain historical evidence and do not prove the `14.0.11` runtime.\n- Times Up fields or assumptions are not required for v14 output.\n- Item Macro is not treated as a required dependency unless a v14-verified version is separately documented.\n- `flags.midi-qol.OverTime` is emitted only when the source text explicitly provides a repeated-effect formula and damage type.\n- The OverTime formula comes from the repeated-effect clause, not from an earlier hit or attack damage clause.\n- Any macro-style automation remains guarded and falls back to GM manual handling when MIDI-QOL workflow context is missing.\n\n## Portable Spellcaster Verification\n\nFor an Actor carrying `flags.fvtt-json-generator-spell-resolver.spellManifest`, verify the project artifact before importing it:\n\n- `spellResolution.status` is `pending`; `pending` is the correct portable-project state, not a failed hydration claim.\n- Every manifest ref is backed by an exact source evidence range and retains its source usage, ability, DC, attack bonus, component waiver, and literal restrictions.\n- The Actor contains no placeholder embedded Spell, resolver-managed Cast Activity, local Actor/Item UUID, or destination Compendium UUID.\n- Each manifest group links to exactly one real generated source feature by stable identity rather than item order or translated display name.\n- The Actor was regenerated by the CLI/workflow and checked with the Intake verifier; hand-repairing the Actor invalidates this layer.\n\nThis is the portable/static layer: it proves portability and source fidelity only. It does not prove that any destination-world Spell exists, that hydration occurred, or that any spell can be cast.\n\n## Target-World Resolver Report Verification\n\nAfter ordinary Actor import into the exact supported Foundry/dnd5e runtime, inspect the resolver report:\n\n- The source index includes every enabled and readable Item pack, including packs without a spell-specific manifest hint.\n- All refs resolve before the first write; any missing, ambiguous, contradictory, stale, or undecided manual conflict withholds the whole plan.\n- A matching 2024 candidate wins; a 2014 selection is allowed only when no same-key 2024 candidate exists and is visibly reported as fallback.\n- The hydrated graph contains one native Cast Activity and one native cached Spell for each ref, with exact `cachedFor`, `compendiumSource`, resolver ownership, source feature, and selected UUID linkage.\n- No placeholder, duplicate cache, foreign item adoption, or unrelated Actor/item/activity/effect/flag mutation occurred.\n- Manual Keep, Overwrite, Cancel, close, rollback, and recovery-required outcomes match the report and leave no hidden partial success.\n\nThis is the target-world hydration layer: it proves deterministic destination selection and document construction. It does not substitute for using the native activities.\n\n## Live Native Spell-Use Acceptance\n\nIn the destination world, actually use representative hydrated spells:\n\n- Run an attack workflow and confirm the native roll uses the source attack bonus.\n- Run a save workflow and confirm the native card uses the source DC and ability.\n- Open and cast a utility spell; verify source target restrictions such as self-only.\n- Use a limited spell twice to confirm the first use spends only its own Activity and the second is blocked by native behavior.\n- Use an at-will spell repeatedly and confirm no daily use is spent.\n- Confirm component waivers are represented by native Cast data and literal-only restrictions remain visible without claiming unsupported automation.\n- Disable the resolver after hydration and prove cached Spells still open and cast natively.\n\nThis is the native runtime layer. Portable/static verification, resolver hydration verification, and live-use acceptance are three separate gates. Passing any one of them cannot be used to claim the other two.\n\n## v14 Batch Acceptance\n\nFor project-internal v14 core acceptance without a local Foundry runtime, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --out-dir \"obsidian/dnd数据转fvttjson/output/v14-acceptance\" --report \"docs/acceptance/v14-core-batch-verification.md\"\n```\n\nFor project-internal v14 module-profile acceptance, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --effect-profile modded-v14 --out-dir \"obsidian/dnd数据转fvttjson/output/v14-modded-acceptance\" --report \"docs/acceptance/v14-modded-batch-verification.md\"\n```\n\nThe batch suite must:\n\n- Generate every JSON artifact through the project conversion workflow with `--fvtt-version 14` and `core` semantics.\n- For the modded suite, generate every JSON artifact through the same workflow with `--fvtt-version 14 --effect-profile modded-v14`.\n- Disable optional translation services so acceptance output is source-faithful and not affected by external model behavior.\n- Include a local GoddessFantasy fixture pipeline sample that covers crawl -> records -> plaintext -> actor JSON.\n- Record actorVerification warnings in the report instead of treating schema success as semantic success.\n- Keep live Foundry v14 import as an explicit unresolved runtime check when no local Foundry v14 runtime is available.\n\n## Completion Standard\n\nA generated Actor JSON result is correct only when:\n\n- The project CLI or workflow regenerated the target JSON.\n- The JSON parses.\n- Relevant tests passed, or known baseline failures are explicitly separated from the current change.\n- The source markdown comparison above was completed.\n- Any Foundry, dnd5e, or module-dependent behavior was checked against locked local references for the target version.\n- Any remaining uncertainty is reported with the exact source field, generated field, and reference gap.\n","docs/item-ai-intake-v14.md":"# AI Item Intake: TXT to Foundry V14 Item JSON\n\n## What this path accepts\n\n`--intake-items` is the formal path for a natural-language TXT or irregular Item Markdown. It is intentionally separate from `--ingest-items` and `--ingest-items-json`, which remain strict-format compatibility commands.\n\nThe supported target is exactly Foundry VTT `14.364`, dnd5e `5.3.3`, and effect profile `core`. The command refuses another target or profile before the AI provider is called.\n\n```powershell\nbun run src/index.ts --intake-items \"F:\\source\\item.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n`--dry-run` validates input limits and target selection but does not call a provider or promote files. A run contains at most 50 Item candidates and 200,000 JavaScript UTF-16 characters.\n\n## Acceptance boundary\n\nThe provider returns an evidence-bearing `ItemIntakeIR`, not Foundry JSON. Every candidate field and ability has an exact source range. The project then validates the ranges, claims and candidate boundary, renders an Item Markdown `item-mechanics` YAML contract, invokes the normal Item parser/generator, and verifies the generated JSON field by field.\n\nOnly a fully `accepted` run promotes Markdown to `input/items/` and JSON to `output/items/`. Source text, IR, deterministic diagnostics, provider audit, rendered Markdown and review material stay in `.local/item-intake-runs/\u003crun-id>/`. Candidate JSON is not a formal output and is not offered by the Web job unless the item is accepted.\n\nThe current core contract supports:\n\n- Explicit `AC +N` only: a transfer Active Effect with `system.attributes.ac.formula`, `type: add`, `phase: initial`.\n- A light ability with explicit action, bright radius and dim outer radius: a zero-cost `utility` Activity which applies a non-transfer Actor effect. Disabling or deleting that Actor effect extinguishes the light.\n- Shared Item uses with explicit recovery. `recoverAll` at `dawn` is represented on the Item uses pool. The strict Markdown `item-mechanics` boundary requires a positive integer capacity, supported recovery periods/types, and numeric or simple dice recovery formulas; it rejects misspelled recovery values. Scaled save consumption must be an integer within the pool capacity, with a valid maximum no greater than that capacity.\n- A uniquely resolved spell: a `cast` Activity consuming `itemUses`, with `spellSlot: false`. The submitted identifier and English name must case-insensitively select the same spell in the manifest-pinned dnd5e `5.3.3` source catalog; ambiguous, missing, or mismatched references are rejected and are never changed into Utility Activities.\n\nFor example, the dormant Jewel of Three Prayers contract has AC `+1`, an action to apply `bright: 15` / `dim: 30` light with no charge cost, a three-charge dawn-recovery pool, and a one-charge `Invisibility` cast. `dim: 30` is the outer edge of dim light, not an additional 30 feet after the bright radius.\n\n## Provider configuration and review\n\nItem Intake reuses the existing `MONSTER_INTAKE_*` configuration and `--intake-doctor`; this is shared provider plumbing only. It does not run the Monster IR or compatibility normalizer.\n\n```powershell\nbun run src/index.ts --intake-doctor\n```\n\nIf a run needs decisions, use its bundle rather than editing generated JSON:\n\n```powershell\nbun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" `\n  --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\nFor this first Item contract, the only decision that can be resumed is an explicit `replace` for a `target-conflict:*` promotion finding; the prior files are copied into the run bundle before replacement. Evidence and mechanics findings are intentionally not overrideable by a decisions file: correct the TXT/Markdown and start a new Intake run instead.\n\nThe legacy `--enable-ai-normalize` hook is not Item Intake. It only assists strict project Markdown and, if unavailable or failed, returns no normalized mechanics so the original source is parsed; it can no longer silently manufacture `abilities: []`.\n\n## Runtime status\n\nStatic parser/generator/verifier and CLI/Web isolation tests cover the exact Jewel contract. The Foundry 14.364 local-lab activity lifecycle is a separate acceptance layer: do not promote this path from **Partial** to a runtime **Pass** until import, applied light effect, effect disable/remove, charge exhaustion, no-spell-slot consumption, and dawn recovery have all been observed in a disposable world. No production world is part of this workflow.\n","docs/runbooks/handbook-maintenance.md":"# 中文工具手册：维护与合并\n\n## 日常打开\n\n双击仓库根目录 `工具手册.html`。这是包含中文工具说明、全文搜索、分类目录、命令和选定原始文档的单文件页面；不依赖 Bun、Foundry、网络、CDN 或后台服务。\n\n推荐收藏 **master 工作区里的文件**，或给该文件创建桌面快捷方式。功能和手册一起合并后，刷新这个页面即可。单独复制到其他位置的 HTML 是当时的快照，需要重新复制才会更新；没有文件监控或远程自动更新。\n\n## 内容放在哪里\n\n- `docs/handbook/catalog.json`：生成器、资料处理、检查与开发工具。\n- `docs/handbook/modules.json`：每个 Foundry 模块的独立用户说明。\n- `docs/handbook/reviewed.json`：作者对照实现和来源后的核对日期、说明与内容指纹。\n- `docs/handbook/template.html`、`style.css`、`client.js`：离线页面。\n- `docs/handbook/build.mjs`：构建与只读一致性检查，不修改生成器和 Foundry。\n- 根 `工具手册.html`：确定性生成、随功能一起提交的用户交付物，不能手工修补。\n\n## 每次完成新功能或修改旧功能\n\n1. 在同一个功能 worktree 中更新对应条目的用途、选择时机、准备、操作步骤、产物和限制。新增模块必须有独立条目；新增 app/package/tool 必须登记 `watch` 归属。共享实现可被多个条目关注。\n2. 核对 `sources` 中的权威 Markdown 和实际入口。来源出现矛盾时优先查明实现与最新支持边界，在条目中明确限制；不能把历史文档的“通过”提升为当前运行时通过。\n3. `watch` 覆盖对应实现目录或文件。检查读取 Git 已跟踪和未忽略的新文件，忽略测试、scratch、dist；生产逻辑、文档或入口变化会使指纹过期。不要缩小 watch 来绕过检查。\n4. 查看受影响条目：\n\n   ```powershell\n   bun run handbook:status\n   ```\n\n5. 对照确认后，记录具体核对内容。下面的 `\u003cid>` 替换为报告里的真实 ID；多个已经核对的 ID 可用逗号分隔。\n\n   ```powershell\n   bun run handbook:review -- \u003cid> --note \"已对照入口与来源，更新新功能步骤和适用限制\"\n   bun run handbook:build\n   bun run handbook:check\n   ```\n\n   若实现变化确实不影响用户说明，也必须写明核对结论，例如“仅调整内部缓存，入口、结果与限制保持一致”。review 是作者确认记录，不是自动语义验收，不可盲目批量确认。\n\n6. 实际双击 HTML，检索新功能，打开受影响条目，对照文义和命令。如果修改页面交互，还要检查桌面与窄屏、主题、返回导航、深链接和复制命令。修改检查器运行 `bun run handbook:test`，它在随机临时仓库验证失效来源、新工具漏登记和过期页面等拒绝路径。变更测试或运行器时，可用安全入口 `bun run handbook:test:bun` 有界核对全仓 CI 所用的 Bun runner 兼容性，不直接执行内部 raw 脚本。\n7. 在已有发布授权范围内，把实现、说明、核对记录和生成页面一起提交并合并到 master。合并产生新组合时，重新核对受影响条目并生成页面；不要保留两侧都已过期的 HTML。\n8. 合并后在 master 运行 `bun run handbook:check`，刷新固定入口并检查本次新增/修改条目。记录同步结果；用户基线、索引与发布门禁仍按 worktree runbook 执行。\n\n## 自动检查会做什么\n\n`handbook:check` 接入 `ci:verify`。它会拒绝缺失来源、重复 ID、无效步骤、不存在的 Bun 命令、内部 raw 测试入口、新工具目录未登记、实现/来源指纹过期，以及生成 HTML 和当前内容不一致。\n\n检查不会自动改写文字，不访问网络，不安装 Git hook，也不会自动 commit、merge 或 push。默认 build 同样不会更新核对记录。仓库 CI 的失败会报告不同步；是否阻止远端合并由仓库既有分支保护设置决定，本任务没有修改该设置。\n\n使用已提交 HTML 是刻意的：这样仅凭仓库文件就能阅读。合并同时带来新的说明和页面，不要求用户每次打开前再启动构建器。\n\n## 内容边界\n\n- 常规生成示例显式使用 v14/core，默认 icon-mode off；专门的图标操作才展示 safe。\n- 原始文档按原文离线展示，其中可能有历史状态和旧运维例子。当前推荐操作以人工核对的条目为先。\n- 当前旧 Vault Sync 的备份行为与用户无备份规则冲突，手册明确标注，不提供默认执行捷径。模块安装、迁移等旧文档也不能绕过无备份和授权规则。\n- 不把 `.local`、私有文档、真实生产地址或凭据加入 sources。不要将“构建可打开”写成“功能全部实测通过”。\n","docs/species-ai-intake-v14.md":"# Species AI Intake：TXT → Markdown → Foundry V12/V14 race/feat\n\n`--intake-species` 是不规则 TXT 或已人工编辑 Species Markdown 的正式入口。允许的精确目标只有 Foundry `12.331` / dnd5e `4.3.9` / `core` / 2024（`V12 static candidate`），或 Foundry `14.364` / dnd5e `5.3.3` / `core` / 2024（保留既有 V14 运行验收）。V13、legacy/2014、`modded-v12` 和第三方模块兼容均 fail-closed。\n\n## 数据链与状态\n\n```text\nTXT → discovery → Species Evidence IR → deterministic Markdown\n    → parser → target race/feat package → target validator → AI review\n    → accepted ledger → 独立模块 build\n```\n\n一个 TXT 最多发现 50 个互不重叠候选。每个候选单独得到 `accepted`、`needs_review` 或 `failed`；整次运行可为 `succeeded`、`partial`、`needs_review` 或 `failed`。运行包位于 `.local/species-intake-runs/\u003crun-id>/`，保存不可变来源、discovery、逐候选 IR、Markdown、JSON package、确定性报告、AI review、provider audit 和 manifest。\n\nAI 不直接编写正式 JSON。证据范围、完整 coverage、字段范围、mechanic allowlist、Markdown parser、目标 projector、package validator 与 AI cross-review 全部通过后，候选才会推广到：\n\n- V14：`input/species/\u003cidentifier>.md`；V12：`input/species/v12/\u003cidentifier>.md`，两个目标的已接受来源分别保存，避免一次修改使另一个版本的 ledger 失效。\n- V14：`output/species/\u003cidentifier>.json`\n- V12：`output/species/v12/\u003cidentifier>.json`\n- `output/species/accepted-ledger.json`\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为唯一身份，V12 与 V14 可以共存且互不覆盖。schema v1 只解释为 V14/core/2024；读取、验证或 build 不会改写旧 ledger，只有一次新的成功 promotion 才原子升级为 v2。同一目标的 Markdown、package、ledger hash 必须闭合，另一目标的 package 不能冒充证据。\n\n## Markdown 契约\n\nSpecies Markdown 的 frontmatter 使用 `layout: species`、`species-schema: 1`、稳定 identifier、2024 rules、生物类型、体型、移动、感官、私有 homebrew 来源哈希与精确 UTF-16 长度，以及显式 feature/part ID。正文每个特性都有 `species-feature:\u003cid>` 稳定标记；文末的原始资料区按记录长度逐字符保留候选全文，包括首尾空白和 CRLF。\n\n允许的 v1 mechanics 只有：\n\n- `descriptive-passive`\n- `gm-assisted`\n- `external-rule`\n- `hp-per-level`\n- `ac-bonus`\n- `limited-utility`\n\nMarkdown 不允许填写任意 Foundry system path 或任意 Active Effect change。复杂但来源明确的规则可以诚实地以 `gm-assisted` / `external-rule` accepted；必须保留完整规则、触发条件和未自动化边界，不能用空 Utility 冒充实现。\n\nEvidence IR 使用字段级 claim：身份、规则版本、生物类型、体型、移动、感官和每个 feature 都必须有唯一 JSON-pointer path 与精确来源区间。coverage 必须无缝分割候选，并与这些 claim 双向引用；`ignored-with-reason` 必须写明原因。一个笼统的 `/species` claim 不能通过晋升门禁。\n\n## 命令\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nV12 static candidate 使用同一入口：\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 12 `\n  --effect-profile core\n```\n\n`--dry-run` 不调用 provider、不创建 run bundle、不推广正式文件。V13、modded/legacy 和其他 target/profile 会在 provider 调用前失败。\n\n处理精确 target conflict 或恢复 provider 故障：\n\n```powershell\nbun run src/index.ts --resume-species-intake \".local/species-intake-runs/\u003crun-id>\" `\n  --decisions \".local/species-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\ndecision 只能批准精确 `target-conflict:\u003cidentifier>` 的 replace；不能覆盖来源证据、coverage、语义或 unsupported mechanic finding。\n恢复会创建新的 immutable run；新 manifest 和 accepted ledger 同时记录 `resumedFromRunId` 与 decisions 文件 SHA-256，从而能回溯被恢复的旧 run，而不是改写旧证据。\nresume 命令中的版本/profile 必须与原 run 完全一致；目标漂移在 provider 调用前拒绝。\n\naccepted Markdown 可以编辑，但 ledger 保存了当前 Markdown SHA-256。任何字节变化都会使条目 stale，模块 build 立即 fail-closed。编辑后必须再次把该 Markdown 交给 `--intake-species`，重新生成 run、IR、review、JSON 和 ledger revision。\n\n## 累计内容模块\n\n```powershell\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\nbun run build:homebrew-species:v12-candidate\nbun run verify:homebrew-species:v12-candidate\n```\n\n`fvtt-homebrew-species` 是纯内容模块，只有 `species` 和 `features` 两个 Item Compendium。V14 默认输出仍为 `dist/`；V12 static candidate 输出为 `dist/v12-candidate/`，identity 带 `supportStatus: \"static-candidate\"`。build 只读取当前目标的 accepted ledger 条目和 Markdown，重新走 parser/projector/validator，在随机临时根生成两次 LevelDB 与确定性 ZIP，并检查 identity/coverage/UUID 闭合。V12/V14 的 module ID、pack 名、Race/Feature/Effect/Advancement ID 与 Compendium UUID 相同，版本 metadata 和 Activity 形状是允许差异。\n\nV12 candidate 可以在隔离测试中使用显式 `FVTT_OPS_TEST_CLASSIC_LEVEL_ENTRY` 写入并回读 LevelDB；任何未来可安装 V12 build 必须使用真实 `app/12.331/node_modules/classic-level`。本轮没有扩展安装器、创建 V12 Lab、安装模块或运行 Foundry。\n\n现有安装器仍只属于已验收的 V14 路径；V12 candidate 不得调用它。V12 ZIP 构建成功、LevelDB 回读或静态 validator 绿色都不构成 V12 Runtime Pass。\n\n散装 JSON 是模块绑定的审阅/构建输入；race ItemGrant 使用 `Compendium.fvtt-homebrew-species.features.Item.\u003cid>`，因此不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Item 是快照，v1 不提供迁移器。\n\n## 食人魔 v1 自动化边界\n\n- race 原生表达 giant / Ogre、Large、40尺、60尺黑暗视觉和 2024/private-homebrew 来源。\n- 巨武器四条完整保留为 `gm-assisted`；不写武器、不生成 Activity/Effect/flag、不解释“体型不超过你二级”、不判定建筑、不移动 Token、不重复已有推击。\n- 身强力壮的受擒脱困优势仅为描述性被动，不扩大成全局属性优势，也不自动移除 Grappled。\n- 5级附赠动作脱困是 2/LR、每次消费1的 Bonus Action Utility；聊天卡要求按原规则进行相应属性检定，不固定力量/敏捷/技能。\n- 食人魔刚毅使用 transfer ADD `system.attributes.hp.bonuses.level = 3`，即总等级 N 时增加 `3N` 最大生命值。\n- 食人魔笨拙使用 transfer ADD `system.attributes.ac.bonus = -2`；倒地后花费全部速度站起保持 `gm-assisted`。\n- 不添加来源未声明的 ASI、语言、触及、负重、武器熟练、徒手伤害、抗性或大型生物额外收益。\n\n## 当前验收边界\n\nV12 当前只通过静态候选层：锁定 4.3.9 模型的 Race、Size、ItemGrant、Utility Activity、itemUses、lr/sr recoverAll、Race 升级流以及 HP/AC Effect 路径有参考契约；Ogre V12 package 已逐条核对语义；两次 clean candidate build 的树、logical hash、UUID 和 ZIP 可确定重现。当前机器没有 V12 Lab，因此尚未验收 Token 2×2、真实 Add Species UI、1→5 级升级、AC/HP 运行值、次数消耗、Long Rest 或重开读回。只能声明“V12 静态候选支持”，不能声明“V12 可用”或“V12 正式支持”。\n\n自动测试继续使用 fake provider，以保持离线、确定和可重复；正式食人魔另以本机 Codex OAuth provider 完成了真实运行 `species-20260811022558-9a41c4a1`。该 run 的 deterministic report 与 AI review 均为 `accepted`，没有 repair；正式 ledger、Markdown 与 JSON 的来源/内容/logical hash 闭合。模块 build/verify 得到 1 个 race、5 个 feat，ZIP SHA-256 为 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。\n\n本地 `fvtt-v14-module-matrix` disposable world 已在 Foundry `14.364` / dnd5e `5.3.3` 中安装并启用该模块。原生 Add Species 流程确认 giant/Ogre、Large、40尺、60尺黑暗视觉和 AC 10→8；1级 Barbarian 的最大生命值为 12+3=15，5级为 40+15=55；5级附赠动作脱困连续消耗至 0/2，第三次没有生成聊天卡，Long Rest 恢复为 2/2。聊天卡明确要求手动执行原受擒检定，不选择属性/技能、不自动解除状态，并保留身强力壮优势。巨武器与“体型不超过你二级”始终是 DM 现场判断，未生成系统体型测试、武器写入、推击或 Token 移动。\n\n这仍不是无边界的 runtime Pass：本次没有完成精确 2×2 Token 放置、现有武器应用种族前后的字节级比较或 Actor 导出/读回。长期跑团也未验收。\n\n## 2026-08-13 线上 8080 部署记录\n\n- 用户明确授权把该模块安装到线上 `8080` 并重启；本次只操作 `fvtt-production` 的 `8080`，`51020` 的 v14 进程保持运行且未写入。\n- 用户同时明确要求本地和线上不创建备份，也不以在线人数为执行门槛。本次没有创建模块或世界备份；只使用唯一的 ZIP 暂存与构建验证目录，不保留旧模块副本。\n- 远端模块目录 `E:\\Bill\\fvtt_v13\\data\\Data\\modules\\fvtt-homebrew-species` 已落盘 10 个文件、31,577 bytes；manifest 为 `fvtt-homebrew-species` / `1.0.0`，包含 `species` 与 `features` 两个 Item pack。线上 HTTP 可读 `module.json` 与 `data/identity-manifest.json`，logical hash 为 `d9bd6759dc378333f314431e7839d2d3beadd6eb0e6faf9b9a440168f07258fd`，1 race / 5 features。\n- 重启后的精确命令为 `E:\\Bill\\v14\\code\\main.js --port=8080 --dataPath=\"E:\\Bill\\fvtt_v13\\data\" --world=cor-cotn`；最终 `/api/status` 为 active、Foundry `14.364`、dnd5e `5.3.3`、world `cor-cotn`，监听 PID 为 9852。日志记录 `Server started and listening on port 8080`，没有新增该模块错误。\n- 为清除无进程占用的启动锁，删除了 `E:\\Bill\\fvtt_v13\\data\\Config\\options.json.lock`；没有直接编辑世界 LevelDB。\n- 生产模块文件已安装并可由 Foundry 服务提供，但未取得 `Gamemaster` 密码，不能通过 UI 证明 `cor-cotn` 已启用该模块；因此“已安装/服务已恢复”为 Pass，“世界已启用/食人魔已在生产界面可用”保持未验收，不把文件落盘冒充启用。\n- 线上部署使用的 ZIP SHA-256 是 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。master 集成前的 Markdown revision review 只更新 accepted Markdown hash/run 证据，Foundry documents 与 module logical hash 未变；当前本地重建 ZIP SHA-256 为 `77281eac8e0c5e3f7bd6f2ec3d44603da53b9d2eb0845b450bf4721cd9466e11`，本轮合并没有重新部署线上模块。\n","docs/web-ai-connections.md":"# Web AI connections\n\nThe Web worker supports three explicit AI connection kinds:\n\n1. `site`: the server-owned Intake provider. It is disabled by default and is\n   quota-limited per anonymous session, client IP, and process-wide daily\n   budget.\n2. `user-api-key`: a browser-created BYOK connection. The key is held only in\n   the in-memory session registry, is never written to a job or log, and is\n   cleared when the connection expires or is disconnected.\n3. `local-codex`: a Windows Companion that makes an outbound WebSocket\n   connection and runs the user's already-authenticated official Codex CLI.\n   OAuth credentials never leave the user's machine.\n\n## Public deployment\n\nKeep Bun loopback-only behind an HTTPS reverse proxy. Public mode requires:\n\n```text\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_AUTH_TOKEN=\u003c32+ random characters>\nFVTT_WEB_SESSION_SECRET=\u003c32+ random bytes, kept stable across restarts>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\nThe proxy must forward WebSocket upgrades for\n`/api/ai-companion/connect` and preserve the external HTTPS origin. The\nCompanion endpoint is `wss://\u003cpublic-origin>/api/ai-companion/connect` when\nthe public URL uses HTTPS. Never expose the Bun port directly.\nFor state-changing browser requests, forward `Host`, `X-Forwarded-Host`, and\n`X-Forwarded-Proto`; the server uses those headers only in public mode to\nvalidate the browser `Origin` against the external origin.\n\nThe anonymous browser session uses an HttpOnly, SameSite-Strict cookie. It\nexpires after eight hours idle or 24 hours absolute. Restarting the process\ninvalidates the in-memory session registry.\n\n## Site provider and BYOK\n\nSite AI requires all three limits before the server starts accepting site\nconnections:\n\n```text\nFVTT_WEB_SITE_AI_ENABLED=1\nFVTT_WEB_SITE_AI_SESSION_DAILY_LIMIT=20\nFVTT_WEB_SITE_AI_IP_DAILY_LIMIT=100\nFVTT_WEB_SITE_AI_GLOBAL_DAILY_LIMIT=1000\n```\n\nBYOK accepts `https://api.openai.com/v1` by default. Additional providers must\nbe exact HTTPS origins in `FVTT_WEB_AI_PROVIDER_ALLOWLIST`, for example\n`https://gateway.example.com`; credentials, query strings, fragments,\nredirects, private hosts, and arbitrary URLs are rejected.\n\n## Companion gate and pairing\n\n`web:dev` is loopback-only and enables the Companion endpoint for local\ndevelopment. It builds `dist/web/fvtt-ai-companion.exe` before starting the\nsingle Bun server on `http://127.0.0.1:5173`. Public/VPS deployments keep the\nCompanion hidden and disabled unless the server administrator explicitly sets:\n\n```text\nFVTT_WEB_CODEX_COMPANION_ENABLED=1\n```\n\nOnly current Windows Chrome and Edge are supported. Firefox is intentionally\nout of scope. The authenticated download endpoint is\n`GET /api/ai-companion/download`; it serves only the fixed build artifact and\nnever accepts a user path. If it is missing, build it with\n`bun run web:companion:build`.\n\nFor a local development page at `http://127.0.0.1:5173`, the page can check the\nlocal Companion directly. A remote page must use HTTPS. Its flow is:\n\n1. The user clicks connect, and the page opens a local confirmation window.\n2. That local window displays the exact remote website address and asks for a\n   deliberate approval.\n3. After approval, the local window sends a one-time, five-minute pairing\n   authorization only to the window that opened it, using browser memory. It\n   never appears in a URL, command line, log, job file, or download.\n4. The remote page uses it once to pair. The Companion then tests each selected\n   model before the connection becomes usable.\n\nThe loopback control service binds only `127.0.0.1:43173` and uses control\nprotocol v2. Before local approval it gives a remote website no cross-origin\npermission at all. After approval it returns CORS and local-network permission\nheaders only to that exact HTTPS origin. Pairing is bound to that origin, the\ncurrent Companion instance, and the current server pairing. Disconnect and\nshutdown each require a separate one-use control credential; knowing a public\ninstance ID is never sufficient. Popup blocking, rejection, expiry, a refused\nlocal-network permission, an unsupported browser, or a stopped Companion all\nproduce a user-facing recovery message.\n\nLeaving the model fields blank means the Companion invokes the user's current\nCodex CLI default; it does not inject a fixed model name. A user may specify\nmodels explicitly, but every selected main/review model must pass the real\nno-tool-call gate before the connection is ready. A gate failure never silently\nfalls back to a different model, site AI, BYOK, or a local OAuth bridge.\n\nThe adapter uses an ephemeral temporary directory, a read-only sandbox, and a\nstrict result schema. It disables the current tool features and rejects any\ntool-shaped JSONL event. The packaged Windows Companion uses the user's\nofficial `codex.exe`; it never receives project source or OAuth files. It no\nlonger accepts pairing tokens or pairing flags on the command line: users\ndouble-click the EXE and complete the approval in the page instead.\n\nThe server operator builds the Windows artifact once; end users receive only\nthe resulting executable and do not receive the project checkout or server\nsecrets. The compiled artifact hides the Windows console. It is an unsigned\ndevelopment build, so Windows SmartScreen may still require an explicit user\nconfirmation.\n\n## Job pinning and resume\n\nEvery AI job records only an opaque connection ID and an HMAC session binding.\nThe provider secret is not part of `result.json`, downloads, logs, or error\nresponses. Job polling, downloads, decisions, and resume are restricted to\nthe original anonymous session. Resume resolves the original connection; if\nit is expired, disconnected, or blocked, the job stays `needs_review` or\n`failed` and never silently switches to the site provider.\n","docs/web-deployment.md":"# fvttV12Json Web 部署说明\n\n这个 Web 工作台提供浏览器上传 Markdown/JSON、Bun 后端 workflow、任务进度，以及 JSON、Markdown、records 和 ZIP 下载。它默认是本机工具，不会因为执行 `web:start` 就监听公网接口。\n\n## 安全模式\n\n### 本机模式（默认）\n\n```bash\nbun install\nbun run web:build\nbun run web:start\n```\n\n默认地址是 `http://127.0.0.1:5174`：\n\n- 只绑定 IPv4 回环地址；\n- API 不要求 bearer token；\n- 忽略 `X-Forwarded-For` 和 `X-Real-IP`；\n- 如果把 `FVTT_WEB_HOST` 改为非回环地址却没有设置 `FVTT_WEB_PUBLIC_MODE=1`，进程会拒绝启动。\n\n开发环境可运行 `bun run web:dev`。命令会先构建前端，再由同一个 Bun 服务在\n`http://127.0.0.1:5173` 同时提供页面和 API；开发者只需要打开这一个地址。\n它还会在启动服务前编译 `fvtt-ai-companion.exe`，并在 loopback、本机模式下\n默认启用页面引导的 Codex Companion。显式设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=0` 可以关闭它；构建失败时不会启动旧页面\n或残缺服务。它不是热更新服务器，修改前端后重新运行命令即可生成新的页面资源。\n\n#### 无命令式 Companion 配对\n\n打开 `http://127.0.0.1:5173` 的“AI 连接”面板后，下载并双击\n`fvtt-ai-companion.exe`，选择模型并点击“连接本机 Companion”即可完成配对；用户不需要\n打开 PowerShell、复制启动命令或查看配对 Token。留空模型时使用这台电脑当前 Codex CLI\n默认模型；填写模型时，主模型和审查模型都会在连接前各自经过“不允许调用工具”的实际检查。\n\nCompanion 的 `127.0.0.1:43173` 只用于本机控制（health、pair、disconnect、shutdown），\n不是第二个 Web 地址，也不接受局域网连接。它只绑定 `127.0.0.1`，使用 control protocol\nv2。本机开发页只能来自精确的 `http://127.0.0.1:5173`。公开网页必须是 HTTPS：用户点击\n连接后会打开本机确认页，确认页显示精确的网站地址；只有用户点允许后，该网站才会在五分钟\n内拿到一次性配对授权。授权只保留在内存，不能写入 URL、命令行、日志或下载文件；配对、\n断开和关闭也都需要各自的一次性控制凭据。浏览器拒绝本地网络访问、弹窗被拦截、用户拒绝、\n授权过期或 Companion 退出时，页面会显示下一步处理方法。\n\n仅支持最新版 Windows Chrome 和 Edge；Firefox 不在本次支持范围。开发 EXE 使用隐藏控制台\n编译，未签名且可能触发 Windows SmartScreen；页面会显示构建产物 SHA-256，便于本机核对。\n生产 `web:start` 默认不启用 Companion；服务器管理员明确设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=1` 后，公开网页才会显示并允许使用它。\n\n### 公开/反向代理模式（显式开启）\n\n公开模式必须同时设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\n```\n\n该 token 是服务器之间的凭据，不是给浏览器页面填写的登录密码。推荐部署方式是：\n\n1. Bun 仍绑定 `127.0.0.1`；\n2. Nginx、Caddy、Cloudflare Access 或同类入口先验证真实用户；\n3. 反向代理在转发到 Bun 时注入 `Authorization: Bearer \u003cFVTT_WEB_AUTH_TOKEN>`；\n4. 浏览器永远不能读取或提交 VPS 的翻译 key、爬站 cookie、密码或这个 bearer token。\n\n如确实要直接监听网络接口，还必须显式设置 `FVTT_WEB_HOST=0.0.0.0`（或指定地址）。静态页面可以被读取，但所有 `/api/*` 请求仍必须携带正确 bearer token；不建议把这种直接绑定当作完整用户身份系统。\n\n## 环境变量\n\n部署与鉴权：\n\n- `FVTT_WEB_HOST`：监听地址，默认 `127.0.0.1`。\n- `FVTT_WEB_API_PORT`：端口，默认 `5174`。\n- `FVTT_WEB_CODEX_COMPANION_ENABLED=1`：显式启用本机 Codex Companion；`web:dev`\n  在非公开 loopback 模式下默认设置为 `1`，生产/VPS 启动默认关闭。\n- `FVTT_WEB_PUBLIC_MODE=1`：启用公开/代理模式；没有它时非回环绑定会失败。\n- `FVTT_WEB_AUTH_TOKEN`：公开模式必填，至少 32 个字符；不要提交到 Git、浏览器或日志。\n- `FVTT_WEB_TRUSTED_PROXIES`：允许提供客户端转发链的代理字面 IP，逗号分隔，例如 `127.0.0.1,10.0.0.2`。不支持主机名或隐式“信任全部”。\n\n资源边界（默认值）：\n\n- `FVTT_WEB_SHORT_REQUEST_LIMIT=10`：每客户端每分钟非 GET 请求数。\n- `FVTT_WEB_GLOBAL_SHORT_REQUEST_LIMIT=100`：所有客户端合计每分钟非 GET 请求数。\n- `FVTT_WEB_LONG_JOBS_PER_CLIENT=1`：每客户端同时运行的长任务数。\n- `FVTT_WEB_GLOBAL_LONG_JOBS=4`：整个进程同时运行的长任务数。\n- `FVTT_WEB_JOB_RETENTION_HOURS=24`：终态任务产物保留小时数。\n- `FVTT_WEB_MAX_RETAINED_JOBS=100`：未过期终态任务的最大保留数量；超过时最旧优先清理。\n\n工作流能力：\n\n- `FVTT_WEB_ENABLE_PATH_MODE=1`：允许读取服务器 workspace 路径和运行 `vault-sync`。公开部署通常不要开启。\n- `MONSTER_INTAKE_AUTH_MODE`：`api-key` 或 `codex-oauth`，默认 `api-key`。\n- `MONSTER_INTAKE_API_KEY`：API Key 模式的 AI 怪物资料整理专用 provider key；只保留在服务端。\n- `MONSTER_INTAKE_BASE_URL`：API Key 模式的 OpenAI-compatible API 根地址，例如 `https://api.openai.com/v1`。\n- `MONSTER_INTAKE_CODEX_OAUTH_BASE_URL`：Codex OAuth 本机兼容桥地址，默认 `http://127.0.0.1:8787/v1`；必须是 loopback 地址。\n- `MONSTER_INTAKE_CODEX_OAUTH_BRIDGE_TOKEN`：可选的本机桥 bearer token；默认是非秘密占位值，OAuth 凭据不放在这里。\n- `MONSTER_INTAKE_MODEL`：discovery、extraction 和 repair 使用的模型；Codex OAuth 兼容桥模式未填写时默认 `gpt-5.6-luna`。这不是 Companion 的模型设置：Companion 留空时使用用户本机 Codex CLI 当前默认模型。\n- `MONSTER_INTAKE_CODEX_OAUTH_REASONING_EFFORT`：Codex OAuth 推理强度；默认 `xhigh`，对应 Codex 界面里的 `ultra`，也接受填写 `ultra` 并自动归一化。\n- `MONSTER_INTAKE_REVIEW_MODEL`：独立 review 模型；未设置时使用 `MONSTER_INTAKE_MODEL`。\n- `MONSTER_INTAKE_TIMEOUT_MS`：普通 Intake 阶段超时；API Key 模式默认 `60000` 毫秒，Codex OAuth 模式默认 `300000` 毫秒。\n- `MONSTER_INTAKE_REPAIR_TIMEOUT_MS`：Intake 证据修复阶段的单独超时，默认至少 `180000` 毫秒；可设为 `1000` 到 `600000` 之间的整数。\n- `TRANSLATION_API_KEY` 或 `OPENAI_API_KEY`：服务器端翻译/AI normalize 凭据。\n- `GODDESSFANTASY_COOKIE`：服务器端 Goddess Fantasy crawl cookie。\n- `GODDESSFANTASY_USERNAME` / `GODDESSFANTASY_PASSWORD`：服务器端爬站登录凭据。\n- `FVTT_WEB_EXPOSE_ERRORS=1`：返回内部错误详情，仅限本机调试；公开部署不要开启。\n\n可选图片上传默认完全关闭，不再内置任何真实服务器地址。启用时必须在服务端同时配置：\n\n- `FVTT_WEB_IMAGE_SSH_TARGET`：SSH 目标，例如 `operator@assets.example.invalid`；\n- `FVTT_WEB_IMAGE_REMOTE_ROOT`：远端图片根目录；\n- `FVTT_WEB_IMAGE_PUBLIC_BASE_URL`：生成 JSON 使用的公开图片 URL 前缀；\n- `FVTT_WEB_IMAGE_TOKEN_FRAME`：可选 Token 边框文件，默认使用仓库内的小型边框资源；\n- `FVTT_WEB_IMAGE_ALLOW_HTTP=1`：仅在明确接受明文 HTTP 风险时设置；默认只接受 HTTPS；\n- `FVTT_WEB_IMAGE_ACTOR_DIR`、`FVTT_WEB_IMAGE_TOKEN_DIR`、`FVTT_WEB_IMAGE_TOKEN_SIZE`：可选目录名和尺寸调整。\n\n缺少 SSH 目标、远端根、公开 URL 或 Token 边框中的任一项时，图片能力保持“未配置”，Actor JSON 仍可生成，但不会把本机默认值或真实生产目标偷偷带入任务。\n\n浏览器只能看到“某项能力是否已配置”，不能取得上述凭据值。\n\nAI 怪物资料整理只读取专用的 `MONSTER_INTAKE_*` 变量，不会回退到翻译或通用 OpenAI 变量。`codex-oauth` 只适用于本机或受信任的 loopback 兼容桥，不应把它作为公开 Web 服务的远程认证方式。粘贴或上传的 TXT/MD 原文会发送给该 provider，因此公开部署必须在用户提交前明确告知这一点，并按 provider 的数据政策处理。服务端审计只记录 provider、model、prompt version、耗时、调用计数和错误码，不记录 key、请求头或隐藏推理。\n\n单次 Intake 最多 200,000 个 JavaScript UTF-16 字符、50 只怪物；长文本按 24,000 字符分块并保留 1,000 字符重叠，逐怪物 extraction 并发为 2。每只怪物最多 1 次 extraction、1 次独立 review 和 1 次 semantic repair；各阶段可对 timeout、429 或网络错误重试一次。模型不能自行增加循环或调用工具。`needs_review` 任务可下载 source、IR、候选 Markdown 和报告，但 Web 不会把候选 Actor JSON 注册为正式下载；只有 accepted 才注册 Actor JSON/ZIP。\n\n## 固定资源保护\n\n- Bun 在读取请求体前实施 25 MiB HTTP body 上限；有 `Content-Length` 时，API 还会在调用 `request.text()` 前拒绝超限或畸形长度。\n- 单文件内容上限是 5 MiB；合集/JSON 内容上限是 20 MiB。\n- 客户端身份来自真实 socket。只有直接 socket 对端在 `FVTT_WEB_TRUSTED_PROXIES` 内，才会从右向左解析转发链；伪造或畸形链不会创建新限流身份。\n- 每客户端和全局请求/长任务上限同时生效，不能仅靠更换转发头绕过。\n- 当前进程真正 queued/running 的任务不会被清理；过期终态任务先清理，数量仍超限时再最旧优先清理。\n- 500 错误默认隐藏内部详情。下载接口仍只服务任务登记过的文件。\n\n这些是纵深防御，不代替公开入口的真实用户鉴权、TLS、防火墙和操作系统资源限制。\n\n## Nginx 示例\n\n下面的 Basic Auth 验证浏览器用户；`Authorization` 在代理到 Bun 时被替换为服务器端 bearer。把 token 放入仅 root 可读的 Nginx 配置片段，不要写进公开仓库。\n\n```nginx\nserver {\n  listen 443 ssl;\n  server_name example.com;\n\n  client_max_body_size 25m;\n\n  location / {\n    auth_basic \"fvtt workbench\";\n    auth_basic_user_file /etc/nginx/fvtt.htpasswd;\n\n    proxy_pass http://127.0.0.1:5174;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    proxy_set_header Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\";\n  }\n}\n```\n\nBun 侧至少设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n如果 Nginx 与 Bun 不在同一网络命名空间，`FVTT_WEB_TRUSTED_PROXIES` 应填写 Bun 实际看到的直接代理 IP，而不是盲填公网客户端 IP。\n\n## Caddy 示例\n\n```caddyfile\nexample.com {\n  request_body {\n    max_size 25MB\n  }\n\n  basic_auth {\n    operator REPLACE_WITH_CADDY_PASSWORD_HASH\n  }\n\n  reverse_proxy 127.0.0.1:5174 {\n    header_up Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\"\n    header_up X-Real-IP {remote_host}\n  }\n}\n```\n\n同样设置 `FVTT_WEB_PUBLIC_MODE=1`、同一个 `FVTT_WEB_AUTH_TOKEN`，并将 Caddy 的直接 socket IP 加入 `FVTT_WEB_TRUSTED_PROXIES`。\n\n## systemd 示例\n\n把 secret 放在权限受限的 `/etc/fvtt-web.env`，而不是直接写进 unit 或仓库：\n\n```ini\n[Unit]\nDescription=fvttV12Json Web\nAfter=network.target\n\n[Service]\nWorkingDirectory=/opt/fvttV12Json\nExecStart=/usr/local/bin/bun run web:start\nRestart=always\nEnvironmentFile=/etc/fvtt-web.env\n\n[Install]\nWantedBy=multi-user.target\n```\n\n`/etc/fvtt-web.env` 示例：\n\n```bash\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_API_PORT=5174\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n## 产物目录\n\n所有 Web 任务写入：\n\n```text\ntemp/web/jobs/\u003cjobId>/\n  input/\n  output/\n  result.json\n```\n\n下载接口只允许下载任务登记过的产物。ZIP 下载会把成功产物打包为使用 UTF-8 文件名的 ZIP；清理策略按上文的年龄和数量边界执行。\n","foundry-modules/chat-memory-guard/README.zh-CN.md":"# Chat Memory Guard / 聊天内存保护\n\n这是一个拥有独立 manifest、版本、构建、测试、安装保护和验收边界的 Foundry module release unit。\n它不依赖本仓库的 Actor generator、AI Intake、workflow、crawler 或其他 Foundry module 私有实现。\n\n## 支持范围\n\n- Foundry VTT 14.364\n- dnd5e 5.3.3\n- MIDI-QOL 14.0.11\n- 模块 ID：`chat-memory-guard`\n- 当前 release：`1.0.0`\n\n模块只裁剪当前浏览器已经渲染的聊天卡片。它调用 Foundry 公开的\n`ChatLog.deleteMessage()`，不会调用 `ChatMessage.delete()`，不会修改世界中的聊天数据库记录，\n也不会修改 Foundry、dnd5e、MIDI-QOL 或其他模块源码。\n\n## 独立构建与测试\n\n在本 workspace clone 中，先从仓库根目录安装锁定依赖，再进入本目录运行独立门禁：\n\n```powershell\nbun install --frozen-lockfile\ncd foundry-modules/chat-memory-guard\nbun run typecheck\nbun test\nbun run build\n```\n\n未来从过滤后的独立仓库 clone 构建时，由该仓库自己的 `bun.lock` 提供 frozen install；本次\nworkspace 迁移不把主仓库 lockfile 复制成第二份权威文件。\n\n构建输出：\n\n- `dist/module/`：可直接安装的 module 目录；\n- `dist/chat-memory-guard.zip`：独立发布包。\n\n在主 workspace 根目录仍可使用兼容命令：\n\n```powershell\nbun run test:chat-memory-guard\nbun run build:chat-memory-guard\n```\n\n`install:chat-memory-guard` 只允许写入项目本地 Foundry mirror 的精确目录，并在替换已有同 ID\n模块前创建备份。它不是生产部署命令。\n\n## 设置\n\n在“游戏设置 → 模块设置 → 聊天内存保护”中打开设置窗口：\n\n- GM 世界默认值：供整个世界使用。\n- 本浏览器个人覆盖：每位玩家可以跟随世界设置，或只覆盖自己的客户端。\n- 默认保留 40 条已渲染消息。\n- 默认优先 Token 图，并生成最长边 128px、质量 75 的会话级 WebP 缩略图。\n\n设置保存后立即重新渲染当前卡片并应用。缩略图只存在于当前页面会话，刷新或关闭页面后释放。\n\n## 诊断\n\n在浏览器控制台运行：\n\n```js\ngame.modules.get(\"chat-memory-guard\").api.getStats()\n```\n\n结果只包含渲染数量、裁剪数量、pending 删除数量、缩略图缓存数量/估算字节、失败数、模块监听器\n数量和当前有效设置，不包含消息正文。\n\n## 已知边界\n\n- dnd5e 在 Core `renderChatMessageHTML` 之后才创建头像。本模块在\n  `dnd5e.renderChatMessage` 阶段、卡片插入聊天 DOM 之前尽量替换头像，但不声称能够阻止浏览器\n  发起首次原图请求。\n- 自动化和短时 A/B 运行时证据不能证明长时间跑团内存永不增长。\n- 完整第三方聊天卡矩阵和少见动画头像仍需在真实跑团中持续抽查。\n- workspace 物理迁移不会升级历史运行时验收结论；真实运行时证据仍以\n  `docs/acceptance/chat-memory-guard-runtime-report.zh-CN.md` 为准。\n","foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md":"# Babele RollTable `@Embed` 翻译兼容模块\n\n这个模块修复 Foundry v14 渲染下面这种内容时的运行时缺口：\n\n```text\n@Embed[Compendium.dnd-players-handbook.tables.RollTable.phbWildMagicSurg rollable caption=false classes=\"wild-magic-surge\"]\n```\n\nBabele 可以把随机表标题翻译成中文，但 Foundry 原生的 `_buildEmbedHTML` 直接从当前 `results` 集合取英文行。模块只在这个渲染入口读取 Babele 的临时翻译结果，按 `_id` 优先、`range` 回退重新填充显示内容；文档型结果继续使用原始 `documentUuid` 生成 content-link。\n\n它不会修改随机表、角色、特性、Item、Journal 或世界设置。翻译源仍然由现有的 `dnd-simplified-chinese-babele-patch` 提供。\n\n## 本地验证\n\n```text\nbun run build:fvtt-babele-rolltable-embed-translation\nbun run test:fvtt-babele-rolltable-embed-translation\nbun run install:fvtt-babele-rolltable-embed-translation\nbun run verify-install:fvtt-babele-rolltable-embed-translation\n```\n\n安装后要重启本地 Server Mirror，并在实际 UI 中检查：\n\n- 狂野魔法浪涌：25 行范围和 25 行中文结果，骰子按钮仍可用；\n- 困惑术行为：5 个结果全部存在，文档型的“基本方位”仍为原 UUID 的 content-link；\n- 重复打开/渲染不改变源表，也不写入世界文档。\n","foundry-modules/fvtt-battlefield-painter/README.zh-CN.md":"# Battlefield Painter P2 Alpha · `0.3.0-alpha.1`\n\n这是一个自用的 Foundry VTT v14 战场地形画笔原型。它不复制 Tile Arsenal 的代码、配置或素材，只实现相近的高层工作流：GM 从工具盘选择地形、在地图上涂抹，并由模组创建一组可以追踪和回滚的场景文档。\n\n当前版本是 P2 alpha：浏览器 bundle 已在模拟 Foundry 全局环境中完成加载、生命周期注册、ApplicationV2 打开和版本/权限门禁测试。Frost B14 的薄冰/寒气视觉已获用户认可，Fire B13 的完整真实 Canvas 验收仍保持独立未完成；其他运行时结论以各 micro-batch 记录为准，不能由静态测试一并推定。新版本不再生成或创建 Battlefield Painter 音频；旧版本残留 AmbientSound 只能由 GM 显式清理。\n\n## 当前范围\n\n- 火焰、冰霜、荆棘三种配置。\n- 每种配置保留两个逻辑阶段，并共享 1 张原创透明 P0 WebP；当前共 3 张基础图。旧场景兼容循环仍保留为每种地形 1 个 WebM。\n- P0 与未带 marker 的旧场景由 Tile 媒体、透明度、Tint、火焰光源和成熟荆棘 Wall 表达阶段；P2 Square Fire/Frost 另有独立视觉层。\n- Foundry 原生 Tile 负责静态地表或逻辑占位；P2 Fire 与 Frost 分别由模块自管的世界空间 renderer 绘制，均位于 Token 下方。\n- Foundry 原生 Region `modifyMovementCost` 行为负责移动消耗。\n- 火焰创建原生 AmbientLight，使用 `torch` 动画；P2 对长笔画使用最多 16 格一组的确定性聚类光源。\n- P2 新建火焰 Tile 以 `alpha=0` 的 `fire.webp` 作为逻辑/兼容纹理并写入 `visualEffect: \"fire-field-v1\"`；运行时火场不采样、不移动 `fire.webp`，也不请求 `fire.webm`，而是共享 `fire-stage-i.webm`（Stage I）和 `fire-stage-ii.webm`（Stage II）。\n- P2 新建 Square Frost Tile 使用 `frost-film-v1.webp` 并写入 `visualEffect: \"frost-field-v1\"`；Stage I 只显示薄冰膜，Stage II 额外使用共享的 `frost-mist-v1.webm` 寒气场，不请求旧 `frost.webm`。Hex Frost 与无 marker 旧场景保持兼容路径。\n- Brambles 仍使用当前 `brambles.webp` / `brambles.webm` Tile 路径；独立荆棘视觉效果属于下一阶段。\n- 不再创建新的 AmbientSound；审计仍识别旧版本模块所有声音，并提供 GM 专用的指纹确认清理入口。旧声音清理不可撤销，也不会被 undo/redo 恢复。\n- 新包不再携带 OGG；旧场景中的模块所有 `AmbientSound` 可能请求缺失资源（404）。GM 看到旧声音警告后，应先打开 Painter，通过显式确认入口清理；模块不会自动迁移或删除旧场景数据。\n- 成熟荆棘在地形外边界创建 Wall。\n- 绘制、擦除、阶段切换支持方格和六角格；几何来自 `canvas.grid`，不自行猜测六角格坐标。\n- 所有文档带 `flags.fvtt-battlefield-painter` 所有权信息；批次创建失败时自动回滚。\n- P1 增加 0–4 格笔刷半径、自由/直线/填充三种几何、画布光标预览，以及只恢复本模组文档的撤销/重做。\n- “直线”委托当前 Foundry Grid 的 `getDirectPath`；半径委托 `getAdjacentOffsets`，避免自行假设方格或六角格邻接。\n- “填充”是拖拽起点与终点之间的 offset 区域填充，不是依赖地图像素颜色的洪水填充。\n- P2 提供 GM 专用的本场景地形清除预览，只统计模块所有文档，并在确认前重新核对文档 ID 指纹。\n- 方格 Tile 仅在 Foundry 已明确识别为方格时做 8% 的视觉尺寸扩展（每侧约 4%）；Region、Wall、cellKey、offset 和所有权边界仍使用原始方格几何。六角格和未识别网格不自动套用该视觉扩展。\n\n当前暂不包含 12 色变体、跨客户端并发锁、伤害自动结算和第三方自动化模组集成。Fire、Frost 和后续 Brambles 的视觉/运行时验收分别记录，不互相替代。\n\n## 使用\n\n1. 以 GM 身份打开一个已激活的场景。\n2. 在 Tiles 场景控制组点击火焰图标，打开“战场地形画笔”。\n3. 选择地形、阶段和模式，点击“启用画笔”。\n4. 在地图上按住左键拖动；松开时一次性创建该笔画。\n5. “擦除”只作用于本模组拥有的地形；擦除一部分笔画时会安全重建剩余部分。\n6. “切换阶段”会升级或循环命中的完整笔画批次。\n\n控制台可用 API：\n\n```js\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditScene()\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditEffects()\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditFrostEffects()\n```\n\n`auditEffects()` 与 `auditFrostEffects()` 分别只读返回 Fire/Frost 的 mesh、格位、顶点、三角形、ticker、媒体、重建次数和最近错误。API 同时公开 `compatibility` 与 `canMutate`。仅当版本精确为 Foundry `14.364` / dnd5e `5.3.3` 且当前用户是 GM 时，才暴露 `open`、`activate` 和 `deactivate`；其他环境只保留诊断能力。\n\nAlpha 还提供仅供开发、测试和修复使用的内部阶段开关：\n\n```js\nconst api = game.modules.get(\"fvtt-battlefield-painter\").api\napi.developmentPhases()\napi.setDevelopmentPhase(\"p1\", false) // 关闭 P1，回退为 P0 单格自由画笔\napi.setDevelopmentPhase(\"p1\", true)\napi.setDevelopmentPhase(\"p2\", false) // 关闭动态素材和聚类光源\napi.setDevelopmentPhase(\"p2\", true)\n```\n\n正式版发布前必须把 `DEVELOPMENT_PHASE_CONTROLS_MUTABLE` 改为 `false`，确认运行时不再暴露 `setDevelopmentPhase`，并重新跑完整门禁。\n\n## 开发与构建\n\n```powershell\nbun run test:coverage\nbun run typecheck\nbun run build\n# 仅在明确需要重新生成媒体时运行；普通构建不会重新生成资产\nbun run generate:media\nbun run generate:frost-field\n```\n\n构建产物为 `dist/module/` 和 `dist/fvtt-battlefield-painter.zip`。静态构建成功不等于 Foundry 真实语义通过。\n\n本地 Lab 安装入口：\n\n```powershell\nbun run install:local\nbun run install:local -- --apply\nbun run verify-install\n```\n\n安装脚本只接受仓库批准的 `F:\\FoundryLab\\foundry-v14`，会先构建、核对精确目标、使用暂存目录并逐文件哈希验证。目标模组目录必须不存在；如果已有任何文件或目录，安装会停止且不会替换、移动或创建旧副本。它不触碰生产环境。\n\n## 文档索引\n\n- [设计与实现决定](docs/architecture.md)\n- [外部调研与版本边界](docs/research-notes.md)\n- [P0 真实验收清单](docs/acceptance-checklist.md)\n- [原创素材来源与完整提示词](docs/asset-provenance.md)\n- [后续路线](docs/roadmap.md)\n- [Alpha 发布说明](docs/alpha-release-notes.md)\n- [P1 开发 checkpoint 与异机验收交接](docs/p1-development-checkpoint.md)\n- [P2 执行计划](docs/p2-execution-plan.md)\n- [B13 连续火焰场视觉验收](docs/runtime-acceptance-micro-batches/B13-art-style-square.md)\n- [B14 薄冰膜与寒气场视觉验收](docs/runtime-acceptance-micro-batches/B14-frost-field-square.md)\n","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md":"# Exact Foundry 14.364 Acceptance Checklist\n\nStatic checks and build output do not satisfy this checklist. Run these in the approved local Lab with Foundry `14.364` and dnd5e `5.3.3`, using a disposable test Scene. Record screenshots, console errors, document counts from `api.auditScene()`, and any recovery action.\n\n## Environment identity\n\n- [ ] Confirm executable/build reports Foundry `14.364`.\n- [ ] Confirm world reports dnd5e `5.3.3`.\n- [ ] Confirm destination is under `F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\modules\\fvtt-battlefield-painter`.\n- [ ] Confirm module `0.3.0-alpha.1` appears and enables without manifest warning.\n- [ ] Confirm no browser console error during `init`, `ready`, Scene load, or canvas teardown.\n\n## Square grid\n\n- [ ] Open the Tiles control group; confirm the GM-only painter button appears.\n- [ ] Open ApplicationV2 panel; confirm the three terrain previews, Chinese labels, stage controls, and active states render.\n- [ ] Confirm free/line/fill controls, radius 0–4, and undo/redo disabled states render correctly.\n- [ ] Move the pointer without painting; confirm preview follows cells, respects radius, and disappears on canvas leave/deactivation.\n- [ ] Paint radius 0 and 4 strokes; verify no duplicate owned cell is created.\n- [ ] Drag a line in both directions; verify the preview and committed cells match core direct-path behavior.\n- [ ] Drag fill in all four endpoint directions; verify the inclusive offset area matches the preview.\n- [ ] Paint connected and disconnected cells for each terrain/stage.\n- [ ] Confirm Tiles exactly cover their grid cells and preserve transparent edges.\n- [ ] Move a token through every Region; verify measured cost is ×2 for supported movement actions.\n- [ ] Confirm stage-I and stage-II fire create the intended native light and torch animation.\n- [ ] Confirm only stage-II brambles block movement; sight/light/sound remain unblocked.\n- [ ] Erase one cell from the middle of a multi-cell stroke; verify the remainder survives and Region/Wall geometry is rebuilt.\n- [ ] Target one cell with stage-switch; verify the complete original stroke cycles stage.\n- [ ] Paint over an owned cell; verify it is skipped instead of duplicated.\n- [ ] Deactivate the painter; verify normal Foundry canvas controls resume.\n- [ ] Undo and redo paint, erase, and stage-switch; verify foreign documents remain unchanged.\n- [ ] Undo, then make a new edit; verify redo is cleared.\n\n## Hex grid\n\n- [ ] Repeat all three terrain paints on a hex-row Scene.\n- [ ] Repeat all three terrain paints on a hex-column Scene.\n- [ ] Confirm Tile bounds do not displace the artwork relative to cell centers.\n- [ ] Confirm Region polygons match all six vertices.\n- [ ] Confirm adjacent bramble cells remove their shared Wall edge.\n- [ ] Confirm erase and stage-switch reconstruct the same hex offsets.\n- [ ] Repeat radius, line, fill, preview, undo, and redo on hex-row and hex-column Scenes.\n\n## Failure and recovery\n\n- [ ] Temporarily provide invalid Region behavior data in a disposable fixture; confirm Tile creation rolls back.\n- [ ] Verify `auditScene()` counts match visible owned documents.\n- [ ] Reload the world and confirm ownership flags still support erase and stage-switch.\n- [ ] Disable the module and confirm foreign Scene documents are untouched.\n- [ ] In alpha, disable P1 through `api.setDevelopmentPhase(\"p1\", false)` and confirm the panel falls back to free radius 0 without preview/history controls.\n- [ ] Re-enable P1 and confirm the controls return; then verify release packaging with phase controls immutable before formal release.\n- [ ] Remove all P0 test documents before ending acceptance.\n\n## Deferred until final unified runtime acceptance\n\n- legacy-sound cleanup and no-new-audio request checks;\n- transparent WebM animation;\n- very large battlefields and long-session memory/performance;\n- production environment installation;\n- four-hour real-session soak.\n\n## P2 final-pass additions\n\nRun these only in the final unified environment pass after all development phases are complete. Clear module-owned documents between phase combinations; do not treat static tests as runtime acceptance.\n\n- [ ] Confirm the module reports `0.3.0-alpha.1`; canonical compatibility media plus Fire/Frost field media remain valid in the build inventory. New P2 Square Fire/Frost must not request `fire.webm` / `frost.webm`.\n- [ ] Run with `P0` only; confirm static WebP tiles, the P0 fire light, and no AmbientSound documents.\n- [ ] Run with `P0+P1`; repeat radius, line, fill, preview, erase, stage, undo, and redo behavior.\n- [ ] Run with `P0+P2`; confirm P2 fire uses hidden logical `fire.webp` plus `visualEffect: \"fire-field-v1\"`, mounts one continuous video-backed fire mesh, and does not request `fire.webm`. Confirm Square Frost uses `frost-film-v1.webp` plus `visualEffect: \"frost-field-v1\"`, adds Stage II mist without requesting `frost.webm`, while Brambles remains on its current WebM path. All terrain creates zero new AmbientSound documents or Battlefield Painter audio requests.\n- [ ] Confirm `api.auditFrostEffects()` reports one film mesh, at most one Stage II mist mesh, shared ticker time, actual Frost cell/stage counts, and no persistent rebuild/object growth.\n- [ ] For a Square Scene, confirm `api.auditEffects()` reports one mesh covering the actual fire cells, shared ticker time, correct 15×15 counts, and no persistent rebuild/object growth; inspect single, 1×3, 3×3, L-shaped, gap, stage-boundary, erase, undo/redo, Token-layer, and pan/zoom behavior manually.\n- [ ] Run with `P0+P1+P2`; confirm complete interaction, zero new owned sounds, and at most 16 cells per fire-light cluster.\n- [ ] On a fixture containing old module-owned and foreign AmbientSound documents, confirm the GM cleanup dialog lists only owned IDs, cancel is safe, stale fingerprints reject deletion, and confirmation leaves foreign sounds untouched.\n- [ ] Paint 25, 100, and 300 connected cells; record Tile, Region, Light, zero-new-Sound, and Wall document counts and visible performance.\n- [ ] Open scene clear preview; confirm only module-owned documents are counted and foreign documents are excluded.\n- [ ] Change the Scene after opening the clear preview; confirm the stale fingerprint blocks deletion and asks for a new preview.\n- [ ] Confirm clear is one undoable history operation and foreign documents survive clear, undo, redo, and reload.\n- [ ] Repeat P2 media, zero-new-audio, clustering, legacy cleanup, and clear checks on square, hex-row, and hex-column Scenes.\n- [ ] After runtime acceptance, set release phase controls immutable and verify the phase setter is absent from the public API.\n","foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md":"# 血猎手 2024 独立 Foundry 模块\n\n`fvtt-blood-hunter-2024` 是 Foundry Virtual Tabletop `14.364`、dnd5e `5.3.3` 的独立模块，版本为 `1.0.0`。它提供三个 Item compendium pack：`classes`、`subclasses`、`features`。模块不依赖 Plutonium 或 classpack；MIDI-QOL `14.0.11` 与 DAE `14.0.12` 只是推荐依赖，不是硬依赖。\n\n## 构建\n\n构建必须使用已经接受的 `BloodHunter2024` enriched source JSON 的原始 UTF-8 bytes：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"C:\\absolute\\path\\BloodHunter2024.json\"\n```\n\n`--source` 必须是绝对路径。构建脚本只通过 `packages/blood-hunter-v14/src/index.ts` 的公开接口调用编译器，先把 raw bytes 交给编译器，再由公开 validator fail-closed。它不会复制编译器的匹配规则、ledger schema 或 Effect/Activity 生成逻辑；每次都以编译器返回的 `logicalHash` 为准，因此 coverageLedger 的语义修正会自然进入新构建。\n\n每次构建在随机临时根内完成两份候选结果：三份 LevelDB Item pack、canonical package、migration contract、coverage ledger、review、identity manifest 和确定性 ZIP。构建会比较两次结果的文档/UUID、manifest、logical identity、pack index、Activity/Effect 引用，并递归检查整个编译结果中的 12 个 dnd5e 外部 Item UUID（7 equipment、1 Boon、4 fighting styles）。缺少任何 UUID，或锁定的 `dnd5e/5.3.3/repo/packs/_source` reference cache 缺少对应 document，都会失败。Effect change 的 mode 等语义由最终编译器输出负责，模块只序列化输出。\n\n构建成功后才会把结果原子发布到本目录的 `dist/`：\n\n- `dist/module/`：可安装模块树；\n- `dist/fvtt-blood-hunter-2024.zip`：ZIP 及其 SHA-256；\n- `dist/module/data/identity-manifest.json`：source SHA-256、编译器 logical hash、81 documents、94 ledger、117 Activities、UUID 清单；\n- `dist/module/data/migration-contract.json`：浏览器迁移使用的 canonical/migration 契约。\n\n`dist` 不是运行中 Lab 的 pack；构建不会原地写 Lab 世界或运行中的 compendium。\n\n## Lab 安装与验证\n\nLab CLI 只允许配置后的本地 `FVTT_OPS_LAB_ROOT`，目标严格为：\n\n```text\n\u003cFVTT_OPS_LAB_ROOT>/data/server-mirror/Data/modules/fvtt-blood-hunter-2024\n```\n\n示例：\n\n```powershell\nbun run foundry-modules/fvtt-blood-hunter-2024/labCli.ts dry-run\nbun run install:blood-hunter-v14\nbun run install:blood-hunter-v14 --apply\nbun run verify:blood-hunter-v14-install\n```\n\nCLI 会拒绝生产/远程变量、8080、路径逃逸、symlink/junction/reparse、LevelDB `LOCK` 或占用目标。已有同 ID 目录必须带本模块的 `data/owned-marker.json` 才能替换；foreign same-ID 目录会停止。替换前把旧目录移动到配置的 backup root，stage 通过完整 hash、manifest、pack documents/index 检查后再原子替换，并在失败时尝试恢复 backup。\n\n`verify-install` 只报告字节、manifest、LevelDB documents/index 和 identity 一致性；它不启动 Foundry、不启用模块，也不冒充真实 runtime 或游戏性 E2E。构建/测试只使用随机临时 Lab 根和配置的只读 `classic-level` 入口，不把真实 `F:\\FoundryLab\\foundry-v14` 的 app/data/world 当作数据库写入。\n\nFoundry Ops 的公开只读证据入口使用：\n\n```powershell\nbun run foundry:ops lab blood-hunter-v14 plan --input=\"C:\\absolute\\matrix-plan-input.json\"\nbun run foundry:ops lab blood-hunter-v14 verify-actor --input=\"C:\\absolute\\actor-snapshot-input.json\"\n```\n\n还支持 `inspect`、`verify-migration` 与 `evidence-manifest`。这些动作只读取显式 JSON 并返回验证结果，不启动 Foundry、不写世界，也不会把 pack/API 探针提升为 E2E PASS。\n\n## 迁移 UI\n\n模块在 `init` 阶段只注册 GM-only 菜单，不在 `ready` 自动扫描 Actor，也不自动修改任何 Actor。菜单标题是“血猎手 2024：角色迁移”。\n\n1. GM 明确输入 Actor ID 或精确名称后点击 `Preview`。Preview 只读，不写 Actor。\n2. flags `fvttJsonGenerator.bloodHunter2024.canonicalId` 优先；没有 flags 时，只有 `source + class/subclass + level + normalized name` 全部严格相等才使用 legacy match。多候选、重复 canonical 或歧义会停止。\n3. 点击 `Create migrated copy`，模块通过 Foundry 公共 Actor Document API 创建迁移副本，并生成 Actor JSON backup；副本通过非血猎手投影、选择/消耗、重复和 Activity/Effect 引用检查后，才允许下一步。\n4. `Apply original` 需要已有副本、通过副本验证、JSON backup，以及输入与 Actor 名称完全相同的确认文字。冲突逐项选择 `Keep`、`Overwrite` 或 `Cancel`；关闭窗口等同 `Cancel`。任何未决冲突都不能 Apply。\n\n迁移只原位更新唯一匹配的 Blood Hunter Item，并补充编译契约明确的固定授予；不按名称批量删除，不改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags。Activity/Effect/说明冲突默认暂停。Apply 通过公共 Document API 完成；失败会用 Apply 前 JSON/Actor snapshot 补偿回滚，禁止直接写 LevelDB。\n\nCallum 的旧“破晓血仪” fixture（0 Activity、0 Effect）覆盖 Preview、迁移副本、Apply 和 rollback：原 Actor 在 Preview/副本阶段保持不变，副本应得到 5 Activity、2 Effect。\n\n## 自动化边界\n\n- **Core**：Foundry/dnd5e 原生 class、subclass、advancement、Activity/Effect 结构；不要求 MIDI-QOL 或 DAE。\n- **Modded**：可利用推荐的 MIDI-QOL `14.0.11` / DAE `14.0.12`，但模块不会把它们当作硬依赖，也不会把未验证效果宣称为原生自动化。\n- **assisted**：需要 GM/玩家按规则确认的跨 Item、目标条件、休息或选择流程；ledger/review 中会保留边界。\n- **external-rule**：依赖外部规则或外部 compendium UUID 的部分；identity manifest 会保留 12 个 dnd5e UUID，缺引用即 fail-closed。\n\n这是一次构建快照，不是实时同步：安装后不会监视远程 homebrew、旧 side-data 或 Actor 变化。旧 side-data 只作为迁移识别/审查的历史输入，不是权威规则来源；权威来源是本次 raw source 与公开编译器输出。线上生产 Foundry（8080）不在本任务部署范围内，也不会由本模块 CLI 触碰。\n","foundry-modules/fvtt-homebrew-species/README.zh-CN.md":"# 自制种族内容模块\n\n这是同一 module ID、pack 名和文档 ID 下的纯内容 Species 模块。V14 产物精确绑定 Foundry `14.364` / dnd5e `5.3.3` / Core；V12 候选产物精确绑定 Foundry `12.331` / dnd5e `4.3.9` / Core / 2024，并明确标记 `supportStatus: \"static-candidate\"`。两者都只提供 `species` 和 `features` 两个 Item Compendium，没有浏览器 JavaScript、socket、自动迁移或世界扫描。\n\n`bun run build:homebrew-species` 保持现有 V14 默认。`bun run build:homebrew-species:v12-candidate` 与 `bun run verify:homebrew-species:v12-candidate` 使用 ledger 中独立的 V12/core/2024 条目并输出 `dist/v12-candidate/`。build 会重新走 parser、目标 projector 与 validator；Markdown、package 或目标 hash 任一 stale 都会拒绝继续。V12 candidate build/verify 不调用安装器，也不证明 Add Species、升级、HP/AC、次数、Long Rest 或重开读回。\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为身份。旧 schema v1 只按 V14/core/2024 读取，单纯 build 不改写；下一次成功 promotion 才原子升级。V14 package 保持 `output/species/\u003cidentifier>.json`，V12 package 使用 `output/species/v12/\u003cidentifier>.json`。\n\n散装 JSON 是与本模块绑定的审阅/构建输入，ItemGrant UUID 指向本模块的 `features` pack，不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Feature 是快照，本轮没有迁移器。\n\n当前自动化边界：种族基础字段、allowlist 内的每级生命值/AC永久 Effect，以及明确次数和恢复的 Utility 可原生投影；复杂武器、推击、建筑物、移动和规则判定保持 `gm-assisted` 或 `external-rule`。\n","foundry-modules/fvtt-house-rules/README.zh-CN.md":"# 本团村规（`fvtt-house-rules`）\n\n这是一个独立的 Foundry VTT 模块，严格锁定 Foundry VTT `14.364` 和 dnd5e `5.3.3`。它不依赖 `fvtt-injury-fading-spirits`，也不导入项目其他模块的私有实现。\n\n## 语言\n\n模块跟随 Foundry 世界的核心语言设置：核心语言为 `zh-CN`，或使用 Foundry 中文翻译包的 `cn` 时使用 `lang/zh-CN.json`，核心语言为 `en` 时使用 `lang/en.json`。治疗药水 Activity 名称、自然 1/20 卡片、隐匿提醒和所有可配置设置均通过这套语言包显示；切换语言后请重新加载世界。\n\n本模块是“明确配置、GM 确认”的辅助工具，而不是替 GM 作裁定。所有会修改长期数据的功能默认关闭；GM 在 Foundry 的“配置设置”中按需启用。版本不精确、来源不唯一、缺少显式标签、没有活动 GM 或对象不允许修改时，模块会失败关闭。\n\n## 显式标签，不猜名称\n\n本模块绝不从中文/英文名称推断物品性质。药水和弹药必须由 GM 用结构化 flag 标记。例如，治疗药水：\n\n```json\n{\n  \"flags\": {\n    \"fvtt-house-rules\": {\n      \"potion\": {\n        \"healing\": true,\n        \"dice\": { \"number\": 2, \"denomination\": 4, \"bonus\": \"2\" }\n      }\n    }\n  }\n}\n```\n\n弹药还必须有稳定的显式 `key`，以便找回时只与同一类明确标签弹药合并：\n\n```json\n{\n  \"flags\": {\n    \"fvtt-house-rules\": {\n      \"ammo\": { \"key\": \"arrow\", \"tier\": 3 }\n    }\n  }\n}\n```\n\n`tier` 只能是 `0`、`1`、`2` 或 `3`。模块只会记录原生消费后射出的单发：`+3 → +2 → +1 → +0`，不会把库存中剩余整叠弹药降级。\n\n## 功能与使用入口\n\n运行时 API 位于 `game.fvttHouseRules`，只在锁定版本和活动 GM 存在时允许修改。API 是有意保守的 GM 入口；玩家 socket payload 不会被直接写入世界。\n\n| 规则 | 已实现的模块边界 |\n|---|---|\n| HR-02 药水 | `potion.configure(item, \"preview\" | \"apply\" | \"restore\")`。`apply` 保存可恢复快照并生成三个 dnd5e `heal` Activity：附赠动作自饮、动作自饮且仅治疗骰最大化、动作喂服他人。固定调整值保留。Compendium 物品拒绝直接修改。 |\n| HR-02 生命骰 | `hitPoints.gamble(actor, classItem, level)` 调用原生 `actor.rollClassHitPoints` 和 `HitPointsAdvancement.apply`。第一级不介入；第一次掷出 1 才重掷一次，第二次无论结果都接受；锁为 Actor + Class + Level。 |\n| HR-02 低属性 | 选中 Token 时仅作上下文提醒；`lowAbility.reminder(actor)` 也可供 GM 面板调用。它绝不扫描世界或修改 Actor。 |\n| HR-03 弹药 | 原生 `dnd5e.rollAttackV2` 的 `ammoUpdate` 产生事务；自动删除时以 dnd5e `flags.dnd5e.roll.ammunitionData` 作为聊天快照回退。`ammo.recover(actor, shotId)` 需要 GM 明确确认，重复确认无效。 |\n| HR-03 隐匿 | `stealth.set(actor, state)` 建立显式状态；`stealth.previewMove` 只警告不回滚移动。正常半速、专精减 10 尺、游荡者总等级 7+ 或 GM override 全速；`stealth.dash(actor)` 结束隐匿，`ignoreNextMovement` 可用于传送/GM 调整。非战斗使用 `nonCombatSuggestion`。 |\n| HR-04 自然 1 | 保留的自然 1 只创建 GM 后果请求，确认前零副作用。模块按当前确实可用的候选等权随机：近战反击、符合条件的队友误伤、武器损坏、法术自爆，及可选的精确 RollTable。近战队友必须相邻；远程/法术可选路径外队友。GM 确认伤害后调用原生 `Actor.applyDamage`，世界倍率 `0.5`/`1`、抗性和免疫继续由 dnd5e 处理；不投命中、不消耗反应或原 Activity。`repairWeapon` 可修复损坏。 |\n| HR-04 重击首骰最大化 | 只要武器攻击或攻击检定法术的伤害 Roll 被 dnd5e 标记为重击（包括手动点重击），不要求自然 20；模块先按 dnd5e 原生规则保留完整重击骰池，再把第一伤害部分的第一颗骰拆成 `1dXminX`，因此原始骰面仍会投出而最终按满值结算：`1d8` 重击显示为 `1d8min8 + 1d8`，`2d6` 重击显示为 `1d6min6 + 3d6`。其他骰、其他伤害部分和 rider 继续使用原生重击；目标伤害部分不唯一或骰子结构无法安全识别时失败关闭。自然 20 仍会生成原有 GM 提示卡。 |\n\n武器损坏保存原始 Activity 快照并重新投影累积的攻击与伤害减值；如果期间有其他模块改变了同一 Activity，模块拒绝覆盖，避免吞掉第三方改动。\n\n## 安全与幂等\n\n- 选择活动且 `id` 字典序最小的 GM 作为唯一写入者，避免不同客户端按连接顺序产生不同 authority。\n- 每个持久事件都有由 document/event 身份构成的事务 ID；不含骰点。Actor flags 中的有界 ledger 会去重；自然 1 的卡片确认也只能成功一次。世界 schema 在 `ready` 时迁移到 v1；未知 Actor flag schema 不会被覆盖，而是失败关闭。\n- 玩家消息只携带 UUID/Item ID/事件 ID；GM 重新解析 Actor、Activity、物品、标签与权限。任何失效或不唯一对象都拒绝。\n- 原生 blind-roll 的原始值从不复制到 flags、模块消息或审计摘要。\n- 模块不会 patch Foundry/dnd5e prototype、编辑 LevelDB/Compendium，或自动恢复弹药。\n\n## 已锁定的源码依据\n\n在配置的 reference cache 中检查了 dnd5e `5.3.3`：\n\n- `module/documents/activity/attack.mjs`：`dnd5e.rollAttackV2` 在原生弹药写入前提供 `ammoUpdate`，自动删除时把 source 写入 `flags.dnd5e.roll.ammunitionData`。\n- `module/documents/advancement/hit-points.mjs` 与 `applications/advancement/hit-points-flow.mjs`：`HitPointsAdvancement.apply(level, { [level]: value })` 是原生 HP 选择路径。\n- `module/data/activity/heal-data.mjs`：治疗 Activity 是 `type: \"heal\"`，使用结构化 `healing` `DamageField`。\n\nLab 中已安装 MIDI-QOL `14.0.11` 与 DAE `14.0.12` 的发布源码。模块核对了 MIDI 对 dnd5e `preRollDamage` 的精确调用路径，并只在该精确版本组合下读取 workflow 的保留攻击骰；core 与 MIDI 共用同一个本次 roll-config 变换，不注册推测性的私有 MIDI hook。其他 MIDI/DAE 版本失败关闭。\n\nFoundry core 源码快照只有 `14.361`，所以模块不依赖未核实的 core 私有 API；聊天卡使用 dnd5e 5.3.3 自己公开触发的 `dnd5e.renderChatMessage`。本地矩阵已经对锁定的 Foundry `14.364` / dnd5e `5.3.3` 完成安装、聊天卡、Token 移动和多客户端路径回放；具体结果见仓库的[本地 E2E 报告](../../docs/remediation/2026-08-07-fvtt-v14-house-rules/evidence/local-e2e-20260808/LOCAL-E2E-REPORT.zh-CN.md)。这不等同于生产安装或真实跑团中的长期验收。\n\n## 构建、归档与受保护 Lab 工具\n\n在该目录执行：\n\n```powershell\nbun run typecheck\nbun run test\nbun run build\nbun run verify:artifact\n```\n\n`build` 生成 browser-targeted `dist/scripts/module.js`，同步 manifest/语言/样式，并生成固定排序、固定时间戳的 `release/fvtt-house-rules-0.1.0.zip`。`verify:artifact` 核对 package、源 manifest、构建 manifest、必要文件和 ZIP 内容。\n\n`install:local-lab` 与 `verify:local-lab` 仅接受精确 `FVTT_OPS_LAB_ROOT=F:\\FoundryLab\\foundry-v14`。安装还要求显式 `HOUSE_RULES_LOCAL_LAB_INSTALL=1`，拒绝远程/生产环境变量、链接目标和已有模块目录，且从不覆盖安装。它们只证明文件安装，不等于真实 E2E。\n","foundry-modules/fvtt-injury-fading-spirits/README.zh-CN.md":"# 伤势与消逝的灵魂\n\n适用版本仅为 Foundry VTT `14.364` 与 dnd5e `5.3.3`。模块不依赖 MIDI-QOL、DAE 或其他村规模块。\n\n## 语言\n\n模块跟随 Foundry 世界的核心语言设置，不根据操作系统或模块安装路径猜测语言：\n\n- Foundry 核心语言为 `zh-CN`，或使用 Foundry 中文翻译包的 `cn` 时加载 `lang/zh-CN.json`，伤势、消逝的灵魂、复活模式、设置向导和 GM 裁定界面显示中文。\n- Foundry 核心语言为 `en` 时加载 `lang/en.json`。\n- 修改 Foundry 核心语言后请重新加载世界；当前已经打开的 Dialog 不会被动态重绘。\n- 模块的 manifest 标题使用中英双语，避免在管理模块页面中出现不可识别的纯英文标题。\n\n## 使用\n\n模块首次启用时，活动 GM 会看到设置提示；所有自动修改默认关闭。启用后：\n\n- character Actor 从正 HP 第一次进入 0 HP 时开启倒地 episode；同一 episode 首次恢复正 HP 叠一层伤势。\n- 伤势层数固定为 `0–3`；任何自动、手动、API 或玩家请求入口都不能写入第 4 层，旧的 4+ 层数据会由活动 GM 归一并写回 3 层。\n- 伤势层数由 Actor flag 保存；角色上的“伤势（X/3）”效果只是显示投影。Token 左上显示带层数的图标，Token 状态列表也会显示并框选“伤势”。\n- Token 状态列表中的“伤势”采用与力竭相同的分层操作：左键增加一层、右键减少一层；到达 3 层后继续左键仍保持 3 层。\n- 0–2 层再次倒地会写入对应死亡失败；3 层时先让 GM 选择，选择前不会预写死亡。\n- 死亡豁免最终保留的裸 d20 为 19 或 20 时按大成功处理。\n- 真实治疗增加到满血、成功短休或成功长休会清除伤势。\n\nGM 可以在 Actor 目录右键选择 `Injury & Fading Spirits`，或选择一个 Token 后在聊天输入 `/ifs`，打开伤势/复活面板。\n\n## 复活仪式\n\n普通/最终仪式可以填写最多三名不同参与者的 Actor UUID、技能、可选属性覆盖、DC 10–20 与优势状态。模块创建 dnd5e 原生 `request` ChatMessage，玩家投骰结果由原生 `flags.dnd5e.requestResult` 关联；最后仍由 GM 确认每项贡献。\n\n最终检定和快速复活检定使用原生 `blindroll`。Actor flags 与 GM 摘要只记录 DC、贡献计数、模式、结果、时间和 GM，不保存最终骰原始值。\n\n快速复活失败会增加永久 DC 惩罚并锁定本次死亡的快速复活；普通失败会锁定常规复活。常规锁存在时，“奇迹”入口只允许开启一次最终仪式。\n\n复活成功只记录回归历史并设置“下一次 0→正 HP 不叠伤势”；实际 HP 恢复仍由对应法术/Activity 处理。\n\n## 公开 API v1\n\n```js\nconst api = game.modules.get(\"fvtt-injury-fading-spirits\").api;\napi.getState(actor);\nawait api.setInjury(actor, 2, \"GM correction\");\nawait api.openResurrectionWizard(actor);\napi.getResurrectionState(actor);\nawait api.withInjurySuppressed(actor, \"resurrection activity\", async () => {\n  await actor.update({\"system.attributes.hp.value\": 1});\n});\n```\n\n外部复活 Activity 或宏若会直接恢复 HP，应由活动 GM 通过 `withInjurySuppressed` 包裹恢复事务。模块不会从物品名称猜测复活能力。\n\n## 安全与限制\n\n- 长期状态仅由 Foundry 的确定性活动 GM 写入；无活动 GM 时不会偷偷改 Actor。\n- 模块只在精确目标版本启用自动化；版本不符会失败关闭。\n- ChatMessage 不是历史事实来源，聊天被清理不会丢失伤势或复活历史。\n- 本地 Lab 验收不代表生产部署或真实跑团长期验收。\n","foundry-modules/fvtt-json-forge/README.zh-CN.md":"# FVTT JSON Forge 0.3.0（开发候选）\n\n本次增量在 Forge Intake 内加入人类写法MD的多生物提取、正式生成、固定自动化配置提取、工具编译与独立审核，并保留“战斗包导入 / 启动控制”。0.3.0 当前是本地构建候选，未发布；安装本增量请使用本次构建的 `fvtt-json-forge-0.3.0.zip`，不要把旧版0.1.0当作已包含新入口。\n\nFVTT JSON Forge 是 Foundry VTT 内的 GM-only Actor / Item 生成与证据审阅模块。0.1.0 把 Forge A–E 作为一个产品交付，精确锁定 Foundry `14.364`、dnd5e `5.3.3` 和 `core` profile；其他版本会 fail closed。\n\n> English summary: FVTT JSON Forge is a GM-only, exact-target browser module for reviewed Actor/Item generation and encounter packages with separately started bound companion macros. This 0.3.0 candidate targets exactly Foundry 14.364 and dnd5e 5.3.3. Existing review recovery, source library and batch paths remain separate. It is not a generic JSON importer or a background server.\n\n## 安装\n\n### Foundry Setup 安装\n\n本次0.3.0候选尚未发布，先使用下一节的本地ZIP方式。下面的Setup链接只有在本增量正式发布后才能取得新功能；旧0.1.0发行包不包含战斗包入口。\n\n在 Foundry 的 Setup 页面打开 **Add-on Modules → Install Module**，把下面的 manifest URL 粘贴到 **Manifest URL**：\n\n```text\nhttps://raw.githubusercontent.com/bill34345/fvttV12JsonGenerator/master/foundry-modules/fvtt-json-forge/src/module.json\n```\n\n安装后进入目标世界的 **Manage Modules**，启用 **FVTT JSON Forge**，再刷新世界。\n\n### ZIP 手工安装\n\n使用本次本地构建的 `foundry-modules/fvtt-json-forge/dist/release/fvtt-json-forge-0.3.0.zip` 和同目录 `SHA256SUMS.txt`，先核对 SHA-256；不假设尚未发布的GitHub Release已经存在。停止 Foundry 后，把 ZIP 解压为：\n\n```text\n\u003cFoundry Data>/Data/modules/fvtt-json-forge/module.json\n\u003cFoundry Data>/Data/modules/fvtt-json-forge/scripts/index.js\n...\n```\n\nZIP 内是 module 根内容，不能再多套一层版本目录。不要覆盖身份不明的同名目录；升级前先确认旧目录确实是本模块。此仓库的运维规则不创建备份，失败时停止并核对目标。\n\n## 三个入口\n\n只有 GM 能在 **Configure Settings → Module Settings → FVTT JSON Forge** 看到入口：\n\n- **Forge Actor**：把结构化 Actor Markdown 转为当前目标的完整 Actor，预览后执行 create-only、readback 和 deterministic reuse。\n- **Forge Item**：对单一、受支持的 world Item 做同样的 preview、create-only、readback 和 reuse；不会隐式创建或修改 Actor。\n- **Forge Intake**：处理 `plaintext-actor`、`ai-monster` 和 `ai-item`。Analyze 只建立来源证据与审阅状态；Generate Candidate 后仍须 formal verification 与 review 同时 `accepted`，Confirm Create 才可用。\n\n原单Actor/Item入口遇到`needs_review`、`failed`、`rejected`、多candidate、多artifact、过期snapshot、权限或版本变化时保持零世界写入。战斗包使用独立审核路径：只有明确的GM辅助、外部规则或文字保留行为具有唯一绑定宏，才能进入包级GM确认；未知错误仍拒绝。模块没有“忽略并继续”按钮，也不会把历史review bundle当成可创建response。\n\n## Provider 与凭据\n\n预览已有战斗包不调用 Provider。人类 MD 入口由 AI 提取生物与固定能力配置，工具生成控制入口；AI 不编写宏代码。本地 Intake 默认使用 DS API 的 deepseek-flash（DeepSeek V4.1 Flash），提取与审核均使用同一模型，默认低推理档；非本地连接继续保留用户明确选择。Luna Max 仅用于受委派的本地验收操作。\n\nAI 模式必须先选择 Provider、协议和精确 model ID，并完成当前连接/结构化输出测试。界面提供 OpenAI、Anthropic、Gemini、DeepSeek、xAI、Mistral、OpenRouter、Qwen、Kimi、GLM 与 Custom presets；preset 只代表连接配置，不代表每个 provider/model 都有同等语义验收。\n\n当前人类 MD 样例已由 deepseek-flash 完成提取、规则选择与独立审核，生成两 Actor 和固定控制入口。来源与静态审核通过不代表场景运行通过；实际本地验收另行记录。其他组合需单独验证。\n\n固定齐射的恍惚使用 Foundry 原生状态身份，避免状态同步模块把同一效果再补成第二份。已有其他来源的启用状态不由本控制器接管或提前结束；本控制器创建的状态按记录的目标回合到期处理。此兼容修复的实际 Chrome 复验尚未完成。\n\nActor 蓝图保留来源固定 HP 和生命骰公式；场上未链接 NPC Token 是否重掷 HP 遵从 dnd5e 世界设置，固定控制器不覆盖该设置。\n\nAPI Key 默认只存在当前页面内存。只有显式勾选持久化时才会写入当前浏览器的 local storage；它不会进入世界 Document、Chat、review bundle、Collection/ZIP、日志或 Forge response。浏览器存储不是加密保险箱；推荐保持持久化关闭，并在结束后使用清除 Key 操作。\n\n## Review、Library 与恢复\n\n- **Review Bundle**：导入后只显示严格解码的历史记录。历史 `accepted` 仍不可直接创建；“以当前来源开启新 attempt”会生成新的 identity、snapshot、calls 和 review。\n- **Managed Source Library**：来源与安全 review 保存在当前浏览器、当前 `worldId:userId` scope 的 IndexedDB。它不写世界 settings/flags，不自动 Analyze，也不保存完整 artifact/response。\n- **Portable export/import**：Library、Collection、标准 ZIP 和 Queue 都有 strict decoder、identity/hash/size/path/CRC 门禁；导出不含 Key、完整 endpoint、provider raw payload 或世界数据。\n\n## Collection 与 Batch Queue\n\nForge Intake 可以导入 mixed Actor/Item Collection JSON 或标准 ZIP。每项拥有独立 source、kind/mode、identity、attempt、status 和 review；输入顺序保留，单项失败不会让其他项升级为 accepted。\n\nRunner 固定 concurrency `1`，只有 GM 显式点击才运行。刷新或关闭页面时，`running` / `applying` 项变为 `interrupted`，不会自动重发可能计费的 Provider 请求。跨会话恢复的历史 accepted review 不含完整 response，必须显式 fresh run 后才能重新进入 apply manifest。\n\n批量 Apply 只接受当前页面仍持有完整 accepted response 的项目。确认框会列出 immutable manifest、Document ID、source/artifact hash 和 target；Actor 与 Item 继续走各自 adapter。多 Document 操作不是原子事务，部分成功/失败会逐项报告，不会伪装为全成功或回滚已完成的其他 Document。\n\n## 明确限制\n\n### 角色、召唤物与配套宏整包导入\n\n在 **Forge Intake → 战斗包导入 / 启动控制** 打开新入口：\n\n1. 选择`fvtt-json-forge-encounter` v1 JSON，或仅包含`encounter.json`的标准ZIP。此前普通龙兽交付ZIP、Review Bundle和Batch Collection不是这个格式。\n2. 点击“预览战斗包”。模块在当前浏览器通过正式workflow重新生成每个Actor，显示基础属性、来源、生成数据、宏代码、图片绑定和具体GM操作规则。这个步骤不会调用AI、创建文档或运行宏。\n3. 核对内容后勾选确认，再点击“一起导入角色与宏”。相同且未改变的文档会复用；同一包身份的不同内容、已有文档改变或ID冲突会阻止覆盖。\n4. 导入后在“已导入的战斗控制”里查看宏，点击“启动战斗控制”。固定配置首次启用后会在刷新时重验并恢复；控制面板“停用自动化”会持久停用，关闭面板不等于停用。旧式专用宏仍需手动重新启动。\n\nMacro创建与执行是两个动作。脚本仍在GM客户端权限下运行；导入包不能自行宣称代码可信。启动前重新核对命令hash、绑定Actor的身份与其应有的机制标记；被替换、删掉机制或代码改变的内容需要重新审阅。不要修改hash或flags来绕过检查。\n\n明确的GM辅助/外部规则只在新整包路径中进入显式审核，且必须各自关联一份有正确Actor绑定的宏。原有单Actor/Item accepted-only路径不变；失败来源、未知诊断或缺失覆盖不能借宏包绕过。\n\n多文档导入不保证跨浏览器原子事务。普通失败清理本次新建文档并检查结果；无法清理时列出准确UUID。既有文档不会被覆盖。已上传的内容寻址图片可能保留供重试，图片不同则拒绝覆盖。已在游戏中改变过的角色再次导入可能报告冲突，这是避免覆盖当前状态的预期行为。\n\n样本制作：在仓库运行`bun run tools/forge-encounter/build-example.ts`，产生`crystalbleed.forge-encounter.json`和`crystalbleed.forge-encounter.zip`。包携带来源和绑定宏；Actor JSON由接收端正式生成。样本宏使用`forgeEncounter.actors.dragon`与`forgeEncounter.actors.crystal`，不会按同名任意选择世界角色。\n\n人类 MD 路径支持 2 至 6 种生物、最多 24000 字符。AI 提取并审核生物数据，再选择已实现的固定能力和参数；工具校验并编译控制入口，AI 不写 JavaScript。明确启用的固定配置会在刷新时重验身份后恢复，停用按钮持久生效。未知或不支持的规则保留审阅，不会现场生成代码补齐。完整步骤见[原始MD战斗包指南](../../tools/forge-encounter/README.md)。\n\n前后条件分支使用仅限Encounter的明确GM/配套宏机制：不同时应用互斥的原生效果，完整来源留在能力说明中。该角色的单独状态保持needs_review，必须由来源审阅接受其保留方式，并由正确绑定的唯一宏承担该机制，才可进入包级确认；其他文字或未知机制仍被拒绝。\n\n### 其他边界\n\n- 只支持 Foundry `14.364` / dnd5e `5.3.3` / `core`；不是 v12/v13 模块。\n- 只允许 GM；不是玩家 JSON 导入工具。\n- 不是任意文本、任意模型、任意 Actor/Item 都能 accepted 的保证。\n- 不支持 OCR/PDF/图片 Intake、update/overwrite、按名称合并、embedded Item 产品入口或跨 Document 原子事务。\n- 页面关闭后不会继续 AI/HTTP。真正后台执行需要另行设计 Companion/Gateway、认证与 Key custody。\n- 本地 Lab PASS 不代表生产、任意模块组合或四小时真实桌面会话 PASS。\n\n当前分层证据见 [support matrix](../../docs/acceptance/current-support-matrix.md)，A–E 实施与边界见 [产品计划](../../docs/plan/2026-08-21-forge-fvtt-module-product-execution-plan.md)、[Task D](../../docs/plan/2026-08-24-forge-fvtt-intake-task-d-plan.md) 与 [Task E](../../docs/plan/2026-08-30-forge-fvtt-task-e-plan.md)。\n\n## 维护者构建\n\n```powershell\nbun install --frozen-lockfile\nbun run test:fvtt-json-forge\nbun run release:fvtt-json-forge\nbun run verify-release:fvtt-json-forge\n```\n\n发行输出位于 `foundry-modules/fvtt-json-forge/dist/release/`：\n\n- `fvtt-json-forge-0.3.0.zip`\n- `fvtt-json-forge-module.json`\n- `SHA256SUMS.txt`\n\n构建器固定 ZIP 排序与时间戳；两次 fresh build 必须产生相同 ZIP SHA-256，并验证 archive、独立 manifest、package version 和下载 URL 一致。\n\n\n## 当前验收与通用性边界（2026-09-15）\n\n人类 MD 是可复用的输入模板，生物名称不决定执行分支。自动化使用已实现的固定能力库；其具体形态、模板和操作顺序见[战斗包指南](../../tools/forge-encounter/README.md#人类-md-模板与当前能力范围)。任意新机制不能仅凭填写模板获得自动化支持。\n\n本地专项已验证守护真实伤害阈值、混合伤害合计、临时 HP，以及原生拒绝次数耗尽后的削弱。重复腐化证据保留 PARTIAL，用户决定待独立状态设计后再处理；不宣称每次失败增加一级已严格实测。Dazed修复专项与FVTT页面完整AI生成链尚未复验。当前可提交并合并的0.3.0候选未发布远端，合并不代表生产部署。\n","foundry-modules/fvtt-selected-token-sync/README.zh-CN.md":"# 框选 Token 同步 / Selected Token Sync\n\n这是一个针对 Foundry VTT `14.364` / dnd5e `5.3.3` 的本地模块。\n\n开启 Token 控制栏里的“框选 Token 同步”后，在一个 Token 的 HUD 中执行下列操作，会同步到当前框选的其他 Token：\n\n- Token HUD 核心状态的添加、删除和 overlay 操作；\n- Foundry v14 Token HUD 的移动方式，例如 walk、fly、swim、burrow、crawl、climb，以及“默认”。\n\n“默认”会同步为 `movementAction: null`，不会强制所有 Token 使用 walk。模块也不会修改 `system.attributes.movement.walk` 等 Actor 移动速度字段。\n\n## 使用方式\n\n1. 在 Token 控制栏打开“框选 Token 同步”。\n2. 框选需要同步的 Token。\n3. 打开其中一个 Token 的 HUD，点击状态或移动方式。\n4. 再次关闭工具栏开关即可恢复单 Token 行为。\n\n开关是每位用户独立保存的，默认关闭。同步集合以点击 HUD 时的选择为准；同一个 linked Actor 的多个 Token 只写入一次状态。\n\n模块只处理 Token HUD 的核心状态。由物品、法术、DAE、MIDI-QOL 或其他模块直接创建/删除的 ActiveEffect 不会被本模块批量复制。\n\n## 来源与兼容性\n\n本模块借鉴 Alan Davies 的 [Multi Token Status](https://codeberg.org/cs96and/FoundryVTT-multistatus) 的 MIT 授权实现思路，特别是明确 active 状态、Actor 去重、HUD 来源识别和递归保护。历史 v10-v12 实现使用 `libWrapper`；v14 实现使用公开 hooks，本模块沿用后者，不声明 `libWrapper` 硬依赖。\n\n如果原版 `multistatus` 模块处于启用状态，本模块会拒绝启用同步模式，避免同一操作被复制两次。\n\n## 构建与本地 Lab\n\n```powershell\nbun run build.ts\nbun run test\nbun run typecheck\nbun run labCli.ts install\nbun run labCli.ts install --apply\nbun run labCli.ts verify-install\n```\n\n安装器只接受 `F:\\FoundryLab\\foundry-v14`，只写入其 `data/server-mirror/Data/modules/fvtt-selected-token-sync`，拒绝未知既有目录、链接和非本地目标；它不会创建备份或覆盖现有模块。\n\n本地安装和测试不代表生产环境已经部署或通过长时会话验收。\n","foundry-modules/monster-spell-resolver/README.zh-CN.md":"# 怪物法术解析器\n\n这是安装进 Foundry Virtual Tabletop（Foundry VTT）的浏览器模块。它读取本项目生成 Actor 携带的可移植法术清单，在目标世界已启用的 dnd5e 法术资料包中寻找匹配法术，并以 Actor 为单位执行全有或全无的安全解析。\n\n## 目录归属\n\n- `src/`：浏览器运行源码、`module.json`、语言文件、样式、模板和模块测试。\n- `build.ts`：构建可安装目录和 ZIP。\n- `lab.ts`、`labCli.ts`、`labConfig.ts`：只负责配置后的本地 Foundry Lab 构建、安装、校验、卸载和一次性测试世界准备。\n- `dist/`：可重建的本地构建产物，不提交 Git。\n\n旧目录 `src/foundry/mo
