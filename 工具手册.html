M-005 are closed; authenticated crawl and exact protected/full module coexistence remain external boundaries.\n\n## 2026-07-16 Module-Snapshot Correction\n\n- The preceding dated checkpoints incorrectly carried the 2026-07-11 88-ID production snapshot forward as a current intended set after the 2026-07-12 cleanup record had changed the local baseline and recorded later production changes.\n- The accepted local cleanup baseline is 79 enabled modules. That number is not a current production count; this remediation turn performed no fresh production inventory.\n- PROD-005 is closed as a scope/report correction, not a coexistence Pass. The 88-ID failure remains historical evidence, while future production compatibility work requires a fresh read-only inventory and explicit user scope. PROD-003 is the only remaining external Goal boundary.\n\n## 2026-07-16 Authenticated Crawl Amendment\n\n- The user explicitly authorized the existing logged-in Chrome session. The session was used in place: no cookies, password, local storage, or credential header was inspected or exported.\n- Board 2318 produced 54 discovered topics, 37 matched/crawled monster topics, 37 records, and 47 plaintext statblocks with zero crawl/plaintext failures. The first JSON run was mechanically clean but failed semantic review, exposing fractional-CR truncation, `暗蚀` loss, language/taxonomy qualifier loss, replacement-damage overcounting, and simultaneous automation of staged save outcomes.\n- Generalized source/corpus-derived repairs passed 52 focused tests. All 47 Actors were regenerated through the project CLI and passed 47/47 verifier checks. Expanded live projections passed for one fractional CR, 25 qualified-language records, 10 variable-taxonomy records, the Gremishka replacement-damage branch, and the Petrifying Death's Head staged save while preserving literal descriptions.\n- The current aggregate gate passes 804 tests / 3,136 expectations, 85.18% production lines / 87.48% production functions, both typechecks, 117-source anti-overfit, locked dnd5e reference verification, Web build, and offline smoke; repository hygiene passes across 1,673 tracked paths. Foundry Lab separately passes 116 tests / 417 expectations. The Rat Warlock sample was not separately imported into Foundry, so its acceptance remains at the Web/project-generation/verifier layer.\n\n## 2026-07-19 Spell Resolver Qualification\n\nThe 2026-07-17 Rat Warlock AI Intake acceptance remains valid for its reviewed non-spell statblock intake scope. Functional spell resolution is not accepted: `SPELL-001` remains open because the generated Actor has no portable ten-spell resolver manifest, no resolved embedded spell items, and no pending resolver state. This qualification remains in force until the exact local Foundry runtime gate passes; it does not alter the prior intake evidence or claim a production-world migration.\n\n## 2026-07-19 Spell Resolver Closure Amendment\n\nThe preceding qualification is superseded for the exact accepted local target. The current project workflow produces a source-evidenced ten-spell portable manifest with status `pending`, no placeholder Spell, and no destination UUID. In the project-local Foundry `14.364` / dnd5e `5.3.3` disposable world, the resolver hydrated the Rat Warlock to ten native Cast Activities and ten one-to-one cached Spells, exercised attack/save/utility and limited/at-will use, preserved native use after module disable, proved 2024-first plus isolated 2014 fallback behavior, and passed Keep/Overwrite/Cancel, exact rollback/residual, idempotency, and unrelated-Actor checks. The full evidence and limitations are recorded in [Rat Warlock Target-World Spell Resolver Acceptance](./2026-07-18-rat-warlock-spell-resolver.md).\n\n`SPELL-001` is closed only for Foundry `14.364` / dnd5e `5.3.3`. This amendment does not claim a v12 resolver, OCR/PDF intake, production installation, bulk migration, compatibility with later runtime versions, or complete automation of literal source-specific restrictions.\n","docs/document-input-workflow.md":"# 图片 / PDF 文档输入\n\n文档输入只承诺 NPC/怪物 Actor，流程固定为：\n\n```text\n图片/PDF → 本地提取 → 候选筛选 → 原始 Markdown → 候选翻译 → AI Intake → 现有生成器 → Actor JSON\n```\n\n## CLI\n\n```text\nbun run src/index.ts \u003cfile.pdf|file.png> --extract-only\nbun run src/index.ts \u003cfile.pdf|file.png> --document-candidate \u003ccandidate-id>\nbun run src/index.ts --document-doctor\n```\n\n支持的参数：\n\n- `--document-engine auto|native|paddleocr`\n- `--document-language auto|en|zh-CN|mixed`\n- `--document-candidate \u003cid>`（可重复）\n- `--extract-only`\n- `--document-target-language \u003clanguage>`（默认 `zh-CN`）\n\n每次运行会在 `.local/document-runs/\u003crun-id>/` 生成 `raw-extracted.md`、`document-candidates.json`、`extraction-report.json`。原始 PDF/图片不会复制进 Vault manifest。\n\n## 本地 OCR\n\n普通 PDF 优先使用 PDF 内嵌文字和坐标；没有可靠文字层的页面会用 `pdfplumber` 的本地 PDFium 渲染后交给 PaddleOCR。图片直接走 PaddleOCR。Tesseract 只作为英文标点和专名提示，不替代主 OCR。\n\n先运行 `bun run document:doctor`。如果需要创建隔离环境，可在项目根目录使用 Python 3.12：\n\n```text\nuv venv .local/document-ocr --python 3.12\nuv pip install --python .local/document-ocr/Scripts/python.exe pdfplumber paddleocr==3.7.0 paddlepaddle==3.2.0\n```\n\n不同机器的 Paddle/PaddleOCR 组合可能不同；以 `document:doctor` 和一次真实图片 smoke 为准。OCR 缺失时流程会给出错误，不会静默把乱码送进生成器。\n\n## 翻译和 Intake 边界\n\n过滤发生在翻译之前，只有被选中的高置信度候选会进入 Markdown 翻译。翻译服务缺失、结果为空或机械字段占位符丢失时，候选会停在 `needs_review`，不会生成正式 JSON。\n\nOCR Markdown 不是项目的结构化 YAML/Markdown 契约。正式生成默认需要现有 AI Monster Intake 配置；没有 Intake 配置时，文档链路会 fail closed。普通 `.md`、`.markdown` 和 `.txt` 仍走原来的入口，不受影响。\n\nWeb 入口使用二进制 `multipart/form-data` 上传，检查文件大小、MIME 和文件签名，并在任务沙箱中保存输入；提取完成后在任务摘要和报告中提供页数。任务完成后可下载候选清单、报告、原始/翻译 Markdown、标准 Markdown 和 Actor JSON；上传模式不会修改 Vault manifest。\n","docs/examples/召唤生物-人类写法模板.md":"# 【遭遇或生物组合名称】\n\n> 人类填写用的原始资料模板。把【】替换为你的内容；没有的能力写“无”。下面是普通 Markdown 规则文字，不需要填写程序字段。\n> 本模板对应 Forge 0.3.0 候选的“从人类写法MD生成战斗包”入口。生成仍需通过来源与自动化审核；填写模板不等于保证自动通过。当前真实验收状态以该候选的验收记录为准。\n\n## 这份资料包含什么\n\n这份资料包含两种独立生物：**【主生物名称】**和**【被召唤生物名称】**。\n\n【主生物名称】使用“【召唤能力名称】”时，会召唤【数量】只【被召唤生物名称】。两种生物分别有自己的数据卡；召唤能力属于主生物。被召唤生物的完整数据写在后面。\n\n我希望角色目录中生成两个生物条目。实际使用召唤能力时，从被召唤生物的条目在场景中放置对应数量的指示物；每只召唤物单独记录生命值和状态。召唤多只同种生物时，不要在角色目录中反复创建同一种生物。\n\n## 生物一：【主生物名称】\n\n【体型】【生物类型】，阵营【阵营】。\n\n- 护甲等级：【数值及护甲来源】。\n- 生命值：【固定上限】。生命骰：【公式；不使用则写无】。若两者不一致，以【固定上限或生命骰结果】为准。\n- 速度：【步行、飞行、游泳、攀爬、掘穴速度；写明单位】。\n- 力量【】、敏捷【】、体质【】、智力【】、感知【】、魅力【】。\n- 豁免：【豁免属性和总加值；没有则写无额外熟练】。\n- 技能：【技能名称和总加值】。\n- 伤害抗性：【】。伤害免疫：【】。伤害易伤：【】。\n- 状态免疫：【】。\n- 感官：【感官、距离和被动察觉】。\n- 语言：【】。\n- 挑战等级：【】。熟练加值：【】。\n- 先攻：【总加值；或写仅使用敏捷调整值】。\n\n### 特性\n\n**【特性名称】。**【完整规则。写清触发条件、受影响对象、效果和结束条件。没有则写无。】\n\n### 动作\n\n**【攻击名称】。**【近战或远程】攻击，命中加值【】，触及或射程【】，目标【】。命中后受到【伤害骰及类型】。附加效果：【无，或完整写出豁免属性、DC、成功与失败的不同结果】。\n\n**【其他动作名称】。**【次数或充能、消耗、目标、范围和完整效果。没有则写无。】\n\n### 召唤能力：【召唤能力名称】\n\n【主生物名称】以【一个动作／一个附赠动作／消耗几个传奇动作／满足条件时触发】使用此能力，每【日／短休／长休】可以使用【次数】次，或以【充能规则】恢复。\n\n使用时，【是否先进行攻击、豁免或其他结算；没有则写直接召唤】。在【何时：宣告后、命中后、豁免结算后等】召唤【数量】只**【被召唤生物名称】**，使用下方的完整数据。\n\n- **位置：** 出现在【距离谁多少尺】的【可见／无需可见】未占据空间。由【GM手选／自动选择满足条件的最近空位】放置，必须容纳其完整体型。\n- **成功与失败：** 【召唤是否依赖前置攻击命中或豁免失败？成功时也召唤吗？没有前置检定则写无检定。】\n- **没有空位时：** 【整次能力取消且不消耗资源／其他明确处理方式】。如有前置伤害，写清是在伤害结算前检查，还是伤害仍然发生但召唤失败。\n- **归属与控制：** 对【谁】友好，对【谁】敌对；由【GM／指定玩家】控制。指挥是否需要额外动作：【】。\n- **先攻：** 【独立掷先攻／沿用召唤者先攻／紧接召唤者之后行动】。战斗中加入【哪一场战斗】；非战斗中使用时【不创建战斗／由GM决定】。\n- **首次行动：** 【生成时立即行动／不立即行动】。如果加入战斗时它的行动时点已经过去，【本轮如何处理】。\n- **持续时间：** 【永久存在直到被摧毁／若干轮／若干分钟】。在【具体时点】结束。\n- **专注：** 【是否需要；如需要，何时因专注结束而消失】。\n- **数量上限：** 每个召唤者最多同时维持【数量】只。再次召唤超过上限时【不能使用且不消耗／替换旧召唤物／其他规则】。\n- **死亡与消失：** 召唤物生命值归零时【处理方式】；召唤者死亡或失去意识时【处理方式】。说明是否移除场景指示物和对应战斗成员。\n- **其他关联：** 【召唤物是否继承召唤者能力、共用资源或具有其他关联；没有则写无】。\n\n### 附赠动作、反应与传奇动作\n\n【逐项写出；没有则写无。若有传奇动作，写清每轮次数、恢复时点和各选项消耗。】\n\n## 生物二：【被召唤生物名称】\n\n【体型】【生物类型】，阵营【阵营】。\n\n数据来源：【本节完整定义的自制生物／明确版本的官方生物资料】。如果使用官方红龙，写清是雏龙、青年龙、成年龙还是远古龙，并提供实际使用的数据或可核对的来源；不要只写“红龙”。\n\n- 护甲等级：【】。\n- 生命值：【固定上限】。生命骰：【公式或无】。采用【固定上限或掷骰】。\n- 速度：【所有移动方式及单位；不能移动则明确写出】。\n- 力量【】、敏捷【】、体质【】、智力【】、感知【】、魅力【】。\n- 豁免：【】。技能：【】。\n- 伤害抗性：【】。伤害免疫：【】。伤害易伤：【】。状态免疫：【】。\n- 感官：【】。语言：【】。\n- 挑战等级：【】。熟练加值：【】。先攻：【】。\n\n### 特性\n\n**【特性名称】。**【完整规则。】\n\n### 动作\n\n**【动作名称】。**【消耗、攻击加值或豁免DC、目标、射程或区域、伤害骰、伤害类型、成功与失败结果。】\n\n### 自动触发的能力\n\n**【能力名称】。** 在【自己的回合开始／自己的回合结束／其他明确时点】，对【范围内哪些生物，是否包含盟友和召唤者】生效。每【回合或轮】最多【次数】次；目标进行【属性】豁免，DC【】，失败【】，成功【】。刚被召唤时【是否额外触发】；生命值归零后【是否停止】。\n\n【没有自动触发能力则写无。】\n\n### 附赠动作、反应与传奇动作\n\n【逐项写出；没有则写无。】\n\n## 我希望自动完成与由GM决定的部分\n\n自动完成：【例如消耗次数、放置召唤物、绑定召唤者、加入战斗、掷先攻、到期移除】。\n\n由GM决定：【例如选择目标、选择召唤位置、决定红龙本回合攻击谁】。\n\n资料没有写明而又影响规则的内容，请列出缺项，不要自行补成已经确认的规则。\n","docs/examples/晶血龙兽与月石晶体-人类写法.md":"# 晶血龙兽与月石晶体\n\n## 这份资料包含什么\n\n这份资料包含两种独立生物：**晶血龙兽（Crystalbleed Drakon）**和**月石晶体（Moonstone Crystal）**。\n\n晶血龙兽拥有“晶片齐射（Shard Salvo）”传奇动作。无论目标在这次动作中的体质豁免成功还是失败，齐射完成后都会在目标旁边的一个空位生成一只月石晶体。月石晶体有自己的生命值、先攻、回合和状态；它不是晶血龙兽的一部分，也不与晶血龙兽共用生命值。请分别建立两个独立的生物条目；每次生成的晶体都应当是一个独立指示物，单独记录生命值和状态。\n\n资料中提到的自动处理，是希望配套自动化能够协助记录守护状态、处理召唤和先攻，并在晶体自己的回合执行戳刺。自动化不能替代来源没有写明的召唤持续时间、数量上限、召唤者死亡后的处理或其他需要 GM 确认的规则。\n\n## 生物一：晶血龙兽（Crystalbleed Drakon）\n\n巨型龙，通常为中立邪恶。\n\n- 护甲等级：19（天生护甲）。\n- 生命值：固定为 176。生命骰公式：14d12+42。二者不是同一个平均值；使用时保留固定生命上限 176，并保留 14d12+42 作为生命骰公式。\n- 速度：步行 40 尺、掘穴 30 尺、飞行 80 尺、游泳 40 尺。来源没有列出攀爬速度。\n- 力量 23、敏捷 14、体质 20、智力 16、感知 19、魅力 18。\n- 豁免熟练：敏捷 +7、体质 +10、感知 +9、魅力 +9。来源没有列出力量和智力的额外豁免熟练。\n- 技能：察觉 +9、游说 +9、隐匿 +7。\n- 伤害抗性：无。伤害免疫：无。伤害易伤：来源未列出。\n- 状态免疫：魅惑、恐慌、中毒、震慑、变形。\n- 感官：盲视 60 尺、黑暗视觉 150 尺、被动察觉 19。\n- 语言：通用语、龙语、地底通用语（Undercommon）。\n- 挑战等级：13。经验值：10000。熟练加值：+5。\n- 先攻：+12。\n\n晶血龙兽全身的晶体会随着心跳渗出暗红液体，绯晶像水流一样环绕在它身侧。战斗前启用配套的战斗控制自动化，以协助处理月蚀守护、晶体召唤和回合效果；页面刷新后需要重新启用这套自动化。\n\n### 特性\n\n**两栖（Amphibious）。** 晶血龙兽可以在空气和水中呼吸。\n\n**月蚀守护（血魔法）。** 每当晶血龙兽原本将要从一次伤害结算中受到超过 20 点伤害时，水流般的绯晶会环绕它，使这次伤害减半，向下取整。同一次伤害结算中包含不同伤害类型时，先把这些伤害合计，再判断是否超过 20 点。总伤害为 20 点或更少时不会减免。\n\n在绯晶拒绝造成的守护碎裂期间，月蚀守护不减免伤害。绯晶拒绝的次数耗尽后，守护恢复为削弱形态：超过 20 点的伤害只能减少熟练加值，也就是减少 5 点，不能再减半。守护碎裂和恢复为削弱形态的变化应当清晰可见。\n\n**绯晶拒绝 [2/日]（Ruidium Defiance）。** 当晶血龙兽豁免失败时，它可以把这次豁免改为成功。使用这个能力的代价是月蚀守护碎裂；守护持续失效，直到晶血龙兽的下一回合开始。这一变化清晰可见。\n\n这个能力每天可以使用两次。两次使用次数耗尽后，月蚀守护即使恢复，也只能按削弱形态运作：超过 20 点的伤害只能减去熟练加值 5，不能减半。绯晶拒绝不改变晶血龙兽的护甲等级，也不改变伤害抗性。\n\n**绯晶腐化（Ruidium Corruption）。** 只有当某个能力明确要求进行这项结算时，目标才进行一次 DC 18 魅力豁免。豁免失败时，目标受到绯晶腐化；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。豁免成功时无效果。\n\n月石晶体能力中所说的“月石腐化”使用同一个绯晶腐化标记和同一套规则，不建立一个可以与之叠加的同义状态。腐化的移除按战役规则由 GM 处理。\n\n**尾击推退（Tail Shove）。** 尾击命中一个生物后，晶血龙兽可以选择推退。目标进行 DC 19 力量豁免；失败时目标被推开 10 尺，成功时无效果且不移动。同一次尾击不能同时选择尾击扫倒。\n\n**尾击扫倒（Tail Sweep）。** 尾击命中一个生物后，晶血龙兽可以选择扫倒。目标进行 DC 19 力量豁免；失败时目标陷入倒地（Prone），成功时无效果。同一次尾击不能同时选择尾击推退。\n\n### 动作\n\n**多重攻击（Multiattack）。** 晶血龙兽发动三次攻击：一次啃咬和两次爪击。每次攻击分别选择合法目标，并分别进行命中与伤害结算。\n\n**啃咬（Bite）。** 近战武器攻击，命中 +11，触及 10 尺，一个目标。命中造成 3d10+6 穿刺伤害（平均 22 点），外加 2d8 心灵伤害（平均 9 点）。\n\n**爪击（Claw）。** 近战武器攻击，命中 +11，触及 5 尺，一个目标。命中造成 3d8+6 挥砍伤害（平均 19 点），外加 1d8 心灵伤害（平均 4 点）。\n\n**尾击（Tail）。** 近战武器攻击，命中 +11，触及 15 尺，一个目标。命中造成 4d6+6 钝击伤害（平均 20 点），外加 1d6 心灵伤害（平均 3 点）。如果目标是生物，命中后晶血龙兽可以选择尾击推退或尾击扫倒，只结算其中一个分支。\n\n**噩梦吐息（Nightmare Breath，充能 5–6）。** 晶血龙兽吐出覆盖 60 尺锥形区域的红雾。区域内的每个生物都必须进行一次 DC 18 感知豁免。\n\n- 豁免失败：受到 6d10（平均 33 点）力场伤害，并陷入恐慌（Frightened），持续 1 分钟。\n- 豁免成功：受到一半伤害，向下取整，不陷入恐慌。\n\n受影响的生物在自己每个回合结束时重复进行 DC 18 感知豁免；成功则结束恐慌。受影响生物 5 尺内的另一个生物可以使用一个动作进行 DC 15 运动或医药检定；检定成功时拔除绯晶刺并结束恐慌。\n\n### 传奇动作\n\n晶血龙兽拥有 4 个传奇动作。它只能在另一个生物的回合结束时使用下列选项中的一个；在自己的回合开始时恢复所有已消耗的传奇动作。\n\n**尾击（Tail Attack，消耗 1 个传奇动作）。** 晶血龙兽发动一次尾击。该次攻击使用尾击本身的攻击和命中后分支规则；这个传奇动作已经包含这次尾击，不再额外消耗晶血龙兽的普通动作。\n\n**血液支配（Command the Blood，消耗 1 个传奇动作）。** 晶血龙兽选择一个它能看见且位于 30 尺内的生物。目标进行 DC 18 感知豁免；生命值尚未受损的目标进行这次豁免时具有优势。\n\n豁免失败时，目标必须使用自己的反应，对另一个位于其触及范围内的生物发动一次近战武器攻击。由晶血龙兽选择这个被攻击的生物。如果没有合法目标，或者目标不能执行反应，则这个效果无效。豁免成功时无效果。\n\n**晶片齐射（Shard Salvo，消耗 2 个传奇动作）。** 晶血龙兽向一个它能看见且位于 30 尺内的生物射出水晶碎片，目标进行一次 DC 18 体质豁免。\n\n- 豁免失败：受到 2d8（平均 9 点）心灵伤害，并陷入恍惚（Dazed），持续至目标下一个回合结束。恍惚不是麻痹，也不是震慑。\n- 豁免成功：受到一半伤害，向下取整，不陷入恍惚。\n\n如果晶血龙兽当前生命值不高于生命值上限的一半，豁免失败的目标还必须进行一次 DC 18 魅力豁免，并按绯晶腐化的规则结算。\n\n无论目标的体质豁免成功还是失败，晶片齐射完成后都会在目标旁边的一个空位生成一只月石晶体。该晶体立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺，也就是不会在生成后立即进行一次月石戳刺。月石晶体的完整数据见下方“生物二”。\n\n**掠流滑翔（Current Glide，消耗 1 个传奇动作）。** 晶血龙兽移动至多等于当前所使用移动方式速度一半的距离。这次移动不会引发借机攻击。\n\n### 附赠动作与反应\n\n来源没有定义晶血龙兽的专属附赠动作或反应。\n\n## 生物二：月石晶体（Moonstone Crystal）\n\n中型构装体，无阵营。它是由晶血龙兽的晶片齐射生成的固定晶体，每一只都有独立的生命值、状态和战斗成员。\n\n- 护甲等级：17。\n- 生命值：15。资料只给出固定生命值 15，没有提供生命骰公式。\n- 速度：步行 0 尺、飞行 0 尺、游泳 0 尺、攀爬 0 尺、掘穴 0 尺；不能移动。\n- 力量 10、敏捷 10、体质 10、智力 1、感知 10、魅力 1。\n- 先攻：+0。\n- 挑战等级：0。熟练加值：+2。\n- 语言：无。\n- 伤害抗性、伤害免疫和伤害易伤：资料没有添加额外设定。状态免疫：资料没有添加额外设定。\n- 感官：来源没有列出额外感官或被动察觉值。\n- 经验值：来源未提供。\n\n### 特性\n\n**固定晶体（Immobile Crystal）。** 月石晶体是不能移动的构装体，所有速度均为 0。它由晶片齐射生成在目标旁边的一个空位中，随后立即投掷先攻并加入当前战斗。晶体被摧毁后停止行动。\n\n**月石腐化（Moonstone Corruption）。** 这项能力只在月石戳刺造成的敏捷豁免失败之后使用。目标进行一次 DC 18 魅力豁免；成功时无效果。失败时，目标受到绯晶腐化（月石腐化）；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。这里的“月石腐化”和晶血龙兽的“绯晶腐化”代表同一个状态，不互相叠加成两个不同状态。腐化的移除按战役规则由 GM 处理。\n\n### 动作\n\n**月石戳刺（Moonstone Spikes）。** 在月石晶体自己的回合开始时，它向周围 10 尺内除自身以外的所有生物伸出不规则的月石尖刺，不区分敌友。每个生物分别进行 DC 18 敏捷豁免。\n\n- 豁免失败：受到 2d6（平均 7 点）穿刺伤害，随后进行一次独立的 DC 18 魅力豁免，并按月石腐化处理。\n- 豁免成功：不受伤害，也不进行腐化豁免。\n\n每只晶体每回合只能戳刺一次。晶体刚生成时不会在生成瞬间额外戳刺；晶体生命值为 0 时不再戳刺。\n\n### 附赠动作、反应与传奇动作\n\n来源没有定义月石晶体的专属附赠动作、反应或传奇动作。\n\n## 召唤关系与希望自动完成的部分\n\n我希望生成两个独立的生物条目，并提供配套自动化。自动化应当协助完成以下来源已经定义的内容：\n\n- 处理晶血龙兽的 4 点传奇动作资源，使传奇动作在晶血龙兽自己的回合开始时全部恢复，并按各选项分别消耗 1 点或 2 点。\n- 记录绯晶拒绝每天两次的使用情况；使用后让月蚀守护碎裂到晶血龙兽下一回合开始，并在次数耗尽后让守护恢复为只能减去 5 点伤害的削弱形态。\n- 在月蚀守护触发时，把同一次伤害结算的不同伤害类型合计，只有总伤害超过 20 点才处理减免；守护完整时减半并向下取整，碎裂时不减免，削弱时减去 5 点。\n- 处理晶片齐射的两阶段豁免、伤害、恍惚和生命值不高于一半时的腐化豁免。齐射结算完成后，无论目标豁免结果如何，生成一只月石晶体，在目标旁边的一个空位立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺。\n- 为每只晶体分别记录生命值和状态。晶体在自己的回合开始时，对周围 10 尺内所有其他生物执行一次月石戳刺，先做敏捷豁免，只有敏捷豁免失败者才做后续魅力腐化豁免。晶体被摧毁后停止这项行动。\n- 只在能力文字明确要求时处理绯晶腐化；首次失败标记为腐化，已有腐化者再次失败时增加 1 级力竭。腐化的解除仍由 GM 按战役规则处理。\n\n由 GM 决定或需要 GM 确认的内容包括目标选择、不同合法空位之间的选择、攻击和传奇动作的战术选择，以及来源没有明确定义的召唤规则。\n\n## 来源未指定、需要 GM 确认的规则\n\n以下内容没有在这两份生物资料中定义，不能自行补成确定规则：\n\n- 月石晶体的召唤持续多久，以及在什么时点结束。\n- 同时存在的月石晶体数量上限；资料只写明每次晶片齐射生成一只，没有给出总上限或每个召唤者的上限。\n- 晶血龙兽死亡、失去意识、离开场景、离开当前战斗或进入其他场景时，已经生成的月石晶体是否消失、停止、继续存在或改变归属。\n- 月石晶体被摧毁后是否需要从场景中移除指示物或从战斗中移除成员；来源只明确说它停止行动。\n- 晶片齐射使用时如果当前没有战斗，如何投掷先攻以及是否仍然生成晶体。\n- 目标旁边没有合适的空位时如何处理，以及有多个空位时由谁选择；来源只要求目标旁边的一个空位。\n- 绯晶拒绝的“每天两次”在何时恢复；资料没有指定长休、每日固定时点或其他恢复方式。\n- 月石晶体是否需要专注、是否需要召唤者持续维持，以及晶体对召唤者和其他生物的友好关系、控制者和指挥方式。\n","docs/generated-actor-verification.md":"# Generated Actor / Item Verification\n\n## Required Source-To-JSON Checks\n\nFor each generated Actor JSON, manually compare the generated output against the source markdown:\n\n- Identity: name, bilingual name handling, creature type, size, and alignment.\n- Language and source fidelity: a single-language source remains in its source language, while existing bilingual text keeps its original correspondence; translation is not a prerequisite for acceptance.\n- Core stats: AC, HP, hit dice, speeds, abilities, saves, and skills.\n- Traits: senses, languages, damage resistances, damage immunities, damage vulnerabilities, and condition immunities.\n- Actions: action count, action names, attack bonuses, reach or range, damage formulas, damage types, and descriptions.\n- Saves and effects: DCs, save abilities, success and failure behavior, conditions, durations, and repeated-save rules.\n- Legendary, reaction, and bonus actions: count, cost, activation type, and descriptions.\n- Spellcasting: spell list, spell save DC, spell attack bonus, preparation or innate-casting rules, and linked UUIDs where expected.\n- Automation: activities, active effects, flags, module-specific fields, and effect-profile behavior.\n- Description fidelity: important source text is preserved or intentionally transformed.\n- Source coverage: every mechanically relevant source markdown section is represented or intentionally excluded.\n- No false effects: prerequisite-only text does not create on-hit effects unless the source explicitly applies that effect.\n- Output provenance: final JSON came from the project CLI or workflow, not manual construction or repair.\n\nWhen the source entered through document extraction, plaintext ingestion, or AI Intake, also trace the exact source identity through its source-scoped evidence/run artifacts, evidence IR where applicable, rendered Markdown, portable manifest evidence where applicable, and final JSON. Confirm that page/coordinate/language/confidence/line-order evidence for documents, and per-entity/aggregate equivalence for plaintext collections, were not replaced by an unrelated source or run.\n\nFor each generated standalone Item, also compare:\n\n- Identity and category: bilingual name, source category, normalized Foundry document type, rarity, attunement, weight, price, and equipment subtype.\n- Activities: inspect each `system.activities` entry for activation, target/range, consumption, uses/recovery, save/attack/damage, and its actual source-derived stage membership.\n- Effects: every structured embedded effect exists once, has a unique ID, and is referenced only by the Activities that apply it; check each Activity-to-Effect linkage rather than only counting effects.\n- Profile isolation: `core` contains no MIDI-QOL, DAE, Times Up, or Item Macro fields; a modded profile uses only the locked target-version contract.\n- Stage provenance: names, requirements, uses, and mechanics come from structured source data. A literal-only stage must remain `needs_review`.\n- Complex-rule boundary: if the locked target cannot express the source rule natively, the result must say `gm-assisted` or `external-rule` with preserved source text. Static JSON, a utility-shaped placeholder, or a passing verifier is not native automation acceptance.\n\n## Shared Verification Gate\n\nAll supported entry points must run the same canonical generation pipeline. Before a formal write:\n\n- Every canonical attack, damage, save outcome, activation, use, effect, range, and stage is projected once or explicitly marked `literal-only`/`unsupported`.\n- Activity/Effect IDs are stable, 16 characters, unique within their document, and map keys equal Activity `_id` values.\n- Duplicate IDs, dangling Effect references, lost mechanics, save-outcome drift, invalid target fields, or profile leakage are blocking errors.\n- `needs_review` and `failed` results do not enter formal single-file output or collection ZIP artifacts.\n- A source-scoped `needs_review`/`failed` result cannot be promoted by editing rendered Markdown or JSON by hand; regenerate from the accepted upstream chain instead.\n\n## Version-Specific Checks\n\nWhen generating for `--fvtt-version 12` or `13`, check:\n\n- Actor, embedded Item, standalone Item, and ActiveEffect `_stats.systemVersion` are dnd5e `4.3.9`.\n- Item activation lives on Activities; legacy Item-level `system.activation` is absent.\n- Uses use `spent`, `max`, and `recovery`; legacy `value` and `per` are absent.\n- The result passed locked 4.3.9 structural assertions. Do not report a Foundry runtime pass unless that exact artifact was imported and exercised in a separately recorded runtime.\n\nWhen generating for `--fvtt-version 14`, also check:\n\n- Actor, embedded Item, and ActiveEffect `_stats` use Foundry `14.364` and dnd5e `5.3.3`.\n- NPC resources use v14/dnd5e 5.x source fields such as `max` and `spent`, not legacy `value`.\n- Senses use `system.attributes.senses.ranges.\u003csense>` plus `special`, not direct legacy sense fields.\n- Item activities carry activation data; item-level `system.activation` is not used as the v14 source of truth.\n- Save activities use `save.dc.calculation` and `save.dc.formula`; `save.dc.value` is prepared by dnd5e and should not be emitted as source data.\n- Uses data omits legacy `value` and `per`; generated source should use `spent`, `max`, and `recovery`.\n- Spell fallback items use `method` and `prepared`, not legacy `preparation.mode`.\n- Active Effect changes target schema-backed v14 fields, for example AC flat/formula fields rather than legacy AC bonus fields.\n- If `--icon-mode safe` was used, every embedded/standalone Item has a catalogued Foundry core or dnd5e path, the adjacent `*.icon-review.json` records the chosen source/confidence/reasons, and fallback decisions remain explicit rather than being reported as semantic matches.\n- Review representative exact mappings and all semantic mappings visually. Confirm close negatives remain on a type default or an explicit reviewed override.\n- Runtime import/readback is a separate gate. State whether the exact project-local Foundry 14.364 runtime was available for this run.\n\nWhen generating for `--fvtt-version 14 --effect-profile modded-v14`, also check:\n\n- The current locked module target is MIDI-QOL `14.0.11` and DAE `14.0.12`. Reports executed against MIDI-QOL `14.0.9` remain historical evidence and do not prove the `14.0.11` runtime.\n- Times Up fields or assumptions are not required for v14 output.\n- Item Macro is not treated as a required dependency unless a v14-verified version is separately documented.\n- `flags.midi-qol.OverTime` is emitted only when the source text explicitly provides a repeated-effect formula and damage type.\n- The OverTime formula comes from the repeated-effect clause, not from an earlier hit or attack damage clause.\n- Any macro-style automation remains guarded and falls back to GM manual handling when MIDI-QOL workflow context is missing.\n\n## Portable Spellcaster Verification\n\nFor an Actor carrying `flags.fvtt-json-generator-spell-resolver.spellManifest`, verify the project artifact before importing it:\n\n- `spellResolution.status` is `pending`; `pending` is the correct portable-project state, not a failed hydration claim.\n- Every manifest ref is backed by an exact source evidence range and retains its source usage, ability, DC, attack bonus, component waiver, and literal restrictions.\n- The Actor contains no placeholder embedded Spell, resolver-managed Cast Activity, local Actor/Item UUID, or destination Compendium UUID.\n- Each manifest group links to exactly one real generated source feature by stable identity rather than item order or translated display name.\n- The Actor was regenerated by the CLI/workflow and checked with the Intake verifier; hand-repairing the Actor invalidates this layer.\n\nThis is the portable/static layer: it proves portability and source fidelity only. It does not prove that any destination-world Spell exists, that hydration occurred, or that any spell can be cast.\n\n## Target-World Resolver Report Verification\n\nAfter ordinary Actor import into the exact supported Foundry/dnd5e runtime, inspect the resolver report:\n\n- The source index includes every enabled and readable Item pack, including packs without a spell-specific manifest hint.\n- All refs resolve before the first write; any missing, ambiguous, contradictory, stale, or undecided manual conflict withholds the whole plan.\n- A matching 2024 candidate wins; a 2014 selection is allowed only when no same-key 2024 candidate exists and is visibly reported as fallback.\n- The hydrated graph contains one native Cast Activity and one native cached Spell for each ref, with exact `cachedFor`, `compendiumSource`, resolver ownership, source feature, and selected UUID linkage.\n- No placeholder, duplicate cache, foreign item adoption, or unrelated Actor/item/activity/effect/flag mutation occurred.\n- Manual Keep, Overwrite, Cancel, close, rollback, and recovery-required outcomes match the report and leave no hidden partial success.\n\nThis is the target-world hydration layer: it proves deterministic destination selection and document construction. It does not substitute for using the native activities.\n\n## Live Native Spell-Use Acceptance\n\nIn the destination world, actually use representative hydrated spells:\n\n- Run an attack workflow and confirm the native roll uses the source attack bonus.\n- Run a save workflow and confirm the native card uses the source DC and ability.\n- Open and cast a utility spell; verify source target restrictions such as self-only.\n- Use a limited spell twice to confirm the first use spends only its own Activity and the second is blocked by native behavior.\n- Use an at-will spell repeatedly and confirm no daily use is spent.\n- Confirm component waivers are represented by native Cast data and literal-only restrictions remain visible without claiming unsupported automation.\n- Disable the resolver after hydration and prove cached Spells still open and cast natively.\n\nThis is the native runtime layer. Portable/static verification, resolver hydration verification, and live-use acceptance are three separate gates. Passing any one of them cannot be used to claim the other two.\n\n## v14 Batch Acceptance\n\nFor project-internal v14 core acceptance without a local Foundry runtime, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --out-dir \"obsidian/dnd数据转fvttjson/output/v14-acceptance\" --report \"docs/acceptance/v14-core-batch-verification.md\"\n```\n\nFor project-internal v14 module-profile acceptance, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --effect-profile modded-v14 --out-dir \"obsidian/dnd数据转fvttjson/output/v14-modded-acceptance\" --report \"docs/acceptance/v14-modded-batch-verification.md\"\n```\n\nThe batch suite must:\n\n- Generate every JSON artifact through the project conversion workflow with `--fvtt-version 14` and `core` semantics.\n- For the modded suite, generate every JSON artifact through the same workflow with `--fvtt-version 14 --effect-profile modded-v14`.\n- Disable optional translation services so acceptance output is source-faithful and not affected by external model behavior.\n- Include a local GoddessFantasy fixture pipeline sample that covers crawl -> records -> plaintext -> actor JSON.\n- Record actorVerification warnings in the report instead of treating schema success as semantic success.\n- Keep live Foundry v14 import as an explicit unresolved runtime check when no local Foundry v14 runtime is available.\n\n## Completion Standard\n\nA generated Actor JSON result is correct only when:\n\n- The project CLI or workflow regenerated the target JSON.\n- The JSON parses.\n- Relevant tests passed, or known baseline failures are explicitly separated from the current change.\n- The source markdown comparison above was completed.\n- Any Foundry, dnd5e, or module-dependent behavior was checked against locked local references for the target version.\n- Any remaining uncertainty is reported with the exact source field, generated field, and reference gap.\n","docs/item-ai-intake-v14.md":"# AI Item Intake: TXT to Foundry V14 Item JSON\n\n## What this path accepts\n\n`--intake-items` is the formal path for a natural-language TXT or irregular Item Markdown. It is intentionally separate from `--ingest-items` and `--ingest-items-json`, which remain strict-format compatibility commands.\n\nThe supported target is exactly Foundry VTT `14.364`, dnd5e `5.3.3`, and effect profile `core`. The command refuses another target or profile before the AI provider is called.\n\n```powershell\nbun run src/index.ts --intake-items \"F:\\source\\item.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n`--dry-run` validates input limits and target selection but does not call a provider or promote files. A run contains at most 50 Item candidates and 200,000 JavaScript UTF-16 characters.\n\n## Acceptance boundary\n\nThe provider returns an evidence-bearing `ItemIntakeIR`, not Foundry JSON. Every candidate field and ability has an exact source range. The project then validates the ranges, claims and candidate boundary, renders an Item Markdown `item-mechanics` YAML contract, invokes the normal Item parser/generator, and verifies the generated JSON field by field.\n\nOnly a fully `accepted` run promotes Markdown to `input/items/` and JSON to `output/items/`. Source text, IR, deterministic diagnostics, provider audit, rendered Markdown and review material stay in `.local/item-intake-runs/\u003crun-id>/`. Candidate JSON is not a formal output and is not offered by the Web job unless the item is accepted.\n\nThe current core contract supports:\n\n- Explicit `AC +N` only: a transfer Active Effect with `system.attributes.ac.formula`, `type: add`, `phase: initial`.\n- A light ability with explicit action, bright radius and dim outer radius: a zero-cost `utility` Activity which applies a non-transfer Actor effect. Disabling or deleting that Actor effect extinguishes the light.\n- Shared Item uses with explicit recovery. `recoverAll` at `dawn` is represented on the Item uses pool. The strict Markdown `item-mechanics` boundary requires a positive integer capacity, supported recovery periods/types, and numeric or simple dice recovery formulas; it rejects misspelled recovery values. Scaled save consumption must be an integer within the pool capacity, with a valid maximum no greater than that capacity.\n- A uniquely resolved spell: a `cast` Activity consuming `itemUses`, with `spellSlot: false`. The submitted identifier and English name must case-insensitively select the same spell in the manifest-pinned dnd5e `5.3.3` source catalog; ambiguous, missing, or mismatched references are rejected and are never changed into Utility Activities.\n\nFor example, the dormant Jewel of Three Prayers contract has AC `+1`, an action to apply `bright: 15` / `dim: 30` light with no charge cost, a three-charge dawn-recovery pool, and a one-charge `Invisibility` cast. `dim: 30` is the outer edge of dim light, not an additional 30 feet after the bright radius.\n\n## Provider configuration and review\n\nItem Intake reuses the existing `MONSTER_INTAKE_*` configuration and `--intake-doctor`; this is shared provider plumbing only. It does not run the Monster IR or compatibility normalizer.\n\n```powershell\nbun run src/index.ts --intake-doctor\n```\n\nIf a run needs decisions, use its bundle rather than editing generated JSON:\n\n```powershell\nbun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" `\n  --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\nFor this first Item contract, the only decision that can be resumed is an explicit `replace` for a `target-conflict:*` promotion finding; the prior files are copied into the run bundle before replacement. Evidence and mechanics findings are intentionally not overrideable by a decisions file: correct the TXT/Markdown and start a new Intake run instead.\n\nThe legacy `--enable-ai-normalize` hook is not Item Intake. It only assists strict project Markdown and, if unavailable or failed, returns no normalized mechanics so the original source is parsed; it can no longer silently manufacture `abilities: []`.\n\n## Runtime status\n\nStatic parser/generator/verifier and CLI/Web isolation tests cover the exact Jewel contract. The Foundry 14.364 local-lab activity lifecycle is a separate acceptance layer: do not promote this path from **Partial** to a runtime **Pass** until import, applied light effect, effect disable/remove, charge exhaustion, no-spell-slot consumption, and dawn recovery have all been observed in a disposable world. No production world is part of this workflow.\n","docs/reviews/2026-09-22-condition-hud-localization.md":"# 状态名称、描述、图标与伤势联动审查\n\n状态：本页保留 2026-09-22 至 23 的过程与当时尚未执行的门禁；不能将本页页内的“待验收”直接读作 2026-09-24 的最新结论。后续采用的现成图标、19 项 HUD 入口与自定义流血验收见[全量审计](2026-09-24-all-custom-condition-hud-audit.md)，恍惚／震愕三选一规则及 CoTN 定向玩法见[后续验收](2026-09-24-dazed-three-choice-rule.md)。目标仍是 Foundry 14.364 / dnd5e 5.3.3、server-mirror 的 CoTN 原模组组合。\n\n## 2026-09-23 浏览器回传与剩余工作\n\n当前总结果为 **PARTIAL**，不覆盖下面列明的未执行项。外部 Chrome 回传确认：中文名称、描述与图标资源路径可见；伤势管理器 0→1→2→1 通过；内部来源和外部 Trigger Engine 下的真实 HP 10→0→1 均显示伤势 1/3；TAH full/nameOnly/none 的 DOM 提示内容符合设置。实际鼠标悬停弹层未执行，不能把 DOM 内容当作弹层视觉接受。英文切换与明确死亡后的仪式邀请仍未执行。图标美术已被用户否决，当前只审一张 Addled 样稿，不扩展、不安装该样稿。\n\n启用清单回传为 77 项；子任务曾把初次读回缺失的 `3ds-atlas`、`calendaria` 按较早原组合补回，不能将本轮描述为完全没有模块开关操作。需要以完整前后 ID 清单复核，不只比较数量。\n\nHP 连续更新期间出现 `dnd5ebloodied000` 重复 ActiveEffect ID 警告，仍待区分原生异步状态更新、测试操作节奏与模块联动的影响，不据此直接归因为 Custom Conditions 或伤势模块缺陷。\n\n中断时未清理的本轮对象：Actor `RiuDjZpb8JA6UDAq`、Scene `pDMFZGrI38lU282e`（Token `ZbpEOm9LB4S3aukF`）、Macro `MxFIIMTrjS5jtdM2`。场景和 IFS 来源未恢复；原始 UI 记录确认来源为 internal，enabled=true、resurrectionPrompt=true、manageNpcs=false，原场景为 landing page。后续只清理这些本轮 exact IDs 及明确新建对象。\n\n主任务确认系统于 2026-09-23 07:37 重启，不能从浏览器标签回收与服务消失的先后推断因果。原 30001 无监听后按既有授权恢复，07:49 核对 PID29200、127.0.0.1:30001、cor-cotn、14.364/5.3.3 正常。没有操作 serverNext。服务恢复证据位于本地 `evidence/condition-hud-20260923/service-recovery/`；UI 原始回传位于 `evidence/condition-hud-20260922/chrome/`。\n\n视觉修订：用户否决了首版 Luna 绘制的 SVG，认为造型过于简陋；此前 32px 可读性检查不能代表美术风格获得接受。用户明确指定 **Astra / medium** 重画，本轮以 dnd5e 原生图标为参照，重新检查白色剪影、负形、视觉重量和语义辨识。语言及伤势功能验收继续，图标美术结论单独重验。\n\nAstra / medium 已完成 19 张状态与 4 张伤势 SVG 重绘。主任务审阅代表样稿后要求消除“无助”中类似医疗十字的造型，最终整套已通过 32px／64px 联系表检查；23 张 XML／栅格化、唯一内容、精确文件集合与透明背景检查通过。这是新候选的资产检查，用户美术意见和真实 HUD 展示仍独立记录。预览与校验记录位于本地 `evidence/condition-hud-20260922/astra-icons/`。\n\n## 定位结论\n\n1. Custom Conditions 原注册只提供英文 `name` 和复用的系统图标，管理器直接使用共享契约中的英文 label；没有完整的界面语言展示层。\n2. 伤势原注册 `name=IFS.Status.Injury`，但已安装 Token Action HUD dnd5e 2.1.0 的状态构建读取 `game.i18n.localize(status.label) ?? status.name`，不会保证对 name 再做一次翻译。\n3. 同版本 HUD 的状态 tooltip 读取 `CONFIG.DND5E.conditionTypes[id].reference` 并加载系统规则文档。简单地为自定义状态加 `description` 并不能让这个 HUD 显示规则。\n4. Token Action HUD Core 2.1.1 提供 `tokenActionHudCorePreRender(hud, hudManager)` 扩展 Hook。可以仅装饰本模块拥有的 action，无须修改 HUD 源码或创建假规则文档引用。原生同 ID 状态保留原系统展示和规则。\n\n## 数据来源\n\n- 用户提供的两张 Token Action HUD 截图（2026-09-22）。\n- 仓库 Custom Conditions 的 `src/runtime.ts`、`src/manager.ts`、语言文件和共享 `packages/contracts/src/conditions.ts`。\n- 仓库 Injury & Fading Spirits 的 `src/projection.ts`、`src/runtime.ts` 及模块边界说明。\n- server-mirror 已安装 Token Action HUD dnd5e **2.1.0**：`scripts/token-action-hud-dnd5e.min.js` 的状态构建与 tooltip 路径。\n- server-mirror 已安装 Token Action HUD Core **2.1.1**：`dist/token-action-hud-core.min.mjs` 的 `tokenActionHudCorePreRender`。\n- server-mirror 精确 dnd5e **5.3.3** 与 Foundry **14.364**，不据最新版 API 推断行为。\n\n## 采用的职责划分\n\n用户确认采用：统一名称、说明、独立图标和 Custom Conditions 管理入口；伤势层数及复活历史仍以伤势模块 Actor flags 为唯一事实。复用已授权的旧伤势 HP 桥接，内部／外部来源互斥。Trigger Engine 的死亡事件提示仅邀请活动 GM 打开仪式，不能将 HP 归零当作已死亡，不能自动掷骰或代替裁定。\n\n## 待验收\n\n已完成的离线证据：Custom Conditions 的模块测试 **39 PASS / 0 FAIL / 198 assertions**，模块类型检查与构建通过。覆盖语言回退、原生状态归属、HUD 提示偏好和转义、可选伤势 API、快速加减的顺序处理及失败后队列恢复。19 张状态 SVG 与 4 张伤势 SVG 已解析并渲染 32px／64px 联系表；修正了低对比的定身等图标。以上不替代真实 HUD 的悬停与视觉验收。\n\n本轮审核发现并要求修正：对话框等待占用事件队列、关闭自动化后的提醒门禁、设置变更重新订阅、未生效死亡效果误判、缺少 revision 的重复 HP 转移，以及伤势管理器快速点击丢失层数。这些意见已通过代码复审闭环。伤势最终测试为 **77 PASS / 0 FAIL / 459 assertions**，模块类型检查与构建通过，包含延迟提示标记和 HP 恢复交错的回归。真实浏览器验收仍待执行。\n\n- [ ] 中文和英文名称／完整描述，HUD 悬停显示以及 `none` / `nameOnly` 偏好。\n- [ ] 独立 SVG 在 32px 状态栏及伤势层数图标下可辨。\n- [ ] 原生同 ID 状态未被覆盖，用户自定义名称未改写。\n- [ ] 伤势管理器通过公开 API 调整层数；关闭可选模块时入口安全隐藏。\n- [ ] 内外 HP 事件来源互斥与重复事件保护。\n- [ ] 明确死亡后只提醒活动 GM，取消提醒不改变仪式历史。\n- [ ] 原 CoTN 组合、精确临时对象清理和最终查看页。\n\n## 待判断本地化与新候选复查\n\n本次不引入新的第三方模块。截图中 `MonksLittleDetails.Status.*` 属于另一模块的翻译问题，未扩大为本次代码修复。若后续要求处理，先核对实际安装版本、语言包覆盖顺序与 key 是否缺失，再在 `docs/acceptance/foundry-v14-module-health.md` 使用相同状态口径记录；在实际 UI 验证前不能记为可用。\n\n## 候选安装\n\n已更新 server-mirror 两个本模块的静态文件，manifest 保持一致，无服务重启。安装前后清单与 SHA-256 位于本地 evidence/condition-hud-20260922。首次字节校验因 Bun 在不同 cwd 下生成的源码路径注释不同而失败；对照仅有注释路径差异后，统一使用仓库根 build 入口重建并更新，两个 verify-install 均通过。Custom Conditions 27 文件、伤势模块 10 文件。未触碰第三方模块、serverNext 或生产。\n\n伤势最终 **77 PASS / 0 FAIL / 459 assertions**，包含共享 Actor 状态队列、局部提示标记写入和交错恢复回归；先前审查意见均已闭环。手册 build/check 通过（28 项）。浏览器实测另行回传，不能把 installed bytes 验证当作运行时通过。\n\n收尾补录（2026-09-23）：服务恢复后，子任务已通过UI清理上述exact IDs，恢复landing page、暂停状态、IFS internal及原设置，留在CC Manager。主任务对比完整ID清单，77项与最早75项加CC/TE一致。bloodied警告的静态追踪支持dnd5e原生异步创建重入假设（连续await actor.update不保证派生效果已完成），尚无隔离复现，不能归为已修复。英文切换、真实悬停弹层和仪式邀请仍未完成。用户目前禁止画SVG，改为先审现成资源；候选见2026-09-23-existing-condition-icons.md，未经确认不替换。\n","docs/reviews/2026-09-23-condition-tooltip-native-layout.md":"# CoTN 自定义状态与伤势悬停卡视觉对齐\n\n日期：2026-09-23。目标环境：server-mirror 的 `cor-cotn`，Foundry 14.364 / dnd5e 5.3.3，Token Action HUD Core 2.1.1 / DnD5e 2.1.0。\n\n## 截图问题与分层结论\n\n用户对照的原生“受擒 Grappled”悬停卡是浅色规则卡：标题靠左、状态类别在右、正文在下。此前 Custom Conditions“无助”卡则是黑色效果面板，64px 图标居中、标题下移，底部重复“无助”，正文夹有未译的 `Critical Hit`。**这项视觉效果在此前组合验收中没有通过**；名称/描述存在和 DOM tooltip 配置通过，不能代替规则卡外观验收。\n\n本地精确版本的 dnd5e 模板 `Data/systems/dnd5e/templates/journal/page-rule-tooltip.hbs` 使用 `content → header(h2 + pill.condition) → description`。同版本 `dnd5e.css` 的 `.effect-tooltip` 将提示框固定为300px、图标64px且居中；`.rule-tooltip` 则限制最大450px并分开左右标题/类别。TAH DnD5e 对有规则文档引用的原生状态使用 `rule-tooltip`；本模块没有伪造系统规则文档，而是在已有 `tokenActionHudCorePreRender` 扩展入口中提供自有说明。\n\nFoundry 14 的 TooltipManager 默认添加 `theme-dark`，原生 dnd5e 富提示渲染另行移除该类。本模块直接提供 HTML，追加 `theme-light` 不保证清掉黑底。因此两个模块各自使用限于自有 tooltip 标记类的纸纹、金色边框和深色文字变量；不修改 Foundry、dnd5e 或第三方 TAH 的源码和全局样式。\n\n## 候选变更与权限边界\n\nCustom Conditions 的完整提示改为同一规则卡结构：中英双语标题（仅翻译不同的语言下并列）、本地化状态类别、已转义正文及可选骰式。提示框内不再重复状态名或放大状态图标；图标仍显示在 HUD 按钮。中文说明中的 `Action`、`Bonus Action`、`Reaction`、`Critical Hit`、`Speed`、`weapon attack` 改用与本地 dnd5e 中文术语一致的表达，保持原规则含义。伤势模块的完整提示采用相同标题/类别/正文结构；原有伤势层数事实和 HUD 角标不变。两模块仍尊重 TAH 的 `full`、`nameOnly`、`none` 设置。\n\n候选只修改当前开发 worktree 中的两个自有模块、各自聚焦测试及同步文档。本地 `cor-cotn` 的运行中世界 LevelDB、真实角色、其他模组、serverNext 30002 和生产均不属于此视觉修订的改动范围。现成 SVG 的选型、许可与包内署名见 [现成状态图标选型](2026-09-23-existing-condition-icons.md)，这次没有新绘制或替换图标。\n\n## 验收状态与复查\n\n聚焦测试已核对规则卡类与层级、无提示框大图标/重复名称、中文及英文、HTML 转义、骰式与角标、三个 tooltip 模式。Custom Conditions **56 PASS / 0 FAIL**，伤势模块 **81 PASS / 0 FAIL**；模块类型检查、两个模块构建及 `git diff --check` 通过。Astra 只读复审指出残留 `theme-dark` 会使状态 pill 成为深底深字；已在 Custom Conditions 的专属 marker CSS 中补浅色卡底与 pill 边框变量，复查后无剩余源码阻断项。这些结果不替代真实视觉。\n\n安装前再次核对30001 PID32196、`--dataPath=F:\\FoundryLab\\foundry-v14\\data\\server-mirror`、`cor-cotn`、Foundry14.364/dnd5e5.3.3及独立30002。按相同 manifest 和逐文件哈希，仅更新两个自有模块：Custom Conditions的 `lang/zh-CN.json`、`scripts/index.js`、`styles/custom-conditions.css`；伤势模块的 `scripts/index.js`、`styles/module.css`。预览和前后SHA-256见 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/update-preview.json` 与 `update-verified.json`。两个 `verify-install` 均通过；30001仍常驻CoTN，没有改LevelDB、重启服务、创建备份或触碰30002。\n\n两次独立 Chrome 预检因服务短时离线和连接状态变化未执行视觉项，原始阻塞记录保留在 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/`。主任务核对数据目录没有活进程或监听后，以原 Node24.17.0、Foundry14.364和连续的`--dataPath=F:\\FoundryLab\\foundry-v14\\data\\server-mirror`恢复常驻30001；启动及校验见同目录 `service-recovery-20260923-145202/launch.json`、`verified.json`。没有触碰30002。\n\n恢复后的 GPT-6 Luna 独立 Chrome 任务在真实CoTN的77项启用模组组合中完成**视觉 PASS_WITH_LIMITS**。原生 Grappled、自定义 Helpless、伤势三张卡均是浅色纸纹、左标题右状态标签、深色正文、2px金边，且提示框内图标数均为0。三者的背景为`rgb(241,235,232)`并加载dnd5e的`texture-gray1.webp`/`texture-gray2.webp`；正文为`rgb(25,24,19)`，正文对纸张计算对比度15.06:1，标签文字对底色16.25:1。Helpless显示“无助 Helpless”与“任何命中你的攻击均视为重击。”，不再夹原来的`Critical Hit`。首轮伤势卡正文仍含`episode`，这是随后单独处理的中文文案缺口，不能把首轮截图说成已汉化。完整/仅名称/无提示三档经UI切换并恢复`full/1500ms`；伤势2/3、Jinxed4、Valor6角标在实际HUD仍可见。测试Actor`ZKA7fkMG357hnKZa`及Token`K79FBgnaaMoKKejT`已通过Foundry UI清理，返回暂停的`landing page`；30001保持常驻，中文与IFS internal/已启用/复活提示开/管理NPC关及77项组合保留。\n\n证据文件：`F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/recovered-visual-20260923-154230.md`及同名JSON。截图仅在外部Chrome任务的CUA会话内联，工具没有提供本地截图保存接口；报告保留了DOM类名、计算样式、尺寸、文本和清理ID。纯移动鼠标、不点击的独立悬停动作仍是 **NOT_EXECUTED**；该工具没有单独的pointer-move操作，点击后指针停留产生的可见规则卡作为视觉证据单独记录。\n\n中文文案收尾：仅将伤势状态说明中的两处 `episode` 译为“伤势过程/这一过程”，不改变状态机或其他文字。伤势模块聚焦测试现为 **82 PASS / 0 FAIL**，含读取真实中文语言包并检查触发与恢复语义的回归；类型检查和构建通过。确认server-mirror仍是PID13956/CoTN后，只更新伤势模块 `lang/zh-CN.json`，Custom Conditions逐文件哈希不变；预览与前后哈希见 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/injury-copy-20260923-154723/update-preview.json` 和 `update-verified.json`，两模块 `verify-install` 均通过。后续同一GPT-6 Luna外部Chrome任务重载CoTN，在真实TAH伤势动作的完整 tooltip payload 中读到“开启一次伤势过程；在这一过程中恢复到正生命值会增加1层伤势”、类别“状态”和0/3角标，没有`episode`；服务、中文、77项组合、IFS internal及TAH full/1500ms保持，页面留在暂停的`landing page`。证据为 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/injury-copy-followup-20260923-160015.md` 及同名JSON。此次窄范围文案读回没有新拍悬停卡截图，纸纹外观仍依据前一轮真实视觉证据，不能把DOM payload读回当成一张新的视觉截图。\n\n新候选复查：先核对锁定版本的系统模板、CSS、TooltipManager 与 TAH 扩展接口；若系统升级，重新比较真实渲染和类名，不能凭当前版本的静态检查推断兼容。本文不评价新的第三方模块或本地化候选；模块健康状态继续以 `docs/acceptance/foundry-v14-module-health.md` 的实际运行证据为准。\n","docs/reviews/2026-09-23-cotn-burning-hud.md":"# CoTN 中 Token Action HUD 的 Burning 显示核查\n\n> 2026-09-24 勘误：本页记录的是 **dnd5e 原生 `burning`** 的历史现场核查。用户所说的「自定义 Burning 没有 HUD 入口」指带骰式和伤害类型的 Custom Conditions Burning；原生按钮可见并未解决该问题。新候选设计见[自定义 Burning HUD 记录](2026-09-24-custom-burning-hud.md)。以下 PASS 仅属于原生按钮，不能用于新入口的视觉或功能验收。\n\n日期：2026-09-23。目标：server-mirror 的 `cor-cotn`「溟渊的呼唤」，Foundry 14.364 / dnd5e 5.3.3，端口 30001。证据为独立外部 Chrome 任务的现场记录：`F:/FoundryLab/foundry-v14/evidence/condition-burning-hud-20260923/chrome/report.md`、`dom-observations.json`；截图保存在该任务的 CUA 记录中，未导出成单独 PNG。\n\n## 结论与操作\n\n所选 Token「卡勒姆·维雷」的 Token Action HUD **有原生** Burning 按钮。鼠标离开 HUD 时动作区隐藏；在 HUD 上打开「效应」组后，系统状态子组中可见唯一 `actionId=burning`、名称「燃烧」的按钮。检查时它没有隐藏祖先、未被视口裁切，页面保留「效应」展开状态供人工查看。这项观察只说明原生按钮在该 Token 上存在；不能由此推断用户要找的参数化「灼烧」入口已经存在。\n\n该按钮的图标是 dnd5e 的 `systems/dnd5e/icons/svg/statuses/burning.svg`，tooltip 指向 dnd5e Compendium 规则项。这是原生 Burning 控件；点它不能等同于施加带骰式和伤害类型参数的 Custom Conditions Burning 实例。后者仍须通过本模块管理器或其公开 API 操作。\n\n## 已执行与边界\n\n- **PASS**：浏览器当前为 Gamemaster，30001 指向预期 `server-mirror`、`cor-cotn`；`/api/status` 报告 Foundry 14.364、dnd5e 5.3.3。Token Action HUD Core manifest 为 2.1.1。\n- **PASS**：所选 Token 的「效应」组内有唯一 Burning 按钮，按钮启用且完整落在当前视口内；打开该组后可见。\n- **NOT_EXECUTED**：没有点击 Burning、施加状态或测试结算与重载持久性；没有修改 Actor、Token、布局或模块配置。\n- **NOT_EXECUTED**：浏览器只读 evaluator 不能访问实时 `window.game`、`CONFIG`、`localStorage`，因此未直接读到 `CONFIG.statusEffects` 归属或该用户持久化的 TAH `userSelected` 字段。已渲染的按钮只证明这个 Token 当前有效 HUD 布局包含 Burning，不证明其他 Token 的布局相同。\n- **NOT_EXECUTED**：已有 Gamemaster 会话，无需重新走 `/join` 登录。没有触碰 30002。\n\n若另一个 Token 在已展开的「效应」组里仍缺 Burning，应先检查那个 Actor 的 TAH 布局项 `burning`；不要把本例推论成所有 Token 均正常，也不要为单个布局缺项改变状态所有权或全局冲突逻辑。\n\n## 再次定位给用户查看\n\n同日另一轮外部 Chrome 在现有 Token「秋」上再次找到原生「燃烧」按钮。选中 Token 后打开 Token Action HUD 的「效应」组，在「状态」网格第二行，它位于「目盲」右侧、「魅惑」左侧；没有点击或施加该状态。页面最终停在这一展开位置，30001 仍为 `cor-cotn`，77 个启用模组的数量未变。\n\n原始 CUA 截图已从该轮完成的任务记录中按原字节提取为 `F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260923/chrome-frozen-followup/burning-hud-final.jpg`，来源行号、SHA-256 和未修改字节的记录见同目录 `screenshot-provenance.json`。这张图证明所选 Token 的原生按钮可见，不证明自定义 Burning 的参数化 HUD 入口存在。用户要求不重复做已测功能，因此本轮只展示 HUD；Frozen 五段新版提示在这轮 Chrome 工具中没有可靠悬停/DOM 读取路径，仍标为 **NOT_EXECUTED**，不借静态测试冒充视觉通过。\n","docs/reviews/2026-09-23-drakkenheim-condition-wording.md":"# Drakkenheim 自定义状态文案核对（2026-09-23）\n\n> 后续变更：2026-09-24 起，本项目按用户决定把自定义 Dazed 改为「自主移动／动作／附赠动作三选一」，Shocked 继承该规则。本页记录的是当时的 Beta 文本与旧实现对照；当前规则和验收以[三选一变更记录](2026-09-24-dazed-three-choice-rule.md)为准。\n\n## 证据范围\n\n[D&D Beyond 的《Monsters of Drakkenheim》目录](https://www.dndbeyond.com/sources/dnd/modr)确认正式书的 Appendix C 含有 Conditions，但公开目录不提供该章逐条规则全文。本轮可逐字核对的条件规则来自[公开流传的 Beta 文本](https://www.scribd.com/document/873137275/Drakkenheim-Monsters-of-Drakkenheim-Beta)。因此下述 Frozen、Shocked、Valor 等措辞是对 **Beta 规则与本项目既有实现**的说明修订，不宣称已与正式版 Appendix C 全文逐条核对。将来取得正式正文后，应复核并修订差异。\n\n## 本轮判断\n\n| 条目 | 文案决策 | 边界 |\n| --- | --- | --- |\n| Shocked | 中文工作名改为「震愕」。复合效果直接写出 Dazed 的移动或动作二选一、不可使用附赠动作，Defenseless 的受攻击优势，以及掉落手持物品、拿取／拔出／收起物品各需动作。 | 「电击」容易误导为只由闪电伤害造成。Beta 的状态定义描述行为与防御损失，并非一种伤害类型；「震愕」是项目的语义翻译，不声称为官方中文译名。 |\n| Frozen | 直接写出 Immobilized 的速度 0、无速度加值及飞行坠落，Defenseless 的受攻击优势。重击限于**使用造成钝击伤害的武器**攻击冻结目标而命中的情况。 | “造成钝击伤害”单独不足以触发该重击条款，法术和徒手攻击不能只因伤害类型是钝击就算在内。另可通过标注 DC 的力量（运动）检定或达到该实例累计钝击／火焰伤害阈值解除；阈值默认 20，但可由实例参数修改。后一个解除途径不要求伤害来自武器。 |\n| Valor [X] | 与 Jinxed [X] 采用对称句式：攻击检定或豁免检定时额外掷 X，并将结果**加**到检定结果。 | X 保留实例骰式，不在状态文案写死 1d4。 |\n| Weakened | 写明武器攻击或法术伤害**总值**减半，结果向下取整。 | [2024 基本规则的 Round Down 条目](https://www.dndbeyond.com/sources/dnd/br-2024/rules-glossary)规定除乘后得到小数时向下取整。本轮只修正文案；运行时核对由本任务其他分支完成。 |\n| Dazed | HUD 的状态标题只显示「恍惚」或 Dazed；内部状态 ID 仍为 `fvtt-custom-conditions.dazed`。 | 不借可见后缀区分另一模组的裸 `dazed`，由 ID 区分。 |\n| Staggered | 文字改为自己的回合最多进行一次**武器或徒手攻击**；运行时按 dnd5e Attack Activity 的 `attack.type.classification` 统计已完成的攻击骰，并在活动使用及攻击骰预处理两个入口拦截下一次。 | 此项是用户要求的项目扩展，超出已可核对的 Beta 原文（仅 weapon attack）。锁定的 dnd5e 5.3.3 源码 `module/data/activity/attack-data.mjs` 与夹具 `packs/_source/equipment24/weapons/unarmed-strike.yml` 将 `unarmed` 和 `weapon` 分类区分；非攻击活动和 `spell` 分类不计。持久计数字段沿用 `weaponAttacks`，不迁移旧回合状态。 |\n\n[2024 基本规则](https://www.dndbeyond.com/sources/dnd/br-2024/rules-glossary)将武器和徒手打击分别列出，徒手打击条目明确以“不使用武器”描述。对于被规则明确指定为武器的天生武器，[官方 Sage Advice Compendium](https://www.dndbeyond.com/sources/dnd/sac/sage-advice-compendium)则将其视为武器。这解决了 Frozen 文字上的边界；Foundry 具体活动是否能被识别为武器，仍需针对目标 dnd5e 版本的活动数据单独验收，不能仅凭文案断言自动覆盖所有天生武器。\n\n## 后续复核\n\n1. 取得正式版 Appendix C 后，对照 Frozen、Shocked、Valor、Weakened 的原文及解除条款，更新本表和模块文案。\n2. 如目标世界将天生武器表示为非 `weapon` 类型的 Foundry Item，测试 Frozen 自动判定是否遗漏；此项属于运行规则核对，不通过扩大文案范围来掩盖。\n3. 在 CoTN 的实际 Token Action HUD 核查中英文切换、状态标题和换段；静态测试不等于浏览器视觉验收。\n","docs/reviews/2026-09-23-existing-condition-icons.md":"# 现成状态图标选型：已确认用于本地候选\n\n日期：2026-09-23。状态：用户确认采用20项现成SVG；初选已完成一次server-mirror安装与HUD复验。随后用户又确认笨拙改用 Drop Weapon、踉跄改用原笨拙的 Foot Trip；下表记录最新仓库候选映射，新映射的安装与浏览器结果须另行核对，不能沿用初选的验收。\n\n## 权限与结论\n\n用户明确禁止继续绘制SVG，并要求所有新增状态改找现成图标；先展示候选，随后明确回复“就用那个吧”，同意采用此前展示的20项。用户再看过笨拙候选的HUD尺寸预览后，明确选择 [skoll/drop-weapon](https://game-icons.net/1x1/skoll/drop-weapon.html)；踉跄按其要求接收原笨拙的 [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html)。19种Custom Conditions状态加伤势共20项，全部来自Game-icons.net；保持该库白色剪影语言。伤势1–3层共用同一原始图形，层数由HUD文字角标呈现，不自行绘制分层SVG。\n\n## 来源与验证\n\n通过AnySearch发现官方状态目录、关于页和GitHub官方仓库；随后逐页核对图标作者及CC BY 3.0链接，从每页实际列出的透明SVG下载链接保存原文件。没有描摹、修改path、组合图形或将位图转为SVG。\n\n- 官方状态目录：https://game-icons.net/tags/state.html\n- 官方许可及作者说明：https://game-icons.net/about.html\n- 官方仓库：https://github.com/game-icons/icons\n- 初筛仓库树：82d948812bfe3f269ef8f731dcdb07b08160edc4\n- 本地候选：F:/FoundryLab/foundry-v14/evidence/condition-icons-sourced-20260923/\n- 笨拙二次候选与HUD尺寸预览：F:/FoundryLab/foundry-v14/evidence/clumsy-icon-candidates-20260923/\n- selection.json记录当时20项实际下载地址、作者、许可、SHA-256及采集时的待确认状态；该原始采集记录不作为当前授权状态，用户随后已确认采用。\n- 模块内 `CREDITS.md` 随构建包一起提供逐项作者、作品、来源、原始SVG哈希及CC BY 3.0许可链接；原SVG字节未编辑，仅更名为模块内文件名。\n\n## 状态映射\n\n| 状态 | 候选 | 理由 |\n|---|---|---|\n| 心智混乱 / addled | [delapouite/brain-leak](https://game-icons.net/1x1/delapouite/brain-leak.html) | 脑力流失，表达心智受损 |\n| 迷乱 / bewildered | [lorc/uncertainty](https://game-icons.net/1x1/lorc/uncertainty.html) | 问号与回转，表达困惑 |\n| 流血 / bleeding | [lorc/bleeding-wound](https://game-icons.net/1x1/lorc/bleeding-wound.html) | 伤口滴血 |\n| 燃烧 / burning | [lorc/small-fire](https://game-icons.net/1x1/lorc/small-fire.html) | 完整火焰轮廓 |\n| 笨拙 / clumsy | [skoll/drop-weapon](https://game-icons.net/1x1/skoll/drop-weapon.html) | 手中武器脱落，表达动作失准；用户在HUD尺寸预览后确认 |\n| 恍惚 / dazed | [delapouite/knocked-out-stars](https://game-icons.net/1x1/delapouite/knocked-out-stars.html) | 眩晕星环 |\n| 无防备 / defenseless | [lorc/cracked-shield](https://game-icons.net/1x1/lorc/cracked-shield.html) | 裂开的防御盾牌 |\n| 分心 / distracted | [darkzaitzev/distraction](https://game-icons.net/1x1/darkzaitzev/distraction.html) | 人物被旁侧动静吸引 |\n| 衰弱 / enfeebled | [lorc/oppression](https://game-icons.net/1x1/lorc/oppression.html) | 受压蜷身，表示力量受到压制 |\n| 冻结 / frozen | [delapouite/frozen-body](https://game-icons.net/1x1/delapouite/frozen-body.html) | 被冻住的人体 |\n| 无助 / helpless | [delapouite/human-target](https://game-icons.net/1x1/delapouite/human-target.html) | 人体成为靶标，表达易受致命打击 |\n| 定身 / immobilized | [skoll/cement-shoes](https://game-icons.net/1x1/skoll/cement-shoes.html) | 双脚被固定的人体 |\n| 厄运 / jinxed | [lorc/cursed-star](https://game-icons.net/1x1/lorc/cursed-star.html) | 诅咒符号 |\n| 震愕 / shocked | [lorc/lightning-mask](https://game-icons.net/1x1/lorc/lightning-mask.html) | 受冲击的脸；图形含闪电，但状态规则不限定电击来源 |\n| 病弱 / sickened | [lorc/vomiting](https://game-icons.net/1x1/lorc/vomiting.html) | 恶心呕吐 |\n| 减速 / slowed | [lorc/snail](https://game-icons.net/1x1/lorc/snail.html) | 蜗牛，表达移动缓慢 |\n| 踉跄 / staggered | [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html) | 脚步绊住，表达踉跄；原笨拙图标按用户要求转用 |\n| 英勇 / valor | [lorc/winged-sword](https://game-icons.net/1x1/lorc/winged-sword.html) | 翼剑，表达勇气与增益 |\n| 虚弱 / weakened | [lorc/sword-break](https://game-icons.net/1x1/lorc/sword-break.html) | 破裂武器，表达伤害降低 |\n| 伤势 / injury | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | 包扎的人体 |\n\n## 尚待判断\n\n候选图形只表达状态概念，不改变规则。衰弱、无助和踉跄采用身体受压、人体靶标和脚步失稳作比喻；新笨拙/踉跄搭配仍须在实际HUD里核对清晰度。Dazed在CoTN有其他模组的同名状态，但自定义项以独立ID显示；不把换图当作同名状态的修复。Shocked 的 Lightning Mask 图形仍带闪电，不能据此把规则解释为仅由闪电伤害造成。\n\n## 本地候选安装与边界\n\n在确认30001仍为常驻的Foundry14.364/dnd5e5.3.3、`cor-cotn`、精确`server-mirror`数据目录后，先比较两个模块构建包与安装目录的manifest及逐文件SHA-256，再仅覆盖两个自有模块的静态文件；没有停服、重启、创建备份、改写世界LevelDB或触碰30002。安装预览与前后逐文件哈希记录在 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/update-preview.json` 和 `update-verified.json`。Custom Conditions由27增至28个文件，伤势模块由10增至11个文件，新增文件均为各自的`CREDITS.md`；安装后两个`verify-install`均通过，30001 `/api/status`仍是`cor-cotn`。\n\n首次安装前通过的离线检查包括Custom Conditions 48项测试、伤势80项测试、生成器Dazed投影聚焦测试91项、模块与包类型检查、架构依赖检查、两个模块构建、`handbook:check`。这些只证明当时的候选实现和安装字节；后续浏览器结果如下，不能把未执行项算作通过。\n\n## CoTN 外部 Chrome 回传与后续修复\n\n2026-09-23 在真实 `cor-cotn` 世界、77个原有启用项组合中，Chrome可见裸 `Dazed` 使用外部 `mcdm-flee-mortals-where-evil-lives` 图标，自定义“恍惚（自定义状态）”使用 `fvtt-custom-conditions.dazed` 和本模块图标；两者分立显示。自定义 Dazed 在测试 Actor 上点击启用、停用、再启用均通过。伤势管理器可见 `0/3→1/3→2/3→3/3`，然后按原路清回0/3。测试 Actor `FqqsDQZD62UnAQlp`、Scene `aKL3Db4ksES2rOfr` 及该 Scene 内 Token 已通过 UI 清理，返回 `landing page`、暂停状态和 IFS internal 基线；页面留在 Custom Conditions Manager。浏览器证据：`F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome/readback.json` 与 `report.md`。\n\n同轮发现 **FAIL**：经 TAH 激活 Shocked 后，`shocked` 高亮，但 namespaced Dazed 与 Defenseless 没有高亮。精确安装的 TAH DnD5e 2.1.0 构建器按 Actor ActiveEffect `statuses` 判定高亮；其默认点击调用 `actor.toggleStatusEffect()`。原模块只截获自定义 Dazed，因此 TAH 的 Shocked 点击可能生成无 Custom Conditions flags 的普通效果，绕过复合规则。Chrome隔离环境没有开放直接读取 `game/CONFIG/canvas`，实际 ActiveEffect flags 未从浏览器直接读回；该机制是与实测相符的源码解释，不伪称已取得 flags 证据。\n\n已在候选代码中补 Shocked 的自有 TAH 点击桥接：通过 Custom Conditions 公开 API 施加、停用、再启用，仅截获模块自有状态；测试精确断言 `shocked`、`fvtt-custom-conditions.dazed`、`defenseless` 三个投影状态和 CC flag。独立审查发现快速双击时两次读取旧状态的竞态，已将同一 Actor/状态的完整“读取→判断→写入”串行，并以延迟写入测试覆盖 Dazed、Shocked 双击。修复后 Custom Conditions 聚焦测试 **51 PASS / 0 FAIL**、模块类型检查与构建通过。复查确认普通 TAH 连续点击使用相同 Actor Document 对象；不同包装对象代表同 UUID 的并发路径仍是单独限制。\n\n仅更新本地server-mirror的Custom Conditions三个静态文件（英中语言包与`index.js`），伤势模块逐文件哈希保持一致；二次更新的预览、前后哈希位于 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/shocked-update-preview.json`、`shocked-update-before.json`、`shocked-update-verified.json`。安装后Custom Conditions `verify-install`通过，30001仍为`cor-cotn`。\n\n随后新建的GPT-6 Luna独立Chrome任务初次因旧GM页面占用而未进入世界，保留阻塞记录于 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome-gpt6/preflight-report.md`。用户关闭旧页后，同任务以正常Gamemaster空密码进入CoTN；第二轮报告在同目录 `e2e-round2-results.md`、`e2e-round2-ui-evidence.md`、`e2e-round2-fixture-ids.json`。**PASS**：修复版经TAH点击Shocked后，Shocked、Custom Dazed、Defenseless同时高亮；同一实例第二次停用、第三次启用，重载后仍在，Manager应用路径与TAH投影一致。伤势的TAH角标已直接显示0/3到3/3；英文界面与恢复中文、tooltip none与恢复full、20项已选图标的基本加载/区分均经可见界面核对。保留77项启用组合，清理本轮确切Actor `IFp6dPk7Mi1Dv2Rm`、Scene `p5bIJYFydh18NPia`及随Scene删除的Token `zGZAk1lYXAGukOw7`，服务常驻，页面留在landing page。\n\n**首轮 FAIL、修复后 PASS**：已启用Jinxed 1d6和Valor 1d4的TAH项最初没有显示6、4角标；同Token编辑Jinxed为1d4后也没有角标变化。精确安装的TAH Core 2.1.1会将不存在的`info1`标准化为`{}`，旧候选使用`!action.info1`判断空位，导致角标写入被跳过；浏览器观察与这一源码路径吻合。修复为空对象可填、保留非空外来角标、按选中Token Actor重算后，Custom Conditions **53 PASS / 0 FAIL**、Foundry模块类型检查与构建通过。本地server-mirror只更新Custom Conditions的`scripts/index.js`，伤势模块字节未变；预览、前后哈希见 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/dice-update-preview.json`、`dice-update-before.json`、`dice-update-verified.json`，`verify-install`通过。GPT-6 Chrome第三轮复验在同一Token `D80y8l8LGjPqu10f` 上看到Jinxed `1d6→6`、Valor `1d4→4`，不重选Token把Jinxed改为1d4后立即显示4；重载后两者均显示4。tooltip none无额外浮层，已恢复full/1500ms。证据见 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome-gpt6/e2e-round3-results.md` 和 `e2e-round3-ui-evidence.md`。\n\n第三轮临时Scene `Ao05kezR2WPlpNrh`、Actor `FSACXe155rsougRI` 与两个Token `eqHVDVV8AR11LZux`、`D80y8l8LGjPqu10f` 的exact IDs记录于同目录 `e2e-round3-fixture-ids.json`。浏览器任务起初在Foundry永久删除确认对话框前暂停；主任务按本轮既有授权核对ID/归属后通知继续。任务随后只通过Foundry UI删除上述精确Scene与Actor；两个Token随Scene移除，最终Scene和Actor目录中均无该条目，清理 **PASS**。原始暂停记录保留，更新后的删除证据见 `e2e-round3-results.md`、`e2e-round3-ui-evidence.md` 和 `e2e-round3-server-status.json`；最终30001仍为`cor-cotn`、PID32196、Foundry14.364/dnd5e5.3.3。\n\n真实指针仅移动悬停仍为 **NOT_EXECUTED**：当前Chrome控制接口没有纯移动调用；点击后出现的tooltip不代替这一项。图标显示不等于用户最终美术接受。其余独立世界E2E不因本轮重复执行。\n\n新候选复查：先核对官方页面、作者和许可，再以32/64px预览比较整套；如换候选，更新下载URL和哈希。资产选型不等于模块功能可用，状态口径仍遵守docs/acceptance/foundry-v14-module-health.md，Untested不能当运行通过。\n","docs/reviews/2026-09-24-all-custom-condition-hud-audit.md":"# Custom Conditions 全 19 项 HUD / 状态 ID 审计\n\n日期：2026-09-24。目标是 server-mirror 的 CoTN `cor-cotn`、Foundry 14.364 / dnd5e 5.3.3，并保留该世界原有启用模组组合。本页记录用户发现「自定义流血」没有独立 HUD 入口后的系统性审计、候选修复和 CoTN 页面复验。页面复验覆盖 19 项的**入口可见性**；不等于逐项施加、结算及跨客户端玩法验收。\n\n## 已确认的同名 ID 与问题范围\n\n安装在 server-mirror 的 dnd5e 5.3.3 源码 `Data/systems/dnd5e/dnd5e.mjs` 的 `DND5E.conditionTypes` 同时定义裸 ID `bleeding` 与 `burning`（约 47158、47169 行）。CoTN 已启用的 `mcdm-flee-mortals-where-evil-lives` 的 `Data/modules/.../index.js` 定义裸 `dazed`（约 1972 行）；先前 CoTN 浏览器曾同时看到该裸项和本模块独立的自定义 Dazed，见[图标及状态现场记录](2026-09-23-existing-condition-icons.md)。裸 ID 被其他来源先注册后，本模块不能用同一个 ID 覆写其规则和入口。此前[灼烧入口修复](2026-09-24-custom-burning-hud.md)仅解决 Burning，不能代表 Bleeding 或其余状态已检查。\n\n用户现场看到的 dnd5e 原生 `bleeding` 中文按钮叫「失血」，希望本模块自定义 Bleeding 继续叫「流血」；两者的**中文名称不同、状态 ID 不同、作用规则不同**。不要把「失血」按钮或原生「燃烧」按钮当成已配置本模块骰式参数的入口，也不要为区分它们重命名底层语义 ID。\n\n下表的「修复前」指本次全量修复启动前的候选实现：Dazed 与 Burning 已有独立投影，Shocked 虽被特设点击桥接接管但仍需纳入统一投影，其余 16 项未完成通用 HUD 接管。已确认同 ID 来源的是 Bleeding、Burning、Dazed **3 项**；其余 **16 项**未发现当前同 ID 来源。「未发现同 ID」只表示上述精确安装版本与已知启用组合的审计没有证据，**不保证未来安装或启用的模块不会再定义同名 ID**。不把图标复用、显示名相同或未看见按钮单独当成 ID 冲突证据。\n\n| # | 本模块语义 ID | 中文名 | 修复前状态 ID | 修复前已知裸 ID 冲突 | 修复前 HUD 点击路径 | 目标独立状态 ID |\n| ---: | --- | --- | --- | --- | --- | --- |\n| 1 | `addled` | 心智混乱 | `addled` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.addled` |\n| 2 | `bewildered` | 迷乱 | `bewildered` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.bewildered` |\n| 3 | `bleeding` | 流血 | `bleeding` | dnd5e 原生 `bleeding`，界面「失血」 | 本模块入口被占用；系统默认切换不能填写实例骰式 | `fvtt-custom-conditions.bleeding` |\n| 4 | `burning` | 灼烧 | `fvtt-custom-conditions.burning` | dnd5e 原生 `burning`，界面「燃烧」 | 已有独立入口，点击打开绑定 Actor 的参数管理器 | `fvtt-custom-conditions.burning` |\n| 5 | `clumsy` | 笨拙 | `clumsy` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.clumsy` |\n| 6 | `dazed` | 恍惚 | `fvtt-custom-conditions.dazed` | MCDM 裸 `dazed` | 已有独立入口，经本模块 API 切换 | `fvtt-custom-conditions.dazed` |\n| 7 | `defenseless` | 无防备 | `defenseless` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.defenseless` |\n| 8 | `distracted` | 分心 | `distracted` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.distracted` |\n| 9 | `enfeebled` | 衰弱 | `enfeebled` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.enfeebled` |\n| 10 | `frozen` | 冻结 | `frozen` | 未发现 | 系统默认切换，无法填写解除 DC | `fvtt-custom-conditions.frozen` |\n| 11 | `helpless` | 无助 | `helpless` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.helpless` |\n| 12 | `immobilized` | 定身 | `immobilized` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.immobilized` |\n| 13 | `jinxed` | 厄运 | `jinxed` | 未发现 | 系统默认切换，无法填写骰式 | `fvtt-custom-conditions.jinxed` |\n| 14 | `shocked` | 震愕 | `shocked` | 未发现 | 特设桥接经本模块 API 切换，需统一接管 | `fvtt-custom-conditions.shocked` |\n| 15 | `sickened` | 病弱 | `sickened` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.sickened` |\n| 16 | `slowed` | 减速 | `slowed` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.slowed` |\n| 17 | `staggered` | 踉跄 | `staggered` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.staggered` |\n| 18 | `valor` | 英勇 | `valor` | 未发现 | 系统默认切换，无法填写骰式 | `fvtt-custom-conditions.valor` |\n| 19 | `weakened` | 虚弱 | `weakened` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.weakened` |\n\n五个需要参数的状态是 Bleeding、Burning、Frozen、Jinxed、Valor。HUD 直接使用 `actor.toggleStatusEffect()` 会生成没有 `flags.fvtt-custom-conditions.condition` 的普通 ActiveEffect，不能替代本模块的实例校验、来源参数、最高值结算或解除逻辑。其余 14 项虽无必填参数，也必须由本模块 API 施加或切换，使规则 Hook、复合状态和图标高亮都读取同一种实例；旧版 Shocked 曾因走普通 HUD 路径而只有自身高亮、缺少 Dazed/Defenseless 投影，见[现场与补救记录](2026-09-23-existing-condition-icons.md)。本段是代码路径审计，不能代替对每一项的 CoTN 点击结果。\n\n## 全量修复的行为边界\n\n1. 所有 19 个语义 ID 都投影为 `fvtt-custom-conditions.\u003cid>`；原生 dnd5e 的「失血」/「燃烧」与 MCDM Dazed 保留原有 ID、名称、图标与行为。本模块自有项须可按当前 Foundry 语言显示名称与规则卡。\n2. 本模块的 19 项在 Foundry 原生 Token 状态 HUD 中隐藏普通点击入口，避免其默认切换绕过 API；Token Action HUD 从注册状态读到这些项，但点击由本模块的 roll-handler extender 接管。五个参数项打开已绑定当前**单个** Actor、已预选该状态的管理器，不直接施加空参数实例；其余 14 项按本模块 API 的实例/启停规则切换。目标或 GM 权限不明确时应提示并拒绝，不退回默认切换。\n3. 保留旧 Actor/Item ActiveEffect 的 `flags.fvtt-custom-conditions.condition`、`conditionId`、实例参数与来源，不按显示名猜测归属，也不迁移、删除用户既有实例。更新旧实例时投影新的命名空间状态；复合 Frozen/Shocked 的子状态仍应与本模块一致，高亮、停用和再启用须对应实际实例。dnd5e 的 `noMovement` / `halfMovement` 映射也应同步使用新状态 ID。\n4. 既有 Token Action HUD 用户布局可能保存旧 action ID。新 ID 应在默认布局中可见；自定义保存布局是否能迁移，必须按其实际存储与页面行为核对，不能仅凭默认 HUD 截图推断。不能擅自清空或重写玩家的 HUD 偏好。\n\n生成链路也属于同一次 ID 审计。除 `packages/generation/src/actor-effects.ts` 的投影路径外，`packages/generation/src/actor.ts` 原有两处直接写 `statuses: ['bleeding']`，会绕开通用投影；本轮候选实现已将其改为 `projectedConditionStatusId('bleeding')` 并补回归。只把这个结果称为候选源码与测试结果，导入到 CoTN 后的实际 Actor/Item 行为须另列验收。\n\n## 验收分层与后续核查\n\n- **已发生的历史页面证据**：CoTN 的原生 Burning 与自定义「灼烧」并列、点击灼烧打开绑定 Actor 的空参数管理器；自定义 Dazed 与 MCDM Dazed 并列；Shocked 复合高亮经前次专项复查。各结论限于当时的模块字节、Token 与页面，见所链记录。\n- **PASS — 全 19 项入口可见性**：2026-09-24 在常驻 server-mirror 的真实 CoTN 页面正常重载，Token Action HUD「效应」组中 19 个自定义中文按钮各出现一次，均有图标；未发现缺失或重复。原生「失血」与自定义「流血」、原生「燃烧」与自定义「灼烧」、MCDM「Dazed」与自定义「恍惚」同屏并列。页面显示已启用 77 个模组，复验前后没有修改模组配置或 HUD 保存布局。截图见 [全 19 项 HUD 画面](F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/all-19-hud-line-261-0.jpg)，原始 AX 摘录、运行时和边界见 [Chrome 现场记录](F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/ax-evidence.md)。浏览器 AX 未暴露 TAH actionId；19 个命名空间 ID 是安装源码的静态核对结果，不冒充 DOM 读取。\n- **PASS — 自定义流血入口打开管理器**：只点击自定义「流血」一次，管理器绑定所选 Token 的 Actor「泽菲尔·艾什伍德」，预选「流血」，公式仍为空。没有点击施加，也没有新增或修改状态；原生「失血」未点击。候选实现的 Custom Conditions **80/80** 单测、模块类型检查与安装树核对通过；这些是代码和安装层证据，不代替页面行为。\n- **NOT_EXECUTED — 其余点击和玩法结算**：本轮没有逐项切换其余 18 个按钮、提交流血参数、重验冻结五段悬停说明、检查浏览器控制台或多客户端/持久化结果；本轮使用的 Chrome UI 接口未提供悬停操作。旧布局的自动迁移也未验证。若以后修改上述逻辑，再按具体风险补定向验收，不无理由重跑独立测试世界的全套 E2E。\n\n## 可追溯来源\n\n- 19 项语义目录与实例 flag：`packages/contracts/src/conditions.ts`；注册与速度映射：`foundry-modules/fvtt-custom-conditions/src/runtime.ts`；点击桥接和 tooltip：`foundry-modules/fvtt-custom-conditions/src/hud.ts`；生成模板：`packages/generation/src/actor-effects.ts`、`packages/generation/src/actor.ts`。\n- 锁定的本地 dnd5e 5.3.3：`F:/FoundryLab/foundry-v14/data/server-mirror/Data/systems/dnd5e/dnd5e.mjs` 的 `DND5E.conditionTypes.bleeding` / `.burning`；锁定的本地 MCDM 模组：`F:/FoundryLab/foundry-v14/data/server-mirror/Data/modules/mcdm-flee-mortals-where-evil-lives/index.js` 的 `dazed` 注册。二者只读核对，没有修改 Lab 文件。\n- 同名状态的先前 CoTN 页面证据：[图标与 Dazed/Shocked 记录](2026-09-23-existing-condition-icons.md)、[原生 Burning 记录](2026-09-23-cotn-burning-hud.md)、[自定义灼烧入口记录](2026-09-24-custom-burning-hud.md)。这些是历史节点，不自动覆盖本轮全量修复。\n- 本轮安装核对：`F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/20260924-095456/verified.json`；外部 Chrome 原始截图提取来源及 SHA-256：`F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/screenshot-provenance.json`。截图为子任务 CUA 原样返回字节，未重绘。\n","docs/reviews/2026-09-24-custom-burning-hud.md":"# 参数化 Custom Conditions「灼烧」的 HUD 入口\n\n> 后续范围说明：本页只记录当时「灼烧」相对原生「燃烧」的独立入口与现场验收。用户随后发现自定义「流血」也缺入口，引发[全 19 项 HUD / 状态 ID 审计](2026-09-24-all-custom-condition-hud-audit.md)。本页的灼烧 PASS 不能代表流血或其余 17 项已完成本轮统一修复及页面验收。\n\n日期：2026-09-24。目标环境仍是 server-mirror 的 CoTN `cor-cotn`，Foundry 14.364 / dnd5e 5.3.3。本文记录本地候选变更及验收边界；它不把此前原生 Burning 的浏览器截图当作自定义入口的通过证据。\n\n## 用户问题与区分\n\n用户指出的是：可填写骰式和伤害类型的 **Custom Conditions「灼烧」**（内部 ID `burning`）在 Token Action HUD 中没有入口。2026-09-23 的[现场记录](2026-09-23-cotn-burning-hud.md)及截图只确认 dnd5e 原生「燃烧」可见；该按钮不能建立参数化实例，不能作为本问题的解决结果。先前把「原生按钮可见」解释为这一项已处理，判断对象错误。\n\n## 候选行为\n\n- 保留 dnd5e 原生裸 ID `burning` 的状态、规则、图标与 HUD 按钮。\n- 为本模块增加独立的 `fvtt-custom-conditions.burning` HUD 项，中文状态名称和 HUD 标签均为「灼烧」，英文 HUD 标签为 `Custom Burning`。原生按钮仍称「燃烧」，两者不共用同一按钮语义。先前草稿中的「自定义燃烧」已被用户修正，不再作为中文 UI 名称。\n- 灼烧在 Foundry 原生 Token HUD 中设置 `hud: false`，避免原生 `toggleStatusEffect()` 绕过必填参数或删除已配置效果；Token Action HUD 2.1.1 仍从 `CONFIG.statusEffects` 枚举该项，并由本模块的点击拦截器处理。原生「燃烧」保持原有 HUD 行为。\n- active GM 在只有一个明确目标 Actor 时点击灼烧项，会打开绑定该 Actor、预选灼烧（内部 ID `burning`）的状态管理器。HUD 点击本身不会施加无参数效果；GM 在管理器中显式填写 `formula` 和 `damageType`，由既有参数校验拒绝缺项。\n- 已存储的旧 `flags.fvtt-custom-conditions.condition` 灼烧实例仍可读取与显示，不因 HUD 入口改变而迁移或删除。\n\n## 验收分层\n\n- **历史 PASS，仅原生按钮**：在 CoTN 所选 Token 的效应组中看到 `actionId=burning`；证据见 2026-09-23 现场记录。\n- **候选静态检查 PASS**：实现已固定状态 ID、点击路由、Actor 绑定、空参数拒绝与旧 flagged 实例读取；Custom Conditions 模块测试 71/71、受影响 effectProfile 测试 33/33、模块类型检查与构建通过。这些检查不证明 CoTN 页面已经显示新按钮。\n- **CoTN 新入口视觉与表单打开 PASS**：2026-09-24 的独立外部 Chrome 在同一个 Token Action HUD「效应」列表看见「燃烧」与「灼烧」两个按钮。只点击「灼烧」后，Custom Conditions Manager 显示所选 Token 对应的 Actor「泽菲尔·艾什伍德」、预选「灼烧」，参数 JSON 初值为 `{\"formula\":\"\",\"damageType\":\"\"}`；没有提交、施加或停用状态。浏览器 AX 证实两个不同标签及管理器内容；AX 不暴露 `actionId`，原生 `burning` 与本模块 `fvtt-custom-conditions.burning` 的 ID/图标映射另由精确安装源码和文件哈希核对，不能误称为浏览器直接读到 DOM 属性。证据见 `F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-custom-burning-localhost/chrome-run-20260924.md`，原字节 CUA 截图及提取来源见同目录 `burning-and-scorching-hud.jpg`、`scorching-manager.jpg` 和 `screenshot-provenance.json`。\n- **未执行的边界**：本轮按用户要求未提交参数、结算伤害或重跑旧玩法规则；空参数拒绝由单测覆盖，未在 CoTN UI 中尝试。Frozen 五段新版浮框因 Chrome 控制接口缺少可靠悬停/tooltip 读取，仍为视觉 **NOT_EXECUTED**。首次使用 `127.0.0.1:30001` 的 Chrome 标签登录成功提示后返回 `/join`；后以 `localhost:30001` 进入同一 PID 32428 的 server-mirror 世界。两主机名的会话隔离是排查假设，未读取 Cookie 来证明具体冲突。\n\n这次入口变更不要求重跑先前已通过的整套独立世界规则 E2E；若发现新入口引入行为回归，再针对该路径补测。\n","docs/runbooks/custom-conditions-and-trigger-engine-usage.md":"# Custom Conditions 与 Trigger Engine 使用说明\n\n本说明对应当前本地候选版本：Foundry14.364 / dnd5e5.3.3。基础发布边界见[候选收尾表](../reviews/2026-09-21-custom-conditions-release-readiness.md)；状态文案的来源边界见[规则核对](../reviews/2026-09-23-drakkenheim-condition-wording.md)，全 19 项的 ID、点击路径与 CoTN 页面复验见[本轮审计](../reviews/2026-09-24-all-custom-condition-hud-audit.md)。全 19 项入口可见已在 CoTN 页面通过；这不代表逐项施加与结算已复验，也不代表serverNext的dnd5e6版本已兼容。\n\n## 启用与打开\n\n本地候选包位于 `foundry-modules/fvtt-trigger-engine/dist/fvtt-trigger-engine.zip` 和 `foundry-modules/fvtt-custom-conditions/dist/fvtt-custom-conditions.zip`。目前没有公开发布manifest地址；这些是本worktree的本地交付物。安装到其他实例前应核对版本兼容性与目标授权，不能直接覆盖正在使用的模块目录。\n\n安装两个独立模块，在世界的模块管理中启用 Trigger Engine 和 Custom Conditions，按提示重载页面。Custom Conditions依赖Trigger Engine；核心功能不要求Midi-QOL、DAE、Times Up或Effect Macro。\n\n以GM选中或标记目标Token，从模块设置菜单或Token控制栏打开“管理自定义状态”。存在标记目标时优先使用标记目标，否则使用选中的Token。改变目标后点击刷新，确认面板显示的Actor名称再操作。\n\n## 手动状态和参数\n\n名称和悬停规则说明跟随 Foundry 的核心界面语言：`cn` / `zh-CN` 为中文，`en` 或没有对应翻译的语言回退英文。改语言后重载世界。系统与模块没有两套彼此独立的语言选择。十九种自定义实例各使用一张选定的 Game-icons.net 原始 SVG，作者、作品、来源和 CC BY 3.0 许可见模块包内 `CREDITS.md`。笨拙使用 Drop Weapon，踉跄使用 Foot Trip。Token Action HUD 的完整提示使用 dnd5e 规则卡布局：左侧双语标题、右侧状态类别和分段正文；状态图标只留在 HUD 按钮，不放大到提示框内。仅名称和无提示模式仍按 TAH 设置生效。**所有 19 个自定义状态**使用 `fvtt-custom-conditions.\u003c语义 ID>` 的独立状态 ID；dnd5e 原生与其他模组的裸 ID 按钮保留其原有规则。CoTN 中系统原生 `bleeding` 的中文按钮是「失血」，本模块自定义 `fvtt-custom-conditions.bleeding` 是「流血」；原生 `burning` 为「燃烧」，自定义 `fvtt-custom-conditions.burning` 为「灼烧」。自定义 Dazed 标题只显示「恍惚」或 Dazed，不显示辨识用后缀，仍与 MCDM 的裸 `dazed` 分立。不能把原生按钮当作已配置自定义骰式的实例。\n\n如同时启用伤势模块，可以在本管理器的伤势区域查看和调整 0–3 层伤势，或打开“消逝的灵魂”仪式。Token Action HUD 中伤势项显示当前层数，例如 `1/3`；完整悬停说明也按 dnd5e 规则卡布局显示，将倒地与叠层、第三层 GM 裁定、清除方式、死亡豁免自然 19/20 分段列出。伤势仍通过其公开 API 写入原有 Actor flags；关闭 Custom Conditions 不会丢失伤势及复活历史。伤势图标亦取自 Game-icons.net，署名与许可随伤势模块包内的 `CREDITS.md` 提供。\n\n选择状态，在参数JSON框中填写该状态的参数，再施加。切换到另一种状态时应按新状态填写参数，不要沿用上一种状态的无关字段。没有参数的状态使用 `{}`。\n\n| 状态 | 最小参数示例 |\n| --- | --- |\n| 自定义流血（内部 ID `bleeding`） | `{\"formula\":\"2d6\"}` |\n| 灼烧（内部 ID `burning`） | `{\"formula\":\"2d6\",\"damageType\":\"fire\"}` |\n| Frozen | `{\"escapeDC\":15}` |\n| Jinxed | `{\"formula\":\"1d6\"}` |\n| Valor | `{\"formula\":\"1d4\"}` |\n\nToken Action HUD 中已生效的 Jinxed、Valor 实例显示其骰子面数，例如 `1d6` 显示 `6`、`1d4` 显示 `4`。这是骰式标识，不是掷骰结果；复合骰式显示紧凑式，过长时角标截短，完整式可在状态管理器查看。\n\n冻结与震愕的说明直接展开其所附状态的效果，阅读时不用再翻查「定身／无防备／恍惚」。冻结使速度为 0、不能受益于速度加值，飞行中会坠落；针对目标的攻击检定有优势。其特殊重击条件限于**使用造成钝击伤害的武器**命中冻结目标，不是任意钝击法术或普通徒手打击。天生武器只有被具体规则认定为武器且在 Foundry 中可被活动数据识别时，才能指望自动判定覆盖。本模块的自定义「恍惚」在自己的回合可从**自主移动、执行动作、执行附赠动作**中选择一种；选择后不能再做另外两种。震愕继承这条恍惚规则，另使针对目标的攻击检定有优势，并让目标掉落手中物品，拿取、拔出或收起物品各需 1 个动作。因此震愕目标若已选择移动或附赠动作，本回合不能再拿取／拔出／收起物品。两种状态都不额外禁止反应；「震愕」也不表示只由闪电伤害造成。攻击掷骰进入求值时，会在本客户端临时锁住所选类别；若掷骰异常失败而没有完成 Hook，本回合保守地继续限制，下一回合自动重置。跨客户端同时操作同一 Actor、两个独立非攻击活动弹窗交错完成仍需单独验收。这一三选一是本项目按用户决定采用的自定义规则，见[规则变更记录](../reviews/2026-09-24-dazed-three-choice-rule.md)。\n\n英勇在攻击检定或豁免检定时额外掷实例骰式并**加**到结果；厄运使用相同结构但**减**去骰值。虚弱使武器攻击或法术造成的伤害总值减半，结果向下取整；若聊天卡仍显示含小数的伤害表达式，以目标 HP 实际应用的整数为准。踉跄在自己的回合最多完成一次武器或徒手攻击；这比目前可公开核对的 Drakkenheim Beta「武器攻击」文字范围更广，是本项目的明确选择。正式版 Appendix C 的条件原文尚未逐条公开核对，不把这里的措辞称作正式中文版原文。\n\n在已选 Token 的 Token Action HUD 中，鼠标离开时动作区可能隐藏；打开「效应」组。active GM 对单个明确 Actor 点击自定义流血、灼烧、冻结、厄运或英勇，会打开**绑定该 Actor 且预选所点状态**的管理器，点击本身不施加效果；先填写流血/灼烧的骰式、灼烧伤害类型、冻结解除 DC、厄运/英勇骰式等必填参数，再提交。其余 14 项经 Custom Conditions API 切换带本模块 flag 的实例，不能通过系统默认状态开关来代替。目标不明确、无 active GM 权限或同状态有多个实例时，以提示和管理器核对为准，不退回系统默认切换。仅由冻结/震愕的复合效果提供的子状态会显示生效；点击子状态不会暗中再建一个独立实例，应到管理器处理实际来源。旧版带本模块 flag 的实例仍按原存储读取并点亮自定义 HUD 项，原生流血/燃烧不会点亮本模块项目。\n\n2026-09-23 的 CoTN [现场核查](../reviews/2026-09-23-cotn-burning-hud.md)只看到原生燃烧按钮；2026-09-24 的[灼烧入口验收记录](../reviews/2026-09-24-custom-burning-hud.md)只确认当时「燃烧／灼烧」并列。此后的[全 19 项 CoTN 复验](../reviews/2026-09-24-all-custom-condition-hud-audit.md)已确认 19 个自定义按钮均可见、无重复，且点击自定义「流血」打开绑定 Actor 的空参数表单；其余按钮的逐项点击与结算未在这一轮执行。Token Action HUD 保存的个人布局按 action ID 匹配；本轮现有布局显示正常，但旧布局中的隐藏与排序偏好未证明会自动迁移，若个别入口未出现，应先检查该用户的「状态」组布局，不要清空他人的偏好。\n\nBleeding默认在自身回合结束时失去生命值，恢复生命值后解除；Burning默认回合结束造成指定类型伤害。来源明确指定回合开始时，可在参数中加入 `\"timing\":\"turnStart\"`。结束说明只是说明文字，不会把任意自然语言自动变成触发规则。\n\nBleeding与Burning在同Actor上各自只保留一项较高值，按骰式期望值比较，平手保留原值。Burning不同伤害类型仍一起比较。它们不是多层相加，也不按每次随机掷骰结果临时决定强弱。\n\n编辑：面板中点击已有实例的编辑，修改参数后保存。停用会保留实例信息但暂停作用；移除则解除实例。来源栏用于记录“这个状态从哪个能力或物品来”，不需要普通使用者手写技术地址。\n\nFrozen实例的“破冰（动作）”按钮会进行力量（运动）检定。默认目标自救；标记被冻结目标并另选一名协助者时，可由协助者检定。GM先判断其是否能接触目标。取消不耗Action，完成失败耗Action但状态保留，成功则解除。\n\n## 怪物生成与模板\n\n来源必须明确给出状态参数，例如Frozen的DC、Jinxed的骰式。使用正式生成器输出Actor JSON，再通过Foundry的Import Data导入。攻击Item中的Condition效果是可施加模板，不应让持有该Item的怪物自己中状态。\n\n模板应用使用模块公开的 `applyFromItem` 流程，将来源参数复制到目标Actor实例。已有自动化可以调用此接口；仅导入Item并不等同于每次命中都已自动完成目标选择和规则裁定。当前管理器用于直接施加/管理状态，不能把API验证描述为已经提供所有“一键命中套用”的UI。\n\n不要手工修补最终生成JSON来补来源没写的DC或骰式。来源缺参数时先补充来源，或由GM在Foundry中手动决定实例参数。\n\n## 通用触发器\n\n从模块设置或Token控制栏打开Trigger Manager。当前编辑器接受JSON定义，支持Actor文档更新、Combat回合开始、Combat回合结束。可以新建、复制、编辑、启停和删除Trigger，并选择已有Macro UUID作为动作。\n\nTrigger只由active GM执行。宏收到 `triggerContext`，可读取变更前后数据、Actor及回合信息。宏要回写同一Actor时，使用 `triggerContext.updateDocument()` 保留防递归信息。\n\n无需为了更改现有触发条件或状态骰式重新编译模块；但首次编写全新Macro行为仍需要脚本。不要把“可在FVTT中配置”理解为“所有新规则都无需编写任何逻辑”。\n\n## 移动与使用边界\n\nImmobilized/Frozen限制拖拽、键盘，以及非GM通过HUD/配置进行的自主位置修改。GM坐标编辑、API位置操作保留用于强制位移/裁定，不计为Dazed的自主移动选择。键盘输入路径的当前验收缺口见候选收尾表。\n\n飞行坠落落点、地图距离、环境解除由GM判断。原生Bloodied继续使用dnd5e/FVTT；Madness和Contamination不在本期范围。\n\n## 本地测试环境\n\nserver-mirror入口为 `http://127.0.0.1:30001/join`。真实组合验收使用 `cor-cotn`「溟渊的呼唤」，保留世界原有启用模组；历史隔离 E2E 使用 `fvtt-v14-module-matrix`，不能替代 CoTN 的组合证据。该服务按用户要求常驻到关机，测试任务只复用；清理仅限自己的临时对象和receiver，不停止Foundry。\n\n结束测试后恢复原场景、暂停状态。CoTN 当前用户要求保留 Trigger Engine 和 Custom Conditions 启用供手动查看，不恢复历史隔离测试中关闭 Custom Conditions 的配置。serverNext30002是独立环境，不自动安装或更新。\n","docs/runbooks/development-feedback-loop.md":"# 开发反馈闭环\n\n状态：2026-09-30 获用户授权，作为独立规范增量纳入 master。既有 worktree 需自行吸收该提交；历史审计记录不代表共用工具已实现或提速已测得。\n\n目标：更早得到能区分错误原因的真实反馈，减少重复准备、错误修复和证据转抄。简单、边界清楚的小修改继续用简短说明；完整合同只用于新外部接口、跨模块/版本/客户端、迁移或已经重复失败的工作。\n\n## 1. 开工：目标清楚再改，技术未知先查\n\n先用不超过一屏说清：要改变的行为、保留的行为、验收出口、候选工作树/环境，以及会影响方案的歧义。\n\n- 用户意图、功能归属、完成层级或写入授权存在两个会改变结果的解释：提出具体选项，先问清再做依赖它的操作；可继续只读调查。说明歧义将改变什么，不把问题变成让用户替代理设计实现。\n- 路径、版本、API或报错可以从项目/运行记录查到：先调查，不要求用户重复提供。\n- 不影响语义和授权的可逆细节：自行决定，必要时简记假设。\n- “借鉴开源”不能自动解释成依赖外部模块完成产品功能；“做完”不能自动解释成允许合并/生产发布。已有明确授权继续有效。\n\n## 2. 陌生接口：研究要转成约束\n\n先读精确版本的相关实现/同类真实项目；已有固定来源可复用，不为每个小改重新上网。用户明确要求调查的方向须执行，或以实际检索结果说明为何不适用。\n\n记录只需四项：来源/版本/许可；与本次问题相关的一条接口事实；本项目采用/不采用的差异；能推翻当前假设的最小检查。列链接或“已阅读”不算完成。\n\n对新hook、异步注册、持久化、权限或跨模块状态，先获得一条窄的真实边界记录或精确版本契约检查，再扩展规则和界面。测试的外部替身应依据记录校准，不能用自己想象的调用顺序作为唯一判定标准。\n\n找不到可借鉴实现时：写明检索范围与无匹配结论；从最小状态转移和两个竞争解释开始，用可区分它们的实验获取事实。不得用“没有上游”作为无限试错的理由。\n\n## 3. 失败：先分层，再选择下一动作\n\n| 层级 | 例子 | 下一动作 |\n| --- | --- | --- |\n| 工具/运输 | 宏语法错、显示空JSON、字段转抄错 | 修工具并做最低往返检查，不重打战斗 |\n| 环境/前置 | 玩家不拥有Token、错level/版本/场景 | 验证真实前置，修准确归属的测试准备 |\n| 外部协议 | hook顺序、message type、同步/异步注册误判 | 精确源码/事件trace/最小复现，更新契约fixture |\n| 产品行为 | 同一次合法伤害后没生成效果、物品字段丢失 | 保留真实失败输入，目标回归先红后绿，再复验受影响链 |\n| 判定/证据 | 已有正确事实，classifier要求不存在字段 | 分开行为结论与证据完整性，核原件，修判定器；不伪写PASS |\n| 授权 | 当前写目标超出已授范围 | 准备具体结果与目标，向用户问缺失授权 |\n\n同一失败指纹连续两次尝试没有新证据时，停止原路重试。下一步必须带来新信息：缩小复现、换能区分假设的探针、重新读相关版本实现或请求独立反驳。若缺的是产品决策，问用户；若缺的是技术事实，继续调查。这个检查点不是项目总时长上限。\n\n## 4. 先使执行工具可用，再派发\n\n复杂E2E/迁移派发前核对：\n\n1. 合同及源码绝对路径存在，worktree/branch与目标匹配；不要让执行者从master猜路径。\n2. 依赖检查的exit code和结构化结果都通过，之后才派发；检查失败不能因同一脚本下一条命令成功而被忽略。\n3. 新工具有最小输入→调用→显示/导出→保存→解析的往返证明；纯语法检查只证明语法。\n4. 父任务核实其可见的宿主能力并准备好文件；执行器建立后，在它自己的当前上下文核对有效权限、实际工具入口、模型/effort与目标，再做依赖操作。父宿主可用不等于执行器可用，未知项不凭prompt声明代替。\n5. callback含准确父线程UUID、dispatchId、contractRevision和receiptId；子代理通道、独立thread通道和浏览器页所有权是不同概念。发送成功、正确父线程实收、父审接受分别留证，不能用一个布尔值代替。\n\n环境基线记录精确dataPath、端口/PID、世界、Core/system、检查时点及当前共用情况。OS owner或旧快照不等于其他任务已释放服务；维护操作沿用已核实授权及协调记录，不新增逐次确认要求。\n\n独立Chrome仍按已授权技能/宿主路径执行。markHandoff表示保留页面，不表示跨thread转移所有权。不要用裸CDP或替代通道绕过工具拒绝。只读来源检索不需要浏览器任务。\n\n派发后只做已有目标必需且独立的工作；没有独立工作就结束父回合，等待结果事件。callback去重；不轮询、监控日志或制造工作维持活跃。有新失败证据可修正合同；旧合同的错误门禁应明确撤回，不能让执行者反复撞它。\n\n## 5. 验收：分层，复用，保持判定独立\n\n以下层级按任务选择，不是每个模块都跑一遍。沿用本项目已明确的迁移口径：官方明确支持且未本地修改的包只做包/依赖/启用/重登新增错误检查；本地修复增加受影响的关键行为验证。用户后来明确改变验收范围时更新当前合同。\n\n- 纯规则：输入/状态转移/幂等和边界。\n- 真实契约：固定版本的schema/hook/message及真实依赖的窄桥接。\n- 实际运行API：持久化、角色权限、事件时序和最终数据。\n- 少量UI：用户入口、窗口/选项、目标选择、拖放、实际应用动作与角色差异。\n- 整合：共享依赖/兼容组合/产物/手册，在集成边界执行。\n\n同类型组合优先下沉；只复验变化影响、失败或具体缺口。完整UI不代替低层测试，模拟测试也不代替真实边界。真实Actor/效果操作必须走产品正式入口，直接写期望结果不能充当验证。\n\n行为结果、证据状态、清理结果分开记录。自动分类不适用时保留原始标签，写清独立审查依据；不得因为看到PASS而跳过被测交互或图片内容。截图文件存在不证明截图正确。\n\n## 6. 共用工具与每个模块的边界\n\n复用当前Foundry Ops、WMP harness、构建身份和收据能力。共用部分只做环境/权限前检、run/fixture生命周期、trace关联、结构化导出、状态恢复与精确清理；每个模块提供小型case adapter和独立语义判定。worktree只保存本次身份与状态，不各造一套测试框架。\n\n在第二个真实消费者验证复用之前，不建通用DSL/调度服务/大型测试平台。测试工具本身按代码对待：失败退出、陈旧收据拒绝、显示/文件往返、销毁归属有对应检查。\n\n## 7. 状态和继承\n\n一个任务有一个当前状态源；历史是只读证据。当前状态至少含目标、实际路径/环境、唯一case、已接受证据、当前失败层级、下一动作与授权来源。可从工具生成的ID/版本/哈希不再让模型手填。\n\n新thread先读当前状态并校验身份；旧STOP/已取消门禁必须带superseded状态。产品使用说明不嵌入每次测试进度；文档与运行代码指纹分开设计。相关产物/环境未变是复用证据的充分条件之一；有据可审查的影响分析也可以说明旧结果仍适用，并列明需复验的受影响路径。身份检查防止混用构建，不代替语义影响判断；未知影响不擅自免测。\n\n规范/可复用工具改动尽量作为可独立审查的小增量集成。commit/合并/push仍遵既有明确授权；未合并的worktree规则不宣称全项目生效。全局skill或memory不在本次候选中修改。\n\n## 8. 文件侧工具第一版\n\n入口为 `bun run foundry:ops acceptance \u003cprepare|ready|execute|collect|resume>`。它只实现已授权的本地文件检查、合同身份绑定、失败阻止派发、一次执行与收据往返。请求格式、退出码和具体步骤见 [Foundry Ops 说明](../../tools/foundry-ops/README.zh-CN.md#共用验收工具文件侧第一版)与[请求示例](../templates/development-feedback-request.example.json)。\n\n完整任务合同的 runtime、fixture、callback 和人工介入计量仍是后续能力；本版不执行 Chrome、不修改世界、不替模块判定玩法。父宿主可通过 `dispatchPrepared()` 接入实际派发，在失败时回调调用次数为零。只运行 `ready` 再自行派发的宿主仍需自己处理两步之间的身份变化，不能宣称已完成该集成。\n\n后续增量已有 Vision5e + Item Macro 的离线批次 adapter、跨工作树只读来源绑定及参考收据导入。具体步骤见 [第二个消费者](../../tools/foundry-ops/README.zh-CN.md#第二个消费者vision5e--item-macro-离线接入)。`ready` 表示文件检查可运行；`ready-batch` 的运行派发门禁单独报告。源批次暂停、运行授权与回调归属保留，不能把离线准备或数据标签升级为真实批次接受。完整第二消费者 D 仍等获准的实机链路。\n\n已明确恢复的同一批次可用 `prepare-runtime`／`ready-runtime`／`claim-runtime` 建立独立运行合同，核对最新执行聊天配置及现存服务身份后领取一次宿主派发；旧文件侧合同不会升级权限。`collect-runtime` 保存原生观察与实际证据指纹，保持父审待完成，界面和完整清理由父任务独立核对。说明见 [已恢复的实机批次](../../tools/foundry-ops/README.zh-CN.md#已明确恢复的-vision5e--item-macro-实机批次)。该增量不安装、不启停服务、不直接操作 Chrome，也不替代跨线程运输回执。\n","docs/runbooks/handbook-maintenance.md":"# 中文工具手册：维护与合并\n\n## 日常打开\n\n双击仓库根目录 `工具手册.html`。这是包含中文工具说明、全文搜索、分类目录、命令和选定原始文档的单文件页面；不依赖 Bun、Foundry、网络、CDN 或后台服务。\n\n推荐收藏 **master 工作区里的文件**，或给该文件创建桌面快捷方式。功能和手册一起合并后，刷新这个页面即可。单独复制到其他位置的 HTML 是当时的快照，需要重新复制才会更新；没有文件监控或远程自动更新。\n\n## 内容放在哪里\n\n- `docs/handbook/catalog.json`：生成器、资料处理、检查与开发工具。\n- `docs/handbook/modules.json`：每个 Foundry 模块的独立用户说明。\n- `docs/handbook/reviewed.json`：作者对照实现和来源后的核对日期、说明与内容指纹。\n- `docs/handbook/template.html`、`style.css`、`client.js`：离线页面。\n- `docs/handbook/build.mjs`：构建与只读一致性检查，不修改生成器和 Foundry。\n- 根 `工具手册.html`：确定性生成、随功能一起提交的用户交付物，不能手工修补。\n\n## 每次完成新功能或修改旧功能\n\n1. 在同一个功能 worktree 中更新对应条目的用途、选择时机、准备、操作步骤、产物和限制。新增模块必须有独立条目；新增 app/package/tool 必须登记 `watch` 归属。共享实现可被多个条目关注。\n2. 核对 `sources` 中的权威 Markdown 和实际入口。来源出现矛盾时优先查明实现与最新支持边界，在条目中明确限制；不能把历史文档的“通过”提升为当前运行时通过。\n3. `watch` 覆盖对应实现目录或文件。检查读取 Git 已跟踪和未忽略的新文件，忽略测试、scratch、dist；生产逻辑、文档或入口变化会使指纹过期。不要缩小 watch 来绕过检查。\n4. 查看受影响条目：\n\n   ```powershell\n   bun run handbook:status\n   ```\n\n5. 对照确认后，记录具体核对内容。下面的 `\u003cid>` 替换为报告里的真实 ID；多个已经核对的 ID 可用逗号分隔。\n\n   ```powershell\n   bun run handbook:review -- \u003cid> --note \"已对照入口与来源，更新新功能步骤和适用限制\"\n   bun run handbook:build\n   bun run handbook:check\n   ```\n\n   若实现变化确实不影响用户说明，也必须写明核对结论，例如“仅调整内部缓存，入口、结果与限制保持一致”。review 是作者确认记录，不是自动语义验收，不可盲目批量确认。\n\n6. 实际双击 HTML，检索新功能，打开受影响条目，对照文义和命令。如果修改页面交互，还要检查桌面与窄屏、主题、返回导航、深链接和复制命令。修改检查器运行 `bun run handbook:test`，它在随机临时仓库验证失效来源、新工具漏登记和过期页面等拒绝路径。变更测试或运行器时，可用安全入口 `bun run handbook:test:bun` 有界核对全仓 CI 所用的 Bun runner 兼容性，不直接执行内部 raw 脚本。\n7. 在已有发布授权范围内，把实现、说明、核对记录和生成页面一起提交并合并到 master。合并产生新组合时，重新核对受影响条目并生成页面；不要保留两侧都已过期的 HTML。\n8. 合并后在 master 运行 `bun run handbook:check`，刷新固定入口并检查本次新增/修改条目。记录同步结果；用户基线、索引与发布门禁仍按 worktree runbook 执行。\n\n## 自动检查会做什么\n\n`handbook:check` 接入 `ci:verify`。它会拒绝缺失来源、重复 ID、无效步骤、不存在的 Bun 命令、内部 raw 测试入口、新工具目录未登记、实现/来源指纹过期，以及生成 HTML 和当前内容不一致。\n\n检查不会自动改写文字，不访问网络，不安装 Git hook，也不会自动 commit、merge 或 push。默认 build 同样不会更新核对记录。仓库 CI 的失败会报告不同步；是否阻止远端合并由仓库既有分支保护设置决定，本任务没有修改该设置。\n\n使用已提交 HTML 是刻意的：这样仅凭仓库文件就能阅读。合并同时带来新的说明和页面，不要求用户每次打开前再启动构建器。\n\n## 内容边界\n\n- 常规生成示例显式使用 v14/core，默认 icon-mode off；专门的图标操作才展示 safe。\n- 原始文档按原文离线展示，其中可能有历史状态和旧运维例子。当前推荐操作以人工核对的条目为先。\n- 当前旧 Vault Sync 的备份行为与用户无备份规则冲突，手册明确标注，不提供默认执行捷径。模块安装、迁移等旧文档也不能绕过无备份和授权规则。\n- 不把 `.local`、私有文档、真实生产地址或凭据加入 sources。不要将“构建可打开”写成“功能全部实测通过”。\n","docs/species-ai-intake-v14.md":"# Species AI Intake：TXT → Markdown → Foundry V12/V14 race/feat\n\n`--intake-species` 是不规则 TXT 或已人工编辑 Species Markdown 的正式入口。允许的精确目标只有 Foundry `12.331` / dnd5e `4.3.9` / `core` / 2024（`V12 static candidate`），或 Foundry `14.364` / dnd5e `5.3.3` / `core` / 2024（保留既有 V14 运行验收）。V13、legacy/2014、`modded-v12` 和第三方模块兼容均 fail-closed。\n\n## 数据链与状态\n\n```text\nTXT → discovery → Species Evidence IR → deterministic Markdown\n    → parser → target race/feat package → target validator → AI review\n    → accepted ledger → 独立模块 build\n```\n\n一个 TXT 最多发现 50 个互不重叠候选。每个候选单独得到 `accepted`、`needs_review` 或 `failed`；整次运行可为 `succeeded`、`partial`、`needs_review` 或 `failed`。运行包位于 `.local/species-intake-runs/\u003crun-id>/`，保存不可变来源、discovery、逐候选 IR、Markdown、JSON package、确定性报告、AI review、provider audit 和 manifest。\n\nAI 不直接编写正式 JSON。证据范围、完整 coverage、字段范围、mechanic allowlist、Markdown parser、目标 projector、package validator 与 AI cross-review 全部通过后，候选才会推广到：\n\n- V14：`input/species/\u003cidentifier>.md`；V12：`input/species/v12/\u003cidentifier>.md`，两个目标的已接受来源分别保存，避免一次修改使另一个版本的 ledger 失效。\n- V14：`output/species/\u003cidentifier>.json`\n- V12：`output/species/v12/\u003cidentifier>.json`\n- `output/species/accepted-ledger.json`\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为唯一身份，V12 与 V14 可以共存且互不覆盖。schema v1 只解释为 V14/core/2024；读取、验证或 build 不会改写旧 ledger，只有一次新的成功 promotion 才原子升级为 v2。同一目标的 Markdown、package、ledger hash 必须闭合，另一目标的 package 不能冒充证据。\n\n## Markdown 契约\n\nSpecies Markdown 的 frontmatter 使用 `layout: species`、`species-schema: 1`、稳定 identifier、2024 rules、生物类型、体型、移动、感官、私有 homebrew 来源哈希与精确 UTF-16 长度，以及显式 feature/part ID。正文每个特性都有 `species-feature:\u003cid>` 稳定标记；文末的原始资料区按记录长度逐字符保留候选全文，包括首尾空白和 CRLF。\n\n允许的 v1 mechanics 只有：\n\n- `descriptive-passive`\n- `gm-assisted`\n- `external-rule`\n- `hp-per-level`\n- `ac-bonus`\n- `limited-utility`\n\nMarkdown 不允许填写任意 Foundry system path 或任意 Active Effect change。复杂但来源明确的规则可以诚实地以 `gm-assisted` / `external-rule` accepted；必须保留完整规则、触发条件和未自动化边界，不能用空 Utility 冒充实现。\n\nEvidence IR 使用字段级 claim：身份、规则版本、生物类型、体型、移动、感官和每个 feature 都必须有唯一 JSON-pointer path 与精确来源区间。coverage 必须无缝分割候选，并与这些 claim 双向引用；`ignored-with-reason` 必须写明原因。一个笼统的 `/species` claim 不能通过晋升门禁。\n\n## 命令\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nV12 static candidate 使用同一入口：\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 12 `\n  --effect-profile core\n```\n\n`--dry-run` 不调用 provider、不创建 run bundle、不推广正式文件。V13、modded/legacy 和其他 target/profile 会在 provider 调用前失败。\n\n处理精确 target conflict 或恢复 provider 故障：\n\n```powershell\nbun run src/index.ts --resume-species-intake \".local/species-intake-runs/\u003crun-id>\" `\n  --decisions \".local/species-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\ndecision 只能批准精确 `target-conflict:\u003cidentifier>` 的 replace；不能覆盖来源证据、coverage、语义或 unsupported mechanic finding。\n恢复会创建新的 immutable run；新 manifest 和 accepted ledger 同时记录 `resumedFromRunId` 与 decisions 文件 SHA-256，从而能回溯被恢复的旧 run，而不是改写旧证据。\nresume 命令中的版本/profile 必须与原 run 完全一致；目标漂移在 provider 调用前拒绝。\n\naccepted Markdown 可以编辑，但 ledger 保存了当前 Markdown SHA-256。任何字节变化都会使条目 stale，模块 build 立即 fail-closed。编辑后必须再次把该 Markdown 交给 `--intake-species`，重新生成 run、IR、review、JSON 和 ledger revision。\n\n## 累计内容模块\n\n```powershell\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\nbun run build:homebrew-species:v12-candidate\nbun run verify:homebrew-species:v12-candidate\n```\n\n`fvtt-homebrew-species` 是纯内容模块，只有 `species` 和 `features` 两个 Item Compendium。V14 默认输出仍为 `dist/`；V12 static candidate 输出为 `dist/v12-candidate/`，identity 带 `supportStatus: \"static-candidate\"`。build 只读取当前目标的 accepted ledger 条目和 Markdown，重新走 parser/projector/validator，在随机临时根生成两次 LevelDB 与确定性 ZIP，并检查 identity/coverage/UUID 闭合。V12/V14 的 module ID、pack 名、Race/Feature/Effect/Advancement ID 与 Compendium UUID 相同，版本 metadata 和 Activity 形状是允许差异。\n\nV12 candidate 可以在隔离测试中使用显式 `FVTT_OPS_TEST_CLASSIC_LEVEL_ENTRY` 写入并回读 LevelDB；任何未来可安装 V12 build 必须使用真实 `app/12.331/node_modules/classic-level`。本轮没有扩展安装器、创建 V12 Lab、安装模块或运行 Foundry。\n\n现有安装器仍只属于已验收的 V14 路径；V12 candidate 不得调用它。V12 ZIP 构建成功、LevelDB 回读或静态 validator 绿色都不构成 V12 Runtime Pass。\n\n散装 JSON 是模块绑定的审阅/构建输入；race ItemGrant 使用 `Compendium.fvtt-homebrew-species.features.Item.\u003cid>`，因此不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Item 是快照，v1 不提供迁移器。\n\n## 食人魔 v1 自动化边界\n\n- race 原生表达 giant / Ogre、Large、40尺、60尺黑暗视觉和 2024/private-homebrew 来源。\n- 巨武器四条完整保留为 `gm-assisted`；不写武器、不生成 Activity/Effect/flag、不解释“体型不超过你二级”、不判定建筑、不移动 Token、不重复已有推击。\n- 身强力壮的受擒脱困优势仅为描述性被动，不扩大成全局属性优势，也不自动移除 Grappled。\n- 5级附赠动作脱困是 2/LR、每次消费1的 Bonus Action Utility；聊天卡要求按原规则进行相应属性检定，不固定力量/敏捷/技能。\n- 食人魔刚毅使用 transfer ADD `system.attributes.hp.bonuses.level = 3`，即总等级 N 时增加 `3N` 最大生命值。\n- 食人魔笨拙使用 transfer ADD `system.attributes.ac.bonus = -2`；倒地后花费全部速度站起保持 `gm-assisted`。\n- 不添加来源未声明的 ASI、语言、触及、负重、武器熟练、徒手伤害、抗性或大型生物额外收益。\n\n## 当前验收边界\n\nV12 当前只通过静态候选层：锁定 4.3.9 模型的 Race、Size、ItemGrant、Utility Activity、itemUses、lr/sr recoverAll、Race 升级流以及 HP/AC Effect 路径有参考契约；Ogre V12 package 已逐条核对语义；两次 clean candidate build 的树、logical hash、UUID 和 ZIP 可确定重现。当前机器没有 V12 Lab，因此尚未验收 Token 2×2、真实 Add Species UI、1→5 级升级、AC/HP 运行值、次数消耗、Long Rest 或重开读回。只能声明“V12 静态候选支持”，不能声明“V12 可用”或“V12 正式支持”。\n\n自动测试继续使用 fake provider，以保持离线、确定和可重复；正式食人魔另以本机 Codex OAuth provider 完成了真实运行 `species-20260811022558-9a41c4a1`。该 run 的 deterministic report 与 AI review 均为 `accepted`，没有 repair；正式 ledger、Markdown 与 JSON 的来源/内容/logical hash 闭合。模块 build/verify 得到 1 个 race、5 个 feat，ZIP SHA-256 为 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。\n\n本地 `fvtt-v14-module-matrix` disposable world 已在 Foundry `14.364` / dnd5e `5.3.3` 中安装并启用该模块。原生 Add Species 流程确认 giant/Ogre、Large、40尺、60尺黑暗视觉和 AC 10→8；1级 Barbarian 的最大生命值为 12+3=15，5级为 40+15=55；5级附赠动作脱困连续消耗至 0/2，第三次没有生成聊天卡，Long Rest 恢复为 2/2。聊天卡明确要求手动执行原受擒检定，不选择属性/技能、不自动解除状态，并保留身强力壮优势。巨武器与“体型不超过你二级”始终是 DM 现场判断，未生成系统体型测试、武器写入、推击或 Token 移动。\n\n这仍不是无边界的 runtime Pass：本次没有完成精确 2×2 Token 放置、现有武器应用种族前后的字节级比
