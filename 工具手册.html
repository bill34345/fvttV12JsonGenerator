n历史证据限制不抹掉：r56旧测试Actor原速度UNKNOWN；个人GM日历HUD旧坐标未保存；孤立permission_viewer.migrated无时间。Scene2rQFnhlfPt5sGJ9i（叛神殿）当前读取构造会为两Item效果补十个随机system.changes._id；r95同rawserver data两次本地构造与live只差这十ID，剥副本ID后全同9f2bc26ef4ae54cae8fbf144d92e1ef065b2a67e2643b82708cbe4a4f339affa，raw GET稳定／live与集合不变／SceneWrite0。但旧r85完整Scene.before未捕获，不能补称历史全部65Scene字节原样。全部19状态动作组合／8精通逐项／多GM／长时／其它复活仪式／生产仍不属于本次接受。\n\n最终进度：[2026-10-05限定迁移记录](I:/OpenCode/fvttV12JsonGenerator-worktrees/20261003-164211-next-four-modules/docs/reviews/2026-10-05-next-four-modules-progress.md)。最终父审：[r92/r95收尾](I:/OpenCode/fvttV12JsonGenerator-worktrees/20261003-164211-next-four-modules/.local/next-four-modules-20261003/wmp6-native-hp-r75/parent-adjudication-final-readback-r92.json)。唯一当前检查点仍在该候选 .local/next-four-modules-20261003/business-resume-20261004/current-checkpoint.json；完成后dispatchAllowed=false。新增范围等待用户新请求；旧业务PASS和全部原FAIL保持，无自动继续派发。\n","docs/plans/2026-10-02-injury-condition-ownership.md":"# 伤势归入 Custom Conditions，复活功能独立保留\n\n日期：2026-10-02。基线：master `61974058f1af4e0f70fc675a0c856cae07d99a8f`。本轮候选工作树：`20261002-134635-injury-condition-ownership`。\n\n## 用户决定与完成目标\n\n用户决定把伤势作为 condition 交给 Custom Conditions，通过现有 Trigger Engine 接收生命值事件；独立复活仪式保留，之后再决定是否退役。Forge GM 工作台与 Creature Blueprint 的统一由用户另开讨论，本轮不改 Forge 产品界面。instruction-scope 经[逐项评估](../reviews/2026-10-02-instruction-scope-evaluation.md)后按后续授权[选择性实现](../reviews/2026-10-02-instruction-scope-integration.md)，保留来源回归、验权和版本底线。\n\n伤势迁移包括状态、0–3 层规则、HP 归零／恢复／满血、成功短休／长休、死亡豁免保留的自然 19／20、管理器和 HUD。Custom Conditions 不依赖复活模块才能处理伤势。复活模块只拥有消逝的灵魂状态机、仪式、快速复活锁及历史；没有 Custom Conditions 时也能继续开启新的死亡 episode 和下一次复活。\n\n## 所有权与兼容边界\n\n- 新伤势权威状态位于 `flags.fvtt-custom-conditions.injury`。旧 `flags.fvtt-injury-fading-spirits` 原件保留；后续复活写入只更新 `fadingSpirits` 子路径，不整块覆盖 flags 或删除未知字段。\n- 旧 injury 字段、已处理事务 ID 和精确识别的投影按既有规则迁移；未知 schema、重复投影或相互矛盾的数据拒绝自动改写并报告。迁移继续沿用已有 ActiveEffect ID，保留其他功能的数据。没有旧 injury 字段的新复活状态不构成损坏伤势数据。\n- 只由当前 active GM 写入；队列执行和跨模块入口重新核对权限。Actor 原生值不会被已过时的排队事件倒写。事务账本随伤势状态持久化，避免重载后重复计层。\n- HP 事件由 Trigger Engine 的通用订阅接收；休息与死亡豁免使用系统原生接口。来自其他客户端的休息请求必须以实际消息、Actor 关联、发送者和 Actor 权限证明，不能信任 payload 声称的 GM 身份。\n- 复活成功通过公开接口抑制该次恢复计层；新死亡 episode 通过公开接口通知可选的复活模块。新 Custom Conditions 不能与仍写伤势的旧复活模块形成两个所有者。\n- 迁移沿用原世界 enabled／manageNpcs 意图，不自动打开新自动化或扩大 NPC 管理范围。共享生成器的十九种 `ConditionId` 不扩展；本轮伤势属于运行时分层 condition，不宣称新增 Actor JSON 生成功能。\n- 保留首批整合候选的 `weaponEffects` 和 Trigger Engine external-event API；武器专精的既有 5.3.3 支持边界不因伤势迁移扩大。\n\n## 精确版本事实\n\n伤势代码的精确配对为 Foundry `14.364` / dnd5e `5.3.3`，以及候选 ServerNext `14.368` / `6.0.5`。用户后续明确本轮实机验收只在 Server Mirror；Next 为 OUT_OF_SCOPE，6.0.5 保持未实机验收。十九种通用 Custom Conditions 与武器效果仍限定 `14.364` / `5.3.3`。\n\n2026-10-02 从官方 releases API 核实最新稳定 6.x 为 6.0.5。精确本地来源为 reference cache：5.3.3 commit `965ad2d0cf5d063dac675ba078b5bd3c3c0dd449`，6.0.5 commit `3ee48de02f8f6f7b2638c9f6cf3e9540c9c181cc`。两版 `actor.mjs` 都在更新完成并生成原生 rest 消息后调用 `dnd5e.restCompleted`；消息关联实际 Actor，`type` 为 `rest`，`system.type` 为 `short` 或 `long`。Context7 返回的 Wiki／6.0.x 只用作导航，不能代替这两个固定来源。\n\n主线 2026-10-01 的 Next 伤势公共 API／设置恢复代表接受仍属旧所有者证据；不能直接推广为本轮迁移后的 HP、休息、自然 19／20 或仪式联合接受。\n\n精确本机 Core 14.364／14.368 的 `dist/server/sockets.mjs` 中，`handleCustomSocket` 在指定接收者和广播两条分支都把服务器当前 `this.user.id` 作为监听器第二参数发送。因此发送者验权使用该参数，不读取 payload 自报身份。文件 SHA／路径另存 `socket-provenance.json`；这项固定源码证据仍不能代替实际 GM／玩家跨客户端传输接受。\n\n## 验收出口\n\n| 层级 | 必须证明的结果 |\n| --- | --- |\n| 聚焦测试 | 伤势规则、旧数据保留／冲突拒绝、active GM 与发送者验权、重复／延迟事件、独立第二次复活、跨模块恢复抑制及旧 API 兼容 |\n| 构建与版本 | 三模块 typecheck、ZIP／manifest／实际 runtime 一致；精确版本门与 6.0.5 通用状态拒绝；图标原字节与署名匹配 |\n| 组合边界 | 保留 WMP 公开契约；更新依赖锁文件后 frozen install；手册逐项核对、生成及 check；组合后的必要集成检查 |\n| Foundry 真实行为 | 实际客户端加载候选版本；旧 injury migration、HP 归零／恢复／满血、原生休息与自然 19／20、HUD／管理器、重载防重、独立复活与联合恢复抑制 |\n| 发布 | 上述门禁闭合后再按已有明确授权集成；记录主索引和用户基线、合并结果与手册检查。未授权 push／生产写入不执行 |\n\n首次服务只读检查中 Mirror 没有 listener；Next 的一次HTTP读取失败不是零启用模块证明。之后父任务按身份门启动并管理同一个Mirror／matrix；独立Chrome执行器完成实际验收和恢复。Next全程保持本轮范围外。\n\n## 当前实际接受\n\nServer Mirror 14.364／5.3.3／matrix 的本轮代表行为、玩家和双GM、原值恢复及Foundry fixture清理均PASS。包括旧数据迁移、伤势HP／休息／保留19–20、管理器／HUD、重载、DAE空元数据清除与外部字段保留、独立两次成功复活、真实请求按钮、联合成功复活HP抑制、伪payload的服务器sender验权和玩家blind可见性。19／20及仪式20为控制输入的真实系统调用；贡献按钮17为真实自然随机，二者分开报告。\n\n最终CC runtime `d62f11a4…ab55e5`、模板 `79826f17…86f9fe`、IFS runtime `fa75368f…2cbb44`、TE runtime `bef0559c…f5ba2`在Chrome实读。原十Actor／三旧flags／两投影、原用户与模块／设置已恢复；三个Actor、一个Scene、两个User、三个Macro、23消息及四个官方Chrome拥有tab已清。正常Core审计_stats更新不伪造为旧时间。旧CU空白窗口因无法从官方Chrome确认映射，单独NOT_CLEANED；生产及长时NOT_EXECUTED，完整模式分支／并发压力未宣称通过。完整状态和证据在[整合记录](../reviews/2026-10-02-injury-condition-integration.md)。\n\n最后服务PID67592／30001仍由父任务保留运行。之后合成用户认可的首批恢复增量与规范，须重新完成组合门禁，并验证WMP与CC／TE0.2.0的实际接通；旧CI与旧WMP历史接受不自动成为新组合PASS。\n\n## 图标恢复依据\n\n`e8604d64e48b354b2954210f2959ce8cf734ecc9` 中四个伤势 SVG 均为已选定的 Game-icons Bandaged 原文件，1138 字节，SHA-256 `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1`。主线 `6197405` 恢复 Next 内容时把图标回退到旧心形／数字文件，却保留 Bandaged 的 CREDITS。本轮恢复已选定的原字节到新归属资产和旧兼容路径，保留 Lorc／CC BY 3.0 署名；层数继续由实际状态标签显示。\n\n## 准备记录\n\n首批候选的必要依赖按显式清单复制到本工作树，共 24 个文件。清单原有的 `fvtt-trigger-engine/tests/lab-owned-upgrade.test.ts` 在源候选不存在，复制报错；当时脚本末尾的 25 计数不成立。已逐项核对存在文件，未把末尾成功退出当完整复制通过，也未改动源候选。已有 frozen install 通过；模块版本改变后仍需更新并再次核对本工作树锁文件。\n\n此文是完成目标与证据边界，测试绿色或构建产物存在不单独关闭 Foundry 语义验收。最终结果及未完成层级登记在同日期的伤势整合 review 中。\n","docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md":"# FVTT 工具合集重构执行总账\n\n本文件是该计划的唯一当前进度源。[总计划](PLAN.md)说明设计，[模块索引](MODULES.md)定位子计划，子计划定义切片；已执行的事实和下一步写在这里，避免多份“最新进度”。\n\n## 当前状态\n\n- 2026-10-25 接续中：按本聊天用户授权补齐 Forge 以外模块在 ServerNext 6.0.6 的适配与验收；八个候选已安装，IFS来源metadata与House药水规范化另有定点更新。Babele两表、House药水、Monitor短会话/重载、Guard裁剪/禁用/重载及各自限定恢复已实际接受；Painter另补真实Region移动、linked falling与普通重载，精确本例清理和工具删除后读回已过，非GM仍待Role。Species食人魔原生授予、1/5级、消耗/拒绝、长休/Context、普通重载及本例精确清理现已接受；BH、IFS无CC、Resolver、Role和最终工具/文档衔接继续。原Calendar未知前像由用户选择本轮保留当前UI并记录缺口，本批尺寸键仍单列，不扩大功能设置许可。下方10月12日段保留为既有记录，本轮身份、边界与最小检查选择见文末接续段，不将旧PID或候选号当作当前证明。\n\n- 日期：2026-10-12。\n- 阶段：LOCAL_SOURCE_AND_DELIVERY_BATCH_VERIFIED_NATIVE_GATES_PENDING。H4/Deck/TE/CC/WMP既有代表链保留；IFS、TokenSync、Resolver、Chat Guard、Monitor、House、Painter、Babel fect ID 警告，仍待区分原生异步状态更新、测试操作节奏与模块联动的影响，不据此直接归因为 Custom Conditions 或伤势模块缺陷。\n\n中断时未清理的本轮对象：Actor `RiuDjZpb8JA6UDAq`、Scene `pDMFZGrI38lU282e`（Token `ZbpEOm9LB4S3aukF`）、Macro `MxFIIMTrjS5jtdM2`。场景和 IFS 来源未恢复；原始 UI 记录确认来源为 internal，enabled=true、resurrectionPrompt=true、manageNpcs=false，原场景为 landing page。后续只清理这些本轮 exact IDs 及明确新建对象。\n\n主任务确认系统于 2026-09-23 07:37 重启，不能从浏览器标签回收与服务消失的先后推断因果。原 30001 无监听后按既有授权恢复，07:49 核对 PID29200、127.0.0.1:30001、cor-cotn、14.364/5.3.3 正常。没有操作 serverNext。服务恢复证据位于本地 `evidence/condition-hud-20260923/service-recovery/`；UI 原始回传位于 `evidence/condition-hud-20260922/chrome/`。\n\n视觉修订：用户否决了首版 Luna 绘制的 SVG，认为造型过于简陋；此前 32px 可读性检查不能代表美术风格获得接受。用户明确指定 **Astra / medium** 重画，本轮以 dnd5e 原生图标为参照，重新检查白色剪影、负形、视觉重量和语义辨识。语言及伤势功能验收继续，图标美术结论单独重验。\n\nAstra / medium 已完成 19 张状态与 4 张伤势 SVG 重绘。主任务审阅代表样稿后要求消除“无助”中类似医疗十字的造型，最终整套已通过 32px／64px 联系表检查；23 张 XML／栅格化、唯一内容、精确文件集合与透明背景检查通过。这是新候选的资产检查，用户美术意见和真实 HUD 展示仍独立记录。预览与校验记录位于本地 `evidence/condition-hud-20260922/astra-icons/`。\n\n## 定位结论\n\n1. Custom Conditions 原注册只提供英文 `name` 和复用的系统图标，管理器直接使用共享契约中的英文 label；没有完整的界面语言展示层。\n2. 伤势原注册 `name=IFS.Status.Injury`，但已安装 Token Action HUD dnd5e 2.1.0 的状态构建读取 `game.i18n.localize(status.label) ?? status.name`，不会保证对 name 再做一次翻译。\n3. 同版本 HUD 的状态 tooltip 读取 `CONFIG.DND5E.conditionTypes[id].reference` 并加载系统规则文档。简单地为自定义状态加 `description` 并不能让这个 HUD 显示规则。\n4. Token Action HUD Core 2.1.1 提供 `tokenActionHudCorePreRender(hud, hudManager)` 扩展 Hook。可以仅装饰本模块拥有的 action，无须修改 HUD 源码或创建假规则文档引用。原生同 ID 状态保留原系统展示和规则。\n\n## 数据来源\n\n- 用户提供的两张 Token Action HUD 截图（2026-09-22）。\n- 仓库 Custom Conditions 的 `src/runtime.ts`、`src/manager.ts`、语言文件和共享 `packages/contracts/src/conditions.ts`。\n- 仓库 Injury & Fading Spirits 的 `src/projection.ts`、`src/runtime.ts` 及模块边界说明。\n- server-mirror 已安装 Token Action HUD dnd5e **2.1.0**：`scripts/token-action-hud-dnd5e.min.js` 的状态构建与 tooltip 路径。\n- server-mirror 已安装 Token Action HUD Core **2.1.1**：`dist/token-action-hud-core.min.mjs` 的 `tokenActionHudCorePreRender`。\n- server-mirror 精确 dnd5e **5.3.3** 与 Foundry **14.364**，不据最新版 API 推断行为。\n\n## 采用的职责划分\n\n用户确认采用：统一名称、说明、独立图标和 Custom Conditions 管理入口；伤势层数及复活历史仍以伤势模块 Actor flags 为唯一事实。复用已授权的旧伤势 HP 桥接，内部／外部来源互斥。Trigger Engine 的死亡事件提示仅邀请活动 GM 打开仪式，不能将 HP 归零当作已死亡，不能自动掷骰或代替裁定。\n\n## 待验收\n\n已完成的离线证据：Custom Conditions 的模块测试 **39 PASS / 0 FAIL / 198 assertions**，模块类型检查与构建通过。覆盖语言回退、原生状态归属、HUD 提示偏好和转义、可选伤势 API、快速加减的顺序处理及失败后队列恢复。19 张状态 SVG 与 4 张伤势 SVG 已解析并渲染 32px／64px 联系表；修正了低对比的定身等图标。以上不替代真实 HUD 的悬停与视觉验收。\n\n本轮审核发现并要求修正：对话框等待占用事件队列、关闭自动化后的提醒门禁、设置变更重新订阅、未生效死亡效果误判、缺少 revision 的重复 HP 转移，以及伤势管理器快速点击丢失层数。这些意见已通过代码复审闭环。伤势最终测试为 **77 PASS / 0 FAIL / 459 assertions**，模块类型检查与构建通过，包含延迟提示标记和 HP 恢复交错的回归。真实浏览器验收仍待执行。\n\n- [ ] 中文和英文名称／完整描述，HUD 悬停显示以及 `none` / `nameOnly` 偏好。\n- [ ] 独立 SVG 在 32px 状态栏及伤势层数图标下可辨。\n- [ ] 原生同 ID 状态未被覆盖，用户自定义名称未改写。\n- [ ] 伤势管理器通过公开 API 调整层数；关闭可选模块时入口安全隐藏。\n- [ ] 内外 HP 事件来源互斥与重复事件保护。\n- [ ] 明确死亡后只提醒活动 GM，取消提醒不改变仪式历史。\n- [ ] 原 CoTN 组合、精确临时对象清理和最终查看页。\n\n## 待判断本地化与新候选复查\n\n本次不引入新的第三方模块。截图中 `MonksLittleDetails.Status.*` 属于另一模块的翻译问题，未扩大为本次代码修复。若后续要求处理，先核对实际安装版本、语言包覆盖顺序与 key 是否缺失，再在 `docs/acceptance/foundry-v14-module-health.md` 使用相同状态口径记录；在实际 UI 验证前不能记为可用。\n\n## 候选安装\n\n已更新 server-mirror 两个本模块的静态文件，manifest 保持一致，无服务重启。安装前后清单与 SHA-256 位于本地 evidence/condition-hud-20260922。首次字节校验因 Bun 在不同 cwd 下生成的源码路径注释不同而失败；对照仅有注释路径差异后，统一使用仓库根 build 入口重建并更新，两个 verify-install 均通过。Custom Conditions 27 文件、伤势模块 10 文件。未触碰第三方模块、serverNext 或生产。\n\n伤势最终 **77 PASS / 0 FAIL / 459 assertions**，包含共享 Actor 状态队列、局部提示标记写入和交错恢复回归；先前审查意见均已闭环。手册 build/check 通过（28 项）。浏览器实测另行回传，不能把 installed bytes 验证当作运行时通过。\n\n收尾补录（2026-09-23）：服务恢复后，子任务已通过UI清理上述exact IDs，恢复landing page、暂停状态、IFS internal及原设置，留在CC Manager。主任务对比完整ID清单，77项与最早75项加CC/TE一致。bloodied警告的静态追踪支持dnd5e原生异步创建重入假设（连续await actor.update不保证派生效果已完成），尚无隔离复现，不能归为已修复。英文切换、真实悬停弹层和仪式邀请仍未完成。用户目前禁止画SVG，改为先审现成资源；候选见2026-09-23-existing-condition-icons.md，未经确认不替换。\n","docs/reviews/2026-09-22-creature-item-authoring-opportunities.md":"# 怪物、反派与物品创作研究（2026-09-22 历史归档）\n\n- 日期：2026-09-22；代码基线：`e2739f0`。\n- 范围：Archive Creature Brewer、Game Master Tools – Creating Villains and Lairs，以及能改进本项目 FVTT 模块或本地 Actor/Item creator 的相近工具。\n- 交付：功能取舍与实施建议；未购买、安装、修改产品代码或操作世界。所有外部模块的本项目运行验收均为 **NOT_EXECUTED / Untested**。\n- 原研究载体：`codex/20260922-135223-creature-authoring-research`；以下调研事实、统计与原提案均保留 2026-09-22 的时间边界。\n- 复用基准：[付费模块评估](2026-09-22-paid-module-evaluation.md)。已阅读主工作区当时的最新记录作为背景，但不修改或依赖其未提交决策文件。\n\n## 2026-10-08 归档状态\n\n本次把独有研究依据纳入主线，对照基线为 `a84d5e633a33d7738cc3f393bc72081801e4bd9e`。外部模块的版本、价格、热度和许可描述是原调查及 2026-10-07 固定来源复核的记录，未刷新为当前行情；运行状态继续为 Untested，静态来源不升级为本项目实机接受。\n\n| 原提案 | 主线归档时的状态 | 当前依据 |\n| --- | --- | --- |\n| 生物蓝图、受限能力组件、中文来源与派生差异 | 已实现；仍遵守现有严格 schema 与来源验证 | [蓝图模型](../../packages/forge-browser-runtime/src/creatureBlueprint.ts)、[编辑器](../../foundry-modules/fvtt-json-forge/src/creatureBlueprintEditor.ts) |\n| 可读 Actor 资料块、草稿与正式结果分层 | 已实现；Item 的可读创作预览不由此自动完成 | [资料块 renderer](../../foundry-modules/fvtt-json-forge/src/actorStatblock.ts)、[呈现依据](2026-09-24-dnd2024-statblock-preview-reference.md) |\n| 统一工作台、共享连接、来源改变使候选失效 | 已由后继实现保留；归档不恢复旧单窗或旧连接表单 | [工作台 host](../../foundry-modules/fvtt-json-forge/src/workspaceApplication.ts)、[Forge 说明](../../foundry-modules/fvtt-json-forge/README.zh-CN.md) |\n| Item 配方、CR/职责设计辅助、反派/巢穴、供应商批量流程 | 保留为研究提案；本次没有批准新功能排期、安装或购买 | 以下固定来源、能力边界和待判断清单 |\n\n下面的 P0/P1、产品比较和验收切片是原研究记录。蓝图和 Actor 预览不再作为待开发功能重复提出；其他建议也不因资料归档成为任务。未来复用代码或数据时，仍需对精确版本和相应许可重新判断。\n\n## 1. 原研究结论与优先级（2026-09-22）\n\n**值得吸收；重点是把已有“来源转 Actor/Item”管线向前延伸成可审阅、可复用的创作流程。** 不需要另造一套生成器，也不需要将这些模块全部装成运行依赖。\n\n| 优先级 | 可吸收能力 | 主要参考 | 建议归属 | 相对工作量判断 |\n| --- | --- | --- | --- | --- |\n| P0 | 可读 statblock / Item 预览、来源定位、修改差异 | Creature Brewer；我们现有 preview | Forge UI、可共享的预览模型 | 中；沿用已有候选生成与失效判断 |\n| P0 | 基础怪物 + 能力组件 + 变体的创作蓝图 | Creature Brewer、GMMC | 共享创作层；CLI 和 Forge 共用 | 中高；先限制组件种类 |\n| P0 | 基础物品 + 附魔/属性的确定性组合 | Item Creator | Item workflow + 目标版本适配器 | 中高；先支持少量可验证配方 |\n| P1 | CR / 战斗职责调整提案、联动差异和预算说明 | Boss Loot、GMMC、Lazy GM 资源文档 | CLI 先行，Forge 消费同一结果 | 高；复杂机制不能靠比例保证平衡 |\n| P1 | 反派多阶段设计、巢穴行动卡、配套物品/随从 | Creating Villains and Lairs | Encounter 创作与审阅层 | 设计卡中，通用运行时高 |\n| P1 | 强化现有 Item stages：分组替换、条件、阶段差异 | Item Creator；本地 stages | 现有 Item 模型/workflow | 中高；动态换装另算 |\n| P2 | 主题物品池/商人库存批量生成 | Item Creator Supplier | 本地 Item 批量工具 | 中；不扩展交易经济系统 |\n\nP0/P1 为本次判断，不是已批准开发排期。工作量仅描述相对复杂度，不是工期承诺。\n\n此前把 Creature Brewer 归为低优先，适用于“买来作为另一个编辑器”的判断；**作为交互与创作模型的参考，应提高优先级**。来源审阅与手工创作并不冲突：手工创作只要形成明确的新来源，再走现有正式管线即可。\n\n## 2. 两个指定对象的核查\n\n### 2.1 Archive Creature Brewer：最值得吸收创作方式\n\n官方包页明确列出分步创建、实时 statblock、蓝图复用/remix、traits/actions/saves/attack、传奇动作、施法、SRD 2014 + 2024 的 Feature/spell 库、公开 lore 与 GM-only lore、Actor 导出和 system adapter。[官方功能](https://foundryvtt.com/packages/archive-creature-brewer)\n\n精确公开 manifest：`3.0.0`，Foundry minimum `13` / verified `14.359`；只列 English；**必须依赖 `archive-tab` 和 `archive-brewer-core`**，不是单模块独立安装。该 manifest 没有精确 dnd5e 版本范围，不能推断 5.3.3 / 6.x 已验收。[3.0.0 manifest](https://r2.foundryvtt.com/packages-public/archive-creature-brewer/module-3.0.0.json)\n\n找到了作者公开仓库，但其 main manifest 仍为 `1.0.0` / verified `13.351`，和发行版明显不同。旧源码里的 blueprint 分为 `meta / identity / notes / stats / actions / attachments`，包含 schemaVersion、systemId、publicDescription、gmNotes；这只能说明旧实现的组织方式，**不能用来证明 3.0.0 的内部实现或完整性**。[旧 blueprint 源码](https://github.com/DamondSD/archive-creature-brewer/blob/6a1e05fc2e9a6487403906666ea73056fc85e7ae/scripts/core/blueprint.mjs)\n\n建议吸收：\n\n1. **步骤化编辑 + 即时可读预览。** 基础属性 → 防御/移动 → 能力 → 施法/传奇 → 审阅。字段变化先更新创作草稿；正式生成预览后显示 Activity、效果、资源实际产物。预览必须来自同一规范数据，避免“描述看起来对，骰子实际不同”。\n2. **能力积木。** 例如冲锋、喷吐、反击、召唤，按动作经济、触发方式、范围、资源、适用规则版本筛选。组件同时携带来源、参数与当前自动化支持程度；不能只粘贴一段描述就称为可运行。\n3. **派生蓝图。** 从一个守卫派生精英、队长、亡灵版，保留父来源与派生差异。固定的源数值保持锁定，改动形成新的 homebrew 来源。重用现有 Source Library，不另建平行收藏系统。\n4. **公开与 GM 资料分区。** 可以用于反派公开身份/秘密动机，但分区不等于权限隔离；落地时要按 Foundry 文档权限设计并用玩家账号验证。不要只依靠隐藏的界面字段。\n\n不照搬：再建一个 Actor exporter、再建一套 AI provider 配置或按中文/英文名称模糊串接 SRD 2014/2024。我们已有生成与审核管线；SRD 素材覆盖也不能证明任何特定 2024 自动化规则完整实现。\n\n### 2.2 Creating Villains and Lairs：适合转化为反派设计流程\n\n官方资料确认其内容包括反派动机、成长建议、物品增益、巢穴强化与设计文章；商城本次显示 US$6.95。[官方介绍](https://foundryvtt.com/packages/game-master-tools)、[商城](https://www.foundryvtt.store/products/game-master-tools)\n\n对“纯文章/表格”要补充：`1.0.3` manifest 声明 **JournalEntry、Actor、Item、RollTable 四种 pack**；未声明 `scripts` / `esmodules`。因此它是包含结构化内容的工具包，但没有证据支持把它描述为独立自动化引擎。未读取付费 pack，条目数与各 Actor/Item 的完整性未知。[1.0.3 manifest](https://r2.foundryvtt.com/packages-public/game-master-tools/module-1.0.3.json)\n\n建议将下面的设计流程做成我们自己的功能；这些是本次产品提案，不是声称原模块已有对应按钮：\n\n- **反派设计卡**：目标、表面动机、隐秘动机、资源、弱点、撤退条件、可谈判条件。生成时把剧情信息与机械数据分开，缺省不替 GM 决定剧情。\n- **成长版本**：初遇、再次交锋、最终战分别关联 Actor、能力和物品版本；阶段转换先由 GM 选择，产物默认是独立 Actor，不自动覆盖在场 Token 的 HP/资源。\n- **巢穴行动卡**：触发时机、可选目标、范围、豁免、伤害、持续时间、地形联动、GM 步骤。先交付可用卡片及原生 Activity；任意先攻点、跨回合效果和场景联动属于后续运行时能力。\n- **遭遇组合**：反派 + 随从 + 特殊物品 + 巢穴卡，连接现有 Forge Encounter。不要把“已有召唤物包”误写成“已经支持通用巢穴”。\n\n它最有价值的是逼创作者回答“反派如何变化、玩家可以如何应对”。不建议把付费文章整体翻译进仓库，也不建议先建一个只展示随机动机表的新模块。\n\n## 3. 相近候选与具体吸收点\n\n### 3.1 Item Creator (DnD 5e) — Item 方向首选参考\n\n作者 Hammer。公开页描述了类型 → 基础 Item → 增强 → 授予效果 → 法术/资源 → 描述 → 审阅；已有物品可重新编辑；原生字段与需要模块的动态效果分层；还有成长阶段、Scroll Factory、Supplier、Materialization Core。[包页](https://foundryvtt.com/packages/dnd5e-item-creator)\n\n包页最高列出 `v0.6.1`，但本次 GitHub release/manifest 实际为 **`0.7.7b1`**，发布于 2026-09-10；标签带 b1，不能仅因 GitHub 未标 prerelease 就当成稳定性保证。manifest：Foundry minimum `14` / verified `14.365`；dnd5e **minimum = verified = maximum = `5.3.3`**；English。[仓库](https://github.com/hammer-PvP/DnD-5e-Item-Creator)、[release](https://github.com/hammer-PvP/DnD-5e-Item-Creator/releases/tag/v0.7.7b1)\n\n源码已核对到：\n\n- `materialization/index.mjs` 识别 enchant Activity / enchantment effect，将模板应用于基础 Item，并检查临时结果；recipe registry 是原生流程不足时的确定性补充，不是让 AI 自由填写最终 JSON。\n- `recipes.mjs` 为物品族记录 schemaVersion、适用类型/类别、变体与输出验证。例如护甲类型限制与基础物品选择分别处理。\n- `selectProgressionTier()` 按角色等级与 tier 顺序选择最高合格项，避免同组成长无意叠加。\n- Scroll Factory 调用原生 `createScrollFromSpell`，而不是自己猜卷轴字段；这不证明同一函数可直接用于无 Foundry 的 Node/Bun CLI。\n\n[Materialization 源码](https://github.com/hammer-PvP/DnD-5e-Item-Creator/blob/04c28e5a1a606377c2d905b61caaed56c6820267/scripts/core/materialization/index.mjs)、[配方](https://github.com/hammer-PvP/DnD-5e-Item-Creator/blob/04c28e5a1a606377c2d905b61caaed56c6820267/scripts/core/materialization/recipes.mjs)、[阶段选择](https://github.com/hammer-PvP/DnD-5e-Item-Creator/blob/04c28e5a1a606377c2d905b61caaed56c6820267/scripts/services/level-progression.mjs)、[卷轴工厂](https://github.com/hammer-PvP/DnD-5e-Item-Creator/blob/04c28e5a1a606377c2d905b61caaed56c6820267/scripts/apps/scroll-factory-app.mjs)\n\n最值得用于本地 creator 的增量：\n\n| 能力 | 用户可见价值 | 本项目做法 |\n| --- | --- | --- |\n| 基础物品 + 属性组合 | “长剑 + 火焰伤害 + 每日次数”不再每次写完整物品 | 可验证 recipe 先生成规范来源/IR，再交正式 workflow |\n| 物品自身 / 持有者效果区分 | 不把“这把剑 +1”误写为所有武器 +1 | 编辑与审核显式显示作用域、装备/同调条件 |\n| 机制说明与叙事文本分区 | 改充能不遗漏说明文字；保留用户风味文案 | 机制说明从结构数据渲染，用户段落独立保留 |\n| 分组阶段替换 | +1 → +2 是替换，不是错误累计到 +3 | 扩展现有 Item stages，而非重新实现分阶段输出 |\n| 模板落成具体 Item | “某种抗性护甲”必须选护甲和抗性才成为完整装备 | 未填必要参数阻止完成；源身份/版本明确 |\n| 法术转卷轴 | 少写一份易错数据 | FVTT 端可研究原生工厂；CLI 端另做锁定版本适配及语义对照 |\n\n运行时 Triggered Effects、资源重算、等级动态换装和全套商店不是第一期：前者与自有 Trigger Engine/Custom Conditions 接壤，需要统一事件与效果生命周期。静态 Item 可移植性与可选运行时增强应分别交付。\n\n### 3.2 Boss Loot Monster Tools — 缩放预览的最佳直接参考\n\n免费；官方列出 CR 调整、攻防/多重攻击/先攻缩放、预览、恢复原 CR、Token 另存 Actor、可导入导出的 Guidelines Table、同 Actor 多 Token 更新。[包页](https://foundryvtt.com/packages/boss-loot-monster-tools)\n\n`1.0.0` release 为 2026-08-18；manifest minimum Foundry `13` / verified `14`，没有精确 dnd5e 范围；包含 `zh-CN`。包页更新时间与 release 时间不同，分别记录。[release](https://github.com/boss-loot/boss-loot-monster-tools/releases/tag/1.0.0)\n\n**源码边界很重要**：`addMultiattack()` 导入或修改 Multiattack Item 的说明，不能据此称为完整攻击序列自动执行；`scaleDamageDiceOnItems()` 明确跳过 spell Item。因而施法怪、充能爆发和不同攻击替代关系不能被“任意怪物一键平衡”的表述掩盖。中文文件将 DPR 写为“每秒伤害”，也说明有中文文件不等于术语验收。[缩放源码](https://github.com/boss-loot/boss-loot-monster-tools/blob/79a65cbdbdb17f51f000189fb8c746513ab792b3/scripts/actor-updates.js)、[中文资源](https://github.com/boss-loot/boss-loot-monster-tools/blob/79a65cbdbdb17f51f000189fb8c746513ab792b3/lang/zh-CN.json)\n\n建议我们做 **“调整提案 → 联动差异 → 新来源 → 重新生成”**：显示 HP、AC、命中、DC、单次伤害、攻击次数和资源哪些改了、哪些没有改；锁定不想变的字段。CLI 可批量生成同一敌人的多个强度版本。数值缩放不应偷偷覆盖导入来源，也不应默认改场上战斗状态。\n\n其原地恢复依靠模块 flags 内的原始数据；本项目不采用这套复制/恢复方式，而是保留既有来源身份及派生变更，使用现有 create-only 路径。\n\n### 3.3 Giffyglyph's 5e Monster Maker Continued — 职责与能力参数化\n\n当前 fork 支持四种 rank（minion、standard、elite、paragon）、六种战斗 role（controller、defender、lurker、skirmisher、striker、supporter）、等级缩放、可缩放 Action 和 shortcode。勿把旧版宣传中的七个 role 当成当前 fork 的六个。[当前说明](https://github.com/Skyl3lazer/giffyglyph-monster-maker-continued/blob/79e7cb3d54f22da2eb9a1339000e1d2e40577a01/docs/README.md)\n\n`2.0.1.5` release 为 2026-09-12；manifest Foundry minimum `13.347` / verified `14.365`，dnd5e minimum `5.3.2` / verified & maximum `5.3.3`；必须依赖 lib-wrapper；English。**不能直接用于 server-next dnd5e 6.x**。[manifest](https://github.com/Skyl3lazer/giffyglyph-monster-maker-continued/blob/79e7cb3d54f22da2eb9a1339000e1d2e40577a01/module.json)\n\n可吸收的是“这只怪在战斗中干什么”的模板轴，而非只有 CR：同样强度下，守卫重防御，突击者重机动/爆发，支援者增强盟友。能力参数（攻击/豁免/伤害/次数）绑定统一设计数据。我们的产物应编译成确定的原生数据，不要求最终 Actor 持有该模块 shortcode 才能工作。\n\n该设计是第三方怪物构建体系，不等于官方 CR 规则；其新状态与自有条件系统还可能同名异义，因此不整体引入十八种状态。README 明确提示 scalar 与 vanilla Action 来回切换不会同步另一边修改，值得在我们自己的派生/编辑设计中避免。[模块说明](https://foundryvtt.com/packages/giffyglyph-monster-maker-continued)\n\n### 3.4 Lazy Monster Builder / Lazy GM 资源文档 — 取数据参考，不迁移旧模块\n\nLazy Monster Builder 官方包页仍为 `0.2.4` / Foundry `11`，一年以上未更新；不建议作为 v14 安装候选。[包页](https://foundryvtt.com/packages/lazy-monster-builder)\n\n更有价值的是上游 **The Lazy GM's 5e Monster Builder Resource Document**：包含 CR 数值基准、怪物职责、Boss/杂兵和遭遇检查清单，且该资源文档明确使用 **CC BY 4.0**。可作为我们未来明确署名、独立命名的自制怪物 preset 数据源，不能标成“官方 2024 CR 算法”。[作者发布的资源文档](https://slyflourish.com/lazy_5e_monster_building_resource_document.html)\n\n不要把 Sly Flourish 普通文章上的 CC BY-NC 与这份资源文档的 CC BY 混淆，也不要把 Boss Loot 实现的许可证当作这份上游数据的许可证。\n\n### 3.5 其他筛选结果\n\n| 对象 | 有用之处 | 结论 |\n| --- | --- | --- |\n| [Monstershuffler](https://www.monstershuffler.com/) | race/class/template 组合、参数表达式、NPC 派生、CR 编辑 | 网站级设计补充；其官方说明警告切换模板会替换已编辑统计/动作。我们应提供字段锁定和差异审阅；不是已验证的 Foundry 导出适配器 |\n| [PF1 Magic Item Generator](https://github.com/websterguy/pf1-magic-item-gen) | 基础武器/护甲 + 材质/附魔选择，派生价格等字段 | 跨系统参考；其 README 明说特殊能力只加入说明，不自动实现。不能搬 PF1 价格/加值规则到 dnd5e；2025-08 后未更新，低优先 |\n| [D&D Item Auto Maker](https://foundryvtt.com/packages/DnDItemMaker) | 自然语言造 Item、历史重放/修订、JSON 导出 | 与现有 AI Item Intake 重叠较多；包页只 verified 13。保留历史修订 UX 作为旁证，不为它重建 AI 管线 |\n\nTheRipper93 等大热综合模块只作对照：本项目已有相关评估，本次不重复展开，也不因流行度提升其优先级。\n\n## 4. 热度、版本与证据强度\n\n指定的两家作者 494 / 879 patrons 是用户提供及既有记录的快照，本次未刷新，不当作实时订阅人数。新候选使用 GitHub API 的 stars 与 release ZIP download_count 作为可量化代理信号；**下载包含升级和重复下载，不等于安装数或活跃用户**。\n\n| 新候选 | Stars | Release ZIP 累计下载 | 计数范围 | 归类 |\n| --- | ---: | ---: | --- | --- |\n| Boss Loot Monster Tools | 0 | 783 | API 返回全部 1 个 release 的 ZIP | 小众、有一定分发 |\n| Item Creator | 0 | 984 | API 返回全部 62 个 release 的 ZIP | 小众、有一定分发 |\n| GMMC Continued | 8 | 1,391 | API 返回全部 27 个 release 的 ZIP | 小众、有一定分发 |\n\n这些都不是“数百 stars 的热门模块”。按本次采样的发布包计数，500–5,000 仅作为小众候选内部的中等分发档，不与 Patreon 300–1,000 patrons 等同。没有足够依据声称它们是整个 Foundry 生态的中等活跃度模块；纳入理由是功能贴合度，不虚构热度。\n\n计数入口：[Boss Loot API](https://api.github.com/repos/boss-loot/boss-loot-monster-tools/releases?per_page=100)、[Item Creator API](https://api.github.com/repos/hammer-PvP/DnD-5e-Item-Creator/releases?per_page=100)、[GMMC API](https://api.github.com/repos/Skyl3lazer/giffyglyph-monster-maker-continued/releases?per_page=100)。统计日期均为 2026-09-22。\n\n证据层次：官方产品页证明作者宣称的功能；manifest 证明版本/语言/pack 声明；源码证明检查到的路径；均不替代本地语义验收。包页的 Supported Game Systems 中显示“dnd5e 6.0.3”是系统目录当前版本，**不能覆盖模块 manifest 的 5.3.3 上限**。\n\n## 5. 2026-09-22 的本地产品比较\n\n本节记录当时的实现基线。现行蓝图、Actor 资料块和统一工作台以本文件的归档状态及当前 owner 为准。\n\n| 本地已核对能力 | 文件证据 | 本次新增建议 |\n| --- | --- | --- |\n| Actor/Item 生成、accepted-only、create-only、readback、Source Library、Collection/Queue | [Forge README](../../foundry-modules/fvtt-json-forge/README.zh-CN.md)、[sourceLibrary.ts](../../packages/forge-browser-runtime/src/sourceLibrary.ts) | 不重复建设存储/生成入口；在来源之前加入蓝图组合与派生 |\n| 当时 Actor preview 以 `JSON.stringify(buildSafePreview(...))` 显示；现行已采用可读资料块 | [application.ts](../../foundry-modules/fvtt-json-forge/src/application.ts)、[模板](../../foundry-modules/fvtt-json-forge/src/templates/forge-actor.hbs) | 可读 statblock、字段到来源的定位、变更对照；不是声称项目完全无预览 |\n| 锁定版本法术 catalog、identifier/name 双重一致解析 | [v14SpellCatalog.ts](../../packages/forge-browser-runtime/src/adapters/v14SpellCatalog.ts) | 在已有解析之上加用户可选能力/法术组件库；不另做模糊法术查找 |\n| 原生 Item 属性、稀有度、同调、uses、stages | [item.ts](../../packages/models/src/item.ts)、[itemGenerationWorkflow.ts](../../packages/workflows/src/itemGenerationWorkflow.ts) | 配方组合、替换组、阶段差异及明确触发条件；已有阶段输出不是动态装备升级 |\n| stage 展开与 sourceMechanicsPresent / needs_review 诊断 | 同上 `expandParsedItemStages()` | 继续用此能力做静态成长物品。不能把未结构化阶段直接升级为 accepted |\n| 2–6 生物战斗包与有界固定自动化 | [战斗包指南](../../tools/forge-encounter/README.md)、[capabilities](../../packages/intake-ai/src/encounter-capabilities.ts) | 反派/巢穴设计面板、额外事件类型与新组件需要分别实现 |\n| Trigger Engine：Actor 更新、回合开始、回合结束、active GM、队列与因果链 | [Trigger Engine README](../../foundry-modules/fvtt-trigger-engine/README.zh-CN.md) | 可作为未来巢穴/阶段运行时基础；没有证据称任意 initiative=20 巢穴调度已存在 |\n| CLI 已有 monster/item Intake、resume、dry-run、版本/profile 选择 | [CLI](../../apps/cli/src/main.ts) | 新增创作提案、recipe/variant 批量展开、预览报告能力；本报告没有新增可执行命令 |\n\n这里的“未有”只针对检查到的产品入口与公开 workflow，不把关键字搜索无结果当作全仓数学证明。\n\n## 6. 建议的产品路径与验收目标\n\n### A. 先做共享创作数据，再做多个入口\n\n建议的流程（设计提案）：\n\n```text\n作者填写蓝图 / 选择组件 / 提交派生变更\n  → 确定性展开成新来源（保留父来源、选择与参数）\n  → 现有 parser / workflow / generation / verifier\n  → 可读 Actor/Item 预览 + 机制差异 + 待裁决项\n  → CLI 正式 artifact / Forge accepted-only create\n```\n\n“忠实转换”与“homebrew 创作”应有明确模式：转换不主动平衡或补规则；创作的修改记录成为新来源。外部来源、用户创作、算法建议分开记录，绝不把原创数值伪造成原文引文。\n\n共享创作层负责确定性 recipe、组件版本、参数、冲突诊断；CLI 负责文件/批量；Forge 负责交互、世界引用与导入。最终 JSON 仍由已有 workflow 生成。用户安装第三方运行模块与 core 输出可移植性是两件事，不能仅因模块存在 flags 就一概否决其设计。\n\n蓝图最少记录：schemaVersion、父来源身份/hash、规则版次、组件 id/version、参数、锁定字段、显式覆盖、目标版本/profile。蓝图不是最终 Actor JSON 的副本；未知条件不得悄悄简化。\n\n### B. 第一批可验收的切片\n\n1. **一只基础守卫 → 三个明确派生版本**：固定来源字段不变；新增能力都有来源/作者选择；重复展开一致；预览数值、攻击骰、资源与最终 Actor 一致。\n2. **三到五种能力组件**：先选原生 attack/save/uses 可表达的类型；分类显示“原生可用 / 需固定运行能力 / GM 操作”。组件文字与可执行机制分别验收。\n3. **一个基础物品 → 三种组合**：局部武器加值与 Actor 加值不得混淆；同调、次数恢复、替代 Activity、描述同步都核对。非法基础物品组合必须有明确诊断。\n4. **现有分阶段物品增强**：验证同组替换、跨组累积；不存在“重复展开导致 +1/+2/+3 一起叠加”。先交付静态阶段，不顺便承诺运行时自动升级。\n5. **CLI / Forge 一致性**：同一来源、参数、组件库版本和目标产生相同机械结果；UI 修改后旧候选失效；失败不进入正式 output。\n\n### C. 第二批：数值设计辅助与反派/巢穴\n\nCR preset 明示来源与算法版本。显示基础 DPR、攻击次数、DC、范围命中人数假设、充能与传奇动作预算；若采用多回合估算，必须由用户看到假设。控制、召唤、免疫、飞行/地形优势单列风险，不能给出“保证平衡”的绿灯。不要为了实现这一步先建设完整战斗模拟器。\n\n巢穴先生成设计卡和手动可执行 Activity；新增运行时之后才验收指定先攻点、来源死亡/离场、停用与刷新、单次执行、多人 GM、Token 与 Actor 区别。使用现有 Trigger Engine 的适用事件，缺的事件明确扩展，不硬塞成“反派自己回合开始”。\n\n## 7. 代码与内容复用边界\n\n- Item Creator 的仓库 [LICENSE](https://github.com/hammer-PvP/DnD-5e-Item-Creator/blob/04c28e5a1a606377c2d905b61caaed56c6820267/LICENSE) 为 MIT，是可以进一步评估代码复用的对象；需要保留其声明，且其代码许可证不自动涵盖玩家安装的商业 compendium 内容。\n- Boss Loot 仓库 [LICENSE](https://github.com/boss-loot/boss-loot-monster-tools/blob/79a65cbdbdb17f51f000189fb8c746513ab792b3/LICENSE) 为 CC BY-NC-SA 4.0；功能思路可参考，本报告不建议直接复制其实现进未明确发行方式的项目。\n- GMMC API 未识别出标准代码 license，README 只链接 Foundry 模块开发许可；不把“公开仓库”写成“可任意复制”。优先独立设计职责/缩放结构；数据/代码复用前另核实具体授权。\n- Creature Brewer 旧公开源码与商业新版本不同；Creating Villains and Lairs 付费正文未读取。本次只从公开功能与 manifest 提炼产品方向，不声称已审计其付费内容。\n- Lazy GM 的专门资源文档明确 CC BY 4.0，若纳入数据应保留其要求的署名与改动说明，单独标明这是第三方创作 preset。\n\n## 8. 待判断本地化清单与后续复查\n\n这里的“本地化”同时区分纳入本地 Lab、中文化和独立实现。状态遵循 [module health](../acceptance/foundry-v14-module-health.md)：未做运行验收不升为可用。此次不改既有健康矩阵。\n\n- [ ] Creature Brewer：如需交互实测，取得合法 3.0.0 及两个依赖；核对精确 dnd5e 目标、离线启动与 GM lore 权限。当前建议功能参考优先，购买决定未作。\n- [ ] Creating Villains and Lairs：如需借鉴具体表格组织，先取得内容；核对 pack 内条目与语义。本次只设计独立反派/巢穴流程。\n- [ ] Item Creator：优先深入小范围 materialization / tier 模型；中文界面需自建。直接安装暂受 dnd5e 5.3.3 上限限制，6.x 需另评。\n- [ ] Boss Loot：可作为缩放 A/B 对照候选；已含中文，但需修正 DPR 等术语并核实翻译覆盖。施法/多重攻击边界单独验收。\n- [ ] GMMC：职责与能力参数化参考；如装 Lab 仅精确目标候选，6.x 当前不适用；不同时导入同名自定义状态。\n- [ ] Lazy GM 资源文档：若选择作为可复用 preset，固定版本、署名、中文术语表和数值 fixture；不移植停在 v11 的模块。\n- [x] 第一期方向已由后继实现确定并完成 Actor 蓝图与可读预览；Item 配方保持研究提案，不重复启动 Actor 蓝图开发。\n\n新候选复查顺序：\n\n1. 先读本报告与原付费评估，避免重新收集已评估对象。\n2. 核对官方功能、发布包和源码是否同一版本；不能用 latest URL 掩盖版本漂移。\n3. 读取 manifest 的 Foundry/dnd5e 范围与依赖；区分 14.364/5.3.3 和 server-next，不擅自升级环境。\n4. 检查一个核心功能真实代码路径，分清描述、原生数据和运行模块依赖。\n5. 用 patrons、安装份额或 release 下载等可追溯信号描述热度，注明单位与局限。\n6. 查语言、内容来源与具体 license；公共仓库不代表商业内容可复用。\n7. 对照本地 owner，列出真正增量、冲突面与最小语义样本。\n8. 若之后获准安装/实现，再做 Lab 行为、来源、多人及停用后的检查，更新健康矩阵与适用手册；未跑保留 Untested。\n\n## 9. 原调研与检查记录（2026-09-22）\n\n- 使用 AnySearch 公共检索/正文抽取；已发现 gaming 垂直域仅覆盖电竞/Steam，code.snippet 结果不相关，后续使用普通公共检索。没有将搜索摘要当作最终功能证据。\n- 用 GitHub 官方 API/原始文件补核 release、下载计数、manifest、license 及上列源码；未访问账号私有数据。\n- 已只读核对当前本地 Forge、CLI、Item stages、法术解析及 Encounter/Trigger Engine 的对应路径。\n- 文档检查 **PASS**：13 个相对链接全部存在，233 行文档无行尾空白，代码围栏成对，`git diff --check` 通过；worktree 只新增本报告，主工作区仍为开始时的三个既有改动路径。\n- **NOT_EXECUTED**：付费包运行、交互视觉验收、Foundry 安装、dnd5e 6.x 迁移、实际战斗平衡、多人/长时测试。本任务为研究文档，不跑与结果无关的全仓测试。\n","docs/reviews/2026-09-23-condition-tooltip-native-layout.md":"# CoTN 自定义状态与伤势悬停卡视觉对齐\n\n日期：2026-09-23。目标环境：server-mirror 的 `cor-cotn`，Foundry 14.364 / dnd5e 5.3.3，Token Action HUD Core 2.1.1 / DnD5e 2.1.0。\n\n## 截图问题与分层结论\n\n用户对照的原生“受擒 Grappled”悬停卡是浅色规则卡：标题靠左、状态类别在右、正文在下。此前 Custom Conditions“无助”卡则是黑色效果面板，64px 图标居中、标题下移，底部重复“无助”，正文夹有未译的 `Critical Hit`。**这项视觉效果在此前组合验收中没有通过**；名称/描述存在和 DOM tooltip 配置通过，不能代替规则卡外观验收。\n\n本地精确版本的 dnd5e 模板 `Data/systems/dnd5e/templates/journal/page-rule-tooltip.hbs` 使用 `content → header(h2 + pill.condition) → description`。同版本 `dnd5e.css` 的 `.effect-tooltip` 将提示框固定为300px、图标64px且居中；`.rule-tooltip` 则限制最大450px并分开左右标题/类别。TAH DnD5e 对有规则文档引用的原生状态使用 `rule-tooltip`；本模块没有伪造系统规则文档，而是在已有 `tokenActionHudCorePreRender` 扩展入口中提供自有说明。\n\nFoundry 14 的 TooltipManager 默认添加 `theme-dark`，原生 dnd5e 富提示渲染另行移除该类。本模块直接提供 HTML，追加 `theme-light` 不保证清掉黑底。因此两个模块各自使用限于自有 tooltip 标记类的纸纹、金色边框和深色文字变量；不修改 Foundry、dnd5e 或第三方 TAH 的源码和全局样式。\n\n## 候选变更与权限边界\n\nCustom Conditions 的完整提示改为同一规则卡结构：中英双语标题（仅翻译不同的语言下并列）、本地化状态类别、已转义正文及可选骰式。提示框内不再重复状态名或放大状态图标；图标仍显示在 HUD 按钮。中文说明中的 `Action`、`Bonus Action`、`Reaction`、`Critical Hit`、`Speed`、`weapon attack` 改用与本地 dnd5e 中文术语一致的表达，保持原规则含义。伤势模块的完整提示采用相同标题/类别/正文结构；原有伤势层数事实和 HUD 角标不变。两模块仍尊重 TAH 的 `full`、`nameOnly`、`none` 设置。\n\n候选只修改当前开发 worktree 中的两个自有模块、各自聚焦测试及同步文档。本地 `cor-cotn` 的运行中世界 LevelDB、真实角色、其他模组、serverNext 30002 和生产均不属于此视觉修订的改动范围。现成 SVG 的选型、许可与包内署名见 [现成状态图标选型](2026-09-23-existing-condition-icons.md)，这次没有新绘制或替换图标。\n\n## 验收状态与复查\n\n聚焦测试已核对规则卡类与层级、无提示框大图标/重复名称、中文及英文、HTML 转义、骰式与角标、三个 tooltip 模式。Custom Conditions **56 PASS / 0 FAIL**，伤势模块 **81 PASS / 0 FAIL**；模块类型检查、两个模块构建及 `git diff --check` 通过。Astra 只读复审指出残留 `theme-dark` 会使状态 pill 成为深底深字；已在 Custom Conditions 的专属 marker CSS 中补浅色卡底与 pill 边框变量，复查后无剩余源码阻断项。这些结果不替代真实视觉。\n\n安装前再次核对30001 PID32196、`--dataPath=F:\\FoundryLab\\foundry-v14\\data\\server-mirror`、`cor-cotn`、Foundry14.364/dnd5e5.3.3及独立30002。按相同 manifest 和逐文件哈希，仅更新两个自有模块：Custom Conditions的 `lang/zh-CN.json`、`scripts/index.js`、`styles/custom-conditions.css`；伤势模块的 `scripts/index.js`、`styles/module.css`。预览和前后SHA-256见 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/update-preview.json` 与 `update-verified.json`。两个 `verify-install` 均通过；30001仍常驻CoTN，没有改LevelDB、重启服务、创建备份或触碰30002。\n\n两次独立 Chrome 预检因服务短时离线和连接状态变化未执行视觉项，原始阻塞记录保留在 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/`。主任务核对数据目录没有活进程或监听后，以原 Node24.17.0、Foundry14.364和连续的`--dataPath=F:\\FoundryLab\\foundry-v14\\data\\server-mirror`恢复常驻30001；启动及校验见同目录 `service-recovery-20260923-145202/launch.json`、`verified.json`。没有触碰30002。\n\n恢复后的 GPT-6 Luna 独立 Chrome 任务在真实CoTN的77项启用模组组合中完成**视觉 PASS_WITH_LIMITS**。原生 Grappled、自定义 Helpless、伤势三张卡均是浅色纸纹、左标题右状态标签、深色正文、2px金边，且提示框内图标数均为0。三者的背景为`rgb(241,235,232)`并加载dnd5e的`texture-gray1.webp`/`texture-gray2.webp`；正文为`rgb(25,24,19)`，正文对纸张计算对比度15.06:1，标签文字对底色16.25:1。Helpless显示“无助 Helpless”与“任何命中你的攻击均视为重击。”，不再夹原来的`Critical Hit`。首轮伤势卡正文仍含`episode`，这是随后单独处理的中文文案缺口，不能把首轮截图说成已汉化。完整/仅名称/无提示三档经UI切换并恢复`full/1500ms`；伤势2/3、Jinxed4、Valor6角标在实际HUD仍可见。测试Actor`ZKA7fkMG357hnKZa`及Token`K79FBgnaaMoKKejT`已通过Foundry UI清理，返回暂停的`landing page`；30001保持常驻，中文与IFS internal/已启用/复活提示开/管理NPC关及77项组合保留。\n\n证据文件：`F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/recovered-visual-20260923-154230.md`及同名JSON。截图仅在外部Chrome任务的CUA会话内联，工具没有提供本地截图保存接口；报告保留了DOM类名、计算样式、尺寸、文本和清理ID。纯移动鼠标、不点击的独立悬停动作仍是 **NOT_EXECUTED**；该工具没有单独的pointer-move操作，点击后指针停留产生的可见规则卡作为视觉证据单独记录。\n\n中文文案收尾：仅将伤势状态说明中的两处 `episode` 译为“伤势过程/这一过程”，不改变状态机或其他文字。伤势模块聚焦测试现为 **82 PASS / 0 FAIL**，含读取真实中文语言包并检查触发与恢复语义的回归；类型检查和构建通过。确认server-mirror仍是PID13956/CoTN后，只更新伤势模块 `lang/zh-CN.json`，Custom Conditions逐文件哈希不变；预览与前后哈希见 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/injury-copy-20260923-154723/update-preview.json` 和 `update-verified.json`，两模块 `verify-install` 均通过。后续同一GPT-6 Luna外部Chrome任务重载CoTN，在真实TAH伤势动作的完整 tooltip payload 中读到“开启一次伤势过程；在这一过程中恢复到正生命值会增加1层伤势”、类别“状态”和0/3角标，没有`episode`；服务、中文、77项组合、IFS internal及TAH full/1500ms保持，页面留在暂停的`landing page`。证据为 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/injury-copy-followup-20260923-160015.md` 及同名JSON。此次窄范围文案读回没有新拍悬停卡截图，纸纹外观仍依据前一轮真实视觉证据，不能把DOM payload读回当成一张新的视觉截图。\n\n新候选复查：先核对锁定版本的系统模板、CSS、TooltipManager 与 TAH 扩展接口；若系统升级，重新比较真实渲染和类名，不能凭当前版本的静态检查推断兼容。本文不评价新的第三方模块或本地化候选；模块健康状态继续以 `docs/acceptance/foundry-v14-module-health.md` 的实际运行证据为准。\n","docs/reviews/2026-09-23-cotn-burning-hud.md":"# CoTN 中 Token Action HUD 的 Burning 显示核查\n\n> 2026-09-24 勘误：本页记录的是 **dnd5e 原生 `burning`** 的历史现场核查。用户所说的「自定义 Burning 没有 HUD 入口」指带骰式和伤害类型的 Custom Conditions Burning；原生按钮可见并未解决该问题。新候选设计见[自定义 Burning HUD 记录](2026-09-24-custom-burning-hud.md)。以下 PASS 仅属于原生按钮，不能用于新入口的视觉或功能验收。\n\n日期：2026-09-23。目标：server-mirror 的 `cor-cotn`「溟渊的呼唤」，Foundry 14.364 / dnd5e 5.3.3，端口 30001。证据为独立外部 Chrome 任务的现场记录：`F:/FoundryLab/foundry-v14/evidence/condition-burning-hud-20260923/chrome/report.md`、`dom-observations.json`；截图保存在该任务的 CUA 记录中，未导出成单独 PNG。\n\n## 结论与操作\n\n所选 Token「卡勒姆·维雷」的 Token Action HUD **有原生** Burning 按钮。鼠标离开 HUD 时动作区隐藏；在 HUD 上打开「效应」组后，系统状态子组中可见唯一 `actionId=burning`、名称「燃烧」的按钮。检查时它没有隐藏祖先、未被视口裁切，页面保留「效应」展开状态供人工查看。这项观察只说明原生按钮在该 Token 上存在；不能由此推断用户要找的参数化「灼烧」入口已经存在。\n\n该按钮的图标是 dnd5e 的 `systems/dnd5e/icons/svg/statuses/burning.svg`，tooltip 指向 dnd5e Compendium 规则项。这是原生 Burning 控件；点它不能等同于施加带骰式和伤害类型参数的 Custom Conditions Burning 实例。后者仍须通过本模块管理器或其公开 API 操作。\n\n## 已执行与边界\n\n- **PASS**：浏览器当前为 Gamemaster，30001 指向预期 `server-mirror`、`cor-cotn`；`/api/status` 报告 Foundry 14.364、dnd5e 5.3.3。Token Action HUD Core manifest 为 2.1.1。\n- **PASS**：所选 Token 的「效应」组内有唯一 Burning 按钮，按钮启用且完整落在当前视口内；打开该组后可见。\n- **NOT_EXECUTED**：没有点击 Burning、施加状态或测试结算与重载持久性；没有修改 Actor、Token、布局或模块配置。\n- **NOT_EXECUTED**：浏览器只读 evaluator 不能访问实时 `window.game`、`CONFIG`、`localStorage`，因此未直接读到 `CONFIG.statusEffects` 归属或该用户持久化的 TAH `userSelected` 字段。已渲染的按钮只证明这个 Token 当前有效 HUD 布局包含 Burning，不证明其他 Token 的布局相同。\n- **NOT_EXECUTED**：已有 Gamemaster 会话，无需重新走 `/join` 登录。没有触碰 30002。\n\n若另一个 Token 在已展开的「效应」组里仍缺 Burning，应先检查那个 Actor 的 TAH 布局项 `burning`；不要把本例推论成所有 Token 均正常，也不要为单个布局缺项改变状态所有权或全局冲突逻辑。\n\n## 再次定位给用户查看\n\n同日另一轮外部 Chrome 在现有 Token「秋」上再次找到原生「燃烧」按钮。选中 Token 后打开 Token Action HUD 的「效应」组，在「状态」网格第二行，它位于「目盲」右侧、「魅惑」左侧；没有点击或施加该状态。页面最终停在这一展开位置，30001 仍为 `cor-cotn`，77 个启用模组的数量未变。\n\n原始 CUA 截图已从该轮完成的任务记录中按原字节提取为 `F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260923/chrome-frozen-followup/burning-hud-final.jpg`，来源行号、SHA-256 和未修改字节的记录见同目录 `screenshot-provenance.json`。这张图证明所选 Token 的原生按钮可见，不证明自定义 Burning 的参数化 HUD 入口存在。用户要求不重复做已测功能，因此本轮只展示 HUD；Frozen 五段新版提示在这轮 Chrome 工具中没有可靠悬停/DOM 读取路径，仍标为 **NOT_EXECUTED**，不借静态测试冒充视觉通过。\n","docs/reviews/2026-09-23-drakkenheim-condition-wording.md":"# Drakkenheim 自定义状态文案核对（2026-09-23）\n\n> 后续变更：2026-09-24 起，本项目按用户决定把自定义 Dazed 改为「自主移动／动作／附赠动作三选一」，Shocked 继承该规则。本页记录的是当时的 Beta 文本与旧实现对照；当前规则和验收以[三选一变更记录](2026-09-24-dazed-three-choice-rule.md)为准。\n\n## 证据范围\n\n[D&D Beyond 的《Monsters of Drakkenheim》目录](https://www.dndbeyond.com/sources/dnd/modr)确认正式书的 Appendix C 含有 Conditions，但公开目录不提供该章逐条规则全文。本轮可逐字核对的条件规则来自[公开流传的 Beta 文本](https://www.scribd.com/document/873137275/Drakkenheim-Monsters-of-Drakkenheim-Beta)。因此下述 Frozen、Shocked、Valor 等措辞是对 **Beta 规则与本项目既有实现**的说明修订，不宣称已与正式版 Appendix C 全文逐条核对。将来取得正式正文后，应复核并修订差异。\n\n## 本轮判断\n\n| 条目 | 文案决策 | 边界 |\n| --- | --- | --- |\n| Shocked | 中文工作名改为「震愕」。复合效果直接写出 Dazed 的移动或动作二选一、不可使用附赠动作，Defenseless 的受攻击优势，以及掉落手持物品、拿取／拔出／收起物品各需动作。 | 「电击」容易误导为只由闪电伤害造成。Beta 的状态定义描述行为与防御损失，并非一种伤害类型；「震愕」是项目的语义翻译，不声称为官方中文译名。 |\n| Frozen | 直接写出 Immobilized 的速度 0、无速度加值及飞行坠落，Defenseless 的受攻击优势。重击限于**使用造成钝击伤害的武器**攻击冻结目标而命中的情况。 | “造成钝击伤害”单独不足以触发该重击条款，法术和徒手攻击不能只因伤害类型是钝击就算在内。另可通过标注 DC 的力量（运动）检定或达到该实例累计钝击／火焰伤害阈值解除；阈值默认 20，但可由实例参数修改。后一个解除途径不要求伤害来自武器。 |\n| Valor [X] | 与 Jinxed [X] 采用对称句式：攻击检定或豁免检定时额外掷 X，并将结果**加**到检定结果。 | X 保留实例骰式，不在状态文案写死 1d4。 |\n| Weakened | 写明武器攻击或法术伤害**总值**减半，结果向下取整。 | [2024 基本规则的 Round Down 条目](https://www.dndbeyond.com/sources/dnd/br-2024/rules-glossary)规定除乘后得到小数时向下取整。本轮只修正文案；运行时核对由本任务其他分支完成。 |\n| Dazed | HUD 的状态标题只显示「恍惚」或 Dazed；内部状态 ID 仍为 `fvtt-custom-conditions.dazed`。 | 不借可见后缀区分另一模组的裸 `dazed`，由 ID 区分。 |\n| Staggered | 文字改为自己的回合最多进行一次**武器或徒手攻击**；运行时按 dnd5e Attack Activity 的 `attack.type.classification` 统计已完成的攻击骰，并在活动使用及攻击骰预处理两个入口拦截下一次。 | 此项是用户要求的项目扩展，超出已可核对的 Beta 原文（仅 weapon attack）。锁定的 dnd5e 5.3.3 源码 `module/data/activity/attack-data.mjs` 与夹具 `packs/_source/equipment24/weapons/unarmed-strike.yml` 将 `unarmed` 和 `weapon` 分类区分；非攻击活动和 `spell` 分类不计。持久计数字段沿用 `weaponAttacks`，不迁移旧回合状态。 |\n\n[2024 基本规则](https://www.dndbeyond.com/sources/dnd/br-2024/rules-glossary)将武器和徒手打击分别列出，徒手打击条目明确以“不使用武器”描述。对于被规则明确指定为武器的天生武器，[官方 Sage Advice Compendium](https://www.dndbeyond.com/sources/dnd/sac/sage-advice-compendium)则将其视为武器。这解决了 Frozen 文字上的边界；Foundry 具体活动是否能被识别为武器，仍需针对目标 dnd5e 版本的活动数据单独验收，不能仅凭文案断言自动覆盖所有天生武器。\n\n## 后续复核\n\n1. 取得正式版 Appendix C 后，对照 Frozen、Shocked、Valor、Weakened 的原文及解除条款，更新本表和模块文案。\n2. 如目标世界将天生武器表示为非 `weapon` 类型的 Foundry Item，测试 Frozen 自动判定是否遗漏；此项属于运行规则核对，不通过扩大文案范围来掩盖。\n3. 在 CoTN 的实际 Token Action HUD 核查中英文切换、状态标题和换段；静态测试不等于浏览器视觉验收。\n","docs/reviews/2026-09-23-existing-condition-icons.md":"# 现成状态图标选型：已确认用于本地候选\n\n日期：2026-09-23。状态：用户确认采用20项现成SVG；初选已完成一次server-mirror安装与HUD复验。随后用户又确认笨拙改用 Drop Weapon、踉跄改用原笨拙的 Foot Trip；下表记录最新仓库候选映射，新映射的安装与浏览器结果须另行核对，不能沿用初选的验收。\n\n## 权限与结论\n\n用户明确禁止继续绘制SVG，并要求所有新增状态改找现成图标；先展示候选，随后明确回复“就用那个吧”，同意采用此前展示的20项。用户再看过笨拙候选的HUD尺寸预览后，明确选择 [skoll/drop-weapon](https://game-icons.net/1x1/skoll/drop-weapon.html)；踉跄按其要求接收原笨拙的 [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html)。19种Custom Conditions状态加伤势共20项，全部来自Game-icons.net；保持该库白色剪影语言。伤势1–3层共用同一原始图形，层数由HUD文字角标呈现，不自行绘制分层SVG。\n\n## 来源与验证\n\n通过AnySearch发现官方状态目录、关于页和GitHub官方仓库；随后逐页核对图标作者及CC BY 3.0链接，从每页实际列出的透明SVG下载链接保存原文件。没有描摹、修改path、组合图形或将位图转为SVG。\n\n- 官方状态目录：https://game-icons.net/tags/state.html\n- 官方许可及作者说明：https://game-icons.net/about.html\n- 官方仓库：https://github.com/game-icons/icons\n- 初筛仓库树：82d948812bfe3f269ef8f731dcdb07b08160edc4\n- 本地候选：F:/FoundryLab/foundry-v14/evidence/condition-icons-sourced-20260923/\n- 笨拙二次候选与HUD尺寸预览：F:/FoundryLab/foundry-v14/evidence/clumsy-icon-candidates-20260923/\n- selection.json记录当时20项实际下载地址、作者、许可、SHA-256及采集时的待确认状态；该原始采集记录不作为当前授权状态，用户随后已确认采用。\n- 模块内 `CREDITS.md` 随构建包一起提供逐项作者、作品、来源、原始SVG哈希及CC BY 3.0许可链接；原SVG字节未编辑，仅更名为模块内文件名。\n\n## 状态映射\n\n| 状态 | 候选 | 理由 |\n|---|---|---|\n| 心智混乱 / addled | [delapouite/brain-leak](https://game-icons.net/1x1/delapouite/brain-leak.html) | 脑力流失，表达心智受损 |\n| 迷乱 / bewildered | [lorc/uncertainty](https://game-icons.net/1x1/lorc/uncertainty.html) | 问号与回转，表达困惑 |\n| 流血 / bleeding | [lorc/bleeding-wound](https://game-icons.net/1x1/lorc/bleeding-wound.html) | 伤口滴血 |\n| 燃烧 / burning | [lorc/small-fire](https://game-icons.net/1x1/lorc/small-fire.html) | 完整火焰轮廓 |\n| 笨拙 / clumsy | [skoll/drop-weapon](https://game-icons.net/1x1/skoll/drop-weapon.html) | 手中武器脱落，表达动作失准；用户在HUD尺寸预览后确认 |\n| 恍惚 / dazed | [delapouite/knocked-out-stars](https://game-icons.net/1x1/delapouite/knocked-out-stars.html) | 眩晕星环 |\n| 无防备 / defenseless | [lorc/cracked-shield](https://game-icons.net/1x1/lorc/cracked-shield.html) | 裂开的防御盾牌 |\n| 分心 / distracted | [darkzaitzev/distraction](https://game-icons.net/1x1/darkzaitzev/distraction.html) | 人物被旁侧动静吸引 |\n| 衰弱 / enfeebled | [lorc/oppression](https://game-icons.net/1x1/lorc/oppression.html) | 受压蜷身，表示力量受到压制 |\n| 冻结 / frozen | [delapouite/frozen-body](https://game-icons.net/1x1/delapouite/frozen-body.html) | 被冻住的人体 |\n| 无助 / helpless | [delapouite/human-target](https://game-icons.net/1x1/delapouite/human-target.html) | 人体成为靶标，表达易受致命打击 |\n| 定身 / immobilized | [skoll/cement-shoes](https://game-icons.net/1x1/skoll/cement-shoes.html) | 双脚被固定的人体 |\n| 厄运 / jinxed | [lorc/cursed-star](https://game-icons.net/1x1/lorc/cursed-star.html) | 诅咒符号 |\n| 震愕 / shocked | [lorc/lightning-mask](https://game-icons.net/1x1/lorc/lightning-mask.html) | 受冲击的脸；图形含闪电，但状态规则不限定电击来源 |\n| 病弱 / sickened | [lorc/vomiting](https://game-icons.net/1x1/lorc/vomiting.html) | 恶心呕吐 |\n| 减速 / slowed | [lorc/snail](https://game-icons.net/1x1/lorc/snail.html) | 蜗牛，表达移动缓慢 |\n| 踉跄 / staggered | [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html) | 脚步绊住，表达踉跄；原笨拙图标按用户要求转用 |\n| 英勇 / valor | [lorc/winged-sword](https://game-icons.net/1x1/lorc/winged-sword.html) | 翼剑，表达勇气与增益 |\n| 虚弱 / weakened | [lorc/sword-break](https://game-icons.net/1x1/lorc/sword-break.html) | 破裂武器，表达伤害降低 |\n| 伤势 / injury | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | 包扎的人体 |\n\n## 尚待判断\n\n候选图形只表达状态概念，不改变规则。衰弱、无助和踉跄采用身体受压、人体靶标和脚步失稳作比喻；新笨拙/踉跄搭配仍须在实际HUD里核对清晰度。Dazed在CoTN有其他模组的同名状态，但自定义项以独立ID显示；不把换图当作同名状态的修复。Shocked 的 Lightning Mask 图形仍带闪电，不能据此把规则解释为仅由闪电伤害造成。\n\n## 本地候选安装与边界\n\n在确认30001仍为常驻的Foundry14.364/dnd5e5.3.3、`cor-cotn`、精确`server-mirror`数据目录后，先比较两个模块构建包与安装目录的manifest及逐文件SHA-256，再仅覆盖两个自有模块的静态文件；没有停服、重启、创建备份、改写世界LevelDB或触碰30002。安装预览与前后逐文件哈希记录在 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/update-preview.json` 和 `update-verified.json`。Custom Conditions由27增至28个文件，伤势模块由10增至11个文件，新增文件均为各自的`CREDITS.md`；安装后两个`verify-install`均通过，30001 `/api/status`仍是`cor-cotn`。\n\n首次安装前通过的离线检查包括Custom Conditions 48项测试、伤势80项测试、生成器Dazed投影聚焦测试91项、模块与包类型检查、架构依赖检查、两个模块构建、`handbook:check`。这些只证明当时的候选实现和安装字节；后续浏览器结果如下，不能把未执行项算作通过。\n\n## CoTN 外部 Chrome 回传与后续修复\n\n2026-09-23 在真实 `cor-cotn` 世界、77个原有启用项组合中，Chrome可见裸 `Dazed` 使用外部 `mcdm-flee-mortals-where-evil-lives` 图标，自定义“恍惚（自定义状态）”使用 `fvtt-custom-conditions.dazed` 和本模块图标；两者分立显示。自定义 Dazed 在测试 Actor 上点击启用、停用、再启用均通过。伤势管理器可见 `0/3→1/3→2/3→3/3`，然后按原路清回0/3。测试 Actor `FqqsDQZD62UnAQlp`、Scene `aKL3Db4ksES2rOfr` 及该 Scene 内 Token 已通过 UI 清理，返回 `landing page`、暂停状态和 IFS internal 基线；页面留在 Custom Conditions Manager。浏览器证据：`F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome/readback.json` 与 `report.md`。\n\n同轮发现 **FAIL**：经 TAH 激活 Shocked 后，`shocked` 高亮，但 namespaced Dazed 与 Defenseless 没有高亮。精确安装的 TAH DnD5e 2.1.0 构建器按 Actor ActiveEffect `statuses` 判定高亮；其默认点击调用 `actor.toggleStatusEffect()`。原模块只截获自定义 Dazed，因此 TAH 的 Shocked 点击可能生成无 Custom Conditions flags 的普通效果，绕过复合规则。Chrome隔离环境没有开放直接读取 `game/CONFIG/canvas`，实际 ActiveEffect flags 未从浏览器直接读回；该机制是与实测相符的源码解释，不伪称已取得 flags 证据。\n\n已在候选代码中补 Shocked 的自有 TAH 点击桥接：通过 Custom Conditions 公开 API 施加、停用、再启用，仅截获模块自有状态；测试精确断言 `shocked`、`fvtt-custom-conditions.dazed`、`defenseless` 三个投影状态和 CC flag。独立审查发现快速双击时两次读取旧状态的竞态，已将同一 Actor/状态的完整“读取→判断→写入”串行，并以延迟写入测试覆盖 Dazed、Shocked 双击。修复后 Custom Conditions 聚焦测试 **51 PASS / 0 FAIL**、模块类型检查与构建通过。复查确认普通 TAH 连续点击使用相同 Actor Document 对象；不同包装对象代表同 UUID 的并发路径仍是单独限制。\n\n仅更新本地server-mirror的Custom Conditions三个静态文件（英中语言包与`index.js`），伤势模块逐文件哈希保持一致；二次更新的预览、前后哈希位于 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/shocked-update-preview.json`、`shocked-update-before.json`、`shocked-update-verified.json`。安装后Custom Conditions `verify-install`通过，30001仍为`cor-cotn`。\n\n随后新建的GPT-6 Luna独立Chrome任务初次因旧GM页面占用而未进入世界，保留阻塞记录于 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome-gpt6/preflight-report.md`。用户关闭旧页后，同任务以正常Gamemaster空密码进入CoTN；第二轮报告在同目录 `e2e-round2-results.md`、`e2e-round2-ui-evidence.md`、`e2e-round2-fixture-ids.json`。**PASS**：修复版经TAH点击Shocked后，Shocked、Custom Dazed、Defenseless同时高亮；同一实例第二次停用、第三次启用，重载后仍在，Manager应用路径与TAH投影一致。伤势的TAH角标已直接显示0/3到3/3；英文界面与恢复中文、tooltip none与恢复full、20项已选图标的基本加载/区分均经可见界面核对。保留77项启用组合，清理本轮确切Actor `IFp6dPk7Mi1Dv2Rm`、Scene `p5bIJYFydh18NPia`及随Scene删除的Token `zGZAk1lYXAGukOw7`，服务常驻，页面留在landing page。\n\n**首轮 FAIL、修复后 PASS**：已启用Jinxed 1d6和Valor 1d4的TAH项最初没有显示6、4角标；同Token编辑Jinxed为1d4后也没有角标变化。精确安装的TAH Core 2.1.1会将不存在的`info1`标准化为`{}`，旧候选使用`!action.info1`判断空位，导致角标写入被跳过；浏览器观察与这一源码路径吻合。修复为空对象可填、保留非空外来角标、按选中Token Actor重算后，Custom Conditions **53 PASS / 0 FAIL**、Foundry模块类型检查与构建通过。本地server-mirror只更新Custom Conditions的`scripts/index.js`，伤势模块字节未变；预览、前后哈希见 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/dice-update-preview.json`、`dice-update-before.json`、`dice-update-verified.json`，`verify-install`通过。GPT-6 Chrome第三轮复验在同一Token `D80y8l8LGjPqu10f` 上看到Jinxed `1d6→6`、Valor `1d4→4`，不重选Token把Jinxed改为1d4后立即显示4；重载后两者均显示4。tooltip none无额外浮层，已恢复full/1500ms。证据见 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome-gpt6/e2e-round3-results.md` 和 `e2e-round3-ui-evidence.md`。\n\n第三轮临时Scene `Ao05kezR2WPlpNrh`、Actor `FSACXe155rsougRI` 与两个Token `eqHVDVV8AR11LZux`、`D80y8l8LGjPqu10f` 的exact IDs记录于同目录 `e2e-round3-fixture-ids.json`。浏览器任务起初在Foundry永久删除确认对话框前暂停；主任务按本轮既有授权核对ID/归属后通知继续。任务随后只通过Foundry UI删除上述精确Scene与Actor；两个Token随Scene移除，最终Scene和Actor目录中均无该条目，清理 **PASS**。原始暂停记录保留，更新后的删除证据见 `e2e-round3-results.md`、`e2e-round3-ui-evidence.md` 和 `e2e-round3-server-status.json`；最终30001仍为`cor-cotn`、PID32196、Foundry14.364/dnd5e5.3.3。\n\n真实指针仅移动悬停仍为 **NOT_EXECUTED**：当前Chrome控制接口没有纯移动调用；点击后出现的tooltip不代替这一项。图标显示不等于用户最终美术接受。其余独立世界E2E不因本轮重复执行。\n\n新候选复查：先核对官方页面、作者和许可，再以32/64px预览比较整套；如换候选，更新下载URL和哈希。资产选型不等于模块功能可用，状态口径仍遵守docs/acceptance/foundry-v14-module-health.md，Untested不能当运行通过。\n","docs/reviews/2026-09-24-all-custom-condition-hud-audit.md":"# Custom Conditions 全 19 项 HUD / 状态 ID 审计\n\n日期：2026-09-24。目标是 server-mirror 的 CoTN `cor-cotn`、Foundry 14.364 / dnd5e 5.3.3，并保留该世界原有启用模组组合。本页记录用户发现「自定义流血」没有独立 HUD 入口后的系统性审计、候选修复和 CoTN 页面复验。页面复验覆盖 19 项的**入口可见性**；不等于逐项施加、结算及跨客户端玩法验收。\n\n## 已确认的同名 ID 与问题范围\n\n安装在 server-mirror 的 dnd5e 5.3.3 源码 `Data/systems/dnd5e/dnd5e.mjs` 的 `DND5E.conditionTypes` 同时定义裸 ID `bleeding` 与 `burning`（约 47158、47169 行）。CoTN 已启用的 `mcdm-flee-mortals-where-evil-lives` 的 `Data/modules/.../index.js` 定义裸 `dazed`（约 1972 行）；先前 CoTN 浏览器曾同时看到该裸项和本模块独立的自定义 Dazed，见[图标及状态现场记录](2026-09-23-existing-condition-icons.md)。裸 ID 被其他来源先注册后，本模块不能用同一个 ID 覆写其规则和入口。此前[灼烧入口修复](2026-09-24-custom-burning-hud.md)仅解决 Burning，不能代表 Bleeding 或其余状态已检查。\n\n用户现场看到的 dnd5e 原生 `bleeding` 中文按钮叫「失血」，希望本模块自定义 Bleeding 继续叫「流血」；两者的**中文名称不同、状态 ID 不同、作用规则不同**。不要把「失血」按钮或原生「燃烧」按钮当成已配置本模块骰式参数的入口，也不要为区分它们重命名底层语义 ID。\n\n下表的「修复前」指本次全量修复启动前的候选实现：Dazed 与 Burning 已有独立投影，Shocked 虽被特设点击桥接接管但仍需纳入统一投影，其余 16 项未完成通用 HUD 接管。已确认同 ID 来源的是 Bleeding、Burning、Dazed **3 项**；其余 **16 项**未发现当前同 ID 来源。「未发现同 ID」只表示上述精确安装版本与已知启用组合的审计没有证据，**不保证未来安装或启用的模块不会再定义同名 ID**。不把图标复用、显示名相同或未看见按钮单独当成 ID 冲突证据。\n\n| # | 本模块语义 ID | 中文名 | 修复前状态 ID | 修复前已知裸 ID 冲突 | 修复前 HUD 点击路径 | 目标独立状态 ID |\n| ---: | --- | --- | --- | --- | --- | --- |\n| 1 | `addled` | 心智混乱 | `addled` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.addled` |\n| 2 | `bewildered` | 迷乱 | `bewildered` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.bewildered` |\n| 3 | `bleeding` | 流血 | `bleeding` | dnd5e 原生 `bleeding`，界面「失血」 | 本模块入口被占用；系统默认切换不能填写实例骰式 | `fvtt-custom-conditions.bleeding` |\n| 4 | `burning` | 灼烧 | `fvtt-custom-conditions.burning` | dnd5e 原生 `burning`，界面「燃烧」 | 已有独立入口，点击打开绑定 Actor 的参数管理器 | `fvtt-custom-conditions.burning` |\n| 5 | `clumsy` | 笨拙 | `clumsy` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.clumsy` |\n| 6 | `dazed` | 恍惚 | `fvtt-custom-conditions.dazed` | MCDM 裸 `dazed` | 已有独立入口，经本模块 API 切换 | `fvtt-custom-conditions.dazed` |\n| 7 | `defenseless` | 无防备 | `defenseless` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.defenseless` |\n| 8 | `distracted` | 分心 | `distracted` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.distracted` |\n| 9 | `enfeebled` | 衰弱 | `enfeebled` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.enfeebled` |\n| 10 | `frozen` | 冻结 | `frozen` | 未发现 | 系统默认切换，无法填写解除 DC | `fvtt-custom-conditions.frozen` |\n| 11 | `helpless` | 无助 | `helpless` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.helpless` |\n| 12 | `immobilized` | 定身 | `immobilized` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.immobilized` |\n| 13 | `jinxed` | 厄运 | `jinxed` | 未发现 | 系统默认切换，无法填写骰式 | `fvtt-custom-conditions.jinxed` |\n| 14 | `shocked` | 震愕 | `shocked` | 未发现 | 特设桥接经本模块 API 切换，需统一接管 | `fvtt-custom-conditions.shocked` |\n| 15 | `sickened` | 病弱 | `sickened` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.sickened` |\n| 16 | `slowed` | 减速 | `slowed` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.slowed` |\n| 17 | `staggered` | 踉跄 | `staggered` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.staggered` |\n| 18 | `valor` | 英勇 | `valor` | 未发现 | 系统默认切换，无法填写骰式 | `fvtt-custom-conditions.valor` |\n| 19 | `weakened` | 虚弱 | `weakened` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.weakened` |\n\n五个需要参数的状态是 Bleeding、Burning、Frozen、Jinxed、Valor。HUD 直接使用 `actor.toggleStatusEffect()` 会生成没有 `flags.fvtt-custom-conditions.condition` 的普通 ActiveEffect，不能替代本模块的实例校验、来源参数、最高值结算或解除逻辑。其余 14 项虽无必填参数，也必须由本模块 API 施加或切换，使规则 Hook、复合状态和图标高亮都读取同一种实例；旧版 Shocked 曾因走普通 HUD 路径而只有自身高亮、缺少 Dazed/Defenseless 投影，见[现场与补救记录](2026-09-23-existing-condition-icons.md)。本段是代码路径审计，不能代替对每一项的 CoTN 点击结果。\n\n## 全量修复的行为边界\n\n1. 所有 19 个语义 ID 都投影为 `fvtt-custom-conditions.\u003cid>`；原生 dnd5e 的「失血」/「燃烧」与 MCDM Dazed 保留原有 ID、名称、图标与行为。本模块自有项须可按当前 Foundry 语言显示名称与规则卡。\n2. 本模块的 19 项在 Foundry 原生 Token 状态 HUD 中隐藏普通点击入口，避免其默认切换绕过 API；Token Action HUD 从注册状态读到这些项，但点击由本模块的 roll-handler extender 接管。五个参数项打开已绑定当前**单个** Actor、已预选该状态的管理器，不直接施加空参数实例；其余 14 项按本模块 API 的实例/启停规则切换。目标或 GM 权限不明确时应提示并拒绝，不退回默认切换。\n3. 保留旧 Actor/Item ActiveEffect 的 `flags.fvtt-custom-conditions.condition`、`conditionId`、实例参数与来源，不按显示名猜测归属，也不迁移、删除用户既有实例。更新旧实例时投影新的命名空间状态；复合 Frozen/Shocked 的子状态仍应与本模块一致，高亮、停用和再启用须对应实际实例。dnd5e 的 `noMovement` / `halfMovement` 映射也应同步使用新状态 ID。\n4. 既有 Token Action HUD 用户布局可能保存旧 action ID。新 ID 应在默认布局中可见；自定义保存布局是否能迁移，必须按其实际存储与页面行为核对，不能仅凭默认 HUD 截图推断。不能擅自清空或重写玩家的 HUD 偏好。\n\n生成链路也属于同一次 ID 审计。除 `packages/generation/src/actor-effects.ts` 的投影路径外，`packages/generation/src/actor.ts` 原有两处直接写 `statuses: ['bleeding']`，会绕开通用投影；本轮候选实现已将其改为 `projectedConditionStatusId('bleeding')` 并补回归。只把这个结果称为候选源码与测试结果，导入到 CoTN 后的实际 Actor/Item 行为须另列验收。\n\n## 验收分层与后续核查\n\n- **已发生的历史页面证据**：CoTN 的原生 Burning 与自定义「灼烧」并列、点击灼烧打开绑定 Actor 的空参数管理器；自定义 Dazed 与 MCDM Dazed 并列；Shocked 复合高亮经前次专项复查。各结论限于当时的模块字节、Token 与页面，见所链记录。\n- **PASS — 全 19 项入口可见性**：2026-09-24 在常驻 server-mirror 的真实 CoTN 页面正常重载，Token Action HUD「效应」组中 19 个自定义中文按钮各出现一次，均有图标；未发现缺失或重复。原生「失血」与自定义「流血」、原生「燃烧」与自定义「灼烧」、MCDM「Dazed」与自定义「恍惚」同屏并列。页面显示已启用 77 个模组，复验前后没有修改模组配置或 HUD 保存布局。截图见 [全 19 项 HUD 画面](F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/all-19-hud-line-261-0.jpg)，原始 AX 摘录、运行时和边界见 [Chrome 现场记录](F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/ax-evidence.md)。浏览器 AX 未暴露 TAH actionId；19 个命名空间 ID 是安装源码的静态核对结果，不冒充 DOM 读取。\n- **PASS — 自定义流血入口打开管理器**：只点击自定义「流血」一次，管理器绑定所选 Token 的 Actor「泽菲尔·艾什伍德」，预选「流血」，公式仍为空。没有点击施加，也没有新增或修改状态；原生「失血」未点击。候选实现的 Custom Conditions **80/80** 单测、模块类型检查与安装树核对通过；这些是代码和安装层证据，不代替页面行为。\n- **NOT_EXECUTED — 其余点击和玩法结算**：本轮没有逐项切换其余 18 个按钮、提交流血参数、重验冻结五段悬停说明、检查浏览器控制台或多客户端/持久化结果；本轮使用的 Chrome UI 接口未提供悬停操作。旧布局的自动迁移也未验证。若以后修改上述逻辑，再按具体风险补定向验收，不无理由重跑独立测试世界的全套 E2E。\n\n## 可追溯来源\n\n- 19 项语义目录与实例 flag：`packages/contracts/src/conditions.ts`；注册与速度映射：`foundry-modules/fvtt-custom-conditions/src/runtime.ts`；点击桥接和 tooltip：`foundry-modules/fvtt-custom-conditions/src/hud.ts`；生成模板：`packages/generation/src/actor-effects.ts`、`packages/generation/src/actor.ts`。\n- 锁定的本地 dnd5e 5.3.3：`F:/FoundryLab/foundry-v14/data/server-mirror/Data/systems/dnd5e/dnd5e.mjs` 的 `DND5E.conditionTypes.bleeding` / `.burning`；锁定的本地 MCDM 模组：`F:/FoundryLab/foundry-v14/data/server-mirror/Data/modules/mcdm-flee-mortals-where-evil-lives/index.js` 的 `dazed` 注册。二者只读核对，没有修改 Lab 文件。\n- 同名状态的先前 CoTN 页面证据：[图标与 Dazed/Shocked 记录](2026-09-23-existing-condition-icons.md)、[原生 Burning 记录](2026-09-23-cotn-burning-hud.md)、[自定义灼烧入口记录](2026-09-24-custom-burning-hud.md)。这些是历史节点，不自动覆盖本轮全量修复。\n- 本轮安装核对：`F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/20260924-095456/verified.json`；外部 Chrome 原始截图提取来源及 SHA-256：`F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/screenshot-provenance.json`。截图为子任务 CUA 原样返回字节，未重绘。\n","docs/reviews/2026-09-24-custom-burning-hud.md":"# 参数化 Custom Conditions「灼烧」的 HUD 入口\n\n> 后续范围说明：本页只记录当时「灼烧」相对原生「燃烧」的独立入口与现场验收。用户随后发现自定义「流血」也缺入口，引发[全 19 项 HUD / 状态 ID 审计](2026-09-24-all-custom-condition-hud-audit.md)。本页的灼烧 PASS 不能代表流血或其余 17 项已完成本轮统一修复及页面验收。\n\n日期：2026-09-24。目标环境仍是 server-mirror 的 CoTN `cor-cotn`，Foundry 14.364 / dnd5e 5.3.3。本文记录本地候选变更及验收边界；它不把此前原生 Burning 的浏览器截图当作自定义入口的通过证据。\n\n## 用户问题与区分\n\n用户指出的是：可填写骰式和伤害类型的 **Custom Conditions「灼烧」**（内部 ID `burning`）在 Token Action HUD 中没有入口。2026-09-23 的[现场记录](2026-09-23-cotn-burning-hud.md)及截图只确认 dnd5e 原生「燃烧」可见；该按钮不能建立参数化实例，不能作为本问题的解决结果。先前把「原生按钮可见」解释为这一项已处理，判断对象错误。\n\n## 候选行为\n\n- 保留 dnd5e 原生裸 ID `burning` 的状态、规则、图标与 HUD 按钮。\n- 为本模块增加独立的 `fvtt-custom-conditions.burning` HUD 项，中文状态名称和 HUD 标签均为「灼烧」，英文 HUD 标签为 `Custom Burning`。原生按钮仍称「燃烧」，两者不共用同一按钮语义。先前草稿中的「自定义燃烧」已被用户修正，不再作为中文 UI 名称。\n- 灼烧在 Foundry 原生 Token HUD 中设置 `hud: false`，避免原生 `toggleStatusEffect()` 绕过必填参数或删除已配置效果；Token Action HUD 2.1.1 仍从 `CONFIG.statusEffects` 枚举该项，并由本模块的点击拦截器处理。原生「燃烧」保持原有 HUD 行为。\n- active GM 在只有一个明确目标 Actor 时点击灼烧项，会打开绑定该 Actor、预选灼烧（内部 ID `burning`）的状态管理器。HUD 点击本身不会施加无参数效果；GM 在管理器中显式填写 `formula` 和 `damageType`，由既有参数校验拒绝缺项。\n- 已存储的旧 `flags.fvtt-custom-conditions.condition` 灼烧实例仍可读取与显示，不因 HUD 入口改变而迁移或删除。\n\n## 验收分层\n\n- **历史 PASS，仅原生按钮**：在 CoTN 所选 Token 的效应组中看到 `actionId=burning`；证据见 2026-09-23 现场记录。\n- **候选静态检查 PASS**：实现已固定状态 ID、点击路由、Actor 绑定、空参数拒绝与旧 flagged 实例读取；Custom Conditions 模块测试 71/71、受影响 effectProfile 测试 33/33、模块类型检查与构建通过。这些检查不证明 CoTN 页面已经显示新按钮。\n- **CoTN 新入口视觉与表单打开 PASS**：2026-09-24 的独立外部 Chrome 在同一个 Token Action HUD「效应」列表看见「燃烧」与「灼烧」两个按钮。只点击「灼烧」后，Custom Conditions Manager 显示所选 Token 对应的 Actor「泽菲尔·艾什伍德」、预选「灼烧」，参数 JSON 初值为 `{\"formula\":\"\",\"damageType\":\"\"}`；没有提交、施加或停用状态。浏览器 AX 证实两个不同标签及管理器内容；AX 不暴露 `actionId`，原生 `burning` 与本模块 `fvtt-custom-conditions.burning` 的 ID/图标映射另由精确安装源码和文件哈希核对，不能误称为浏览器直接读到 DOM 属性。证据见 `F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-custom-burning-localhost/chrome-run-20260924.md`，原字节 CUA 截图及提取来源见同目录 `burning-and-scorching-hud.jpg`、`scorching-manager.jpg` 和 `screenshot-provenance.json`。\n- **未执行的边界**：本轮按用户要求未提交参数、结算伤害或重跑旧玩法规则；空参数拒绝由单测覆盖，未在 CoTN UI 中尝试。Frozen 五段新版浮框因 Chrome 控制接口缺少可靠悬停/tooltip 读取，仍为视觉 **NOT_EXECUTED**。首次使用 `127.0.0.1:30001` 的 Chrome 标签登录成功提示后返回 `/join`；后以 `localhost:30001` 进入同一 PID 32428 的 server-mirror 世界。两主机名的会话隔离是排查假设，未读取 Cookie 来证明具体冲突。\n\n这次入口变更不要求重跑先前已通过的整套独立世界规则 E2E；若发现新入口引入行为回归，再针对该路径补测。\n","docs/reviews/2026-09-24-dnd2024-statblock-preview-reference.md":"# Forge Actor 的 D&D 2024 资料块呈现依据（历史归档）\n\n- 日期：2026-09-24。\n- 原研究范围：Forge 生物蓝图的可读预览 UI；当时生成目标为 Foundry 14.364 / dnd5e 5.3.3 / core。归档不改变现行支持目标，具体版本按[支持矩阵](../acceptance/current-support-matrix.md)与源码版本门核对；资料块样式不证明完整 2024 规则自动化或 dnd5e 6.x 兼容。\n\n## 2026-10-08 归档状态\n\n可读资料块已进入主线的 [actorStatblock.ts](../../foundry-modules/fvtt-json-forge/src/actorStatblock.ts)，由 [application.ts](../../foundry-modules/fvtt-json-forge/src/application.ts) 的实际结果渲染链调用。草稿呈现当前创作输入，正式呈现读取 accepted artifact；[生物创作研究](2026-09-22-creature-item-authoring-opportunities.md)中的蓝图/预览提案已由后继完成。\n\n本文件保留官方出处、字段层级与不猜填数据的设计依据。2026-10-07 独立审查复核了固定 SRD 5.2.1 与转换指南的相关文本；本次归档未新增规则、生成器、运行时或视觉接受。\n\n## 分层结论\n\n1. **官方规则/呈现来源。** D&D Beyond 的 [SRD 5.2.1 下载页](https://www.dndbeyond.com/srd)把英文版标为 2025-05-01 发布。其 [PDF 印刷第 254–258 页](https://media.dndbeyond.com/compendium-images/srd/5.2/SRD_CC_v5.2.1.pdf#page=254)和[怪物资料块说明](https://www.dndbeyond.com/sources/dnd/br-2024/how-to-use-a-monster)给出了 2024 怪物资料块结构。\n2. **结构特征。** 名称下是体型/生物类型/阵营；AC 与 Initiative 的修正值及固定分数同行；其后为 HP（生命骰）、Speed；六属性为三列两行，每项包含分数、MOD、SAVE。可用时再列技能、抗性/弱点/免疫、装备、感官、语言；CR 后括注 XP 与 PB。正文按 Traits、Actions、Bonus Actions、Reactions、Legendary Actions 等实际存在的栏目组织。官方[从旧 SRD 转换说明](https://media.dndbeyond.com/compendium-images/srd/guide/converting-to-srd-5.2.1.pdf#page=13)明确把先攻展示、全六项豁免展示和动作说明列为变化。\n3. **本项目数据边界。** 草稿只证明作者当前输入了什么；正式候选才来自现有 workflow/artifact。没有可靠数据来源的 Initiative 总值、SAVE 总值、XP、PB、Skills、Senses、Languages、Gear 不猜填。资料块采用 2024 信息层级，但不照搬官方书籍的具体视觉装帧或已发表怪物正文。\n\n## 后续新增范围的判断与复查\n\n- [ ] 确认中文标签在 Forge 中与现有 dnd5e 中文用词一致；未有锁定译名时保留英文缩写 AC、HP、CR、PB 与必要的术语提示，不声称官方中文版逐字对照。\n- [ ] 如以后加入 2024 特有的完整机制或迁移 dnd5e 6.x，分别核对目标版本的原生 Actor/Activity 数据、准确规则来源和真实 Foundry 运行；不能沿用本次纯呈现验收。\n- [ ] 新增外部资料块参考时，优先取官方 SRD/Basic Rules 或作者公开源码/截图，记录精确版本与发布日期；与本文件及生成 artifact 字段逐项对照，再判断是否适用于 Forge。\n\n## 来源与证据范围\n\n资料块结构来源记录于上列 Wizards of the Coast / D&D Beyond 官方公开材料；中文标签采用项目用词，不宣称与官方中文版逐字一致。原记录中的“待改实现”已由主线 renderer 和统一工作台替代。既有接受按其具体版本和产物保留，后续行为变化再补相应检查；本文件仅是来源与设计依据，不单独构成运行时通过证据。\n","docs/reviews/2026-09-25-weapon-mastery-user-report.md":"# 武器精通与特性：本地交付终审\n\n更新：2026-09-29。**本地交付候选已完成，尚未提交、合并、推送或生产部署。** 下方历史文字仅记录过程，不再作为待执行指令。\n\n## 交付范围与身份\n\n- 自有 WMP 实现官方八种精通 Cleave/Graze/Nick/Push/Sap/Slow/Topple/Vex，以及 Deadly/Fatal/重击流血。临时状态与事件使用项目自己的 Custom Conditions/Trigger Engine；借鉴外部代码设计不改变自有实现的交付要求。\n- 精确支持：Foundry14.364 / dnd5e5.3.3；已验收 CoTN + Midi14.0.11 和独立原生代表性路径。自有依赖为 Custom Conditions0.1.1、Trigger Engine0.1.1。\n- 实机接受构建：a56a09da0dc04f2cfc082598900477ed78d7155f30f80646d1fffd940bb2edf0。Lab仍运行这个构建，服务PID43716/127.0.0.1:30001/server-mirror/cor-cotn。\n- 最终文档打包构建：05f3c3a4947fa9e7fd032ece209f46e0c0f285b49ff84530a4b3835884c880e6。仅两份README更新及内嵌buildId改变；主控逐字节验证，替换buildId后的运行脚本完全相等。未为文档重打包重复玩法或重启服务。证明在证据目录的wmp-documentation-repack-equivalence-20260929.json。\n- [WMP ZIP](../../foundry-modules/fvtt-weapon-mastery-properties/dist/fvtt-weapon-mastery-properties.zip)，SHA256 56bf08f1bf3319ac4d325abc4eac9e20b0f270d3f89bcd5ddcc58a374c359a10。[CC ZIP](../../foundry-modules/fvtt-custom-conditions/dist/fvtt-custom-conditions.zip)；[TE ZIP](../../foundry-modules/fvtt-trigg roup、expiry；不复用既有 Slowed 偷换语义。\n- 效果预约必须排他，取消未开始攻击释放预约，结果未知的已开始攻击不自动再授予；旧 Vex 先消费，新命中得到的新 Vex 再创建。\n- 活动 GM 验证身份、权限与真实来源；不直接写最终效果/血量制造验收结果。最终 JSON 走正式生成链，不手工补成通过。\n- 已提交主区与本 worktree 既有改动不自动整合；主区旧 ADR 若方向冲突，在获发布授权后的整合阶段处理。\n\n## 7. 最少证据入口\n\n以下文件本次仅核对存在性/已列文件哈希；不新增游戏证据。\n\n- Slow：[真实通过摘要](F:/FoundryLab/foundry-v14/evidence/server-mirror/weapon-mastery-final-20260925/slow-pass-summary.json)。\n- Push：[旧构建原始 API 收据](F:/FoundryLab/foundry-v14/evidence/server-mirror/weapon-mastery-vex-checkpoint-20260926/previous-push-receipt-copied.json)，SHA-256 `3bdb2e5236d4f5dc7c9ad9b5a03714596c7b42c2c2f4d13f4bddcb3dbf70ce6d`。此前已核对环境/Push PASS；不代表当前 UI 或所有规则通过。\n- Graze/管理器等历史与 Sap/Deadly/Topple/玩家局部证据：[9 月 24 日独立收据](F:/FoundryLab/foundry-v14/evidence/server-mirror/weapon-mastery-cotn-chrome-fresh-20260924/weapon-mastery-cotn-chrome-e2e-receipt.md)；更早 Graze 在 `weapon-mastery-cotn-chrome-20260924/e2e-report.md`，恢复只读所需片段。\n- Vex 的原始检查点、故障证据、对象和宏 ID 仅在子 Plan 维护。\n- 操作用法：[模块 README](../../foundry-modules/fvtt-weapon-mastery-properties/README.zh-CN.md)、[CoTN runbook](../runbooks/weapon-mastery-cotn-e2e.md)。这些是稳定使用文档，不另承担进度台账。\n\n## 8. 两份文档的维护规则\n\n- [ ] 每关闭一项，在本文件直接勾选并补“构建/入口/API或UI/读回/证据”；不另建日报、交接、暂停或修复报告。\n- [ ] 当前唯一子 Plan 为 Vex。完成后把结论压回本文件；遇到下一项复杂问题，复用并改写同一路径 `weapon-mastery-active-case.md`，在其中标明当前规则。\n- [ ] 同时存在多个难点时，未开始的只列在本文件；不同时生成多个子 Plan。原始 JSON/截图放既有证据目录，不能包装成额外报告。\n- [ ] 新 thread 只先读本文件；处理当前难点才读子 Plan；不默认遍历历史聊天或整个证据目录。\n\n\u003c/details>\n","docs/reviews/2026-10-01-next-605-custom-module-restoration.md":"# ServerNext 6.0.5：十个自有模块恢复与限定验收\n\n日期：2026-10-01。当前状态：本轮授权的本地恢复完成；十模块限定代表行为、普通GM重载、精确清理，额外 Midi local.10 的两请求+4与精确清理全部通过。用户随后明确授权整理提交、发布前整合、合并 master 并推送，且要求保护原工作树、不重跑已通过 E2E。发布前检查见[整合记录](2026-10-01-next-605-release-integration.md)，实际提交与远端身份以 Git 发布回执为准。以下阶段记录保留旧失败，当前接受以末尾收据为准；本记录不恢复其他迁移、升级Core／Mirror／生产或扩大长时测试。\n\n## 当前目标与候选\n\n- 候选：`I:/OpenCode/fvttV12JsonGenerator-worktrees/20261001-161536-next-605-restore`，从 master `053a592b940d59b4c3014074eb233d65bcfb944e` 建立。\n- 目标：`server i-qol.js`、`midi-qol.js.map`、`module.json` 三文件，其他104 nonpack 文件与已装 local.9 相同。manifest 除 version/download 外完整一致。运行中读取某 pack log 被锁拒绝后没有重试或写入；pack 前后清单和SHA必须在正常 Setup／锁释放后核对。另四个已批准 House／Injury 中英文拒绝文案也纳入最终七文件计划，准备阶段 installedFilesWritten=0；不替换数据库或写 packs。\n\n新验收工具 V4 明确要求 active Midi local.10，给 Check／Save Activity 显式 `_id`，沿用已纠正的 raw/prepared origin 关联和公开 TokenLayer 目标恢复。部署后分别走真实请求 UI 一次，预期 owner+3／target+1 的+4；记录随机骰与总值，随后精确清理和49来源读回。旧+1失败证据保留；目前该新实机门为 NOT_EXECUTED。\n\n## 限定安装通过，实机仍待回执\n\n十模块自有现场与两个临时 Macro 精确清理通过后，正常 Return to Setup；父独立 status.active=false、原PID39528／端口／app/data身份、Core14.368／系统6.0.5以及world／packs锁释放核对通过。只覆盖冻结的七文件，全部写后哈希一致，父再次独立复算七项0差异；三个相关模块所有 packs 文件前后 SHA 与数量完全一致，其他 nonpack 未变。安装收据 `midi-fix-install-receipt.json` 明确 `PASS_LIMITED_INSTALL_ONLY`，没有把它记为运行PASS。\n\nV4再绑定原94启用ID与版本，仅允许 Midi local.9→local.10 的单项授权差异。最终冻结请求工具24,905字节，SHA `bd6036e6685054e1e2b568f0cfd1fc9e3b6ccb46feac6cb06d4fbb81674e9742`。已派正常原世界启动、真实 Check／Save各一次、原始骰值／总值关联及精确清理；旧十模块已过门不重放。此时+4／+4仍为待回执，不以预期值写实际结果。\n\n首次V4存储读回在执行前遇纯行尾规范化：一处CRLF以及最终LF被编辑器规范，全文逻辑一致，但不冒充原hash相同。现场只有唯一Macro、无flags／fixture／Chat／roll。父源文件统一LF后重新冻结为24,904字节、SHA `35979f7b6d54e0ff873bcff0eb88cff91710c67c4820b47d86ca9fa9ebf1e49b`，同一Macro接续，仍允许单独记录编辑器省略末尾LF的保存hash。该工具问题不计作Midi语义失败。\n\n## 真实请求与清理接受\n\n同一新fixture的owner STR修正3、target修正1。正常Check请求卡 `cuqIzYSsim6LPAKd` 的真实target roll `bqLtyEmq0vjIplr1` 为 `1d20 + 3 + 1`、骰12／总16；Save卡 `l0bZdXBILjuYLU73` 的roll `mCdNFtT9esgIvTPz` 为同公式、骰20／总24。两次modifier均4且raw origin准确对应各卡；Check普通NORMAL／PublicAsUser对话实际投一次，Save正常按钮直接evaluate一次，没有第二次投、重掷、改公式或写结果。`midi-local10-actual-rolls.json` 20,330字节，SHA `9dca9d5c0e4e84a57929023e91f90889bdb5286a2d58dc3bde620e045ee9269c`。\n\n实际active modules完整94集合，仅Midi版本为local.10，其他93版本与已接受原94一致；49来源值全部逐项相等。精确cleanup只删除新2NPC／Scene／Feat／4Chat并恢复原view／activeScene／pause／control／targets，原Actor294／Chat1419和Scene集合保持。`midi-local10-final-cleanup.json` 68,679字节，SHA `ee0ac5311b4167eb75eeefda1d5dc4ac34f09f961b79663200e480326d0eea31`。唯一工具Macro随后删除，原90ID完整相等；`midi-local10-macro-final-cleanup.json` 2,344字节，SHA `535e679aec4253ea51ff7153387acf4d86f2993a6886fda3c6cb366d38d9572c`。\n\n父另解析raw JSON，重新计算total−diceTotal、核两card origin与speaker、逐值比较49来源及94版本唯一delta，核原Actor／Chat／90Macro，Scene以完整重载快照去除准确owned Painter Scene为对照（早期fresh84快照不含sceneIds，不能把缺字段当作空集合）。接受存于 `parent-midi-runtime-acceptance.json`。实际查看roll可见截图；不把manifest／磁盘哈希当客户端已执行字节证明。\n\n本轮接受两个请求来源加值的正常UI切片，不包含所有权限／privacy／workflow分支、完整native Cast、天然19、长时跑团或生产。旧local.9的两次+1FAIL完整保留，不因修复成功改写旧结果。服务原PID39528继续运行，原Scene／pause恢复，未Return Setup或停服务。\n","docs/reviews/2026-10-01-next-605-release-integration.md":"# ServerNext 6.0.5 本轮成果：发布前整合\n\n日期：2026-10-01。用户明确授权整理提交、完成发布前检查、合并 master 并推送；要求保护原工作树全部改动、复用已通过实机 E2E。\n\n候选为 `codex/20261001-161536-next-605-restore`，基线 master `053a592b940d59b4c3014074eb233d65bcfb944e`。发布操作按 worktree runbook 顺序执行，提交和远端 SHA 由 Git 生成，完整操作回执保存在本任务私有 evidence，不把未经脱敏的日志入库。\n\n## 交付和因果边界\n\n- 十个自有模块的源码、构建契约及版本门整合；精确运行目标是 Core14.368／dnd5e6.0.5。版本声明上限和五个运行门确实需要放开／适配，不能据“小版本”预先保证兼容。\n- Painter 的 Fire 行列坐标和视频加载问题在原迁移源码中已存在；修复、代表画布视觉和普通重载通过。未证明是6.0.5新回归。\n- Midi 两个请求 handler 遗漏 Activity 来源加值，local.10 实际 Check／Save 均为来源3＋目标1。6.0.2原生链已支持加值；缺少同组合6.0.2实机反例，不把它定性为升级引入。\n- Deck 按6.0.5效果来源读取力竭；初次候选漏补齐 effect ID 是本次实现错误，已修复并通过UI3→4→3和重载。它不能证明旧6.0.2有同一问题。\n- 其余八个自有模块在本轮限定切片未发现新的功能缺陷。Blood Hunter／Species仅接受来源和内容身份，Chat Guard仅统计API，Monitor仅短会话；这些事实不提升为完整玩法通过。\n\n完整运行、普通重载和精确清理复用[十模块记录](2026-10-01-next-605-custom-module-restoration.md)及[Midi记录](2026-10-01-next-605-midi-request-bonus-gap.md)。未再次进入浏览器或投骰，也未重新部署。天然19、完整Cast／四子职／其它地形／GM玩家矩阵、长时和生产仍为 NOT_EXECUTED。\n\n## 整合中发现的检查问题\n\n1. 三处原有测试类型错误在 master 对照同样存在；补显式存在性检查，保留原断言。\n2. CLI 子进程的 Bun exited＋WebStream 组合曾超时且输出为空。改用 Node child_process 同时读取两管道，在 close 后取结果；Unicode、大输出、非零退出、启动失败和超时回收继续验证。爬虫 CLI 测试复用同一 helper，内层50秒先于测试60秒截止。\n3. 单进程覆盖率120秒短于本次完整319文件运行；watchdog调为300秒，保留原清单、单并发、单进程函数统计和全部阈值。未以合并多个进程的函数计数冒充覆盖率。\n4. Species14.368静态构建复用 CI 明确注入的 classic-level 测试入口；未注入时仍要求真实14.368依赖路径，负例保持拒绝。未改变内容目标6.0.2或扩大运行接受。\n5. Intake 验收原先把命名空间状态与语义条件直接比较。现在仅同一 Effect 的已启用合法模板 flags 与精确 projected ID 匹配时归一化；缺失、错配、禁用、伪后缀和普通效果仍报告漂移。没有改生成 JSON 或放松来源匹配。\n6. Custom Conditions 图标与归属检查共用一次真实 beforeAll 构建，保留所有19图标及源哈希断言。\n7. 全清单覆盖率通过后的实际暂存卫生门发现：旧规则只允许Species根目录的已接受JSON，未识别本轮正式接受的`v14-368`构建输入。增加限定目标目录、单层小写稳定ID规则；其他版本、任意嵌套、大小写错配及子目录ledger仍拒绝。完整覆盖率快照不重跑，新增规则的局部robustness80通过／0失败、卫生1649个暂存后tracked路径通过、anti-overfit429来源通过。Midi增量补丁的空白context行必须含一个diff标记空格；只为这一准确patch路径设置Git whitespace属性，保留原补丁SHA，而非改写补丁。\n\nBun1.3.8完整覆盖率曾挂住及出现 `switch on corrupt value` 原生崩溃。逆序对照没有稳定消除问题，未纳入最终实现。隔离Bun1.4.2完整对照出现 Windows file import／fs.cp 不同兼容错误，未据此修改世界复制逻辑或全局运行器；所有原失败日志保留。\n\n最终采用隔离的官方 [Bun1.3.14发布包](https://github.com/oven-sh/bun/releases/tag/bun-v1.3.14)，实际版本 `1.3.14 (0d9b296a)`；下载ZIP SHA-256 `0a0620930b6675d7ba440e81f4e0e00d3cfbe096c4b140d3fff02205e9e18922`。CI固定1.3.8→1.3.14，本机全局Bun未更改。完整319文件、原升序、单并发／单进程覆盖率为3017通过、1既有跳过、0失败，245.32秒；图标来源检查、Windows导入和临时复制门均通过。阈值门退出0：生产行覆盖率83834/98414＝85.19%，函数9115/10540＝86.48%，无阈值放宽。报告仍列49个未覆盖生产入口；CLI、build和smoke的独立通过不冒充这些入口的进程内覆盖率。\n\nCI组成门禁按失败点接续完成，不把先前失败的整条 `ci:verify` 记成退出0，也不再次重跑已通过的共同门：\n\n| 门禁 | 实际结果 |\n| --- | --- |\n| 临时环境／测试隔离 | PASS，写入根限随机CI沙箱 |\n| Ruler生成／32层级指令、手册来源及离线HTML | PASS，发布前同步，合并后再核手册 |\n| production／all／packages／apps／foundry-modules／tools类型 | PASS，最终1.3.14入口 |\n| 架构依赖／循环 | PASS，无非法导入／循环 |\n| Session Monitor独立build | PASS，固定运行器下两入口同字节ZIP |\n| CLI／全清单覆盖率／阈值 | 24/0；3017/1skip/0；85.19%行／86.48%函数 |\n| anti-overfit／仓库卫生／锁定参考 | PASS，429来源；私有凭据和原件未暂存；5.3.3／current6均有效 |\n| Web build／离线Actor smoke | PASS，来源6items、0 verifier警告、0网络调用 |\n\n独立只读复核未发现其余发布阻断项。运行器修改仅影响仓库CI；已接受的Foundry安装和实机证据仍绑定原冻结产物，没有用新的CI构建覆盖已装模块或更改服务。\n\n## 保护与发布出口\n\n发布前独立重算：原迁移源368文件、策略11文件、审计12文件、原Midi6文件，长度／SHA差异均0；原master clean、索引为空。仅候选准确路径进入暂存，不包含 .local、真实凭据或私有原件，不stash／提交／清理原工作树。\n\n发布采用主checkout正常fast-forward，合并后再查手册及用户基线，再推送并核本地master／origin/master／远端refs/heads/master一致。源码发布不代表新增生产部署。\n","docs/reviews/2026-10-03-foundry-14-365-mirror-upgrade-and-tile-arsenal.md":"# Mirror 14.364 → 14.368 与 Tile Arsenal 比较接续\n\n## 当前决定与准备结果（原14.365 n续跑架构与session-monitor构建门已通过；覆盖率单进程完成417文件／3960测试，3891PASS／1既有SKIP／68FAIL，392.80秒，未触发450秒看门狗。失败集中于WMP夹具入口、resolver缺公共Hooks和Item Piles引擎报错文字。最后一项已定位V8与JavaScriptCore的TypeError文字差别，只调整测试谓词兼容两种精确形式，保留零socket调用及对象载荷成功检查；其他失败先定位跨测试环境，未改生产运行守卫、跳过测试或调低覆盖率门。\n\n其余67项失败定位为Selected Token Sync的HUD测试顶层安装8个全局模拟对象后未还原；后续WMP误判有可用Hooks.once而不初始化夹具，resolver也继承同一假game/Hooks。仅该测试保存并在afterAll恢复原property descriptor；原本不存在的属性才删除。按覆盖率原顺序运行HUD→WMP夹具→resolver的157项／906断言全过，独立审查确认8个写入均覆盖且没有改变生产逻辑。Item Piles Node14项再通过。一次带路径参数调用全仓test包装器发现其不转发参数，已立即停止自有测试进程，未把该中止运行记为验证。最终覆盖率从失败层重新执行，24项CLI、架构和构建已通过结果保留。\n\n21:58父独立复核PID55208／Administrator／127.0.0.1:30002和精确data root，API仍active、Core14.368／dnd5e6.0.5／cor-cotn。四包58文件与冻结安装计划的SHA全部相同；旧源23文件SHA、HEAD69ef911和空索引均未变化。浏览器最终整表与真实玩法原件在候选`.local/servernext-closeout/browser/`，安装、服务、旧源保护与CI各有独立JSON收据，不向仓库复制私有世界原件。\n\n## 最终验证结果\n\n固定Bun1.3.14／Node24.17.0，按原CI顺序复用有效前段、修复实际失败后续跑，22:06全部剩余门通过。首次`ci:verify`与第一次覆盖率的非零退出仍保留；不伪称首次命令一次绿色。\n\n| 验证层 | 结果 |\n|---|---|\n| 环境隔离、AGENTS及所有类型层 | PASS；最终测试隔离修复后typecheck:all再通过。 |\n| 依赖边界、循环检查、Session Monitor构建 | PASS。 |\n| CLI独立回归 | 24 PASS。 |\n| 完整单进程覆盖率测试 | 417文件／3960测试：3959 PASS、1既有SKIP、0 FAIL；358.46秒。未缩小清单或延长450秒限制。 |\n| 覆盖率 | 生产行85.84%、函数86.77%，均通过原84%／85%门；没有调低门槛。 |\n| 反过拟合／仓库卫生 | 434来源／2221路径，PASS。 |\n| 参考源码 | dnd5e5.3.3与current6均PASS。 |\n| Web构建 | PASS。 |\n| 离线Actor生成 | White Tusk Shaman，6个来源Item，0验证警告、0网络调用，PASS。 |\n| WMP修复聚焦 | 276 PASS／1248断言；实机原生Cleave另有真实攻击、伤害、HP证明。 |\n| 历史输入相关回归 | Midi96、classpack42、Selected Token20，以及各外部候选检查通过；依赖准确历史只读缓存，不宣称空白新克隆可直接重现。 |\n\n手册按受影响条目人工核对后生成，watch和目录覆盖保持；页面目视沿用用户此前明确延后决定，不冒称本轮已做浏览器视觉接受。功能整合提交`a3ae8c2ed95af3919834eb0f4564cfa5fe1a8899`已从主工作区执行fast-forward，主树及索引干净，合并后33项手册门再次通过。本条最终状态记录另作纯文档提交，不改变已验运行代码；最终HEAD和现场由候选`.local/servernext-closeout/final-integration-receipt.json`记录。远端push、生产部署、旧工作树清理均未执行。\n","docs/reviews/2026-10-11-suite-handbook-h3-module-status-and-deck-help.md":"# H3 模块状态与 Deck 可选帮助契约\n\n日期：2026-10-11。候选为Suite0.2.0与Deck0.2.0；运行目标仅既有ServerNext/Core14.368/dnd5e6.0.5，Forge使用的Mirror不参与。当前接受结果由[执行总账](../plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)维护，本文不因构建成功自动宣称实机通过。\n\n## 精确来源与事实\n\n- Core14.368本机`client/game.mjs:629`以返回的module数据构造`game.modules` Collection；`client/packages/module.mjs`把`active`设为只读布尔属性。状态读取只用Collection查找、active及安装版本，不修改module记录或读取持久设置。\n- 已接受的H2 ApplicationV2生命周期继续适用。模块启停通过Foundry原生管理及页面重载生效；“刷新状态”仅重读当前客户端的模块表，不替代重载。\n- Suite公开帮助接口增加`apiVersion:1`。这是帮助契约版本，和module自身0.2.0版本分开。消费者检查module存在/已启用、api.moduleId、apiVersion及openHelp函数后，调用稳定entryId。\n- Core的render返回不代表调用方权限门已经成功；Suite与Deck帮助在render后继续复查GM。后备帮助恢复最小化并置前，避免重复点击留在旧窗口后方。\n\n## 本批边界与反证\n\n| 边界 | 实现 | 能推翻假设的检查 |\n| --- | --- | --- |\n| 视图与宿主 | shared reader只接收纯状态快照，不获得Foundry对象；standalone不查询状态 | 多root、非模块条目、静态宿主均不访问状态端口；刷新不换文章节点/滚动、URL/title或存储 |\n| 安装状态与功能支持 | 已启用/未启用/未安装/未知及实际版本独立呈现，功能适用范围继续来自人工说明 | 缺失/异常记录保留未知，未知版本不能被当作已验收版本；API和设置写调用均为零 |\n| Deck可选帮助 | 正确ABI打开Suite的open-session-deck条目；缺失/停用/未知ABI/打开失败改用随包只读窗口 | 实际停用Suite并重载后Deck仍打开本模块帮助；再启用后正常定位统一条目；非GM不能进入后备窗口 |\n| 单一正文 | Deck docs/manual.json是唯一可编辑条目，中央modules.json只保留source；本模块帮助和合集投影读取同一记录 | owner/路径/覆盖/重复ID拒绝，源文件变化使review失效；构建和真实帮助正文一致 |\n\nDeck不导入Suite私有源码，不增加Foundry硬依赖、第二个世界连接或新的业务命令。帮助不调用Deck的openPanel/openPopout，不保存lastOpenMode，不写Actor/Combat或settings。正常打开Deck的既有偏好保存属于验收准备，须与帮助观察区间分开并按原值恢复。\n\n## 来源与后续复查\n\n精确本机Core为本次接口结论依据；[官方V14 Module API](https://foundryvtt.com/api/v14/classes/foundry.packages.Module.html)仅作导航，H2已核实的窗口契约见[ApplicationV2记录](2026-10-11-suite-handbook-v14-application.md)。本批未引入外部模块、内容或新的本地化候选。\n\n新Core复查module.active/数据表及ApplicationV2契约；新帮助ABI复查双方能力检查与独立后备。实际模块版本和状态不能自动提升旧业务接受范围。源码调查、构建、安装、客户端状态、真实行为和清理分别记账。\n","docs/reviews/2026-10-11-suite-handbook-v14-application.md":"# Foundry V14 统一手册窗口：接口与接受记录\n\n日期：2026-10-11。范围为自有 `fvtt-suite-console` H2，只读阅读窗口；本文件不扩大第三方模块、dnd5e数据或商业发行范围。\n\n## 分层结论\n\n- 发现：Context7 `/websites/foundryvtt_api_v14`定位ApplicationV2与菜单接口。检索中的简化签名不作为minor版本契约。\n- 精确静态：本机 `F:/FoundryLab/foundry-v14/app/14.368/package.json` 为14.368.0；读取其ApplicationV2与ClientSettings实现。Core授权源码只读核对，不复制进本模块。\n- 实现：使用独立ApplicationV2子类，直接实现`_renderHTML/_replaceHTML`，避免为了空容器新增模板依赖。菜单type是同一单实例类，API每次核GM/Core。\n- 真实接受结果由[执行总账](../plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)维护；本文只记录接口与接受边界，不把构建/替身测试提升为Foundry或Chrome已通过。\n\n## 接口事实与最小反证\n\n| 精确来源 | 本项目采用的事实 | 适配与反证检查 |\n| --- | --- | --- |\n| `client/applications/api/application.mjs` 的render流程 | frame在_renderHTML前创建，返回结果传_replaceHTML；_onRender被等待 | 在_replaceHTML先dispose旧阅读器，再挂载新root；替身按同序执行，实机重绘后只有一组有效监听器 |\n| 同文件close流程 | _preClose被等待，发生在关闭动画/tearDown之前；_onClose不等待 | _preClose同步释放reader，再等待父方法；复制Promise在关闭开始后完成不得改UI |\n| `client/helpers/client-settings.mjs` 的registerMenu | type接纳ApplicationV2子类；只写菜单注册表，不调用settings.set | 注册一次restricted菜单；实际阅读前后核设置值与世界文档事件；启用模块的安装准备单独记录 |\n| ApplicationV2 options/_renderFrame | 普通div窗口、section.window-content、resizable；继承默认options | 专用frame class及window-content container，360–1000px窗口检查布局；不向body/nav/button写全局样式 |\n\n本模块不读取Actor/Item/dnd5e系统数据。Core门只接纳14.368，manifest、源码常量、package和构建身份一致；具体运行目标仍需本批实际核对。\n\n## 资料与实际使用案例\n\n- [官方V14 ApplicationV2 API](https://foundryvtt.com/api/v14/classes/foundry.applications.api.ApplicationV2.html)：public/protected可见性与签名导航。页面不承诺具体minor build。\n- [官方ApplicationV2原始设计issue](https://github.com/foundryvtt/foundryvtt/issues/5441)：源作者对渲染/关闭排队和生命周期设计的原始说明；属于历史设计背景，采用行为已由14.368本机源码重新核实。\n- 当前仓库Deck `src/surfaces.ts`提供既有ApplicationV2使用实例；只参考边界，不跨模块导入其私有实现或照抄其业务行为。\n\n## 待判断本地化与复查\n\n本批没有新增第三方模块候选或翻译任务。正文沿用手册人工核对的同源目录；商业内容/许可白名单在H4处理，不因进入本包自动取得分发许可。\n\n新Core候选复查：重新核package与API文件SHA，核_renderHTML/_replaceHTML/_onRender/_preClose/registerMenu的契约差异；先跑窗口/拒绝路径，再以新客户端接受，不推广旧build PASS。新dnd5e版本只有涉及数据API时才进行相应系统适配，不为只读手册连带升级系统。\n\n本地原始API检索位于本任务 `.local/suite-direction/h2-application-api.md` 与 `h2-application-lifecycle-issue.md`；最终公开结论引用本机精确源码和实际验收，不用检索摘录代替运行。\n","docs/reviews/2026-10-12-suite-handbook-h4-delivery.md":"# H4 手册双交付与本地模块包契约\n\n日期：2026-10-12。Suite候选0.3.0，帮助ABI1；只读窗口仍适配精确Core14.368，不调用dnd5e数据接口。当前接受与已知缺口由[执行总账](../plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)维护，本文固定交付接口和检查边界，不把准备成功当作外部发行。\n\n## 两个读取面\n\n`docs/handbook/delivery.json`显式登记28个Foundry用户条目和8个仅离线条目，并逐项写明工程/历史归属原因。完整离线HTML保留全部36个稳定ID、来源、review及监测；Foundry导出保留选中条目引用的公开sources和review日期/fingerprint，详细review note替换为用户用途摘要。Foundry更新页同样只显示用途和核对日期；完整工程核对正文保留离线。引用的原始文档仍可能带技术或历史背景，不声称逐段删除这些原文。\n\n两侧ID必须构成完整且不重叠的目录分区；新增ID未登记、未知/重复ID或没有排除理由时拒绝构建。没有缩小watch或新owner覆盖，不修改各条目实际功能和支持范围。\n\n- `handbook:export`生成完整`dist/handbook/content.json`。\n- `handbook:export:foundry`生成`content.foundry.json`和`projection.foundry.json`，后者列出保留/省略ID、引用/排除来源和总目录计数。\n- 根`工具手册.html`始终使用完整投影，继续是无需服务、网络或Foundry的单文件。\n\n## 模块包和独立文件\n\nSuite模块ZIP严格只含`module.json`、`scripts/index.js`、`styles/suite-handbook.css`、自包含`README.zh-CN.md`和`build-identity.json`。不带其他模块、完整工程HTML、fixture、测试、reference或本机工具。完整HTML作为release目录中的独立文件交付，不装入用户模块目录。\n\n`release:suite-console`先检查手册review与根HTML同步，再构建Foundry投影和确定性ZIP，输出同字节独立manifest、完整HTML、SHA256SUMS和机器可读交付清单。校验和覆盖ZIP/manifest/HTML；清单绑定白名单、字节数、每文件SHA和离线HTML源/交付SHA。原有工程README不直接作为安装后帮助，打包使用本模块的`docs/INSTALL.zh-CN.md`。\n\n路径/树检查拒绝链接、硬链接、未知残留和不安全ZIP路径，不清空目录或靠强制删除继续。浏览器bundle的可执行加载/求值拒绝继续有效，文档命令只作为字符串。\n\n## 最小反证与接受范围\n\n| 接口/风险 | 所选检查 |\n| --- | --- |\n| 完整目录与显式省略 | 28+8穷举、36ID离线保留、17runtime映射、未知/重复/未登记拒绝 |\n| 工程来源错误进入Foundry | 专用fixture的独占sources/reviews在Foundry消失、完整HTML仍保留；未引用来源不得带入 |\n| 更新页泄露工程核对过程 | 用户页显示用途/日期，原工程note在视图及Foundry导出消失；原note仍在完整离线HTML，日期/fingerprint不变 |\n| ZIP与manifest/HTML不一致 | 实际ZIP逐文件读回/CRC/bytes/SHA，独立manifest同字节、HTML不在ZIP且独立文件与根源相同 |\n| 陈旧或不安全输出 | 实际build前置handbook:check、拒绝未知树/链接/硬链接、固定白名单/危险路径拒绝 |\n| 确定性与首次成本 | 两次实际构建SHA相同、记录包/JS/HTML大小；Foundry测首次和重复打开，不用世界启动耗时冒充窗口首开 |\n| 正式发行 | 保留真实品牌/授权/渠道/下载地址及渠道安装接受的前置，不伪造地址或批准 |\n\n旧H2/H3未变的阅读、帮助和权限证据按相同实现复用；H4实际运行只补投影/包身份/首开与读取面变化。不重试此前被拒绝的file URL，不托管HTML或换浏览器通道追认视觉。\n","docs/runbooks/babele-zh-maintenance.md":"# 中文 Babele 汉化维护入口\n\n当用户在本 Codex 项目中讨论中文 Babele 补丁的上游更新、自有译文增补或合并安装包时，实际工作对象为独立项目：\n\n`I:\\OpenCode\\fvtt-babele-zh-maintenance`\n\n用户明确选择继续在当前 `fvttV12JsonGenerator` 项目里交流，不另建 Codex 项目。这里拥有路由与工具手册入口；独立项目拥有源码、译文、锁定状态、冲突计划、构建产物及架构。\n\n## 接续步骤\n\n1. 读取独立项目 `AGENTS.md`、`README.md`；涉及架构或范围时读取 `docs/architecture.md` 和 `docs/requirements.md`。\n2. 在独立项目核对 Git 状态、当前 state 与 overlay；不把当前生成器仓库当作译文存放位置。\n3. 用户只问现状时运行 status，只问有无新版时运行 check-upstream；明确要求更新时运行 update。没有后台监听或定时任务。\n4. 无冲突自动合并；同处冲突输出三方值，按照用户逐项选择完成。维护版本仅在 ZIP 构建和读回完成后切换。\n5. 报告实际上游版本、本地增补、输出路径与验证范围；安装进 Foundry、Git 提交、合并或推送依照对应明确授权执行。\n\n## 从当前目录运行\n\n```powershell\npython -B \"I:/OpenCode/fvtt-babele-zh-maintenance/maintain.py\" status\npython -B \"I:/OpenCode/fvtt-babele-zh-maintenance/maintain.py\" check-upstream\npython -B \"I:/OpenCode/fvtt-babele-zh-maintenance/maintain.py\" update\n```\n\n入口默认按脚本位置定位维护项目，当前 cwd 不改变目标。精确参数及冲突决策文件格式以独立项目的 `--help` 与 README 为准。\n\n## 当前基线与交付边界\n\n- 初始上游 1.0.194，锁定 ZIP SHA-256 `abe1c245469b4a0f7dc9427c59ace8dbc1adcd92d9ba84891006112c6c1f9dcf`。\n- 首个增补：水晶浩劫 Crystal Chaos 1.0.1 的 21 个法术，独立保存译文、来源和既有数据引擎证据。\n- 后续怪物增补覆盖相同原包全部16个Actor、162个嵌入条目、97个效果，并补译直接依赖的潘多拉2篇日志和晶蚀涌动表4项结果。分别保存3个独立overlay，与既有法术一并构建；清单及原包规则/自动化差异见独立项目 `docs/crystal-monsters.md`。\n- 名称常驻规范：生物名称、独立特性/动作/反应/附赠动作及物品名称为 `中文 English`，中间一个空格、不加中英括号。水晶浩劫Token与子活动按对应名称同步；规则、其他字段建议及动画精确匹配边界见独立项目 `docs/bilingual-names.md`。\n- AI翻译术语参考位于独立项目 `glossary/`：先读README、core-terms.md和overrides.csv，专名按类别/版次/原书查terms.csv，多义项查variants.csv。来源为用户指定的DND五版不全书CHM；Force伤害类型为力场。术语表不改机器枚举，也不会自动本地化系统生成的Force标签，见本项目 `docs/reviews/2026-10-25-babele-force-label-and-glossary-boundary.md`。\n- 按用户选择，自用包取消上游 manifest/download 更新地址，后续通过维护项目更新；包内保留原上游清单和来源。\n- 原有 Babele 2.9.1 的315项数据引擎检查属于旧独立包。2026-10-25的新合并包已在第三干净环境 Core14.368 / dnd5e6.0.6 / cn中完成水晶浩劫21法术API和来源语义对照，并检查5种原生说明界面、4个效果页/图片及召唤链接实际点击。\n- 第三环境为 `F:\\FoundryLab\\foundry-v14\\data\\babele-clean-v14`，用户地址 `http://babele-clean.localhost:30003`，实际仅监听127.0.0.1。独立主机名隔离多实例同名登录Cookie；只换端口不能隔离Cookie，无需修改hosts。仅安装水晶浩劫、Babele、合并汉化包及必要依赖；本轮没有安装、重启或改动Next/Mirror。\n- 本轮修复召唤Actor链接、4个效果图片、蓝宝石尘30秒对应轮数，以及dnd5e6.0.6将0.5分钟显示为1分钟的问题。显示适配器只改指定来源的卡片文字，时长数据不变；系统升级后须复核守卫。\n- 源文3处问题已由用户裁定：水晶冲击示例为2d4力场加2d6穿刺；黄玉壁垒统一墙体指代；水晶与镜像仅范围伤害结束。实际包与复验进度见独立项目 `docs/clean-lab-acceptance.md`，不能将首轮旧哈希的通过直接推广到新正文。\n- 本次汉化验收不覆盖施法/战斗自动化、整本Adventure、上游所有译文、多人或长时运行；上游manifest仍verified13。\n\n本仓库的手册只维护这一外部项目入口与操作边界；外部项目的实际实现、测试和交付记录在其自身仓库维护。\n\n## 查看包内内容目录\n\n独立项目根文件 `I:\\OpenCode\\fvtt-babele-zh-maintenance\\中文Babele内容目录.html` 为单文件离线目录，包含当前包的99个来源目标，支持名称/ID搜索、类别/内容类型/发布方筛选、展开全部合集及打印。官方/第三方分类、原始导出格式和实机验收范围分别标明；统计口径及重建命令见独立项目 `docs/catalog/README.md`。页面来源日期和ZIP哈希指明具体快照，不承诺持续更新。\n\n版本栏分开显示dnd5e系统最低/verified/最高、2014/2024规则证据、FVTT官网支持/Verified及原包Core清单。另有本包规则与原包当前规则的独立筛选；两处Core声明不同会同时保留。未声明、非标准声明和未取得清单分别标明，不能从缺失上限或官网声明推断汉化快照已验证兼容。\n","docs/runbooks/custom-conditions-and-trigger-engine-usage.md":"# Custom Conditions 与 Trigger Engine 使用说明\n\n十九种通用状态仍对应 Foundry14.364 / dnd5e5.3.3。2026-10-02 候选把独立的分层伤势迁入 Custom Conditions，并为伤势路径加入 ServerNext14.368 / dnd5e6.0.5 精确版本门；这不开放 6.0.5 的十九种通用规则，也不把旧接受推广到新所有者。迁移目标与验收出口见[伤势所有权计划](../plans/2026-10-02-injury-condition-ownership.md)。\n\n基础发布边界见[候选收尾表](../reviews/2026-09-21-custom-conditions-release-readiness.md)；状态文案的来源边界见[规则核对](../reviews/2026-09-23-drakkenheim-condition-wording.md)，全 19 项的 ID、点击路径与 CoTN 页面复验见[入口审计](../reviews/2026-09-24-all-custom-condition-hud-audit.md)。历史全 19 项入口可见通过，不代表逐项施加、结算或本轮新组合已复验。\n\n## 启用与打开\n\n本地候选包位于 `foundry-modules/fvtt-trigger-engine/dist/fvtt-trigger-engine.zip` 和 `foundry-modules/fvtt-custom-conditions/dist/fvtt-custom-conditions.zip`。目前没有公开发布manifest地址；这些是本worktree的本地交付物。安装到其他实例前应核对版本兼容性与目标授权，不能直接覆盖正在使用的模块目录。\n\n安装两个独立模块，在世界的模块管理中启用 Trigger Engine 和 Custom Conditions，按提示重载页面。Custom Conditions依赖Trigger Engine；核心功能不要求Midi-QOL、DAE、Times Up或Effect Macro。\n\n以GM选中或标记目标Token，从模块设置菜单或Token控制栏打开“管理自定义状态”。存在标记目标时优先使用标记目标，否则使用选中的Token。改变目标后点击刷新，确认面板显示的Actor名称再操作。\n\n## 手动状态和参数\n\n名称和悬停规则说明跟随 Foundry 的核心界面语言：`cn` / `zh-CN` 为中文，`en` 或没有对应翻译的语言回退英文。改语言后重载世界。系统与模块没有两套彼此独立的语言选择。十九种自定义实例各使用一张选定的 Game-icons.net 原始 SVG，作者、作品、来源和 CC BY 3.0 许可见模块包内 `CREDITS.md`。笨拙使用 Drop Weapon，踉跄使用 Foot Trip。Token Action HUD 的完整提示使用 dnd5e 规则卡布局：左侧双语标题、右侧状态类别和分段正文；状态图标只留在 HUD 按钮，不放大到提示框内。仅名称和无提示模式仍按 TAH 设置生效。**所有 19 个自定义状态**使用 `fvtt-custom-conditions.\u003c语义 ID>` 的独立状态 ID；dnd5e 原生与其他模组的裸 ID 按钮保留其原有规则。CoTN 中系统原生 `bleeding` 的中文按钮是「失血」，本模块自定义 `fvtt-custom-conditions.bleeding` 是「流血」；原生 `burning` 为「燃烧」，自定义 `fvtt-custom-conditions.burning` 为「灼烧」。自定义 Dazed 标题只显示「恍惚」或 Dazed，不显示辨识用后缀，仍与 MCDM 的裸 `dazed` 分立。不能把原生按钮当作已配置自定义骰式的实例。\n\n伤势由 Custom Conditions 自身管理。在模块设置打开“启用伤势自动化”，按需打开“管理 NPC 伤势”；新世界两项默认关闭，升级沿用旧伤势模块已有意图。在管理器的伤势区域查看或调整 0–3 层，不要求安装复活模块。Token HUD 左键增加、右键减少；状态标签显示层数。伤势采用此前选定的 Game-icons Bandaged 原 SVG，作者、来源和许可见 Custom Conditions 包内的 `CREDITS.md`。\n\nHP 归零开启倒地 episode；第一次恢复正 HP 增加一层，恢复满血或成功短休／长休清除。死亡豁免只认保留的自然 d20 面值：19／20 清零成功与失败并恢复 1 HP，修正值和被丢弃的骰不算。第三层倒地先由 GM 裁定直接死亡、环境例外或稍后处理，不提前写入死亡。\n\n升级时，新伤势写入 `flags.fvtt-custom-conditions.injury`；旧伤势原件及复活历史保留。复活模块后续只写自己的 `fadingSpirits` 状态。未知 schema、重复投影或相互矛盾的数据会停止自动迁移并提示，不能靠重新点按钮绕过。仍写伤势的旧复活模块与新 Custom Conditions 同时启用时，伤势自动化拒绝运行，须使用配套的新版本。\n\n可选的“消逝的灵魂”继续提供独立复活，兼容模块 ID 为 `fvtt-injury-fading-spirits`。启用后，伤势区域提供复活仪式入口；没有它也能管理伤势，没有 Custom Conditions 也能使用其独立复活。成功复活经公开接口抑制相应 HP 恢复计层，实际 HP 由法术或 Activity 处理。两模块的 UI、HP、休息、自然19／20与重载联合行为仍按本轮候选单独接受。\n\n选择状态，在参数JSON框中填写该状态的参数，再施加。切换到另一种状态时应按新状态填写参数，不要沿用上一种状态的无关字段。没有参数的状态使用 `{}`。\n\n| 状态 | 最小参数示例 |\n| --- | --- |\n| 自定义流血（内部 ID `bleeding`） | `{\"formula\":\"2d6\"}` |\n| 灼烧（内部 ID `burning`） | `{\"formula\":\"2d6\",\"damageType\":\"fire\"}` |\n| Frozen | `{\"escapeDC\":15}` |\n| Jinxed | `{\"formula\":\"1d6\"}` |\n| Valor | `{\"formula\":\"1d4\"}` |\n\nToken Action HUD 中已生效的 Jinxed、Valor 实例显示其骰子面数，例如 `1d6` 显示 `6`、`1d4` 显示 `4`。这是骰式标识，不是掷骰结果；复合骰式显示紧凑式，过长时角标截短，完整式可在状态管理器查看。\n\n冻结与震愕的说明直接展开其所附状态的效果，阅读时不用再翻查「定身／无防备／恍惚」。冻结使速度为 0、不能受益于速度加值，飞行中会坠落；针对目标的攻击检定有优势。其特殊重击条件限于**使用造成钝击伤害的武器**命中冻结目标，不是任意钝击法术或普通徒手打击。天生武器只有被具体规则认定为武器且在 Foundry 中可被活动数据识别时，才能指望自动判定覆盖。本模块的自定义「恍惚」在自己的回合可从**自主移动、执行动作、执行附赠动作**中选择一种；选择后不能再做另外两种。震愕继承这条恍惚规则，另使针对目标的攻击检定有优势，并让目标掉落手中物品，拿取、拔出或收起物品各需 1 个动作。因此震愕目标若已选择移动或附赠动作，本回合不能再拿取／拔出／收起物品。两种状态都不额外禁止反应；「震愕」也不表示只由闪电伤害造成。攻击掷骰进入求值时，会在本客户端临时锁住所选类别；若掷骰异常失败而没有完成 Hook，本回合保守地继续限制，下一回合自动重置。跨客户端同时操作同一 Actor、两个独立非攻击活动弹窗交错完成仍需单独验收。这一三选一是本项目按用户决定采用的自定义规则，见[规则变更记录](../reviews/2026-09-24-dazed-three-choice-rule.md)。\n\n英勇在攻击检定或豁免检定时额外掷实例骰式并**加**到结果；厄运使用相同结构但**减**去骰值。虚弱使武器攻击或法术造成的伤害总值减半，结果向下取整；若聊天卡仍显示含小数的伤害表达式，以目标 HP 实际应用的整数为准。踉跄在自己的回合最多完成一次武器或徒手攻击；这比目前可公开核对的 Drakkenheim Beta「武器攻击」文字范围更广，是本项目的明确选择。正式版 Appendix C 的条件原文尚未逐条公开核对，不把这里的措辞称作正式中文版原文。\n\n在已选 Token 的 Token Action HUD 中，鼠标离开时动作区可能隐藏；打开「效应」组。active GM 对单个明确 Actor 点击自定义流血、灼烧、冻结、厄运或英勇，会打开**绑定该 Actor 且预选所点状态**的管理器，点击本身不施加效果；先填写流血/灼烧的骰式、灼烧伤害类型、冻结解除 DC、厄运/英勇骰式等必填参数，再提交。其余 14 项经 Custom Conditions API 切换带本模块 flag 的实例，不能通过系统默认状态开关来代替。目标不明确、无 active GM 权限或同状态有多个实例时，以提示和管理器核对为准，不退回系统默认切换。仅由冻结/震愕的复合效果提供的子状态会显示生效；点击子状态不会暗中再建一个独立实例，应到管理器处理实际来源。旧版带本模块 flag 的实例仍按原存储读取并点亮自定义 HUD 项，原生流血/燃烧不会点亮本模块项目。\n\n2026-09-23 的 CoTN [现场核查](../reviews/2026-09-23-cotn-burning-hud.md)只看到原生燃烧按钮；2026-09-24 的[灼烧入口验收记录](../reviews/2026-09-24-custom-burning-hud.md)只确认当时「燃烧／灼烧」并列。此后的[全 19 项 CoTN 复验](../reviews/2026-09-24-all-custom-condition-hud-audit.md)已确认 19 个自定义按钮均可见、无重复，且点击自定义「流血」打开绑定 Actor 的空参数表单；其余按钮的逐项点击与结算未在这一轮执行。Token Action HUD 保存的个人布局按 action ID 匹配；本轮现有布局显示正常，但旧布局中的隐藏与排序偏好未证明会自动迁移，若个别入口未出现，应先检查该用户的「状态」组布局，不要清空他人的偏好。\n\nBleeding默认在自身回合结束时失去生命值，恢复生命值后解除；Burning默认回合结束造成指定类型伤害。来源明确指定回合开始时，可在参数中加入 `\"timing\":\"turnStart\"`。结束说明只是说明文字，不会把任意自然语言自动变成触发规则。\n\nBleeding与Burning在同Actor上各自只保留一项较高值，按骰式期望值比较，平手保留原值。Burning不同伤害类型仍一起比较。它们不是多层相加，也不按每次随机掷骰结果临时决定强弱。\n\n编辑：面板中点击已有实例的编辑，修改参数后保存。停用会保留实例信息但暂停作用；移除则解除实例。来源栏用于记录“这个状态从哪个能力或物品来”，不需要普通使用者手写技术地址。\n\nFrozen实例的“破冰（动作）”按钮会进行力量（运动）检定。默认目标自救；标记被冻结目标并另选一名协助者时，可由协助者检定。GM先判断其是否能接触目标。取消不耗Action，完成失败耗Action但状态保留，成功则解除。\n\n## 怪物生成与模板\n\n来源必须明确给出状态参数，例如Frozen的DC、Jinxed的骰式。使用正式生成器输出Actor JSON，再通过Foundry的Import Data导入。攻击Item中的Condition效果是可施加模板，不应让持有该Item的怪物自己中状态。\n\n模板应用使用模块公开的 `applyFromItem` 流程，将来源参数复制到目标Actor实例。已有自动化可以调用此接口；仅导入Item并不等同于每次命中都已自动完成目标选择和规则裁定。当前管理器用于直接施加/管理状态，不能把API验证描述为已经提供所有“一键命中套用”的UI。\n\n不要手工修补最终生成JSON来补来源没写的DC或骰式。来源缺参数时先补充来源，或由GM在
