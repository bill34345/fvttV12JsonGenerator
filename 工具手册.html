 CI 未覆盖的组合。保留产品与运行时身份不变的旧玩法证据，只对最终组合执行必要的集成 CI、指令生成/一致性和合并前后手册检查；手册冲突按条目合并、人工核对后生成，不复制旧 HTML 或丢掉共用选择门禁。实际提交、master 读回和停止状态以[本地集成结果](H:/CodexData/visualizations/2026/10/03/01a1010c-9d38-7421-9098-596a96bc261a/painter-master-integration-final-20261005.json)为准。下方“没有commit/merge”的文字保留为授权前停点，不再限制这次明确授权。\n\n本地集成 CI 首次已通过隔离、指令、手册、类型、架构和 Session Monitor build，随后 CLI Item Intake 正例在原 20 秒子进程期限退出143（仅有 Loaded spells 输出，23 pass/1 fail）；CLI/fixture 本身未由本轮产品补丁修改。新增核查仅针对这个必需集成门禁：先用 `bun run test:cli` 窄复验、核对子进程/本地 provider 收集层，保留既有通过的前段和实机证据，不因工具层超时重放玩法或增加时间预算。\n\n同一产品代码、原期限下 `bun run test:cli` 窄复验为24 pass/0 fail；没有修改CLI测试或提高期限，首次超时原因仍未确认。为取得完整必需门禁的真实退出状态，再运行一次 `bun run ci:verify` 完成尚未执行的覆盖率、anti-overfit、资料及构建/离线烟测；不以窄复验冒充完整CI通过，首次失败原件保留。\n\nCI r2中CLI已通过，369文件覆盖率的明确失败为Web API incremental crawl案例在约1681ms未完成，另有同一job ID的Job not found异步清理错误与Bun describe登记错误（总结3546 pass/1 skip/2 fail/2 errors；未直接证明后者因果）。该测试的轮询只有30×50ms；旧r8成功同案例也用了1534ms，本轮超时后finally关闭本地模拟站点，后续请求记录ECONNREFUSED。必要修复只增加一份API测试文件：两个真实抓取案例可轮询10秒以取得终态，其他案例保持原1.5秒轮询，所有案例仍有既有30秒期限；不改Web产品或CLI期限。先按局部AGENTS执行API测试，再核完整CI；保留其余通过片段及r1/r2失败原件。\n\n最终API局部40 pass/0 fail；完整 `bun run ci:verify` r3退出0，含369文件覆盖率、coverage阈值、全量anti-overfit、仓库卫生、锁定dnd5e5.3.3参考、Web构建和Actor离线烟测。CLI与两个抓取案例在完整运行中通过，异步清理/describe错误未再出现；首次CLI超时原因仍保持未确认。本次只做剩余记录/手册同步和本地master fast-forward，之后停止；业务/素材原字节与Mirror已装Forge0.4.0保持，最终HEAD及合并后读回见本地集成结果，不运行下一批实机或推送远端。\n\n## 当前完成停点（2026-10-05）\n\n最后文件收尾已明确 [本地集成范围](local-integration-scope-2026-10-05.md)：Painter 本体与工作流、Mirror 精确配对兼容补丁、Lab/CI 支持和手册分别归属；主线已含的 inspection 测试不重复集成，共用 validation-selection 的 17 文件按当前 master 保留。Forge 本树仍是 0.3.0，已装 Mirror 是另一个任务的 0.4.0 受限兼容构建；本轮只交付兼容补丁，不接管蓝图业务源，不用旧普通 build 覆盖新版。\n\n此次只补文件范围和手册说明，产品代码、音频与原运行时证据未变。必要检查仅为来源/安装 hash、路径/链接、暂存基线保持及 Painter/Forge 手册一致性；完整 CI、Chrome 和 Foundry 接受不因这次文档整理重跑。范围收尾后保持停止，没有业务 commit/merge/push 或工作树清理。\n\n**本轮限定技术目标已完成，停止新增开发／验收，无后台监控或自动下一批。** 结果见[本轮完成记录](completion-2026-10-05.md)。升级14.368／保持5.3.3、原版独立对照、自有六长源重做与能量原字节、主要三格型／玩家与音频技术缺口已闭合；HexRows清地和玩家Energy远返由真人完成，不能称自 源码与失败原件均保留。\n\n以后收到用户明确继续指示，先核候选/dirty状态、现有服务/世界/实际Chrome连接与标记对象，再按具体缺口推进。复用原3夹具、Scope BP368-20261003和完整initializer；不能重新Prepare或用readonly observer代替Restore/Clean。不得用暂停解除以前的版本/写入/数据保护边界。\n","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md":"# Battlefield Painter 接受入口\n\n## 当前候选与实际边界（2026-10-04）\n\n当前候选为`0.3.0-alpha.2`，Mirror目标为用户指定的`14.368 / dnd5e 5.3.3`；既有`14.364 / 5.3.3`和Next切片证据单独保留。当前真实状态以[接续入口](CONTINUATION.md)、[升级与原版对照](../../../docs/reviews/2026-10-03-foundry-14-365-mirror-upgrade-and-tile-arsenal.md)和[V3接入](audio-v3-integration-2026-10-04.md)为准。下面的alpha.1/P2清单是历史规划，不把旧无音效、阶段形态、版本、组合或长时要求自动套到当前默认美术。\n\n- 已接受：当前服务与模块身份、原版独立安装、保存开关完整性、来源代码必要兼容、Core条件/优先级/Injury窄接受；五组旧音源原版对照与V3七独立音源的加载/播放进度/循环、近远、主音量参数、Fire撤销重做/刷新/擦除及最终恢复。\n- 继续补核：三格型代表交互、纵列六角26个basic配置/36阶段，阶段模式、Region孔洞/去重、Shift收起恢复、真实拖拽/玩家可见与播放器、最终一次清理和全部非任务文档保持。\n- 当前阶段模式只改命中格位；`advanceCellKeys`会保留同笔未命中格位并拆出下一阶段，不以面板的未来绘制stage字段代替实际Tile/Region读回。阶段10的第一次尝试收据为`active=false`，不能作为已启用画笔的阶段交互接受。\n- 本轮保持批准美术、默认关闭声音和能量原文件；狂野魔法/裂隙仅已有basic视觉，不追加深玩法。无用户主观音色接受、弱GPU/大面积/四小时或生产接受，不新增这些运行。\n- 使用同一组标记夹具与当前官方Chrome；Readonly观察工具与完整Initializer分开，最终重导完整工具后恢复/清理。GM/SY权限按实际读回，只对本任务Macro授予必要的文档访问，不改全局账号权限。\n\n## 历史 Exact Foundry 14.364 Acceptance Checklist\n\nStatic checks and build output do not satisfy this checklist. Run these in the approved local Lab with Foundry `14.364` and dnd5e `5.3.3`, using a disposable test Scene. Record screenshots, console errors, document counts from `api.auditScene()`, and any recovery action.\n\n## Environment identity\n\n- [ ] Confirm executable/build reports Foundry `14.364`.\n- [ ] Confirm world reports dnd5e `5.3.3`.\n- [ ] Confirm destination is under `F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\modules\\fvtt-battlefield-painter`.\n- [ ] Confirm module `0.3.0-alpha.1` appears and enables without manifest warning.\n- [ ] Confirm no browser console error during `init`, `ready`, Scene load, or canvas teardown.\n\n## Square grid\n\n- [ ] Open the Tiles control group; confirm the GM-only painter button appears.\n- [ ] Open ApplicationV2 panel; confirm the three terrain previews, Chinese labels, stage controls, and active states render.\n- [ ] Confirm free/line/fill controls, radius 0–4, and undo/redo disabled states render correctly.\n- [ ] Move the pointer without painting; confirm preview follows cells, respects radius, and disappears on canvas leave/deactivation.\n- [ ] Paint radius 0 and 4 strokes; verify no duplicate owned cell is created.\n- [ ] Drag a line in both directions; verify the preview and committed cells match core direct-path behavior.\n- [ ] Drag fill in all four endpoint directions; verify the inclusive offset area matches the preview.\n- [ ] Paint connected and disconnected cells for each terrain/stage.\n- [ ] Confirm Tiles exactly cover their grid cells and preserve transparent edges.\n- [ ] Move a token through every Region; verify measured cost is ×2 for supported movement actions.\n- [ ] Confirm stage-I and stage-II fire create the intended native light and torch animation.\n- [ ] Confirm only stage-II brambles block movement; sight/light/sound remain unblocked.\n- [ ] Erase one cell from the middle of a multi-cell stroke; verify the remainder survives and Region/Wall geometry is rebuilt.\n- [ ] Target one cell with stage-switch; verify the complete original stroke cycles stage.\n- [ ] Paint over an owned cell; verify it is skipped instead of duplicated.\n- [ ] Deactivate the painter; verify normal Foundry canvas controls resume.\n- [ ] Undo and redo paint, erase, and stage-switch; verify foreign documents remain unchanged.\n- [ ] Undo, then make a new edit; verify redo is cleared.\n\n## Hex grid\n\n- [ ] Repeat all three terrain paints on a hex-row Scene.\n- [ ] Repeat all three terrain paints on a hex-column Scene.\n- [ ] Confirm Tile bounds do not displace the artwork relative to cell centers.\n- [ ] Confirm Region polygons match all six vertices.\n- [ ] Confirm adjacent bramble cells remove their shared Wall edge.\n- [ ] Confirm erase and stage-switch reconstruct the same hex offsets.\n- [ ] Repeat radius, line, fill, preview, undo, and redo on hex-row and hex-column Scenes.\n\n## Failure and recovery\n\n- [ ] Temporarily provide invalid Region behavior data in a disposable fixture; confirm Tile creation rolls back.\n- [ ] Verify `auditScene()` counts match visible owned documents.\n- [ ] Reload the world and confirm ownership flags still support erase and stage-switch.\n- [ ] Disable the module and confirm foreign Scene documents are untouched.\n- [ ] In alpha, disable P1 through `api.setDevelopmentPhase(\"p1\", false)` and confirm the panel falls back to free radius 0 without preview/history controls.\n- [ ] Re-enable P1 and confirm the controls return; then verify release packaging with phase controls immutable before formal release.\n- [ ] Remove all P0 test documents before ending acceptance.\n\n## Deferred until final unified runtime acceptance\n\n- legacy-sound cleanup and no-new-audio request checks;\n- transparent WebM animation;\n- very large battlefields and long-session memory/performance;\n- production environment installation;\n- four-hour real-session soak.\n\n## P2 final-pass additions\n\nRun these only in the final unified environment pass after all development phases are complete. Clear module-owned documents between phase combinations; do not treat static tests as runtime acceptance.\n\n- [ ] Confirm the module reports `0.3.0-alpha.1`; canonical compatibility media plus Fire/Frost field media remain valid in the build inventory. New P2 Square Fire/Frost must not request `fire.webm` / `frost.webm`.\n- [ ] Run with `P0` only; confirm static WebP tiles, the P0 fire light, and no AmbientSound documents.\n- [ ] Run with `P0+P1`; repeat radius, line, fill, preview, erase, stage, undo, and redo behavior.\n- [ ] Run with `P0+P2`; confirm P2 fire uses hidden logical `fire.webp` plus `visualEffect: \"fire-field-v1\"`, mounts one continuous video-backed fire mesh, and does not request `fire.webm`. Confirm Square Frost uses `frost-film-v1.webp` plus `visualEffect: \"frost-field-v1\"`, adds Stage II mist without requesting `frost.webm`, while Brambles remains on its current WebM path. All terrain creates zero new AmbientSound documents or Battlefield Painter audio requests.\n- [ ] Confirm `api.auditFrostEffects()` reports one film mesh, at most one Stage II mist mesh, shared ticker time, actual Frost cell/stage counts, and no persistent rebuild/object growth.\n- [ ] For a Square Scene, confirm `api.auditEffects()` reports one mesh covering the actual fire cells, shared ticker time, correct 15×15 counts, and no persistent rebuild/object growth; inspect single, 1×3, 3×3, L-shaped, gap, stage-boundary, erase, undo/redo, Token-layer, and pan/zoom behavior manually.\n- [ ] Run with `P0+P1+P2`; confirm complete interaction, zero new owned sounds, and at most 16 cells per fire-light cluster.\n- [ ] On a fixture containing old module-owned and foreign AmbientSound documents, confirm the GM cleanup dialog lists only owned IDs, cancel is safe, stale fingerprints reject deletion, and confirmation leaves foreign sounds untouched.\n- [ ] Paint 25, 100, and 300 connected cells; record Tile, Region, Light, zero-new-Sound, and Wall document counts and visible performance.\n- [ ] Open scene clear preview; confirm only module-owned documents are counted and foreign documents are excluded.\n- [ ] Change the Scene after opening the clear preview; confirm the stale fingerprint blocks deletion and asks for a new preview.\n- [ ] Confirm clear is one undoable history operation and foreign documents survive clear, undo, redo, and reload.\n- [ ] Repeat P2 media, zero-new-audio, clustering, legacy cleanup, and clear checks on square, hex-row, and hex-column Scenes.\n- [ ] After runtime acceptance, set release phase controls immutable and verify the phase setter is absent from the public API.\n","foundry-modules/fvtt-battlefield-painter/docs/audio-v3-integration-2026-10-04.md":"# 自有环境音 V3 接入记录\n\n用户2026-10-04选择“按原版方向重做自有音效”。方向为较长环境音、稀疏气泡和分类区别；原能量文件保持。原版只读比较，付费声音不复制或派生进自有产品。\n\n## 来源与结果\n\n6条约180秒、立体声、32000Hz Vorbis候选已制作并整合到候选源码，能量仍为原5.24秒。Fire/Lava分别混合已许可的壁炉与火焰gust素材；Acid从录音提取57个气泡事件、间隔中位约3.22秒，轻腐蚀层为辅；Holy/Unholy/MagicCircle为已许可的弥散氛围混合。来源许可、作者、链接、变化说明见[署名](../assets/audio/ATTRIBUTION.md)，两项CC BY 3.0署名随构建保留。不把公开氛围素材都称为麦克风录音。\n\n| 文件 | 全长信号 RMS dBFS | 解码峰值 | 制作/验证 |\n| --- | ---: | ---: | --- |\n| fire-loop.ogg | -16.04 | 0.906 | 壁炉底层与不规则gust，软化细碎爆裂；边界跳变量0.000832 |\n| acid-loop.ogg | -30.51 | 0.750 | 57次不规则气泡，低腐蚀层；边界跳变量0.000265 |\n| chime-loop.ogg | -29.01 | 0.231 | 弥散明亮氛围，文件名保留旧引用 |\n| drone-loop.ogg | -27.55 | 0.282 | 分层幽异氛围，文件名保留旧引用 |\n| lava-loop.ogg | -20.55 | 0.883 | 独立低频熔流/缓慢gust，120ms边界处理 |\n| magic-circle-loop.ogg | -29.99 | 0.224 | 独立安静法阵氛围 |\n\n全长解码、格式/峰值、零满刻度削波、接缝相对局部跳变、采样短窗重复检查均通过；固定种子和FFmpeg bitexact下两次生成6文件sha相同。这些是机械证据，不是主观音色接受。能量SHA256保持`a7502a3940ca3f1d0cafb81acd9cc6498c551ac5e2553bbede8c8896468b1439`。\n\n原件和许可输入bundle在本任务外部`audio-v3-draft`，根证据为`H:/CodexData/visualizations/2026/10/03/01a1010c-9d38-7421-9098-596a96bc261a`。源码采用`generate-parity-audio.py --source-root \u003clicensed-bundle> --output-root \u003caudio-folder> --report \u003coutside-audio-folder.json>`；输入哈希固定，源/报告与分发音频分开，不把个人目录或付费资产当输入。脚本不重写能量文件。\n\n独立复核发现原路径检查仅拒绝报告直接位于输出根，遗漏输入文件和嵌套目录；已在任何mkdir/写入前按resolve后的祖先关系拒绝输入/输出互相包含、报告进入任一目录树，并拒绝六个输出文件的软链接重定向。9个真实CLI检查仅使用本任务随机临时根的合成文件，全部拒绝或到达正常来源哈希校验，文件/目录状态均不变。修复后的合法输入完整重建6条与正式候选hash相等，源bundle/候选/安装的能量三处仍为批准字节。外部原件为`audio-v3-path-guard-probe.py`、`audio-v3-path-guard-check.json`和`audio-v3-pathguard-positive-check.json`；不会把机械检查升级为听感接受。\n\n## 产品与接受边界\n\n9类配置使用7音源，仍默认关闭、每笔1个拥有标记的AmbientSound。新笔画起始volume为Fire0.8、Acid0.26/0.4、Holy0.3、Unholy0.7、Lava0.8、MagicCircle0.25；Energy三类0.1保持。音量是基于自有信号强度和阶段8相对监听位置的起始值，实际近远/重叠/GM与玩家、循环和清理由新构建另验，不以旧声音PASS推广。\n\n四旧路径文件内容随模块更新，旧World文档的path/volume不自动修改；新Lava/MagicCircle改用独立路径。候选源码整合、318测试/6066断言、类型和93文件构建通过；适配到正式路径和显式输入/输出/报告参数的脚本完整重建6文件与已审候选sha相等。完整`ci:verify` r7通过，coverage运行3547 PASS/1 SKIP/0 FAIL。\n\n阶段9安全检查点后已受限安装9文件（6音频、署名、main.js、README），逐文件readback相等，其他84文件和能量原字节保持，PID70620常驻未停止。安装收据为外部`audio-v3-install-receipt.json`；不是新媒体运行接受。CI重建发现预先记载的bundle hash变化，已证明全部32处差异仅为cwd导致的源码路径注释：模块cwd为`58421b740fedb2f45e7039654249ce8d31b79e509320630bf38267d148aceaf8`，仓库cwd为`f38f10f674b7fd260f6259ad78f3269b1b9e58a1c879b0b873f71143283a2662`，执行代码相同，两种Bun的仓库cwd构建字节相同；安装的是后者。\n\n阶段10当前官方Chrome正常重载和原生画笔验证七个独立音源通过：六长源180秒、Energy5.237秒均loaded/playing/loop，成对读回保持同Doc/Sound.id并推进。AcidII168.512→9.520/21.003秒、Lava149.531→34.120/64.592秒各真实跨轮，Energy在46.696秒经过9轮；父独立elapsed/模运算残差均小于0.01秒。相同105/35监听偏移时Fire/Lava引擎volume0.4617，AcidI0.1501/II0.2309，Holy0.1731、Unholy0.4040、Circle0.1443、Energy0.0577；这是Sound参数，不是响度接受。\n\nFire原生Undo0→Redo1→正常刷新相同Doc/path/volume→擦除0通过；显式StageII绘制实际stage1、path/volume正确。第一次循环阶段动作收据active=false，不能声称已启用画笔的stage手势通过。受控远点playingfalse/volume0/公开播放池空，返回近点恢复；原生主Ambient控制读回0时Sound仍playing，恢复精确0.5后再次播放，未把停播作为静音的必要条件。所有case清理和最终9baseline字段、actual79/saved115、3Scene仅原夹具、ActorHP10/walk30/items/effects空、source/公开playing池0均通过；父独立复算最终JSON SHA`ba63e53ee056224a24fb63436fdb7ce99af0bac0976e35d76500e320d01c28e2`。\n\n技术声音接受不替代主观试听。各case完整JSON已留存，截图仅匹配Blueprint、Fire supplement和恢复，不称每种音效均有无遮挡实景；旧Square-only Fire/Frost在gridless Landing恢复的诊断、一次当前Scene资源加载期间拒绝切场景警告保留，没有捕获音频decode错误。原件为外部chrome-phase10，父记录`phase10-parent-acceptance.json`。玩家当前客户端声音、真实拖拽、三格型和阶段手势由阶段11另验；主观试听尚未接受。\n\n## 2026-10-05玩家端补验\n\n阶段12的SY当前客户端七独立源均loaded／playing／loop、正gain，同Sound.id有实际进度；玩家端近处技术播放通过。阶段15用一个Energy代表实例补齐近→远→返回：真人在HexRows完成两次SY拖动，距离与成本各25，匹配当前completed事件；原Sound文档／路径保持，远处listener距源320.124world大于196半径时playingfalse／volume0／对应公共池空，返回约140.001world后正gain0.01298556、playing／loop和同实例进度0.13958→5.19042。原始near／far／return分别采样，不能把最终近处替代远处读回。最终完整恢复后源0／playing空及九字段／79active／115saved精确保持。\n\n这次移动操作由真人完成，自动拖动接口的时序假设尚未确证或修复；主观音色仍单独留待用户判断。见[本轮技术验收](completion-2026-10-05.md)，不重做已接受的GM180秒循环或推广到生产／长时。\n","foundry-modules/fvtt-battlefield-painter/docs/completion-2026-10-05.md":"# Mirror 14.368 与声音重做：本轮技术验收\n\n本轮限定功能的技术证据、最终数据保留审计与测试对象清理均已完成，停止新增开发与验收，没有后台监控或自动下一批。这里记录本地 Mirror 14.368 / dnd5e 5.3.3 的实际结果；不提升为全部42项、所有动作、长时或生产接受。\n\n## 已确认的交付\n\n- Mirror 已升级并实际运行14.368，dnd5e保持5.3.3；官方Tile Arsenal1.1.0独立安装。既有配置保持79实际启用／115保存开关。\n- 依照原版长环境音方向制作并安装6条约180秒立体声自有音效；保留用户认可的Energy原字节，Lava／MagicCircle使用独立源。许可和署名随包保留，付费原版音频未复制进自有素材。\n- GM七独立源加载／播放／实际长短循环、近远、主音量参数、Fire历史／刷新／擦除有原件；玩家端七源实际loaded／playing／loop、正gain及同实例进度也通过。\n- 玩家Energy代表实例的近→远→返回生命周期闭合：同Sound文档／路径，远处listener距源320.124world超过196半径，playingfalse／volume0／播放池空；返回约140.001world，恢复正gain与播放进度。\n- 三格型GM代表绘制／阶段／移动成本／边界、擦除／历史／符文刷新、带孔Region去重及Shift流程已有实机证据。HexCols26basic配置／36阶段的可见素材、布局和渲染已复看。\n- SY三格型密地真实移动按2倍成本完成；三格型独立清地正常成本也已具备证据。Square由自动执行取得，HexRows这次由真人操作取得：Away CTUJYSX5HMliStZl与Return vuAmcVMaNcPZJKDx均为SY dragging／finishedtrue／匹配completed，距离=成本25；不能写成自动快拖已修复。\n- 最后恢复独立Inspect确认原地图／相机／暂停／时间／空控制目标及九设置等于基线；worldTime21085811，79active／115saved，三个Token210/210，ActorHP10／walk30／items-effects空，零画笔声音／墙／灯和公开播放池。\n\n## 实际限制\n\n主观音色仍未由本轮证据接受。蓝色火焰只按静态着色路径接受；彩色动态路径、完整42项／所有动作、自然到期／死亡复活、弱GPU／大面积／长时、深WildMagic／Rift及生产没有扩大结论。\n\n自动拖动的异常已定位到输入进入Core抓取后、实际移动之前。一次AX输入按下约975ms才首次heldmove，而精确Core的长按阈值为500ms；当前官方Chrome实际没有CUA快拖入口。真人正常拖动成功，说明这一实机案例可以工作，但受限128条输入记录未保留起始时序，不能把500ms取消路径写成已确认根因，也不能声称连接器已修复。\n\n## 验证与收尾\n\n原完整CI r8为3547PASS／1SKIP／0FAIL；此后产品代码和已装音频没有改动，仅增加只读输入观察／收据判定。新的观察器做语法核对；实际收据判定增加fresh movement.id约束，并验证真实Away正例及旧事件残留合成拒绝。没有因为报告／工具故障重跑旧视觉或音源矩阵。\n\n最终非任务数据审计与清理均通过：正常GM Macro取得实时ID／逻辑SHA，采用原phase6递归排序／排除_stats算法；清理前、清理后父独立对照原286Actor／180Item／65Scene／93Macro，全部ID与逻辑SHA相等，missing／added／changed均空。现成Cleanup guard只删除确切3Scene／1Actor，保存cleaned及独立Inspect后原生删除本任务Macro。物品目录DOM只展示166项的疑点已用一次性已知审计宏核清：14个未渲染ID全部实际存在、总数180和逻辑SHA一致；该唯一补审宏执行后只自删自身，并有目录不存在读回。没有测试对象／监听钩子／画笔播放残留，原地图、视角、九字段、模块配置和暂停／时间保持。\n\nMirror39008／30001按原约定保持常驻，GM页面保留。业务候选、已有暂存／未提交成果及所有测试源码／原件保留；本轮没有业务commit／merge／push、生产发布、工作树清理或备份。手册同步仅反映本轮实际证据与限制，不宣称主观音色或自动拖动接口已修复。\n\n完整原件位于本任务外部证据目录的chrome-phase10、chrome-phase11b、chrome-phase12-business和phase15-manual-ready。父验收分别保留通过片段、失败尝试和未执行层级，不改写历史暂停／演示合同。当前流程入口见[接续记录](CONTINUATION.md)。\n\n2026-10-05最后文件收尾见[本地集成范围](local-integration-scope-2026-10-05.md)。已列清 Painter、Forge/共用包的兼容补丁、其他模块/Lab 支撑及主线 17 文件的保留规则；Forge 0.4.0 蓝图业务仍由原来源任务负责。本次只整理说明和手册，不重跑既有玩法接受或代为提交/合并。\n","foundry-modules/fvtt-battlefield-painter/docs/local-integration-scope-2026-10-05.md":"# Painter 收尾：本地集成范围（2026-10-05）\n\n**范围已核清，用户随后已授权本地 master 集成。** 本文把本轮 Painter 成果、Mirror 14.368 兼容补丁、共用工具和已经进入主线的改动分开；下面的数量、HEAD 与首次收尾结果是授权前快照，继续作为文件范围依据。\n\n## 本地集成授权与验证依据\n\n用户2026-10-05明确要求“那合并到master吧”。按本文范围完成必要的 topic 提交、吸收 master `cdf387a`、冲突核对及本地 master fast-forward；不扩大到远端 push、Forge 0.4.0 蓝图业务源、安装/服务或工作树清理。Forge 的兼容补丁可以入主线，主线产品版本仍是 0.3.0，已有 Mirror 0.4.0 安装保持。\n\n新增验证缺口仅是 **Painter/Mirror 候选与主线 validation-selection 的最终代码组合**，因此在吸收主线后执行必要的集成 CI，并完成指令生成/一致性、合并前后手册检查。旧实机行为按相同产品/客户端/目标证据复用，不因 Git HEAD 变化重跑。最终动作、提交身份、检查和停止状态见[本地集成结果](H:/CodexData/visualizations/2026/10/03/01a1010c-9d38-7421-9098-596a96bc261a/painter-master-integration-final-20261005.json)；该记录在最终 master 读回后保存。\n\n实际集成门禁另暴露一份既有API测试的等待窗口问题：`apps/web/src/server/__tests__/api.test.ts` 中两个真实抓取案例等待终态由约1.5秒改为10秒，保持各案30秒总期限和其他案例原等待窗口。旧成功记录1534ms已贴近原界限，本轮1681ms失败后模拟站点被提前关闭并导致后续连接拒绝。该单文件是完成本次必需门禁的测试修复，计入最终集成清单；Web产品代码、抓取能力和授权没有变化，原231路径清单仍作为业务范围历史快照。\n\n最终完整CI r3退出0：覆盖率3558 pass/1 skip/0 fail，369文件；全量anti-overfit、仓库卫生、精确参考验证、Web构建及Actor离线烟测也通过。CLI局部24/0与API局部40/0保留，r1/r2失败日志没有覆盖。CI之后只同步完成说明和手册，产品/测试实现不再改变；合并前手册及范围检查和合并后master读回仍按最终记录执行。\n\n## 当前身份与完整清单\n\n- 唯一业务树：`I:/OpenCode/fvttV12JsonGenerator-worktrees/20261003-165821-foundry365-painter`；分支 `codex/20261003-165821-foundry365-painter`；HEAD `ec08352906172bbdf05f8cb573194c41761b36f0`。\n- 主工作区：`I:/OpenCode/fvttV12JsonGenerator`；master `cdf387a89af91a3525c7af857298760638434379`；此次核查时 clean。该提交已经包含共用 validation-selection 的 17 文件集成，未包含本轮 Painter 业务。\n- 收尾整理前有 **230 个改动路径：78 tracked、152 untracked；30 个文件已有暂存内容**。这不是 230 个新功能，也不是 230 个都待原样覆盖主线。\n- 每个路径的状态、大小和 SHA-256 已保存到 [整理前文件清单](H:/CodexData/visualizations/2026/10/03/01a1010c-9d38-7421-9098-596a96bc261a/local-integration-scope-before-20261005.json)。本次新增的范围说明与最终核对见同目录 `local-integration-scope-final-20261005.json`；前一份记录中的四个 `unclassified` 路径在本次核查后明确归入下表的 Painter 工作流。\n\n| 文件归属 | 整理前数量 | 本轮集成内容与边界 |\n|---|---:|---|\n| Painter 模块 | 174 | 42 项候选、阶段/颜色/Region/历史、坐标与媒体修复、七条音频、素材来源、测试和已完成验收记录。收尾再新增本文 1 个文件。 |\n| Painter 工作流 | 4 | `.agents/skills/battlefield-effect-workflow/` 的说明、配置、验收参考和素材检查脚本，随 Painter 保留。 |\n| Forge 兼容补丁 | 10 | 对本树 Forge 0.3.0 的精确 Core 版本检查、产物目标绑定、manifest/build 检查及回归测试；不接收另一棵树的 0.4.0 蓝图业务。 |\n| Forge 共用包与示例 | 3 | `batchQueue.ts`、`encounter-automation.ts`、晶血战斗控制示例，只增加 14.368/5.3.3 这一配对。 |\n| 其他模块的 Mirror 兼容 | 25 | CC 7、House Rules 4、IFS 2、TE 1、WMP 5、Resolver 3、Open Session Deck 3；这些是原升级任务的必要兼容补丁，并非 Painter 私有实现。 |\n| Lab 与 CI 支持 | 8 | Mirror 配置/启动/进程保护和 Forge 受限构建辅助共 7 文件；coverage 总进程期限调整 1 文件。 |\n| 升级 review 与手册 | 5 | 升级 review 1 文件、手册数据/核对记录/生成 HTML 4 文件。共享手册按条目合并，再生成 HTML。 |\n| 主线已经包含 | 1 | `tools/foundry-ops/src/acceptance/inspection.test.ts` 与当前 master 相同；无需重复集成。 |\n\nPainter 的 174 文件中含 82 素材、35 文档、29 测试及其余源码/构建/界面文件。音频目录有 7 OGG、4 WAV 和 1 署名文件；WAV 是保留的创作来源，现有构建器会复制 assets，不能在收尾中擅自删掉。付费 Tile Arsenal 原版独立安装，不属于本树文件清单。\n\n## Forge：兼容补丁与 0.4.0 业务的边界\n\n此次只读核查确认：**主线和 Painter 工作树的 Forge manifest 都仍是 0.3.0，Mirror 实际安装版是 0.4.0**。0.4.0 蓝图、可读预览和相关生成能力的来源仍在 `I:/OpenCode/fvttV12JsonGenerator-worktrees/20260922-135223-creature-authoring-research`；那棵树自身有未提交成果，本次没有修改或代为集成。\n\nPainter 树内的 10 文件只承担以下兼容工作：\n\n1. `src/mirror-core-compatibility.ts`、`src/runtime.ts`：允许精确 14.364 或 14.368，系统仍要求 dnd5e 5.3.3；Actor 响应目标必须等于当前真实 Core。\n2. `src/itemRuntime.ts`：创建 Item 前同样校验响应的目标与真实运行环境；不能把 364 的结果放到 368，或反向混用。\n3. `src/itemApplication.ts`、`src/intakeApplication.ts`：候选/导入审阅的 Core 版本检查按这两个精确版本判断，保留 accepted-only、GM、来源和产物身份门禁。\n4. `src/encounterAutomationRuntime.ts`：既有固定自动化增加精确 368/5.3.3 配对。\n5. `src/module.json`、`build.ts`：maximum 到 14.368，verified 仍是 14.364；声明区间不表示 365/366/367 都通过运行时版本门。\n6. `tests/runtime.test.ts`：正式 368 来源生成和匹配环境创建正例，以及两方向跨 Core 创建拒绝、零创建副作用。\n7. `AGENTS.md`：记录本次 Mirror 配对的局部约定，不授予发布或扩大验收范围。\n\n此前安装到 Mirror 的方式是**从准确的 Forge 0.4.0 原来源构建受限产物**。`tools/foundry-ops/src/lab/mirrorForgeOverlay.ts` 仅改五份 Forge runtime/Application 源和两份共用 package 源，额外使用精确 Core helper；输出只含 `scripts/index.js` 与 `module.json`。未知源形状或源/安装身份不匹配会拒绝；辅助函数本身不安装。\n\n这七份原来源 SHA-256 在本次只读核查仍与原 receipt 相等。Mirror 当前 JS SHA-256 为 `12a8fe3f79ac3494ace3b2ed84bde21c547ae7d26eaff30362b122f6ae9963e2`，与原受限构建和安装 receipt 一致；manifest 仍为 0.4.0、maximum 14.368。原构建 receipt 的 `installed:false` 表示构建阶段，随后 `core368-install-receipt.json` 才记录两文件实际安装，不能混淆。\n\n**后续集成规则：**本轮可以交付这组兼容补丁，但它不包含完整 Forge 0.4.0 产品源码。若只将本轮补丁并入当前主线，仓库 Forge 仍是 0.3.0，普通 Forge build 不能用来覆盖已有 Mirror 0.4.0。要形成统一的 0.4.0 源码/普通构建，需先按原 Forge 任务的范围完成其业务源集成，再将上述兼容改动按语义接上；版本、模板、样式、蓝图编辑器、预览和生成包的变化由该任务负责。本轮不取用旧整文件覆盖新版，也不把受限安装收据当成 0.4.0 已经进了主线。\n\n## 共用包：仅两个运行版本检查与一个示例\n\n| 路径 | 具体变化 | 保留的限制 |\n|---|---|---|\n| `packages/forge-browser-runtime/src/batchQueue.ts` | 批量创建 manifest 的候选目标从仅 14.364 增加精确 14.368。 | dnd5e 5.3.3、v14/core/off、确定性 Document ID、来源/产物 hash 等门禁继续保留。 |\n| `packages/intake-ai/src/encounter-automation.ts` | 生成的固定入口可在 14.364 或 14.368 启动。 | 系统仍是 dnd5e 5.3.3；GM、场景、Hooks、绑定和固定能力限制继续保留。 |\n| `tools/forge-encounter/examples/crystalbleed/battle-control.mjs` | 晶血示例增加同一精确配对，并更新不兼容提示。 | GM、真实场景、既有 Actor/能力/绑定检查保持。 |\n\n没有修改 package exports、蓝图 schema、Actor/Item 生成投影、通用版本默认值或 AI 自动化权限；这两份共用包补丁不宣称支持 dnd5e 6.x。其他模块原有 Next 精确配对保持原门禁和各自证据。Painter 浏览器模块也没有因此导入 Forge 私有实现。\n\n## Lab/CI 支持与主线已有文件\n\nLab 支持范围是 `tools/foundry-ops/README.zh-CN.md`、`src/config.ts`、`src/config.test.ts`、`src/lab/launch.ts`、`src/lab/__tests__/launch.test.ts`、`src/lab/mirrorForgeOverlay.ts`、`src/lab/__tests__/mirrorForgeOverlay.test.ts`。README 中只能取本轮 Mirror 段落，保留主线共用工具的新说明。Core Test 默认仍为 14.364；只有显式选择 Mirror 14.368 才使用对应程序，未知活 PID 拒绝继续并保留记录。\n\n`src/tools/runCoverageShards.ts` 将完整 368 文件覆盖率进程的期限从 300 秒调至 450 秒，保留单进程报告与退出检查。它属于此次完整 CI 的支撑，不是游戏规则或开放无限运行。\n\nmaster 相对本树 HEAD 的 17 个路径中，只有五个与本树改动重叠：\n\n- `tools/foundry-ops/src/acceptance/inspection.test.ts` 已完全相同，保留 master 即可。\n- `tools/foundry-ops/README.zh-CN.md` 合并本轮 Mirror 说明，不覆盖主线 validation-selection 说明。\n- `docs/handbook/catalog.json` 按条目合并，保留主线选择/证据门禁，再带入本轮 Mirror/兼容说明。\n- `docs/handbook/reviewed.json` 在最终源码和条目组合上重新人工核对；不要直接选一侧旧指纹。\n- `工具手册.html` 在最终组合上生成，不复制候选树的旧整页覆盖主线。\n\n另十二个路径全部保留主线：`package.json`、`docs/runbooks/development-feedback-loop.md`、两个 development 模板、acceptance 下的 `cli.ts`、`external.ts`、`external.test.ts`、`model.ts`、`runtime.ts`、`workflow.ts`、`selection.ts`、`selection.test.ts`。本树缺少其中四个新文件只是基线落后，绝不是删除请求。详见外部最终清单中的每路径处置。\n\n## 验证与明确停点\n\n本次缺口是**文件归属、Forge 0.3/0.4 来源边界和主线重叠处置没有明确写出**。因此只补范围记录、来源/安装 hash 读回、链接和手册一致性检查；本次没有改产品代码、音频或安装。手册新增本文来源并修正 Forge 说明中仍写“仅 14.364”的旧句，人工核对 Painter/Forge 两条后重新生成。结果以最终清单记录，不扩展原运行时 PASS。\n\n既有完整 CI r8 为 Bun 1.3.14、3547 pass / 1 skip / 0 fail、368 文件、290.69 秒；本次复用该结果，未重跑全仓 CI。Painter 代表三格型、玩家移动和声音技术结果，以及原 286 Actor / 180 Item / 65 Scene / 93 Macro 数据保持，见 [技术完成记录](completion-2026-10-05.md)。主观音色、全部 42 项/全部动作、自动拖动工具修复、深 WildMagic/Rift、长时和生产不在接受范围内。\n\nForge 0.4.0 的加载/可见蓝图预览与安装身份有本轮证据；本轮没有在新 Core 上执行完整蓝图 Generate/Create、全量 Actor/Item/AI/战斗自动化接受。0.3 兼容源码的机械检查和 0.4 受限 bundle 的安装/预览证据分别保留，不能相互冒充。\n\n完成本文和手册后停止。后续发布需按实际授权处理最终组合，检查主索引/基线、Forge 产品来源和受影响的集成门禁；本次范围记录本身不触发任何操作。\n","foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md":"# 血猎手 2024 独立 Foundry 模块\n\n## ServerNext 6.0.6 当前限定接受\n\n本轮仅接受新建临时角色与职业授予：四个3级角色的职业/子职内容、Item links/配方、普通重载读回和精确清理通过；来源投影与模块契约差异为0，同一官方 Archery 来源的4条记录另有独立核对。旧角色更新保持只读 Preview，不执行 Copy/Apply 或备份。其余等级/选择组合、ActorDelta 与旧人物迁移尚未接受；Profane 的法术/契术位配置（该来源为 none/empty ability、GM-assisted）和生产仍未接受。整体内容编译 identity 仍为6.0.2，不能把这条3级授予接受扩大成整体6.0.6。\n\n`fvtt-blood-hunter-2024` 是独立模块，版本为 `1.0.0`：默认构建精确对应 Foundry Virtual Tabletop `14.364`、dnd5e `5.3.3`；显式 `--target=server-next` 仍以 Foundry `14.368`、dnd5e `6.0.2` 作为编译内容身份，生成的 manifest 则记录 `minimum/verified=6.0.2`、`maximum=6.0.6`，整体内容仍是6.0.2身份。6.0.6当前只接受上方列出的新建3级角色/职业授予代表链；其余等级/选择组合、ActorDelta 与原人物迁移尚未接受。它提供三个 Item compendium pack：`classes`、`subclasses`、`features`。模块不依赖 Plutonium 或 classpack；MIDI-QOL `14.0.11` 与 DAE `14.0.12` 是旧目标推荐版本，不是硬依赖，不能据此推断 ServerNext 本机版本的额外自动化已经验收。\n\n若锁定来源 JSON 当前不可用于重新构建，运维可在核对现有 ServerNext 安装身份、文件清单与来源记录后，使用 `projectBloodHunterServerNext606Manifest()` 准备**仅含 manifest 版本上限变化**的候选。该函数只接受已有的 14.368 / dnd5e 6.0.2 投影且上限为 6.0.2 或 6.0.5 的 manifest，不读取或生成内容包；角色 Item、pack、浏览器脚本与迁移契约均沿用原安装。是否安装该候选取决于独立的运维保护与版本检查，不能据此宣称 6.0.6 内容编译、角色升级或迁移已经验收。\n\n## 构建\n\n构建必须使用已经接受的 `BloodHunter2024` enriched source JSON 的原始 UTF-8 bytes：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"C:\\absolute\\path\\BloodHunter2024.json\"\n```\n\n`--source` 必须是绝对路径。构建脚本只通过 `packages/blood-hunter-v14/src/index.ts` 的公开接口调用编译器，先把 raw bytes 交给编译器，再由公开 validator fail-closed。它不会复制编译器的匹配规则、ledger schema 或 Effect/Activity 生成逻辑；每次都以编译器返回的 `logicalHash` 为准，因此 coverageLedger 的语义修正会自然进入新构建。\n\n每次构建在随机临时根内完成两份候选结果：三份 LevelDB Item pack、canonical package、migration contract、coverage ledger、review、identity manifest 和确定性 ZIP。构建会比较两次结果的文档/UUID、manifest、logical identity、pack index、Activity/Effect 引用，并递归检查整个编译结果中的 12 个 dnd5e 外部 Item UUID（7 equipment、1 Boon、4 fighting styles）。缺少任何 UUID，或锁定的 `dnd5e/5.3.3/repo/packs/_source` reference cache 缺少对应 document，都会失败。Effect change 的 mode 等语义由最终编译器输出负责，模块只序列化输出。\n\n构建成功后才会把结果原子发布到本目录的 `dist/`：\n\n- `dist/module/`：可安装模块树；\n- `dist/fvtt-blood-hunter-2024.zip`：ZIP 及其 SHA-256；\n- `dist/module/data/identity-manifest.json`：source SHA-256、编译器 logical hash、81 documents、94 ledger、117 Activities、UUID 清单；\n- `dist/module/data/migration-contract.json`：浏览器迁移使用的 canonical/migration 契约。\n\n`dist` 不是运行中 Lab 的 pack；构建不会原地写 Lab 世界或运行中的 compendium。\n\nServerNext 的独立候选使用同一锁定原始 source，加 `--target=server-next`：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\assets\\homebrew\\blood-hunter-2024.activities.json\" --target=server-next\n```\n\n这一选项使用 Foundry `14.368` / dnd5e `6.0.2` 编译身份及 Advancement 形状，核对 `dnd5e/6.0.2/repo/packs/_source` 中的 12 个外部引用；输出 manifest 的兼容上限为 dnd5e `6.0.5`，而 `verified` 和内容身份保持 `6.0.2`。对这一编译目标，还从原文生成 2 级先授予的“战斗风格”基础特性，使四个官方战斗风格通过目标系统的先决条件；因此该目标有 77 项特性，旧目标仍有 76 项。省略选项仍构建旧目标。`dist` 一次只保存最后一次构建；旧 Lab 安装命令仍只允许 server-mirror，**不能用于安装 ServerNext 候选**。6.0.5 上的模块启用与人物行为读回应另行验收。\n\n## Lab 安装与验证\n\nLab CLI 只允许配置后的本地 `FVTT_OPS_LAB_ROOT`，目标严格为：\n\n```text\n\u003cFVTT_OPS_LAB_ROOT>/data/server-mirror/Data/modules/fvtt-blood-hunter-2024\n```\n\n示例：\n\n```powershell\nbun run foundry-modules/fvtt-blood-hunter-2024/labCli.ts dry-run\nbun run install:blood-hunter-v14\nbun run install:blood-hunter-v14 --apply\nbun run verify:blood-hunter-v14-install\n```\n\nCLI 会拒绝生产/远程变量、8080、路径逃逸、symlink/junction/reparse、LevelDB `LOCK` 或占用目标。已有同 ID 目录必须带本模块的 `data/owned-marker.json` 才能替换；foreign same-ID 目录会停止。替换前把旧目录移动到配置的 backup root，stage 通过完整 hash、manifest、pack documents/index 检查后再原子替换，并在失败时尝试恢复 backup。\n\n`verify-install` 只报告字节、manifest、LevelDB documents/index 和 identity 一致性；它不启动 Foundry、不启用模块，也不冒充真实 runtime 或游戏性 E2E。构建/测试只使用随机临时 Lab 根和配置的只读 `classic-level` 入口，不把真实 `F:\\FoundryLab\\foundry-v14` 的 app/data/world 当作数据库写入。\n\nFoundry Ops 的公开只读证据入口使用：\n\n```powershell\nbun run foundry:ops lab blood-hunter-v14 plan --input=\"C:\\absolute\\matrix-plan-input.json\"\nbun run foundry:ops lab blood-hunter-v14 verify-actor --input=\"C:\\absolute\\actor-snapshot-input.json\"\n```\n\n还支持 `inspect`、`verify-migration` 与 `evidence-manifest`。这些动作只读取显式 JSON 并返回验证结果，不启动 Foundry、不写世界，也不会把 pack/API 探针提升为 E2E PASS。\n\n## 迁移 UI\n\n模块在 `init` 阶段只注册 GM-only 菜单，不在 `ready` 自动扫描 Actor，也不自动修改任何 Actor。菜单标题是“血猎手 2024：角色迁移”。\n\n1. GM 明确输入 Actor ID 或精确名称后点击 `Preview`。Preview 只读，不写 Actor。\n2. flags `fvttJsonGenerator.bloodHunter2024.canonicalId` 优先；没有 flags 时，只有 `source + class/subclass + level + normalized name` 全部严格相等才使用 legacy match。多候选、重复 canonical 或歧义会停止。\n3. 点击 `Create migrated copy`，模块通过 Foundry 公共 Actor Document API 创建迁移副本，并生成 Actor JSON backup；副本通过非血猎手投影、选择/消耗、重复和 Activity/Effect 引用检查后，才允许下一步。\n4. `Apply original` 需要已有副本、通过副本验证、JSON backup，以及输入与 Actor 名称完全相同的确认文字。冲突逐项选择 `Keep`、`Overwrite` 或 `Cancel`；关闭窗口等同 `Cancel`。任何未决冲突都不能 Apply。\n\n迁移只原位更新唯一匹配的 Blood Hunter Item；没有现有对应项时不会自动补充特性，因为仅凭全包清单不能判定人物当前职业、子职与等级。缺少的特性须在正常升级流程中授予或由 GM 单独核对；不按名称批量删除，不改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags。Activity/Effect/说明冲突默认暂停。Apply 通过公共 Document API 完成；失败会用 Apply 前 JSON/Actor snapshot 补偿回滚，禁止直接写 LevelDB。\n\nCallum 的旧“破晓血仪” fixture（0 Activity、0 Effect）覆盖 Preview、迁移副本、Apply 和 rollback：原 Actor 在 Preview/副本阶段保持不变，副本应得到 5 Activity、2 Effect。\n\n## 自动化边界\n\n- **Core**：Foundry/dnd5e 原生 class、subclass、advancement、Activity/Effect 结构；不要求 MIDI-QOL 或 DAE。\n- **Modded**：可利用推荐的 MIDI-QOL `14.0.11` / DAE `14.0.12`，但模块不会把它们当作硬依赖，也不会把未验证效果宣称为原生自动化。\n- **assisted**：需要 GM/玩家按规则确认的跨 Item、目标条件、休息或选择流程；ledger/review 中会保留边界。\n- **external-rule**：依赖外部规则或外部 compendium UUID 的部分；identity manifest 会保留 12 个 dnd5e UUID，缺引用即 fail-closed。\n\n这是一次构建快照，不是实时同步：安装后不会监视远程 homebrew、旧 side-data 或 Actor 变化。旧 side-data 只作为迁移识别/审查的历史输入，不是权威规则来源；权威来源是本次 raw source 与公开编译器输出。线上生产 Foundry（8080）不在本任务部署范围内，也不会由本模块 CLI 触碰。\n\n## 本地候选的只读 Preview\n\n已安装条目的来源hash只说明当时的来源版本，不能证明当前内容没有手改。Preview现在比较当前说明、Activity和Effect，并忽略既有已消耗次数、等级与advancement选择。相同来源版本下，名称、类型或其他无逐字段决策的业务变化会明确跳过，保留整个Item，要求人工核对。\n\n本轮仅完成合成数据上的Preview判断与模块契约检查；没有执行真实角色的复制、备份或迁移。旧Copy/Apply流程仍要求副本和JSON备份，不能在当前无备份约定下调用；须先明确新的迁移模式。内容包来源与分发范围也没有因此获得商品发行许可。\n","foundry-modules/fvtt-custom-conditions/CREDITS.md":"# Icon credits\n\nThe nineteen core condition icons below are original SVG icons from [Game-icons.net](https://game-icons.net/). The pinned upstream source tree is [game-icons/icons at `82d948812bfe3f269ef8f731dcdb07b08160edc4`](https://github.com/game-icons/icons/tree/82d948812bfe3f269ef8f731dcdb07b08160edc4). The layered Injury icons are documented separately after the table.\n\nEach core condition SVG is copied byte-for-byte from the listed original download. Only the bundled filename and path differ; the artwork was not edited or traced. The SHA-256 values below n\nThe layered Injury files below were restored byte-for-byte from repository commit `e8604d64e48b354b2954210f2959ce8cf734ecc9`, where the user-selected Game-icons.net Bandaged SVG was introduced. The worktree's prior heart/badge files had replaced those bytes without updating the attribution. Bandaged is by **lorc** under [CC BY 3.0](https://creativecommons.org/licenses/by/3.0/); the [source page](https://game-icons.net/1x1/lorc/bandaged.html) and [original SVG download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) identify the selected artwork. All three names contain the same original SVG bytes; the numeric injury level is shown by the module's status UI, not embedded in this SVG.\n\n| Bundled path | Artwork | Creator | Source | SHA-256 |\n| --- | --- | --- | --- | --- |\n| `icons/injury/injury-1.svg` | Bandaged | lorc | [Game-icons.net](https://game-icons.net/1x1/lorc/bandaged.html) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury/injury-2.svg` | Bandaged | lorc | [Game-icons.net](https://game-icons.net/1x1/lorc/bandaged.html) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury/injury-3.svg` | Bandaged | lorc | [Game-icons.net](https://game-icons.net/1x1/lorc/bandaged.html) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n","foundry-modules/fvtt-custom-conditions/README.zh-CN.md":"# FVTT Custom Conditions\n\n本模块在精确14.364／5.3.3、Mirror14.368／5.3.3与Next14.368／6.0.5配对提供十九状态及伤势。Next已接受原生移动／行动／攻击次数／装备动作，以及真实管理器参数提交和简单HUD开关，完整来源恢复成立。候选另增加正向原生武器效果能力与system.changes写入，163项模块检查及类型检查通过；该写入及既存真实卡片的HP／Slow应用、掷骰前取消已获限定实机接受，拥有来源精确恢复。其他版本与交叉配对拒绝运行。\n\n精确14.368／6.0.6已接受Addled／带参数Frozen的施加、启停、真实管理器、普通客户端重载及外来效果保护；自然启用伤势时，原生HP20→0→1产生一次伤势，原生短休清层，并经公开接口同步IFS当前死亡episode，复活历史与旧injury不变。自有对象清理后原世界／设置／用户读回一致；十九状态全部组合、武器攻击、复活结算和多GM不在该接受范围。当前C1/C2明确条件、伤势与武器效果三owner，只订阅已启用且提供API1的Trigger Engine；停止伤势运行时仅解除自身socket监听，stop/restart由局部测试覆盖，未用实机停用API验证。入口、规则参数和持久身份保持。\n\n在上述精确 Next 配对下，候选为 Automated Conditions 5e 14.603.2 的公开 `ac5e.statusEffectsTables` 可选注册自己的无防备目标规则；冻结和震愕复用该投射状态，由既有引擎合并合法优势／劣势，不强制最终骰模式。适配处理 API 延迟就绪，保留已有条目，停止时只删除自己的条目。此适配已通过七项限定原生目标模式复验；其他 AC5e 版本及关闭其状态自动化的组合未验，不自动改变模块设置。\n\n模块内置 Monsters of Drakkenheim 条件目录中的 19 个状态。Bloodied 使用 dnd5e 原生能力；Drakkenheim Madness 与 Contamination 本期不加入目录。\n\n每个状态由固定 Definition 和 Actor 上的 Condition Instance 组成。Bleeding、Burning、Frozen、Jinxed、Valor 的骰式或 DC 属于实例参数，所以同一个状态可以在不同生物上使用不同数值。参数保存在 ActiveEffect 的 `flags.fvtt-custom-conditions.condition` 中，物品上的效果是模板，施加到目标后会生成新的实例 ID。\n\nGM 可以通过模块设置菜单或 Token 控制栏打开管理器。选中或标记 Token 后，在面板中选择状态并填写 JSON 参数即可施加、编辑、停用和解除。日常调整骰式、伤害类型、DC 和结束说明不需要修改代码。\n\nToken Action HUD 中，**全部 19 个自定义状态**使用 `fvtt-custom-conditions.\u003c状态 ID>` 的独立按钮，系统与其他模组的裸 ID 状态保持原状。CoTN 中 dnd5e 原生 `bleeding` 显示「失血」，本模块 `fvtt-custom-conditions.bleeding` 显示「流血」；原生 `burning` 显示「燃烧」，本模块 `fvtt-custom-conditions.burning` 显示「灼烧」。GM 对一个明确 Actor 点击流血、灼烧、冻结、厄运、英勇中的任一项，会打开绑定该 Actor、预选该状态的管理器；点击本身不施加缺参数状态，须按表单填写必填骰式、伤害类型或解除 DC。其他 14 项由本模块 API 施加或启停带本模块 flag 的实例。原生按钮只执行其原有规则；旧版带 `flags.fvtt-custom-conditions.condition` 的自定义实例继续可读，用户自行命名的效果保持原样。旧默认名「燃烧」在自定义实例界面中显示为「灼烧」。\n\n本模块的 19 项不在 Foundry 原生 Token 状态 HUD 中提供普通切换，避免该路径绕过实例参数与规则；Token Action HUD 的自定义项由本模块拦截。若某子状态只由 Frozen 或 Shocked 提供，按钮会显示生效，但点击不会再建立重复的独立子状态；应在管理器中处理实际来源。多实例、目标不明确或非 active GM 时会提示，不回退到系统默认开关。既有 TAH 个人布局按 action ID 存储，新 ID 的隐藏与排序偏好不能保证自动继承旧裸 ID 的设置；不要清空他人的布局来处理单个入口。\n\n## 名称、悬停说明与图标\n\n状态名称和规则说明跟随 Foundry 当前界面语言；`cn` / `zh-CN` 显示中文，`en` 显示英文，其他语言使用英文回退。修改语言后重载世界。自定义状态使用独立的白色 SVG 图标，状态列表提供悬停说明；Token Action HUD 的完整提示采用 dnd5e 规则卡布局，复合状态的主要效果直接写在说明中。自定义 Dazed 的 HUD 标题为「恍惚」，不加「自定义状态」后缀，仍通过独立状态 ID 区分其他模块的同名项。与 dnd5e 原生状态重名的注册项保留原生含义和图标；通过本管理器施加的自定义实例使用本模块图标与参数规则。\n\n状态图标是所列来源 SVG 的原始字节副本。笨拙使用 Skoll 的 Drop Weapon，踉跄使用 Lorc 的 Foot Trip。作者署名、来源链接、许可声明和原文件 SHA-256 值见 [CREDITS.md](CREDITS.md)。\n\n伤势由本模块自己的 `flags.fvtt-custom-conditions.injury` 保存、结算和显示。GM 在本管理器或 Token 状态 HUD 调整 0–3 层；旧 `flags.fvtt-injury-fading-spirits.injury` 原值保留，合法数据经字段级迁移和读回验证后才启用新权威。多个旧伤势效果、未知 schema 或两处 flag 冲突时停止迁移并提示 GM。伤势是运行时分层状态，不属于共享 19 项 ConditionId，也不会自动加入生成器正式 JSON 支持。只有同时启用兼容新版“消逝的灵魂”模块时才显示复活仪式入口；不启用它仍可使用伤势规则。\n\n伤势设置默认关闭，NPC 默认不纳入；首次迁移会读取旧模块的启用与 NPC 管理设置，保持既有自动化范围。正 HP 首次到 0 开启 episode；从该 episode 首次恢复正 HP 增加一层，0–2 层再次倒地设置对应死亡失败，3 层需 GM 先裁定。裸 d20 19/20 的死亡豁免大成功、真实治疗到满血与成功短/长休清伤势也由本模块处理。Actor flags 是权威，Active Effect 只作为显示投影。仅当前活动 GM 写入；若检测到仍运行旧伤势 hooks 的 IFS 版本，伤势自动化失败关闭，需先配对升级。\n\n玩家的原生短休／长休由活动 GM 验证已保存消息的真实作者、传输层发送者及该玩家的 Actor OWNER 权限后清除伤势。优先采用消息的标准 author 字段；没有标准字段的旧适配器保留 user 别名兼容。客户端提交的身份值不能代替这些校验。\n\n伤势 SVG 从 `e8604d64` 恢复用户已选定的 Game-icons.net Bandaged 原件，作者 lorc、许可 CC BY 3.0，字节哈希与原提交及 [CREDITS.md](CREDITS.md) 一致。层数由状态界面的数字和标签呈现，不依赖图标 SVG 自带数字。\n\n默认状态名称随界面语言显示；GM 自行填写的来源名称保持不变。规则参数中的英文 ID 用于稳定存储，不随翻译改名。\n\n流血的基本参数示例：\n\n```json\n{\n  \"formula\": \"2d6\",\n  \"mode\": \"hpLoss\",\n  \"damageType\": \"\",\n  \"timing\": \"turnEnd\",\n  \"stacking\": \"highest\",\n  \"endOnHealing\": true,\n  \"endCondition\": \"恢复任意生命值后结束。\"\n}\n```\n\n流血与灼烧默认在自身回合结束时结算。相同 Actor 上同名状态只采用一个较高值，不因怪物、Item 或来源地址不同而分别扣血。灼烧（内部 ID `burning`）的不同伤害类型也一起比较，采用胜出者的骰式和伤害类型。比较使用骰式的平均值，平手保留现有效果；不会先掷骰再选，也不会根据目标的抗性改变强度排序。已存在的旧多实例数据在结算前也需选出唯一有效值。\n\n怪物特性中的数值是参数来源，例如 `Bleeding 4d4` 或 `Burning 2d6 Fire`。Generator 将其写入攻击 Item 的模板，施加时复制到目标，不能从 CR 或普通命中伤害猜出状态数值。来源没有写明的参数应由 GM 补齐。\n\n强度比较支持普通骰式相加、加减常数及乘除常数，例如 `4d4+2`、`(2d6+3)/2`。随机分母等无法确定排序的表达式会提示错误并保留现有效果，需 GM 改为可比较的骰式。\n\n回合结算由 active GM 执行，并以实例 ID 与 Combat 回合键做重复保护。治疗会解除设置了 `endOnHealing` 的实例。距离、环境和坠落落点需要 GM 结合地图裁定。\n\nFrozen 的已启用实例提供“破冰（动作）”按钮，按实例 `escapeDC` 进行力量（运动）检定。默认由被冻结的目标检定；标记目标后另选中一名生物，可让该生物协助。GM 先确认协助者能够接触目标。取消检定不算尝试，完成检定后无论成败都花费动作，成功才解除 Frozen。\n\nBewildered 只限制施法，不禁止普通攻击和其他非施法动作。Staggered 在自己的回合最多完成一次武器或徒手攻击，武器上的辅助 Activity 不算攻击；纳入徒手攻击是本项目对可公开核对的 Drakkenheim Beta 文本的扩展，正式版 Appendix C 尚未逐条核对。本模块自定义 Dazed「恍惚」让目标在自己的回合从自主移动、动作、附赠动作中选择一种；选择后不能再执行另外两种。Shocked「震愕」继承这条规则，所以不会固定禁止附赠动作；但拿取、拔出或收起物品仍需动作。三选一是用户决定的本项目规则调整，不宣称为 Drakkenheim 正式文本。两种状态不额外禁止 Reaction，禁止 Reaction 的状态是 Distracted；震愕也并非只指闪电伤害。攻击掷骰进入求值后，会在本客户端临时锁住选定类别；异常或后续 Hook 否决而未完成时，冲突行为保守地限制至本回合结束。跨客户端同时操作同一 Actor 和两个非攻击活动弹窗交错完成尚未保证严格互斥。\n\nFrozen 的说明展开定身与无防备的效果；只有使用造成钝击伤害的**武器**命中被冻结目标，才满足特殊重击条件。单凭钝击伤害类型不能把法术或普通徒手打击算进去。Shocked 的说明展开恍惚与无防备，并列出掉落手持物品及拿取、拔出、收起物品各需动作。Valor 的骰值加到攻击检定或豁免检定，Jinxed 的骰值从结果中扣除；Weakened 的武器攻击或法术伤害总值减半并向下取整。来源与规则边界见 [Drakkenheim 状态文案核对](../../docs/reviews/2026-09-23-drakkenheim-condition-wording.md)和[本项目三选一变更](../../docs/reviews/2026-09-24-dazed-three-choice-rule.md)。\n\nImmobilized 与 Frozen 会拦截拖拽、方向键等自主移动，也会拦截非 GM 通过 Token HUD 或配置进行的位置变更。GM 的坐标编辑及 API 强制位移保留用于推拉、传送和坠落裁定；这些重定位不消耗 Dazed 的自主移动选择。停用或解除状态后恢复自主移动。\n\n本地 E2E 使用 `F:\\FoundryLab\\foundry-v14\\data\\server-mirror`，地址 `127.0.0.1:30001`（外部 Chrome 用 `localhost:30001` 访问同一实例）。真实组合验收进入 `cor-cotn` 并保留原模组组合；历史隔离 E2E 使用 `fvtt-v14-module-matrix`。状态核心规则、来源生成模板、真实结算与解除、页面重载后不重复扣血、Sickened/取消攻击/自主移动修复均已有对应路径的实测证据。键盘长按受当前浏览器工具能力限制，未完成该输入路径验收；鼠标拖拽与玩家 HUD 高度编辑有独立证据。先前 HUD 和伤势联动验收记录于 `docs/reviews/2026-09-22-condition-hud-localization.md`。此后全 19 项在 CoTN 的 HUD 入口可见性已复验通过，自定义「流血」点击后只打开绑定 Actor 的空参数管理器；本轮其余按钮未逐项点击或结算。本轮 ID、点击路径审计及页面证据见 [全 19 项记录](../../docs/reviews/2026-09-24-all-custom-condition-hud-audit.md)，日常操作见 `docs/runbooks/custom-conditions-and-trigger-engine-usage.md`。\n\n构建、测试和类型检查使用仓库根目录的 `bun run build:custom-conditions`、`bun run test:custom-conditions` 与 `bun run typecheck:foundry-modules`。\n","foundry-modules/fvtt-homebrew-species/README.zh-CN.md":"# 自制种族内容模块\n\n当前 6.0.6 Ogre 代表只证明原生种族/特性授予与上述 HP、速度、AC、暗视、资源、长休和重载链；ASI 授予已存在但未观察属性分配生效，六项属性在本证据中仍为 10，不宣称力量加值或完整升级自动化。\n\n这是同一 module ID、pack 名和文档 ID 下的纯内容 Species 模块。既有 V14 产物精确绑定 Foundry `14.364` / dnd5e `5.3.3` / Core；V12 候选产物精确绑定 Foundry `12.331` / dnd5e `4.3.9` / Core / 2024；ServerNext 内容身份仍保留 Foundry `14.368` / dnd5e `6.0.2` / Core / 2024。6.0.6 已有一个受限的 Ogre 原生授予/升级代表切片接受：Large、零级授予、每级 HP、速度、AC、暗视、脱困资源、长休和普通重载读回均通过；manifest minimum/verified、accepted package identity 与 supportStatus 仍保持6.0.2静态内容身份。所有目标都只提供 `species` 和 `features` 两个 Item Compendium，没有浏览器 JavaScript、socket、自动迁移或世界扫描。\n\n`bun run build:homebrew-species` 保持现有 V14 默认。`bun run build:homebrew-species:v12-candidate` 与 `bun run verify:homebrew-species:v12-candidate` 使用 ledger 中独立的 V12/core/2024 条目并输出 `dist/v12-candidate/`。Next 内容候选仍使用已接受的 `14.368/core/2024` ledger 项和 `dist/v14-368-candidate/`。默认 Next manifest 最大版本仍为 6.0.2；需要为 ServerNext 6.0.6 生成静态兼容候选时，使用本包入口 `build:v14-368-606-candidate` 与 `verify:v14-368-606-candidate`（等价参数为 `--fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.6`）。这个参数只改变 manifest 的运行时兼容最大值和说明，不改变 6.0.2 内容身份、来源 Markdown、accepted ledger 或逻辑 hash。6.0.5 候选入口仍保留。若运行构建，LevelDB 会重新物理生成；本次服务器安装必须保留现有已安装 pack 文件，仅更新经过验证的 manifest。已有 6.0.2 的代表性游戏内验收见 [ServerNext 候选记录](docs/server-next-candidate.md)；6.0.6 的实际代表接受只覆盖本段列出的 Ogre 新角色/授予切片，静态身份不代替全物种、全等级、全部 Activity 或生产验收。\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为身份。旧 schema v1 只按 V14/core/2024 读取，单纯 build 不改写；下一次成功 promotion 才原子升级。旧 V14 package 保持 `output/species/\u003cidentifier>.json`，V12 package 使用 `output/species/v12/\u003cidentifier>.json`，ServerNext package 使用 `output/species/v14-368/\u003cidentifier>.json`。新目标的 logical hash 与旧目标不同，旧接受记录不可跨目标复用。\n\n散装 JSON 是与本模块绑定的审阅/构建输入，ItemGrant UUID 指向本模块的 `features` pack，不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Feature 是快照，本轮没有迁移器。\n\n当前自动化边界：种族基础字段、allowlist 内的每级生命值/AC永久 Effect，以及明确次数和恢复的 Utility 可原生投影；复杂武器、推击、建筑物、移动和规则判定保持 `gm-assisted` 或 `external-rule`。\n","foundry-modules/fvtt-house-rules/README.zh-CN.md":"# 本团村规（`fvtt-house-rules`）\n\n这是一个独立的 Foundry VTT 模块。既有完整运行验收针对 Foundry VTT `14.364` / dnd5e `5.3.3`；`0.1.3` 在历史 ServerNext `14.368` / `6.0.2` 上通过了药水预览、应用、手改保护、恢复和整页重载读回。运行时另接受 `14.368/5.3.3` 与 `14.368/6.0.5`，各自的实际能力范围以原验收记录为准。2026-10-25 已在 `14.368/6.0.6` 接受修复后的药水应用、三条治疗 Activity、完整快照、手改保护、恢复与普通重载；弹药、聊天卡或其它村规没有因此获得新的实机接受。`6.0.5`、`6.0.6` 的 optional Midi-QOL、DAE、Dice So Nice 组合未作版本确认时仍失败关闭。运行时只接受这些精确 Foundry／dnd5e 版本对，交叉和未列版本被拒绝。它不依赖 `fvtt-injury-fading-spirits`，也不导入项目其他模块的私有实现。\n\n## 语言\n\n模块跟随 Foundry 世界的核心语言设置：核心语言为 `zh-CN`，或使用 Foundry 中文翻译包的 `cn` 时使用 `lang/zh-CN.json`，核心语言为 `en` 时使用 `lang/en.json`。治疗药水 Activity 名称、自然 1/20 卡片、隐匿提醒和所有可配置设置均通过这套语言包显示；切换语言后请重新加载世界。\n\n本模块是“明确配置、GM 确认”的辅助工具，而不是替 GM 作裁定。所有会修改长期数据的功能默认关闭；GM 在 Foundry 的“配置设置”中按需启用。版本不精确、来源不唯一、缺少显式标签、没有活动 GM 或对象不允许修改时，模块会失败关闭。\n\n## 显式标签，不猜名称\n\n本模块绝不从中文/英文名称推断物品性质。药水和弹药必须由 GM 用结构化 flag 标记。例如，治疗药水：\n\n```json\n{\n  \"flags\": {\n    \"fvtt-house-rules\": {\n      \"potion\": {\n        \"healing\": true,\n        \"dice\": { \"number\": 2, \"denomination\": 4, \"bonus\": \"2\" }\n      }\n    }\n  }\n}\n```\n\n弹药还必须有稳定的显式 `key`，以便找回时只与同一类明确标签弹药合并：\n\n```json\n{\n  \"flags\": {\n    \"fvtt-house-rules\": {\n      \"ammo\": { \"key\": \"arrow\", \"tier\": 3 }\n    }\n  }\n}\n```\n\n`tier` 只能是 `0`、`1`、`2` 或 `3`。模块只会记录原生消费后射出的单发：`+3 → +2 → +1 → +0`，不会把库存中剩余整叠弹药降级。\n\n## 功能与使用入口\n\n运行时 API 位于 `game.fvttHouseRules`，只在锁定版本和活动 GM 存在时允许修改。API 是有意保守的 GM 入口；玩家 socket payload 不会被直接写入世界。\n\n| 规则 | 已实现的模块边界 |\n|---|---|\n| HR-02 药水 | `potion.configure(item, \"preview\" | \"apply\" | \"restore\")`。`apply` 先保存原始活动、读回确认后生成三个 dnd5e `heal` Activity，再保存实际规范化的应用后基线：附赠动作自饮、动作自饮且仅治疗骰最大化、动作喂服他人。`restore` 仅在当前活动完整等于应用后基线时强制恢复原图；GM后来修改或增加 Activity、旧schema1快照缺少基线时失败关闭并保留快照供人工处理。固定调整值保留。Compendium 物品拒绝直接修改。 |\n| HR-02 生命骰 | `hitPoints.gamble(actor, classItem, level)` 调用原生 `actor.rollClassHitPoints` 和 `HitPointsAdvancement.apply`。第一级不介入；第一次掷出 1 才重掷一次，第二次无论结果都接受；锁为 Actor + Class + Level。 |\n| HR-02 低属性 | 选中 Token 时仅作上下文提醒；`lowAbility.reminder(actor)` 也可供 GM 面板调用。它绝不扫描世界或修改 Actor。 |\n| HR-03 弹药 | 原生 `dnd5e.rollAttackV2` 的 `ammoUpdate` 产生事务；自动删除时，5.3.3 从 `flags.dnd5e.roll.ammunitionData`，6.0.2 与 6.0.5 从同一攻击消息的 `system.deltas.deleted` 取快照并核对弹药 ID。`ammo.recover(actor, shotId)` 需要 GM 明确确认，重复确认无效。 |\n| HR-03 隐匿 | `stealth.set(actor, state)` 建立显式状态；`stealth.previewMove` 只警告不回滚移动。正常半速、专精减 10 尺、游荡者总等级 7+ 或 GM override 全速；`stealth.dash(actor)` 结束隐匿，`ignoreNextMovement` 可用于传送/GM 调整。非战斗使用 `nonCombatSuggestion`。 |\n| HR-04 自然 1 | 保留的自然 1 只创建 GM 后果请求，确认前零副作用。模块按当前确实可用的候选等权随机：近战反击、符合条件的队友误伤、武器损坏、法术自爆，及可选的精确 RollTable。近战队友必须相邻；远程/法术可选路径外队友。GM 确认伤害后调用原生 `Actor.applyDamage`，世界倍率 `0.5`/`1`、抗性和免疫继续由 dnd5e 处理；不投命中、不消耗反应或原 Activity。`repairWeapon` 可修复损坏。 |\n| HR-04 重击首骰最大化 | 只要武器攻击或攻击检定法术的伤害 Roll 被 dnd5e 标记为重击（包括手动点重击），不要求自然 20；模块先按 dnd5e 原生规则保留完整重击骰池，再把第一伤害部分的第一颗骰拆成 `1dXminX`，因此原始骰面仍会投出而最终按满值结算：`1d8` 重击显示为 `1d8min8 + 1d8`，`2d6` 重击显示为 `1d6min6 + 3d6`。其他骰、其他伤害部分和 rider 继续使用原生重击；目标伤害部分不唯一或骰子结构无法安全识别时失败关闭。自然 20 仍会生成原有 GM 提示卡。 |\n\n武器损坏保存原始 Activity 快照并重新投影累积的攻击与伤害减值；如果期间有其他模块改变了同一 Activity，模块拒绝覆盖，避免吞掉第三方改动。\n\n## 安全与幂等\n\n- 选择活动且 `id` 字典序最小的 GM 作为唯一写入者，避免不同客户端按连接顺序产生不同 authority。\n- 每个持久事件都有由 document/event 身份构成的事务 ID；不含骰点。Actor flags 中的有界 ledger 会去重；自然 1 的卡片确认也只能成功一次。世界 schema 在 `ready` 时迁移到 v1；未知 Actor flag schema 不会被覆盖，而是失败关闭。\n- 玩家消息只携带 UUID/Item ID/事件 ID；GM 重新解析 Actor、Activity、物品、标签与权限。任何失效或不唯一对象都拒绝。\n- 原生 blind-roll 的原始值从不复制到 flags、模块消息或审计摘要。\n- 模块不会 patch Foundry/dnd5e prototype、编辑 LevelDB/Compendium，或自动恢复弹药。\n\n## 已锁定的源码依据\n\n在配置的 reference cache 中检查了 dnd5e `5.3.3`：\n\n- `module/documents/activity/attack.mjs`：`dnd5e.rollAttackV2` 在原生弹药写入前提供 `ammoUpdate`，自动删除时把 source 写入 `flags.dnd5e.roll.ammunitionData`。\n- `module/documents/advancement/hit-points.mjs` 与 `applications/advancement/hit-points-flow.mjs`：`HitPointsAdvancement.apply(level, { [level]: value })` 是原生 HP 选择路径。\n- `module/data/activity/heal-data.mjs`：治疗 Activity 是 `type: \"heal\"`，使用结构化 `healing` `DamageField`。\n\n旧 Lab 中已安装 MIDI-QOL `14.0.11` 与 DAE `14.0.12` 的发布源码，旧组合已有运行验收。ServerNext 精确检查已安装的 MIDI-QOL `14.6.0-beta.4338eeab.local.9`、DAE `14.0.14` 和 Dice So Nice `6.3.1`；House Rules 与此组合的关键行为仍须目标世界验收。其他组合失败关闭。\n\n对照 ServerNext 安装的 dnd5e `6.0.2` 源码：攻击消息改用 `type: \"attack\"` 和 `system.activity/item/ammunition/targets`，被删除弹药保存在 `system.deltas.deleted`；`rollAttackV2` / `postRollAttack` 仍分别在消费前后触发。模块对两代消息分别检查发送者所有权、speaker、Activity 与 Item 身份、弹药 ID、GM 侧库存快照和事务去重。`rollClassHitPoints` 与 `HitPointsAdvancement.apply` 在 6.0.2 中仍存在，但实际等级提升中的持久化链和所有村规语义尚未在目标世界验收。\n\n对照固定 dnd5e `6.0.2` 与 `6.0.5` 源码，House Rules 所依赖的 `system.deltas.deleted` 仍保存删除物品的序列化文档；6.0.5 改为只在 `system.deltas.created` 保存创建物品 ID。House Rules 使用删除快照而不读取 `created`，因此该差异不改变当前恢复路径。`14.368/6.0.5` 仍需目标世界验证，旧 6.0.2 运行记录不替代它。\n\n旧版验收所用 Foundry core 源码快照为 `14.361`，模块不依赖未核实的 core 私有 API；旧版聊天卡使用 dnd5e 5.3.3 公开触发的 `dnd5e.renderChatMessage`。本地矩阵已经对 Foundry `14.364` / dnd5e `5.3.3` 完成安装、聊天卡、Token 移动和多客户端路径回放；具体结果见仓库的[本地 E2E 报告](../../docs/remediation/2026-08-07-fvtt-v14-house-rules/evidence/local-e2e-20260808/LOCAL-E2E-REPORT.zh-CN.md)。这不等同于 14.368 / 6.0.2、生产或真实跑团验收。\n\n## 构建、归档与受保护 Lab 工具\n\n在该目录执行：\n\n```powershell\nbun run typecheck\nbun run test\nbun run build\nbun run verify:artifact\n```\n\n`build` 生成 browser-targeted `dist/scripts/module.js`，同步 manifest/语言/样式，并生成固定排序、固定时间戳的 `release/fvtt-house-rules-0.1.3.zip`。`verify:artifact` 核对 package、源 manifest、构建 manifest、必要文件和 ZIP 内容。\n\n`install:local-lab` 与 `verify:local-lab` 仅接受精确 `FVTT_OPS_LAB_ROOT=F:\\FoundryLab\\foundry-v14`。安装还要求显式 `HOUSE_RULES_LOCAL_LAB_INSTALL=1`，拒绝远程/生产环境变量、链接目标和已有模块目录，且从不覆盖安装。它们只证明文件安装，不等于真实 E2E。\n\n## 本地重构候选：药水事务\n\n药水规则计划保留在纯规则层；`potion-transaction.ts` 单独处理同一 Item 的串行应用/恢复、快照和写后读回。保存期间新增或手改 Activity、失去活动GM权限、出现无法确认的系统规范化时均拒绝继续，保留恢复记录。原值与应用后基线不会吸收外来的手改。\n\n若恢复已还原 Activity 但清除快照暂时失败，可在同一页面对同一 Item 重试；只有 UUID、完整快照和原始 Activity 均未变化时才清理剩余标记，不重复写 Activity。重新加载后或外部手改使该临时证明失效时，不自动猜测恢复。\n\n原候选75项本地测试与类型通过；6.0.6 实机暴露了原生 Activity 默认字段使计划比对失败的问题，现已在首次写入前通过当前注册模型生成完整预期数据，缺模型或异常时零写拒绝。新增反例与受影响药水检查通过后，真实 Apply、schema2 快照、三条 Activity、手改拒绝、Restore 和普通重载已完成限定接受。世界文档与设置恢复一致；旧测试工具未保存 User 分项原像，无法证明该账号历史状态精确恢复，用户已明确选择保留当前账号状态继续，原始 REVIEW 保留。精确证据见[执行总账](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。6.0.5/6.0.6的可选Midi/DAE/Dice So Nice组合仍未确认，继续按现有精确版本门拒绝未知适配；不会因本次Core药水修复而放宽。\n","foundry-modules/fvtt-injury-fading-spirits/CREDITS.md":"# Icon credits\n\nThis module bundles original SVG icons from [Game-icons.net](https://game-icons.net/). The pinned upstream source tree is [game-icons/icons at `82d948812bfe3f269ef8f731dcdb07b08160edc4`](https://github.com/game-icons/icons/tree/82d948812bfe3f269ef8f731dcdb07b08160edc4).\n\nEach SVG is copied byte-for-byte from the listed original download. Only the bundled filename and path differ; the artwork was not edited or traced. The SHA-256 values below identify the original downloaded SVG bytes. Paths in the table are relative to the built module; repository source stores these files under `src/`.\n\nLicense notice: the listed artworks are licensed by their respective creators under [Creative Commons Attribution 3.0 Unported (CC BY 3.0)](https://creativecommons.org/licenses/by/3.0/). Reuse is subject to that license; retain creator attribution and the license notice. Read the [full license legal code](https://creativecommons.org/licenses/by/3.0/legalcode).\n\n| Bundled path | Artwork title | Creator | Source page | Original SVG | Original SVG SHA-256 |\n| --- | --- | --- | --- | --- | --- |\n| `icons/injury.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury-1.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury-2.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury-3.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n","foundry-modules/fvtt-injury-fading-spirits/README.zh-CN.md":"# 消逝的灵魂（兼容模块 ID：fvtt-injury-fading-spirits）\n\n运行时仅接受 Foundry VTT `14.364` / dnd5e `5.3.3`、Mirror `14.368` / `5.3.3`、历史候选 `14.368` / `6.0.2`、限定实机接受的 `14.368` / `6.0.5`，以及 `14.368` / `6.0.6` 的分层接受；交叉和未列版本会失败关闭。6.0.6 WithCC 与 NoCC 均已有限定接受，涵盖未来schema零写保护、GM贡献/真blind结果、旧卡重放、普通重载、下一死亡阶段和精确清理；验收工具额外完整run归档下载曾点击一次但15秒后超时且未取得文件，属于运输证据缺口，不改变上述业务链。其他仪式、玩家贡献分支、多 GM、长时和生产仍须单独语义验收，见[四模块当前进度](../../docs/reviews/2026-10-05-next-four-modules-progress.md)。本模块保留独立复活仪式、历史、锁与 blind 结果保密；伤势规则、状态、死亡豁免 19/20 扩展和管理入口现由 `fvtt-custom-conditions` 负责。未安装 Custom Conditions 时，复活仪式仍可独立使用。\n\n2026-10-12的14.368／6.0.6代表链已接受CC原生倒地／恢复／短休时的当前死亡episode协作；后续 WithCC 与 NoCC 的限定真实仪式、未来字段保护、GM贡献/真blind结果、旧卡重放、普通重载、下一episode与精确清理也已接受，复活历史、成功次数及旧injury保持。验收工具额外完整run归档文件未取得，仅保留运输证据缺口；其他复活方式、玩家贡献、多GM、长时和生产仍待该目标的专门验收。\n\n## 语言\n\n模块跟随 Foundry 世界的核心语言设置，不根据操作系统或模块安装路径猜测语言：\n\n- Foundry 核心语言为 `zh-CN`，或使用 Foundry 中文翻译包的 `cn` 时加载 `lang/zh-CN.json`，消逝的灵魂、复活模式与 GM 裁定界面显示中文。\n- Foundry 核心语言为 `en` 时加载 `lang/en.json`。\n- 修改 Foundry 核心语言后请重新加载世界；当前已经打开的 Dialog 不会被动态重绘。\n- 模块的 manifest 标题使用中英双语，避免在管理模块页面中出现不可识别的纯英文标题。\n\n## 使用\n\nGM 可以在 Actor 目录右键选择“消逝的灵魂”，或选择一个 Token 后在聊天输入 `/ifs`，打开复活面板。`enabled` 和 `manageNpcs` 旧世界设置只留给 Custom Conditions 迁移，不再在本模块启用伤势 Hook。已有 `flags.fvtt-injury-fading-spirits.injury` 和 `fadingSpirits` 保留；本模块后续只写 `fadingSpirits` 子路径。Custom Conditions 开始新死亡 episode 时，可调用本模块公开的 `beginDeathEpisode`；复活成功则通过 Custom Conditions 公开接口设置下一次恢复抑制。\n\n不安装 Custom Conditions 时，本模块仍观察 Actor 从正 HP 降到 0 的事件，开启新的复活死亡阶段并重置仅限本次死亡的锁；它不计算伤势、不改死亡豁免。若事件未被观察到，GM 可在 0 HP Actor 的复活面板明确选择“开启新的死亡阶段”，不会自动清除正在结算的旧仪式。\n\n## 复活仪式\n\n普通/最终仪式可以填写最多三名不同参与者的 Actor UUID、技能、可选属性覆盖、DC 10–20 与优势状态。模块创建 dnd5e 原生 `request` ChatMessage，玩家投骰结果由原生 `flags.dnd5e.requestResult` 关联；最后仍由 GM 确认每项贡献。\n\n最终检定和快速复活检定使用原生 `blindroll`。Actor flags 与 GM 摘要只记录 DC、贡献计数、模式、结果、时间和 GM，不保存最终骰原始值。\n\n快速复活失败会增加永久 DC 惩罚并锁定本次死亡的快速复活；普通失败会锁定常规复活。常规锁存在时，“奇迹”入口只允许开启一次最终仪式。\n\n复活成功记录回归历史；若 Custom Conditions 在运行，调用其公开接口使下一次 0→正 HP 不叠伤势。实际 HP 恢复仍由对应法术/Activity 处理。\n\n可选 Custom Conditions 只在确认已启用时参与；未启用或状态未知时，独立死亡阶段和复活仍可使用，旧伤势管理入口会提示需要配套模块。\n\n## 公开 API v1\n\n```js\nconst api = game.modules.get(\"fvtt-injury-fading-spirits\").api;\napi.getState(actor);\nawait api.setInjury(actor, 2, \"GM correction\");\nawait api.openResurrectionWizard(actor);\napi.getResurrectionState(actor);\nawait api.withInjurySuppressed(actor, \"resurrection activity\", async () => {\n  await actor.update({\"system.attributes.hp.value\": 1});\n});\n```\n\n旧 `setInjury` / `withInjurySuppressed` 调用会转发到 Custom Conditions 公开 API；未启用 Custom Conditions 时返回明确错误。外部复活 Activity 或宏若会直接恢复 HP，可由活动 GM通过 `withInjurySuppressed` 包裹恢复事务。模块不会从物品名称猜测复活能力。\n\n## 安全与限制\n\n- 长期状态仅由 Foundry 的确定性活动 GM 写入；无活动 GM 时不会偷偷改 Actor。\n- 模块只在精确目标版本启用自动化；版本不符会失败关闭。\n- ChatMessage 不是历史事实来源，聊天被清理不会丢失复活历史。\n- 写入前会核对 Actor 当前版本和已有复活历史。无法无损理解的旧历史条目、贡献数据、整个复活字段或未来版本会明确拒绝写入；请由 GM 先检查原始记录，不要清空旧数据来重试。合法旧记录可以补齐已知默认值，旧伤势原件继续保留。\n- 本地 Lab 验收不代表生产部署或真实跑团长期验收。\n","foundry-modules/fvtt-json-forge/README.zh-CN.md":"# FVTT JSON Forge 0.5.0（统一工作台候选）\n\nForge GM 工作台与生物蓝图已整合为同一模块：GM 从生物或物品目录进入，在一个窗口中切换输入方式、生成预览、审核并确认创建。生物支持手工蓝图、标准资料与 AI 整理；物品保留标准资料与 AI 整理。连接配置独立共享，战斗包有明确的专用入口。\n\n本轮精确支持目标为 Foundry `14.364` 或 `14.368` / dnd5e `5.3.3` / `core` / icon off。只有当前 GM、当前来源和当前目标的正式 accepted 候选才能创建。0.5.0 尚未远端发布；统一组合的实际验收与剩余范围见[当前整合计划](../../docs/plans/2026-10-05-forge-unified-workbench.md)，旧版本的接受不自动推广。\n\n2026-10-05已在Mirror `14.368 / 5.3.3`完成统一窗口、宽窄预览、蓝图草稿/派生/复用、标准Actor/Item创建回读、共享连接设置与战斗包新入口的本地验收。测试对象和审计宏已精确清理，原世界集合及视图保持。此次没有调用真实Provider，也没有重跑原生战斗或启动战斗包；这些范围不由本轮界面验收推广。\n\n> English summary: A single GM workspace combines versioned creature blueprints, structured sources, reviewed AI Intake, readable artifact previews and explicit Actor/Item creation. Encounter import and startup remain separate reviewed actions. Exact runtime pairs are Foundry 14.364 or 14.368 with dnd5e 5.3.3.\n\n## 安装\n\n### Foundry Setup 安装\n\n本次0.5.0候选尚未发布，先使用下一节的本地ZIP方式。下面的Setup链接只有在本增量正式发布后才能取得新功能；旧0.1.0发行包不包含战斗包入口。\n\n在 Foundry 的 Setup 页面打开 **Add-on Modules → Install Module**，把下面的 manifest URL 粘贴到 **Manifest URL**：\n\n```text\nhttps://raw.githubusercontent.com/bill34345/fvttV12JsonGenerator/master/foundry-modules/fvtt-json-forge/src/module.json\n```\n\n安装后进入目标世界的 **Manage Modules**，启用 **FVTT JSON Forge**，再刷新世界。\n\n### ZIP 手工安装\n\n使用本次本地构建的 `foundry-modules/fvtt-json-forge/dist/release/fvtt-json-forge-0.5.0.zip` 和同目录 `SHA256SUMS.txt`，先核对 SHA-256；不假设尚未发布的GitHub Release已经存在。停止 Foundry 后，把 ZIP 解压为：\n\n```text\n\u003cFoundry Data>/Data/modules/fvtt-json-forge/module.json\n\u003cFoundry Data>/Data/modules/fvtt-json-forge/scripts/index.js\n...\n```\n\nZIP 内是 module 根内容，不能再多套一层版本目录。不要覆盖身份不明的同名目录；升级前先确认旧目录确实是本模块。此仓库的运维规则不创建备份，失败时停止并核对目标。\n\n## 目录入口与输入方式\n\n在 Actor 目录点击 **Forge 生物**，在 Item 目录点击 **Forge 物品**。同一目录重复打开会聚焦已有窗口。模块设置只保留 **Forge · AI 连接**；不在设置中执行日常生成。\n\n- **手工蓝图（生物）**：左侧加载或新建蓝图，中间填写基础数据、六属性及攻击/豁免组件，右侧持续展示草稿预览。按“生成并验证”产生正式候选后，再确认创建。预览为 2024 资料块顺序，未知的先攻、豁免总值、XP/PB 不猜填；最终派生数值以原生角色卡为准。\n- **标准资料**：粘贴规范来源，或读取 Markdown/TXT；编辑文本后生成和核对正式预览，无需 AI。\n- **AI 整理**：在独立连接设置中完成配置和连接测试，再粘贴/读取原始资料，按“分析资料→生成并审核→确认创建”推进。Actor 仍保留无需 AI 的纯文本审阅子模式。\n\n三种输入方式保留各自草稿，不把复杂来源自动转换成简化蓝图。切换后旧候选失效，需要重新生成或审核；切换模式不写入世界。创建进入提交/回读区间时锁住导航和关闭，结束后显示完成结果并可直接打开卡片。\n\n蓝图库保存在当前浏览器、世界与 GM scope 下。保存/重开仅恢复可编辑来源，不恢复旧 accepted response。派生变体使用新 sourceId，并记录父来源 hash 及字段差异，创建新 Actor 而不覆盖父角色。蓝图仅支持当前有界攻击与豁免组件，最多八个；不承诺完整施法、传奇、巢穴或自动 CR 平衡。\n\n旧公开 `openForgeActor`、`openForgeItem`、`openForgeIntake` 仍可调用，分别进入同一工作台的标准生物、标准物品和 AI 整理视图。标准资料、蓝图仍走来源→workflow→parser/generation→verifier，不能手改最终 JSON 绕过验证。\n\n原单Actor/Item入口遇到`needs_review`、`failed`、`rejected`、多candidate、多artifact、过期snapshot、权限或版本变化时保持零世界写入。战斗包使用独立审核路径：只有明确的GM辅助、外部规则或文字保留行为具有唯一绑定宏，才能进入包级GM确认；未知错误仍拒绝。模块没有“忽略并继续”按钮，也不会把历史review bundle当成可创建response。\n\n## Provider 与凭据\n\n预览已有战斗包不调用 Provider。人类 MD 入口由 AI 提取生物与固定能力配置，工具生成控制入口；AI 不编写宏代码。本地 Intake 默认使用 DS API 的 deepseek-flash（DeepSeek V4.1 Flash），提取与审核均使用同一模型，默认低推理档；非本地连接继续保留用户明确选择。\n\nAI 模式必须先选择 Provider、协议和精确 model ID，并完成当前连接/结构化输出测试。界面提供 OpenAI、Anthropic、Gemini、DeepSeek、xAI、Mistral、OpenRouter、Qwen、Kimi、GLM 与 Custom presets；preset 只代表连接配置，不代表每个 provider/model 都有同等语义验收。\n\n当前人类 MD 样例已由 deepseek-flash 完成提取、规则选择与独立审核，生成两 Actor 和固定控制入口。来源与静态审核通过不代表场景运行通过；实际本地验收另行记录。其他组合需单独验证。\n\n固定齐射的恍惚使用 Foundry 原生状态身份，避免状态同步模块把同一效果再补成第二份。已有其他来源的启用状态不由本控制器接管或提前结束；本控制器创建的状态按记录的目标回合到期处理。此兼容修复的实际 Chrome 复验尚未完成。\n\nActor 蓝图保留来源固定 HP 和生命骰公式；场上未链接 NPC Token 是否重掷 HP 遵从 dnd5e 世界设置，固定控制器不覆盖该设置。\n\nAPI Key 默认只存在当前页面内存。只有显式勾选持久化时才会写入当前浏览器的 local storage；它不会进入世界 Document、Chat、review bundle、Collection/ZIP、日志或 Forge response。浏览器存储不是加密保险箱；推荐保持持久化关闭，并在结束后使用清除 Key 操作。\n\n## Review、Library 与恢复\n\n- **Review Bundle**：导入后只显示严格解码的历史记录。历史 `accepted` 仍不可直接创建；“以当前来源开启新 attempt”会生成新的 identity、snapshot、calls 和 review。\n- **Managed Source Library**：来源与安全 review 保存在当前浏览器、当前 `worldId:userId` scope 的 IndexedDB。它不写世界 settings/flags，不自动 Analyze，也不保存完整 artifact/response。\n- **Portable export/import**：Library、Collection、标准 ZIP 和 Queue 都有 strict decoder、identity/hash/size/path/CRC 门禁；导出不含 Key、完整 endpoint、provider raw payload 或世界数据。\n\n## Collection 与 Batch Queue\n\nForge Intake 可以导入 mixed Actor/Item Collection JSON 或标准 ZIP。每项拥有独立 source、kind/mode、identity、attempt、status 和 review；输入顺序保留，单项失败不会让其他项升级为 accepted。\n\nRunner 固定 concurrency `1`，只有 GM 显式点击才运行。刷新或关闭页面时，`running` / `applying` 项变为 `interrupted`，不会自动重发可能计费的 Provider 请求。跨会话恢复的历史 accepted review 不含完整 response，必须显式 fresh run 后才能重新进入 apply manifest。\n\n批量 Apply 只接受当前页面仍持有完整 accepted response 的项目。确认框会列出 immutable manifest、Document ID、source/artifact hash 和 target；Actor 与 Item 继续走各自 adapter。多 Document 操作不是原子事务，部分成功/失败会逐项报告，不会伪装为全成功或回滚已完成的其他 Document。\n\n## 明确限制\n\n### 角色、召唤物与配套宏整包导入\n\n在 **Forge 生物 → 战斗包** 打开专用入口：\n\n1. 选择`fvtt-json-forge-encounter` v1 JSON，或仅包含`encounter.json`的标准ZIP。此前普通龙兽交付ZIP、Review Bundle和Batch Collection不是这个格式。\n2. 点击“预览战斗包”。模块在当前浏览器通过正式workflow重新生成每个Actor，显示基础属性、来源、生成数据、宏代码、图片绑定和具体GM操作规则。这个步骤不会调用AI、创建文档或运行宏。\n3. 核对内容后勾选确认，再点击“一起导入角色与宏”。相同且未改变的文档会复用；同一包身份的不同内容、已有文档改变或ID冲突会阻止覆盖。\n4. 导入后在“已导入的战斗控制”里查看宏，点击“启动战斗控制”。固定配置首次启用后会在刷新时重验并恢复；控制面板“停用自动化”会持久停用，关闭面板不等于停用。旧式专用宏仍需手动重新启动。\n\nMacro创建与执行是两个动作。脚本仍在GM客户端权限下运行；导入包不能自行宣称代码可信。启动前重新核对命令hash、绑定Actor的身份与其应有的机制标记；被替换、删掉机制或代码改变的内容需要重新审阅。不要修改hash或flags来绕过检查。\n\n明确的GM辅助/外部规则只在新整包路径中进入显式审核，且必须各自关联一份有正确Actor绑定的宏。原有单Actor/Item accepted-only路径不变；失败来源、未知诊断或缺失覆盖不能借宏包绕过。\n\n多文档导入不保证跨浏览器原子事务。普通失败清理本次新建文档并检查结果；无法清理时列出准确UUID。既有文档不会被覆盖。已上传的内容寻址图片可能保留供重试，图片不同则拒绝覆盖。已在游戏中改变过的角色再次导入可能报告冲突，这是避免覆盖当前状态的预期行为。\n\n样本制作：在仓库运行`bun run tools/forge-encounter/build-example.ts`，产生`crystalbleed.forge-encounter.json`和`crystalbleed.forge-encounter.zip`。包携带来源和绑定宏；Actor JSON由接收端正式生成。样本宏使用`forgeEncounter.actors.dragon`与`forgeEncounter.actors.crystal`，不会按同名任意选择世界角色。\n\n晶血样本的专用宏 2.1.2 读取正式生成的恍惚效果和自定义条件标记，并保留目标下一个回合结束的期限。启用 Custom Conditions 时应用其独立恍惚状态，并遵守既有恍惚免疫；未启用时以具名效果表示，行动选择仍由 GM 裁定。样本需要单独启动，刷新后重新启动；其修复版本须按具体候选完成导入、绑定和效果结算验收。\n\n人类 MD 路径支持 2 至 6 种生物、最多 24000 字符。AI 提取并审核生物数据，再选择已实现的固定能力和参数；工具校验并编译控制入口，AI 不写 JavaScript。明确启用的固定配置会在刷新时重验身份后恢复，停用按钮持久生效。未知或不支持的规则保留审阅，不会现场生成代码补齐。完整步骤见[原始MD战斗包指南](../../tools/forge-encounter/README.md)。\n\n前后条件分支使用仅限Encounter的明确GM/配套宏机制：不同时应用互斥的原生效果，完整来源留在能力说明中。该角色的单独状态保持needs_review，必须由来源审阅接受其保留方式，并由正确绑定的唯一宏承担该机制，才可进入包级确认；其他文字或未知机制仍被拒绝。\n\n### 其他边界\n\n- 只支持精确 Foundry `14.364` 或 `14.368` / dnd5e `5.3.3` / `core`；manifest 中间区间不代表其他 Core 配对可用。\n- 只允许 GM；不是玩家 JSON 导入工具。\n- 不是任意文本、任意模型、任意 Actor/Item 都能 accepted 的保证。\n- 不支持 OCR/PDF/图片 Intake、update/overwrite、按名称合并、embedded Item 产品入口或跨 Document 原子事务。\n- 页面关闭后不会继续 AI/HTTP。真正后台执行需要另行设计 Companion/Gateway、认证与 Key custody。\n- 本地 Lab PASS 不代表生产、任意模块组合或四小时真实桌面会话 PASS。\n\n当前分层证据见 [support matrix](../../docs/acceptance/current-support-matrix.md)，A–E 实施与边界见 [产品计划](../../docs/plan/2026-08-21-forge-fvtt-module-product-execution-plan.md)、[Task D](../../docs/plan/2026-08-24-forge-fvtt-intake-task-d-plan.md) 与 [Task E](../../docs/plan/2026-08-30-forge-fvtt-task-e-plan.md)。\n\n## 维护者构建\n\n```powershell\nbun install --frozen-lockfile\nbun run test:fvtt-json-forge\nbun run release:fvtt-json-forge\nbun run verify-release:fvtt-json-forge\n```\n\n发行输出位于 `foundry-modules/fvtt-json-forge/dist/release/`：\n\n- `fvtt-json-forge-0.5.0.zip`\n- `fvtt-json-forge-module.json`\n- `SHA256SUMS.txt`\n\n构建器固定 ZIP 排序与时间戳；两次 fresh build 必须产生相同 ZIP SHA-256，并验证 archive、独立 manifest、package version 和下载 URL 一致。\n\n\n## 历史验收与通用性边界（2026-09-15）\n\n人类 MD 是可复用的输入模板，生物名称不决定执行分支。自动化使用已实现的固定能力库；其具体形态、模板和操作顺序见[战斗包指南](../../tools/forge-encounter/README.md#人类-md-模板与当前能力范围)。任意新机制不能仅凭填写模板获得自动化支持。\n\n本地专项已验证守护真实伤害阈值、混合伤害合计、临时 HP，以及原生拒绝次数耗尽后的削弱。重复腐化证据保留 PARTIAL，用户决定待独立状态设计后再处理；不宣称每次失败增加一级已严格实测。Dazed修复专项与FVTT页面完整AI生成链尚未复验。当前可提交并合并的0.3.0候选未发布远端，合并不代表生产部署。\n","foundry-modules/fvtt-selected-token-sync/README.zh-CN.md":"# 框选 Token 同步 / Selected Token Sync\n\n`0.2.0` 保留 ServerNext Foundry VTT `14.368` / dnd5e `6.0.5` 的既有候选范围，并接受精确配对 `14.368/6.0.6` 的限定 GM HUD/帮助与角色权限边界切片。6.0.6 实际核对了普通/分级状态、linked 去重、overlay、fly、default-null movementAction、GM帮助路由、同GM第二客户端 Poisoned 状态读回，以及玩家回退帮助可见和外来Token不可更新/无HUD边界；玩家同步写入和长时会话仍未接受。37c/37d回退窗口沿用的旧 bundle 文本仍写“606实际语义待验”，这里只把它作为可见/可读证据，不能当作已同步部署证据。Calendaria 位置的原A坐标缺失，用户已选择本轮保留已核当前B并记录缺口继续，原raw12 REVIEW保留，不能说已恢复。该选择只涉及侧栏/窗口尺寸/日历位置等纯界面偏好，不涉及角色数据、功能设置、权限或Hotbar。其它 Core/系统配对未获支持。角色验收环境的额外消息已准确删除并确认原生缺席，作者和唯一whisper均为本轮TempPlayer，别名Dice So Nice!，Atlas归因假设已否证并符合已实装DSN6.3.1欢迎源；native terminal 的 Task 宏、原92宏行 hash、原7 User `_id` 读回、safeMLD/尺寸/viewport/UI、Core 与 Inspector 限定恢复均已闭合，但不等于旧A或完整User/所有Setting恢复。\n\n开启 Token 控制栏里的“框选 Token 同步”后，在一个 Token 的 HUD 中执行下列操作，会同步到当前框选的其他 Token：\n\n- Token HUD 核心状态的添加、删除和 overlay 操作；\n- dnd5e 分级状态（例如疲乏）：左键使每个不同角色各自增加一级，右键各自减少一级。原有等级差异保留，等级限制在 0 到系统设定的上限；一个 linked Actor 的多个 Token 只改一次。\n- Foundry v14 Token HUD 的移动方式，例如 walk、fly、swim、burrow、crawl、climb，以及“默认”。\n\n“默认”会同步为 `movementAction: null`，不会强制所有 Token 使用 walk。模块也不会修改 Actor 的移动速度；dnd5e 6.x 的各移动速度位于 `system.attributes.movement.speeds`。\n\n## 使用方式\n\n1. 在 Token 控制栏打开“框选 Token 同步”。\n2. 框选需要同步的 Token。\n3. 打开其中一个 Token 的 HUD，点击状态或移动方式。\n4. 再次关闭工具栏开关即可恢复单 Token 行为。\n\n开关是每位用户独立保存的，默认关闭。同步集合以点击 HUD 时的选择为准；同一个 linked Actor 的多个 Token 只写入一次状态。已到 0 级的角色不会因右键重新获得状态，已到最高级的角色也不会阻止其他角色继续升级。\n\nToken 控制栏另有“框选 Token 同步帮助”问号按钮。GM 在统一操作手册合集已启用且接口可用时，会直接打开本模块条目；玩家或合集不可用时，会打开模块随包的只读说明。同步开关关闭、或 multistatus 冲突阻断同步时，仍可查阅说明；阅读不会切换开关或修改角色/Token。\n\n模块内说明和完整离线手册共用本模块的 `docs/manual.json` 正文。6.0.6 的 GM 帮助窗口、同GM第二客户端状态读回和玩家/合集不可用时的随包回退可见性已在限定入口中读回；37c/37d中的随包旧文本仍保留“606实际语义待验”，不作为同步部署证明。玩家同步写入和完整角色矩阵仍不由此放行。\n\n本轮本地候选会在首次创建力竭效果时，等待 dnd5e 完成原生旧字段同步后再处理排队的下一次加级，避免快速连续点击丢失一级。若提示原生同步未完成，当前客户端会暂停后续分级同步；请先核对角色当前状态，再关闭并重新打开同步开关。该修复已通过局部测试，并已在6.0.6限定 GM HUD/同GM第二客户端切片中读回；玩家回退帮助和无权限边界已观察，玩家同步写入仍待。\n\n模块只处理 Token HUD 的核心状态。由物品、法术、DAE、MIDI-QOL 或其他模块直接创建/删除的 ActiveEffect 不会被本模块批量复制。\n\n## 来源与兼容性\n\n本模块借鉴 Alan Davies 的 [Multi Token Status](https://codeberg.org/cs96and/FoundryVTT-multistatus) 的 MIT 授权实现思路，特别是明确 active 状态、Actor 去重、HUD 来源识别和递归保护。历史 v10-v12 实现使用 `libWrapper`；v14 实现使用公开 hooks，本模块沿用后者，不声明 `libWrapper` 硬依赖。\n\n如果原版 `multistatus` 模块处于启用状态，本模块会拒绝启用同步模式，避免同一操作被复制两次。\n\n## 构建与本地 Lab\n\n```powershell\nbun run build.ts\nbun run test\nbun run typecheck\nbun run labCli.ts install\nbun run labCli.ts install --apply\nbun run labCli.ts verify-install\n```\n\n安装器只接受 `F:\\FoundryLab\\foundry-v14`，只写入其 `data/server-next/Data/modules/fvtt-selected-token-sync`，拒绝已有模块目录、链接和非本地目标；它不会创建备份或覆盖现有模块。安装使用仓库现有的 ServerNext 自有模块安装入口。\n\n本地安装和测试不代表生产环境已经部署或通过长时会话验收。\n","foundry-modules/fvtt-suite-console/README.zh-CN.md":"# FVTT 工具合集 · 统一操作手册\n\n这是合集的只读手册入口。GM 可以在 Foundry 内搜索工具用途、阅读准备与步骤、查看版本限制和原始说明；既有工具仍独立使用。\n\n## 打开与阅读\n\n1. 在当前世界的模块管理中启用“FVTT 工具合集 · 统一操作手册”。\n2. 以 GM 身份打开 **游戏设置 → 配置设置 → 模组设置 → 统一操作手册 → 打开手册**。\n3. 按用途浏览，或输入关键词搜索。打开条目后使用“开始前准备 / 操作步骤 / 产物 / 适用范围 / 原始说明”定位。\n4. 窄窗口可使用“目录”按钮打开分类。主题按钮只改变当前手册窗口，不保存 Foundry 设置。\n5. 复制命令只取得文字；浏览器限制剪贴板时，界面会选择命令并提示 Ctrl+C。手册不执行命令，也不启动其他模块操作。\n6. 工具列表和条目显示当前世界的“已启用 / 未启用 / 未安装 / 状态未知”及实际安装版本；“刷新状态”重读当前客户端。安装或启停模块后，按 Foundry 提示重载页面。\n\n重复打开会聚焦同一个手册窗口。关闭/重开或重绘会释放旧监听器和待执行搜索；复制的异步结果不会修改已关闭或替换的内容。\n\n## 当前范围\n\n- 技术模块 ID：`fvtt-suite-console`，版本 `0.3.0`。\n- 窗口代码只接纳精确 Foundry `14.368`；运行结果以本批执行总账为准。它不调用 dnd5e 数据接口，不把阅读条目视为对应工具已兼容。\n- 入口与公开 API 都要求 GM。手册正文是随包快照，阅读无需 AI、CDN 或在线搜索。\n- H3增加只读安装/启用状态与首个Deck可选帮助消费者；后续本地候选已接通框选Token同步、法术解析器和聊天内存保护的可选帮助，实际接受范围仍按各条目说明。工具启动按钮、收费与公开发行继续按后续计划。\n- Deck面板/副屏工具栏的“帮助”会定位本手册的Deck条目；合集停用或接口不可用时，Deck使用自己的随包说明，继续独立使用。\n- 模块启用是安装准备，会改变正常模块配置。打开、浏览、搜索、主题与复制本身不写世界文档或 Foundry 设置。\n- Foundry 模块 ZIP 使用用户条目投影；完整 `工具手册.html` 在 release 目录独立交付，不进入模块 ZIP。两者均由同源手册构建。\n\n## 开发与构建\n\n在仓库根目录使用与 CI 一致的 Bun 1.3.14：\n\n```powershell\nbun run test:suite-console\nbun run build:suite-console\nbun run release:suite-console\nbun run verify-release:suite-console\n```\n\n构建先检查手册人工 review 是否有效，再导出 Foundry 投影，把正文编入浏览器脚本。模块产物位于 `foundry-modules/fvtt-suite-console/dist/module`；`build-identity.json`记录投影、正文、脚本、样式和离线 HTML 身份。在仓库根目录运行 `bun run release:suite-console` 会生成确定性模块 ZIP、独立 manifest、独立完整 HTML、校验和与本地交付候选清单；它不安装模块、不访问世界。\n\n当前本地验收只使用已核对的 ServerNext。Forge占用的5.3.3 Server Mirror不能被安装器、浏览器或服务操作触碰。首次安装复用根 `foundry:ops lab install-server-next-owned-module` 的预览/拒绝覆盖门禁，已有目标不会自动替换。没有备份、自动推送或生产安装。\n\n完成构建、目标与运行者核对后，首次安装预览为：\n\n```powershell\n$env:FVTT_OPS_LAB_ROOT = \"F:/FoundryLab/foundry-v14\"\nbun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-suite-console --version=0.3.0\n```\n\n在本次本地测试安装授权范围内加入`--apply`才写入新的模块目录；预览、安装文件与菜单启用/运行接受分开记录。已有目标拒绝覆盖，候选更新须先核对本任务已安装完整树及维护范围。\n\n内容维护规则见 [手册维护](../../docs/runbooks/handbook-maintenance.md)，计划与实际验收见 [统一手册子计划](../../docs/plans/2026-10-11-fvtt-suite-refactor/modules/fvtt-suite-console.md)。\n\n## 可选帮助 API\n\nGM 可调用 `game.modules.get(\"fvtt-suite-console\").api.openHelp({entryId, section})`；`entryId`是稳定手册 ID，`section`可选prepare/steps/outputs/limits/sources。未指定条目时沿用窗口当前页。`closeHelp()`只关闭手册。可选消费者先检查模块已启用、api.moduleId和`apiVersion===1`及函数存在，再调用公开接口；Deck及上述本地候选均保留独立说明。框选Token同步与聊天内存保护的玩家入口直接使用本模块随包说明，不调用GM-only合集窗口。\n","foundry-modules/fvtt-suite-console/docs/INSTALL.zh-CN.md":"# FVTT 工具合集 · 统一操作手册 0.3.0\n\n这是 Foundry VTT 14.368 的 GM 只读手册本地交付候选。模块 ZIP 内置用户条目投影；交付目录中的独立 `工具手册.html` 保留完整目录，可离线打开。两者的正文、搜索和样式都随各自文件提供，不需要在线服务。\n\n## 离线阅读\n\n直接打开交付目录中的独立 `工具手册.html`。它不在模块 ZIP 内，是单个自包含文件，不需要启动 Foundry，也不需要连接网络。可使用目录、搜索和条目链接阅读完整工具手册。\n\n## 在 Foundry 中使用\n\n1. 在自己的 Foundry VTT 14.368 数据目录下，把 ZIP 解压为 `Data/modules/fvtt-suite-console/`，确保该目录直接包含 `module.json`、`scripts/` 和 `styles/`。操作前请核对目标目录；若已有同名模块，先按该环境的维护流程处理，不直接覆盖。\n2. 在世界的模块管理界面启用“FVTT 工具合集 · 统一操作手册”，按 Foundry 提示重载页面。\n3. 以 GM 身份进入 **游戏设置 → 配置设置 → 模组设置 → 统一操作手册 → 打开手册**。可按用途浏览或搜索；“刷新状态”会重读当前客户端看到的工具安装和启用状态。\n\n此模块只提供阅读、搜索、复制文本和只读状态展示。复制的命令不会自动运行。条目中提到的其他工具仍须独立安装和启用，显示版本不表示其功能已经通过当前世界验收。模块帮助 API 的版本保持 1。\n\n## 校验交付文件\n\n同目录的 `SHA256SUMS.txt` 记录 ZIP、独立 manifest 与独立 HTML 的 SHA-256。`release-candidate.json` 列出 ZIP 内允许的每个文件、字节数和 SHA-256，以及 ZIP 总大小和独立 HTML 的源/交付身份。独立 manifest 与 ZIP 内 `module.json` 应逐字节相同。发布渠道、规范下载地址、正式品牌和授权尚未确定；这份候选不声明公开发行可用。\n","foundry-modules/fvtt-trigger-engine/README.zh-CN.md":"# FVTT Trigger Engine\n\n`fvtt-trigger-engine` 在 Foundry VTT 14.364 / dnd5e 5.3.3 与 Mirror 14.368 / 5.3.3 运行，新增 Foundry 14.368 / dnd5e 6.0.5 精确候选。它监听 Actor 文档更新、Combat 回合开始和回合结束，按世界设置中的定义调用宏，并向其他模块公开事件订阅接口；6.0.5 已通过四模块迁移所需的限定事件、回合、防重复和真实 HP 联动验收。\n\n自有 Next 的 14.368 / 6.0.6 已接受本模块正常首次保存、管理器显示、单 GM 的禁用／不匹配零动作与匹配一次、在途退订、普通客户端重载及精确清理。初始无持久 Setting 行是正常默认值，首次保存才创建；这不承诺跨客户端原子保存。另已接受 Custom Conditions 的 HP／伤势消费代表链；WMP 外部攻击事件、多 GM 和完整 Combat 分支仍待各自验收。该版 Token 移动会新增 `flags.dnd5e.lastMovedToken` Actor 更新；只监视 HP 的触发器不会因此执行。\n\n这个模块不拥有任何具体状态规则。Bleeding、Burning、Frozen 和伤势由独立的 `fvtt-custom-conditions` 模块管理；Trigger Engine 只负责事件、active GM 单执行者、Actor 队列、重复保护、因果链和宏调用。Actor 事件额外携带原生更新 Hook 时捕获的 `capturedModifiedTime`，供订阅者与 before/after HP 一起形成可持久去重的事务身份；旧订阅接口与 WMP external API 不变。\n\n已保存的触发定义无法安全改写时，当前 active GM 会看到警告。管理器保存失败时显示原因并保留输入。若世界设置中的触发定义含未来 schema、无效条目或未知字段，仍可读取可识别的有效定义，但编辑会被拒绝，原设置保持原样供核对。同一客户端的定义改动按顺序保存；Foundry 设置接口没有跨客户端或直接设置写入的原子比较机制，不能据此声称全局互斥。\n\nActor 事件的 `before`／`after` 继续保留持久源数据。自动计算最大 HP 的角色，其源 `hp.max` 可以为 `null`；HP 消费者应使用同步捕获的 `preparedHp.before`／`preparedHp.after` 数值，不能把源 `null` 转成 0。物品和效果使最大 HP 重算后，引擎刷新这份独立快照；排队期间不改读后来发生的状态。\n\n## 触发器定义\n\n触发器包含 `id`、`name`、`enabled`、`event`、`conditions` 和 `actions`。支持的事件包括：\n\n- `documentUpdate` / `Actor`，需要 `watchedPaths`；\n- `combatTurnStart` / `Actor`；\n- `combatTurnEnd` / `Actor`。\n\n条件操作数可以读取更新前后的快照或 JSON 字面量，操作符为 `eq`、`ne`、`gt`、`gte`、`lt`、`lte`。宏按定义顺序串行执行，并收到 `triggerContext`。\n\n```js\nconst api = game.modules.get('fvtt-trigger-engine').api;\nconst unsubscribe = api.subscribe(async (context) => {\n  if (context.event.type === 'combatTurnEnd') {\n    // 由其他模块消费通用事件\n  }\n});\n\nawait api.create({\n  id: 'low-hp',\n  name: 'Low HP',\n  enabled: true,\n  event: { type: 'documentUpdate', documentType: 'Actor', watchedPaths: ['system.attributes.hp.value'] },\n  conditions: null,\n  actions: [{ type: 'macro', macroUuid: 'Macro.example' }],\n});\n```\n\n只有当前 active GM 执行事件订阅者和宏。相同 Actor 的更新按观察顺序排队。宏应使用 `triggerContext.updateDocument()` 回写当前 Actor，让因果链能够阻止递归循环。\n\n调用 `subscribe` 或 `subscribeExternal` 返回的退订函数后，尚未开始的回调会被跳过，包括已经进入当前交付队列的回调。已经开始执行的回调仍由调用者负责完成，退订不会撤销它产生的副作用。\n\n等待订阅者、回合回调或宏解析期间若 active GM 改变，旧客户端停止后续分发和宏动作；`triggerContext.updateDocument()` 也会重新验权。已经开始执行的用户宏无法被引擎中断，宏内直接调用文档写入仍须自行检查当前权限。此修复已有定点回归，ServerNext 的双 GM 实机接受仍待完成。\n\n回合结算等待 Foundry 原生 `combatTurnChange`，即核心回合与效果生命周期完成之后；不使用定时器猜测完成时间。快速切换回合时，同一次转换的结束、开始事件会一起按序入队。新建或导入 Actor 会建立更新前快照，便于消费者识别第一次 HP 变化。\n\n历史 5.3.3 运行证据来自 `server-mirror` 的模块矩阵世界：管理器创建/编辑/启停、真实 Actor/Combat 事件，以及两个临时 GM 和 active GM 切换后的单次执行。该实例目前由 Forge 工作占用，本轮不访问或启停。当前重构只使用自有 `F:\\FoundryLab\\foundry-v14\\data\\server-next` / `127.0.0.1:30002`，精确 14.368/6.0.6；T1/T2 源码、构建、实装和业务接受分开记录。未对历史 serverNext/dnd5e 6.0.2 声明兼容。\n\n当前候选使用说明与验收边界见仓库 `docs/runbooks/custom-conditions-and-trigger-engine-usage.md` 和 `docs/reviews/2026-09-21-custom-conditions-release-readiness.md`。\n\nTrigger Manager 可从模块设置菜单或 Token 控制栏打开。状态管理器不属于本模块，应从 Custom Conditions 模块打开。\n\n构建、测试和类型检查使用仓库根目录的 `bun run build:trigger-engine`、`bun run test:trigger-engine` 与 `bun run typecheck:foundry-modules`。\n","foundry-modules/fvtt-weapon-mastery-properties/README.zh-CN.md":"# 武器精通与特性 / Weapon Mastery & Properties\n\n`fvtt-weapon-mastery-properties` 是独立的武器精通与特性模块，负责 D&D 2024 官方八种精通及明确配置的家规特性。它依赖 `fvtt-custom-conditions` 管理临时效果，依赖 `fvtt-trigger-engine` 协调事件；不依赖 house-rules。\n\n2026-10-05 收尾修正原生 Cleave 的事件先后顺序：原生攻击 hook 已先提交命中时，重复结算响应仍返回已确认的命中结果，让同一次子攻击继续处理伤害，不重复规则结算。源码反证、安装与真实接受层级见[本次收尾记录](../../docs/reviews/2026-10-05-servernext-closeout.md)。\n\n历史实机接受绑定 **Foundry 14.364 / dnd5e 5.3.3**。合并后保留精确 **Mirror 14.368 / 5.3.3** 的旧 CC 效果与 Midi 接口；不能只按 Core 14.368 选择 native6。另增加精确 **14.368 / 6.0.5** 候选，已通过限定实机接受：ready、原生 Slow 写入、Fatal 骰、单次原生攻击／Midi 同卡关联、既存卡片实际 HP／Slow 应用和掷骰前取消、r84用例精确来源恢复；不推广全部精通分支或生产。依赖模块仍限0.1.1起的0.1.x或精确0.2.0及版本1 API；Next还须有CC原生武器效果能力，启用Midi时只接受 **14.6.0-beta.4338eeab.local.10**。交叉配对、其他版本和缺少能力拒绝运行。同卡type4须匹配活动／物品／来源／单一目标、攻击／伤害骰和真实HP变化；未证实的local10 type0不作为结算依据。Next续做见[四模块当前进度](../../docs/reviews/2026-10-05-next-four-modules-progress.md)，旧版证据留在[原主进度清单](../../docs/reviews/2026-09-25-weapon-mastery-user-report.md)。构建、单测和实机分别报告。\n\n精确 **14.368 / 6.0.6** 已接受单GM的Sap预约/未开始取消、真实Club命中伤害与Slow、同attack重复提交零重复结算、普通重载和自有对象精确清理。manifest 的 verified 仍为6.0.5；全部精通矩阵、玩家/多GM、长时及生产未接受。历史PARTIAL及旧User原像UNKNOWN保留，详见[执行总账的WMP R5/R6记录](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。\n\n本轮W1/W2候选只使用明确启用且版本、API、能力均匹配的CC/TE；未启用的旧版Midi不阻断原生路径，启用但未接受的Midi仍拒绝。准备和启动会先保留可追踪的攻击记录，异步等待后再次核对当前GM与依赖。准备未完成、部分启动或写入结果未知时，必须由GM核对记录与CC预约；模块不会把它当作干净取消，也不会重复启动同一编号攻击。正常完整启动和提交保持幂等。源码检查、构建与实机接受分别登记，不能用这些说明代替新候选实测。\n\n当前为已完成本地验收的交付候选，尚未发布。逐项玩法证据、实测构建与文档打包身份仅在主进度清单维护；本地结果不等于生产或其他版本已验收。\n\n## 使用范围\n\n- 官方精通：Cleave、Graze、Nick、Push、Sap、Slow、Topple、Vex。\n- 首批家规：Deadly（重击额外骰）、Fatal（只在重击时更换武器基础骰面并加骰）、重击流血。\n- 官方预设与复制后的自定义变体有不同规则 ID；效果来源、目标关系、叠加和消耗规则分别记录。\n- 既有武器默认不启用，不根据武器名称、描述或图标猜测规则。NPC 的掌握资格由 GM 或明确来源授予。\n\n## 开发与验收\n\n### 游戏内复测工具（仅主持人）\n\n本开发版包含复测工具，不需要浏览器打开本地 JavaScript 文件，也不需要反复修改初始化宏。\n\n1. 在模块设置中启用 `Weapon Mastery GM E2E harness (development only)`，然后点 Token 工具栏的试管按钮。\n2. 选择当前测试环境，核对并勾选确认。先运行 `Scan official dnd5e weapons`，再运行 `Create / resume batch`。已有批次直接从下拉框恢复。\n3. 运行 `Prepare task scene and Combat`，工具会激活任务场景并建立或恢复关联的战斗。需要手工准备时，`Register current Combat (manual setup)` 只接纳属于该场景且只包含任务棋子的战斗。\n4. 选择规则，运行 `Reset case`，用 `Open task attacker sheet` 打开攻击者，再运行 `Record UI start`，按平时的方法使用武器攻击及应用伤害；重新打开工具，运行 `Export receipt` 下载本次结果。\n5. 同一批次保留角色和场景。修复代码更新模块后，保存旧结果，勾选已保存结果，再运行 `Accept updated build (keep fixtures)`；随后复位受影响的规则并重测。\n6. 全部完成后，恢复原场景及战斗，填入批次名称，运行 `Cleanup exact batch`。保存清理结果后才运行 `Finalize ledger`。测试源码和下载的结果长期保留。\n\n工具只操作带本批归属标记的对象。为减少等待，擦伤测试使用很难命中的目标；重击测试把任务武器的重击门槛调低，并记录该设置，仍执行真实攻击和伤害。普通武器不会被改动。重击测试不等于证明每次普通攻击都会重击。`Run public Activity API` 的结果与真实界面操作分开标记；原 Midi Apply 故障仍从实际聊天卡按钮复验。\n\nCleave 复测使用大型、2×2 格的任务攻击者和两个不重叠的中型目标，使真实 5 尺武器在当前世界测距规则下也能触及两者；切换其他用例时恢复中型、1×1 格。面板在攻击前显示 `cleaveGeometry`，用实际网格测距检查次目标到主目标和攻击者的距离；超距或无法测量时阻止启动。不会扩大武器触及范围或修改世界的对角线规则。\n\n工具是否可用与各项玩法是否通过，见当日[使用与完成情况](../../docs/reviews/2026-09-25-weapon-mastery-user-report.md)，不以出现按钮或自动测试通过代替游戏结果。\n\n在仓库根运行：\n\n```text\nbun run test:weapon-mastery-properties\nbun run build:weapon-mastery-properties\nbun run typecheck:foundry-modules\n```\n\n显式 build 产生固定产物和 dist/build-identity.json。install、patch、verify-artifact、verify-install 只读取并核对该产物，不会隐式重建；源码、配置、锁文件或共享契约变化后需重新 build。客户端 API 的 buildId 标识实际加载构建，完整安装树哈希和 runtimeCodeSha256 分别标识发布文件与运行脚本。\n\n本地安装使用受保护的 Lab 安装器，先检查实际进程、端口、数据目录和共享服务使用情况。安装文件一致不等于世界已加载或效果已通过实测。批次复用与混合验收见 [CoTN runbook](../../docs/runbooks/weapon-mastery-cotn-e2e.md)，通用短模板见 [模块开发与验收](../../docs/runbooks/custom-module-development.md)。\n\n## 原生数据与自动化\n\n配置使用 `flags.fvtt-weapon-mastery-properties.weapon`，由共享契约严格校验；官方精通仍保留 `system.mastery`。角色的武器熟练和精通资格分别处理。\n\nDeadly 的额外重击骰可以写入原生攻击 Activity 的 `damage.critical.bonus`。精确 Fatal、临时优势/劣势、到期和消费依赖运行模块；不能通过永久改大基础骰冒充 Fatal。流血采用本项目自定义状态的规则，不代表移植 PF2e 整套持续伤害体系。\n\nCleave/Nick 需要真实额外攻击额度验收；Sap/Vex 需要取消、多客户端及来源关系验收；Push 需要真实合法位移验收。仅出现聊天提醒或测试绿色不代表这些行为已通过。Midi 启用时若武器模块没有匹配到本次攻击的有效预检，候选实现会阻止该次掷骰并提示错误；应核查工作流与任务台账后重新发起，不能再由武器模块另开一次原生掷骰。\n\n调用公开的 `WMP.api.use` 时，Midi 启用后的候选实现只启动一次攻击，沿用本次预检编号，并把指定目标传入 Midi。目标必须有当前画布上可用的棋子；只有角色、没有可用棋子的指定目标会被拒绝。攻击完成后可返回待伤害结算，仍按当前工作流设置进行伤害；返回结果不等于已经扣血。取消窗口释放尚未开始的效果，不另开备用攻击窗口。`message.systemCard` 路径不能自动开始攻击，因此该公开入口拒绝它。新版实机复验仍以当前进度记录为准。\n\n在候选实现中，Cleave 命中后由 GM 选择合法第二目标，随后进行独立攻击和伤害；第二次伤害不加正的攻击属性调整值，负值保留。Nick 使用已有 Light 额外攻击，不生成第三次攻击；首把 Light 武器不必配置本模块。Midi 的快速攻击仍显示一次确认对话框，以便核实最终的 offhand/精通选择，并让取消操作释放尚未开始的一次性效果。\n\nSlow、Vex 等需要实际伤害的规则，在玩家自行应用伤害时等待活动 GM 核对来源消息和 Actor 更新；若多个攻击无法唯一关联，保留待 GM 复核，不猜测伤害属于哪次攻击。针对锁定的 Midi 14.0.11，支持带准确来源卡片的卡片内 Apply，并再次核对攻击、目标与 HP／临时 HP 变化；没有来源卡片的右键应用路径继续失败关闭。已保存真实 SY 玩家攻击及应用伤害、在线 GM 结算 Slow 的证据；Vex 的 Midi 与原生两击、消费/再授予和相关生命周期证据分别记录。代表性跨客户端实测与自动化权限/并发检查不冒称全部玩家、角色、棋子组合均做过手工测试。\n\n## 从正式来源生成\n\n独立 Item 的 YAML frontmatter 使用 `原生精通`（或 `native-mastery`）指定官方精通 ID，并以 `weapon-properties` 保存版本化武器配置。Actor 的结构化动作也可以带 `weapon-properties`/`weaponProperties` 配置。配置必须明确提供参数，不能仅凭正文里出现 Deadly/Fatal 名称启用效果。\n\n完整来源样例见 [Item 长矛](../../tests/fixtures/weapon-mastery-spear.md) 和 [Actor 武器动作](../../tests/fixtures/weapon-mastery-actor.md)。在仓库根运行正式 CLI：\n\n对来源给出的固定伤害，生成器只保留一份活动伤害，不再叠加同一武器基础伤害或额外推断属性加值；活动同时记录基础骰来源，供 Fatal 等规则精确处理。能够从来源明确推导原生属性攻击的武器继续使用原生基础伤害。导入后手改活动伤害可能使来源绑定失效，此时自动处理会拒绝猜测；应更新来源并重新生成、导入。\n\n```text\nbun run src/index.ts tests/fixtures/weapon-mastery-spear.md --fvtt-version 14 --effect-profile core --icon-mode off --output .local/weapon-properties-evidence/spear-core.json\nbun run src/index.ts tests/fixtures/weapon-mastery-actor.md --fvtt-version 14 --effect-profile modded-v14 --icon-mode off --output .local/weapon-properties-evidence/textual-actor.json\nbun run verify:actor tests/fixtures/weapon-mastery-actor.md .local/weapon-properties-evidence/textual-actor.json\n```\n\n先准备本任务自己的输出目录。`verify:actor` 只验证 Actor；独立 Item 使用正式 workflow 内的值级 verifier，再逐项对照来源。`core` 不写武器模块启用 flags：Deadly 投影为原生 Activity 额外骰，Fatal/重击流血保留说明并标记需要复核。`modded-v14` 才输出本模块的版本化启用配置。Web AI Item Intake 仍限制 v14/core。\n","foundry-modules/midi-qol/README.md":"# Midi-QOL ServerNext compatibility patch\n\nThis is the retained historical6.0.2/local.9 tool and patch route. Current\nServerNext is6.0.5/local.10; the two request-bonus handler corrections were\nalready integrated separately. Do not rebuild this older lock and overwrite\nthe accepted current installation. Its installer remains bound to the old\ntarget. Current state is only in\n`docs/plan/server-next-migration-handoff-20260927.md`; see the2026-10-01\nrequest-bonus review for the limited local.10 acceptance.\n\nThis directory carries a reproducible patch against an exact official Midi-QOL commit. It does not vendor the upstream repository or reuse the dirty external checkout.\n\nThe supported target is Foundry 14.368, dnd5e 6.0.2, world `cor-cotn`, and the `server-next` data root. `server-mirror` is read-only and is rejected by the installer.\n\n## Workflow\n\n1. `bun run midi-qol:upstream-check` reports the current official releases, branches, and open merge requests. This is advisory; a build always uses the commit in `upstream.lock.json`.\n2. `bun run midi-qol:build` creates a clean source checkout under `.local/midi-qol`, verifies the lock and patch hashes, records baseline and patched TypeScript diagnostics, applies the patch exactly, and builds a candidate ZIP.\n3. `bun run midi-qol:test` runs the patch-contract, archive, and install-target rejection tests.\n4. `bun run midi-qol:install` performs a dry-run against ServerNext. Add `--apply` only for the exact stopped ServerNext target after the candidate and checks pass.\n\nHistorical 6.0.2 tests read only `.local/midi-qol/test-sources/dnd5e-6.0.2/dnd5e.mjs`;\nthey do not read the currently installed ServerNext system, which may have moved to\n6.0.5. Obtain `dnd5e-release-6.0.2.zip` from the official\n[`release-6.0.2`](https://github.com/foundryvtt/dnd5e/releases/tag/release-6.0.2)\nasset URL recorded in that release's `system.json`, extract **only** its root\n`dnd5e.mjs` into the ignored directory above, and verify SHA-256\n`e9570927a215948fb3a3923a322c7bbf1455009565f48813168edd8c6df4890f`.\nThe shared test reader enforces that digest and fails if the file is absent or\ndifferent. This is a historical test input, not a system install or a 6.0.5\ncompatibility claim.\n\nThe build and installer never call the upstream `dev`, `clean`, or `tag` tasks. They do not create backups, modify worlds, or operate on `server-mirror`.\n\nThe local.3 candidate gives each of three ordinary cleanup effects (template, summon, transform) a fresh `_id`, top-level `type: \"base\"`, and `system: { changes: [] }`. This prevents dnd5e's migration from matching an undefined document ID against an undefined status ID. `BaseEffectData` does not declare `system.type`; the local.2 attempt to supply it was incorrect and failed the real workflow. That cleanup patch leaves copied, restored, condition, and enchantment paths unchanged; the separate local.7 candidate below addresses the observed enchantment clone failure. Actual creation, type/model and dependency cleanup still require Chrome acceptance.\n\n## Focused C/F fixture\n\n`bun run midi-qol:prepare-cf` builds an importable Script Macro and a checked test Item input in `dist/cf-fixture`. It does not connect to or modify Foundry. The macro creates only tagged temporary documents through native APIs, reads back the effective 1-minute / Circle-30-ft / creature-target configuration, and refuses to cast if it differs. The cast uses the installed activity workflow; effect deletion must cause region deletion through the real dependency implementation. Its constructor probes are diagnostic and never count as workflow acceptance.\n\nServerNext/30002 is a permanently running shared service. This fixture never starts, stops, restarts, installs modules, changes global Midi settings, activates a scene for other users, or deletes pre-existing campaign objects. The Chrome executor must preserve the service when it finishes.\n\nLocal.5 adds a separate restored-workflow Item/Activity patch: for dnd5e 6+, recover a scaled activity through the native chat-card resolver, then use its Item or the native associated-item resolver before the legacy flag fallback. This addresses optional manual Damage throwing on a valid dnd5e 6 card with no legacy item flag, and avoids access-order-dependent loss of system.scaling. Local.4 was built but rejected in review before deployment for the latter issue. The cleanup patch remains unchanged. Source regression and browser retesting are separate gates.\n\nLocal.6 adds independent patch 0003 for damage-tray target rendering. On the fixed dnd5e 6 target, Actor-only or actorless/missing Token references become explicitly unavailable text rows before the native Token-only builder is called. They contain no damage total or actionable target option; valid targets keep their original calculation/application behavior. Source and native-parent regression tests do not replace browser verification.\n\nThe separate `browser-update.ts` entry is pinned to a local.7-to-local.8 browser-resource update without service operations; see the runbook. A running server may continue to advertise cached local.7 metadata. The fixture compares methods, accessors, damage rendering, enchantment cloning, and the new ActiveEffect creation override against the candidate ZIP. The browser must execute those exact functions before its behavior is attributed to local.8. Refresh only the test tab after a successful update and between active scenarios.\n\nLocal.7 completed its scoped A–G/Z checklist (35/35) on 2026-09-22; those results retain their original version and evidence. Local.8 adds independent patch 0005 after a separate Batch 6 DAE/Tidy test found ordinary ActiveEffect creation failing. In dnd5e 6.0.2, an ID-less ordinary effect can match an ID-less status entry and be migrated to an invalid condition. The new Midi-owned subclass override supplies an ID before that migration only for newly created, non-condition effects on dnd5e 6; explicit IDs, native condition effects, and other versions retain their original path. Offline
