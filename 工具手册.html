,"sources":["foundry-modules/fvtt-weapon-mastery-properties/README.zh-CN.md","docs/plans/weapon-mastery-active-case.md","docs/runbooks/weapon-mastery-cotn-e2e.md","docs/reviews/2026-09-25-weapon-mastery-user-report.md","docs/reviews/2026-10-05-servernext-closeout.md","docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md"],"watch":["foundry-modules/fvtt-weapon-mastery-properties/","packages/contracts/src/weapon-properties.ts","packages/contracts/src/weapon-effects.ts"],"module":"fvtt-weapon-mastery-properties","entryId":"fvtt-weapon-mastery-properties","ownerDirectory":"foundry-modules/fvtt-weapon-mastery-properties","foundryModuleId":"fvtt-weapon-mastery-properties"},{"id":"midi-qol","title":"Midi-QOL ServerNext 本地兼容候选","category":"play","summary":"查阅当前ServerNext 6.0.5／local.10限定接受，以及原6.0.2源码工具的独立适用边界。","when":"完整 ServerNext 迁移需要 Midi-QOL 战斗自动化，而官方稳定包尚未声明支持 dnd5e 6 时使用当前本地候选。","requires":["Foundry VTT 14.368","当前dnd5e6.0.5／Midi local.10；源码工具锁定6.0.2，不用于覆盖当前安装。","DAE实际候选与客户端版本以唯一总表为准。","libWrapper 与 socketlib","world cor-cotn、server-next 与 GM"],"steps":[{"title":"区分当前安装与历史工具","text":"当前安装local.10，在6.0.5下Check／Save请求来源加值各+4已限定接受。原源码工具、local.7的A–G/Z35项及local.9手动APPLY场景属于6.0.2历史证据；旧构建／安装和local.7→local.8资源更新脚本不能覆盖当前候选。模块ID始终为midi-qol。"},{"title":"核对运行身份和加载代码","text":"确认精确app/data/world/port、资源哈希和当前客户端方法指纹。读取唯一总表与当前版本收据；local.9三资源离线更新仅作历史操作证据，服务器包版本与实际客户端候选分开记录。"},{"title":"只补相关接受缺口","text":"先复用仍适用的已接受证据。当前非付费模块按正常加载／必要入口无新增错误接受；只有新改动、真实失败或具体缺口才补对应检查，不把历史NOT_EXECUTED自动扩展为所有玩法重测。"},{"title":"核对模板清理链","text":"模板依赖链等历史专项保留当时版本边界；相关行为再次变化时才按对应合同补验，不能用看到模板或没有toast代替完整链证据。"}],"outputs":["保持 midi-qol ID 的本地候选模块","分层的构建、服务器 smoke 和 A–G 玩法证据","可在官方修复后删除的独立补丁"],"limits":["历史local.7的A–G/Z35项及local.9基础isDamaged手动APPLY接受保留原6.0.2范围。当前ServerNext安装local.10；6.0.5下Check／Save两个请求来源加值各+4、94启用ID和49来源值保留、精确清理已接受，其他权限／隐私／workflow分支不由此扩大。","只声明固定 ServerNext 目标，不代表其他 Foundry、dnd5e 或世界兼容。","server-mirror 始终只读；30002 服务由本批主控和用户管理，普通验收复用常驻实例，E2E 只清理自身临时文档，结束不得停服或改动其他任务对象。","local.10增量补丁、验收记录与完整历史Midi源码工具已进入master。固定历史回归材料按独立测试输入库流程准备，旧工具仍保留原6.0.2目标，不覆盖现行安装；后续构建、安装或发布按具体范围处理。"],"keywords":["Midi-QOL","ServerNext","dnd5e 6","ActiveEffect","模板","战斗自动化"],"sources":["foundry-modules/midi-qol/README.md","docs/runbooks/midi-qol-source-patch-build-install.md","docs/runbooks/legacy-next-test-inputs.md","docs/plan/midi-qol-dnd6-bugfix-development.md","docs/reviews/2026-10-01-next-605-midi-request-bonus-gap.md"],"watch":["foundry-modules/midi-qol/","docs/plan/midi-qol-dnd6-bugfix-development.md"],"module":"midi-qol","entryId":"midi-qol","ownerDirectory":"foundry-modules/midi-qol","foundryModuleId":"midi-qol"},{"id":"server-next-external-candidates","title":"ServerNext 外部模块候选与验收资料","category":"maintain","summary":"查阅原迁移树保留的外部模块锁定来源、本地补丁、候选文件及分项验收输入。","when":"继续ServerNext外部模块工作或核对历史候选时，先从总进度和固定来源判断是否需要新工作。","requires":["明确当前Core14.368／dnd5e6.0.5；候选目录中的6.0.2目标和旧运行合同属于历史范围。","先查唯一迁移总表与独立父审，不重跑已接受的行为，不自动恢复暂停项目。"],"steps":[{"title":"先看唯一总进度","text":"打开迁移当前清单，区分已完成限定验收、源码尚未发布、开放问题与暂停项目。"},{"title":"核对固定候选","text":"对照README、upstream-lock和candidate-inventory；原包的版本、提交和SHA保持历史身份，不改标签冒充6.0.5接受。"},{"title":"按实际新任务准备检查","text":"复用文件侧共用工具；安装、服务和运行合同需核当前目标与授权。旧install/launch脚本及6.0.2合同不能直接重放已完成批次。"},{"title":"处理本轮DAE与图片修补","text":"DAE目录保存14.0.14的最小阶段链候选、锁定上游来源与精确版本方法测试；icons目录保存图片引用修复和许可。正常文档API修改图片，保持角色规则来源；文件检查不代替客户端接受，运行结果以唯一总表及分项收据为准。"},{"title":"核对不全包6.0.5适配","text":"classpack目录保留官方4.3.4的21合集及原文档身份，包含来源明确的链接、MPMM石之坚韧熟练加值次数修复和显式正常API迁移入口。写前及后端均保护进阶、效果、正文和规则版本；缺失自定义召唤／辅助法术单列后续。下面命令只运行离线检查，固定输入可从独立测试输入库自动读取，数据库查询使用本次临时夹具。运行操作先核唯一总表的来源、迁移、重载、代表UI和清理各门，严格按当前一次性合同执行。失败收据不能清空后重放；代表行为不等于27个宏或完整施法、伤害反应链全部接受。新构建报告写入dist/candidate-report.json，历史报告保持。","command":"bun run test:classpack-next"}],"outputs":["锁定来源、补丁与候选文件身份；各批次独立验收、恢复和清理证据。"],"limits":["这些本地工具、历史补丁与框选同步增量已纳入2026-10-05本地整合；实际运行接受仍逐版本、逐批次判断，远端推送不在本批范围。","构建或文件检查不替代正常UI、玩家／GM重载、来源语义或精确清理；未接受项保留原边界。","付费包不由本任务验证；原来未启用项确认后排除，明确暂停项保持暂停。图片明确替代不等于找回原图，也不恢复Plutonium。","Classpack 6.0.6只有加载清单投影候选，保留现有pack/运行脚本及6.0.5迁移身份；preflight、migrate和confirmRecovery仍在6.0.6拒绝，不能借兼容上限强跑迁移。Item Piles本地修正仍只在6.0.2执行，6.0.5/6.0.6真实转移语义需另验。"],"keywords":["ServerNext","外部模块","Item Piles","Vision","Item Macro","迁移","候选"],"sources":["foundry-modules/server-next-external-candidates/README.md","foundry-modules/server-next-external-candidates/classpack/README.md","docs/runbooks/legacy-next-test-inputs.md","docs/plan/server-next-migration-handoff-20260927.md"],"watch":["foundry-modules/server-next-external-candidates/"],"module":"server-next-external-candidates","entryId":"server-next-external-candidates","ownerDirectory":"foundry-modules/server-next-external-candidates","foundryModuleId":null},{"id":"fvtt-suite-console","module":"fvtt-suite-console","title":"FVTT 统一操作手册","category":"play","summary":"在Foundry内搜索工具、阅读步骤与版本限制，查看当前世界模块状态，并接通可选模块帮助。","when":"需要查找合集工具、核对使用步骤或原始说明时使用；各个工具继续独立启用。","requires":["GM身份；手册窗口当前精确适配Foundry14.368，实际接受状态见总账。","安装并在当前世界启用本手册模块；正文随包提供，不依赖AI、CDN或在线搜索。"],"steps":[{"title":"取得本地交付候选","text":"模块ZIP、独立manifest、SHA256SUMS.txt、release-candidate.json和完整工具手册.html分别交付。先核对清单与SHA；首次安装把ZIP解压到自己的Data/modules/fvtt-suite-console，使module.json直接位于模块根。已有同名目录先按该环境维护流程处理，不直接覆盖；完整HTML不在模块ZIP内。"},{"title":"启用手册模块","text":"在当前世界的模块管理中启用“FVTT 工具合集 · 统一操作手册”。启用属于安装准备，会改变正常模块配置。"},{"title":"从GM设置打开","text":"进入游戏设置 → 配置设置 → 模组设置 → 统一操作手册，点击“打开手册”。重复打开会聚焦同一窗口。"},{"title":"搜索、定位与继续阅读","text":"输入用途关键词或选择分类；打开工具条目后定位准备、步骤、产物、限制和原始说明。窄窗口使用“目录”按钮展开导航。"},{"title":"查看模块状态","text":"工具列表和条目显示当前世界已启用、未启用、未安装或状态未知及实际版本；点击“刷新状态”重读当前客户端。安装或启停后按Foundry提示重载页面，适用范围继续看条目说明。"},{"title":"复制与关闭","text":"复制按钮只取得命令文字；浏览器限制剪贴板时会选择文字并提示Ctrl+C。主题只在当前窗口内存中切换。关闭或重绘会释放旧监听器与待执行搜索。"}],"outputs":["GM可使用的只读手册窗口。","Foundry内28个用户条目；完整离线HTML保留38个稳定条目及全部来源。","只读的当前世界安装/启用状态与实际版本。","本地模块ZIP、独立manifest和HTML，以及逐文件身份/校验清单。"],"limits":["打开、浏览、搜索、主题与复制不写世界文档或Foundry设置，不执行命令，不启动其他模块操作。","H2/H3命名功能与H4交付的实际接受以执行总账为准；静态测试、manifest和文件哈希不代替目标世界行为，H3历史恢复审计缺口保留。","H3先接模块状态与Deck可选帮助；后续本地候选增加框选Token同步、法术解析器和聊天内存保护帮助。各模块真实窗口接受按各自记录，工具启动按钮、收费与公开发行继续按后续计划。","H4按delivery.jso aintenance.md)。\n\n## 支持范围\n\n| 目标 | 系统版本 | Effect profile | 当前状态 |\n| --- | --- | --- | --- |\n| Foundry v12 | dnd5e 4.3.9 | `core`、`modded-v12` | 默认目标；严格结构验证 |\n| Foundry v13 | dnd5e 4.3.9 | `core`、`modded-v12` | 与 v12 共用 4.3.9 投影器；严格结构验证 |\n| Foundry v14 | dnd5e 5.3.3 | `core`、`modded-v14` | 独立 5.3.3 投影器；运行时证据按验收报告限定 |\n\n`modded-v14` 当前锁定 MIDI-QOL 14.0.11 和 DAE 14.0.12；旧的 14.0.9 实机结果保留为历史证据，不能自动升级为 14.0.11 的运行时验收。完整生产模组集合整体兼容性状态仍是 **Partial**。详见 [`docs/acceptance/current-support-matrix.md`](docs/acceptance/current-support-matrix.md)。\n\nActor、Item、单文件、合集、Vault Sync、CLI 和 Web Job 共享 `parse → canonical IR → validate IR → target projector → validate output → write` 管线。诊断状态为 `failed` 或 `needs_review` 时不会写入正式 output；`core` profile 不包含 MIDI-QOL、DAE、Times Up 或 Item Macro 专属字段。\n\n## FVTT JSON Forge（Foundry 模块）\n\n`fvtt-json-forge` 是 A–E 统一交付的 GM-only 浏览器模块，锁定 Foundry `14.364` / dnd5e `5.3.3` / `core`。它提供 Actor、Item、证据优先 Intake、review bundle 恢复、当前浏览器/世界/GM scope 的 Source Library，以及 mixed Actor/Item Collection、标准 ZIP、concurrency-1 可恢复队列和 accepted-only 批量创建/readback。\n\n正式发行版通过 Foundry Setup 的 **Install Module** 安装，manifest URL 为：\n\n```text\nhttps://raw.githubusercontent.com/bill34345/fvttV12JsonGenerator/master/foundry-modules/fvtt-json-forge/src/module.json\n```\n\n模块不是任意 JSON 导入器：只有当前、完整、decoded 且 formal verification 与 review 均为 `accepted` 的结果可以写入世界。浏览器关闭或刷新会把运行中任务标记为 `interrupted`，不会在后台继续或自动重发可能计费的请求。详细安装、操作、数据与支持边界见 [`foundry-modules/fvtt-json-forge/README.zh-CN.md`](foundry-modules/fvtt-json-forge/README.zh-CN.md)。\n\n## 安装\n\n需要 [Bun](https://bun.sh/) 1.3 或兼容版本：\n\n```powershell\ncd I:\\OpenCode\\fvttV12JsonGenerator\nbun install --frozen-lockfile\nbun run cli:help\n```\n\n仓库中的 `data/cn.json`、`data/spells.ldb` 和 v12 golden master 为现有 v12 工作流提供映射与模板。v14 正常生成不需要完整的 dnd5e/Foundry 上游仓库。\n\n## 单文件转换\n\n默认生成 Foundry v12 core JSON：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example.json\"\n```\n\n显式生成 Foundry v14：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n需要锁定的 MIDI-QOL/DAE 自动化时使用：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example-v14-modded.json\" `\n  --fvtt-version 14 `\n  --effect-profile modded-v14\n```\n\n最终 Actor/Item JSON 必须由 CLI 或项目 workflow 生成；不要手工拼装或修补最终 JSON。\n\ndnd5e 4.3.9 Item 不再输出 legacy `system.activation` 或 `uses.value/uses.per`。迁移细节见 [`docs/migrations/2026-07-30-dnd5e-4.3.9-generation-schema.md`](docs/migrations/2026-07-30-dnd5e-4.3.9-generation-schema.md)。\n\n## v14 名称驱动图标\n\nv14 可以显式启用安全的名称驱动 Item 图标解析：\n\n```powershell\nbun run src/index.ts \"templates/npc-example.md\" `\n  -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" `\n  --fvtt-version 14 `\n  --effect-profile core `\n  --icon-mode safe\n```\n\n`safe` 只使用锁定的 Foundry `14.364` 核心图标和 dnd5e `5.3.3` 图标。解析顺序为外部 override、已有有效图标、精确 Compendium 名称、带来源结构证据的高置信语义匹配、dnd5e 类型默认图标；低置信候选不会强行采用。生成结果旁会写入 `*.icon-review.json`，合集和 Vault Sync 会生成聚合 `icon-review.json`。\n\n可用 `--icon-overrides \u003cpath>` 指定独立 override 文件；Web 服务器只从 `FVTT_V14_ICON_OVERRIDES` 读取该服务器端路径。v12/v13 不接受 `safe`。\n\n本地人工审阅：\n\n```powershell\nbun run review:icons:v14 `\n  --report \"obsidian/dnd数据转fvttjson/output/example-v14.icon-review.json\" `\n  --output \".local/icon-review/example-v14.html\"\n```\n\n## Obsidian 工作流\n\n默认数据路径：\n\n```text\nobsidian/dnd数据转fvttjson/input\n  → parser / generator / workflow\n  → obsidian/dnd数据转fvttjson/output\n```\n\n批量增量同步：\n\n```powershell\nbun run sync:vault\n```\n\n同步会：\n\n- 处理 `input/` 中新增或变化的 Markdown；\n- 把生成 JSON 写入 `output/`；\n- 覆盖前把旧 JSON 放入 `output_backup/`；\n- 通过 `.fvtt-sync-manifest.json` 跳过未变化输入；\n- 在源文件删除后移除过期输出。\n\n纯文本 Item 合集可以先拆分到 `middle/items`，也可以在同一次项目工作流中推广 Markdown 并生成最终 JSON：\n\n```powershell\n# 只拆分中间 Markdown\nbun run src/index.ts --ingest-items \"path/to/items.md\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n\n# 生成 middle/items、input/items 和 output/items\nbun run src/index.ts --ingest-items-json \"path/to/items.md\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nItem 专用运行只处理本次推广的 Item 文件，不会顺带重生成或清理 vault 中其他 Actor 输出。\n\n## AI Item Intake（Foundry V14/core）\n\n原始 TXT 或格式不规则的 Item Markdown 使用正式 `--intake-items`，而不是旧的 `--ingest-items` / `--ingest-items-json`。它先由 AI 提取带原文位置的 Item IR，再由确定性规则验证证据、渲染项目 Markdown 的 `item-mechanics` 契约、走既有 Item generator，并逐项验证生成 JSON。AI 从不直接写最终 JSON；任一证据、法术唯一性或机制投影不成立都会停在 `needs_review` / `failed`，不会以空能力或 Utility Activity 退化。正式法术必须由 identifier 与英文名共同唯一命中锁定 dnd5e `5.3.3` 目录，且不使用角色法术位。\n\n```powershell\nbun run src/index.ts --intake-items \"path/to/raw-item.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n此入口只接受 Foundry `14.364` / dnd5e `5.3.3` / `core`。单次最多 50 个物品、200,000 个 UTF-16 字符。accepted 的 Markdown 和 JSON 分别推广到 vault `input/items/` 与 `output/items/`；完整来源、IR、诊断、审查与 provider 审计保留在 `.local/item-intake-runs/\u003crun-id>/`。恢复审查使用：\n\n```powershell\nbun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" `\n  --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\nItem Intake 与 Monster Intake 共用 `MONSTER_INTAKE_*` 的 provider/doctor 配置、凭据隔离和本机 OAuth bridge 边界；变量名是历史兼容名称，不表示 Item 会走旧的 Monster IR。完整机械契约、已验证范围和仍待运行时验收的边界见 [`docs/item-ai-intake-v14.md`](docs/item-ai-intake-v14.md)。\n\n## Species Intake 与累计种族模块（Foundry V14/core）\n\n不规则种族 TXT 或人工编辑后的规范 Species Markdown 使用 `--intake-species`。它建立独立的来源证据 IR、确定性 Species Markdown、原生 race/feat package 和 accepted ledger；复杂规则可以诚实保留为 `gm-assisted` / `external-rule`，但不能伪装成空 Utility 或任意 Effect。单个 TXT 最多包含 50 个候选。\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\n```\n\nIntake 成功不会自动重建模块；`build:homebrew-species` 是独立显式步骤。任何 accepted Markdown 编辑都会使 ledger hash stale，必须再次经 `--intake-species` 审查，未更新前模块 build 会拒绝。模块只有 `species` 与 `features` 两个 Item Compendium，无 runtime JavaScript 或世界扫描。完整契约、食人魔自动化边界与验收层级见 [`docs/species-ai-intake-v14.md`](docs/species-ai-intake-v14.md)。\n\n## AI 怪物资料整理（推荐）\n\n第一次拿到 TXT 或格式混乱的 Markdown 时，推荐让 AI 负责发现怪物边界与提取来源证据，再由项目确定性生成标准 Markdown 和 Actor JSON。AI 不直接写最终 JSON，任一证据、覆盖、投影或独立 review 门失败都会进入 `needs_review` 或 `failed`，不会静默回退旧转换器。\n\n配置专用环境变量，不会读取 `TRANSLATION_*` 或通用 `OPENAI_*`：\n\n```text\n# Repository/GitHub-safe default: use API key mode in committed configuration.\nMONSTER_INTAKE_AUTH_MODE=api-key\nMONSTER_INTAKE_API_KEY=\u003cprovider key>\nMONSTER_INTAKE_BASE_URL=https://api.openai.com/v1\nMONSTER_INTAKE_MODEL=\u003cextraction model>\nMONSTER_INTAKE_REVIEW_MODEL=\u003coptional reviewer model; defaults to extraction model>\nMONSTER_INTAKE_TIMEOUT_MS=60000\n```\n\nFor this machine only, put the following override in the ignored local `.env`; do not commit it. The bridge owns the OAuth token.\n\n```text\nMONSTER_INTAKE_AUTH_MODE=codex-oauth\nMONSTER_INTAKE_CODEX_OAUTH_BASE_URL=http://127.0.0.1:8787/v1\nMONSTER_INTAKE_CODEX_OAUTH_BRIDGE_TOKEN=codex-oauth-local\nMONSTER_INTAKE_MODEL=gpt-5.6-luna\nMONSTER_INTAKE_CODEX_OAUTH_REASONING_EFFORT=xhigh\n```\n\n这里的 `xhigh` 对应 Codex 界面里说的 `ultra`。不填写模型时，`codex-oauth` 模式也会默认使用 `gpt-5.6-luna`；这只是旧的本机兼容桥设置，不是网页的 Companion。Companion 留空时始终使用这台电脑当前 Codex CLI 的默认模型，不会偷偷填入 Luna。\n\n运行单只或合集：\n\n```powershell\nbun run src/index.ts `\n  --intake-monsters \"path/to/raw.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n`--dry-run` 只检查配置、输入限制并估算怪物数和最大调用数，不调用 AI、不推广文件。accepted Markdown 写入 vault `input/`，Actor JSON 由现有 workflow 写入 `output/`。若结果需要确认，审查包保存在 `.local/intake-runs/\u003crun-id>/`，可提交 decisions 后完整重跑：\n\n可以用下面的命令检查 Intake。API Key 模式只检查配置；Codex OAuth 模式还会检查本机桥接服务的 `/health`：\n\n```powershell\nbun run src/index.ts --intake-doctor\n```\n\nCodex OAuth 这里指“本机 OpenAI-compatible 兼容桥接服务”，不是把 Codex OAuth token 直接当成 OpenAI Platform API key。项目默认只允许连接 `127.0.0.1`、`localhost` 或 `::1`，桥接服务没有启动时会明确失败。模型列表没有列出 `gpt-5.6-luna` 时 doctor 会给出提示，但不会武断阻止首次 Intake 请求，因为部分桥会接受模型别名但不把它列在 `/v1/models` 中。该兼容层不是本项目内置的官方 OpenAI API 认证方式。\n\n```powershell\nbun run src/index.ts `\n  --resume-intake \".local/intake-runs/\u003crun-id>\" `\n  --decisions \".local/intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\n退出码：`0` 表示全部 accepted 或仅执行预览，`2` 表示至少一个候选 needs_review 且没有执行失败，`1` 表示存在 failed。TXT/MD 内容会发送到配置的 AI provider；密钥仅保留在服务端，日志不记录请求头、密钥或隐藏推理。Monster、Item 与 Species Intake 均最多处理 50 个候选、200,000 个 JavaScript UTF-16 字符；Item 与 Species 固定为 V14/core，精确边界见各自章节。三者都不支持图片/PDF OCR，也不承诺任意模型、任意文本都能自动通过。\n\n## 血猎手 2024 原生合集模块（Foundry v14）\n\n`fvtt-blood-hunter-2024` 锁定 Foundry `14.364` / dnd5e `5.3.3`，提供 `classes`、`subclasses`、`features` 三个原生 Item 合集。它不依赖 Plutonium 或旧 classpack；旧 `build-blood-hunter-homebrew` 仍只生成标记为 `plutonium-side-data` 的历史 side-data，不是该模块的权威内容。\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"C:\\absolute\\path\\blood-hunter-2024.activities.json\"\nbun run test:blood-hunter-v14\nbun run install:blood-hunter-v14 --apply\nbun run verify:blood-hunter-v14-install\n```\n\n构建严格校验锁定源 SHA-256、94 条 coverage ledger、117 个 Activities、稳定 UUID、Advancement 引用、三个 LevelDB packs、确定性 ZIP 以及 dnd5e `5.3.3` 的 12 个官方内容 UUID。安装只允许配置后的本地 Lab，拒绝生产路径、外来同名模块、链接路径和被占用的 Pack，并在替换既有自有模块前建立恢复备份。`verify-install` 只证明安装字节和 pack 内容一致，不代表真实 Foundry 运行时或线上生产验收。\n\n玩家从模块 `classes` 合集把“血猎手”拖入角色卡，再通过 dnd5e 原生 Advancement 升级和选择结社；已经复制到 Actor 的 Item 是快照，不会随模块更新实时同步。旧角色应使用模块中的 GM-only“血猎手 2024：角色迁移”执行 Preview、迁移副本验证，再决定是否应用原角色。完整构建、安装、迁移和自动化边界见 [`foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md`](foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md)。\n\n## Foundry 目标世界法术解析（v14）\n\n带法术清单的 AI Intake Actor 会保持便携：项目生成阶段只写入带来源证据的法术清单，并将状态标为 `pending`；不会写占位 Spell、世界内 UUID 或本机 Compendium UUID。把 Actor JSON 正常导入 Foundry 后，由目标世界模块扫描所有已启用且当前 GM 可读取的 Item Compendium，完成实际法术选择和水合。\n\n当前解析器只支持 Foundry `14.364` / dnd5e `5.3.3`。匹配规则是精确身份优先：存在同名且事实一致的 2024 法术时只能选择 2024；只有不存在同键 2024 候选项时，才允许使用带明确报告的唯一 2014 回退。模糊、冲突、缺失或人工修改都会进入检查，不会部分写入。\n\n```powershell\nbun run foundry:lab spell-resolver build\nbun run foundry:lab spell-resolver install --apply\nbun run foundry:lab spell-resolver verify-install\nbun run foundry:lab spell-resolver prepare-world --world=fvtt-v14-module-matrix --apply\n```\n\n模块源码、构建和本地安装工具统一位于 [`foundry-modules/monster-spell-resolver/`](foundry-modules/monster-spell-resolver/README.zh-CN.md)。普通使用、升级、卸载、诊断和安全边界见 [`docs/foundry-spell-resolver-install.zh-CN.md`](docs/foundry-spell-resolver-install.zh-CN.md)。模块不支持 Foundry v12、生产世界自动安装或全世界批量迁移。\n\n## 旧纯文本命令兼容\n\n网页的旧“纯文本 Actor”任务已经删除；请在网页使用“自动转换”入口。CLI 仍保留下面的旧命令，方便历史脚本平滑迁移。它会先在临时区域生成标准 Actor Markdown，再走当前 Actor 流程；正式写入前会一次检查所有同名输入和输出，发现任何冲突就停止，不覆盖也不自动改名。\n\n它不会把识别失败或有警告的资料冒充正式结果，且不会在 AI Intake 不可用时偷偷改走 AI。\n\n仅拆分纯文本资料为项目 Markdown：\n\n```powershell\nbun run src/index.ts `\n  --ingest-plaintext \"path/to/collection.txt\" `\n  --emit-dir \"obsidian/dnd数据转fvttjson/input\"\n```\n\n从纯文本转换为正式 Actor：\n\n```powershell\nbun run src/index.ts `\n  --ingest-plaintext-actors \"path/to/collection.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n先用 `--dry-run` 检查识别数量和警告。`--ingest-plaintext-actors` 是兼容入口；新项目应优先使用标准 Actor Markdown 或网页“自动转换”。\n\n## GoddessFantasy 流水线\n\n采集结果默认写入 `obsidian/dnd数据转fvttjson/crawls`。cookie、账号和密码只能通过忽略文件或环境变量提供，不得提交到 Git。\n\n```powershell\n# 板块增量采集\nbun run src/tools/crawlSites.ts goddessfantasy-board `\n  --board-url \"\u003cboard-url>\" `\n  --cookie-header-file \".local/goddessfantasy.cookie\" `\n  --out-dir \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318\" `\n  --mode incremental\n\n# records.json 转换为纯文本怪物\nbun run src/tools/crawlSites.ts records-to-plaintext `\n  --records \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318/records.json\" `\n  --out-dir \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318/plaintext/monsters\"\n```\n\n`--force` 是 `--mode full` 的兼容别名。真实登录采集不属于离线验收，运行前应先 dry-run 并保护本地凭据。\n\n## Web 工作台\n\n```powershell\n# 本地开发\nbun run web:dev\n\n# API 服务\nbun run web:api\n\n# 生产构建\nbun run web:build\n```\n\n`web:api` / `web:start` 默认只监听 `127.0.0.1:5174`。非回环或反向代理公开模式必须显式启用并配置服务器端 bearer token；浏览器不能提交 VPS 凭据。Web/API 支持上传 Markdown、单文件转换、批量怪物 job、下载 ZIP、来源核对及受限的 workspace path 模式。完整部署、鉴权、可信代理与资源上限见 [`docs/web-deployment.md`](docs/web-deployment.md)；三种 AI 连接方式和 Windows Companion 见 [`docs/web-ai-connections.md`](docs/web-ai-connections.md)。\n\n## 参考缓存\n\n完整 dnd5e 5.3.3 源码、Foundry API 页面和生成索引存放在忽略的 `.local/references`，不是生成器运行依赖：\n\n```powershell\nbun run references bootstrap --dry-run\nbun run references bootstrap\nbun run references verify\nbun run src/tools/referenceIndex.ts\n```\n\n获取器先在 staging 中检出 manifest 固定的 revision，通过验证后才原子替换本地缓存。详情见 [`docs/REFERENCE_INDEX.md`](docs/REFERENCE_INDEX.md)。\n\n## 验证与验收\n\n```powershell\n# 全量测试；限制并发以避免 CLI/Crawlee 子进程在 Windows 上资源饥饿\nbun run test\n\n# parser/generator 反过拟合审计\nbun run audit:anti-overfit\n\n# Actor 来源对照\nbun run verify:actor -- \"path/to/source.md\" \"path/to/actor.json\"\n\n# Foundry Lab 单元测试\nbun run test:foundry-lab\n```\n\n测试、JSON 可解析、文件存在和命令退出 0 都只是机械验证。生成结果只有在按照 [`docs/generated-actor-verification.md`](docs/generated-actor-verification.md) 核对身份、数值、动作、豁免、效果、施法、自动化和来源覆盖后，才可以声明正确。\n\n当前 v14 真实验收边界：\n\n- 六个 core Actor 在 Foundry 14.364 / dnd5e 5.3.3 中导入并执行代表性 Activity：通过；\n- 六个 minimal modded Actor 与来源驱动的 MIDI-QOL OverTime：通过；\n- `cor-cotn` 本地副本的角色卡、豁免聊天卡、Journal、Scene 和 Token 抽样流程：通过；\n- 完整生产模组集合无错误共存：失败，仍为 Partial；\n- 来源驱动的 DAE `isDamaged` 已通过 DAE 14.0.12 + MIDI-QOL 14.0.9 的历史实机移除与 core 保留对照；当前生成目标已锁定 MIDI-QOL 14.0.11，但这项旧证据尚未在新版本重新执行。独立 Item v14 已通过导入、AC、两项 Activity、倒地、次数、专注及无文件弹框导出回读。完整生产模组共存仍为 Partial。当前分层结论见 [`docs/acceptance/current-support-matrix.md`](docs/acceptance/current-support-matrix.md)。\n\n## 更多资料\n\n- [`docs/manual.md`](docs/manual.md)：以 v12 为主的旧版详细手册；涉及版本时以本 README 和 `AGENTS.md` 为准，也包含 AI Intake、便携施法者和兼容纯文本命令说明。\n- [`docs/generated-actor-verification.md`](docs/generated-actor-verification.md)：生成 Actor 的强制语义验收清单。\n- [`tools/foundry-ops/README.zh-CN.md`](tools/foundry-ops/README.zh-CN.md)：Foundry 本地测试、离线审计、生产只读盘点的统一入口、权限分类与外部配置说明。\n- [`scripts/foundry-lab/README.md`](scripts/foundry-lab/README.md)：旧 Foundry Lab 命令的兼容说明和详细操作手册。\n- [`docs/acceptance/foundry-v14-module-compatibility.md`](docs/acceptance/foundry-v14-module-compatibility.md)：模组矩阵、已知冲突和生产世界抽样证据。\n","docs/REFERENCE_INDEX.md":"# Versioned Reference Cache\n\nLarge upstream source trees, generated indexes, API mirrors, fonts, icons, and tokens are local verification inputs. They are not runtime dependencies and are not stored in Git.\n\n## Tracked evidence\n\n- `references/reference-cache-manifest.json` pins each automatically acquired component to an immutable revision and records its license.\n- `references/dnd5e-5.3.3/system.json` records fixed-line published metadata.\n- `references/dnd5e-6-current/system.json` records the current acquired stable 6.x metadata; the `dnd5e-current-6` manifest revision/target follows reviewed official releases, not a permanent minor-version cap. Installation/runtime acceptance is separate; see [version-following workflow](runbooks/dnd5e-version-following.md).\n- `references/dnd5e-5.3.3/release-5.3.3.html` and `release-5.3.0.html` preserve the small release-note evidence used by the v14 work.\n- `references/foundry-v14-api-notes/` preserves the small official Foundry release-note snapshots and their acceptance hashes.\n- Generated v14 Item JSON uses the small locked templates under `references/item-templates/dnd5e-5.3.3`; it does not read the full upstream source tree.\n\n## Historical creature-authoring research\n\n- [2026-09-22 creature, villain and Item authoring research](reviews/2026-09-22-creature-item-authoring-opportunities.md) retains fixed external sources, capability limits and license distinctions. Actor blueprints and readable previews are already implemented; Item recipes and broader villain/lair ideas remain research proposals.\n- [2026-09-24 D&D 2024 statblock presentation sources](reviews/2026-09-24-dnd2024-statblock-preview-reference.md) retains official SRD/conversion-guide references, field order and the rule against inventing missing values. The renderer is already in the unified Forge workbench; visual style is separate from rules and runtime acceptance.\n\nBoth records distinguish their original dated snapshots from the implementation status reviewed on 2026-10-08. Archiving them does not introduce commands, dependencies, installs or new development commitments.\n\n## Local layout\n\nThe ignored cache root defaults to `.local/references/`. Set\n`FVTT_REFERENCE_CACHE_ROOT` to move this rebuildable/reference-only tree to a\ndedicated directory without moving the Foundry Lab or tracked provenance.\n\n| Path | Purpose |\n| --- | --- |\n| `.local/references/dnd5e/5.3.3/repo` | Fixed 5.x source checkout pinned by the manifest |\n| `.local/references/dnd5e/6.0.5/repo` | Current acquired stable 6.x source checkout; advance manifest revision/target on the next reviewed release |\n| `.local/references/foundry/14.361/api-core` | Curated Foundry v14 API pages retained for local review |\n| `.local/references/foundry/14.361/api-core-text` | Text extracts retained from the previous local snapshot |\n| `.local/references/indexes` | Rebuildable file and token indexes |\n| `.local/references/generated-text` | Rebuildable API text extracts |\n| `references/foundry-v12-api*` | Legacy local-only v12 API mirror compatibility paths |\n\nThe small dnd5e 4.3.9 locks/templates remain tracked. The older v12 Foundry API\nHTML/text mirrors remain available in the existing local\n`references/foundry-v12-api*` compatibility paths, but those large upstream\ncopies are ignored and are no longer repository content. Removing or rebuilding\nlocal reference inputs must not change v12 or v13 output.\n\n## Commands\n\n```powershell\n# Show the immutable acquisition plan without writing files\nbun run references bootstrap --dry-run\n\n# First acquisition only: all targets must be absent. Existing-cache updates follow the runbook.\nbun run references bootstrap\n\n# Offline validation; never modifies the cache\nbun run references verify\n\n# Rebuild generated indexes under .local/references\nbun run src/tools/referenceIndex.ts\n```\n\nPowerShell example for an external cache:\n\n```powershell\n$env:FVTT_REFERENCE_CACHE_ROOT = 'J:\\fvtt-reference-cache'\nbun run references verify\nbun run src/tools/referenceIndex.ts\n```\n\nThe manifest continues to use the legacy `.local/references/...` logical path\nas a portable tracked identifier. The tools map that prefix under the configured\ncache root, reject absolute or escaping manifest targets, and keep dry-run\nbootstrap read-only.\n\nThe current bootstrap implementation moves an existing target aside before replacement. It must not be used to refresh an existing shared cache under this project’s no-backup rule. First acquisition into absent targets remains distinct. For an existing source repository, fetch the fixed official tag and add a new versioned checkout using its Git objects; preserve the old checkout HEAD. See the version-following workflow above.\n\n`references verify` reports four distinct states: `ok`, `missing`, `mismatch`, and `git-error`. `mismatch` is used only when Git successfully reads `HEAD` and the revision differs. Missing Git, unsafe-directory/ownership failures, access errors, and other unreadable-checkout failures are reported as `git-error` with the Git command, exit status, and diagnostic text; they never masquerade as a revision mismatch.\n\n## Locked v14 evidence\n\n- Foundry generated metadata: `14.364`\n- Foundry runtime acceptance: `14.364`\n- dnd5e: `5.3.3`, revision `965ad2d0cf5d063dac675ba078b5bd3c3c0dd449`\n- MIDI-QOL: `14.0.11`（当前锁定；`14.0.9` 的旧验收记录保留为历史证据）\n- DAE: `14.0.12`\n- Foundry release `14.361` snapshot SHA-256: `580F327078CAFBD6A767405ABD8AA6E9057F2E431BAD50219F60B93A6B5114CC`\n\nFull production-module coexistence is not accepted. These references support schema and narrow runtime verification only.\n","docs/acceptance/2026-09-09-crystalbleed-v12-runtime.md":"# 晶血龙兽 V12：来源、导入与战斗验收\n\n日期：2026-09-09。范围：用户指定的远程 Foundry **12.331 / dnd5e 4.3.9** 世界，仅创建本任务的新角色目录、两个正式生物、测试靶、测试场景、测试战斗与配套宏。地址、凭据和未脱敏日志不写入本报告。\n\n## 来源与正式生成\n\n- 来源核对：[当前面板及用户裁定](2026-09-09-crystalbleed-v12-source-audit.md)。最终输入为 `crystalbleed-drakon-v12-rework.md` 与 `moonstone-salvo-crystal-v12.md`。\n- 两个 Actor 均通过 `src/index.ts --fvtt-version 12 --effect-profile modded-v12 --icon-mode off` 正式生成。没有手写或修补输出 Actor JSON。\n- 生成器保留明确的 GM 辅助和外部腐化规则标记；它们的执行由配套宏和下述手工边界承担。\n- 最后目检发现语言枚举“地底通用语”未被 V12 显示，来源改为标准键 `undercommon` 后正式重生成、原生重导入。三种语言均已读回并在 UI 显示；其他战斗字段不变，最终 40→20 守护计算及 2d8/dazed 重新读回通过。\n\n## 静态检查\n\n- 264 项既有生成回归测试通过。\n- 48 项源数据、结构化动作、解析和宏针对性测试通过；随后对最终源与扩展后的宏再次执行，10 项通过。\n- `typecheck:packages`、`typecheck:tools` 通过。\n- `architecture:verify`、`agents:check`、最后的五源 anti-overfit 和 `git diff --check` 通过。\n- 两份 `verify:actor` 的 `warnings` 与 `sourceIntegrityErrors` 均为空；最后语言修订另作明确字段断言。\n- 对比了每个能力的名字、描述、攻击/伤害、DC、激活类型、传奇消耗、使用次数、效果引用与生命周期；独立复核曾拦截“把条件力竭误挂到晶体首次 DEX 豁免”的错误，已改为独立 CHA 活动与显式关系，并添加回归检查。\n- 通用修复：V12/V13 保存成功半伤字段、结构化充能阈值和消耗、明确内嵌效果的期限、避免把范围内救援距离当成 AoE 射程、显式 `tokenImg` 来源字段。\n\n## 目标世界实测\n\n实测使用正式生成的 Actor 以及新建的确定成功/失败测试靶，普通攻击由原生面板启动工作流。测试推进仅操作新建战斗并使用 `advanceTime: 0`；整个验证前后世界时间保持 **1548874099**。\n\n| 检查 | 结果 | 实际证据 |\n|---|---|---|\n| 原生导入与读回 | PASS | 龙兽 HP 176、AC 19、15 个能力；晶体 HP 15、AC 17、3 个能力、全部速度 0；两张图像 HTTP 200 |\n| 啃咬 | PASS | 原生命中 `1d20+6+5`；实际伤害 `3d10+6` 穿刺及 `2d8` 心灵 |\n| 爪击 | PASS | 原生命中 `1d20+6+5`；实际伤害 `3d8+6` 挥砍及 `1d8` 心灵 |\n| 尾击 | PASS | 原生命中 `1d20+6+5`；实际伤害 `4d6+6` 钝击及 `1d6` 心灵 |\n| 完整守护阈值 | PASS | 输入 20/21/40，实际 HP 损失 20/10/20；12 穿刺＋14 心灵合计 26，实际损失 13 |\n| 临时生命与守护顺序 | PASS | 10 临时 HP、30 来袭伤害：先变 15，再扣临时 HP 10，实际 HP 损失 5 |\n| 原怪隔离 | PASS | 无本次行为标记的旧龙兽计算 40 仍为 40；原 Actor 与原 Token 的 `toObject()` 前后逐字节一致 |\n| 拒绝与恢复 | PASS | 使用拒绝后 40 伤害实际损失 40；下回合开始恢复后损失 20；AC 始终 19 |\n| 耗尽后的削弱守护 | PASS | 两次用尽并恢复后，20/21/40 实际损失 20/16/35；碎裂期间依然没有减伤 |\n| 齐射失败 | PASS | 实际投出 2d8=9，目标扣 9 HP，施加 dazed；旁边生成晶体，原生先攻 5.1；生成瞬间无戳刺 |\n| 齐射成功与原生按钮 | PASS | 从原生怪物面板点击齐射，成功靶只受半伤（1000→998），无恍惚，仍生成晶体并掷出先攻 13.1 |\n| 半血追加腐化 | PASS | 龙兽 HP 88/176，齐射失败造成 10 心灵伤害；追加 CHA18 失败后首次只加腐化、力竭仍 0；生成晶体，先攻 19.1 |\n| 资源不足保护 | PASS | 传奇动作 0 时拒绝再次齐射，Token 总数保持 8，无额外召唤 |\n| 晶体回合/范围/敌友 | PASS | 十尺内友方与敌方失败靶均受 2d6 穿刺并触发腐化；十尺边界成功靶与范围外靶均无伤害；DEX 成功目标不进行 CHA 豁免 |\n| 首次与重复腐化 | PASS | 首次仅标记、力竭 0；下一次腐化失败后实际力竭为 1；进一步失败为 2，不同目标独立 |\n| 恍惚期限 | PASS | 目标下一个回合开始仍恍惚，在该回合结束停用来源效果；DAE 自动生成的 Dazed 状态也移除，没有残留麻痹或震慑 |\n| 不移动/不重复/被摧毁 | PASS | 尝试将晶体 x 从 1000 改为 1100，被拒绝且仍为 1000；同回合再次调用返回 already-pulsed；HP 0 后下一回合无新增戳刺 |\n| 被晶体攻击的龙兽先用拒绝 | PASS | 新龙兽测试性 DEX 修正强制失败（总数 -88）；后果前出现 GM 选择。选择拒绝后保存为成功，HP 仍176、没有腐化/力竭，消费最后一次拒绝并先碎裂守护。测试修正已恢复 |\n| 吐息伤害与恐慌 | PASS | 实际 6d10=27 力场，失败靶损失27、成功靶损失13；仅失败靶恐慌，效果60秒；未充能再次使用被拒绝 |\n| 吐息重复豁免 | PASS | 测试性成功修正后，回合结束 WIS 豁免111成功，恐慌来源及附属状态完整解除，腐化/力竭仍保留；修正已恢复 |\n| 吐息充能 | PASS | 低于5的真实 d6 结果均未恢复；实际掷出5后 spent由1回到0 |\n| 状态免疫 | PASS | 最终宏对恐慌免疫的失败靶仍结算全伤，但 fearApplied=false；非免疫失败靶正常恐慌；测试免疫已恢复 |\n\n宏实测中发现并修复了 V12 全局类不在 window 上、无变化 update 返回 undefined 及并发守护显示同步问题。最终宏为 **1.0.4**。最后补充采用文档坐标计算距离、尊重状态免疫；原地图的墙体判断只用于可见性/相邻落点，不把晶体“所有十尺内生物”额外缩窄为敌方或可见目标。\n\n## 最终状态与边界\n\n- 最终目录：**晶血龙兽·重制验收 0909-1932**。最终主 Actor 为 HP 176/176、传奇动作4/4、拒绝2/2、吐息已充能。原地图旧 Token 不替换。\n- 新建测试战斗已设回未开始（round 0）；已返回原场景，并打开最终世界 Actor 的面板。\n- 原怪及原指示物源数据前后完全相同；`autoCheckSaves`/`autoApplyDamage` 仍为 `none`，`allowUseMacro` 仍为 false；没有改世界全局自动化配置、重启或升级。\n- 宏需由一个 GM 客户端启动，刷新后重启，并查看战斗所在场景。单独 JSON 不承担全部自动化。\n- 吐息锥形朝向、多重攻击目标分配、尾击分支/推离路径、血液支配的反应攻击、掠流滑翔移动与盟友拔刺救援仍由 GM 按保留的规则操作；不宣称这些决策全部自动完成。\n- 多客户端、其他版本/模块组合、跨场景同时自动战斗与长时会话：**NOT_EXECUTED**。\n- 本次未提交、合并或推送代码。没有把静态通过或工具调用成功当作战斗通过。\n- 独立复核使用一个 `sol_reviewer`，请求角色为 Sol High；宿主未提供独立可观测的实际模型/推理元数据，记为 `OBSERVED_METADATA_UNAVAILABLE`，不声明硬隔离。父代理承担最终来源对照与实机语义验收。\n- 最终独立复核结论：**PASS**。复核覆盖最终代码、两份来源、README、运行报告、四项文件哈希与原生 trim 后的宏命令哈希；未执行范围仍按上文保留。\n\n## 最终交付哈希\n\n| 文件 | SHA-256 |\n|---|---|\n| dragon.json | `8500d82153fa0e977c1b5da472043983cc656d859a5e02c3d57270cf0453d563` |\n| crystal.json | `e294983f58578372dbf5ffdc9cfc8be0829e28cb4c7ca1285796ad322ad912f9` |\n| battle-control.js | `7723c8c6b1998d99629ff77c04a10d957ffdb2f4895e005f4962b75540b0019c` |\n| battle-control.macro.json | `96fa9dab3af901d07775d82aa39835493234fe17dc78134a8d5b5c65e8fe9d51` |\n\nFoundry Macro 的字符串字段去掉末尾换行后，目标世界读回命令的 SHA-256 为 `85ce42bc0e363f6e6f8665fc5948006bad02735447c533b2b1c8c0479cd61bf3`。本地按相同原生 trim 规则计算后一致。\n","docs/acceptance/2026-09-09-crystalbleed-v12-source-audit.md":"# 晶血龙兽：现有面板核对记录\n\n本文件是来源摘录与差异记录，不是正式生成输入或已验收结果。\n\n读取时间：2026-09-09。实际目标：Foundry 12.331 / dnd5e 4.3.9。来源为用户当时打开的场景指示物 Actor，而非本仓库旧版同名 Markdown。\n\n## 基础属性（现用）\n\n巨型龙类生物，通常中立邪恶；AC 19；HP 176/176；生命骰公式 14d12 + 42（公式与固定上限不等同，固定上限保留为用户现用数值）。力量 23，敏捷 14，体质 20，智力 16，感知 19，魅力 18。CR 13，熟练加值 +5；先攻 +12（敏捷 +2，额外 2×熟练加值）。\n\n速度：步行 40、飞行 80、掘穴 30、游泳 40 尺。豁免：敏捷 +7、体质 +10、感知 +9、魅力 +9。技能：察觉 +9、游说 +9、隐匿 +7。感官：黑暗视觉 150、盲视 60 尺，被动察觉 19。语言：通用语、龙语、地底通用语。状态免疫：魅惑、恐慌、中毒、震慑、变形。无已配置伤害抗性、免疫或易伤。传奇动作 4/4。\n\n## 原始能力文字与现用数据\n\n1. 两栖：可以在空气和水中呼吸。\n2. 绯晶拒绝（2/日）：若豁免失败，可以改为成功；代价是月蚀守护碎裂，直到龙兽下一回合开始失去守护。当此特性无法使用时，守护削弱；超过 20 点的伤害不再减半，只减少熟练加值。现存活动聊天文字仍是旧版“直到下一回合结束 AC 15、失去心灵抗性”，并残留 AC 15 效果，需修复。\n3. 绯晶腐化：原文字 DC 16 魅力；现用活动固定 DC 20。失败受到绯晶腐化；已经腐化者改为获得 1 级力竭。无实际腐化效果。\n4. 尾击推退：尾击命中后选择推退，力量豁免失败被推开 10 尺。原文字 DC 16；现用按力量计算为 DC 19。\n5. 多重攻击：一次啃咬、两次爪击。\n6. 啃咬：原文字 +9 命中，触及 10 尺，2d10+4 穿刺+1d6 心灵；现用 +11，3d10+6 穿刺+2d8 心灵。\n7. 爪击：原文字 +9 命中，触及 5 尺，2d6+4 挥砍；现用 +11，3d8+6 挥砍+1d8 心灵。\n8. 尾击：原文字 +9 命中，触及 15 尺，1d8+4 钝击；现用 +11，4d6+6 钝击+1d6 心灵。文字称命中生物后可选择尾击推退或尾击扫倒，但当前 Actor 没有尾击扫倒 Item。\n9. 噩梦吐息（充能 5–6）：60 尺锥形；原文字 DC 16 感知、4d10 心灵，现用 DC 18 感知、6d10 力场。失败恐慌 1 分钟，成功半伤且不恐慌；每回合结束重复豁免，成功解除；5 尺内盟友可用动作通过 DC 15 运动或医药检定拔除绯晶刺、结束恐慌。现有效果为 dazed，未设持续时间，活动错误混入救援的 5 尺射程。\n10. 传奇尾击（1 动作）：发动一次尾击；现用是无攻击的 Utility。\n11. 血液支配（1 动作）：30 尺内可见生物进行感知豁免；原文字 DC 16，现用 DC 18。满血者本次豁免具有优势；失败必须使用反应，对龙兽选择的触及内另一生物发动一次近战武器攻击。没有合法目标或不能使用反应则无效。\n12. 晶片齐射（2 动作）：30 尺内可见生物进行体质豁免；原文字 DC 16、4d6 心灵，现用 DC 18、4d8 心灵。文字写失败震慑至下回合结束；现有效果却为 paralyzed，未设持续时间。现用成功半伤，文字未明确成功伤害。龙兽不高于半血时，失败目标额外进行一次绯晶腐化豁免。\n13. 掠流滑翔（1 动作）：移动至多速度一半，不引发借机攻击。\n14. 月蚀守护（血魔法）：绯晶如水流环绕龙兽。每当龙兽原本将一次性受到超过 20 点伤害时，本次伤害减半。没有 Activity 或 Active Effect。\n\n## 首轮用户要求（后续裁定见下）\n\n- 晶片齐射伤害改为 2d6。\n- 齐射后在目标生物旁生成一个晶体，立即加入先攻。\n- 晶体为不能移动的构装体，HP 15，AC 按用户允许范围取 17。\n- 晶体在自己的先攻回合，对周围 10 尺内所有生物发动戳刺；敏捷豁免失败受到 2d6 穿刺伤害，并附加月石腐化。腐化 DC 参照晶血龙兽。\n\n## 首轮待裁定项（已由后续裁定取代）\n\n- 冲突的数值采用现用活动还是旧描述；已向用户呈现选项。\n- 齐射是否保留震慑与半血追加腐化；已向用户呈现选项。\n- 状态名称冲突、尾击扫倒缺失、晶体敏捷豁免 DC 与腐化是否另掷魅力豁免，需要在最终文字定稿中明确。\n\n## 后续用户裁定与最终解释（优先于上述历史记录）\n\n用户确认现用面板数据优先，啃咬保留 +11、3d10+6 穿刺+2d8 心灵；其他攻击亦保持现用数值。腐化与噩梦吐息 DC 均改为成年绿龙吐息的 DC 18（已查锁定 dnd5e 4.3.9 官方数据）；分别保持魅力与感知豁免。\n\n用户将晶片齐射改为使用 d8，结合先前减至两颗骰的要求，最终为 2d8 心灵；DC 18 体质，失败为恍惚（dazed），不是麻痹或震慑。保留半血追加腐化和新增晶体。绯晶拒绝采用当前技能文字：守护碎裂至龙兽下一回合开始；次数耗尽后恢复为超过 20 点减熟练加值，不再减半；不降 AC。\n\n晶体采用允许范围内 AC 17、HP 15，构装体、不可移动；自己的回合十尺戳刺不区分敌友，DEX 18 失败 2d6 穿刺，继而执行独立 CHA 18 腐化豁免。首次腐化只标记；已有腐化且再次腐化豁免失败才加一级力竭，不直接附加到敏捷豁免失败。尾击扫倒根据现用尾击描述里的明确引用补齐，DC 与推退一致为 19。\n\n## 验收状态\n\n来源读取 PASS；正式 CLI 生成 PASS（含明确的 GM 辅助/外部规则状态）；测试文件夹导入 PASS；伤害减免、召唤、先攻、范围戳刺及腐化均完成目标世界实测。具体证据、仍需 GM 决策的范围与未执行层级见 [运行验收报告](2026-09-09-crystalbleed-v12-runtime.md)。\n\n原面板传记注明原始数据板作者 RAINING_DAYS，来源为 *Made some homebrew Ruidium-corrupted enemies*。旧版“碎裂后 AC 15”的优化说明已由用户新的守护规则取代。本次最终目检还将标准输入的地底通用语映射改为精确枚举键 `undercommon`，原生重导入后显示三种语言。\n","docs/acceptance/current-support-matrix.md":"# Current Support Matrix\n\n**2026-10-25 ServerNext 6.0.6 接续**：八个本地候选已定点安装在原Next Core14.368/dnd5e6.0.6。Babele自有嵌入扩展的狂野魔法25行/困惑术5行、原UUID与重复渲染已接受；House药水经原生模型规范化修复后，Apply/完整schema2快照/三Activity/手改保护/Restore/普通重载已接受；Monitor真实GM短会话的卡顿标记、同ID重载恢复、单次stop、历史保护及测试归档缺席已接受；Guard的25条世界消息/20张页面卡、禁用/再启用重载、帮助及精确偏好恢复已接受，真实缩略图转换、滚动暂停反证与长时范围仍未覆盖；Deck的GM TempHP自然busy/disabled、stale目标消失，以及玩家四个公开GM-only API拒绝和工具栏缺席已接受；Deck状态编辑仅向GM开放，玩 WN和历史PARTIAL保留，不推广全部八精通、玩家/多GM、长时或生产。下方“W1/W2进行中”段落为10月12日较早快照，现状以本段及[执行总账](../plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)的WMP R5/R6记录为准。\n\n**Resolver 0.1.7 / ServerNext 6.0.6 当前限定接受**：唯一批准的 Rat NPC `s2Jz2kyFNyMccElL`（NPCActorSheet、Tidy=false）完成10个严格 owned Spell、10个 managed Cast Activity和10个精确引用；来源、selectedUuid、nativeCachedFor、compendiumSource与manifest关系逐项匹配。一次真实 Misty Step 的正常 “Midi Use” 消耗对话通过，Activity `949dd` 的 spent 0→1，唯一消息 `U4` 的 owned cached Item `Quw` 与原生活动匹配且 roll=0；普通 Undo 回到 pending／0 Spell／0 managed Cast，正常重载后保持。09/10清理与native自删通过；11个原始 fingerprint 数组结构和过滤后的1571条 Setting tuple exact，模块/User业务、8叶flags、Cal/time/pause/Fog仅为审计读回，不等于全库 rawValueEquality；94个含 token 名称行由过滤口径解释，不是当前业务失败。未接受真实传送落点、纯 Core-only 矩阵、全法术库、全部 Activity、玩家、长时或生产。\n\n**2026-10-12 本地重构候选补充（未安装）**：Monitor M1–M3保存/恢复/帮助46项；House药水事务75项；Painter P2场景事务332项；Babele匹配/渲染14项；BloodHunter只读Preview19项通过、1真实来源跳过；Species既有构建/UUID边界5项通过。均为本地源码、合成数据或模拟DOM/事务层，不能扩展下方历史运行接受。Forge仍占用共享Chrome，全部新增路径原生出口延期。精确候选与剩余门见[本轮总账](../plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。\n\n\n**Current as of:** 2026-10-25 (scoped amendments; historical rows retain their stated dates and targets)\n**Canonical role:** this file is the current support summary. Dated reports remain immutable evidence snapshots; later amendments clarify their present interpretation without erasing earlier failures or narrower passes.\n\n**Current v14 module lock:** MIDI-QOL `14.0.11` + DAE `14.0.12`. Rows below that name MIDI-QOL `14.0.9` describe preserved historical runtime evidence; they have not been silently promoted to `14.0.11` acceptance.\n\n**Default selection boundary (verified 2026-09-06):** CLI and workflow callers that omit the version default to v12; the Web form initially selects v14. When a user does not specify a target, Codex explicitly requests Foundry `14.364` / dnd5e `5.3.3` / `core`. These are distinct entry-point defaults and do not retroactively upgrade v14 acceptance.\n\n## Status vocabulary\n\n** ile / `GODDESSFANTASY_COOKIE` environment variable. The CLI credential route remains:\n\n```powershell\nbun run src/tools/crawlSites.ts goddessfantasy-pipeline --cookie-header-env GODDESSFANTASY_COOKIE --mode incremental --content-type monster --effect-profile core --fvtt-version 14\n```\n\nDo not add `--skip-auth-probe`; the authenticated board probe is part of acceptance. Every rerun must review provenance plus representative `records.json` -> plaintext -> CLI Actor semantics and must not reuse the old authorization for a materially different session or board.\n\n### Historical module-snapshot boundary\n\nThe 88-module figure belongs only to the 2026-07-11 production inventory snapshot. The later cleanup record verifies a 79-module local `server-mirror` baseline and separately records selected 2026-07-12 production changes; it does not record a post-cleanup production active count. A future production compatibility audit must begin with a fresh read-only inventory and an explicitly agreed intended set. It must not resurrect the old 88-ID snapshot or require the protected MCDM package unless that fresh inventory and user scope actually include it.\n\n## Claim rule\n\nThe project currently supports the exact-target and bounded FVTT JSON Forge A–E product slice above, source-faithful generation for the bounded corpus, bounded TXT/MD monster AI Intake with strict `needs_review`, and the **Partial** exact-target AI Item Intake described above, v12 by default, explicit v14 generation, the exact Foundry 14.364 / dnd5e 5.3.3 target-world Rat spell-resolver workflow accepted below, core Actor runtime samples, the bounded standalone Shield v14 import/behavior/export workflow, the narrow locked MIDI bleeding workflow, the locked DAE+MIDI `isDamaged` contract, and the bounded 2026-07-16 authenticated GoddessFantasy board-2318 ingestion. It does **not** currently support a blanket claim of full Foundry v14 production compatibility, Forge beyond the exact runtime pairs and bounded scopes stated in the Forge rows, arbitrary Forge provider/model/source correctness, page-closed background execution, multi-Document atomicity, a v12 spell resolver, production resolver deployment, bulk spell migration, the current production module count, OCR/PDF/image Intake, arbitrary Item Intake/runtime behavior, arbitrary authenticated boards/statblock syntax, or arbitrary standalone Item round trips.\n\n## 2026-07-15 M10 Pre-Final Audit\n\n- Mechanical repository gates: production and broad typechecks pass; 738 tests / 2,921 expectations pass; production coverage is 87.54% lines and 88.40% functions; all-source anti-overfit passes with 109 sources; dnd5e 5.3.3 reference verification and Web build pass; Foundry Lab passes 116 tests / 417 expectations; repository hygiene passes across 1,605 tracked paths.\n- Regeneration: v12/core, v14/core, and v14/modded-v14 Damage-Bound Warden Actors, the v14/core Shield, and the unrelated v12 Jewel were regenerated only through `src/index.ts` into ignored output paths.\n- Semantic review: all three Actor verifier runs have zero warnings. Explicit assertions pass for source identity/stats/type/version metadata, native attack damage and reach, exactly scoped frightened/DAE behavior, the complete Shield armor/Activity/prone/reaction/duration/range/recovery projection, and absence of Shield mechanics on the Jewel.\n- At that pre-final checkpoint, the browser upload/download smoke, Shield live behavior, and DAE+MIDI removal were unaccepted alongside authenticated crawl and exact production coexistence. The runtime amendment below supersedes the first three items while preserving the dated audit chronology.\n\n## 2026-07-15 Runtime Resume Amendment\n\n- Chrome file access unblocked Foundry's supported Import Data path. Shield import exposed and drove generalized fixes for portable `_stats.lastModifiedBy` and limited self-Activity consumption; Damage-Bound Warden exposed and drove the generalized `untilDamaged` Activity duration `spec` fix.\n- Semantic runtime acceptance now passes for Shield AC, Forceful Bash attack/damage/prone, Protective Field one-per-dawn depletion/concentration/second-use rejection/runtime readback, and the modded removal versus core retention `isDamaged` control.\n- The complete rerun passes 743 tests / 2,932 expectations, 87.55% line / 88.41% function production coverage, both typechecks, 109-source anti-overfit, 1,605-path hygiene, locked reference verification, Web build, and offline smoke. One first-run token-review timeout passed 2/2 alone and the complete rerun; it remains recorded as scheduling debt rather than hidden.\n- At this dated checkpoint, the only remaining local Item evidence gap was a downloaded UI Export Data artifact and CLI-versus-export semantic comparison; the 2026-07-16 amendment below supersedes that gap. Authenticated crawl and exact protected/full module coexistence remain external boundaries.\n\n## 2026-07-16 No-Dialog Transfer Amendment\n\n- External research confirmed that `DOM.setFileInputFiles: Not allowed` is an extension-mode transport limitation reproduced by Playwright MCP and OpenAI Codex users; Chrome's file-URL permission is not a reliable unattended fix.\n- The existing CLI Shield JSON was imported in the local matrix world through Foundry 14.364's public `importFromJSON()` method. Foundry's public `exportToJSON()` then ran unchanged, while its exact JSON Blob was captured before native download handling.\n- The 9,727-byte export matches the CLI artifact on every source-relevant field. Foundry-only differences are export provenance, timestamps/user/document identity, and schema-default expansion; no source mechanic drift was found.\n- The disposable Item was deleted, temporary page instrumentation was restored, port 30001 was released, `options.json` returned to `cor-cotn`, and production was untouched. PROD-002 and SEM-005 are closed; authenticated crawl and exact protected/full module coexistence remain external boundaries.\n\n## 2026-07-16 Module-Snapshot Correction\n\n- The preceding dated checkpoints incorrectly carried the 2026-07-11 88-ID production snapshot forward as a current intended set after the 2026-07-12 cleanup record had changed the local baseline and recorded later production changes.\n- The accepted local cleanup baseline is 79 enabled modules. That number is not a current production count; this remediation turn performed no fresh production inventory.\n- PROD-005 is closed as a scope/report correction, not a coexistence Pass. The 88-ID failure remains historical evidence, while future production compatibility work requires a fresh read-only inventory and explicit user scope. PROD-003 is the only remaining external Goal boundary.\n\n## 2026-07-16 Authenticated Crawl Amendment\n\n- The user explicitly authorized the existing logged-in Chrome session. The session was used in place: no cookies, password, local storage, or credential header was inspected or exported.\n- Board 2318 produced 54 discovered topics, 37 matched/crawled monster topics, 37 records, and 47 plaintext statblocks with zero crawl/plaintext failures. The first JSON run was mechanically clean but failed semantic review, exposing fractional-CR truncation, `暗蚀` loss, language/taxonomy qualifier loss, replacement-damage overcounting, and simultaneous automation of staged save outcomes.\n- Generalized source/corpus-derived repairs passed 52 focused tests. All 47 Actors were regenerated through the project CLI and passed 47/47 verifier checks. Expanded live projections passed for one fractional CR, 25 qualified-language records, 10 variable-taxonomy records, the Gremishka replacement-damage branch, and the Petrifying Death's Head staged save while preserving literal descriptions.\n- The current aggregate gate passes 804 tests / 3,136 expectations, 85.18% production lines / 87.48% production functions, both typechecks, 117-source anti-overfit, locked dnd5e reference verification, Web build, and offline smoke; repository hygiene passes across 1,673 tracked paths. Foundry Lab separately passes 116 tests / 417 expectations. The Rat Warlock sample was not separately imported into Foundry, so its acceptance remains at the Web/project-generation/verifier layer.\n\n## 2026-07-19 Spell Resolver Qualification\n\nThe 2026-07-17 Rat Warlock AI Intake acceptance remains valid for its reviewed non-spell statblock intake scope. Functional spell resolution is not accepted: `SPELL-001` remains open because the generated Actor has no portable ten-spell resolver manifest, no resolved embedded spell items, and no pending resolver state. This qualification remains in force until the exact local Foundry runtime gate passes; it does not alter the prior intake evidence or claim a production-world migration.\n\n## 2026-07-19 Spell Resolver Closure Amendment\n\nThe preceding qualification is superseded for the exact accepted local target. The current project workflow produces a source-evidenced ten-spell portable manifest with status `pending`, no placeholder Spell, and no destination UUID. In the project-local Foundry `14.364` / dnd5e `5.3.3` disposable world, the resolver hydrated the Rat Warlock to ten native Cast Activities and ten one-to-one cached Spells, exercised attack/save/utility and limited/at-will use, preserved native use after module disable, proved 2024-first plus isolated 2014 fallback behavior, and passed Keep/Overwrite/Cancel, exact rollback/residual, idempotency, and unrelated-Actor checks. The full evidence and limitations are recorded in [Rat Warlock Target-World Spell Resolver Acceptance](./2026-07-18-rat-warlock-spell-resolver.md).\n\n`SPELL-001` is closed only for Foundry `14.364` / dnd5e `5.3.3`. This amendment does not claim a v12 resolver, OCR/PDF intake, production installation, bulk migration, compatibility with later runtime versions, or complete automation of literal source-specific restrictions.\n## ServerNext 6.0.5 本地恢复切片（2026-10-01）\n\n原十个自有模块因 maximum6.0.2而停用，现已从独立候选更新并恢复原94启用ID／版本集合。80个非packs文件逐项SHA核对通过、全部安装packs保持；后续限定修正 Deck 的力竭效果 ID 和 Painter 火焰几何／视频加载。49DLC来源字段和无关ID／场景状态保留，十项正常 GM 重载读回全部通过。\n\n本轮接受代表切片：House 药水手改保护／恢复，Deck 力竭3→4→3，Resolver 自动十法术水合及一次普通UI Undo 后 pending／0缓存，Painter 原两格可见动画火焰／Region／light及重载保持，Babele 可见25／5行中文嵌入与原UUID，Injury 公共状态API与恢复，Monitor 短会话start／mark／stop／历史持久；Blood Hunter／Species 为既有内容身份和合集读取，Chat Guard 为公开诊断统计。它不提升为所有玩法／所有模块组合通过；天然19、完整Cast矩阵、长测和生产未执行。精确清理已通过，原90 Macro、两条 Monitor 历史及设置／视图状态恢复。额外获准 Midi local.10 的三文件与四语言文件限定安装、packs保持、正常Check／Save各+4及其精确清理通过；当前94启用ID相同，唯一版本变化为Midi local.9→local.10。详见[本轮限定接受记录](../reviews/2026-10-01-next-605-custom-module-restoration.md)和[Midi请求修复接受](../reviews/2026-10-01-next-605-midi-request-bonus-gap.md)。\n\n5.x固定5.3.3与6.x稳定跟随的长期方向见[版本流程](../runbooks/dnd5e-version-following.md)。这不扩大既有生成器Actor／Item默认或6.x通用接受，也不改写旧14.364/5.3.3及14.368/6.0.2证据。\n\n## 伤势所有权迁移候选（2026-10-02）\n\nCustom Conditions 0.2.0 候选拥有 0–3 层伤势、HP／休息与死亡豁免 19／20；Trigger Engine 0.2.0 提供事件，消逝灵魂 1.1.0 保留独立复活。新伤势版本门为 14.364／5.3.3 和 14.368／6.0.5；十九种通用状态、生成器的 ConditionId 和武器专精支持边界不扩大。\n\n当前状态为 **Mirror 14.364／5.3.3 本轮代表行为与恢复PASS；Next OUT_OF_SCOPE**。旧IFS原件、未知字段和复活历史保留，新IFS只写fadingSpirits；没有CC也能独立复活并开始下一死亡episode。实际接受涵盖迁移、HP／原生休息／控制输入19–20、HUD／重载、DAE清除与外部内容保留、独立及联合仪式、原贡献按钮、玩家blind可见性、authenticated sender验权及双GM唯一结算。原十Actor／三flags／两投影、原用户／模块／设置及本轮Foundry对象清理经重载读回。正常Core审计字段未伪造为旧值；旧CU空白窗口单独NOT_CLEANED。前一节Next公共状态API PASS仍仅属于旧所有者，6.0.5不因本轮Mirror结果升级为接受。完整复活分支、并发压力、生产和长时未宣称通过。详见[计划](../plans/2026-10-02-injury-condition-ownership.md)及[实际整合证据](../reviews/2026-10-02-injury-condition-integration.md)。\n\n首批WMP依赖适配精确加入CC／TE0.2.0，继续拒绝0.2.1或不完整API，WMP自身仍只支持14.364／5.3.3。旧WMP原件与本次依赖组合接受分开，最终组合门禁和该接通实机检查按整合记录闭合。\n\n## ServerNext 四模块限定接通补记（2026-10-05）\n\n本条更新上节在 2026-10-02 时的 `Next OUT_OF_SCOPE` 和 WMP 仅支持 5.3.3 的**候选状态**，不改写该日实际结果。精确本地 ServerNext Foundry 14.368／dnd5e 6.0.5／`cor-cotn` 中，TE 0.2.0 的事件／活动 GM 限定链、CC 0.2.0 的伤势与十九状态选定生命周期／骰式／回合／移动／动作／HUD，以及 IFS 1.1.0 的基础与快速复活联动已获限定行为接受。WMP 候选实际 ready、原生 Slow 强弱接替与 Fatal 骰式通过；公开 `WMP.use` 的单次原生攻击与 Midi 同卡攻击／伤害得到证实，随后从原卡明确应用伤害使 HP 2→0，并写入 CC 原生 Slow；另一真实攻击在掷骰前取消，未留下攻击消息／预留。r80 连续流程的超时失败仍保留，HP 应用是恢复夹具后的新步骤，不宣称原连续案例通过。旧 r56 精确速度仍 UNKNOWN，r74 配置 hook 未直接捕获。\n\n`bun run ci:verify` 于 2026-10-05 11:14 上海时间 exit 0，现有局部检查、限定安装字节核对及各案例恢复回读另有原件。r85–r90 已盘点并删除精确 2 Actor／1 Scene／1 Combat 及已完成 Midi 工作流；新增 RoundEnd 消息有正常来源，当前 GM 的 Calendaria HUD 位置曾保存一次。**r86 原始全量摘要 FAIL 仍保留**，旧 HUD 坐标及一条孤立旧设置历史 UNKNOWN。文档等价包现已安装：WMP build `32515e4a042d44fc174c270b862f7f341774e9fc27532b66d304e1a9c00385f2`、脚本 `19f42f7d05ac18e2c945c878cc6ef251d92cfb4334a61d60a156da2d32bef62f`，47 文件匹配；r92 同一 Next 的 ready／依赖能力／107 注册／99 启用，以及 589 Actor 归一化来源、10 外来 Combat、64 外来 Scene 客户端 hash、旧聊天／Macro、1667 条逐项 id／key／user／raw hash、时间和视图回读通过。第 65 个外来 Scene 的当前客户端 hash 经 r95 证实受 10 个原生效果变更 ID 构造随机化影响，当前 raw server 来源只读两次相同且无 Scene 写入；旧完整 Scene 来源未捕获，不能宣称其历史全部字节原样。**本次限定本地迁移、清理、包实装和读回已闭合，按用户要求停止**；这不扩大为十九状态全部动作、八种精通完整新矩阵、其他复活仪式、多 GM、长时运行、Mirror 或生产接受，也不改变生成器默认目标。现况、失败边界与证据链接见[四模块当前进度](../reviews/2026-10-05-next-four-modules-progress.md)。\n","docs/document-input-workflow.md":"# 图片 / PDF 文档输入\n\n文档输入只承诺 NPC/怪物 Actor，流程固定为：\n\n```text\n图片/PDF → 本地提取 → 候选筛选 → 原始 Markdown → 候选翻译 → AI Intake → 现有生成器 → Actor JSON\n```\n\n## CLI\n\n```text\nbun run src/index.ts \u003cfile.pdf|file.png> --extract-only\nbun run src/index.ts \u003cfile.pdf|file.png> --document-candidate \u003ccandidate-id>\nbun run src/index.ts --document-doctor\n```\n\n支持的参数：\n\n- `--document-engine auto|native|paddleocr`\n- `--document-language auto|en|zh-CN|mixed`\n- `--document-candidate \u003cid>`（可重复）\n- `--extract-only`\n- `--document-target-language \u003clanguage>`（默认 `zh-CN`）\n\n每次运行会在 `.local/document-runs/\u003crun-id>/` 生成 `raw-extracted.md`、`document-candidates.json`、`extraction-report.json`。原始 PDF/图片不会复制进 Vault manifest。\n\n## 本地 OCR\n\n普通 PDF 优先使用 PDF 内嵌文字和坐标；没有可靠文字层的页面会用 `pdfplumber` 的本地 PDFium 渲染后交给 PaddleOCR。图片直接走 PaddleOCR。Tesseract 只作为英文标点和专名提示，不替代主 OCR。\n\n先运行 `bun run document:doctor`。如果需要创建隔离环境，可在项目根目录使用 Python 3.12：\n\n```text\nuv venv .local/document-ocr --python 3.12\nuv pip install --python .local/document-ocr/Scripts/python.exe pdfplumber paddleocr==3.7.0 paddlepaddle==3.2.0\n```\n\n不同机器的 Paddle/PaddleOCR 组合可能不同；以 `document:doctor` 和一次真实图片 smoke 为准。OCR 缺失时流程会给出错误，不会静默把乱码送进生成器。\n\n## 翻译和 Intake 边界\n\n过滤发生在翻译之前，只有被选中的高置信度候选会进入 Markdown 翻译。翻译服务缺失、结果为空或机械字段占位符丢失时，候选会停在 `needs_review`，不会生成正式 JSON。\n\nOCR Markdown 不是项目的结构化 YAML/Markdown 契约。正式生成默认需要现有 AI Monster Intake 配置；没有 Intake 配置时，文档链路会 fail closed。普通 `.md`、`.markdown` 和 `.txt` 仍走原来的入口，不受影响。\n\nWeb 入口使用二进制 `multipart/form-data` 上传，检查文件大小、MIME 和文件签名，并在任务沙箱中保存输入；提取完成后在任务摘要和报告中提供页数。任务完成后可下载候选清单、报告、原始/翻译 Markdown、标准 Markdown 和 Actor JSON；上传模式不会修改 Vault manifest。\n","docs/examples/召唤生物-人类写法模板.md":"# 【遭遇或生物组合名称】\n\n> 人类填写用的原始资料模板。把【】替换为你的内容；没有的能力写“无”。下面是普通 Markdown 规则文字，不需要填写程序字段。\n> 本模板对应 Forge 0.3.0 候选的“从人类写法MD生成战斗包”入口。生成仍需通过来源与自动化审核；填写模板不等于保证自动通过。当前真实验收状态以该候选的验收记录为准。\n\n## 这份资料包含什么\n\n这份资料包含两种独立生物：**【主生物名称】**和**【被召唤生物名称】**。\n\n【主生物名称】使用“【召唤能力名称】”时，会召唤【数量】只【被召唤生物名称】。两种生物分别有自己的数据卡；召唤能力属于主生物。被召唤生物的完整数据写在后面。\n\n我希望角色目录中生成两个生物条目。实际使用召唤能力时，从被召唤生物的条目在场景中放置对应数量的指示物；每只召唤物单独记录生命值和状态。召唤多只同种生物时，不要在角色目录中反复创建同一种生物。\n\n## 生物一：【主生物名称】\n\n【体型】【生物类型】，阵营【阵营】。\n\n- 护甲等级：【数值及护甲来源】。\n- 生命值：【固定上限】。生命骰：【公式；不使用则写无】。若两者不一致，以【固定上限或生命骰结果】为准。\n- 速度：【步行、飞行、游泳、攀爬、掘穴速度；写明单位】。\n- 力量【】、敏捷【】、体质【】、智力【】、感知【】、魅力【】。\n- 豁免：【豁免属性和总加值；没有则写无额外熟练】。\n- 技能：【技能名称和总加值】。\n- 伤害抗性：【】。伤害免疫：【】。伤害易伤：【】。\n- 状态免疫：【】。\n- 感官：【感官、距离和被动察觉】。\n- 语言：【】。\n- 挑战等级：【】。熟练加值：【】。\n- 先攻：【总加值；或写仅使用敏捷调整值】。\n\n### 特性\n\n**【特性名称】。**【完整规则。写清触发条件、受影响对象、效果和结束条件。没有则写无。】\n\n### 动作\n\n**【攻击名称】。**【近战或远程】攻击，命中加值【】，触及或射程【】，目标【】。命中后受到【伤害骰及类型】。附加效果：【无，或完整写出豁免属性、DC、成功与失败的不同结果】。\n\n**【其他动作名称】。**【次数或充能、消耗、目标、范围和完整效果。没有则写无。】\n\n### 召唤能力：【召唤能力名称】\n\n【主生物名称】以【一个动作／一个附赠动作／消耗几个传奇动作／满足条件时触发】使用此能力，每【日／短休／长休】可以使用【次数】次，或以【充能规则】恢复。\n\n使用时，【是否先进行攻击、豁免或其他结算；没有则写直接召唤】。在【何时：宣告后、命中后、豁免结算后等】召唤【数量】只**【被召唤生物名称】**，使用下方的完整数据。\n\n- **位置：** 出现在【距离谁多少尺】的【可见／无需可见】未占据空间。由【GM手选／自动选择满足条件的最近空位】放置，必须容纳其完整体型。\n- **成功与失败：** 【召唤是否依赖前置攻击命中或豁免失败？成功时也召唤吗？没有前置检定则写无检定。】\n- **没有空位时：** 【整次能力取消且不消耗资源／其他明确处理方式】。如有前置伤害，写清是在伤害结算前检查，还是伤害仍然发生但召唤失败。\n- **归属与控制：** 对【谁】友好，对【谁】敌对；由【GM／指定玩家】控制。指挥是否需要额外动作：【】。\n- **先攻：** 【独立掷先攻／沿用召唤者先攻／紧接召唤者之后行动】。战斗中加入【哪一场战斗】；非战斗中使用时【不创建战斗／由GM决定】。\n- **首次行动：** 【生成时立即行动／不立即行动】。如果加入战斗时它的行动时点已经过去，【本轮如何处理】。\n- **持续时间：** 【永久存在直到被摧毁／若干轮／若干分钟】。在【具体时点】结束。\n- **专注：** 【是否需要；如需要，何时因专注结束而消失】。\n- **数量上限：** 每个召唤者最多同时维持【数量】只。再次召唤超过上限时【不能使用且不消耗／替换旧召唤物／其他规则】。\n- **死亡与消失：** 召唤物生命值归零时【处理方式】；召唤者死亡或失去意识时【处理方式】。说明是否移除场景指示物和对应战斗成员。\n- **其他关联：** 【召唤物是否继承召唤者能力、共用资源或具有其他关联；没有则写无】。\n\n### 附赠动作、反应与传奇动作\n\n【逐项写出；没有则写无。若有传奇动作，写清每轮次数、恢复时点和各选项消耗。】\n\n## 生物二：【被召唤生物名称】\n\n【体型】【生物类型】，阵营【阵营】。\n\n数据来源：【本节完整定义的自制生物／明确版本的官方生物资料】。如果使用官方红龙，写清是雏龙、青年龙、成年龙还是远古龙，并提供实际使用的数据或可核对的来源；不要只写“红龙”。\n\n- 护甲等级：【】。\n- 生命值：【固定上限】。生命骰：【公式或无】。采用【固定上限或掷骰】。\n- 速度：【所有移动方式及单位；不能移动则明确写出】。\n- 力量【】、敏捷【】、体质【】、智力【】、感知【】、魅力【】。\n- 豁免：【】。技能：【】。\n- 伤害抗性：【】。伤害免疫：【】。伤害易伤：【】。状态免疫：【】。\n- 感官：【】。语言：【】。\n- 挑战等级：【】。熟练加值：【】。先攻：【】。\n\n### 特性\n\n**【特性名称】。**【完整规则。】\n\n### 动作\n\n**【动作名称】。**【消耗、攻击加值或豁免DC、目标、射程或区域、伤害骰、伤害类型、成功与失败结果。】\n\n### 自动触发的能力\n\n**【能力名称】。** 在【自己的回合开始／自己的回合结束／其他明确时点】，对【范围内哪些生物，是否包含盟友和召唤者】生效。每【回合或轮】最多【次数】次；目标进行【属性】豁免，DC【】，失败【】，成功【】。刚被召唤时【是否额外触发】；生命值归零后【是否停止】。\n\n【没有自动触发能力则写无。】\n\n### 附赠动作、反应与传奇动作\n\n【逐项写出；没有则写无。】\n\n## 我希望自动完成与由GM决定的部分\n\n自动完成：【例如消耗次数、放置召唤物、绑定召唤者、加入战斗、掷先攻、到期移除】。\n\n由GM决定：【例如选择目标、选择召唤位置、决定红龙本回合攻击谁】。\n\n资料没有写明而又影响规则的内容，请列出缺项，不要自行补成已经确认的规则。\n","docs/examples/晶血龙兽与月石晶体-人类写法.md":"# 晶血龙兽与月石晶体\n\n## 这份资料包含什么\n\n这份资料包含两种独立生物：**晶血龙兽（Crystalbleed Drakon）**和**月石晶体（Moonstone Crystal）**。\n\n晶血龙兽拥有“晶片齐射（Shard Salvo）”传奇动作。无论目标在这次动作中的体质豁免成功还是失败，齐射完成后都会在目标旁边的一个空位生成一只月石晶体。月石晶体有自己的生命值、先攻、回合和状态；它不是晶血龙兽的一部分，也不与晶血龙兽共用生命值。请分别建立两个独立的生物条目；每次生成的晶体都应当是一个独立指示物，单独记录生命值和状态。\n\n资料中提到的自动处理，是希望配套自动化能够协助记录守护状态、处理召唤和先攻，并在晶体自己的回合执行戳刺。自动化不能替代来源没有写明的召唤持续时间、数量上限、召唤者死亡后的处理或其他需要 GM 确认的规则。\n\n## 生物一：晶血龙兽（Crystalbleed Drakon）\n\n巨型龙，通常为中立邪恶。\n\n- 护甲等级：19（天生护甲）。\n- 生命值：固定为 176。生命骰公式：14d12+42。二者不是同一个平均值；使用时保留固定生命上限 176，并保留 14d12+42 作为生命骰公式。\n- 速度：步行 40 尺、掘穴 30 尺、飞行 80 尺、游泳 40 尺。来源没有列出攀爬速度。\n- 力量 23、敏捷 14、体质 20、智力 16、感知 19、魅力 18。\n- 豁免熟练：敏捷 +7、体质 +10、感知 +9、魅力 +9。来源没有列出力量和智力的额外豁免熟练。\n- 技能：察觉 +9、游说 +9、隐匿 +7。\n- 伤害抗性：无。伤害免疫：无。伤害易伤：来源未列出。\n- 状态免疫：魅惑、恐慌、中毒、震慑、变形。\n- 感官：盲视 60 尺、黑暗视觉 150 尺、被动察觉 19。\n- 语言：通用语、龙语、地底通用语（Undercommon）。\n- 挑战等级：13。经验值：10000。熟练加值：+5。\n- 先攻：+12。\n\n晶血龙兽全身的晶体会随着心跳渗出暗红液体，绯晶像水流一样环绕在它身侧。战斗前启用配套的战斗控制自动化，以协助处理月蚀守护、晶体召唤和回合效果；页面刷新后需要重新启用这套自动化。\n\n### 特性\n\n**两栖（Amphibious）。** 晶血龙兽可以在空气和水中呼吸。\n\n**月蚀守护（血魔法）。** 每当晶血龙兽原本将要从一次伤害结算中受到超过 20 点伤害时，水流般的绯晶会环绕它，使这次伤害减半，向下取整。同一次伤害结算中包含不同伤害类型时，先把这些伤害合计，再判断是否超过 20 点。总伤害为 20 点或更少时不会减免。\n\n在绯晶拒绝造成的守护碎裂期间，月蚀守护不减免伤害。绯晶拒绝的次数耗尽后，守护恢复为削弱形态：超过 20 点的伤害只能减少熟练加值，也就是减少 5 点，不能再减半。守护碎裂和恢复为削弱形态的变化应当清晰可见。\n\n**绯晶拒绝 [2/日]（Ruidium Defiance）。** 当晶血龙兽豁免失败时，它可以把这次豁免改为成功。使用这个能力的代价是月蚀守护碎裂；守护持续失效，直到晶血龙兽的下一回合开始。这一变化清晰可见。\n\n这个能力每天可以使用两次。两次使用次数耗尽后，月蚀守护即使恢复，也只能按削弱形态运作：超过 20 点的伤害只能减去熟练加值 5，不能减半。绯晶拒绝不改变晶血龙兽的护甲等级，也不改变伤害抗性。\n\n**绯晶腐化（Ruidium Corruption）。** 只有当某个能力明确要求进行这项结算时，目标才进行一次 DC 18 魅力豁免。豁免失败时，目标受到绯晶腐化；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。豁免成功时无效果。\n\n月石晶体能力中所说的“月石腐化”使用同一个绯晶腐化标记和同一套规则，不建立一个可以与之叠加的同义状态。腐化的移除按战役规则由 GM 处理。\n\n**尾击推退（Tail Shove）。** 尾击命中一个生物后，晶血龙兽可以选择推退。目标进行 DC 19 力量豁免；失败时目标被推开 10 尺，成功时无效果且不移动。同一次尾击不能同时选择尾击扫倒。\n\n**尾击扫倒（Tail Sweep）。** 尾击命中一个生物后，晶血龙兽可以选择扫倒。目标进行 DC 19 力量豁免；失败时目标陷入倒地（Prone），成功时无效果。同一次尾击不能同时选择尾击推退。\n\n### 动作\n\n**多重攻击（Multiattack）。** 晶血龙兽发动三次攻击：一次啃咬和两次爪击。每次攻击分别选择合法目标，并分别进行命中与伤害结算。\n\n**啃咬（Bite）。** 近战武器攻击，命中 +11，触及 10 尺，一个目标。命中造成 3d10+6 穿刺伤害（平均 22 点），外加 2d8 心灵伤害（平均 9 点）。\n\n**爪击（Claw）。** 近战武器攻击，命中 +11，触及 5 尺，一个目标。命中造成 3d8+6 挥砍伤害（平均 19 点），外加 1d8 心灵伤害（平均 4 点）。\n\n**尾击（Tail）。** 近战武器攻击，命中 +11，触及 15 尺，一个目标。命中造成 4d6+6 钝击伤害（平均 20 点），外加 1d6 心灵伤害（平均 3 点）。如果目标是生物，命中后晶血龙兽可以选择尾击推退或尾击扫倒，只结算其中一个分支。\n\n**噩梦吐息（Nightmare Breath，充能 5–6）。** 晶血龙兽吐出覆盖 60 尺锥形区域的红雾。区域内的每个生物都必须进行一次 DC 18 感知豁免。\n\n- 豁免失败：受到 6d10（平均 33 点）力场伤害，并陷入恐慌（Frightened），持续 1 分钟。\n- 豁免成功：受到一半伤害，向下取整，不陷入恐慌。\n\n受影响的生物在自己每个回合结束时重复进行 DC 18 感知豁免；成功则结束恐慌。受影响生物 5 尺内的另一个生物可以使用一个动作进行 DC 15 运动或医药检定；检定成功时拔除绯晶刺并结束恐慌。\n\n### 传奇动作\n\n晶血龙兽拥有 4 个传奇动作。它只能在另一个生物的回合结束时使用下列选项中的一个；在自己的回合开始时恢复所有已消耗的传奇动作。\n\n**尾击（Tail Attack，消耗 1 个传奇动作）。** 晶血龙兽发动一次尾击。该次攻击使用尾击本身的攻击和命中后分支规则；这个传奇动作已经包含这次尾击，不再额外消耗晶血龙兽的普通动作。\n\n**血液支配（Command the Blood，消耗 1 个传奇动作）。** 晶血龙兽选择一个它能看见且位于 30 尺内的生物。目标进行 DC 18 感知豁免；生命值尚未受损的目标进行这次豁免时具有优势。\n\n豁免失败时，目标必须使用自己的反应，对另一个位于其触及范围内的生物发动一次近战武器攻击。由晶血龙兽选择这个被攻击的生物。如果没有合法目标，或者目标不能执行反应，则这个效果无效。豁免成功时无效果。\n\n**晶片齐射（Shard Salvo，消耗 2 个传奇动作）。** 晶血龙兽向一个它能看见且位于 30 尺内的生物射出水晶碎片，目标进行一次 DC 18 体质豁免。\n\n- 豁免失败：受到 2d8（平均 9 点）心灵伤害，并陷入恍惚（Dazed），持续至目标下一个回合结束。恍惚不是麻痹，也不是震慑。\n- 豁免成功：受到一半伤害，向下取整，不陷入恍惚。\n\n如果晶血龙兽当前生命值不高于生命值上限的一半，豁免失败的目标还必须进行一次 DC 18 魅力豁免，并按绯晶腐化的规则结算。\n\n无论目标的体质豁免成功还是失败，晶片齐射完成后都会在目标旁边的一个空位生成一只月石晶体。该晶体立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺，也就是不会在生成后立即进行一次月石戳刺。月石晶体的完整数据见下方“生物二”。\n\n**掠流滑翔（Current Glide，消耗 1 个传奇动作）。** 晶血龙兽移动至多等于当前所使用移动方式速度一半的距离。这次移动不会引发借机攻击。\n\n### 附赠动作与反应\n\n来源没有定义晶血龙兽的专属附赠动作或反应。\n\n## 生物二：月石晶体（Moonstone Crystal）\n\n中型构装体，无阵营。它是由晶血龙兽的晶片齐射生成的固定晶体，每一只都有独立的生命值、状态和战斗成员。\n\n- 护甲等级：17。\n- 生命值：15。资料只给出固定生命值 15，没有提供生命骰公式。\n- 速度：步行 0 尺、飞行 0 尺、游泳 0 尺、攀爬 0 尺、掘穴 0 尺；不能移动。\n- 力量 10、敏捷 10、体质 10、智力 1、感知 10、魅力 1。\n- 先攻：+0。\n- 挑战等级：0。熟练加值：+2。\n- 语言：无。\n- 伤害抗性、伤害免疫和伤害易伤：资料没有添加额外设定。状态免疫：资料没有添加额外设定。\n- 感官：来源没有列出额外感官或被动察觉值。\n- 经验值：来源未提供。\n\n### 特性\n\n**固定晶体（Immobile Crystal）。** 月石晶体是不能移动的构装体，所有速度均为 0。它由晶片齐射生成在目标旁边的一个空位中，随后立即投掷先攻并加入当前战斗。晶体被摧毁后停止行动。\n\n**月石腐化（Moonstone Corruption）。** 这项能力只在月石戳刺造成的敏捷豁免失败之后使用。目标进行一次 DC 18 魅力豁免；成功时无效果。失败时，目标受到绯晶腐化（月石腐化）；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。这里的“月石腐化”和晶血龙兽的“绯晶腐化”代表同一个状态，不互相叠加成两个不同状态。腐化的移除按战役规则由 GM 处理。\n\n### 动作\n\n**月石戳刺（Moonstone Spikes）。** 在月石晶体自己的回合开始时，它向周围 10 尺内除自身以外的所有生物伸出不规则的月石尖刺，不区分敌友。每个生物分别进行 DC 18 敏捷豁免。\n\n- 豁免失败：受到 2d6（平均 7 点）穿刺伤害，随后进行一次独立的 DC 18 魅力豁免，并按月石腐化处理。\n- 豁免成功：不受伤害，也不进行腐化豁免。\n\n每只晶体每回合只能戳刺一次。晶体刚生成时不会在生成瞬间额外戳刺；晶体生命值为 0 时不再戳刺。\n\n### 附赠动作、反应与传奇动作\n\n来源没有定义月石晶体的专属附赠动作、反应或传奇动作。\n\n## 召唤关系与希望自动完成的部分\n\n我希望生成两个独立的生物条目，并提供配套自动化。自动化应当协助完成以下来源已经定义的内容：\n\n- 处理晶血龙兽的 4 点传奇动作资源，使传奇动作在晶血龙兽自己的回合开始时全部恢复，并按各选项分别消耗 1 点或 2 点。\n- 记录绯晶拒绝每天两次的使用情况；使用后让月蚀守护碎裂到晶血龙兽下一回合开始，并在次数耗尽后让守护恢复为只能减去 5 点伤害的削弱形态。\n- 在月蚀守护触发时，把同一次伤害结算的不同伤害类型合计，只有总伤害超过 20 点才处理减免；守护完整时减半并向下取整，碎裂时不减免，削弱时减去 5 点。\n- 处理晶片齐射的两阶段豁免、伤害、恍惚和生命值不高于一半时的腐化豁免。齐射结算完成后，无论目标豁免结果如何，生成一只月石晶体，在目标旁边的一个空位立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺。\n- 为每只晶体分别记录生命值和状态。晶体在自己的回合开始时，对周围 10 尺内所有其他生物执行一次月石戳刺，先做敏捷豁免，只有敏捷豁免失败者才做后续魅力腐化豁免。晶体被摧毁后停止这项行动。\n- 只在能力文字明确要求时处理绯晶腐化；首次失败标记为腐化，已有腐化者再次失败时增加 1 级力竭。腐化的解除仍由 GM 按战役规则处理。\n\n由 GM 决定或需要 GM 确认的内容包括目标选择、不同合法空位之间的选择、攻击和传奇动作的战术选择，以及来源没有明确定义的召唤规则。\n\n## 来源未指定、需要 GM 确认的规则\n\n以下内容没有在这两份生物资料中定义，不能自行补成确定规则：\n\n- 月石晶体的召唤持续多久，以及在什么时点结束。\n- 同时存在的月石晶体数量上限；资料只写明每次晶片齐射生成一只，没有给出总上限或每个召唤者的上限。\n- 晶血龙兽死亡、失去意识、离开场景、离开当前战斗或进入其他场景时，已经生成的月石晶体是否消失、停止、继续存在或改变归属。\n- 月石晶体被摧毁后是否需要从场景中移除指示物或从战斗中移除成员；来源只明确说它停止行动。\n- 晶片齐射使用时如果当前没有战斗，如何投掷先攻以及是否仍然生成晶体。\n- 目标旁边没有合适的空位时如何处理，以及有多个空位时由谁选择；来源只要求目标旁边的一个空位。\n- 绯晶拒绝的“每天两次”在何时恢复；资料没有指定长休、每日固定时点或其他恢复方式。\n- 月石晶体是否需要专注、是否需要召唤者持续维持，以及晶体对召唤者和其他生物的友好关系、控制者和指挥方式。\n","docs/generated-actor-verification.md":"# Generated Actor / Item Verification\n\n## Required Source-To-JSON Checks\n\nFor each generated Actor JSON, manually compare the generated output against the source markdown:\n\n- Identity: name, bilingual name handling, creature type, size, and alignment.\n- Language and source fidelity: a single-language source remains in its source language, while existing bilingual text keeps its original correspondence; translation is not a prerequisite for acceptance.\n- Core stats: AC, HP, hit dice, speeds, abilities, saves, and skills.\n- Traits: senses, languages, damage resistances, damage immunities, damage vulnerabilities, and condition immunities.\n- Actions: action count, action names, attack bonuses, reach or range, damage formulas, damage types, and descriptions.\n- Saves and effects: DCs, save abilities, success and failure behavior, conditions, durations, and repeated-save rules.\n- Legendary, reaction, and bonus actions: count, cost, activation type, and descriptions.\n- Spellcasting: spell list, spell save DC, spell attack bonus, preparation or innate-casting rules, and linked UUIDs where expected.\n- Automation: activities, active effects, flags, module-specific fields, and effect-profile behavior.\n- Description fidelity: important source text is preserved or intentionally transformed.\n- Source coverage: every mechanically relevant source markdown section is represented or intentionally excluded.\n- No false effects: prerequisite-only text does not create on-hit effects unless the source explicitly applies that effect.\n- Configured WMP weapons on v14: literal source damage must not also include the Item base. Check `damage.includeBase=false` and the matching `flags.fvttJsonGenerator.weaponPropertyBase` binding for that primary part. A native inferred weapon retains `includeBase=true` and its Item base. Roundtrip-test both paths; a valid JSON shape alone does not prove Fatal can identify the base die or that damage is not duplicated.\n- Output provenance: final JSON came from the project CLI or workflow, not manual construction or repair.\n\nWhen the source entered through document extraction, plaintext ingestion, or AI Intake, also trace the exact source identity through its source-scoped evidence/run artifacts, evidence IR where applicable, rendered Markdown, portable manifest evidence where applicable, and final JSON. Confirm that page/coordinate/language/confidence/line-order evidence for documents, and per-entity/aggregate equivalence for plaintext collections, were not replaced by an unrelated source or run.\n\nFor each generated standalone Item, also compare:\n\n- Identity and category: bilingual name, source category, normalized Foundry document type, rarity, attunement, weight, price, and equipment subtype.\n- Activities: inspect each `system.activities` entry for activation, target/range, consumption, uses/recovery, save/attack/damage, and its actual source-derived stage membership.\n- Effects: every structured embedded effect exists once, has a unique ID, and is referenced only by the Activities that apply it; check each Activity-to-Effect linkage rather than only counting effects.\n- Profile isolation: `core` contains no MIDI-QOL, DAE, Times Up, or Item Macro fields; a modded profile uses only the locked target-version contract.\n- Stage provenance: names, requirements, uses, and mechanics come from structured source data. A literal-only stage must remain `needs_review`.\n- Complex-rule boundary: if the locked target cannot express the source rule natively, the result must say `gm-assisted` or `external-rule` with preserved source text. Static JSON, a utility-shaped placeholder, or a passing verifier is not native automation acceptance.\n\n## Shared Verification Gate\n\nAll supported entry points must run the same canonical generation pipeline. Before a formal write:\n\n- Every canonical attack, damage, save outcome, activation, use, effect, range, and stage is projected once or explicitly marked `literal-only`/`unsupported`.\n- Activity/Effect IDs are stable, 16 characters, unique within their document, and map keys equal Activity `_id` values.\n- Duplicate IDs, dangling Effect references, lost mechanics, save-outcome drift, invalid target fields, or profile leakage are blocking errors.\n- `needs_review` and `failed` results do not enter formal single-file output or collection ZIP artifacts.\n- A source-scoped `needs_review`/`failed` result cannot be promoted by editing rendered Markdown or JSON by hand; regenerate from the accepted upstream chain instead.\n\n## Version-Specific Checks\n\nWhen generating for `--fvtt-version 12` or `13`, check:\n\n- Actor, embedded Item, standalone Item, and ActiveEffect `_stats.systemVersion` are dnd5e `4.3.9`.\n- Item activation lives on Activities; legacy Item-level `system.activation` is absent.\n- Uses use `spent`, `max`, and `recovery`; legacy `value` and `per` are absent.\n- The result passed locked 4.3.9 structural assertions. Do not report a Foundry runtime pass unless that exact artifact was imported and exercised in a separately recorded runtime.\n\nWhen generating for `--fvtt-version 14`, also check:\n\n- Actor, embedded Item, and ActiveEffect `_stats` use Foundry `14.364` and dnd5e `5.3.3`.\n- NPC resources use v14/dnd5e 5.x source fields such as `max` and `spent`, not legacy `value`.\n- Senses use `system.attributes.senses.ranges.\u003csense>` plus `special`, not direct legacy sense fields.\n- Item activities carry activation data; item-level `system.activation` is not used as the v14 source of truth.\n- Save activities use `save.dc.calculation` and `save.dc.formula`; `save.dc.value` is prepared by dnd5e and should not be emitted as source data.\n- Uses data omits legacy `value` and `per`; generated source should use `spent`, `max`, and `recovery`.\n- Spell fallback items use `method` and `prepared`, not legacy `preparation.mode`.\n- Active Effect changes target schema-backed v14 fields, for example AC flat/formula fields rather than legacy AC bonus fields.\n- If `--icon-mode safe` was used, every embedded/standalone Item has a catalogued Foundry core or dnd5e path, the adjacent `*.icon-review.json` records the chosen source/confidence/reasons, and fallback decisions remain explicit rather than being reported as semantic matches.\n- Review representative exact mappings and all semantic mappings visually. Confirm close negatives remain on a type default or an explicit reviewed override.\n- Runtime import/readback is a separate gate. State whether the exact project-local Foundry 14.364 runtime was available for this run.\n\nWhen generating for `--fvtt-version 14 --effect-profile modded-v14`, also check:\n\n- The current locked module target is MIDI-QOL `14.0.11` and DAE `14.0.12`. Reports executed against MIDI-QOL `14.0.9` remain historical evidence and do not prove the `14.0.11` runtime.\n- Times Up fields or assumptions are not required for v14 output.\n- Item Macro is not treated as a required dependency unless a v14-verified version is separately documented.\n- `flags.midi-qol.OverTime` is emitted only when the source text explicitly provides a repeated-effect formula and damage type.\n- The OverTime formula comes from the repeated-effect clause, not from an earlier hit or attack damage clause.\n- Any macro-style automation remains guarded and falls back to GM manual handling when MIDI-QOL workflow context is missing.\n\n## Portable Spellcaster Verification\n\nFor an Actor carrying `flags.fvtt-json-generator-spell-resolver.spellManifest`, verify the project artifact before importing it:\n\n- `spellResolution.status` is `pending`; `pending` is the correct portable-project state, not a failed hydration claim.\n- Every manifest ref is backed by an exact source evidence range and retains its source usage, ability, DC, attack bonus, component waiver, and literal restrictions.\n- The Actor contains no placeholder embedded Spell, resolver-managed Cast Activity, local Actor/Item UUID, or destination Compendium UUID.\n- Each manifest group links to exactly one real generated source feature by stable identity rather than item order or translated display name.\n- The Actor was regenerated by the CLI/workflow and checked with the Intake verifier; hand-repairing the Actor invalidates this layer.\n\nThis is the portable/static layer: it proves portability and source fidelity only. It does not prove that any destination-world Spell exists, that hydration occurred, or that any spell can be cast.\n\n## Target-World Resolver Report Verification\n\nAfter ordinary Actor import into the exact supported Foundry/dnd5e runtime, inspect the resolver report:\n\n- The source index includes every enabled and readable Item pack, including packs without a spell-specific manifest hint.\n- All refs resolve before the first write; any missing, ambiguous, contradictory, stale, or undecided manual conflict withholds the whole plan.\n- A matching 2024 candidate wins; a 2014 selection is allowed only when no same-key 2024 candidate exists and is visibly reported as fallback.\n- The hydrated graph contains one native Cast Activity and one native cached Spell for each ref, with exact `cachedFor`, `compendiumSource`, resolver ownership, source feature, and selected UUID linkage.\n- No placeholder, duplicate cache, foreign item adoption, or unrelated Actor/item/activity/effect/flag mutation occurred.\n- Manual Keep, Overwrite, Cancel, close, rollback, and recovery-required outcomes match the report and leave no hidden partial success.\n\nThis is the target-world hydration layer: it proves deterministic destination selection and document construction. It does not substitute for using the native activities.\n\n## Live Native Spell-Use Acceptance\n\nIn the destination world, actually use representative hydrated spells:\n\n- Run an attack workflow and confirm the native roll uses the source attack bonus.\n- Run a save workflow and confirm the native card uses the source DC and ability.\n- Open and cast a utility spell; verify source target restrictions such as self-only.\n- Use a limited spell twice to confirm the first use spends only its own Activity and the second is blocked by native behavior.\n- Use an at-will spell repeatedly and confirm no daily use is spent.\n- Confirm component waivers are represented by native Cast data and literal-only restrictions remain visible without claiming unsupported automation.\n- Disable the resolver after hydration and prove cached Spells still open and cast natively.\n\nThis is the native runtime layer. Portable/static verification, resolver hydration verification, and live-use acceptance are three separate gates. Passing any one of them cannot be used to claim the other two.\n\n## v14 Batch Acceptance\n\nFor project-internal v14 core acceptance without a local Foundry runtime, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --out-dir \"obsidian/dnd数据转fvttjson/output/v14-acceptance\" --report \"docs/acceptance/v14-core-batch-verification.md\"\n```\n\nFor project-internal v14 module-profile acceptance, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --effect-profile modded-v14 --out-dir \"obsidian/dnd数据转fvttjson/output/v14-modded-acceptance\" --report \"docs/acceptance/v14-modded-batch-verification.md\"\n```\n\nThe batch suite must:\n\n- Generate every JSON artifact through the project conversion workflow with `--fvtt-version 14` and `core` semantics.\n- For the modded suite, generate every JSON artifact through the same workflow with `--fvtt-version 14 --effect-profile modded-v14`.\n- Disable optional translation services so acceptance output is source-faithful and not affected by external model behavior.\n- Include a local GoddessFantasy fixture pipeline sample that covers crawl -> records -> plaintext -> actor JSON.\n- Record actorVerification warnings in the report instead of treating schema success as semantic success.\n- Keep live Foundry v14 import as an explicit unresolved runtime check when no local Foundry v14 runtime is available.\n\n## Completion Standard\n\nA generated Actor JSON result is correct only when:\n\n- The project CLI or workflow regenerated the target JSON.\n- The JSON parses.\n- Relevant tests passed, or known baseline failures are explicitly separated from the current change.\n- The source markdown comparison above was completed.\n- Any Foundry, dnd5e, or module-dependent behavior was checked against locked local references for the target version.\n- Any remaining uncertainty is reported with the exact source field, generated field, and reference gap.\n","docs/item-ai-intake-v14.md":"# AI Item Intake: TXT to Foundry V14 Item JSON\n\n## What this path accepts\n\n`--intake-items` is the formal path for a natural-language TXT or irregular Item Markdown. It is intentionally separate from `--ingest-items` and `--ingest-items-json`, which remain strict-format compatibility commands.\n\nThe supported target is exactly Foundry VTT `14.364`, dnd5e `5.3.3`, and effect profile `core`. The command refuses another target or profile before the AI provider is called.\n\n```powershell\nbun run src/index.ts --intake-items \"F:\\source\\item.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n`--dry-run` validates input limits and target selection but does not call a provider or promote files. A run contains at most 50 Item candidates and 200,000 JavaScript UTF-16 characters.\n\n## Acceptance boundary\n\nThe provider returns an evidence-bearing `ItemIntakeIR`, not Foundry JSON. Every candidate field and ability has an exact source range. The project then validates the ranges, claims and candidate boundary, renders an Item Markdown `item-mechanics` YAML contract, invokes the normal Item parser/generator, and verifies the generated JSON field by field.\n\nOnly a fully `accepted` run promotes Markdown to `input/items/` and JSON to `output/items/`. Source text, IR, deterministic diagnostics, provider audit, rendered Markdown and review material stay in `.local/item-intake-runs/\u003crun-id>/`. Candidate JSON is not a formal output and is not offered by the Web job unless the item is accepted.\n\nThe current core contract supports:\n\n- Explicit `AC +N` only: a transfer Active Effect with `system.attributes.ac.formula`, `type: add`, `phase: initial`.\n- A light ability with explicit action, bright radius and dim outer radius: a zero-cost `utility` Activity which applies a non-transfer Actor effect. Disabling or deleting that Actor effect extinguishes the light.\n- Shared Item uses with explicit recovery. `recoverAll` at `dawn` is represented on the Item uses pool. The strict Markdown `item-mechanics` boundary requires a positive integer capacity, supported recovery periods/types, and numeric or simple dice recovery formulas; it rejects misspelled recovery values. Scaled save consumption must be an integer within the pool capacity, with a valid maximum no greater than that capacity.\n- A uniquely resolved spell: a `cast` Activity consuming `itemUses`, with `spellSlot: false`. The submitted identifier and English name must case-insensitively select the same spell in the manifest-pinned dnd5e `5.3.3` source catalog; ambiguous, missing, or mismatched references are rejected and are never changed into Utility Activities.\n\nFor example, the dormant Jewel of Three Prayers contract has AC `+1`, an action to apply `bright: 15` / `dim: 30` light with no charge cost, a three-charge dawn-recovery pool, and a one-charge `Invisibility` cast. `dim: 30` is the outer edge of dim light, not an additional 30 feet after the bright radius.\n\n## Provider configuration and review\n\nItem Intake reuses the existing `MONSTER_INTAKE_*` configuration and `--intake-doctor`; this is shared provider plumbing only. It does not run the Monster IR or compatibility normalizer.\n\n```powershell\nbun run src/index.ts --intake-doctor\n```\n\nIf a run needs decisions, use its bundle rather than editing generated JSON:\n\n```powershell\nbun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" `\n  --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\nFor this first Item contract, the only decision that can be resumed is an explicit `replace` for a `target-conflict:*` promotion finding; the prior files are copied into the run bundle before replacement. Evidence and mechanics findings are intentionally not overrideable by a decisions file: correct the TXT/Markdown and start a new Intake run instead.\n\nThe legacy `--enable-ai-normalize` hook is not Item Intake. It only assists strict project Markdown and, if unavailable or failed, returns no normalized mechanics so the original source is parsed; it can no longer silently manufacture `abilities: []`.\n\n## Runtime status\n\nStatic parser/generator/verifier and CLI/Web isolation tests cover the exact Jewel contract. The Foundry 14.364 local-lab activity lifecycle is a separate acceptance layer: do not promote this path from **Partial** to a runtime **Pass** until import, applied light effect, effect disable/remove, charge exhaustion, no-spell-slot consumption, and dawn recovery have all been observed in a disposable world. No production world is part of this workflow.\n","docs/plan/midi-qol-dnd6-bugfix-development.md":"# Midi-QOL dnd5e 6 兼容修复计划\n\n当前续接（2026-09-23）：Batch6 DAE/Tidy实际UI发现普通ActiveEffect创建被dnd5e6.0.2无ID状态迁移误判为condition，详见[迁移总报告](./server-mirror-to-server-next.md)的AH段。锁定原上游及既有四补丁不变，新增独立patch0005/local.8候选仅在Midi自有ActiveEffect子类新建无ID非condition效果时先分配ID。构建TypeScript baseline/candidate均0，最终80/80源码测试、更新器预览、模块类型检查和手册一致性检查通过。受限在线更新已仅替换JS/source map/module.json，ZIP SHA256 4E1A222E3D60557D8172164EF71CBC44973027749BFF6997DE59F88093E55A2F、磁盘/HTTP bundle SHA256 2DAB2B3A021FDB603F1680D0FA962E5E68022887A45A0248D997EA48D9AAE6F8，PID43656未变；新客户端浏览器验收尚未执行。local.7旧35项保持其原版本PASS。\n\n最终状态（2026-09-22）：Batch6的Midi-QOL兼容验收及授权清理已完成，[A–G总清单](./midi-qol-ag-acceptance-checklist.md)35/35关闭。AE正常API删除九个root和AA临时宏共10个，父方复核全部absent、配置恢复、无目标/工作流残留、共享状态不变。ServerNext PID34548持续运行；local.7未重装，既有dirty保留，未提交或生产回迁。详见[最终交付](../../foundry-modules/midi-qol/evidence/final-delivery-20260922.md)。本结论仅关闭本轮Midi兼容/清理，不代表后续迁移批次或其他模块资源告警已解决；以下旧状态按日期保留历史。\n\n最新状态（2026-09-22 AD/AE复核）：A–G全部已有历史或当次通过证据，总清单33/35。AD单次原生Shield自然到期及当次Z02恢复通过；AE新独立Luna Max / Full Access任务因Chrome提供方缺席未执行清理。仅Z03精确自有对象清理和Z04最终交付未完成，服务PID34548保持运行。当前结论见[A–G总清单](./midi-qol-ag-acceptance-checklist.md)和[AD/AE复核](../../foundry-modules/midi-qol/evidence/ag-review-batch6ad-ae-20260922.md)，下方旧阶段状态保留历史。\n\n当前续接（2026-09-22 08:58）：官方外部Chrome已通过压缩传输修复恢复，真实打开/读取/点击验证通过。全新Luna Max E2E任务 Access/never；只测剩余编号。详见[A–G总清单](./midi-qol-ag-acceptance-checklist.md)最新派发记录。以下故障和旧PID描述按各自时间保留历史。\n\n## 2026-09-22 新主任务续接\n\n已核对指定worktree/branch/HEAD及既有dirty，local.7哈希匹配且未重装。经授权恢复ServerNext，08:00:30实测PID34548、127.0.0.1:30002、14.368/dnd5e6.0.2/cor-cotn、join200及HTTP bundle哈希一致；服务保持运行。新主任务初次绑定返回`Browser is not available: chrome`；随后经官方createBrowserTab入口注册了Chrome提供方，但再次复现`Unable to load browser request-header policy`，仍未取得可操作页面。验收未新增PASS， 以直接运行受控 E2E，禁止任何进程启停。\n- C/F 新夹具使用 `midi-qol:prepare-cf` 生成测试宏：输入和实际创建后的 Activity 都必须通过 1 minute、Circle 30 ft、creature、120 ft range、非专注及 template prompt 校验；未通过就停止施放。新建仅客户端查看的测试 Scene，不激活到其他用户；走真实 activity.use 及 effect.delete，读取实际类型和 dependentOn，禁止注入预期 workflow 结果。\n\n## E2E 验收矩阵\n\n修复候选的独立 Chrome E2E 使用明确的 `PASS / FAIL / NOT_EXECUTED`。旧报告不能替代本轮验收：\n\n| Gate | 场景 | 本轮目标 |\n| --- | --- | --- |\n| A | 武器攻击 | natural 1 不自动命中或自动施加普通命中伤害，同时验证正常命中、miss 与 critical |\n| B | 法术/豁免 | 成功、失败、半伤或无伤与活动定义一致 |\n| C | DAE / Active Effect | 正确目标 Actor 上实际创建、持续、移除 effect |\n| D | Concentration | 完整建立、受伤检定、成功/失败、清理 |\n| E | Reaction | 提示、接受、拒绝/取消、资源与反应状态 |\n| F | Template / AoE | 模板、多目标、临时 ActiveEffect 创建与清理，并补测召唤/变形清理 |\n| G | Workflow / Troubleshooter / Console | workflow 无挂起，记录 Troubleshooter；如 backend 仍无法读取 Chrome Console，明确记为证据缺口 |\n\n临时 Token、Actor 副本和测试对象执行 cleanup；测试 ChatMessage 可以保留为 E2E 证据。\n\n## 完成标准\n\n这一阶段达到以下条件后，才把当前 beta 视为 `server-next` 可日常使用候选：\n\n- 已知 ActiveEffect dnd5e 6 schema 错误消失。\n- Natural 1 不产生错误自动命中、自动伤害或 HP 应用；手动入口不单独判失败。\n- DAE 实际条件链通过。\n- Concentration 完整链通过。\n- A–G 均有本轮有效运行时证据。\n- Foundry 冷启动和 world load 通过。\n- 没有新增 Midi-QOL 归因的 stderr / Troubleshooter 错误。\n- 修复以锁定来源和独立补丁保存，能够从上游 SHA 重建；本轮不要求提交。\n\n## 官方正式版切换策略\n\n当 Midi-QOL 官方稳定版本声明支持 dnd5e 6 时：\n\n1. 保留当前来源锁定、补丁与回归证据作为历史参考。\n2. 把来源锁定更新到新的官方稳定 tag/commit。\n3. 对照每个本地补丁检查官方是否已经修复。\n4. 只保留官方仍未包含的补丁。\n5. 重跑同一套 A-G E2E。\n6. 全部通过后再替换 `server-next` 当前 beta 包。\n\n这样本地开发线始终可以被官方正式版替换，且不会形成难以拆分的长期 fork。\n","docs/plan/server-next-migration-handoff-20260927.md":"# ServerNext 迁移：唯一当前状态与执行入口\n\n> **2026-10-05 本地收尾已完成：** 用户批准的恢复Next、更新四模块、补原生Cleave实机、历史源码本地整合已完成。功能整合提交a3ae8c2已快进至master，主树干净；完整门按失败修复后续跑全部通过。原Next14.368／6.0.5／cor-cotn保持运行，107注册／99启用，四包实装，真实Cleave伤害9／HP80→71通过；本批临时文档已清理、原世界设置精确恢复。当前使用清单与边界见[本次收尾记录](../reviews/2026-10-05-servernext-closeout.md)。旧工作树与私有证据保留，历史失败及边界不改写，远端push和生产未执行。本条取代下文旧快照中“未授权合并／等待自有模块”的当前含义；旧日期、PID、HEAD与旧未完成项按当时快照阅读，不当作最新状态。\n\n> 2026-10-03本地提交授权与当前入口：用户明确要求先做commit、减少dirty积压。已在原迁移分支形成b6ec
