<script id="handbook-data" type="application/json">{"schemaVersion":1,"entries":[{"id":"version-selection","title":"选择 Foundry 与 dnd5e 版本","category":"maintain","summary":"先确认 Foundry V14 与 dnd5e 的组合，再查看所需工具是否支持；5.3.3 与 6.x 的验收分别记录。","when":"第一次使用、升级系统，或不确定某个模块能否在当前世界运行时先看这里。","requires":["当前世界的 Foundry Core 版本、游戏系统名称和 dnd5e 版本。","准备使用的具体工具；同一合集中的模块可能有不同支持范围。"],"steps":[{"title":"确认两个版本号","text":"Foundry V14 是平台版本，dnd5e 5.3.3 或 6.x 是游戏系统版本，两者不能互相代替。查看当前世界的设置/系统信息，并记录完整版本号。"},{"title":"选择对应系统线","text":"5.x 固定使用 5.3.3；6.x 按官方稳定发布逐项适配。已有运行记录包括 14.364/5.3.3、Mirror 14.368/5.3.3 和 Next 14.368/6.0.5；Next 已完成 14.368/6.0.6 系统更新与启动读回，具体模块功能仍按各自接受记录判断，见下方支持矩阵。"},{"title":"生成资料时显式选择 V14","text":"常规生成使用 V14、core 和关闭图标匹配。CLI 省略版本仍默认 V12，Web 初始选择 V14；V14 输出不能据此视为已支持 dnd5e 6.x。将示例路径替换为真实来源。","command":"bun run src/index.ts \"path/to/source.md\" -o \"path/to/output.json\" --fvtt-version 14 --effect-profile core --icon-mode off"},{"title":"升级前核对具体功能","text":"先看准备使用的工具的“开始前准备”和“适用范围”，再查支持矩阵。安装成功或部分玩法通过，不能代替整个模块组合的实际接受。升级和迁移按对应流程单独处理。"}],"outputs":["明确的 Core/系统组合，以及所需工具的已接受范围和待核对项。"],"limits":["V14 是当前主要平台；V12 保留历史兼容实现，本页不改变 CLI 默认值或删除旧功能。","当前 Forge 正式生成目标仍为 dnd5e 5.3.3；6.x 的模块适配不代表全部生成、导入或玩法已经支持。","文中精确组合来自已有支持记录，不表示本轮查到的最新官方版本或你当前世界的实装版本。"],"keywords":["版本","兼容性","V14","V12","5.3.3","6.x","ServerNext","Mirror"],"sources":["docs/runbooks/dnd5e-version-following.md","docs/acceptance/current-support-matrix.md"],"watch":["docs/runbooks/dnd5e-version-following.md","docs/acceptance/current-support-matrix.md"],"entryId":"version-selection","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"legacy-next-test-inputs","title":"ServerNext 历史回归测试输入","category":"maintain","summary":"独立保存固定版本测试材料，让主工作区和新 worktree 不再依赖旧迁移树。","when":"运行历史 Midi、DAE、Classpack 或外部候选回归，或检查本地测试材料是否完整时使用。","requires":["接收目录是项目 Git checkout；准备来源须持有清单内全部合法来源文件。","材料只存入忽略的本地测试目录；仓库不分发原始大包和私有分析数据。"],"steps":[{"title":"检查已准备材料","text":"在主工作区执行完整哈希与 Git 身份校验。校验不再读取旧迁移树，也不启动 Foundry。","command":"bun run legacy-next-inputs:prepare -- --check"},{"title":"缺少材料时一次准备","text":"按来源文档填写绝对来源路径；默认只读计划，显式 --apply 才写入新输入库。写前及写后均核对清单；拒绝覆盖已有库。主工作区准备后，新 sibling worktree 自动共享。"},{"title":"运行当前候选回归","text":"清除非空的历史输入根覆盖后运行当前候选；测试、补丁、锁定和报告来自当前 checkout，材料来自独立输入库。","command":"bun run test:legacy-next-inputs\nbun run midi-qol:test\nbun run test:classpack-next"}],"outputs":["170 个已核对输入文件、固定 Midi Git 对象/索引与 ready 标记。","本地 .local/legacy-next-test-inputs/data 测试目录及只读校验结果。"],"limits":["只消除旧 worktree 依赖；现有 F 盘 Core、Node、系统方法、TCoE 来源和部分接受收据依赖仍保留。","非空 FVTT_LEGACY_NEXT_INPUT_ROOT 仍优先；默认回归应按来源说明清除它。","离线回归不代表现行版本玩法、安装或部署接受；不操作运行中世界或服务。"],"keywords":["ServerNext","测试","worktree","Midi","Classpack","历史输入"],"sources":["docs/runbooks/legacy-next-test-inputs.md"],"watch":["tools/legacy-next-inputs/","tests/helpers/legacy-next-inputs.mjs"],"entryId":"legacy-next-test-inputs","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"web-workbench","title":"Web 工作台","category":"convert","summary":"用中文页面上传资料、查看转换进度，下载 JSON、Markdown 和 ZIP。","when":"希望通过页面操作，或者需要查看批量任务、警告和下载结果时，从这里开始。","requires":["本机已安装项目锁定依赖；运行命令时位于项目根目录。","实际使用需要启动 Web 服务；阅读本手册不需要。AI 任务还需按页面配置 AI 连接。"],"steps":[{"title":"启动本机工作台","text":"先构建页面，再启动仅监听本机的服务；服务运行期间保留终端。","command":"bun run web:build\nbun run web:start"},{"title":"打开页面并选择任务","text":"在浏览器打开 http://127.0.0.1:5174。按资料类型选择转换入口，核对目标版本与 effect profile，上传真实来源文件。"},{"title":"核对任务与结果","text":"查看任务摘要、来源和诊断；遇到 needs_review 或 failed 先处理问题。单文件下载 JSON，批量下载逐项结果或 ZIP。"},{"title":"需要本机 Companion 时","text":"开发入口会构建 Windows Companion 并在 5173 启动单一页面/API 服务。按 AI 连接面板下载 EXE、双击并完成配对。","command":"bun run web:dev"}],"outputs":["可下载的正式 JSON、任务对应的 Markdown、诊断和批量 ZIP。","上传任务在隔离的任务区域处理，不会按 Vault Sync 的方式修改资料库 manifest。"],"limits":["web:dev 是构建后启动，不是前端热更新；修改后需要重新运行。","网站 AI、个人 API Key 与本机 Companion 是不同连接方式，不应混用其配置；公开部署需独立配置和授权。","页面成功下载不等于来源语义或 Foundry 运行时通过。"],"keywords":["网页","上传","自动转换","下载","批处理","AI连接","Companion"],"sources":["docs/web-deployment.md","docs/web-ai-connections.md"],"watch":["apps/web/","packages/forge-gateway-protocol/"],"entryId":"web-workbench","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"markdown-convert","title":"Markdown 转 Actor / Item","category":"convert","summary":"把符合项目格式的中文 YAML/Markdown 或英文 bestiary 转为 Foundry 数据。","when":"来源已经是项目支持的结构化 Markdown，想直接生成单文件或合集时使用。杂乱 TXT 先看 AI Intake。","requires":["符合项目契约的来源 Markdown，可先参照 templates/npc-example.md。","明确 Foundry 目标与效果模式；下面示例显式选择 v14/core，并关闭图标替换。"],"steps":[{"title":"查看可用参数","text":"确认本版本 CLI 帮助，特别是版本、输出路径和输入类型。","command":"bun run cli:help"},{"title":"生成示例 Actor","text":"示例来源在仓库中；正式使用时替换来源和输出名称，保持原文可追溯。","command":"bun run src/index.ts \"templates/npc-example.md\" -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" --fvtt-version 14 --effect-profile core --icon-mode off"},{"title":"对照来源验证","text":"运行来源验证，并人工核对属性、动作、豁免、效果与施法；修改来源或生成逻辑后重新生成。","command":"bun run verify:actor \"templates/npc-example.md\" \"obsidian/dnd数据转fvttjson/output/example-v14.json\""}],"outputs":["由正式 workflow 生成的 Actor 或 Item JSON。","未通过正式检查的结果停在 needs_review / failed，不写正式 output。"],"limits":["CLI 省略版本默认 v12；本手册的示例不改变这个产品默认值。","v14 锁定 Foundry 14.364 / dnd5e 5.3.3。core 不输出专属 modded 字段；不同模块组合的兼容性需单独核实。","结构化来源的分区决定 Item 显示分区；动作分区中回合开始自动触发的 special Activity 仍显示在动作分区，特性分区中显式 action 也不迁移分区。","结构化目标的数量、类型和字面限制投影到Activity受影响目标，独立于范围模板；单一生物目标不自动生成AoE模板。","Bleeding / Burning 模板从特性明确给出的骰式、伤害类型和时机取值，默认回合结束，重复施加统一采用较高值。19 种 Custom Conditions 的生成状态 ID 统一使用 fvtt-custom-conditions.\u003c条件 ID>，与 dnd5e 的 bleeding/burning 及其他模块的 dazed 分开；flags 中的规则参数条件 ID 仍是 bleeding、burning 等语义 ID。自定义 Dazed / Shocked 模板采用本项目的移动、动作、附赠动作三选一说明；生成的文本和状态 ID 不代替 Foundry 内的实际回合限制。普通命中伤害和相邻其他状态不能代替缺失参数；在 FVTT 中自动执行需要 Custom Conditions 与 Trigger Engine，JSON 导入不等于状态自动命中或 E2E 通过。","状态模板 Effect ID 使用稳定的来源动作身份；重复生成保持本地引用一致，同一 Item 内的独立动作也有不同身份。生成时间戳可变化，不保证整份 JSON 字节完全相同。","武器来源可显式提供原生精通与 weapon-properties 配置；core 仅投影可原生表达的 Deadly 等字段，精确 Fatal／重击流血保持需复核说明，modded-v14 才输出武器模块配置。独立 Item 使用 workflow 的值级 verifier；verify:actor 仅用于 Actor。","不可手工修补最终 JSON 来绕过生成或审查。"],"keywords":["生成器","NPC","Actor","Item","JSON","YAML","CLI","合集"],"sources":["README.md","docs/generated-actor-verification.md","docs/acceptance/current-support-matrix.md"],"watch":["apps/cli/","packages/contracts/","packages/models/","packages/parser/","packages/generation/","packages/workflows/"],"entryId":"markdown-convert","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"monster-intake","title":"AI 怪物资料整理","category":"convert","summary":"从原始 TXT 或不规则 Markdown 提取怪物证据，生成标准来源和 Actor JSON。","when":"刚拿到一段怪物资料或多个怪物的合集，尚未整理为项目格式时使用。","requires":["真实 TXT/Markdown 来源，不将截图直接交给此文本入口。","配置专用 MONSTER_INTAKE_* provider；内容会发给所选 AI 服务。凭据只保留在本地配置。"],"steps":[{"title":"检查 AI 配置","text":"API Key 模式检查配置；本机 OAuth 兼容桥模式还会检查本机健康端点。","command":"bun run src/index.ts --intake-doctor"},{"title":"先预览输入","text":"替换 source.txt 为真实文件。dry-run 检查输入与配置，估算数量，不调用 AI、不推广文件。","command":"bun run src/index.ts --intake-monsters \"source.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core --dry-run"},{"title":"执行整理并阅读审查结果","text":"移除上一条命令的 --dry-run 运行正式整理。accepted 后核对原文、标准 Markdown 与 JSON；needs_review 时使用本次 run 的 decisions 进行明确审查。"},{"title":"恢复需要审查的任务","text":"使用真实 run-id 和人工填写的 decisions.json；恢复会重新验证，不是手改候选 JSON。","command":"bun run src/index.ts --resume-intake \".local/intake-runs/\u003crun-id>\" --decisions \".local/intake-runs/\u003crun-id>/decisions.json\" --vault \"obsidian/dnd数据转fvttjson\""},{"title":"只读核验已有来源链","text":"source、IR、rendered Markdown与Actor必须属于同一来源／run。下列命令只读本地文件并打印报告；--json-output或--markdown-output会另写报告，不调用provider。","command":"bun run verify:intake -- --source \"\u003csource.txt>\" --ir \"\u003cevidence-ir.json>\" --markdown \"\u003crendered.md>\" --actor \"\u003cactor.json>\""}],"outputs":["accepted 的来源 Markdown 写入 vault input，Actor JSON 经既有 workflow 写入 output。","审查材料保留在 .local/intake-runs/\u003crun-id>/，可追溯来源与诊断。"],"limits":["最多 50 个候选、200,000 个 UTF-16 字符；任意资料和任意模型不保证自动通过。","此入口不做 PDF/图片 OCR；请先使用文档输入流程。","空白的能力分区标题不代表已检测到“没有能力”；当前确定性 validator 仍可能以 MISSING_SOURCE_FEATURES 要求审阅。不要据此虚构特性或删掉 IR 容器。","状态验收只在同一 Effect 的已启用模板 flags 与完整命名空间状态 ID 严格匹配时还原语义条件；缺少、禁用或错配 flags 仍报告 ACTOR_CONDITION_DRIFT，不按名称或后缀猜测。","退出码 0 为全部 accepted 或预览，2 为存在 needs_review 且无 failed，1 为存在 failed。","真实TXT来源本身不授权联网provider；已有明确任务授权持续有效，超出范围再澄清。dry-run不产生accepted链，fake provider不证明真实模型效果。"],"keywords":["怪物","文本","TXT","Intake","审查","resume","AI"],"sources":["README.md","docs/acceptance/current-support-matrix.md"],"watch":["packages/intake-ai/"],"entryId":"monster-intake","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"item-intake","title":"AI 物品资料整理","category":"convert","summary":"把自然语言物品资料整理成有来源证据的 Item，并核对机制和法术。","when":"物品描述是 TXT 或不规则 Markdown，包含充能、效果或施法机制，需要正式 Item Intake 时使用。","requires":["原始物品文本，单次不超过 50 项和 200,000 个 UTF-16 字符。","与 Monster Intake 共用专用 provider 配置，但使用独立 Item IR 和生成检查。"],"steps":[{"title":"确认配置和目标","text":"检查 AI provider；此入口固定为 Foundry 14.364 / dnd5e 5.3.3 / core。","command":"bun run src/index.ts --intake-doctor"},{"title":"整理物品来源","text":"替换文件路径。AI 提取证据，确定性规则生成 item-mechanics Markdown 和 Item JSON。","command":"bun run src/index.ts --intake-items \"items.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core"},{"title":"阅读机制与审查材料","text":"重点核对 AC、充能、恢复时机、Activity 消耗和法术身份。needs_review 时通过本次审查包的 decisions 恢复。","command":"bun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" --vault \"obsidian/dnd数据转fvttjson\""}],"outputs":["accepted 的 Markdown 和 JSON 分别进入 input/items 与 output/items。","独立 .local/item-intake-runs/\u003crun-id>/ 保留证据、诊断和 provider 审计。"],"limits":["法术身份必须唯一命中锁定目录；无法解析不能用空 Utility 伪装成功。","静态和应用层验收不等于每种物品已通过 Foundry AC、充能与效果生命周期实测。","真实TXT来源本身不授权联网provider；已有明确任务授权持续有效，超出范围再澄清。dry-run不产生accepted链，fake provider不证明真实模型效果。"],"keywords":["物品","魔法物品","充能","Item","Intake"],"sources":["docs/item-ai-intake-v14.md"],"watch":["packages/intake-ai/"],"entryId":"item-intake","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"species-intake","title":"种族资料整理","category":"convert","summary":"把种族 TXT 或规范 Markdown 整理成 race/feat 包，保留累计构建所需的审查记录。","when":"新增自制种族，或修改已经接受的种族 Markdown，需要重新审查并纳入内容合集时使用。","requires":["种族原文、Intake provider 和明确目标。常规路径使用 v14/core、2024 规则。","理解自动化与 GM 辅助边界，复杂规则不能用空 Activity 冒充实现。"],"steps":[{"title":"运行 Species Intake","text":"替换真实来源；同一入口也接收人工编辑后的规范 Species Markdown。","command":"bun run src/index.ts --intake-species \"species.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core"},{"title":"核对种族机制","text":"对照体型、速度、感官、AC/HP、等级特性和 GM 判断项，确认 accepted ledger 与当前 Markdown 一致。"},{"title":"显式构建累计合集","text":"Intake 成功不会自动重建模块。准备分发内容时再显式构建并验证；安装是另一项操作。","command":"bun run build:homebrew-species\nbun run verify:homebrew-species"}],"outputs":["来源证据、标准 Species Markdown、race/feat package 与 accepted ledger。","显式构建后得到自制种族模块内容；使用方式见“自制种族合集”条目。"],"limits":["修改 accepted Markdown 后必须重新 Intake，否则 hash 过期会阻止构建。","v12/core 存在静态候选路线，不代表已通过 v12 安装和游戏实测；不得把 v14 的食人魔样本证据平移到其他目标。","ServerNext 的 --fvtt-version 14.368 仅支持 Species 内容来源链并保留 dnd5e6.0.2投影身份；模块6.0.5运行兼容与实机接受另行记录，不扩大Actor／Item入口。","真实TXT来源本身不授权联网provider；已有明确任务授权持续有效，超出范围再澄清。dry-run不产生accepted链，fake provider不证明真实模型效果。"],"keywords":["种族","食人魔","Species","Race","特性","ledger"],"sources":["docs/species-ai-intake-v14.md"],"watch":["packages/intake-ai/"],"entryId":"species-intake","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"document-extraction","title":"PDF 与图片文档提取","category":"convert","summary":"先提取文字、页码和位置，再筛选怪物候选，接入翻译与正式 Actor 生成。","when":"来源是 PDF、PNG、JPG、JPEG 或 WebP，尤其是双栏怪物页面或截图时使用。","requires":["本机 PDF/OCR 依赖通过 doctor；文字 PDF 优先读取文字层，扫描页与图片需要 OCR。","正式生成还需要相应翻译与 Monster Intake 服务；只提取可以先核对原始阅读顺序。"],"steps":[{"title":"检查文档依赖","text":"按报告补齐本机依赖；不把 OCR 缺失产生的乱码继续送入生成器。","command":"bun run document:doctor"},{"title":"先提取并筛选候选","text":"替换为真实 PDF 或图片，阅读 raw-extracted.md、候选清单和提取报告。","command":"bun run src/index.ts \"monsters.pdf\" --extract-only --fvtt-version 14 --effect-profile core"},{"title":"选择候选进行正式生成","text":"从清单读取 candidate-id，核对原页面的名字、数字、页码与阅读顺序，再运行选中候选。","command":"bun run src/index.ts \"monsters.pdf\" --document-candidate \"\u003ccandidate-id>\" --fvtt-version 14 --effect-profile core"}],"outputs":[".local/document-runs/\u003crun-id>/ 中的 raw-extracted.md、document-candidates.json 和 extraction-report.json。","符合条件时继续产出翻译/标准 Markdown 与正式 Actor JSON；原始文件不复制进 Vault manifest。"],"limits":["当前文档链路只承诺 NPC/怪物 Actor，不是任意 PDF 物品或种族转换器。","原始块需保留页码、坐标、语言与置信度；OCR 和候选翻译均需与原页面核对。","翻译缺失、机械字段丢失或 Intake 未配置会停下，不静默生成。","提取正文、阅读顺序、候选语义或下游内容／消费行为变化时，继续完整来源→Markdown→Actor链对照。仅报告或元数据显示变化且有明确未变证据时，只核原页及受影响的可追溯信息。"],"keywords":["OCR","PDF","截图","图片","PaddleOCR","文档","扫描"],"sources":["docs/document-input-workflow.md"],"watch":["packages/ingest-documents/"],"entryId":"document-extraction","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"vault-sync","title":"Obsidian 资料库同步","category":"library","summary":"识别资料库 input 中新增或变化的 Markdown，增量更新对应 JSON。","when":"需要了解批量增量同步的行为时查阅。当前旧同步仍含备份和清理逻辑，不作为本机默认批处理入口。","requires":["核对 input/output 和同步 manifest 的实际目标，保护既有资料。","本项目用户规则禁止创建备份；现有同步覆盖流程仍写 output_backup，需先解决这项行为冲突。"],"steps":[{"title":"检查来源和目标范围","text":"默认资料库为 obsidian/dnd数据转fvttjson；确认 input 内容、既有 output 和 .fvtt-sync-manifest.json 的归属。"},{"title":"选择当前可用的替代入口","text":"日常先用单文件转换或 Web 上传任务。旧 sync:vault 命令会写备份并可能清理过期输出，本手册不将它作为可直接执行的推荐命令。"},{"title":"需要同步时先明确处理方案","text":"先处理无备份规则与旧实现冲突，再对新增、修改和删除来源分别做明确验收。不要用 --clear-backup 绕过限制。"}],"outputs":["按原有设计，同步 manifest 记录输入变化，output 对应生成 JSON。","本条目提供行为说明，不代表已经修复无备份冲突或运行了同步。"],"limits":["旧实现覆盖前保留 output_backup，与当前无备份要求冲突；本次手册工作不修改同步实现。","源文件删除可能导致过期输出被移除；增量同步不是纯只读操作。"],"keywords":["Obsidian","Vault","同步","批量","增量","backup"],"sources":["README.md"],"watch":["packages/workflows/"],"entryId":"vault-sync","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"goddessfantasy-crawl","title":"GoddessFantasy 资料采集","category":"library","summary":"从论坛板块收集来源记录，再整理为可用于怪物转换的纯文本。","when":"需要按板块批量整理论坛怪物资料，并保留采集记录时使用。","requires":["明确板块与采集范围；需要登录的内容依赖有效授权和本地凭据。","cookie 只保存在忽略的本地文件或环境中，不放进仓库、手册或最终数据。"],"steps":[{"title":"查看采集入口与参数","text":"先核对本版本帮助，明确增量或完整采集、来源 URL 和输出目录。","command":"bun run src/tools/crawlSites.ts --help"},{"title":"核对来源后执行采集","text":"按 README 的 goddessfantasy-board 参数配置真实板块与本地 cookie 文件。先 dry-run，记录范围后再执行已授权采集。"},{"title":"从记录生成纯文本","text":"采集后使用 records-to-plaintext，把实际 records.json 转为怪物文本，再选择正式转换或 Intake。","command":"bun run src/tools/crawlSites.ts records-to-plaintext --records \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318/records.json\" --out-dir \"obsidian/dnd数据转fvttjson/crawls/goddessfantasy/board-2318/plaintext/monsters\""}],"outputs":["采集记录 records.json、可追溯的来源信息与拆分后的纯文本。","默认保存在 obsidian/dnd数据转fvttjson/crawls 下；正式 JSON 另走生成流程。"],"limits":["真实登录态采集依赖网络，离线测试不能证明其成功。","采集到文字不代表语义完整；仍需核对原帖边界、怪物数量与机制。"],"keywords":["女神幻想","论坛","采集","爬虫","GoddessFantasy","records"],"sources":["README.md"],"watch":["packages/crawl-goddessfantasy/"],"entryId":"goddessfantasy-crawl","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"artwork-icons","title":"角色图片、Token 与图标","category":"library","summary":"分别管理角色立绘与 Token，用受支持目录解析物品图标并生成审阅报告。","when":"需要检查角色图片和 Token 是否用对，或显式启用 v14 的名称驱动图标解析时使用。","requires":["区分 actor.img 与 prototypeToken.texture.src 的用途；裁切只产出候选，必须查看实际图片。","普通生成默认 icon-mode off。只有明确需要图标匹配时才用 safe。"],"steps":[{"title":"确认图片用途与来源","text":"角色画像保留合适的原图，Token 单独检查框选与裁切。SSH 图片上传是外部写入，需单独明确目标与授权。"},{"title":"显式生成安全图标候选","text":"下面是需要名称驱动图标时的可选示例；只使用锁定 v14/dnd5e 目录，低置信候选不会强行替换。","command":"bun run src/index.ts \"templates/npc-example.md\" -o \"obsidian/dnd数据转fvttjson/output/example-icons.json\" --fvtt-version 14 --effect-profile core --icon-mode safe"},{"title":"打开图标审阅报告","text":"生成报告页面后在浏览器查看图片；需要 override 时维护独立映射并重新生成。","command":"bun run review:icons:v14 --report \"obsidian/dnd数据转fvttjson/output/example-icons.icon-review.json\" --output \".local/icon-review/example-icons.html\""}],"outputs":["独立 Actor/Token 资产、裁切候选，以及 safe 模式下的 icon-review.json 与可选审阅页。"],"limits":["safe 图标模式只适用于 v14；尺寸、URL 或上传成功不等于视觉验收。","不凭名称相似度强行选图，不把上传配置和凭据带进生成数据。"],"keywords":["图片","立绘","Token","头像","裁切","图标","icon"],"sources":["README.md","packages/assets-icons/AGENTS.md"],"watch":["packages/assets-icons/"],"entryId":"artwork-icons","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"legacy-text","title":"旧纯文本转换与兼容入口","category":"convert","summary":"为已有严格格式资料和历史脚本保留的拆分与转换命令。","when":"正在维护旧脚本，或者来源本来就符合旧格式时查阅。新资料优先标准 Markdown 或正式 Intake。","requires":["来源必须符合对应严格格式，不规则物品 TXT 应使用 AI Item Intake。","确认输出不与已有 input/output 同名冲突。"],"steps":[{"title":"先检查识别与冲突","text":"旧 Actor 入口可先 dry-run；不能把有警告或识别失败的资料当作正式结果。","command":"bun run src/index.ts --ingest-plaintext-actors \"collection.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core --dry-run"},{"title":"仅拆分旧格式物品","text":"需要中间 Markdown 时使用严格格式拆分入口。","command":"bun run src/index.ts --ingest-items \"items.md\" --vault \"obsidian/dnd数据转fvttjson\""},{"title":"核对后正式转换","text":"Actor 预览无误后可移除 dry-run；物品需要直接生成时使用 ingest-items-json。只处理本次推广的 Item 来源。","command":"bun run src/index.ts --ingest-items-json \"items.md\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core"}],"outputs":["按入口生成中间 Markdown，或本次来源对应的正式 Markdown 和 JSON。"],"limits":["网页旧纯文本 Actor 任务已删除，网页应使用自动转换。","兼容入口不会在失败时偷偷切换成 AI，也不能替代不规则 Item Intake。"],"keywords":["legacy","纯文本","拆分","旧命令","兼容"],"sources":["README.md"],"watch":["packages/ingest-plaintext/"],"entryId":"legacy-text","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"json-translation","title":"待翻译 JSON 整理","category":"library","summary":"对本地待翻译目录中的 JSON 执行字段翻译，供后续人工核对。","when":"已有待翻译 JSON，想按旧翻译工作流处理本地队列时使用。它不是任意文档生成入口。","requires":["核对真实输入目录和文件归属；此工作流会原位写入 JSON。","配置独立翻译服务，确认发送给服务的内容在授权范围内。"],"steps":[{"title":"核对队列目录","text":"默认目录 data/need_tran 被 Git 忽略；正式运行前先检查里面的文件。"},{"title":"执行明确目录的翻译","text":"替换为已经核对的目录；该命令会修改目录内符合条件的文件。","command":"bun run src/index.ts --translate-json --translate-dir \"data/need_tran\""},{"title":"人工对照原意与数字","text":"检查名称、机制术语、数值和规则含义。翻译完成不能替代正式来源语义验收。"}],"outputs":["目标目录内经翻译工作流更新的 JSON。"],"limits":["这会写用户数据，不能将整目录运行当作预览。","此入口不自动升级 schema 或目标版本，也不代替 Actor/Item 正式生成。"],"keywords":["翻译","中文化","JSON","translate","队列"],"sources":["README.md"],"watch":["packages/workflows/"],"entryId":"json-translation","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"foundry-ops","title":"Foundry 环境与资产检查","category":"maintain","summary":"统一查看本地 Lab、资产清单、离线世界审计与受限生产只读工具。","when":"想知道环境有哪些资产、命令会读写什么，或准备排查本地 Foundry 环境时使用。","requires":["先明确实际目标、路径、进程和占用者；不要停止他人正在用的 Lab。","读取生产需走明确目标与外部配置门禁；生产写入需要当次授权。"],"steps":[{"title":"先看命令目录","text":"catalog 会标注目标与最大权限，用来判断只读、修改本地或不受支持的生产写入。","command":"bun run foundry:ops catalog"},{"title":"检查本地资产范围","text":"scope 枚举已登记、隐私排除和待人工判断项；只生成报告，不因此移动或删除资产。","command":"bun run foundry:ops assets scope"},{"title":"需要字节清单时盘点","text":"读取注册的本地资产并写审计报告，包含相对路径和 SHA-256；清单不构成清理授权。","command":"bun run foundry:ops assets inventory --hash-concurrency=4"},{"title":"准备文件侧验收合同","text":"已有安全测试命令足够时直接使用；需要固定执行身份与收据时，按说明填写绝对路径及已审核命令，run 一次完成文件侧 prepare、execute、collect。ID 和候选／指令指纹自动取得。新 input 表示新执行；已有合同使用 run --contract 读回已完成收据，已领取却无结果时保持检查状态，不自动重跑。需分阶段审查仍用原分步入口。","command":"bun run foundry:ops acceptance run --input=\"\u003c请求 JSON 的绝对路径>\""},{"title":"分阶段准备验收合同","text":"需要保留逐步审核时，按说明准备带绝对路径和已审核命令的请求 JSON。预检失败即停止；成功后使用返回的合同路径依次 ready、execute、collect，需要接续时 resume。run、dispatch、receipt ID 和候选／指令身份自动取得。","command":"bun run foundry:ops acceptance prepare --input=\"\u003c请求 JSON 的绝对路径>\""},{"title":"批次先选复用、补测与不做项","text":"复杂批次显式启用 validationSelection，引用旧分项证据、相关上下文及具体失效理由，并让每条命令的 validationCases 对应本批 check 清单；专属 runtime 使用 executionCases。准备阶段先阻止无理由重复和覆盖 reuse/defer 的命令，ready/领取前复核证据。旧小请求仍兼容；此检查不证明人工影响分析或任意脚本内部语义正确。","command":"bun run foundry:ops acceptance ready --contract=\"\u003c已准备的本批合同绝对路径>\""},{"title":"预览 ServerNext 自有模块首次安装","text":"先完成候选构建及目标归属核对，在本进程显式设置 FVTT_OPS_LAB_ROOT=F:/FoundryLab/foundry-v14。此命令默认只核对清单，只有加入 --apply 才首次安装到 ServerNext；拒绝已有目标、链接、陈旧 manifest 或缺失资源，不创建备份。白名单支持TE、CC、WMP、Selected Token Sync及fvtt-suite-console首次安装；IFS 既有包升级须走单独的完整旧树校验流程。安装不等于启用或玩法接受。","command":"bun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-trigger-engine --version=0.2.0"},{"title":"接入已准备的 ServerNext 批次","text":"按说明填写本任务工作树、旧批次合同和离线授权引用。工具固定跨工作树只读来源并自动绑定回执；ready 只代表文件检查可运行，ready-batch 独立报告运行门禁。源批次暂停和回调归属保留。","command":"bun run foundry:ops acceptance prepare-batch --input=\"\u003c批次请求 JSON 的绝对路径>\""},{"title":"领取明确恢复的实机批次","text":"仅支持已有 ServerNext 的 Vision5e + Item Macro。用户明确恢复后，保存本轮授权、执行器实际上下文和服务收据，使用 prepare-runtime、ready-runtime、claim-runtime。普通 Chrome 默认 gpt-6.1-sol / medium，主控配置独立；授权记录中的模型／effort必须匹配执行器实际上下文。工具核对源批次、权限、服务和候选字节，领取一次宿主派发；聊天消息仍由获准宿主发送。","command":"bun run foundry:ops acceptance prepare-runtime --input=\"\u003c运行请求 JSON 的绝对路径>\""},{"title":"接续前核对当前状态与独立验收记录","text":"同一任务由一个 owner 维护当前入口，跨项目台账只指向它。按任务合同记录候选和唯一下一步，inspect-state 只读核对身份、旧 STOP 的显式替代及父审引用。报告完成、父审、集成和发布分开；自动收据仍 PENDING 不触发已接受行为重放，较晚时间戳不产生权限。","command":"bun run foundry:ops acceptance inspect-state --input=\"\u003c当前任务合同绝对路径>\""},{"title":"先确定实机批次的最终读回方式","text":"在既有合同和授权内安排恢复、精确清理及最终读回。删除唯一审计宏或关闭唯一证据入口前，确认完整数据与入口自身删除的最终核对方式；目录当前显示数量不能代替完整集合，清理前快照不能冒充清理后结果。仅合并已授权连续执行的收尾步骤，既有分阶段父审和停止点继续遵守；真实失败或权限、用户输入缺口也应中断。公共文件检查不会自动执行这些步骤。"},{"title":"清理前读回内容保留证据","text":"按 worktree runbook 列明已提交、暂存、工作区、untracked 和 ignored 内容。inspect-preservation 只读匹配保留范围外的现存文件或可达 Git 文件；未知、缺件和字节失配保持 INCOMPLETE。Git clean、类似主线实现与检查通过均不授予删除权限，不自动复制或清理。","command":"bun run foundry:ops acceptance inspect-preservation --input=\"\u003c保留请求绝对路径>\""},{"title":"选择Mirror Core程序","text":"此轮Mirror目标14.368/dnd5e5.3.3。需要启动已核对的Mirror时，显式设置FVTT_OPS_MIRROR_FOUNDRY_VERSION=14.368，再运行bun run foundry:lab launch server-mirror；Core Test仍使用14.364。仅接受明确的364/368，不影响Next或生产。维护先核真实PID和共享占用，旧PID记录不能代替进程身份。"}],"outputs":[".local 中的本地资产或范围报告、完整性状态与待判断项。","目标 worktree 的 .local/development-feedback/\u003crunId>/ 内保存合同、一次执行原件、收据和独立摘要。","白名单自有模块首次安装的干跑/安装路径和逐文件 SHA-256 对账结果。"],"limits":["本机与线上均不创建备份；旧文档里会创建快照、备份或迁移副本的路径不作为本手册的推荐操作。","本地launcher使用精确小写--nobackups，旧--noBackups仅在传参时规范化，显式禁用或冲突参数会拒绝；修正只对新启动生效。已有服务须在其owner批准的维护范围核对实际备份控件，不能仅凭命令中出现字符串声称生效。","server-mirror 按用户要求常驻至关机，E2E 只复用并清理自己的测试对象，不自行启停 Foundry；核对实际 dataPath、端口和活动世界，启动参数使用连续的 --key=value。","不得编辑运行中世界 LevelDB；本地检查不证明线上环境正常。","手册不执行运维命令，安装、重启、迁移和清理都需要按各自范围处理。","共用验收第一版只做已授权的本地文件检查：保存成功与行为通过分开；空输出、仅有 PASS 标签和无 adapter 的语义保持 INCOMPLETE。已领取操作不能自动重放，父审保持待完成。","文件侧工具不提供 Foundry 玩法、Chrome、跨线程回调或对象清理验收，合同中的命令也不会获得额外权限。","run 只接受普通文件侧合同；外部批次和 runtime 使用原专用入口。新模块可使用已有测试命令或小型专用检查，缺少公共 adapter 不要求先扩建平台；manual 结果仍需人工语义判断，不能当作业务 PASS。","Vision5e + Item Macro 离线收据导入仅作参考，不恢复暂停状态；单独运行合同必须有明确恢复授权与实际权限/服务证据。collect-runtime 只收集观察，仍保持父审待完成；数据判断不替代 UI、加载哈希、角色/重载和完整清理。","新版peer检查识别两个允许的Mirror程序目录；未知活PID拒绝继续并保留记录。正常E2E仍不停止常驻服务，授权维护后恢复30001。","原迁移树的首次安装入口保留；本轮已装模块不能用首次安装命令更新。新版本更新须另核候选、当前安装与授权；旧固定版本示例不代表当前6.0.5已装版本。"],"keywords":["Lab","环境","运维","盘点","资产","诊断","世界","性能","共用验收","合同","收据"],"sources":["tools/foundry-ops/README.zh-CN.md","docs/runbooks/development-feedback-loop.md","docs/runbooks/worktree-development.md"],"watch":["tools/foundry-ops/"],"entryId":"foundry-ops","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"verification-development","title":"验证工具与开发资料","category":"maintain","summary":"查阅来源验证、测试、支持矩阵和锁定版本参考资料，也用于持续维护本手册。","when":"需要知道“通过”具体指哪一层，或完成新功能后更新项目说明时使用。","requires":["工程工作先遵守 worktree 规则；按改动范围选择检查。","测试绿色、文件存在、真实 Foundry 操作和生产验收分别记录。"],"steps":[{"title":"选择必要检查","text":"普通说明修改核对文义、链接及受影响生成一致性；实现先用已有安全入口验证变化与已知失败，真实接口变化补代表运行链。增加或重跑检查要对应具体变更、失败、证据缺口或既定集成门禁；报告、记录器或恢复器修复只处理受影响层，保留有效业务结果。"},{"title":"到整合边界运行完整门禁","text":"明确要求全仓整合检查，或变化的共享依赖／接口需要该覆盖时运行。保留已有相关通过结果；局部修复先完成同类定点检查，再运行所需整合门禁。","command":"bun run ci:verify"},{"title":"准备历史ServerNext测试输入","text":"主工作区一次性准备独立输入库后，当前和新worktree自动读取固定材料；先完整核对哈希和Git身份，再运行受影响回归。来源缺失不能跳过为PASS，现有本机参考环境依赖仍按历史版本保留。","command":"bun run legacy-next-inputs:prepare -- --check\nbun run test:legacy-next-inputs"},{"title":"核对Forge蓝图与目标映射","text":"修改蓝图/资料块或结构化受影响目标映射时使用聚焦入口；正式来源验证与真实Foundry验收仍单独执行。","command":"bun run test:forge-blueprint\nbun run test:structured-action-targets"},{"title":"查阅生物创作研究依据","text":"历史研究保留外部工具的固定来源、能力与许可边界，以及2024资料块的官方呈现依据。Actor蓝图和可读预览已进入主线；Item配方、CR设计辅助及反派/巢穴等仍是研究提案，不因归档新增开发任务。"},{"title":"验证共用验收工具","text":"先核对CI锁定的Bun运行时并供本批子进程复用。安全包装入口覆盖选择声明/执行范围、旧证据、旧请求兼容及路径/超时边界。test:acceptance-workflow 定点验证文件侧执行、收据读回和未知执行不重放；test:acceptance-inspection 只跑状态与保留检查，三个慢Git用例各有15秒预算。先修同类定点问题，再按必要整合边界运行相关组；Next批次和清理归属仍可分别使用原聚焦入口，均不因此执行真实清理。","command":"bun run test:acceptance-tools"},{"title":"查阅锁定参考","text":"参考缓存是开发资料，不是正常生成器的运行依赖。先 dry-run 查看将获取什么。","command":"bun run references bootstrap --dry-run"},{"title":"同步工具手册","text":"入口、输入／输出、支持版本、步骤或安全限制变化时更新说明。内部实现或测试先核对是否影响这些信息；已有watch报stale仍须人工核对并更新review、build/check，不缩小覆盖或批量刷新。","command":"bun run handbook:status\nbun run handbook:build\nbun run handbook:check"},{"title":"验证共享手册或导出同源内容","text":"维护阅读视图或静态宿主时使用。以与CI一致的Bun 1.3.14验证局部状态、生命周期与宿主边界；来源人工核对有效后才导出JSON。导出供后续Foundry模块构建使用，本身不安装模块或连接世界。","command":"bun run test:suite-handbook\nbun run typecheck:handbook\nbun run handbook:export"},{"title":"选择5.x固定线或6.x跟随线","text":"5.x固定5.3.3；Next的6.x先从官方发布确认最新稳定tag并比较本地系统，再带该tag查Context7并核固定提交源码。Next落后时按已授权的升级流程先更新及窄验收；Wiki／开发分支返回只作导航。具体版本用于复现，不是永久上限；没有后台定时监测。"},{"title":"准备两种手册交付","text":"人工核对delivery策略与来源后生成完整离线HTML和Foundry用户投影，再准备模块ZIP、独立manifest/HTML及校验清单。模块ZIP不带完整工程HTML；这些命令不安装、不启动服务或发布，先通过手册同步门。","command":"bun run handbook:build\nbun run handbook:export\nbun run handbook:export:foundry\nbun run release:suite-console\nbun run verify-release:suite-console"},{"title":"只读核对独立模块包","text":"维护者使用共用校验器检查指定stage与ZIP的CRC、路径、manifest身份和逐文件字节；可额外指定模块owner的白名单。结果仅证明本地包一致性，不安装模块，也不证明实机兼容或发行许可。","command":"python tools/module-artifacts/verify.py --help"}],"outputs":["与具体改动对应的检查证据和来源语义结论。","随代码合并更新的 工具手册.html，可直接离线打开。","dist/handbook/content.json：与HTML同源的内容构建产物，供后续Foundry手册使用。"],"limits":["ci:verify 包含手册一致性检查，但不自动写说明，也不保证任何发布权限。","CI 固定 Bun 1.3.14；本机运行相同门禁应使用该版本。全仓覆盖率保留完整测试清单、单进程报告和既有阈值；总进程有 450 秒 watchdog，单案与子操作限额继续保留。CLI 子进程同时读取标准输出与错误输出，并在超时后回收。已通过的实机 E2E 可按产物与环境身份复用。","本手册是版本快照；单独复制到其他位置的 HTML 不会自动跟随 master 更新。","内部 package 是共享能力，不是每个都需要单独启动；共享手册、Forge 浏览器 runtime、法术契约与血猎手数据包由对应产品入口使用。","ServerNext历史收尾见2026-10-05记录及迁移总表，当前渐进重构和6.0.6前置见合集执行总账/支持矩阵。历史源码与框选同步增量已纳入本地整合；本地合并、远端推送、包安装与实机接受分别核对。6.0.2专属运行合同不能直接用于6.0.5或6.0.6。"],"keywords":["测试","验证","verify","参考","开发","更新","手册","构建","master"],"sources":["docs/generated-actor-verification.md","docs/acceptance/current-support-matrix.md","docs/REFERENCE_INDEX.md","docs/reviews/2026-09-22-creature-item-authoring-opportunities.md","docs/reviews/2026-09-24-dnd2024-statblock-preview-reference.md","docs/runbooks/handbook-maintenance.md","docs/runbooks/dnd5e-version-following.md","docs/runbooks/foundry-v14-development-source-routing.md","docs/reviews/2026-10-01-next-605-release-integration.md","docs/plan/server-next-migration-handoff-20260927.md","docs/reviews/2026-10-05-servernext-closeout.md"],"watch":["package.json","src/tools/","scripts/","packages/forge-browser-runtime/","packages/spell-manifest-contracts/","packages/blood-hunter-v14/","packages/suite-handbook/","docs/handbook/build.mjs","docs/handbook/delivery.json","docs/handbook/standalone.ts","docs/handbook/client.js","docs/handbook/template.html","docs/handbook/style.css","docs/handbook/tsconfig.json","tools/module-artifacts/"],"entryId":"verification-development","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"human-encounter-intake","title":"人类MD与召唤战斗包","category":"convert","summary":"人类MD经AI提取生物与固定能力配置，工具生成Actor及控制入口，并一起导入。","when":"需要生成龙兽和晶体、召唤者和红龙等多个关联生物，并携带配套自动化时。","requires":["每种生物的完整规则与明确召唤关系；未知规则保留给GM。","本地默认DS API deepseek-flash（V4.1 Flash）；生成/IR仍遵现有目标契约，固定执行控制器已准备Core14.364或14.368/dnd5e5.3.3/core。"],"steps":[{"title":"填写普通资料","text":"参照人类写法模板写两份完整生物数据，说明召唤数量、位置、先攻和持续等规则。未确定的规则明确保留缺项。"},{"title":"运行并核对","text":"从Actor目录打开Forge生物工作台，使用“战斗包”读取原始MD并生成；连接在独立AI设置配置。也可使用CLI，命令输出目录应为新的目录。","command":"bun run tools/forge-encounter/run-human-intake.ts docs/examples/晶血龙兽与月石晶体-人类写法.md ./crystalbleed-intake-run"},{"title":"审核后导入并启动","text":"角色来源、正式生成和固定配置审核通过后才产出整包。GM确认导入并明确启用；刷新会恢复已启用且身份正确的配置，控制面板可持久停用。"}],"outputs":["只有整包达到 ready_for_gm_review 后，才输出各生物的正式来源MD、Actor JSON和整包ZIP。","review.json 保留原始资料hash、IR、模型身份、重试元数据和审核结果；needs_review/failed 不产生可导入包。"],"limits":["AI只能选择已实现能力与参数，不能编写宏代码；能力清单外的自动化保留待实现或GM处理。","生成和预览不执行自动化；停止或关闭页面取消本次请求。草稿续跑重新校验、审阅，不继承历史通过状态。","本地CLI默认DS Flash，每阶段5分钟；不使用Luna桥接。浏览器验收执行器按当前项目约定和实际任务配置选择，与Intake模型分开；历史Luna Max设置不表示当前默认。","真实DS已生成并审核样例整包，本地已测召唤、守护减伤与耗尽削弱；重复腐化保留PARTIAL，待独立状态设计；浏览器完整AI生成链尚未重测。","预先审核的晶血样本使用专用宏2.1.2，导入后单独启动，刷新后重新启动；启用Custom Conditions时按正式效果中的条件标记应用独立恍惚，遵守免疫并在目标下回合结束到期，未启用时行动限制由GM裁定。候选回归不等于实机接受。","当前执行器只支持V14；V12需独立适配验收。未指定的召唤期限、数量上限和死亡规则不自行补全。","本轮只扩精确Mirror Core控制器配对；没有扩大AI能力、IR promotion、V12或旧包自动启用权限。"],"keywords":["召唤","红龙","晶体","多生物","战斗包","人类MD","配套宏"],"sources":["tools/forge-encounter/README.md","docs/examples/召唤生物-人类写法模板.md","docs/examples/晶血龙兽与月石晶体-人类写法.md"],"watch":["tools/forge-encounter/","packages/forge-browser-runtime/","packages/intake-ai/"],"entryId":"human-encounter-intake","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"crystalbleed-v12","title":"晶血龙兽 V12 配套宏与来源","category":"convert","summary":"从两份批准来源经正式生成链制作 V12 Actor，并构建独立战斗控制宏；本轮是未发布整合候选。","when":"要复核或重新生成历史 Foundry 12.331／dnd5e 4.3.9 的晶血龙兽与月石晶体交付时使用。","requires":["Foundry 12.331 / dnd5e 4.3.9；运行须由一个 GM 客户端负责","先核对包内来源、GM 辅助规则和运行目标；新版产物尚未重新实机接受"],"steps":[{"title":"运行来源与宏回归","text":"核对 save 成功伤害、独立腐化阶段、来源效果期限与纯逻辑规则。","command":"bun run test:crystalbleed-v12"},{"title":"生成两份 Actor","text":"正式 Actor 由 CLI/workflow 生成。GM 辅助／外部规则使结果保持 needs_review；不能称完整自动化已接受。","command":"bun run src/index.ts \"obsidian/dnd数据转fvttjson/input/crystalbleed-drakon-v12-rework.md\" -o \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/dragon.json\" --fvtt-version 12 --effect-profile modded-v12 --icon-mode off\nbun run src/index.ts \"obsidian/dnd数据转fvttjson/input/moonstone-salvo-crystal-v12.md\" -o \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/crystal.json\" --fvtt-version 12 --effect-profile modded-v12 --icon-mode off"},{"title":"对照来源并构建配套宏","text":"逐份运行来源 verifier，再人工核对各 Activity。宏构建只读取已生成的 Actor 并输出宏与哈希清单，不修改 Actor JSON。","command":"bun run verify:actor \"obsidian/dnd数据转fvttjson/input/crystalbleed-drakon-v12-rework.md\" \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/dragon.json\"\nbun run verify:actor \"obsidian/dnd数据转fvttjson/input/moonstone-salvo-crystal-v12.md\" \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/crystal.json\"\nbun run build:crystalbleed-v12"},{"title":"按目标版本使用","text":"导入、宏启动与实际效果需要相应世界的接受。保留原怪，使用带来源行为标记的新生物；GM 负责未自动表达的方向、目标和反应决策。"}],"outputs":["正式生成链的 review-required Actor JSON","battle-control.js、Macro JSON 与 SHA-256 manifest"],"limits":["9 月 9 日原件证明历史 V12 宏交付；本轮新 Actor JSON 哈希不同，独立状态 ID 沿用当前 master，不能用旧哈希或旧实机结果称新版运行通过。","核心修复是把来源 onSave 结果保留至各目标版本；没有手工补最终 JSON。","V14 Forge bundle 是独立导入／绑定链，不将 V12 证据或旧 V14 直导宏接受外推至该链、6.0.5 或生产。","宏需一个 GM 客户端负责，页面刷新后重启；多客户端、跨场景与长时范围没有本轮接受。"],"keywords":["晶血龙兽","月石晶体","V12","Crystalbleed","onSave"],"sources":["tools/crystalbleed-v12/README.zh-CN.md","docs/acceptance/2026-09-09-crystalbleed-v12-runtime.md","docs/acceptance/2026-09-09-crystalbleed-v12-source-audit.md"],"watch":["tools/crystalbleed-v12/","obsidian/dnd数据转fvttjson/input/crystalbleed-drakon-v12-rework.md","obsidian/dnd数据转fvttjson/input/moonstone-salvo-crystal-v12.md"],"entryId":"crystalbleed-v12","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"midi-qol-server-next-patch","title":"Midi-QOL ServerNext 兼容候选","category":"maintain","summary":"查阅原6.0.2版本的锁定源码构建／补丁工具，核对它与当前6.0.5／local.10安装的边界。","when":"维护原锁定源码或评估新适配时使用；当前6.0.5不能直接运行旧安装路径覆盖已接受候选。","requires":["工具锁定历史Foundry14.368／dnd5e6.0.2；当前服务是6.0.5／local.10，须按唯一总表核对。","ServerNext应保持运行；完整安装器保持停止门禁。local.7的A–G/Z35项和local.9基础isDamaged手动APPLY为历史6.0.2证据，不推广到当前版本。server-mirror始终只读。"],"steps":[{"title":"检查官方更新","text":"查询官方 release、分支和开放 MR。检查只给出建议，构建仍使用来源锁定中的完整提交 SHA。","command":"bun run midi-qol:upstream-check"},{"title":"测试并构建历史锁定候选","text":"这些入口仍绑定原6.0.2来源，不是完整local.10构建路线。维护原来源时从锁定源码重建依赖、比较补丁前后诊断并打包；历史回归可直接使用已核对的独立测试输入库，当前与新worktree自动定位，不再指向旧迁移树。不得用结果覆盖当前6.0.5安装；固定6.0.2分发源不替换为现行系统文件。","command":"bun run midi-qol:build\nbun run midi-qol:test"},{"title":"区分旧资源更新与 local.9 精确离线更新","text":"browser-update.ts 只锁定历史 local.7→local.8。local.9 与上一安装包只有三个非pack资源不同，但已安装pack数据库布局不同；专用runbook记录了正常关闭世界、确认锁释放后精确替换三项并保留pack的实际操作，不能用整目录安装器或旧脚本覆盖。"},{"title":"准备 C/F 运行时夹具","text":"生成可导入的测试宏；通过正常 API 创建标记临时对象，读回 1 分钟、Circle 30 ft、creature 和模板提示后才允许走实际 activity.use。核对 effect 类型与依赖删除，不以缺少 toast 判通过。","command":"bun run midi-qol:prepare-cf"},{"title":"分层验收","text":"核对精确版本、安装文件/HTTP哈希，再读取实际客户端代码和原生伤害结果；local.9基础isDamaged手动APPLY的9月25日代表场景已有真实HP40→28、效果移除和测试对象清理证据。临时HP、取消/重复操作和带类型效果未随这一场景自动通过。local.7历史35项不冒充local.9全量新测。"}],"outputs":["锁定来源、独立补丁和上游核查证据。","本地候选 ZIP、构建结果和安装哈希。","ServerNext A–G 的 PASS / FAIL / NOT_EXECUTED 报告。"],"limits":["当前候选只声明支持固定的 ServerNext 目标，不代表 dnd5e 5.x 或其他版本兼容。","安装不创建备份、不修改世界数据库，也不授权 commit、push、公开发布或生产回迁。","ServerNext/30002 应保持常驻；E2E 使用现有服务与自己标记的临时文档，结束不得停服。本次local.9仅在正常关闭世界、确认锁释放后替换三项已核对资源并恢复服务，保留已安装pack；不得使用整目录安装器或旧浏览器更新脚本。","local.9的手动带类型isDamaged.\u003ctype>效果尚无实际伤害类型贡献证明，暂不自动到期；静态测试和代码复审不等于目标世界运行通过。","手动伤害按钮存在本身不是 natural 1 失败；失败依据是错误自动命中、自动伤害或 HP 应用。","本条保留原6.0.2／local.9源码工具。当前服务为6.0.5／local.10；本轮只发布两请求handler增量及限定验收，旧构建／安装入口不能视为完整local.10构建路线，不能用旧包覆盖已接受安装。"],"keywords":["Midi-QOL","ServerNext","dnd5e 6","ActiveEffect","第三方补丁","迁移"],"sources":["foundry-modules/midi-qol/README.md","docs/runbooks/midi-qol-source-patch-build-install.md","docs/runbooks/legacy-next-test-inputs.md","docs/plan/midi-qol-dnd6-bugfix-development.md","docs/reviews/2026-10-01-next-605-midi-request-bonus-gap.md"],"watch":["foundry-modules/midi-qol/","docs/plan/midi-qol-dnd6-bugfix-development.md"],"entryId":"midi-qol-server-next-patch","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"babele-zh-maintenance","title":"中文 Babele 汉化维护","category":"maintain","summary":"在当前 Codex 项目交流，按需更新独立维护项目的上游中文补丁并保留自有译文。","when":"讨论中文 Babele 补丁更新、第三方合集译文增补或自用合并安装包时使用。","requires":["独立维护项目位于 I:/OpenCode/fvtt-babele-zh-maintenance，已准备锁定的上游输入。","Python 3.11+；维护工具只用标准库，无需另建 Codex 项目。"],"steps":[{"title":"查看维护现状","text":"默认按脚本路径定位独立维护项目，当前工作目录不改变目标。先核对上游版本与本地增补。","command":"python -B \"I:/OpenCode/fvtt-babele-zh-maintenance/maintain.py\" status"},{"title":"按需检查或更新上游","text":"check-upstream 只查一次最新正式版；明确要求更新时运行 update。无冲突则构建读回后切换维护版本；冲突输出三方内容，等用户逐项选择。","command":"python -B \"I:/OpenCode/fvtt-babele-zh-maintenance/maintain.py\" check-upstream\npython -B \"I:/OpenCode/fvtt-babele-zh-maintenance/maintain.py\" update"},{"title":"读取交付记录","text":"使用命令输出的 zip 和 receipt 路径检查结果；冲突决策文件格式及具体参数见独立项目 README 与 --help。"},{"title":"查看包含哪些内容","text":"双击 I:/OpenCode/fvtt-babele-zh-maintenance/中文Babele内容目录.html，离线搜索、筛选并展开合集。版本栏分别列出dnd5e系统兼容声明、2014/2024规则证据、FVTT官网Verified与原包Core声明；本包规则和原包当前规则可独立筛选。未知及未声明明确标识，不能据声明推断汉化已实机适配。"},{"title":"翻译前查术语","text":"先读独立项目glossary/README.md、core-terms.md及overrides.csv；扩展名词按英文、类别、规则版次和原书查terms.csv，多义项查variants.csv。Force伤害类型为力场，名称英文尾部和系统机器键保留原值。"}],"outputs":["保留来源、上游锁定版本和自有译文的同模块 ID 安装包，以及 ZIP 哈希与读回记录。","按原内容目标归并的单文件离线内容目录，含逐项来源与格式说明。","水晶浩劫本地增补：21法术、16怪物及162嵌入条目，另含潘多拉2篇关联规则和晶蚀涌动表。","发生同处不同修改时，生成绑定精确输入的冲突计划与逐项选择示例。","CHM来源的AI术语对照：244个核心英文及扩展条目索引，保留版本、类别、出处和多译名。"],"limits":["只在明确命令触发时访问上游，无后台监听或定时任务。","自用包取消上游更新地址，后续经维护项目更新；构建不自动安装 Foundry 或发布 Git。","第三干净环境http://babele-clean.localhost:30003用于水晶浩劫法术和怪物汉化验收；已验范围见独立项目docs/clean-lab-acceptance.md与docs/crystal-monsters.md。独立主机名隔离登录Cookie，Next/Mirror未改动。","本次不覆盖施法/战斗自动化、整本Adventure或全部上游译文；蓝宝石尘显示适配器限定Core14/dnd5e6.0.6，升级后需复核。","本手册仅维护外部项目入口；该项目源码、测试与架构在其独立仓库维护。","生物及所有独立特性/动作/物品名称必须为中文后空格接英文；当前水晶浩劫已按此修正，保留英文不等于所有动画精确匹配已兼容，详见独立项目docs/bilingual-names.md。","术语表不会自动修改FVTT系统标签；正文已译力场而自动伤害标签仍显示Force时，应单独核对系统语言资源。"],"keywords":["Babele","Babel","中文补丁","汉化","水晶浩劫","上游","三方合并"],"sources":["docs/runbooks/babele-zh-maintenance.md"],"watch":["docs/runbooks/babele-zh-maintenance.md"],"entryId":"babele-zh-maintenance","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"foundry-mcp-readiness","title":"本地 Foundry MCP 开发准备","category":"maintain","summary":"按需准备本地 Foundry 和专用 GM 页面，实际读取正确世界后再开始依赖 MCP 的工作。","when":"开发或验收需要通过 Mirror / ServerNext MCP 读取游戏资料，或出现模块未连接时使用。","requires":["Bun1.3.14、本地 Lab 路径与当前 worktree 的 .codex/config.toml 绝对路径。","正常登录的任务专用 GM 页面；与现有任务协调共享实例占用。"],"steps":[{"title":"准备所选环境","text":"正确运行的服务复用；只在身份核对且端口、数据目录没有进程占用时启动缺失服务。替换为当前工作树的配置路径。","command":"bun run foundry:mcp prepare --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config I:\\OpenCode\\fvttV12JsonGenerator\\.codex\\config.toml --apply"},{"title":"接续专用 GM 页面","text":"输出 browserAction 时，由官方 Chrome 执行代理进入自己的 Next GM 页面 localhost:30002/game；保持 Bridge 和页面在线，保留原有写入权限设置。CLI 本身不登录浏览器。"},{"title":"实际读取确认","text":"检查成功后再由当前聊天的对应原生 MCP 读取世界；首次接入或恢复验收再读取既有角色或合集。","command":"bun run foundry:mcp check --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config I:\\OpenCode\\fvttV12JsonGenerator\\.codex\\config.toml --apply"},{"title":"必要时安装恢复适配器","text":"只接受已核实的 Bridge0.8.4 字节；先移除 --apply 看计划，安装后仅重载本任务页面。","command":"bun run foundry:mcp:install-recovery --instance next --lab-root F:\\FoundryLab\\foundry-v14 --apply"}],"outputs":["明确的服务、后台、GM连接、身份或读取状态，以及正确世界的最小身份信息。","每个实例自己的 readiness.jsonl 与 current-readiness.json；GM页可读取最多64条客户端连接事件。"],"limits":["Mirror与Next分别保留安装及运行验收，按各自记录确认可用；一套的通过不能替代另一套。","后台与Foundry进程在线不足以接通；GM页面关闭后需要重新准备。","--apply才允许本地启动和审计写入；不停止或重启已有服务，不处理生产。","日志记录实际观察，不是持续在线率监控；恢复适配器尊重显式停止和自动重连偏好。"],"keywords":["MCP","Next","Mirror","GM","连接","自动重连","日志"],"sources":["docs/runbooks/foundry-mcp-readiness.md","tools/foundry-mcp/README.md"],"watch":["tools/foundry-mcp/","docs/runbooks/foundry-mcp-readiness.md"],"entryId":"foundry-mcp-readiness","ownerDirectory":"docs/handbook","foundryModuleId":null},{"id":"chat-memory-guard","title":"聊天内存保护","category":"maintain","summary":"限制当前浏览器中已渲染聊天卡片和头像媒体的占用，保留世界聊天记录。","when":"聊天栏长时间堆积卡片或头像媒体造成浏览器压力时，按世界默认值或当前客户端覆盖进行限制。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM（修改世界默认值时）","精确Foundry14.368/dnd5e6.0.6已接受阈值裁剪、禁用/重载、再启用和帮助窗口；具体范围见限制，不自动升级其他环境。"],"steps":[{"title":"启用并打开配置","text":"在精确支持版本的世界中启用 Chat Memory Guard；进入“游戏设置 → 模块设置 → 聊天内存保护”。模块会在世界准备完成后接管当前聊天窗口和聊天弹窗。"},{"title":"查阅使用帮助","text":"设置窗口的“使用帮助”不会保存设置。GM 在统一手册合集已启用且接口可用时定位本条目；玩家或合集不可用时直接阅读随包说明，个人覆盖与世界默认值均不改变。"},{"title":"设置世界默认值","text":"GM 设置启用开关、保留的已渲染消息数（20–200）、头像来源（系统、Token、Actor 或隐藏）、原图或会话级 WebP，以及缩略图最长边（48–256 px）和质量（40–95）。保存后当前聊天立即重新渲染。"},{"title":"设置个人覆盖","text":"每位用户可以选择跟随世界默认值，或只为当前浏览器保存覆盖值。玩家的 client 设置不会改写 GM 的世界默认值。"},{"title":"观察聊天与诊断","text":"打开聊天栏或聊天弹窗观察卡片保留和头像显示；需要排障时，在浏览器控制台读取 game.modules.get(\"chat-memory-guard\").api.getStats()，只查看渲染数、裁剪数、缩略图估算字节、失败数和有效设置。"},{"title":"运行离线检查","text":"维护者从仓库根目录运行模块测试；该检查属于机械证据，不能代替真实长时间跑团观察。","command":"bun run test:chat-memory-guard"}],"outputs":["当前浏览器聊天 DOM 按有效保留数裁剪","按设置显示系统、Token 或 Actor 头像，或使用会话级 WebP 缩略图","game.modules.get(\"chat-memory-guard\").api.getStats() 诊断结果","统一手册或模块随包窗口中的同源只读说明"],"limits":["只限制当前浏览器里已渲染的聊天卡片，不删除世界聊天记录。","缩略图只存在于当前页面会话，不能阻止 dnd5e 创建头像前的首次原图请求","短时 A/B、单元测试和构建不能证明长时间跑团内存永不增长","历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片","Next 14.368／6.0.5 本轮只验证公开聊天统计 API 与模块启用；未做长时内存或完整裁剪矩阵。","2026-10-25在14.368/6.0.6接受一次25条世界测试消息/20张页面卡；个人覆盖禁用并重载后25张卡、0裁剪，再启用重载后20张卡，世界25条历史始终保留。真实帮助窗口、系统后备头像和清理后的已采集状态恢复已核；真实WebP转换、有效滚动暂停反证和长会话未覆盖。","当前本地候选使旧缩略图请求及旧设置下的后续裁剪失效；关闭窗口或停止优化后，已开始的单张DOM移除可能完成，但不会继续旧批次。页面结束时释放本模块监听与缓存；这些异步边界有局部检查，不能把短时页面窗口统计当成全部Hook计数或长时内存保证。","诊断不输出头像URL或原始错误；失败次数在缓存清理时归零，失败来源记忆有容量上限。moduleListenerCount按当前挂接的聊天窗口计数。"],"keywords":["聊天","内存","DOM","头像","缩略图","Chat Memory Guard","帮助","统一手册"],"sources":["foundry-modules/chat-memory-guard/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/chat-memory-guard/","packages/suite-handbook/"],"module":"chat-memory-guard","entryId":"chat-memory-guard","ownerDirectory":"foundry-modules/chat-memory-guard","foundryModuleId":"chat-memory-guard"},{"id":"fvtt-babele-rolltable-embed-translation","title":"Babele 随机表嵌入翻译兼容","category":"maintain","summary":"在 Babele 翻译已经存在时，修复 Foundry v14 的 @Embed 随机表结果仍显示英文的渲染缺口。","when":"Journal、聊天或其他文本中的 Compendium RollTable 使用 @Embed 后，表名已翻译但结果行仍为英文时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","Babele 2.9.1","libWrapper 1.13.5.1","可读取的 Babele 随机表翻译文件","精确Foundry14.368/dnd5e6.0.6已完成两表限定接受；具体范围见限制，不自动升级其他环境。"],"steps":[{"title":"准备依赖并启用模块","text":"在目标世界先启用 Babele 与 libWrapper，再启用本模块并重新加载世界。模块在 init 阶段只注册 RollTable 的渲染包装；依赖缺失时不会提供翻译覆盖。"},{"title":"准备可读取的随机表","text":"确保目标 Compendium RollTable 对当前世界可读，并由 Babele 提供对应翻译。翻译源继续由现有 Babele 翻译包维护，本模块不编辑翻译文件。"},{"title":"渲染 @Embed","text":"在 Journal、聊天或其他支持富文本的地方插入目标随机表的 @Embed，再打开包含该表的页面，核对表名和各范围对应的中文结果。"},{"title":"核对结果与链接","text":"检查各个范围是否仍对应正确的结果。若使用狂野魔法浪涌或困惑术，可按原始说明逐行对照；文档型结果应仍能打开原来的目标条目。"},{"title":"运行离线检查","text":"维护者从仓库根目录运行模块测试；测试和构建只证明静态包装逻辑，实际表格行仍需在锁定版本的 Foundry UI 中复核。","command":"bun run test:fvtt-babele-rolltable-embed-translation"}],"outputs":["Compendium RollTable @Embed 中按范围显示的中文结果","文档型结果继续生成指向原 UUID 的 content-link","翻译失败时保留 Foundry 原生嵌入结果"],"limits":["只修正随机表嵌入的显示，不改写随机表、角色、物品、日志或世界设置。","Babele 或 libWrapper 不可用、翻译失败或数据无法对齐时会保持原生输出或停用覆盖","历史依赖验收为 14.364／5.3.3；本轮 Next 14.368／6.0.5 两表切片另验，Babele 2.9.1／libWrapper 1.13.5.1 不随系统升级而自动获得新接受。","单测、构建和安装校验不等于实际 UI 中的 25 行、5 行和文档链接验收","Next 14.368／6.0.5 本轮两表 25／5 行中文嵌入、原始 UUID、可见界面和来源未写入均通过；不代表任意翻译文件都可对齐。","2026-10-25在14.368/6.0.6接受狂野魔法25/25、困惑术5/5中文结果、基本方位原UUID、重复渲染和真实窗口；源表与世界文档保持不变。完整表库、英文表头、内联标签和实际掷表未覆盖。","新候选按唯一ID优先、唯一范围回退；重复或歧义匹配保留原文。翻译只提供名称和描述，不改变原UUID、范围和抽取状态；任一行渲染失败时保留整张原生表。6.0.6代表接受限于上述两表。"],"keywords":["Babele","@Embed","RollTable","随机表","翻译","content-link"],"sources":["foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-babele-rolltable-embed-translation/"],"module":"fvtt-babele-rolltable-embed-translation","entryId":"fvtt-babele-rolltable-embed-translation","ownerDirectory":"foundry-modules/fvtt-babele-rolltable-embed-translation","foundryModuleId":"fvtt-babele-rolltable-embed-translation"},{"id":"fvtt-battlefield-painter","title":"战场地形画笔","category":"play","summary":"GM在网格场景绘制42种可追踪地形选项，并使用阶段、颜色、光、可选声音、Region铺设及擦除/历史。","when":"跑团中需要快速铺设地形、改变阶段、表达移动代价或清理本模块地形文档时使用。","requires":["代码精确支持14.364/5.3.3、Mirror14.368/5.3.3及Next14.368/6.0.2、6.0.5、6.0.6；606已接受本地一格事务/Region移动/linked falling/重载及非GM权限边界的限定案例，绘制仅向GM开放且玩家入口拒绝已验","GM","已在画布查看的场景和可用网格"],"steps":[{"title":"启用并打开场景","text":"以 GM 身份在精确支持版本的世界中启用模块，然后打开并激活要编辑的场景。非 GM、无活动场景或网格接口不可用时不会允许修改。"},{"title":"打开地形画笔","text":"在场景控制组的 Tiles 工具栏点击火焰图标“战场地形画笔”，打开 ApplicationV2 控制面板。该入口只在精确版本和 GM 客户端中出现。"},{"title":"选择地形与画笔","text":"从42选项选择地形及其1至4阶段；支持换色的13类有原色加12色，环境音默认关闭。选择自由、直线或填充，以及0至4格半径。"},{"title":"在画布上操作","text":"启用后左键拖动并松开提交；擦除/阶段只改命中格位，撤销重做核对当前笔画。选中Region后可点铺设入口或Shift+P；Shift选地形收起面板，落笔后恢复。"},{"title":"处理清除与旧声音","text":"需要清理本场景地形时先查看数量预览，再在确认框中确认；发现旧版本 AmbientSound 时也必须由 GM 显式确认清理。旧声音清理不可撤销，模块不会自动迁移或删除场景数据。"}],"outputs":["模块拥有的Tile、Region、Wall、AmbientLight及可选AmbientSound文档","36地形配置加6月蚀矿图案；各配置1至4阶段、部分颜色和本模块历史","移动/阻挡按各配置说明；整张素材擦除保持原图框和选图"],"limits":["42项已整合为0.3.0-alpha.2候选；Mirror14.368/5.3.3的新Core接受按本轮原件记录，既有14.364代表样本和Next Fire切片不互相替代","13类换色和9类可选声音已实现；V3含7音源，GM七源技术播放/长短循环/近远/音量参数和Fire历史刷新擦除通过，SY七源近处播放和Energy代表近远返回也取得实际证据。能量原字节保持，其他6条约180秒立体声；旧场景音量不自动修改，主观音色仍单独保留。","复现音效时输入、输出目录必须互不包含，校验报告放在两个目录树外；输出音频文件不能通过软链接指向其他文件","Mirror14.368/5.3.3的HexCols26项/36阶段视觉、三格型代表交互及SY密地2倍/清地正常成本已取得实际证据；HexRows这次清地与Energy远返由真人操作。未扩大为全部42项/所有动作接受，也未宣称当前自动拖动接口的时序问题已修复。","不自动伤害、传送、滑倒或施法；狂野魔法/裂隙深入功能和完整长时/生产接受继续排除","旧白噪声声音单独显式清理；清除只处理拥有标记的文档。安装器拒绝覆盖现有目标，共享安装升级按运维记录进行","6.0.6真实一格FireI前置已核对Region距离10/成本15、linked falling、三次原生移动、普通重载和精确来源恢复；同时核对了玩家入口/权限拒绝，画笔不会向玩家开放，观察者看不到 Token HUD，也不能更新外来 Token。绘制仅向GM开放且玩家入口拒绝已验；全目录、长时与生产仍未验收。","报告绘制成功前仍核对Scene实际创建与计划归属。失败只清理本次读回确认的对象，未报告/外来对象和删除被拒的残留会明确列出；本轮事务/移动/重载及模块拥有对象的限定实机链已接受，不能据此认为全场景或全目录已完全恢复。"],"keywords":["战场","地形","火焰","冰霜","荆棘","画笔","Canvas","Region"],"sources":["foundry-modules/fvtt-battlefield-painter/README.zh-CN.md","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md","foundry-modules/fvtt-battlefield-painter/docs/CONTINUATION.md","foundry-modules/fvtt-battlefield-painter/docs/audio-v3-integration-2026-10-04.md","foundry-modules/fvtt-battlefield-painter/docs/PAUSED-PROGRESS-2026-10-04.md","docs/reviews/2026-10-03-foundry-14-365-mirror-upgrade-and-tile-arsenal.md","foundry-modules/fvtt-battlefield-painter/docs/completion-2026-10-05.md","foundry-modules/fvtt-battlefield-painter/docs/local-integration-scope-2026-10-05.md"],"watch":["foundry-modules/fvtt-battlefield-painter/"],"module":"fvtt-battlefield-painter","entryId":"fvtt-battlefield-painter","ownerDirectory":"foundry-modules/fvtt-battlefield-painter","foundryModuleId":"fvtt-battlefield-painter"},{"id":"fvtt-blood-hunter-2024","title":"血猎手 2024","category":"library","summary":"提供血猎手 2024 的职业、结社和特性合集，使用 dnd5e 原生升级流程。","when":"给新角色添加血猎手职业、查看结社特性，或只读检查旧角色与当前内容差异时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM","可被 canonical flags 或严格 legacy 条件唯一匹配的 Blood Hunter Actor（迁移时）","新增精确Foundry14.368/dnd5e6.0.6受限新角色/职业授予接受；旧角色仍只读Preview，不自动升级其他环境。"],"steps":[{"title":"启用并检查内容包","text":"在精确支持版本的世界中启用模块，打开 Compendium 目录确认“血猎手 2024：职业”“血猎手 2024：子职”和“血猎手 2024：特性”三个 Item pack 可读。"},{"title":"给新角色添加职业","text":"从 classes（职业）合集中把“血猎手”拖入角色卡，按 dnd5e 原生 Advancement 提示完成选择。"},{"title":"按原生流程升级","text":"通过角色卡的升级流程选择结社和对应特性；需要 GM/玩家判断的规则按原文处理，不把 assisted 项当作全自动。"},{"title":"更新合集后检查角色","text":"已经加入角色卡的职业和特性是快照，模块更新不会实时替换它们。核对角色已有等级、选择和消耗，再决定是否需要另行处理。"},{"title":"旧角色仅做只读预览","text":"GM 在“游戏设置 → 模块设置”打开“血猎手 2024：角色迁移”，输入 Actor ID 或精确名称，点击 Preview 查看差异。当前 Create migrated copy 与 Apply original 流程要求创建副本和 JSON 备份，与本项目无备份规则冲突，因此停在 Preview，不继续迁移。"}],"outputs":["classes、subclasses、features 三个 dnd5e Item Compendium pack","原生角色卡中的血猎手职业、结社及按升级流程授予的特性","旧角色的只读 Preview 差异报告；当前流程停在预览，不创建角色副本或 JSON 备份"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片；MIDI-QOL 14.0.11 和 DAE 14.0.12 是推荐依赖而非硬依赖","不会自动 ready 扫描 Actor；不修改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags","旧安装替换及角色迁移包含备份行为，与本项目无备份规则冲突。当前仅介绍已安装内容的使用和只读 Preview；执行这些旧写入流程前须先处理冲突，不能用隐藏副本绕过。","这是构建快照，不实时同步远程 homebrew、旧 side-data 或 Actor 变化；本地静态检查不等于真实游戏性验收","内容投影身份保持原已接受的 dnd5e 6.0.2，6.0.5 是本轮运行兼容目标；更新保留现有合集数据库，不重复生成或迁移。","Next 14.368／6.0.5 本轮只验证来源／内容身份、启用和现有三合集读取；四子职完整 Core／Modded 游戏性矩阵未执行。","Next 6.0.6内容身份与verified仍6.0.2；本轮四个临时3级角色的职业/子职授予、Item links/配方、普通重载和精确清理已接受，同一官方Archery来源的4条记录另有独立核对；不代表全等级、全部特性、渎魂分支的自动法术/契术位配置或生产通过。","只读Preview会比较当前说明、Activity和Effect，不把未更新的来源hash当成“没有手改”。旧角色名称/类型或其他无逐字段决策的变化会跳过并保留整个Item，须人工核对；本轮不执行旧角色Copy/Apply或备份。新建角色的受限职业授予链已单独验收。","旧写入迁移依赖副本和JSON备份，与当前无备份约定冲突；本轮只处理Preview，不运行实际Copy/Apply。无备份迁移方式和内容发行范围仍待明确。"],"keywords":["Blood Hunter","血猎手","职业","子职","迁移","Actor","Activity","Effect"],"sources":["foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md","README.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-blood-hunter-2024/"],"module":"fvtt-blood-hunter-2024","entryId":"fvtt-blood-hunter-2024","ownerDirectory":"foundry-modules/fvtt-blood-hunter-2024","foundryModuleId":"fvtt-blood-hunter-2024"},{"id":"fvtt-homebrew-species","title":"自制种族内容","category":"library","summary":"提供 accepted homebrew Species 的纯内容 Item 合集；V14 是运行目标，V12 产物只作为明确标记的静态候选。","when":"需要在精确 dnd5e v14 世界浏览或使用已接受的自制种族与种族特性时使用；V12 仅用于静态审阅。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","Foundry VTT 14.364 + dnd5e 5.3.3（运行包）","Foundry VTT 12.331 + dnd5e 4.3.9 + 2024 规则（仅 V12 static candidate）","新增精确Foundry14.368/dnd5e6.0.6受限Ogre原生授予/升级接受；内容身份、verified与其他环境边界保持不变。"],"steps":[{"title":"启用 V14 内容包","text":"在 Foundry 14.364 / dnd5e 5.3.3 世界启用模块，打开 Compendium 目录确认“Homebrew Species / 自制种族”和“Species Features / 种族特性”两个 Item pack 可读。"},{"title":"浏览种族与特性","text":"在两个 Item pack 中查看 Species 和 features；这是 content-only 模块，没有浏览器 JavaScript、socket、设置菜单、自动迁移或世界扫描。"},{"title":"按系统流程使用","text":"在 dnd5e 角色卡使用 Add Species（添加种族）流程，选择本模块的种族条目，再按提示应用特性。已授予角色的特性是快照，更新合集不会自动替换。"},{"title":"检查 V12 静态候选","text":"维护者需要 V12 候选时可运行下面的构建命令；构建会写入 dist/v12-candidate，不能称为只读操作。它不调用安装器，也不证明 V12 角色流程可用。","command":"bun run build:homebrew-species:v12-candidate"},{"title":"核对 V14 构建","text":"维护者可从仓库根目录运行 V14 构建检查；ledger、Markdown 和 target hash 任一过期都会 fail-closed。","command":"bun run build:homebrew-species"}],"outputs":["species Item pack 和 features Item pack","V14 target-specific 的文档、UUID、logical hash、coverage ledger 与确定性 ZIP","V12/12.331 candidate 构建及 supportStatus: static-candidate 身份标记"],"limits":["V14 产物精确绑定 Foundry 14.364 / dnd5e 5.3.3；V12 候选精确绑定 Foundry 12.331 / dnd5e 4.3.9 / Core / 2024","V12 candidate build/verify 不调用安装器，也不证明 Add Species、升级、HP/AC、次数、Long Rest 或重开读回","没有浏览器运行时、socket、自动迁移和世界扫描；ItemGrant 依赖本模块 features pack，已嵌入 Actor 的 Feature 不会自动更新","ledger、Markdown、package 或 target hash 过期时拒绝构建；静态构建与 LevelDB 校验不等于 Foundry runtime、生产或长期跑团验收","内容投影身份保持原已接受的 dnd5e 6.0.2，6.0.5 是本轮运行兼容目标；更新保留现有合集数据库，不重复生成或迁移。","Next 14.368／6.0.5 本轮只验证来源／内容身份和现有两合集读取；Add Species、升级和全部玩法未扩大验收。","14.368/6.0.6候选已从accepted ledger经正式Species构建/校验；Ogre的Large、零级授予、每级HP、速度、AC、暗视、脱困资源、长休和普通重载代表链已接受，内容身份与verified仍6.0.2。ASI授予存在但未观察属性分配生效，六项属性在本证据中仍为10；不宣称力量加值或完整升级自动化。"],"keywords":["自制种族","Species","种族特性","Compendium","ItemGrant","V14","V12 candidate"],"sources":["foundry-modules/fvtt-homebrew-species/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-homebrew-species/"],"module":"fvtt-homebrew-species","entryId":"fvtt-homebrew-species","ownerDirectory":"foundry-modules/fvtt-homebrew-species","foundryModuleId":"fvtt-homebrew-species"},{"id":"fvtt-house-rules","title":"本团村规","category":"play","summary":"以显式标签和 GM 权威为前提，提供治疗药水、生命骰、弹药、隐匿和自然 1/重击等村规辅助。","when":"希望把本团约定接入 dnd5e 原生骰子、Activity、状态和 Document API，同时保留 GM 裁定时使用。","requires":["精确配对14.364/5.3.3、14.368/5.3.3、14.368/6.0.2、6.0.5或6.0.6；606已完成药水代表链，具体接受范围见限制","活动 GM","药水和弹药上的显式 fvtt-house-rules flags（使用对应功能时）"],"steps":[{"title":"启用并确认默认状态","text":"在精确支持版本的世界中启用模块并重新加载；首次提示说明所有会修改数据的规则默认关闭。"},{"title":"由 GM 配置规则","text":"在 Foundry“配置设置 → 模块设置”中逐项启用需要的功能，并设置低属性阈值、自然 1 后果倍率/其他 RollTable UUID 和隐匿全速等级；这些世界设置只有 GM 可改。"},{"title":"准备显式标签","text":"在 Item 数据中使用 flags.fvtt-house-rules.potion 或 flags.fvtt-house-rules.ammo 写明药水骰、弹药 key 和 tier（0–3）。模块不从中文或英文名称猜测药水、弹药、武器或特性。"},{"title":"在跑团中调用助手","text":"使用 game.fvttHouseRules 的 GM API 或对应原生事件处理药水 preview/apply/restore、生命骰赌博、弹药记录/找回、隐匿提示和自然 1 后果；GM-only 卡片确认前不会执行伤害、反击或武器损坏。"},{"title":"运行规则检查","text":"维护者从仓库根目录运行模块测试；通过只代表规则投影与构建层检查，真实 Foundry 多客户端语义仍需单独回放。","command":"bun run test:house-rules"}],"outputs":["显式模块 flags、幂等事务 ledger 和 GM 世界设置","治疗药水的三个原生 heal Activity、生命骰与弹药账本、隐匿提醒","GM 确认的自然 1 后果卡和支持路径中的重击首颗伤害骰按满值投影"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片；所有修改由确定性的活动 GM 执行","缺少显式标签、来源不唯一、对象无权限或版本不精确时失败关闭；不会按名称猜测或扫描全世界","MIDI-QOL 14.0.11、DAE 14.0.12 和 Die So Nice 6.2.9 的扩展路径只在精确版本组合下使用，其他组合保持原生或失败关闭","弹药找回、自然 1 后果、武器修复和重击适配都不自动代替 GM 裁定；盲骰原始面值不写入模块 flags、消息或审计摘要","Next 14.368／6.0.5 本轮药水 Preview／Apply、手改保护／恢复和正常重载通过；不代表全部村规、可选 Midi／DAE 组合或多客户端玩法通过。","本轮额外修复 Midi local.10 的 Check／Save 请求来源加值，两次真实结果为 +4；这不把 House 的可选 Midi／DAE 兼容门改成全量放行。","2026-10-25在14.368/6.0.6接受药水Apply、完整schema2快照、三条治疗Activity、手改保护、Restore及普通重载；弹药、聊天卡和其他村规不因此获得新接受。未确认的可选Midi/DAE/Dice So Nice组合仍拒绝。","新候选串行处理同一药水的应用/恢复，写入前通过当前注册模型生成完整预期；缺模型、异步等待期间手改或权限变化时拒绝继续。恢复已完成但记录清理失败时，同页面只在Item/快照/原图均未变化下重试清理，不重复写Activity。6.0.6代表链的世界文档和设置恢复一致；旧验收账号的历史原像缺口保留在执行总账，不声称全User恢复。"],"keywords":["村规","治疗药水","生命骰","弹药","隐匿","自然 1","重击","GM"],"sources":["foundry-modules/fvtt-house-rules/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-house-rules/"],"module":"fvtt-house-rules","entryId":"fvtt-house-rules","ownerDirectory":"foundry-modules/fvtt-house-rules","foundryModuleId":"fvtt-house-rules"},{"id":"fvtt-injury-fading-spirits","title":"消逝的灵魂／独立复活","category":"play","summary":"以活动 GM 为权威管理独立复活仪式、快速复活锁和回归历史；伤势由 Custom Conditions 管理。","when":"需要 Critical Role 风格的复活仪式、参与者贡献和 GM 裁定记录时使用。","requires":["独立复活精确配对14.364/5.3.3、14.368/5.3.3、14.368/6.0.2、6.0.5或6.0.6；606已接受有CC和无CC的普通复活代表链，其他模式与角色边界见限制","活动 GM；玩家通过原生贡献检定参与","如需伤势，另外启用配套的新 Custom Conditions 和 Trigger Engine；复活自身不依赖这两个模块"],"steps":[{"title":"启用独立复活模块","text":"在精确支持的版本中启用“消逝的灵魂”。兼容模块 ID 仍为 fvtt-injury-fading-spirits；旧 enabled/manageNpcs 设置只供伤势设置迁移，不再在本模块打开伤势规则。"},{"title":"选择 Actor 并打开复活面板","text":"GM 在 Actor 目录条目右键选择“消逝的灵魂”，或先选中 Token 后在聊天输入 /ifs。核对 Actor 后选择快速、普通或最终仪式。没有 Custom Conditions 时仍可独立复活。"},{"title":"填写并确认仪式","text":"普通或最终仪式最多填写三名不同参与者及其技能、DC 和优势。模块创建原生贡献请求；GM 确认每项贡献、灵魂意愿和最终结算。最终和快速检定使用 blindroll；长期历史不保存盲骰原始值。"},{"title":"处理回归与下一次死亡","text":"成功复活记录回归历史，实际 HP 由对应法术或 Activity 恢复。Custom Conditions 正在管理伤势时，经公开接口抑制该次恢复计层。新死亡 episode 重置本次快速复活锁和消费标记，使后续死亡仍能开始新的复活。"},{"title":"核对历史及兼容入口","text":"原有伤势 flags 和复活历史保留；复活模块后续只写 fadingSpirits 子路径。旧 setInjury/withInjurySuppressed 接口转交 Custom Conditions；缺少该模块时明确报错，独立复活入口仍可用。"}],"outputs":["Actor fadingSpirits 中的复活尝试、锁定和历史","原生贡献请求与盲骰结算消息","供可选 Custom Conditions 调用的死亡 episode 和恢复抑制桥接"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","伤势的 0–3 层、HP／休息规则、自然 19/20 和状态管理入口现属于 Custom Conditions；本模块的旧 injury flags 只保留兼容数据。","灵魂意愿、贡献是否成功、环境例外和复活 HP 仍由 GM 与对应法术或 Activity 决定。","Custom Conditions未安装、未启用或状态未知时，独立复活不会增加或清除伤势；UI不使用未启用模块遗留的接口，旧伤势管理入口需要已启用配套模块。","Next 14.368／6.0.5 已验证独立复活基础链、快速复活与新 Custom Conditions 伤势联动；其他仪式、玩家贡献分支、多 GM 和长时运行仍须单独验收。","本地 Lab 接受不代表生产部署或长时跑团接受。","精确14.368/6.0.6已接受CC当前死亡阶段协作，以及有CC和无CC两种组合下的普通复活代表链：原生贡献检定、GM裁定、一次真实盲骰、旧卡无重复结算、普通重载及下一死亡阶段保留历史。对应测试对象均已清理；其他复活模式、死亡豁免扩展、玩家／多GM和长时／生产仍待专门验收，不自动修复历史力竭数据。","写入前核对Actor当前版本和已有复活历史；无法完整保留的旧历史／贡献、未知整块复活值或未来版本会明确拒写。GM应先核原始记录，不清空旧数据重试；合法旧默认字段可补齐，旧伤势原件保留。6.0.6有CC和无CC代表例均已实际验证未来版本拒绝且Actor零写入。"],"keywords":["伤势","消逝的灵魂","复活","死亡豁免","倒地","Actor flag","活动 GM"],"sources":["foundry-modules/fvtt-injury-fading-spirits/README.zh-CN.md","foundry-modules/fvtt-injury-fading-spirits/CREDITS.md","docs/reviews/2026-09-22-condition-hud-localization.md","docs/reviews/2026-09-23-existing-condition-icons.md","docs/reviews/2026-09-23-condition-tooltip-native-layout.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md","docs/plans/2026-10-02-injury-condition-ownership.md"],"watch":["foundry-modules/fvtt-injury-fading-spirits/"],"module":"fvtt-injury-fading-spirits","entryId":"fvtt-injury-fading-spirits","ownerDirectory":"foundry-modules/fvtt-injury-fading-spirits","foundryModuleId":"fvtt-injury-fading-spirits"},{"id":"fvtt-trigger-engine","title":"Trigger Engine / 通用触发器引擎","category":"play","summary":"由活动 GM 执行的通用 Actor 更新、回合开始和回合结束事件引擎；把稳定的 before/after 上下文交给宏或其他模块。","when":"需要把“什么时候触发”从具体规则模块中拆出来，用配置组合 Actor 更新、Combat 回合事件、结构化条件和现有宏时使用。具体状态规则由独立模块拥有。","requires":["精确配对14.364/5.3.3、14.368/5.3.3或14.368/6.0.5、6.0.6；各目标只接受已记录的功能范围","活动 GM","每个 Run Macro 动作对应的世界 Macro UUID","消费模块通过 api.subscribe 接收通用事件；伤势规则由 Custom Conditions 拥有","14.368/6.0.6的首次保存、单GM事件和CC伤势消费已有代表接受；其他分支见限制，不自动升级其他环境。"],"steps":[{"title":"打开 Trigger Manager","text":"以 GM 启用模块后，在模块设置中打开 Trigger Manager。配置保存在 world setting 中，读取和写入都会校验 schema；无效触发器不会进入运行时。"},{"title":"核对保存限制","text":"当前重构候选会保留无法安全改写的旧设置。原定义含不支持的 schema、无效条目、未知字段或冲突的旧格式字段时，可阅读能够识别的定义，保存会被拒绝并显示原因，编辑框中的输入也会保留；先核对原数据后再编辑。"},{"title":"定义 Actor 或 Combat 事件","text":"新建触发器，选择 Document Update / Actor，并填写需要观察的 watched paths，例如 system.attributes.hp.value。路径匹配同时识别点路径、嵌套对象以及父子路径相关更新。"},{"title":"选择回合生命周期","text":"Combat Turn Start 和 Combat Turn End 不需要 watched paths。它们只在正向 Combat 生命周期中发出，并以 Combat、回合和 combatant 上下文交给 active GM。"},{"title":"组合结构化条件","text":"条件组选择 ALL 或 ANY；每项从 before 路径、after 路径或 literal 取值，再使用 eq、ne、gt、gte、lt、lte 比较。v1 不执行任意 JavaScript 条件。"},{"title":"添加 Run Macro 动作","text":"为动作填写 Macro UUID。命中后活动 GM 按顺序执行宏，并通过 macro.execute({ triggerContext }) 传入触发器 ID、Actor、before、after、changes、userId、时间戳与安全回写入口 updateDocument(changes, options?)。宏若要回写当前 Actor，应使用这个入口保留因果链。单个触发器内动作失败会停止该触发器剩余动作，其他触发器仍可继续。"},{"title":"接入其他模块","text":"其他模块通过 api.subscribe(listener) 筛选通用事件；伤势的 HP 更新由 Custom Conditions 消费。外部武器事件使用独立 publishExternal/subscribeExternal 公开接口，版本与能力可查询。Trigger Engine 不导入消费者私有实现，也不替消费者裁定伤势或复活。"}],"outputs":["world setting 中经过校验的 TriggerDefinition 列表","Actor 更新时稳定的 before / after / changes TriggerContext","由确定性活动 GM 顺序执行的 Macro 动作"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","当前 Document Update、Combat Turn Start 和 Combat Turn End 都只支持 Actor 文档；schema 保留 documentType 以便后续扩展","v1 只有结构化 ALL/ANY 比较条件与 Run Macro 动作，不提供任意 JavaScript 条件、Convenient Effects 或 Effect Macro 依赖","同一客户端的定义改动按顺序保存；多个客户端或其他工具直接改同一项设置仍可能冲突。当前T1/T2构建已接受606的正常首次保存和读回；未知schema／旧数据保存保护另有局部反例，不代表已在真实世界写入过异常数据。","执行权限定为当前活动 GM；等待订阅者、回合回调或宏解析后重新验权，失去执行权即停止后续分发或动作。updateDocument 回写时也重新验权；已经开始执行的用户宏无法被中断，直接文档写入仍须自行验权。同一 Actor 的更新按观察顺序排队并保留 before/after；updateDocument 携带祖先因果链以阻止递归，不覆盖 Actor.update；world setting 广播刷新客户端缓存","本地测试和构建只能证明配置、求值和调用契约；任意真实世界宏副作用仍需在精确 Foundry 版本中单独验收","Next 14.368／6.0.5 已验证 Actor／Combat 限定事件、活动 GM 分发、去重和回合顺序及 CC 消费；不据此推断任意宏、多 GM 或长时运行通过。","精确14.368/6.0.6已接受正常首次保存、管理器、单GM禁用／不匹配零动作与匹配一次、退订、普通重载和精确清理；另已接受CC的HP／伤势消费。WMP Slow外部攻击消费代表链另见WMP条目；多GM及完整Combat分支仍待验。API和定义身份保持0.2.0；只监视HP的定义不因Token移动Actor flag执行，局部反证已覆盖。"],"keywords":["Trigger","触发器","Document Update","Actor","Macro","before","after","自动化"],"sources":["foundry-modules/fvtt-trigger-engine/README.zh-CN.md","docs/runbooks/custom-conditions-and-trigger-engine-usage.md","docs/plans/2026-10-02-injury-condition-ownership.md"],"watch":["foundry-modules/fvtt-trigger-engine/"],"module":"fvtt-trigger-engine","entryId":"fvtt-trigger-engine","ownerDirectory":"foundry-modules/fvtt-trigger-engine","foundryModuleId":"fvtt-trigger-engine"},{"id":"fvtt-custom-conditions","title":"Custom Conditions / 自定义状态","category":"play","summary":"集中管理十九种带参数的自定义状态，以及独立的 0–3 层伤势；通过 Trigger Engine 接收 Actor 和 Combat 事件。","when":"需要 Drakkenheim 自定义状态或伤势规则时使用；复活仪式由可选的消逝灵魂模块独立提供。","requires":["十九状态、伤势与武器效果精确配对：Foundry14.364/dnd5e5.3.3、Mirror14.368/5.3.3，或ServerNext14.368/6.0.5、6.0.6；各目标的实际接受范围见限制","交叉配对、其他版本和其他系统拒绝；按 dnd5e 系统版本选择原生武器效果写入，不能仅凭 Core 14.368 判断为 6.x。Next 原生 Slow 写入已有与 WMP 联合的限定实机证据","GM / active GM","已安装并启用配套 Trigger Engine；伤势不要求消逝的灵魂","14.368/6.0.6已接受两种状态、普通重载和原生HP／短休伤势代表链；不自动升级其他环境或全部状态组合。"],"steps":[{"title":"启用两个模块","text":"在精确支持版本的世界启用 Trigger Engine 和 Custom Conditions。Custom Conditions 通过 Trigger Engine 的公开事件接口接收 Actor 更新、回合开始和回合结束。"},{"title":"打开状态管理器","text":"以 GM 选中或标记 Token，从模块设置或 Token 控制栏打开“管理自定义状态”。面板可以对目标施加、编辑、停用和解除状态。"},{"title":"启用并管理伤势","text":"在 Custom Conditions 的模块设置中打开“启用伤势自动化”，按需打开“管理 NPC 伤势”；新世界默认关闭。升级时沿用旧模块已有开关，不自动扩大管理范围。在管理器伤势区域调整 0–3 层，或在 Token HUD 左键增加、右键减少；Token Action HUD 显示当前层数。倒地后第一次恢复正 HP 增加一层，恢复满血或成功短休／长休清除，保留的自然 19／20 清零死亡计数并恢复 1 HP；第三层倒地仍由 GM 裁定。"},{"title":"填写状态实例参数","text":"骰式来自施加状态的特性。Bleeding 与 Burning 跨来源只采用较高值，以骰式平均值比较，平手保留现有值；Burning 的伤害类型跟随胜出者。两者默认在自身回合结束时结算。Frozen 使用 escapeDC；Jinxed 与 Valor 使用各自骰式；Token Action HUD 以 6、4 等数字显示 1d6、1d4 的骰子面数，复合骰式显示紧凑式，过长时角标截短，完整式在管理器可查，不代表掷骰结果。"},{"title":"使用生成的物品模板","text":"生成器会在物品 ActiveEffect 中写入 flags.fvtt-custom-conditions.condition 模板。施加模板后模块生成新的 Actor 实例 ID，手工施加和生成来源使用同一套 schema。"},{"title":"用动作尝试解除 Frozen","text":"点击 Frozen 行的“破冰（动作）”按该实例 DC 做力量（运动）检定。默认由目标自己尝试；标记目标并另选中一名生物即可协助，GM 确认接触范围。完成检定后消耗动作，成功解除；取消不消耗。"},{"title":"阅读状态说明与管理伤势","text":"状态名称和悬停说明随 Foundry 界面语言显示中文或英文。Token Action HUD 的完整提示采用 dnd5e 规则卡布局，标题、状态类别与分段正文分开，图标保留在 HUD 按钮；仅名称和无提示模式仍由 TAH 设置控制。十九种自定义实例各采用选定的 Game-icons.net SVG；笨拙用 Drop Weapon，踉跄用 Foot Trip，署名和 CC BY 3.0 许可见模块包内 CREDITS.md。全部 19 项使用 fvtt-custom-conditions.\u003c条件 ID> 独立状态 ID；自定义 Dazed 的 HUD 标题只显示恍惚或 Dazed，仍与 MCDM 同名状态分开。五个必填参数状态点击后打开绑定当前 Actor、预选状态的管理器，其余十四项通过 Custom Conditions API 切换带模块 flag 的实例；Frozen 和 Shocked 的子状态由复合来源提供时不重复创建，多来源在管理器中处理。伤势由本模块的独立分层区域管理，不要求复活模块；启用可选的消逝灵魂模块后，区域另提供复活仪式入口。旧伤势数据原件保留，新伤势写入本模块 flags；复活历史继续归复活模块。伤势使用此前选定的 Bandaged 原图，层数由状态标签显示。"},{"title":"判读几个容易混淆的状态","text":"本模块的恍惚在自己的回合可从自主移动、动作、附赠动作中选择一种；选定后不能再执行另两种，但不额外禁止反应。震愕继承恍惚的三选一规则，同时使针对目标的攻击检定有优势、掉落手持物品；拿取、拔出或收起物品仍需要动作。三选一是本项目按用户决定调整的规则，不宣称为 Drakkenheim 正式文本。Frozen 的特殊重击限于使用造成钝击伤害的武器命中目标；不是任意钝击法术或普通徒手打击。英勇在攻击检定或豁免检定时加上实例骰值，厄运减去骰值；虚弱使武器攻击或法术伤害总值减半，实际应用到 HP 时向下取整，聊天表达式仍可能出现小数。踉跄在自己的回合最多完成一次武器或徒手攻击；加入徒手是本项目相对可公开核对的 Beta 文本所作扩展，正式版 Appendix C 尚未逐条核对。"},{"title":"区分原生状态与自定义入口","text":"选中单个 Token 后展开 Token Action HUD 的效应组：dnd5e 原生「失血」是裸 bleeding，本模块「流血」是 fvtt-custom-conditions.bleeding；原生「燃烧」是裸 burning，本模块「灼烧」是 fvtt-custom-conditions.burning。GM 点击流血、灼烧、冻结、厄运或英勇只会打开固定该 Actor、预选对应状态的管理器，不会直接施加空参数状态；填写必填骰式、伤害类型或解除 DC 后再施加。其余十四项使用模块 API 切换。本轮 CoTN 页面已确认十九个自定义入口各显示一次，也确认点击流血打开绑定 Actor、预选流血的空参数管理器；其余按钮尚未逐项点击或结算。旧 TAH 布局的 action ID 隐藏和排序偏好不保证自动迁移。"}],"outputs":["Actor 上带参数的 Custom Conditions ActiveEffect 实例","物品上的可重复使用 Condition 模板","由 active GM 和 Combat 事件驱动的流血、灼烧等结算","本模块 injury flags 与分层伤势投影；保留旧伤势原件"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","本期包含 Addled、Bewildered、Bleeding、Burning、Clumsy、Dazed、Defenseless、Distracted、Enfeebled、Frozen、Helpless、Immobilized、Jinxed、Shocked、Sickened、Slowed、Staggered、Valor 和 Weakened","Bloodied 使用 dnd5e/FVTT 原生能力；Drakkenheim Madness 与 Contamination 不在本期目录","距离、环境和坠落落点由 GM 结合地图裁定；模块不会把不明确的来源规则猜成自动化","Immobilized/Frozen 拦截拖拽、方向键以及非 GM 的 HUD/配置位置编辑；GM 坐标编辑和 API 强制位移保留用于裁定，不消耗 Dazed 自主移动选择","恍惚／震愕三选一的普通顺序行为由回合旗标拦截；攻击异常或后续 Hook 否决可能保守限制到回合结束。跨客户端同时控制同一 Actor、两个非攻击活动弹窗交错完成尚未保证严格互斥","5.3.3的历史CoTN组合接受来自server-mirror/30001；历史fvtt-v14-module-matrix隔离E2E和其他版本不能替代它。当前6.x重构使用独立ServerNext，具体状态/伤势/武器链仍按该目标的实际接受记录判断；键盘长按路径未验收","构建、单测和安装 hash 不能代替 Foundry v14.364 中的真实 UI、Combat、ActiveEffect 和骰式运行时验收","自定义名称保持原样；更改界面语言后重载。原生失血/燃烧按钮不等于已配置骰式的自定义流血/灼烧。CoTN 的全 19 项入口可见性已单独验收；其余 18 项点击及本轮逐项玩法结算未执行，构建或单测不替代该结果。","伤势为运行时分层 condition，未加入生成器的十九种 ConditionId；本轮不新增伤势 Actor JSON 生成功能。","旧数据冲突、未知 schema 或重复伤势投影会停止自动迁移并提示；先由 GM 核对，模块不会任意删除或选择一个值。","新 Custom Conditions 与仍写伤势的旧复活模块同时启用时，伤势自动化拒绝运行；须使用配套新版本。","6.0.5已有伤势／休息、状态实例、选定检定／攻击／伤害、特殊暴击、真实HP与回合结算、移动／冰冻逃脱、行动限制／攻击次数／装备动作，以及真实HUD参数提交／病弱开关与原值恢复接受。AC5e14.603.2限定适配已验。Next原生武器Slow的system.changes写入、强弱接替及WMP同卡伤害后的一条原生Slow已实机验证；旧5.3.3写法保持。十九状态的全部动作组合仍未逐项验收。自有玩法夹具、文档等价包安装和限定重载读回已闭合；个人HUD旧坐标、孤立旧Setting历史及一处外来Scene旧完整来源未捕获，不声称全部历史字节复原。","精确14.368/6.0.6已接受Addled／带参数Frozen的施加、启停、管理器、普通重载、外来效果保护和精确清理；自然启用伤势时，原生HP20→0→1计一层、原生短休清层，并同步IFS当前死亡episode且历史不变。WMP Slow及IFS普通复活的消费代表链另见各自条目；其他攻击模式、十九状态全部组合、完整复活及多GM仍待验；socket stop/restart只有局部测试证据，旧目标证据保持原范围。"],"keywords":["Custom Conditions","自定义状态","Bleeding","Burning","Frozen","Jinxed","Valor","ActiveEffect","参数化","伤势","Injury","分层状态"],"sources":["foundry-modules/fvtt-custom-conditions/README.zh-CN.md","foundry-modules/fvtt-custom-conditions/CREDITS.md","docs/runbooks/custom-conditions-and-trigger-engine-usage.md","docs/reviews/2026-09-22-condition-hud-localization.md","docs/reviews/2026-09-23-existing-condition-icons.md","docs/reviews/2026-09-23-condition-tooltip-native-layout.md","docs/reviews/2026-09-23-drakkenheim-condition-wording.md","docs/reviews/2026-09-23-cotn-burning-hud.md","docs/reviews/2026-09-24-custom-burning-hud.md","docs/reviews/2026-09-24-all-custom-condition-hud-audit.md","docs/plans/2026-10-02-injury-condition-ownership.md"],"watch":["foundry-modules/fvtt-custom-conditions/"],"module":"fvtt-custom-conditions","entryId":"fvtt-custom-conditions","ownerDirectory":"foundry-modules/fvtt-custom-conditions","foundryModuleId":"fvtt-custom-conditions"},{"id":"fvtt-json-forge","title":"FVTT JSON Forge","category":"convert","summary":"在一个GM工作台里编辑生物蓝图、导入标准资料或AI整理，核对可读预览后创建生物/物品；战斗包单独审核与启动。","when":"已经打开 Foundry，希望直接把结构化资料或原始文本整理成世界中的 Actor/Item 时使用。","requires":["Foundry14.364或14.368/dnd5e5.3.3/core；创建前绑定真实当前版本、GM和来源/产物身份","dnd5e 5.3.3","GM","规范来源、原始文本或手工填写的生物蓝图；蓝图/标准资料无需AI","AI 模式的客户端 Provider、协议、模型和 API Key（仅使用 AI 时）"],"steps":[{"title":"从目录打开工作台","text":"Actor目录使用“Forge 生物”，Item目录使用“Forge 物品”。同一目录重复打开聚焦同一窗口；AI连接设置独立共享。"},{"title":"选择输入方式","text":"生物可选手工蓝图、标准资料、AI整理；物品保留标准资料和AI整理。标准资料可粘贴或读取Markdown/TXT。各模式保留草稿，切换不会把复杂来源自动改为蓝图。"},{"title":"编辑蓝图并核对预览","text":"蓝图库在左、编辑在中、独立预览在右。基础/能力/变体/审阅页不会隐藏预览。草稿预览标明未验证；生成并验证后才显示正式artifact。未知运行数值不猜填。"},{"title":"审核并确认创建","text":"AI资料先分析再生成审核；蓝图或标准资料直接正式生成验证。只有当前accepted结果可以确认创建，随后回读并可打开卡片。同源复用；编辑或切换使旧候选失效，提交期间不能切换或关闭。"},{"title":"保存草稿与派生","text":"蓝图来源按当前世界/GM保存，刷新重开需重新生成。派生使用新身份、记录父来源与字段差异，不覆盖原生物。AI页面“更多工具”保留来源库、历史和批量。"},{"title":"使用战斗包","text":"生物工作台的“战斗包”打开专用审核。导入角色与宏之后由GM明确启动；来源、绑定、固定能力限制和旧资料保护继续生效。"}],"outputs":["带 Forge source/artifact identity 的 Foundry Actor 或 world Item，以及创建后的 readback 结果","正式验证、审阅、诊断、来源库、Collection 和可恢复队列数据","按 sourceId 派生的确定性 Document ID 和重复复用状态","人类MD路径可生成多个独立Actor、一份绑定宏及来源审核记录；每次召唤在场景中创建独立指示物。","可重新编辑的版本化生物蓝图、规范中文来源、父子派生差异与2024格式可读预览"],"limits":["0.5.0统一候选已于2026-10-05通过Mirror14.368/5.3.3的工作台、蓝图、标准Actor/Item创建回读及精确清理；本轮未调用真实Provider、未重跑原生战斗或启动战斗包，尚未远端发布。","本轮兼容候选只允许精确 Foundry 14.364 或 14.368 / dnd5e 5.3.3 / core profile，且所有创建入口只允许 GM；manifest 区间不表示中间 Core 版本均受支持。","不支持 OCR、PDF、图片 Intake、update/overwrite、按名称合并、embedded Item 产品入口或跨 Document 原子事务","API Key 默认只在当前页面内存，显式持久化时也只写当前浏览器 local storage；不会进入世界 Document、Chat、review bundle、Collection、日志或响应","页面关闭后不会继续 AI/HTTP；本地构建或 Lab 结果不等于目标世界 runtime、生产或四小时真实会话验收","AI不编写宏代码。固定入口仅调用模块内已实现能力；旧式脚本包仍需独立代码审核。导入不自动启用，关闭控制面板也不等于停用。","本地已测守护真实减伤和耗尽削弱；重复腐化证据部分通过，按用户决定留待独立状态设计。Dazed修复专项和浏览器完整AI生成链尚未复验。","人类MD模板可用于不同生物；自动化仅限已实现能力形态，不保证任意召唤数量、触发或机制均支持。","Actor蓝图保留来源HP；场上NPC Token重掷HP遵从世界设置，控制器不覆盖。已有其他来源的启用状态不由控制器接管或提前结束。","手工蓝图目前限有界攻击/豁免组件；不支持自动CR平衡、完整施法/传奇/巢穴编辑，也不把复杂AI资料自动降格为蓝图。"],"keywords":["Forge","Actor","Item","Intake","structured","review","accepted","readback","蓝图","派生","草稿","工作台","statblock"],"sources":["foundry-modules/fvtt-json-forge/README.zh-CN.md","tools/forge-encounter/README.md"],"watch":["foundry-modules/fvtt-json-forge/"],"module":"fvtt-json-forge","entryId":"fvtt-json-forge","ownerDirectory":"foundry-modules/fvtt-json-forge","foundryModuleId":"fvtt-json-forge"},{"id":"fvtt-selected-token-sync","title":"框选 Token 同步","category":"play","summary":"把一个 Token HUD 发起的核心状态和 Foundry v14 movementAction 同步到当前选中的其他 Token。","when":"需要对一组 Token 同时切换状态或移动方式，并希望保留每位用户独立的开关时使用。","requires":["Foundry VTT 14.368","dnd5e6.0.5–6.0.6的0.2.0 Next候选；606 GM HUD/帮助限定切片已接受，角色与第二客户端仍有边界","至少两个可控制且可更新的 Token","当前用户拥有对应 Actor/Token 权限"],"steps":[{"title":"启用模块","text":"在精确支持版本的世界启用 Selected Token Sync；模块不会要求 libWrapper，也不修改 Foundry 或 dnd5e 原型。"},{"title":"打开同步开关","text":"在 Token 场景控制栏打开“框选 Token 同步”。这是每位用户独立保存的 client setting，默认关闭；开关打开时模块会拒绝与已启用的 multistatus 同时工作。"},{"title":"查阅帮助","text":"点击 Token 控制栏的“框选 Token 同步帮助”问号按钮。GM 在统一操作手册合集已启用且接口可用时定位本条目；玩家或合集不可用时打开随包只读说明。同步关闭或 multistatus 冲突时也能阅读，帮助不会切换开关或修改角色/Token。"},{"title":"框选同步集合","text":"在画布上选中需要同步的多个 Token；模块以点击 HUD 时的选择为准，并对同一个 linked Actor 去重。"},{"title":"从一个 HUD 发起操作","text":"打开选中集合中一个 Token 的 HUD，点击普通状态图标或 movementAction。疲乏等分级状态左键使每个不同 Actor 各加一级、右键各减一级，保留原有等级差异并限制在 0 到系统上限。"},{"title":"关闭并核对字段","text":"再次关闭工具栏开关即可恢复单Token行为；选择“默认”时TokenDocument的movementAction为null，角色各移动速度保持原值。"}],"outputs":["选中 Token 的普通 Active Effect 状态和 overlay 同步；分级状态按各 Actor 增减一级","选中 Token 的 movementAction 批量更新","按 Token/Actor 去重并带权限失败提示的同步事务","统一手册中的本模块条目，或模块随包的同源只读说明"],"limits":["仅处理 Token HUD 核心状态按钮和 v14 movementAction；物品、法术、DAE、MIDI-QOL 或其他模块直接产生的 ActiveEffect 不会触发同步","移动同步只更新 TokenDocument movementAction，不修改 Actor 移动速度；分级状态调用 dnd5e 正常 API，由系统同步状态数据","同步由发起操作的当前客户端执行，权限不足或对象不唯一时会停止；multistatus 启用时模块会拒绝同步模式","0.2.0 候选仅声明Foundry14.368与dnd5e6.0.5–6.0.6；单测、构建和安装检查不代替真实HUD/多客户端回放，旧0.1.0安装不随之更改。","运行上限扩至6.0.6，verified保持6.0.5；每Actor分级边界、普通/叠层状态、fly/default-null movementAction、GM帮助、同GM两客户端状态同步和玩家帮助可读/权限拒绝边界已在限定切片接受；当前实装帮助文本尚未同步最新验收说明。完整玩家同步写入和长时会话仍未验收。日历原位置缺失，当前核对位置已保留并记录缺口，不能说已恢复；该选择只涉及侧栏/窗口尺寸/日历位置等纯界面偏好，不涉及角色数据、功能设置、权限或Hotbar。","本轮候选在首次创建力竭效果后等待原生同步，避免快速连续加级被覆盖；同步未完成时暂停后续分级操作。先核对角色当前状态，再关闭并重新打开同步开关；这项修复的局部测试、6.0.6限定GM HUD/同GM第二客户端读回和玩家权限边界已分别记录，不能代替玩家写入或完整角色矩阵。","统一合集窗口目前仅供GM使用；玩家直接阅读本模块随包说明，不因此获得同步或文档权限。6.0.6 GM帮助入口、同GM两客户端状态同步和玩家帮助可读/权限拒绝边界已在限定切片读回；当前实装帮助文本尚未同步最新验收说明，完整玩家同步写入和完整角色矩阵仍待。"],"keywords":["Token","HUD","框选","状态","overlay","movementAction","multistatus","帮助","统一手册"],"sources":["foundry-modules/fvtt-selected-token-sync/README.zh-CN.md"],"watch":["foundry-modules/fvtt-selected-token-sync/","packages/suite-handbook/"],"module":"fvtt-selected-token-sync","entryId":"fvtt-selected-token-sync","ownerDirectory":"foundry-modules/fvtt-selected-token-sync","foundryModuleId":"fvtt-selected-token-sync"},{"id":"monster-spell-resolver","title":"怪物法术解析器","category":"convert","summary":"读取生成 Actor 的可移植法术清单，在目标世界可读的 dnd5e Item pack 中选择法术，并安全水合模块拥有的 Spell 与 Cast Activity。","when":"生成 Actor 已携带有效 spell manifest，需要把便携法术引用解析到当前世界的具体法术资料包时使用。","requires":["精确配对14.364/5.3.3、14.368/5.3.3、14.368/6.0.2、6.0.5或6.0.6（606仅接受限定 Rat NPC 运行链）","GM/活动 GM 权威","带有效 spellManifest 的生成 Actor","至少一个已启用且可读取的目标世界 dnd5e Item 法术包"],"steps":[{"title":"启用并等待来源索引","text":"在精确支持版本的世界启用模块；世界 ready 时模块读取已启用且可读的 Item pack 并建立来源索引。来源不可读、规则元数据无效或运行时不兼容时保持禁止写入。"},{"title":"配置来源优先级","text":"在“游戏设置 → 模块设置”打开“目标世界法术解析器”，按包 ID/合集 ID 调整来源顺序，查看 2024/2014 计数和诊断，并在来源变化后点击“重建来源索引”。"},{"title":"查阅使用帮助","text":"在“目标世界法术解析器”设置窗口点击“使用帮助”。GM 在统一手册合集已启用且接口可用时定位本条目，否则打开模块随包说明；点击帮助不会保存设置、重建索引或执行水合。"},{"title":"解析带清单的 Actor","text":"在带有效 spellManifest 的 Actor 目录条目中使用标题栏或右键菜单的“解析或重新解析法术”；创建或更新这类 Actor 时也可能由模块排队处理。普通无 manifest Actor 不会被扫描。"},{"title":"处理人工检查","text":"若出现法术解析检查窗口，选择一个具体目标法术来源；对模块管理内容的人工修改逐项选择“保留人工修改”或“用生成内容覆盖”，关闭窗口等同取消。"},{"title":"查看结果与回退","text":"从同一 Actor 菜单查看解析报告、来源、导出诊断或撤销上次水合；状态为 hydrated 只表示模块拥有缓存投影已完成，原生 Cast 的攻击、豁免、目标、消耗仍需单独使用验证。"}],"outputs":["Actor 内模块拥有的 embedded Spell 和与生成 feature 关联的 Cast Activity","spellResolution 状态、来源选择、投影差异、报告和撤销快照","目标世界来源索引的包信息、规则计数、哈希和阻断诊断","统一手册中的本模块条目，或独立使用时的同源只读说明窗口"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片；只有有效便携 manifest 的 Actor 才有资格处理","只修改模块拥有的 embedded Spells 和明确关联的 Cast Activities，不按名称扫描全世界，不修改 Compendium、Foundry/dnd5e 原型或生成阶段 manifest","水合按 Actor 全有或全无执行，中途失败尝试补偿回滚；人工 Keep/Overwrite/Cancel 未完成时不会 Apply。保存被拦截或不完整时报告提交失败；恢复只替换本模块记录，残留差异仍会报告。ServerNext 6.0.6 已在一个 Rat NPC 样本的原生角色卡上验证十条法术与对应施法入口；完整法术库、全部活动、玩家、长时和生产不在范围内。","portable/static manifest、目标世界 hydration、native Cast runtime 和生产接受是不同层级；单测、build 或 hydration 成功不能替代后两层","Next 14.368／6.0.5 本轮十法术自动水合的完整归属及正常 UI Undo／重载后 pending／零缓存通过；本轮没有 Review／Apply 点击，完整原生 Cast 矩阵未执行。","精确14.368/6.0.6已验证十条法术的来源、缓存和生成施法入口逐一对应。在当前含 Midi-QOL 的组合中，迷踪步经正常使用窗口消耗一次资源；撤销上次水合后回到待处理状态，法术缓存和生成施法入口均清除，普通重载后保持。实际传送落点、无Midi-QOL的组合及其他法术／活动仍须分别验证。","本例测试角色、消息和取证工具已清理，原世界内容、已采范围内的设置和账号／场景状态读回通过；未声称所有历史设置值都完成比较。精确范围与既有恢复缺口见支持记录。","新帮助入口仅供GM阅读；模块随包窗口及统一手册定位仍需真实Foundry界面验收，不扩大水合、权限或原生施法的已接受范围。"],"keywords":["怪物","法术","spell manifest","水合","Cast Activity","2024","2014","来源索引","帮助","统一手册"],"sources":["foundry-modules/monster-spell-resolver/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/monster-spell-resolver/","packages/suite-handbook/"],"module":"monster-spell-resolver","entryId":"monster-spell-resolver","ownerDirectory":"foundry-modules/monster-spell-resolver","foundryModuleId":"fvtt-json-generator-spell-resolver"},{"id":"open-session-deck","title":"开放式跑团副屏","category":"play","summary":"GM-only 的队伍与遭遇操作台，可在 Foundry 主窗口或同会话浏览器副屏查看并处理跑团状态。","when":"GM 需要第二块显示器上的队伍、遭遇、先攻和回合操作，同时不想启动第二个 Foundry 客户端时使用。","requires":["精确配对14.364/5.3.3、14.368/5.3.3、14.368/6.0.2、6.0.5或6.0.6；6.0.6已接受GM的HP、力竭、同会话副屏及限定角色权限边界，其他能力以已记录范围为准","GM","用于队伍来源的世界级 Actor 文件夹","允许浏览器打开同会话弹窗（使用副屏时）"],"steps":[{"title":"启用并确认 GM 入口","text":"在精确支持版本的世界启用模块并以 GM 进入；Token 场景控制栏会出现“开放式跑团副屏”按钮，模块也注册 GM-only 的 toggleDeck 快捷键。"},{"title":"打开操作台","text":"点击 Token 控制栏的表格图标打开上次使用的面板或副屏模式；如果弹窗被浏览器阻止，模块会回退到 Foundry 内面板。"},{"title":"核对当前版本和可用操作","text":"面板与同会话副屏的标题区域会显示实际 Core／dnd5e 版本配对及支持状态；将鼠标悬停在不可用的直接编辑输入上可查看原因。界面操作失败时会显示错误提示。"},{"title":"查阅帮助","text":"在面板或同会话副屏工具栏点击“帮助”；已启用且接口可用的合集会定位本条目，否则打开Deck随包的只读说明。帮助不会启动游戏操作。"},{"title":"设置队伍来源","text":"在操作台的队伍设置层选择世界级 Actor 文件夹，并决定是否包含子文件夹；保存后成员和临时同行 NPC 会按文件夹重新计算。"},{"title":"处理队伍与遭遇","text":"在队伍/遭遇页查看当前、基础和临时 HP、AC 修正、激励、力竭、状态、专注和死亡豁免；GM 可批量处理 HP 与显式状态、编辑/交换小数先攻、投掷缺失 NPC 先攻、切换回合和定位主画布 Token。"},{"title":"使用同会话副屏","text":"点击打开副屏后将窗口移到第二显示器；它由 GM 已登录会话渲染，关闭副屏或切回面板不会创建第二个世界连接。"}],"outputs":["Foundry 内 ApplicationV2 队伍/遭遇面板","同会话浏览器 popout 的队伍占位、NPC 操作卡和回合信息","通过原生 dnd5e Actor、Token 和 Combat API 完成的 GM 状态更新","统一手册中的Deck条目，或独立模块的随包只读帮助窗口"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片，所有 UI 入口和命令都重新检查 GM 权限","玩家先攻隐藏只是界面呈现，不保证对检查客户端文档数据的玩家保密","副屏不加载第二个 Foundry world URL、Canvas、登录页或模块 socket；不提供独立玩家面板、行动自动化、第二张地图、AI 或自定义网络协议","构建、安装 hash 和单测是机械证据；本轮已有限定 GM/角色运行证据，剩余玩家写入、完整命令和视觉矩阵仍需在精确版本中单独完成","Next 14.368／6.0.5 历史业务切片为原生力竭效果 ID 与面板 3→4→3、普通重载；其余命令、副屏业务和完整 GM／玩家矩阵未扩大验收。","14.368／6.0.6 已接受GM面板和同会话副屏的HP 20→13→20、原生力竭3→4→3、普通客户端重载与自有测试对象/设置恢复；同时核对了GM的临时生命忙碌态、失效目标消失，以及玩家入口和权限拒绝。状态编辑仅向GM开放；通用失效目标处理、其余GM命令和禁用原因UI仍未验收。","0.2.0增加可选帮助接线；本批H3接受见执行总账，不扩大HP、Combat等既有业务命令的接受。合集未启用仍能阅读本模块帮助，所有帮助入口继续核GM。","14.368／6.0.5 已限定接受面板/同会话副屏的实际版本呈现，以及一次受控工具栏设置失败的可见提示；实际没有禁用输入，其原因提示UI仍未执行，不据此接受全部操作。"],"keywords":["跑团副屏","队伍","遭遇","先攻","HP","Combat Tracker","GM","帮助","统一手册"],"sources":["foundry-modules/open-session-deck/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md","docs/reviews/2026-10-11-suite-handbook-h3-module-status-and-deck-help.md"],"watch":["foundry-modules/open-session-deck/"],"module":"open-session-deck","entryId":"open-session-deck","ownerDirectory":"foundry-modules/open-session-deck","foundryModuleId":"open-session-deck"},{"id":"session-monitor","title":"跑团会话监测器","category":"maintain","summary":"由 GM-only Foundry 模块和 Windows/Chrome companion 共同记录隐私过滤的浏览器、进程和生命周期排障时间线。","when":"需要定位跑团期间卡顿、renderer 变化、CDP 断连或浏览器内存信号时，按任务范围记录；长时验收须有明确要求及真实会话证据。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM","正常登录的 Foundry 世界","精确Foundry14.368/dnd5e6.0.6已完成GM短会话、普通重载恢复与历史保护；具体接受范围见限制，不自动升级其他环境。","仅在需要浏览器外的 Chrome/Windows 指标时启用可选 Companion；只使用模块面板不需要它"],"steps":[{"title":"启用并确认 GM 面板","text":"在精确支持版本的世界启用模块并以 GM 进入；世界 ready 后页面会出现“跑团会话监测器”面板。玩家客户端不会启动监测运行时。"},{"title":"查看操作帮助","text":"点击监测面板的“使用帮助”；已启用合集操作台时打开该模块的统一手册，否则打开模块自带只读窗口。查看帮助不会开始记录或更改设置。"},{"title":"启动 companion","text":"需要同时记录 Chrome/Windows 信号时，在已授权的监测范围内从仓库根目录启动 companion；它只创建和管理自己的专用 Chrome profile，并等待 GM 正常登录，不读取日常浏览器凭据。","command":"bun run monitor:session -- record"},{"title":"开始记录","text":"在 GM 面板点击“开始”；模块建立 IndexedDB 会话并立即采样，companion 在没有 active session 时会通过模块 API 开始或续接同一 session ID。"},{"title":"标记卡顿","text":"记录期间遇到卡顿时点击“刚才卡顿”，或使用已注册但默认未绑定的 markJank GM 快捷键；关闭专用 Chrome 会被记录为下一代浏览器并尝试恢复同一会话。"},{"title":"停止并查看报告","text":"跑团记录结束后点击“停止并导出”或按 Ctrl+C 结束 companion；检查 browser-session.json、companion.jsonl、companion-events.jsonl、session-combined.json、report.md 和 heap-timeline.svg。"},{"title":"保存失败后续接","text":"出现操作未完成提示时，采集会暂停；短暂存储故障解除后点击“开始”续接，若已经进入停止收尾则重试“停止并导出”。重新载入也会核对已存记录再续接；达到时长或采样上限的会话继续结束，不补造样本。"}],"outputs":["Foundry 模块导出的 browser-session.json","Chrome/Windows 采样、错误和浏览器/renderer 代际事件 JSONL","合并后的 session-combined.json、隐私过滤 report.md 和 heap-timeline.svg"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片，v1 只在 GM 客户端运行；模块和 companion 只观察，不清缓存、不改设置、不删文档、不写 LevelDB","companion 只管理专用 Chrome profile，不接管日常 Chrome，不读取 Cookie、密码或浏览器凭据；GM 必须正常登录","单次会话最多 12 小时、4,320 个浏览器采样、10,000 个事件和 1,000 个错误，时长或采样上限会结束会话；事件或错误达到容量时只标记对应 truncated 并停止追加该类记录","本轮只执行短会话；长时 Foundry／Chrome 验收需明确任务授权，指标相关性不等于因果证明。","Next 14.368／6.0.5 本轮短会话 start／mark／stop、重载和既有历史保护通过；不代表长时采样、companion 或四小时跑团接受。","module/companion版本仍1.1.2、schema仍v1。2026-10-25在14.368/6.0.6完成一个真实GM短会话：开始、卡顿标记、普通重载、同ID恢复、6采样/6事件与一次停止；原历史保持，测试归档清理后公开list/export确认缺席。Companion、四小时与非GM设备未覆盖。","本地候选将记录与计数一次提交，停止前等待已接纳写入；原生接受限于上述正常短会话，存储失败恢复与权限变化另有局部检查，不能据此承诺长时性能或任意真实故障无损。"],"keywords":["跑团","会话监测","卡顿","Chrome","CDP","renderer","heap","隐私"],"sources":["foundry-modules/session-monitor/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/session-monitor/","packages/suite-handbook/"],"module":"session-monitor","entryId":"session-monitor","ownerDirectory":"foundry-modules/session-monitor","foundryModuleId":"fvtt-session-monitor"},{"id":"fvtt-weapon-mastery-properties","title":"Weapon Mastery & Properties / 武器精通与特性","category":"play","summary":"独立配置官方武器精通与家规武器特性，记录效果来源、目标关系和持续规则；已完成锁定版本的本地验收，交付候选尚未发布。","when":"需要在 dnd5e 中配置官方八种精通，或增加 Deadly、Fatal、重击流血并区分同类规则的来源与叠加时使用。","requires":["精确配对：Foundry 14.364 / dnd5e 5.3.3、Mirror 14.368 / 5.3.3，或 ServerNext 14.368 / 6.0.5 限定本地候选","已明确启用fvtt-custom-conditions与fvtt-trigger-engine：0.1.1起的旧0.1.x或精确0.2.0，且公开API版本1／所需能力与方法完整；停用模块保留的旧API不可用","当前活动 GM；明确授予角色掌握资格或来源/GM 指定的 NPC 资格","ServerNext候选精确14.368／6.0.5；CC原生武器效果能力，启用Midi时须精确14.6.0-beta.4338eeab.local.10；新版实机范围见当前迁移进度","新增精确Foundry14.368/dnd5e6.0.6静态候选；真实接受范围见限制，不自动升级其他环境。"],"steps":[{"title":"构建并核对候选","text":"显式构建固定源码及产物身份；安装和校验读取同一固定产物，不隐式重建。源码改变后重新构建。协调共享 Lab 后再安装；字节一致不等于玩法通过。","command":"bun run test:weapon-mastery-properties\nbun run build:weapon-mastery-properties"},{"title":"配置武器","text":"在模块设置中打开武器精通与特性管理器，选择角色或世界中的武器，明确启用。选择原生精通或独立的自定义预设，并配置一项首批家规特性；已有武器默认不启用。"},{"title":"区分规则和来源","text":"复制官方预设会建立独立规则 ID。检查生效目标、来源、持续时间和叠加分组；Vex 只对相应攻击者与目标关系提供效果，官方 Slow 与既有 Slowed 状态不同。"},{"title":"按实际结果验收","text":"检查命中/未命中、额外攻击额度、豁免、位移、持续效果和取消攻击。Nick 提醒卡不代表动作额度已验证；只出现伤害数字不代表目标已经受伤。"},{"title":"复核保存的接受证据","text":"本地接受原件、构建身份和覆盖边界见终审记录。已关闭批次的对象已清理；需要新的受影响验收时，先核对目标版本和服务 owner，准备独立批次。"}],"outputs":["经过版本化校验的武器配置与官方/家规规则身份","带来源、目标和叠加组的效果实例","可复查的攻击与一次性效果消费记录"],"limits":["2026-10-03新增Mirror14.368/5.3.3兼容候选；代码、manifest、测试和安装hash已核，新Core代表行为仍按本轮实机收据接受，旧版本PASS不自动扩大。","本次精确接受CC／TE0.2.0，0.2.1或不完整API仍拒绝。新组合在14.364／5.3.3的实际ready、原生攻击／伤害、TE事件及CC Vex建立／消费和原值恢复通过；这份旧目标收据本身不推广到6.0.5，Next另按下文限定实机证据判断，也不推广生产或全部并发情形。","已完成Foundry14.364/dnd5e5.3.3本地交付候选验收。官方八种精通与三项家规采用已保存真实运行及受影响自动化组合覆盖；原生Vex/流血、当前SY玩家伤害应用与在线GM结算、正式生成导入/持久化均有对应证据。11个已审查测试批次已清理，原场景、Combat、暂停和模块配置恢复。各收据保留实际构建，不宣称全部角色/棋子组合、生产或其他版本均已验收","Midi 14.0.11 的卡片内 Apply 使用精确消息、目标和实际HP变化校验；已修复连续更新省略未变化字段造成的证明拒绝。没有来源消息的右键应用路径仍失败关闭；若缺少有效预检，阻止掷骰并提示错误，不另开原生骰窗","同武器Midi Vex收据可从已保存检查点、第二击消息/卡片和效果读回自动关联；Cleave父子伤害也有只读关联。原生或换武器收据不能套用Midi关联规则，部分原件保留INCOMPLETE标签，需按原始消息、HP与效果独立判断。主进度终审记录这些边界及文档打包与实测构建的等价证明","不支持 PF2e 系统，不移植三行动制、连续攻击减值或 AC+10 重击","默认最多一项新增家规特性，Deadly 与 Fatal 互斥；不自动按武器名称或魔法加值授予效果","精确 Fatal 和状态生命周期依赖运行模块；core 原生数据不等于完整武器自动化","显式配置WMP的v14固定来源伤害保留原骰式，不另加属性伤害；生成器绑定基础骰用于Fatal等规则。修改或重排伤害段会使绑定失效，需重新生成并验证。原生基础伤害武器继续使用原生路径；正式JSON校验通过不等于游戏内导入及攻击已验收","house-rules 保留原有弹药与重击规则，仅作为可选兼容对象；不允许其他精通模块重复结算同一效果","新增精确14.368／6.0.5候选及CC原生武器效果能力门；开启Midi须精确14.6.0-beta.4338eeab.local.10。本地Next已验证ready、原生Slow强弱接替、Fatal真实伤害骰及公开use单次攻击；同一卡片攻击19／伤害骰17后，经新的明确Actor.applyDamage步骤使目标HP2→0并写入一条CC原生Slow。掷骰前真实取消无攻击消息、无预留且Sap仍启用。r80原连续流程超时失败不改写为通过；自有玩法夹具、文档等价包实装及限定读回已闭合。个人HUD旧坐标、孤立旧Setting历史及一处外来Scene旧完整来源未捕获；全部精通矩阵未验。","公开WMP.api.use在Midi启用时只启动一次攻击，使用同一预检编号并传入指定棋子。指定目标缺少当前画布可用棋子、或message.systemCard会被拒绝。攻击完成可返回待伤害结算；不强制开启自动伤害，不把返回或掷出伤害当作实际扣血。取消窗口不另开备用攻击。","2026-10-05在Next14.368／6.0.5关闭Midi时，原生Cleave实机通过：次目标消息及伤害来源准确，主目标保持选中，子伤害1d12+0=9、HP80→71。修复原生hook先完成命中后丢失结算结果的问题；这份接受不推广到Midi Cleave或全部八精通。","精确14.368/6.0.6已接受单GM的Sap预约/未开始取消、真实Club命中伤害与Slow、重复提交零重复结算、普通重载及自有对象清理；CC/TE能力和Midi版本门保持，manifest verified仍为605。旧User原像UNKNOWN及历史PARTIAL保留；全精通、玩家/多GM、长时和生产未接受。","本轮W1/W2候选在预约／启动前保留可追踪记录，等待后重新验当前GM和依赖。未完成准备、部分启动或写入结果未知时，由GM核对攻击记录与CC预约；不会当作干净取消或重复启动同编号攻击。正常完整启动／提交保持幂等。此候选的源码、构建与实机接受分别记录。"],"keywords":["武器","精通","Mastery","Properties","Deadly","Fatal","Sap","Vex","Nick"]
