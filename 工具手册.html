<script id="handbook-data" type="application/json">{"entries":[{"id":"web-workbench","title":"Web 工作台","category":"convert","summary":"用中文页面上传资料、查看转换进度，下载 JSON、Markdown 和 ZIP。","when":"希望通过页面操作，或者需要查看批量任务、警告和下载结果时，从这里开始。","requires":["本机已安装项目锁定依赖；运行命令时位于项目根目录。","实际使用需要启动 Web 服务；阅读本手册不需要。AI 任务还需按页面配置 AI 连接。"],"steps":[{"title":"启动本机工作台","text":"先构建页面，再启动仅监听本机的服务；服务运行期间保留终端。","command":"bun run web:build\nbun run web:start"},{"title":"打开页面并选择任务","text":"在浏览器打开 http://127.0.0.1:5174。按资料类型选择转换入口，核对目标版本与 effect profile，上传真实来源文件。"},{"title":"核对任务与结果","text":"查看任务摘要、来源和诊断；遇到 needs_review 或 failed 先处理问题。单文件下载 JSON，批量下载逐项结果或 ZIP。"},{"title":"需要本机 Companion 时","text":"开发入口会构建 Windows Companion 并在 5173 启动单一页面/API 服务。按 AI 连接面板下载 EXE、双击并完成配对。","command":"bun run web:dev"}],"outputs":["可下载的正式 JSON、任务对应的 Markdown、诊断和批量 ZIP。","上传任务在隔离的任务区域处理，不会按 Vault Sync 的方式修改资料库 manifest。"],"limits":["web:dev 是构建后启动，不是前端热更新；修改后需要重新运行。","网站 AI、个人 API Key 与本机 Companion 是不同连接方式，不应混用其配置；公开部署需独立配置和授权。","页面成功下载不等于来源语义或 Foundry 运行时通过。"],"keywords":["网页","上传","自动转换","下载","批处理","AI连接","Companion"],"sources":["docs/web-deployment.md","docs/web-ai-connections.md"],"watch":["apps/web/","packages/forge-gateway-protocol/"]},{"id":"markdown-convert","title":"Markdown 转 Actor / Item","category":"convert","summary":"把符合项目格式的中文 YAML/Markdown 或英文 bestiary 转为 Foundry 数据。","when":"来源已经是项目支持的结构化 Markdown，想直接生成单文件或合集时使用。杂乱 TXT 先看 AI Intake。","requires":["符合项目契约的来源 Markdown，可先参照 templates/npc-example.md。","明确 Foundry 目标与效果模式；下面示例显式选择 v14/core，并关闭图标替换。"],"steps":[{"title":"查看可用参数","text":"确认本版本 CLI 帮助，特别是版本、输出路径和输入类型。","command":"bun run cli:help"},{"title":"生成示例 Actor","text":"示例来源在仓库中；正式使用时替换来源和输出名称，保持原文可追溯。","command":"bun run src/index.ts \"templates/npc-example.md\" -o \"obsidian/dnd数据转fvttjson/output/example-v14.json\" --fvtt-version 14 --effect-profile core --icon-mode off"},{"title":"对照来源验证","text":"运行来源验证，并人工核对属性、动作、豁免、效果与施法；修改来源或生成逻辑后重新生成。","command":"bun run verify:actor \"templates/npc-example.md\" \"obsidian/dnd数据转fvttjson/output/example-v14.json\""}],"outputs":["由正式 workflow 生成的 Actor 或 Item JSON。","未通过正式检查的结果停在 needs_review / failed，不写正式 output。"],"limits":["CLI 省略版本默认 v12；本手册的示例不改变这个产品默认值。","v14 锁定 Foundry 14.364 / dnd5e 5.3.3。core 不输出专属 modded 字段；不同模块组合的兼容性需单独核实。","结构化来源的分区决定 Item 显示分区；动作分区中回合开始自动触发的 special Activity 仍显示在动作分区，特性分区中显式 action 也不迁移分区。","Bleeding / Burning 模板从特性明确给出的骰式、伤害类型和时机取值，默认回合结束，重复施加统一采用较高值。19 种 Custom Conditions 的生成状态 ID 统一使用 fvtt-custom-conditions.\u003c条件 ID>，与 dnd5e 的 bleeding/burning 及其他模块的 dazed 分开；flags 中的规则参数条件 ID 仍是 bleeding、burning 等语义 ID。自定义 Dazed / Shocked 模板采用本项目的移动、动作、附赠动作三选一说明；生成的文本和状态 ID 不代替 Foundry 内的实际回合限制。普通命中伤害和相邻其他状态不能代替缺失参数；在 FVTT 中自动执行需要 Custom Conditions 与 Trigger Engine，JSON 导入不等于状态自动命中或 E2E 通过。","状态模板 Effect ID 使用稳定的来源动作身份；重复生成保持本地引用一致，同一 Item 内的独立动作也有不同身份。生成时间戳可变化，不保证整份 JSON 字节完全相同。","武器来源可显式提供原生精通与 weapon-properties 配置；core 仅投影可原生表达的 Deadly 等字段，精确 Fatal／重击流血保持需复核说明，modded-v14 才输出武器模块配置。独立 Item 使用 workflow 的值级 verifier；verify:actor 仅用于 Actor。","不可手工修补最终 JSON 来绕过生成或审查。"],"keywords":["生成器","NPC","Actor","Item","JSON","YAML","CLI","合集"],"sources":["README.md","docs/generated-actor-verification.md","docs/acceptance/current-support-matrix.md"],"watch":["apps/cli/","packages/contracts/","packages/models/","packages/parser/","packages/generation/","packages/workflows/"]},{"id":"monster-intake","title":"AI 怪物资料整理","category":"convert","summary":"从原始 TXT 或不规则 Markdown 提取怪物证据，生成标准来源和 Actor JSON。","when":"刚拿到一段怪物资料或多个怪物的合集，尚未整理为项目格式时使用。","requires":["真实 TXT/Markdown 来源，不将截图直接交给此文本入口。","配置专用 MONSTER_INTAKE_* provider；内容会发给所选 AI 服务。凭据只保留在本地配置。"],"steps":[{"title":"检查 AI 配置","text":"API Key 模式检查配置；本机 OAuth 兼容桥模式还会检查本机健康端点。","command":"bun run src/index.ts --intake-doctor"},{"title":"先预览输入","text":"替换 source.txt 为真实文件。dry-run 检查输入与配置，估算数量，不调用 AI、不推广文件。","command":"bun run src/index.ts --intake-monsters \"source.txt\" --vault \"obsidian/dnd数据转fvttjson\" --fvtt-version 14 --effect-profile core --dry-run"},{"title":"执行整理并阅读审查结果","text":"移除上一条命令的 --dry-run 运行正式整理。accepted 后核对原文、标准 Markdown 与 JSON；needs_review 时使用本次 run 的 decisions 进行明确审查。"},{"title":"恢复需要审查的任务","text":"使用真实 run-id 和人工填写的 decisions.json；恢复会重新验证，不是手改候选 JSON。","command":"bun run src/index.ts --resume-intake \".local/intake-runs/\u003crun-id>\" --decisions \".local/intake-runs/\u003crun-id>/decisions.json\" --vault \"obsidian/dnd数据转fvttjson\""},{"title":"只读核验已有来源链","text":"source、IR、rendered Markdown与Actor必须属于同一来源／run。下列命令只读本地文件并打印报告；--json-output或--markdown-output会另写报告，不调用provider。","command":"bun run verify:intake -- --source \"\u003csource.txt>\" --ir \"\u003cevidence-ir.json>\" --markdown \"\u003crendered.md>\" --actor \"\u003cactor.json>\""}],"outputs":["accepted 的来源 Markdown 写入 vault input，Actor JSON 经既有 workflow 写入 output。","审查材料保留在 .local/intake-runs/\u003crun-id>/，可追溯来源与诊断。"],"limits":["最多 50 个候选、200,000 个 UTF-16 字符；任意资料和任意模型不保证自动通过。","此入口不做 PDF/图片 OCR；请先使用文档输入流程。","空白的能力分区标题不代表已检测到“没有能力”；当前确定性 validator 仍可能以 MISSING_SOURCE_FEATURES 要求审阅。不要据此虚构特性或删掉 IR 容器。","状态验收只在同一 Effect 的已启用模板 flags 与完整命名空间状态 ID 严格匹配时还原语义条件；缺少、禁用或错配 flags 仍报告 ACTOR_CONDITION_DRIFT，不按名称或后缀猜测。","退出码 0 为全部 accepted 或预览，2 为存在 needs_review 且无 failed，1 为存在 failed。","真实TXT来源本身不授权联网provider；已有明确任务授权持续有效，超出范围再澄清。dry-run不产生accepted链，fake provider不证明真实模型效果。"],"keywords":["怪物","文本","TXT","Intake","审查","resume","AI"],"sources":["README.md","docs/acceptance/current-support-matrix.md"],"watch":["packages/intake-ai/"]},{"id":"item-intake","title":"AI 物品资料整理","category":"convert","summary":"把自然语言物品资料整理成有来源证据的 Item，并核对机制和法术。","when":"物品描述是 TXT 或不规则 Markdown，包含充能、效果或施法机制，需要正式 Item Intake 时使用。","requires":["原始物品文本，单次不超过 50 项和 200,000 个 UTF-16 字符。","与 Monster Intake 共用专用 provider 配置，但使用独立 Item IR 和生成检查。"],"steps":[{"title":"确认配置和目标","text":"检查 AI provider；此入口固定为 Foundry 14.364 / dnd5e 5.3.3 / core。","command":"bun run src/index.ts --intake-doctor"},{"title":"整理物品来源","text":"替换文件路径。AI 提取证据，确定性规则生成 item-mechanics Markdown 和 Item JSON。","command":"bun run src/index.ts --intake-i hen":"已有待翻译 JSON，想按旧翻译工作流处理本地队列时使用。它不是任意文档生成入口。","requires":["核对真实输入目录和文件归属；此工作流会原位写入 JSON。","配置独立翻译服务，确认发送给服务的内容在授权范围内。"],"steps":[{"title":"核对队列目录","text":"默认目录 data/need_tran 被 Git 忽略；正式运行前先检查里面的文件。"},{"title":"执行明确目录的翻译","text":"替换为已经核对的目录；该命令会修改目录内符合条件的文件。","command":"bun run src/index.ts --translate-json --translate-dir \"data/need_tran\""},{"title":"人工对照原意与数字","text":"检查名称、机制术语、数值和规则含义。翻译完成不能替代正式来源语义验收。"}],"outputs":["目标目录内经翻译工作流更新的 JSON。"],"limits":["这会写用户数据，不能将整目录运行当作预览。","此入口不自动升级 schema 或目标版本，也不代替 Actor/Item 正式生成。"],"keywords":["翻译","中文化","JSON","translate","队列"],"sources":["README.md"],"watch":["packages/workflows/"]},{"id":"foundry-ops","title":"Foundry 环境与资产检查","category":"maintain","summary":"统一查看本地 Lab、资产清单、离线世界审计与受限生产只读工具。","when":"想知道环境有哪些资产、命令会读写什么，或准备排查本地 Foundry 环境时使用。","requires":["先明确实际目标、路径、进程和占用者；不要停止他人正在用的 Lab。","读取生产需走明确目标与外部配置门禁；生产写入需要当次授权。"],"steps":[{"title":"先看命令目录","text":"catalog 会标注目标与最大权限，用来判断只读、修改本地或不受支持的生产写入。","command":"bun run foundry:ops catalog"},{"title":"检查本地资产范围","text":"scope 枚举已登记、隐私排除和待人工判断项；只生成报告，不因此移动或删除资产。","command":"bun run foundry:ops assets scope"},{"title":"需要字节清单时盘点","text":"读取注册的本地资产并写审计报告，包含相对路径和 SHA-256；清单不构成清理授权。","command":"bun run foundry:ops assets inventory --hash-concurrency=4"},{"title":"准备文件侧验收合同","text":"按 Foundry Ops 说明准备带绝对路径和已审核命令的请求 JSON。预检失败时停止；成功后使用返回的合同路径依次 ready、execute、collect，需要接续时 resume。run、dispatch、receipt ID 和候选／指令身份自动取得。","command":"bun run foundry:ops acceptance prepare --input=\"\u003c请求 JSON 的绝对路径>\""},{"title":"预览 ServerNext 自有模块首次安装","text":"先完成候选构建及目标归属核对，在本进程显式设置 FVTT_OPS_LAB_ROOT=F:/FoundryLab/foundry-v14。此命令默认只核对清单，只有加入 --apply 才首次安装到 ServerNext；拒绝已有目标、链接、陈旧 manifest 或缺失资源，不创建备份。本批支持 TE/CC 首次安装；IFS 既有包升级须走单独的完整旧树校验流程。安装不等于启用或玩法接受。","command":"bun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-trigger-engine --version=0.2.0"},{"title":"接入已准备的 ServerNext 批次","text":"按说明填写本任务工作树、旧批次合同和离线授权引用。工具固定跨工作树只读来源并自动绑定回执；ready 只代表文件检查可运行，ready-batch 独立报告运行门禁。源批次暂停和回调归属保留。","command":"bun run foundry:ops acceptance prepare-batch --input=\"\u003c批次请求 JSON 的绝对路径>\""},{"title":"领取明确恢复的实机批次","text":"仅支持已有 ServerNext 的 Vision5e + Item Macro。用户明确恢复后，保存本轮授权、执行器实际上下文和服务收据，使用 prepare-runtime、ready-runtime、claim-runtime。普通 Chrome 默认 gpt-6.1-sol / medium，主控配置独立；授权记录中的模型／effort必须匹配执行器实际上下文。工具核对源批次、权限、服务和候选字节，领取一次宿主派发；聊天消息仍由获准宿主发送。","command":"bun run foundry:ops acceptance prepare-runtime --input=\"\u003c运行请求 JSON 的绝对路径>\""},{"title":"接续前核对当前状态与独立验收记录","text":"同一任务由一个 owner 维护当前入口，跨项目台账只指向它。按任务合同记录候选和唯一下一步，inspect-state 只读核对身份、旧 STOP 的显式替代及父审引用。报告完成、父审、集成和发布分开；自动收据仍 PENDING 不触发已接受行为重放，较晚时间戳不产生权限。","command":"bun run foundry:ops acceptance inspect-state --input=\"\u003c当前任务合同绝对路径>\""},{"title":"清理前读回内容保留证据","text":"按 worktree runbook 列明已提交、暂存、工作区、untracked 和 ignored 内容。inspect-preservation 只读匹配保留范围外的现存文件或可达 Git 文件；未知、缺件和字节失配保持 INCOMPLETE。Git clean、类似主线实现与检查通过均不授予删除权限，不自动复制或清理。","command":"bun run foundry:ops acceptance inspect-preservation --input=\"\u003c保留请求绝对路径>\""}],"outputs":[".local 中的本地资产或范围报告、完整性状态与待判断项。","目标 worktree 的 .local/development-feedback/\u003crunId>/ 内保存合同、一次执行原件、收据和独立摘要。"],"limits":["本机与线上均不创建备份；旧文档里会创建快照、备份或迁移副本的路径不作为本手册的推荐操作。","server-mirror 按用户要求常驻至关机，E2E 只复用并清理自己的测试对象，不自行启停 Foundry；核对实际 dataPath、端口和活动世界，启动参数使用连续的 --key=value。","不得编辑运行中世界 LevelDB；本地检查不证明线上环境正常。","手册不执行运维命令，安装、重启、迁移和清理都需要按各自范围处理。","共用验收第一版只做已授权的本地文件检查：保存成功与行为通过分开；空输出、仅有 PASS 标签和无 adapter 的语义保持 INCOMPLETE。已领取操作不能自动重放，父审保持待完成。","文件侧工具不提供 Foundry 玩法、Chrome、跨线程回调或对象清理验收，合同中的命令也不会获得额外权限。","Vision5e + Item Macro 离线收据导入仅作参考，不恢复暂停状态；单独运行合同必须有明确恢复授权与实际权限/服务证据。collect-runtime 只收集观察，仍保持父审待完成；数据判断不替代 UI、加载哈希、角色/重载和完整清理。"],"keywords":["Lab","环境","运维","盘点","资产","诊断","世界","性能","共用验收","合同","收据"],"sources":["tools/foundry-ops/README.zh-CN.md","docs/runbooks/development-feedback-loop.md","docs/runbooks/worktree-development.md"],"watch":["tools/foundry-ops/"]},{"id":"verification-development","title":"验证工具与开发资料","category":"maintain","summary":"查阅来源验证、测试、支持矩阵和锁定版本参考资料，也用于持续维护本手册。","when":"需要知道“通过”具体指哪一层，或完成新功能后更新项目说明时使用。","requires":["工程工作先遵守 worktree 规则；按改动范围选择检查。","测试绿色、文件存在、真实 Foundry 操作和生产验收分别记录。"],"steps":[{"title":"选择必要检查","text":"普通说明修改核对文义和链接；实现修改按 owner 规则运行受影响测试。完整工程门禁如下，耗时较长。","command":"bun run ci:verify"},{"title":"验证共用验收工具","text":"安全包装入口覆盖预检失败不派发、错误路径、候选／指令变化、旧收据、空输出和超时恢复。第二消费者的只读来源与运行边界可用 test:acceptance-next-vm 聚焦验证；test:acceptance-cleanup 核对限定自动后代归属，手动/未知对象仍拒绝，纯检查不执行删除。按变化选择入口，详细操作见 Foundry 环境与资产检查条目。","command":"bun run test:acceptance-tools"},{"title":"查阅锁定参考","text":"参考缓存是开发资料，不是正常生成器的运行依赖。先 dry-run 查看将获取什么。","command":"bun run references bootstrap --dry-run"},{"title":"同步工具手册","text":"入口、输入／输出、支持版本、步骤或安全限制变化时更新说明。内部实现或测试先核对是否影响这些信息；已有watch报stale仍须人工核对并更新review、build/check，不缩小覆盖或批量刷新。","command":"bun run handbook:status\nbun run handbook:build\nbun run handbook:check"},{"title":"选择5.x固定线或6.x跟随线","text":"5.x固定5.3.3；Next的6.x先从官方发布确认最新稳定tag并比较本地系统，再带该tag查Context7并核固定提交源码。Next落后时按已授权的升级流程先更新及窄验收；Wiki／开发分支返回只作导航。具体版本用于复现，不是永久上限；没有后台定时监测。"}],"outputs":["与具体改动对应的检查证据和来源语义结论。","随代码合并更新的 工具手册.html，可直接离线打开。"],"limits":["ci:verify 包含手册一致性检查，但不自动写说明，也不保证任何发布权限。","CI 固定 Bun 1.3.14；本机运行相同门禁应使用该版本。全仓覆盖率保留完整测试清单、单进程报告和既有阈值；总进程有 300 秒 watchdog。CLI 子进程同时读取标准输出与错误输出，并在超时后回收。已通过的实机 E2E 可按产物与环境身份复用。","本手册是版本快照；单独复制到其他位置的 HTML 不会自动跟随 master 更新。","内部 package 是共享能力，不是每个都需要单独启动；Forge 浏览器 runtime、法术契约与血猎手数据包由对应产品入口使用。"],"keywords":["测试","验证","verify","参考","开发","更新","手册","构建","master"],"sources":["docs/generated-actor-verification.md","docs/acceptance/current-support-matrix.md","docs/REFERENCE_INDEX.md","docs/runbooks/handbook-maintenance.md","docs/runbooks/dnd5e-version-following.md","docs/runbooks/foundry-v14-development-source-routing.md","docs/reviews/2026-10-01-next-605-release-integration.md"],"watch":["package.json","src/tools/","scripts/","packages/forge-browser-runtime/","packages/spell-manifest-contracts/","packages/blood-hunter-v14/"]},{"id":"human-encounter-intake","title":"人类MD与召唤战斗包","category":"convert","summary":"人类MD经AI提取生物与固定能力配置，工具生成Actor及控制入口，并一起导入。","when":"需要生成龙兽和晶体、召唤者和红龙等多个关联生物，并携带配套自动化时。","requires":["每种生物的完整规则与明确召唤关系；未知规则保留给GM。","本地默认DS API deepseek-flash（V4.1 Flash）；当前固定执行层仅支持Foundry14.364/dnd5e5.3.3/core。"],"steps":[{"title":"填写普通资料","text":"参照人类写法模板写两份完整生物数据，说明召唤数量、位置、先攻和持续等规则。未确定的规则明确保留缺项。"},{"title":"运行并核对","text":"在Forge Intake中选择原始MD并生成；也可使用CLI。命令输出目录应为新的目录。","command":"bun run tools/forge-encounter/run-human-intake.ts docs/examples/晶血龙兽与月石晶体-人类写法.md ./crystalbleed-intake-run"},{"title":"审核后导入并启动","text":"角色来源、正式生成和固定配置审核通过后才产出整包。GM确认导入并明确启用；刷新会恢复已启用且身份正确的配置，控制面板可持久停用。"}],"outputs":["只有整包达到 ready_for_gm_review 后，才输出各生物的正式来源MD、Actor JSON和整包ZIP。","review.json 保留原始资料hash、IR、模型身份、重试元数据和审核结果；needs_review/failed 不产生可导入包。"],"limits":["AI只能选择已实现能力与参数，不能编写宏代码；能力清单外的自动化保留待实现或GM处理。","生成和预览不执行自动化；停止或关闭页面取消本次请求。草稿续跑重新校验、审阅，不继承历史通过状态。","本地CLI默认DS Flash，每阶段5分钟；不使用Luna桥接。浏览器验收执行器按当前项目约定和实际任务配置选择，与Intake模型分开；历史Luna Max设置不表示当前默认。","真实DS已生成并审核样例整包，本地已测召唤、守护减伤与耗尽削弱；重复腐化保留PARTIAL，待独立状态设计；浏览器完整AI生成链尚未重测。","预先审核的晶血样本使用专用宏2.1.2，导入后单独启动，刷新后重新启动；启用Custom Conditions时按正式效果中的条件标记应用独立恍惚，遵守免疫并在目标下回合结束到期，未启用时行动限制由GM裁定。候选回归不等于实机接受。","当前执行器只支持V14；V12需独立适配验收。未指定的召唤期限、数量上限和死亡规则不自行补全。"],"keywords":["召唤","红龙","晶体","多生物","战斗包","人类MD","配套宏"],"sources":["tools/forge-encounter/README.md","docs/examples/召唤生物-人类写法模板.md","docs/examples/晶血龙兽与月石晶体-人类写法.md"],"watch":["tools/forge-encounter/","packages/forge-browser-runtime/","packages/intake-ai/"]},{"id":"crystalbleed-v12","title":"晶血龙兽 V12 配套宏与来源","category":"convert","summary":"从两份批准来源经正式生成链制作 V12 Actor，并构建独立战斗控制宏；本轮是未发布整合候选。","when":"要复核或重新生成历史 Foundry 12.331／dnd5e 4.3.9 的晶血龙兽与月石晶体交付时使用。","requires":["Foundry 12.331 / dnd5e 4.3.9；运行须由一个 GM 客户端负责","先核对包内来源、GM 辅助规则和运行目标；新版产物尚未重新实机接受"],"steps":[{"title":"运行来源与宏回归","text":"核对 save 成功伤害、独立腐化阶段、来源效果期限与纯逻辑规则。","command":"bun run test:crystalbleed-v12"},{"title":"生成两份 Actor","text":"正式 Actor 由 CLI/workflow 生成。GM 辅助／外部规则使结果保持 needs_review；不能称完整自动化已接受。","command":"bun run src/index.ts \"obsidian/dnd数据转fvttjson/input/crystalbleed-drakon-v12-rework.md\" -o \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/dragon.json\" --fvtt-version 12 --effect-profile modded-v12 --icon-mode off\nbun run src/index.ts \"obsidian/dnd数据转fvttjson/input/moonstone-salvo-crystal-v12.md\" -o \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/crystal.json\" --fvtt-version 12 --effect-profile modded-v12 --icon-mode off"},{"title":"对照来源并构建配套宏","text":"逐份运行来源 verifier，再人工核对各 Activity。宏构建只读取已生成的 Actor 并输出宏与哈希清单，不修改 Actor JSON。","command":"bun run verify:actor \"obsidian/dnd数据转fvttjson/input/crystalbleed-drakon-v12-rework.md\" \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/dragon.json\"\nbun run verify:actor \"obsidian/dnd数据转fvttjson/input/moonstone-salvo-crystal-v12.md\" \"obsidian/dnd数据转fvttjson/output/crystalbleed-v12-rework/crystal.json\"\nbun run build:crystalbleed-v12"},{"title":"按目标版本使用","text":"导入、宏启动与实际效果需要相应世界的接受。保留原怪，使用带来源行为标记的新生物；GM 负责未自动表达的方向、目标和反应决策。"}],"outputs":["正式生成链的 review-required Actor JSON","battle-control.js、Macro JSON 与 SHA-256 manifest"],"limits":["9 月 9 日原件证明历史 V12 宏交付；本轮新 Actor JSON 哈希不同，独立状态 ID 沿用当前 master，不能用旧哈希或旧实机结果称新版运行通过。","核心修复是把来源 onSave 结果保留至各目标版本；没有手工补最终 JSON。","V14 Forge bundle 是独立导入／绑定链，不将 V12 证据或旧 V14 直导宏接受外推至该链、6.0.5 或生产。","宏需一个 GM 客户端负责，页面刷新后重启；多客户端、跨场景与长时范围没有本轮接受。"],"keywords":["晶血龙兽","月石晶体","V12","Crystalbleed","onSave"],"sources":["tools/crystalbleed-v12/README.zh-CN.md","docs/acceptance/2026-09-09-crystalbleed-v12-runtime.md","docs/acceptance/2026-09-09-crystalbleed-v12-source-audit.md"],"watch":["tools/crystalbleed-v12/","obsidian/dnd数据转fvttjson/input/crystalbleed-drakon-v12-rework.md","obsidian/dnd数据转fvttjson/input/moonstone-salvo-crystal-v12.md"]},{"id":"chat-memory-guard","title":"聊天内存保护","category":"maintain","summary":"限制当前浏览器中已渲染聊天卡片和头像媒体的占用，保留世界聊天记录。","when":"聊天栏长时间堆积卡片或头像媒体造成浏览器压力时，按世界默认值或当前客户端覆盖进行限制。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM（修改世界默认值时）"],"steps":[{"title":"启用并打开配置","text":"在精确支持版本的世界中启用 Chat Memory Guard；进入“游戏设置 → 模块设置 → 聊天内存保护”。模块会在世界准备完成后接管当前聊天窗口和聊天弹窗。"},{"title":"设置世界默认值","text":"GM 设置启用开关、保留的已渲染消息数（20–200）、头像来源（系统、Token、Actor 或隐藏）、原图或会话级 WebP，以及缩略图最长边（48–256 px）和质量（40–95）。保存后当前聊天立即重新渲染。"},{"title":"设置个人覆盖","text":"每位用户可以选择跟随世界默认值，或只为当前浏览器保存覆盖值。玩家的 client 设置不会改写 GM 的世界默认值。"},{"title":"观察聊天与诊断","text":"打开聊天栏或聊天弹窗观察卡片保留和头像显示；需要排障时，在浏览器控制台读取 game.modules.get(\"chat-memory-guard\").api.getStats()，只查看渲染数、裁剪数、缩略图估算字节、失败数和有效设置。"},{"title":"运行离线检查","text":"维护者从仓库根目录运行模块测试；该检查属于机械证据，不能代替真实长时间跑团观察。","command":"bun run test:chat-memory-guard"}],"outputs":["当前浏览器聊天 DOM 按有效保留数裁剪","按设置显示系统、Token 或 Actor 头像，或使用会话级 WebP 缩略图","game.modules.get(\"chat-memory-guard\").api.getStats() 诊断结果"],"limits":["只限制当前浏览器里已渲染的聊天卡片，不删除世界聊天记录。","缩略图只存在于当前页面会话，不能阻止 dnd5e 创建头像前的首次原图请求","短时 A/B、单元测试和构建不能证明长时间跑团内存永不增长","历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片","Next 14.368／6.0.5 本轮只验证公开聊天统计 API 与模块启用；未做长时内存或完整裁剪矩阵。"],"keywords":["聊天","内存","DOM","头像","缩略图","Chat Memory Guard"],"sources":["foundry-modules/chat-memory-guard/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/chat-memory-guard/"],"module":"chat-memory-guard"},{"id":"fvtt-babele-rolltable-embed-translation","title":"Babele 随机表嵌入翻译兼容","category":"maintain","summary":"在 Babele 翻译已经存在时，修复 Foundry v14 的 @Embed 随机表结果仍显示英文的渲染缺口。","when":"Journal、聊天或其他文本中的 Compendium RollTable 使用 @Embed 后，表名已翻译但结果行仍为英文时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","Babele 2.9.1","libWrapper 1.13.5.1","可读取的 Babele 随机表翻译文件"],"steps":[{"title":"准备依赖并启用模块","text":"在目标世界先启用 Babele 与 libWrapper，再启用本模块并重新加载世界。模块在 init 阶段只注册 RollTable 的渲染包装；依赖缺失时不会提供翻译覆盖。"},{"title":"准备可读取的随机表","text":"确保目标 Compendium RollTable 对当前世界可读，并由 Babele 提供对应翻译。翻译源继续由现有 Babele 翻译包维护，本模块不编辑翻译文件。"},{"title":"渲染 @Embed","text":"在 Journal、聊天或其他支持富文本的地方插入目标随机表的 @Embed，再打开包含该表的页面，核对表名和各范围对应的中文结果。"},{"title":"核对结果与链接","text":"检查各个范围是否仍对应正确的结果。若使用狂野魔法浪涌或困惑术，可按原始说明逐行对照；文档型结果应仍能打开原来的目标条目。"},{"title":"运行离线检查","text":"维护者从仓库根目录运行模块测试；测试和构建只证明静态包装逻辑，实际表格行仍需在锁定版本的 Foundry UI 中复核。","command":"bun run test:fvtt-babele-rolltable-embed-translation"}],"outputs":["Compendium RollTable @Embed 中按范围显示的中文结果","文档型结果继续生成指向原 UUID 的 content-link","翻译失败时保留 Foundry 原生嵌入结果"],"limits":["只修正随机表嵌入的显示，不改写随机表、角色、物品、日志或世界设置。","Babele 或 libWrapper 不可用、翻译失败或数据无法对齐时会保持原生输出或停用覆盖","历史依赖验收为 14.364／5.3.3；本轮 Next 14.368／6.0.5 两表切片另验，Babele 2.9.1／libWrapper 1.13.5.1 不随系统升级而自动获得新接受。","单测、构建和安装校验不等于实际 UI 中的 25 行、5 行和文档链接验收","Next 14.368／6.0.5 本轮两表 25／5 行中文嵌入、原始 UUID、可见界面和来源未写入均通过；不代表任意翻译文件都可对齐。"],"keywords":["Babele","@Embed","RollTable","随机表","翻译","content-link"],"sources":["foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-babele-rolltable-embed-translation/"],"module":"fvtt-babele-rolltable-embed-translation"},{"id":"fvtt-battlefield-painter","title":"战场地形画笔","category":"play","summary":"GM 在 Foundry v14 画布上绘制可追踪、可擦除和可回滚的火焰、冰霜与荆棘地形。","when":"跑团中需要快速铺设地形、改变阶段、表达移动代价或清理本模块地形文档时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM","已在画布查看的场景和可用网格"],"steps":[{"title":"启用并打开场景","text":"以 GM 身份在精确支持版本的世界中启用模块，然后打开并激活要编辑的场景。非 GM、无活动场景或网格接口不可用时不会允许修改。"},{"title":"打开地形画笔","text":"在场景控制组的 Tiles 工具栏点击火焰图标“战场地形画笔”，打开 ApplicationV2 控制面板。该入口只在精确版本和 GM 客户端中出现。"},{"title":"选择地形与画笔","text":"选择火焰、冰霜或荆棘，选择阶段 I 或 II，再选择绘制、擦除或切换阶段。P1 开启时还可选择自由、直线或填充形状，以及 0–4 格笔刷半径。"},{"title":"在画布上操作","text":"点击“启用画笔”后，在地图上按住左键拖动，松开时一次创建该笔画；擦除只处理本模块拥有的文档，切换阶段作用于命中的完整笔画批次。P1 提供撤销和重做。"},{"title":"处理清除与旧声音","text":"需要清理本场景地形时先查看数量预览，再在确认框中确认；发现旧版本 AmbientSound 时也必须由 GM 显式确认清理。旧声音清理不可撤销，模块不会自动迁移或删除场景数据。"}],"outputs":["带 fvtt-battlefield-painter 所有权标记的 Tile、Region、Wall 和火焰 AmbientLight 场景文档","火焰、冰霜和荆棘的两个阶段；成熟荆棘阶段可形成 Wall 边界","Region 移动消耗、P2 火焰/冰霜画布效果，以及本模块笔画历史和回滚能力"],"limits":["历史版本为 Foundry 14.364 / dnd5e 5.3.3；本轮 Next 目标为 14.368 / 6.0.5，只有 GM 能修改场景","当前 Next 候选为 0.3.0-alpha.2 P2 alpha；Fire B13 的完整真实 Canvas 验收仍待完成，其他运行时结论以对应 micro-batch 记录为准","不提供伤害自动结算、12 色变体、跨客户端并发锁或第三方自动化集成","新版本不创建 AmbientSound；旧环境音清理不可撤销，静态测试和构建不等于真实画布验收","Next 14.368／6.0.5 本轮 Square Fire I 两相邻格的可见动画、Region、灯光和重载保持通过；其他地形／阶段、Hex、Undo／Redo和玩家矩阵未执行。"],"keywords":["战场","地形","火焰","冰霜","荆棘","画笔","Canvas","Region"],"sources":["foundry-modules/fvtt-battlefield-painter/README.zh-CN.md","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-battlefield-painter/"],"module":"fvtt-battlefield-painter"},{"id":"fvtt-blood-hunter-2024","title":"血猎手 2024","category":"library","summary":"提供血猎手 2024 的职业、结社和特性合集，使用 dnd5e 原生升级流程。","when":"给新角色添加血猎手职业、查看结社特性，或只读检查旧角色与当前内容差异时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM","可被 canonical flags 或严格 legacy 条件唯一匹配的 Blood Hunter Actor（迁移时）"],"steps":[{"title":"启用并检查内容包","text":"在精确支持版本的世界中启用模块，打开 Compendium 目录确认“血猎手 2024：职业”“血猎手 2024：子职”和“血猎手 2024：特性”三个 Item pack 可读。"},{"title":"给新角色添加职业","text":"从 classes（职业）合集中把“血猎手”拖入角色卡，按 dnd5e 原生 Advancement 提示完成选择。"},{"title":"按原生流程升级","text":"通过角色卡的升级流程选择结社和对应特性；需要 GM/玩家判断的规则按原文处理，不把 assisted 项当作全自动。"},{"title":"更新合集后检查角色","text":"已经加入角色卡的职业和特性是快照，模块更新不会实时替换它们。核对角色已有等级、选择和消耗，再决定是否需要另行处理。"},{"title":"旧角色仅做只读预览","text":"GM 在“游戏设置 → 模块设置”打开“血猎手 2024：角色迁移”，输入 Actor ID 或精确名称，点击 Preview 查看差异。当前 Create migrated copy 与 Apply original 流程要求创建副本和 JSON 备份，与本项目无备份规则冲突，因此停在 Preview，不继续迁移。"}],"outputs":["classes、subclasses、features 三个 dnd5e Item Compendium pack","迁移 Preview、验证后的 Actor 副本和 canonical/migration 契约证明","仅更新模块拥有 Blood Hunter Item 的原 Actor 投影，以及模块要求的 JSON backup"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片；MIDI-QOL 14.0.11 和 DAE 14.0.12 是推荐依赖而非硬依赖","不会自动 ready 扫描 Actor；不修改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags","旧安装替换及角色迁移包含备份行为，与本项目无备份规则冲突。当前仅介绍已安装内容的使用和只读 Preview；执行这些旧写入流程前须先处理冲突，不能用隐藏副本绕过。","这是构建快照，不实时同步远程 homebrew、旧 side-data 或 Actor 变化；本地静态检查不等于真实游戏性验收","内容投影身份保持原已接受的 dnd5e 6.0.2，6.0.5 是本轮运行兼容目标；更新保留现有合集数据库，不重复生成或迁移。","Next 14.368／6.0.5 本轮只验证来源／内容身份、启用和现有三合集读取；四子职完整 Core／Modded 游戏性矩阵未执行。"],"keywords":["Blood Hunter","血猎手","职业","子职","迁移","Actor","Activity","Effect"],"sources":["foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md","README.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-blood-hunter-2024/"],"module":"fvtt-blood-hunter-2024"},{"id":"fvtt-homebrew-species","title":"自制种族内容","category":"library","summary":"提供 accepted homebrew Species 的纯内容 Item 合集；V14 是运行目标，V12 产物只作为明确标记的静态候选。","when":"需要在精确 dnd5e v14 世界浏览或使用已接受的自制种族与种族特性时使用；V12 仅用于静态审阅。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","Foundry VTT 14.364 + dnd5e 5.3.3（运行包）","Foundry VTT 12.331 + dnd5e 4.3.9 + 2024 规则（仅 V12 static candidate）"],"steps":[{"title":"启用 V14 内容包","text":"在 Foundry 14.364 / dnd5e 5.3.3 世界启用模块，打开 Compendium 目录确认“Homebrew Species / 自制种族”和“Species Features / 种族特性”两个 Item pack 可读。"},{"title":"浏览种族与特性","text":"在两个 Item pack 中查看 Species 和 features；这是 content-only 模块，没有浏览器 JavaScript、socket、设置菜单、自动迁移或世界扫描。"},{"title":"按系统流程使用","text":"在 dnd5e 角色卡使用 Add Species（添加种族）流程，选择本模块的种族条目，再按提示应用特性。已授予角色的特性是快照，更新合集不会自动替换。"},{"title":"检查 V12 静态候选","text":"维护者需要 V12 候选时可运行下面的构建命令；构建会写入 dist/v12-candidate，不能称为只读操作。它不调用安装器，也不证明 V12 角色流程可用。","command":"bun run build:homebrew-species:v12-candidate"},{"title":"核对 V14 构建","text":"维护者可从仓库根目录运行 V14 构建检查；ledger、Markdown 和 target hash 任一过期都会 fail-closed。","command":"bun run build:homebrew-species"}],"outputs":["species Item pack 和 features Item pack","V14 target-specific 的文档、UUID、logical hash、coverage ledger 与确定性 ZIP","V12/12.331 candidate 构建及 supportStatus: static-candidate 身份标记"],"limits":["V14 产物精确绑定 Foundry 14.364 / dnd5e 5.3.3；V12 候选精确绑定 Foundry 12.331 / dnd5e 4.3.9 / Core / 2024","V12 candidate build/verify 不调用安装器，也不证明 Add Species、升级、HP/AC、次数、Long Rest 或重开读回","没有浏览器运行时、socket、自动迁移和世界扫描；ItemGrant 依赖本模块 features pack，已嵌入 Actor 的 Feature 不会自动更新","ledger、Markdown、package 或 target hash 过期时拒绝构建；静态构建与 LevelDB 校验不等于 Foundry runtime、生产或长期跑团验收","内容投影身份保持原已接受的 dnd5e 6.0.2，6.0.5 是本轮运行兼容目标；更新保留现有合集数据库，不重复生成或迁移。","Next 14.368／6.0.5 本轮只验证来源／内容身份和现有两合集读取；Add Species、升级和全部玩法未扩大验收。"],"keywords":["自制种族","Species","种族特性","Compendium","ItemGrant","V14","V12 candidate"],"sources":["foundry-modules/fvtt-homebrew-species/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-homebrew-species/"],"module":"fvtt-homebrew-species"},{"id":"fvtt-house-rules","title":"本团村规","category":"play","summary":"以显式标签和 GM 权威为前提，提供治疗药水、生命骰、弹药、隐匿和自然 1/重击等村规辅助。","when":"希望把本团约定接入 dnd5e 原生骰子、Activity、状态和 Document API，同时保留 GM 裁定时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","活动 GM","药水和弹药上的显式 fvtt-house-rules flags（使用对应功能时）"],"steps":[{"title":"启用并确认默认状态","text":"在精确支持版本的世界中启用模块并重新加载；首次提示说明所有会修改数据的规则默认关闭。"},{"title":"由 GM 配置规则","text":"在 Foundry“配置设置 → 模块设置”中逐项启用需要的功能，并设置低属性阈值、自然 1 后果倍率/其他 RollTable UUID 和隐匿全速等级；这些世界设置只有 GM 可改。"},{"title":"准备显式标签","text":"在 Item 数据中使用 flags.fvtt-house-rules.potion 或 flags.fvtt-house-rules.ammo 写明药水骰、弹药 key 和 tier（0–3）。模块不从中文或英文名称猜测药水、弹药、武器或特性。"},{"title":"在跑团中调用助手","text":"使用 game.fvttHouseRules 的 GM API 或对应原生事件处理药水 preview/apply/restore、生命骰赌博、弹药记录/找回、隐匿提示和自然 1 后果；GM-only 卡片确认前不会执行伤害、反击或武器损坏。"},{"title":"运行规则检查","text":"维护者从仓库根目录运行模块测试；通过只代表规则投影与构建层检查，真实 Foundry 多客户端语义仍需单独回放。","command":"bun run test:house-rules"}],"outputs":["显式模块 flags、幂等事务 ledger 和 GM 世界设置","治疗药水的三个原生 heal Activity、生命骰与弹药账本、隐匿提醒","GM 确认的自然 1 后果卡和支持路径中的重击首颗伤害骰按满值投影"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片；所有修改由确定性的活动 GM 执行","缺少显式标签、来源不唯一、对象无权限或版本不精确时失败关闭；不会按名称猜测或扫描全世界","MIDI-QOL 14.0.11、DAE 14.0.12 和 Die So Nice 6.2.9 的扩展路径只在精确版本组合下使用，其他组合保持原生或失败关闭","弹药找回、自然 1 后果、武器修复和重击适配都不自动代替 GM 裁定；盲骰原始面值不写入模块 flags、消息或审计摘要","Next 14.368／6.0.5 本轮药水 Preview／Apply、手改保护／恢复和正常重载通过；不代表全部村规、可选 Midi／DAE 组合或多客户端玩法通过。","本轮额外修复 Midi local.10 的 Check／Save 请求来源加值，两次真实结果为 +4；这不把 House 的可选 Midi／DAE 兼容门改成全量放行。"],"keywords":["村规","治疗药水","生命骰","弹药","隐匿","自然 1","重击","GM"],"sources":["foundry-modules/fvtt-house-rules/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/fvtt-house-rules/"],"module":"fvtt-house-rules"},{"id":"fvtt-injury-fading-spirits","title":"消逝的灵魂／独立复活","category":"play","summary":"以活动 GM 为权威管理独立复活仪式、快速复活锁和回归历史；伤势由 Custom Conditions 管理。","when":"需要 Critical Role 风格的复活仪式、参与者贡献和 GM 裁定记录时使用。","requires":["独立复活版本门：Foundry 14.364 / dnd5e 5.3.3，或历史候选 14.368 / 6.0.2、当前候选 14.368 / 6.0.5","活动 GM；玩家通过原生贡献检定参与","如需伤势，另外启用配套的新 Custom Conditions 和 Trigger Engine；复活自身不依赖这两个模块"],"steps":[{"title":"启用独立复活模块","text":"在精确支持的版本中启用“消逝的灵魂”。兼容模块 ID 仍为 fvtt-injury-fading-spirits；旧 enabled/manageNpcs 设置只供伤势设置迁移，不再在本模块打开伤势规则。"},{"title":"选择 Actor 并打开复活面板","text":"GM 在 Actor 目录条目右键选择“消逝的灵魂”，或先选中 Token 后在聊天输入 /ifs。核对 Actor 后选择快速、普通或最终仪式。没有 Custom Conditions 时仍可独立复活。"},{"title":"填写并确认仪式","text":"普通或最终仪式最多填写三名不同参与者及其技能、DC 和优势。模块创建原生贡献请求；GM 确认每项贡献、灵魂意愿和最终结算。最终和快速检定使用 blindroll；长期历史不保存盲骰原始值。"},{"title":"处理回归与下一次死亡","text":"成功复活记录回归历史，实际 HP 由对应法术或 Activity 恢复。Custom Conditions 正在管理伤势时，经公开接口抑制该次恢复计层。新死亡 episode 重置本次快速复活锁和消费标记，使后续死亡仍能开始新的复活。"},{"title":"核对历史及兼容入口","text":"原有伤势 flags 和复活历史保留；复活模块后续只写 fadingSpirits 子路径。旧 setInjury/withInjurySuppressed 接口转交 Custom Conditions；缺少该模块时明确报错，独立复活入口仍可用。"}],"outputs":["Actor fadingSpirits 中的复活尝试、锁定和历史","原生贡献请求与盲骰结算消息","供可选 Custom Conditions 调用的死亡 episode 和恢复抑制桥接"],"limits":["伤势的 0–3 层、HP／休息规则、自然 19/20 和状态管理入口现属于 Custom Conditions；本模块的旧 injury flags 只保留兼容数据。","灵魂意愿、贡献是否成功、环境例外和复活 HP 仍由 GM 与对应法术或 Activity 决定。","未安装 Custom Conditions 时，独立复活不会增加或清除伤势；伤势旧 API 需要配套模块。","Next 14.368／6.0.5 已验证独立复活基础链、快速复活与新 Custom Conditions 伤势联动；其他仪式、玩家贡献分支、多 GM 和长时运行仍须单独验收。","本地 Lab 接受不代表生产部署或长时跑团接受。"],"keywords":["伤势","消逝的灵魂","复活","死亡豁免","倒地","Actor flag","活动 GM"],"sources":["foundry-modules/fvtt-injury-fading-spirits/README.zh-CN.md","foundry-modules/fvtt-injury-fading-spirits/CREDITS.md","docs/reviews/2026-09-22-condition-hud-localization.md","docs/reviews/2026-09-23-existing-condition-icons.md","docs/reviews/2026-09-23-condition-tooltip-native-layout.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md","docs/plans/2026-10-02-injury-condition-ownership.md"],"watch":["foundry-modules/fvtt-injury-fading-spirits/"],"module":"fvtt-injury-fading-spirits"},{"id":"fvtt-trigger-engine","title":"Trigger Engine / 通用触发器引擎","category":"play","summary":"由活动 GM 执行的通用 Actor 更新、回合开始和回合结束事件引擎；把稳定的 before/after 上下文交给宏或其他模块。","when":"需要把“什么时候触发”从具体规则模块中拆出来，用配置组合 Actor 更新、Combat 回合事件、结构化条件和现有宏时使用。具体状态规则由独立模块拥有。","requires":["精确版本门：Foundry 14.364 / dnd5e 5.3.3，或伤势接入候选 14.368 / 6.0.5","活动 GM","每个 Run Macro 动作对应的世界 Macro UUID","消费模块通过 api.subscribe 接收通用事件；伤势规则由 Custom Conditions 拥有"],"steps":[{"title":"打开 Trigger Manager","text":"以 GM 启用模块后，在模块设置中打开 Trigger Manager。配置保存在 world setting 中，读取和写入都会校验 schema；无效触发器不会进入运行时。"},{"title":"定义 Actor 或 Combat 事件","text":"新建触发器，选择 Document Update / Actor，并填写需要观察的 watched paths，例如 system.attributes.hp.value。路径匹配同时识别点路径、嵌套对象以及父子路径相关更新。"},{"title":"选择回合生命周期","text":"Combat Turn Start 和 Combat Turn End 不需要 watched paths。它们只在正向 Combat 生命周期中发出，并以 Combat、回合和 combatant 上下文交给 active GM。"},{"title":"组合结构化条件","text":"条件组选择 ALL 或 ANY；每项从 before 路径、after 路径或 literal 取值，再使用 eq、ne、gt、gte、lt、lte 比较。v1 不执行任意 JavaScript 条件。"},{"title":"添加 Run Macro 动作","text":"为动作填写 Macro UUID。命中后活动 GM 按顺序执行宏，并通过 macro.execute({ triggerContext }) 传入触发器 ID、Actor、before、after、changes、userId、时间戳与安全回写入口 updateDocument(changes, options?)。宏若要回写当前 Actor，应使用这个入口保留因果链。单个触发器内动作失败会停止该触发器剩余动作，其他触发器仍可继续。"},{"title":"接入其他模块","text":"其他模块通过 api.subscribe(listener) 筛选通用事件；伤势的 HP 更新由 Custom Conditions 消费。外部武器事件使用独立 publishExternal/subscribeExternal 公开接口，版本与能力可查询。Trigger Engine 不导入消费者私有实现，也不替消费者裁定伤势或复活。"}],"outputs":["world setting 中经过校验的 TriggerDefinition 列表","Actor 更新时稳定的 before / after / changes TriggerContext","由确定性活动 GM 顺序执行的 Macro 动作"],"limits":["当前 Document Update、Combat Turn Start 和 Combat Turn End 都只支持 Actor 文档；schema 保留 documentType 以便后续扩展","v1 只有结构化 ALL/ANY 比较条件与 Run Macro 动作，不提供任意 JavaScript 条件、Convenient Effects 或 Effect Macro 依赖","执行权限定为当前活动 GM；等待订阅者、回合回调或宏解析后重新验权，失去执行权即停止后续分发或动作。updateDocument 回写时也重新验权；已经开始执行的用户宏无法被中断，直接文档写入仍须自行验权。同一 Actor 的更新按观察顺序排队并保留 before/after；updateDocument 携带祖先因果链以阻止递归，不覆盖 Actor.update；world setting 广播刷新客户端缓存","本地测试和构建只能证明配置、求值和调用契约；任意真实世界宏副作用仍需在精确 Foundry 版本中单独验收","Next 14.368／6.0.5 已验证 Actor／Combat 限定事件、活动 GM 分发、去重和回合顺序及 CC 消费；不据此推断任意宏、多 GM 或长时运行通过。"],"keywords":["Trigger","触发器","Document Update","Actor","Macro","before","after","自动化"],"sources":["foundry-modules/fvtt-trigger-engine/README.zh-CN.md","docs/runbooks/custom-conditions-and-trigger-engine-usage.md","docs/plans/2026-10-02-injury-condition-ownership.md"],"watch":["foundry-modules/fvtt-trigger-engine/"],"module":"fvtt-trigger-engine"},{"id":"fvtt-custom-conditions","title":"Custom Conditions / 自定义状态","category":"play","summary":"集中管理十九种带参数的自定义状态，以及独立的 0–3 层伤势；通过 Trigger Engine 接收 Actor 和 Combat 事件。","when":"需要 Drakkenheim 自定义状态或伤势规则时使用；复活仪式由可选的消逝灵魂模块独立提供。","requires":["十九种通用状态与伤势：Foundry 14.364 / dnd5e 5.3.3，或精确 ServerNext 14.368 / 6.0.5 限定本地候选","交叉配对、其他版本和其他系统拒绝；Next 原生武器 Slow 写入已有与 WMP 联合的限定实机证据","GM / active GM","已安装并启用配套 Trigger Engine；伤势不要求消逝的灵魂"],"steps":[{"title":"启用两个模块","text":"在精确支持版本的世界启用 Trigger Engine 和 Custom Conditions。Custom Conditions 通过 Trigger Engine 的公开事件接口接收 Actor 更新、回合开始和回合结束。"},{"title":"打开状态管理器","text":"以 GM 选中或标记 Token，从模块设置或 Token 控制栏打开“管理自定义状态”。面板可以对目标施加、编辑、停用和解除状态。"},{"title":"启用并管理伤势","text":"在 Custom Conditions 的模块设置中打开“启用伤势自动化”，按需打开“管理 NPC 伤势”；新世界默认关闭。升级时沿用旧模块已有开关，不自动扩大管理范围。在管理器伤势区域调整 0–3 层，或在 Token HUD 左键增加、右键减少；Token Action HUD 显示当前层数。倒地后第一次恢复正 HP 增加一层，恢复满血或成功短休／长休清除，保留的自然 19／20 清零死亡计数并恢复 1 HP；第三层倒地仍由 GM 裁定。"},{"title":"填写状态实例参数","text":"骰式来自施加状态的特性。Bleeding 与 Burning 跨来源只采用较高值，以骰式平均值比较，平手保留现有值；Burning 的伤害类型跟随胜出者。两者默认在自身回合结束时结算。Frozen 使用 escapeDC；Jinxed 与 Valor 使用各自骰式；Token Action HUD 以 6、4 等数字显示 1d6、1d4 的骰子面数，复合骰式显示紧凑式，过长时角标截短，完整式在管理器可查，不代表掷骰结果。"},{"title":"使用生成的物品模板","text":"生成器会在物品 ActiveEffect 中写入 flags.fvtt-custom-conditions.condition 模板。施加模板后模块生成新的 Actor 实例 ID，手工施加和生成来源使用同一套 schema。"},{"title":"用动作尝试解除 Frozen","text":"点击 Frozen 行的“破冰（动作）”按该实例 DC 做力量（运动）检定。默认由目标自己尝试；标记目标并另选中一名生物即可协助，GM 确认接触范围。完成检定后消耗动作，成功解除；取消不消耗。"},{"title":"阅读状态说明与管理伤势","text":"状态名称和悬停说明随 Foundry 界面语言显示中文或英文。Token Action HUD 的完整提示采用 dnd5e 规则卡布局，标题、状态类别与分段正文分开，图标保留在 HUD 按钮；仅名称和无提示模式仍由 TAH 设置控制。十九种自定义实例各采用选定的 Game-icons.net SVG；笨拙用 Drop Weapon，踉跄用 Foot Trip，署名和 CC BY 3.0 许可见模块包内 CREDITS.md。全部 19 项使用 fvtt-custom-conditions.\u003c条件 ID> 独立状态 ID；自定义 Dazed 的 HUD 标题只显示恍惚或 Dazed，仍与 MCDM 同名状态分开。五个必填参数状态点击后打开绑定当前 Actor、预选状态的管理器，其余十四项通过 Custom Conditions API 切换带模块 flag 的实例；Frozen 和 Shocked 的子状态由复合来源提供时不重复创建，多来源在管理器中处理。伤势由本模块的独立分层区域管理，不要求复活模块；启用可选的消逝灵魂模块后，区域另提供复活仪式入口。旧伤势数据原件保留，新伤势写入本模块 flags；复活历史继续归复活模块。伤势使用此前选定的 Bandaged 原图，层数由状态标签显示。"},{"title":"判读几个容易混淆的状态","text":"本模块的恍惚在自己的回合可从自主移动、动作、附赠动作中选择一种；选定后不能再执行另两种，但不额外禁止反应。震愕继承恍惚的三选一规则，同时使针对目标的攻击检定有优势、掉落手持物品；拿取、拔出或收起物品仍需要动作。三选一是本项目按用户决定调整的规则，不宣称为 Drakkenheim 正式文本。Frozen 的特殊重击限于使用造成钝击伤害的武器命中目标；不是任意钝击法术或普通徒手打击。英勇在攻击检定或豁免检定时加上实例骰值，厄运减去骰值；虚弱使武器攻击或法术伤害总值减半，实际应用到 HP 时向下取整，聊天表达式仍可能出现小数。踉跄在自己的回合最多完成一次武器或徒手攻击；加入徒手是本项目相对可公开核对的 Beta 文本所作扩展，正式版 Appendix C 尚未逐条核对。"},{"title":"区分原生状态与自定义入口","text":"选中单个 Token 后展开 Token Action HUD 的效应组：dnd5e 原生「失血」是裸 bleeding，本模块「流血」是 fvtt-custom-conditions.bleeding；原生「燃烧」是裸 burning，本模块「灼烧」是 fvtt-custom-conditions.burning。GM 点击流血、灼烧、冻结、厄运或英勇只会打开固定该 Actor、预选对应状态的管理器，不会直接施加空参数状态；填写必填骰式、伤害类型或解除 DC 后再施加。其余十四项使用模块 API 切换。本轮 CoTN 页面已确认十九个自定义入口各显示一次，也确认点击流血打开绑定 Actor、预选流血的空参数管理器；其余按钮尚未逐项点击或结算。旧 TAH 布局的 action ID 隐藏和排序偏好不保证自动迁移。"}],"outputs":["Actor 上带参数的 Custom Conditions ActiveEffect 实例","物品上的可重复使用 Condition 模板","由 active GM 和 Combat 事件驱动的流血、灼烧等结算","本模块 injury flags 与分层伤势投影；保留旧伤势原件"],"limits":["本期包含 Addled、Bewildered、Bleeding、Burning、Clumsy、Dazed、Defenseless、Distracted、Enfeebled、Frozen、Helpless、Immobilized、Jinxed、Shocked、Sickened、Slowed、Staggered、Valor 和 Weakened","Bloodied 使用 dnd5e/FVTT 原生能力；Drakkenheim Madness 与 Contamination 不在本期目录","距离、环境和坠落落点由 GM 结合地图裁定；模块不会把不明确的来源规则猜成自动化","Immobilized/Frozen 拦截拖拽、方向键以及非 GM 的 HUD/配置位置编辑；GM 坐标编辑和 API 强制位移保留用于裁定，不消耗 Dazed 自主移动选择","恍惚／震愕三选一的普通顺序行为由回合旗标拦截；攻击异常或后续 Hook 否决可能保守限制到回合结束。跨客户端同时控制同一 Actor、两个非攻击活动弹窗交错完成尚未保证严格互斥","CoTN 原模组组合验收复用常驻 server-mirror 的 cor-cotn 世界、端口 30001；历史 fvtt-v14-module-matrix 隔离 E2E 不能替代该组合验收。键盘长按受工具能力限制未验收","构建、单测和安装 hash 不能代替 Foundry v14.364 中的真实 UI、Combat、ActiveEffect 和骰式运行时验收","自定义名称保持原样；更改界面语言后重载。原生失血/燃烧按钮不等于已配置骰式的自定义流血/灼烧。CoTN 的全 19 项入口可见性已单独验收；其余 18 项点击及本轮逐项玩法结算未执行，构建或单测不替代该结果。","伤势为运行时分层 condition，未加入生成器的十九种 ConditionId；本轮不新增伤势 Actor JSON 生成功能。","旧数据冲突、未知 schema 或重复伤势投影会停止自动迁移并提示；先由 GM 核对，模块不会任意删除或选择一个值。","新 Custom Conditions 与仍写伤势的旧复活模块同时启用时，伤势自动化拒绝运行；须使用配套新版本。","6.0.5已有伤势／休息、状态实例、选定检定／攻击／伤害、特殊暴击、真实HP与回合结算、移动／冰冻逃脱、行动限制／攻击次数／装备动作，以及真实HUD参数提交／病弱开关与原值恢复接受。AC5e14.603.2限定适配已验。Next原生武器Slow的system.changes写入、强弱接替及WMP同卡伤害后的一条原生Slow已实机验证；旧5.3.3写法保持。十九状态的全部动作组合仍未逐项验收。自有玩法夹具、文档等价包安装和限定重载读回已闭合；个人HUD旧坐标、孤立旧Setting历史及一处外来Scene旧完整来源未捕获，不声称全部历史字节复原。"],"keywords":["Custom Conditions","自定义状态","Bleeding","Burning","Frozen","Jinxed","Valor","ActiveEffect","参数化","伤势","Injury","分层状态"],"sources":["foundry-modules/fvtt-custom-conditions/README.zh-CN.md","foundry-modules/fvtt-custom-conditions/CREDITS.md","docs/runbooks/custom-conditions-and-trigger-engine-usage.md","docs/reviews/2026-09-22-condition-hud-localization.md","docs/reviews/2026-09-23-existing-condition-icons.md","docs/reviews/2026-09-23-condition-tooltip-native-layout.md","docs/reviews/2026-09-23-drakkenheim-condition-wording.md","docs/reviews/2026-09-23-cotn-burning-hud.md","docs/reviews/2026-09-24-custom-burning-hud.md","docs/reviews/2026-09-24-all-custom-condition-hud-audit.md","docs/plans/2026-10-02-injury-condition-ownership.md"],"watch":["foundry-modules/fvtt-custom-conditions/"],"module":"fvtt-custom-conditions"},{"id":"fvtt-json-forge","title":"FVTT JSON Forge","category":"convert","summary":"在Foundry内生成并审核Actor/Item，或由人类MD提取多生物与固定自动化配置，导入后明确启用。","when":"已经打开 Foundry，希望直接把结构化资料或原始文本整理成世界中的 Actor/Item 时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","GM","结构化 Actor/Item 来源，或已完成审阅的 Intake 结果","AI 模式的客户端 Provider、协议、模型和 API Key（仅使用 AI 时）"],"steps":[{"title":"启用并打开三个入口","text":"在精确支持版本的世界启用模块；GM 在“配置设置 → 模块设置”中会看到 Forge Actor、Forge Item 和 Forge Intake 三个入口。非 GM、版本不符或 ApplicationV2 不可用时不会创建世界文档。"},{"title":"生成 Actor","text":"在 Forge Actor 中粘贴或导入结构化 Actor 来源，填写显示名称并完成生成。先阅读预览、来源、验证状态和诊断，只有通过检查的 accepted 结果才允许创建。"},{"title":"生成 Item","text":"在 Forge Item 中提交单一、受支持的结构化物品来源，核对预览后创建或复用世界物品。这个入口不会替你修改角色卡。"},{"title":"审阅 Intake","text":"在 Forge Intake 选择 plaintext-actor、ai-monster 或 ai-item；Analyze 只建立来源证据，Generate Candidate 后还必须同时通过 formal verification 和 review，最后由 GM 点击 Confirm Create。"},{"title":"管理复查与批量队列","text":"在 Forge Intake 管理来源库、审查包、混合 Actor/Item 合集与批量队列。历史 accepted 记录需显式开启新尝试；队列一次运行一项。刷新或关闭页面会中断任务，不会自动重发 AI 请求。"},{"title":"从人类写法MD生成战斗包","text":"读取包含2至6种生物完整数据与召唤规则的MD。AI提取生物及固定能力参数，工具生成控制入口；核对后一起导入并明确启用。已启用固定配置在刷新时恢复，可在控制面板停用。"}],"outputs":["带 Forge source/artifact identity 的 Foundry Actor 或 world Item，以及创建后的 readback 结果","正式验证、审阅、诊断、来源库、Collection 和可恢复队列数据","按 sourceId 派生的确定性 Document ID 和重复复用状态","人类MD路径可生成多个独立Actor、一份绑定宏及来源审核记录；每次召唤在场景中创建独立指示物。"],"limits":["只支持 Foundry 14.364 / dnd5e 5.3.3 / core profile，且所有创建入口只允许 GM","不支持 OCR、PDF、图片 Intake、update/overwrite、按名称合并、embedded Item 产品入口或跨 Document 原子事务","API Key 默认只在当前页面内存，显式持久化时也只写当前浏览器 local storage；不会进入世界 Document、Chat、review bundle、Collection、日志或响应","页面关闭后不会继续 AI/HTTP；本地构建或 Lab 结果不等于目标世界 runtime、生产或四小时真实会话验收","AI不编写宏代码。固定入口仅调用模块内已实现能力；旧式脚本包仍需独立代码审核。导入不自动启用，关闭控制面板也不等于停用。","0.3.0为未发布候选。本地Intake默认DS API deepseek-flash（V4.1 Flash），不转送其他Provider凭据；非本地保留原连接选择。","本地已测守护真实减伤和耗尽削弱；重复腐化证据部分通过，按用户决定留待独立状态设计。Dazed修复专项和浏览器完整AI生成链尚未复验。","人类MD模板可用于不同生物；自动化仅限已实现能力形态，不保证任意召唤数量、触发或机制均支持。","Actor蓝图保留来源HP；场上NPC Token重掷HP遵从世界设置，控制器不覆盖。已有其他来源的启用状态不由控制器接管或提前结束。"],"keywords":["Forge","Actor","Item","Intake","structured","review","accepted","readback"],"sources":["foundry-modules/fvtt-json-forge/README.zh-CN.md","tools/forge-encounter/README.md"],"watch":["foundry-modules/fvtt-json-forge/"],"module":"fvtt-json-forge"},{"id":"fvtt-selected-token-sync","title":"框选 Token 同步","category":"play","summary":"把一个 Token HUD 发起的核心状态和 Foundry v14 movementAction 同步到当前选中的其他 Token。","when":"需要对一组 Token 同时切换状态或移动方式，并希望保留每位用户独立的开关时使用。","requires":["Foundry VTT 14.364","dnd5e 5.3.3","至少两个可控制且可更新的 Token","当前用户拥有对应 Actor/Token 权限"],"steps":[{"title":"启用模块","text":"在精确支持版本的世界启用 Selected Token Sync；模块不会要求 libWrapper，也不修改 Foundry 或 dnd5e 原型。"},{"title":"打开同步开关","text":"在 Token 场景控制栏打开“框选 Token 同步”。这是每位用户独立保存的 client setting，默认关闭；开关打开时模块会拒绝与已启用的 multistatus 同时工作。"},{"title":"框选同步集合","text":"在画布上选中需要同步的多个 Token；模块以点击 HUD 时的选择为准，并对同一个 linked Actor 去重。"},{"title":"从一个 HUD 发起操作","text":"打开选中集合中一个 Token 的 HUD，点击核心状态图标或 movementAction（walk、fly、swim、burrow、crawl、climb 或默认）。状态、overlay 和移动方式会复制到其余合格 Token。"},{"title":"关闭并核对字段","text":"再次关闭工具栏开关即可恢复单 Token 行为；选择“默认”时核对 TokenDocument 的 movementAction 为 null，Actor 的 system.attributes.movement.walk 等速度字段不会被改写。"}],"outputs":["选中 Token 的核心 Active Effect 状态和 overlay 同步","选中 Token 的 movementAction 批量更新","按 Token/Actor 去重并带权限失败提示的同步事务"],"limits":["仅处理 Token HUD 核心状态按钮和 v14 movementAction；物品、法术、DAE、MIDI-QOL 或其他模块直接产生的 ActiveEffect 不会触发同步","只更新 TokenDocument movementAction，不修改 Actor 移动速度或 Actor system 字段","同步由发起操作的当前客户端执行，权限不足或对象不唯一时会停止；multistatus 启用时模块会拒绝同步模式","仅支持 Foundry 14.364 与 dnd5e 5.3.3；单测、构建和安装检查不代替真实 HUD/多客户端回放"],"keywords":["Token","HUD","框选","状态","overlay","movementAction","multistatus"],"sources":["foundry-modules/fvtt-selected-token-sync/README.zh-CN.md"],"watch":["foundry-modules/fvtt-selected-token-sync/"],"module":"fvtt-selected-token-sync"},{"id":"monster-spell-resolver","title":"怪物法术解析器","category":"convert","summary":"读取生成 Actor 的可移植法术清单，在目标世界可读的 dnd5e Item pack 中选择法术，并安全水合模块拥有的 Spell 与 Cast Activity。","when":"生成 Actor 已携带有效 spell manifest，需要把便携法术引用解析到当前世界的具体法术资料包时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM/活动 GM 权威","带有效 spellManifest 的生成 Actor","至少一个已启用且可读取的目标世界 dnd5e Item 法术包"],"steps":[{"title":"启用并等待来源索引","text":"在精确支持版本的世界启用模块；世界 ready 时模块读取已启用且可读的 Item pack 并建立来源索引。来源不可读、规则元数据无效或运行时不兼容时保持禁止写入。"},{"title":"配置来源优先级","text":"在“游戏设置 → 模块设置”打开“目标世界法术解析器”，按包 ID/合集 ID 调整来源顺序，查看 2024/2014 计数和诊断，并在来源变化后点击“重建来源索引”。"},{"title":"解析带清单的 Actor","text":"在带有效 spellManifest 的 Actor 目录条目中使用标题栏或右键菜单的“解析或重新解析法术”；创建或更新这类 Actor 时也可能由模块排队处理。普通无 manifest Actor 不会被扫描。"},{"title":"处理人工检查","text":"若出现法术解析检查窗口，选择一个具体目标法术来源；对模块管理内容的人工修改逐项选择“保留人工修改”或“用生成内容覆盖”，关闭窗口等同取消。"},{"title":"查看结果与回退","text":"从同一 Actor 菜单查看解析报告、来源、导出诊断或撤销上次水合；状态为 hydrated 只表示模块拥有缓存投影已完成，原生 Cast 的攻击、豁免、目标、消耗仍需单独使用验证。"}],"outputs":["Actor 内模块拥有的 embedded Spell 和与生成 feature 关联的 Cast Activity","spellResolution 状态、来源选择、投影差异、报告和撤销快照","目标世界来源索引的包信息、规则计数、哈希和阻断诊断"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片；只有有效便携 manifest 的 Actor 才有资格处理","只修改模块拥有的 embedded Spells 和明确关联的 Cast Activities，不按名称扫描全世界，不修改 Compendium、Foundry/dnd5e 原型或生成阶段 manifest","水合按 Actor 全有或全无执行，中途失败尝试补偿回滚；人工 Keep/Overwrite/Cancel 未完成时不会 Apply","portable/static manifest、目标世界 hydration、native Cast runtime 和生产接受是不同层级；单测、build 或 hydration 成功不能替代后两层","Next 14.368／6.0.5 本轮十法术自动水合的完整归属及正常 UI Undo／重载后 pending／零缓存通过；本轮没有 Review／Apply 点击，完整原生 Cast 矩阵未执行。"],"keywords":["怪物","法术","spell manifest","水合","Cast Activity","2024","2014","来源索引"],"sources":["foundry-modules/monster-spell-resolver/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/monster-spell-resolver/"],"module":"monster-spell-resolver"},{"id":"open-session-deck","title":"开放式跑团副屏","category":"play","summary":"GM-only 的队伍与遭遇工作台，可在 Foundry 主窗口或同会话浏览器副屏查看并处理跑团状态。","when":"GM 需要第二块显示器上的队伍、遭遇、先攻和回合操作，同时不想启动第二个 Foundry 客户端时使用。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM","用于队伍来源的世界级 Actor 文件夹","允许浏览器打开同会话弹窗（使用副屏时）"],"steps":[{"title":"启用并确认 GM 入口","text":"在精确支持版本的世界启用模块并以 GM 进入；Token 场景控制栏会出现“开放式跑团副屏”按钮，模块也注册 GM-only 的 toggleDeck 快捷键。"},{"title":"打开工作台","text":"点击 Token 控制栏的表格图标打开上次使用的面板或副屏模式；如果弹窗被浏览器阻止，模块会回退到 Foundry 内面板。"},{"title":"设置队伍来源","text":"在工作台的队伍设置层选择世界级 Actor 文件夹，并决定是否包含子文件夹；保存后成员和临时同行 NPC 会按文件夹重新计算。"},{"title":"处理队伍与遭遇","text":"在队伍/遭遇页查看当前、基础和临时 HP、AC 修正、激励、力竭、状态、专注和死亡豁免；GM 可批量处理 HP 与显式状态、编辑/交换小数先攻、投掷缺失 NPC 先攻、切换回合和定位主画布 Token。"},{"title":"使用同会话副屏","text":"点击打开副屏后将窗口移到第二显示器；它由 GM 已登录会话渲染，关闭副屏或切回面板不会创建第二个世界连接。"}],"outputs":["Foundry 内 ApplicationV2 队伍/遭遇面板","同会话浏览器 popout 的队伍占位、NPC 操作卡和回合信息","通过原生 dnd5e Actor、Token 和 Combat API 完成的 GM 状态更新"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片，所有 UI 入口和命令都重新检查 GM 权限","玩家先攻隐藏只是界面呈现，不保证对检查客户端文档数据的玩家保密","副屏不加载第二个 Foundry world URL、Canvas、登录页或模块 socket；不提供独立玩家面板、行动自动化、第二张地图、AI 或自定义网络协议","构建、安装 hash 和单测是机械证据；真实 GM/玩家运行与视觉验收仍需在精确版本中单独完成","Next 14.368／6.0.5 本轮原生力竭效果 ID 与面板 3→4→3、普通重载通过；其余命令、副屏和完整 GM／玩家矩阵未扩大验收。"],"keywords":["跑团副屏","队伍","遭遇","先攻","HP","Combat Tracker","GM"],"sources":["foundry-modules/open-session-deck/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/open-session-deck/"],"module":"open-session-deck"},{"id":"session-monitor","title":"跑团会话监测器","category":"maintain","summary":"由 GM-only Foundry 模块和 Windows/Chrome companion 共同记录隐私过滤的浏览器、进程和生命周期排障时间线。","when":"需要定位跑团期间卡顿、renderer 变化、CDP 断连或浏览器内存信号时，按任务范围记录；长时验收须有明确要求及真实会话证据。","requires":["历史目标 Foundry 14.364 / dnd5e 5.3.3；ServerNext 14.368 / dnd5e 6.0.5 的代表切片已验，具体范围见限制","GM","正常登录的 Foundry 世界","专用 Chrome profile 和可运行的 companion"],"steps":[{"title":"启用并确认 GM 面板","text":"在精确支持版本的世界启用模块并以 GM 进入；世界 ready 后页面会出现“跑团会话监测器”面板。玩家客户端不会启动监测运行时。"},{"title":"启动 companion","text":"需要同时记录 Chrome/Windows 信号时，在已授权的监测范围内从仓库根目录启动 companion；它只创建和管理自己的专用 Chrome profile，并等待 GM 正常登录，不读取日常浏览器凭据。","command":"bun run monitor:session -- record"},{"title":"开始记录","text":"在 GM 面板点击“开始”；模块建立 IndexedDB 会话并立即采样，companion 在没有 active session 时会通过模块 API 开始或续接同一 session ID。"},{"title":"标记卡顿","text":"记录期间遇到卡顿时点击“刚才卡顿”，或使用已注册但默认未绑定的 markJank GM 快捷键；关闭专用 Chrome 会被记录为下一代浏览器并尝试恢复同一会话。"},{"title":"停止并查看报告","text":"跑团记录结束后点击“停止并导出”或按 Ctrl+C 结束 companion；检查 browser-session.json、companion.jsonl、companion-events.jsonl、session-combined.json、report.md 和 heap-timeline.svg。"}],"outputs":["Foundry 模块导出的 browser-session.json","Chrome/Windows 采样、错误和浏览器/renderer 代际事件 JSONL","合并后的 session-combined.json、隐私过滤 report.md 和 heap-timeline.svg"],"limits":["历史接受绑定 Foundry 14.364 / dnd5e 5.3.3；Next 6.0.5 仅接受下列代表切片，v1 只在 GM 客户端运行；模块和 companion 只观察，不清缓存、不改设置、不删文档、不写 LevelDB","companion 只管理专用 Chrome profile，不接管日常 Chrome，不读取 Cookie、密码或浏览器凭据；GM 必须正常登录","单次会话最多 12 小时、4,320 个浏览器采样、10,000 个事件和 1,000 个错误，达到上限会标记 truncated 并安全停止","本轮只执行短会话；长时 Foundry／Chrome 验收需明确任务授权，指标相关性不等于因果证明。","Next 14.368／6.0.5 本轮短会话 start／mark／stop、重载和既有历史保护通过；不代表长时采样、companion 或四小时跑团接受。"],"keywords":["跑团","会话监测","卡顿","Chrome","CDP","renderer","heap","隐私"],"sources":["foundry-modules/session-monitor/README.zh-CN.md","docs/reviews/2026-10-01-next-605-custom-module-restoration.md"],"watch":["foundry-modules/session-monitor/"],"module":"session-monitor"},{"id":"fvtt-weapon-mastery-properties","title":"Weapon Mastery & Properties / 武器精通与特性","category":"play","summary":"独立配置官方武器精通与家规武器特性，记录效果来源、目标关系和持续规则；已完成锁定版本的本地验收，交付候选尚未发布。","when":"需要在 dnd5e 中配置官方八种精通，或增加 Deadly、Fatal、重击流血并区分同类规则的来源与叠加时使用。","requires":["Foundry 14.364 / dnd5e 5.3.3","fvtt-custom-conditions 与 fvtt-trigger-engine：0.1.1起的旧0.1.x或精确0.2.0，且公开API版本1／所需能力与方法完整","当前活动 GM；明确授予角色掌握资格或来源/GM 指定的 NPC 资格","ServerNext候选精确14.368／6.0.5；CC原生武器效果能力，启用Midi时须精确14.6.0-beta.4338eeab.local.10；新版实机范围见当前迁移进度"],"steps":[{"title":"构建并核对候选","text":"显式构建固定源码及产物身份；安装和校验读取同一固定产物，不隐式重建。源码改变后重新构建。协调共享 Lab 后再安装；字节一致不等于玩法通过。","command":"bun run test:weapon-mastery-properties\nbun run build:weapon-mastery-properties"},{"title":"配置武器","text":"在模块设置中打开武器精通与特性管理器，选择角色或世界中的武器，明确启用。选择原生精通或独立的自定义预设，并配置一项首批家规特性；已有武器默认不启用。"},{"title":"区分规则和来源","text":"复制官方预设会建立独立规则 ID。检查生效目标、来源、持续时间和叠加分组；Vex 只对相应攻击者与目标关系提供效果，官方 Slow 与既有 Slowed 状态不同。"},{"title":"按实际结果验收","text":"检查命中/未命中、额外攻击额度、豁免、位移、持续效果和取消攻击。Nick 提醒卡不代表动作额度已验证；只出现伤害数字不代表目标已经受伤。"},{"title":"复核保存的接受证据","text":"本地接受原件、构建身份和覆盖边界见终审记录。已关闭批次的对象已清理；需要新的受影响验收时，先核对目标版本和服务 owner，准备独立批次。"}],"outputs":["经过版本化校验的武器配置与官方/家规规则身份","带来源、目标和叠加组的效果实例","可复查的攻击与一次性效果消费记录"],"limits":["本次精确接受CC／TE0.2.0，0.2.1或不完整API仍拒绝。新组合在14.364／5.3.3的实际ready、原生攻击／伤害、TE事件及CC Vex建立／消费和原值恢复通过；和9/29其他属性原身份分开，不推广6.0.5、生产或全部并发情形。","已完成Foundry14.364/dnd5e5.3.3本地交付候选验收。官方八种精通与三项家规采用已保存真实运行及受影响自动化组合覆盖；原生Vex/流血、当前SY玩家伤害应用与在线GM结算、正式生成导入/持久化均有对应证据。11个已审查测试批次已清理，原场景、Combat、暂停和模块配置恢复。各收据保留实际构建，不宣称全部角色/棋子组合、生产或其他版本均已验收","Midi 14.0.11 的卡片内 Apply 使用精确消息、目标和实际HP变化校验；已修复连续更新省略未变化字段造成的证明拒绝。没有来源消息的右键应用路径仍失败关闭；若缺少有效预检，阻止掷骰并提示错误，不另开原生骰窗","同武器Midi Vex收据可从已保存检查点、第二击消息/卡片和效果读回自动关联；Cleave父子伤害也有只读关联。原生或换武器收据不能套用Midi关联规则，部分原件保留INCOMPLETE标签，需按原始消息、HP与效果独立判断。主进度终审记录这些边界及文档打包与实测构建的等价证明","不支持 PF2e 系统，不移植三行动制、连续攻击减值或 AC+10 重击","默认最多一项新增家规特性，Deadly 与 Fatal 互斥；不自动按武器名称或魔法加值授予效果","精确 Fatal 和状态生命周期依赖运行模块；core 原生数据不等于完整武器自动化","显式配置WMP的v14固定来源伤害保留原骰式，不另加属性伤害；生成器绑定基础骰用于Fatal等规则。修改或重排伤害段会使绑定失效，需重新生成并验证。原生基础伤害武器继续使用原生路径；正式JSON校验通过不等于游戏内导入及攻击已验收","house-rules 保留原有弹药与重击规则，仅作为可选兼容对象；不允许其他精通模块重复结算同一效果","新增精确14.368／6.0.5候选及CC原生武器效果能力门；开启Midi须精确14.6.0-beta.4338eeab.local.10。本地Next已验证ready、原生Slow强弱接替、Fatal真实伤害骰及公开use单次攻击；同一卡片攻击19／伤害骰17后，经新的明确Actor.applyDamage步骤使目标HP2→0并写入一条CC原生Slow。掷骰前真实取消无攻击消息、无预留且Sap仍启用。r80原连续流程超时失败不改写为通过；自有玩法夹具、文档等价包实装及限定读回已闭合。个人HUD旧坐标、孤立旧Setting历史及一处外来Scene旧完整来源未捕获；全部精通矩阵未验。","公开WMP.api.use在Midi启用时只启动一次攻击，使用同一预检编号并传入指定棋子。指定目标缺少当前画布可用棋子、或message.systemCard会被拒绝。攻击完成可返回待伤害结算；不强制开启自动伤害，不把返回或掷出伤害当作实际扣血。取消窗口不另开备用攻击。"],"keywords":["武器","精通","Mastery","Properties","Deadly","Fatal","Sap","Vex","Nick"],"sources":["foundry-modules/fvtt-weapon-mastery-properties/README.zh-CN.md","docs/plans/weapon-mastery-active-case.md","docs/runbooks/weapon-mastery-cotn-e2e.md","docs/reviews/2026-09-25-weapon-mastery-user-report.md"],"watch":["foundry-modules/fvtt-weapon-mastery-properties/","packages/contracts/src/weapon-properties.ts","packages/contracts/src/weapon-effects.ts"],"module":"fvtt-weapon-mastery-properties"}],"reviews":{"web-workbench":{"fingerprint":"48bcc04dcc1ecea8b1a474f7b8e6773850e464c1c5becf108afd4088281f6827","reviewedOn":"2026-09-12","note":"对照 CLI 参数、Web 与 Intake 文档，区分文本和 OCR 链路、目标版本、来源验证与运行时边界"},"markdown-convert":{"fingerprint":"fb4ab24216afa239e8e443a5f45ea055a5ce5b680febaa70adb56ee447dd9d75","reviewedOn":"2026-10-05","note":"对照r92/r95最终父审、现有模块README和支持矩阵复核七条：仅CC/WMP结论改为限定清理与文档包实装读回已闭合；r80旧断链、个人HUD旧坐标、孤立Setting及一处Scene旧完整来源限制保留。生成、Intake、验证入口输出不变，watch未缩，未提升全部玩法或生产。"},"monster-intake":{"fingerprint":"0bcd1989f9d62953bb99680dab9cd625f7907008cb7501ec4e60250d3c463a8f","reviewedOn":"2026-10-05","note":"对照r92/r95最终父审、现有模块README和支持矩阵复核七条：仅CC/WMP结论改为限定清理与文档包实装读回已闭合；r80旧断链、个人HUD旧坐标、孤立Setting及一处Scene旧完整来源限制保留。生成、Intake、验证入口输出不变，watch未缩，未提升全部玩法或生产。"},"item-intake":{"fingerprint":"0479dd66ab0b79c808a76f59a9da4d6f93d6b4d1c905024c2fbf662ca686d504","reviewedOn":"2026-10-02","note":"已对照Item verifier与Intake规则：固定目标/机制核验不变，来源本身不授权联网；未把Monster四输入命令推广到Item。"},"species-intake":{"fingerprint":"33e1f41cf5d70822873658c6de80ed9af31a46eaa5d63d9e8b3ed6b2d08f6126","reviewedOn":"2026-10-02","note":"已对照Species独立IR/ledger：既有静态/运行目标和明确构建步骤不变；授权持续与provider真实效果边界明确，未套Monster verifier。"},"document-extraction":{"fingerprint":"1fadc1f19a0a8346a15306bb247d90ae4b2bbaf709177747d8aded524ec25bcc","reviewedOn":"2026-10-02","note":"已对照文档规则：仅报告/元数据显示改变且原MD、顺序、候选及下游行为有未变证据时缩小验收；正文或消费变化/证据不足仍核完整来源链。"},"vault-sync":{"fingerprint":"f1adf7fac3afb168c26c4146801c00d476ca1e9a3679887ecdb98eb35fbddc11","reviewedOn":"2026-09-12","
