0001、cor-cotn、14.364/5.3.3 正常。没有操作 serverNext。服务恢复证据位于本地 `evidence/condition-hud-20260923/service-recovery/`；UI 原始回传位于 `evidence/condition-hud-20260922/chrome/`。\n\n视觉修订：用户否决了首版 Luna 绘制的 SVG，认为造型过于简陋；此前 32px 可读性检查不能代表美术风格获得接受。用户明确指定 **Astra / medium** 重画，本轮以 dnd5e 原生图标为参照，重新检查白色剪影、负形、视觉重量和语义辨识。语言及伤势功能验收继续，图标美术结论单独重验。\n\nAstra / medium 已完成 19 张状态与 4 张伤势 SVG 重绘。主任务审阅代表样稿后要求消除“无助”中类似医疗十字的造型，最终整套已通过 32px／64px 联系表检查；23 张 XML／栅格化、唯一内容、精确文件集合与透明背景检查通过。这是新候选的资产检查，用户美术意见和真实 HUD 展示仍独立记录。预览与校验记录位于本地 `evidence/condition-hud-20260922/astra-icons/`。\n\n## 定位结论\n\n1. Custom Conditions 原注册只提供英文 `name` 和复用的系统图标，管理器直接使用共享契约中的英文 label；没有完整的界面语言展示层。\n2. 伤势原注册 `name=IFS.Status.Injury`，但已安装 Token Action HUD dnd5e 2.1.0 的状态构建读取 `game.i18n.localize(status.label) ?? status.name`，不会保证对 name 再做一次翻译。\n3. 同版本 HUD 的状态 tooltip 读取 `CONFIG.DND5E.conditionTypes[id].reference` 并加载系统规则文档。简单地为自定义状态加 `description` 并不能让这个 HUD 显示规则。\n4. Token Action HUD Core 2.1.1 提供 `tokenActionHudCorePreRender(hud, hudManager)` 扩展 Hook。可以仅装饰本模块拥有的 action，无须修改 HUD 源码或创建假规则文档引用。原生同 ID 状态保留原系统展示和规则。\n\n## 数据来源\n\n- 用户提供的两张 Token Action HUD 截图（2026-09-22）。\n- 仓库 Custom Conditions 的 `src/runtime.ts`、`src/manager.ts`、语言文件和共享 `packages/contracts/src/conditions.ts`。\n- 仓库 Injury & Fading Spirits 的 `src/projection.ts`、`src/runtime.ts` 及模块边界说明。\n- server-mirror 已安装 Token Action HUD dnd5e **2.1.0**：`scripts/token-action-hud-dnd5e.min.js` 的状态构建与 tooltip 路径。\n- server-mirror 已安装 Token Action HUD Core **2.1.1**：`dist/token-action-hud-core.min.mjs` 的 `tokenActionHudCorePreRender`。\n- server-mirror 精确 dnd5e **5.3.3** 与 Foundry **14.364**，不据最新版 API 推断行为。\n\n## 采用的职责划分\n\n用户确认采用：统一名称、说明、独立图标和 Custom Conditions 管理入口；伤势层数及复活历史仍以伤势模块 Actor flags 为唯一事实。复用已授权的旧伤势 HP 桥接，内部／外部来源互斥。Trigger Engine 的死亡事件提示仅邀请活动 GM 打开仪式，不能将 HP 归零当作已死亡，不能自动掷骰或代替裁定。\n\n## 待验收\n\n已完成的离线证据：Custom Conditions 的模块测试 **39 PASS / 0 FAIL / 198 assertions**，模块类型检查与构建通过。覆盖语言回退、原生状态归属、HUD 提示偏好和转义、可选伤势 API、快速加减的顺序处理及失败后队列恢复。19 张状态 SVG 与 4 张伤势 SVG 已解析并渲染 32px／64px 联系表；修正了低对比的定身等图标。以上不替代真实 HUD 的悬停与视觉验收。\n\n本轮审核发现并要求修正：对话框等待占用事件队列、关闭自动化后的提醒门禁、设置变更重新订阅、未生效死亡效果误判、缺少 revision 的重复 HP 转移，以及伤势管理器快速点击丢失层数。这些意见已通过代码复审闭环。伤势最终测试为 **77 PASS / 0 FAIL / 459 assertions**，模块类型检查与构建通过，包含延迟提示标记和 HP 恢复交错的回归。真实浏览器验收仍待执行。\n\n- [ ] 中文和英文名称／完整描述，HUD 悬停显示以及 `none` / `nameOnly` 偏好。\n- [ ] 独立 SVG 在 32px 状态栏及伤势层数图标下可辨。\n- [ ] 原生同 ID 状态未被覆盖，用户自定义名称未改写。\n- [ ] 伤势管理器通过公开 API 调整层数；关闭可选模块时入口安全隐藏。\n- [ ] 内外 HP 事件来源互斥与重复事件保护。\n- [ ] 明确死亡后只提醒活动 GM，取消提醒不改变仪式历史。\n- [ ] 原 CoTN 组合、精确临时对象清理和最终查看页。\n\n## 待判断本地化与新候选复查\n\n本次不引入新的第三方模块。截图中 `MonksLittleDetails.Status.*` 属于另一模块的翻译问题，未扩大为本次代码修复。若后续要求处理，先核对实际安装版本、语言包覆盖顺序与 key 是否缺失，再在 `docs/acceptance/foundry-v14-module-health.md` 使用相同状态口径记录；在实际 UI 验证前不能记为可用。\n\n## 候选安装\n\n已更新 server-mirror 两个本模块的静态文件，manifest 保持一致，无服务重启。安装前后清单与 SHA-256 位于本地 evidence/condition-hud-20260922。首次字节校验因 Bun 在不同 cwd 下生成的源码路径注释不同而失败；对照仅有注释路径差异后，统一使用仓库根 build 入口重建并更新，两个 verify-install 均通过。Custom Conditions 27 文件、伤势模块 10 文件。未触碰第三方模块、serverNext 或生产。\n\n伤势最终 **77 PASS / 0 FAIL / 459 assertions**，包含共享 Actor 状态队列、局部提示标记写入和交错恢复回归；先前审查意见均已闭环。手册 build/check 通过（28 项）。浏览器实测另行回传，不能把 installed bytes 验证当作运行时通过。\n\n收尾补录（2026-09-23）：服务恢复后，子任务已通过UI清理上述exact IDs，恢复landing page、暂停状态、IFS internal及原设置，留在CC Manager。主任务对比完整ID清单，77项与最早75项加CC/TE一致。bloodied警告的静态追踪支持dnd5e原生异步创建重入假设（连续await actor.update不保证派生效果已完成），尚无隔离复现，不能归为已修复。英文切换、真实悬停弹层和仪式邀请仍未完成。用户目前禁止画SVG，改为先审现成资源；候选见2026-09-23-existing-condition-icons.md，未经确认不替换。\n","docs/reviews/2026-09-23-condition-tooltip-native-layout.md":"# CoTN 自定义状态与伤势悬停卡视觉对齐\n\n日期：2026-09-23。目标环境：server-mirror 的 `cor-cotn`，Foundry 14.364 / dnd5e 5.3.3，Token Action HUD Core 2.1.1 / DnD5e 2.1.0。\n\n## 截图问题与分层结论\n\n用户对照的原生“受擒 Grappled”悬停卡是浅色规则卡：标题靠左、状态类别在右、正文在下。此前 Custom Conditions“无助”卡则是黑色效果面板，64px 图标居中、标题下移，底部重复“无助”，正文夹有未译的 `Critical Hit`。**这项视觉效果在此前组合验收中没有通过**；名称/描述存在和 DOM tooltip 配置通过，不能代替规则卡外观验收。\n\n本地精确版本的 dnd5e 模板 `Data/systems/dnd5e/templates/journal/page-rule-tooltip.hbs` 使用 `content → header(h2 + pill.condition) → description`。同版本 `dnd5e.css` 的 `.effect-tooltip` 将提示框固定为300px、图标64px且居中；`.rule-tooltip` 则限制最大450px并分开左右标题/类别。TAH DnD5e 对有规则文档引用的原生状态使用 `rule-tooltip`；本模块没有伪造系统规则文档，而是在已有 `tokenActionHudCorePreRender` 扩展入口中提供自有说明。\n\nFoundry 14 的 TooltipManager 默认添加 `theme-dark`，原生 dnd5e 富提示渲染另行移除该类。本模块直接提供 HTML，追加 `theme-light` 不保证清掉黑底。因此两个模块各自使用限于自有 tooltip 标记类的纸纹、金色边框和深色文字变量；不修改 Foundry、dnd5e 或第三方 TAH 的源码和全局样式。\n\n## 候选变更与权限边界\n\nCustom Conditions 的完整提示改为同一规则卡结构：中英双语标题（仅翻译不同的语言下并列）、本地化状态类别、已转义正文及可选骰式。提示框内不再重复状态名或放大状态图标；图标仍显示在 HUD 按钮。中文说明中的 `Action`、`Bonus Action`、`Reaction`、`Critical Hit`、`Speed`、`weapon attack` 改用与本地 dnd5e 中文术语一致的表达，保持原规则含义。伤势模块的完整提示采用相同标题/类别/正文结构；原有伤势层数事实和 HUD 角标不变。两模块仍尊重 TAH 的 `full`、`nameOnly`、`none` 设置。\n\n候选只修改当前开发 worktree 中的两个自有模块、各自聚焦测试及同步文档。本地 `cor-cotn` 的运行中世界 LevelDB、真实角色、其他模组、serverNext 30002 和生产均不属于此视觉修订的改动范围。现成 SVG 的选型、许可与包内署名见 [现成状态图标选型](2026-09-23-existing-condition-icons.md)，这次没有新绘制或替换图标。\n\n## 验收状态与复查\n\n聚焦测试已核对规则卡类与层级、无提示框大图标/重复名称、中文及英文、HTML 转义、骰式与角标、三个 tooltip 模式。Custom Conditions **56 PASS / 0 FAIL**，伤势模块 **81 PASS / 0 FAIL**；模块类型检查、两个模块构建及 `git diff --check` 通过。Astra 只读复审指出残留 `theme-dark` 会使状态 pill 成为深底深字；已在 Custom Conditions 的专属 marker CSS 中补浅色卡底与 pill 边框变量，复查后无剩余源码阻断项。这些结果不替代真实视觉。\n\n安装前再次核对30001 PID32196、`--dataPath=F:\\FoundryLab\\foundry-v14\\data\\server-mirror`、`cor-cotn`、Foundry14.364/dnd5e5.3.3及独立30002。按相同 manifest 和逐文件哈希，仅更新两个自有模块：Custom Conditions的 `lang/zh-CN.json`、`scripts/index.js`、`styles/custom-conditions.css`；伤势模块的 `scripts/index.js`、`styles/module.css`。预览和前后SHA-256见 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/update-preview.json` 与 `update-verified.json`。两个 `verify-install` 均通过；30001仍常驻CoTN，没有改LevelDB、重启服务、创建备份或触碰30002。\n\n两次独立 Chrome 预检因服务短时离线和连接状态变化未执行视觉项，原始阻塞记录保留在 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/`。主任务核对数据目录没有活进程或监听后，以原 Node24.17.0、Foundry14.364和连续的`--dataPath=F:\\FoundryLab\\foundry-v14\\data\\server-mirror`恢复常驻30001；启动及校验见同目录 `service-recovery-20260923-145202/launch.json`、`verified.json`。没有触碰30002。\n\n恢复后的 GPT-6 Luna 独立 Chrome 任务在真实CoTN的77项启用模组组合中完成**视觉 PASS_WITH_LIMITS**。原生 Grappled、自定义 Helpless、伤势三张卡均是浅色纸纹、左标题右状态标签、深色正文、2px金边，且提示框内图标数均为0。三者的背景为`rgb(241,235,232)`并加载dnd5e的`texture-gray1.webp`/`texture-gray2.webp`；正文为`rgb(25,24,19)`，正文对纸张计算对比度15.06:1，标签文字对底色16.25:1。Helpless显示“无助 Helpless”与“任何命中你的攻击均视为重击。”，不再夹原来的`Critical Hit`。首轮伤势卡正文仍含`episode`，这是随后单独处理的中文文案缺口，不能把首轮截图说成已汉化。完整/仅名称/无提示三档经UI切换并恢复`full/1500ms`；伤势2/3、Jinxed4、Valor6角标在实际HUD仍可见。测试Actor`ZKA7fkMG357hnKZa`及Token`K79FBgnaaMoKKejT`已通过Foundry UI清理，返回暂停的`landing page`；30001保持常驻，中文与IFS internal/已启用/复活提示开/管理NPC关及77项组合保留。\n\n证据文件：`F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/recovered-visual-20260923-154230.md`及同名JSON。截图仅在外部Chrome任务的CUA会话内联，工具没有提供本地截图保存接口；报告保留了DOM类名、计算样式、尺寸、文本和清理ID。纯移动鼠标、不点击的独立悬停动作仍是 **NOT_EXECUTED**；该工具没有单独的pointer-move操作，点击后指针停留产生的可见规则卡作为视觉证据单独记录。\n\n中文文案收尾：仅将伤势状态说明中的两处 `episode` 译为“伤势过程/这一过程”，不改变状态机或其他文字。伤势模块聚焦测试现为 **82 PASS / 0 FAIL**，含读取真实中文语言包并检查触发与恢复语义的回归；类型检查和构建通过。确认server-mirror仍是PID13956/CoTN后，只更新伤势模块 `lang/zh-CN.json`，Custom Conditions逐文件哈希不变；预览与前后哈希见 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/injury-copy-20260923-154723/update-preview.json` 和 `update-verified.json`，两模块 `verify-install` 均通过。后续同一GPT-6 Luna外部Chrome任务重载CoTN，在真实TAH伤势动作的完整 tooltip payload 中读到“开启一次伤势过程；在这一过程中恢复到正生命值会增加1层伤势”、类别“状态”和0/3角标，没有`episode`；服务、中文、77项组合、IFS internal及TAH full/1500ms保持，页面留在暂停的`landing page`。证据为 `F:/FoundryLab/foundry-v14/evidence/condition-tooltip-20260923/chrome/injury-copy-followup-20260923-160015.md` 及同名JSON。此次窄范围文案读回没有新拍悬停卡截图，纸纹外观仍依据前一轮真实视觉证据，不能把DOM payload读回当成一张新的视觉截图。\n\n新候选复查：先核对锁定版本的系统模板、CSS、TooltipManager 与 TAH 扩展接口；若系统升级，重新比较真实渲染和类名，不能凭当前版本的静态检查推断兼容。本文不评价新的第三方模块或本地化候选；模块健康状态继续以 `docs/acceptance/foundry-v14-module-health.md` 的实际运行证据为准。\n","docs/reviews/2026-09-23-cotn-burning-hud.md":"# CoTN 中 Token Action HUD 的 Burning 显示核查\n\n> 2026-09-24 勘误：本页记录的是 **dnd5e 原生 `burning`** 的历史现场核查。用户所说的「自定义 Burning 没有 HUD 入口」指带骰式和伤害类型的 Custom Conditions Burning；原生按钮可见并未解决该问题。新候选设计见[自定义 Burning HUD 记录](2026-09-24-custom-burning-hud.md)。以下 PASS 仅属于原生按钮，不能用于新入口的视觉或功能验收。\n\n日期：2026-09-23。目标：server-mirror 的 `cor-cotn`「溟渊的呼唤」，Foundry 14.364 / dnd5e 5.3.3，端口 30001。证据为独立外部 Chrome 任务的现场记录：`F:/FoundryLab/foundry-v14/evidence/condition-burning-hud-20260923/chrome/report.md`、`dom-observations.json`；截图保存在该任务的 CUA 记录中，未导出成单独 PNG。\n\n## 结论与操作\n\n所选 Token「卡勒姆·维雷」的 Token Action HUD **有原生** Burning 按钮。鼠标离开 HUD 时动作区隐藏；在 HUD 上打开「效应」组后，系统状态子组中可见唯一 `actionId=burning`、名称「燃烧」的按钮。检查时它没有隐藏祖先、未被视口裁切，页面保留「效应」展开状态供人工查看。这项观察只说明原生按钮在该 Token 上存在；不能由此推断用户要找的参数化「灼烧」入口已经存在。\n\n该按钮的图标是 dnd5e 的 `systems/dnd5e/icons/svg/statuses/burning.svg`，tooltip 指向 dnd5e Compendium 规则项。这是原生 Burning 控件；点它不能等同于施加带骰式和伤害类型参数的 Custom Conditions Burning 实例。后者仍须通过本模块管理器或其公开 API 操作。\n\n## 已执行与边界\n\n- **PASS**：浏览器当前为 Gamemaster，30001 指向预期 `server-mirror`、`cor-cotn`；`/api/status` 报告 Foundry 14.364、dnd5e 5.3.3。Token Action HUD Core manifest 为 2.1.1。\n- **PASS**：所选 Token 的「效应」组内有唯一 Burning 按钮，按钮启用且完整落在当前视口内；打开该组后可见。\n- **NOT_EXECUTED**：没有点击 Burning、施加状态或测试结算与重载持久性；没有修改 Actor、Token、布局或模块配置。\n- **NOT_EXECUTED**：浏览器只读 evaluator 不能访问实时 `window.game`、`CONFIG`、`localStorage`，因此未直接读到 `CONFIG.statusEffects` 归属或该用户持久化的 TAH `userSelected` 字段。已渲染的按钮只证明这个 Token 当前有效 HUD 布局包含 Burning，不证明其他 Token 的布局相同。\n- **NOT_EXECUTED**：已有 Gamemaster 会话，无需重新走 `/join` 登录。没有触碰 30002。\n\n若另一个 Token 在已展开的「效应」组里仍缺 Burning，应先检查那个 Actor 的 TAH 布局项 `burning`；不要把本例推论成所有 Token 均正常，也不要为单个布局缺项改变状态所有权或全局冲突逻辑。\n\n## 再次定位给用户查看\n\n同日另一轮外部 Chrome 在现有 Token「秋」上再次找到原生「燃烧」按钮。选中 Token 后打开 Token Action HUD 的「效应」组，在「状态」网格第二行，它位于「目盲」右侧、「魅惑」左侧；没有点击或施加该状态。页面最终停在这一展开位置，30001 仍为 `cor-cotn`，77 个启用模组的数量未变。\n\n原始 CUA 截图已从该轮完成的任务记录中按原字节提取为 `F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260923/chrome-frozen-followup/burning-hud-final.jpg`，来源行号、SHA-256 和未修改字节的记录见同目录 `screenshot-provenance.json`。这张图证明所选 Token 的原生按钮可见，不证明自定义 Burning 的参数化 HUD 入口存在。用户要求不重复做已测功能，因此本轮只展示 HUD；Frozen 五段新版提示在这轮 Chrome 工具中没有可靠悬停/DOM 读取路径，仍标为 **NOT_EXECUTED**，不借静态测试冒充视觉通过。\n","docs/reviews/2026-09-23-drakkenheim-condition-wording.md":"# Drakkenheim 自定义状态文案核对（2026-09-23）\n\n> 后续变更：2026-09-24 起，本项目按用户决定把自定义 Dazed 改为「自主移动／动作／附赠动作三选一」，Shocked 继承该规则。本页记录的是当时的 Beta 文本与旧实现对照；当前规则和验收以[三选一变更记录](2026-09-24-dazed-three-choice-rule.md)为准。\n\n## 证据范围\n\n[D&D Beyond 的《Monsters of Drakkenheim》目录](https://www.dndbeyond.com/sources/dnd/modr)确认正式书的 Appendix C 含有 Conditions，但公开目录不提供该章逐条规则全文。本轮可逐字核对的条件规则来自[公开流传的 Beta 文本](https://www.scribd.com/document/873137275/Drakkenheim-Monsters-of-Drakkenheim-Beta)。因此下述 Frozen、Shocked、Valor 等措辞是对 **Beta 规则与本项目既有实现**的说明修订，不宣称已与正式版 Appendix C 全文逐条核对。将来取得正式正文后，应复核并修订差异。\n\n## 本轮判断\n\n| 条目 | 文案决策 | 边界 |\n| --- | --- | --- |\n| Shocked | 中文工作名改为「震愕」。复合效果直接写出 Dazed 的移动或动作二选一、不可使用附赠动作，Defenseless 的受攻击优势，以及掉落手持物品、拿取／拔出／收起物品各需动作。 | 「电击」容易误导为只由闪电伤害造成。Beta 的状态定义描述行为与防御损失，并非一种伤害类型；「震愕」是项目的语义翻译，不声称为官方中文译名。 |\n| Frozen | 直接写出 Immobilized 的速度 0、无速度加值及飞行坠落，Defenseless 的受攻击优势。重击限于**使用造成钝击伤害的武器**攻击冻结目标而命中的情况。 | “造成钝击伤害”单独不足以触发该重击条款，法术和徒手攻击不能只因伤害类型是钝击就算在内。另可通过标注 DC 的力量（运动）检定或达到该实例累计钝击／火焰伤害阈值解除；阈值默认 20，但可由实例参数修改。后一个解除途径不要求伤害来自武器。 |\n| Valor [X] | 与 Jinxed [X] 采用对称句式：攻击检定或豁免检定时额外掷 X，并将结果**加**到检定结果。 | X 保留实例骰式，不在状态文案写死 1d4。 |\n| Weakened | 写明武器攻击或法术伤害**总值**减半，结果向下取整。 | [2024 基本规则的 Round Down 条目](https://www.dndbeyond.com/sources/dnd/br-2024/rules-glossary)规定除乘后得到小数时向下取整。本轮只修正文案；运行时核对由本任务其他分支完成。 |\n| Dazed | HUD 的状态标题只显示「恍惚」或 Dazed；内部状态 ID 仍为 `fvtt-custom-conditions.dazed`。 | 不借可见后缀区分另一模组的裸 `dazed`，由 ID 区分。 |\n| Staggered | 文字改为自己的回合最多进行一次**武器或徒手攻击**；运行时按 dnd5e Attack Activity 的 `attack.type.classification` 统计已完成的攻击骰，并在活动使用及攻击骰预处理两个入口拦截下一次。 | 此项是用户要求的项目扩展，超出已可核对的 Beta 原文（仅 weapon attack）。锁定的 dnd5e 5.3.3 源码 `module/data/activity/attack-data.mjs` 与夹具 `packs/_source/equipment24/weapons/unarmed-strike.yml` 将 `unarmed` 和 `weapon` 分类区分；非攻击活动和 `spell` 分类不计。持久计数字段沿用 `weaponAttacks`，不迁移旧回合状态。 |\n\n[2024 基本规则](https://www.dndbeyond.com/sources/dnd/br-2024/rules-glossary)将武器和徒手打击分别列出，徒手打击条目明确以“不使用武器”描述。对于被规则明确指定为武器的天生武器，[官方 Sage Advice Compendium](https://www.dndbeyond.com/sources/dnd/sac/sage-advice-compendium)则将其视为武器。这解决了 Frozen 文字上的边界；Foundry 具体活动是否能被识别为武器，仍需针对目标 dnd5e 版本的活动数据单独验收，不能仅凭文案断言自动覆盖所有天生武器。\n\n## 后续复核\n\n1. 取得正式版 Appendix C 后，对照 Frozen、Shocked、Valor、Weakened 的原文及解除条款，更新本表和模块文案。\n2. 如目标世界将天生武器表示为非 `weapon` 类型的 Foundry Item，测试 Frozen 自动判定是否遗漏；此项属于运行规则核对，不通过扩大文案范围来掩盖。\n3. 在 CoTN 的实际 Token Action HUD 核查中英文切换、状态标题和换段；静态测试不等于浏览器视觉验收。\n","docs/reviews/2026-09-23-existing-condition-icons.md":"# 现成状态图标选型：已确认用于本地候选\n\n日期：2026-09-23。状态：用户确认采用20项现成SVG；初选已完成一次server-mirror安装与HUD复验。随后用户又确认笨拙改用 Drop Weapon、踉跄改用原笨拙的 Foot Trip；下表记录最新仓库候选映射，新映射的安装与浏览器结果须另行核对，不能沿用初选的验收。\n\n## 权限与结论\n\n用户明确禁止继续绘制SVG，并要求所有新增状态改找现成图标；先展示候选，随后明确回复“就用那个吧”，同意采用此前展示的20项。用户再看过笨拙候选的HUD尺寸预览后，明确选择 [skoll/drop-weapon](https://game-icons.net/1x1/skoll/drop-weapon.html)；踉跄按其要求接收原笨拙的 [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html)。19种Custom Conditions状态加伤势共20项，全部来自Game-icons.net；保持该库白色剪影语言。伤势1–3层共用同一原始图形，层数由HUD文字角标呈现，不自行绘制分层SVG。\n\n## 来源与验证\n\n通过AnySearch发现官方状态目录、关于页和GitHub官方仓库；随后逐页核对图标作者及CC BY 3.0链接，从每页实际列出的透明SVG下载链接保存原文件。没有描摹、修改path、组合图形或将位图转为SVG。\n\n- 官方状态目录：https://game-icons.net/tags/state.html\n- 官方许可及作者说明：https://game-icons.net/about.html\n- 官方仓库：https://github.com/game-icons/icons\n- 初筛仓库树：82d948812bfe3f269ef8f731dcdb07b08160edc4\n- 本地候选：F:/FoundryLab/foundry-v14/evidence/condition-icons-sourced-20260923/\n- 笨拙二次候选与HUD尺寸预览：F:/FoundryLab/foundry-v14/evidence/clumsy-icon-candidates-20260923/\n- selection.json记录当时20项实际下载地址、作者、许可、SHA-256及采集时的待确认状态；该原始采集记录不作为当前授权状态，用户随后已确认采用。\n- 模块内 `CREDITS.md` 随构建包一起提供逐项作者、作品、来源、原始SVG哈希及CC BY 3.0许可链接；原SVG字节未编辑，仅更名为模块内文件名。\n\n## 状态映射\n\n| 状态 | 候选 | 理由 |\n|---|---|---|\n| 心智混乱 / addled | [delapouite/brain-leak](https://game-icons.net/1x1/delapouite/brain-leak.html) | 脑力流失，表达心智受损 |\n| 迷乱 / bewildered | [lorc/uncertainty](https://game-icons.net/1x1/lorc/uncertainty.html) | 问号与回转，表达困惑 |\n| 流血 / bleeding | [lorc/bleeding-wound](https://game-icons.net/1x1/lorc/bleeding-wound.html) | 伤口滴血 |\n| 燃烧 / burning | [lorc/small-fire](https://game-icons.net/1x1/lorc/small-fire.html) | 完整火焰轮廓 |\n| 笨拙 / clumsy | [skoll/drop-weapon](https://game-icons.net/1x1/skoll/drop-weapon.html) | 手中武器脱落，表达动作失准；用户在HUD尺寸预览后确认 |\n| 恍惚 / dazed | [delapouite/knocked-out-stars](https://game-icons.net/1x1/delapouite/knocked-out-stars.html) | 眩晕星环 |\n| 无防备 / defenseless | [lorc/cracked-shield](https://game-icons.net/1x1/lorc/cracked-shield.html) | 裂开的防御盾牌 |\n| 分心 / distracted | [darkzaitzev/distraction](https://game-icons.net/1x1/darkzaitzev/distraction.html) | 人物被旁侧动静吸引 |\n| 衰弱 / enfeebled | [lorc/oppression](https://game-icons.net/1x1/lorc/oppression.html) | 受压蜷身，表示力量受到压制 |\n| 冻结 / frozen | [delapouite/frozen-body](https://game-icons.net/1x1/delapouite/frozen-body.html) | 被冻住的人体 |\n| 无助 / helpless | [delapouite/human-target](https://game-icons.net/1x1/delapouite/human-target.html) | 人体成为靶标，表达易受致命打击 |\n| 定身 / immobilized | [skoll/cement-shoes](https://game-icons.net/1x1/skoll/cement-shoes.html) | 双脚被固定的人体 |\n| 厄运 / jinxed | [lorc/cursed-star](https://game-icons.net/1x1/lorc/cursed-star.html) | 诅咒符号 |\n| 震愕 / shocked | [lorc/lightning-mask](https://game-icons.net/1x1/lorc/lightning-mask.html) | 受冲击的脸；图形含闪电，但状态规则不限定电击来源 |\n| 病弱 / sickened | [lorc/vomiting](https://game-icons.net/1x1/lorc/vomiting.html) | 恶心呕吐 |\n| 减速 / slowed | [lorc/snail](https://game-icons.net/1x1/lorc/snail.html) | 蜗牛，表达移动缓慢 |\n| 踉跄 / staggered | [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html) | 脚步绊住，表达踉跄；原笨拙图标按用户要求转用 |\n| 英勇 / valor | [lorc/winged-sword](https://game-icons.net/1x1/lorc/winged-sword.html) | 翼剑，表达勇气与增益 |\n| 虚弱 / weakened | [lorc/sword-break](https://game-icons.net/1x1/lorc/sword-break.html) | 破裂武器，表达伤害降低 |\n| 伤势 / injury | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | 包扎的人体 |\n\n## 尚待判断\n\n候选图形只表达状态概念，不改变规则。衰弱、无助和踉跄采用身体受压、人体靶标和脚步失稳作比喻；新笨拙/踉跄搭配仍须在实际HUD里核对清晰度。Dazed在CoTN有其他模组的同名状态，但自定义项以独立ID显示；不把换图当作同名状态的修复。Shocked 的 Lightning Mask 图形仍带闪电，不能据此把规则解释为仅由闪电伤害造成。\n\n## 本地候选安装与边界\n\n在确认30001仍为常驻的Foundry14.364/dnd5e5.3.3、`cor-cotn`、精确`server-mirror`数据目录后，先比较两个模块构建包与安装目录的manifest及逐文件SHA-256，再仅覆盖两个自有模块的静态文件；没有停服、重启、创建备份、改写世界LevelDB或触碰30002。安装预览与前后逐文件哈希记录在 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/update-preview.json` 和 `update-verified.json`。Custom Conditions由27增至28个文件，伤势模块由10增至11个文件，新增文件均为各自的`CREDITS.md`；安装后两个`verify-install`均通过，30001 `/api/status`仍是`cor-cotn`。\n\n首次安装前通过的离线检查包括Custom Conditions 48项测试、伤势80项测试、生成器Dazed投影聚焦测试91项、模块与包类型检查、架构依赖检查、两个模块构建、`handbook:check`。这些只证明当时的候选实现和安装字节；后续浏览器结果如下，不能把未执行项算作通过。\n\n## CoTN 外部 Chrome 回传与后续修复\n\n2026-09-23 在真实 `cor-cotn` 世界、77个原有启用项组合中，Chrome可见裸 `Dazed` 使用外部 `mcdm-flee-mortals-where-evil-lives` 图标，自定义“恍惚（自定义状态）”使用 `fvtt-custom-conditions.dazed` 和本模块图标；两者分立显示。自定义 Dazed 在测试 Actor 上点击启用、停用、再启用均通过。伤势管理器可见 `0/3→1/3→2/3→3/3`，然后按原路清回0/3。测试 Actor `FqqsDQZD62UnAQlp`、Scene `aKL3Db4ksES2rOfr` 及该 Scene 内 Token 已通过 UI 清理，返回 `landing page`、暂停状态和 IFS internal 基线；页面留在 Custom Conditions Manager。浏览器证据：`F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome/readback.json` 与 `report.md`。\n\n同轮发现 **FAIL**：经 TAH 激活 Shocked 后，`shocked` 高亮，但 namespaced Dazed 与 Defenseless 没有高亮。精确安装的 TAH DnD5e 2.1.0 构建器按 Actor ActiveEffect `statuses` 判定高亮；其默认点击调用 `actor.toggleStatusEffect()`。原模块只截获自定义 Dazed，因此 TAH 的 Shocked 点击可能生成无 Custom Conditions flags 的普通效果，绕过复合规则。Chrome隔离环境没有开放直接读取 `game/CONFIG/canvas`，实际 ActiveEffect flags 未从浏览器直接读回；该机制是与实测相符的源码解释，不伪称已取得 flags 证据。\n\n已在候选代码中补 Shocked 的自有 TAH 点击桥接：通过 Custom Conditions 公开 API 施加、停用、再启用，仅截获模块自有状态；测试精确断言 `shocked`、`fvtt-custom-conditions.dazed`、`defenseless` 三个投影状态和 CC flag。独立审查发现快速双击时两次读取旧状态的竞态，已将同一 Actor/状态的完整“读取→判断→写入”串行，并以延迟写入测试覆盖 Dazed、Shocked 双击。修复后 Custom Conditions 聚焦测试 **51 PASS / 0 FAIL**、模块类型检查与构建通过。复查确认普通 TAH 连续点击使用相同 Actor Document 对象；不同包装对象代表同 UUID 的并发路径仍是单独限制。\n\n仅更新本地server-mirror的Custom Conditions三个静态文件（英中语言包与`index.js`），伤势模块逐文件哈希保持一致；二次更新的预览、前后哈希位于 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/shocked-update-preview.json`、`shocked-update-before.json`、`shocked-update-verified.json`。安装后Custom Conditions `verify-install`通过，30001仍为`cor-cotn`。\n\n随后新建的GPT-6 Luna独立Chrome任务初次因旧GM页面占用而未进入世界，保留阻塞记录于 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome-gpt6/preflight-report.md`。用户关闭旧页后，同任务以正常Gamemaster空密码进入CoTN；第二轮报告在同目录 `e2e-round2-results.md`、`e2e-round2-ui-evidence.md`、`e2e-round2-fixture-ids.json`。**PASS**：修复版经TAH点击Shocked后，Shocked、Custom Dazed、Defenseless同时高亮；同一实例第二次停用、第三次启用，重载后仍在，Manager应用路径与TAH投影一致。伤势的TAH角标已直接显示0/3到3/3；英文界面与恢复中文、tooltip none与恢复full、20项已选图标的基本加载/区分均经可见界面核对。保留77项启用组合，清理本轮确切Actor `IFp6dPk7Mi1Dv2Rm`、Scene `p5bIJYFydh18NPia`及随Scene删除的Token `zGZAk1lYXAGukOw7`，服务常驻，页面留在landing page。\n\n**首轮 FAIL、修复后 PASS**：已启用Jinxed 1d6和Valor 1d4的TAH项最初没有显示6、4角标；同Token编辑Jinxed为1d4后也没有角标变化。精确安装的TAH Core 2.1.1会将不存在的`info1`标准化为`{}`，旧候选使用`!action.info1`判断空位，导致角标写入被跳过；浏览器观察与这一源码路径吻合。修复为空对象可填、保留非空外来角标、按选中Token Actor重算后，Custom Conditions **53 PASS / 0 FAIL**、Foundry模块类型检查与构建通过。本地server-mirror只更新Custom Conditions的`scripts/index.js`，伤势模块字节未变；预览、前后哈希见 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/dice-update-preview.json`、`dice-update-before.json`、`dice-update-verified.json`，`verify-install`通过。GPT-6 Chrome第三轮复验在同一Token `D80y8l8LGjPqu10f` 上看到Jinxed `1d6→6`、Valor `1d4→4`，不重选Token把Jinxed改为1d4后立即显示4；重载后两者均显示4。tooltip none无额外浮层，已恢复full/1500ms。证据见 `F:/FoundryLab/foundry-v14/evidence/condition-hud-sourced-20260923/chrome-gpt6/e2e-round3-results.md` 和 `e2e-round3-ui-evidence.md`。\n\n第三轮临时Scene `Ao05kezR2WPlpNrh`、Actor `FSACXe155rsougRI` 与两个Token `eqHVDVV8AR11LZux`、`D80y8l8LGjPqu10f` 的exact IDs记录于同目录 `e2e-round3-fixture-ids.json`。浏览器任务起初在Foundry永久删除确认对话框前暂停；主任务按本轮既有授权核对ID/归属后通知继续。任务随后只通过Foundry UI删除上述精确Scene与Actor；两个Token随Scene移除，最终Scene和Actor目录中均无该条目，清理 **PASS**。原始暂停记录保留，更新后的删除证据见 `e2e-round3-results.md`、`e2e-round3-ui-evidence.md` 和 `e2e-round3-server-status.json`；最终30001仍为`cor-cotn`、PID32196、Foundry14.364/dnd5e5.3.3。\n\n真实指针仅移动悬停仍为 **NOT_EXECUTED**：当前Chrome控制接口没有纯移动调用；点击后出现的tooltip不代替这一项。图标显示不等于用户最终美术接受。其余独立世界E2E不因本轮重复执行。\n\n新候选复查：先核对官方页面、作者和许可，再以32/64px预览比较整套；如换候选，更新下载URL和哈希。资产选型不等于模块功能可用，状态口径仍遵守docs/acceptance/foundry-v14-module-health.md，Untested不能当运行通过。\n","docs/reviews/2026-09-24-all-custom-condition-hud-audit.md":"# Custom Conditions 全 19 项 HUD / 状态 ID 审计\n\n日期：2026-09-24。目标是 server-mirror 的 CoTN `cor-cotn`、Foundry 14.364 / dnd5e 5.3.3，并保留该世界原有启用模组组合。本页记录用户发现「自定义流血」没有独立 HUD 入口后的系统性审计、候选修复和 CoTN 页面复验。页面复验覆盖 19 项的**入口可见性**；不等于逐项施加、结算及跨客户端玩法验收。\n\n## 已确认的同名 ID 与问题范围\n\n安装在 server-mirror 的 dnd5e 5.3.3 源码 `Data/systems/dnd5e/dnd5e.mjs` 的 `DND5E.conditionTypes` 同时定义裸 ID `bleeding` 与 `burning`（约 47158、47169 行）。CoTN 已启用的 `mcdm-flee-mortals-where-evil-lives` 的 `Data/modules/.../index.js` 定义裸 `dazed`（约 1972 行）；先前 CoTN 浏览器曾同时看到该裸项和本模块独立的自定义 Dazed，见[图标及状态现场记录](2026-09-23-existing-condition-icons.md)。裸 ID 被其他来源先注册后，本模块不能用同一个 ID 覆写其规则和入口。此前[灼烧入口修复](2026-09-24-custom-burning-hud.md)仅解决 Burning，不能代表 Bleeding 或其余状态已检查。\n\n用户现场看到的 dnd5e 原生 `bleeding` 中文按钮叫「失血」，希望本模块自定义 Bleeding 继续叫「流血」；两者的**中文名称不同、状态 ID 不同、作用规则不同**。不要把「失血」按钮或原生「燃烧」按钮当成已配置本模块骰式参数的入口，也不要为区分它们重命名底层语义 ID。\n\n下表的「修复前」指本次全量修复启动前的候选实现：Dazed 与 Burning 已有独立投影，Shocked 虽被特设点击桥接接管但仍需纳入统一投影，其余 16 项未完成通用 HUD 接管。已确认同 ID 来源的是 Bleeding、Burning、Dazed **3 项**；其余 **16 项**未发现当前同 ID 来源。「未发现同 ID」只表示上述精确安装版本与已知启用组合的审计没有证据，**不保证未来安装或启用的模块不会再定义同名 ID**。不把图标复用、显示名相同或未看见按钮单独当成 ID 冲突证据。\n\n| # | 本模块语义 ID | 中文名 | 修复前状态 ID | 修复前已知裸 ID 冲突 | 修复前 HUD 点击路径 | 目标独立状态 ID |\n| ---: | --- | --- | --- | --- | --- | --- |\n| 1 | `addled` | 心智混乱 | `addled` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.addled` |\n| 2 | `bewildered` | 迷乱 | `bewildered` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.bewildered` |\n| 3 | `bleeding` | 流血 | `bleeding` | dnd5e 原生 `bleeding`，界面「失血」 | 本模块入口被占用；系统默认切换不能填写实例骰式 | `fvtt-custom-conditions.bleeding` |\n| 4 | `burning` | 灼烧 | `fvtt-custom-conditions.burning` | dnd5e 原生 `burning`，界面「燃烧」 | 已有独立入口，点击打开绑定 Actor 的参数管理器 | `fvtt-custom-conditions.burning` |\n| 5 | `clumsy` | 笨拙 | `clumsy` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.clumsy` |\n| 6 | `dazed` | 恍惚 | `fvtt-custom-conditions.dazed` | MCDM 裸 `dazed` | 已有独立入口，经本模块 API 切换 | `fvtt-custom-conditions.dazed` |\n| 7 | `defenseless` | 无防备 | `defenseless` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.defenseless` |\n| 8 | `distracted` | 分心 | `distracted` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.distracted` |\n| 9 | `enfeebled` | 衰弱 | `enfeebled` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.enfeebled` |\n| 10 | `frozen` | 冻结 | `frozen` | 未发现 | 系统默认切换，无法填写解除 DC | `fvtt-custom-conditions.frozen` |\n| 11 | `helpless` | 无助 | `helpless` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.helpless` |\n| 12 | `immobilized` | 定身 | `immobilized` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.immobilized` |\n| 13 | `jinxed` | 厄运 | `jinxed` | 未发现 | 系统默认切换，无法填写骰式 | `fvtt-custom-conditions.jinxed` |\n| 14 | `shocked` | 震愕 | `shocked` | 未发现 | 特设桥接经本模块 API 切换，需统一接管 | `fvtt-custom-conditions.shocked` |\n| 15 | `sickened` | 病弱 | `sickened` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.sickened` |\n| 16 | `slowed` | 减速 | `slowed` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.slowed` |\n| 17 | `staggered` | 踉跄 | `staggered` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.staggered` |\n| 18 | `valor` | 英勇 | `valor` | 未发现 | 系统默认切换，无法填写骰式 | `fvtt-custom-conditions.valor` |\n| 19 | `weakened` | 虚弱 | `weakened` | 未发现 | 系统默认切换，未统一接管 | `fvtt-custom-conditions.weakened` |\n\n五个需要参数的状态是 Bleeding、Burning、Frozen、Jinxed、Valor。HUD 直接使用 `actor.toggleStatusEffect()` 会生成没有 `flags.fvtt-custom-conditions.condition` 的普通 ActiveEffect，不能替代本模块的实例校验、来源参数、最高值结算或解除逻辑。其余 14 项虽无必填参数，也必须由本模块 API 施加或切换，使规则 Hook、复合状态和图标高亮都读取同一种实例；旧版 Shocked 曾因走普通 HUD 路径而只有自身高亮、缺少 Dazed/Defenseless 投影，见[现场与补救记录](2026-09-23-existing-condition-icons.md)。本段是代码路径审计，不能代替对每一项的 CoTN 点击结果。\n\n## 全量修复的行为边界\n\n1. 所有 19 个语义 ID 都投影为 `fvtt-custom-conditions.\u003cid>`；原生 dnd5e 的「失血」/「燃烧」与 MCDM Dazed 保留原有 ID、名称、图标与行为。本模块自有项须可按当前 Foundry 语言显示名称与规则卡。\n2. 本模块的 19 项在 Foundry 原生 Token 状态 HUD 中隐藏普通点击入口，避免其默认切换绕过 API；Token Action HUD 从注册状态读到这些项，但点击由本模块的 roll-handler extender 接管。五个参数项打开已绑定当前**单个** Actor、已预选该状态的管理器，不直接施加空参数实例；其余 14 项按本模块 API 的实例/启停规则切换。目标或 GM 权限不明确时应提示并拒绝，不退回默认切换。\n3. 保留旧 Actor/Item ActiveEffect 的 `flags.fvtt-custom-conditions.condition`、`conditionId`、实例参数与来源，不按显示名猜测归属，也不迁移、删除用户既有实例。更新旧实例时投影新的命名空间状态；复合 Frozen/Shocked 的子状态仍应与本模块一致，高亮、停用和再启用须对应实际实例。dnd5e 的 `noMovement` / `halfMovement` 映射也应同步使用新状态 ID。\n4. 既有 Token Action HUD 用户布局可能保存旧 action ID。新 ID 应在默认布局中可见；自定义保存布局是否能迁移，必须按其实际存储与页面行为核对，不能仅凭默认 HUD 截图推断。不能擅自清空或重写玩家的 HUD 偏好。\n\n生成链路也属于同一次 ID 审计。除 `packages/generation/src/actor-effects.ts` 的投影路径外，`packages/generation/src/actor.ts` 原有两处直接写 `statuses: ['bleeding']`，会绕开通用投影；本轮候选实现已将其改为 `projectedConditionStatusId('bleeding')` 并补回归。只把这个结果称为候选源码与测试结果，导入到 CoTN 后的实际 Actor/Item 行为须另列验收。\n\n## 验收分层与后续核查\n\n- **已发生的历史页面证据**：CoTN 的原生 Burning 与自定义「灼烧」并列、点击灼烧打开绑定 Actor 的空参数管理器；自定义 Dazed 与 MCDM Dazed 并列；Shocked 复合高亮经前次专项复查。各结论限于当时的模块字节、Token 与页面，见所链记录。\n- **PASS — 全 19 项入口可见性**：2026-09-24 在常驻 server-mirror 的真实 CoTN 页面正常重载，Token Action HUD「效应」组中 19 个自定义中文按钮各出现一次，均有图标；未发现缺失或重复。原生「失血」与自定义「流血」、原生「燃烧」与自定义「灼烧」、MCDM「Dazed」与自定义「恍惚」同屏并列。页面显示已启用 77 个模组，复验前后没有修改模组配置或 HUD 保存布局。截图见 [全 19 项 HUD 画面](F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/all-19-hud-line-261-0.jpg)，原始 AX 摘录、运行时和边界见 [Chrome 现场记录](F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/ax-evidence.md)。浏览器 AX 未暴露 TAH actionId；19 个命名空间 ID 是安装源码的静态核对结果，不冒充 DOM 读取。\n- **PASS — 自定义流血入口打开管理器**：只点击自定义「流血」一次，管理器绑定所选 Token 的 Actor「泽菲尔·艾什伍德」，预选「流血」，公式仍为空。没有点击施加，也没有新增或修改状态；原生「失血」未点击。候选实现的 Custom Conditions **80/80** 单测、模块类型检查与安装树核对通过；这些是代码和安装层证据，不代替页面行为。\n- **NOT_EXECUTED — 其余点击和玩法结算**：本轮没有逐项切换其余 18 个按钮、提交流血参数、重验冻结五段悬停说明、检查浏览器控制台或多客户端/持久化结果；本轮使用的 Chrome UI 接口未提供悬停操作。旧布局的自动迁移也未验证。若以后修改上述逻辑，再按具体风险补定向验收，不无理由重跑独立测试世界的全套 E2E。\n\n## 可追溯来源\n\n- 19 项语义目录与实例 flag：`packages/contracts/src/conditions.ts`；注册与速度映射：`foundry-modules/fvtt-custom-conditions/src/runtime.ts`；点击桥接和 tooltip：`foundry-modules/fvtt-custom-conditions/src/hud.ts`；生成模板：`packages/generation/src/actor-effects.ts`、`packages/generation/src/actor.ts`。\n- 锁定的本地 dnd5e 5.3.3：`F:/FoundryLab/foundry-v14/data/server-mirror/Data/systems/dnd5e/dnd5e.mjs` 的 `DND5E.conditionTypes.bleeding` / `.burning`；锁定的本地 MCDM 模组：`F:/FoundryLab/foundry-v14/data/server-mirror/Data/modules/mcdm-flee-mortals-where-evil-lives/index.js` 的 `dazed` 注册。二者只读核对，没有修改 Lab 文件。\n- 同名状态的先前 CoTN 页面证据：[图标与 Dazed/Shocked 记录](2026-09-23-existing-condition-icons.md)、[原生 Burning 记录](2026-09-23-cotn-burning-hud.md)、[自定义灼烧入口记录](2026-09-24-custom-burning-hud.md)。这些是历史节点，不自动覆盖本轮全量修复。\n- 本轮安装核对：`F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/20260924-095456/verified.json`；外部 Chrome 原始截图提取来源及 SHA-256：`F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-all-19/screenshot-provenance.json`。截图为子任务 CUA 原样返回字节，未重绘。\n","docs/reviews/2026-09-24-custom-burning-hud.md":"# 参数化 Custom Conditions「灼烧」的 HUD 入口\n\n> 后续范围说明：本页只记录当时「灼烧」相对原生「燃烧」的独立入口与现场验收。用户随后发现自定义「流血」也缺入口，引发[全 19 项 HUD / 状态 ID 审计](2026-09-24-all-custom-condition-hud-audit.md)。本页的灼烧 PASS 不能代表流血或其余 17 项已完成本轮统一修复及页面验收。\n\n日期：2026-09-24。目标环境仍是 server-mirror 的 CoTN `cor-cotn`，Foundry 14.364 / dnd5e 5.3.3。本文记录本地候选变更及验收边界；它不把此前原生 Burning 的浏览器截图当作自定义入口的通过证据。\n\n## 用户问题与区分\n\n用户指出的是：可填写骰式和伤害类型的 **Custom Conditions「灼烧」**（内部 ID `burning`）在 Token Action HUD 中没有入口。2026-09-23 的[现场记录](2026-09-23-cotn-burning-hud.md)及截图只确认 dnd5e 原生「燃烧」可见；该按钮不能建立参数化实例，不能作为本问题的解决结果。先前把「原生按钮可见」解释为这一项已处理，判断对象错误。\n\n## 候选行为\n\n- 保留 dnd5e 原生裸 ID `burning` 的状态、规则、图标与 HUD 按钮。\n- 为本模块增加独立的 `fvtt-custom-conditions.burning` HUD 项，中文状态名称和 HUD 标签均为「灼烧」，英文 HUD 标签为 `Custom Burning`。原生按钮仍称「燃烧」，两者不共用同一按钮语义。先前草稿中的「自定义燃烧」已被用户修正，不再作为中文 UI 名称。\n- 灼烧在 Foundry 原生 Token HUD 中设置 `hud: false`，避免原生 `toggleStatusEffect()` 绕过必填参数或删除已配置效果；Token Action HUD 2.1.1 仍从 `CONFIG.statusEffects` 枚举该项，并由本模块的点击拦截器处理。原生「燃烧」保持原有 HUD 行为。\n- active GM 在只有一个明确目标 Actor 时点击灼烧项，会打开绑定该 Actor、预选灼烧（内部 ID `burning`）的状态管理器。HUD 点击本身不会施加无参数效果；GM 在管理器中显式填写 `formula` 和 `damageType`，由既有参数校验拒绝缺项。\n- 已存储的旧 `flags.fvtt-custom-conditions.condition` 灼烧实例仍可读取与显示，不因 HUD 入口改变而迁移或删除。\n\n## 验收分层\n\n- **历史 PASS，仅原生按钮**：在 CoTN 所选 Token 的效应组中看到 `actionId=burning`；证据见 2026-09-23 现场记录。\n- **候选静态检查 PASS**：实现已固定状态 ID、点击路由、Actor 绑定、空参数拒绝与旧 flagged 实例读取；Custom Conditions 模块测试 71/71、受影响 effectProfile 测试 33/33、模块类型检查与构建通过。这些检查不证明 CoTN 页面已经显示新按钮。\n- **CoTN 新入口视觉与表单打开 PASS**：2026-09-24 的独立外部 Chrome 在同一个 Token Action HUD「效应」列表看见「燃烧」与「灼烧」两个按钮。只点击「灼烧」后，Custom Conditions Manager 显示所选 Token 对应的 Actor「泽菲尔·艾什伍德」、预选「灼烧」，参数 JSON 初值为 `{\"formula\":\"\",\"damageType\":\"\"}`；没有提交、施加或停用状态。浏览器 AX 证实两个不同标签及管理器内容；AX 不暴露 `actionId`，原生 `burning` 与本模块 `fvtt-custom-conditions.burning` 的 ID/图标映射另由精确安装源码和文件哈希核对，不能误称为浏览器直接读到 DOM 属性。证据见 `F:/FoundryLab/foundry-v14/evidence/condition-optimizations-20260924/chrome-custom-burning-localhost/chrome-run-20260924.md`，原字节 CUA 截图及提取来源见同目录 `burning-and-scorching-hud.jpg`、`scorching-manager.jpg` 和 `screenshot-provenance.json`。\n- **未执行的边界**：本轮按用户要求未提交参数、结算伤害或重跑旧玩法规则；空参数拒绝由单测覆盖，未在 CoTN UI 中尝试。Frozen 五段新版浮框因 Chrome 控制接口缺少可靠悬停/tooltip 读取，仍为视觉 **NOT_EXECUTED**。首次使用 `127.0.0.1:30001` 的 Chrome 标签登录成功提示后返回 `/join`；后以 `localhost:30001` 进入同一 PID 32428 的 server-mirror 世界。两主机名的会话隔离是排查假设，未读取 Cookie 来证明具体冲突。\n\n这次入口变更不要求重跑先前已通过的整套独立世界规则 E2E；若发现新入口引入行为回归，再针对该路径补测。\n","docs/reviews/2026-10-01-next-605-custom-module-restoration.md":"# ServerNext 6.0.5：十个自有模块恢复与限定验收\n\n日期：2026-10-01。当前状态：本轮授权的本地恢复完成；十模块限定代表行为、普通GM重载、精确清理，额外 Midi local.10 的两请求+4与精确清理全部通过。用户随后明确授权整理提交、发布前整合、合并 master 并推送，且要求保护原工作树、不重跑已通过 E2E。发布前检查见[整合记录](2026-10-01-next-605-release-integration.md)，实际提交与远端身份以 Git 发布回执为准。以下阶段记录保留旧失败，当前接受以末尾收据为准；本记录不恢复其他迁移、升级Core／Mirror／生产或扩大长时测试。\n\n## 当前目标与候选\n\n- 候选：`I:/OpenCode/fvttV12JsonGenerator-worktrees/20261001-161536-next-605-restore`，从 master `053a592b940d59b4c3014074eb233d65bcfb944e` 建立。\n- 目标：`server-next` / `cor-cotn` / Foundry14.368 / dnd5e6.0.5 / loopback30002 / PID39528 / Node24.17.0。\n- 原迁移源：`20260919-151319-server-next-migration`；仅十个模块及必要构建依赖逐项导入，不复制整棵 dirty 工作区。初始368个实际 dirty 文件逐文件指纹保留，源树不写入。\n- 版本策略源：`20261001-142408-dnd5e-version-policy`；固定5.3.3和稳定6.x跟随方向不变，精确版本接受与长期跟随策略分开。\n- 业务 run：`4863dddb-c416-4a93-9060-1076106abfed`。私有原件根：`F:/FoundryLab/foundry-v14/evidence/server-next-migration/next-605-restore-20261001-4863dddb`，不复制完整世界资料或会话入仓库。\n\n## 修复范围\n\n十个 ID：chat-memory-guard、fvtt-babele-rolltable-embed-translation、fvtt-battlefield-painter、fvtt-blood-hunter-2024、fvtt-homebrew-species、fvtt-house-rules、fvtt-injury-fading-spirits、fvtt-json-generator-spell-resolver、fvtt-session-monitor、open-session-deck。\n\n运行代码只新增明确核验的14.368/6.0.5配对，保留旧配对并拒绝交叉或未核验版本；manifest 声明不替代代码及实机接受。固定6.0.5源码提交为 `3ee48de02f8f6f7b2638c9f6cf3e9540c9c181cc`；Open Session Deck须处理6.0.5的效果来源力竭字段，而非只改版本上限。\n\n血猎手及自制种族保留6.0.2已接受内容投影和世界现有合集；6.0.5为运行兼容目标。安装只更新审核的非packs文件，停世界／释放锁后记录合集全部文件前后SHA-256，不重放系统迁移、不替换数据库、不制作备份。\n\n## 初始出口与当前状态\n\n- 已关闭：实际基线、正常Return to Setup／锁释放、候选构建与逐项安装哈希。\n- 已关闭：原94启用ID恢复、49来源值与两包数量／锁保留；额外Midi只有local.9→local.10的授权版本差异。\n- 已关闭：上述限定代表行为、普通GM重载、自有世界对象与临时Macro精确清理；其他矩阵不由此扩大接受。\n- 已关闭：owned浏览器页面释放、文档／手册／指令一致性；源码发布接续见整合记录。\n\n模块玩法的历史通过仍绑定原目标。原工具V1交付结论继续有效，本恢复任务不用于宣称受控提速、token节省或全模块兼容。\n\n## 机械验证与安装读回\n\n模块 owner 运行各自检查：Painter148通过、Injury62通过、Resolver339通过、OpenDeck54通过；House Rules测试／类型／build／12项ZIP artifact核对通过。声明／内容组：Chat Guard29、Babele8、Blood Hunter51通过且1个条件真实源专项跳过、Species36、Session Monitor29通过，独立监测器build gate通过。各组有覆盖关系，不累计为一个无意义总数。\n\n主控整合检查：packages、apps、foundry-modules类型检查通过，architecture:verify通过，CLI24通过；Species36在默认vault路径修正后再次通过，anti-overfit10来源通过，references verify的5.3.3与current6条目通过。CLI子进程曾在默认5秒处超时；只为六个启动CLI的用例设置30秒单项界限，断言和业务参数未放宽。\n\n已按正常客户端取实机基线：UTC08:36:47，源49值差异0，两DLC包969/278均锁定，当前84活跃模块；原升级前94参考和无关ID均保留。正常Return to Setup一次，接口active=false，PID39528／loopback30002保留。旧页面消失时从支持的Chrome入口创建一个owned同目标页面；未切工具绕过拒绝、未猜密码或读Cookie。\n\n共用文件工具实际走完prepare→ready→execute→collect→resume，收据 `c4169afc-3817-423a-a0ec-43875fc8e160`，文件侧PASS／COMPLETE，运行出口仍独立。原请求描述误写79文件，实际全部80构建文件及4脚本／计划身份已绑定，operation核80且没有遗漏；父接受只授予安装前文件门。\n\n实际安装在inactive Setup完成：十模块80个非packs文件逐一写入／读回SHA-256；主控随后独立复算0差异。所有已安装packs文件（含各数据库现有清单）在操作前后完全一致。Blood Hunter六份nonpack data与Species三份nonpack data此前逐字节相同，内容投影、逻辑身份和accepted来源未改写；真实冻结来源构建为1职业／4子职／77特性／94ledger／117Activities。\n\n当前进入原世界重启及模块开关恢复阶段。只有该阶段和后续代表性行为／重载／精确清理回执得到独立核对，才关闭运行门。本记录此时不宣称94集合或6.0.5玩法已经通过。\n\n## 原启用集合已恢复（北京时间16:54后）\n\n正常启动原世界一次，原10条已审核开关在Module Management可用；独立DOM核对其他开关未变，保存一次并接受正常设置重载。新原件 `restored-inspection.json` 68,713字节，SHA-256 `c78c0fceea1e761a592fa6eff012e9eeb003782c97d10bed0a56d35f342a5429`。主控独立解析确认原94 ID及版本逐项相等；49来源值差异0，两DLC包969/278均锁定，world Actor/Item/其他Macro/chat IDs、GM角色、active/viewed scene及pause与本轮fresh84基线一致。实际截图也显示14.368／6.0.5／94。\n\n父接受为 `ACCEPTED_94_MODULE_RESTORE_AND_SOURCE_PRESERVATION_ONLY`。本轮目标十模块的支持工具错误／警告日志归类为0；旧世界4条Item／Pixi错误单列，不宣称整世界无错误。公共API及代表玩法仍待下一个冻结Macro批次，临时Macro与页面保留。\n\n独立只读复核未发现本次版本门、力竭读写、内容身份或安装保护的代码缺陷；发现村规/伤势拒绝字符串和解析器README漏列6.0.5，源文义已修正，最终安装同步仍待收尾Setup窗口。该文案修正不改变已接受的运行逻辑。\n\n## Core Check／Save 工具纠错记录\n\n首次原生请求卡准备在调用前被工具阻断：Item raw活动map键为dnd6checkproof01／dnd6saveproof001，但DataModel `_id` 未声明而得到随机id，运行Collection索引使用新id，旧固定键查找为undefined。实际只读诊断确认两个typed Activity均有use函数、bonus仍为`@abilities.str.mod`，新增Chat为0，旧claimed Check id=null；flags／失败领取事实完整保持。不能写成系统Check／Save业务失败。\n\n另一个清理工具错误是使用Core14.368已不存在的User.updateTokenTargets；正常返回原view后即停止在该调用，尚未删除对象。精确版本Source `client/canvas/layers/tokens.mjs:341` 提供公开TokenLayer.setTargets(ids,{mode:replace})；运行诊断也读到function。两个已归属NPC／Feat／Scene／Macro精确ID保留，不重建。V2仅修活动选择与目标恢复，归档未调用use的旧领取记录，经0新Chat／唯一typed模型门后在同一fixture恢复；后续真实UI结果仍待回传。主模块验收Macro在第一次使用前也同步正确清理API。\n\n### 已观察到两次原生结果，原因仍待定位\n\nV2在同一fixture归档旧未调用领取后，分别创建真实Check／Save请求卡并通过正常UI各操作一次。观测值为Check骰13／总14、Save骰5／总6，均为+1，未达到预期owner+3加target+1；未改公式／造骰／重掷。不据此断言Core单独故障或某模块因果。\n\n工具同时错误地按字符串比较prepared `system.origin`；固定6.0.5的RollMessageData将其声明为ForeignDocumentField，需核raw与prepared值才能关联消息。执行器识别工具会漏删实际roll，未选择清理；2 Actor／Scene／Feat／CoreMacro及两卡两roll均按准确ID保留。新的只读诊断取getRollData、公开BasicRoll公式替换和known4消息来源／flags，不再调用use或roll。此门仍FAIL/INCOMPLETE，94模块启用及来源保留的独立接受不变。\n\n### 药水判定器真实反例及限定接续\n\n只读28408字节原件SHA9c423dcde50c6220e73c712953dc6b93fa9664d0b6ddc3028e88581e4aa6139c：snapshot与actual rawJSON／canonicalJSON均相同，differences为空，而Coreutils.equals返回false。判定工具对含数组的持久文档数据不应使用该集合语义helper。实际持久heal ID为hrPotionQ0000001／hrPotionM0000001／hrPotionF0000001，对应模块core/potion.ts明确_id；旧hrPotionFeed只是构建逻辑map键。\n\n工具只改严格stableJSON比较与准确feed ID，增加一次同药水接续按钮；已有applied snapshot先完整校验，归档旧FAIL后只跑未完成的手改保护／恢复。Preview／Apply及其他9个已通过API门不重放。用户另已明确批准Midi两个handler修复，独立候选保留5个既有local.9改动、只新增两函数来源加值路径；原Midi源码树不变。\n\n上游gulpzip曾打印6个TS语义错误却退出0并产生zip；该产物不接受。新接口运行事实已由Core6.0.5源码／只读诊断确认，补准确本地类型后须独立tsc --noEmit退出0，再接受build／归档，不能让后续编译或文件保存掩盖失败。\n\n### 药水通过；Deck 暴露真实 ID 错误（UTC10:32）\n\n同一药水的限定接续已通过手改保护／恢复：恢复后 Activities 数为0且 snapshot 清空；原 Preview／Apply 和其他 API 已通过门未重放。随后 Deck 卡片显示0，工具旧 `conditions` 读数1，先前 fixture 领取为3；停止 UI 加减并保存三层差异。\n\n只读原件 `deck-readonly-diagnostic.json`（27,747字节，SHA-256 `7d89ac5c1babe688170bab9fb495a72bd4f863c13e0b77da7351d45b6a2ecd83`）确认唯一原生效果为 `dnd5eexhaustion0`，level1、disabled=false、status exhaustion；attributes 与 prepared conditions 均为1。未补齐的 `dnd5eexhaustion` 查找缺失。6.0.5精确源码 `ActiveEffect5e.ID.EXHAUSTION` 调用 `staticID`，后者补齐到16字符；此前候选常量与模拟fixture都遗漏末尾0，先前静态复核未识别这一问题，其“未发现力竭代码缺陷”结论已被现场证据推翻。候选已纠正常量／测试／模块说明，54测试及 foundry-modules 类型检查、build再次通过；三文件限定安装与真实UI 3→4→3仍待执行。\n\n初次一次性 `toggleStatusEffect` 增加3还触及系统原生异步同步：`Actor5e._onCreateDescendantDocuments` 在 source exhaustion 为0时写1，`_onUpdateExhaustion` 再计算效果 delta；现场 effect 的 created／modified 相差50ms，与该路径一致，但不以只读快照断言唯一因果。验收工具改为读取准确 effect ID，先完成第1级创建再加2；当前自有 level1 fixture 只做加2接续并等待读回3，不重建或重跑其他门。它不写派生属性或改系统源码。\n\n### Deck UI 已通过；Resolver 自动路径待精确读回（UTC10:46）\n\n正常 Setup／锁释放后只覆盖 Deck JS／两份 README，三项写后 SHA 相等，其余六项文件未变，manifest版本不变；安装回执 `deck-fix-install-receipt.json` 明确 PID39528、active=false、未写世界数据库、未创建备份。正常启动原世界后，同一 owned fixture 加2接续为3，Deck显示3、正常加一次4／减一次3，公共工具读取准确 effect 与UI一致。加载证据是正常启动后的 script URL 和修复后行为，未取已执行脚本字节哈希，不把磁盘 SHA 冒充客户端执行字节。\n\nResolver 首次打开已是 hydrated，正常 View Report 显示10个 `automatic-2024` 选择，执行器 Apply／Undo均零点击即保留现场。源码 hooks.ts 在 createActor／updateActor 后排队异步 resolve；工具 importFromJSON／setFlag 能触发该路径，源fixture本身为3 feat／1 weapon且无 Spell，所以先前 bounded pending／1 Spell 很可能是异步未完成时读回。当前仅确认触发机制与报告吻合，仍需只读现场绑定十个 managed cache／Cast／selection 和完整 undo snapshot；相等后正常 Undo 一次，目标 pending／0缓存，不重复水合。此验收口径改为实际自动水合与普通UI撤销，不宣称未发生的 Review／Apply 点击。\n\n### Resolver 已通过；Painter 真画布 FAIL（UTC10:57）\n\nResolver 现场 before 39,244字节 SHA `1856fe68a04da246c74cd344de2b37fdaad5f6b111905ecb36e7e3cd817571dd`：hydrated，10 Spell／10 cache／10 Cast，严格唯一 selection ownership 相等。正常UI Undo唯一一次后 after 4,277字节 SHA `3a6e06b3d71790a3bd4c9077f39777a2f627065520dc03dc4f49fb1c92677828`：pending且三项均0，manifest SHA `ba9c849d19d17b8afa0716b3c352f019a00d04be3bf3b28675d4e2a564254eeb` 未变。通过范围为自动水合的当前完整结果与普通UI撤销；完整原生施法矩阵尚未执行。\n\nPainter 在空的自有 Square Scene 只画一次 Fire I／radius0 两格，保存2 Tile／1 Region／1 light；audit 有2 fireCells／atlasLoaded／1 mesh，但0 vertices／triangles／emitters。清晰截图仅有暖光没有可识别火焰，视觉 FAIL，不以文档／atlas成功替代。两条 Pixi `_onCanPlay`／`_onPlayStart` 递归错误完整落盘；每条大栈871,163字符不能当作根因。现场没有重画、撤销、删除或重载。\n\n精确 Core14.368 `common/grid/square.mjs` 明确 i=rowY、j=columnX；Fire renderer 的 origin／anchor 反用坐标，而 Frost同处已经正确。新增非对角 persisted offset 回归和校准runtime mock在旧Fire代码上得到0 emitters，与现场一致；纠正六处转换后局部8测试通过。视频递归与几何空数据可能是两个问题，目前已派只读公开DOM／纹理／Tile坐标诊断，未宣称视频因果或已修复实机。\n\n现场只读 `painter-readonly-diagnostic.json`（8,764字节，SHA `c00f2728df532192b82bdb2d34dfe37e5f77a34c2ae08ffc6c7a5dd67aadad62`）准确 Tile offset0:0／0:1、公开center50,50／150,50；mesh size0/index0/positions空。两份视频及 texture/baseTexture/resource均768×768且valid，视频paused=false、readyState1、currentTime0.533333；不能从一个快照断言持续推进或递归已解除。\n\n加载协议对照已安装 Core14.368 的 Pixi7.4.3 `VideoResource`：Texture.from 默认autoLoad；模块又load并立即play，能在尺寸重置／无效时进入 `_onPlayStart`→`_onCanPlay` 递归路径。候选取消两层autoplay、保留Pixi单次load、在decoded dimensions就绪时先公开resource.update再play一次；不修改Pixi或系统prototype。新增延迟尺寸／重复ready事件回归，151 tests/coverage、模块typecheck及build通过。限定安装只有 Painter `scripts/main.js`，其余14文件与安装基线固定；准备时JS SHA `640cf1cd3629f85a45668c27c79234b3266bd2ad8908367502b86e99a68a43ef`。下一步正常 Setup后overlay并重用原两格，必须补真实火焰视觉、700ms两样本播放推进、无新增同类递归及普通重载读回，当前仍未接受视觉门。\n\n### 十模块代表运行及普通重载已接受（北京时间19:23）\n\nPainter单JS overlay在inactive Setup完成，写后SHA与上述候选一致，其余14文件无差异。原两格未重画，真实截图显示可识别火焰；audit为2cells／mesh1／vertices32／triangles16／emitters8、2Tile／1Region／1light。700ms两样本 StageI 0.383333→1.048327、StageII 0.383333→1.046717，readyState4、无video error；本批普通launch/reload边界内返回日志新增error0，不宣称长测或整世界无错。普通GM重载后稳定帧仍显示同两格火焰，初未加载帧与稳定帧均保存。\n\nBabele可见Dialog严格按两张实际table核25／5行且每行有中文，原条件／基本方位UUID保留，零rollable点击。父已查看火焰前后及Babele上下截图。重载原件 `painter-fixed-post-gm-reload.json`（100,918字节，SHA `957f5eaad78033c761455951165d1f0ac9ee1421c0c4e7cbeb5406a48f1b214e`）十gate全部PASS；父另逐项核49 currentValue=sourceValue与 fresh pack969／278锁定身份，原世界集合和旧升级Macro哈希保留。独立接受为 `parent-ten-module-runtime-acceptance.json` 的限定代表运行与重载；已派精确fixture／两临时Macro清理，当前不宣称清理完成。\n\n接受范围不包含天然19、完整原生Cast／四子职／其他地形矩阵、长时测试、生产，或随后才获准的 Midi +4请求门。Blood Hunter／Species只接受现有来源、内容身份与合集读取，不提升为全部职业／种族玩法通过；Chat Guard仅公开统计API，Monitor仅短会话与历史持久。旧失败证据完整保留。\n\n### 精确清理已接受\n\n第一阶段 `ten-module-final-cleanup.json`（2,390字节，SHA `1f7f23653c28642db8237682e4bd3632069c5deb48f4052923b41c7ac0281688`）为PASS／failures空／finalPreservationtrue：七项Deck设置、原view/control/targets恢复，两个自有Actor／Folder／Scene及其Tile／Region／light删除；仅删除自有短Monitor记录，原两条历史ID与hash保持。原世界对象／49来源值保留。\n\n第二阶段先核原升级 Macro `C3z5LLakUs6riKBN` 的run、command与flags SHA，再与本轮工具 `eIJdNfO1iEiGW4YW` 一起删除；`temporary-macros-final-cleanup.json`（10,688字节，SHA `f0c08b5079325978139c1009f69a7f539d7b5c623c406e7d427cb07c026d3adc`）为PASS，原90Macro ID完整保留。父另从 fresh baseline 去除准确旧临时ID后逐项比较90ID，保存 `parent-ten-module-cleanup-acceptance.json`。正常UI目录也核两临时项缺席。之后正常Return Setup，服务PID39528保留，为额外Midi七文件限定部署准备；没有停服务、创建备份或删除历史证据文件。\n\n## 最终接续状态\n\n额外 Midi 接受见[真实请求与清理记录](2026-10-01-next-605-midi-request-bonus-gap.md)：原两次+1FAIL保留，新Check骰12／总16、Save骰20／总24各一次，modifier均4；新2Actor／Scene／Feat／4Chat／唯一Macro精确删除。当前仍为原94启用ID，其他93版本不变
