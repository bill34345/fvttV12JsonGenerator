存在 ActiveEffect 的 `flags.fvtt-custom-conditions.condition` 中，物品上的效果是模板，施加到目标后会生成新的实例 ID。\n\nGM 可以通过模块设置菜单或 Token 控制栏打开管理器。选中或标记 Token 后，在面板中选择状态并填写 JSON 参数即可施加、编辑、停用和解除。日常调整骰式、伤害类型、DC 和结束说明不需要修改代码。\n\nToken Action HUD 中，**全部 19 个自定义状态**使用 `fvtt-custom-conditions.\u003c状态 ID>` 的独立按钮，系统与其他模组的裸 ID 状态保持原状。CoTN 中 dnd5e 原生 `bleeding` 显示「失血」，本模块 `fvtt-custom-conditions.bleeding` 显示「流血」；原生 `burning` 显示「燃烧」，本模块 `fvtt-custom-conditions.burning` 显示「灼烧」。GM 对一个明确 Actor 点击流血、灼烧、冻结、厄运、英勇中的任一项，会打开绑定该 Actor、预选该状态的管理器；点击本身不施加缺参数状态，须按表单填写必填骰式、伤害类型或解除 DC。其他 14 项由本模块 API 施加或启停带本模块 flag 的实例。原生按钮只执行其原有规则；旧版带 `flags.fvtt-custom-conditions.condition` 的自定义实例继续可读，用户自行命名的效果保持原样。旧默认名「燃烧」在自定义实例界面中显示为「灼烧」。\n\n本模块的 19 项不在 Foundry 原生 Token 状态 HUD 中提供普通切换，避免该路径绕过实例参数与规则；Token Action HUD 的自定义项由本模块拦截。若某子状态只由 Frozen 或 Shocked 提供，按钮会显示生效，但点击不会再建立重复的独立子状态；应在管理器中处理实际来源。多实例、目标不明确或非 active GM 时会提示，不回退到系统默认开关。既有 TAH 个人布局按 action ID 存储，新 ID 的隐藏与排序偏好不能保证自动继承旧裸 ID 的设置；不要清空他人的布局来处理单个入口。\n\n## 名称、悬停说明与图标\n\n状态名称和规则说明跟随 Foundry 当前界面语言；`cn` / `zh-CN` 显示中文，`en` 显示英文，其他语言使用英文回退。修改语言后重载世界。自定义状态使用独立的白色 SVG 图标，状态列表提供悬停说明；Token Action HUD 的完整提示采用 dnd5e 规则卡布局，复合状态的主要效果直接写在说明中。自定义 Dazed 的 HUD 标题为「恍惚」，不加「自定义状态」后缀，仍通过独立状态 ID 区分其他模块的同名项。与 dnd5e 原生状态重名的注册项保留原生含义和图标；通过本管理器施加的自定义实例使用本模块图标与参数规则。\n\n状态图标是所列来源 SVG 的原始字节副本。笨拙使用 Skoll 的 Drop Weapon，踉跄使用 Lorc 的 Foot Trip。作者署名、来源链接、许可声明和原文件 SHA-256 值见 [CREDITS.md](CREDITS.md)。\n\n如果同时启用“伤势与消逝的灵魂”，管理器提供伤势层数及仪式入口。伤势仍由该模块的公开 API 处理，原 Actor flags 和复活历史不迁移、不复制。它不会变成第 20 个可任意编辑 JSON 的状态。\n\n默认状态名称随界面语言显示；GM 自行填写的来源名称保持不变。规则参数中的英文 ID 用于稳定存储，不随翻译改名。\n\n流血的基本参数示例：\n\n```json\n{\n  \"formula\": \"2d6\",\n  \"mode\": \"hpLoss\",\n  \"damageType\": \"\",\n  \"timing\": \"turnEnd\",\n  \"stacking\": \"highest\",\n  \"endOnHealing\": true,\n  \"endCondition\": \"恢复任意生命值后结束。\"\n}\n```\n\n流血与灼烧默认在自身回合结束时结算。相同 Actor 上同名状态只采用一个较高值，不因怪物、Item 或来源地址不同而分别扣血。灼烧（内部 ID `burning`）的不同伤害类型也一起比较，采用胜出者的骰式和伤害类型。比较使用骰式的平均值，平手保留现有效果；不会先掷骰再选，也不会根据目标的抗性改变强度排序。已存在的旧多实例数据在结算前也需选出唯一有效值。\n\n怪物特性中的数值是参数来源，例如 `Bleeding 4d4` 或 `Burning 2d6 Fire`。Generator 将其写入攻击 Item 的模板，施加时复制到目标，不能从 CR 或普通命中伤害猜出状态数值。来源没有写明的参数应由 GM 补齐。\n\n强度比较支持普通骰式相加、加减常数及乘除常数，例如 `4d4+2`、`(2d6+3)/2`。随机分母等无法确定排序的表达式会提示错误并保留现有效果，需 GM 改为可比较的骰式。\n\n回合结算由 active GM 执行，并以实例 ID 与 Combat 回合键做重复保护。治疗会解除设置了 `endOnHealing` 的实例。距离、环境和坠落落点需要 GM 结合地图裁定。\n\nFrozen 的已启用实例提供“破冰（动作）”按钮，按实例 `escapeDC` 进行力量（运动）检定。默认由被冻结的目标检定；标记目标后另选中一名生物，可让该生物协助。GM 先确认协助者能够接触目标。取消检定不算尝试，完成检定后无论成败都花费动作，成功才解除 Frozen。\n\nBewildered 只限制施法，不禁止普通攻击和其他非施法动作。Staggered 在自己的回合最多完成一次武器或徒手攻击，武器上的辅助 Activity 不算攻击；纳入徒手攻击是本项目对可公开核对的 Drakkenheim Beta 文本的扩展，正式版 Appendix C 尚未逐条核对。本模块自定义 Dazed「恍惚」让目标在自己的回合从自主移动、动作、附赠动作中选择一种；选择后不能再执行另外两种。Shocked「震愕」继承这条规则，所以不会固定禁止附赠动作；但拿取、拔出或收起物品仍需动作。三选一是用户决定的本项目规则调整，不宣称为 Drakkenheim 正式文本。两种状态不额外禁止 Reaction，禁止 Reaction 的状态是 Distracted；震愕也并非只指闪电伤害。攻击掷骰进入求值后，会在本客户端临时锁住选定类别；异常或后续 Hook 否决而未完成时，冲突行为保守地限制至本回合结束。跨客户端同时操作同一 Actor 和两个非攻击活动弹窗交错完成尚未保证严格互斥。\n\nFrozen 的说明展开定身与无防备的效果；只有使用造成钝击伤害的**武器**命中被冻结目标，才满足特殊重击条件。单凭钝击伤害类型不能把法术或普通徒手打击算进去。Shocked 的说明展开恍惚与无防备，并列出掉落手持物品及拿取、拔出、收起物品各需动作。Valor 的骰值加到攻击检定或豁免检定，Jinxed 的骰值从结果中扣除；Weakened 的武器攻击或法术伤害总值减半并向下取整。来源与规则边界见 [Drakkenheim 状态文案核对](../../docs/reviews/2026-09-23-drakkenheim-condition-wording.md)和[本项目三选一变更](../../docs/reviews/2026-09-24-dazed-three-choice-rule.md)。\n\nImmobilized 与 Frozen 会拦截拖拽、方向键等自主移动，也会拦截非 GM 通过 Token HUD 或配置进行的位置变更。GM 的坐标编辑及 API 强制位移保留用于推拉、传送和坠落裁定；这些重定位不消耗 Dazed 的自主移动选择。停用或解除状态后恢复自主移动。\n\n本地 E2E 使用 `F:\\FoundryLab\\foundry-v14\\data\\server-mirror`，地址 `127.0.0.1:30001`（外部 Chrome 用 `localhost:30001` 访问同一实例）。真实组合验收进入 `cor-cotn` 并保留原模组组合；历史隔离 E2E 使用 `fvtt-v14-module-matrix`。状态核心规则、来源生成模板、真实结算与解除、页面重载后不重复扣血、Sickened/取消攻击/自主移动修复均已有对应路径的实测证据。键盘长按受当前浏览器工具能力限制，未完成该输入路径验收；鼠标拖拽与玩家 HUD 高度编辑有独立证据。先前 HUD 和伤势联动验收记录于 `docs/reviews/2026-09-22-condition-hud-localization.md`。此后全 19 项在 CoTN 的 HUD 入口可见性已复验通过，自定义「流血」点击后只打开绑定 Actor 的空参数管理器；本轮其余按钮未逐项点击或结算。本轮 ID、点击路径审计及页面证据见 [全 19 项记录](../../docs/reviews/2026-09-24-all-custom-condition-hud-audit.md)，日常操作见 `docs/runbooks/custom-conditions-and-trigger-engine-usage.md`。\n\n构建、测试和类型检查使用仓库根目录的 `bun run build:custom-conditions`、`bun run test:custom-conditions` 与 `bun run typecheck:foundry-modules`。\n","foundry-modules/fvtt-homebrew-species/README.zh-CN.md":"# 自制种族内容模块\n\n这是同一 module ID、pack 名和文档 ID 下的纯内容 Species 模块。既有 V14 产物精确绑定 Foundry `14.364` / dnd5e `5.3.3` / Core；V12 候选产物精确绑定 Foundry `12.331` / dnd5e `4.3.9` / Core / 2024；ServerNext 内容身份保留 Foundry `14.368` / dnd5e `6.0.2` / Core / 2024。Next manifest 可用显式 `--dnd5e-runtime-maximum 6.0.5` 扩大运行时兼容上限；其 `minimum/verified` 与 accepted package identity 仍为 `6.0.2`，不会新增或改写 `6.0.5` 来源接受记录。两个候选都标记 `supportStatus: \"static-candidate\"`。所有目标都只提供 `species` 和 `features` 两个 Item Compendium，没有浏览器 JavaScript、socket、自动迁移或世界扫描。\n\n`bun run build:homebrew-species` 保持现有 V14 默认。`bun run build:homebrew-species:v12-candidate` 与 `bun run verify:homebrew-species:v12-candidate` 使用 ledger 中独立的 V12/core/2024 条目并输出 `dist/v12-candidate/`。Next 内容候选仍使用已接受的 `14.368/core/2024` ledger 项和 `dist/v14-368-candidate/`。默认 Next manifest 最大版本仍为 6.0.2；需要为本次 ServerNext 6.0.5 兼容候选生成对应 manifest 时，使用本包入口 `build:v14-368-605-candidate` 与 `verify:v14-368-605-candidate`（等价参数为 `--fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5`）。这个参数只改变 manifest 的运行时兼容最大值和说明，不改变 6.0.2 内容身份、来源 Markdown、accepted ledger 或逻辑 hash。若运行构建，LevelDB 会重新物理生成；本次服务器安装必须保留现有已安装 pack 文件，仅更新经过验证的 manifest。已有 6.0.2 的代表性游戏内验收见 [ServerNext 候选记录](docs/server-next-candidate.md)；6.0.5 的启用与 pack 读回应单独记录。静态结果不代替后续种族功能或升级验收。\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为身份。旧 schema v1 只按 V14/core/2024 读取，单纯 build 不改写；下一次成功 promotion 才原子升级。旧 V14 package 保持 `output/species/\u003cidentifier>.json`，V12 package 使用 `output/species/v12/\u003cidentifier>.json`，ServerNext package 使用 `output/species/v14-368/\u003cidentifier>.json`。新目标的 logical hash 与旧目标不同，旧接受记录不可跨目标复用。\n\n散装 JSON 是与本模块绑定的审阅/构建输入，ItemGrant UUID 指向本模块的 `features` pack，不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Feature 是快照，本轮没有迁移器。\n\n当前自动化边界：种族基础字段、allowlist 内的每级生命值/AC永久 Effect，以及明确次数和恢复的 Utility 可原生投影；复杂武器、推击、建筑物、移动和规则判定保持 `gm-assisted` 或 `external-rule`。\n","foundry-modules/fvtt-house-rules/README.zh-CN.md":"# 本团村规（`fvtt-house-rules`）\n\n这是一个独立的 Foundry VTT 模块。既有完整运行验收针对 Foundry VTT `14.364` / dnd5e `5.3.3`；`0.1.3` 在历史 ServerNext `14.368` / `6.0.2` 上通过了药水预览、应用、手改保护、恢复和整页重载读回。新增的精确配对 `14.368` / `6.0.5` 是待运行验收候选；此结果不自动覆盖其它村规功能或 Midi 暴击联动。6.0.5 的 optional Midi-QOL、DAE、Dice So Nice 组合未作版本确认时会失败关闭。运行时仅接受这三组精确 Foundry／dnd5e 版本对，交叉和未列版本被拒绝。它不依赖 `fvtt-injury-fading-spirits`，也不导入项目其他模块的私有实现。\n\n## 语言\n\n模块跟随 Foundry 世界的核心语言设置：核心语言为 `zh-CN`，或使用 Foundry 中文翻译包的 `cn` 时使用 `lang/zh-CN.json`，核心语言为 `en` 时使用 `lang/en.json`。治疗药水 Activity 名称、自然 1/20 卡片、隐匿提醒和所有可配置设置均通过这套语言包显示；切换语言后请重新加载世界。\n\n本模块是“明确配置、GM 确认”的辅助工具，而不是替 GM 作裁定。所有会修改长期数据的功能默认关闭；GM 在 Foundry 的“配置设置”中按需启用。版本不精确、来源不唯一、缺少显式标签、没有活动 GM 或对象不允许修改时，模块会失败关闭。\n\n## 显式标签，不猜名称\n\n本模块绝不从中文/英文名称推断物品性质。药水和弹药必须由 GM 用结构化 flag 标记。例如，治疗药水：\n\n```json\n{\n  \"flags\": {\n    \"fvtt-house-rules\": {\n      \"potion\": {\n        \"healing\": true,\n        \"dice\": { \"number\": 2, \"denomination\": 4, \"bonus\": \"2\" }\n      }\n    }\n  }\n}\n```\n\n弹药还必须有稳定的显式 `key`，以便找回时只与同一类明确标签弹药合并：\n\n```json\n{\n  \"flags\": {\n    \"fvtt-house-rules\": {\n      \"ammo\": { \"key\": \"arrow\", \"tier\": 3 }\n    }\n  }\n}\n```\n\n`tier` 只能是 `0`、`1`、`2` 或 `3`。模块只会记录原生消费后射出的单发：`+3 → +2 → +1 → +0`，不会把库存中剩余整叠弹药降级。\n\n## 功能与使用入口\n\n运行时 API 位于 `game.fvttHouseRules`，只在锁定版本和活动 GM 存在时允许修改。API 是有意保守的 GM 入口；玩家 socket payload 不会被直接写入世界。\n\n| 规则 | 已实现的模块边界 |\n|---|---|\n| HR-02 药水 | `potion.configure(item, \"preview\" | \"apply\" | \"restore\")`。`apply` 先保存原始活动、读回确认后生成三个 dnd5e `heal` Activity，再保存实际规范化的应用后基线：附赠动作自饮、动作自饮且仅治疗骰最大化、动作喂服他人。`restore` 仅在当前活动完整等于应用后基线时强制恢复原图；GM后来修改或增加 Activity、旧schema1快照缺少基线时失败关闭并保留快照供人工处理。固定调整值保留。Compendium 物品拒绝直接修改。 |\n| HR-02 生命骰 | `hitPoints.gamble(actor, classItem, level)` 调用原生 `actor.rollClassHitPoints` 和 `HitPointsAdvancement.apply`。第一级不介入；第一次掷出 1 才重掷一次，第二次无论结果都接受；锁为 Actor + Class + Level。 |\n| HR-02 低属性 | 选中 Token 时仅作上下文提醒；`lowAbility.reminder(actor)` 也可供 GM 面板调用。它绝不扫描世界或修改 Actor。 |\n| HR-03 弹药 | 原生 `dnd5e.rollAttackV2` 的 `ammoUpdate` 产生事务；自动删除时，5.3.3 从 `flags.dnd5e.roll.ammunitionData`，6.0.2 与 6.0.5 从同一攻击消息的 `system.deltas.deleted` 取快照并核对弹药 ID。`ammo.recover(actor, shotId)` 需要 GM 明确确认，重复确认无效。 |\n| HR-03 隐匿 | `stealth.set(actor, state)` 建立显式状态；`stealth.previewMove` 只警告不回滚移动。正常半速、专精减 10 尺、游荡者总等级 7+ 或 GM override 全速；`stealth.dash(actor)` 结束隐匿，`ignoreNextMovement` 可用于传送/GM 调整。非战斗使用 `nonCombatSuggestion`。 |\n| HR-04 自然 1 | 保留的自然 1 只创建 GM 后果请求，确认前零副作用。模块按当前确实可用的候选等权随机：近战反击、符合条件的队友误伤、武器损坏、法术自爆，及可选的精确 RollTable。近战队友必须相邻；远程/法术可选路径外队友。GM 确认伤害后调用原生 `Actor.applyDamage`，世界倍率 `0.5`/`1`、抗性和免疫继续由 dnd5e 处理；不投命中、不消耗反应或原 Activity。`repairWeapon` 可修复损坏。 |\n| HR-04 重击首骰最大化 | 只要武器攻击或攻击检定法术的伤害 Roll 被 dnd5e 标记为重击（包括手动点重击），不要求自然 20；模块先按 dnd5e 原生规则保留完整重击骰池，再把第一伤害部分的第一颗骰拆成 `1dXminX`，因此原始骰面仍会投出而最终按满值结算：`1d8` 重击显示为 `1d8min8 + 1d8`，`2d6` 重击显示为 `1d6min6 + 3d6`。其他骰、其他伤害部分和 rider 继续使用原生重击；目标伤害部分不唯一或骰子结构无法安全识别时失败关闭。自然 20 仍会生成原有 GM 提示卡。 |\n\n武器损坏保存原始 Activity 快照并重新投影累积的攻击与伤害减值；如果期间有其他模块改变了同一 Activity，模块拒绝覆盖，避免吞掉第三方改动。\n\n## 安全与幂等\n\n- 选择活动且 `id` 字典序最小的 GM 作为唯一写入者，避免不同客户端按连接顺序产生不同 authority。\n- 每个持久事件都有由 document/event 身份构成的事务 ID；不含骰点。Actor flags 中的有界 ledger 会去重；自然 1 的卡片确认也只能成功一次。世界 schema 在 `ready` 时迁移到 v1；未知 Actor flag schema 不会被覆盖，而是失败关闭。\n- 玩家消息只携带 UUID/Item ID/事件 ID；GM 重新解析 Actor、Activity、物品、标签与权限。任何失效或不唯一对象都拒绝。\n- 原生 blind-roll 的原始值从不复制到 flags、模块消息或审计摘要。\n- 模块不会 patch Foundry/dnd5e prototype、编辑 LevelDB/Compendium，或自动恢复弹药。\n\n## 已锁定的源码依据\n\n在配置的 reference cache 中检查了 dnd5e `5.3.3`：\n\n- `module/documents/activity/attack.mjs`：`dnd5e.rollAttackV2` 在原生弹药写入前提供 `ammoUpdate`，自动删除时把 source 写入 `flags.dnd5e.roll.ammunitionData`。\n- `module/documents/advancement/hit-points.mjs` 与 `applications/advancement/hit-points-flow.mjs`：`HitPointsAdvancement.apply(level, { [level]: value })` 是原生 HP 选择路径。\n- `module/data/activity/heal-data.mjs`：治疗 Activity 是 `type: \"heal\"`，使用结构化 `healing` `DamageField`。\n\n旧 Lab 中已安装 MIDI-QOL `14.0.11` 与 DAE `14.0.12` 的发布源码，旧组合已有运行验收。ServerNext 精确检查已安装的 MIDI-QOL `14.6.0-beta.4338eeab.local.9`、DAE `14.0.14` 和 Dice So Nice `6.3.1`；House Rules 与此组合的关键行为仍须目标世界验收。其他组合失败关闭。\n\n对照 ServerNext 安装的 dnd5e `6.0.2` 源码：攻击消息改用 `type: \"attack\"` 和 `system.activity/item/ammunition/targets`，被删除弹药保存在 `system.deltas.deleted`；`rollAttackV2` / `postRollAttack` 仍分别在消费前后触发。模块对两代消息分别检查发送者所有权、speaker、Activity 与 Item 身份、弹药 ID、GM 侧库存快照和事务去重。`rollClassHitPoints` 与 `HitPointsAdvancement.apply` 在 6.0.2 中仍存在，但实际等级提升中的持久化链和所有村规语义尚未在目标世界验收。\n\n对照固定 dnd5e `6.0.2` 与 `6.0.5` 源码，House Rules 所依赖的 `system.deltas.deleted` 仍保存删除物品的序列化文档；6.0.5 改为只在 `system.deltas.created` 保存创建物品 ID。House Rules 使用删除快照而不读取 `created`，因此该差异不改变当前恢复路径。`14.368/6.0.5` 仍需目标世界验证，旧 6.0.2 运行记录不替代它。\n\n旧版验收所用 Foundry core 源码快照为 `14.361`，模块不依赖未核实的 core 私有 API；旧版聊天卡使用 dnd5e 5.3.3 公开触发的 `dnd5e.renderChatMessage`。本地矩阵已经对 Foundry `14.364` / dnd5e `5.3.3` 完成安装、聊天卡、Token 移动和多客户端路径回放；具体结果见仓库的[本地 E2E 报告](../../docs/remediation/2026-08-07-fvtt-v14-house-rules/evidence/local-e2e-20260808/LOCAL-E2E-REPORT.zh-CN.md)。这不等同于 14.368 / 6.0.2、生产或真实跑团验收。\n\n## 构建、归档与受保护 Lab 工具\n\n在该目录执行：\n\n```powershell\nbun run typecheck\nbun run test\nbun run build\nbun run verify:artifact\n```\n\n`build` 生成 browser-targeted `dist/scripts/module.js`，同步 manifest/语言/样式，并生成固定排序、固定时间戳的 `release/fvtt-house-rules-0.1.3.zip`。`verify:artifact` 核对 package、源 manifest、构建 manifest、必要文件和 ZIP 内容。\n\n`install:local-lab` 与 `verify:local-lab` 仅接受精确 `FVTT_OPS_LAB_ROOT=F:\\FoundryLab\\foundry-v14`。安装还要求显式 `HOUSE_RULES_LOCAL_LAB_INSTALL=1`，拒绝远程/生产环境变量、链接目标和已有模块目录，且从不覆盖安装。它们只证明文件安装，不等于真实 E2E。\n","foundry-modules/fvtt-injury-fading-spirits/CREDITS.md":"# Icon credits\n\nThis module bundles original SVG icons from [Game-icons.net](https://game-icons.net/). The pinned upstream source tree is [game-icons/icons at `82d948812bfe3f269ef8f731dcdb07b08160edc4`](https://github.com/game-icons/icons/tree/82d948812bfe3f269ef8f731dcdb07b08160edc4).\n\nEach SVG is copied byte-for-byte from the listed original download. Only the bundled filename and path differ; the artwork was not edited or traced. The SHA-256 values below identify the original downloaded SVG bytes. Paths in the table are relative to the built module; repository source stores these files under `src/`.\n\nLicense notice: the listed artworks are licensed by their respective creators under [Creative Commons Attribution 3.0 Unported (CC BY 3.0)](https://creativecommons.org/licenses/by/3.0/). Reuse is subject to that license; retain creator attribution and the license notice. Read the [full license legal code](https://creativecommons.org/licenses/by/3.0/legalcode).\n\n| Bundled path | Artwork title | Creator | Source page | Original SVG | Original SVG SHA-256 |\n| --- | --- | --- | --- | --- | --- |\n| `icons/injury.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury-1.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury-2.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n| `icons/injury-3.svg` | Bandaged | lorc | [lorc/bandaged](https://game-icons.net/1x1/lorc/bandaged.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/bandaged.svg) | `0bbf9c29d30da4e1fbfa55e612adad767282cd8d4c66beefc806fa81d9b832b1` |\n","foundry-modules/fvtt-injury-fading-spirits/README.zh-CN.md":"# 伤势与消逝的灵魂\n\n运行时仅接受 Foundry VTT `14.364` / dnd5e `5.3.3`、历史候选 `14.368` / `6.0.2`，或新增候选 `14.368` / `6.0.5` 三组精确配对；交叉和未列版本会失败关闭。6.0.5 目前通过固定源确认与离线门禁测试，仍须在 ServerNext 本地 Lab 做 GM/玩家多客户端语义验收。模块不依赖 MIDI-QOL、DAE 或其他村规模块。\n\n## 语言\n\n模块跟随 Foundry 世界的核心语言设置，不根据操作系统或模块安装路径猜测语言：\n\n- Foundry 核心语言为 `zh-CN`，或使用 Foundry 中文翻译包的 `cn` 时加载 `lang/zh-CN.json`，伤势、消逝的灵魂、复活模式、设置向导和 GM 裁定界面显示中文。\n- Foundry 核心语言为 `en` 时加载 `lang/en.json`。\n- 修改 Foundry 核心语言后请重新加载世界；当前已经打开的 Dialog 不会被动态重绘。\n- 模块的 manifest 标题使用中英双语，避免在管理模块页面中出现不可识别的纯英文标题。\n\n## 使用\n\n模块首次启用时，活动 GM 会看到设置提示；所有自动修改默认关闭。启用后：\n\n- character Actor 从正 HP 第一次进入 0 HP 时开启倒地 episode；同一 episode 首次恢复正 HP 叠一层伤势。\n- 伤势层数固定为 `0–3`；任何自动、手动、API 或玩家请求入口都不能写入第 4 层，旧的 4+ 层数据会由活动 GM 归一并写回 3 层。\n- 伤势层数由 Actor flag 保存；角色上的“伤势（X/3）”效果只是显示投影。Token 左上显示带层数的图标，Token 状态列表也会显示并框选“伤势”。\n- Token 状态列表中的“伤势”采用与力竭相同的分层操作：左键增加一层、右键减少一层；到达 3 层后继续左键仍保持 3 层。\n- 0–2 层再次倒地会写入对应死亡失败；3 层时先让 GM 选择，选择前不会预写死亡。\n- 死亡豁免最终保留的裸 d20 为 19 或 20 时按大成功处理。\n- 真实治疗增加到满血、成功短休或成功长休会清除伤势。\n\nGM 可以在 Actor 目录右键选择 `Injury & Fading Spirits`，或选择一个 Token 后在聊天输入 `/ifs`，打开伤势/复活面板。\n\n## 复活仪式\n\n普通/最终仪式可以填写最多三名不同参与者的 Actor UUID、技能、可选属性覆盖、DC 10–20 与优势状态。模块创建 dnd5e 原生 `request` ChatMessage，玩家投骰结果由原生 `flags.dnd5e.requestResult` 关联；最后仍由 GM 确认每项贡献。\n\n最终检定和快速复活检定使用原生 `blindroll`。Actor flags 与 GM 摘要只记录 DC、贡献计数、模式、结果、时间和 GM，不保存最终骰原始值。\n\n快速复活失败会增加永久 DC 惩罚并锁定本次死亡的快速复活；普通失败会锁定常规复活。常规锁存在时，“奇迹”入口只允许开启一次最终仪式。\n\n复活成功只记录回归历史并设置“下一次 0→正 HP 不叠伤势”；实际 HP 恢复仍由对应法术/Activity 处理。\n\n## 公开 API v1\n\n```js\nconst api = game.modules.get(\"fvtt-injury-fading-spirits\").api;\napi.getState(actor);\nawait api.setInjury(actor, 2, \"GM correction\");\nawait api.openResurrectionWizard(actor);\napi.getResurrectionState(actor);\nawait api.withInjurySuppressed(actor, \"resurrection activity\", async () => {\n  await actor.update({\"system.attributes.hp.value\": 1});\n});\n```\n\n外部复活 Activity 或宏若会直接恢复 HP，应由活动 GM 通过 `withInjurySuppressed` 包裹恢复事务。模块不会从物品名称猜测复活能力。\n\n## 安全与限制\n\n- 长期状态仅由 Foundry 的确定性活动 GM 写入；无活动 GM 时不会偷偷改 Actor。\n- 模块只在精确目标版本启用自动化；版本不符会失败关闭。\n- ChatMessage 不是历史事实来源，聊天被清理不会丢失伤势或复活历史。\n- 本地 Lab 验收不代表生产部署或真实跑团长期验收。\n","foundry-modules/fvtt-json-forge/README.zh-CN.md":"# FVTT JSON Forge 0.3.0（开发候选）\n\n本次增量在 Forge Intake 内加入人类写法MD的多生物提取、正式生成、固定自动化配置提取、工具编译与独立审核，并保留“战斗包导入 / 启动控制”。0.3.0 当前是本地构建候选，未发布；安装本增量请使用本次构建的 `fvtt-json-forge-0.3.0.zip`，不要把旧版0.1.0当作已包含新入口。\n\nFVTT JSON Forge 是 Foundry VTT 内的 GM-only Actor / Item 生成与证据审阅模块。0.1.0 把 Forge A–E 作为一个产品交付，精确锁定 Foundry `14.364`、dnd5e `5.3.3` 和 `core` profile；其他版本会 fail closed。\n\n> English summary: FVTT JSON Forge is a GM-only, exact-target browser module for reviewed Actor/Item generation and encounter packages with separately started bound companion macros. This 0.3.0 candidate targets exactly Foundry 14.364 and dnd5e 5.3.3. Existing review recovery, source library and batch paths remain separate. It is not a generic JSON importer or a background server.\n\n## 安装\n\n### Foundry Setup 安装\n\n本次0.3.0候选尚未发布，先使用下一节的本地ZIP方式。下面的Setup链接只有在本增量正式发布后才能取得新功能；旧0.1.0发行包不包含战斗包入口。\n\n在 Foundry 的 Setup 页面打开 **Add-on Modules → Install Module**，把下面的 manifest URL 粘贴到 **Manifest URL**：\n\n```text\nhttps://raw.githubusercontent.com/bill34345/fvttV12JsonGenerator/master/foundry-modules/fvtt-json-forge/src/module.json\n```\n\n安装后进入目标世界的 **Manage Modules**，启用 **FVTT JSON Forge**，再刷新世界。\n\n### ZIP 手工安装\n\n使用本次本地构建的 `foundry-modules/fvtt-json-forge/dist/release/fvtt-json-forge-0.3.0.zip` 和同目录 `SHA256SUMS.txt`，先核对 SHA-256；不假设尚未发布的GitHub Release已经存在。停止 Foundry 后，把 ZIP 解压为：\n\n```text\n\u003cFoundry Data>/Data/modules/fvtt-json-forge/module.json\n\u003cFoundry Data>/Data/modules/fvtt-json-forge/scripts/index.js\n...\n```\n\nZIP 内是 module 根内容，不能再多套一层版本目录。不要覆盖身份不明的同名目录；升级前先确认旧目录确实是本模块。此仓库的运维规则不创建备份，失败时停止并核对目标。\n\n## 三个入口\n\n只有 GM 能在 **Configure Settings → Module Settings → FVTT JSON Forge** 看到入口：\n\n- **Forge Actor**：把结构化 Actor Markdown 转为当前目标的完整 Actor，预览后执行 create-only、readback 和 deterministic reuse。\n- **Forge Item**：对单一、受支持的 world Item 做同样的 preview、create-only、readback 和 reuse；不会隐式创建或修改 Actor。\n- **Forge Intake**：处理 `plaintext-actor`、`ai-monster` 和 `ai-item`。Analyze 只建立来源证据与审阅状态；Generate Candidate 后仍须 formal verification 与 review 同时 `accepted`，Confirm Create 才可用。\n\n原单Actor/Item入口遇到`needs_review`、`failed`、`rejected`、多candidate、多artifact、过期snapshot、权限或版本变化时保持零世界写入。战斗包使用独立审核路径：只有明确的GM辅助、外部规则或文字保留行为具有唯一绑定宏，才能进入包级GM确认；未知错误仍拒绝。模块没有“忽略并继续”按钮，也不会把历史review bundle当成可创建response。\n\n## Provider 与凭据\n\n预览已有战斗包不调用 Provider。人类 MD 入口由 AI 提取生物与固定能力配置，工具生成控制入口；AI 不编写宏代码。本地 Intake 默认使用 DS API 的 deepseek-flash（DeepSeek V4.1 Flash），提取与审核均使用同一模型，默认低推理档；非本地连接继续保留用户明确选择。Luna Max 仅用于受委派的本地验收操作。\n\nAI 模式必须先选择 Provider、协议和精确 model ID，并完成当前连接/结构化输出测试。界面提供 OpenAI、Anthropic、Gemini、DeepSeek、xAI、Mistral、OpenRouter、Qwen、Kimi、GLM 与 Custom presets；preset 只代表连接配置，不代表每个 provider/model 都有同等语义验收。\n\n当前人类 MD 样例已由 deepseek-flash 完成提取、规则选择与独立审核，生成两 Actor 和固定控制入口。来源与静态审核通过不代表场景运行通过；实际本地验收另行记录。其他组合需单独验证。\n\n固定齐射的恍惚使用 Foundry 原生状态身份，避免状态同步模块把同一效果再补成第二份。已有其他来源的启用状态不由本控制器接管或提前结束；本控制器创建的状态按记录的目标回合到期处理。此兼容修复的实际 Chrome 复验尚未完成。\n\nActor 蓝图保留来源固定 HP 和生命骰公式；场上未链接 NPC Token 是否重掷 HP 遵从 dnd5e 世界设置，固定控制器不覆盖该设置。\n\nAPI Key 默认只存在当前页面内存。只有显式勾选持久化时才会写入当前浏览器的 local storage；它不会进入世界 Document、Chat、review bundle、Collection/ZIP、日志或 Forge response。浏览器存储不是加密保险箱；推荐保持持久化关闭，并在结束后使用清除 Key 操作。\n\n## Review、Library 与恢复\n\n- **Review Bundle**：导入后只显示严格解码的历史记录。历史 `accepted` 仍不可直接创建；“以当前来源开启新 attempt”会生成新的 identity、snapshot、calls 和 review。\n- **Managed Source Library**：来源与安全 review 保存在当前浏览器、当前 `worldId:userId` scope 的 IndexedDB。它不写世界 settings/flags，不自动 Analyze，也不保存完整 artifact/response。\n- **Portable export/import**：Library、Collection、标准 ZIP 和 Queue 都有 strict decoder、identity/hash/size/path/CRC 门禁；导出不含 Key、完整 endpoint、provider raw payload 或世界数据。\n\n## Collection 与 Batch Queue\n\nForge Intake 可以导入 mixed Actor/Item Collection JSON 或标准 ZIP。每项拥有独立 source、kind/mode、identity、attempt、status 和 review；输入顺序保留，单项失败不会让其他项升级为 accepted。\n\nRunner 固定 concurrency `1`，只有 GM 显式点击才运行。刷新或关闭页面时，`running` / `applying` 项变为 `interrupted`，不会自动重发可能计费的 Provider 请求。跨会话恢复的历史 accepted review 不含完整 response，必须显式 fresh run 后才能重新进入 apply manifest。\n\n批量 Apply 只接受当前页面仍持有完整 accepted response 的项目。确认框会列出 immutable manifest、Document ID、source/artifact hash 和 target；Actor 与 Item 继续走各自 adapter。多 Document 操作不是原子事务，部分成功/失败会逐项报告，不会伪装为全成功或回滚已完成的其他 Document。\n\n## 明确限制\n\n### 角色、召唤物与配套宏整包导入\n\n在 **Forge Intake → 战斗包导入 / 启动控制** 打开新入口：\n\n1. 选择`fvtt-json-forge-encounter` v1 JSON，或仅包含`encounter.json`的标准ZIP。此前普通龙兽交付ZIP、Review Bundle和Batch Collection不是这个格式。\n2. 点击“预览战斗包”。模块在当前浏览器通过正式workflow重新生成每个Actor，显示基础属性、来源、生成数据、宏代码、图片绑定和具体GM操作规则。这个步骤不会调用AI、创建文档或运行宏。\n3. 核对内容后勾选确认，再点击“一起导入角色与宏”。相同且未改变的文档会复用；同一包身份的不同内容、已有文档改变或ID冲突会阻止覆盖。\n4. 导入后在“已导入的战斗控制”里查看宏，点击“启动战斗控制”。固定配置首次启用后会在刷新时重验并恢复；控制面板“停用自动化”会持久停用，关闭面板不等于停用。旧式专用宏仍需手动重新启动。\n\nMacro创建与执行是两个动作。脚本仍在GM客户端权限下运行；导入包不能自行宣称代码可信。启动前重新核对命令hash、绑定Actor的身份与其应有的机制标记；被替换、删掉机制或代码改变的内容需要重新审阅。不要修改hash或flags来绕过检查。\n\n明确的GM辅助/外部规则只在新整包路径中进入显式审核，且必须各自关联一份有正确Actor绑定的宏。原有单Actor/Item accepted-only路径不变；失败来源、未知诊断或缺失覆盖不能借宏包绕过。\n\n多文档导入不保证跨浏览器原子事务。普通失败清理本次新建文档并检查结果；无法清理时列出准确UUID。既有文档不会被覆盖。已上传的内容寻址图片可能保留供重试，图片不同则拒绝覆盖。已在游戏中改变过的角色再次导入可能报告冲突，这是避免覆盖当前状态的预期行为。\n\n样本制作：在仓库运行`bun run tools/forge-encounter/build-example.ts`，产生`crystalbleed.forge-encounter.json`和`crystalbleed.forge-encounter.zip`。包携带来源和绑定宏；Actor JSON由接收端正式生成。样本宏使用`forgeEncounter.actors.dragon`与`forgeEncounter.actors.crystal`，不会按同名任意选择世界角色。\n\n人类 MD 路径支持 2 至 6 种生物、最多 24000 字符。AI 提取并审核生物数据，再选择已实现的固定能力和参数；工具校验并编译控制入口，AI 不写 JavaScript。明确启用的固定配置会在刷新时重验身份后恢复，停用按钮持久生效。未知或不支持的规则保留审阅，不会现场生成代码补齐。完整步骤见[原始MD战斗包指南](../../tools/forge-encounter/README.md)。\n\n前后条件分支使用仅限Encounter的明确GM/配套宏机制：不同时应用互斥的原生效果，完整来源留在能力说明中。该角色的单独状态保持needs_review，必须由来源审阅接受其保留方式，并由正确绑定的唯一宏承担该机制，才可进入包级确认；其他文字或未知机制仍被拒绝。\n\n### 其他边界\n\n- 只支持 Foundry `14.364` / dnd5e `5.3.3` / `core`；不是 v12/v13 模块。\n- 只允许 GM；不是玩家 JSON 导入工具。\n- 不是任意文本、任意模型、任意 Actor/Item 都能 accepted 的保证。\n- 不支持 OCR/PDF/图片 Intake、update/overwrite、按名称合并、embedded Item 产品入口或跨 Document 原子事务。\n- 页面关闭后不会继续 AI/HTTP。真正后台执行需要另行设计 Companion/Gateway、认证与 Key custody。\n- 本地 Lab PASS 不代表生产、任意模块组合或四小时真实桌面会话 PASS。\n\n当前分层证据见 [support matrix](../../docs/acceptance/current-support-matrix.md)，A–E 实施与边界见 [产品计划](../../docs/plan/2026-08-21-forge-fvtt-module-product-execution-plan.md)、[Task D](../../docs/plan/2026-08-24-forge-fvtt-intake-task-d-plan.md) 与 [Task E](../../docs/plan/2026-08-30-forge-fvtt-task-e-plan.md)。\n\n## 维护者构建\n\n```powershell\nbun install --frozen-lockfile\nbun run test:fvtt-json-forge\nbun run release:fvtt-json-forge\nbun run verify-release:fvtt-json-forge\n```\n\n发行输出位于 `foundry-modules/fvtt-json-forge/dist/release/`：\n\n- `fvtt-json-forge-0.3.0.zip`\n- `fvtt-json-forge-module.json`\n- `SHA256SUMS.txt`\n\n构建器固定 ZIP 排序与时间戳；两次 fresh build 必须产生相同 ZIP SHA-256，并验证 archive、独立 manifest、package version 和下载 URL 一致。\n\n\n## 当前验收与通用性边界（2026-09-15）\n\n人类 MD 是可复用的输入模板，生物名称不决定执行分支。自动化使用已实现的固定能力库；其具体形态、模板和操作顺序见[战斗包指南](../../tools/forge-encounter/README.md#人类-md-模板与当前能力范围)。任意新机制不能仅凭填写模板获得自动化支持。\n\n本地专项已验证守护真实伤害阈值、混合伤害合计、临时 HP，以及原生拒绝次数耗尽后的削弱。重复腐化证据保留 PARTIAL，用户决定待独立状态设计后再处理；不宣称每次失败增加一级已严格实测。Dazed修复专项与FVTT页面完整AI生成链尚未复验。当前可提交并合并的0.3.0候选未发布远端，合并不代表生产部署。\n","foundry-modules/fvtt-selected-token-sync/README.zh-CN.md":"# 框选 Token 同步 / Selected Token Sync\n\n这是一个针对 Foundry VTT `14.364` / dnd5e `5.3.3` 的本地模块。\n\n开启 Token 控制栏里的“框选 Token 同步”后，在一个 Token 的 HUD 中执行下列操作，会同步到当前框选的其他 Token：\n\n- Token HUD 核心状态的添加、删除和 overlay 操作；\n- Foundry v14 Token HUD 的移动方式，例如 walk、fly、swim、burrow、crawl、climb，以及“默认”。\n\n“默认”会同步为 `movementAction: null`，不会强制所有 Token 使用 walk。模块也不会修改 `system.attributes.movement.walk` 等 Actor 移动速度字段。\n\n## 使用方式\n\n1. 在 Token 控制栏打开“框选 Token 同步”。\n2. 框选需要同步的 Token。\n3. 打开其中一个 Token 的 HUD，点击状态或移动方式。\n4. 再次关闭工具栏开关即可恢复单 Token 行为。\n\n开关是每位用户独立保存的，默认关闭。同步集合以点击 HUD 时的选择为准；同一个 linked Actor 的多个 Token 只写入一次状态。\n\n模块只处理 Token HUD 的核心状态。由物品、法术、DAE、MIDI-QOL 或其他模块直接创建/删除的 ActiveEffect 不会被本模块批量复制。\n\n## 来源与兼容性\n\n本模块借鉴 Alan Davies 的 [Multi Token Status](https://codeberg.org/cs96and/FoundryVTT-multistatus) 的 MIT 授权实现思路，特别是明确 active 状态、Actor 去重、HUD 来源识别和递归保护。历史 v10-v12 实现使用 `libWrapper`；v14 实现使用公开 hooks，本模块沿用后者，不声明 `libWrapper` 硬依赖。\n\n如果原版 `multistatus` 模块处于启用状态，本模块会拒绝启用同步模式，避免同一操作被复制两次。\n\n## 构建与本地 Lab\n\n```powershell\nbun run build.ts\nbun run test\nbun run typecheck\nbun run labCli.ts install\nbun run labCli.ts install --apply\nbun run labCli.ts verify-install\n```\n\n安装器只接受 `F:\\FoundryLab\\foundry-v14`，只写入其 `data/server-mirror/Data/modules/fvtt-selected-token-sync`，拒绝未知既有目录、链接和非本地目标；它不会创建备份或覆盖现有模块。\n\n本地安装和测试不代表生产环境已经部署或通过长时会话验收。\n","foundry-modules/fvtt-trigger-engine/README.zh-CN.md":"# FVTT Trigger Engine\n\n`fvtt-trigger-engine` 是 Foundry VTT 14.364 / dnd5e 5.3.3 的通用触发器基础模块。它监听 Actor 文档更新、Combat 回合开始和 Combat 回合结束，按世界设置中的定义调用宏，并向其他模块公开稳定的事件订阅接口。\n\n这个模块不拥有任何具体状态规则。Bleeding、Burning、Frozen 等状态由独立的 `fvtt-custom-conditions` 模块管理；Trigger Engine 只负责事件、active GM 单执行者、Actor 队列、重复保护、因果链和宏调用。\n\n## 触发器定义\n\n触发器包含 `id`、`name`、`enabled`、`event`、`conditions` 和 `actions`。支持的事件包括：\n\n- `documentUpdate` / `Actor`，需要 `watchedPaths`；\n- `combatTurnStart` / `Actor`；\n- `combatTurnEnd` / `Actor`。\n\n条件操作数可以读取更新前后的快照或 JSON 字面量，操作符为 `eq`、`ne`、`gt`、`gte`、`lt`、`lte`。宏按定义顺序串行执行，并收到 `triggerContext`。\n\n```js\nconst api = game.modules.get('fvtt-trigger-engine').api;\nconst unsubscribe = api.subscribe(async (context) => {\n  if (context.event.type === 'combatTurnEnd') {\n    // 由其他模块消费通用事件\n  }\n});\n\nawait api.create({\n  id: 'low-hp',\n  name: 'Low HP',\n  enabled: true,\n  event: { type: 'documentUpdate', documentType: 'Actor', watchedPaths: ['system.attributes.hp.value'] },\n  conditions: null,\n  actions: [{ type: 'macro', macroUuid: 'Macro.example' }],\n});\n```\n\n只有当前 active GM 执行事件订阅者和宏。相同 Actor 的更新按观察顺序排队。宏应使用 `triggerContext.updateDocument()` 回写当前 Actor，让因果链能够阻止递归循环。\n\n回合结算等待 Foundry 原生 `combatTurnChange`，即核心回合与效果生命周期完成之后；不使用定时器猜测完成时间。快速切换回合时，同一次转换的结束、开始事件会一起按序入队。新建或导入 Actor 会建立更新前快照，便于消费者识别第一次 HP 变化。\n\n当前开发 E2E 环境为 `F:\\FoundryLab\\foundry-v14\\data\\server-mirror`，世界 `fvtt-v14-module-matrix`，`127.0.0.1:30001`。管理器创建/编辑/启停、真实 Actor 更新与 Combat 事件，以及两个临时 GM 同时在线和 active GM 切换后的单次执行已有实测证据。该环境按用户要求常驻至关机，测试任务只清理自己的对象，不启停 Foundry。未对 serverNext 的 dnd5e 6.0.2 声明兼容。\n\n当前候选使用说明与验收边界见仓库 `docs/runbooks/custom-conditions-and-trigger-engine-usage.md` 和 `docs/reviews/2026-09-21-custom-conditions-release-readiness.md`。\n\nTrigger Manager 可从模块设置菜单或 Token 控制栏打开。状态管理器不属于本模块，应从 Custom Conditions 模块打开。\n\n构建、测试和类型检查使用仓库根目录的 `bun run build:trigger-engine`、`bun run test:trigger-engine` 与 `bun run typecheck:foundry-modules`。\n","foundry-modules/midi-qol/README.md":"# Midi-QOL ServerNext compatibility patch\n\nThis is the retained historical6.0.2/local.9 tool and patch route. Current\nServerNext is6.0.5/local.10; the two request-bonus handler corrections were\nalready integrated separately. Do not rebuild this older lock and overwrite\nthe accepted current installation. Its installer remains bound to the old\ntarget. Current state is only in\n`docs/plan/server-next-migration-handoff-20260927.md`; see the2026-10-01\nrequest-bonus review for the limited local.10 acceptance.\n\nThis directory carries a reproducible patch against an exact official Midi-QOL commit. It does not vendor the upstream repository or reuse the dirty external checkout.\n\nThe supported target is Foundry 14.368, dnd5e 6.0.2, world `cor-cotn`, and the `server-next` data root. `server-mirror` is read-only and is rejected by the installer.\n\n## Workflow\n\n1. `bun run midi-qol:upstream-check` reports the current official releases, branches, and open merge requests. This is advisory; a build always uses the commit in `upstream.lock.json`.\n2. `bun run midi-qol:build` creates a clean source checkout under `.local/midi-qol`, verifies the lock and patch hashes, records baseline and patched TypeScript diagnostics, applies the patch exactly, and builds a candidate ZIP.\n3. `bun run midi-qol:test` runs the patch-contract, archive, and install-target rejection tests.\n4. `bun run midi-qol:install` performs a dry-run against ServerNext. Add `--apply` only for the exact stopped ServerNext target after the candidate and checks pass.\n\nHistorical 6.0.2 tests read only `.local/midi-qol/test-sources/dnd5e-6.0.2/dnd5e.mjs`;\nthey do not read the currently installed ServerNext system, which may have moved to\n6.0.5. Obtain `dnd5e-release-6.0.2.zip` from the official\n[`release-6.0.2`](https://github.com/foundryvtt/dnd5e/releases/tag/release-6.0.2)\nasset URL recorded in that release's `system.json`, extract **only** its root\n`dnd5e.mjs` into the ignored directory above, and verify SHA-256\n`e9570927a215948fb3a3923a322c7bbf1455009565f48813168edd8c6df4890f`.\nThe shared test reader enforces that digest and fails if the file is absent or\ndifferent. This is a historical test input, not a system install or a 6.0.5\ncompatibility claim.\n\nThe build and installer never call the upstream `dev`, `clean`, or `tag` tasks. They do not create backups, modify worlds, or operate on `server-mirror`.\n\nThe local.3 candidate gives each of three ordinary cleanup effects (template, summon, transform) a fresh `_id`, top-level `type: \"base\"`, and `system: { changes: [] }`. This prevents dnd5e's migration from matching an undefined document ID against an undefined status ID. `BaseEffectData` does not declare `system.type`; the local.2 attempt to supply it was incorrect and failed the real workflow. That cleanup patch leaves copied, restored, condition, and enchantment paths unchanged; the separate local.7 candidate below addresses the observed enchantment clone failure. Actual creation, type/model and dependency cleanup still require Chrome acceptance.\n\n## Focused C/F fixture\n\n`bun run midi-qol:prepare-cf` builds an importable Script Macro and a checked test Item input in `dist/cf-fixture`. It does not connect to or modify Foundry. The macro creates only tagged temporary documents through native APIs, reads back the effective 1-minute / Circle-30-ft / creature-target configuration, and refuses to cast if it differs. The cast uses the installed activity workflow; effect deletion must cause region deletion through the real dependency implementation. Its constructor probes are diagnostic and never count as workflow acceptance.\n\nServerNext/30002 is a permanently running shared service. This fixture never starts, stops, restarts, installs modules, changes global Midi settings, activates a scene for other users, or deletes pre-existing campaign objects. The Chrome executor must preserve the service when it finishes.\n\nLocal.5 adds a separate restored-workflow Item/Activity patch: for dnd5e 6+, recover a scaled activity through the native chat-card resolver, then use its Item or the native associated-item resolver before the legacy flag fallback. This addresses optional manual Damage throwing on a valid dnd5e 6 card with no legacy item flag, and avoids access-order-dependent loss of system.scaling. Local.4 was built but rejected in review before deployment for the latter issue. The cleanup patch remains unchanged. Source regression and browser retesting are separate gates.\n\nLocal.6 adds independent patch 0003 for damage-tray target rendering. On the fixed dnd5e 6 target, Actor-only or actorless/missing Token references become explicitly unavailable text rows before the native Token-only builder is called. They contain no damage total or actionable target option; valid targets keep their original calculation/application behavior. Source and native-parent regression tests do not replace browser verification.\n\nThe separate `browser-update.ts` entry is pinned to a local.7-to-local.8 browser-resource update without service operations; see the runbook. A running server may continue to advertise cached local.7 metadata. The fixture compares methods, accessors, damage rendering, enchantment cloning, and the new ActiveEffect creation override against the candidate ZIP. The browser must execute those exact functions before its behavior is attributed to local.8. Refresh only the test tab after a successful update and between active scenarios.\n\nLocal.7 completed its scoped A–G/Z checklist (35/35) on 2026-09-22; those results retain their original version and evidence. Local.8 adds independent patch 0005 after a separate Batch 6 DAE/Tidy test found ordinary ActiveEffect creation failing. In dnd5e 6.0.2, an ID-less ordinary effect can match an ID-less status entry and be migrated to an invalid condition. The new Midi-owned subclass override supplies an ID before that migration only for newly created, non-condition effects on dnd5e 6; explicit IDs, native condition effects, and other versions retain their original path. Offline source checks and a built candidate do not establish local.8 browser acceptance. No Foundry/dnd5e prototype or global status definition is changed.\n\nLocal.9 adds independent patch 0006 for the Batch 6 AL manual-APPLY `isDamaged` timing failure. With dnd5e 6 and `autoApplyDamage=\"none\"`, calculated damage still runs Midi hooks and macros, but DAE `isDamaged` expiry waits for the Midi usage card's own APPLY. The tray requires the exact originating message, a post-write `dnd5e.applyDamage` event, positive HP or temp HP loss, and matching final actor readback before recording a new application. An existing Midi GM action first stores and reads back an independent target Actor flag containing the exact effect UUIDs for this card and damage selector; only those effects can then expire. A retry or fresh client reconciles that snapshot even if HP is already zero, and does not remove an effect added later if completion marking failed. Effects already marked `duration.expired` or disabled also count as settled. If a later target's native APPLY fails, confirmed earlier targets are finalized before the original failure propagates. Cancelled, zero, mismatched, or unrecognized new applications leave the effect in place. Automatic modes retain their existing path. Manual `isDamaged.\u003ctype>` remains unexpired because the post-write hook does not prove a positive contribution from that exact type. On 2026-09-25 the ServerNext GM used a normal Dagger attack and manual damage card: before APPLY the target had HP 40 and the base `isDamaged` effect; after one APPLY it had HP 28 and the effect was removed. This closes that scoped behavior, with task fixtures cleaned. Typed-duration, temporary HP, cancel/retry, and other distinct paths remain outside that observation.\n","foundry-modules/monster-spell-resolver/README.zh-CN.md":"# 怪物法术解析器\n\n这是安装进 Foundry Virtual Tabletop（Foundry VTT）的浏览器模块。它读取本项目生成 Actor 携带的可移植法术清单，在目标世界已启用的 dnd5e 法术资料包中寻找匹配法术，并以 Actor 为单位执行全有或全无的安全解析。\n\n运行时仅接受 Foundry/dnd5e 精确配对 `14.364/5.3.3`、`14.368/6.0.2` 和 `14.368/6.0.5`。`6.0.2` 的既有水合与指定施法路径有历史运行证据；`6.0.5` 在2026-10-01独立通过资料索引、十法术自动水合完整归属、普通UI一次Undo及重载后pending／0缓存。该轮没有人工Review／Apply点击，原生Cast完整矩阵仍未执行，见[限定接受](../../docs/reviews/2026-10-01-next-605-custom-module-restoration.md)。交叉配对及 `6.0.3`、`6.0.4` 等未列版本拒绝。\n\n## 目录归属\n\n- `src/`：浏览器运行源码、`module.json`、语言文件、样式、模板和模块测试。\n- `build.ts`：构建可安装目录和 ZIP。\n- `lab.ts`、`labCli.ts`、`labConfig.ts`：只负责配置后的本地 Foundry Lab 构建、安装、校验、卸载和一次性测试世界准备。\n- `dist/`：可重建的本地构建产物，不提交 Git。\n\n旧目录 `src/foundry/monster-spell-resolver/` 和旧构建、安装脚本已经退役；本目录是唯一实现位置。\n\n## 常用命令\n\n在仓库根目录运行：\n\n```powershell\nbun run test:spell-resolver\nbun run typecheck:foundry-modules\nbun run build:spell-resolver\nbun run foundry:lab spell-resolver install --apply\nbun run foundry:lab spell-resolver verify-install\n```\n\n构建产物位于 `foundry-modules/monster-spell-resolver/dist/`。本地安装目标由 `FVTT_OPS_LAB_ROOT` 精确解析；当前机器的持久测试环境是 `F:\\FoundryLab\\foundry-v14`。\n\n上面的 `foundry:lab spell-resolver install` 是既有 server-mirror 安装路径。ServerNext 首次安装可用 `bun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-json-generator-spell-resolver --version=0.1.7`，先检查干跑的目标与 SHA-256，再加 `--apply`；目标已有版本时该工具拒绝覆盖，升级需单独执行受控流程。0.1.5 只是诊断版，发现正式 Rat Warlock 首条法术的原生缓存投影比较失败；只读差异仅有九条原生效果变化行 `_id` 不同。0.1.6 只忽略这些重建 ID，正式怪物十法术水合及代表性攻击、豁免、目标伤害和日次数消耗真实通过；但一次 Undo 与补偿真实失败，留下 10 个无归属原生缓存。当前已装 `0.1.7` 定点修正 Undo flags 递归合并、系统重建时间戳与效果来源、原生缓存清理。新任务怪物自动十法术水合后，单次 Undo 回到 `pending` 且0法术/0无归属缓存/0受管活动，整页重载结果相同；[现场证据](../../docs/reviews/2026-09-25-resolver-undo-source-and-fix.md)。故意故障补偿仅单测，未在运行中世界注入。文件安装、世界启用、水合、原生 Cast 与 Undo 是分别验收的步骤。\n\n## 支持与安全边界\n\n- 运行时仅接受精确组合 Foundry VTT `14.364` / dnd5e `5.3.3`，以及 ServerNext `14.368` / `6.0.2` 或 `6.0.5`；交叉组合和未列版本会拒绝。manifest 的 `verified` 仍是旧组合；既有十法术水合、代表性原生 Cast 与一次首次水合撤销/重载证据绑定 `6.0.2`，本轮 `6.0.5` 的限定实机接受另记。故意失败时的运行时补偿尚未注入验证。\n- 当前生成器的 Actor 法术清单仍以旧目标生成；Forge `0.4.0` 尚待原工作树整理。因此静态候选不能当作完整的 ServerNext 集成。\n- dnd5e `6.0.2` 的原生 Cast 缓存附魔把变更保存在 `effects[].system.changes`；解析器按原生缓存来源选择该字段，并在更新 Hook 到达后核对实际缓存。`onUpdateActivities` 源码仍以顶层 `changes` 调用 `ActiveEffect.update()`，而目标运行时的 `updateActiveEffect` 差量负载尚未实测；目前兼容嵌套、点路径与顶层形式，仍需在 ServerNext 进行实际 Hook、Keep/Overwrite、no-op 与失败回滚验收。\n- dnd5e `6.0.2` 为 Item compendium 默认索引 `system.source`；索引请求会省略其下的 `system.source.rules/book`，直接从完整的 `system.source` 读取规则世代和书籍。dnd5e `5.3.3` 没有该默认父字段，仍单独请求两个子字段。两版都须保留 2024/2014 区分，不能把缺失规则当成 2014。\n- View Report 的顶层 `status` 表示当前 Actor 状态，只有当前 manifest、目标运行时与严格管理文档仍匹配时才显示 `hydrated`。与当前 manifest 哈希及完整法术引用集合绑定的上次提交，另列为 `lastCommittedOutcome`（含 Keep/Overwrite）；无决策重新预检列为 `currentPreflightWithoutDecisions`。manifest 被替换或提交选择缺失、重复、指向错误引用时，不把旧记录当作当前提交结果。未提交 Actor 仍显示当前预检。\n- 本地安装和短时验证只针对配置后的 F 盘测试环境；完成 server-mirror 的 PID、端口、路径和运行者预检后可自主执行，被其他参与者占用时等待。\n- 唯一生产环境是远程服务器 8080 Foundry；只读 inventory/acquire 可在保留 CLI guard 和目标核对的前提下自主执行，生产安装或 Actor hydration 等写入必须再次取得明确授权。\n- 构建、单元测试和安装 hash 一致只能证明机械正确；目标世界中的实际解析行为仍需单独做运行时语义验收。\n","foundry-modules/open-session-deck/README.zh-CN.md":"# Open Session Deck / 开放式跑团副屏\n\nOpen Session Deck 是一个仅供 GM 使用的 Foundry VTT 队伍与遭遇工作台。它可以保留在 Foundry 主窗口内，也可以弹到第二块显示器。副屏由 GM 已登录的浏览器会话直接渲染，不加载第二个 Foundry 客户端、Canvas、登录页或模块 socket。\n\n## 精确支持范围\n\n- Foundry VTT `14.364` / dnd5e `5.3.3`（已完成运行时验收）\n- Foundry VTT `14.368` / dnd5e `6.0.2`（历史静态迁移候选，尚待世界内验收）\n- Foundry VTT `14.368` / dnd5e `6.0.5`（原生力竭面板切片已验，其余命令和完整GM／玩家矩阵未验）\n\n其他版本、交叉组合和系统会 fail-closed。Daggerheart 计划在后续版本接入，本版不声明支持。\n\n6.0.5 适配从 dnd5e 的 `dnd5eexhaustion0` Active Effect（由 `staticID` 补齐为 16 字符的 ID）读取力竭等级，并通过原生 `toggleStatusEffect` API 调整。2026-10-01 同一自有 Actor 的面板与原生读回通过3→4→3、普通GM重载及精确清理；其余命令、副屏及完整GM／玩家矩阵未由本轮接受，见[限定恢复记录](../../docs/reviews/2026-10-01-next-605-custom-module-restoration.md)。\n\n## 功能\n\n- 主 Foundry 面板与同会话浏览器副屏共享状态\n- 由一个世界级 Actor 文件夹定义队伍，可选择包含子文件夹；临时同行 NPC 只需移入队伍文件夹\n- 直接查看和编辑当前/基础最大/最大修正/有效最大/临时 HP、AC 修正、激励、力竭、状态、专注与死亡豁免\n- 独立批量工作区只处理 HP 与状态，并明确选择目标、全部添加或全部移除\n- 队伍成员在遭遇区显示紧凑占位；NPC 使用完整操作卡\n- 编辑和交换小数先攻，单独或批量为缺少先攻的 NPC 私密投掷，并由 GM 控制玩家可见性\n- 玩家官方 Combat Tracker 在第一轮逐步揭示友方先攻；敌对单位默认隐藏\n- 显示当前遭遇、切换上一/下一回合，并在主画布定位 Token\n- 简体中文与英文界面\n\n玩家先攻隐藏属于普通界面呈现，不宣称能对检查客户端文档数据的对抗性玩家保密。模块不提供独立玩家面板、行动自动化、第二张地图、AI 功能或自定义网络协议。\n\n## 开发验证\n\n```text\nbun run test:open-session-deck\nbun run build:open-session-deck\nbun run typecheck:foundry-modules\n```\n\n构建和安装 hash 只能证明机械结果；真实完成还需要在精确版本的 Foundry 中使用 GM 与玩家客户端验收。\n\n模块采用 MIT License，不再分发 dnd5e 或 Daggerheart 的图片、Logo 或规则文本。\n","foundry-modules/server-next-external-candidates/README.md":"# ServerNext external candidates\n\nThe original builds below retain the historical `NEXT-EXT-20260929-01` target,\nFoundry14.368 / dnd5e6.0.2. Current ServerNext follows the stable6.x policy and\nis now on6.0.5. Do not reuse old runtime contracts or the6.0.2-only launcher for\nthe current service. Already-accepted behavior is reused when still applicable.\nCurrent migration status remains only in `docs/plan/server-next-migration-handoff-20260927.md`.\n\nThe2026-10-02 [DAE phase-chain candidate](./dae/README.md) is a separate narrow\n14.0.14+servernext.1 correction on Core14.368/dnd5e6.0.5. It restores native\nconditions/suppression/applied-marker handling after DAE phase routing. Use\n`bun run --cwd foundry-modules/server-next-external-candidates test:dae` for the\n9 source-contract cases and `build:dae` only with the locked release input and\nauthor license prepared. Installed-file proof and actual startup/no-new-error\nacceptance are separate; paid package validation is excluded by the user.\n\n- Convenient Effects 9.2.7 uses unchanged official package files. Its archive in `dist` is a locally repacked transport; original release archive and digest are preserved in `upstream` and `upstream-lock.json`.\n- Droppables 6.2.1+servernext.1 builds fixed upstream commit with one functional patch: literal string namespace. Local source/package/manifest versions agree. Original source manifest was 1.2.5 because upstream release workflow substitutes the release tag after build.\n- Clocks 1.3.3+servernext.1 replaces its only GSAP call with native Element.animate, and removes the missing script declaration. Package allowlist follows the source release workflow's existing paths; the source has no `images` directory. MIT licenses are included in both local packages.\n- Local manifests retain author/source URLs, but remove official manifest/download update links and show a local title/version. They are not unmodified upstream releases.\n\n`acquire.py` records complete release bodies and verifies public asset SHA-256. Once `upstream-lock.json` exists it fetches those exact releases, never silently chooses a different candidate. `patch.py` requires exact source preimages and preserves functional unified diffs. In `sources/drop`, use `npm ci --ignore-scripts --no-audit --no-fund` then `npm run build` (upstream TypeScript + Vite production build). `assemble.py` packages into `dist`, verifies declared resources and records file hashes. It refuses arbitrary replacement; after a partial failure inspect its precise output before recovery.\n\n`npm test` runs package-owned Node tests against the actual built namespace/animation code and the persistent UI Macro's target, ownership, partial-write and reload behavior. These tests are not browser acceptance.\n\n`install-next.py` accepts only three absent allowlisted packages, checks exact target and offline process/listener state, checks world LOCK handles without writing database contents, verifies dependency hashes, then records every installed file. It never replaces an existing directory. A partial failure requires readback; do not blindly rerun. No Mirror or system files are changed.\n\n`acceptance-macro.js` is imported through normal Macro UI as a new, named batch tool. It stores its ledger on its own Macro document, creates only explicitly flagged fixtures, rejects collisions, resumes partial preparation without duplicate documents, and restores settings/cleans exact owned IDs once. User-visible actions remain real UI tests. It never calls module drag handlers to manufacture success. Delete the tool itself through UI only after saving cleanup evidence.\n\n`launch-next.ps1` is a prepared, bounded service operation for the executor, gated by its actual host Full Access receipt. It leaves the verified resident service running; existing lock directories are not cleared. On startup failure preserve the exact process/log state and send a blocker callback.\n\nThe [DND5E classpack candidate](./classpack/README.md) is a separate approved content adaptation for dnd5e6.0.5. It preserves the v4.3.4 pack/document identities, applies source-established link repairs, and uses explicit source-preserving native API migration with backend verification. Missing custom summons/helpers remain deferred. Use the classpack README and the unique migration ledger for current gates; code/file/source evidence and real UI/reload/cleanup acceptance remain distinct.\n","foundry-modules/server-next-external-candidates/classpack/README.md":"# DND5E不全包 ServerNext 6.0.5 候选\n\n本候选使用官方v4.3.4固定输入，目标Core14.368、dnd5e6.0.5和当前Next的DAE14.0.14+servernext.1／Midi-QOL local.10。输入压缩包SHA-256为`8dceac980d5521c3119141ee166589a0f5ab78c13d9987f61c33f96c72fe22c1`，来源为[固定官方发布](https://api.github.com/repos/HJSmile/classpack/releases/tags/v4.3.4)。保留模块ID、21合集名（包括new-icon）、5655顶层文档和所有既有身份。upstream与dist被Git忽略。\n\n本轮按用户选择完成6.0.5兼容和来源明确的坏链修复。已有V14纯函数修12个独立Macro，按全文原SHA修13个Item的15个嵌入命令。确定内容修复包含传送头盔Cast活动指向现存Teleport，以及神莓、附盖提灯、灯油、工具锤、高档服装、祭袍六组原来源别名的17处引用；MPMM歌利亚的两处链接复用同规则的现存石之坚韧（d12+CON、熟练加值次数、长休恢复）。另将此MPMM特征与原文不符的固定1次上限修为@prof；除该明确次数修复外，其余数值、规则版本、ID和历史溯源保持。Dust Devil缺失召唤Actor、Open Hand／Sun Soul缺失辅助法术和不确定特殊物件单列后续，不创建替代内容。\n\n从仓库根使用`bun run --cwd foundry-modules/server-next-external-candidates build:classpack`，仅接受固定压缩包和不存在的候选目录及新报告，拒绝覆盖现有构建。新构建的报告写在忽略的`dist/candidate-report.json`，与`dist/dnd5e_classpack`同级；仓库内`candidate-report.json`是已接受候选的历史证据，构建不会改写。检查程序优先读取新报告，若新报告不存在则读取历史报告，并核对候选manifest、运行脚本和来源基线的SHA。原包逐行读取、变更读回、源正文／身份／引用与图片审计在相应报告及reference-source-index.json、reference-contexts.json。构建合成浏览器入口和来源保护辅助为一个完整SHA绑定的模块，不单独注入代码。\n\n运行入口在ready注册`game.modules.get('dnd5e_classpack').api`的inventory、preflight、migrate及限定confirmRecovery；不自动写合集。preflight对全部文档严格验证，逐条比较原名、正文、规则版本、进阶ID和有效授予／施法UUID，同时预投影所有16个Actor／Item合集的5530顶层文档。Core表结果字段迁移、HTML空元素序列化、模型新增空默认值和已记录18条孤立物理效果仅按精确原源及代码投影比较；原孤立效果继续不挂载。启用的Tasha初始化投影按精确版本、设置、vendor脚本SHA和每条原始记录比较，不泛放新ID。\n\nmigrate只在已授权的精确Next环境显式调用，使用dnd5e官方getMigrationData／migrateActorData／migrateItemData生成更新，写前保留每个明确原规则版本，正常完整文档API写入，逐文档强制后端回读进阶／效果身份、正文及授予／施法UUID，恢复合集锁。迁移前发现1987个旧stats的2024内嵌物品会被官方旧版本分支改成2014，因此该保护必需。重复效果只按精确核准ID正常deleteEmbeddedDocuments并回读。未审查新效果ID在任何包写入前拒绝。本包游侠在精确Tasha4.0.0条件下通过公开source hook，在其读取期间提供等价数组，之后恢复原生ID对象并核对39个进阶ID；不再依赖保存数组绕过Core清洗。Tasha代码和设置保持。DAE独立候选在调度及执行状态重整时跳过合集Actor，保护模板原效果，世界Actor的状态处理保持原行为。\n\n目标收据绑定Core／系统／依赖／源基线及运行代码SHA，按包保存完成进度；完成前再全量复核来源。任何FAILED或既有未匹配收据禁止重放。跨客户端依赖单执行器合同，不声称原子互斥。单次执行和正常客户端重载通过已有V1文件工具及正常Macro界面，实际运行、代表性车卡／活动／宏行为和批末精确清理分别接受。\n\n从仓库根使用聚焦验证入口`bun run test:classpack-next`；它委托同一包内`test:classpack`，不启动Foundry或浏览器。当前42项通过，另有4项DAE合集守卫检查；覆盖真实Core mergeObject与ForcedReplacement／ForcedDeletion、候选及后端丢进阶／效果拒绝、规则保护、源文／grant目标改变拒绝、公开source hook与独立恢复收据。这是文件及方法证据。实机已经完成单次迁移及随后唯一原效果恢复，全量来源、普通重载、公开hook平衡及95启用集合通过；原FAILED不改写，另有COMPLETE恢复收据。最新实际结果和未完成门只见[唯一迁移总表](../../../docs/plan/server-next-migration-handoff-20260927.md#515-原迁移收尾之后的新适配范围与执行顺序)，历史失败原件保留。歌利亚正常三特征授予、游侠一级PHB宿敌及自然探索者、头盔真实施法配置入口与取消均通过，正常客户端重载保持；本批角色、两条测试消息、临时Macro和owned页已精确清理，原世界与聊天ID保持；手册条目已人工核对并通过生成一致性检查。27个宏不因语法通过而全部算可用，完整Teleport和伤害反应链未执行。MPMM石之坚韧按原文将最大次数从固定1修为@prof，保留d12+CON、长休恢复、现有消耗和所有其他字段；原始与迁移后状态分别保护。离线精确单字段差异及负前像检查通过；实际正常API修复、长休回满2次、正常使用消耗1次及真实1d12+2骰子、客户端重载均通过。原partial检查把系统派生来源显示字段清洗误判为丢数据，已凭精确源码与全字段差异核清并保留原失败原件。源码在迁移分支保留本地提交，尚未合并／推送，Mirror、生产、其他服务和暂停／付费功能边界保持。\n\n文档边界：手册已生成且机械一致性检查通过，但正式Chrome拒绝本地file://协议，因此页面目视检查未执行。拒绝与空白页清理回执已保存；这不改变本包实际Foundry限定接受，也不把文件检查当视觉验收。\n","foundry-modules/session-monitor/README.zh-CN.md":"# FVTT 跑团会话监测器\n\n这是一个面向 Foundry VTT 14.364 / dnd5e 5.3.3 的轻量排障工具，manifest 也允许\nFoundry VTT 14.368 / dnd5e 6.0.2–6.0.5（manifest `verified` 为 6.0.2、`maximum` 为 6.0.5）作为 ServerNext 兼容范围；6.0.5 的新启用和短时握手仍需目标运行时读回。它把\n浏览器内的会话指标和浏览器外的 Chrome/Windows 进程指标分开记录，再在\n结束时合并成一条时间线。\n\n它只观察，不清缓存、不改设置、不删除文档，也不写 Foundry LevelDB。\nv1 只在 GM 客户端运行。\n\n本目录是一个完整 release unit，而不是只有 Foundry bundle：\n\n- `src/`：Foundry browser module、版本化 schema、IndexedDB 与 GM UI；\n- `companion/`：Chrome/CDP、Windows process、CLI、报告与端到端测试；\n- `build.ts`：确定性 module 构建及项目本地 mirror 安装保护；\n- `package.json`：产品版本、独立 typecheck/build/test/monitor 入口。\n\nmodule 与 companion 共同维护 schema v1 和产品版本 1.1.2。它们可以共享本产品的 schema，\n但不得分别成为两个漂移的发布物。唯一的上游运行时依赖是\n`@fvtt-json-generator/contracts/hash` 提供的 browser-safe SHA-256；Foundry runtime 不导入\ncompanion，companion 也不导入 generator、workflow、Web 或运维实现。\n\n## 独立构建与测试\n\n在主 workspace 安装锁定依赖后，可直接从本目录运行：\n\n```powershell\nbun run typecheck\nbun test\nbun run build\n```\n\n构建产物位于：\n\n```text\nfoundry-modules/session-monitor/dist/module\nfoundry-modules/session-monitor/dist/fvtt-session-monitor.zip\n```\n\n## 安装\n\n```powershell\nbun run install:session-monitor\n```\n\n安装目标固定为：\n\n```text\n.local/foundry-v14/data/server-mirror/Data/modules/fvtt-session-monitor\n```\n\n随后在目标世界的“管理模组”中启用\n`FVTT Session Monitor / 跑团会话监测器`。MIDI-QOL 14.0.11 与\nSequencer 4.2.3 是可选的推荐依赖；未启用时只会留下对应\n`capability-gap`，不会让会话失败。\n\n## 权限与配置边界\n\n- 根命令只会把 module 安装到项目内的 `server-mirror`；生产部署仍需单独授权，\n  不会因运行 build、test 或 install 命令而发生。\n- companion 只启动并管理自己创建的专用 Chrome，不接管用户日常 Chrome；\n  它通过 CDP 和 Windows 进程接口读取性能信号，不读取 cookie、密码或浏览器凭据。\n- 专用 profile 与证据默认写入 workspace 的 `.local/`，不会写入 Foundry\n  LevelDB。可用 `--url`、`--chrome`、`--profile` 和 `--output-root` 显式覆盖。\n- 根 workspace wrapper 会传入内部的 `--workspace-root`，用于定位本地 mirror 和\n  默认 `.local/` 目录；从本 package 直接运行时也可显式传入该参数。\n- companion 必须在普通 GM 登录后才能开始握手。它不会猜测、提取或绕过 GM\n  密码；处于 join 页时只等待人工正常登录。\n\n## 一次真实记录\n\n先启动项目本地 Foundry，再运行：\n\n```powershell\nbun run monitor:session -- record\n```\n\n伴随程序会启动一个专用 Chrome profile，并等待已登录的 GM 世界。第一次\n使用该 profile 时，在新开的 Chrome 中选择 GM 并正常登录即可。登录后它会：\n\n- 调用模块 API 开始或续接一个会话；\n- 每 10 秒写一条 Chrome CDP/Windows 进程采样；\n- 每 60 秒扫描 renderer 的固定 WASM private committed allocation；\n- CDP 断开时留下 gap，并持续尝试重连；\n- 整个 Chrome 被关闭后，用同一 profile 自动启动下一代 Chrome；\n- 若 Foundry 要求重新登录，会停在登录页等待你正常登录，然后核对并续接\n  同一个 session ID；\n- 收到 `Ctrl+C` 后停止会话、生成报告并关闭自己启动的 Chrome。\n\n默认输出目录：\n\n```text\n.local/foundry-v14/evidence/cor-cotn-performance/live-sessions/\u003csession-id>/\n```\n\n主要文件：\n\n- `browser-session.json`：Foundry 模块导出；\n- `companion.jsonl`：伴随程序原始采样；\n- `companion-errors.jsonl`：隐私过滤后的 CDP 错误；\n- `companion-events.jsonl`：Chrome/renderer 代际与重启边界；\n- `session-combined.json`：合并后的完整证据；\n- `report.md`：人类可读摘要；\n- `heap-timeline.svg`：JS heap 时间线。\n\n若端口或 Chrome 路径不同：\n\n```powershell\nbun run monitor:session -- record `\n  --url http://127.0.0.1:30001/game `\n  --chrome \"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe\"\n```\n\n也可以从既有导出重新生成报告：\n\n```powershell\nbun run monitor:session -- report `\n  --browser \u003cbrowser-session.json> `\n  --companion \u003ccompanion.jsonl> `\n  --events \u003ccompanion-events.jsonl> `\n  --out \u003creport-directory>\n```\n\n## GM 面板\n\n- “开始”：建立 IndexedDB 会话并立即采样；\n- “刚才卡顿”：写入无自由文本的时间标记；\n- “停止并导出”：停止采样并下载 JSON；\n- 刷新页面：自动续接同一 world 中最后一个 active session。\n- 空闲时面板保持展开并显示“开始”；开始成功约 2 秒后自动收起为显示状态和 elapsed 的紧凑胶囊。\n- 点击胶囊或按 Enter/Space 可临时展开完整控制；拖动标题栏可移动，位置会夹紧到视口并避让可见的 Foundry 右侧 Sidebar/Combat Tracker。\n- 视口或 Sidebar 改变后会重新夹紧/避让；位置只保存到浏览器 localStorage，不调用 `game.settings`，也不写世界或 LevelDB。\n- `markJank` 注册为 Foundry 原生 GM-only 快捷键，默认没有绑定；只有活动 GM 会话接受该快捷键。\n\n单次会话最多 12 小时、4,320 个浏览器采样、10,000 个事件和 1,000 个\n错误。达到上限会标记 `truncated` 并安全停止。\n\n## 隐私与解释边界\n\n导出不包含聊天文本、骰值、Actor/Item 文本、玩家输入、cookie、密码、\n令牌、IP、原始 Scene/Combat ID 或任意对象 dump。错误消息默认写成\n`\u003cmessage-redacted>`，只保留错误类型、过滤后的栈位置、包 ID 和指纹。\n\nScene/Combat 使用单会话别名。活动模组清单只记录模组 ID 和版本，并保存\n配置哈希。\n\n报告中的 JS heap、renderer private bytes、working set、GPU/utility 进程、\ntexture 估值、DOM 数量和固定 Worker allocation 是不同信号。工具只负责\n相关性对齐，不把相关性写成因果结论。\n\n完整关闭专用 Chrome 不会结束模块中的 active session。伴随程序会自动\n重启 Chrome，并把新进程记为下一代 `browserGeneration`；renderer PID\n变化则只记为递增的 `rendererGeneration`，不会把原始系统 PID 写入报告。\nMarkdown 报告会列出每次冷重启前后的 page heap、renderer private bytes\n及差值，SVG 时间线会显示冷重启竖线。\n\n因此，遇到卡顿时可以直接关闭这个专用 Chrome 窗口；不要同时按\n`Ctrl+C`，也不要先点面板里的“停止并导出”，因为这两种操作代表你明确要\n结束本次记录。若自动重启后出现登录页，只需照常登录；伴随程序会继续等待，\n并且只有恢复到原来的 active session ID 后才会继续采样。\n\n## 验证\n\n```powershell\nbun run test:session-monitor\nbun run typecheck:production\nbun run typecheck:all\nbun run build:session-monitor\n```\n\n生产部署已于 2026-07-30 获得单独授权：部署时通过普通 Foundry 模组管理\n为线上 `cor-cotn` 启用了 `fvtt-session-monitor`。首次 1.1.0 线上点击\n“开始”暴露公网 HTTP 缺少 `crypto.subtle`；1.1.1 已改用项目既有的\n浏览器安全纯 JavaScript SHA-256，并通过 13/13 聚焦测试与远端制品校验。\n\n2026-07-31 的 8080 只读复核再次确认：当前监听进程仍使用\n`X:\\FoundryData`，该 DataPath 下存在完整 1.1.1 五文件制品，五个\n模块资源经 8080 回环均返回 HTTP 200，公网 8080 的 manifest 也返回\n`fvtt-session-monitor` 1.1.1。本次没有登录 GM 客户端或读取运行中的世界\nLevelDB，因此只重新证明“当前已部署并由 8080 提供”，没有把历史启用事件\n冒充为当前实时 `active` 证明。\n\n最终 1.1.1 的“开始 → 刚才卡顿 → 停止并导出”短烟雾测试仍需在服务器重启\n后由 GM 正常加入再完成；实际四小时跑团和非 GM 设备证据也仍未完成，不能\n由安装、HTTP 200 或短烟雾测试替代。\n\n超过 30 分钟的持续 Chrome/Foundry 监测不由代理启动、等待或代跑。四小时\n验收由用户在真实跑团时亲自开始并实时观察；代理只负责事前检查命令、存储和\n隐私边界，并在跑团结束后读取导出证据、生成报告和解释结果。多个短测试也不能\n拼接成一次四小时验收。\n","packages/assets-icons/AGENTS.md":"# Actor 图片、Token 和图标规则\n\n## 这个功能是做什么的\n\n本目录管理 Foundry v14 图标解析、Actor 图片、Token 图片、裁切候选、人工审阅 contact sheet，以及可选的远程图片上传适配器。\n\n## 不可违反的规则\n\n- `actor.img` 与 prototype token texture 是两个不同用途的资产，必须分别路由和验收。\n- safe icon mode 只能使用受支持目录、明确 override 或已验证 catalog；不得根据名称相似度静默替换成错误图标。\n- 自动裁切结果是候选，不是人工美术验收。共享图片、非方形主体、透明边框和图像所有权风险必须保留给审阅流程。\n- SSH/远程上传是外部写入；没有目标、凭据和明确授权时只允许 dry-run/本地计划。\n- 不得把服务器凭据放入浏览器、前端请求、仓库或生成 JSON；公开 URL、远程路径和本地文件都要经过路径/协议验证。\n\n## 修改入口\n\n- 公共出口：`packages/assets-icons/src/index.ts`。\n- `assets/` 管 Actor/Token 资产与审阅，`icons/` 管 catalog/override/报告。\n\n## 验证\n\n- `bun run typecheck:packages`\n- 运行受影响的 icon/image/CLI 测试；v14 catalog 变化时运行 `bun run build:icon-catalog:v14` 和对应 locked reference 检查。\n- 视觉结果必须查看最终 Actor 图、Token 图或 contact sheet；文件存在、尺寸正确和上传成功都不是视觉验收。\n- 影响 Actor JSON 时继续执行正式生成与 `verify:actor`。\n\n## 完成标准\n\n- 资产来源、用途和输出 URL 可追踪，Actor/Token 没有互换。\n- 自动检查通过且最终图片由人工查看，没有把候选误报为已接受。\n- 任何真实远端写入都在当前授权范围内并有读回或等价验证。\n","tools/forge-encounter/README.md":"# 人类 Markdown、固定自动化与战斗包\n\n输入是一份普通 Markdown：写清主生物和召唤物的完整数据、触发时机、目标、豁免、伤害以及来源没有规定的事项。不要求作者写 YAML、JSON、UUID 或 JavaScript。\n\n- 完整来源：[晶血龙兽与月石晶体](../../docs/examples/晶血龙兽与月石晶体-人类写法.md)\n- 空白写法：[召唤生物模板](../../docs/examples/召唤生物-人类写法模板.md)\n\n## 处理分工\n\n1. AI Intake 提取每个生物的证据 IR，渲染规范 Markdown；正式 workflow 生成 Actor 并对照来源审核。\n2. AI 从固定能力清单选择规则和参数，输出版本 2 的数据配置。AI 不编写宏代码，不提供任意路径、UUID 或脚本。\n3. 工具校验来源引文、能力身份、参数及引用，生成固定控制入口。DC、伤害、使用次数和 HP 继续读取正式 Actor 的原生数据。\n4. 独立审核配置与来源的对应关系；整包达到 `ready_for_gm_review` 后才输出可导入文件。\n5. GM 预览、确认并一起导入 Actor 与控制入口，再明确启用自动化。\n\n当前执行器只支持 Foundry 14.364 / dnd5e 5.3.3 / core。V12 需要独立实现和验证，不共用当前执行脚本。\n\n## 已实现的固定能力\n\n| 能力 | 范围 |\n| --- | --- |\n| 豁免能力结算后召唤 | 成功失败均召唤 1 个已绑定生物，GM 选择目标旁合法空位，独立 Token/HP 并加入先攻；可有失败恍惚及半血后续腐化 |\n| 自身回合开始范围能力 | 按原生 save/damage 执行；每回合一次，来源 HP 为零停止，生成瞬间不执行，不按敌友筛选 |\n| 腐化分支 | 首次失败加来源定义的共同腐化标记；已有标记再次失败加 1 级力竭，两者互斥 |\n| 阈值守护 | 同次伤害类型合计，严格超过阈值才减半取整；碎裂不减，削弱时减熟练加值 |\n| 守护碎裂 | 原生能力消耗后碎裂，下一次自身回合开始恢复；次数耗尽后恢复为削弱形态 |\n| 自身回合传奇资源恢复 | 只在来源明确规定的自身回合开始恢复已配置资源池 |\n\n这是有界能力清单，不承诺任意召唤、任意状态分支都能自动实现。不支持的请求须明确保留为待实现/GM处理，不能靠 AI 现场编程补齐。写法示例也不等于所有示例已通过自动化验收。\n\n## Foundry 操作\n\n在 Forge Intake 中配置连接，打开“战斗包导入 / 启动控制”，读取原始 MD。普通“生物一：名称”“生物二：名称”标题可直接分段；其他布局由 AI 识别。支持 2 至 6 种生物、最多 24000 字符。\n\n本地页面默认使用 DS API 的 `deepseek-flash`（DeepSeek V4.1 Flash），包括提取和审核。填写 DS Key 并保持凭据持久化关闭。不会把其他 Provider 的 Key 转送给 DS，也不再提供本机 Luna OAuth 桥接快捷入口。Luna Max 是验收操作者的模型，与 Intake 所调用的模型不同。\n\n生成后核对生物数据、固定能力、参数、绑定与 GM 裁决项，再确认导入。生成的薄宏只调用模块的固定执行器。初次明确启用后，配置保存在模块自有 flags 中；刷新世界时重新校验身份与配置后恢复，不执行 flags 中的任意代码。\n\n关闭控制面板不会停用自动化；使用“停用自动化”按钮可持久停用。旧式专用宏属于另一条显式审核路径，仍需手动重新启动，不具有固定配置恢复语义。\n\n## 本地命令行\n\n默认使用 DS Flash。凭据由父进程的 `DEEPSEEK_API_KEY` 或本机已配置的 `FVTT_LOCAL_DS_KEY_FILE` 提供；后者只指向外部已有秘密文件，程序在内存读取，不复制到仓库、报告或世界。\n\n```powershell\nbun run tools/forge-encounter/run-human-intake.ts docs/examples/晶血龙兽与月石晶体-人类写法.md ./crystalbleed-ds-run\n```\n\n输出目录必须是新的目录。只有整包达到 `ready_for_gm_review` 才写入各 Actor 的 MD/JSON 和 `encounter.forge-encounter.zip`；未通过只保留审核诊断，退出码为 1。每个 DS 阶段最多 5 分钟，不使用持续等待策略或自动退回 Luna。\n\n可用 `--resume-draft \u003creview.json>` 读取同一来源的 IR 提案，重新验证和审阅；不会继承历史通过状态。`--review-feedback \u003cfeedback.json>` 只传递绑定来源与父报告 hash 的具体修正意见，由 AI 修正 IR，不手工编辑最终 JSON。`--configured-provider` 仅用于明确选择其他已配置 HTTPS 服务的场景。\n\n已有 `build-example.ts` 只打包预先整理的来源与专用脚本，不能替代本页的人类 MD → 真实 DS → 固定能力配置验收。\n\n## 验收边界\n\n静态测试、来源审核、整包导入与真实回合行为分别记录。运行 server-mirror 前核对实例身份；本项目要求由受委派的 Luna Max 在外部 Chrome 进行有界操作，完成后返回报告，不持续监听或轮询。\n\n来源未指定的召唤持续时间、数量上限、召唤者死亡处理等保持 GM 裁决。原生攻击目标、战术选择、未选中的其他能力仍由 GM 正常操作。\n\n\n## 人类 MD 模板与当前能力范围\n\n可从[人类填写模板](../../docs/examples/召唤生物-人类写法模板.md)开始，按普通 Markdown 写明每种生物的完整数据、能力触发条件、结果和召唤关系。晶血龙兽是验收样例，不是名称匹配的专用分支；AI 根据本次来源提取 Actor 和能力绑定。填写模板不代表任意机制都能自动执行。\n\n当前固定能力支持：豁免结算后无论结果在目标相邻空位召唤一只；自身回合开始对范围内其他生物结算；首次腐化标记/重复失败加力竭；超过阈值减半、碎裂后恢复与耗尽后减熟练加值；来源明确的自身回合传奇资源恢复。数量、结果、放置或触发方式超出这些形态时，需要扩展能力库或明确保留 GM 操作，不能由 AI 改写为近似规则。AI 不生成执行代码。\n\n使用顺序：在 FVTT 启用本模块，配置 Provider/API Key，打开战斗包入口读取 MD，生成并审核，再导入；导入之后单独启用固定控制器。已有包的预览和导入无需再次请求 AI。Actor 蓝图保留来源 HP，未链接 Token 的随机 HP 遵从世界设置。\n\n截至 2026-09-15，本地 14.364/5.3.3 已验证包导入、齐射两分支召唤、晶体回合效果、守护阈值实际伤害与次数耗尽后的削弱。重复腐化只有部分运行证据；用户决定待独立状态设计后再明确，不视为严格单次增量验收通过。原生 Dazed 修复通过离线回归，尚无专门 Chrome 复验；FVTT 页面从 API Key 到完整 AI 生成的全链也未重新实测。CLI 真实 DS 审核与浏览器已生成包验收分开记录。此合并不等于生产部署或所有 MD/能力组合通过验收。\n","tools/foundry-ops/README.zh-CN.md":"# Foundry Ops（Foundry 运维工具）\n\n这个目录是项目内所有 Foundry 本地测试、离线世界检查和生产只读盘点的统一边界。它不是生成角色 JSON 的功能，也不是 Foundry 浏览器模块。\n\n## 这个目录现在包含什么\n\n以前，相关工具散落在 `scripts/foundry-lab` 和 `src/tools`，仅看命令名很难判断它会不会写文件、会不会连接生产服务器。现在它们已经收进一个产品目录，并共用一个入口：\n\n```powershell\nbun run foundry:ops --help\nbun run foundry:ops catalog\n```\n\n`catalog` 会用中文列出每条命令的目标和最大权限：\n\n- `read-only`：只读取目标；生产读取无需逐次对话授权，但仍须通过目标核对、外部配置、`--apply` 和 `--allow-production-read`；\n- `local-mutation`：会在本机生成报告、缓存、快照，或修改明确的本地测试镜像；\n- `production-mutation`：会安装、重启、hydrate、迁移或以其他方式写入生产环境。统一 CLI 故意不提供这种入口，只能走另行批准的操作手册，并在写入前再次取得明确授权。\n\n“生产迁移”相关的两个现有脚本只处理离线世界副本，因此被正确归类为“修改本地”；它们不会直接修改线上服务器。\n\n目录中的模块可以这样理解：\n\n| 模块 | 用途 |\n|---|---|\n| `src/cli.ts`、`src/routing.ts`、`src/commandCatalog.ts` | 统一命令入口、命令分类和权限检查 |\n| `src/config.ts` | 本地路径、生产连接配置和防止路径逃逸的安全检查 |\n| `src/process.ts` | 启动外部程序，并从命令、输出和错误中隐藏敏感值 |\n| `src/acceptance/` | 文件侧验收合同、预检、一次执行、收据读回和恢复提示；模块玩法由各消费者另行判断 |\n| `src/asset-inventory/`、`src/assetInventory.ts`、`src/localScope.ts` | 只读扫描本地 Foundry 资产，并登记整个 `.local` 顶层的所有权、隐私排除和待判断项 |\n| `src/lab/` | 本地 Foundry 实验环境、模组获取、诊断、补丁、启动和停止工具 |\n| `src/world-audit/`、`src/worldFootprintAudit.ts` | 对停止状态的本地世界建立只读快照并生成隐私安全的审计报告 |\n| `src/production-migration/`、两个 `productionMigration*.ts` | 比较三个本地世界副本并构建离线迁移候选；不会连接或修改生产服务器 |\n\n`spell-resolver` 命令仍经过 Foundry Ops 的统一权限入口，但浏览器源码、构建、本地安装生命周期和测试均由 `foundry-modules/monster-spell-resolver/` 自己维护；Foundry Ops 只负责把命令路由给该模块，不拥有解析器实现。\n\n## ServerNext 仓库自有模块首次安装\n\n先在对应 `foundry-modules/\u003cowner>/` 构建 `dist/module`，再从仓库根目录预览：\n\n```powershell\n$env:FVTT_OPS_LAB_ROOT = 'F:\\FoundryLab\\foundry-v14'\nbun run foundry:ops lab install-server-next-owned-module --module-id=fvtt-injury-fading-spirits --version=1.0.1\n```\n\n白名单还包括 `fvtt-json-generator-spell-resolver` 0.1.1，对应源码目录 `foundry-modules/monster-spell-resolver`。先构建并核对预览，再用实际模块 ID `--module-id=fvtt-json-generator-spell-resolver --version=0.1.1 --apply` 做首次安装；面向 server-mirror 的旧解析器安装命令不适用于 ServerNext。\n\n核对预览输出的来源、`data/server-next/Data/modules/\u003cid>` 目标、文件数量和 SHA-256 后，在同一命令末尾加 `--apply` 才会写入。CLI 要求 `FVTT_OPS_LAB_ROOT` 精确指向 `F:\\FoundryLab\\foundry-v14`，只接受代码内列明的仓库自有模块；构建目录按模块固定为 `dist/module`（House Rules 为 `dist`），构建 manifest 与仓库 manifest 的完整 JSON 内容须一致，且 ID、版本符合参数、所声明的脚本、样式、语言和合集资源确实存在。目标必须不存在；已有包（即使为空目录）一律拒绝替换。安装先暂存在同卷但不被 Foundry 模块扫描的 `evidence/server-next-module-install-staging/installing-\u003cid>-\u003cuuid>`，核对后重命名到目标；成功后逐文件比较 SHA-256，失败时报告并保留暂存目录供核查，不自动清理或修改旧包。这个命令不启停 Foundry、不修改世界数据库，也不处理付费模块。\n\n## 共用验收工具：文件侧第一版\n\n本版用于已审核、已授权的本地文件检查，复用上述命令分类、路径保护和子进程入口。请求中声明 `local-file-checks` 不会授予新权限，也不会把被执行命令变成沙箱；命令不得启动服务、操作浏览器或读写 Foundry 世界。生产连接环境变量不会传给这些检查。\n\n准备一个请求 JSON，字段见 [请求示例](../../docs/templates/development-feedback-request.example.json)。`workspaceRoot` 必须是实际 Git worktree 根，`candidatePaths` 和 `argv[0]` 必须是存在的绝对文件路径；`argv` 是参数数组，不经过 shell 拼接。填写目标、验收含义、case 名称、授权来源、预检和一次正式检查。工具自动生成 run／dispatch／receipt ID，读取分支、HEAD、指令基线提交、适用 AGENTS 和候选／执行程序的 SHA-256。\n\n```powershell\nbun run foundry:ops acceptance prepare --input=\"I:\\实际工作树\\.local\\request.json\"\nbun run foundry:ops acceptance ready --contract=\"\u003cprepare 返回的 contractAbsolutePath>\"\nbun run foundry:ops acceptance execute --contract=\"\u003c同一合同绝对路径>\"\nbun run foundry:ops acceptance collect --contract=\"\u003c同一合同绝对路径>\" --receipt=\"\u003c合同同目录的 receipt.json>\"\nbun run foundry:ops acceptance resume --contract=\"\u003c同一合同绝对路径>\"\n```\n\n每一步必须检查退出码和 JSON，成功后才继续。`prepare` 保存合同并做文件序列化读回；首个预检失败后停止余下检查并退出 1。`expectJsonOk:true` 的预检还要求一个 `ok:true` JSON。`ready` 再核对实际路径、分支、HEAD、候选、指令与执行程序；失败退出 2，不能派发。主宿主接入时应使用 `dispatchPrepared()`，它把检查和领取放在调用派发回调之前；本版没有自动发送聊天消息的命令。\n\n`execute` 原子领取一次 dispatch，运行合同中的检查并保存原始 stdout／stderr／退出码与 `receipt.json`。退出 0 只说明保存成功；行为结论由 `collect` 给出。超时或调用失败也保存收据；已领取的操作不能直接再执行。`resume` 提示检查现存状态，或读回已有收据，不自动重放、不重建 fixture。单个检查必须显式设置 1–120000 毫秒的超时；当前进程入口管理直接子进程，检查命令不得留下后台子进程或服务。\n\n`collect` 验证同一 worktree／run／dispatch／revision／case、合同指纹及原始文件指纹，拒绝旧收据、错路径和被改写的原件。摘要写入 `summary.\u003creceiptId>.json`，重复收集读回同一结果，不覆盖不同摘要。`json-ok` adapter 只判断合同明确要求的本地 JSON 检查：`ok:true` 且退出 0 为 PASS，`ok:false` 为 FAIL，空输出、只有 PASS 标签或不支持的输出为 INCOMPLETE。`manual` 保留原件并返回 INCOMPLETE，交给独立审查。\n\n摘要把 `behavior`、`evidence`、`cleanup` 和 `parentReview` 分开。本版不创建 Foundry 对象，因此 cleanup 是 `NOT_REQUIRED`；parentReview 一直是 `PENDING`，自动分类不能代替父审。收集退出码为 PASS=0、FAIL=1、INCOMPLETE／身份拒绝=2。`resume` 的退出码只表示状态读取结果，不是新的语义验收。\n\n所有产物只新建在目标 worktree 的 `.local/development-feedback/\u003crunId>/`，不修改既有证据。候选、HEAD 或指令发生变化后准备新合同。下述第二消费者已提供离线来源与参考数据 adapter，以及明确恢复后的专属运行合同／服务核对；旧证据影响分析、通用回调调度和对象清理自动化仍属后续。完整任务合同模板用于计划这些边界，不能把文件检查 PASS 升级为玩法通过。\n\n安全回归入口：`bun run test:acceptance-tools`。流程依据：[开发反馈闭环](../../docs/runbooks/development-feedback-loop.md)；进度：[试点计划](../../docs/plans/2026-09-29-development-feedback-pilot.md)。\n\n上述退出码指 acceptance 子入口的原生值；本机 Bun1.3.8 的多层 `bun run` 包装可能把非零退出归一为1。PowerShell 外层脚本没有显式传递原生退出码时也可能只报告1；需要保留该值时，先保存原生命令的 `$LASTEXITCODE`，再用 `exit` 传给调用者。接续脚本必须同时检查非零退出和输出 JSON 的 `exitCode`（若有）／`layer`／`behavior`／`parentReview`，不能把外层1直接认作业务 FAIL，也不能因为原件保存成功而继续派发。INCOMPLETE／PENDING 的人工出口由独立父审另存结论。\n\n### 第二个消费者：Vision5e + Item Macro 离线接入\n\n`prepare-batch` 读取已有 ServerNext 批次合同，复用当前文件侧内核，自动生成本任务合同与机器字段。请求只需 `workspaceRoot`、`sourceContractPath` 和 `authority:{source,scope:\"offline-batch-preparation\"}`，格式见[批次请求示例](../../docs/templates/development-feedback-batch-request.example.json)。原业务树、候选、旧合同及其回调父／子 UUID 都只读；新合同不会替代原当前状态源。\n\n```powershell\nbun run foundry:ops acceptance inspect-batch --source=\"\u003c旧批次合同绝对路径>\"\nbun run foundry:ops acceptance prepare-batch --input=\"\u003c本任务请求绝对路径>\"\nbun run foundry:ops acceptance ready --contract=\"\u003c生成的本任务合同>\"\nbun run foundry:ops acceptance execute --contract=\"\u003c同一合同>\"\nbun run foundry:ops acceptance collect --contract=\"\u003c同一合同>\" --receipt=\"\u003c同目录 receipt.json>\"\nbun run foundry:ops acceptance ready-batch --contract=\"\u003c同一合同>\"\n```\n\n`inspect-batch` 只读核对候选 ID／版本、声明资源全集及 SHA-256、ZIP 指纹、宏 JSON 的命令往返、固定目标门禁和 fixture／清理清单一致性。旧合同的“9项测试PASS”文字作为历史声明保留，不当成此次重新运行的测试结果。既有 Python 生产者的 Item Macro 哈希按 `read_text()` 规范化换行后的文本计算；工具分别校验该文本哈希与实际文件字节指纹，不能混为一个值或忽略差异。\n\n共用合同的 `readonlySources` 支持明确选择的跨工作树文件，用绝对路径与字节指纹防止混用；不复制业务源码。业务树分支／HEAD、源合同或任一绑定文件变化时拒绝继续，重新准备合同。`ready` 的 `executionScope:local-file-checks` 只允许合同内的离线检查；`ready-batch` 报告 `dispatchable:false` 并退出 2。本增量的运行授权固定为 NONE，即使源合同以后恢复，也不自动发消息、安装、启停或执行 Chrome。\n\n导入已有原生读回时，另存为 UTF-8 JSON，并提供独立观察的目标上下文 JSON：`origin`、`dataPath`、`world`、`foundry`、`system`、`systemVersion`。如果尚无实际上下文或读回，就保持未执行；不要用期待值制作一个“通过”样本。离线参考导入与下述明确恢复的实机收集是两个接受边界。\n\n```powershell\nbun run foundry:ops acceptance capture-receipt --contract=\"\u003c合同>\" --input=\"\u003c已保存原生读回>\" --context=\"\u003c独立目标上下文>\"\nbun run foundry:ops acceptance import-receipt --contract=\"\u003c合同>\" --input=\"\u003ccapture 返回的 envelopePath>\"\nbun run foundry:ops acceptance resume --contract=\"\u003c合同>\"\n```\n\ncapture 自动填写共用 run／dispatch／revision、源批次 ID 和两个合同指纹，保留原生字节，不要求手填已知 ID。import 拒绝错 run、revision、源合同、目标、版本、fixture 或原件哈希；重复回执保持同一 receiptId。部分文件已写但摘要未完成时，只读核对已有字节再补齐，不覆盖不同原件，也不重放业务操作。\n\n本版导入一律为 `REFERENCE_ONLY`，成功保存后仍退出 2，整体 behavior／evidence 为 INCOMPLETE、runtime／cleanup 为 NOT_EXECUTED、父审为 PENDING。模块 adapter 可独立核对读回中 60→90→60、命令文本、单次手动／活动记录；忽略原件中的 `pass` 标签，数据判断不代表 UI、客户端加载哈希、角色／重载或完整清理已通过。完整清理还需要对象、文件夹和辅助宏缺席的独立证据，不能仅凭 phase=cleaned 接受。\n\n消费者聚焦回归：`bun run test:acceptance-next-vm`。真实安装、Chrome、跨线程送达和业务清理在原批次明确恢复后，按其当前授权与现场证据另行执行；工具的离线成功不恢复暂停状态。\n\n实际批次曾遇到 DAE 自动生成的标准 Condition 没有本任务标记，原 fixture 清理因此保守停止。专属纯检查 `requireNextVmCleanupOwnership()` 只有在新建 Actor 的缺席／出生证据、完整持久化集合、已归属状态输入、精确 DAE 版本、实际 `dae.autoCreated` 与其源记录、固定父／ID／状态／创建时间都匹配时，才确认这一自动后代的限定归属。它不修改或删除文档，不替未知对象补标记，不能凭名称、类、静态 ID 或 `isTemporary` 放行。手动条件、缺失标记、额外对象和身份变化均拒绝；使用 `bun run test:acceptance-cleanup` 验证这些边界及实际编译入口。`buildNextVmCleanupGuard()` 显式绑定本地导出并检查调用函数存在；编译／语法成功不能替代这个入口往返。实际恢复仍由父任务准备并审核后通过正常应用入口执行。\n\n### 已明确恢复的 Vision5e + Item Macro 实机批次\n\n文件侧合同继续保持运行授权 NONE。用户明确恢复原批次后，可建立单独的运行合同；目前只支持已有 ServerNext 的这两个候选，不提供通用安装器、服务启动器或浏览器调度服务。\n\n先准备运行请求，包含 `offlineContractPath`、`authorityPath`、`executorPermissionsPath`、`serviceReceiptPath` 四个绝对路径。授权记录包含 `scope:\"local-next-vm-runtime\"`、`explicitUserResume:true`、实际授权引用 `source`、原 `resumeSourceDispatchId`、本轮 `parentThreadId`、原执行聊天 `childThreadId` 及该执行器的期望 `model`／`reasoningEffort`。当前项目普通 Chrome 默认为 `gpt-6.1-sol / medium`，主控配置独立记录；工具核对执行器实际上下文与该授权记录相符，不要求与主控effort相同。这是授权的记录，不是 JSON 文件自己授予权限。旧暂停合同只读保留，新回调目的地单独绑定。\n\n执行聊天的权限收据必须来自自身实际 `turn_context`，包含 `threadId`、`model`、`reasoningEffort`、`sandboxMode`、`approvalPolicy`、`verifiedFromActualHostContext`、`actualContextPath`、`actualTurnId`。工具重新检查该精确聊天最新上下文；主控权限或提示词不能替代。服务收据包含本轮父／子 UUID、PID、完整命令行、OS owner、UTC ISO 格式 `processCreationDate` 与启动前 `mirrorBefore`。派发前再次核对 127.0.0.1:30002、既有 ServerNext 数据路径、Foundry 14.368、实际世界／系统与候选字节。失配不调用消息派发函数。\n\n```powershell\nbun run foundry:ops acceptance prepare-runtime --input=\"\u003c本轮运行请求绝对路径>\"\nbun run foundry:ops acceptance ready-runtime --contract=\"\u003c返回的运行合同>\"\nbun run foundry:ops acceptance claim-runtime --contract=\"\u003c同一运行合同>\"\n```\n\n`claim-runtime` 在再次检查后原子领取一次派发；它自身不发送消息，返回 `transport:NOT_SENT`、`runtime:NOT_EXECUTED`。获准的宿主随后用原生聊天工具派发到合同子 UUID，并保存实际运输回执。若消息失败，保留领取状态并检查，不能自动重放；再次领取会被拒绝。执行聊天在第一项 E2E 前仍需核实自己新一轮的实际配置。派发后按 chrome-delegation-dev 等结果回调，不轮询。\n\n运行回执输入包含 `binding:{dispatchId,contractRevision,contractSha256,parentThreadId,childThreadId}`、`nativePath`、独立 `contextPath` 和非空 `evidencePaths`。使用本轮合同自动取得这些字段；原生宏仍使用旧 `sourceDispatchId`，两者分别核对。\n\n```powershell\nbun run foundry:ops acceptance collect-runtime --contract=\"\u003c本轮运行合同>\" --input=\"\u003c已保存证据清单>\"\n```\n\n工具固定原件和证据指纹、按实际数值／记录判断 API 数据观察，并幂等读回同一收据。成功收集仅为 `runtime:OBSERVED`，界面、玩家角色、刷新持久化、错误归因与完整归属清理仍需父任务查看实际证据；总体验收保持 INCOMPLETE／父审 PENDING，退出 2。截图存在、PASS 标签或 `phase:cleaned` 都不会自动变为完整接受。必要步骤完成后，由父任务另行记录语义判定及剩余范围。\n\n### 接续时怎样读验收结果\n\n先读任务的当前状态和对应独立验收记录，再决定是否执行下一步。共用工具保存的 INCOMPLETE／PENDING 表示还有人工语义出口，不等于实际任务一直未完成。独立父审可以接受已核对的限定行为、恢复和清理；原收据保持不变，两个层级分别留证。已经闭合的批次不重放，新候选、范围变化或实际缺陷另立任务边界。\n\nVision5e + Item Macro 的限定实机链已完成父审和精确清理，见 [实机闭合记录](../../docs/reviews/2026-09-30-development-feedback-next-vm-runtime.md)。这份记录证明该批次的限定接受；旧离线合同仍是 NONE，其他迁移批次仍暂停，不能由本次接受推导全部模块兼容或世界零错误。\n\n## 本地资产只读盘点\n\n运行：\n\n```powershell\nbun run foundry:ops assets inventory --hash-concurrency=4\n```\n\n它会读取已经注册的本地 Foundry Lab 资产，分别生成以下八类 manifest：\n\n- Foundry 程序和 Node 运行时；\n- 模块；\n- 游戏系统；\n- 世界；\n- 备份；\n- 验收、诊断和审计证据；\n- 历史归档；\n- 临时工作区和可重建缓存。\n\n每个普通文件都会记录相对路径、体积、SHA-256、修改时间和文件系统访问时间。访问时间只是 Windows 文件系统提供的尽力信息，可能被延迟或关闭，不能单独证明“最后一次实际使用”。模块、系统和世界还会读取顶层 manifest 中的 ID、版本和公开来源 URL；本地文件 URL 不会写入报告。\n\n报告默认写入忽略目录：\n\n```text\n.local/foundry-v14/inventory/asset-inventory/\u003ctimestamp>/\n```\n\n其中 `summary.md` 是短摘要，`manifest.\u003ccategory>.json` 是分类型实物清单，`duplicates.json` 和 `duplicates.md` 是完整的字节级重复项报告。“理论重复体积”不是删除建议；同一文件出现在 world、backup、evidence 和 archive 中，可能分别承担运行、恢复和审计职责。\n\n扫描器不会跟随符号链接或 Windows junction，也不会扫描凭据目录、认证 cookie 或 Foundry profile 的 `Config`。遇到未授权链接、扫描期间变化或读取失败时，报告会标记为不完整并返回非零退出码。生成报告本身是唯一写入行为；命令不会复制、移动、删除资产，也不会访问生产环境。\n\n## `.local` 全范围登记\n\nStage 5A 的 hash 清单只覆盖已经确认 owner 的 Foundry Lab 资产。要检查仓库里是否又出现未登记的本地目录或文件，运行：\n\n```powershell\nbun run foundry:ops assets scope\n```\n\n该命令只枚举 `.local` 顶层，并把每一项标成：\n\n- `已分类`：已经确认生产者、使用者、可重建性和保留级别；\n- `隐私排除`：知道它是什么，但不会递归读取浏览器 profile、OAuth、cookie、桥接状态或截图内容；\n- `待人工判断`：实物存在，但现有仓库证据不足以证明 owner 或 canonical copy，必须保留并等待单独决定。\n\n报告默认写到 `.local/foundry-v14/inventory/scope-coverage/\u003ctimestamp>/`。其中“范围完整”只表示当前每个顶层条目都已登记；只要仍有“待人工判断”，所有权分类就仍然不是完整状态。无论两者为何值，报告都不构成迁移或删除授权。\n\n## 外置迁移方案（只生成报告）\n\n```powershell\nbun run foundry:ops assets migration-plan\n```\n\n该命令读取最近一份完整资产清单，按“世界与备份 → 证据与归档 → 程序/模组/系统 → 可重建缓存”生成逐批复制、精确对账、旧路径兼容窗口、回滚和恢复抽样方案。没有选定目标目录时，报告会明确停在“等待选择目标”；即使指定了专用空目录，也只会标记“可以申请复制授权”，不会创建目标、复制、切换、移动或删除任何资产。\n\n目标目录以后由用户单独决定：\n\n```powershell\nbun run foundry:ops assets migration-plan --target-lab-root=J:\\fvtt-lab\n```\n\n报告默认写到 `FVTT_OPS_LAB_ROOT/inventory/migration-plans/\u003ctimestamp>/`。目标必须在仓库和当前实验环境之外，不能是磁盘根目录、链接/联接路径或混有其他内容的目录。选择目标不等于授权复制；实际复制、短时 Foundry 验收和旧目录退役分别需要后续授权。\n\n## 生产只读盘点\n\n按照 [ADR-0005](../../docs/decisions/0005-production-read-autonomy-and-write-authorization.md)，代理可以自主执行生产 inventory/acquire 等只读操作，不必先进行一轮对话确认。以下三道机械保险和目标身份核对仍然全部保留；它们用于防止误连或把计划误当执行许可，不能被命令别名或私有 handoff 绕过。\n\n生产只读命令必须同时满足三件事：\n\n1. 命令带 `--apply`，表示不再只是查看计划；\n2. 命令带 `--allow-production-read`，表示本次明确允许连接生产服务器读取；\n3. 主机、数据路径和 SSH 身份文件通过外部环境变量提供。\n\n例如：\n\n```powershell\n$env:FVTT_OPS_PRODUCTION_SSH_TARGET = '你本机 SSH 配置中的别名'\n$env:FVTT_OPS_PRODUCTION_DATA_PATH = '生产 Foundry 数据目录'\n$env:FVTT_OPS_PRODUCTION_SSH_IDENTITY = '本机私钥路径'\nbun run foundry:ops production inventory --apply --allow-production-read\n```\n\n仓库不再保存具体生产主机或生产数据路径。缺少配置时，命令会在建立连接前失败。\n\n如果下一步会安装模块、重启服务、hydrate 世界内容、迁移数据、写 LevelDB 或产生任何其他生产写入，必须在第一项写入发生前停止并向用户取得明确授权。只读盘点的许可不会自动延伸为写入许可。\n\n## 共享 Server Mirror\n\n当前配置的本地 v14 Lab 是 `F:\\FoundryLab\\foundry-v14`，默认复用的数据目录是 `F:\\FoundryLab\\foundry-v14\\data\\server-mirror`。使用前核对 PID、端口、路径和运行者；若其他参与者正在使用，等待或协调释放，不擅自停止，也不复制另一整套 Lab。\n\n- 需要现成角色、场景、物品或合集的人工/玩法语义验收，默认使用持久世界 `cor-cotn`。修改既有文档前记录原值，结束后恢复；临时对象必须可识别并清理。\n- 干净隔离、模块组合、迁移/恢复、故障注入或可能污染世界的测试，使用 `fvtt-v14-module-matrix` 或测试创建的随机临时沙箱。\n- 身份预检、本地模块安装、启停和短时测试无需再次询问；这些本地权限不代表生产授权。\n\n## 本地路径配置\n\n这些变量都是可选的；当前机器通过用户级配置指向 F 盘 Lab。未配置的其他环境仍使用代码定义的兼容默认值，不得据此重建已退役的仓库 `.local/foundry-v14`：\n\n| 环境变量 | 用途 |\n|---|---|\n| `FVTT_OPS_LAB_ROOT` | 本地 Foundry 测试根目录 |\n| `FVTT_OPS_EVIDENCE_ROOT` | 本地证据和报告根目录 |\n| `FVTT_OPS_BACKUP_ROOT` | 本地备份根目录；默认是 `FVTT_OPS_LAB_ROOT/backups` |\n| `FVTT_OPS_FOUNDRY_ZIP` | Foundry 安装包路径 |\n| `FVTT_OPS_WORLD_ID` | 默认世界标识；有精确安全限制的命令仍会校验自己的固定测试世界 |\n| `FVTT_REFERENCE_CACHE_ROOT` | 独立的大型参考资料缓存；默认仍为仓库内 `.local/references`，不会跟随 Foundry Lab 一起迁移 |\n\n所有可写根目录仍经过路径逃逸、符号链接和 Windows junction 检查。配置成磁盘根目录或仓库根目录会被拒绝。\n\n## 旧命令兼容\n\n旧的 `bun run foundry:lab ...` 仍然可用，但 `scripts/foundry-lab/cli.ts` 现在只是一个兼容入口：它先进入 Foundry Ops 权限检查，再执行这里的正式实现。旧的实现文件也只保留简短转发层，避免已有导入路径突然失效。\n\n`src/tools/world-audit`、`src/tools/production-migration` 和三个历史工具入口同样只保留兼容转发。正式测试已经和实现一起迁入本目录。\n\n## 长时间验证边界\n\nFoundry／Chrome 工作沿用根说明，不设固定总时长上限；单操作保留超时，不能用重复短测代替真实长时验收。四小时或其他长时测试只在用户明确要求相应验收时运行；真实会话仍需真实使用证据。工具回归或文件侧收据不能关闭这些门禁。\n"}}</script>
<script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('handbook-data').textContent);
  const main = document.getElementById('main');
  const search = document.getElementById('search');
  const announce = document.getElementById('announcement');
  const categories = {convert:'转换与导入',library:'资料与内容',play:'跑团辅助',maintain:'检查与维护'};
  const descriptions = {convert:'把 Markdown、TXT、PDF 或图片中的资料带进 Foundry。',library:'整理资料、角色图片和可复用的职业与种族内容。',play:'查找安装在 Foundry 里的面板、房规和交互工具。',maintain:'查看性能、检查生成结果，了解环境和开发工具。'};
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const enc = encodeURIComponent;
  const link = (id, text, cls='') => `<a class="${cls}" href="#${id}">${text}</a>`;
  const list = items => `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const reviews = Object.values(data.reviews).map(r=>r.reviewedOn).sort();
  const latest = reviews.at(-1) || '未登记';
  const sourceNames = Object.keys(data.sources);
  let commands = [];
  let searchTimer;
  let theme = 'light';
  try { theme = localStorage.getItem('handbook-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'); } catch {}
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-toggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light':'dark';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('handbook-theme', theme); } catch {}
    announce.textContent = `已切换到${theme === 'dark' ? '深色':'浅色'}主题`;
  });
  const toggle = document.getElementById('menu-toggle');
  toggle.addEventListener('click', () => toggle.setAttribute('aria-expanded', String(document.body.classList.toggle('menu-open'))));
  function navigation(active) {
    document.getElementById('navigation').innerHTML = link('home', '手册概览',active==='home'?'active':'')
      +link('all',`全部工具 <span>${data.entries.length}</span>`,active==='all'?'active':'')
      +Object.entries(categories).map(([id,name])=>link(`category/${id}`,`${name} <span>${data.entries.filter(e=>e.category===id).length}</span>`,active===id?'active':'')).join('');
    document.querySelectorAll('#navigation a.active').forEach(a=>a.setAttribute('aria-current','page'));
  }
  function rows(entries) {
    return `<div class="tool-list">${entries.map(e=>link(`tool/${e.id}`,`<div><h3>${esc(e.title)}</h3><p>${esc(e.summary)}</p></div><span class="row-meta">${categories[e.category]}　→</span>`,'tool-row')).join('')}</div>`;
  }
  function showHome() {
    navigation('home');
    return `<section class="hero"><p class="eyebrow">一本放在手边的工具说明书</p><h1>想做什么，从这里开始。</h1><p class="intro">从整理一只怪物，到准备下一场团。这里收录项目里的转换入口、内容合集、Foundry 模块与维护工具，帮你找到用法和边界。</p>${link('guide','第一次使用？先读这份简短指南 →','guide-link')}</section>
      <div class="task-grid">${Object.entries(categories).map(([id,name])=>link(`category/${id}`,`<strong>${name}<span aria-hidden="true">↗</span></strong><p>${descriptions[id]}</p>`,'task-link')).join('')}</div>
      <div class="section-heading"><h2>常用入口</h2><small>${data.entries.length} 项工具 · ${sourceNames.length} 份离线原始说明</small></div>
      ${rows(['web-workbench','fvtt-json-forge','monster-intake','monster-spell-resolver'].map(id=>data.entries.find(e=>e.id===id)).filter(Boolean))}
      <p class="subtle" style="margin-top:24px">最近内容核对：${esc(latest)}。核对日期表示手册内容审阅时间；功能的实际支持范围见各条目。</p>`;
  }
  function showEntry(e) {
    navigation(e.category);
    return `<article class="article">${link(`category/${e.category}`,`← ${categories[e.category]}`,'back-link')}<h1>${esc(e.title)}</h1><p class="intro">${esc(e.summary)}</p><div class="meta"><span class="tag">${categories[e.category]}</span><span>内容核对 ${esc(data.reviews[e.id]?.reviewedOn || '未登记')}</span><span>${esc(e.id)}</span></div>
      <div class="notice"><strong>什么时候用</strong><p>${esc(e.when)}</p></div>
      <section><h2>开始前准备</h2>${list(e.requires)}</section>
      <section><h2>怎么使用</h2>${e.steps.map((s,i)=>{
        let code = '';
        if(s.command){const index=commands.push(s.command)-1;code=`<div class="code-wrap"><div class="code-top"><span>在项目根目录的 PowerShell 中使用 · 先替换示例路径</span><button class="copy" data-copy="${index}">复制命令</button></div><pre class="command"><code>${esc(s.command)}</code></pre></div>`;}
        return `<div class="step"><span class="step-num" aria-hidden="true">${i+1}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>${code}</div></div>`;
      }).join('')}</section><section><h2>完成后会得到什么</h2>${list(e.outputs)}</section>
      <section class="notice limitations"><h2>适用范围与注意事项</h2>${list(e.limits)}</section>
      <section><h2>继续阅读</h2><p class="subtle">以下原始说明已打包在本文件中，无需联网。</p>${e.sources.map(p=>link(`source/${enc(p)}`,esc(p),'source-link')).join('')}</section></article>`;
  }
  function showGuide() {
    navigation('home');
    return `<article class="article">${link('home','← 手册概览','back-link')}<h1>先选择入口，再准备资料。</h1><p class="intro">这本手册负责解释和导航。实际转换在工作台或命令行运行，跑团模块在 Foundry 中使用。</p>
    <section><h2>我该从哪里开始？</h2><div class="tool-list">
    ${link('tool/web-workbench','<h3>希望用页面上传、转换和下载</h3><p>打开 Web 工作台，按页面提示选择任务与 AI 连接。</p>','tool-row')}
    ${link('tool/fvtt-json-forge','<h3>已经在 Foundry 里，想直接创建内容</h3><p>查看 JSON Forge 的 GM 操作流程和 accepted 条件。</p>','tool-row')}
    ${link('tool/markdown-convert','<h3>已有符合项目格式的 Markdown</h3><p>走正式 CLI 转换；不规则 TXT 则查看 AI Intake。</p>','tool-row')}
    ${link('tool/document-extraction','<h3>手里是 PDF 或怪物截图</h3><p>先用文档提取流程核对页码、阅读顺序和候选怪物。</p>','tool-row')}</div></section>
    <section><h2>看懂几个常见词</h2><ul><li><strong>Actor</strong>：怪物、NPC 或角色数据。</li><li><strong>Item</strong>：物品、法术、特性等条目。</li><li><strong>Intake</strong>：从原始资料中提取带证据的结构，再走正式生成。</li><li><strong>accepted</strong>：这次结果通过对应检查；仍要核对原文。</li><li><strong>needs_review / failed</strong>：需要处理问题，不能作为正式结果导入。</li><li><strong>core / modded</strong>：只使用核心规则，或包含特定第三方模块字段。</li></ul></section>
    <section><h2>版本要明确选择</h2><p>本手册的常规生成示例显式选择 v14/core。CLI 省略版本时仍默认 v12，Web 初始选择为 v14。单独模块的支持版本以它自己的条目为准。</p><p>结构检查通过、安装成功和真实跑团验证是不同层级。不要把单项通过理解成整个模组组合已兼容。</p></section>
    <section><h2>下次如何打开？</h2><p>双击项目根目录的“工具手册.html”，或把它加入浏览器收藏、创建桌面快捷方式。也可以把这个文件单独带走；目录、搜索、命令和已收录原始说明都能离线使用。</p><p>单独复制出去的文件是当时快照。希望随 master 更新，就收藏 master 工作区里的文件。完成本次合并后，它会使用固定路径，不受以后 topic 工作区的位置影响。</p></section></article>`;
  }
  function showUpdates() {
    navigation('home');
    return `<article class="article">${link('home','← 手册概览','back-link')}<h1>手册随功能一起更新。</h1><p class="intro">说明和离线页面与功能一起合并到 master。你打开 master 里的同一个文件，就会读到该版本的内容。</p><section><h2>每次新增或修改功能</h2><ol><li>在功能分支里更新对应工具的用途、步骤、版本和限制。</li><li>对照实际入口和文档核对；新的模块或工具必须登记到目录。</li><li>记录作者核对，重新生成离线页面，并通过同步检查。</li><li>将功能、说明和生成页面一起合并。合并后再次运行检查并打开受影响条目。</li></ol><p>检查能发现来源变化、漏登记和页面不同步；它不能替作者判断文字是否真实，也不代表新功能已通过运行时验收。</p></section>
    ${data.sources['docs/runbooks/handbook-maintenance.md'] ? link('source/'+enc('docs/runbooks/handbook-maintenance.md'),'阅读完整维护流程 →','source-link'):''}
    <section><h2>已登记的内容核对</h2><p class="subtle">以下是作者核对记录，按日期排列；不是软件发布日志或自动测试结论。</p><div class="tool-list">${[...data.entries].sort((a,b)=>(data.reviews[b.id]?.reviewedOn||'').localeCompare(data.reviews[a.id]?.reviewedOn||'')).map(e=>link('tool/'+e.id,`<div><h3>${esc(e.title)}</h3><p>${esc(data.reviews[e.id]?.note || '')}</p></div><span class="row-meta">${esc(data.reviews[e.id]?.reviewedOn || '')}</span>`,'tool-row')).join('')}</div></section></article>`;
  }
  const searchable = data.entries.map(e=>({e,text:JSON.stringify(e).toLocaleLowerCase()+' '+e.sources.map(p=>data.sources[p]).join(' ').toLocaleLowerCase()}));
  function showSearch(query) {
    navigation('all');
    const terms = query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    const found = searchable.filter(x=>terms.every(term=>x.text.includes(term))).map(x=>x.e);
    announce.textContent = `找到 ${found.length} 项工具`;
    return `<h1>搜索结果</h1><p class="subtle">“${esc(query)}” · ${found.length} 项匹配 · 包含工具说明和收录的原始文档</p>${found.length?rows(found):'<div class="empty"><h2>没有找到匹配的工具</h2><p>换一个用途词，例如“怪物”“图片”或“监控”，也可以查看全部工具。</p>'+link('all','查看全部工具 →')+'</div>'}`;
  }
  function route() {
    clearTimeout(searchTimer);
    commands = [];
    let route;
    try { route=decodeURIComponent(location.hash.slice(1)) || 'home'; } catch { route='invalid'; }
    let body, title='概览';
    if(route.startsWith('search/')) {const q=route.slice(7);search.value=q;title='搜索';body=showSearch(q);}
    else {
      search.value='';
      if(route==='home') body=showHome();
      else if(route==='guide') {title='第一次使用';body=showGuide();}
      else if(route==='updates') {title='版本与更新';body=showUpdates();}
      else if(route==='all' || (route.startsWith('category/') && categories[route.slice(9)])) {
        const category=route.slice(9);title=route==='all'?'全部工具':categories[category];navigation(route==='all'?'all':category);
        body=`<h1>${title}</h1><p class="intro">${route==='all'?'按用途浏览项目中的全部工具。点开一项，查看步骤、产物和限制。':descriptions[category]}</p>${rows(data.entries.filter(e=>route==='all'||e.category===category))}`;
      } else if(route.startsWith('tool/') && data.entries.some(e=>e.id===route.slice(5))) {
        const e=data.entries.find(e=>e.id===route.slice(5));title=e.title;body=showEntry(e);
      } else if(route.startsWith('source/') && Object.hasOwn(data.sources,route.slice(7))) {
        const path=route.slice(7);title='原始说明';navigation('all');
        const owners=data.entries.filter(e=>e.sources.includes(path));
        body=`<article>${link('tool/'+owners[0].id,'← '+esc(owners[0].title),'back-link')}<h1>原始说明</h1><p class="subtle">${esc(path)}</p><p class="notice">这是该版本仓库文档的离线原文。旧例子、历史验收和维护命令保留原貌；当前推荐步骤与限制请先看工具条目。文中的路径可在仓库查阅。</p><pre class="source-body">${esc(data.sources[path])}</pre></article>`;
      } else {navigation('home');title='未找到';body=`<h1>这个条目没有收录。</h1><p>它可能已更名，试试上方搜索。</p>${link('all','查看全部工具 →')}`;}
    }
    main.innerHTML=body;document.title=`${title} · 项目工具手册`;document.getElementById('breadcrumb').textContent=`手册 / ${title}`;
    document.body.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false');
    if(!route.startsWith('search/')) {window.scrollTo(0,0);main.focus({preventScroll:true});}
  }
  search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const hash=search.value.trim()?'#search/'+enc(search.value.trim()):'#all';if(location.hash.startsWith('#search/')){history.replaceState(null,'',hash);route();}else location.hash=hash;},160);});
  document.addEventListener('keydown',event=>{
    if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){event.preventDefault();search.focus();}
    if(event.key==='Escape' && document.activeElement===search){search.value='';location.hash='all';}
  });
  main.addEventListener('click',async event=>{
    const button=event.target.closest('button[data-copy]');if(!button)return;
    const command=commands[Number(button.dataset.copy)];if(typeof command!=='string')return;
    try {
      if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
      await navigator.clipboard.writeText(command);button.textContent='已复制';announce.textContent='命令已复制';
    } catch {
      const range=document.createRange();range.selectNodeContents(button.closest('.code-wrap').querySelector('code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
      button.textContent='已选中，请按 Ctrl+C';announce.textContent='浏览器限制自动复制。命令已选中，请按 Ctrl+C。';
    }
  });
  window.addEventListener('hashchange',route);route();
})();
</script>
</body></html>
