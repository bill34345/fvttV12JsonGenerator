权后：\n\n1. 在 topic worktree 按意图 commit。\n2. 获取最新 `master` 状态；若 topic 已落后，在 topic worktree 吸收 `master`、解决冲突并重跑相关验证。\n3. 在主工作区记录基线：\n\n   ```powershell\n   git status --porcelain=v1 -uall\n   git diff --binary\n   git diff --cached --binary\n   git diff --name-only master...\u003ctopic-branch>\n   ```\n\n4. 主索引非空、topic 改动与既有 tracked/untracked 路径重叠，或无法证明 merge 后原基线不变时，停止并报告；不得 stash、自动提交用户改动或在另一 worktree 背后移动 `master` ref。\n5. 安全时在主工作区执行 fast-forward：`git merge --ff-only \u003ctopic-branch>`。若不能 fast-forward，回到 topic worktree 完成受控整合和重验，不在脏主树即兴 merge。\n6. 重新采集主工作区 status/diff/untracked，证明发布前用户基线逐字节保持不变。\n7. `git push origin master` 后比较 `master`、`origin/master` 与预期 commit。\n\n变更用户可执行入口、输入或输出、支持版本、操作步骤或安全限制时，topic 必须包含同步更新的中文工具条目、人工核对记录与生成的根 `工具手册.html`。内部实现、测试或重构先核对这些用户信息并记录结论；既有 watch 在本次必需的手册检查或 CI 中报 stale 时，仍须人工核对受影响条目、更新 review 和页面，不要求改写正确的说明，也不缩小目录覆盖。合并前通过 `bun run handbook:check`；合并后在 master 再次运行同一检查，打开受影响条目核对本次功能。若合并引入新的实现组合，回到 topic 核对并重新生成，不在主工作区即兴修补手册。完整维护步骤见 [手册维护流程](handbook-maintenance.md)。\n\n`\u003ctopic-branch>` 是本任务创建的完整 `codex/\u003ctimestamp>-\u003ctask-slug>` 名称，不得用模糊分支名替代。\n\n## 5. 清理\n\n先建立内容保留证据，再应用清理权限和归属门禁。`git status` clean 只覆盖 Git 工作状态；主线有类似实现只说明后继能力存在，两者均不能证明整棵目录的内容可删。\n\n对精确 worktree 范围分别判断四类内容：\n\n| 内容 | 必要证据 |\n| --- | --- |\n| 已提交内容 | 固定 HEAD、保留仓库／branch 或 tag／目标 commit，核实对象可读及祖先关系。保留分支只证明提交仍在，不等于已经集成或推送。 |\n| tracked dirty | 暂存区与工作区分别列出路径和版本，逐项写处置、可恢复位置并读回原字节；暂存版本不能被工作区新版本替代。删除、冲突、文件模式／链接等差异另保留意图证据，未解决则保持未知。 |\n| untracked | 清点精确文件；需保留的内容逐项读回外部现存位置或可达 Git 文件，不能因未跟踪就判废。 |\n| ignored | 包括 `.local` 中的合同、原始收据、手工产物和输入。需保留的内容同样逐项证明；可重建缓存须明确理由，规则命中本身不是无价值证明。未清点范围保持未知。 |\n\n复用既有资产范围盘点定位所有权，再用[保留请求示例](../templates/worktree-preservation.example.json)核对内容。`entries` 的 kind 为 `index`、`worktree`、`untracked` 或 `ignored`，路径为精确仓库相对文件名；与实时 Git 清单逐项对齐。`retain` 的 recovery 指向删除范围外已经存在的文件，或有固定 branch/tag 与 commit 的 Git 文件；工具读回源和目标 SHA-256。`regenerable` 仅接受未跟踪／ignored 文件及具体理由，这是人工声明，不是工具证明可重建。原件没有可核保留位置时保留原工作树；本项目不为凑证据自动制作副本或备份。\n\n```powershell\nbun run foundry:ops acceptance inspect-preservation --input=\"\u003c保留请求绝对路径>\"\n```\n\n检查直接列出 Git 暂存、工作区、untracked 和 ignored 文件，不保存内容、不执行清理。缺失、失配、未分类、输入 `unknowns` 非空或未集成提交均为 `INCOMPLETE`／退出 2；已读回且声明齐全才是 `EVIDENCE_COMPLETE`／退出 0。删除意图、冲突、链接／子模块和权限／模式变化需单独核对，此最小入口不为它们制造字节 PASS。大目录枚举失败也保留未知。`deletionAuthorized` 始终为 false，本地 ref 不是远端推送证明。检查是时点证据；执行前重核 owner、内容变化与授权。\n\n既有历史取证沿用[退役台账](../reviews/2026-10-02-retirement-and-integration-ledger.md)的口径：50 项原版本尚未完整重建仍为未知，既不写永久丢失，也不写全部恢复；未作库存的 ignored 内容不作 PASS。\n\n只有同时满足以下条件才可清理：已取得针对精确对象的清理授权；topic 已集成并按授权推送；worktree clean；需保留内容有独立读回证据且范围无未知项；路径和分支确为本任务创建；没有其他参与者使用。上述检查结果本身不构成清理授权。满足后才执行下面的既有流程：\n\n```powershell\ngit worktree list --porcelain\ngit -C \u003cworktree-path> status --short --branch\ngit worktree remove \u003cworktree-path>\ngit branch -d \u003ctopic-branch>\ngit worktree prune --dry-run\n```\n\n`\u003cworktree-path>` 是第 2 节得到的精确绝对 `$worktreePath`；`\u003ctopic-branch>` 是同一节得到的 `$branch`。尖括号只是说明占位符，执行前必须换成该任务的真实值。\n\n若 `git worktree remove` 拒绝，停止并报告精确对象和原因；不得强制删除目录、不得改用 `Remove-Item -Force`。\n","docs/species-ai-intake-v14.md":"# Species AI Intake：TXT → Markdown → Foundry V12/V14 race/feat\n\n`--intake-species` 是不规则 TXT 或已人工编辑 Species Markdown 的正式入口。允许的精确目标只有 Foundry `12.331` / dnd5e `4.3.9` / `core` / 2024（`V12 static candidate`），或 Foundry `14.364` / dnd5e `5.3.3` / `core` / 2024（保留既有 V14 运行验收）。V13、legacy/2014、`modded-v12` 和第三方模块兼容均 fail-closed。\n\n## 数据链与状态\n\n```text\nTXT → discovery → Species Evidence IR → deterministic Markdown\n    → parser → target race/feat package → target validator → AI review\n    → accepted ledger → 独立模块 build\n```\n\n一个 TXT 最多发现 50 个互不重叠候选。每个候选单独得到 `accepted`、`needs_review` 或 `failed`；整次运行可为 `succeeded`、`partial`、`needs_review` 或 `failed`。运行包位于 `.local/species-intake-runs/\u003crun-id>/`，保存不可变来源、discovery、逐候选 IR、Markdown、JSON package、确定性报告、AI review、provider audit 和 manifest。\n\nAI 不直接编写正式 JSON。证据范围、完整 coverage、字段范围、mechanic allowlist、Markdown parser、目标 projector、package validator 与 AI cross-review 全部通过后，候选才会推广到：\n\n- V14：`input/species/\u003cidentifier>.md`；V12：`input/species/v12/\u003cidentifier>.md`，两个目标的已接受来源分别保存，避免一次修改使另一个版本的 ledger 失效。\n- V14：`output/species/\u003cidentifier>.json`\n- V12：`output/species/v12/\u003cidentifier>.json`\n- `output/species/accepted-ledger.json`\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为唯一身份，V12 与 V14 可以共存且互不覆盖。schema v1 只解释为 V14/core/2024；读取、验证或 build 不会改写旧 ledger，只有一次新的成功 promotion 才原子升级为 v2。同一目标的 Markdown、package、ledger hash 必须闭合，另一目标的 package 不能冒充证据。\n\n## Markdown 契约\n\nSpecies Markdown 的 frontmatter 使用 `layout: species`、`species-schema: 1`、稳定 identifier、2024 rules、生物类型、体型、移动、感官、私有 homebrew 来源哈希与精确 UTF-16 长度，以及显式 feature/part ID。正文每个特性都有 `species-feature:\u003cid>` 稳定标记；文末的原始资料区按记录长度逐字符保留候选全文，包括首尾空白和 CRLF。\n\n允许的 v1 mechanics 只有：\n\n- `descriptive-passive`\n- `gm-assisted`\n- `external-rule`\n- `hp-per-level`\n- `ac-bonus`\n- `limited-utility`\n\nMarkdown 不允许填写任意 Foundry system path 或任意 Active Effect change。复杂但来源明确的规则可以诚实地以 `gm-assisted` / `external-rule` accepted；必须保留完整规则、触发条件和未自动化边界，不能用空 Utility 冒充实现。\n\nEvidence IR 使用字段级 claim：身份、规则版本、生物类型、体型、移动、感官和每个 feature 都必须有唯一 JSON-pointer path 与精确来源区间。coverage 必须无缝分割候选，并与这些 claim 双向引用；`ignored-with-reason` 必须写明原因。一个笼统的 `/species` claim 不能通过晋升门禁。\n\n## 命令\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nV12 static candidate 使用同一入口：\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 12 `\n  --effect-profile core\n```\n\n`--dry-run` 不调用 provider、不创建 run bundle、不推广正式文件。V13、modded/legacy 和其他 target/profile 会在 provider 调用前失败。\n\n处理精确 target conflict 或恢复 provider 故障：\n\n```powershell\nbun run src/index.ts --resume-species-intake \".local/species-intake-runs/\u003crun-id>\" `\n  --decisions \".local/species-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\ndecision 只能批准精确 `target-conflict:\u003cidentifier>` 的 replace；不能覆盖来源证据、coverage、语义或 unsupported mechanic finding。\n恢复会创建新的 immutable run；新 manifest 和 accepted ledger 同时记录 `resumedFromRunId` 与 decisions 文件 SHA-256，从而能回溯被恢复的旧 run，而不是改写旧证据。\nresume 命令中的版本/profile 必须与原 run 完全一致；目标漂移在 provider 调用前拒绝。\n\naccepted Markdown 可以编辑，但 ledger 保存了当前 Markdown SHA-256。任何字节变化都会使条目 stale，模块 build 立即 fail-closed。编辑后必须再次把该 Markdown 交给 `--intake-species`，重新生成 run、IR、review、JSON 和 ledger revision。\n\n## 累计内容模块\n\n```powershell\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\nbun run build:homebrew-species:v12-candidate\nbun run verify:homebrew-species:v12-candidate\n```\n\n`fvtt-homebrew-species` 是纯内容模块，只有 `species` 和 `features` 两个 Item Compendium。V14 默认输出仍为 `dist/`；V12 static candidate 输出为 `dist/v12-candidate/`，identity 带 `supportStatus: \"static-candidate\"`。build 只读取当前目标的 accepted ledger 条目和 Markdown，重新走 parser/projector/validator，在随机临时根生成两次 LevelDB 与确定性 ZIP，并检查 identity/coverage/UUID 闭合。V12/V14 的 module ID、pack 名、Race/Feature/Effect/Advancement ID 与 Compendium UUID 相同，版本 metadata 和 Activity 形状是允许差异。\n\nV12 candidate 可以在隔离测试中使用显式 `FVTT_OPS_TEST_CLASSIC_LEVEL_ENTRY` 写入并回读 LevelDB；任何未来可安装 V12 build 必须使用真实 `app/12.331/node_modules/classic-level`。本轮没有扩展安装器、创建 V12 Lab、安装模块或运行 Foundry。\n\n现有安装器仍只属于已验收的 V14 路径；V12 candidate 不得调用它。V12 ZIP 构建成功、LevelDB 回读或静态 validator 绿色都不构成 V12 Runtime Pass。\n\n散装 JSON 是模块绑定的审阅/构建输入；race ItemGrant 使用 `Compendium.fvtt-homebrew-species.features.Item.\u003cid>`，因此不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Item 是快照，v1 不提供迁移器。\n\n## 食人魔 v1 自动化边界\n\n- race 原生表达 giant / Ogre、Large、40尺、60尺黑暗视觉和 2024/private-homebrew 来源。\n- 巨武器四条完整保留为 `gm-assisted`；不写武器、不生成 Activity/Effect/flag、不解释“体型不超过你二级”、不判定建筑、不移动 Token、不重复已有推击。\n- 身强力壮的受擒脱困优势仅为描述性被动，不扩大成全局属性优势，也不自动移除 Grappled。\n- 5级附赠动作脱困是 2/LR、每次消费1的 Bonus Action Utility；聊天卡要求按原规则进行相应属性检定，不固定力量/敏捷/技能。\n- 食人魔刚毅使用 transfer ADD `system.attributes.hp.bonuses.level = 3`，即总等级 N 时增加 `3N` 最大生命值。\n- 食人魔笨拙使用 transfer ADD `system.attributes.ac.bonus = -2`；倒地后花费全部速度站起保持 `gm-assisted`。\n- 不添加来源未声明的 ASI、语言、触及、负重、武器熟练、徒手伤害、抗性或大型生物额外收益。\n\n## 当前验收边界\n\nV12 当前只通过静态候选层：锁定 4.3.9 模型的 Race、Size、ItemGrant、Utility Activity、itemUses、lr/sr recoverAll、Race 升级流以及 HP/AC Effect 路径有参考契约；Ogre V12 package 已逐条核对语义；两次 clean candidate build 的树、logical hash、UUID 和 ZIP 可确定重现。当前机器没有 V12 Lab，因此尚未验收 Token 2×2、真实 Add Species UI、1→5 级升级、AC/HP 运行值、次数消耗、Long Rest 或重开读回。只能声明“V12 静态候选支持”，不能声明“V12 可用”或“V12 正式支持”。\n\n自动测试继续使用 fake provider，以保持离线、确定和可重复；正式食人魔另以本机 Codex OAuth provider 完成了真实运行 `species-20260811022558-9a41c4a1`。该 run 的 deterministic report 与 AI review 均为 `accepted`，没有 repair；正式 ledger、Markdown 与 JSON 的来源/内容/logical hash 闭合。模块 build/verify 得到 1 个 race、5 个 feat，ZIP SHA-256 为 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。\n\n本地 `fvtt-v14-module-matrix` disposable world 已在 Foundry `14.364` / dnd5e `5.3.3` 中安装并启用该模块。原生 Add Species 流程确认 giant/Ogre、Large、40尺、60尺黑暗视觉和 AC 10→8；1级 Barbarian 的最大生命值为 12+3=15，5级为 40+15=55；5级附赠动作脱困连续消耗至 0/2，第三次没有生成聊天卡，Long Rest 恢复为 2/2。聊天卡明确要求手动执行原受擒检定，不选择属性/技能、不自动解除状态，并保留身强力壮优势。巨武器与“体型不超过你二级”始终是 DM 现场判断，未生成系统体型测试、武器写入、推击或 Token 移动。\n\n这仍不是无边界的 runtime Pass：本次没有完成精确 2×2 Token 放置、现有武器应用种族前后的字节级比较或 Actor 导出/读回。长期跑团也未验收。\n\n## 2026-08-13 线上 8080 部署记录\n\n- 用户明确授权把该模块安装到线上 `8080` 并重启；本次只操作 `fvtt-production` 的 `8080`，`51020` 的 v14 进程保持运行且未写入。\n- 用户同时明确要求本地和线上不创建备份，也不以在线人数为执行门槛。本次没有创建模块或世界备份；只使用唯一的 ZIP 暂存与构建验证目录，不保留旧模块副本。\n- 远端模块目录 `E:\\Bill\\fvtt_v13\\data\\Data\\modules\\fvtt-homebrew-species` 已落盘 10 个文件、31,577 bytes；manifest 为 `fvtt-homebrew-species` / `1.0.0`，包含 `species` 与 `features` 两个 Item pack。线上 HTTP 可读 `module.json` 与 `data/identity-manifest.json`，logical hash 为 `d9bd6759dc378333f314431e7839d2d3beadd6eb0e6faf9b9a440168f07258fd`，1 race / 5 features。\n- 重启后的精确命令为 `E:\\Bill\\v14\\code\\main.js --port=8080 --dataPath=\"E:\\Bill\\fvtt_v13\\data\" --world=cor-cotn`；最终 `/api/status` 为 active、Foundry `14.364`、dnd5e `5.3.3`、world `cor-cotn`，监听 PID 为 9852。日志记录 `Server started and listening on port 8080`，没有新增该模块错误。\n- 为清除无进程占用的启动锁，删除了 `E:\\Bill\\fvtt_v13\\data\\Config\\options.json.lock`；没有直接编辑世界 LevelDB。\n- 生产模块文件已安装并可由 Foundry 服务提供，但未取得 `Gamemaster` 密码，不能通过 UI 证明 `cor-cotn` 已启用该模块；因此“已安装/服务已恢复”为 Pass，“世界已启用/食人魔已在生产界面可用”保持未验收，不把文件落盘冒充启用。\n- 线上部署使用的 ZIP SHA-256 是 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。master 集成前的 Markdown revision review 只更新 accepted Markdown hash/run 证据，Foundry documents 与 module logical hash 未变；当前本地重建 ZIP SHA-256 为 `77281eac8e0c5e3f7bd6f2ec3d44603da53b9d2eb0845b450bf4721cd9466e11`，本轮合并没有重新部署线上模块。\n## ServerNext 内容目标与运行兼容（2026-10-01）\n\n接续既有 Next 来源链时，Species Intake／resume 和内容构建可显式使用 `--fvtt-version 14.368 --effect-profile core`。这个内容目标仍绑定 dnd5e **6.0.2** 的来源投影、接受记录和 logical hash；它只属于 Species 路径，不扩大 Actor／Item CLI 的版本集合。5.3.3 与 V12 的原有目标、默认值及拒绝门保持。\n\nServerNext 当前系统已升级6.0.5，模块兼容候选可另加 `--dnd5e-runtime-maximum 6.0.5`：\n\n```text\nbun run build:homebrew-species --fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5\nbun run verify:homebrew-species --fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5\n```\n\n运行兼容上限不重标接受来源，不代表已完成6.0.5种族玩法验收；本次模块恢复保留已安装合集数据。入口、记录和当前接受边界见[十模块恢复记录](reviews/2026-10-01-next-605-custom-module-restoration.md)。\n","docs/web-ai-connections.md":"# Web AI connections\n\nThe Web worker supports three explicit AI connection kinds:\n\n1. `site`: the server-owned Intake provider. It is disabled by default and is\n   quota-limited per anonymous session, client IP, and process-wide daily\n   budget.\n2. `user-api-key`: a browser-created BYOK connection. The key is held only in\n   the in-memory session registry, is never written to a job or log, and is\n   cleared when the connection expires or is disconnected.\n3. `local-codex`: a Windows Companion that makes an outbound WebSocket\n   connection and runs the user's already-authenticated official Codex CLI.\n   OAuth credentials never leave the user's machine.\n\n## Public deployment\n\nKeep Bun loopback-only behind an HTTPS reverse proxy. Public mode requires:\n\n```text\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_AUTH_TOKEN=\u003c32+ random characters>\nFVTT_WEB_SESSION_SECRET=\u003c32+ random bytes, kept stable across restarts>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\nThe proxy must forward WebSocket upgrades for\n`/api/ai-companion/connect` and preserve the external HTTPS origin. The\nCompanion endpoint is `wss://\u003cpublic-origin>/api/ai-companion/connect` when\nthe public URL uses HTTPS. Never expose the Bun port directly.\nFor state-changing browser requests, forward `Host`, `X-Forwarded-Host`, and\n`X-Forwarded-Proto`; the server uses those headers only in public mode to\nvalidate the browser `Origin` against the external origin.\n\nThe anonymous browser session uses an HttpOnly, SameSite-Strict cookie. It\nexpires after eight hours idle or 24 hours absolute. Restarting the process\ninvalidates the in-memory session registry.\n\n## Site provider and BYOK\n\nSite AI requires all three limits before the server starts accepting site\nconnections:\n\n```text\nFVTT_WEB_SITE_AI_ENABLED=1\nFVTT_WEB_SITE_AI_SESSION_DAILY_LIMIT=20\nFVTT_WEB_SITE_AI_IP_DAILY_LIMIT=100\nFVTT_WEB_SITE_AI_GLOBAL_DAILY_LIMIT=1000\n```\n\nBYOK accepts `https://api.openai.com/v1` by default. Additional providers must\nbe exact HTTPS origins in `FVTT_WEB_AI_PROVIDER_ALLOWLIST`, for example\n`https://gateway.example.com`; credentials, query strings, fragments,\nredirects, private hosts, and arbitrary URLs are rejected.\n\n## Companion gate and pairing\n\n`web:dev` is loopback-only and enables the Companion endpoint for local\ndevelopment. It builds `dist/web/fvtt-ai-companion.exe` before starting the\nsingle Bun server on `http://127.0.0.1:5173`. Public/VPS deployments keep the\nCompanion hidden and disabled unless the server administrator explicitly sets:\n\n```text\nFVTT_WEB_CODEX_COMPANION_ENABLED=1\n```\n\nOnly current Windows Chrome and Edge are supported. Firefox is intentionally\nout of scope. The authenticated download endpoint is\n`GET /api/ai-companion/download`; it serves only the fixed build artifact and\nnever accepts a user path. If it is missing, build it with\n`bun run web:companion:build`.\n\nFor a local development page at `http://127.0.0.1:5173`, the page can check the\nlocal Companion directly. A remote page must use HTTPS. Its flow is:\n\n1. The user clicks connect, and the page opens a local confirmation window.\n2. That local window displays the exact remote website address and asks for a\n   deliberate approval.\n3. After approval, the local window sends a one-time, five-minute pairing\n   authorization only to the window that opened it, using browser memory. It\n   never appears in a URL, command line, log, job file, or download.\n4. The remote page uses it once to pair. The Companion then tests each selected\n   model before the connection becomes usable.\n\nThe loopback control service binds only `127.0.0.1:43173` and uses control\nprotocol v2. Before local approval it gives a remote website no cross-origin\npermission at all. After approval it returns CORS and local-network permission\nheaders only to that exact HTTPS origin. Pairing is bound to that origin, the\ncurrent Companion instance, and the current server pairing. Disconnect and\nshutdown each require a separate one-use control credential; knowing a public\ninstance ID is never sufficient. Popup blocking, rejection, expiry, a refused\nlocal-network permission, an unsupported browser, or a stopped Companion all\nproduce a user-facing recovery message.\n\nLeaving the model fields blank means the Companion invokes the user's current\nCodex CLI default; it does not inject a fixed model name. A user may specify\nmodels explicitly, but every selected main/review model must pass the real\nno-tool-call gate before the connection is ready. A gate failure never silently\nfalls back to a different model, site AI, BYOK, or a local OAuth bridge.\n\nThe adapter uses an ephemeral temporary directory, a read-only sandbox, and a\nstrict result schema. It disables the current tool features and rejects any\ntool-shaped JSONL event. The packaged Windows Companion uses the user's\nofficial `codex.exe`; it never receives project source or OAuth files. It no\nlonger accepts pairing tokens or pairing flags on the command line: users\ndouble-click the EXE and complete the approval in the page instead.\n\nThe server operator builds the Windows artifact once; end users receive only\nthe resulting executable and do not receive the project checkout or server\nsecrets. The compiled artifact hides the Windows console. It is an unsigned\ndevelopment build, so Windows SmartScreen may still require an explicit user\nconfirmation.\n\n## Job pinning and resume\n\nEvery AI job records only an opaque connection ID and an HMAC session binding.\nThe provider secret is not part of `result.json`, downloads, logs, or error\nresponses. Job polling, downloads, decisions, and resume are restricted to\nthe original anonymous session. Resume resolves the original connection; if\nit is expired, disconnected, or blocked, the job stays `needs_review` or\n`failed` and never silently switches to the site provider.\n","docs/web-deployment.md":"# fvttV12Json Web 部署说明\n\n这个 Web 工作台提供浏览器上传 Markdown/JSON、Bun 后端 workflow、任务进度，以及 JSON、Markdown、records 和 ZIP 下载。它默认是本机工具，不会因为执行 `web:start` 就监听公网接口。\n\n## 安全模式\n\n### 本机模式（默认）\n\n```bash\nbun install\nbun run web:build\nbun run web:start\n```\n\n默认地址是 `http://127.0.0.1:5174`：\n\n- 只绑定 IPv4 回环地址；\n- API 不要求 bearer token；\n- 忽略 `X-Forwarded-For` 和 `X-Real-IP`；\n- 如果把 `FVTT_WEB_HOST` 改为非回环地址却没有设置 `FVTT_WEB_PUBLIC_MODE=1`，进程会拒绝启动。\n\n开发环境可运行 `bun run web:dev`。命令会先构建前端，再由同一个 Bun 服务在\n`http://127.0.0.1:5173` 同时提供页面和 API；开发者只需要打开这一个地址。\n它还会在启动服务前编译 `fvtt-ai-companion.exe`，并在 loopback、本机模式下\n默认启用页面引导的 Codex Companion。显式设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=0` 可以关闭它；构建失败时不会启动旧页面\n或残缺服务。它不是热更新服务器，修改前端后重新运行命令即可生成新的页面资源。\n\n#### 无命令式 Companion 配对\n\n打开 `http://127.0.0.1:5173` 的“AI 连接”面板后，下载并双击\n`fvtt-ai-companion.exe`，选择模型并点击“连接本机 Companion”即可完成配对；用户不需要\n打开 PowerShell、复制启动命令或查看配对 Token。留空模型时使用这台电脑当前 Codex CLI\n默认模型；填写模型时，主模型和审查模型都会在连接前各自经过“不允许调用工具”的实际检查。\n\nCompanion 的 `127.0.0.1:43173` 只用于本机控制（health、pair、disconnect、shutdown），\n不是第二个 Web 地址，也不接受局域网连接。它只绑定 `127.0.0.1`，使用 control protocol\nv2。本机开发页只能来自精确的 `http://127.0.0.1:5173`。公开网页必须是 HTTPS：用户点击\n连接后会打开本机确认页，确认页显示精确的网站地址；只有用户点允许后，该网站才会在五分钟\n内拿到一次性配对授权。授权只保留在内存，不能写入 URL、命令行、日志或下载文件；配对、\n断开和关闭也都需要各自的一次性控制凭据。浏览器拒绝本地网络访问、弹窗被拦截、用户拒绝、\n授权过期或 Companion 退出时，页面会显示下一步处理方法。\n\n仅支持最新版 Windows Chrome 和 Edge；Firefox 不在本次支持范围。开发 EXE 使用隐藏控制台\n编译，未签名且可能触发 Windows SmartScreen；页面会显示构建产物 SHA-256，便于本机核对。\n生产 `web:start` 默认不启用 Companion；服务器管理员明确设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=1` 后，公开网页才会显示并允许使用它。\n\n### 公开/反向代理模式（显式开启）\n\n公开模式必须同时设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\n```\n\n该 token 是服务器之间的凭据，不是给浏览器页面填写的登录密码。推荐部署方式是：\n\n1. Bun 仍绑定 `127.0.0.1`；\n2. Nginx、Caddy、Cloudflare Access 或同类入口先验证真实用户；\n3. 反向代理在转发到 Bun 时注入 `Authorization: Bearer \u003cFVTT_WEB_AUTH_TOKEN>`；\n4. 浏览器永远不能读取或提交 VPS 的翻译 key、爬站 cookie、密码或这个 bearer token。\n\n如确实要直接监听网络接口，还必须显式设置 `FVTT_WEB_HOST=0.0.0.0`（或指定地址）。静态页面可以被读取，但所有 `/api/*` 请求仍必须携带正确 bearer token；不建议把这种直接绑定当作完整用户身份系统。\n\n## 环境变量\n\n部署与鉴权：\n\n- `FVTT_WEB_HOST`：监听地址，默认 `127.0.0.1`。\n- `FVTT_WEB_API_PORT`：端口，默认 `5174`。\n- `FVTT_WEB_CODEX_COMPANION_ENABLED=1`：显式启用本机 Codex Companion；`web:dev`\n  在非公开 loopback 模式下默认设置为 `1`，生产/VPS 启动默认关闭。\n- `FVTT_WEB_PUBLIC_MODE=1`：启用公开/代理模式；没有它时非回环绑定会失败。\n- `FVTT_WEB_AUTH_TOKEN`：公开模式必填，至少 32 个字符；不要提交到 Git、浏览器或日志。\n- `FVTT_WEB_TRUSTED_PROXIES`：允许提供客户端转发链的代理字面 IP，逗号分隔，例如 `127.0.0.1,10.0.0.2`。不支持主机名或隐式“信任全部”。\n\n资源边界（默认值）：\n\n- `FVTT_WEB_SHORT_REQUEST_LIMIT=10`：每客户端每分钟非 GET 请求数。\n- `FVTT_WEB_GLOBAL_SHORT_REQUEST_LIMIT=100`：所有客户端合计每分钟非 GET 请求数。\n- `FVTT_WEB_LONG_JOBS_PER_CLIENT=1`：每客户端同时运行的长任务数。\n- `FVTT_WEB_GLOBAL_LONG_JOBS=4`：整个进程同时运行的长任务数。\n- `FVTT_WEB_JOB_RETENTION_HOURS=24`：终态任务产物保留小时数。\n- `FVTT_WEB_MAX_RETAINED_JOBS=100`：未过期终态任务的最大保留数量；超过时最旧优先清理。\n\n工作流能力：\n\n- `FVTT_WEB_ENABLE_PATH_MODE=1`：允许读取服务器 workspace 路径和运行 `vault-sync`。公开部署通常不要开启。\n- `MONSTER_INTAKE_AUTH_MODE`：`api-key` 或 `codex-oauth`，默认 `api-key`。\n- `MONSTER_INTAKE_API_KEY`：API Key 模式的 AI 怪物资料整理专用 provider key；只保留在服务端。\n- `MONSTER_INTAKE_BASE_URL`：API Key 模式的 OpenAI-compatible API 根地址，例如 `https://api.openai.com/v1`。\n- `MONSTER_INTAKE_CODEX_OAUTH_BASE_URL`：Codex OAuth 本机兼容桥地址，默认 `http://127.0.0.1:8787/v1`；必须是 loopback 地址。\n- `MONSTER_INTAKE_CODEX_OAUTH_BRIDGE_TOKEN`：可选的本机桥 bearer token；默认是非秘密占位值，OAuth 凭据不放在这里。\n- `MONSTER_INTAKE_MODEL`：discovery、extraction 和 repair 使用的模型；Codex OAuth 兼容桥模式未填写时默认 `gpt-5.6-luna`。这不是 Companion 的模型设置：Companion 留空时使用用户本机 Codex CLI 当前默认模型。\n- `MONSTER_INTAKE_CODEX_OAUTH_REASONING_EFFORT`：Codex OAuth 推理强度；默认 `xhigh`，对应 Codex 界面里的 `ultra`，也接受填写 `ultra` 并自动归一化。\n- `MONSTER_INTAKE_REVIEW_MODEL`：独立 review 模型；未设置时使用 `MONSTER_INTAKE_MODEL`。\n- `MONSTER_INTAKE_TIMEOUT_MS`：普通 Intake 阶段超时；API Key 模式默认 `60000` 毫秒，Codex OAuth 模式默认 `300000` 毫秒。\n- `MONSTER_INTAKE_REPAIR_TIMEOUT_MS`：Intake 证据修复阶段的单独超时，默认至少 `180000` 毫秒；可设为 `1000` 到 `600000` 之间的整数。\n- `TRANSLATION_API_KEY` 或 `OPENAI_API_KEY`：服务器端翻译/AI normalize 凭据。\n- `GODDESSFANTASY_COOKIE`：服务器端 Goddess Fantasy crawl cookie。\n- `GODDESSFANTASY_USERNAME` / `GODDESSFANTASY_PASSWORD`：服务器端爬站登录凭据。\n- `FVTT_WEB_EXPOSE_ERRORS=1`：返回内部错误详情，仅限本机调试；公开部署不要开启。\n\n可选图片上传默认完全关闭，不再内置任何真实服务器地址。启用时必须在服务端同时配置：\n\n- `FVTT_WEB_IMAGE_SSH_TARGET`：SSH 目标，例如 `operator@assets.example.invalid`；\n- `FVTT_WEB_IMAGE_REMOTE_ROOT`：远端图片根目录；\n- `FVTT_WEB_IMAGE_PUBLIC_BASE_URL`：生成 JSON 使用的公开图片 URL 前缀；\n- `FVTT_WEB_IMAGE_TOKEN_FRAME`：可选 Token 边框文件，默认使用仓库内的小型边框资源；\n- `FVTT_WEB_IMAGE_ALLOW_HTTP=1`：仅在明确接受明文 HTTP 风险时设置；默认只接受 HTTPS；\n- `FVTT_WEB_IMAGE_ACTOR_DIR`、`FVTT_WEB_IMAGE_TOKEN_DIR`、`FVTT_WEB_IMAGE_TOKEN_SIZE`：可选目录名和尺寸调整。\n\n缺少 SSH 目标、远端根、公开 URL 或 Token 边框中的任一项时，图片能力保持“未配置”，Actor JSON 仍可生成，但不会把本机默认值或真实生产目标偷偷带入任务。\n\n浏览器只能看到“某项能力是否已配置”，不能取得上述凭据值。\n\nAI 怪物资料整理只读取专用的 `MONSTER_INTAKE_*` 变量，不会回退到翻译或通用 OpenAI 变量。`codex-oauth` 只适用于本机或受信任的 loopback 兼容桥，不应把它作为公开 Web 服务的远程认证方式。粘贴或上传的 TXT/MD 原文会发送给该 provider，因此公开部署必须在用户提交前明确告知这一点，并按 provider 的数据政策处理。服务端审计只记录 provider、model、prompt version、耗时、调用计数和错误码，不记录 key、请求头或隐藏推理。\n\n单次 Intake 最多 200,000 个 JavaScript UTF-16 字符、50 只怪物；长文本按 24,000 字符分块并保留 1,000 字符重叠，逐怪物 extraction 并发为 2。每只怪物最多 1 次 extraction、1 次独立 review 和 1 次 semantic repair；各阶段可对 timeout、429 或网络错误重试一次。模型不能自行增加循环或调用工具。`needs_review` 任务可下载 source、IR、候选 Markdown 和报告，但 Web 不会把候选 Actor JSON 注册为正式下载；只有 accepted 才注册 Actor JSON/ZIP。\n\n## 固定资源保护\n\n- Bun 在读取请求体前实施 25 MiB HTTP body 上限；有 `Content-Length` 时，API 还会在调用 `request.text()` 前拒绝超限或畸形长度。\n- 单文件内容上限是 5 MiB；合集/JSON 内容上限是 20 MiB。\n- 客户端身份来自真实 socket。只有直接 socket 对端在 `FVTT_WEB_TRUSTED_PROXIES` 内，才会从右向左解析转发链；伪造或畸形链不会创建新限流身份。\n- 每客户端和全局请求/长任务上限同时生效，不能仅靠更换转发头绕过。\n- 当前进程真正 queued/running 的任务不会被清理；过期终态任务先清理，数量仍超限时再最旧优先清理。\n- 500 错误默认隐藏内部详情。下载接口仍只服务任务登记过的文件。\n\n这些是纵深防御，不代替公开入口的真实用户鉴权、TLS、防火墙和操作系统资源限制。\n\n## Nginx 示例\n\n下面的 Basic Auth 验证浏览器用户；`Authorization` 在代理到 Bun 时被替换为服务器端 bearer。把 token 放入仅 root 可读的 Nginx 配置片段，不要写进公开仓库。\n\n```nginx\nserver {\n  listen 443 ssl;\n  server_name example.com;\n\n  client_max_body_size 25m;\n\n  location / {\n    auth_basic \"fvtt workbench\";\n    auth_basic_user_file /etc/nginx/fvtt.htpasswd;\n\n    proxy_pass http://127.0.0.1:5174;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    proxy_set_header Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\";\n  }\n}\n```\n\nBun 侧至少设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n如果 Nginx 与 Bun 不在同一网络命名空间，`FVTT_WEB_TRUSTED_PROXIES` 应填写 Bun 实际看到的直接代理 IP，而不是盲填公网客户端 IP。\n\n## Caddy 示例\n\n```caddyfile\nexample.com {\n  request_body {\n    max_size 25MB\n  }\n\n  basic_auth {\n    operator REPLACE_WITH_CADDY_PASSWORD_HASH\n  }\n\n  reverse_proxy 127.0.0.1:5174 {\n    header_up Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\"\n    header_up X-Real-IP {remote_host}\n  }\n}\n```\n\n同样设置 `FVTT_WEB_PUBLIC_MODE=1`、同一个 `FVTT_WEB_AUTH_TOKEN`，并将 Caddy 的直接 socket IP 加入 `FVTT_WEB_TRUSTED_PROXIES`。\n\n## systemd 示例\n\n把 secret 放在权限受限的 `/etc/fvtt-web.env`，而不是直接写进 unit 或仓库：\n\n```ini\n[Unit]\nDescription=fvttV12Json Web\nAfter=network.target\n\n[Service]\nWorkingDirectory=/opt/fvttV12Json\nExecStart=/usr/local/bin/bun run web:start\nRestart=always\nEnvironmentFile=/etc/fvtt-web.env\n\n[Install]\nWantedBy=multi-user.target\n```\n\n`/etc/fvtt-web.env` 示例：\n\n```bash\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_API_PORT=5174\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n## 产物目录\n\n所有 Web 任务写入：\n\n```text\ntemp/web/jobs/\u003cjobId>/\n  input/\n  output/\n  result.json\n```\n\n下载接口只允许下载任务登记过的产物。ZIP 下载会把成功产物打包为使用 UTF-8 文件名的 ZIP；清理策略按上文的年龄和数量边界执行。\n","foundry-modules/chat-memory-guard/README.zh-CN.md":"# Chat Memory Guard / 聊天内存保护\n\n这是一个拥有独立 manifest、版本、构建、测试、安装保护和验收边界的 Foundry module release unit。\n它不依赖本仓库的 Actor generator、AI Intake、workflow、crawler 或其他 Foundry module 私有实现。\n\n## 支持范围\n\n- ServerNext manifest 兼容范围：Foundry VTT 14.368 / dnd5e 6.0.2–6.0.5（`verified` 保持 6.0.2）\n- 原 Server Mirror 1.0.0：Foundry VTT 14.364 / dnd5e 5.3.3，仅作历史对照\n- 模块 ID：`chat-memory-guard`\n- 当前候选：`1.1.0`；6.0.2 上的安装、启用、重载与代表性 DOM 上限证据保留；6.0.5 的启用、重载和运行时读回待本次恢复验收。世界聊天记录保留、滚动阅读暂停及头像路径仍待补证\n\n模块只裁剪当前浏览器已经渲染的聊天卡片。它调用 Foundry 公开的\n`ChatLog.deleteMessage()`，不会调用 `ChatMessage.delete()`，不会修改世界中的聊天数据库记录，\n也不会修改 Foundry、dnd5e、MIDI-QOL 或其他模块源码。\n\n6.0.2 与 6.0.5 锁定 dnd5e 源码都在 `module/documents/chat-message.mjs` 中以相同签名触发\n`dnd5e.renderChatMessage`；本次只扩展 manifest 上限，原 hook 与消息处理逻辑保持不变。\n\n## 独立构建与测试\n\n在本 workspace clone 中，先从仓库根目录安装锁定依赖，再进入本目录运行独立门禁：\n\n```powershell\nbun install --frozen-lockfile\ncd foundry-modules/chat-memory-guard\nbun run typecheck\nbun test\nbun run build\n```\n\n未来从过滤后的独立仓库 clone 构建时，由该仓库自己的 `bun.lock` 提供 frozen install；本次\nworkspace 迁移不把主仓库 lockfile 复制成第二份权威文件。\n\n构建输出：\n\n- `dist/module/`：可直接安装的 module 目录；\n- `dist/chat-memory-guard.zip`：独立发布包。\n\n在主 workspace 根目录仍可使用兼容命令：\n\n```powershell\nbun run test:chat-memory-guard\nbun run build:chat-memory-guard\n```\n\n旧 `install:chat-memory-guard` 只指向本地 Server Mirror，且包含与当前无备份规则冲突的历史替换逻辑；`1.1.0` 构建在任何写入前会被此入口拒绝。ServerNext 只按迁移交接的离线定点安装流程处理，不创建备份，不运行旧安装入口。\n\n## 设置\n\n在“游戏设置 → 模块设置 → 聊天内存保护”中打开设置窗口：\n\n- GM 世界默认值：供整个世界使用。\n- 本浏览器个人覆盖：每位玩家可以跟随世界设置，或只覆盖自己的客户端。\n- 默认保留 40 条已渲染消息。\n- 默认优先 Token 图，并生成最长边 128px、质量 75 的会话级 WebP 缩略图。\n\n设置保存后立即重新渲染当前卡片并应用。缩略图只存在于当前页面会话，刷新或关闭页面后释放。\n\n## 诊断\n\n在浏览器控制台运行：\n\n```js\ngame.modules.get(\"chat-memory-guard\").api.getStats()\n```\n\n结果只包含渲染数量、裁剪数量、pending 删除数量、缩略图缓存数量/估算字节、失败数、模块监听器\n数量和当前有效设置，不包含消息正文。\n\n## 已知边界\n\n- dnd5e 在 Core `renderChatMessageHTML` 之后才创建头像。本模块在\n  `dnd5e.renderChatMessage` 阶段、卡片插入聊天 DOM 之前尽量替换头像，但不声称能够阻止浏览器\n  发起首次原图请求。\n- 自动化和短时 A/B 运行时证据不能证明长时间跑团内存永不增长。\n- 完整第三方聊天卡矩阵和少见动画头像仍需在真实跑团中持续抽查。\n- 精确目标源码已核对 `ChatLog.deleteMessage()`、聊天 DOM、Core 与 dnd5e 渲染 Hook；这些静态依据不代替下面分项记录的真实客户端验收。\n- ServerNext 的独立 Chrome 批次已核对模块正常启用、重载保持、临时客户端上限20下的聊天 DOM 25→20及新消息21→20；临时客户端设置已恢复。世界 ChatMessage 存储计数、滚动阅读暂停、头像缩略图/失败回退与 `getStats()` 未取得充分证据，因此仍是部分验收。\n- workspace 物理迁移不会升级历史运行时验收结论；旧目标的真实运行时证据仍以\n  `docs/acceptance/chat-memory-guard-runtime-report.zh-CN.md` 为准。\n","foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md":"# Babele RollTable `@Embed` 翻译兼容模块\n\n这个模块修复 Foundry v14 渲染下面这种内容时的运行时缺口：\n\n```text\n@Embed[Compendium.dnd-players-handbook.tables.RollTable.phbWildMagicSurg rollable caption=false classes=\"wild-magic-surge\"]\n```\n\nBabele 可以把随机表标题翻译成中文，但 Foundry 原生的 `_buildEmbedHTML` 直接从当前 `results` 集合取英文行。模块只在这个渲染入口读取 Babele 的临时翻译结果，按 `_id` 优先、`range` 回退重新填充显示内容；文档型结果继续使用原始 `documentUuid` 生成 content-link。当前世界语言为 `zh-CN`、译包注册语言为 `cn` 时，模块只对嵌入表格按需读取 Babele 的 `cn` 翻译会话，不更改世界语言或 Babele 的全局翻译状态。\n\n它不会修改随机表、角色、特性、Item、Journal 或世界设置。翻译源仍然由现有的 `dnd-simplified-chinese-babele-patch` 提供。\n\n## ServerNext 0.2.1 历史验证与当前范围\n\n当前 manifest 兼容范围为 Foundry 14.368、dnd5e 6.0.2–6.0.5（`verified` 保持 6.0.2）、Babele 2.9.1 与 libWrapper 1.13.5.1。旧 0.1.0 只在 Server Mirror 的 14.364 / 5.3.3 通过，不能作为 Next 已验收证据。运行时代码仍只包装同一个表格嵌入入口；6.0.2 与 6.0.5 锁定源码中的 dnd5e chat/result API 没有目标变更，14.368 本机源码保留表格嵌入方法、两列表格和结果行结构，Babele 2.9.1 提供只读的按语言会话 API。Next 的实际 UI 曾在 6.0.2 显示 25 行狂野魔法浪涌中文结果、5 行困惑术结果，以及“基本方位”原 UUID 的 content-link；6.0.5 的启用与代表 UI 读回应在恢复后重做，其它表仍需按实际用途核对。\n\n构建和局部检查：\n\n```text\nbun run build:fvtt-babele-rolltable-embed-translation\nbun run test:fvtt-babele-rolltable-embed-translation\n```\n\n旧的 `install:fvtt-babele-rolltable-embed-translation` / `verify-install:fvtt-babele-rolltable-embed-translation` 仍是 Mirror 专用入口，不能用于 Next。Next 的定点更新从本工作树 `dist/module` 取包，先正常关闭原世界，核服务、世界锁及任务已安装的旧文件哈希，再更新 `server-next/Data/modules/fvtt-babele-rolltable-embed-translation` 的两个文件并逐文件核哈希；不创建备份或直接改世界数据库。\n\n重启并正常进入本地 ServerNext 后，在实际 UI 中检查：\n\n- 狂野魔法浪涌：25 行范围和 25 行中文结果，骰子按钮仍可用；\n- 困惑术行为：5 个结果全部存在，文档型的“基本方位”仍为原 UUID 的 content-link；\n- 重复打开/渲染不改变源表，也不写入世界文档。\n","foundry-modules/fvtt-battlefield-painter/README.zh-CN.md":"# Battlefield Painter P2 Alpha · `0.3.0-alpha.2`\n\n这是一个自用的 Foundry VTT v14 战场地形画笔原型。它不复制 Tile Arsenal 的代码、配置或素材，只实现相近的高层工作流：GM 从工具盘选择地形、在地图上涂抹，并由模组创建一组可以追踪和回滚的场景文档。\n\n当前版本是 P2 alpha：浏览器 bundle 已在模拟 Foundry 全局环境中完成加载、生命周期注册、ApplicationV2 打开和版本/权限门禁测试。Frost B14 的薄冰/寒气视觉已获用户认可，Fire B13 的完整真实 Canvas 验收仍保持独立未完成；其他运行时结论以各 micro-batch 记录为准，不能由静态测试一并推定。新版本不再生成或创建 Battlefield Painter 音频；旧版本残留 AmbientSound 只能由 GM 显式清理。\n\n`0.3.0-alpha.2` 允许三组精确运行配对：原 Foundry `14.364` / dnd5e `5.3.3`，历史 ServerNext `14.368` / `6.0.2`，以及 `14.368` / `6.0.5`。manifest 的 `verified` 仍保留旧版本，运行时拒绝交叉配对和未列明版本。2026-09-24 的真实 Canvas 定点验收针对 `14.368` / `6.0.2`，通过方格 Fire 笔画→原生 Region 移动消耗/光源→重载视觉→自有对象清理。2026-10-01 在 `6.0.5` 独立修正行列坐标与视频加载后，原两格 Square Fire I 的可见动画、Region／light、正常GM重载及精确清理通过；六角格、其它地形／阶段、模块Undo与玩家权限未扩大验收，见[本轮限定恢复](../../docs/reviews/2026-10-01-next-605-custom-module-restoration.md)与[历史候选记录](docs/server-next-candidate.md)。\n\n## 当前范围\n\n- 火焰、冰霜、荆棘三种配置。\n- 每种配置保留两个逻辑阶段，并共享 1 张原创透明 P0 WebP；当前共 3 张基础图。旧场景兼容循环仍保留为每种地形 1 个 WebM。\n- P0 与未带 marker 的旧场景由 Tile 媒体、透明度、Tint、火焰光源和成熟荆棘 Wall 表达阶段；P2 Square Fire/Frost 另有独立视觉层。\n- Foundry 原生 Tile 负责静态地表或逻辑占位；P2 Fire 与 Frost 分别由模块自管的世界空间 renderer 绘制，均位于 Token 下方。\n- Foundry 原生 Region `modifyMovementCost` 行为负责移动消耗。\n- 火焰创建原生 AmbientLight，使用 `torch` 动画；P2 对长笔画使用最多 16 格一组的确定性聚类光源。\n- P2 新建火焰 Tile 以 `alpha=0` 的 `fire.webp` 作为逻辑/兼容纹理并写入 `visualEffect: \"fire-field-v1\"`；运行时火场不采样、不移动 `fire.webp`，也不请求 `fire.webm`，而是共享 `fire-stage-i.webm`（Stage I）和 `fire-stage-ii.webm`（Stage II）。\n- P2 新建 Square Frost Tile 使用 `frost-film-v1.webp` 并写入 `visualEffect: \"frost-field-v1\"`；Stage I 只显示薄冰膜，Stage II 额外使用共享的 `frost-mist-v1.webm` 寒气场，不请求旧 `frost.webm`。Hex Frost 与无 marker 旧场景保持兼容路径。\n- Brambles 仍使用当前 `brambles.webp` / `brambles.webm` Tile 路径；独立荆棘视觉效果属于下一阶段。\n- 不再创建新的 AmbientSound；审计仍识别旧版本模块所有声音，并提供 GM 专用的指纹确认清理入口。旧声音清理不可撤销，也不会被 undo/redo 恢复。\n- 新包不再携带 OGG；旧场景中的模块所有 `AmbientSound` 可能请求缺失资源（404）。GM 看到旧声音警告后，应先打开 Painter，通过显式确认入口清理；模块不会自动迁移或删除旧场景数据。\n- 成熟荆棘在地形外边界创建 Wall。\n- 绘制、擦除、阶段切换支持方格和六角格；几何来自 `canvas.grid`，不自行猜测六角格坐标。\n- 所有文档带 `flags.fvtt-battlefield-painter` 所有权信息；批次创建失败时自动回滚。\n- P1 增加 0–4 格笔刷半径、自由/直线/填充三种几何、画布光标预览，以及只恢复本模组文档的撤销/重做。\n- “直线”委托当前 Foundry Grid 的 `getDirectPath`；半径委托 `getAdjacentOffsets`，避免自行假设方格或六角格邻接。\n- “填充”是拖拽起点与终点之间的 offset 区域填充，不是依赖地图像素颜色的洪水填充。\n- P2 提供 GM 专用的本场景地形清除预览，只统计模块所有文档，并在确认前重新核对文档 ID 指纹。\n- 方格 Tile 仅在 Foundry 已明确识别为方格时做 8% 的视觉尺寸扩展（每侧约 4%）；Region、Wall、cellKey、offset 和所有权边界仍使用原始方格几何。六角格和未识别网格不自动套用该视觉扩展。\n\n当前暂不包含 12 色变体、跨客户端并发锁、伤害自动结算和第三方自动化模组集成。Fire、Frost 和后续 Brambles 的视觉/运行时验收分别记录，不互相替代。\n\n## 使用\n\n1. 以 GM 身份打开一个已激活的场景。\n2. 在 Tiles 场景控制组点击火焰图标，打开“战场地形画笔”。\n3. 选择地形、阶段和模式，点击“启用画笔”。\n4. 在地图上按住左键拖动；松开时一次性创建该笔画。\n5. “擦除”只作用于本模组拥有的地形；擦除一部分笔画时会安全重建剩余部分。\n6. “切换阶段”会升级或循环命中的完整笔画批次。\n\n控制台可用 API：\n\n```js\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditScene()\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditEffects()\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditFrostEffects()\n```\n\n`auditEffects()` 与 `auditFrostEffects()` 分别只读返回 Fire/Frost 的 mesh、格位、顶点、三角形、ticker、媒体、重建次数和最近错误。API 同时公开 `compatibility` 与 `canMutate`。仅当版本精确为 Foundry `14.364` / dnd5e `5.3.3`，或 Foundry `14.368` / dnd5e `6.0.2`、`6.0.5`，且当前用户是 GM 时，才暴露 `open`、`activate` 和 `deactivate`；其他环境只保留诊断能力。\n\nAlpha 还提供仅供开发、测试和修复使用的内部阶段开关：\n\n```js\nconst api = game.modules.get(\"fvtt-battlefield-painter\").api\napi.developmentPhases()\napi.setDevelopmentPhase(\"p1\", false) // 关闭 P1，回退为 P0 单格自由画笔\napi.setDevelopmentPhase(\"p1\", true)\napi.setDevelopmentPhase(\"p2\", false) // 关闭动态素材和聚类光源\napi.setDevelopmentPhase(\"p2\", true)\n```\n\n正式版发布前必须把 `DEVELOPMENT_PHASE_CONTROLS_MUTABLE` 改为 `false`，确认运行时不再暴露 `setDevelopmentPhase`，并重新跑完整门禁。\n\n## 开发与构建\n\n```powershell\nbun run test:coverage\nbun run typecheck\nbun run build\n# 仅在明确需要重新生成媒体时运行；普通构建不会重新生成资产\nbun run generate:media\nbun run generate:frost-field\n```\n\n构建产物为 `dist/module/` 和 `dist/fvtt-battlefield-painter.zip`。静态构建成功不等于 Foundry 真实语义通过。\n\n本地 Lab 安装入口：\n\n```powershell\nbun run install:local\nbun run install:local -- --apply\nbun run verify-install\n```\n\n安装脚本只接受仓库批准的 `F:\\FoundryLab\\foundry-v14`，会先构建、核对精确目标、使用暂存目录并逐文件哈希验证。目标模组目录必须不存在；如果已有任何文件或目录，安装会停止且不会替换、移动或创建旧副本。它不触碰生产环境。\n\n## 文档索引\n\n- [设计与实现决定](docs/architecture.md)\n- [外部调研与版本边界](docs/research-notes.md)\n- [P0 真实验收清单](docs/acceptance-checklist.md)\n- [原创素材来源与完整提示词](docs/asset-provenance.md)\n- [后续路线](docs/roadmap.md)\n- [0.3.0-alpha.1 发布说明（历史）](docs/alpha-release-notes.md)\n- [ServerNext 静态兼容候选与待验收项](docs/server-next-candidate.md)\n- [P1 开发 checkpoint 与异机验收交接](docs/p1-development-checkpoint.md)\n- [P2 执行计划](docs/p2-execution-plan.md)\n- [B13 连续火焰场视觉验收](docs/runtime-acceptance-micro-batches/B13-art-style-square.md)\n- [B14 薄冰膜与寒气场视觉验收](docs/runtime-acceptance-micro-batches/B14-frost-field-square.md)\n","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md":"# Exact Foundry 14.364 Acceptance Checklist\n\nStatic checks and build output do not satisfy this checklist. Run these in the approved local Lab with Foundry `14.364` and dnd5e `5.3.3`, using a disposable test Scene. Record screenshots, console errors, document counts from `api.auditScene()`, and any recovery action.\n\n## Environment identity\n\n- [ ] Confirm executable/build reports Foundry `14.364`.\n- [ ] Confirm world reports dnd5e `5.3.3`.\n- [ ] Confirm destination is under `F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\modules\\fvtt-battlefield-painter`.\n- [ ] Confirm module `0.3.0-alpha.1` appears and enables without manifest warning.\n- [ ] Confirm no browser console error during `init`, `ready`, Scene load, or canvas teardown.\n\n## Square grid\n\n- [ ] Open the Tiles control group; confirm the GM-only painter button appears.\n- [ ] Open ApplicationV2 panel; confirm the three terrain previews, Chinese labels, stage controls, and active states render.\n- [ ] Confirm free/line/fill controls, radius 0–4, and undo/redo disabled states render correctly.\n- [ ] Move the pointer without painting; confirm preview follows cells, respects radius, and disappears on canvas leave/deactivation.\n- [ ] Paint radius 0 and 4 strokes; verify no duplicate owned cell is created.\n- [ ] Drag a line in both directions; verify the preview and committed cells match core direct-path behavior.\n- [ ] Drag fill in all four endpoint directions; verify the inclusive offset area matches the preview.\n- [ ] Paint connected and disconnected cells for each terrain/stage.\n- [ ] Confirm Tiles exactly cover their grid cells and preserve transparent edges.\n- [ ] Move a token through every Region; verify measured cost is ×2 for supported movement actions.\n- [ ] Confirm stage-I and stage-II fire create the intended native light and torch animation.\n- [ ] Confirm only stage-II brambles block movement; sight/light/sound remain unblocked.\n- [ ] Erase one cell from the middle of a multi-cell stroke; verify the remainder survives and Region/Wall geometry is rebuilt.\n- [ ] Target one cell with stage-switch; verify the complete original stroke cycles stage.\n- [ ] Paint over an owned cell; verify it is skipped instead of duplicated.\n- [ ] Deactivate the painter; verify normal Foundry canvas controls resume.\n- [ ] Undo and redo paint, erase, and stage-switch; verify foreign documents remain unchanged.\n- [ ] Undo, then make a new edit; verify redo is cleared.\n\n## Hex grid\n\n- [ ] Repeat all three terrain paints on a hex-row Scene.\n- [ ] Repeat all three terrain paints on a hex-column Scene.\n- [ ] Confirm Tile bounds do not displace the artwork relative to cell centers.\n- [ ] Confirm Region polygons match all six vertices.\n- [ ] Confirm adjacent bramble cells remove their shared Wall edge.\n- [ ] Confirm erase and stage-switch reconstruct the same hex offsets.\n- [ ] Repeat radius, line, fill, preview, undo, and redo on hex-row and hex-column Scenes.\n\n## Failure and recovery\n\n- [ ] Temporarily provide invalid Region behavior data in a disposable fixture; confirm Tile creation rolls back.\n- [ ] Verify `auditScene()` counts match visible owned documents.\n- [ ] Reload the world and confirm ownership flags still support erase and stage-switch.\n- [ ] Disable the module and confirm foreign Scene documents are untouched.\n- [ ] In alpha, disable P1 through `api.setDevelopmentPhase(\"p1\", false)` and confirm the panel falls back to free radius 0 without preview/history controls.\n- [ ] Re-enable P1 and confirm the controls return; then verify release packaging with phase controls immutable before formal release.\n- [ ] Remove all P0 test documents before ending acceptance.\n\n## Deferred until final unified runtime acceptance\n\n- legacy-sound cleanup and no-new-audio request checks;\n- transparent WebM animation;\n- very large battlefields and long-session memory/performance;\n- production environment installation;\n- four-hour real-session soak.\n\n## P2 final-pass additions\n\nRun these only in the final unified environment pass after all development phases are complete. Clear module-owned documents between phase combinations; do not treat static tests as runtime acceptance.\n\n- [ ] Confirm the module reports `0.3.0-alpha.1`; canonical compatibility media plus Fire/Frost field media remain valid in the build inventory. New P2 Square Fire/Frost must not request `fire.webm` / `frost.webm`.\n- [ ] Run with `P0` only; confirm static WebP tiles, the P0 fire light, and no AmbientSound documents.\n- [ ] Run with `P0+P1`; repeat radius, line, fill, preview, erase, stage, undo, and redo behavior.\n- [ ] Run with `P0+P2`; confirm P2 fire uses hidden logical `fire.webp` plus `visualEffect: \"fire-field-v1\"`, mounts one continuous video-backed fire mesh, and does not request `fire.webm`. Confirm Square Frost uses `frost-film-v1.webp` plus `visualEffect: \"frost-field-v1\"`, adds Stage II mist without requesting `frost.webm`, while Brambles remains on its current WebM path. All terrain creates zero new AmbientSound documents or Battlefield Painter audio requests.\n- [ ] Confirm `api.auditFrostEffects()` reports one film mesh, at most one Stage II mist mesh, shared ticker time, actual Frost cell/stage counts, and no persistent rebuild/object growth.\n- [ ] For a Square Scene, confirm `api.auditEffects()` reports one mesh covering the actual fire cells, shared ticker time, correct 15×15 counts, and no persistent rebuild/object growth; inspect single, 1×3, 3×3, L-shaped, gap, stage-boundary, erase, undo/redo, Token-layer, and pan/zoom behavior manually.\n- [ ] Run with `P0+P1+P2`; confirm complete interaction, zero new owned sounds, and at most 16 cells per fire-light cluster.\n- [ ] On a fixture containing old module-owned and foreign AmbientSound documents, confirm the GM cleanup dialog lists only owned IDs, cancel is safe, stale fingerprints reject deletion, and confirmation leaves foreign sounds untouched.\n- [ ] Paint 25, 100, and 300 connected cells; record Tile, Region, Light, zero-new-Sound, and Wall document counts and visible performance.\n- [ ] Open scene clear preview; confirm only module-owned documents are counted and foreign documents are excluded.\n- [ ] Change the Scene after opening the clear preview; confirm the stale fingerprint blocks deletion and asks for a new preview.\n- [ ] Confirm clear is one undoable history operation and foreign documents survive clear, undo, redo, and reload.\n- [ ] Repeat P2 media, zero-new-audio, clustering, legacy cleanup, and clear checks on square, hex-row, and hex-column Scenes.\n- [ ] After runtime acceptance, set release phase controls immutable and verify the phase setter is absent from the public API.\n","foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md":"# 血猎手 2024 独立 Foundry 模块\n\n`fvtt-blood-hunter-2024` 是独立模块，版本为 `1.0.0`：默认构建精确对应 Foundry Virtual Tabletop `14.364`、dnd5e `5.3.3`；显式 `--target=server-next` 仍以 Foundry `14.368`、dnd5e `6.0.2` 作为编译内容身份，生成的 manifest 则记录 `minimum/verified=6.0.2`、`maximum=6.0.5`，用于当前 ServerNext 兼容检查。它提供三个 Item compendium pack：`classes`、`subclasses`、`features`。模块不依赖 Plutonium 或 classpack；MIDI-QOL `14.0.11` 与 DAE `14.0.12` 是旧目标推荐版本，不是硬依赖，不能据此推断 ServerNext 本机版本的额外自动化已经验收。\n\n## 构建\n\n构建必须使用已经接受的 `BloodHunter2024` enriched source JSON 的原始 UTF-8 bytes：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"C:\\absolute\\path\\BloodHunter2024.json\"\n```\n\n`--source` 必须是绝对路径。构建脚本只通过 `packages/blood-hunter-v14/src/index.ts` 的公开接口调用编译器，先把 raw bytes 交给编译器，再由公开 validator fail-closed。它不会复制编译器的匹配规则、ledger schema 或 Effect/Activity 生成逻辑；每次都以编译器返回的 `logicalHash` 为准，因此 coverageLedger 的语义修正会自然进入新构建。\n\n每次构建在随机临时根内完成两份候选结果：三份 LevelDB Item pack、canonical package、migration contract、coverage ledger、review、identity manifest 和确定性 ZIP。构建会比较两次结果的文档/UUID、manifest、logical identity、pack index、Activity/Effect 引用，并递归检查整个编译结果中的 12 个 dnd5e 外部 Item UUID（7 equipment、1 Boon、4 fighting styles）。缺少任何 UUID，或锁定的 `dnd5e/5.3.3/repo/packs/_source` reference cache 缺少对应 document，都会失败。Effect change 的 mode 等语义由最终编译器输出负责，模块只序列化输出。\n\n构建成功后才会把结果原子发布到本目录的 `dist/`：\n\n- `dist/module/`：可安装模块树；\n- `dist/fvtt-blood-hunter-2024.zip`：ZIP 及其 SHA-256；\n- `dist/module/data/identity-manifest.json`：source SHA-256、编译器 logical hash、81 documents、94 ledger、117 Activities、UUID 清单；\n- `dist/module/data/migration-contract.json`：浏览器迁移使用的 canonical/migration 契约。\n\n`dist` 不是运行中 Lab 的 pack；构建不会原地写 Lab 世界或运行中的 compendium。\n\nServerNext 的独立候选使用同一锁定原始 source，加 `--target=server-next`：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\assets\\homebrew\\blood-hunter-2024.activities.json\" --target=server-next\n```\n\n这一选项使用 Foundry `14.368` / dnd5e `6.0.2` 编译身份及 Advancement 形状，核对 `dnd5e/6.0.2/repo/packs/_source` 中的 12 个外部引用；输出 manifest 的兼容上限为 dnd5e `6.0.5`，而 `verified` 和内容身份保持 `6.0.2`。对这一编译目标，还从原文生成 2 级先授予的“战斗风格”基础特性，使四个官方战斗风格通过目标系统的先决条件；因此该目标有 77 项特性，旧目标仍有 76 项。省略选项仍构建旧目标。`dist` 一次只保存最后一次构建；旧 Lab 安装命令仍只允许 server-mirror，**不能用于安装 ServerNext 候选**。6.0.5 上的模块启用与人物行为读回应另行验收。\n\n## Lab 安装与验证\n\nLab CLI 只允许配置后的本地 `FVTT_OPS_LAB_ROOT`，目标严格为：\n\n```text\n\u003cFVTT_OPS_LAB_ROOT>/data/server-mirror/Data/modules/fvtt-blood-hunter-2024\n```\n\n示例：\n\n```powershell\nbun run foundry-modules/fvtt-blood-hunter-2024/labCli.ts dry-run\nbun run install:blood-hunter-v14\nbun run install:blood-hunter-v14 --apply\nbun run verify:blood-hunter-v14-install\n```\n\nCLI 会拒绝生产/远程变量、8080、路径逃逸、symlink/junction/reparse、LevelDB `LOCK` 或占用目标。已有同 ID 目录必须带本模块的 `data/owned-marker.json` 才能替换；foreign same-ID 目录会停止。替换前把旧目录移动到配置的 backup root，stage 通过完整 hash、manifest、pack documents/index 检查后再原子替换，并在失败时尝试恢复 backup。\n\n`verify-install` 只报告字节、manifest、LevelDB documents/index 和 identity 一致性；它不启动 Foundry、不启用模块，也不冒充真实 runtime 或游戏性 E2E。构建/测试只使用随机临时 Lab 根和配置的只读 `classic-level` 入口，不把真实 `F:\\FoundryLab\\foundry-v14` 的 app/data/world 当作数据库写入。\n\nFoundry Ops 的公开只读证据入口使用：\n\n```powershell\nbun run foundry:ops lab blood-hunter-v14 plan --input=\"C:\\absolute\\matrix-plan-input.json\"\nbun run foundry:ops lab blood-hunter-v14 verify-actor --input=\"C:\\absolute\\actor-snapshot-input.json\"\n```\n\n还支持 `inspect`、`verify-migration` 与 `evidence-manifest`。这些动作只读取显式 JSON 并返回验证结果，不启动 Foundry、不写世界，也不会把 pack/API 探针提升为 E2E PASS。\n\n## 迁移 UI\n\n模块在 `init` 阶段只注册 GM-only 菜单，不在 `ready` 自动扫描 Actor，也不自动修改任何 Actor。菜单标题是“血猎手 2024：角色迁移”。\n\n1. GM 明确输入 Actor ID 或精确名称后点击 `Preview`。Preview 只读，不写 Actor。\n2. flags `fvttJsonGenerator.bloodHunter2024.canonicalId` 优先；没有 flags 时，只有 `source + class/subclass + level + normalized name` 全部严格相等才使用 legacy match。多候选、重复 canonical 或歧义会停止。\n3. 点击 `Create migrated copy`，模块通过 Foundry 公共 Actor Document API 创建迁移副本，并生成 Actor JSON backup；副本通过非血猎手投影、选择/消耗、重复和 Activity/Effect 引用检查后，才允许下一步。\n4. `Apply original` 需要已有副本、通过副本验证、JSON backup，以及输入与 Actor 名称完全相同的确认文字。冲突逐项选择 `Keep`、`Overwrite` 或 `Cancel`；关闭窗口等同 `Cancel`。任何未决冲突都不能 Apply。\n\n迁移只原位更新唯一匹配的 Blood Hunter Item；没有现有对应项时不会自动补充特性，因为仅凭全包清单不能判定人物当前职业、子职与等级。缺少的特性须在正常升级流程中授予或由 GM 单独核对；不按名称批量删除，不改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags。Activity/Effect/说明冲突默认暂停。Apply 通过公共 Document API 完成；失败会用 Apply 前 JSON/Actor snapshot 补偿回滚，禁止直接写 LevelDB。\n\nCallum 的旧“破晓血仪” fixture（0 Activity、0 Effect）覆盖 Preview、迁移副本、Apply 和 rollback：原 Actor 在 Preview/副本阶段保持不变，副本应得到 5 Activity、2 Effect。\n\n## 自动化边界\n\n- **Core**：Foundry/dnd5e 原生 class、subclass、advancement、Activity/Effect 结构；不要求 MIDI-QOL 或 DAE。\n- **Modded**：可利用推荐的 MIDI-QOL `14.0.11` / DAE `14.0.12`，但模块不会把它们当作硬依赖，也不会把未验证效果宣称为原生自动化。\n- **assisted**：需要 GM/玩家按规则确认的跨 Item、目标条件、休息或选择流程；ledger/review 中会保留边界。\n- **external-rule**：依赖外部规则或外部 compendium UUID 的部分；identity manifest 会保留 12 个 dnd5e UUID，缺引用即 fail-closed。\n\n这是一次构建快照，不是实时同步：安装后不会监视远程 homebrew、旧 side-data 或 Actor 变化。旧 side-data 只作为迁移识别/审查的历史输入，不是权威规则来源；权威来源是本次 raw source 与公开编译器输出。线上生产 Foundry（8080）不在本任务部署范围内，也不会由本模块 CLI 触碰。\n","foundry-modules/fvtt-custom-conditions/CREDITS.md":"# Icon credits\n\nThe nineteen core condition icons below are original SVG icons from [Game-icons.net](https://game-icons.net/). The pinned upstream source tree is [game-icons/icons at `82d948812bfe3f269ef8f731dcdb07b08160edc4`](https://github.com/game-icons/icons/tree/82d948812bfe3f269ef8f731dcdb07b08160edc4). The layered Injury icons are documented separately after the table.\n\nEach core condition SVG is copied byte-for-byte from the listed original download. Only the bundled filename and path differ; the artwork was not edited or traced. The SHA-256 values below identify the original downloaded SVG bytes. Paths in the table are relative to the built module; repository source stores these files under `src/`.\n\nLicense notice: the listed artworks are licensed by their respective creators under [Creative Commons Attribution 3.0 Unported (CC BY 3.0)](https://creativecommons.org/licenses/by/3.0/). Reuse is subject to that license; retain creator attribution and the license notice. Read the [full license legal code](https://creativecommons.org/licenses/by/3.0/legalcode).\n\n| Bundled path | Artwork title | Creator | Source page | Original SVG | Original SVG SHA-256 |\n| --- | --- | --- | --- | --- | --- |\n| `icons/addled.svg` | Brain Leak | delapouite | [delapouite/brain-leak](https://game-icons.net/1x1/delapouite/brain-leak.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/delapouite/brain-leak.svg) | `8a021da3d0c79284719e5d1eb5c3938c13c92899558d3cb09db8d38d54176233` |\n| `icons/bewildered.svg` | Uncertainty | lorc | [lorc/uncertainty](https://game-icons.net/1x1/lorc/uncertainty.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/uncertainty.svg) | `714cebd357e5c23f34c0ee3aa807423036b3cc
