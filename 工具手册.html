和已保存+1观察一致；未进行禁用Midi的隔离实验，不声称整个Midi或Core故障。\n\n窄修复稿只改两个请求处理器：先用owner的getRollData解析该Activity的bonus，再把parts/data放进原roll配置；保留Midi原有workflow、GM/玩家权限、rollMode和DC分支。草稿在本任务.local/next-605-restore/midi-proposal/，不向现有dirty上游源码或运行安装包直接打补丁。下一步若获准，应建立独立来源候选、保存local.9既有改动与精确构建身份，运行两handler对照、构建／类型门及正常UI+4/+4与精确清理验收；不升级Core、系统或其他Midi功能。\n\n待判断本地化：是否将该现有本地Midi两个覆盖handler适配纳入本次。Manifest声明、脚本语法和模拟不能替代两次真实请求结果。当前94模块启用、49来源与无关ID保留的接受仍有效，组合Check／Save语义为FAIL。私有证据根为F:/FoundryLab/foundry-v14/evidence/server-next-migration/next-605-restore-20261001-4863dddb。\n\n修复稿的可复核检查已运行：Bun对两份完整TS文件转译，并执行旧／新处理器body对照，公开公式helper的返回按实机诊断校准。旧handler均不传activityBonus，新稿传3／parts[@activityBonus]，ability=str、DC10和rollMode=public与旧版一致。它只证明参数传递边界；完整类型／构建、复杂隐私分支和部署实机尚未执行。稿子没有写回旧dirty Midi源码或安装包，等待用户是否增加该模块范围。原十模块批次已继续派发。\n\nCore验证场景最终精确清理PASS：四个自有Chat、两个Actor和场景已删除，原Actor/Scene/chat/其他Macro集合与view/pause/control/targets恢复，49来源值保持。Core辅助Macro已缺席，旧升级Macro仍保留给主模块接受；原两次+1行为FAIL不因清理成功改成PASS。\n\n## 已授权候选与可复核产物\n\n候选为本恢复 worktree 下 `.local/midi-605-requests` 独立 checkout，基于 `4338eeab85041cd71b76ede36818e2265cbf06ae`；原 Next 的 dirty Midi 来源树未改写。原 local.9 的 DamageApplicationElementMidi／Workflow／patching 三份既有运行修改逐字节保留，package 两个文件除 local.10 版本／下载身份外与原 dirty 输入一致。两 handler 增量保存为 [2026-10-01-request-bonus.patch](../../references/third-party/midi-qol/patches/2026-10-01-request-bonus.patch)，SHA-256 `ad4563f27de869c334ff8bbde13ffbfe41b9809282cb9815d582f09fd0ae7ae5`；补丁不包含那三个既有 local.9 修改，不能把它单独当作完整部署包。\n\n第一次 Gulp 曾打印6个 TypeScript 错误却退出0并产出 ZIP，已明确拒绝。补窄接口类型后，独立 `tsc --noEmit` 退出0、`gulp zip` 退出0；最终 local.10 ZIP 为3,118,400字节，SHA-256 `ddc75397b259d97a1f01d2cf7c18bed2b05d4e25150fbf18ad230cbdd90d9cf0`。父独立读取 ZIP 入口复算：JS为 `bc9a41c4b5ddf7de8f279f9f44524e1d68992a4b2181cb0f16b851362d4bbff4`，map为 `0db0f96169d27f833d602dc736abf2d5f394181f6944d47f60acc278dbf011b9`。两个 handler 的 source map 与候选源码一致；old/new body 模型证明 Check／Save 配置传3且保留 ability／DC／模式。这仍属于源码／构建证据。\n\nZIP有119入口，其中12为 packs；限定安装只允许 `midi-qol.js`、`midi-qol.js.map`、`module.json` 三文件，其他104 nonpack 文件与已装 local.9 相同。manifest 除 version/download 外完整一致。运行中读取某 pack log 被锁拒绝后没有重试或写入；pack 前后清单和SHA必须在正常 Setup／锁释放后核对。另四个已批准 House／Injury 中英文拒绝文案也纳入最终七文件计划，准备阶段 installedFilesWritten=0；不替换数据库或写 packs。\n\n新验收工具 V4 明确要求 active Midi local.10，给 Check／Save Activity 显式 `_id`，沿用已纠正的 raw/prepared origin 关联和公开 TokenLayer 目标恢复。部署后分别走真实请求 UI 一次，预期 owner+3／target+1 的+4；记录随机骰与总值，随后精确清理和49来源读回。旧+1失败证据保留；目前该新实机门为 NOT_EXECUTED。\n\n## 限定安装通过，实机仍待回执\n\n十模块自有现场与两个临时 Macro 精确清理通过后，正常 Return to Setup；父独立 status.active=false、原PID39528／端口／app/data身份、Core14.368／系统6.0.5以及world／packs锁释放核对通过。只覆盖冻结的七文件，全部写后哈希一致，父再次独立复算七项0差异；三个相关模块所有 packs 文件前后 SHA 与数量完全一致，其他 nonpack 未变。安装收据 `midi-fix-install-receipt.json` 明确 `PASS_LIMITED_INSTALL_ONLY`，没有把它记为运行PASS。\n\nV4再绑定原94启用ID与版本，仅允许 Midi local.9→local.10 的单项授权差异。最终冻结请求工具24,905字节，SHA `bd6036e6685054e1e2b568f0cfd1fc9e3b6ccb46feac6cb06d4fbb81674e9742`。已派正常原世界启动、真实 Check／Save各一次、原始骰值／总值关联及精确清理；旧十模块已过门不重放。此时+4／+4仍为待回执，不以预期值写实际结果。\n\n首次V4存储读回在执行前遇纯行尾规范化：一处CRLF以及最终LF被编辑器规范，全文逻辑一致，但不冒充原hash相同。现场只有唯一Macro、无flags／fixture／Chat／roll。父源文件统一LF后重新冻结为24,904字节、SHA `35979f7b6d54e0ff873bcff0eb88cff91710c67c4820b47d86ca9fa9ebf1e49b`，同一Macro接续，仍允许单独记录编辑器省略末尾LF的保存hash。该工具问题不计作Midi语义失败。\n\n## 真实请求与清理接受\n\n同一新fixture的owner STR修正3、target修正1。正常Check请求卡 `cuqIzYSsim6LPAKd` 的真实target roll `bqLtyEmq0vjIplr1` 为 `1d20 + 3 + 1`、骰12／总16；Save卡 `l0bZdXBILjuYLU73` 的roll `mCdNFtT9esgIvTPz` 为同公式、骰20／总24。两次modifier均4且raw origin准确对应各卡；Check普通NORMAL／PublicAsUser对话实际投一次，Save正常按钮直接evaluate一次，没有第二次投、重掷、改公式或写结果。`midi-local10-actual-rolls.json` 20,330字节，SHA `9dca9d5c0e4e84a57929023e91f90889bdb5286a2d58dc3bde620e045ee9269c`。\n\n实际active modules完整94集合，仅Midi版本为local.10，其他93版本与已接受原94一致；49来源值全部逐项相等。精确cleanup只删除新2NPC／Scene／Feat／4Chat并恢复原view／activeScene／pause／control／targets，原Actor294／Chat1419和Scene集合保持。`midi-local10-final-cleanup.json` 68,679字节，SHA `ee0ac5311b4167eb75eeefda1d5dc4ac34f09f961b79663200e480326d0eea31`。唯一工具Macro随后删除，原90ID完整相等；`midi-local10-macro-final-cleanup.json` 2,344字节，SHA `535e679aec4253ea51ff7153387acf4d86f2993a6886fda3c6cb366d38d9572c`。\n\n父另解析raw JSON，重新计算total−diceTotal、核两card origin与speaker、逐值比较49来源及94版本唯一delta，核原Actor／Chat／90Macro，Scene以完整重载快照去除准确owned Painter Scene为对照（早期fresh84快照不含sceneIds，不能把缺字段当作空集合）。接受存于 `parent-midi-runtime-acceptance.json`。实际查看roll可见截图；不把manifest／磁盘哈希当客户端已执行字节证明。\n\n本轮接受两个请求来源加值的正常UI切片，不包含所有权限／privacy／workflow分支、完整native Cast、天然19、长时跑团或生产。旧local.9的两次+1FAIL完整保留，不因修复成功改写旧结果。服务原PID39528继续运行，原Scene／pause恢复，未Return Setup或停服务。\n","docs/reviews/2026-10-01-next-605-release-integration.md":"# ServerNext 6.0.5 本轮成果：发布前整合\n\n日期：2026-10-01。用户明确授权整理提交、完成发布前检查、合并 master 并推送；要求保护原工作树全部改动、复用已通过实机 E2E。\n\n候选为 `codex/20261001-161536-next-605-restore`，基线 master `053a592b940d59b4c3014074eb233d65bcfb944e`。发布操作按 worktree runbook 顺序执行，提交和远端 SHA 由 Git 生成，完整操作回执保存在本任务私有 evidence，不把未经脱敏的日志入库。\n\n## 交付和因果边界\n\n- 十个自有模块的源码、构建契约及版本门整合；精确运行目标是 Core14.368／dnd5e6.0.5。版本声明上限和五个运行门确实需要放开／适配，不能据“小版本”预先保证兼容。\n- Painter 的 Fire 行列坐标和视频加载问题在原迁移源码中已存在；修复、代表画布视觉和普通重载通过。未证明是6.0.5新回归。\n- Midi 两个请求 handler 遗漏 Activity 来源加值，local.10 实际 Check／Save 均为来源3＋目标1。6.0.2原生链已支持加值；缺少同组合6.0.2实机反例，不把它定性为升级引入。\n- Deck 按6.0.5效果来源读取力竭；初次候选漏补齐 effect ID 是本次实现错误，已修复并通过UI3→4→3和重载。它不能证明旧6.0.2有同一问题。\n- 其余八个自有模块在本轮限定切片未发现新的功能缺陷。Blood Hunter／Species仅接受来源和内容身份，Chat Guard仅统计API，Monitor仅短会话；这些事实不提升为完整玩法通过。\n\n完整运行、普通重载和精确清理复用[十模块记录](2026-10-01-next-605-custom-module-restoration.md)及[Midi记录](2026-10-01-next-605-midi-request-bonus-gap.md)。未再次进入浏览器或投骰，也未重新部署。天然19、完整Cast／四子职／其它地形／GM玩家矩阵、长时和生产仍为 NOT_EXECUTED。\n\n## 整合中发现的检查问题\n\n1. 三处原有测试类型错误在 master 对照同样存在；补显式存在性检查，保留原断言。\n2. CLI 子进程的 Bun exited＋WebStream 组合曾超时且输出为空。改用 Node child_process 同时读取两管道，在 close 后取结果；Unicode、大输出、非零退出、启动失败和超时回收继续验证。爬虫 CLI 测试复用同一 helper，内层50秒先于测试60秒截止。\n3. 单进程覆盖率120秒短于本次完整319文件运行；watchdog调为300秒，保留原清单、单并发、单进程函数统计和全部阈值。未以合并多个进程的函数计数冒充覆盖率。\n4. Species14.368静态构建复用 CI 明确注入的 classic-level 测试入口；未注入时仍要求真实14.368依赖路径，负例保持拒绝。未改变内容目标6.0.2或扩大运行接受。\n5. Intake 验收原先把命名空间状态与语义条件直接比较。现在仅同一 Effect 的已启用合法模板 flags 与精确 projected ID 匹配时归一化；缺失、错配、禁用、伪后缀和普通效果仍报告漂移。没有改生成 JSON 或放松来源匹配。\n6. Custom Conditions 图标与归属检查共用一次真实 beforeAll 构建，保留所有19图标及源哈希断言。\n7. 全清单覆盖率通过后的实际暂存卫生门发现：旧规则只允许Species根目录的已接受JSON，未识别本轮正式接受的`v14-368`构建输入。增加限定目标目录、单层小写稳定ID规则；其他版本、任意嵌套、大小写错配及子目录ledger仍拒绝。完整覆盖率快照不重跑，新增规则的局部robustness80通过／0失败、卫生1649个暂存后tracked路径通过、anti-overfit429来源通过。Midi增量补丁的空白context行必须含一个diff标记空格；只为这一准确patch路径设置Git whitespace属性，保留原补丁SHA，而非改写补丁。\n\nBun1.3.8完整覆盖率曾挂住及出现 `switch on corrupt value` 原生崩溃。逆序对照没有稳定消除问题，未纳入最终实现。隔离Bun1.4.2完整对照出现 Windows file import／fs.cp 不同兼容错误，未据此修改世界复制逻辑或全局运行器；所有原失败日志保留。\n\n最终采用隔离的官方 [Bun1.3.14发布包](https://github.com/oven-sh/bun/releases/tag/bun-v1.3.14)，实际版本 `1.3.14 (0d9b296a)`；下载ZIP SHA-256 `0a0620930b6675d7ba440e81f4e0e00d3cfbe096c4b140d3fff02205e9e18922`。CI固定1.3.8→1.3.14，本机全局Bun未更改。完整319文件、原升序、单并发／单进程覆盖率为3017通过、1既有跳过、0失败，245.32秒；图标来源检查、Windows导入和临时复制门均通过。阈值门退出0：生产行覆盖率83834/98414＝85.19%，函数9115/10540＝86.48%，无阈值放宽。报告仍列49个未覆盖生产入口；CLI、build和smoke的独立通过不冒充这些入口的进程内覆盖率。\n\nCI组成门禁按失败点接续完成，不把先前失败的整条 `ci:verify` 记成退出0，也不再次重跑已通过的共同门：\n\n| 门禁 | 实际结果 |\n| --- | --- |\n| 临时环境／测试隔离 | PASS，写入根限随机CI沙箱 |\n| Ruler生成／32层级指令、手册来源及离线HTML | PASS，发布前同步，合并后再核手册 |\n| production／all／packages／apps／foundry-modules／tools类型 | PASS，最终1.3.14入口 |\n| 架构依赖／循环 | PASS，无非法导入／循环 |\n| Session Monitor独立build | PASS，固定运行器下两入口同字节ZIP |\n| CLI／全清单覆盖率／阈值 | 24/0；3017/1skip/0；85.19%行／86.48%函数 |\n| anti-overfit／仓库卫生／锁定参考 | PASS，429来源；私有凭据和原件未暂存；5.3.3／current6均有效 |\n| Web build／离线Actor smoke | PASS，来源6items、0 verifier警告、0网络调用 |\n\n独立只读复核未发现其余发布阻断项。运行器修改仅影响仓库CI；已接受的Foundry安装和实机证据仍绑定原冻结产物，没有用新的CI构建覆盖已装模块或更改服务。\n\n## 保护与发布出口\n\n发布前独立重算：原迁移源368文件、策略11文件、审计12文件、原Midi6文件，长度／SHA差异均0；原master clean、索引为空。仅候选准确路径进入暂存，不包含 .local、真实凭据或私有原件，不stash／提交／清理原工作树。\n\n发布采用主checkout正常fast-forward，合并后再查手册及用户基线，再推送并核本地master／origin/master／远端refs/heads/master一致。源码发布不代表新增生产部署。\n","docs/runbooks/custom-conditions-and-trigger-engine-usage.md":"# Custom Conditions 与 Trigger Engine 使用说明\n\n本说明对应当前本地候选版本：Foundry14.364 / dnd5e5.3.3。基础发布边界见[候选收尾表](../reviews/2026-09-21-custom-conditions-release-readiness.md)；状态文案的来源边界见[规则核对](../reviews/2026-09-23-drakkenheim-condition-wording.md)，全 19 项的 ID、点击路径与 CoTN 页面复验见[本轮审计](../reviews/2026-09-24-all-custom-condition-hud-audit.md)。全 19 项入口可见已在 CoTN 页面通过；这不代表逐项施加与结算已复验，也不代表serverNext的dnd5e6版本已兼容。\n\n## 启用与打开\n\n本地候选包位于 `foundry-modules/fvtt-trigger-engine/dist/fvtt-trigger-engine.zip` 和 `foundry-modules/fvtt-custom-conditions/dist/fvtt-custom-conditions.zip`。目前没有公开发布manifest地址；这些是本worktree的本地交付物。安装到其他实例前应核对版本兼容性与目标授权，不能直接覆盖正在使用的模块目录。\n\n安装两个独立模块，在世界的模块管理中启用 Trigger Engine 和 Custom Conditions，按提示重载页面。Custom Conditions依赖Trigger Engine；核心功能不要求Midi-QOL、DAE、Times Up或Effect Macro。\n\n以GM选中或标记目标Token，从模块设置菜单或Token控制栏打开“管理自定义状态”。存在标记目标时优先使用标记目标，否则使用选中的Token。改变目标后点击刷新，确认面板显示的Actor名称再操作。\n\n## 手动状态和参数\n\n名称和悬停规则说明跟随 Foundry 的核心界面语言：`cn` / `zh-CN` 为中文，`en` 或没有对应翻译的语言回退英文。改语言后重载世界。系统与模块没有两套彼此独立的语言选择。十九种自定义实例各使用一张选定的 Game-icons.net 原始 SVG，作者、作品、来源和 CC BY 3.0 许可见模块包内 `CREDITS.md`。笨拙使用 Drop Weapon，踉跄使用 Foot Trip。Token Action HUD 的完整提示使用 dnd5e 规则卡布局：左侧双语标题、右侧状态类别和分段正文；状态图标只留在 HUD 按钮，不放大到提示框内。仅名称和无提示模式仍按 TAH 设置生效。**所有 19 个自定义状态**使用 `fvtt-custom-conditions.\u003c语义 ID>` 的独立状态 ID；dnd5e 原生与其他模组的裸 ID 按钮保留其原有规则。CoTN 中系统原生 `bleeding` 的中文按钮是「失血」，本模块自定义 `fvtt-custom-conditions.bleeding` 是「流血」；原生 `burning` 为「燃烧」，自定义 `fvtt-custom-conditions.burning` 为「灼烧」。自定义 Dazed 标题只显示「恍惚」或 Dazed，不显示辨识用后缀，仍与 MCDM 的裸 `dazed` 分立。不能把原生按钮当作已配置自定义骰式的实例。\n\n如同时启用伤势模块，可以在本管理器的伤势区域查看和调整 0–3 层伤势，或打开“消逝的灵魂”仪式。Token Action HUD 中伤势项显示当前层数，例如 `1/3`；完整悬停说明也按 dnd5e 规则卡布局显示，将倒地与叠层、第三层 GM 裁定、清除方式、死亡豁免自然 19/20 分段列出。伤势仍通过其公开 API 写入原有 Actor flags；关闭 Custom Conditions 不会丢失伤势及复活历史。伤势图标亦取自 Game-icons.net，署名与许可随伤势模块包内的 `CREDITS.md` 提供。\n\n选择状态，在参数JSON框中填写该状态的参数，再施加。切换到另一种状态时应按新状态填写参数，不要沿用上一种状态的无关字段。没有参数的状态使用 `{}`。\n\n| 状态 | 最小参数示例 |\n| --- | --- |\n| 自定义流血（内部 ID `bleeding`） | `{\"formula\":\"2d6\"}` |\n| 灼烧（内部 ID `burning`） | `{\"formula\":\"2d6\",\"damageType\":\"fire\"}` |\n| Frozen | `{\"escapeDC\":15}` |\n| Jinxed | `{\"formula\":\"1d6\"}` |\n| Valor | `{\"formula\":\"1d4\"}` |\n\nToken Action HUD 中已生效的 Jinxed、Valor 实例显示其骰子面数，例如 `1d6` 显示 `6`、`1d4` 显示 `4`。这是骰式标识，不是掷骰结果；复合骰式显示紧凑式，过长时角标截短，完整式可在状态管理器查看。\n\n冻结与震愕的说明直接展开其所附状态的效果，阅读时不用再翻查「定身／无防备／恍惚」。冻结使速度为 0、不能受益于速度加值，飞行中会坠落；针对目标的攻击检定有优势。其特殊重击条件限于**使用造成钝击伤害的武器**命中冻结目标，不是任意钝击法术或普通徒手打击。天生武器只有被具体规则认定为武器且在 Foundry 中可被活动数据识别时，才能指望自动判定覆盖。本模块的自定义「恍惚」在自己的回合可从**自主移动、执行动作、执行附赠动作**中选择一种；选择后不能再做另外两种。震愕继承这条恍惚规则，另使针对目标的攻击检定有优势，并让目标掉落手中物品，拿取、拔出或收起物品各需 1 个动作。因此震愕目标若已选择移动或附赠动作，本回合不能再拿取／拔出／收起物品。两种状态都不额外禁止反应；「震愕」也不表示只由闪电伤害造成。攻击掷骰进入求值时，会在本客户端临时锁住所选类别；若掷骰异常失败而没有完成 Hook，本回合保守地继续限制，下一回合自动重置。跨客户端同时操作同一 Actor、两个独立非攻击活动弹窗交错完成仍需单独验收。这一三选一是本项目按用户决定采用的自定义规则，见[规则变更记录](../reviews/2026-09-24-dazed-three-choice-rule.md)。\n\n英勇在攻击检定或豁免检定时额外掷实例骰式并**加**到结果；厄运使用相同结构但**减**去骰值。虚弱使武器攻击或法术造成的伤害总值减半，结果向下取整；若聊天卡仍显示含小数的伤害表达式，以目标 HP 实际应用的整数为准。踉跄在自己的回合最多完成一次武器或徒手攻击；这比目前可公开核对的 Drakkenheim Beta「武器攻击」文字范围更广，是本项目的明确选择。正式版 Appendix C 的条件原文尚未逐条公开核对，不把这里的措辞称作正式中文版原文。\n\n在已选 Token 的 Token Action HUD 中，鼠标离开时动作区可能隐藏；打开「效应」组。active GM 对单个明确 Actor 点击自定义流血、灼烧、冻结、厄运或英勇，会打开**绑定该 Actor 且预选所点状态**的管理器，点击本身不施加效果；先填写流血/灼烧的骰式、灼烧伤害类型、冻结解除 DC、厄运/英勇骰式等必填参数，再提交。其余 14 项经 Custom Conditions API 切换带本模块 flag 的实例，不能通过系统默认状态开关来代替。目标不明确、无 active GM 权限或同状态有多个实例时，以提示和管理器核对为准，不退回系统默认切换。仅由冻结/震愕的复合效果提供的子状态会显示生效；点击子状态不会暗中再建一个独立实例，应到管理器处理实际来源。旧版带本模块 flag 的实例仍按原存储读取并点亮自定义 HUD 项，原生流血/燃烧不会点亮本模块项目。\n\n2026-09-23 的 CoTN [现场核查](../reviews/2026-09-23-cotn-burning-hud.md)只看到原生燃烧按钮；2026-09-24 的[灼烧入口验收记录](../reviews/2026-09-24-custom-burning-hud.md)只确认当时「燃烧／灼烧」并列。此后的[全 19 项 CoTN 复验](../reviews/2026-09-24-all-custom-condition-hud-audit.md)已确认 19 个自定义按钮均可见、无重复，且点击自定义「流血」打开绑定 Actor 的空参数表单；其余按钮的逐项点击与结算未在这一轮执行。Token Action HUD 保存的个人布局按 action ID 匹配；本轮现有布局显示正常，但旧布局中的隐藏与排序偏好未证明会自动迁移，若个别入口未出现，应先检查该用户的「状态」组布局，不要清空他人的偏好。\n\nBleeding默认在自身回合结束时失去生命值，恢复生命值后解除；Burning默认回合结束造成指定类型伤害。来源明确指定回合开始时，可在参数中加入 `\"timing\":\"turnStart\"`。结束说明只是说明文字，不会把任意自然语言自动变成触发规则。\n\nBleeding与Burning在同Actor上各自只保留一项较高值，按骰式期望值比较，平手保留原值。Burning不同伤害类型仍一起比较。它们不是多层相加，也不按每次随机掷骰结果临时决定强弱。\n\n编辑：面板中点击已有实例的编辑，修改参数后保存。停用会保留实例信息但暂停作用；移除则解除实例。来源栏用于记录“这个状态从哪个能力或物品来”，不需要普通使用者手写技术地址。\n\nFrozen实例的“破冰（动作）”按钮会进行力量（运动）检定。默认目标自救；标记被冻结目标并另选一名协助者时，可由协助者检定。GM先判断其是否能接触目标。取消不耗Action，完成失败耗Action但状态保留，成功则解除。\n\n## 怪物生成与模板\n\n来源必须明确给出状态参数，例如Frozen的DC、Jinxed的骰式。使用正式生成器输出Actor JSON，再通过Foundry的Import Data导入。攻击Item中的Condition效果是可施加模板，不应让持有该Item的怪物自己中状态。\n\n模板应用使用模块公开的 `applyFromItem` 流程，将来源参数复制到目标Actor实例。已有自动化可以调用此接口；仅导入Item并不等同于每次命中都已自动完成目标选择和规则裁定。当前管理器用于直接施加/管理状态，不能把API验证描述为已经提供所有“一键命中套用”的UI。\n\n不要手工修补最终生成JSON来补来源没写的DC或骰式。来源缺参数时先补充来源，或由GM在Foundry中手动决定实例参数。\n\n## 通用触发器\n\n从模块设置或Token控制栏打开Trigger Manager。当前编辑器接受JSON定义，支持Actor文档更新、Combat回合开始、Combat回合结束。可以新建、复制、编辑、启停和删除Trigger，并选择已有Macro UUID作为动作。\n\nTrigger只由active GM执行。宏收到 `triggerContext`，可读取变更前后数据、Actor及回合信息。宏要回写同一Actor时，使用 `triggerContext.updateDocument()` 保留防递归信息。\n\n无需为了更改现有触发条件或状态骰式重新编译模块；但首次编写全新Macro行为仍需要脚本。不要把“可在FVTT中配置”理解为“所有新规则都无需编写任何逻辑”。\n\n## 移动与使用边界\n\nImmobilized/Frozen限制拖拽、键盘，以及非GM通过HUD/配置进行的自主位置修改。GM坐标编辑、API位置操作保留用于强制位移/裁定，不计为Dazed的自主移动选择。键盘输入路径的当前验收缺口见候选收尾表。\n\n飞行坠落落点、地图距离、环境解除由GM判断。原生Bloodied继续使用dnd5e/FVTT；Madness和Contamination不在本期范围。\n\n## 本地测试环境\n\nserver-mirror入口为 `http://127.0.0.1:30001/join`。真实组合验收使用 `cor-cotn`「溟渊的呼唤」，保留世界原有启用模组；历史隔离 E2E 使用 `fvtt-v14-module-matrix`，不能替代 CoTN 的组合证据。该服务按用户要求常驻到关机，测试任务只复用；清理仅限自己的临时对象和receiver，不停止Foundry。\n\n结束测试后恢复原场景、暂停状态。CoTN 当前用户要求保留 Trigger Engine 和 Custom Conditions 启用供手动查看，不恢复历史隔离测试中关闭 Custom Conditions 的配置。serverNext30002是独立环境，不自动安装或更新。\n","docs/runbooks/development-feedback-loop.md":"# 开发反馈闭环\n\n状态：2026-09-30 获用户授权，作为独立规范增量纳入 master。既有 worktree 需自行吸收该提交；历史审计记录不代表共用工具已实现或提速已测得。\n\n目标：更早得到能区分错误原因的真实反馈，减少重复准备、错误修复和证据转抄。简单、边界清楚的小修改继续用简短说明；完整合同只用于新外部接口、跨模块/版本/客户端、迁移或已经重复失败的工作。\n\n## 1. 开工：目标清楚再改，技术未知先查\n\n先用不超过一屏说清：要改变的行为、保留的行为、验收出口、候选工作树/环境，以及会影响方案的歧义。\n\n- 用户意图、功能归属、完成层级或写入授权存在两个会改变结果的解释：提出具体选项，先问清再做依赖它的操作；可继续只读调查。说明歧义将改变什么，不把问题变成让用户替代理设计实现。\n- 路径、版本、API或报错可以从项目/运行记录查到：先调查，不要求用户重复提供。\n- 不影响语义和授权的可逆细节：自行决定，必要时简记假设。\n- “借鉴开源”不能自动解释成依赖外部模块完成产品功能；“做完”不能自动解释成允许合并/生产发布。已有明确授权继续有效。\n\n## 2. 陌生接口：研究要转成约束\n\n先读精确版本的相关实现/同类真实项目；已有固定来源可复用，不为每个小改重新上网。用户明确要求调查的方向须执行，或以实际检索结果说明为何不适用。\n\n记录只需四项：来源/版本/许可；与本次问题相关的一条接口事实；本项目采用/不采用的差异；能推翻当前假设的最小检查。列链接或“已阅读”不算完成。\n\n对新hook、异步注册、持久化、权限或跨模块状态，先获得一条窄的真实边界记录或精确版本契约检查，再扩展规则和界面。测试的外部替身应依据记录校准，不能用自己想象的调用顺序作为唯一判定标准。\n\n找不到可借鉴实现时：写明检索范围与无匹配结论；从最小状态转移和两个竞争解释开始，用可区分它们的实验获取事实。不得用“没有上游”作为无限试错的理由。\n\n## 3. 失败：先分层，再选择下一动作\n\n| 层级 | 例子 | 下一动作 |\n| --- | --- | --- |\n| 工具/运输 | 宏语法错、显示空JSON、字段转抄错 | 修工具并做最低往返检查，不重打战斗 |\n| 环境/前置 | 玩家不拥有Token、错level/版本/场景 | 验证真实前置，修准确归属的测试准备 |\n| 外部协议 | hook顺序、message type、同步/异步注册误判 | 精确源码/事件trace/最小复现，更新契约fixture |\n| 产品行为 | 同一次合法伤害后没生成效果、物品字段丢失 | 保留真实失败输入，目标回归先红后绿，再复验受影响链 |\n| 判定/证据 | 已有正确事实，classifier要求不存在字段 | 分开行为结论与证据完整性，核原件，修判定器；不伪写PASS |\n| 授权 | 当前写目标超出已授范围 | 准备具体结果与目标，向用户问缺失授权 |\n\n同一失败指纹连续两次尝试没有新证据时，停止原路重试。下一步必须带来新信息：缩小复现、换能区分假设的探针、重新读相关版本实现或请求独立反驳。若缺的是产品决策，问用户；若缺的是技术事实，继续调查。这个检查点不是项目总时长上限。\n\n## 4. 先使执行工具可用，再派发\n\n复杂E2E/迁移派发前核对：\n\n1. 合同及源码绝对路径存在，worktree/branch与目标匹配；不要让执行者从master猜路径。\n2. 依赖检查的exit code和结构化结果都通过，之后才派发；检查失败不能因同一脚本下一条命令成功而被忽略。\n3. 新工具有最小输入→调用→显示/导出→保存→解析的往返证明；纯语法检查只证明语法。\n4. 父任务核实其可见的宿主能力并准备好文件；执行器建立后，在它自己的当前上下文核对有效权限、实际工具入口、模型/effort与目标，再做依赖操作。父宿主可用不等于执行器可用，未知项不凭prompt声明代替。\n5. callback含准确父线程UUID、dispatchId、contractRevision和receiptId；子代理通道、独立thread通道和浏览器页所有权是不同概念。发送成功、正确父线程实收、父审接受分别留证，不能用一个布尔值代替。\n\n环境基线记录精确dataPath、端口/PID、世界、Core/system、检查时点及当前共用情况。OS owner或旧快照不等于其他任务已释放服务；维护操作沿用已核实授权及协调记录，不新增逐次确认要求。\n\n独立Chrome仍按已授权技能/宿主路径执行。markHandoff表示保留页面，不表示跨thread转移所有权。不要用裸CDP或替代通道绕过工具拒绝。只读来源检索不需要浏览器任务。\n\n本项目普通Chrome执行任务默认为 `gpt-6.1-sol / medium`，主控与其他委派保持用户当时的设置。合同的模型／effort填写该执行角色的期望值，执行器读取自身最新实际上下文验证；配置变更后保存新的权限收据，旧收据不能证明新配置。已经通过且客户端／目标未变的浏览器能力检查可复用。记录配置变化时点与比较边界，不把不同配置下的耗时差直接宣称为流程提速。\n\n派发后只做已有目标必需且独立的工作；没有独立工作就结束父回合，等待结果事件。callback去重；不轮询、监控日志或制造工作维持活跃。有新失败证据可修正合同；旧合同的错误门禁应明确撤回，不能让执行者反复撞它。\n\n## 5. 验收：分层，复用，保持判定独立\n\n以下层级按任务选择，不是每个模块都跑一遍。沿用本项目已明确的迁移口径：官方明确支持且未本地修改的包只做包/依赖/启用/重登新增错误检查；本地修复增加受影响的关键行为验证。用户后来明确改变验收范围时更新当前合同。\n\n- 纯规则：输入/状态转移/幂等和边界。\n- 真实契约：固定版本的schema/hook/message及真实依赖的窄桥接。\n- 实际运行API：持久化、角色权限、事件时序和最终数据。\n- 少量UI：用户入口、窗口/选项、目标选择、拖放、实际应用动作与角色差异。\n- 整合：共享依赖/兼容组合/产物/手册，在集成边界执行。\n\n同类型组合优先下沉；只复验变化影响、失败或具体缺口。完整UI不代替低层测试，模拟测试也不代替真实边界。真实Actor/效果操作必须走产品正式入口，直接写期望结果不能充当验证。\n\n行为结果、证据状态、清理结果分开记录。自动分类不适用时保留原始标签，写清独立审查依据；不得因为看到PASS而跳过被测交互或图片内容。截图文件存在不证明截图正确。\n\n## 6. 共用工具与每个模块的边界\n\n复用当前Foundry Ops、WMP harness、构建身份和收据能力。共用部分只做环境/权限前检、run/fixture生命周期、trace关联、结构化导出、状态恢复与精确清理；每个模块提供小型case adapter和独立语义判定。worktree只保存本次身份与状态，不各造一套测试框架。\n\n在第二个真实消费者验证复用之前，不建通用DSL/调度服务/大型测试平台。测试工具本身按代码对待：失败退出、陈旧收据拒绝、显示/文件往返、销毁归属有对应检查。\n\n## 7. 状态和继承\n\n一个任务有一个当前状态源；历史是只读证据。当前状态至少含目标、实际路径/环境、唯一case、已接受证据、当前失败层级、下一动作与授权来源。可从工具生成的ID/版本/哈希不再让模型手填。\n\n新thread先读当前状态并校验身份；旧STOP/已取消门禁必须带superseded状态。产品使用说明不嵌入每次测试进度；文档与运行代码指纹分开设计。相关产物/环境未变是复用证据的充分条件之一；有据可审查的影响分析也可以说明旧结果仍适用，并列明需复验的受影响路径。身份检查防止混用构建，不代替语义影响判断；未知影响不擅自免测。\n\n规范/可复用工具改动尽量作为可独立审查的小增量集成。commit/合并/push仍遵既有明确授权；未合并的worktree规则不宣称全项目生效。全局skill或memory不在本次候选中修改。\n\n## 8. 文件侧工具第一版\n\n入口为 `bun run foundry:ops acceptance \u003cprepare|ready|execute|collect|resume>`。它只实现已授权的本地文件检查、合同身份绑定、失败阻止派发、一次执行与收据往返。请求格式、退出码和具体步骤见 [Foundry Ops 说明](../../tools/foundry-ops/README.zh-CN.md#共用验收工具文件侧第一版)与[请求示例](../templates/development-feedback-request.example.json)。\n\n完整任务合同的 runtime、fixture、callback 和人工介入计量仍是后续能力；本版不执行 Chrome、不修改世界、不替模块判定玩法。父宿主可通过 `dispatchPrepared()` 接入实际派发，在失败时回调调用次数为零。只运行 `ready` 再自行派发的宿主仍需自己处理两步之间的身份变化，不能宣称已完成该集成。\n\n后续增量已有 Vision5e + Item Macro 的离线批次 adapter、跨工作树只读来源绑定及参考收据导入。具体步骤见 [第二个消费者](../../tools/foundry-ops/README.zh-CN.md#第二个消费者vision5e--item-macro-离线接入)。`ready` 表示文件检查可运行；`ready-batch` 的运行派发门禁单独报告。离线合同保留原暂停状态、运行授权 NONE 与回调归属，不能把离线准备或数据标签升级为真实批次接受。明确恢复后的限定实机链、独立父审和精确清理已完成，证据与剩余范围见 [实机闭合记录](../reviews/2026-09-30-development-feedback-next-vm-runtime.md)；其他迁移批次仍暂停。\n\n已明确恢复的同一批次可用 `prepare-runtime`／`ready-runtime`／`claim-runtime` 建立独立运行合同，核对最新执行聊天配置及现存服务身份后领取一次宿主派发；旧文件侧合同不会升级权限。`collect-runtime` 保存原生观察与实际证据指纹，保持父审待完成，界面和完整清理由父任务独立核对。说明见 [已恢复的实机批次](../../tools/foundry-ops/README.zh-CN.md#已明确恢复的-vision5e--item-macro-实机批次)。该增量不安装、不启停服务、不直接操作 Chrome，也不替代跨线程运输回执。\n\n接续前先读任务的当前状态，再对照对应独立验收记录。共用收据的 INCOMPLETE／PENDING 是自动层的判定边界；父审可以另行接受已核对的限定行为、恢复和清理，而无需改写原收据。已闭合批次不因自动层仍待人工判定而重放；历史合同、失败包和原件继续只读保留。新的候选、范围或实际缺陷按新的任务边界处理。\n","docs/runbooks/dnd5e-version-following.md":"# dnd5e 双版本线：资料查询、版本比较与 Next 更新\n\n## 选择版本线\n\n- **5.x 固定线**：开发与验收固定 dnd5e 5.3.3，不因 6.x 更新而升级 Mirror。5.3.3 当前也是官方最新稳定 5.x；若官方以后补发 5.x，先单独核对，不自动跨系列。\n- **6.x 跟随线**：ServerNext 使用官方最新稳定 6.x，不把某个补丁版本设为永久上限。排除 draft、prerelease、master／开发分支及 7.x。\n- V12 逐步弃用是已确定方向；本次不删除兼容代码或改变 CLI／Web 默认选择。正式生成器的现有 5.3.3 projector／来源验收不自动等于支持所有 6.x。\n\n## 开工时的最短流程\n\n1. 任务先写清 5.x 或 6.x、目标实例及行为出口。5.x 的目标就是 5.3.3；6.x 从[官方发布 API](https://api.github.com/repos/foundryvtt/dnd5e/releases?per_page=100)选最新非 draft、非 prerelease 的 `release-6.*`，按版本号比较。这里的“最新”来自官方发布，不来自 Context7 排序。\n2. 读取对应本地 `system.json`，涉及运行任务还核对正常客户端的实际版本、Core、world、dataPath、端口／PID和服务共用情况。不能拿源码缓存版本当作已安装版本。\n3. 以确定后的精确目标查询 Context7：5.x 写 `release-5.3.3`；6.x 写本次官方稳定 tag，例如 `release-6.0.5`，同时限定单一接口问题。结果必须检查引用来源；如果仍是 Wiki、master、6.0.x 或其他版本，只作为导航，回到目标 tag／提交的本地源码确认。\n4. Next 系统落后时，在本 thread 已明确的本地 6.x 跟随授权内，先完成系统更新和针对性验收，再开始依赖该版本的新开发。不因“文档较新”直接更新系统；先核官方稳定发布、Core 要求、当前已启用模块全集的 manifest 范围、代码版本门／本地适配及真实服务归属；不能仅抽查几个关键模块。\n5. 本地系统已有更新而缓存较旧，只补相应版本的源码资料；本地系统比发现结果新时重新检查发布来源，不自动降级。5.x 不因查询到了 6.x 片段而更新。\n6. 记录当前实装系统、Core、固定源码提交、候选及本轮接受证据。精确版本记录服务于复现，不限制以后更新。历史 PASS 保留旧目标；影响明确且无变化的检查可复用，有变化的行为才重新核对。\n\n## 已有资料如何复用\n\n共享源码缓存由 `FVTT_REFERENCE_CACHE_ROOT` 定位，本机配置为 `F:/FoundryLab/reference-cache`；不同 worktree 复用同一套版本化资料，不各下载完整手册。\n\n- 5.3.3：`dnd5e/5.3.3/repo`，由 `dnd5e-5.3.3` 清单登记。\n- 当前官方稳定 6.x 的已取得源码：`dnd5e/6.0.5/repo`，由 `dnd5e-current-6` 清单登记精确提交；下一次升级同时更新该条目的 revision／target，而非永久固定 6.0.5。\n- `references/dnd5e-6-current/system.json` 是对应官方发布清单，说明取得的目标，不证明 Next 已完成安装。\n- 本机旧 Foundry API 镜像 `14.361` 仅作导航；精确 Core 行为核对实际安装源码及发布说明。\n\n离线校验使用 `bun run references verify`。现有 CLI 校验整个清单，不提供按额外位置参数筛选的保证。\n\n当前 bootstrap 在替换已有缓存时会临时移动旧目录；它不能用作本项目无备份规则下的已有缓存升级路径。只在目标全部不存在的首次获取中评估它。更新已有共享资料时先核源仓库和旧 checkout 干净，获取官方固定 tag 后创建新的版本化引用 checkout，可复用 Git 对象；不复制整个 dirty 工作区，不改变旧版本 HEAD。本次用既有 6.0.2 源仓库的 Git 对象取得 6.0.5，新 checkout 不作为运行实例或回滚备份。\n\n## 系统更新的范围和验收\n\n使用正常 Setup 系统更新入口，只处理 ServerNext 的 dnd5e。维护前保存必要清单、版本与来源字段的读回证据，不创建世界／安装目录备份；不直接编辑运行中 LevelDB，不连带升级 Core、Mirror 或生产。\n\n检查发行说明与当前已启用模块全集，包含自有模块代码中精确版本比较；6.0.x 修补以正常启动、受影响代表行为及必要持久化核对为主，不默认重跑整个迁移或全模块矩阵。6.1／6.2 若改变接口或增加功能，按实际影响扩大检查。普通更新无需重新决定“要不要跟随6”；需要 Core 更新、跨7、共享服务协调或处理数据异常时，按具体问题处理，不静默扩大范围。\n\nContext7 检索、源码取得、包安装、客户端启用、功能接受和资源清理分别报告。一个层级通过不能替另一个层级；现有专属 adapter／收据的旧版本身份不会自动变成新版本接受。\n\n## 接续与检查时机\n\n每次开始与系统版本相关的开发或维护时做一次官方／本地比较。没有新目标或变化证据，不重复取得缓存、重放迁移或重复浏览器场景。\n\n本流程没有安装后台定时任务，不能保证在发布瞬间自动发现更新。若以后明确设置监测频率，应使用宿主原生 automation；不要由 Chrome 执行聊天轮询，不建立 watcher 等待浏览器回调。\n\n执行依据见[本次版本策略和核查记录](../reviews/2026-10-01-dnd5e-version-following-policy.md)、[开发反馈闭环](development-feedback-loop.md)与[资料路由](foundry-v14-development-source-routing.md)。\n\n本次反例：系统6.0.2→6.0.5安装成功，但10个自有模块因maximum=6.0.2被自动停用，其中至少5个还有运行代码版本门。不能改高清单上限后就宣称兼容；按新增模块范围处理适配、原开关恢复及受影响行为，未闭合前报告系统已安装／模块组合未接受。\n","docs/runbooks/foundry-v14-development-source-routing.md":"# Foundry v14 / dnd5e 双版本线开发资料与工具路由\n\n## 目的\n\n本指南帮助后续 thread 按任务类型选择最短且可信的资料来源和工具。它不是一条必须逐项执行的固定流水线，也不要求每个任务同时查询所有来源。\n\n正式生成器未指定目标时仍显式使用 Foundry `14.364` / dnd5e `5.3.3` / `core`。系统相关开发区分 5.x 固定 5.3.3 与 Next 跟随官方稳定 6.x，先按[双版本线流程](dnd5e-version-following.md)比较官方发布、本地实装和资料身份；6.x 的实际 Core／系统目标以当次核对为准，不永久卡在 6.0.2，也不把所有 6.x 宣称已支持。\n\n选择资料时始终区分三种证据：\n\n1. **发现与导航**：帮助找到类、Hook、源码文件或可能的实现方式。\n2. **精确版本静态证据**：证明目标版本确实有该字段、签名、Hook、schema 或行为实现。\n3. **真实运行时验收**：证明代码在目标 Lab 中按用户目标工作。\n\n发现证据不能自动升级为精确版本证据；静态证据也不能自动升级为运行时验收。\n\n## 可选资料来源\n\n| 来源或工具 | 最适合 | 不能单独证明 |\n|---|---|---|\n| `references/` 与配置的共享 reference cache | 锁定 dnd5e `5.3.3` 及当前取得的稳定 `6.x` 源码／发布证据；正式生成模板仍按各自已有支持边界 | Foundry UI、Hook 或 Activity 在真实世界中已正确工作 |\n| Context7 `/websites/foundryvtt_api_v14` | 快速定位 Foundry v14 `Document`、`ApplicationV2`、Hooks、Canvas 等 API | 页面对应的具体 minor build 一定是 `14.364` |\n| Context7 `/foundryvtt/dnd5e` | 5.x 查询指定 `release-5.3.3`；6.x 先由官方确定稳定 tag，再带 tag 查询概念／接口 | 查询里指定版本不保证结果固定；Wiki、master、6.0.x 返回只作导航，不能当目标静态证据或最新版探测器 |\n| [Foundry v14 官方 API](https://foundryvtt.com/api/v14/) | 核对 public/protected/private 边界、签名和官方说明 | 未标明 minor build 的页面等于 `14.364` 精确实现 |\n| [Foundry 14.364 发布说明](https://foundryvtt.com/releases/14.364) 与本机安装源码 | 核对 `14.364` 差异、实现细节和实际可用 namespace | 模块在目标世界中的最终行为已经通过 |\n| [dnd5e 官方源码](https://github.com/foundryvtt/dnd5e) 与锁定提交 | 核对 `5.3.3` Actor/Item/Activity/Hook/migration 实现 | Wiki 或新分支内容可无条件回推到 `5.3.3` |\n| [dnd5e Wiki](https://github.com/foundryvtt/dnd5e/wiki) | 理解设计意图、扩展点、Hooks、Enrichers、Advancement 和 Pack 约定 | 可变 Wiki 页面是不可变版本证据 |\n| [Foundry VTT 官方 CLI](https://github.com/foundryvtt/foundryvtt-cli) | package 选择、Compendium pack/unpack、内容迁移、fixture、往返验证和受控本地启动 | Actor/Item 生成正确、运行时 Hook/UI/Canvas 正确或生产写入已获授权 |\n| [DFreds TypeScript 模块模板](https://github.com/DFreds/dfreds-module-template-ts) | 参考 Vite、TypeScript、类型组织、Compendium 脚本和发布自动化 | 模板依赖版本与本项目 `14.364` 完全相同，或整套结构适合当前 Bun workspace |\n| [Foundry 系统 boilerplate](https://github.com/asacolips-projects/boilerplate) | 只有在开发全新 game system 时提供概念参考 | 它适合当前 dnd5e Actor/Item generator 或代表 v14 当前实践 |\n| GitNexus MCP | 索引新鲜时理解跨 package 调用链、影响范围和当前 diff | 图谱比当前 Git HEAD 更新，或图谱结论等于运行时语义 |\n| Foundry MCP | 连接到已核对身份的本地 Lab 后做只读检查、Document 读回和受控行为辅助 | MCP 返回 `ok` 等于语义验收，或连接目标天然是本地而非生产 |\n\n联网搜索仍遵守全局 AnySearch 优先与显式回退规则。搜索结果用于发现候选来源；版本相关实现结论应回到上表中的精确版本来源。\n\n## 按任务选择最短路径\n\n### Foundry 核心 API、ApplicationV2、Document、Hooks 或 Canvas\n\n推荐从 Context7 v14 索引快速定位名称和官方页面。实现前核对官方 v14 API 的可见性标记；涉及 `14.364` 行为、内部实现或 minor 差异时，再查本机 `14.364` 源码和发布说明。完成后按功能风险进入本地 Lab。\n\n在尚不知道精确类名和文件路径时，不要求先扫描全部本地源码；Context7 可作为更快的入口。也不得因为 Context7 返回了代码片段，就跳过目标版本复核。\n\n### dnd5e Actor、Item、Activity、Advancement、Hook 或迁移\n\n优先使用版本清单指向的源码：5.x 为 `.local/references/dnd5e/5.3.3/repo`；6.x 为 `dnd5e-current-6` 对应的本次稳定版本 checkout，实际路径按 `FVTT_REFERENCE_CACHE_ROOT` 解析。Context7 和 Wiki 用于发现概念／文件；引用没有对应精确版本时，回到本地固定提交确认。资料与系统哪个较旧分别处理，不能仅凭搜索片段触发安装。\n\n开始前运行 `bun run references verify`。新的 topic worktree 不一定包含 Git 忽略的默认 `.local/references`；此时使用已配置的 `FVTT_REFERENCE_CACHE_ROOT`，或按 `docs/REFERENCE_INDEX.md` 核对首次获取条件；已有有效缓存不走会移动旧目录的 bootstrap 更新路径。不得为了让路径出现而复制另一整套 reference cache，也不得把缺失缓存静默降级成“最新版”资料。\n\n生成数据还必须经过项目 projector/verifier 和来源语义核对；模块行为分别在该任务确定的 5.x／6.x 目标验收；5.3.3 已有证据不自动证明升级后的 6.x。\n\n### Parser、Intake、生成器或 verifier 新功能\n\n核心路径仍是项目 source → IR → workflow → generation → verifier。资料源用于确认目标 schema 和运行时语义，不能替代项目正式输出路径。\n\n只有当接受后的 Document 需要进入 Compendium、Adventure 或发布包时，才在下游评估官方 CLI。\n\n### 新 Foundry 模块、Hook、UI 或 Canvas 功能\n\n先读 `foundry-modules/AGENTS.md` 和目标模块的局部规则。API 导航可用 Context7；精确行为用官方 API、锁定 dnd5e 源码和本机 Foundry 源码；最终用模块 test/build 与真实 Lab 行为验收。\n\nDFreds 模板只做选择性参考。默认复用本仓已经验证的模块 build/install/verify 边界，不整套引入另一套 npm、Jest、启动或发布结构。\n\n### Compendium、Adventure、内容模块或批量迁移\n\n以下任一条件成立时，应评估官方 CLI：\n\n- 新功能生产或消费 Compendium；\n- 需要 pack/unpack、Folder 保真或 Adventure 展开；\n- 需要把真实 Pack 变成可版本控制 fixture；\n- 需要 Document 迁移、规范化或往返比较；\n- 需要受控地启动指定本地 Foundry/world。\n\n官方 CLI 自身的工具版本不等于 Foundry target 版本。首次采用或升级 CLI 时，先核对 GitHub Release 与 npm 发布版本，在 topic worktree 中锁定精确版本，只对随机临时根或明确构建目录做 Trial。比较 Document、UUID、embedded documents、Folder、索引、逻辑 hash 和 Foundry 实际加载后，才能把它接入正式 package adapter。\n\n官方 CLI 不得绕过项目 CLI/workflow 生成正式 Actor/Item，不得直接修改运行中的 World，也不得把 launch 成功冒充 PID、端口、dataPath、world 和 HTTP 验收。生产安装、迁移、重启或 LevelDB 写入仍需要当次明确授权。\n\n### 全新 game system\n\n只有用户明确要开发独立系统而不是 dnd5e 模块/内容时，才调研 system boilerplate。使用前必须重新核实模板的目标 Foundry 版本、DataModel/ApplicationV2 现代化程度和维护状态；不得从旧模板推断 v14 API。\n\n## 本机 MCP 与代码理解工具门禁\n\n- Context7：已知 library ID 可直接查询；未知或歧义时先 resolve。查询应包含目标版本和单一具体概念。\n- GitNexus：使用前读取 repo context；索引落后 HEAD 时先决定是否在本次任务范围内刷新，未刷新则只把结果当历史导航。\n- Foundry MCP：第一次调用先读取 world/version，并核对端口、app、dataPath/profile 和 world。未连接或身份不明时，不用它做验收，更不执行写入。\n- GitHub MCP：适合仓库、PR、Issue、CI 和发布证据，不替代本地 checkout 的精确代码审查。\n\n工具当前不可用时，报告精确失败与回退来源；不得为了保持工具链外观而伪装已调用或静默降低证据层级。\n\n## 最终证据记录\n\n版本相关实现的最终报告至少说明：\n\n- 使用了哪些发现/导航来源；\n- 最终核对的精确版本、提交、发布或本机源码；\n- 做了哪些机械检查；\n- 做了哪些人工/语义或真实 Lab 验收；\n- Context7、Wiki、模板、CLI 或 MCP 结果中仍有哪些版本漂移或未验证边界。\n\n只调用了发现工具而没有精确版本证据时，只能报告候选设计或待验证结论，不能声称目标版本支持。\n","docs/runbooks/handbook-maintenance.md":"# 中文工具手册：维护与合并\n\n## 日常打开\n\n双击仓库根目录 `工具手册.html`。这是包含中文工具说明、全文搜索、分类目录、命令和选定原始文档的单文件页面；不依赖 Bun、Foundry、网络、CDN 或后台服务。\n\n推荐收藏 **master 工作区里的文件**，或给该文件创建桌面快捷方式。功能和手册一起合并后，刷新这个页面即可。单独复制到其他位置的 HTML 是当时的快照，需要重新复制才会更新；没有文件监控或远程自动更新。\n\n## 内容放在哪里\n\n- `docs/handbook/catalog.json`：生成器、资料处理、检查与开发工具。\n- `docs/handbook/modules.json`：每个 Foundry 模块的独立用户说明。\n- `docs/handbook/reviewed.json`：作者对照实现和来源后的核对日期、说明与内容指纹。\n- `docs/handbook/template.html`、`style.css`、`client.js`：离线页面。\n- `docs/handbook/build.mjs`：构建与只读一致性检查，不修改生成器和 Foundry。\n- 根 `工具手册.html`：确定性生成、随功能一起提交的用户交付物，不能手工修补。\n\n## 每次完成新功能或修改旧功能\n\n1. 在同一个功能 worktree 中更新对应条目的用途、选择时机、准备、操作步骤、产物和限制。新增模块必须有独立条目；新增 app/package/tool 必须登记 `watch` 归属。共享实现可被多个条目关注。\n2. 核对 `sources` 中的权威 Markdown 和实际入口。来源出现矛盾时优先查明实现与最新支持边界，在条目中明确限制；不能把历史文档的“通过”提升为当前运行时通过。\n3. `watch` 覆盖对应实现目录或文件。检查读取 Git 已跟踪和未忽略的新文件，忽略测试、scratch、dist；生产逻辑、文档或入口变化会使指纹过期。不要缩小 watch 来绕过检查。\n4. 查看受影响条目：\n\n   ```powershell\n   bun run handbook:status\n   ```\n\n5. 对照确认后，记录具体核对内容。下面的 `\u003cid>` 替换为报告里的真实 ID；多个已经核对的 ID 可用逗号分隔。\n\n   ```powershell\n   bun run handbook:review -- \u003cid> --note \"已对照入口与来源，更新新功能步骤和适用限制\"\n   bun run handbook:build\n   bun run handbook:check\n   ```\n\n   若实现变化确实不影响用户说明，也必须写明核对结论，例如“仅调整内部缓存，入口、结果与限制保持一致”。review 是作者确认记录，不是自动语义验收，不可盲目批量确认。\n\n6. 实际双击 HTML，检索新功能，打开受影响条目，对照文义和命令。如果修改页面交互，还要检查桌面与窄屏、主题、返回导航、深链接和复制命令。修改检查器运行 `bun run handbook:test`，它在随机临时仓库验证失效来源、新工具漏登记和过期页面等拒绝路径。变更测试或运行器时，可用安全入口 `bun run handbook:test:bun` 有界核对全仓 CI 所用的 Bun runner 兼容性，不直接执行内部 raw 脚本。\n7. 在已有发布授权范围内，把实现、说明、核对记录和生成页面一起提交并合并到 master。合并产生新组合时，重新核对受影响条目并生成页面；不要保留两侧都已过期的 HTML。\n8. 合并后在 master 运行 `bun run handbook:check`，刷新固定入口并检查本次新增/修改条目。记录同步结果；用户基线、索引与发布门禁仍按 worktree runbook 执行。\n\n## 自动检查会做什么\n\n`handbook:check` 接入 `ci:verify`。它会拒绝缺失来源、重复 ID、无效步骤、不存在的 Bun 命令、内部 raw 测试入口、新工具目录未登记、实现/来源指纹过期，以及生成 HTML 和当前内容不一致。\n\n检查不会自动改写文字，不访问网络，不安装 Git hook，也不会自动 commit、merge 或 push。默认 build 同样不会更新核对记录。仓库 CI 的失败会报告不同步；是否阻止远端合并由仓库既有分支保护设置决定，本任务没有修改该设置。\n\n使用已提交 HTML 是刻意的：这样仅凭仓库文件就能阅读。合并同时带来新的说明和页面，不要求用户每次打开前再启动构建器。\n\n## 内容边界\n\n- 常规生成示例显式使用 v14/core，默认 icon-mode off；专门的图标操作才展示 safe。\n- 原始文档按原文离线展示，其中可能有历史状态和旧运维例子。当前推荐操作以人工核对的条目为先。\n- 当前旧 Vault Sync 的备份行为与用户无备份规则冲突，手册明确标注，不提供默认执行捷径。模块安装、迁移等旧文档也不能绕过无备份和授权规则。\n- 不把 `.local`、私有文档、真实生产地址或凭据加入 sources。不要将“构建可打开”写成“功能全部实测通过”。\n","docs/runbooks/midi-qol-source-patch-build-install.md":"# Midi-QOL 锁定源码、补丁、构建与 ServerNext 安装\n\n本流程只用于 Foundry 14.368 / dnd5e 6.0.2 的 `server-next`。`server-mirror` 是只读来源，工具会拒绝将它作为安装目标。\n\n## 1. 先检查官方更新\n\n```powershell\nbun run midi-qol:upstream-check\n```\n\n结果会列出官方分支、最新 release、开放 MR 中与当前修复相关的差异，以及锁定分支是否前进。该检查是决策证据，不会改变 `upstream.lock.json`；构建始终使用锁定的完整提交 SHA。\n\n如果官方已包含适用修复，先更新来源锁定并删除重复补丁，再运行下面全部检查。不能只根据版本号或说明文字认定问题已经修复。\n\n## 2. 构建本地候选\n\n```powershell\nbun run midi-qol:build\nbun run midi-qol:test\n```\n\n构建在仓库忽略的 `.local/midi-qol` 下重新取得锁定源码，校验 `package-lock.json` 与补丁 SHA-256，先记录未打补丁的 TypeScript 诊断，再应用补丁并比较候选诊断。补丁不能精确应用或诊断新增时停止。\n\n真实源码回归测试读取这个锁定 checkout；首次使用须先构建准备源码，已有同一候选源码时直接运行测试即可。测试会验证源码身份、执行真实方法及逐入口负向变异，并用实际 Foundry common helper 复现 dnd5e 的缺 ID 迁移碰撞。此离线模型测试只读取固定版本文件，不连接数据库或启停服务。\n\n构建不读取或修改 `I:\\OpenCode\\remote\\builds\\midi-qol-beta-dnd6-4338eeab`。它不会调用上游 `dev`、`clean` 或 `tag`，不会写 Foundry 数据目录。候选 ZIP 与 `build-result.json` 位于 `foundry-modules/midi-qol/dist`；`dist` 不进入 Git。\n\n## 3. 预览安装门禁\n\n```powershell\nbun run midi-qol:install\n```\n\n默认只验证候选包和目标身份：数据根必须精确为 `F:\\FoundryLab\\foundry-v14\\data\\server-next`，世界必须是 `cor-cotn`，Foundry/dnd5e 必须为 14.368/6.0.2。30002 必须未监听，`options.json.lock` 必须不存在，且任何进程命令行都不能引用该 dataPath；无法读取进程所有权时 fail-closed。ZIP 必须只包含 `midi-qol/`，manifest ID 必须保持 `midi-qol`，解压树不得含 symlink/junction。\n\nServerNext/30002 由用户管理为永久运行的共享环境。本任务不得启停或重启；E2E 使用现有服务，只操作自己标记的测试文档。完整包安装器保持停止状态门禁，不能为了安装而停止服务。候选工具当前只接受 local.7 → local.8 的独立浏览器资源入口；local.7 的 A–G/Z 35 项历史验收已关闭，local.8 的新效果创建修复仍须单独做浏览器验收。local.4 在源码审查被拒绝、未部署。旧 PID、旧 handoff 和“本轮曾启动”均不构成停止权限。\n\n### 常驻实例的受限浏览器资源更新\n\n```powershell\nbun run foundry-modules/midi-qol/browser-update.ts\nbun run foundry-modules/midi-qol/browser-update.ts --apply\n```\n\n先预览，只有明确 `--apply` 才替换资源。该入口只接受锁定 local.8 构建与已知 local.7 包之间的浏览器 bundle、source map 和版本 manifest 差异，验证真实目标与监听进程，并保留原 compendium 和世界。它不调用启停、不覆盖整个模块目录、不创建备份；检查失败停止。更新后重新核对磁盘和 HTTP 返回的 bundle 哈希及原 PID。\n\n服务器可能继续缓存 local.7 的 manifest 版本。不要把缓存 UI 版本当作新代码已加载的证据：测试宏从候选 ZIP 生成两项 cleanup 方法、`Workflow.item/activity` getter、伤害目标渲染、附魔 clone，以及 `CONFIG.ActiveEffect.documentClass.prototype._initializeSource` 的源码指纹。getter 用属性描述符读取函数，不执行取值；local.8 必须比对新增 `_initializeSource` 指纹，否则仍加载的 local.7 会被误判为候选。分别记录候选和缓存版本，只在当前场景完成后刷新自己的标签页（控制链失联时允许恢复自己的页面，并先读回不确定操作是否执行）。该入口不适用于含服务端元数据/依赖变化的其他更新，也不是冷启动验收。\n\n## 4. 安装到停止状态的 ServerNext\n\n确认 dry-run 通过后：\n\n```powershell\nbun run midi-qol:install -- --apply\n```\n\n安装器先把候选解压到 ServerNext 模块目录中的本次临时 staging，再删除旧 `midi-qol` 并原地改名。它不创建备份，不修改世界数据库或模块启用配置。任一身份、端口、归档或路径检查失败即停止。\n\n停止状态安装流程属于历史/未来协调入口，当前永久服务不执行它。历史 cold-start smoke 单独保留；浏览器资源更新后核对 ZIP、manifest、磁盘及 HTTP bundle 哈希，再进行当前 C/F 验收。真实玩法由独立 Chrome 任务执行；测试临时对象必须清理，不能用静态检查或服务器启动代替玩法结论。\n\n### 2026-09-24 local.9 的精确离线更新边界\n\n本次 ServerNext 迁移已获用户持续推进授权，可在共享世界没有其它操作且正常关闭后受控停/启**同一**服务；此为本次任务的具体授权，不修改上面通用安装器的停止门禁。local.9 的[只读差异预检](\u003cF:/FoundryLab/foundry-v14/evidence/server-next-migration/midi-local9-controlled-update-20260924/preflight-path-diff.json>)发现候选 ZIP 与安装目录的 **107 个非 pack 文件路径完全相同，只有 `midi-qol.js`、`midi-qol.js.map`、`module.json` 三项哈希不同**；但两个已安装 pack 的 LevelDB 文件路径与 ZIP 不同（候选12项、安装18项）。全包安装器会删除并替换整个模块目录，超出这个补丁的文件范围，不能用于本次 local.8→local.9 更新。运行世界时没有读取 pack 数据库内容。\n\n先核对当前 local.8 的 manifest/bundle 哈希、local.9 锁定构建 ZIP SHA-256 `039E766D07A80C832CF610128B58C590CA438BADF2298209BA0B04E21D1AC432`、精确 PID/dataPath/world/port，并确认所有本轮 Chrome 临时对象已清理。通过正常 Foundry UI 返回 Setup；父任务独立核对 `/api/status active=false`、23个世界 `LOCK` 文件全部可独占打开，才停止精确 Node PID。服务完全停止后对安装目录全部文件做完整清单/哈希比较，尤其核对 pack 仍为原安装内容；**只**将候选三项经同目录临时文件哈希校验后原子替换，不新建备份、不删除或替换 pack。任何额外差异、链接、占用或读回失败均停下报告，不启动不完整模块。\n\n更新后三项与候选哈希匹配、其余安装文件与原哈希一致，再按原 app/data/world/loopback 参数恢复常驻服务。分别核对磁盘/HTTP资源、当前世界模块加载、真实 Chrome 的手动 APPLY 前后 HP/临时 HP 与基础 DAE `isDamaged` 到期；带类型 `isDamaged.\u003ctype>` 仍是候选已知限制，不能因基础路径通过而提升。旧 `browser-update.ts` 仅锁定 local.7→local.8，不可用于 local.9。本段是受控现场操作边界，不是替代完整安装器的一般命令。\n\nChrome handoff 必须写明“服务器由用户永久运行，结束时不得停止”。执行器只清理自身临时文档；不得退出或中断其他线程使用的服务。\n\n## C/F 已配置夹具\n\n运行 `bun run midi-qol:prepare-cf` 生成 `dist/cf-fixture/cf-macro.json` 和同目录 `cf-macro.js`。这是测试用 Script Macro，通过 Foundry 原生 API 创建临时文档，不是正式 Actor 生成输出。\n\n在 30002 的 GM 会话导入名为 `E2E-MIDI6-CF-20260920-Harness` 的宏，执行后按面板顺序操作：\n\n1. **Prepare and verify**：创建被标记的两个 NPC、嵌入法术及临时 Scene；只切换本客户端 view，不全局激活 Scene。必须看到 PRECHECK PASS，核对 1 minute、Circle 30 ft、creature、120 ft、非专注、template prompt=true 与 MidiUtilityActivity。\n2. **Cast and place Circle**：调用实际 `activity.use`；在画布目标 Token 附近放置圆形预览。不是直接创建模板或直接构造预期 effect。\n3. **Inspect effect and links**：读回真实清理 effect 的 type、system model、duration、UUID 和全部模板 dependentOn。错误、类型为 condition 或无 effect 均记录，不以 toast 消失替代结论。\n4. **Delete cleanup effect only**：只删除已验证唯一关联的 base effect，等待并核对对应 Region/Template 是否由真实依赖实现删除。夹具不帮这一步删除 Region，因此不会伪造 cascade PASS。\n5. **Export evidence JSON**，然后 **Cleanup owned fixture**，再导出清理后报告。面板同时提供 Troubleshooter 入口。构造器探针只作模型诊断，不计 C/F 通过。\n\n宏不修改任何全局 Midi 设置、不重写 prototype/Workflow、不停止服务。若前置条件不符或执行失败，保留诊断，使用清理按钮删除标记对象；实际临时文档准备和读回必须单独记录，不能把生成测试输入称为运行时准备完成。\n\n## 5. 结果边界\n\n- `midi-qol:test`：锁定源码方法行为、迁移碰撞对照、夹具前置校验及安装拒绝路径；不能代替真实 model/cascade 验收。\n- `midi-qol:build`：来源、补丁、类型诊断和打包可重复。\n- dry-run：候选包及停止状态 ServerNext 身份可安装。\n- 冷启动 smoke：服务器能加载世界和模块。\n- Chrome A–G：攻击、法术、DAE、专注、反应、模板及 Console 的真实行为。\n\n每一层分别记 `PASS`、`FAIL` 或 `NOT_EXECUTED`。本流程不包含 commit、merge、push、公开发布或远程生产回迁。\n\n当前总验收入口为 [A–G 打钩清单](../plan/midi-qol-ag-acceptance-checklist.md)。每次派发列出固定测试编号、已过不重测和未执行项；父方复核原始证据后打钩。2026-09-21 用户单独授权的服务故障恢复已完成，这不授权执行器在日常 E2E 中启停共享服务。\n","docs/species-ai-intake-v14.md":"# Species AI Intake：TXT → Markdown → Foundry V12/V14 race/feat\n\n`--intake-species` 是不规则 TXT 或已人工编辑 Species Markdown 的正式入口。允许的精确目标只有 Foundry `12.331` / dnd5e `4.3.9` / `core` / 2024（`V12 static candidate`），或 Foundry `14.364` / dnd5e `5.3.3` / `core` / 2024（保留既有 V14 运行验收）。V13、legacy/2014、`modded-v12` 和第三方模块兼容均 fail-closed。\n\n## 数据链与状态\n\n```text\nTXT → discovery → Species Evidence IR → deterministic Markdown\n    → parser → target race/feat package → target validator → AI review\n    → accepted ledger → 独立模块 build\n```\n\n一个 TXT 最多发现 50 个互不重叠候选。每个候选单独得到 `accepted`、`needs_review` 或 `failed`；整次运行可为 `succeeded`、`partial`、`needs_review` 或 `failed`。运行包位于 `.local/species-intake-runs/\u003crun-id>/`，保存不可变来源、discovery、逐候选 IR、Markdown、JSON package、确定性报告、AI review、provider audit 和 manifest。\n\nAI 不直接编写正式 JSON。证据范围、完整 coverage、字段范围、mechanic allowlist、Markdown parser、目标 projector、package validator 与 AI cross-review 全部通过后，候选才会推广到：\n\n- V14：`input/species/\u003cidentifier>.md`；V12：`input/species/v12/\u003cidentifier>.md`，两个目标的已接受来源分别保存，避免一次修改使另一个版本的 ledger 失效。\n- V14：`output/species/\u003cidentifier>.json`\n- V12：`output/species/v12/\u003cidentifier>.json`\n- `output/species/accepted-ledger.json`\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为唯一身份，V12 与 V14 可以共存且互不覆盖。schema v1 只解释为 V14/core/2024；读取、验证或 build 不会改写旧 ledger，只有一次新的成功 promotion 才原子升级为 v2。同一目标的 Markdown、package、ledger hash 必须闭合，另一目标的 package 不能冒充证据。\n\n## Markdown 契约\n\nSpecies Markdown 的 frontmatter 使用 `layout: species`、`species-schema: 1`、稳定 identifier、2024 rules、生物类型、体型、移动、感官、私有 homebrew 来源哈希与精确 UTF-16 长度，以及显式 feature/part ID。正文每个特性都有 `species-feature:\u003cid>` 稳定标记；文末的原始资料区按记录长度逐字符保留候选全文，包括首尾空白和 CRLF。\n\n允许的 v1 mechanics 只有：\n\n- `descriptive-passive`\n- `gm-assisted`\n- `external-rule`\n- `hp-per-level`\n- `ac-bonus`\n- `limited-utility`\n\nMarkdown 不允许填写任意 Foundry system path 或任意 Active Effect change。复杂但来源明确的规则可以诚实地以 `gm-assisted` / `external-rule` accepted；必须保留完整规则、触发条件和未自动化边界，不能用空 Utility 冒充实现。\n\nEvidence IR 使用字段级 claim：身份、规则版本、生物类型、体型、移动、感官和每个 feature 都必须有唯一 JSON-pointer path 与精确来源区间。coverage 必须无缝分割候选，并与这些 claim 双向引用；`ignored-with-reason` 必须写明原因。一个笼统的 `/species` claim 不能通过晋升门禁。\n\n## 命令\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nV12 static candidate 使用同一入口：\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 12 `\n  --effect-profile core\n```\n\n`--dry-run` 不调用 provider、不创建 run bundle、不推广正式文件。V13、modded/legacy 和其他 target/profile 会在 provider 调用前失败。\n\n处理精确 target conflict 或恢复 provider 故障：\n\n```powershell\nbun run src/index.ts --resume-species-intake \".local/species-intake-runs/\u003crun-id>\" `\n  --decisions \".local/species-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\ndecision 只能批准精确 `target-conflict:\u003cidentifier>` 的 replace；不能覆盖来源证据、coverage、语义或 unsupported mechanic finding。\n恢复会创建新的 immutable run；新 manifest 和 accepted ledger 同时记录 `resumedFromRunId` 与 decisions 文件 SHA-256，从而能回溯被恢复的旧 run，而不是改写旧证据。\nresume 命令中的版本/profile 必须与原 run 完全一致；目标漂移在 provider 调用前拒绝。\n\naccepted Markdown 可以编辑，但 ledger 保存了当前 Markdown SHA-256。任何字节变化都会使条目 stale，模块 build 立即 fail-closed。编辑后必须再次把该 Markdown 交给 `--intake-species`，重新生成 run、IR、review、JSON 和 ledger revision。\n\n## 累计内容模块\n\n```powershell\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\nbun run build:homebrew-species:v12-candidate\nbun run verify:homebrew-species:v12-candidate\n```\n\n`fvtt-homebrew-species` 是纯内容模块，只有 `species` 和 `features` 两个 Item Compendium。V14 默认输出仍为 `dist/`；V12 static candidate 输出为 `dist/v12-candidate/`，identity 带 `supportStatus: \"static-candidate\"`。build 只读取当前目标的 accepted ledger 条目和 Markdown，重新走 parser/projector/validator，在随机临时根生成两次 LevelDB 与确定性 ZIP，并检查 identity/coverage/UUID 闭合。V12/V14 的 module ID、pack 名、Race/Feature/Effect/Advancement ID 与 Compendium UUID 相同，版本 metadata 和 Activity 形状是允许差异。\n\nV12 candidate 可以在隔离测试中使用显式 `FVTT_OPS_TEST_CLASSIC_LEVEL_ENTRY` 写入并回读 LevelDB；任何未来可安装 V12 build 必须使用真实 `app/12.331/node_modules/classic-level`。本轮没有扩展安装器、创建 V12 Lab、安装模块或运行 Foundry。\n\n现有安装器仍只属于已验收的 V14 路径；V12 candidate 不得调用它。V12 ZIP 构建成功、LevelDB 回读或静态 validator 绿色都不构成 V12 Runtime Pass。\n\n散装 JSON 是模块绑定的审阅/构建输入；race ItemGrant 使用 `Compendium.fvtt-homebrew-species.features.Item.\u003cid>`，因此不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Item 是快照，v1 不提供迁移器。\n\n## 食人魔 v1 自动化边界\n\n- race 原生表达 giant / Ogre、Large、40尺、60尺黑暗视觉和 2024/private-homebrew 来源。\n- 巨武器四条完整保留为 `gm-assisted`；不写武器、不生成 Activity/Effect/flag、不解释“体型不超过你二级”、不判定建筑、不移动 Token、不重复已有推击。\n- 身强力壮的受擒脱困优势仅为描述性被动，不扩大成全局属性优势，也不自动移除 Grappled。\n- 5级附赠动作脱困是 2/LR、每次消费1的 Bonus Action Utility；聊天卡要求按原规则进行相应属性检定，不固定力量/敏捷/技能。\n- 食人魔刚毅使用 transfer ADD `system.attributes.hp.bonuses.level = 3`，即总等级 N 时增加 `3N` 最大生命值。\n- 食人魔笨拙使用 transfer ADD `system.attributes.ac.bonus = -2`；倒地后花费全部速度站起保持 `gm-assisted`。\n- 不添加来源未声明的 ASI、语言、触及、负重、武器熟练、徒手伤害、抗性或大型生物额外收益。\n\n## 当前验收边界\n\nV12 当前只通过静态候选层：锁定 4.3.9 模型的 Race、Size、ItemGrant、Utility Activity、itemUses、lr/sr recoverAll、Race 升级流以及 HP/AC Effect 路径有参考契约；Ogre V12 package 已逐条核对语义；两次 clean candidate build 的树、logical hash、UUID 和 ZIP 可确定重现。当前机器没有 V12 Lab，因此尚未验收 Token 2×2、真实 Add Species UI、1→5 级升级、AC/HP 运行值、次数消耗、Long Rest 或重开读回。只能声明“V12 静态候选支持”，不能声明“V12 可用”或“V12 正式支持”。\n\n自动测试继续使用 fake provider，以保持离线、确定和可重复；正式食人魔另以本机 Codex OAuth provider 完成了真实运行 `species-20260811022558-9a41c4a1`。该 run 的 deterministic report 与 AI review 均为 `accepted`，没有 repair；正式 ledger、Markdown 与 JSON 的来源/内容/logical hash 闭合。模块 build/verify 得到 1 个 race、5 个 feat，ZIP SHA-256 为 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。\n\n本地 `fvtt-v14-module-matrix` disposable world 已在 Foundry `14.364` / dnd5e `5.3.3` 中安装并启用该模块。原生 Add Species 流程确认 giant/Ogre、Large、40尺、60尺黑暗视觉和 AC 10→8；1级 Barbarian 的最大生命值为 12+3=15，5级为 40+15=55；5级附赠动作脱困连续消耗至 0/2，第三次没有生成聊天卡，Long Rest 恢复为 2/2。聊天卡明确要求手动执行原受擒检定，不选择属性/技能、不自动解除状态，并保留身强力壮优势。巨武器与“体型不超过你二级”始终是 DM 现场判断，未生成系统体型测试、武器写入、推击或 Token 移动。\n\n这仍不是无边界的 runtime Pass：本次没有完成精确 2×2 Token 放置、现有武器应用种族前后的字节级比较或 Actor 导出/读回。长期跑团也未验收。\n\n## 2026-08-13 线上 8080 部署记录\n\n- 用户明确授权把该模块安装到线上 `8080` 并重启；本次只操作 `fvtt-production` 的 `8080`，`51020` 的 v14 进程保持运行且未写入。\n- 用户同时明确要求本地和线上不创建备份，也不以在线人数为执行门槛。本次没有创建模块或世界备份；只使用唯一的 ZIP 暂存与构建验证目录，不保留旧模块副本。\n- 远端模块目录 `E:\\Bill\\fvtt_v13\\data\\Data\\modules\\fvtt-homebrew-species` 已落盘 10 个文件、31,577 bytes；manifest 为 `fvtt-homebrew-species` / `1.0.0`，包含 `species` 与 `features` 两个 Item pack。线上 HTTP 可读 `module.json` 与 `data/identity-manifest.json`，logical hash 为 `d9bd6759dc378333f314431e7839d2d3beadd6eb0e6faf9b9a440168f07258fd`，1 race / 5 features。\n- 重启后的精确命令为 `E:\\Bill\\v14\\code\\main.js --port=8080 --dataPath=\"E:\\Bill\\fvtt_v13\\data\" --world=cor-cotn`；最终 `/api/status` 为 active、Foundry `14.364`、dnd5e `5.3.3`、world `cor-cotn`，监听 PID 为 9852。日志记录 `Server started and listening on port 8080`，没有新增该模块错误。\n- 为清除无进程占用的启动锁，删除了 `E:\\Bill\\fvtt_v13\\data\\Config\\options.json.lock`；没有直接编辑世界 LevelDB。\n- 生产模块文件已安装并可由 Foundry 服务提供，但未取得 `Gamemaster` 密码，不能通过 UI 证明 `cor-cotn` 已启用该模块；因此“已安装/服务已恢复”为 Pass，“世界已启用/食人魔已在生产界面可用”保持未验收，不把文件落盘冒充启用。\n- 线上部署使用的 ZIP SHA-256 是 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。master 集成前的 Markdown revision review 只更新 accepted Markdown hash/run 证据，Foundry documents 与 module logical hash 未变；当前本地重建 ZIP SHA-256 为 `77281eac8e0c5e3f7bd6f2ec3d44603da53b9d2eb0845b450bf4721cd9466e11`，本轮合并没有重新部署线上模块。\n## ServerNext 内容目标与运行兼容（2026-10-01）\n\n接续既有 Next 来源链时，Species Intake／resume 和内容构建可显式使用 `--fvtt-version 14.368 --effect-profile core`。这个内容目标仍绑定 dnd5e **6.0.2** 的来源投影、接受记录和 logical hash；它只属于 Species 路径，不扩大 Actor／Item CLI 的版本集合。5.3.3 与 V12 的原有目标、默认值及拒绝门保持。\n\nServerNext 当前系统已升级6.0.5，模块兼容候选可另加 `--dnd5e-runtime-maximum 6.0.5`：\n\n```text\nbun run build:homebrew-species --fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5\nbun run verify:homebrew-species --fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5\n```\n\n运行兼容上限不重标接受来源，不代表已完成6.0.5种族玩法验收；本次模块恢复保留已安装合集数据。入口、记录和当前接受边界见[十模块恢复记录](reviews/2026-10-01-next-605-custom-module-restoration.md)。\n","docs/web-ai-connections.md":"# Web AI connections\n\nThe Web worker supports three explicit AI connection kinds:\n\n1. `site`: the server-owned Intake provider. It is disabled by default and is\n   quota-limited per anonymous session, client IP, and process-wide daily\n   budget.\n2. `user-api-key`: a browser-created BYOK connection. The key is held only in\n   the in-memory session registry, is never written to a job or log, and is\n   cleared when the connection expires or is disconnected.\n3. `local-codex`: a Windows Companion that makes an outbound WebSocket\n   connection and runs the user's already-authenticated official Codex CLI.\n   OAuth credentials never leave the user's machine.\n\n## Public deployment\n\nKeep Bun loopback-only behind an HTTPS reverse proxy. Public mode requires:\n\n```text\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_AUTH_TOKEN=\u003c32+ random characters>\nFVTT_WEB_SESSION_SECRET=\u003c32+ random bytes, kept stable across restarts>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\nThe proxy must forward WebSocket upgrades for\n`/api/ai-companion/connect` and preserve the external HTTPS origin. The\nCompanion endpoint is `wss://\u003cpublic-origin>/api/ai-companion/connect` when\nthe public URL uses HTTPS. Never expose the Bun port directly.\nFor state-changing browser requests, forward `Host`, `X-Forwarded-Host`, and\n`X-Forwarded-Proto`; the server uses those headers only in public mode to\nvalidate the browser `Origin` against the external origin.\n\nThe anonymous browser session uses an HttpOnly, SameSite-Strict cookie. It\nexpires after eight hours idle or 24 hours absolute. Restarting the process\ninvalidates the in-memory session registry.\n\n## Site provider and BYOK\n\nSite AI requires all three limits before the server starts accepting site\nconnections:\n\n```text\nFVTT_WEB_SITE_AI_ENABLED=1\nFVTT_WEB_SITE_AI_SESSION_DAILY_LIMIT=20\nFVTT_WEB_SITE_AI_IP_DAILY_LIMIT=100\nFVTT_WEB_SITE_AI_GLOBAL_DAILY_LIMIT=1000\n```\n\nBYOK accepts `https://api.openai.com/v1` by default. Additional providers must\nbe exact HTTPS origins in `FVTT_WEB_AI_PROVIDER_ALLOWLIST`, for example\n`https://gateway.example.com`; credentials, query strings, fragments,\nredirects, private hosts, and arbitrary URLs are rejected.\n\n## Companion gate and pairing\n\n`web:dev` is loopback-only and enables the Companion endpoint for local\ndevelopment. It builds `dist/web/fvtt-ai-companion.exe` before starting the\nsingle Bun server on `http://127.0.0.1:5173`. Public/VPS deployments keep the\nCompanion hidden and disabled unless the server administrator explicitly sets:\n\n```text\nFVTT_WEB_CODEX_COMPANION_ENABLED=1\n```\n\nOnly current Windows Chrome and Edge are supported. Firefox is intentionally\nout of scope. The authenticated download endpoint is\n`GET /api/ai-companion/download`; it serves only the fixed build artifact and\nnever accepts a user path. If it is missing, build it with\n`bun run web:companion:build`.\n\nFor a local development page at `http://127.0.0.1:5173`, the page can check the\nlocal Companion directly. A remote page must use HTTPS. Its flow is:\n\n1. The user clicks connect, and the page opens a local confirmation window.\n2. That local window displays the exact remote website address and asks for a\n   deliberate approval.\n3. After approval, the local window sends a one-time, five-minute pairing\n   authorization only to the window that opened it, using browser memory. It\n   never appears in a URL, command line, log, job file, or download.\n4. The remote page uses it once to pair. The Companion then tests each selected\n   model before the connection becomes usable.\n\nThe loopback control service binds only `127.0.0.1:43173` and uses control\nprotocol v2. Before local approval it gives a remote website no cross-origin\npermission at all. After approval it returns CORS and local-network permission\nheaders only to that exact HTTPS origin. Pairing is bound to that origin, the\ncurrent Companion instance, and the current server pairing. Disconnect and\nshutdown each require a separate one-use control credential; knowing a public\ninstance ID is never sufficient. Popup blocking, rejection, expiry, a refused\nlocal-network permission, an unsupported browser, or a stopped Companion all\nproduce a user-facing recovery message.\n\nLeaving the model fields blank means the Companion invokes the user's current\nCodex CLI default; it does not inject a fixed model name. A user may specify\nmodels explicitly, but every selected main/review model must pass the real\nno-tool-call gate before the connection is ready. A gate failure never silently\nfalls back to a different model, site AI, BYOK, or a local OAuth bridge.\n\nThe adapter uses an ephemeral temporary directory, a read-only sandbox, and a\nstrict result schema. It disables the current tool features and rejects any\ntool-shaped JSONL event. The packaged Windows Companion uses the user's\nofficial `codex.exe`; it never receives project source or OAuth files. It no\nlonger accepts pairing tokens or pairing flags on the command line: users\ndouble-click the EXE and complete the approval in the page instead.\n\nThe server operator builds the Windows artifact once; end users receive only\nthe resulting executable and do not receive the project checkout or server\nsecrets. The compiled artifact hides the Windows console. It is an unsigned\ndevelopment build, so Windows SmartScreen may still require an explicit user\nconfirmation.\n\n## Job pinning and resume\n\nEvery AI job records only an opaque connection ID and an HMAC session binding.\nThe provider secret is not part of `result.json`, downloads, logs, or error\nresponses. Job polling, downloads, decisions, and resume are restricted to\nthe original anonymous session. Resume resolves the original connection; if\nit is expired, disconnected, or blocked, the job stays `needs_review` or\n`failed` and never silently switches to the site provider.\n","docs/web-deployment.md":"# fvttV12Json Web 部署说明\n\n这个 Web 工作台提供浏览器上传 Markdown/JSON、Bun 后端 workflow、任务进度，以及 JSON、Markdown、records 和 ZIP 下载。它默认是本机工具，不会因为执行 `web:start` 就监听公网接口。\n\n## 安全模式\n\n### 本机模式（默认）\n\n```bash\nbun install\nbun run web:build\nbun run web:start\n```\n\n默认地址是 `http://127.0.0.1:5174`：\n\n- 只绑定 IPv4 回环地址；\n- API 不要求 bearer token；\n- 忽略 `X-Forwarded-For` 和 `X-Real-IP`；\n- 如果把 `FVTT_WEB_HOST` 改为非回环地址却没有设置 `FVTT_WEB_PUBLIC_MODE=1`，进程会拒绝启动。\n\n开发环境可运行 `bun run web:dev`。命令会先构建前端，再由同一个 Bun 服务在\n`http://127.0.0.1:5173` 同时提供页面和 API；开发者只需要打开这一个地址。\n它还会在启动服务前编译 `fvtt-ai-companion.exe`，并在 loopback、本机模式下\n默认启用页面引导的 Codex Companion。显式设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=0` 可以关闭它；构建失败时不会启动旧页面\n或残缺服务。它不是热更新服务器，修改前端后重新运行命令即可生成新的页面资源。\n\n#### 无命令式 Companion 配对\n\n打开 `http://127.0.0.1:5173` 的“AI 连接”面板后，下载并双击\n`fvtt-ai-companion.exe`，选择模型并点击“连接本机 Companion”即可完成配对；用户不需要\n打开 PowerShell、复制启动命令或查看配对 Token。留空模型时使用这台电脑当前 Codex CLI\n默认模型；填写模型时，主模型和审查模型都会在连接前各自经过“不允许调用工具”的实际检查。\n\nCompanion 的 `127.0.0.1:43173` 只用于本机控制（health、pair、disconnect、shutdown），\n不是第二个 Web 地址，也不接受局域网连接。它只绑定 `127.0.0.1`，使用 control protocol\nv2。本机开发页只能来自精确的 `http://127.0.0.1:5173`。公开网页必须是 HTTPS：用户点击\n连接后会打开本机确认页，确认页显示精确的网站地址；只有用户点允许后，该网站才会在五分钟\n内拿到一次性配对授权。授权只保留在内存，不能写入 URL、命令行、日志或下载文件；配对、\n断开和关闭也都需要各自的一次性控制凭据。浏览器拒绝本地网络访问、弹窗被拦截、用户拒绝、\n授权过期或 Companion 退出时，页面会显示下一步处理方法。\n\n仅支持最新版 Windows Chrome 和 Edge；Firefox 不在本次支持范围。开发 EXE 使用隐藏控制台\n编译，未签名且可能触发 Windows SmartScreen；页面会显示构建产物 SHA-256，便于本机核对。\n生产 `web:start` 默认不启用 Companion；服务器管理员明确设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=1` 后，公开网页才会显示并允许使用它。\n\n### 公开/反向代理模式（显式开启）\n\n公开模式必须同时设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\n```\n\n该 token 是服务器之间的凭据，不是给浏览器页面填写的登录密码。推荐部署方式是：\n\n1. Bun 仍绑定 `127.0.0.1`；\n2. Nginx、Caddy、Cloudflare Access 或同类入口先验证真实用户；\n3. 反向代理在转发到 Bun 时注入 `Authorization: Bearer \u003cFVTT_WEB_AUTH_TOKEN>`；\n4. 浏览器永远不能读取或提交 VPS 的翻译 key、爬站 cookie、密码或这个 bearer token。\n\n如确实要直接监听网络接口，还必须显式设置 `FVTT_WEB_HOST=0.0.0.0`（或指定地址）。静态页面可以被读取，但所有 `/api/*` 请求仍必须携带正确 bearer token；不建议把这种直接绑定当作完整用户身份系统。\n\n## 环境变量\n\n部署与鉴权：\n\n- `FVTT_WEB_HOST`：监听地址，默认 `127.0.0.1`。\n- `FVTT_WEB_API_PORT`：端口，默认 `5174`。\n- `FVTT_WEB_CODEX_COMPANION_ENABLED=1`：显式启用本机 Codex Companion；`web:dev`\n  在非公开 loopback 模式下默认设置为 `1`，生产/VPS 启动默认关闭。\n- `FVTT_WEB_PUBLIC_MODE=1`：启用公开/代理模式；没有它时非回环绑定会失败。\n- `FVTT_WEB_AUTH_TOKEN`：公开模式必填，至少 32 个字符；不要提交到 Git、浏览器或日志。\n- `FVTT_WEB_TRUSTED_PROXIES`：允许提供客户端转发链的代理字面 IP，逗号分隔，例如 `127.0.0.1,10.0.0.2`。不支持主机名或隐式“信任全部”。\n\n资源边界（默认值）：\n\n- `FVTT_WEB_SHORT_REQUEST_LIMIT=10`：每客户端每分钟非 GET 请求数。\n- `FVTT_WEB_GLOBAL_SHORT_REQUEST_LIMIT=100`：所有客户端合计每分钟非 GET 请求数。\n- `FVTT_WEB_LONG_JOBS_PER_CLIENT=1`：每客户端同时运行的长任务数。\n- `FVTT_WEB_GLOBAL_LONG_JOBS=4`：整个进程同时运行的长任务数。\n- `FVTT_WEB_JOB_RETENTION_HOURS=24`：终态任务产物保留小时数。\n- `FVTT_WEB_MAX_RETAINED_JOBS=100`：未过期终态任务的最大保留数量；超过时最旧优先清理。\n\n工作流能力：\n\n- `FVTT_WEB_ENABLE_PATH_MODE=1`：允许读取服务器 workspace 路径和运行 `vault-sync`。公开部署通常不要开启。\n- `MONSTER_INTAKE_AUTH_MODE`：`api-key` 或 `codex-oauth`，默认 `api-key`。\n- `MONSTER_INTAKE_API_KEY`：API Key 模式的 AI 怪物资料整理专用 provider key；只保留在服务端。\n- `MONSTER_INTAKE_BASE_URL`：API Key 模式的 OpenAI-compatible API 根地址，例如 `https://api.openai.com/v1`。\n- `MONSTER_INTAKE_CODEX_OAUTH_BASE_URL`：Codex OAuth 本机兼容桥地址，默认 `http://127.0.0.1:8787/v1`；必须是 loopback 地址。\n- `MONSTER_INTAKE_CODEX_OAUTH_BRIDGE_TOKEN`：可选的本机桥 bearer token；默认是非秘密占位值，OAuth 凭据不放在这里。\n- `MONSTER_INTAKE_MODEL`：discovery、extraction 和 repair 使用的模型；Codex OAuth 兼容桥模式未填写时默认 `gpt-5.6-luna`。这不是 Companion 的模型设置：Companion 留空时使用用户本机 Codex CLI 当前默认模型。\n- `MONSTER_INTAKE_CODEX_OAUTH_REASONING_EFFORT`：Codex OAuth 推理强度；默认 `xhigh`，对应 Codex 界面里的 `ultra`，也接受填写 `ultra` 并自动归一化。\n- `MONSTER_INTAKE_REVIEW_MODEL`：独立 review 模型；未设置时使用 `MONSTER_INTAKE_MODEL`。\n- `MONSTER_INTAKE_TIMEOUT_MS`：普通 Intake 阶段超时；API Key 模式默认 `60000` 毫秒，Codex OAuth 模式默认 `300000` 毫秒。\n- `MONSTER_INTAKE_REPAIR_TIMEOUT_MS`：Intake 证据修复阶段的单独超时，默认至少 `180000` 毫秒；可设为 `1000` 到 `600000` 之间的整数。\n- `TRANSLATION_API_KEY` 或 `OPENAI_API_KEY`：服务器端翻译/AI normalize 凭据。\n- `GODDESSFANTASY_COOKIE`：服务器端 Goddess Fantasy crawl cookie。\n- `GODDESSFANTASY_USERNAME` / `GODDESSFANTASY_PASSWORD`：服务器端爬站登录凭据。\n- `FVTT_WEB_EXPOSE_ERRORS=1`：返回内部错误详情，仅限本机调试；公开部署不要开启。\n\n可选图片上传默认完全关闭，不再内置任何真实服务器地址。启用时必须在服务端同时配置：\n\n- `FVTT_WEB_IMAGE_SSH_TARGET`：SSH 目标，例如 `operator@assets.example.invalid`；\n- `FVTT_WEB_IMAGE_REMOTE_ROOT`：远端图片根目录；\n- `FVTT_WEB_IMAGE_PUBLIC_BASE_URL`：生成 JSON 使用的公开图片 URL 前缀；\n- `FVTT_WEB_IMAGE_TOKEN_FRAME`：可选 Token 边框文件，默认使用仓库内的小型边框资源；\n- `FVTT_WEB_IMAGE_ALLOW_HTTP=1`：仅在明确接受明文 HTTP 风险时设置；默认只接受 HTTPS；\n- `FVTT_WEB_IMAGE_ACTOR_DIR`、`FVTT_WEB_IMAGE_TOKEN_DIR`、`FVTT_WEB_IMAGE_TOKEN_SIZE`：可选目录名和尺寸调整。\n\n缺少 SSH 目标、远端根、公开 URL 或 Token 边框中的任一项时，图片能力保持“未配置”，Actor JSON 仍可生成，但不会把本机默认值或真实生产目标偷偷带入任务。\n\n浏览器只能看到“某项能力是否已配置”，不能取得上述凭据值。\n\nAI 怪物资料整理只读取专用的 `MONSTER_INTAKE_*` 变量，不会回退到翻译或通用 OpenAI 变量。`codex-oauth` 只适用于本机或受信任的 loopback 兼容桥，不应把它作为公开 Web 服务的远程认证方式。粘贴或上传的 TXT/MD 原文会发送给该 provider，因此公开部署必须在用户提交前明确告知这一点，并按 provider 的数据政策处理。服务端审计只记录 provider、model、prompt version、耗时、调用计数和错误码，不记录 key、请求头或隐藏推理。\n\n单次 Intake 最多 200,000 个 JavaScript UTF-16 字符、50 只怪物；长文本按 24,000 字符分块并保留 1,000 字符重叠，逐怪物 extraction 并发为 2。每只怪物最多 1 次 extraction、1 次独立 review 和 1 次 semantic repair；各阶段可对 timeout、429 或网络错误重试一次。模型不能自行增加循环或调用工具。`needs_review` 任务可下载 source、IR、候选 Markdown 和报告，但 Web 不会把候选 Actor JSON 注册为正式下载；只有 accepted 才注册 Actor JSON/ZIP。\n\n## 固定资源保护\n\n- Bun 在读取请求体前实施 25 MiB HTTP body 上限；有 `Content-Length` 时，API 还会在调用 `request.text()` 前拒绝超限或畸形长度。\n- 单文件内容上限是 5 MiB；合集/JSON 内容上限是 20 MiB。\n- 客户端身份来自真实 socket。只有直接 socket 对端在 `FVTT_WEB_TRUSTED_PROXIES` 内，才会从右向左解析转发链；伪造或畸形链不会创建新限流身份。\n- 每客户端和全局请求/长任务上限同时生效，不能仅靠更换转发头绕过。\n- 当前进程真正 queued/running 的任务不会被清理；过期终态任务先清理，数量仍超限时再最旧优先清理。\n- 500 错误默认隐藏内部详情。下载接口仍只服务任务登记过的文件。\n\n这些是纵深防御，不代替公开入口的真实用户鉴权、TLS、防火墙和操作系统资源限制。\n\n## Nginx 示例\n\n下面的 Basic Auth 验证浏览器用户；`Authorization` 在代理到 Bun 时被替换为服务器端 bearer。把 token 放入仅 root 可读的 Nginx 配置片段，不要写进公开仓库。\n\n```nginx\nserver {\n  listen 443 ssl;\n  server_name example.com;\n\n  client_max_body_size 25m;\n\n  location / {\n    auth_basic \"fvtt workbench\";\n    auth_basic_user_file /etc/nginx/fvtt.htpasswd;\n\n    proxy_pass http://127.0.0.1:5174;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    proxy_set_header Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\";\n  }\n}\n```\n\nBun 侧至少设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n如果 Nginx 与 Bun 不在同一网络命名空间，`FVTT_WEB_TRUSTED_PROXIES` 应填写 Bun 实际看到的直接代理 IP，而不是盲填公网客户端 IP。\n\n## Caddy 示例\n\n```caddyfile\nexample.com {\n  request_body {\n    max_size 25MB\n  }\n\n  basic_auth {\n    operator REPLACE_WITH_CADDY_PASSWORD_HASH\n  }\n\n  reverse_proxy 127.0.0.1:5174 {\n    header_up Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\"\n    header_up X-Real-IP {remote_host}\n  }\n}\n```\n\n同样设置 `FVTT_WEB_PUBLIC_MODE=1`、同一个 `FVTT_WEB_AUTH_TOKEN`，并将 Caddy 的直接 socket IP 加入 `FVTT_WEB_TRUSTED_PROXIES`。\n\n## systemd 示例\n\n把 secret 放在权限受限的 `/etc/fvtt-web.env`，而不是直接写进 unit 或仓库：\n\n```ini\n[Unit]\nDescription=fvttV12Json Web\nAfter=network.target\n\n[Service]\nWorkingDirectory=/opt/fvttV12Json\nExecStart=/usr/local/bin/bun run web:start\nRestart=always\nEnvironmentFile=/etc/fvtt-web.env\n\n[Install]\nWantedBy=multi-user.target\n```\n\n`/etc/fvtt-web.env` 示例：\n\n```bash\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_API_PORT=5174\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n## 产物目录\n\n所有 Web 任务写入：\n\n```text\ntemp/web/jobs/\u003cjobId>/\n  input/\n  output/\n  result.json\n```\n\n下载接口只允许下载任务登记过的产物。ZIP 下载会把成功产物打包为使用 UTF-8 文件名的 ZIP；清理策略按上文的年龄和数量边界执行。\n","foundry-modules/chat-memory-guard/README.zh-CN.md":"# Chat Memory Guard / 聊天内存保护\n\n这是一个拥有独立 manifest、版本、构建、测试、安装保护和验收边界的 Foundry module release unit。\n它不依赖本仓库的 Actor generator、AI Intake、workflow、crawler 或其他 Foundry module 私有实现。\n\n## 支持范围\n\n- ServerNext manifest 兼容范围：Foundry VTT 14.368 / dnd5e 6.0.2–6.0.5（`verified` 保持 6.0.2）\n- 原 Server Mirror 1.0.0：Foundry VTT 14.364 / dnd5e 5.3.3，仅作历史对照\n- 模块 ID：`chat-memory-guard`\n- 当前候选：`1.1.0`；6.0.2 上的安装、启用、重载与代表性 DOM 上限证据保留；6.0.5 的启用、重载和运行时读回待本次恢复验收。世界聊天记录保留、滚动阅读暂停及头像路径仍待补证\n\n模块只裁剪当前浏览器已经渲染的聊天卡片。它调用 Foundry 公开的\n`ChatLog.deleteMessage()`，不会调用 `ChatMessage.delete()`，不会修改世界中的聊天数据库记录，\n也不会修改 Foundry、dnd5e、MIDI-QOL 或其他模块源码。\n\n6.0.2 与 6.0.5 锁定 dnd5e 源码都在 `module/documents/chat-message.mjs` 中以相同签名触发\n`dnd5e.renderChatMessage`；本次只扩展 manifest 上限，原 hook 与消息处理逻辑保持不变。\n\n## 独立构建与测试\n\n在本 workspace clone 中，先从仓库根目录安装锁定依赖，再进入本目录运行独立门禁：\n\n```powershell\nbun install --frozen-lockfile\ncd foundry-modules/chat-memory-guard\nbun run typecheck\nbun test\nbun run build\n```\n\n未来从过滤后的独立仓库 clone 构建时，由该仓库自己的 `bun.lock` 提供 frozen install；本次\nworkspace 迁移不把主仓库 lockfile 复制成第二份权威文件。\n\n构建输出：\n\n- `dist/module/`：可直接安装的 module 目录；\n- `dist/chat-memory-guard.zip`：独立发布包。\n\n在主 workspace 根目录仍可使用兼容命令：\n\n```powershell\nbun run test:chat-memory-guard\nbun run build:chat-memory-guard\n```\n\n旧 `install:chat-memory-guard` 只指向本地 Server Mirror，且包含与当前无备份规则冲突的历史替换逻辑；`1.1.0` 构建在任何写入前会被此入口拒绝。ServerNext 只按迁移交接的离线定点安装流程处理，不创建备份，不运行旧安装入口。\n\n## 设置\n\n在“游戏设置 → 模块设置 → 聊天内存保护”中打开设置窗口：\n\n- GM 世界默认值：供整个世界使用。\n- 本浏览器个人覆盖：每位玩家可以跟随世界设置，或只覆盖自己的客户端。\n- 默认保留 40 条已渲染消息。\n- 默认优先 Token 图，并生成最长边 128px、质量 75 的会话级 WebP 缩略图。\n\n设置保存后立即重新渲染当前卡片并应用。缩略图只存在于当前页面会话，刷新或关闭页面后释放。\n\n## 诊断\n\n在浏览器控制台运行：\n\n```js\ngame.modules.get(\"chat-memory-guard\").api.getStats()\n```\n\n结果只包含渲染数量、裁剪数量、pending 删除数量、缩略图缓存数量/估算字节、失败数、模块监听器\n数量和当前有效设置，不包含消息正文。\n\n## 已知边界\n\n- dnd5e 在 Core `renderChatMessageHTML` 之后才创建头像。本模块在\n  `dnd5e.renderChatMessage` 阶段、卡片插入聊天 DOM 之前尽量替换头像，但不声称能够阻止浏览器\n  发起首次原图请求。\n- 自动化和短时 A/B 运行时证据不能证明长时间跑团内存永不增长。\n- 完整第三方聊天卡矩阵和少见动画头像仍需在真实跑团中持续抽查。\n- 精确目标源码已核对 `ChatLog.deleteMessage()`、聊天 DOM、Core 与 dnd5e 渲染 Hook；这些静态依据不代替下面分项记录的真实客户端验收。\n- ServerNext 的独立 Chrome 批次已核对模块正常启用、重载保持、临时客户端上限20下的聊天 DOM 25→20及新消息21→20；临时客户端设置已恢复。世界 ChatMessage 存储计数、滚动阅读暂停、头像缩略图/失败回退与 `getStats()` 未取得充分证据，因此仍是部分验收。\n- workspace 物理迁移不会升级历史运行时验收结论；旧目标的真实运行时证据仍以\n  `docs/acceptance/chat-memory-guard-runtime-report.zh-CN.md` 为准。\n","foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md":"# Babele RollTable `@Embed` 翻译兼容模块\n\n这个模块修复 Foundry v14 渲染下面这种内容时的运行时缺口：\n\n```text\n@Embed[Compendium.dnd-players-handbook.tables.RollTable.phbWildMagicSurg rollable caption=false classes=\"wild-magic-surge\"]\n```\n\nBabele 可以把随机表标题翻译成中文，但 Foundry 原生的 `_buildEmbedHTML` 直接从当前 `results` 集合取英文行。模块只在这个渲染入口读取 Babele 的临时翻译结果，按 `_id` 优先、`range` 回退重新填充显示内容；文档型结果继续使用原始 `documentUuid` 生成 content-link。当前世界语言为 `zh-CN`、译包注册语言为 `cn` 时，模块只对嵌入表格按需读取 Babele 的 `cn` 翻译会话，不更改世界语言或 Babele 的全局翻译状态。\n\n它不会修改随机表、角色、特性、Item、Journal 或世界设置。翻译源仍然由现有的 `dnd-simplified-chinese-babele-patch` 提供。\n\n## ServerNext 0.2.1 历史验证与当前范围\n\n当前 manifest 兼容范围为 Foundry 14.368、dnd5e 6.0.2–6.0.5（`verified` 保持 6.0.2）、Babele 2.9.1 与 libWrapper 1.13.5.1。旧 0.1.0 只在 Server Mirror 的 14.364 / 5.3.3 通过，不能作为 Next 已验收证据。运行时代码仍只包装同一个表格嵌入入口；6.0.2 与 6.0.5 锁定源码中的 dnd5e chat/result API 没有目标变更，14.368 本机源码保留表格嵌入方法、两列表格和结果行结构，Babele 2.9.1 提供只读的按语言会话 API。Next 的实际 UI 曾在 6.0.2 显示 25 行狂野魔法浪涌中文结果、5 行困惑术结果，以及“基本方位”原 UUID 的 content-link；6.0.5 的启用与代表 UI 读回应在恢复后重做，其它表仍需按实际用途核对。\n\n构建和局部检查：\n\n```text\nbun run build:fvtt-babele-rolltable-embed-translation\nbun run test:fvtt-babele-rolltable-embed-translation\n```\n\n旧的 `install:fvtt-babele-rolltable-embed-translation` / `verify-install:fvtt-babele-rolltable-embed-translation` 仍是 Mirror 专用入口，不能用于 Next。Next 的定点更新从本工作树 `dist/module` 取包，先正常关闭原世界，核服务、世界锁及任务已安装的旧文件哈希，再更新 `server-next/Data/modules/fvtt-babele-rolltable-embed-translation` 的两个文件并逐文件核哈希；不创建备份或直接改世界数据库。\n\n重启并正常进入本地 ServerNext 后，在实际 UI 中检查：\n\n- 狂野魔法浪涌：25 行范围和 25 行中文结果，骰子按钮仍可用；\n- 困惑术行为：5 个结果全部存在，文档型的“基本方位”仍为原 UUID 的 content-link；\n- 重复打开/渲染不改变源表，也不写入世界文档。\n","foundry-modules/fvtt-battlefield-painter/README.zh-CN.md":"# Battlefield Painter P2 Alpha · `0.3.0-alpha.2`\n\n这是一个自用的 Foundry VTT v14 战场地形画笔原型。它不复制 Tile Arsenal 的代码、配置或素材，只实现相近的高层工作流：GM 从工具盘选择地形、在地图上涂抹，并由模组创建一组可以追踪和回滚的场景文档。\n\n当前版本是 P2 alpha：浏览器 bundle 已在模拟 Foundry 全局环境中完成加载、生命周期注册、ApplicationV2 打开和版本/权限门禁测试。Frost B14 的薄冰/寒气视觉已获用户认可，Fire B13 的完整真实 Canvas 验收仍保持独立未完成；其他运行时结论以各 micro-batch 记录为准，不能由静态测试一并推定。新版本不再生成或创建 Battlefield Painter 音频；旧版本残留 AmbientSound 只能由 GM 显式清理。\n\n`0.3.0-alpha.2` 允许三组精确运行配对：原 Foundry `14.364` / dnd5e `5.3.3`，历史 ServerNext `14.368` / `6.0.2`，以及 `14.368` / `6.0.5`。manifest 的 `verified` 仍保留旧版本，运行时拒绝交叉配对和未列明版本。2026-09-24 的真实 Canvas 定点验收针对 `14.368` / `6.0.2`，通过方格 Fire 笔画→原生 Region 移动消耗/光源→重载视觉→自有对象清理。2026-10-01 在 `6.0.5` 独立修正行列坐标与视频加载后，原两格 Square Fire I 的可见动画、Region／light、正常GM重载及精确清理通过；六角格、其它地形／阶段、模块Undo与玩家权限未扩大验收，见[本轮限定恢复](../../docs/reviews/2026-10-01-next-605-custom-module-restoration.md)与[历史候选记录](docs/server-next-candidate.md)。\n\n## 当前范围\n\n- 火焰、冰霜、荆棘三种配置。\n- 每种配置保留两个逻辑阶段，并共享 1 张原创透明 P0 WebP；当前共 3 张基础图。旧场景兼容循环仍保留为每种地形 1 个 WebM。\n- P0 与未带 marker 的旧场景由 Tile 媒体、透明度、Tint、火焰光源和成熟荆棘 Wall 表达阶段；P2 Square Fire/Frost 另有独立视觉层。\n- Foundry 原生 Tile 负责静态地表或逻辑占位；P2 Fire 与 Frost 分别由模块自管的世界空间 renderer 绘制，均位于 Token 下方。\n- Foundry 原生 Region `modifyMovementCost` 行为负责移动消耗。\n- 火焰创建原生 AmbientLight，使用 `torch` 动画；P2 对长笔画使用最多 16 格一组的确定性聚类光源。\n- P2 新建火焰 Tile 以 `alpha=0` 的 `fire.webp` 作为逻辑/兼容纹理并写入 `visualEffect: \"fire-field-v1\"`；运行时火场不采样、不移动 `fire.webp`，也不请求 `fire.webm`，而是共享 `fire-stage-i.webm`（Stage I）和 `fire-stage-ii.webm`（Stage II）。\n- P2 新建 Square Frost Tile 使用 `frost-film-v1.webp` 并写入 `visualEffect: \"frost-field-v1\"`；Stage I 只显示薄冰膜，Stage II 额外使用共享的 `frost-mist-v1.webm` 寒气场，不请求旧 `frost.webm`。Hex Frost 与无 marker 旧场景保持兼容路径。\n- Brambles 仍使用当前 `brambles.webp` / `brambles.webm` Tile 路径；独立荆棘视觉效果属于下一阶段。\n- 不再创建新的 AmbientSound；审计仍识别旧版本模块所有声音，并提供 GM 专用的指纹确认清理入口。旧声音清理不可撤销，也不会被 undo/redo 恢复。\n- 新包不再携带 OGG；旧场景中的模块所有 `AmbientSound` 可能请求缺失资源（404）。GM 看到旧声音警告后，应先打开 Painter，通过显式确认入口清理；模块不会自动迁移或删除旧场景数据。\n- 成熟荆棘在地形外边界创建 Wall。\n- 绘制、擦除、阶段切换支持方格和六角格；几何来自 `canvas.grid`，不自行猜测六角格坐标。\n- 所有文档带 `flags.fvtt-battlefield-painter` 所有权信息；批次创建失败时自动回滚。\n- P1 增加 0–4 格笔刷半径、自由/直线/填充三种几何、画布光标预览，以及只恢复本模组文档的撤销/重做。\n- “直线”委托当前 Foundry Grid 的 `getDirectPath`；半径委托 `getAdjacentOffsets`，避免自行假设方格或六角格邻接。\n- “填充”是拖拽起点与终点之间的 offset 区域填充，不是依赖地图像素颜色的洪水填充。\n- P2 提供 GM 专用的本场景地形清除预览，只统计模块所有文档，并在确认前重新核对文档 ID 指纹。\n- 方格 Tile 仅在 Foundry 已明确识别为方格时做 8% 的视觉尺寸扩展（每侧约 4%）；Region、Wall、cellKey、offset 和所有权边界仍使用原始方格几何。六角格和未识别网格不自动套用该视觉扩展。\n\n当前暂不包含 12 色变体、跨客户端并发锁、伤害自动结算和第三方自动化模组集成。Fire、Frost 和后续 Brambles 的视觉/运行时验收分别记录，不互相替代。\n\n## 使用\n\n1. 以 GM 身份打开一个已激活的场景。\n2. 在 Tiles 场景控制组点击火焰图标，打开“战场地形画笔”。\n3. 选择地形、阶段和模式，点击“启用画笔”。\n4. 在地图上按住左键拖动；松开时一次性创建该笔画。\n5. “擦除”只作用于本模组拥有的地形；擦除一部分笔画时会安全重建剩余部分。\n6. “切换阶段”会升级或循环命中的完整笔画批次。\n\n控制台可用 API：\n\n```js\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditScene()\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditEffects()\ngame.modules.get(\"fvtt-battlefield-painter\").api.auditFrostEffects()\n```\n\n`auditEffects()` 与 `auditFrostEffects()` 分别只读返回 Fire/Frost 的 mesh、格位、顶点、三角形、ticker、媒体、重建次数和最近错误。API 同时公开 `compatibility` 与 `canMutate`。仅当版本精确为 Foundry `14.364` / dnd5e `5.3.3`，或 Foundry `14.368` / dnd5e `6.0.2`、`6.0.5`，且当前用户是 GM 时，才暴露 `open`、`activate` 和 `deactivate`；其他环境只保留诊断能力。\n\nAlpha 还提供仅供开发、测试和修复使用的内部阶段开关：\n\n```js\nconst api = game.modules.get(\"fvtt-battlefield-painter\").api\napi.developmentPhases()\napi.setDevelopmentPhase(\"p1\", false) // 关闭 P1，回退为 P0 单格自由画笔\napi.setDevelopmentPhase(\"p1\", true)\napi.setDevelopmentPhase(\"p2\", false) // 关闭动态素材和聚类光源\napi.setDevelopmentPhase(\"p2\", true)\n```\n\n正式版发布前必须把 `DEVELOPMENT_PHASE_CONTROLS_MUTABLE` 改为 `false`，确认运行时不再暴露 `setDevelopmentPhase`，并重新跑完整门禁。\n\n## 开发与构建\n\n```powershell\nbun run test:coverage\nbun run typecheck\nbun run build\n# 仅在明确需要重新生成媒体时运行；普通构建不会重新生成资产\nbun run generate:media\nbun run generate:frost-field\n```\n\n构建产物为 `dist/module/` 和 `dist/fvtt-battlefield-painter.zip`。静态构建成功不等于 Foundry 真实语义通过。\n\n本地 Lab 安装入口：\n\n```powershell\nbun run install:local\nbun run install:local -- --apply\nbun run verify-install\n```\n\n安装脚本只接受仓库批准的 `F:\\FoundryLab\\foundry-v14`，会先构建、核对精确目标、使用暂存目录并逐文件哈希验证。目标模组目录必须不存在；如果已有任何文件或目录，安装会停止且不会替换、移动或创建旧副本。它不触碰生产环境。\n\n## 文档索引\n\n- [设计与实现决定](docs/architecture.md)\n- [外部调研与版本边界](docs/research-notes.md)\n- [P0 真实验收清单](docs/acceptance-checklist.md)\n- [原创素材来源与完整提示词](docs/asset-provenance.md)\n- [后续路线](docs/roadmap.md)\n- [0.3.0-alpha.1 发布说明（历史）](docs/alpha-release-notes.md)\n- [ServerNext 静态兼容候选与待验收项](docs/server-next-candidate.md)\n- [P1 开发 checkpoint 与异机验收交接](docs/p1-development-checkpoint.md)\n- [P2 执行计划](docs/p2-execution-plan.md)\n- [B13 连续火焰场视觉验收](docs/runtime-acceptance-micro-batches/B13-art-style-square.md)\n- [B14 薄冰膜与寒气场视觉验收](docs/runtime-acceptance-micro-batches/B14-frost-field-square.md)\n","foundry-modules/fvtt-battlefield-painter/docs/acceptance-checklist.md":"# Exact Foundry 14.364 Acceptance Checklist\n\nStatic checks and build output do not satisfy this checklist. Run these in the approved local Lab with Foundry `14.364` and dnd5e `5.3.3`, using a disposable test Scene. Record screenshots, console errors, document counts from `api.auditScene()`, and any recovery action.\n\n## Environment identity\n\n- [ ] Confirm executable/build reports Foundry `14.364`.\n- [ ] Confirm world reports dnd5e `5.3.3`.\n- [ ] Confirm destination is under `F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\modules\\fvtt-battlefield-painter`.\n- [ ] Confirm module `0.3.0-alpha.1` appears and enables without manifest warning.\n- [ ] Confirm no browser console error during `init`, `ready`, Scene load, or canvas teardown.\n\n## Square grid\n\n- [ ] Open the Tiles control group; confirm the GM-only painter button appears.\n- [ ] Open ApplicationV2 panel; confirm the three terrain previews, Chinese labels, stage controls, and active states render.\n- [ ] Confirm free/line/fill controls, radius 0–4, and undo/redo disabled states render correctly.\n- [ ] Move the pointer without painting; confirm preview follows cells, respects radius, and disappears on canvas leave/deactivation.\n- [ ] Paint radius 0 and 4 strokes; verify no duplicate owned cell is created.\n- [ ] Drag a line in both directions; verify the preview and committed cells match core direct-path behavior.\n- [ ] Drag fill in all four endpoint directions; verify the inclusive offset area matches the preview.\n- [ ] Paint connected and disconnected cells for each terrain/stage.\n- [ ] Confirm Tiles exactly cover their grid cells and preserve transparent edges.\n- [ ] Move a token through every Region; verify measured cost is ×2 for supported movement actions.\n- [ ] Confirm stage-I and stage-II fire create the intended native light and torch animation.\n- [ ] Confirm only stage-II brambles block movement; sight/light/sound remain unblocked.\n- [ ] Erase one cell from the middle of a multi-cell stroke; verify the remainder survives and Region/Wall geometry is rebuilt.\n- [ ] Target one cell with stage-switch; verify the complete original stroke cycles stage.\n- [ ] Paint over an owned cell; verify it is skipped instead of duplicated.\n- [ ] Deactivate the painter; verify normal Foundry canvas controls resume.\n- [ ] Undo and redo paint, erase, and stage-switch; verify foreign documents remain unchanged.\n- [ ] Undo, then make a new edit; verify redo is cleared.\n\n## Hex grid\n\n- [ ] Repeat all three terrain paints on a hex-row Scene.\n- [ ] Repeat all three terrain paints on a hex-column Scene.\n- [ ] Confirm Tile bounds do not displace the artwork relative to cell centers.\n- [ ] Confirm Region polygons match all six vertices.\n- [ ] Confirm adjacent bramble cells remove their shared Wall edge.\n- [ ] Confirm erase and stage-switch reconstruct the same hex offsets.\n- [ ] Repeat radius, line, fill, preview, undo, and redo on hex-row and hex-column Scenes.\n\n## Failure and recovery\n\n- [ ] Temporarily provide invalid Region behavior data in a disposable fixture; confirm Tile creation rolls back.\n- [ ] Verify `auditScene()` counts match visible owned documents.\n- [ ] Reload the world and confirm ownership flags still support erase and stage-switch.\n- [ ] Disable the module and confirm foreign Scene documents are untouched.\n- [ ] In alpha, disable P1 through `api.setDevelopmentPhase(\"p1\", false)` and confirm the panel falls back to free radius 0 without preview/history controls.\n- [ ] Re-enable P1 and confirm the controls return; then verify release packaging with phase controls immutable before formal release.\n- [ ] Remove all P0 test documents before ending acceptance.\n\n## Deferred until final unified runtime acceptance\n\n- legacy-sound cleanup and no-new-audio request checks;\n- transparent WebM animation;\n- very large battlefields and long-session memory/performance;\n- production environment installation;\n- four-hour real-session soak.\n\n## P2 final-pass additions\n\nRun these only in the final unified environment pass after all development phases are complete. Clear module-owned documents between phase combinations; do not treat static tests as runtime acceptance.\n\n- [ ] Confirm the module reports `0.3.0-alpha.1`; canonical compatibility media plus Fire/Frost field media remain valid in the build inventory. New P2 Square Fire/Frost must not request `fire.webm` / `frost.webm`.\n- [ ] Run with `P0` only; confirm static WebP tiles, the P0 fire light, and no AmbientSound documents.\n- [ ] Run with `P0+P1`; repeat radius, line, fill, preview, erase, stage, undo, and redo behavior.\n- [ ] Run with `P0+P2`; confirm P2 fire uses hidden logical `fire.webp` plus `visualEffect: \"fire-field-v1\"`, mounts one continuous video-backed fire mesh, and does not request `fire.webm`. Confirm Square Frost uses `frost-film-v1.webp` plus `visualEffect: \"frost-field-v1\"`, adds Stage II mist without requesting `frost.webm`, while Brambles remains on its current WebM path. All terrain creates zero new AmbientSound documents or Battlefield Painter audio requests.\n- [ ] Confirm `api.auditFrostEffects()` reports one film mesh, at most one Stage II mist mesh, shared ticker time, actual Frost cell/stage counts, and no persistent rebuild/object growth.\n- [ ] For a Square Scene, confirm `api.auditEffects()` reports one mesh covering the actual fire cells, shared ticker time, correct 15×15 counts, and no persistent rebuild/object growth; inspect single, 1×3, 3×3, L-shaped, gap, stage-boundary, erase, undo/redo, Token-layer, and pan/zoom behavior manually.\n- [ ] Run with `P0+P1+P2`; confirm complete interaction, zero new owned sounds, and at most 16 cells per fire-light cluster.\n- [ ] On a fixture containing old module-owned and foreign AmbientSound documents, confirm the GM cleanup dialog lists only owned IDs, cancel is safe, stale fingerprints reject deletion, and confirmation leaves foreign sounds untouched.\n- [ ] Paint 25, 100, and 300 connected cells; record Tile, Region, Light, zero-new-Sound, and Wall document counts and visible performance.\n- [ ] Open scene clear preview; confirm only module-owned documents are counted and foreign documents are excluded.\n- [ ] Change the Scene after opening the clear preview; confirm the stale fingerprint blocks deletion and asks for a new preview.\n- [ ] Confirm clear is one undoable history operation and foreign documents survive clear, undo, redo, and reload.\n- [ ] Repeat P2 media, zero-new-audio, clustering, legacy cleanup, and clear checks on square, hex-row, and hex-column Scenes.\n- [ ] After runtime acceptance, set release phase controls immutable and verify the phase setter is absent from the public API.\n","foundry-modules/fvtt-blood-hunter-2024/README.zh-CN.md":"# 血猎手 2024 独立 Foundry 模块\n\n`fvtt-blood-hunter-2024` 是独立模块，版本为 `1.0.0`：默认构建精确对应 Foundry Virtual Tabletop `14.364`、dnd5e `5.3.3`；显式 `--target=server-next` 仍以 Foundry `14.368`、dnd5e `6.0.2` 作为编译内容身份，生成的 manifest 则记录 `minimum/verified=6.0.2`、`maximum=6.0.5`，用于当前 ServerNext 兼容检查。它提供三个 Item compendium pack：`classes`、`subclasses`、`features`。模块不依赖 Plutonium 或 classpack；MIDI-QOL `14.0.11` 与 DAE `14.0.12` 是旧目标推荐版本，不是硬依赖，不能据此推断 ServerNext 本机版本的额外自动化已经验收。\n\n## 构建\n\n构建必须使用已经接受的 `BloodHunter2024` enriched source JSON 的原始 UTF-8 bytes：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"C:\\absolute\\path\\BloodHunter2024.json\"\n```\n\n`--source` 必须是绝对路径。构建脚本只通过 `packages/blood-hunter-v14/src/index.ts` 的公开接口调用编译器，先把 raw bytes 交给编译器，再由公开 validator fail-closed。它不会复制编译器的匹配规则、ledger schema 或 Effect/Activity 生成逻辑；每次都以编译器返回的 `logicalHash` 为准，因此 coverageLedger 的语义修正会自然进入新构建。\n\n每次构建在随机临时根内完成两份候选结果：三份 LevelDB Item pack、canonical package、migration contract、coverage ledger、review、identity manifest 和确定性 ZIP。构建会比较两次结果的文档/UUID、manifest、logical identity、pack index、Activity/Effect 引用，并递归检查整个编译结果中的 12 个 dnd5e 外部 Item UUID（7 equipment、1 Boon、4 fighting styles）。缺少任何 UUID，或锁定的 `dnd5e/5.3.3/repo/packs/_source` reference cache 缺少对应 document，都会失败。Effect change 的 mode 等语义由最终编译器输出负责，模块只序列化输出。\n\n构建成功后才会把结果原子发布到本目录的 `dist/`：\n\n- `dist/module/`：可安装模块树；\n- `dist/fvtt-blood-hunter-2024.zip`：ZIP 及其 SHA-256；\n- `dist/module/data/identity-manifest.json`：source SHA-256、编译器 logical hash、81 documents、94 ledger、117 Activities、UUID 清单；\n- `dist/module/data/migration-contract.json`：浏览器迁移使用的 canonical/migration 契约。\n\n`dist` 不是运行中 Lab 的 pack；构建不会原地写 Lab 世界或运行中的 compendium。\n\nServerNext 的独立候选使用同一锁定原始 source，加 `--target=server-next`：\n\n```powershell\nbun run build:blood-hunter-v14 --source=\"F:\\FoundryLab\\foundry-v14\\data\\server-mirror\\Data\\assets\\homebrew\\blood-hunter-2024.activities.json\" --target=server-next\n```\n\n这一选项使用 Foundry `14.368` / dnd5e `6.0.2` 编译身份及 Advancement 形状，核对 `dnd5e/6.0.2/repo/packs/_source` 中的 12 个外部引用；输出 manifest 的兼容上限为 dnd5e `6.0.5`，而 `verified` 和内容身份保持 `6.0.2`。对这一编译目标，还从原文生成 2 级先授予的“战斗风格”基础特性，使四个官方战斗风格通过目标系统的先决条件；因此该目标有 77 项特性，旧目标仍有 76 项。省略选项仍构建旧目标。`dist` 一次只保存最后一次构建；旧 Lab 安装命令仍只允许 server-mirror，**不能用于安装 ServerNext 候选**。6.0.5 上的模块启用与人物行为读回应另行验收。\n\n## Lab 安装与验证\n\nLab CLI 只允许配置后的本地 `FVTT_OPS_LAB_ROOT`，目标严格为：\n\n```text\n\u003cFVTT_OPS_LAB_ROOT>/data/server-mirror/Data/modules/fvtt-blood-hunter-2024\n```\n\n示例：\n\n```powershell\nbun run foundry-modules/fvtt-blood-hunter-2024/labCli.ts dry-run\nbun run install:blood-hunter-v14\nbun run install:blood-hunter-v14 --apply\nbun run verify:blood-hunter-v14-install\n```\n\nCLI 会拒绝生产/远程变量、8080、路径逃逸、symlink/junction/reparse、LevelDB `LOCK` 或占用目标。已有同 ID 目录必须带本模块的 `data/owned-marker.json` 才能替换；foreign same-ID 目录会停止。替换前把旧目录移动到配置的 backup root，stage 通过完整 hash、manifest、pack documents/index 检查后再原子替换，并在失败时尝试恢复 backup。\n\n`verify-install` 只报告字节、manifest、LevelDB documents/index 和 identity 一致性；它不启动 Foundry、不启用模块，也不冒充真实 runtime 或游戏性 E2E。构建/测试只使用随机临时 Lab 根和配置的只读 `classic-level` 入口，不把真实 `F:\\FoundryLab\\foundry-v14` 的 app/data/world 当作数据库写入。\n\nFoundry Ops 的公开只读证据入口使用：\n\n```powershell\nbun run foundry:ops lab blood-hunter-v14 plan --input=\"C:\\absolute\\matrix-plan-input.json\"\nbun run foundry:ops lab blood-hunter-v14 verify-actor --input=\"C:\\absolute\\actor-snapshot-input.json\"\n```\n\n还支持 `inspect`、`verify-migration` 与 `evidence-manifest`。这些动作只读取显式 JSON 并返回验证结果，不启动 Foundry、不写世界，也不会把 pack/API 探针提升为 E2E PASS。\n\n## 迁移 UI\n\n模块在 `init` 阶段只注册 GM-only 菜单，不在 `ready` 自动扫描 Actor，也不自动修改任何 Actor。菜单标题是“血猎手 2024：角色迁移”。\n\n1. GM 明确输入 Actor ID 或精确名称后点击 `Preview`。Preview 只读，不写 Actor。\n2. flags `fvttJsonGenerator.bloodHunter2024.canonicalId` 优先；没有 flags 时，只有 `source + class/subclass + level + normalized name` 全部严格相等才使用 legacy match。多候选、重复 canonical 或歧义会停止。\n3. 点击 `Create migrated copy`，模块通过 Foundry 公共 Actor Document API 创建迁移副本，并生成 Actor JSON backup；副本通过非血猎手投影、选择/消耗、重复和 Activity/Effect 引用检查后，才允许下一步。\n4. `Apply original` 需要已有副本、通过副本验证、JSON backup，以及输入与 Actor 名称完全相同的确认文字。冲突逐项选择 `Keep`、`Overwrite` 或 `Cancel`；关闭窗口等同 `Cancel`。任何未决冲突都不能 Apply。\n\n迁移只原位更新唯一匹配的 Blood Hunter Item；没有现有对应项时不会自动补充特性，因为仅凭全包清单不能判定人物当前职业、子职与等级。缺少的特性须在正常升级流程中授予或由 GM 单独核对；不按名称批量删除，不改 HP、Actor system、职业等级、spent uses、已选 advancement、非 Blood Hunter Item 或其他 flags。Activity/Effect/说明冲突默认暂停。Apply 通过公共 Document API 完成；失败会用 Apply 前 JSON/Actor snapshot 补偿回滚，禁止直接写 LevelDB。\n\nCallum 的旧“破晓血仪” fixture（0 Activity、0 Effect）覆盖 Preview、迁移副本、Apply 和 rollback：原 Actor 在 Preview/副本阶段保持不变，副本应得到 5 Activity、2 Effect。\n\n## 自动化边界\n\n- **Core**：Foundry/dnd5e 原生 class、subclass、advancement、Activity/Effect 结构；不要求 MIDI-QOL 或 DAE。\n- **Modded**：可利用推荐的 MIDI-QOL `14.0.11` / DAE `14.0.12`，但模块不会把它们当作硬依赖，也不会把未验证效果宣称为原生自动化。\n- **assisted**：需要 GM/玩家按规则确认的跨 Item、目标条件、休息或选择流程；ledger/review 中会保留边界。\n- **external-rule**：依赖外部规则或外部 compendium UUID 的部分；identity manifest 会保留 12 个 dnd5e UUID，缺引用即 fail-closed。\n\n这是一次构建快照，不是实时同步：安装后不会监视远程 homebrew、旧 side-data 或 Actor 变化。旧 side-data 只作为迁移识别/审查的历史输入，不是权威规则来源；权威来源是本次 raw source 与公开编译器输出。线上生产 Foundry（8080）不在本任务部署范围内，也不会由本模块 CLI 触碰。\n","foundry-modules/fvtt-custom-conditions/CREDITS.md":"# Icon credits\n\nThis module bundles original SVG icons from [Game-icons.net](https://game-icons.net/). The pinned upstream source tree is [game-icons/icons at `82d948812bfe3f269ef8f731dcdb07b08160edc4`](https://github.com/game-icons/icons/tree/82d948812bfe3f269ef8f731dcdb07b08160edc4).\n\nEach SVG is copied byte-for-byte from the listed original download. Only the bundled filename and path differ; the artwork was not edited or traced. The SHA-256 values below identify the original downloaded SVG bytes. Paths in the table are relative to the built module; repository source stores these files under `src/`.\n\nLicense notice: the listed artworks are licensed by their respective creators under [Creative Commons Attribution 3.0 Unported (CC BY 3.0)](https://creativecommons.org/licenses/by/3.0/). Reuse is subject to that license; retain creator attribution and the license notice. Read the [full [lorc/lightning-mask](https://game-icons.net/1x1/lorc/lightning-mask.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/lightning-mask.svg) | `17257310891c245984cf5f859024fd3ecb50486a4a415fa7eaaf01a3c8dc80ac` |\n| `icons/sickened.svg` | Vomiting | lorc | [lorc/vomiting](https://game-icons.net/1x1/lorc/vomiting.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/vomiting.svg) | `471d3f1b75aced94aae3ec556cbcc0778c0144a9ff077b5df274c040df4a73d0` |\n| `icons/slowed.svg` | Snail | lorc | [lorc/snail](https://game-icons.net/1x1/lorc/snail.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/snail.svg) | `fd8b59c083b33bbcd635e38c15a6f1d8406d2b09a8bcfbcdcd2b4a6f4e550a8e` |\n| `icons/staggered.svg` | Foot Trip | lorc | [lorc/foot-trip](https://game-icons.net/1x1/lorc/foot-trip.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/foot-trip.svg) | `1e4553c2321284c0f12047ea64914ec862879e2b7b0dabfe61ef6fed86db2da5` |\n| `icons/valor.svg` | Winged Sword | lorc | [lorc/winged-sword](https://game-icons.net/1x1/lorc/winged-sword.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/winged-sword.svg) | `430f92df91565fde56a4c6d297cd2936bbd3967a40b8297d2ad62e578575a649` |\n| `icons/weakened.svg` | Sword Break | lorc | [lorc/sword-break](https://game-icons.net/1x1/lorc/sword-break.html) | [download](https://game-icons.net/icons/ffffff/transparent/1x1/lorc/sword-break.svg) | `cd9a27e5dd58a3cd907fe4231f1da4cb0e358035be4a81bc93c78e281674b0d3` |\n","foundry-modules/fvtt-custom-conditions/README.zh-CN.md":"# FVTT Custom Conditions\n\n这是一个面向 Foundry VTT 14.364 / dnd5e 5.3.3 的自定义状态模块。它依赖 `fvtt-trigger-engine` 提供的通用 Actor 更新、回合开始和回合结束事件。\n\n模块内置 Monsters of Drakkenheim 条件目录中的 19 个状态。Bloodied 使用 dnd5e 原生能力；Drakkenheim Madness 与 Contamination 本期不加入目录。\n\n每个状态由固定 Definition 和 Actor 上的 Condition Instance 组成。Bleeding、Burning、Frozen、Jinxed、Valor 的骰式或 DC 属于实例参数，所以同一个状态可以在不同生物上使用不同数值。参数保
