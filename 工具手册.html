es runtime | **Not accepted** | No runtime behavior is claimed. | No V12 Lab exists on this machine. Token 2×2, Add Species UI, level 1→5 grant processing, HP/AC values, use depletion, Long Rest recovery, restart/readback, installation and migration remain unperformed. | Static evidence above must not be promoted to Runtime Pass. |\n| AI monster intake | **Pass, bounded Lurker and Rat Warlock workflows; review-required failures verified** | Raw TXT/MD monster input can pass AI boundary discovery, evidence-backed IR, deterministic Markdown rendering, existing project generation, deterministic source/IR/Markdown/Actor comparison, independent review, and one bounded repair. The Lurker reached accepted and its v14/core Actor passed Foundry 14.364 / dnd5e 5.3.3 import/readback. A separate messy Rat Warlock TXT reached direct Web `accepted` with one extraction, one review, zero repair/findings; the reviewed v14 Actor retained conditional AC text, full innate-spellcasting prose, three separate traits, bonus-action Skulker activation, and Bite attack mechanics. | Monster/NPC only, at most 50 creatures and 200,000 UTF-16 characters. No OCR, PDF/image, Item, arbitrary-text guarantee, or equal-quality guarantee across models. The original 2026-07-17 pre-resolver Rat artifact was not separately imported; the later source-manifest Rat runtime acceptance is the bounded resolver evidence below. Fresh stochastic evidence/coverage failures correctly enter `needs_review` and are not promoted. Codex OAuth was exercised only through an unofficial temporary localhost bridge, not claimed as OpenAI Platform API support. | [Parent remediation ledger](../remediation/2026-07-15-project-hardening/EXECPLAN.md); [operator guide](../manual.md) |\n| Schema validity | **Pass, current targets** | v12/v13 use the dedicated dnd5e 4.3.9 projector and strict structural assertions; v14 uses the independent dnd5e 5.3.3 projector. Shared verification rejects missing mechanics, save drift, duplicate IDs, dangling effects, legacy activation/uses fields, and core-profile module leakage. | Structural validation does not prove import migration, sheet rendering, or Activity execution. The 2026-07-30 checkout did not contain the listed project-local Foundry 14.364 runtime, so this milestone adds no new runtime Pass. | [Core batch](v14-core-batch-verification.md); [modded batch](v14-modded-batch-verification.md); [current corpus](current-corpus-matrix.md); parent remediation ledger |\n| CLI/workflow generation | **Pass, represented flows** | Actor, Item, single-file, collection, Vault Sync, CLI, and Web jobs share one canonical IR/projector/verification pipeline. A non-accepted result is withheld from formal output and collection ZIPs. Oregg, Shield, and Jewel v12/v14 controls were regenerated only through `src/index.ts`. | Runtime import/export is a separate layer. Generated JSON was not hand-repaired, and new Spell/Feat/Class/PC Builder product types are outside this milestone. | [Current corpus](current-corpus-matrix.md); parent remediation ledger |\n| v14 name-driven Item artwork | **Pass, opt-in safe mode** | Foundry 14.364 / dnd5e 5.3.3 metadata builds a deterministic core/dnd5e-only catalog. CLI, Actor, standalone Item, collection, Vault Sync, AI Intake reuse and Web jobs share exact/structured-safe/fallback resolution and emit separate review reports. A 1,093-Item existing-output audit resolved 328 exact, preserved 54 existing and safely fell back 711 with zero unavailable paths; the project-CLI Nightgaunt artifact imported into the locked local runtime and all six images returned HTTP 200 and decoded. | Off by default; v12/v13 fail closed. Fallback means no sufficiently safe semantic claim, not that every feature receives unique artwork. Third-party module artwork and remote URLs are excluded; custom exceptions require the external override file. The bounded runtime import was cleaned up and does not prove arbitrary future catalog versions. | Parent remediation ledger; generated Nightgaunt icon review sidecar |\n| Core Actor runtime | **Pass, six-Actor local sample** | Six v14/core Actors imported into Foundry 14.364 / dnd5e 5.3.3, opened, executed representative Activities, and re-exported with reviewed semantics retained. | This does not cover standalone Item runtime or arbitrary Actors. | [Live runtime smoke](v14-live-runtime-smoke-test.md); [source/JSON review](v14-source-json-full-review.md) |\n| Minimal modded Actor runtime | **Pass for the locked MIDI bleeding and `isDamaged` contracts; Partial overall** | MIDI-QOL 14.0.9 + DAE 14.0.12 + dependencies retain the earlier Bleeding Guardian proof and now remove a CLI-generated Dread Brand effect after actual subsequent damage. | These are two bounded module contracts, not a blanket claim for arbitrary automation or the full production module set. | [Live runtime smoke](v14-live-runtime-smoke-test.md) |\n| Source-derived `isDamaged` generation | **Pass at code/CLI/schema layer** | A neutral per-status source-duration hint is mapped only by `modded-v14` to DAE 14.0.12 `flags.dae.specialDuration: [\"isDamaged\"]`; core strips DAE flags. Core/modded fixture Actors are otherwise source-equivalent. | Locked source shows MIDI-QOL 14.0.9 consumes actual damage and removes the effect. Static evidence is not runtime proof. | [Current corpus](current-corpus-matrix.md); [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md) |\n| Source-derived `isDamaged` runtime | **Pass, locked stack** | The CLI modded-v14 Dread Brand dealt 6 damage and left Frightened active; a later CLI Stone Fist dealt 4 and DAE+MIDI expired/removed it. The CLI core artifact dealt 8, then 9 more damage, and retained the same source-derived effect without `specialDuration`. | This proves only DAE 14.0.12 + MIDI-QOL 14.0.9 with Foundry 14.364/dnd5e 5.3.3. It does not prove exact production coexistence. | [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md); [live runtime smoke](v14-live-runtime-smoke-test.md) |\n| Standalone Item generation | **Pass at source/CLI/schema layer** | The real Shield has neutral-template isolation, shield base AC 2 + magical bonus 2, correct type/properties/weight, Forceful Bash damage/prone linkage, Protective Field reaction/dawn/duration/concentration/radius, portable v14 metadata, and self-Activity use consumption. | Runtime behavior and round-trip evidence are separate layers and now also pass for the bounded Shield workflow; this row still makes only a generation-layer claim. | [Current corpus](current-corpus-matrix.md); [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md) |\n| Standalone Item v14 runtime | **Pass, bounded Shield workflow** | CLI JSON imported through Foundry's public workflow; a disposable Actor showed AC `10 -> 12 -> 14`; Forceful Bash attack/damage/prone and Protective Field 1/day depletion, 60-second concentration, second-use rejection, and runtime readback passed. A no-dialog `exportToJSON()` round trip produced a 9,727-byte artifact whose full source-relevant projection matches the CLI artifact. | This is one representative standalone Item workflow, not proof for every Item schema or arbitrary JSON. Native Chrome-extension file pickers remain unsuitable for unattended automation. | [M9 plan evidence](../remediation/2026-07-15-project-hardening/milestones/09-product-acceptance-and-support.md); [no-dialog runbook](../runbooks/foundry-json-transfer-without-file-dialog.md) |\n| Copied-world sampled usability | **Pass, narrowly sampled** | In the local `cor-cotn` copy, a real character sheet, save/chat card, Journal, Scene documents, and Token restoration were exercised after an explicitly authorized local-only Gamemaster reset. | This is not an error-free world or complete module result. Swipe production/touch acceptance remains Partial. | [Module compatibility](foundry-v14-module-compatibility.md); [live runtime smoke](v14-live-runtime-smoke-test.md) |\n| Historical 88-module production-snapshot reproduction | **Historical Fail / Partial; not a current gate** | The 2026-07-11 mirror attempt accurately records that an older 88-active-ID production snapshot could not be reproduced exactly and that its reduced candidates still had gaps. | The user-directed 2026-07-12 cleanup later changed the intended module state locally and applied selected changes to production. The old 88-ID snapshot is therefore not the current intended package set, and its protected MCDM package is not a standing prerequisite for this project. | [Module compatibility](foundry-v14-module-compatibility.md); [local/production optimization log](foundry-v14-local-optimization-log.zh-CN.md) |\n| Production deployment state | **Partial, historical evidence only for this remediation turn** | The dated production log records deployed Swipe/Bloodsplats changes, retained/disabled modules and settings, and sampled light/heavy scene health. | The final verified local baseline was 79 enabled modules, not a production-count claim. This remediation turn did not re-inventory current production, so it claims neither 88 nor 79 production modules. Swipe session validation, Token drag, complete attack/damage, and Item Piles touch coexistence remained unaccepted. | [Local/production optimization log](foundry-v14-local-optimization-log.zh-CN.md); [module compatibility](foundry-v14-module-compatibility.md) |\n| Authenticated GoddessFantasy crawl | **Pass, bounded board sample** | With explicit user authorization, the existing Chrome session discovered 54 topics, matched/crawled 37 monster topics, emitted 47 plaintext statblocks, regenerated 47 v14/core Actors, and passed 47/47 verifier checks plus expanded semantic projections. Cookies and credentials were neither inspected nor exported. | This proves board 2318 pages available to that session at the run timestamp, not every board, future login state, arbitrary statblock syntax, or production deployment. Raw authenticated crawl state remains local and untracked. | Parent remediation ledger; tracked 47 vault inputs and live-semantic fixture |\n| Web/API deployment boundary | **Pass at application layer** | Loopback-only default, explicit authenticated public/proxied mode, trusted proxy identity, pre-materialization body checks, rate/job caps, cleanup, process probes, and real browser Actor/ZIP workflows pass. | Public TLS, reverse-proxy identity, firewalling, OS limits, and distributed quotas remain infrastructure responsibilities. | [Deployment guide](../web-deployment.md); remediation Milestone 8 evidence in the parent ledger |\n\n## Safe resume boundaries\n\n### Local Foundry Item transfers\n\nThe Shield import/behavior/export proof is complete. Future unattended transfers must follow the [no-dialog runbook](../runbooks/foundry-json-transfer-without-file-dialog.md): use Foundry's public `importFromJSON()` and `exportToJSON()` methods, transfer JSON text rather than a filesystem path, capture the exact export Blob before native download, restore temporary page instrumentation in `finally`, compare source-relevant semantics, and clean/stop/restore. Do not write LevelDB directly and do not touch production.\n\n### Authenticated GoddessFantasy crawl\n\nThe 2026-07-16 authorized run is accepted. Future authenticated reruns still require explicit authorization for the then-current session. Keep secrets out of arguments, tracked files, logs, and reports. Prefer in-place browser-session use or an ignored cookie-header file / `GODDESSFANTASY_COOKIE` environment variable. The CLI credential route remains:\n\n```powershell\nbun run src/tools/crawlSites.ts goddessfantasy-pipeline --cookie-header-env GODDESSFANTASY_COOKIE --mode incremental --content-type monster --effect-profile core --fvtt-version 14\n```\n\nDo not add `--skip-auth-probe`; the authenticated board probe is part of acceptance. Every rerun must review provenance plus representative `records.json` -> plaintext -> CLI Actor semantics and must not reuse the old authorization for a materially different session or board.\n\n### Historical module-snapshot boundary\n\nThe 88-module figure belongs only to the 2026-07-11 production inventory snapshot. The later cleanup record verifies a 79-module local `server-mirror` baseline and separately records selected 2026-07-12 production changes; it does not record a post-cleanup production active count. A future production compatibility audit must begin with a fresh read-only inventory and an explicitly agreed intended set. It must not resurrect the old 88-ID snapshot or require the protected MCDM package unless that fresh inventory and user scope actually include it.\n\n## Claim rule\n\nThe project currently supports the exact-target and bounded FVTT JSON Forge A–E product slice above, source-faithful generation for the bounded corpus, bounded TXT/MD monster AI Intake with strict `needs_review`, and the **Partial** exact-target AI Item Intake described above, v12 by default, explicit v14 generation, the exact Foundry 14.364 / dnd5e 5.3.3 target-world Rat spell-resolver workflow accepted below, core Actor runtime samples, the bounded standalone Shield v14 import/behavior/export workflow, the narrow locked MIDI bleeding workflow, the locked DAE+MIDI `isDamaged` contract, and the bounded 2026-07-16 authenticated GoddessFantasy board-2318 ingestion. It does **not** currently support a blanket claim of full Foundry v14 production compatibility, Forge on runtime versions other than exact Foundry 14.364 / dnd5e 5.3.3, arbitrary Forge provider/model/source correctness, page-closed background execution, multi-Document atomicity, a v12 spell resolver, production resolver deployment, bulk spell migration, the current production module count, OCR/PDF/image Intake, arbitrary Item Intake/runtime behavior, arbitrary authenticated boards/statblock syntax, or arbitrary standalone Item round trips.\n\n## 2026-07-15 M10 Pre-Final Audit\n\n- Mechanical repository gates: production and broad typechecks pass; 738 tests / 2,921 expectations pass; production coverage is 87.54% lines and 88.40% functions; all-source anti-overfit passes with 109 sources; dnd5e 5.3.3 reference verification and Web build pass; Foundry Lab passes 116 tests / 417 expectations; repository hygiene passes across 1,605 tracked paths.\n- Regeneration: v12/core, v14/core, and v14/modded-v14 Damage-Bound Warden Actors, the v14/core Shield, and the unrelated v12 Jewel were regenerated only through `src/index.ts` into ignored output paths.\n- Semantic review: all three Actor verifier runs have zero warnings. Explicit assertions pass for source identity/stats/type/version metadata, native attack damage and reach, exactly scoped frightened/DAE behavior, the complete Shield armor/Activity/prone/reaction/duration/range/recovery projection, and absence of Shield mechanics on the Jewel.\n- At that pre-final checkpoint, the browser upload/download smoke, Shield live behavior, and DAE+MIDI removal were unaccepted alongside authenticated crawl and exact production coexistence. The runtime amendment below supersedes the first three items while preserving the dated audit chronology.\n\n## 2026-07-15 Runtime Resume Amendment\n\n- Chrome file access unblocked Foundry's supported Import Data path. Shield import exposed and drove generalized fixes for portable `_stats.lastModifiedBy` and limited self-Activity consumption; Damage-Bound Warden exposed and drove the generalized `untilDamaged` Activity duration `spec` fix.\n- Semantic runtime acceptance now passes for Shield AC, Forceful Bash attack/damage/prone, Protective Field one-per-dawn depletion/concentration/second-use rejection/runtime readback, and the modded removal versus core retention `isDamaged` control.\n- The complete rerun passes 743 tests / 2,932 expectations, 87.55% line / 88.41% function production coverage, both typechecks, 109-source anti-overfit, 1,605-path hygiene, locked reference verification, Web build, and offline smoke. One first-run token-review timeout passed 2/2 alone and the complete rerun; it remains recorded as scheduling debt rather than hidden.\n- At this dated checkpoint, the only remaining local Item evidence gap was a downloaded UI Export Data artifact and CLI-versus-export semantic comparison; the 2026-07-16 amendment below supersedes that gap. Authenticated crawl and exact protected/full module coexistence remain external boundaries.\n\n## 2026-07-16 No-Dialog Transfer Amendment\n\n- External research confirmed that `DOM.setFileInputFiles: Not allowed` is an extension-mode transport limitation reproduced by Playwright MCP and OpenAI Codex users; Chrome's file-URL permission is not a reliable unattended fix.\n- The existing CLI Shield JSON was imported in the local matrix world through Foundry 14.364's public `importFromJSON()` method. Foundry's public `exportToJSON()` then ran unchanged, while its exact JSON Blob was captured before native download handling.\n- The 9,727-byte export matches the CLI artifact on every source-relevant field. Foundry-only differences are export provenance, timestamps/user/document identity, and schema-default expansion; no source mechanic drift was found.\n- The disposable Item was deleted, temporary page instrumentation was restored, port 30001 was released, `options.json` returned to `cor-cotn`, and production was untouched. PROD-002 and SEM-005 are closed; authenticated crawl and exact protected/full module coexistence remain external boundaries.\n\n## 2026-07-16 Module-Snapshot Correction\n\n- The preceding dated checkpoints incorrectly carried the 2026-07-11 88-ID production snapshot forward as a current intended set after the 2026-07-12 cleanup record had changed the local baseline and recorded later production changes.\n- The accepted local cleanup baseline is 79 enabled modules. That number is not a current production count; this remediation turn performed no fresh production inventory.\n- PROD-005 is closed as a scope/report correction, not a coexistence Pass. The 88-ID failure remains historical evidence, while future production compatibility work requires a fresh read-only inventory and explicit user scope. PROD-003 is the only remaining external Goal boundary.\n\n## 2026-07-16 Authenticated Crawl Amendment\n\n- The user explicitly authorized the existing logged-in Chrome session. The session was used in place: no cookies, password, local storage, or credential header was inspected or exported.\n- Board 2318 produced 54 discovered topics, 37 matched/crawled monster topics, 37 records, and 47 plaintext statblocks with zero crawl/plaintext failures. The first JSON run was mechanically clean but failed semantic review, exposing fractional-CR truncation, `暗蚀` loss, language/taxonomy qualifier loss, replacement-damage overcounting, and simultaneous automation of staged save outcomes.\n- Generalized source/corpus-derived repairs passed 52 focused tests. All 47 Actors were regenerated through the project CLI and passed 47/47 verifier checks. Expanded live projections passed for one fractional CR, 25 qualified-language records, 10 variable-taxonomy records, the Gremishka replacement-damage branch, and the Petrifying Death's Head staged save while preserving literal descriptions.\n- The current aggregate gate passes 804 tests / 3,136 expectations, 85.18% production lines / 87.48% production functions, both typechecks, 117-source anti-overfit, locked dnd5e reference verification, Web build, and offline smoke; repository hygiene passes across 1,673 tracked paths. Foundry Lab separately passes 116 tests / 417 expectations. The Rat Warlock sample was not separately imported into Foundry, so its acceptance remains at the Web/project-generation/verifier layer.\n\n## 2026-07-19 Spell Resolver Qualification\n\nThe 2026-07-17 Rat Warlock AI Intake acceptance remains valid for its reviewed non-spell statblock intake scope. Functional spell resolution is not accepted: `SPELL-001` remains open because the generated Actor has no portable ten-spell resolver manifest, no resolved embedded spell items, and no pending resolver state. This qualification remains in force until the exact local Foundry runtime gate passes; it does not alter the prior intake evidence or claim a production-world migration.\n\n## 2026-07-19 Spell Resolver Closure Amendment\n\nThe preceding qualification is superseded for the exact accepted local target. The current project workflow produces a source-evidenced ten-spell portable manifest with status `pending`, no placeholder Spell, and no destination UUID. In the project-local Foundry `14.364` / dnd5e `5.3.3` disposable world, the resolver hydrated the Rat Warlock to ten native Cast Activities and ten one-to-one cached Spells, exercised attack/save/utility and limited/at-will use, preserved native use after module disable, proved 2024-first plus isolated 2014 fallback behavior, and passed Keep/Overwrite/Cancel, exact rollback/residual, idempotency, and unrelated-Actor checks. The full evidence and limitations are recorded in [Rat Warlock Target-World Spell Resolver Acceptance](./2026-07-18-rat-warlock-spell-resolver.md).\n\n`SPELL-001` is closed only for Foundry `14.364` / dnd5e `5.3.3`. This amendment does not claim a v12 resolver, OCR/PDF intake, production installation, bulk migration, compatibility with later runtime versions, or complete automation of literal source-specific restrictions.\n## ServerNext 6.0.5 本地恢复切片（2026-10-01）\n\n原十个自有模块因 maximum6.0.2而停用，现已从独立候选更新并恢复原94启用ID／版本集合。80个非packs文件逐项SHA核对通过、全部安装packs保持；后续限定修正 Deck 的力竭效果 ID 和 Painter 火焰几何／视频加载。49DLC来源字段和无关ID／场景状态保留，十项正常 GM 重载读回全部通过。\n\n本轮接受代表切片：House 药水手改保护／恢复，Deck 力竭3→4→3，Resolver 自动十法术水合及一次普通UI Undo 后 pending／0缓存，Painter 原两格可见动画火焰／Region／light及重载保持，Babele 可见25／5行中文嵌入与原UUID，Injury 公共状态API与恢复，Monitor 短会话start／mark／stop／历史持久；Blood Hunter／Species 为既有内容身份和合集读取，Chat Guard 为公开诊断统计。它不提升为所有玩法／所有模块组合通过；天然19、完整Cast矩阵、长测和生产未执行。精确清理已通过，原90 Macro、两条 Monitor 历史及设置／视图状态恢复。额外获准 Midi local.10 的三文件与四语言文件限定安装、packs保持、正常Check／Save各+4及其精确清理通过；当前94启用ID相同，唯一版本变化为Midi local.9→local.10。详见[本轮限定接受记录](../reviews/2026-10-01-next-605-custom-module-restoration.md)和[Midi请求修复接受](../reviews/2026-10-01-next-605-midi-request-bonus-gap.md)。\n\n5.x固定5.3.3与6.x稳定跟随的长期方向见[版本流程](../runbooks/dnd5e-version-following.md)。这不扩大既有生成器Actor／Item默认或6.x通用接受，也不改写旧14.364/5.3.3及14.368/6.0.2证据。\n","docs/document-input-workflow.md":"# 图片 / PDF 文档输入\n\n文档输入只承诺 NPC/怪物 Actor，流程固定为：\n\n```text\n图片/PDF → 本地提取 → 候选筛选 → 原始 Markdown → 候选翻译 → AI Intake → 现有生成器 → Actor JSON\n```\n\n## CLI\n\n```text\nbun run src/index.ts \u003cfile.pdf|file.png> --extract-only\nbun run src/index.ts \u003cfile.pdf|file.png> --document-candidate \u003ccandidate-id>\nbun run src/index.ts --document-doctor\n```\n\n支持的参数：\n\n- `--document-engine auto|native|paddleocr`\n- `--document-language auto|en|zh-CN|mixed`\n- `--document-candidate \u003cid>`（可重复）\n- `--extract-only`\n- `--document-target-language \u003clanguage>`（默认 `zh-CN`）\n\n每次运行会在 `.local/document-runs/\u003crun-id>/` 生成 `raw-extracted.md`、`document-candidates.json`、`extraction-report.json`。原始 PDF/图片不会复制进 Vault manifest。\n\n## 本地 OCR\n\n普通 PDF 优先使用 PDF 内嵌文字和坐标；没有可靠文字层的页面会用 `pdfplumber` 的本地 PDFium 渲染后交给 PaddleOCR。图片直接走 PaddleOCR。Tesseract 只作为英文标点和专名提示，不替代主 OCR。\n\n先运行 `bun run document:doctor`。如果需要创建隔离环境，可在项目根目录使用 Python 3.12：\n\n```text\nuv venv .local/document-ocr --python 3.12\nuv pip install --python .local/document-ocr/Scripts/python.exe pdfplumber paddleocr==3.7.0 paddlepaddle==3.2.0\n```\n\n不同机器的 Paddle/PaddleOCR 组合可能不同；以 `document:doctor` 和一次真实图片 smoke 为准。OCR 缺失时流程会给出错误，不会静默把乱码送进生成器。\n\n## 翻译和 Intake 边界\n\n过滤发生在翻译之前，只有被选中的高置信度候选会进入 Markdown 翻译。翻译服务缺失、结果为空或机械字段占位符丢失时，候选会停在 `needs_review`，不会生成正式 JSON。\n\nOCR Markdown 不是项目的结构化 YAML/Markdown 契约。正式生成默认需要现有 AI Monster Intake 配置；没有 Intake 配置时，文档链路会 fail closed。普通 `.md`、`.markdown` 和 `.txt` 仍走原来的入口，不受影响。\n\nWeb 入口使用二进制 `multipart/form-data` 上传，检查文件大小、MIME 和文件签名，并在任务沙箱中保存输入；提取完成后在任务摘要和报告中提供页数。任务完成后可下载候选清单、报告、原始/翻译 Markdown、标准 Markdown 和 Actor JSON；上传模式不会修改 Vault manifest。\n","docs/examples/召唤生物-人类写法模板.md":"# 【遭遇或生物组合名称】\n\n> 人类填写用的原始资料模板。把【】替换为你的内容；没有的能力写“无”。下面是普通 Markdown 规则文字，不需要填写程序字段。\n> 本模板对应 Forge 0.3.0 候选的“从人类写法MD生成战斗包”入口。生成仍需通过来源与自动化审核；填写模板不等于保证自动通过。当前真实验收状态以该候选的验收记录为准。\n\n## 这份资料包含什么\n\n这份资料包含两种独立生物：**【主生物名称】**和**【被召唤生物名称】**。\n\n【主生物名称】使用“【召唤能力名称】”时，会召唤【数量】只【被召唤生物名称】。两种生物分别有自己的数据卡；召唤能力属于主生物。被召唤生物的完整数据写在后面。\n\n我希望角色目录中生成两个生物条目。实际使用召唤能力时，从被召唤生物的条目在场景中放置对应数量的指示物；每只召唤物单独记录生命值和状态。召唤多只同种生物时，不要在角色目录中反复创建同一种生物。\n\n## 生物一：【主生物名称】\n\n【体型】【生物类型】，阵营【阵营】。\n\n- 护甲等级：【数值及护甲来源】。\n- 生命值：【固定上限】。生命骰：【公式；不使用则写无】。若两者不一致，以【固定上限或生命骰结果】为准。\n- 速度：【步行、飞行、游泳、攀爬、掘穴速度；写明单位】。\n- 力量【】、敏捷【】、体质【】、智力【】、感知【】、魅力【】。\n- 豁免：【豁免属性和总加值；没有则写无额外熟练】。\n- 技能：【技能名称和总加值】。\n- 伤害抗性：【】。伤害免疫：【】。伤害易伤：【】。\n- 状态免疫：【】。\n- 感官：【感官、距离和被动察觉】。\n- 语言：【】。\n- 挑战等级：【】。熟练加值：【】。\n- 先攻：【总加值；或写仅使用敏捷调整值】。\n\n### 特性\n\n**【特性名称】。**【完整规则。写清触发条件、受影响对象、效果和结束条件。没有则写无。】\n\n### 动作\n\n**【攻击名称】。**【近战或远程】攻击，命中加值【】，触及或射程【】，目标【】。命中后受到【伤害骰及类型】。附加效果：【无，或完整写出豁免属性、DC、成功与失败的不同结果】。\n\n**【其他动作名称】。**【次数或充能、消耗、目标、范围和完整效果。没有则写无。】\n\n### 召唤能力：【召唤能力名称】\n\n【主生物名称】以【一个动作／一个附赠动作／消耗几个传奇动作／满足条件时触发】使用此能力，每【日／短休／长休】可以使用【次数】次，或以【充能规则】恢复。\n\n使用时，【是否先进行攻击、豁免或其他结算；没有则写直接召唤】。在【何时：宣告后、命中后、豁免结算后等】召唤【数量】只**【被召唤生物名称】**，使用下方的完整数据。\n\n- **位置：** 出现在【距离谁多少尺】的【可见／无需可见】未占据空间。由【GM手选／自动选择满足条件的最近空位】放置，必须容纳其完整体型。\n- **成功与失败：** 【召唤是否依赖前置攻击命中或豁免失败？成功时也召唤吗？没有前置检定则写无检定。】\n- **没有空位时：** 【整次能力取消且不消耗资源／其他明确处理方式】。如有前置伤害，写清是在伤害结算前检查，还是伤害仍然发生但召唤失败。\n- **归属与控制：** 对【谁】友好，对【谁】敌对；由【GM／指定玩家】控制。指挥是否需要额外动作：【】。\n- **先攻：** 【独立掷先攻／沿用召唤者先攻／紧接召唤者之后行动】。战斗中加入【哪一场战斗】；非战斗中使用时【不创建战斗／由GM决定】。\n- **首次行动：** 【生成时立即行动／不立即行动】。如果加入战斗时它的行动时点已经过去，【本轮如何处理】。\n- **持续时间：** 【永久存在直到被摧毁／若干轮／若干分钟】。在【具体时点】结束。\n- **专注：** 【是否需要；如需要，何时因专注结束而消失】。\n- **数量上限：** 每个召唤者最多同时维持【数量】只。再次召唤超过上限时【不能使用且不消耗／替换旧召唤物／其他规则】。\n- **死亡与消失：** 召唤物生命值归零时【处理方式】；召唤者死亡或失去意识时【处理方式】。说明是否移除场景指示物和对应战斗成员。\n- **其他关联：** 【召唤物是否继承召唤者能力、共用资源或具有其他关联；没有则写无】。\n\n### 附赠动作、反应与传奇动作\n\n【逐项写出；没有则写无。若有传奇动作，写清每轮次数、恢复时点和各选项消耗。】\n\n## 生物二：【被召唤生物名称】\n\n【体型】【生物类型】，阵营【阵营】。\n\n数据来源：【本节完整定义的自制生物／明确版本的官方生物资料】。如果使用官方红龙，写清是雏龙、青年龙、成年龙还是远古龙，并提供实际使用的数据或可核对的来源；不要只写“红龙”。\n\n- 护甲等级：【】。\n- 生命值：【固定上限】。生命骰：【公式或无】。采用【固定上限或掷骰】。\n- 速度：【所有移动方式及单位；不能移动则明确写出】。\n- 力量【】、敏捷【】、体质【】、智力【】、感知【】、魅力【】。\n- 豁免：【】。技能：【】。\n- 伤害抗性：【】。伤害免疫：【】。伤害易伤：【】。状态免疫：【】。\n- 感官：【】。语言：【】。\n- 挑战等级：【】。熟练加值：【】。先攻：【】。\n\n### 特性\n\n**【特性名称】。**【完整规则。】\n\n### 动作\n\n**【动作名称】。**【消耗、攻击加值或豁免DC、目标、射程或区域、伤害骰、伤害类型、成功与失败结果。】\n\n### 自动触发的能力\n\n**【能力名称】。** 在【自己的回合开始／自己的回合结束／其他明确时点】，对【范围内哪些生物，是否包含盟友和召唤者】生效。每【回合或轮】最多【次数】次；目标进行【属性】豁免，DC【】，失败【】，成功【】。刚被召唤时【是否额外触发】；生命值归零后【是否停止】。\n\n【没有自动触发能力则写无。】\n\n### 附赠动作、反应与传奇动作\n\n【逐项写出；没有则写无。】\n\n## 我希望自动完成与由GM决定的部分\n\n自动完成：【例如消耗次数、放置召唤物、绑定召唤者、加入战斗、掷先攻、到期移除】。\n\n由GM决定：【例如选择目标、选择召唤位置、决定红龙本回合攻击谁】。\n\n资料没有写明而又影响规则的内容，请列出缺项，不要自行补成已经确认的规则。\n","docs/examples/晶血龙兽与月石晶体-人类写法.md":"# 晶血龙兽与月石晶体\n\n## 这份资料包含什么\n\n这份资料包含两种独立生物：**晶血龙兽（Crystalbleed Drakon）**和**月石晶体（Moonstone Crystal）**。\n\n晶血龙兽拥有“晶片齐射（Shard Salvo）”传奇动作。无论目标在这次动作中的体质豁免成功还是失败，齐射完成后都会在目标旁边的一个空位生成一只月石晶体。月石晶体有自己的生命值、先攻、回合和状态；它不是晶血龙兽的一部分，也不与晶血龙兽共用生命值。请分别建立两个独立的生物条目；每次生成的晶体都应当是一个独立指示物，单独记录生命值和状态。\n\n资料中提到的自动处理，是希望配套自动化能够协助记录守护状态、处理召唤和先攻，并在晶体自己的回合执行戳刺。自动化不能替代来源没有写明的召唤持续时间、数量上限、召唤者死亡后的处理或其他需要 GM 确认的规则。\n\n## 生物一：晶血龙兽（Crystalbleed Drakon）\n\n巨型龙，通常为中立邪恶。\n\n- 护甲等级：19（天生护甲）。\n- 生命值：固定为 176。生命骰公式：14d12+42。二者不是同一个平均值；使用时保留固定生命上限 176，并保留 14d12+42 作为生命骰公式。\n- 速度：步行 40 尺、掘穴 30 尺、飞行 80 尺、游泳 40 尺。来源没有列出攀爬速度。\n- 力量 23、敏捷 14、体质 20、智力 16、感知 19、魅力 18。\n- 豁免熟练：敏捷 +7、体质 +10、感知 +9、魅力 +9。来源没有列出力量和智力的额外豁免熟练。\n- 技能：察觉 +9、游说 +9、隐匿 +7。\n- 伤害抗性：无。伤害免疫：无。伤害易伤：来源未列出。\n- 状态免疫：魅惑、恐慌、中毒、震慑、变形。\n- 感官：盲视 60 尺、黑暗视觉 150 尺、被动察觉 19。\n- 语言：通用语、龙语、地底通用语（Undercommon）。\n- 挑战等级：13。经验值：10000。熟练加值：+5。\n- 先攻：+12。\n\n晶血龙兽全身的晶体会随着心跳渗出暗红液体，绯晶像水流一样环绕在它身侧。战斗前启用配套的战斗控制自动化，以协助处理月蚀守护、晶体召唤和回合效果；页面刷新后需要重新启用这套自动化。\n\n### 特性\n\n**两栖（Amphibious）。** 晶血龙兽可以在空气和水中呼吸。\n\n**月蚀守护（血魔法）。** 每当晶血龙兽原本将要从一次伤害结算中受到超过 20 点伤害时，水流般的绯晶会环绕它，使这次伤害减半，向下取整。同一次伤害结算中包含不同伤害类型时，先把这些伤害合计，再判断是否超过 20 点。总伤害为 20 点或更少时不会减免。\n\n在绯晶拒绝造成的守护碎裂期间，月蚀守护不减免伤害。绯晶拒绝的次数耗尽后，守护恢复为削弱形态：超过 20 点的伤害只能减少熟练加值，也就是减少 5 点，不能再减半。守护碎裂和恢复为削弱形态的变化应当清晰可见。\n\n**绯晶拒绝 [2/日]（Ruidium Defiance）。** 当晶血龙兽豁免失败时，它可以把这次豁免改为成功。使用这个能力的代价是月蚀守护碎裂；守护持续失效，直到晶血龙兽的下一回合开始。这一变化清晰可见。\n\n这个能力每天可以使用两次。两次使用次数耗尽后，月蚀守护即使恢复，也只能按削弱形态运作：超过 20 点的伤害只能减去熟练加值 5，不能减半。绯晶拒绝不改变晶血龙兽的护甲等级，也不改变伤害抗性。\n\n**绯晶腐化（Ruidium Corruption）。** 只有当某个能力明确要求进行这项结算时，目标才进行一次 DC 18 魅力豁免。豁免失败时，目标受到绯晶腐化；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。豁免成功时无效果。\n\n月石晶体能力中所说的“月石腐化”使用同一个绯晶腐化标记和同一套规则，不建立一个可以与之叠加的同义状态。腐化的移除按战役规则由 GM 处理。\n\n**尾击推退（Tail Shove）。** 尾击命中一个生物后，晶血龙兽可以选择推退。目标进行 DC 19 力量豁免；失败时目标被推开 10 尺，成功时无效果且不移动。同一次尾击不能同时选择尾击扫倒。\n\n**尾击扫倒（Tail Sweep）。** 尾击命中一个生物后，晶血龙兽可以选择扫倒。目标进行 DC 19 力量豁免；失败时目标陷入倒地（Prone），成功时无效果。同一次尾击不能同时选择尾击推退。\n\n### 动作\n\n**多重攻击（Multiattack）。** 晶血龙兽发动三次攻击：一次啃咬和两次爪击。每次攻击分别选择合法目标，并分别进行命中与伤害结算。\n\n**啃咬（Bite）。** 近战武器攻击，命中 +11，触及 10 尺，一个目标。命中造成 3d10+6 穿刺伤害（平均 22 点），外加 2d8 心灵伤害（平均 9 点）。\n\n**爪击（Claw）。** 近战武器攻击，命中 +11，触及 5 尺，一个目标。命中造成 3d8+6 挥砍伤害（平均 19 点），外加 1d8 心灵伤害（平均 4 点）。\n\n**尾击（Tail）。** 近战武器攻击，命中 +11，触及 15 尺，一个目标。命中造成 4d6+6 钝击伤害（平均 20 点），外加 1d6 心灵伤害（平均 3 点）。如果目标是生物，命中后晶血龙兽可以选择尾击推退或尾击扫倒，只结算其中一个分支。\n\n**噩梦吐息（Nightmare Breath，充能 5–6）。** 晶血龙兽吐出覆盖 60 尺锥形区域的红雾。区域内的每个生物都必须进行一次 DC 18 感知豁免。\n\n- 豁免失败：受到 6d10（平均 33 点）力场伤害，并陷入恐慌（Frightened），持续 1 分钟。\n- 豁免成功：受到一半伤害，向下取整，不陷入恐慌。\n\n受影响的生物在自己每个回合结束时重复进行 DC 18 感知豁免；成功则结束恐慌。受影响生物 5 尺内的另一个生物可以使用一个动作进行 DC 15 运动或医药检定；检定成功时拔除绯晶刺并结束恐慌。\n\n### 传奇动作\n\n晶血龙兽拥有 4 个传奇动作。它只能在另一个生物的回合结束时使用下列选项中的一个；在自己的回合开始时恢复所有已消耗的传奇动作。\n\n**尾击（Tail Attack，消耗 1 个传奇动作）。** 晶血龙兽发动一次尾击。该次攻击使用尾击本身的攻击和命中后分支规则；这个传奇动作已经包含这次尾击，不再额外消耗晶血龙兽的普通动作。\n\n**血液支配（Command the Blood，消耗 1 个传奇动作）。** 晶血龙兽选择一个它能看见且位于 30 尺内的生物。目标进行 DC 18 感知豁免；生命值尚未受损的目标进行这次豁免时具有优势。\n\n豁免失败时，目标必须使用自己的反应，对另一个位于其触及范围内的生物发动一次近战武器攻击。由晶血龙兽选择这个被攻击的生物。如果没有合法目标，或者目标不能执行反应，则这个效果无效。豁免成功时无效果。\n\n**晶片齐射（Shard Salvo，消耗 2 个传奇动作）。** 晶血龙兽向一个它能看见且位于 30 尺内的生物射出水晶碎片，目标进行一次 DC 18 体质豁免。\n\n- 豁免失败：受到 2d8（平均 9 点）心灵伤害，并陷入恍惚（Dazed），持续至目标下一个回合结束。恍惚不是麻痹，也不是震慑。\n- 豁免成功：受到一半伤害，向下取整，不陷入恍惚。\n\n如果晶血龙兽当前生命值不高于生命值上限的一半，豁免失败的目标还必须进行一次 DC 18 魅力豁免，并按绯晶腐化的规则结算。\n\n无论目标的体质豁免成功还是失败，晶片齐射完成后都会在目标旁边的一个空位生成一只月石晶体。该晶体立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺，也就是不会在生成后立即进行一次月石戳刺。月石晶体的完整数据见下方“生物二”。\n\n**掠流滑翔（Current Glide，消耗 1 个传奇动作）。** 晶血龙兽移动至多等于当前所使用移动方式速度一半的距离。这次移动不会引发借机攻击。\n\n### 附赠动作与反应\n\n来源没有定义晶血龙兽的专属附赠动作或反应。\n\n## 生物二：月石晶体（Moonstone Crystal）\n\n中型构装体，无阵营。它是由晶血龙兽的晶片齐射生成的固定晶体，每一只都有独立的生命值、状态和战斗成员。\n\n- 护甲等级：17。\n- 生命值：15。资料只给出固定生命值 15，没有提供生命骰公式。\n- 速度：步行 0 尺、飞行 0 尺、游泳 0 尺、攀爬 0 尺、掘穴 0 尺；不能移动。\n- 力量 10、敏捷 10、体质 10、智力 1、感知 10、魅力 1。\n- 先攻：+0。\n- 挑战等级：0。熟练加值：+2。\n- 语言：无。\n- 伤害抗性、伤害免疫和伤害易伤：资料没有添加额外设定。状态免疫：资料没有添加额外设定。\n- 感官：来源没有列出额外感官或被动察觉值。\n- 经验值：来源未提供。\n\n### 特性\n\n**固定晶体（Immobile Crystal）。** 月石晶体是不能移动的构装体，所有速度均为 0。它由晶片齐射生成在目标旁边的一个空位中，随后立即投掷先攻并加入当前战斗。晶体被摧毁后停止行动。\n\n**月石腐化（Moonstone Corruption）。** 这项能力只在月石戳刺造成的敏捷豁免失败之后使用。目标进行一次 DC 18 魅力豁免；成功时无效果。失败时，目标受到绯晶腐化（月石腐化）；如果目标已经受到绯晶腐化，则改为获得 1 级力竭。这里的“月石腐化”和晶血龙兽的“绯晶腐化”代表同一个状态，不互相叠加成两个不同状态。腐化的移除按战役规则由 GM 处理。\n\n### 动作\n\n**月石戳刺（Moonstone Spikes）。** 在月石晶体自己的回合开始时，它向周围 10 尺内除自身以外的所有生物伸出不规则的月石尖刺，不区分敌友。每个生物分别进行 DC 18 敏捷豁免。\n\n- 豁免失败：受到 2d6（平均 7 点）穿刺伤害，随后进行一次独立的 DC 18 魅力豁免，并按月石腐化处理。\n- 豁免成功：不受伤害，也不进行腐化豁免。\n\n每只晶体每回合只能戳刺一次。晶体刚生成时不会在生成瞬间额外戳刺；晶体生命值为 0 时不再戳刺。\n\n### 附赠动作、反应与传奇动作\n\n来源没有定义月石晶体的专属附赠动作、反应或传奇动作。\n\n## 召唤关系与希望自动完成的部分\n\n我希望生成两个独立的生物条目，并提供配套自动化。自动化应当协助完成以下来源已经定义的内容：\n\n- 处理晶血龙兽的 4 点传奇动作资源，使传奇动作在晶血龙兽自己的回合开始时全部恢复，并按各选项分别消耗 1 点或 2 点。\n- 记录绯晶拒绝每天两次的使用情况；使用后让月蚀守护碎裂到晶血龙兽下一回合开始，并在次数耗尽后让守护恢复为只能减去 5 点伤害的削弱形态。\n- 在月蚀守护触发时，把同一次伤害结算的不同伤害类型合计，只有总伤害超过 20 点才处理减免；守护完整时减半并向下取整，碎裂时不减免，削弱时减去 5 点。\n- 处理晶片齐射的两阶段豁免、伤害、恍惚和生命值不高于一半时的腐化豁免。齐射结算完成后，无论目标豁免结果如何，生成一只月石晶体，在目标旁边的一个空位立即投掷先攻并加入当前战斗；它不会在生成瞬间额外戳刺。\n- 为每只晶体分别记录生命值和状态。晶体在自己的回合开始时，对周围 10 尺内所有其他生物执行一次月石戳刺，先做敏捷豁免，只有敏捷豁免失败者才做后续魅力腐化豁免。晶体被摧毁后停止这项行动。\n- 只在能力文字明确要求时处理绯晶腐化；首次失败标记为腐化，已有腐化者再次失败时增加 1 级力竭。腐化的解除仍由 GM 按战役规则处理。\n\n由 GM 决定或需要 GM 确认的内容包括目标选择、不同合法空位之间的选择、攻击和传奇动作的战术选择，以及来源没有明确定义的召唤规则。\n\n## 来源未指定、需要 GM 确认的规则\n\n以下内容没有在这两份生物资料中定义，不能自行补成确定规则：\n\n- 月石晶体的召唤持续多久，以及在什么时点结束。\n- 同时存在的月石晶体数量上限；资料只写明每次晶片齐射生成一只，没有给出总上限或每个召唤者的上限。\n- 晶血龙兽死亡、失去意识、离开场景、离开当前战斗或进入其他场景时，已经生成的月石晶体是否消失、停止、继续存在或改变归属。\n- 月石晶体被摧毁后是否需要从场景中移除指示物或从战斗中移除成员；来源只明确说它停止行动。\n- 晶片齐射使用时如果当前没有战斗，如何投掷先攻以及是否仍然生成晶体。\n- 目标旁边没有合适的空位时如何处理，以及有多个空位时由谁选择；来源只要求目标旁边的一个空位。\n- 绯晶拒绝的“每天两次”在何时恢复；资料没有指定长休、每日固定时点或其他恢复方式。\n- 月石晶体是否需要专注、是否需要召唤者持续维持，以及晶体对召唤者和其他生物的友好关系、控制者和指挥方式。\n","docs/generated-actor-verification.md":"# Generated Actor / Item Verification\n\n## Required Source-To-JSON Checks\n\nFor each generated Actor JSON, manually compare the generated output against the source markdown:\n\n- Identity: name, bilingual name handling, creature type, size, and alignment.\n- Language and source fidelity: a single-language source remains in its source language, while existing bilingual text keeps its original correspondence; translation is not a prerequisite for acceptance.\n- Core stats: AC, HP, hit dice, speeds, abilities, saves, and skills.\n- Traits: senses, languages, damage resistances, damage immunities, damage vulnerabilities, and condition immunities.\n- Actions: action count, action names, attack bonuses, reach or range, damage formulas, damage types, and descriptions.\n- Saves and effects: DCs, save abilities, success and failure behavior, conditions, durations, and repeated-save rules.\n- Legendary, reaction, and bonus actions: count, cost, activation type, and descriptions.\n- Spellcasting: spell list, spell save DC, spell attack bonus, preparation or innate-casting rules, and linked UUIDs where expected.\n- Automation: activities, active effects, flags, module-specific fields, and effect-profile behavior.\n- Description fidelity: important source text is preserved or intentionally transformed.\n- Source coverage: every mechanically relevant source markdown section is represented or intentionally excluded.\n- No false effects: prerequisite-only text does not create on-hit effects unless the source explicitly applies that effect.\n- Output provenance: final JSON came from the project CLI or workflow, not manual construction or repair.\n\nWhen the source entered through document extraction, plaintext ingestion, or AI Intake, also trace the exact source identity through its source-scoped evidence/run artifacts, evidence IR where applicable, rendered Markdown, portable manifest evidence where applicable, and final JSON. Confirm that page/coordinate/language/confidence/line-order evidence for documents, and per-entity/aggregate equivalence for plaintext collections, were not replaced by an unrelated source or run.\n\nFor each generated standalone Item, also compare:\n\n- Identity and category: bilingual name, source category, normalized Foundry document type, rarity, attunement, weight, price, and equipment subtype.\n- Activities: inspect each `system.activities` entry for activation, target/range, consumption, uses/recovery, save/attack/damage, and its actual source-derived stage membership.\n- Effects: every structured embedded effect exists once, has a unique ID, and is referenced only by the Activities that apply it; check each Activity-to-Effect linkage rather than only counting effects.\n- Profile isolation: `core` contains no MIDI-QOL, DAE, Times Up, or Item Macro fields; a modded profile uses only the locked target-version contract.\n- Stage provenance: names, requirements, uses, and mechanics come from structured source data. A literal-only stage must remain `needs_review`.\n- Complex-rule boundary: if the locked target cannot express the source rule natively, the result must say `gm-assisted` or `external-rule` with preserved source text. Static JSON, a utility-shaped placeholder, or a passing verifier is not native automation acceptance.\n\n## Shared Verification Gate\n\nAll supported entry points must run the same canonical generation pipeline. Before a formal write:\n\n- Every canonical attack, damage, save outcome, activation, use, effect, range, and stage is projected once or explicitly marked `literal-only`/`unsupported`.\n- Activity/Effect IDs are stable, 16 characters, unique within their document, and map keys equal Activity `_id` values.\n- Duplicate IDs, dangling Effect references, lost mechanics, save-outcome drift, invalid target fields, or profile leakage are blocking errors.\n- `needs_review` and `failed` results do not enter formal single-file output or collection ZIP artifacts.\n- A source-scoped `needs_review`/`failed` result cannot be promoted by editing rendered Markdown or JSON by hand; regenerate from the accepted upstream chain instead.\n\n## Version-Specific Checks\n\nWhen generating for `--fvtt-version 12` or `13`, check:\n\n- Actor, embedded Item, standalone Item, and ActiveEffect `_stats.systemVersion` are dnd5e `4.3.9`.\n- Item activation lives on Activities; legacy Item-level `system.activation` is absent.\n- Uses use `spent`, `max`, and `recovery`; legacy `value` and `per` are absent.\n- The result passed locked 4.3.9 structural assertions. Do not report a Foundry runtime pass unless that exact artifact was imported and exercised in a separately recorded runtime.\n\nWhen generating for `--fvtt-version 14`, also check:\n\n- Actor, embedded Item, and ActiveEffect `_stats` use Foundry `14.364` and dnd5e `5.3.3`.\n- NPC resources use v14/dnd5e 5.x source fields such as `max` and `spent`, not legacy `value`.\n- Senses use `system.attributes.senses.ranges.\u003csense>` plus `special`, not direct legacy sense fields.\n- Item activities carry activation data; item-level `system.activation` is not used as the v14 source of truth.\n- Save activities use `save.dc.calculation` and `save.dc.formula`; `save.dc.value` is prepared by dnd5e and should not be emitted as source data.\n- Uses data omits legacy `value` and `per`; generated source should use `spent`, `max`, and `recovery`.\n- Spell fallback items use `method` and `prepared`, not legacy `preparation.mode`.\n- Active Effect changes target schema-backed v14 fields, for example AC flat/formula fields rather than legacy AC bonus fields.\n- If `--icon-mode safe` was used, every embedded/standalone Item has a catalogued Foundry core or dnd5e path, the adjacent `*.icon-review.json` records the chosen source/confidence/reasons, and fallback decisions remain explicit rather than being reported as semantic matches.\n- Review representative exact mappings and all semantic mappings visually. Confirm close negatives remain on a type default or an explicit reviewed override.\n- Runtime import/readback is a separate gate. State whether the exact project-local Foundry 14.364 runtime was available for this run.\n\nWhen generating for `--fvtt-version 14 --effect-profile modded-v14`, also check:\n\n- The current locked module target is MIDI-QOL `14.0.11` and DAE `14.0.12`. Reports executed against MIDI-QOL `14.0.9` remain historical evidence and do not prove the `14.0.11` runtime.\n- Times Up fields or assumptions are not required for v14 output.\n- Item Macro is not treated as a required dependency unless a v14-verified version is separately documented.\n- `flags.midi-qol.OverTime` is emitted only when the source text explicitly provides a repeated-effect formula and damage type.\n- The OverTime formula comes from the repeated-effect clause, not from an earlier hit or attack damage clause.\n- Any macro-style automation remains guarded and falls back to GM manual handling when MIDI-QOL workflow context is missing.\n\n## Portable Spellcaster Verification\n\nFor an Actor carrying `flags.fvtt-json-generator-spell-resolver.spellManifest`, verify the project artifact before importing it:\n\n- `spellResolution.status` is `pending`; `pending` is the correct portable-project state, not a failed hydration claim.\n- Every manifest ref is backed by an exact source evidence range and retains its source usage, ability, DC, attack bonus, component waiver, and literal restrictions.\n- The Actor contains no placeholder embedded Spell, resolver-managed Cast Activity, local Actor/Item UUID, or destination Compendium UUID.\n- Each manifest group links to exactly one real generated source feature by stable identity rather than item order or translated display name.\n- The Actor was regenerated by the CLI/workflow and checked with the Intake verifier; hand-repairing the Actor invalidates this layer.\n\nThis is the portable/static layer: it proves portability and source fidelity only. It does not prove that any destination-world Spell exists, that hydration occurred, or that any spell can be cast.\n\n## Target-World Resolver Report Verification\n\nAfter ordinary Actor import into the exact supported Foundry/dnd5e runtime, inspect the resolver report:\n\n- The source index includes every enabled and readable Item pack, including packs without a spell-specific manifest hint.\n- All refs resolve before the first write; any missing, ambiguous, contradictory, stale, or undecided manual conflict withholds the whole plan.\n- A matching 2024 candidate wins; a 2014 selection is allowed only when no same-key 2024 candidate exists and is visibly reported as fallback.\n- The hydrated graph contains one native Cast Activity and one native cached Spell for each ref, with exact `cachedFor`, `compendiumSource`, resolver ownership, source feature, and selected UUID linkage.\n- No placeholder, duplicate cache, foreign item adoption, or unrelated Actor/item/activity/effect/flag mutation occurred.\n- Manual Keep, Overwrite, Cancel, close, rollback, and recovery-required outcomes match the report and leave no hidden partial success.\n\nThis is the target-world hydration layer: it proves deterministic destination selection and document construction. It does not substitute for using the native activities.\n\n## Live Native Spell-Use Acceptance\n\nIn the destination world, actually use representative hydrated spells:\n\n- Run an attack workflow and confirm the native roll uses the source attack bonus.\n- Run a save workflow and confirm the native card uses the source DC and ability.\n- Open and cast a utility spell; verify source target restrictions such as self-only.\n- Use a limited spell twice to confirm the first use spends only its own Activity and the second is blocked by native behavior.\n- Use an at-will spell repeatedly and confirm no daily use is spent.\n- Confirm component waivers are represented by native Cast data and literal-only restrictions remain visible without claiming unsupported automation.\n- Disable the resolver after hydration and prove cached Spells still open and cast natively.\n\nThis is the native runtime layer. Portable/static verification, resolver hydration verification, and live-use acceptance are three separate gates. Passing any one of them cannot be used to claim the other two.\n\n## v14 Batch Acceptance\n\nFor project-internal v14 core acceptance without a local Foundry runtime, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --out-dir \"obsidian/dnd数据转fvttjson/output/v14-acceptance\" --report \"docs/acceptance/v14-core-batch-verification.md\"\n```\n\nFor project-internal v14 module-profile acceptance, run:\n\n```powershell\nbun run src/tools/v14AcceptanceSuite.ts --effect-profile modded-v14 --out-dir \"obsidian/dnd数据转fvttjson/output/v14-modded-acceptance\" --report \"docs/acceptance/v14-modded-batch-verification.md\"\n```\n\nThe batch suite must:\n\n- Generate every JSON artifact through the project conversion workflow with `--fvtt-version 14` and `core` semantics.\n- For the modded suite, generate every JSON artifact through the same workflow with `--fvtt-version 14 --effect-profile modded-v14`.\n- Disable optional translation services so acceptance output is source-faithful and not affected by external model behavior.\n- Include a local GoddessFantasy fixture pipeline sample that covers crawl -> records -> plaintext -> actor JSON.\n- Record actorVerification warnings in the report instead of treating schema success as semantic success.\n- Keep live Foundry v14 import as an explicit unresolved runtime check when no local Foundry v14 runtime is available.\n\n## Completion Standard\n\nA generated Actor JSON result is correct only when:\n\n- The project CLI or workflow regenerated the target JSON.\n- The JSON parses.\n- Relevant tests passed, or known baseline failures are explicitly separated from the current change.\n- The source markdown comparison above was completed.\n- Any Foundry, dnd5e, or module-dependent behavior was checked against locked local references for the target version.\n- Any remaining uncertainty is reported with the exact source field, generated field, and reference gap.\n","docs/item-ai-intake-v14.md":"# AI Item Intake: TXT to Foundry V14 Item JSON\n\n## What this path accepts\n\n`--intake-items` is the formal path for a natural-language TXT or irregular Item Markdown. It is intentionally separate from `--ingest-items` and `--ingest-items-json`, which remain strict-format compatibility commands.\n\nThe supported target is exactly Foundry VTT `14.364`, dnd5e `5.3.3`, and effect profile `core`. The command refuses another target or profile before the AI provider is called.\n\n```powershell\nbun run src/index.ts --intake-items \"F:\\source\\item.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\n`--dry-run` validates input limits and target selection but does not call a provider or promote files. A run contains at most 50 Item candidates and 200,000 JavaScript UTF-16 characters.\n\n## Acceptance boundary\n\nThe provider returns an evidence-bearing `ItemIntakeIR`, not Foundry JSON. Every candidate field and ability has an exact source range. The project then validates the ranges, claims and candidate boundary, renders an Item Markdown `item-mechanics` YAML contract, invokes the normal Item parser/generator, and verifies the generated JSON field by field.\n\nOnly a fully `accepted` run promotes Markdown to `input/items/` and JSON to `output/items/`. Source text, IR, deterministic diagnostics, provider audit, rendered Markdown and review material stay in `.local/item-intake-runs/\u003crun-id>/`. Candidate JSON is not a formal output and is not offered by the Web job unless the item is accepted.\n\nThe current core contract supports:\n\n- Explicit `AC +N` only: a transfer Active Effect with `system.attributes.ac.formula`, `type: add`, `phase: initial`.\n- A light ability with explicit action, bright radius and dim outer radius: a zero-cost `utility` Activity which applies a non-transfer Actor effect. Disabling or deleting that Actor effect extinguishes the light.\n- Shared Item uses with explicit recovery. `recoverAll` at `dawn` is represented on the Item uses pool. The strict Markdown `item-mechanics` boundary requires a positive integer capacity, supported recovery periods/types, and numeric or simple dice recovery formulas; it rejects misspelled recovery values. Scaled save consumption must be an integer within the pool capacity, with a valid maximum no greater than that capacity.\n- A uniquely resolved spell: a `cast` Activity consuming `itemUses`, with `spellSlot: false`. The submitted identifier and English name must case-insensitively select the same spell in the manifest-pinned dnd5e `5.3.3` source catalog; ambiguous, missing, or mismatched references are rejected and are never changed into Utility Activities.\n\nFor example, the dormant Jewel of Three Prayers contract has AC `+1`, an action to apply `bright: 15` / `dim: 30` light with no charge cost, a three-charge dawn-recovery pool, and a one-charge `Invisibility` cast. `dim: 30` is the outer edge of dim light, not an additional 30 feet after the bright radius.\n\n## Provider configuration and review\n\nItem Intake reuses the existing `MONSTER_INTAKE_*` configuration and `--intake-doctor`; this is shared provider plumbing only. It does not run the Monster IR or compatibility normalizer.\n\n```powershell\nbun run src/index.ts --intake-doctor\n```\n\nIf a run needs decisions, use its bundle rather than editing generated JSON:\n\n```powershell\nbun run src/index.ts --resume-item-intake \".local/item-intake-runs/\u003crun-id>\" `\n  --decisions \".local/item-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\"\n```\n\nFor this first Item contract, the only decision that can be resumed is an explicit `replace` for a `target-conflict:*` promotion finding; the prior files are copied into the run bundle before replacement. Evidence and mechanics findings are intentionally not overrideable by a decisions file: correct the TXT/Markdown and start a new Intake run instead.\n\nThe legacy `--enable-ai-normalize` hook is not Item Intake. It only assists strict project Markdown and, if unavailable or failed, returns no normalized mechanics so the original source is parsed; it can no longer silently manufacture `abilities: []`.\n\n## Runtime status\n\nStatic parser/generator/verifier and CLI/Web isolation tests cover the exact Jewel contract. The Foundry 14.364 local-lab activity lifecycle is a separate acceptance layer: do not promote this path from **Partial** to a runtime **Pass** until import, applied light effect, effect disable/remove, charge exhaustion, no-spell-slot consumption, and dawn recovery have all been observed in a disposable world. No production world is part of this workflow.\n","docs/plan/midi-qol-dnd6-bugfix-development.md":"# Midi-QOL dnd5e 6 兼容修复计划\n\n当前续接（2026-09-23）：Batch6 DAE/Tidy实际UI发现普通ActiveEffect创建被dnd5e6.0.2无ID状态迁移误判为condition，详见[迁移总报告](./server-mirror-to-server-next.md)的AH段。锁定原上游及既有四补丁不变，新增独立patch0005/local.8候选仅在Midi自有ActiveEffect子类新建无ID非condition效果时先分配ID。构建TypeScript baseline/candidate均0，最终80/80源码测试、更新器预览、模块类型检查和手册一致性检查通过。受限在线更新已仅替换JS/source map/module.json，ZIP SHA256 4E1A222E3D60557D8172164EF71CBC44973027749BFF6997DE59F88093E55A2F、磁盘/HTTP bundle SHA256 2DAB2B3A021FDB603F1680D0FA962E5E68022887A45A0248D997EA48D9AAE6F8，PID43656未变；新客户端浏览器验收尚未执行。local.7旧35项保持其原版本PASS。\n\n最终状态（2026-09-22）：Batch6的Midi-QOL兼容验收及授权清理已完成，[A–G总清单](./midi-qol-ag-acceptance-checklist.md)35/35关闭。AE正常API删除九个root和AA临时宏共10个，父方复核全部absent、配置恢复、无目标 ectData 不定义 system.type，ConditionData 才定义该必填字段。需核对 _initializeSource 是否将无 _id 的普通效果误迁移成 condition，并在真实运行时读回最终 document type 与 system model。\n- 避免只修一个调用点后在其他 workflow 再触发同类错误。\n- 本轮只声明固定 Foundry 14.368 / dnd5e 6.0.2 目标，不扩大未测试的 dnd5e 5.x 兼容承诺。\n\n### 2. Natural 1 / Fumble 伤害卡\n\n上一轮 external Chrome E2E 中，自然 1 已判定 `FUMBLE: naturalFumble`，实际伤害没有自动应用，但聊天卡保留了手动伤害/Apply 控件。官方历史 issue 说明 fumble 后保留手动伤害入口可能用于特殊能力；控件存在本身不再作为失败依据。\n\n处理方式：\n\n- 跟踪 natural fumble 后的 workflow state 和 damage-roll/chat-card 创建条件。\n- 验证 natural 1 不进入错误的命中集合、不自动掷普通命中伤害、也不自动扣减未命中目标 HP；手动伤害入口按官方行为保留。\n- 修改后确认普通命中、普通 miss、critical hit 和 natural 1 都不会发生回归。\n\n### 3. DAE 条件链\n\n上一轮 DAE 结论受“检查了错误 Actor 的 effects”影响，不能直接作为 Midi bug。\n\n这一项先重新做正确 Actor 的运行时验证。只有能够稳定复现 Midi 侧错误后才修改源码。\n\n### 4. Concentration\n\nbatch6K 已补齐一条真实专注链：Fly 建立 condition 专注与 base 依赖效果，正确持有者受真实攻击伤害，DC10 检定成功后保留，失败后专注和 Fly 效果均删除、飞行速度回到0。父任务读取 establish/success/fail 三份证据，保留这条链的通过结果（local.3，测试配置 doConcentrationCheck=chatOnly、removeConcentration=true；并非任意配置或所有DC边界的承诺）。执行器报告已把临时 removeConcentration 恢复，完整配置恢复将并入最终清理核对。无需无理由重跑已通过的零缩放专注场景。\n\n随后 C Longstrider 已在正确目标产生 walk30→40 的效果；删除后的 walk30 由执行器观察，需补入落盘的收尾快照。Poisoned 活动的 Apply 点击遇 CUA unreachable，结果未确认，恢复后必须先读回而不是重复点击。父只读检查确认 ServerNext PID11188与HTTP200，不能将其等同浏览器连接正常；已授权执行器恢复自己的30002页面/控制会话，禁止动30001或共享服务。\n\n### 5. 恢复聊天卡的手动 Damage（batch6K 新增）\n\nlocal.3 A–G 验收中，普通 miss 本身未错误命中/自动伤害，但点击允许的手动 Damage 两次复现 `itemUuid undefined` 与 `onUseMacros` 的 `null.getFlag`。被动读回确认源 Item 存在、`flags.dnd5e` 缺失、`system.item/activity` 正确，原生关联 API 可恢复物品；`SaveToChatCard/UseWeakReferences` 均开启。`Workflow.item` 仍读取旧 flags 是根因。\n\n官方分支与开放 MR 具体代码复核未发现适用修复。独立 patch 0002 为 local.4 恢复 dnd5e 6+ 的绑定活动物品或原生 scaled associated Item，保留5.x旧行为与真正缺失源的诊断；patch 0001 不变。先完成源码回归、负向变异、构建和审查，再仅更新浏览器资源。Chrome 在现有任务继续其他项，待新候选就绪后于当前场景完成处刷新并复测保留的失败聊天卡，不停服。此问题归 G 的真实错误，不以“手动按钮存在”把 A miss 改判失败。\n\nlocal.4 构建 TypeScript 0/0，但独立审查发现先恢复 activity/actor 再读 item 会丢失 system.scaling，因此未部署并递增为 local.5：6.x activity 使用原生 scaled association，5.x 保持旧分支；增补真
