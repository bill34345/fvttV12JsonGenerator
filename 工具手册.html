nster-spell-resolver/` 和旧构建、安装脚本已经退役；本目录是唯一实现位置。\n\n## 常用命令\n\n在仓库根目录运行：\n\n```powershell\nbun run test:spell-resolver\nbun run typecheck:foundry-modules\nbun run build:spell-resolver\nbun run foundry:lab spell-resolver install --apply\nbun run foundry:lab spell-resolver verify-install\n```\n\n构建产物位于 `foundry-modules/monster-spell-resolver/dist/`。本地安装目标由 `FVTT_OPS_LAB_ROOT` 精确解析；当前机器的持久测试环境是 `F:\\FoundryLab\\foundry-v14`。\n\n## 支持与安全边界\n\n- 锁定 Foundry VTT `14.364` 与 dnd5e `5.3.3`。\n- 本地安装和短时验证只针对配置后的 F 盘测试环境；完成 server-mirror 的 PID、端口、路径和运行者预检后可自主执行，被其他参与者占用时等待。\n- 唯一生产环境是远程服务器 8080 Foundry；只读 inventory/acquire 可在保留 CLI guard 和目标核对的前提下自主执行，生产安装或 Actor hydration 等写入必须再次取得明确授权。\n- 构建、单元测试和安装 hash 一致只能证明机械正确；目标世界中的实际解析行为仍需单独做运行时语义验收。\n","foundry-modules/open-session-deck/README.zh-CN.md":"# Open Session Deck / 开放式跑团副屏\n\nOpen Session Deck 是一个仅供 GM 使用的 Foundry VTT 队伍与遭遇工作台。它可以保留在 Foundry 主窗口内，也可以弹到第二块显示器。副屏由 GM 已登录的浏览器会话直接渲染，不加载第二个 Foundry 客户端、Canvas、登录页或模块 socket。\n\n## 精确支持范围\n\n- Foundry VTT `14.364`\n- dnd5e `5.3.3`\n\n其他版本和系统会 fail-closed。Daggerheart 计划在后续版本接入，v0.1 不声明支持。\n\n## 功能\n\n- 主 Foundry 面板与同会话浏览器副屏共享状态\n- 由一个世界级 Actor 文件夹定义队伍，可选择包含子文件夹；临时同行 NPC 只需移入队伍文件夹\n- 直接查看和编辑当前/基础最大/最大修正/有效最大/临时 HP、AC 修正、激励、力竭、状态、专注与死亡豁免\n- 独立批量工作区只处理 HP 与状态，并明确选择目标、全部添加或全部移除\n- 队伍成员在遭遇区显示紧凑占位；NPC 使用完整操作卡\n- 编辑和交换小数先攻，单独或批量为缺少先攻的 NPC 私密投掷，并由 GM 控制玩家可见性\n- 玩家官方 Combat Tracker 在第一轮逐步揭示友方先攻；敌对单位默认隐藏\n- 显示当前遭遇、切换上一/下一回合，并在主画布定位 Token\n- 简体中文与英文界面\n\n玩家先攻隐藏属于普通界面呈现，不宣称能对检查客户端文档数据的对抗性玩家保密。模块不提供独立玩家面板、行动自动化、第二张地图、AI 功能或自定义网络协议。\n\n## 开发验证\n\n```text\nbun run test:open-session-deck\nbun run build:open-session-deck\nbun run typecheck:foundry-modules\n```\n\n构建和安装 hash 只能证明机械结果；真实完成还需要在精确版本的 Foundry 中使用 GM 与玩家客户端验收。\n\n模块采用 MIT License，不再分发 dnd5e 或 Daggerheart 的图片、Logo 或规则文本。\n","foundry-modules/session-monitor/README.zh-CN.md":"# FVTT 跑团会话监测器\n\n这是一个面向 Foundry VTT 14.364 / dnd5e 5.3.3 的轻量排障工具。它把\n浏览器内的会话指标和浏览器外的 Chrome/Windows 进程指标分开记录，再在\n结束时合并成一条时间线。\n\n它只观察，不清缓存、不改设置、不删除文档，也不写 Foundry LevelDB。\nv1 只在 GM 客户端运行。\n\n本目录是一个完整 release unit，而不是只有 Foundry bundle：\n\n- `src/`：Foundry browser module、版本化 schema、IndexedDB 与 GM UI；\n- `companion/`：Chrome/CDP、Windows process、CLI、报告与端到端测试；\n- `build.ts`：确定性 module 构建及项目本地 mirror 安装保护；\n- `package.json`：产品版本、独立 typecheck/build/test/monitor 入口。\n\nmodule 与 companion 共同维护 schema v1 和产品版本 1.1.2。它们可以共享本产品的 schema，\n但不得分别成为两个漂移的发布物。唯一的上游运行时依赖是\n`@fvtt-json-generator/contracts/hash` 提供的 browser-safe SHA-256；Foundry runtime 不导入\ncompanion，companion 也不导入 generator、workflow、Web 或运维实现。\n\n## 独立构建与测试\n\n在主 workspace 安装锁定依赖后，可直接从本目录运行：\n\n```powershell\nbun run typecheck\nbun test\nbun run build\n```\n\n构建产物位于：\n\n```text\nfoundry-modules/session-monitor/dist/module\nfoundry-modules/session-monitor/dist/fvtt-session-monitor.zip\n```\n\n## 安装\n\n```powershell\nbun run install:session-monitor\n```\n\n安装目标固定为：\n\n```text\n.local/foundry-v14/data/server-mirror/Data/modules/fvtt-session-monitor\n```\n\n随后在目标世界的“管理模组”中启用\n`FVTT Session Monitor / 跑团会话监测器`。MIDI-QOL 14.0.11 与\nSequencer 4.2.3 是可选的推荐依赖；未启用时只会留下对应\n`capability-gap`，不会让会话失败。\n\n## 权限与配置边界\n\n- 根命令只会把 module 安装到项目内的 `server-mirror`；生产部署仍需单独授权，\n  不会因运行 build、test 或 install 命令而发生。\n- companion 只启动并管理自己创建的专用 Chrome，不接管用户日常 Chrome；\n  它通过 CDP 和 Windows 进程接口读取性能信号，不读取 cookie、密码或浏览器凭据。\n- 专用 profile 与证据默认写入 workspace 的 `.local/`，不会写入 Foundry\n  LevelDB。可用 `--url`、`--chrome`、`--profile` 和 `--output-root` 显式覆盖。\n- 根 workspace wrapper 会传入内部的 `--workspace-root`，用于定位本地 mirror 和\n  默认 `.local/` 目录；从本 package 直接运行时也可显式传入该参数。\n- companion 必须在普通 GM 登录后才能开始握手。它不会猜测、提取或绕过 GM\n  密码；处于 join 页时只等待人工正常登录。\n\n## 一次真实记录\n\n先启动项目本地 Foundry，再运行：\n\n```powershell\nbun run monitor:session -- record\n```\n\n伴随程序会启动一个专用 Chrome profile，并等待已登录的 GM 世界。第一次\n使用该 profile 时，在新开的 Chrome 中选择 GM 并正常登录即可。登录后它会：\n\n- 调用模块 API 开始或续接一个会话；\n- 每 10 秒写一条 Chrome CDP/Windows 进程采样；\n- 每 60 秒扫描 renderer 的固定 WASM private committed allocation；\n- CDP 断开时留下 gap，并持续尝试重连；\n- 整个 Chrome 被关闭后，用同一 profile 自动启动下一代 Chrome；\n- 若 Foundry 要求重新登录，会停在登录页等待你正常登录，然后核对并续接\n  同一个 session ID；\n- 收到 `Ctrl+C` 后停止会话、生成报告并关闭自己启动的 Chrome。\n\n默认输出目录：\n\n```text\n.local/foundry-v14/evidence/cor-cotn-performance/live-sessions/\u003csession-id>/\n```\n\n主要文件：\n\n- `browser-session.json`：Foundry 模块导出；\n- `companion.jsonl`：伴随程序原始采样；\n- `companion-errors.jsonl`：隐私过滤后的 CDP 错误；\n- `companion-events.jsonl`：Chrome/renderer 代际与重启边界；\n- `session-combined.json`：合并后的完整证据；\n- `report.md`：人类可读摘要；\n- `heap-timeline.svg`：JS heap 时间线。\n\n若端口或 Chrome 路径不同：\n\n```powershell\nbun run monitor:session -- record `\n  --url http://127.0.0.1:30001/game `\n  --chrome \"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe\"\n```\n\n也可以从既有导出重新生成报告：\n\n```powershell\nbun run monitor:session -- report `\n  --browser \u003cbrowser-session.json> `\n  --companion \u003ccompanion.jsonl> `\n  --events \u003ccompanion-events.jsonl> `\n  --out \u003creport-directory>\n```\n\n## GM 面板\n\n- “开始”：建立 IndexedDB 会话并立即采样；\n- “刚才卡顿”：写入无自由文本的时间标记；\n- “停止并导出”：停止采样并下载 JSON；\n- 刷新页面：自动续接同一 world 中最后一个 active session。\n- 空闲时面板保持展开并显示“开始”；开始成功约 2 秒后自动收起为显示状态和 elapsed 的紧凑胶囊。\n- 点击胶囊或按 Enter/Space 可临时展开完整控制；拖动标题栏可移动，位置会夹紧到视口并避让可见的 Foundry 右侧 Sidebar/Combat Tracker。\n- 视口或 Sidebar 改变后会重新夹紧/避让；位置只保存到浏览器 localStorage，不调用 `game.settings`，也不写世界或 LevelDB。\n- `markJank` 注册为 Foundry 原生 GM-only 快捷键，默认没有绑定；只有活动 GM 会话接受该快捷键。\n\n单次会话最多 12 小时、4,320 个浏览器采样、10,000 个事件和 1,000 个\n错误。达到上限会标记 `truncated` 并安全停止。\n\n## 隐私与解释边界\n\n导出不包含聊天文本、骰值、Actor/Item 文本、玩家输入、cookie、密码、\n令牌、IP、原始 Scene/Combat ID 或任意对象 dump。错误消息默认写成\n`\u003cmessage-redacted>`，只保留错误类型、过滤后的栈位置、包 ID 和指纹。\n\nScene/Combat 使用单会话别名。活动模组清单只记录模组 ID 和版本，并保存\n配置哈希。\n\n报告中的 JS heap、renderer private bytes、working set、GPU/utility 进程、\ntexture 估值、DOM 数量和固定 Worker allocation 是不同信号。工具只负责\n相关性对齐，不把相关性写成因果结论。\n\n完整关闭专用 Chrome 不会结束模块中的 active session。伴随程序会自动\n重启 Chrome，并把新进程记为下一代 `browserGeneration`；renderer PID\n变化则只记为递增的 `rendererGeneration`，不会把原始系统 PID 写入报告。\nMarkdown 报告会列出每次冷重启前后的 page heap、renderer private bytes\n及差值，SVG 时间线会显示冷重启竖线。\n\n因此，遇到卡顿时可以直接关闭这个专用 Chrome 窗口；不要同时按\n`Ctrl+C`，也不要先点面板里的“停止并导出”，因为这两种操作代表你明确要\n结束本次记录。若自动重启后出现登录页，只需照常登录；伴随程序会继续等待，\n并且只有恢复到原来的 active session ID 后才会继续采样。\n\n## 验证\n\n```powershell\nbun run test:session-monitor\nbun run typecheck:production\nbun run typecheck:all\nbun run build:session-monitor\n```\n\n生产部署已于 2026-07-30 获得单独授权：部署时通过普通 Foundry 模组管理\n为线上 `cor-cotn` 启用了 `fvtt-session-monitor`。首次 1.1.0 线上点击\n“开始”暴露公网 HTTP 缺少 `crypto.subtle`；1.1.1 已改用项目既有的\n浏览器安全纯 JavaScript SHA-256，并通过 13/13 聚焦测试与远端制品校验。\n\n2026-07-31 的 8080 只读复核再次确认：当前监听进程仍使用\n`X:\\FoundryData`，该 DataPath 下存在完整 1.1.1 五文件制品，五个\n模块资源经 8080 回环均返回 HTTP 200，公网 8080 的 manifest 也返回\n`fvtt-session-monitor` 1.1.1。本次没有登录 GM 客户端或读取运行中的世界\nLevelDB，因此只重新证明“当前已部署并由 8080 提供”，没有把历史启用事件\n冒充为当前实时 `active` 证明。\n\n最终 1.1.1 的“开始 → 刚才卡顿 → 停止并导出”短烟雾测试仍需在服务器重启\n后由 GM 正常加入再完成；实际四小时跑团和非 GM 设备证据也仍未完成，不能\n由安装、HTTP 200 或短烟雾测试替代。\n\n超过 30 分钟的持续 Chrome/Foundry 监测不由代理启动、等待或代跑。四小时\n验收由用户在真实跑团时亲自开始并实时观察；代理只负责事前检查命令、存储和\n隐私边界，并在跑团结束后读取导出证据、生成报告和解释结果。多个短测试也不能\n拼接成一次四小时验收。\n","packages/assets-icons/AGENTS.md":"# Actor 图片、Token 和图标规则\n\n## 这个功能是做什么的\n\n本目录管理 Foundry v14 图标解析、Actor 图片、Token 图片、裁切候选、人工审阅 contact sheet，以及可选的远程图片上传适配器。\n\n## 不可违反的规则\n\n- `actor.img` 与 prototype token texture 是两个不同用途的资产，必须分别路由和验收。\n- safe icon mode 只能使用受支持目录、明确 override 或已验证 catalog；不得根据名称相似度静默替换成错误图标。\n- 自动裁切结果是候选，不是人工美术验收。共享图片、非方形主体、透明边框和图像所有权风险必须保留给审阅流程。\n- SSH/远程上传是外部写入；没有目标、凭据和明确授权时只允许 dry-run/本地计划。\n- 不得把服务器凭据放入浏览器、前端请求、仓库或生成 JSON；公开 URL、远程路径和本地文件都要经过路径/协议验证。\n\n## 修改入口\n\n- 公共出口：`packages/assets-icons/src/index.ts`。\n- `assets/` 管 Actor/Token 资产与审阅，`icons/` 管 catalog/override/报告。\n\n## 验证\n\n- `bun run typecheck:packages`\n- 运行受影响的 icon/image/CLI 测试；v14 catalog 变化时运行 `bun run build:icon-catalog:v14` 和对应 locked reference 检查。\n- 视觉结果必须查看最终 Actor 图、Token 图或 contact sheet；文件存在、尺寸正确和上传成功都不是视觉验收。\n- 影响 Actor JSON 时继续执行正式生成与 `verify:actor`。\n\n## 完成标准\n\n- 资产来源、用途和输出 URL 可追踪，Actor/Token 没有互换。\n- 自动检查通过且最终图片由人工查看，没有把候选误报为已接受。\n- 任何真实远端写入都在当前授权范围内并有读回或等价验证。\n","tools/forge-encounter/README.md":"# 人类 Markdown、固定自动化与战斗包\n\n输入是一份普通 Markdown：写清主生物和召唤物的完整数据、触发时机、目标、豁免、伤害以及来源没有规定的事项。不要求作者写 YAML、JSON、UUID 或 JavaScript。\n\n- 完整来源：[晶血龙兽与月石晶体](../../docs/examples/晶血龙兽与月石晶体-人类写法.md)\n- 空白写法：[召唤生物模板](../../docs/examples/召唤生物-人类写法模板.md)\n\n## 处理分工\n\n1. AI Intake 提取每个生物的证据 IR，渲染规范 Markdown；正式 workflow 生成 Actor 并对照来源审核。\n2. AI 从固定能力清单选择规则和参数，输出版本 2 的数据配置。AI 不编写宏代码，不提供任意路径、UUID 或脚本。\n3. 工具校验来源引文、能力身份、参数及引用，生成固定控制入口。DC、伤害、使用次数和 HP 继续读取正式 Actor 的原生数据。\n4. 独立审核配置与来源的对应关系；整包达到 `ready_for_gm_review` 后才输出可导入文件。\n5. GM 预览、确认并一起导入 Actor 与控制入口，再明确启用自动化。\n\n当前执行器只支持 Foundry 14.364 / dnd5e 5.3.3 / core。V12 需要独立实现和验证，不共用当前执行脚本。\n\n## 已实现的固定能力\n\n| 能力 | 范围 |\n| --- | --- |\n| 豁免能力结算后召唤 | 成功失败均召唤 1 个已绑定生物，GM 选择目标旁合法空位，独立 Token/HP 并加入先攻；可有失败恍惚及半血后续腐化 |\n| 自身回合开始范围能力 | 按原生 save/damage 执行；每回合一次，来源 HP 为零停止，生成瞬间不执行，不按敌友筛选 |\n| 腐化分支 | 首次失败加来源定义的共同腐化标记；已有标记再次失败加 1 级力竭，两者互斥 |\n| 阈值守护 | 同次伤害类型合计，严格超过阈值才减半取整；碎裂不减，削弱时减熟练加值 |\n| 守护碎裂 | 原生能力消耗后碎裂，下一次自身回合开始恢复；次数耗尽后恢复为削弱形态 |\n| 自身回合传奇资源恢复 | 只在来源明确规定的自身回合开始恢复已配置资源池 |\n\n这是有界能力清单，不承诺任意召唤、任意状态分支都能自动实现。不支持的请求须明确保留为待实现/GM处理，不能靠 AI 现场编程补齐。写法示例也不等于所有示例已通过自动化验收。\n\n## Foundry 操作\n\n在 Forge Intake 中配置连接，打开“战斗包导入 / 启动控制”，读取原始 MD。普通“生物一：名称”“生物二：名称”标题可直接分段；其他布局由 AI 识别。支持 2 至 6 种生物、最多 24000 字符。\n\n本地页面默认使用 DS API 的 `deepseek-flash`（DeepSeek V4.1 Flash），包括提取和审核。填写 DS Key 并保持凭据持久化关闭。不会把其他 Provider 的 Key 转送给 DS，也不再提供本机 Luna OAuth 桥接快捷入口。Luna Max 是验收操作者的模型，与 Intake 所调用的模型不同。\n\n生成后核对生物数据、固定能力、参数、绑定与 GM 裁决项，再确认导入。生成的薄宏只调用模块的固定执行器。初次明确启用后，配置保存在模块自有 flags 中；刷新世界时重新校验身份与配置后恢复，不执行 flags 中的任意代码。\n\n关闭控制面板不会停用自动化；使用“停用自动化”按钮可持久停用。旧式专用宏属于另一条显式审核路径，仍需手动重新启动，不具有固定配置恢复语义。\n\n## 本地命令行\n\n默认使用 DS Flash。凭据由父进程的 `DEEPSEEK_API_KEY` 或本机已配置的 `FVTT_LOCAL_DS_KEY_FILE` 提供；后者只指向外部已有秘密文件，程序在内存读取，不复制到仓库、报告或世界。\n\n```powershell\nbun run tools/forge-encounter/run-human-intake.ts docs/examples/晶血龙兽与月石晶体-人类写法.md ./crystalbleed-ds-run\n```\n\n输出目录必须是新的目录。只有整包达到 `ready_for_gm_review` 才写入各 Actor 的 MD/JSON 和 `encounter.forge-encounter.zip`；未通过只保留审核诊断，退出码为 1。每个 DS 阶段最多 5 分钟，不使用持续等待策略或自动退回 Luna。\n\n可用 `--resume-draft \u003creview.json>` 读取同一来源的 IR 提案，重新验证和审阅；不会继承历史通过状态。`--review-feedback \u003cfeedback.json>` 只传递绑定来源与父报告 hash 的具体修正意见，由 AI 修正 IR，不手工编辑最终 JSON。`--configured-provider` 仅用于明确选择其他已配置 HTTPS 服务的场景。\n\n已有 `build-example.ts` 只打包预先整理的来源与专用脚本，不能替代本页的人类 MD → 真实 DS → 固定能力配置验收。\n\n## 验收边界\n\n静态测试、来源审核、整包导入与真实回合行为分别记录。运行 server-mirror 前核对实例身份；本项目要求由受委派的 Luna Max 在外部 Chrome 进行有界操作，完成后返回报告，不持续监听或轮询。\n\n来源未指定的召唤持续时间、数量上限、召唤者死亡处理等保持 GM 裁决。原生攻击目标、战术选择、未选中的其他能力仍由 GM 正常操作。\n\n\n## 人类 MD 模板与当前能力范围\n\n可从[人类填写模板](../../docs/examples/召唤生物-人类写法模板.md)开始，按普通 Markdown 写明每种生物的完整数据、能力触发条件、结果和召唤关系。晶血龙兽是验收样例，不是名称匹配的专用分支；AI 根据本次来源提取 Actor 和能力绑定。填写模板不代表任意机制都能自动执行。\n\n当前固定能力支持：豁免结算后无论结果在目标相邻空位召唤一只；自身回合开始对范围内其他生物结算；首次腐化标记/重复失败加力竭；超过阈值减半、碎裂后恢复与耗尽后减熟练加值；来源明确的自身回合传奇资源恢复。数量、结果、放置或触发方式超出这些形态时，需要扩展能力库或明确保留 GM 操作，不能由 AI 改写为近似规则。AI 不生成执行代码。\n\n使用顺序：在 FVTT 启用本模块，配置 Provider/API Key，打开战斗包入口读取 MD，生成并审核，再导入；导入之后单独启用固定控制器。已有包的预览和导入无需再次请求 AI。Actor 蓝图保留来源 HP，未链接 Token 的随机 HP 遵从世界设置。\n\n截至 2026-09-15，本地 14.364/5.3.3 已验证包导入、齐射两分支召唤、晶体回合效果、守护阈值实际伤害与次数耗尽后的削弱。重复腐化只有部分运行证据；用户决定待独立状态设计后再明确，不视为严格单次增量验收通过。原生 Dazed 修复通过离线回归，尚无专门 Chrome 复验；FVTT 页面从 API Key 到完整 AI 生成的全链也未重新实测。CLI 真实 DS 审核与浏览器已生成包验收分开记录。此合并不等于生产部署或所有 MD/能力组合通过验收。\n","tools/foundry-ops/README.zh-CN.md":"# Foundry Ops（Foundry 运维工具）\n\n这个目录是项目内所有 Foundry 本地测试、离线世界检查和生产只读盘点的统一边界。它不是生成角色 JSON 的功能，也不是 Foundry 浏览器模块。\n\n## 这个目录现在包含什么\n\n以前，相关工具散落在 `scripts/foundry-lab` 和 `src/tools`，仅看命令名很难判断它会不会写文件、会不会连接生产服务器。现在它们已经收进一个产品目录，并共用一个入口：\n\n```powershell\nbun run foundry:ops --help\nbun run foundry:ops catalog\n```\n\n`catalog` 会用中文列出每条命令的目标和最大权限：\n\n- `read-only`：只读取目标；生产读取无需逐次对话授权，但仍须通过目标核对、外部配置、`--apply` 和 `--allow-production-read`；\n- `local-mutation`：会在本机生成报告、缓存、快照，或修改明确的本地测试镜像；\n- `production-mutation`：会安装、重启、hydrate、迁移或以其他方式写入生产环境。统一 CLI 故意不提供这种入口，只能走另行批准的操作手册，并在写入前再次取得明确授权。\n\n“生产迁移”相关的两个现有脚本只处理离线世界副本，因此被正确归类为“修改本地”；它们不会直接修改线上服务器。\n\n目录中的模块可以这样理解：\n\n| 模块 | 用途 |\n|---|---|\n| `src/cli.ts`、`src/routing.ts`、`src/commandCatalog.ts` | 统一命令入口、命令分类和权限检查 |\n| `src/config.ts` | 本地路径、生产连接配置和防止路径逃逸的安全检查 |\n| `src/process.ts` | 启动外部程序，并从命令、输出和错误中隐藏敏感值 |\n| `src/asset-inventory/`、`src/assetInventory.ts`、`src/localScope.ts` | 只读扫描本地 Foundry 资产，并登记整个 `.local` 顶层的所有权、隐私排除和待判断项 |\n| `src/lab/` | 本地 Foundry 实验环境、模组获取、诊断、补丁、启动和停止工具 |\n| `src/world-audit/`、`src/worldFootprintAudit.ts` | 对停止状态的本地世界建立只读快照并生成隐私安全的审计报告 |\n| `src/production-migration/`、两个 `productionMigration*.ts` | 比较三个本地世界副本并构建离线迁移候选；不会连接或修改生产服务器 |\n\n`spell-resolver` 命令仍经过 Foundry Ops 的统一权限入口，但浏览器源码、构建、本地安装生命周期和测试均由 `foundry-modules/monster-spell-resolver/` 自己维护；Foundry Ops 只负责把命令路由给该模块，不拥有解析器实现。\n\n## 本地资产只读盘点\n\n运行：\n\n```powershell\nbun run foundry:ops assets inventory --hash-concurrency=4\n```\n\n它会读取已经注册的本地 Foundry Lab 资产，分别生成以下八类 manifest：\n\n- Foundry 程序和 Node 运行时；\n- 模块；\n- 游戏系统；\n- 世界；\n- 备份；\n- 验收、诊断和审计证据；\n- 历史归档；\n- 临时工作区和可重建缓存。\n\n每个普通文件都会记录相对路径、体积、SHA-256、修改时间和文件系统访问时间。访问时间只是 Windows 文件系统提供的尽力信息，可能被延迟或关闭，不能单独证明“最后一次实际使用”。模块、系统和世界还会读取顶层 manifest 中的 ID、版本和公开来源 URL；本地文件 URL 不会写入报告。\n\n报告默认写入忽略目录：\n\n```text\n.local/foundry-v14/inventory/asset-inventory/\u003ctimestamp>/\n```\n\n其中 `summary.md` 是短摘要，`manifest.\u003ccategory>.json` 是分类型实物清单，`duplicates.json` 和 `duplicates.md` 是完整的字节级重复项报告。“理论重复体积”不是删除建议；同一文件出现在 world、backup、evidence 和 archive 中，可能分别承担运行、恢复和审计职责。\n\n扫描器不会跟随符号链接或 Windows junction，也不会扫描凭据目录、认证 cookie 或 Foundry profile 的 `Config`。遇到未授权链接、扫描期间变化或读取失败时，报告会标记为不完整并返回非零退出码。生成报告本身是唯一写入行为；命令不会复制、移动、删除资产，也不会访问生产环境。\n\n## `.local` 全范围登记\n\nStage 5A 的 hash 清单只覆盖已经确认 owner 的 Foundry Lab 资产。要检查仓库里是否又出现未登记的本地目录或文件，运行：\n\n```powershell\nbun run foundry:ops assets scope\n```\n\n该命令只枚举 `.local` 顶层，并把每一项标成：\n\n- `已分类`：已经确认生产者、使用者、可重建性和保留级别；\n- `隐私排除`：知道它是什么，但不会递归读取浏览器 profile、OAuth、cookie、桥接状态或截图内容；\n- `待人工判断`：实物存在，但现有仓库证据不足以证明 owner 或 canonical copy，必须保留并等待单独决定。\n\n报告默认写到 `.local/foundry-v14/inventory/scope-coverage/\u003ctimestamp>/`。其中“范围完整”只表示当前每个顶层条目都已登记；只要仍有“待人工判断”，所有权分类就仍然不是完整状态。无论两者为何值，报告都不构成迁移或删除授权。\n\n## 外置迁移方案（只生成报告）\n\n```powershell\nbun run foundry:ops assets migration-plan\n```\n\n该命令读取最近一份完整资产清单，按“世界与备份 → 证据与归档 → 程序/模组/系统 → 可重建缓存”生成逐批复制、精确对账、旧路径兼容窗口、回滚和恢复抽样方案。没有选定目标目录时，报告会明确停在“等待选择目标”；即使指定了专用空目录，也只会标记“可以申请复制授权”，不会创建目标、复制、切换、移动或删除任何资产。\n\n目标目录以后由用户单独决定：\n\n```powershell\nbun run foundry:ops assets migration-plan --target-lab-root=J:\\fvtt-lab\n```\n\n报告默认写到 `FVTT_OPS_LAB_ROOT/inventory/migration-plans/\u003ctimestamp>/`。目标必须在仓库和当前实验环境之外，不能是磁盘根目录、链接/联接路径或混有其他内容的目录。选择目标不等于授权复制；实际复制、短时 Foundry 验收和旧目录退役分别需要后续授权。\n\n## 生产只读盘点\n\n按照 [ADR-0005](../../docs/decisions/0005-production-read-autonomy-and-write-authorization.md)，代理可以自主执行生产 inventory/acquire 等只读操作，不必先进行一轮对话确认。以下三道机械保险和目标身份核对仍然全部保留；它们用于防止误连或把计划误当执行许可，不能被命令别名或私有 handoff 绕过。\n\n生产只读命令必须同时满足三件事：\n\n1. 命令带 `--apply`，表示不再只是查看计划；\n2. 命令带 `--allow-production-read`，表示本次明确允许连接生产服务器读取；\n3. 主机、数据路径和 SSH 身份文件通过外部环境变量提供。\n\n例如：\n\n```powershell\n$env:FVTT_OPS_PRODUCTION_SSH_TARGET = '你本机 SSH 配置中的别名'\n$env:FVTT_OPS_PRODUCTION_DATA_PATH = '生产 Foundry 数据目录'\n$env:FVTT_OPS_PRODUCTION_SSH_IDENTITY = '本机私钥路径'\nbun run foundry:ops production inventory --apply --allow-production-read\n```\n\n仓库不再保存具体生产主机或生产数据路径。缺少配置时，命令会在建立连接前失败。\n\n如果下一步会安装模块、重启服务、hydrate 世界内容、迁移数据、写 LevelDB 或产生任何其他生产写入，必须在第一项写入发生前停止并向用户取得明确授权。只读盘点的许可不会自动延伸为写入许可。\n\n## 共享 Server Mirror\n\n当前配置的本地 v14 Lab 是 `F:\\FoundryLab\\foundry-v14`，默认复用的数据目录是 `F:\\FoundryLab\\foundry-v14\\data\\server-mirror`。使用前核对 PID、端口、路径和运行者；若其他参与者正在使用，等待或协调释放，不擅自停止，也不复制另一整套 Lab。\n\n- 需要现成角色、场景、物品或合集的人工/玩法语义验收，默认使用持久世界 `cor-cotn`。修改既有文档前记录原值，结束后恢复；临时对象必须可识别并清理。\n- 干净隔离、模块组合、迁移/恢复、故障注入或可能污染世界的测试，使用 `fvtt-v14-module-matrix` 或测试创建的随机临时沙箱。\n- 身份预检、本地模块安装、启停和短时测试无需再次询问；这些本地权限不代表生产授权。\n\n## 本地路径配置\n\n这些变量都是可选的；当前机器通过用户级配置指向 F 盘 Lab。未配置的其他环境仍使用代码定义的兼容默认值，不得据此重建已退役的仓库 `.local/foundry-v14`：\n\n| 环境变量 | 用途 |\n|---|---|\n| `FVTT_OPS_LAB_ROOT` | 本地 Foundry 测试根目录 |\n| `FVTT_OPS_EVIDENCE_ROOT` | 本地证据和报告根目录 |\n| `FVTT_OPS_BACKUP_ROOT` | 本地备份根目录；默认是 `FVTT_OPS_LAB_ROOT/backups` |\n| `FVTT_OPS_FOUNDRY_ZIP` | Foundry 安装包路径 |\n| `FVTT_OPS_WORLD_ID` | 默认世界标识；有精确安全限制的命令仍会校验自己的固定测试世界 |\n| `FVTT_REFERENCE_CACHE_ROOT` | 独立的大型参考资料缓存；默认仍为仓库内 `.local/references`，不会跟随 Foundry Lab 一起迁移 |\n\n所有可写根目录仍经过路径逃逸、符号链接和 Windows junction 检查。配置成磁盘根目录或仓库根目录会被拒绝。\n\n## 旧命令兼容\n\n旧的 `bun run foundry:lab ...` 仍然可用，但 `scripts/foundry-lab/cli.ts` 现在只是一个兼容入口：它先进入 Foundry Ops 权限检查，再执行这里的正式实现。旧的实现文件也只保留简短转发层，避免已有导入路径突然失效。\n\n`src/tools/world-audit`、`src/tools/production-migration` 和三个历史工具入口同样只保留兼容转发。正式测试已经和实现一起迁入本目录。\n\n## 长时间验证边界\n\n代理不得启动、等待、轮询或用短测试拼接任何超过 30 分钟的 Chrome、Foundry、Session Monitor、性能或内存持续监测。四小时真实跑团验收由用户在真实使用时亲自运行；代理只做事前检查和事后证据分析。\n"}}</script>
<script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('handbook-data').textContent);
  const main = document.getElementById('main');
  const search = document.getElementById('search');
  const announce = document.getElementById('announcement');
  const categories = {convert:'转换与导入',library:'资料与内容',play:'跑团辅助',maintain:'检查与维护'};
  const descriptions = {convert:'把 Markdown、TXT、PDF 或图片中的资料带进 Foundry。',library:'整理资料、角色图片和可复用的职业与种族内容。',play:'查找安装在 Foundry 里的面板、房规和交互工具。',maintain:'查看性能、检查生成结果，了解环境和开发工具。'};
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const enc = encodeURIComponent;
  const link = (id, text, cls='') => `<a class="${cls}" href="#${id}">${text}</a>`;
  const list = items => `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const reviews = Object.values(data.reviews).map(r=>r.reviewedOn).sort();
  const latest = reviews.at(-1) || '未登记';
  const sourceNames = Object.keys(data.sources);
  let commands = [];
  let searchTimer;
  let theme = 'light';
  try { theme = localStorage.getItem('handbook-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'); } catch {}
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-toggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light':'dark';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('handbook-theme', theme); } catch {}
    announce.textContent = `已切换到${theme === 'dark' ? '深色':'浅色'}主题`;
  });
  const toggle = document.getElementById('menu-toggle');
  toggle.addEventListener('click', () => toggle.setAttribute('aria-expanded', String(document.body.classList.toggle('menu-open'))));
  function navigation(active) {
    document.getElementById('navigation').innerHTML = link('home', '手册概览',active==='home'?'active':'')
      +link('all',`全部工具 <span>${data.entries.length}</span>`,active==='all'?'active':'')
      +Object.entries(categories).map(([id,name])=>link(`category/${id}`,`${name} <span>${data.entries.filter(e=>e.category===id).length}</span>`,active===id?'active':'')).join('');
    document.querySelectorAll('#navigation a.active').forEach(a=>a.setAttribute('aria-current','page'));
  }
  function rows(entries) {
    return `<div class="tool-list">${entries.map(e=>link(`tool/${e.id}`,`<div><h3>${esc(e.title)}</h3><p>${esc(e.summary)}</p></div><span class="row-meta">${categories[e.category]}　→</span>`,'tool-row')).join('')}</div>`;
  }
  function showHome() {
    navigation('home');
    return `<section class="hero"><p class="eyebrow">一本放在手边的工具说明书</p><h1>想做什么，从这里开始。</h1><p class="intro">从整理一只怪物，到准备下一场团。这里收录项目里的转换入口、内容合集、Foundry 模块与维护工具，帮你找到用法和边界。</p>${link('guide','第一次使用？先读这份简短指南 →','guide-link')}</section>
      <div class="task-grid">${Object.entries(categories).map(([id,name])=>link(`category/${id}`,`<strong>${name}<span aria-hidden="true">↗</span></strong><p>${descriptions[id]}</p>`,'task-link')).join('')}</div>
      <div class="section-heading"><h2>常用入口</h2><small>${data.entries.length} 项工具 · ${sourceNames.length} 份离线原始说明</small></div>
      ${rows(['web-workbench','fvtt-json-forge','monster-intake','monster-spell-resolver'].map(id=>data.entries.find(e=>e.id===id)).filter(Boolean))}
      <p class="subtle" style="margin-top:24px">最近内容核对：${esc(latest)}。核对日期表示手册内容审阅时间；功能的实际支持范围见各条目。</p>`;
  }
  function showEntry(e) {
    navigation(e.category);
    return `<article class="article">${link(`category/${e.category}`,`← ${categories[e.category]}`,'back-link')}<h1>${esc(e.title)}</h1><p class="intro">${esc(e.summary)}</p><div class="meta"><span class="tag">${categories[e.category]}</span><span>内容核对 ${esc(data.reviews[e.id]?.reviewedOn || '未登记')}</span><span>${esc(e.id)}</span></div>
      <div class="notice"><strong>什么时候用</strong><p>${esc(e.when)}</p></div>
      <section><h2>开始前准备</h2>${list(e.requires)}</section>
      <section><h2>怎么使用</h2>${e.steps.map((s,i)=>{
        let code = '';
        if(s.command){const index=commands.push(s.command)-1;code=`<div class="code-wrap"><div class="code-top"><span>在项目根目录的 PowerShell 中使用 · 先替换示例路径</span><button class="copy" data-copy="${index}">复制命令</button></div><pre class="command"><code>${esc(s.command)}</code></pre></div>`;}
        return `<div class="step"><span class="step-num" aria-hidden="true">${i+1}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>${code}</div></div>`;
      }).join('')}</section><section><h2>完成后会得到什么</h2>${list(e.outputs)}</section>
      <section class="notice limitations"><h2>适用范围与注意事项</h2>${list(e.limits)}</section>
      <section><h2>继续阅读</h2><p class="subtle">以下原始说明已打包在本文件中，无需联网。</p>${e.sources.map(p=>link(`source/${enc(p)}`,esc(p),'source-link')).join('')}</section></article>`;
  }
  function showGuide() {
    navigation('home');
    return `<article class="article">${link('home','← 手册概览','back-link')}<h1>先选择入口，再准备资料。</h1><p class="intro">这本手册负责解释和导航。实际转换在工作台或命令行运行，跑团模块在 Foundry 中使用。</p>
    <section><h2>我该从哪里开始？</h2><div class="tool-list">
    ${link('tool/web-workbench','<h3>希望用页面上传、转换和下载</h3><p>打开 Web 工作台，按页面提示选择任务与 AI 连接。</p>','tool-row')}
    ${link('tool/fvtt-json-forge','<h3>已经在 Foundry 里，想直接创建内容</h3><p>查看 JSON Forge 的 GM 操作流程和 accepted 条件。</p>','tool-row')}
    ${link('tool/markdown-convert','<h3>已有符合项目格式的 Markdown</h3><p>走正式 CLI 转换；不规则 TXT 则查看 AI Intake。</p>','tool-row')}
    ${link('tool/document-extraction','<h3>手里是 PDF 或怪物截图</h3><p>先用文档提取流程核对页码、阅读顺序和候选怪物。</p>','tool-row')}</div></section>
    <section><h2>看懂几个常见词</h2><ul><li><strong>Actor</strong>：怪物、NPC 或角色数据。</li><li><strong>Item</strong>：物品、法术、特性等条目。</li><li><strong>Intake</strong>：从原始资料中提取带证据的结构，再走正式生成。</li><li><strong>accepted</strong>：这次结果通过对应检查；仍要核对原文。</li><li><strong>needs_review / failed</strong>：需要处理问题，不能作为正式结果导入。</li><li><strong>core / modded</strong>：只使用核心规则，或包含特定第三方模块字段。</li></ul></section>
    <section><h2>版本要明确选择</h2><p>本手册的常规生成示例显式选择 v14/core。CLI 省略版本时仍默认 v12，Web 初始选择为 v14。单独模块的支持版本以它自己的条目为准。</p><p>结构检查通过、安装成功和真实跑团验证是不同层级。不要把单项通过理解成整个模组组合已兼容。</p></section>
    <section><h2>下次如何打开？</h2><p>双击项目根目录的“工具手册.html”，或把它加入浏览器收藏、创建桌面快捷方式。也可以把这个文件单独带走；目录、搜索、命令和已收录原始说明都能离线使用。</p><p>单独复制出去的文件是当时快照。希望随 master 更新，就收藏 master 工作区里的文件。完成本次合并后，它会使用固定路径，不受以后 topic 工作区的位置影响。</p></section></article>`;
  }
  function showUpdates() {
    navigation('home');
    return `<article class="article">${link('home','← 手册概览','back-link')}<h1>手册随功能一起更新。</h1><p class="intro">说明和离线页面与功能一起合并到 master。你打开 master 里的同一个文件，就会读到该版本的内容。</p><section><h2>每次新增或修改功能</h2><ol><li>在功能分支里更新对应工具的用途、步骤、版本和限制。</li><li>对照实际入口和文档核对；新的模块或工具必须登记到目录。</li><li>记录作者核对，重新生成离线页面，并通过同步检查。</li><li>将功能、说明和生成页面一起合并。合并后再次运行检查并打开受影响条目。</li></ol><p>检查能发现来源变化、漏登记和页面不同步；它不能替作者判断文字是否真实，也不代表新功能已通过运行时验收。</p></section>
    ${data.sources['docs/runbooks/handbook-maintenance.md'] ? link('source/'+enc('docs/runbooks/handbook-maintenance.md'),'阅读完整维护流程 →','source-link'):''}
    <section><h2>已登记的内容核对</h2><p class="subtle">以下是作者核对记录，按日期排列；不是软件发布日志或自动测试结论。</p><div class="tool-list">${[...data.entries].sort((a,b)=>(data.reviews[b.id]?.reviewedOn||'').localeCompare(data.reviews[a.id]?.reviewedOn||'')).map(e=>link('tool/'+e.id,`<div><h3>${esc(e.title)}</h3><p>${esc(data.reviews[e.id]?.note || '')}</p></div><span class="row-meta">${esc(data.reviews[e.id]?.reviewedOn || '')}</span>`,'tool-row')).join('')}</div></section></article>`;
  }
  const searchable = data.entries.map(e=>({e,text:JSON.stringify(e).toLocaleLowerCase()+' '+e.sources.map(p=>data.sources[p]).join(' ').toLocaleLowerCase()}));
  function showSearch(query) {
    navigation('all');
    const terms = query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    const found = searchable.filter(x=>terms.every(term=>x.text.includes(term))).map(x=>x.e);
    announce.textContent = `找到 ${found.length} 项工具`;
    return `<h1>搜索结果</h1><p class="subtle">“${esc(query)}” · ${found.length} 项匹配 · 包含工具说明和收录的原始文档</p>${found.length?rows(found):'<div class="empty"><h2>没有找到匹配的工具</h2><p>换一个用途词，例如“怪物”“图片”或“监控”，也可以查看全部工具。</p>'+link('all','查看全部工具 →')+'</div>'}`;
  }
  function route() {
    clearTimeout(searchTimer);
    commands = [];
    let route;
    try { route=decodeURIComponent(location.hash.slice(1)) || 'home'; } catch { route='invalid'; }
    let body, title='概览';
    if(route.startsWith('search/')) {const q=route.slice(7);search.value=q;title='搜索';body=showSearch(q);}
    else {
      search.value='';
      if(route==='home') body=showHome();
      else if(route==='guide') {title='第一次使用';body=showGuide();}
      else if(route==='updates') {title='版本与更新';body=showUpdates();}
      else if(route==='all' || (route.startsWith('category/') && categories[route.slice(9)])) {
        const category=route.slice(9);title=route==='all'?'全部工具':categories[category];navigation(route==='all'?'all':category);
        body=`<h1>${title}</h1><p class="intro">${route==='all'?'按用途浏览项目中的全部工具。点开一项，查看步骤、产物和限制。':descriptions[category]}</p>${rows(data.entries.filter(e=>route==='all'||e.category===category))}`;
      } else if(route.startsWith('tool/') && data.entries.some(e=>e.id===route.slice(5))) {
        const e=data.entries.find(e=>e.id===route.slice(5));title=e.title;body=showEntry(e);
      } else if(route.startsWith('source/') && Object.hasOwn(data.sources,route.slice(7))) {
        const path=route.slice(7);title='原始说明';navigation('all');
        const owners=data.entries.filter(e=>e.sources.includes(path));
        body=`<article>${link('tool/'+owners[0].id,'← '+esc(owners[0].title),'back-link')}<h1>原始说明</h1><p class="subtle">${esc(path)}</p><p class="notice">这是该版本仓库文档的离线原文。旧例子、历史验收和维护命令保留原貌；当前推荐步骤与限制请先看工具条目。文中的路径可在仓库查阅。</p><pre class="source-body">${esc(data.sources[path])}</pre></article>`;
      } else {navigation('home');title='未找到';body=`<h1>这个条目没有收录。</h1><p>它可能已更名，试试上方搜索。</p>${link('all','查看全部工具 →')}`;}
    }
    main.innerHTML=body;document.title=`${title} · 项目工具手册`;document.getElementById('breadcrumb').textContent=`手册 / ${title}`;
    document.body.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false');
    if(!route.startsWith('search/')) {window.scrollTo(0,0);main.focus({preventScroll:true});}
  }
  search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const hash=search.value.trim()?'#search/'+enc(search.value.trim()):'#all';if(location.hash.startsWith('#search/')){history.replaceState(null,'',hash);route();}else location.hash=hash;},160);});
  document.addEventListener('keydown',event=>{
    if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){event.preventDefault();search.focus();}
    if(event.key==='Escape' && document.activeElement===search){search.value='';location.hash='all';}
  });
  main.addEventListener('click',async event=>{
    const button=event.target.closest('button[data-copy]');if(!button)return;
    const command=commands[Number(button.dataset.copy)];if(typeof command!=='string')return;
    try {
      if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
      await navigator.clipboard.writeText(command);button.textContent='已复制';announce.textContent='命令已复制';
    } catch {
      const range=document.createRange();range.selectNodeContents(button.closest('.code-wrap').querySelector('code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
      button.textContent='已选中，请按 Ctrl+C';announce.textContent='浏览器限制自动复制。命令已选中，请按 Ctrl+C。';
    }
  });
  window.addEventListener('hashchange',route);route();
})();
</script>
</body></html>
