Foundry中手动决定实例参数。\n\n## 通用触发器\n\n从模块设置或Token控制栏打开Trigger Manager。当前编辑器接受JSON定义，支持Actor文档更新、Combat回合开始、Combat回合结束。可以新建、复制、编辑、启停和删除Trigger，并选择已有Macro UUID作为动作。\n\n伤势的生命值事件通过 Custom Conditions 对 Trigger Engine 的公开订阅接收，无须另建一个调用旧伤势私有实现的 Macro。系统休息和死亡豁免由 Custom Conditions 接收原生事件。外部武器事件继续使用独立的 `publishExternal`／`subscribeExternal` 接口；既有武器专精支持仍限定 5.3.3，不因本轮 6.0.5 伤势路径扩大。\n\nTrigger只由active GM执行。宏收到 `triggerContext`，可读取变更前后数据、Actor及回合信息。宏要回写同一Actor时，使用 `triggerContext.updateDocument()` 保留防递归信息。\n\n无需为了更改现有触发条件或状态骰式重新编译模块；但首次编写全新Macro行为仍需要脚本。不要把“可在FVTT中配置”理解为“所有新规则都无需编写任何逻辑”。\n\n## 移动与使用边界\n\nImmobilized/Frozen限制拖拽、键盘，以及非GM通过HUD/配置进行的自主位置修改。GM坐标编辑、API位置操作保留用于强制位移/裁定，不计为Dazed的自主移动选择。键盘输入路径的当前验收缺口见候选收尾表。\n\n飞行坠落落点、地图距离、环境解除由GM判断。原生Bloodied继续使用dnd5e/FVTT；Madness和Contamination不在本期范围。\n\n## 本地测试环境\n\nserver-mirror入口为 `http://127.0.0.1:30001/join`。真实组合验收使用 `cor-cotn`「溟渊的呼唤」，保留世界原有启用模组；历史隔离 E2E 使用 `fvtt-v14-module-matrix`，不能替代 CoTN 的组合证据。该服务按用户要求常驻到关机，测试任务只复用；清理仅限自己的临时对象和receiver，不停止Foundry。\n\n结束测试后恢复原场景、暂停状态。CoTN 当前用户要求保留 Trigger Engine 和 Custom Conditions 启用供手动查看，不恢复历史隔离测试中关闭 Custom Conditions 的配置。serverNext30002是独立环境，不自动安装或更新。\n","docs/runbooks/development-feedback-loop.md":"# 开发反馈闭环\n\n状态：2026-09-30 获用户授权，作为独立规范增量纳入 master。既有 worktree 需自行吸收该提交；历史审计记录不代表共用工具已实现或提速已测得。\n\n目标：更早得到能区分错误原因的真实反馈，减少重复准备、错误修复和证据转抄。简单修改直接使用现有安全检查入口，已有任务记录足够时不另建合同。跨模块/版本/客户端、迁移或重复失败需要本流程的相关部分；只有需要固定跨步执行身份、派发或恢复状态时才使用完整合同，合同不是每次开发的前置交付物。\n\n## 1. 开工：目标清楚再改，技术未知先查\n\n先用不超过一屏说清：要改变的行为、保留的行为、验收出口、候选工作树/环境，以及会影响方案的歧义。\n\n- 用户意图、功能归属、完成层级或写入授权存在两个会改变结果的解释：提出具体选项，先问清再做依赖它的操作；可继续只读调查。说明歧义将改变什么，不把问题变成让用户替代理设计实现。\n- 路径、版本、API或报错可以从项目/运行记录查到：先调查，不要求用户重复提供。\n- 不影响语义和授权的可逆细节：自行决定，必要时简记假设。\n- “借鉴开源”不能自动解释成依赖外部模块完成产品功能；“做完”不能自动解释成允许合并/生产发布。已有明确授权继续有效。\n\n## 2. 陌生接口：研究要转成约束\n\n先读精确版本的相关实现/同类真实项目；已有固定来源可复用，不为每个小改重新上网。用户明确要求调查的方向须执行，或以实际检索结果说明为何不适用。\n\n记录只需四项：来源/版本/许可；与本次问题相关的一条接口事实；本项目采用/不采用的差异；能推翻当前假设的最小检查。列链接或“已阅读”不算完成。\n\n对新hook、异步注册、持久化、权限或跨模块状态，先获得一条窄的真实边界记录或精确版本契约检查，再扩展规则和界面。测试的外部替身应依据记录校准，不能用自己想象的调用顺序作为唯一判定标准。\n\n找不到可借鉴实现时：写明检索范围与无匹配结论；从最小状态转移和两个竞争解释开始，用可区分它们的实验获取事实。不得用“没有上游”作为无限试错的理由。\n\n## 3. 失败：先分层，再选择下一动作\n\n| 层级 | 例子 | 下一动作 |\n| --- | --- | --- |\n| 工具/运输 | 宏语法错、显示空JSON、字段转抄错 | 修工具并做最低往返检查，不重打战斗 |\n| 环境/前置 | 玩家不拥有Token、错level/版本/场景 | 验证真实前置，修准确归属的测试准备 |\n| 外部协议 | hook顺序、message type、同步/异步注册误判 | 精确源码/事件trace/最小复现，更新契约fixture |\n| 产品行为 | 同一次合法伤害后没生成效果、物品字段丢失 | 保留真实失败输入，目标回归先红后绿，再复验受影响链 |\n| 判定/证据 | 已有正确事实，classifier要求不存在字段 | 分开行为结论与证据完整性，核原件，修判定器；不伪写PASS |\n| 授权 | 当前写目标超出已授范围 | 准备具体结果与目标，向用户问缺失授权 |\n\n同一失败指纹连续两次尝试没有新证据时，停止原路重试。下一步必须带来新信息：缩小复现、换能区分假设的探针、重新读相关版本实现或请求独立反驳。若缺的是产品决策，问用户；若缺的是技术事实，继续调查。这个检查点不是项目总时长上限。\n\n## 4. 先使执行工具可用，再派发\n\n复杂E2E/迁移派发前核对：\n\n1. 合同及源码绝对路径存在，worktree/branch与目标匹配；不要让执行者从master猜路径。\n2. 依赖检查的exit code和结构化结果都通过，之后才派发；检查失败不能因同一脚本下一条命令成功而被忽略。\n3. 新工具有最小输入→调用→显示/导出→保存→解析的往返证明；纯语法检查只证明语法。\n4. 父任务核实其可见的宿主能力并准备好文件；执行器建立后，在它自己的当前上下文核对有效权限、实际工具入口、模型/effort与目标，再做依赖操作。父宿主可用不等于执行器可用，未知项不凭prompt声明代替。\n5. callback含准确父线程UUID、dispatchId、contractRevision和receiptId；子代理通道、独立thread通道和浏览器页所有权是不同概念。发送成功、正确父线程实收、父审接受分别留证，不能用一个布尔值代替。\n\n环境基线记录精确dataPath、端口/PID、世界、Core/system、检查时点及当前共用情况。OS owner或旧快照不等于其他任务已释放服务；维护操作沿用已核实授权及协调记录，不新增逐次确认要求。\n\n独立Chrome仍按已授权技能/宿主路径执行。markHandoff表示保留页面，不表示跨thread转移所有权。不要用裸CDP或替代通道绕过工具拒绝。只读来源检索不需要浏览器任务。\n\n本项目普通Chrome执行任务默认为 `gpt-6.1-sol / medium`，主控与其他委派保持用户当时的设置。合同的模型／effort填写该执行角色的期望值，执行器读取自身最新实际上下文验证；配置变更后保存新的权限收据，旧收据不能证明新配置。已经通过且客户端／目标未变的浏览器能力检查可复用。记录配置变化时点与比较边界，不把不同配置下的耗时差直接宣称为流程提速。\n\n派发后只做已有目标必需且独立的工作；没有独立工作就结束父回合，等待结果事件。callback去重；不轮询、监控日志或制造工作维持活跃。有新失败证据可修正合同；旧合同的错误门禁应明确撤回，不能让执行者反复撞它。\n\n## 5. 验收：分层，复用，保持判定独立\n\n以下层级按任务选择，不是每个模块都跑一遍。沿用本项目已明确的迁移口径：官方明确支持且未本地修改的包只做包/依赖/启用/重登新增错误检查；本地修复增加受影响的关键行为验证。用户后来明确改变验收范围时更新当前合同。\n\n- 纯规则：输入/状态转移/幂等和边界。\n- 真实契约：固定版本的schema/hook/message及真实依赖的窄桥接。\n- 实际运行API：持久化、角色权限、事件时序和最终数据。\n- 少量UI：用户入口、窗口/选项、目标选择、拖放、实际应用动作与角色差异。\n- 整合：共享依赖/兼容组合/产物/手册，在集成边界执行。\n\n同类型组合优先下沉；只复验变化影响、失败或具体缺口。完整UI不代替低层测试，模拟测试也不代替真实边界。真实Actor/效果操作必须走产品正式入口，直接写期望结果不能充当验证。\n\n行为结果、证据状态、清理结果分开记录。自动分类不适用时保留原始标签，写清独立审查依据；不得因为看到PASS而跳过被测交互或图片内容。截图文件存在不证明截图正确。\n\n### 本批先选范围，再运行前置检查\n\n在现有任务记录中说明本批检查回答什么问题；已有足够依据时可直接指向原结果。复杂批次按行为家族标记“复用／窄补测／本轮不做”和一行原因，不给每个鼠标动作建条目。复用绑定相关目标、接口、代码及原件；重复检查需要具体变更、真实回归、证据缺口、未知影响或明确整合门禁作为依据。导出或恢复异常先修对应层，保留独立有效的业务证明；缺少的观察只补相关操作。真实版本接口变化仍须定向验证，不能凭旧版本通过就豁免。\n\n| 本次变化 | 默认检查出口 | 何时扩大 |\n| --- | --- | --- |\n| 说明或代理指令 | 文义、引用、作用域；受影响的规则生成／手册一致性 | 说明核对发现真实入口或行为不一致 |\n| 纯逻辑或已有 bug | 对应测试文件、真实失败输入与关键对照；相关类型检查 | 改到共享接口、依赖或真实运行行为；parser 的既定语义／anti-overfit 门仍执行 |\n| 记录／导出／恢复辅助工具 | 最小真实数据的记录往返或恢复检查，保留有效业务证据 | 业务结果缺少必要观测或实际恢复仍失败 |\n| UI、Hook、权限、版本接口 | 受影响逻辑检查及目标版本的一条代表真实链；不同交互／角色各按风险选择 | 出现具体回归，或多个路径采用了不同实现／协议 |\n| 明确集成边界 | 对应模块／共享依赖的整合检查，以及要求的完整门禁 | 新组合、失败或具体未覆盖风险 |\n\n这张表不豁免项目明确门禁或用户要求的接受范围。完整 `ci:verify`、全覆盖率和大 UI 矩阵不能仅因“上一条通过了，继续再查一层”而加入；已有充分结果且没有新失效理由时进入收尾。合同因指令／候选身份变化而失效，需要重建执行身份，不等于所有历史业务证据失效；依照具体行为的相关依赖决定复用或补测。\n\n共用请求的可选 `validationSelection` 已接入 `prepare` 命令前及 `ready`／真实领取入口。启用时同时声明每条命令的 `validationCases`，专属 runtime 声明 `executionCases`；复用／不做项不能出现在执行覆盖中。旧小任务合同保持兼容，既有批次采用时应明确启用，不能只附加计划后原样执行全套。完整字段和局限见 [本批验证选择](../../tools/foundry-ops/README.zh-CN.md#本批验证选择)。声明与证据绑定可机械检查，实际脚本覆盖、依赖边界和人工影响分析仍由 owner 核对。\n\n已知慢测试只调整对应预算并先跑相关文件；同类问题集中修完后，到必要整合边界再跑一次相关组或规定的整合门禁。单个测试预算、覆盖率 watchdog 和宿主等待输出的 yield 分开记录，不全局加时、不盲目 retry，也不以每修一例再跑全仓来发现下一例。\n\n### 结束一批前，先确定最终读回方式\n\n在现有合同中安排恢复、已授权的精确清理和最终读回，不为每个收尾动作另建合同。删除唯一审计宏或关闭唯一证据入口前，先确认删除后的完整数据从哪里读回；若该入口会核对自身，应明确最后一次读取与自身删除的顺序，以及独立确认其已不存在的方式。不能用目录当前渲染的条目数代替完整集合，也不能把清理前的快照写成清理后结果。缺少读回能力时先补这一处，不先销毁入口再重新建工具。\n\n已授权连续执行的普通收尾步骤，在既有权限和对象范围内完成后保存一份批次结果再回传。既有合同明确要求的分阶段父审或停止点继续遵守；需要修源码、扩大写入范围、真实用户输入或出现新失败时也应中断交接。父审按证据需要独立复算，已经通过的行为不随收尾工具返工重跑。最终区分技术交付、主观判断、明确暂缓功能和 Git 集成／发布；后几项未完成不自动重开已接受的技术批次。\n\n## 6. 共用工具与每个模块的边界\n\n优先复用当前Foundry Ops、WMP harness、构建身份和收据能力的已支持部分。公共工具负责稳定的身份、执行状态和原件保存等机械工作，模块负责自己的输入、断言及语义判断。共享能力是否适用先查实际入口；不能把未实现的 adapter 当作已支持功能，也不能把新增 adapter 作为每个新模块的前置任务。\n\n没有适配时，先使用模块已有安全入口；确需补足观察时写小型专用检查，直接保存最少必要的普通数据字段和原始失败。公共文件工具已有 `json-ok` 和 `manual` 两条路径，不认识业务时保持未自动判定，由 owner 核对原件；真实观测缺失仍须补齐。支持面不匹配可换已有许可范围内的方法，权限、身份、明确拒绝和必要语义门禁不能由此绕过。只读证据解析失败优先重读或修解析，不能自动重建世界夹具或重放玩法。\n\n在第二个真实消费者验证复用之前，不建通用DSL/调度服务/大型测试平台。测试工具本身按代码对待：失败退出、陈旧收据拒绝、显示/文件往返、销毁归属有对应检查。\n\n工具改进是否值得保留，用自然发生任务的现有命令／回执检查：无失效理由的重跑、工具修复次数、重复准备／交接和必要证据缺口是否减少。新增维护与记录成本也计入，不为测提速重跑已完成业务或给每个任务增加统计表；几次试用仅证明对应路径，不能推广为长期百分比。\n\n## 7. 状态和继承\n\n一个任务有一个当前状态源，由一个项目执行 owner 维护。已有当前合同或交接文件继续作为入口；跨项目台账只保存任务 ID、owner 和入口指针。每次执行合同、自动收据和历史 STOP 是只读证据，不另建一份竞争的“最新状态”。小任务可用简短交接；需要机械核对时，在[任务合同模板](../templates/development-task-contract.example.json)中维护当前状态。\n\n接手按下面顺序核对，完成条件是能够从同一入口找到唯一下一步及其依据：\n\n1. 确认任务目标、执行 owner／有权审查者、实际 worktree／branch／HEAD、候选文件及授权来源；ID 和哈希从现有合同、Git 或文件读取。运行任务再核环境，文件任务无须启动服务。\n2. 分开记录执行者报告、独立父审、Git 集成和发布。`reportStatus: COMPLETE` 只表示执行者报告完成；父审限定接受不证明已合并，Git 祖先关系不证明远端已推送或总控接受。\n3. 对每个已替代的 STOP，在 `resume.supersedes` 绑定旧原件路径和哈希，并用 `resume.decision` 指向明确接续／父审决定。决定必须有同一任务、case、候选、审查者、授权引用、被替代原件和唯一下一步；[决定格式](../templates/development-task-decision.example.json)仅用于新的结构化记录。较晚时间戳不能替代授权或接受；旧格式原件继续人工读回，不为通过检查改写旧收据。\n4. 读取独立接受的原件及其限定范围。自动层仍是 INCOMPLETE／PENDING 时，保留原标签，并采用有据可核的限定父审结果。客户端／目标未变且证据充分的已闭合行为不重放。新候选、范围或实际缺陷另按影响分析列出需复验路径；未知影响不擅自免测。\n\n结构化当前合同可只读运行：\n\n```powershell\nbun run foundry:ops acceptance inspect-state --input=\"\u003c当前任务合同绝对路径>\"\n```\n\n此入口复用现有身份与文件指纹能力，只核对当前身份、引用读回、接续绑定和声明的本地集成；不调用合同命令、不更新原件。退出 0 表示这些机械核对一致，不是新增父审或授权。缺件、身份／指纹不符、无决定的 supersedes 退出 2。`resume` 仍处理单次运行的领取／收据状态；跨聊天先读任务当前源，不能用 `resume` 的 REVIEW 覆盖已有独立接受。决定文件中的身份声明需与人类授权和原始审查记录对照，检查器不认证聊天作者，也不自动判断截图或玩法含义。\n\n产品使用说明保留稳定操作方法，实际进度留在当前任务入口。文档与运行代码指纹分开；有据可审查的影响分析可以说明旧结果仍适用，不要求每次重新执行旧矩阵。\n\n规范/可复用工具改动尽量作为可独立审查的小增量集成。commit/合并/push仍遵既有明确授权；未合并的worktree规则不宣称全项目生效。全局skill或memory不在本次候选中修改。\n\n## 8. 文件侧工具第一版\n\n已有安全测试命令够用时直接运行，不必包装进 acceptance。需要固定文件侧执行身份和收据时，可用 `bun run foundry:ops acceptance run --input=\u003c绝对请求路径>` 连续完成 prepare／execute／collect；需要分阶段审查或宿主派发时继续用原有 `prepare|ready|execute|collect|resume`。已有合同用 `run --contract=\u003c绝对合同路径>`：已有回执只复读，不重新预检／执行业务；已领取却无回执保持 INSPECT，不能自动重放。新 `--input` 明确表示新执行，不会按请求哈希推断旧结果仍有效。\n\n单命令入口只支持普通本地文件合同，外部批次与 runtime 仍走原专用门禁。它保留选择、身份、授权与自动判定的原有边界；`manual` 和格式不完整的证据不会因组合命令变成 PASS。请求格式、退出码和具体步骤见 [Foundry Ops 说明](../../tools/foundry-ops/README.zh-CN.md#共用验收工具文件侧第一版)与[请求示例](../templates/development-feedback-request.example.json)。\n\n完整任务合同的 runtime、fixture、callback 和人工介入计量仍是后续能力；本版不执行 Chrome、不修改世界、不替模块判定玩法。父宿主可通过 `dispatchPrepared()` 接入实际派发，在失败时回调调用次数为零。只运行 `ready` 再自行派发的宿主仍需自己处理两步之间的身份变化，不能宣称已完成该集成。\n\n后续增量已有 Vision5e + Item Macro 的离线批次 adapter、跨工作树只读来源绑定及参考收据导入。具体步骤见 [第二个消费者](../../tools/foundry-ops/README.zh-CN.md#第二个消费者vision5e--item-macro-离线接入)。`ready` 表示文件检查可运行；`ready-batch` 的运行派发门禁单独报告。离线合同保留原暂停状态、运行授权 NONE 与回调归属，不能把离线准备或数据标签升级为真实批次接受。明确恢复后的限定实机链、独立父审和精确清理已完成，证据与剩余范围见 [实机闭合记录](../reviews/2026-09-30-development-feedback-next-vm-runtime.md)；其他迁移批次仍暂停。\n\n已明确恢复的同一批次可用 `prepare-runtime`／`ready-runtime`／`claim-runtime` 建立独立运行合同，核对最新执行聊天配置及现存服务身份后领取一次宿主派发；旧文件侧合同不会升级权限。`collect-runtime` 保存原生观察与实际证据指纹，保持父审待完成，界面和完整清理由父任务独立核对。说明见 [已恢复的实机批次](../../tools/foundry-ops/README.zh-CN.md#已明确恢复的-vision5e--item-macro-实机批次)。该增量不安装、不启停服务、不直接操作 Chrome，也不替代跨线程运输回执。\n\n接续前先读任务的当前状态，再对照对应独立验收记录。共用收据的 INCOMPLETE／PENDING 是自动层的判定边界；父审可以另行接受已核对的限定行为、恢复和清理，而无需改写原收据。已闭合批次不因自动层仍待人工判定而重放；历史合同、失败包和原件继续只读保留。新的候选、范围或实际缺陷按新的任务边界处理。\n","docs/runbooks/dnd5e-version-following.md":"# dnd5e 双版本线：资料查询、版本比较与 Next 更新\n\n## 选择版本线\n\n- **5.x 固定线**：开发与验收固定 dnd5e 5.3.3，不因 6.x 更新而升级 Mirror。5.3.3 当前也是官方最新稳定 5.x；若官方以后补发 5.x，先单独核对，不自动跨系列。\n- **6.x 跟随线**：ServerNext 使用官方最新稳定 6.x，不把某个补丁版本设为永久上限。排除 draft、prerelease、master／开发分支及 7.x。\n- V12 逐步弃用是已确定方向；本次不删除兼容代码或改变 CLI／Web 默认选择。正式生成器的现有 5.3.3 projector／来源验收不自动等于支持所有 6.x。\n\n## 开工时的最短流程\n\n1. 任务先写清 5.x 或 6.x、目标实例及行为出口。5.x 的目标就是 5.3.3；6.x 从[官方发布 API](https://api.github.com/repos/foundryvtt/dnd5e/releases?per_page=100)选最新非 draft、非 prerelease 的 `release-6.*`，按版本号比较。这里的“最新”来自官方发布，不来自 Context7 排序。\n2. 读取对应本地 `system.json`，涉及运行任务还核对正常客户端的实际版本、Core、world、dataPath、端口／PID和服务共用情况。不能拿源码缓存版本当作已安装版本。\n3. 以确定后的精确目标查询 Context7：5.x 写 `release-5.3.3`；6.x 写本次官方稳定 tag，例如 `release-6.0.5`，同时限定单一接口问题。结果必须检查引用来源；如果仍是 Wiki、master、6.0.x 或其他版本，只作为导航，回到目标 tag／提交的本地源码确认。\n4. Next 系统落后时，在本 thread 已明确的本地 6.x 跟随授权内，先完成系统更新和针对性验收，再开始依赖该版本的新开发。不因“文档较新”直接更新系统；先核官方稳定发布、Core 要求、当前已启用模块全集的 manifest 范围、代码版本门／本地适配及真实服务归属；不能仅抽查几个关键模块。\n5. 本地系统已有更新而缓存较旧，只补相应版本的源码资料；本地系统比发现结果新时重新检查发布来源，不自动降级。5.x 不因查询到了 6.x 片段而更新。\n6. 记录当前实装系统、Core、固定源码提交、候选及本轮接受证据。精确版本记录服务于复现，不限制以后更新。历史 PASS 保留旧目标；影响明确且无变化的检查可复用，有变化的行为才重新核对。\n\n## 已有资料如何复用\n\n共享源码缓存由 `FVTT_REFERENCE_CACHE_ROOT` 定位，本机配置为 `F:/FoundryLab/reference-cache`；不同 worktree 复用同一套版本化资料，不各下载完整手册。\n\n- 5.3.3：`dnd5e/5.3.3/repo`，由 `dnd5e-5.3.3` 清单登记。\n- 当前官方稳定 6.x 的已取得源码：`dnd5e/6.0.6/repo`（2026-10-12取得），由 `dnd5e-current-6` 清单登记精确提交 `87e94dbd9f930135e0694cd7e7d49f210603cd2c`。取得资料不表示Next已更新；本批取得时Next仍6.0.5，模块兼容前置和运行接受见本批预检记录。下一次升级同时更新该条目的 revision／target，而非永久固定补丁版本。\n- `references/dnd5e-6-current/system.json` 是对应官方发布清单，说明取得的目标，不证明 Next 已完成安装。\n- 本机旧 Foundry API 镜像 `14.361` 仅作导航；精确 Core 行为核对实际安装源码及发布说明。\n\n离线校验使用 `bun run references verify`。现有 CLI 校验整个清单，不提供按额外位置参数筛选的保证。\n\n当前 bootstrap 在替换已有缓存时会临时移动旧目录；它不能用作本项目无备份规则下的已有缓存升级路径。只在目标全部不存在的首次获取中评估它。更新已有共享资料时先核源仓库和旧 checkout 干净，获取官方固定 tag 后创建新的版本化引用 checkout，可复用 Git 对象；不复制整个 dirty 工作区，不改变旧版本 HEAD。此前用既有6.0.2对象取得6.0.5，本批再由干净6.0.5引用获取固定6.0.6；这些checkout是各版本源码资料，不作为运行实例或回滚备份。\n\n## 系统更新的范围和验收\n\n使用正常 Setup 系统更新入口，只处理 ServerNext 的 dnd5e。维护前保存必要清单、版本与来源字段的读回证据，不创建世界／安装目录备份；不直接编辑运行中 LevelDB，不连带升级 Core、Mirror 或生产。\n\n检查发行说明与当前已启用模块全集，包含自有模块代码中精确版本比较；6.0.x 修补以正常启动、受影响代表行为及必要持久化核对为主，不默认重跑整个迁移或全模块矩阵。6.1／6.2 若改变接口或增加功能，按实际影响扩大检查。普通更新无需重新决定“要不要跟随6”；需要 Core 更新、跨7、共享服务协调或处理数据异常时，按具体问题处理，不静默扩大范围。\n\nContext7 检索、源码取得、包安装、客户端启用、功能接受和资源清理分别报告。一个层级通过不能替另一个层级；现有专属 adapter／收据的旧版本身份不会自动变成新版本接受。\n\n## 接续与检查时机\n\n每次开始与系统版本相关的开发或维护时做一次官方／本地比较。没有新目标或变化证据，不重复取得缓存、重放迁移或重复浏览器场景。\n\n本流程没有安装后台定时任务，不能保证在发布瞬间自动发现更新。若以后明确设置监测频率，应使用宿主原生 automation；不要由 Chrome 执行聊天轮询，不建立 watcher 等待浏览器回调。\n\n执行依据见[本次版本策略和核查记录](../reviews/2026-10-01-dnd5e-version-following-policy.md)、[开发反馈闭环](development-feedback-loop.md)与[资料路由](foundry-v14-development-source-routing.md)。\n\n本次反例：系统6.0.2→6.0.5安装成功，但10个自有模块因maximum=6.0.2被自动停用，其中至少5个还有运行代码版本门。不能改高清单上限后就宣称兼容；按新增模块范围处理适配、原开关恢复及受影响行为，未闭合前报告系统已安装／模块组合未接受。\n","docs/runbooks/foundry-mcp-readiness.md":"# 本地 Foundry MCP 开发准备\n\n在开发任务需要通过 MCP 使用本地 Foundry 时，先准备所选实例，再实际读取世界。服务器在线、MCP 工具可见和游戏连接就绪分别判断。\n\n当前实现支持独立选择 Mirror 或 Next。Next阶段完成后，用户已恢复Mirror实施；两套分别保留安装与运行验收，不能由其中一套的结果推定另一套可用。最新结果见各自实施记录。\n\n## 日常准备顺序\n\n1. 选择当前任务实际需要的实例，核对共享占用。使用 CI 锁定的 Bun 1.3.14；配置取当前 worktree 的 `.codex/config.toml` 绝对路径。\n2. 执行准备命令。正确运行的服务复用；端口和对应进程均空闲时才启动现有本地实例，不重启已有服务。\n\n   ```powershell\n   $taskRepoRoot = (git rev-parse --show-toplevel).Trim()\n   bun run foundry:mcp prepare --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config \"$taskRepoRoot\\.codex\\config.toml\" --apply\n   ```\n\n3. 返回 `browserAction` 时，按项目 `chrome-delegation-dev` 规范复用执行代理和本任务拥有的专用 GM 页面。Next 固定使用 `http://localhost:30002/game`，Mirror 使用 `http://127.0.0.1:30001/game`，分别隔离登录 Cookie。正常登录进入 `cor-cotn`，核对 Bridge 已启用、正确端口及连接状态；保留原有写入权限设置。拒绝广播重载，只重载本任务页面。CLI 不操作 Chrome，浏览器动作由执行代理接续完成。\n4. 执行一次检查并记录观察。随后由当前聊天对应的原生 `get_world_info` 读回实例、世界、Core 和系统版本；首次接入或恢复验收再读取一项既有角色或合集。未通过时不继续依赖 MCP 的操作。\n\n   ```powershell\n   bun run foundry:mcp check --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config \"$taskRepoRoot\\.codex\\config.toml\" --apply\n   ```\n\n5. 保留专用 GM 页面及其 owner/tabId 收据，供同一批工作复用。关闭该页会中断此客户端连接；下次需要时重复准备流程。其他任务页面保持其原有所有权。\n\n`--apply` 允许准备命令启动缺失的本地服务并写审计；不带它只读检查。工具拒绝未知占用、错服、禁用配置及非本地目标。输出 `ready` 必须来自真实世界读取，不能以 ping、工具列表或页面 Connected 代替。具体状态和退出码见 [CLI 说明](../../tools/foundry-mcp/README.md)。\n\n本轮已把同字节 CLI 安装为独立本机入口，未合并当前 worktree 时也可使用；配置仍读取该项目的外部实际条目：\n\n```powershell\n& F:\\FoundryLab\\foundry-v14\\runtime\\bun-v1.3.14\\bun.exe F:\\FoundryLab\\foundry-v14\\tools\\foundry-mcp\\codex-readiness.ts prepare --instance next --lab-root F:\\FoundryLab\\foundry-v14 --config I:\\OpenCode\\fvttV12JsonGenerator\\.codex\\config.toml --apply\n```\n\n## 一次性本地恢复修正\n\n安装器仅接受已核实的 Bridge 0.8.4 主文件和已识别的本地补丁，校验字节后增加恢复适配器；不升级 Foundry 或 dnd5e。\n\n```powershell\nbun run foundry:mcp:install-recovery --instance next --lab-root F:\\FoundryLab\\foundry-v14\nbun run foundry:mcp:install-recovery --instance next --lab-root F:\\FoundryLab\\foundry-v14 --apply\n```\n\n先审阅不带 `--apply` 的计划；实际安装后，仅重载本任务 GM 页面，并用 `window.foundryMCPBridge.getRecoveryStatus()` 的正常应用检查入口核对 `local-recovery-1`。页面状态读取通过正常 Foundry 宏/UI，Chrome 不使用注入代码绕过应用入口。\n\n适配器在页面存活、模块启用且用户允许自动重连时持续退避恢复。它修正首次连接失败后没有心跳监测、失败时持久关闭用户重连偏好、以及底层旧 socket 在停止后自行重连的问题。显式停止或禁用后不自动恢复；恢复启动由正常设置或启动操作发起。身份校验继续由后台执行，不放宽预期目标。\n\n## 连接记录\n\n- `\u003clab-root>/tools/foundry-mcp/instances/next/readiness.jsonl`：自然检查的状态、成功、断开、恢复及乱序观察。\n- 相邻 `current-readiness.json`：最新观察与不倒退的 `lastSuccessAt`。失败记录不抹掉上次成功时间。\n- GM 页面恢复适配器：通过模块的 `getRecoveryStatus()` 提供最多 64 条 `connected`、`disconnected`、`retry_failed`、`stopped`、`page_closed` 事件；保存在该站点、该世界专用的客户端存储。事件只含时间、类别、原因类别与次数，无角色正文或凭据。\n\nCLI 日志中的时间是检查观察完成时间；客户端 WebSocket 事件在页面实际收到时记录。页面关闭或电脑关机期间没有后台页面计时器，因此不是持续在线监控，也不能从无记录时段推算精确在线率。\n\n## 故障分层与最小检查\n\n`foundry_stopped`：由准备命令按身份条件启动。`backend_unavailable`：检查所选 MCP 后台。`gm_bridge_missing`：准备对应专用 GM 页面。`identity_mismatch` / `service_conflict`：停止依赖操作，检查正确目标，不换实例完成同一请求。`read_failed`：保留原失败，定位具体返回。\n\n代表接受包括正式世界与既有角色读取、现有服务复用、临时断开后的恢复、显式停止保持、客户端重载与日志读回。Next见 [Next阶段记录](../reviews/2026-10-26-foundry-mcp-readiness-implementation.md)，Mirror见 [Mirror接续记录](../reviews/2026-10-26-foundry-mcp-mirror-acceptance.md)。启动最多等待90秒；超时仍保留进程和日志，先核对同一进程是否继续初始化，不重复启动。\n\n```powershell\nbun run test:foundry-mcp-readiness\nbun run test:foundry-mcp-recovery\n```\n\n恢复单元测试可通过显式 `FVTT_MCP_UPSTREAM_MAIN=\u003c已安装 main.js 绝对路径>` 增加精确上游类的离线契约检查；只读源码，网络、计时器和设置使用内存替身。它不代替真实 GM 页面和原生 MCP 验收。\n","docs/runbooks/foundry-v14-development-source-routing.md":"# Foundry v14 / dnd5e 双版本线开发资料与工具路由\n\n## 目的\n\n本指南帮助后续 thread 按任务类型选择最短且可信的资料来源和工具。它不是一条必须逐项执行的固定流水线，也不要求每个任务同时查询所有来源。\n\n正式生成器未指定目标时仍显式使用 Foundry `14.364` / dnd5e `5.3.3` / `core`。系统相关开发区分 5.x 固定 5.3.3 与 Next 跟随官方稳定 6.x，先按[双版本线流程](dnd5e-version-following.md)比较官方发布、本地实装和资料身份；6.x 的实际 Core／系统目标以当次核对为准，不永久卡在 6.0.2，也不把所有 6.x 宣称已支持。\n\n选择资料时始终区分三种证据：\n\n1. **发现与导航**：帮助找到类、Hook、源码文件或可能的实现方式。\n2. **精确版本静态证据**：证明目标版本确实有该字段、签名、Hook、schema 或行为实现。\n3. **真实运行时验收**：证明代码在目标 Lab 中按用户目标工作。\n\n发现证据不能自动升级为精确版本证据；静态证据也不能自动升级为运行时验收。\n\n## 可选资料来源\n\n| 来源或工具 | 最适合 | 不能单独证明 |\n|---|---|---|\n| `references/` 与配置的共享 reference cache | 锁定 dnd5e `5.3.3` 及当前取得的稳定 `6.x` 源码／发布证据；正式生成模板仍按各自已有支持边界 | Foundry UI、Hook 或 Activity 在真实世界中已正确工作 |\n| Context7 `/websites/foundryvtt_api_v14` | 快速定位 Foundry v14 `Document`、`ApplicationV2`、Hooks、Canvas 等 API | 页面对应的具体 minor build 一定是 `14.364` |\n| Context7 `/foundryvtt/dnd5e` | 5.x 查询指定 `release-5.3.3`；6.x 先由官方确定稳定 tag，再带 tag 查询概念／接口 | 查询里指定版本不保证结果固定；Wiki、master、6.0.x 返回只作导航，不能当目标静态证据或最新版探测器 |\n| [Foundry v14 官方 API](https://foundryvtt.com/api/v14/) | 核对 public/protected/private 边界、签名和官方说明 | 未标明 minor build 的页面等于 `14.364` 精确实现 |\n| [Foundry 14.364 发布说明](https://foundryvtt.com/releases/14.364) 与本机安装源码 | 核对 `14.364` 差异、实现细节和实际可用 namespace | 模块在目标世界中的最终行为已经通过 |\n| [dnd5e 官方源码](https://github.com/foundryvtt/dnd5e) 与锁定提交 | 核对 `5.3.3` Actor/Item/Activity/Hook/migration 实现 | Wiki 或新分支内容可无条件回推到 `5.3.3` |\n| [dnd5e Wiki](https://github.com/foundryvtt/dnd5e/wiki) | 理解设计意图、扩展点、Hooks、Enrichers、Advancement 和 Pack 约定 | 可变 Wiki 页面是不可变版本证据 |\n| [Foundry VTT 官方 CLI](https://github.com/foundryvtt/foundryvtt-cli) | package 选择、Compendium pack/unpack、内容迁移、fixture、往返验证和受控本地启动 | Actor/Item 生成正确、运行时 Hook/UI/Canvas 正确或生产写入已获授权 |\n| [DFreds TypeScript 模块模板](https://github.com/DFreds/dfreds-module-template-ts) | 参考 Vite、TypeScript、类型组织、Compendium 脚本和发布自动化 | 模板依赖版本与本项目 `14.364` 完全相同，或整套结构适合当前 Bun workspace |\n| [Foundry 系统 boilerplate](https://github.com/asacolips-projects/boilerplate) | 只有在开发全新 game system 时提供概念参考 | 它适合当前 dnd5e Actor/Item generator 或代表 v14 当前实践 |\n| GitNexus MCP | 索引新鲜时理解跨 package 调用链、影响范围和当前 diff | 图谱比当前 Git HEAD 更新，或图谱结论等于运行时语义 |\n| Foundry MCP | 连接到已核对身份的本地 Lab 后做只读检查、Document 读回和受控行为辅助 | MCP 返回 `ok` 等于语义验收，或连接目标天然是本地而非生产 |\n\n联网搜索仍遵守全局 AnySearch 优先与显式回退规则。搜索结果用于发现候选来源；版本相关实现结论应回到上表中的精确版本来源。\n\n## 按任务选择最短路径\n\n### Foundry 核心 API、ApplicationV2、Document、Hooks 或 Canvas\n\n推荐从 Context7 v14 索引快速定位名称和官方页面。实现前核对官方 v14 API 的可见性标记；涉及 `14.364` 行为、内部实现或 minor 差异时，再查本机 `14.364` 源码和发布说明。完成后按功能风险进入本地 Lab。\n\n在尚不知道精确类名和文件路径时，不要求先扫描全部本地源码；Context7 可作为更快的入口。也不得因为 Context7 返回了代码片段，就跳过目标版本复核。\n\n### dnd5e Actor、Item、Activity、Advancement、Hook 或迁移\n\n优先使用版本清单指向的源码：5.x 为 `.local/references/dnd5e/5.3.3/repo`；6.x 为 `dnd5e-current-6` 对应的本次稳定版本 checkout，实际路径按 `FVTT_REFERENCE_CACHE_ROOT` 解析。Context7 和 Wiki 用于发现概念／文件；引用没有对应精确版本时，回到本地固定提交确认。资料与系统哪个较旧分别处理，不能仅凭搜索片段触发安装。\n\n开始前运行 `bun run references verify`。新的 topic worktree 不一定包含 Git 忽略的默认 `.local/references`；此时使用已配置的 `FVTT_REFERENCE_CACHE_ROOT`，或按 `docs/REFERENCE_INDEX.md` 核对首次获取条件；已有有效缓存不走会移动旧目录的 bootstrap 更新路径。不得为了让路径出现而复制另一整套 reference cache，也不得把缺失缓存静默降级成“最新版”资料。\n\n生成数据还必须经过项目 projector/verifier 和来源语义核对；模块行为分别在该任务确定的 5.x／6.x 目标验收；5.3.3 已有证据不自动证明升级后的 6.x。\n\n### Parser、Intake、生成器或 verifier 新功能\n\n核心路径仍是项目 source → IR → workflow → generation → verifier。资料源用于确认目标 schema 和运行时语义，不能替代项目正式输出路径。\n\n只有当接受后的 Document 需要进入 Compendium、Adventure 或发布包时，才在下游评估官方 CLI。\n\n### 新 Foundry 模块、Hook、UI 或 Canvas 功能\n\n先读 `foundry-modules/AGENTS.md` 和目标模块的局部规则。API 导航可用 Context7；精确行为用官方 API、锁定 dnd5e 源码和本机 Foundry 源码；最终用模块 test/build 与真实 Lab 行为验收。\n\nDFreds 模板只做选择性参考。默认复用本仓已经验证的模块 build/install/verify 边界，不整套引入另一套 npm、Jest、启动或发布结构。\n\n### Compendium、Adventure、内容模块或批量迁移\n\n以下任一条件成立时，应评估官方 CLI：\n\n- 新功能生产或消费 Compendium；\n- 需要 pack/unpack、Folder 保真或 Adventure 展开；\n- 需要把真实 Pack 变成可版本控制 fixture；\n- 需要 Document 迁移、规范化或往返比较；\n- 需要受控地启动指定本地 Foundry/world。\n\n官方 CLI 自身的工具版本不等于 Foundry target 版本。首次采用或升级 CLI 时，先核对 GitHub Release 与 npm 发布版本，在 topic worktree 中锁定精确版本，只对随机临时根或明确构建目录做 Trial。比较 Document、UUID、embedded documents、Folder、索引、逻辑 hash 和 Foundry 实际加载后，才能把它接入正式 package adapter。\n\n官方 CLI 不得绕过项目 CLI/workflow 生成正式 Actor/Item，不得直接修改运行中的 World，也不得把 launch 成功冒充 PID、端口、dataPath、world 和 HTTP 验收。生产安装、迁移、重启或 LevelDB 写入仍需要当次明确授权。\n\n### 全新 game system\n\n只有用户明确要开发独立系统而不是 dnd5e 模块/内容时，才调研 system boilerplate。使用前必须重新核实模板的目标 Foundry 版本、DataModel/ApplicationV2 现代化程度和维护状态；不得从旧模板推断 v14 API。\n\n## 本机 MCP 与代码理解工具门禁\n\n- Context7：已知 library ID 可直接查询；未知或歧义时先 resolve。查询应包含目标版本和单一具体概念。\n- GitNexus：使用前读取 repo context；索引落后 HEAD 时先决定是否在本次任务范围内刷新，未刷新则只把结果当历史导航。\n- Foundry MCP：第一次调用先读取 world/version，并核对端口、app、dataPath/profile 和 world。未连接或身份不明时，不用它做验收，更不执行写入。\n- GitHub MCP：适合仓库、PR、Issue、CI 和发布证据，不替代本地 checkout 的精确代码审查。\n\n工具当前不可用时，报告精确失败与回退来源；不得为了保持工具链外观而伪装已调用或静默降低证据层级。\n\n## 最终证据记录\n\n版本相关实现的最终报告至少说明：\n\n- 使用了哪些发现/导航来源；\n- 最终核对的精确版本、提交、发布或本机源码；\n- 做了哪些机械检查；\n- 做了哪些人工/语义或真实 Lab 验收；\n- Context7、Wiki、模板、CLI 或 MCP 结果中仍有哪些版本漂移或未验证边界。\n\n只调用了发现工具而没有精确版本证据时，只能报告候选设计或待验证结论，不能声称目标版本支持。\n","docs/runbooks/handbook-maintenance.md":"# 中文工具手册：维护与合并\n\n## 日常打开\n\n双击仓库根目录 `工具手册.html`。这是包含中文工具说明、全文搜索、分类目录、命令和选定原始文档的单文件页面；不依赖 Bun、Foundry、网络、CDN 或后台服务。\n\n推荐收藏 **master 工作区里的文件**，或给该文件创建桌面快捷方式。功能和手册一起合并后，刷新这个页面即可。单独复制到其他位置的 HTML 是当时的快照，需要重新复制才会更新；没有文件监控或远程自动更新。\n\n## 内容放在哪里\n\n- `docs/handbook/catalog.json`：生成器、资料处理、检查与开发工具。\n- `docs/handbook/modules.json`：每个 Foundry 模块的独立用户说明。\n- 已迁移模块的`foundry-modules/\u003cowner>/docs/manual.json`：该模块唯一正文；`modules.json`仅保留`source`指针。当前Deck、框选Token同步、法术解析器、聊天内存保护、会话监测、随机表翻译、Painter、House Rules、Species与Blood Hunter已迁移，其他条目按模块逐个接续。\n- `renderModuleManual(document, manual)`为独立模块的公开正文渲染出口，返回脱离宿主的只读article，命令仅作为文字。TokenSync、Resolver、Chat Guard与Monitor共用此实现，各自仍负责权限、窗口及可选Suite接线；源码依赖随浏览器bundle打包，不增加Foundry必装模块。\n- `docs/handbook/reviewed.json`：作者对照实现和来源后的核对日期、说明与内容指纹。\n- `docs/handbook/delivery.json`：显式划分Foundry用户条目与离线专用条目，排除项登记原因；每个稳定ID必须且只能登记一次，不影响完整离线目录和watch覆盖。\n- `packages/suite-handbook/`：browser-safe内容契约、搜索、局部导航和阅读视图；只操作传入的root，不访问Foundry数据、URL、存储或全局主题。\n- `docs/handbook/standalone.ts`：静态页面宿主，负责hash/history、页面标题、本机主题、全局快捷键和剪贴板；窗口关闭时可释放订阅。\n- `docs/handbook/template.html`、`style.css`、`client.js`：离线页面模板、静态样式与启动入口。构建时用与CI一致的Bun 1.3.14打包为内联脚本；打开成品仍不需要Bun。\n- `docs/handbook/build.mjs`：构建与只读一致性检查，不修改生成器和 Foundry。\n- 根 `工具手册.html`：确定性生成、随功能一起提交的用户交付物，不能手工修补。\n\n## 两种宿主的同源交付\n\n静态HTML与Foundry窗口复用`mountHandbook(root, content, host)`。共享包返回`navigate(entryIdOrRoute, section?)`与`dispose()`；默认宿主使用局部按钮和内存状态。只有standalone adapter负责浏览器URL、标题和主题保存。命令是文字，只能经明确点击复制；阅读/导航不启动工具。\n\n内容只在catalog、尚未迁移的modules条目或owner的manual.json维护，不另建Foundry正文。构建使用`schemaVersion: 1`；完整HTML保留全部38个稳定ID与来源，Foundry根据delivery策略选28个用户条目，并只带它们引用的sources/reviews。10个工程/历史入口仍在完整离线手册。内部模块ID读取实际manifest（支持src或根module.json）；Midi-QOL显式映射上游ID，外部候选没有单一runtime ID。缺失的内部manifest不猜目录名。\n\nFoundry更新页显示工具用途摘要和说明核对日期，适用版本/实际接受仍由具体条目说明。详细作者review note只进入完整离线投影；Foundry导出将其替换为同条目的用户摘要，保留原核对日期和fingerprint，不把工程过程塞进用户更新卡片，也不改写原始review记录。\n\n```powershell\nbun run test:suite-handbook\nbun run typecheck:handbook\nbun run handbook:export\nbun run handbook:export:foundry\n```\n\n`handbook:export`在人工核对有效时写出`dist/handbook/content.json`，与HTML内嵌JSON相同；`handbook:export:foundry`写出content.foundry.json和projection.foundry.json。投影侧文件登记保留/省略ID和引用/排除来源，未知/重复/未登记ID及无理由省略均拒绝。导出不安装模块、不连接世界、不形成另一份可编辑正文；handbook:check不要求克隆预先有dist。新增共享包/页面/策略由verification-development监测，reviewed.json不进watch避免循环。\n\nH1完成共享包和静态宿主；H2在`foundry-modules/fvtt-suite-console/`接入GM只读ApplicationV2窗口，使用应用根内样式与容器宽度布局。通过`bun run test:suite-console`与`bun run build:suite-console`验证并构建；精确Core14.368的实际接受见执行总账，不能用静态测试追认。安装/启用状态与各模块帮助接通属于H3。\n\nH4通过`release:suite-console`准备本地交付：模块ZIP仅5个白名单文件，独立同字节manifest、完整HTML、SHA256SUMS和release-candidate.json位于本模块dist/release。完整HTML不进入模块ZIP或安装目录。真实build先检查review与根HTML同步，再编译Foundry投影；`verify-release:suite-console`做实际档案/CRC/逐文件字节/hash/两次确定性检查。路径链接/硬链接或未知输出拒绝，不清空目录。正式品牌/授权/渠道/下载地址未定时，只能称本地候选，不能编造在线安装地址或宣称公开发行。\n\n共享视图的`surface`区分静态与Foundry重开/更新说明；默认静态行为保持。Foundry host只提供根内滚动、内存主题与剪贴板，不提供URL/title/全局shortcut订阅或持久设置写入。新模块必须新增独立目录条目；当前目录合计38项，保留master新增的中文Babele维护入口及原有稳定ID。\n\n## 按实际变化同步手册\n\n变更用户可执行入口、输入或输出、支持版本、操作步骤或安全限制时，按本节更新说明。内部实现、测试或重构先核对这些信息是否改变，并记录具体结论；用户结果或限制发生变化的修复仍须更新说明，不能仅凭入口名称没变就归为内部变化。\n\n现有 `watch` 和目录覆盖检查继续保留。已登记实现或来源变化使本次必需的 `handbook:check`／CI 报 stale 时，人工核对所有受影响条目、更新 review 并重新生成页面；没有文义变化可写“不影响说明”的具体理由，不要求为消除 stale 改写正确文字。不得缩小 watch、漏登记内部共享 package 的所属条目，或批量确认未审阅内容。\n\n1. 在同一个功能 worktree 中更新对应条目的用途、选择时机、准备、操作步骤、产物和限制。新增模块必须有独立条目；新增 app/package/tool 必须登记 `watch` 归属。共享实现可被多个条目关注。\n   已迁移的模块只改owner目录内的manual.json；引用必须指向本owner的该文件，watch继续覆盖来源。不得在中央目录增加第二份正文或局部覆盖字段；loader拒绝越界路径、链接、错误owner、未监测来源和重复ID。Deck构建把同一JSON的用户说明编入独立后备窗口。\n2. 核对 `sources` 中的权威 Markdown 和实际入口。来源出现矛盾时优先查明实现与最新支持边界，在条目中明确限制；不能把历史文档的“通过”提升为当前运行时通过。\n3. `watch` 覆盖对应实现目录或文件。检查读取 Git 已跟踪和未忽略的新文件，忽略测试、scratch、dist；生产逻辑、文档或入口变化会使指纹过期。不要缩小 watch 来绕过检查。\n4. 查看受影响条目：\n\n   ```powershell\n   bun run handbook:status\n   ```\n\n5. 对照确认后，记录具体核对内容。下面的 `\u003cid>` 替换为报告里的真实 ID；多个已经核对的 ID 可用逗号分隔。\n\n   ```powershell\n   bun run handbook:review -- \u003cid> --note \"已对照入口与来源，更新新功能步骤和适用限制\"\n   bun run handbook:build\n   bun run handbook:check\n   ```\n\n   若实现变化确实不影响用户说明，记录具体核对结论，例如“仅调整内部缓存，入口、结果与限制保持一致”；已有 watch 报 stale 的条目仍按本步骤更新 review 并生成页面。review 是作者确认记录，不是自动语义验收，不可盲目批量确认。\n\n6. 实际双击 HTML，检索新功能，打开受影响条目，对照文义和命令。如果修改页面交互，还要检查桌面与窄屏、主题、返回导航、深链接和复制命令。修改检查器运行 `bun run handbook:test`，它在随机临时仓库验证失效来源、新工具漏登记和过期页面等拒绝路径。变更测试或运行器时，可用安全入口 `bun run handbook:test:bun` 有界核对全仓 CI 所用的 Bun runner 兼容性，不直接执行内部 raw 脚本。\n7. 在已有发布授权范围内，把实现、说明、核对记录和生成页面一起提交并合并到 master。合并产生新组合时，重新核对受影响条目并生成页面；不要保留两侧都已过期的 HTML。\n8. 合并后在 master 运行 `bun run handbook:check`，刷新固定入口并检查本次新增/修改条目。记录同步结果；用户基线、索引与发布门禁仍按 worktree runbook 执行。\n\n## 自动检查会做什么\n\n`handbook:check` 接入 `ci:verify`。它会拒绝缺失来源、重复 ID、无效步骤、不存在的 Bun 命令、内部 raw 测试入口、新工具目录未登记、实现/来源指纹过期，以及生成 HTML 和当前内容不一致。\n\n检查不会自动改写文字，不访问网络，不安装 Git hook，也不会自动 commit、merge 或 push。默认 build 同样不会更新核对记录。仓库 CI 的失败会报告不同步；是否阻止远端合并由仓库既有分支保护设置决定，本任务没有修改该设置。\n\n使用已提交 HTML 是刻意的：这样仅凭仓库文件就能阅读。合并同时带来新的说明和页面，不要求用户每次打开前再启动构建器。\n\n## 内容边界\n\n- 常规生成示例显式使用 v14/core，默认 icon-mode off；专门的图标操作才展示 safe。\n- 原始文档按原文离线展示，其中可能有历史状态和旧运维例子。当前推荐操作以人工核对的条目为先。\n- 当前旧 Vault Sync 的备份行为与用户无备份规则冲突，手册明确标注，不提供默认执行捷径。模块安装、迁移等旧文档也不能绕过无备份和授权规则。\n- 不把 `.local`、私有文档、真实生产地址或凭据加入 sources。不要将“构建可打开”写成“功能全部实测通过”。\n","docs/runbooks/legacy-next-test-inputs.md":"# ServerNext 历史回归测试输入\n\n迁移实现已经在主线。历史 Midi 6.0.2/local.9、DAE 与外部候选的离线测试还需要固定来源文件；现在把这些材料作为主工作区的本地测试输入保存，不再靠保留旧迁移 worktree 来运行测试。\n\n## 保存内容与身份\n\n`tools/legacy-next-inputs/manifest.json` 列出 170 个输入文件的相对路径、大小和 SHA-256，总计 220,267,059 字节（约 210 MiB），另保留 Midi 固定提交的 Git 对象和原始索引。内容包括实际被测试读取的 Midi 源文件、TypeScript 5.7.3 编译器、dnd5e 6.0.2 分发源码、DAE 14.0.14 原包、Classpack 4.3.4 原包及两个离线合集、对照分析数据，以及外部模块的少量固定源文件。\n\n原包、第三方源码、合集和私有分析数据保存在忽略的 `.local/legacy-next-test-inputs/data/`，不提交到仓库。清单、准备工具、定位器和说明随主线管理。只读取清单内的文件，不复制整棵旧工作树、世界、凭据、上传配置或历史操作日志。LevelDB 的数字命名 `.log` 是数据库状态文件，保留；`LOG`、`LOG.old`、`lost/` 与上传临时配置排除。\n\nMidi 输入保留锁定提交 `4338eeab85041cd71b76ede36818e2265cbf06ae` 的对象及索引，未使用的上游工作文件以 skip-worktree 标记省略。实际测试仍能比较原始 Git blob、五个预期修改路径、源码 SHA 和当前 checkout 的补丁。不会复制来源仓库的远端配置、凭据或历史日志。\n\n## 一次准备\n\n在要接收输入的项目 checkout 根目录执行。来源必须是已经持有清单全部输入、身份匹配的绝对 Git checkout 路径；下面占位符需换成实际路径。\n\n```powershell\nbun run legacy-next-inputs:prepare -- --source-root '\u003c含已核对输入的checkout绝对路径>'\nbun run legacy-next-inputs:prepare -- --source-root '\u003c含已核对输入的checkout绝对路径>' --apply\nbun run legacy-next-inputs:prepare -- --check\n```\n\n第一条只读取和校验，返回计划；`--apply` 才在目标的 `.local/legacy-next-test-inputs/` 创建独立输入。写前验证全部来源哈希和 Git 身份，写后重新读回，全部一致才产生 `ready.json`。来源不会被修改。`--target-root '\u003c接收checkout绝对路径>'` 可以显式指定接收目录。\n\n准备器拒绝覆盖已有输入库。失败后保留来源和不带 ready 标记的部分目标，报告具体错误；不要强制删除或用已有 ready 标记掩盖失败。完整输入库可用 `--check` 校验，它不再读取旧来源。\n\n## 当前 checkout 与新 worktree 使用\n\n定位顺序是：非空的显式 `FVTT_LEGACY_NEXT_INPUT_ROOT` → 当前 checkout 的已准备库 → 同一 Git 仓库主 checkout 的已准备库 → 当前 checkout 原有缓存路径。环境变量为空时按默认查找。主工作区准备一次后，新建 sibling worktree 可以共享它，无须重新导入或指向旧迁移树。清单失配、不完整 ready 或目录链接越出保存 checkout 时停止，不能静默跳过。\n\n验证默认路线时先清除当前进程的历史覆盖，再运行当前候选测试：\n\n```powershell\n$env:FVTT_LEGACY_NEXT_INPUT_ROOT = $null\nbun run test:legacy-next-inputs\nbun run midi-qol:test\nbun run test:classpack-next\nbun run --cwd foundry-modules/server-next-external-candidates test\nbun run --cwd foundry-modules/server-next-external-candidates test:dae\nbun run --cwd foundry-modules/server-next-external-candidates test:dae-compendium-status\nbun run --cwd foundry-modules/server-next-external-candidates test:item-piles\nbun run --cwd foundry-modules/server-next-external-candidates test:vision-macro\nbun run legacy-next-inputs:prepare -- --check\n```\n\n显式输入根仍用于经过核对的专项来源复用；它是包含原相对路径的根目录，准备库对应的是 `.local/legacy-next-test-inputs/data/`。测试实现、锁定文件、补丁和 Classpack 身份报告始终从当前 checkout 读取；不会从输入库导入旧的项目实现。\n\n## 验收范围\n\n这些检查证明材料完整、历史来源回归可运行。Classpack 的两个数据库查询先复制所需 pack 到本次随机临时测试目录，再打开和关闭它；原始 pack 的文件清单与字节需保持一致。当前 ClassicLevel 的 `readOnly` 参数不足以防止打开时轮换内部文件，所以不直接打开输入库中的数据库。\n\n这些入口不安装模块、不启停服务、不打开运行中世界，也不重新声明现行版本的玩法接受。\n\n这次只消除旧迁移树依赖。现有测试仍读取本机 `F:\\FoundryLab` 的固定 Core/Node、系统方法、TCoE 对照来源与部分已保存接受收据；没有把这些依赖搬入输入库。全新机器或公共克隆仍须取得合法来源和相应参考环境，不能把本机通过称为通用自包含测试。历史固定版本不替代现行系统，旧 PASS 也不推广到新版本。\n","docs/runbooks/midi-qol-source-patch-build-install.md":"# 在独立工作树使用历史测试输入\n\n历史 Midi 6.0.2/local.9 与 ServerNext 外部候选测试需要当时锁定的源码、分发文件、离线候选及对照输入。按[历史测试输入准备流程](legacy-next-test-inputs.md)准备主工作区的本地输入库后，当前 checkout 和新 worktree 自动读取它，不再需要指向旧迁移树。新检出没有这些 ignored 输入时不能宣称通过。\n\n```powershell\n$env:FVTT_LEGACY_NEXT_INPUT_ROOT = $null\nbun run midi-qol:test\nbun run test:classpack-next\n```\n\n定位器只重定位明确列出的 ignored 缓存路径；测试、实现、lock 和补丁仍从当前候选读取，固定提交、版本及 SHA 检查继续执行。定位器本身不写入输入；一次性准备工具需显式 `--apply`，默认只读。仍可用非空 `FVTT_LEGACY_NEXT_INPUT_ROOT` 指定经过核对的输入根，它优先于自动定位；为空时先查本 checkout 的库，再查主 checkout 的库，没有库时沿用原缓存路径。准备库的完整校验用 `bun run legacy-next-inputs:prepare -- --check`，不读取旧来源。不能把当前运行系统替代历史 6.0.2 来源；通过结论仍须注明输入与本机参考环境，不能当作未准备输入的新克隆通过。\n\n锁定的 `0001-dnd5e6-active-effect-base-type.patch` 有原始混合换行，其完整 SHA 为 `3bfbe35bf569faaee6952fd2cb7abba67f5ead47365abe7dd987720456ffde79`。精确 Git `-text` 属性保留这些字节；不要改预期 SHA 或宽泛忽略差异来绕过来源门。\n\n## Midi-QOL 锁定源码、补丁、构建与 ServerNext 安装\n\n本流程只用于 Foundry 14.368 / dnd5e 6.0.2 的 `server-next`。`server-mirror` 是只读来源，工具会拒绝将它作为安装目标。\n\n## 1. 先检查官方更新\n\n```powershell\nbun run midi-qol:upstream-check\n```\n\n结果会列出官方分支、最新 release、开放 MR 中与当前修复相关的差异，以及锁定分支是否前进。该检查是决策证据，不会改变 `upstream.lock.json`；构建始终使用锁定的完整提交 SHA。\n\n如果官方已包含适用修复，先更新来源锁定并删除重复补丁，再运行下面全部检查。不能只根据版本号或说明文字认定问题已经修复。\n\n## 2. 构建本地候选\n\n```powershell\nbun run midi-qol:build\nbun run midi-qol:test\n```\n\n构建在仓库忽略的 `.local/midi-qol` 下重新取得锁定源码，校验 `package-lock.json` 与补丁 SHA-256，先记录未打补丁的 TypeScript 诊断，再应用补丁并比较候选诊断。补丁不能精确应用或诊断新增时停止。\n\n真实源码回归测试读取这个锁定 checkout；首次使用须先构建准备源码，已有同一候选源码时直接运行测试即可。测试会验证源码身份、执行真实方法及逐入口负向变异，并用实际 Foundry common helper 复现 dnd5e 的缺 ID 迁移碰撞。此离线模型测试只读取固定版本文件，不连接数据库或启停服务。\n\n构建不读取或修改 `I:\\OpenCode\\remote\\builds\\midi-qol-beta-dnd6-4338eeab`。它不会调用上游 `dev`、`clean` 或 `tag`，不会写 Foundry 数据目录。候选 ZIP 与 `build-result.json` 位于 `foundry-modules/midi-qol/dist`；`dist` 不进入 Git。\n\n## 3. 预览安装门禁\n\n```powershell\nbun run midi-qol:install\n```\n\n默认只验证候选包和目标身份：数据根必须精确为 `F:\\FoundryLab\\foundry-v14\\data\\server-next`，世界必须是 `cor-cotn`，Foundry/dnd5e 必须为 14.368/6.0.2。30002 必须未监听，`options.json.lock` 必须不存在，且任何进程命令行都不能引用该 dataPath；无法读取进程所有权时 fail-closed。ZIP 必须只包含 `midi-qol/`，manifest ID 必须保持 `midi-qol`，解压树不得含 symlink/junction。\n\nServerNext/30002 由用户管理为永久运行的共享环境。本任务不得启停或重启；E2E 使用现有服务，只操作自己标记的测试文档。完整包安装器保持停止状态门禁，不能为了安装而停止服务。候选工具当前只接受 local.7 → local.8 的独立浏览器资源入口；local.7 的 A–G/Z 35 项历史验收已关闭，local.8 的新效果创建修复仍须单独做浏览器验收。local.4 在源码审查被拒绝、未部署。旧 PID、旧 handoff 和“本轮曾启动”均不构成停止权限。\n\n### 常驻实例的受限浏览器资源更新\n\n```powershell\nbun run foundry-modules/midi-qol/browser-update.ts\nbun run foundry-modules/midi-qol/browser-update.ts --apply\n```\n\n先预览，只有明确 `--apply` 才替换资源。该入口只接受锁定 local.8 构建与已知 local.7 包之间的浏览器 bundle、source map 和版本 manifest 差异，验证真实目标与监听进程，并保留原 compendium 和世界。它不调用启停、不覆盖整个模块目录、不创建备份；检查失败停止。更新后重新核对磁盘和 HTTP 返回的 bundle 哈希及原 PID。\n\n服务器可能继续缓存 local.7 的 manifest 版本。不要把缓存 UI 版本当作新代码已加载的证据：测试宏从候选 ZIP 生成两项 cleanup 方法、`Workflow.item/activity` getter、伤害目标渲染、附魔 clone，以及 `CONFIG.ActiveEffect.documentClass.prototype._initializeSource` 的源码指纹。getter 用属性描述符读取函数，不执行取值；local.8 必须比对新增 `_initializeSource` 指纹，否则仍加载的 local.7 会被误判为候选。分别记录候选和缓存版本，只在当前场景完成后刷新自己的标签页（控制链失联时允许恢复自己的页面，并先读回不确定操作是否执行）。该入口不适用于含服务端元数据/依赖变化的其他更新，也不是冷启动验收。\n\n## 4. 安装到停止状态的 ServerNext\n\n确认 dry-run 通过后：\n\n```powershell\nbun run midi-qol:install -- --apply\n```\n\n安装器先把候选解压到 ServerNext 模块目录中的本次临时 staging，再删除旧 `midi-qol` 并原地改名。它不创建备份，不修改世界数据库或模块启用配置。任一身份、端口、归档或路径检查失败即停止。\n\n停止状态安装流程属于历史/未来协调入口，当前永久服务不执行它。历史 cold-start smoke 单独保留；浏览器资源更新后核对 ZIP、manifest、磁盘及 HTTP bundle 哈希，再进行当前 C/F 验收。真实玩法由独立 Chrome 任务执行；测试临时对象必须清理，不能用静态检查或服务器启动代替玩法结论。\n\n### 2026-09-24 local.9 的精确离线更新边界\n\n本次 ServerNext 迁移已获用户持续推进授权，可在共享世界没有其它操作且正常关闭后受控停/启**同一**服务；此为本次任务的具体授权，不修改上面通用安装器的停止门禁。local.9 的[只读差异预检](\u003cF:/FoundryLab/foundry-v14/evidence/server-next-migration/midi-local9-controlled-update-20260924/preflight-path-diff.json>)发现候选 ZIP 与安装目录的 **107 个非 pack 文件路径完全相同，只有 `midi-qol.js`、`midi-qol.js.map`、`module.json` 三项哈希不同**；但两个已安装 pack 的 LevelDB 文件路径与 ZIP 不同（候选12项、安装18项）。全包安装器会删除并替换整个模块目录，超出这个补丁的文件范围，不能用于本次 local.8→local.9 更新。运行世界时没有读取 pack 数据库内容。\n\n先核对当前 local.8 的 manifest/bundle 哈希、local.9 锁定构建 ZIP SHA-256 `039E766D07A80C832CF610128B58C590CA438BADF2298209BA0B04E21D1AC432`、精确 PID/dataPath/world/port，并确认所有本轮 Chrome 临时对象已清理。通过正常 Foundry UI 返回 Setup；父任务独立核对 `/api/status active=false`、23个世界 `LOCK` 文件全部可独占打开，才停止精确 Node PID。服务完全停止后对安装目录全部文件做完整清单/哈希比较，尤其核对 pack 仍为原安装内容；**只**将候选三项经同目录临时文件哈希校验后原子替换，不新建备份、不删除或替换 pack。任何额外差异、链接、占用或读回失败均停下报告，不启动不完整模块。\n\n更新后三项与候选哈希匹配、其余安装文件与原哈希一致，再按原 app/data/world/loopback 参数恢复常驻服务。分别核对磁盘/HTTP资源、当前世界模块加载、真实 Chrome 的手动 APPLY 前后 HP/临时 HP 与基础 DAE `isDamaged` 到期；带类型 `isDamaged.\u003ctype>` 仍是候选已知限制，不能因基础路径通过而提升。旧 `browser-update.ts` 仅锁定 local.7→local.8，不可用于 local.9。本段是受控现场操作边界，不是替代完整安装器的一般命令。\n\nChrome handoff 必须写明“服务器由用户永久运行，结束时不得停止”。执行器只清理自身临时文档；不得退出或中断其他线程使用的服务。\n\n## C/F 已配置夹具\n\n运行 `bun run midi-qol:prepare-cf` 生成 `dist/cf-fixture/cf-macro.json` 和同目录 `cf-macro.js`。这是测试用 Script Macro，通过 Foundry 原生 API 创建临时文档，不是正式 Actor 生成输出。\n\n在 30002 的 GM 会话导入名为 `E2E-MIDI6-CF-20260920-Harness` 的宏，执行后按面板顺序操作：\n\n1. **Prepare and verify**：创建被标记的两个 NPC、嵌入法术及临时 Scene；只切换本客户端 view，不全局激活 Scene。必须看到 PRECHECK PASS，核对 1 minute、Circle 30 ft、creature、120 ft、非专注、template prompt=true 与 MidiUtilityActivity。\n2. **Cast and place Circle**：调用实际 `activity.use`；在画布目标 Token 附近放置圆形预览。不是直接创建模板或直接构造预期 effect。\n3. **Inspect effect and links**：读回真实清理 effect 的 type、system model、duration、UUID 和全部模板 dependentOn。错误、类型为 condition 或无 effect 均记录，不以 toast 消失替代结论。\n4. **Delete cleanup effect only**：只删除已验证唯一关联的 base effect，等待并核对对应 Region/Template 是否由真实依赖实现删除。夹具不帮这一步删除 Region，因此不会伪造 cascade PASS。\n5. **Export evidence JSON**，然后 **Cleanup owned fixture**，再导出清理后报告。面板同时提供 Troubleshooter 入口。构造器探针只作模型诊断，不计 C/F 通过。\n\n宏不修改任何全局 Midi 设置、不重写 prototype/Workflow、不停止服务。若前置条件不符或执行失败，保留诊断，使用清理按钮删除标记对象；实际临时文档准备和读回必须单独记录，不能把生成测试输入称为运行时准备完成。\n\n## 5. 结果边界\n\n- `midi-qol:test`：锁定源码方法行为、迁移碰撞对照、夹具前置校验及安装拒绝路径；不能代替真实 model/cascade 验收。\n- `midi-qol:build`：来源、补丁、类型诊断和打包可重复。\n- dry-run：候选包及停止状态 ServerNext 身份可安装。\n- 冷启动 smoke：服务器能加载世界和模块。\n- Chrome A–G：攻击、法术、DAE、专注、反应、模板及 Console 的真实行为。\n\n每一层分别记 `PASS`、`FAIL` 或 `NOT_EXECUTED`。本流程不包含 commit、merge、push、公开发布或远程生产回迁。\n\n当前总验收入口为 [A–G 打钩清单](../plan/midi-qol-ag-acceptance-checklist.md)。每次派发列出固定测试编号、已过不重测和未执行项；父方复核原始证据后打钩。2026-09-21 用户单独授权的服务故障恢复已完成，这不授权执行器在日常 E2E 中启停共享服务。\n","docs/runbooks/weapon-mastery-cotn-e2e.md":"# Weapon Mastery & Properties：CoTN 批次验收\n\n主环境是 `server-mirror/cor-cotn`，锁定 Foundry 14.364、dnd5e 5.3.3、Midi-QOL 14.0.11，并保留世界原有模组。原生无 Midi 路径单独记录，结束后恢复配置；不能把精简环境结果代替 CoTN。通用检查选择见现行 [开发反馈闭环](development-feedback-loop.md)。\n\n## 固定候选并进入批次\n\n1. 在候选 worktree 显式运行 `bun run build:weapon-mastery-properties`。构建生成 `dist/build-identity.json`；install、patch、verify-artifact、verify-install 都只校验固定产物，源码或配置变化时先重建。`bun run verify-install:weapon-mastery-properties` 返回安装树、运行脚本与 buildId；仍为 `runtimeVerified:false`。\n2. 由 Foundry Ops 核对 30001 PID、可执行文件、数据根、世界、版本和 owner/占用；被他人使用时协调。30002 和生产不在本流程写入范围。\n3. 普通 Chrome 操作沿用当前项目的 `chrome-delegation-dev` 与宿主要求，默认独立 `gpt-6.1-sol / medium` 执行任务，同一模块批次复用执行者；主控及其他角色保持用户当时配置。执行者核自身实际模型、effort、权限与目标，主任务收简短收据并复核证据。历史 Luna/max 收据保留原身份；不宣称已验证速度或总 token 收益。独立任务须满足宿主创建授权和实际权限；不能把任务隔离当成浏览器或数据隔离。\n4. 入批记录全部启用模组 ID/版本、相关设置、客户端 `game.modules.get('fvtt-weapon-mastery-properties').api.buildId` 与安装身份。环境发生变化才重取完整基线，单用例保存必要差异。\n\n## 持久 helper 与正式交付\n\n源码为 `foundry-modules/fvtt-weapon-mastery-properties/e2e/fixture-macro.js`，纯判定器为相邻 `evidence.ts`，GM 界面为 `src/e2e-harness.ts`。它们随正常模块构建编入浏览器入口。主持人启用 `Weapon Mastery GM E2E harness (development only)` 后，通过 Token 工具栏试管按钮打开。按 `Scan official dnd5e weapons`、`Create / resume batch`、`Prepare task scene and Combat` 完成准备；用 `Open task attacker sheet` 打开测试角色。重载后从批次列表恢复，无需重新交付源码。独立完整宏入口保留兼容，初始化宏不能被临时检查代码覆盖。\n\n本地文件工具负责读取授权的源码；Foundry 的脚本宏或受支持导入功能负责保存、执行测试程序；Chrome 负责操作 Foundry 页面。浏览器直接打开本地 JS 不是准备步骤。先验证完整工具在 Foundry 内的保存和重载恢复，再扩展玩法测试；初始化宏与临时检查命令使用不同入口。\n\n历史工具拒绝覆盖浏览器访问该本地 file URL 及同一访问的绕行，保留此事实与边界。本地文件读取和哈希核对已经成功，不能把该拒绝写成整个任务无法取得源码；也没有证据证明用户重新上传会解除浏览器限制，因此撤销“重新传附件才能继续”的前置要求。应用内保存/导入操作须按当前受支持工具及实际拒绝范围核实；未验证前不宣称交付已完成，不重复被拒操作或用其他通道规避它。只有确实缺少用户输入时才提出具体请求，不能转为逐项手工建场地。\n\n正式攻击前先核对客户端构建身份，以及一次 reload 后能够恢复已有批次。只存在源码文件、按钮或旧 Macro 文档不算真实恢复成功。\n\n## 批次与用例入口\n\n| 入口 | 用途 |\n| --- | --- |\n| `ensureBatch(options)` | 建立或按精确 ledger/runId 恢复批次；提供 expectedBuildId 与可选 expectedSettings，核对身份和归属 |\n| `prepareCombat({ledgerMessageId})` | 激活任务场景，创建或恢复带准确场景关联的任务战斗；只包含本批棋子 |\n| `adoptBuild({ledgerMessageId,expectedBuildId,receiptsSaved:true})` | 旧结果保存且没有未完成用例后，显式接纳实际加载的新构建；保留对象和原证据身份，受影响用例仍须复位重测 |\n| `resetCase({ledgerMessageId,scenario})` | 复位任务所属状态，核对前一 workflow、效果和当前回合 |\n| `runCase({ledgerMessageId,scenario,source,request})` | `ui-activity` 登记真实 UI 用例；`runtime-api` 调用公开 use API，明确尚需完成的 UI 步骤 |\n| `snapshot({ledgerMessageId,scenario})` | 读回真实场景、Combat、资格、消息、HP、效果及诊断台账 |\n| 面板 `Load selected saved receipt` | 选择既有批次与规则后，从精确台账只读载入已保存收据；不重导已关闭用例，也不修改旧构建身份 |\n| `checkpointVex({ledgerMessageId,observations})` | 首击应用伤害后立即固定攻击卡、实际扣血、攻击者新 Vex 效果和 ID；返回 `SAVED` 才进入第二击 |\n| `prepareVexNext({ledgerMessageId})` | 第二击前核对原效果、同一攻击者、目标与选中的目标 Token |\n| `recordVexPreRoll({ledgerMessageId,observation})` | 掷骰前记录游戏对话框实际提示的优势来源和所选模式；`STOP` 时停在本项 |\n| `exportReceipt({ledgerMessageId,scenario,observations})` | 可重复保存中间证据；完成后以 observations.closeCase=true 关闭已终止用例，未知字段不能猜填 |\n| `reconcileCase({ledgerMessageId,scenario,isolationReason})` | 核对中断或未完成用例；已终止可复位，无法确认结束则隔离整个批次并返回 requireNewBatch |\n| `cleanupBatch({ledgerMessageId})` | 全部用例完成后按 ID 与归属清理任务对象 |\n\n兼容原 `create/registerCombat/captureChatMessages/cleanup/finalize` 入口。真实武器 UUID 从锁定系统或正常世界内容取得，不猜 ID；家规参数按已配置规则提供。批次保留场景、Actor、Item、Token、Combat 和完整 helper，用例间复位；新增规则沿用批次。\n\nVex 复位时，工具先核对当前 Canvas 场景、任务 Token 的 ID、Actor 和归属标记，再通过 Foundry 14.364 的公开 Token 图层操作控制唯一任务攻击者、选择唯一任务目标；若入口不可用，仍以实际读回为准。首击启动 UI 用例前，核对面板 Snapshot 中 `sourceSelection.matches=true`、`controlledTokenIds` 只有本批 `sourceTokenId`，以及 `targetSelection.matches=true`、`selectedTokenIds` 只有本批 `targetTokenId`，并记录 `paused`。标记 Combat 行的显示名称不足以证明游戏用户实际控制了攻击者或选中了目标。工具在 UI Vex 启动时会拒绝错误的攻击者或目标选择。若测试期间调整世界暂停状态，登记原值并在本批收尾恢复。\n\nVex 优势测试场地须让攻击者与目标真实互相看见，否则 Midi 的不可见优势/劣势可能抵消 Vex，净模式呈“常规”。新批次夹具显式开启任务场景的明亮全局照明，并给任务 Token 60 尺视野。已有批次不会因源码更新而自动改变；对已有任务场地修订前，核对精确批次、场景、两枚 Token 的归属与当时 HP/效果，通过 Foundry 文档 API 修改后读回视线状态，再从原首击检查点继续。若窗口已列出 Vex 优势来源但净模式为“常规”，如实记录两种来源并停在掷骰前，不能把普通单骰判作 Vex 失败。\n\n面板摘要的 `status=Observed` 只表示 Snapshot 已读回；判断用例是否可以复位、继续或放弃，应看 `caseStatus`、`batchStatus`、`activeCase`。这些字段来自台账状态，不能把摘要的操作状态当作用例状态。\n\n正式 reconcile 若返回 `isolated`，短摘要应直接保留 `requireNewBatch`、`retainedIds` 和 `reconciliation.pendingAttacks`；先核对这些字段，再决定新批次与之后的精确清理。若 Copy last 后系统剪贴板哈希仍与旧收据相同，不要把旧内容另存为本次隔离收据；可保存屏幕上这份短摘要，但须标明它不是完整原始 JSON。\n\n使用表单内的 Activity 时，先核对精确 Item/Activity ID、按钮实际可见位置以及点击坐标上的顶层元素。9 月 26 日曾发现 Vex Activity 元素虽已连接且带 `item-action`，中心点却被下一件 Deadly 武器的标题盖住；这种坐标不能用于 Vex 点击。可仅调整表单展开或滚动状态，再重新核对坐标与目标，避免重复误点。若确认点击真实 Activity 后仍没有新卡，先比较点击前后的聊天消息与攻击者模块台账，再看 `weaponUseGate` 中武器是否嵌入、当前用户是否有权限、是否带 Item Macro，以及攻击 Activity 的 `canUse`。这些只读字段用于缩小入口故障范围；即使均为可用，也不能代替一次真实攻击卡。\n\nVex 首击在真实伤害卡点击 Apply 后，立即使用面板的 **Vex: save first-hit checkpoint**。工具把攻击编号、卡片、实际扣血与攻击者身上的新效果 ID 写入台账；返回 `SAVED` 后，保存完整收据并核对文件存在。浏览器正常下载时点 **Download last JSON**；本地 Chrome 若把 Blob 链接打开为标签而不保存文件，可点 **Copy last** 一次，从本机标准文本剪贴板读回 JSON。先在内存中核对 runId、scenario、构建与关键收据字段，再写入任务证据目录并读回哈希；不要把完整 JSON 输出到对话或在浏览器里展开。实测 Browser Use 的 `tab.clipboard.readText()` 对此路径曾返回空，不能把它当作 OS 剪贴板无内容。不能保存未知剪贴板内容或仅有的页面摘要；文件不存在时不能勾选 Previous receipts saved。随后使用 **Vex: check target and effect**。打开第二击游戏对话框后、掷骰前，把界面实际提示写入 observations 的 `vexPreRoll`：`targetActorId`、`effectId`、`offeredAdvantage`、`sourceLabel`、`selectedMode`（`advantage` / `normal` / `disadvantage`），执行 **Vex: record dialog before roll**。只有 `READY` 才掷骰；随后记录攻击卡、实际骰子和效果消费，导出并保存最终收据。选择“常规”得到的单骰不能断言 Vex 失败；前置检查点缺失时判 INCOMPLETE。Sap 仍在首次效果产生后、下一击消费前导出中间收据。观察尚未完成时保持用例 active，不能启动下一项。源码中的预期构建 ID 必须来自固定产物；旧批次缺少身份仍为 INCOMPLETE，不靠相同版本号补齐。\n\n若首击扣血有证明而检查点因 `attacker-vex-effect-missing` 返回 `STOP`，保存完整收据后停在此处，不进行第二击。当前候选在 Vex 用例开始时只对本地 GM 打开有界伤害证明诊断；收据的 `diagnostics` 只保留阶段、原因码、攻击/消息编号及目标 HP，用于区分 `updateActor` 未带证明、状态门槛、消息关联和证明校验失败。诊断不会补发效果或放宽校验。未完成攻击若仍在模块台账中，不强行复位同一批次；依正式 reconcile 的结果保留或隔离。\n\n同一世界只运行一个可写用例。未完成的对话框、伤害应用或 workflow 不能被下一项复位覆盖。中断用例恢复为待重新执行，不补记成功；无法确定结束的状态保留证据并隔离，另建任务所属对象，批末统一清理。未知或他人的对象不修改。\n\n取消预约的当前权威状态在效果 `flags.fvtt-custom-conditions.weaponEffect.reservation`，不是攻击历史 `source.moduleLedger[].reservations[].ticket`。未掷骰正常取消后应同时读回：攻击 step=cancelled、原效果仍启用、当前效果 reservation 已移除、HP 与攻击骰消息不变。历史台账可以保留当初的 reserved 票据，已提交攻击也可以保留 started 票据；单凭历史票据不能判定当前预约残留。核对效果 instanceId、revision 和 attackId 后再作结论，不为改变历史票据而修改运行逻辑或重复测试。\n\n## 玩法及判定\n\nFatal/Deadly验收分别记录“攻击是否重击”和“伤害是否选择重击”。在dnd5e伤害配置窗提交normal会主动关闭本次伤害的重击，即使攻击是重击、窗口此前显示2d6或critical按钮存在。验证重击特性必须提交当前伤害窗口的critical动作，并从最终骰子/卡片读回critical；不能查看critical按钮样式后点normal再把普通伤害判模块FAIL。攻击检定的normal按钮则表示普通攻击模式，含义不同。原始错误操作保留并标明前提不成立，只重试受影响用例。\n\nCleave 开始前要求 Snapshot/面板 `cleaveGeometry.legal=true`。两个候选距离来自实际网格 `measurePath`；Foundry14.364 的 diagonals=1 是 EXACT（对角一步约7.07尺），不是等距5尺。原中型攻击者与两中型目标的直角摆位不能在该设置下证明5尺Cleave。Reset case现对Cleave使用大型2×2任务攻击者，来源(400,400)、主目标(600,400)、次目标(600,500)，最近占用格中心距离均5尺，棋子不重叠；武器reach和世界设置保持实际值。其他用例复位会恢复来源中型1×1、(500,400)。超距或测距缺失在攻击前失败关闭，不能等攻击完再补几何前提。\n\n优先复验新版 Vex/Slow 的 **Midi 卡片内 Apply**。必须通过原 UI 回归证明正常伤害卡与实际 HP 更新有关联；API 成功不能替代此 UI 故障回归。Vex 检查另一击对同一目标的优势来源和消费，Slow 检查速度与本次效果，Push 实际选定合法落点并读回位移。\n\n随后覆盖共十一项规则：Cleave、Graze、Nick、Push、Sap、Slow、Topple、Vex、Deadly、Fatal、重击流血。重复计算和边界用低层/正式 API 批量覆盖；保留不同交互机制的 UI。原生与 Midi、玩家与 GM 的不同业务路径分别记录，不做全排列。\n\n- 前提成立、观测完整而预期结果不存在：FAIL。\n- 前提真实未成立：PRECONDITION_FAILED；没有执行：NOT_EXECUTED。\n- 观测或本次因果关联不足：INCOMPLETE；不能据此宣布代码失败或通过。\n- 正确结果且来自本次动作：PASS。内部 ledger 用于诊断，旧效果不能冒充新效果。\n\n保存 exportReceipt 返回的 JSON 并核对文件确实存在后，从仓库根运行 `bun run verify:weapon-evidence \u003creceipt.json>`。面板只展示双方 HP、效果 ID、攻击编号与原因，不在浏览器里展开或复制大段原始 JSON。退出码 0 只表示该文件提供的用例通过，1 表示存在 FAIL，2 表示前提/证据不全或输入错误；未提供的规则继续为 NOT_EXECUTED。该命令只读取收据，不访问 Foundry，也不把输入值本身当作真实性证明。\n\n对于同武器 Midi Vex 两击用例，CLI、面板导出和 Load selected saved receipt 使用同一个只读关联器：用已保存首击检查点、掷骰前观察、唯一第二击原生消息及其 Midi 卡、预约和效果读回来补全第二击身份，无需再手填 `nextAttack`。关联结果在 `evidenceAssociation` 中说明；第二击命中时还要求匹配的实际伤害证明和新的 Vex 实例。记录歧义、证据缺失或混批保持 INCOMPLETE；已证明第二击造成伤害但没有新效果是 FAIL。关联器不改写原始文件或历史构建身份，未提供的规则与清理仍独立记录。原生或换武器路径暂不自动关联，继续要求明确观察；这项工具检查不代替其真实运行验收。\n\n不调用内部 settle、直接写效果或伪造扣血来制造成功。配置使用正式 API，战斗使用正常 Activity/Midi 链路。API 与 UI 入口写入同一结构化收据，清理状态独立于玩法结果。Midi 激活时使用其公开 completeActivityUse，原生模式使用 WMP 公开 use；Nick 的两次 Light 武器使用仍走真实 UI。\n\n## 批次收尾\n\nCLI与源码中的共享关联器还支持已保存的Midi Cleave非重击、单一基础伤害命中：结合唯一父子台账、原生攻击与Midi卡、双方真实伤害证明、稳定距离和当前回合额度，推导childAttack。原生子攻击消息不必重复带parentAttackId，但子台账和伤害卡必须明确一致；重复子攻击、错目标、缺证明或复杂伤害公式保持INCOMPLETE。正属性修正错误加入子伤害时必须FAIL。已有手填childAttack不会被覆盖。此关联不重写原始收据，也不证明未执行的原生/多客户端分支；代码尚未安装时只使用CLI离线回放，不能声称客户端已有新分类行为。\n\n区分“证据分类失败”和“操作抛错”：Export receipt可以正常保存并关闭一个FAIL/INCOMPLETE/PRECONDITION_FAILED用例，只要攻击确已终止。关闭后以独立Snapshot的实时ledger.case状态和activeCase为准；receipt.after是关闭前保存的玩法快照，其activeCase不能证明当前仍开着。Reset通过显式删除上一轮case的检查点字段避免Foundry递归flag合并把旧攻击/旧build混入新收据，外部原始文件始终保留。\n\n每个用例先保存证据，再复位可重复使用对象；暂停时恢复原活动场景、Combat、暂停及登录状态，列明保留对象。全部验收完成后恢复原场景/Combat，登记任务聊天卡，调用 cleanupBatch；保存逐对象不存在读回后，`finalize({ledgerMessageId,externalReceiptSaved:true})` 最后删除台账，再清理已核对的 helper/操作 Macro。已授权的精确任务对象清理无需反复确认。测试源码和有价值的外部证据保留。\n\n已通过且未受影响的路径不机械重跑；证据保留原构建身份。共享桥接、依赖、设置或判定器改变时复验对应路径。速度配对实验记录准备、首次结果、整批、失败重试、人工介入和清理时间；没有实测不能宣布提速幅度。\n","docs/runbooks/worktree-development.md":"# 短寿命 Worktree 开发与发布\n\n本手册适用于所有会修改本仓库文件的任务。只读审计可以留在主工作区；开发、生成、测试和 topic commit 必须在独立 worktree 中完成。\n\n## 1. 建立可靠基线\n\n在主仓库只读检查：\n\n```powershell\ngit status --short --branch\ngit worktree list --porcelain\ngit rev-parse --verify master\n```\n\n先判断任务是否依赖主工作区未提交成果：\n\n- 不依赖：从当前已提交 `master` 创建 worktree。\n- 依赖：停止并向用户说明重叠文件；等待用户决定如何把成果整理为已提交基线。不得自动 stash、自动提交、复制整棵脏工作区或从旧 `HEAD` 假装获得最新实现。\n\n## 2. 创建唯一 worktree\n\n`\u003ctask-slug>` 使用简短的小写 ASCII 与连字符；时间戳防止复用未知分支或路径。\n\n```powershell\n$repo = (git rev-parse --show-toplevel).Trim()\n$parent = Split-Path -Parent $repo\n$stamp = Get-Date -Format 'yyyyMMdd-HHmmss'\n$taskSlug = '\u003ctask-slug>'\n$name = \"$stamp-$taskSlug\"\n$worktreeRoot = Join-Path $parent 'fvttV12JsonGenerator-worktrees'\n$worktreePath = Join-Path $worktreeRoot $name\n$branch = \"codex/$name\"\n\nif (-not (Test-Path -LiteralPath $worktreeRoot)) {\n  New-Item -ItemType Directory -Path $worktreeRoot | Out-Null\n}\ngit worktree add -b $branch $worktreePath master\n```\n\n创建后确认 `git -C $worktreePath status --short --branch` 只显示新 topic 分支。修改任何子目录前，在新 worktree 中读取根及最近的局部 `AGENTS.md`。\n\n## 3. 开发和验证\n\n- 只在 topic worktree 修改、生成和测试。\n- 只暂存任务范围内路径；不使用 broad staging。\n- 记录相关 focused checks、完整门禁和人工语义样本。机械绿色不能替代真实验收。\n- 用户尚未授权发布时，不 commit、merge 或 push。\n\n## 4. 一次发布授权后的顺序\n\n获得一次明确的 commit/merge/push 授权后：\n\n1. 在 topic worktree 按意图 commit。\n2. 获取最新 `master` 状态；若 topic 已落后，在 topic worktree 吸收 `master`、解决冲突并重跑相关验证。\n3. 在主工作区记录基线：\n\n   ```powershell\n   git status --porcelain=v1 -uall\n   git diff --binary\n   git diff --cached --binary\n   git diff --name-only master...\u003ctopic-branch>\n   ```\n\n4. 主索引非空、topic 改动与既有 tracked/untracked 路径重叠，或无法证明 merge 后原基线不变时，停止并报告；不得 stash、自动提交用户改动或在另一 worktree 背后移动 `master` ref。\n5. 安全时在主工作区执行 fast-forward：`git merge --ff-only \u003ctopic-branch>`。若不能 fast-forward，回到 topic worktree 完成受控整合和重验，不在脏主树即兴 merge。\n6. 重新采集主工作区 status/diff/untracked，证明发布前用户基线逐字节保持不变。\n7. `git push origin master` 后比较 `master`、`origin/master` 与预期 commit。\n\n变更用户可执行入口、输入或输出、支持版本、操作步骤或安全限制时，topic 必须包含同步更新的中文工具条目、人工核对记录与生成的根 `工具手册.html`。内部实现、测试或重构先核对这些用户信息并记录结论；既有 watch 在本次必需的手册检查或 CI 中报 stale 时，仍须人工核对受影响条目、更新 review 和页面，不要求改写正确的说明，也不缩小目录覆盖。合并前通过 `bun run handbook:check`；合并后在 master 再次运行同一检查，打开受影响条目核对本次功能。若合并引入新的实现组合，回到 topic 核对并重新生成，不在主工作区即兴修补手册。完整维护步骤见 [手册维护流程](handbook-maintenance.md)。\n\n`\u003ctopic-branch>` 是本任务创建的完整 `codex/\u003ctimestamp>-\u003ctask-slug>` 名称，不得用模糊分支名替代。\n\n## 5. 清理\n\n先建立内容保留证据，再应用清理权限和归属门禁。`git status` clean 只覆盖 Git 工作状态；主线有类似实现只说明后继能力存在，两者均不能证明整棵目录的内容可删。\n\n对精确 worktree 范围分别判断四类内容：\n\n| 内容 | 必要证据 |\n| --- | --- |\n| 已提交内容 | 固定 HEAD、保留仓库／branch 或 tag／目标 commit，核实对象可读及祖先关系。保留分支只证明提交仍在，不等于已经集成或推送。 |\n| tracked dirty | 暂存区与工作区分别列出路径和版本，逐项写处置、可恢复位置并读回原字节；暂存版本不能被工作区新版本替代。删除、冲突、文件模式／链接等差异另保留意图证据，未解决则保持未知。 |\n| untracked | 清点精确文件；需保留的内容逐项读回外部现存位置或可达 Git 文件，不能因未跟踪就判废。 |\n| ignored | 包括 `.local` 中的合同、原始收据、手工产物和输入。需保留的内容同样逐项证明；可重建缓存须明确理由，规则命中本身不是无价值证明。未清点范围保持未知。 |\n\n复用既有资产范围盘点定位所有权，再用[保留请求示例](../templates/worktree-preservation.example.json)核对内容。`entries` 的 kind 为 `index`、`worktree`、`untracked` 或 `ignored`，路径为精确仓库相对文件名；与实时 Git 清单逐项对齐。`retain` 的 recovery 指向删除范围外已经存在的文件，或有固定 branch/tag 与 commit 的 Git 文件；工具读回源和目标 SHA-256。`regenerable` 仅接受未跟踪／ignored 文件及具体理由，这是人工声明，不是工具证明可重建。原件没有可核保留位置时保留原工作树；本项目不为凑证据自动制作副本或备份。\n\n```powershell\nbun run foundry:ops acceptance inspect-preservation --input=\"\u003c保留请求绝对路径>\"\n```\n\n检查直接列出 Git 暂存、工作区、untracked 和 ignored 文件，不保存内容、不执行清理。缺失、失配、未分类、输入 `unknowns` 非空或未集成提交均为 `INCOMPLETE`／退出 2；已读回且声明齐全才是 `EVIDENCE_COMPLETE`／退出 0。删除意图、冲突、链接／子模块和权限／模式变化需单独核对，此最小入口不为它们制造字节 PASS。大目录枚举失败也保留未知。`deletionAuthorized` 始终为 false，本地 ref 不是远端推送证明。检查是时点证据；执行前重核 owner、内容变化与授权。\n\n既有历史取证沿用[退役台账](../reviews/2026-10-02-retirement-and-integration-ledger.md)的口径：50 项原版本尚未完整重建仍为未知，既不写永久丢失，也不写全部恢复；未作库存的 ignored 内容不作 PASS。\n\n只有同时满足以下条件才可清理：已取得针对精确对象的清理授权；topic 已集成并按授权推送；worktree clean；需保留内容有独立读回证据且范围无未知项；路径和分支确为本任务创建；没有其他参与者使用。上述检查结果本身不构成清理授权。满足后才执行下面的既有流程：\n\n```powershell\ngit worktree list --porcelain\ngit -C \u003cworktree-path> status --short --branch\ngit worktree remove \u003cworktree-path>\ngit branch -d \u003ctopic-branch>\ngit worktree prune --dry-run\n```\n\n`\u003cworktree-path>` 是第 2 节得到的精确绝对 `$worktreePath`；`\u003ctopic-branch>` 是同一节得到的 `$branch`。尖括号只是说明占位符，执行前必须换成该任务的真实值。\n\n若 `git worktree remove` 拒绝，停止并报告精确对象和原因；不得强制删除目录、不得改用 `Remove-Item -Force`。\n","docs/species-ai-intake-v14.md":"# Species AI Intake：TXT → Markdown → Foundry V12/V14 race/feat\n\n`--intake-species` 是不规则 TXT 或已人工编辑 Species Markdown 的正式入口。允许的精确目标只有 Foundry `12.331` / dnd5e `4.3.9` / `core` / 2024（`V12 static candidate`），或 Foundry `14.364` / dnd5e `5.3.3` / `core` / 2024（保留既有 V14 运行验收）。V13、legacy/2014、`modded-v12` 和第三方模块兼容均 fail-closed。\n\n## 数据链与状态\n\n```text\nTXT → discovery → Species Evidence IR → deterministic Markdown\n    → parser → target race/feat package → target validator → AI review\n    → accepted ledger → 独立模块 build\n```\n\n一个 TXT 最多发现 50 个互不重叠候选。每个候选单独得到 `accepted`、`needs_review` 或 `failed`；整次运行可为 `succeeded`、`partial`、`needs_review` 或 `failed`。运行包位于 `.local/species-intake-runs/\u003crun-id>/`，保存不可变来源、discovery、逐候选 IR、Markdown、JSON package、确定性报告、AI review、provider audit 和 manifest。\n\nAI 不直接编写正式 JSON。证据范围、完整 coverage、字段范围、mechanic allowlist、Markdown parser、目标 projector、package validator 与 AI cross-review 全部通过后，候选才会推广到：\n\n- V14：`input/species/\u003cidentifier>.md`；V12：`input/species/v12/\u003cidentifier>.md`，两个目标的已接受来源分别保存，避免一次修改使另一个版本的 ledger 失效。\n- V14：`output/species/\u003cidentifier>.json`\n- V12：`output/species/v12/\u003cidentifier>.json`\n- `output/species/accepted-ledger.json`\n\naccepted ledger schema v2 以 `(identifier, fvttVersion, effectProfile, rules)` 为唯一身份，V12 与 V14 可以共存且互不覆盖。schema v1 只解释为 V14/core/2024；读取、验证或 build 不会改写旧 ledger，只有一次新的成功 promotion 才原子升级为 v2。同一目标的 Markdown、package、ledger hash 必须闭合，另一目标的 package 不能冒充证据。\n\n## Markdown 契约\n\nSpecies Markdown 的 frontmatter 使用 `layout: species`、`species-schema: 1`、稳定 identifier、2024 rules、生物类型、体型、移动、感官、私有 homebrew 来源哈希与精确 UTF-16 长度，以及显式 feature/part ID。正文每个特性都有 `species-feature:\u003cid>` 稳定标记；文末的原始资料区按记录长度逐字符保留候选全文，包括首尾空白和 CRLF。\n\n允许的 v1 mechanics 只有：\n\n- `descriptive-passive`\n- `gm-assisted`\n- `external-rule`\n- `hp-per-level`\n- `ac-bonus`\n- `limited-utility`\n\nMarkdown 不允许填写任意 Foundry system path 或任意 Active Effect change。复杂但来源明确的规则可以诚实地以 `gm-assisted` / `external-rule` accepted；必须保留完整规则、触发条件和未自动化边界，不能用空 Utility 冒充实现。\n\nEvidence IR 使用字段级 claim：身份、规则版本、生物类型、体型、移动、感官和每个 feature 都必须有唯一 JSON-pointer path 与精确来源区间。coverage 必须无缝分割候选，并与这些 claim 双向引用；`ignored-with-reason` 必须写明原因。一个笼统的 `/species` claim 不能通过晋升门禁。\n\n## 命令\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\nV12 static candidate 使用同一入口：\n\n```powershell\nbun run src/index.ts --intake-species \"path/to/species.txt\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 12 `\n  --effect-profile core\n```\n\n`--dry-run` 不调用 provider、不创建 run bundle、不推广正式文件。V13、modded/legacy 和其他 target/profile 会在 provider 调用前失败。\n\n处理精确 target conflict 或恢复 provider 故障：\n\n```powershell\nbun run src/index.ts --resume-species-intake \".local/species-intake-runs/\u003crun-id>\" `\n  --decisions \".local/species-intake-runs/\u003crun-id>/decisions.json\" `\n  --vault \"obsidian/dnd数据转fvttjson\" `\n  --fvtt-version 14 `\n  --effect-profile core\n```\n\ndecision 只能批准精确 `target-conflict:\u003cidentifier>` 的 replace；不能覆盖来源证据、coverage、语义或 unsupported mechanic finding。\n恢复会创建新的 immutable run；新 manifest 和 accepted ledger 同时记录 `resumedFromRunId` 与 decisions 文件 SHA-256，从而能回溯被恢复的旧 run，而不是改写旧证据。\nresume 命令中的版本/profile 必须与原 run 完全一致；目标漂移在 provider 调用前拒绝。\n\naccepted Markdown 可以编辑，但 ledger 保存了当前 Markdown SHA-256。任何字节变化都会使条目 stale，模块 build 立即 fail-closed。编辑后必须再次把该 Markdown 交给 `--intake-species`，重新生成 run、IR、review、JSON 和 ledger revision。\n\n## 累计内容模块\n\n```powershell\nbun run build:homebrew-species\nbun run test:homebrew-species\nbun run verify:homebrew-species\nbun run build:homebrew-species:v12-candidate\nbun run verify:homebrew-species:v12-candidate\n```\n\n`fvtt-homebrew-species` 是纯内容模块，只有 `species` 和 `features` 两个 Item Compendium。V14 默认输出仍为 `dist/`；V12 static candidate 输出为 `dist/v12-candidate/`，identity 带 `supportStatus: \"static-candidate\"`。build 只读取当前目标的 accepted ledger 条目和 Markdown，重新走 parser/projector/validator，在随机临时根生成两次 LevelDB 与确定性 ZIP，并检查 identity/coverage/UUID 闭合。V12/V14 的 module ID、pack 名、Race/Feature/Effect/Advancement ID 与 Compendium UUID 相同，版本 metadata 和 Activity 形状是允许差异。\n\nV12 candidate 可以在隔离测试中使用显式 `FVTT_OPS_TEST_CLASSIC_LEVEL_ENTRY` 写入并回读 LevelDB；任何未来可安装 V12 build 必须使用真实 `app/12.331/node_modules/classic-level`。本轮没有扩展安装器、创建 V12 Lab、安装模块或运行 Foundry。\n\n现有安装器仍只属于已验收的 V14 路径；V12 candidate 不得调用它。V12 ZIP 构建成功、LevelDB 回读或静态 validator 绿色都不构成 V12 Runtime Pass。\n\n散装 JSON 是模块绑定的审阅/构建输入；race ItemGrant 使用 `Compendium.fvtt-homebrew-species.features.Item.\u003cid>`，因此不承诺脱离模块独立导入。已经授予 Actor 的嵌入 Item 是快照，v1 不提供迁移器。\n\n## 食人魔 v1 自动化边界\n\n- race 原生表达 giant / Ogre、Large、40尺、60尺黑暗视觉和 2024/private-homebrew 来源。\n- 巨武器四条完整保留为 `gm-assisted`；不写武器、不生成 Activity/Effect/flag、不解释“体型不超过你二级”、不判定建筑、不移动 Token、不重复已有推击。\n- 身强力壮的受擒脱困优势仅为描述性被动，不扩大成全局属性优势，也不自动移除 Grappled。\n- 5级附赠动作脱困是 2/LR、每次消费1的 Bonus Action Utility；聊天卡要求按原规则进行相应属性检定，不固定力量/敏捷/技能。\n- 食人魔刚毅使用 transfer ADD `system.attributes.hp.bonuses.level = 3`，即总等级 N 时增加 `3N` 最大生命值。\n- 食人魔笨拙使用 transfer ADD `system.attributes.ac.bonus = -2`；倒地后花费全部速度站起保持 `gm-assisted`。\n- 不添加来源未声明的 ASI、语言、触及、负重、武器熟练、徒手伤害、抗性或大型生物额外收益。\n\n## 当前验收边界\n\nV12 当前只通过静态候选层：锁定 4.3.9 模型的 Race、Size、ItemGrant、Utility Activity、itemUses、lr/sr recoverAll、Race 升级流以及 HP/AC Effect 路径有参考契约；Ogre V12 package 已逐条核对语义；两次 clean candidate build 的树、logical hash、UUID 和 ZIP 可确定重现。当前机器没有 V12 Lab，因此尚未验收 Token 2×2、真实 Add Species UI、1→5 级升级、AC/HP 运行值、次数消耗、Long Rest 或重开读回。只能声明“V12 静态候选支持”，不能声明“V12 可用”或“V12 正式支持”。\n\n自动测试继续使用 fake provider，以保持离线、确定和可重复；正式食人魔另以本机 Codex OAuth provider 完成了真实运行 `species-20260811022558-9a41c4a1`。该 run 的 deterministic report 与 AI review 均为 `accepted`，没有 repair；正式 ledger、Markdown 与 JSON 的来源/内容/logical hash 闭合。模块 build/verify 得到 1 个 race、5 个 feat，ZIP SHA-256 为 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。\n\n本地 `fvtt-v14-module-matrix` disposable world 已在 Foundry `14.364` / dnd5e `5.3.3` 中安装并启用该模块。原生 Add Species 流程确认 giant/Ogre、Large、40尺、60尺黑暗视觉和 AC 10→8；1级 Barbarian 的最大生命值为 12+3=15，5级为 40+15=55；5级附赠动作脱困连续消耗至 0/2，第三次没有生成聊天卡，Long Rest 恢复为 2/2。聊天卡明确要求手动执行原受擒检定，不选择属性/技能、不自动解除状态，并保留身强力壮优势。巨武器与“体型不超过你二级”始终是 DM 现场判断，未生成系统体型测试、武器写入、推击或 Token 移动。\n\n这仍不是无边界的 runtime Pass：本次没有完成精确 2×2 Token 放置、现有武器应用种族前后的字节级比较或 Actor 导出/读回。长期跑团也未验收。\n\n## 2026-08-13 线上 8080 部署记录\n\n- 用户明确授权把该模块安装到线上 `8080` 并重启；本次只操作 `fvtt-production` 的 `8080`，`51020` 的 v14 进程保持运行且未写入。\n- 用户同时明确要求本地和线上不创建备份，也不以在线人数为执行门槛。本次没有创建模块或世界备份；只使用唯一的 ZIP 暂存与构建验证目录，不保留旧模块副本。\n- 远端模块目录 `E:\\Bill\\fvtt_v13\\data\\Data\\modules\\fvtt-homebrew-species` 已落盘 10 个文件、31,577 bytes；manifest 为 `fvtt-homebrew-species` / `1.0.0`，包含 `species` 与 `features` 两个 Item pack。线上 HTTP 可读 `module.json` 与 `data/identity-manifest.json`，logical hash 为 `d9bd6759dc378333f314431e7839d2d3beadd6eb0e6faf9b9a440168f07258fd`，1 race / 5 features。\n- 重启后的精确命令为 `E:\\Bill\\v14\\code\\main.js --port=8080 --dataPath=\"E:\\Bill\\fvtt_v13\\data\" --world=cor-cotn`；最终 `/api/status` 为 active、Foundry `14.364`、dnd5e `5.3.3`、world `cor-cotn`，监听 PID 为 9852。日志记录 `Server started and listening on port 8080`，没有新增该模块错误。\n- 为清除无进程占用的启动锁，删除了 `E:\\Bill\\fvtt_v13\\data\\Config\\options.json.lock`；没有直接编辑世界 LevelDB。\n- 生产模块文件已安装并可由 Foundry 服务提供，但未取得 `Gamemaster` 密码，不能通过 UI 证明 `cor-cotn` 已启用该模块；因此“已安装/服务已恢复”为 Pass，“世界已启用/食人魔已在生产界面可用”保持未验收，不把文件落盘冒充启用。\n- 线上部署使用的 ZIP SHA-256 是 `38390d2e1554eac683c5e065c6c2404d4f569b4f662868319f4523977290581e`。master 集成前的 Markdown revision review 只更新 accepted Markdown hash/run 证据，Foundry documents 与 module logical hash 未变；当前本地重建 ZIP SHA-256 为 `77281eac8e0c5e3f7bd6f2ec3d44603da53b9d2eb0845b450bf4721cd9466e11`，本轮合并没有重新部署线上模块。\n## ServerNext 内容目标与运行兼容（2026-10-01）\n\n接续既有 Next 来源链时，Species Intake／resume 和内容构建可显式使用 `--fvtt-version 14.368 --effect-profile core`。这个内容目标仍绑定 dnd5e **6.0.2** 的来源投影、接受记录和 logical hash；它只属于 Species 路径，不扩大 Actor／Item CLI 的版本集合。5.3.3 与 V12 的原有目标、默认值及拒绝门保持。\n\nServerNext 当前系统已升级6.0.5，模块兼容候选可另加 `--dnd5e-runtime-maximum 6.0.5`：\n\n```text\nbun run build:homebrew-species --fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5\nbun run verify:homebrew-species --fvtt-version 14.368 --dnd5e-runtime-maximum 6.0.5\n```\n\n运行兼容上限不重标接受来源，不代表已完成6.0.5种族玩法验收；本次模块恢复保留已安装合集数据。入口、记录和当前接受边界见[十模块恢复记录](reviews/2026-10-01-next-605-custom-module-restoration.md)。\n","docs/web-ai-connections.md":"# Web AI connections\n\nThe Web worker supports three explicit AI connection kinds:\n\n1. `site`: the server-owned Intake provider. It is disabled by default and is\n   quota-limited per anonymous session, client IP, and process-wide daily\n   budget.\n2. `user-api-key`: a browser-created BYOK connection. The key is held only in\n   the in-memory session registry, is never written to a job or log, and is\n   cleared when the connection expires or is disconnected.\n3. `local-codex`: a Windows Companion that makes an outbound WebSocket\n   connection and runs the user's already-authenticated official Codex CLI.\n   OAuth credentials never leave the user's machine.\n\n## Public deployment\n\nKeep Bun loopback-only behind an HTTPS reverse proxy. Public mode requires:\n\n```text\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_AUTH_TOKEN=\u003c32+ random characters>\nFVTT_WEB_SESSION_SECRET=\u003c32+ random bytes, kept stable across restarts>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\nThe proxy must forward WebSocket upgrades for\n`/api/ai-companion/connect` and preserve the external HTTPS origin. The\nCompanion endpoint is `wss://\u003cpublic-origin>/api/ai-companion/connect` when\nthe public URL uses HTTPS. Never expose the Bun port directly.\nFor state-changing browser requests, forward `Host`, `X-Forwarded-Host`, and\n`X-Forwarded-Proto`; the server uses those headers only in public mode to\nvalidate the browser `Origin` against the external origin.\n\nThe anonymous browser session uses an HttpOnly, SameSite-Strict cookie. It\nexpires after eight hours idle or 24 hours absolute. Restarting the process\ninvalidates the in-memory session registry.\n\n## Site provider and BYOK\n\nSite AI requires all three limits before the server starts accepting site\nconnections:\n\n```text\nFVTT_WEB_SITE_AI_ENABLED=1\nFVTT_WEB_SITE_AI_SESSION_DAILY_LIMIT=20\nFVTT_WEB_SITE_AI_IP_DAILY_LIMIT=100\nFVTT_WEB_SITE_AI_GLOBAL_DAILY_LIMIT=1000\n```\n\nBYOK accepts `https://api.openai.com/v1` by default. Additional providers must\nbe exact HTTPS origins in `FVTT_WEB_AI_PROVIDER_ALLOWLIST`, for example\n`https://gateway.example.com`; credentials, query strings, fragments,\nredirects, private hosts, and arbitrary URLs are rejected.\n\n## Companion gate and pairing\n\n`web:dev` is loopback-only and enables the Companion endpoint for local\ndevelopment. It builds `dist/web/fvtt-ai-companion.exe` before starting the\nsingle Bun server on `http://127.0.0.1:5173`. Public/VPS deployments keep the\nCompanion hidden and disabled unless the server administrator explicitly sets:\n\n```text\nFVTT_WEB_CODEX_COMPANION_ENABLED=1\n```\n\nOnly current Windows Chrome and Edge are supported. Firefox is intentionally\nout of scope. The authenticated download endpoint is\n`GET /api/ai-companion/download`; it serves only the fixed build artifact and\nnever accepts a user path. If it is missing, build it with\n`bun run web:companion:build`.\n\nFor a local development page at `http://127.0.0.1:5173`, the page can check the\nlocal Companion directly. A remote page must use HTTPS. Its flow is:\n\n1. The user clicks connect, and the page opens a local confirmation window.\n2. That local window displays the exact remote website address and asks for a\n   deliberate approval.\n3. After approval, the local window sends a one-time, five-minute pairing\n   authorization only to the window that opened it, using browser memory. It\n   never appears in a URL, command line, log, job file, or download.\n4. The remote page uses it once to pair. The Companion then tests each selected\n   model before the connection becomes usable.\n\nThe loopback control service binds only `127.0.0.1:43173` and uses control\nprotocol v2. Before local approval it gives a remote website no cross-origin\npermission at all. After approval it returns CORS and local-network permission\nheaders only to that exact HTTPS origin. Pairing is bound to that origin, the\ncurrent Companion instance, and the current server pairing. Disconnect and\nshutdown each require a separate one-use control credential; knowing a public\ninstance ID is never sufficient. Popup blocking, rejection, expiry, a refused\nlocal-network permission, an unsupported browser, or a stopped Companion all\nproduce a user-facing recovery message.\n\nLeaving the model fields blank means the Companion invokes the user's current\nCodex CLI default; it does not inject a fixed model name. A user may specify\nmodels explicitly, but every selected main/review model must pass the real\nno-tool-call gate before the connection is ready. A gate failure never silently\nfalls back to a different model, site AI, BYOK, or a local OAuth bridge.\n\nThe adapter uses an ephemeral temporary directory, a read-only sandbox, and a\nstrict result schema. It disables the current tool features and rejects any\ntool-shaped JSONL event. The packaged Windows Companion uses the user's\nofficial `codex.exe`; it never receives project source or OAuth files. It no\nlonger accepts pairing tokens or pairing flags on the command line: users\ndouble-click the EXE and complete the approval in the page instead.\n\nThe server operator builds the Windows artifact once; end users receive only\nthe resulting executable and do not receive the project checkout or server\nsecrets. The compiled artifact hides the Windows console. It is an unsigned\ndevelopment build, so Windows SmartScreen may still require an explicit user\nconfirmation.\n\n## Job pinning and resume\n\nEvery AI job records only an opaque connection ID and an HMAC session binding.\nThe provider secret is not part of `result.json`, downloads, logs, or error\nresponses. Job polling, downloads, decisions, and resume are restricted to\nthe original anonymous session. Resume resolves the original connection; if\nit is expired, disconnected, or blocked, the job stays `needs_review` or\n`failed` and never silently switches to the site provider.\n","docs/web-deployment.md":"# fvttV12Json Web 部署说明\n\n这个 Web 工作台提供浏览器上传 Markdown/JSON、Bun 后端 workflow、任务进度，以及 JSON、Markdown、records 和 ZIP 下载。它默认是本机工具，不会因为执行 `web:start` 就监听公网接口。\n\n## 安全模式\n\n### 本机模式（默认）\n\n```bash\nbun install\nbun run web:build\nbun run web:start\n```\n\n默认地址是 `http://127.0.0.1:5174`：\n\n- 只绑定 IPv4 回环地址；\n- API 不要求 bearer token；\n- 忽略 `X-Forwarded-For` 和 `X-Real-IP`；\n- 如果把 `FVTT_WEB_HOST` 改为非回环地址却没有设置 `FVTT_WEB_PUBLIC_MODE=1`，进程会拒绝启动。\n\n开发环境可运行 `bun run web:dev`。命令会先构建前端，再由同一个 Bun 服务在\n`http://127.0.0.1:5173` 同时提供页面和 API；开发者只需要打开这一个地址。\n它还会在启动服务前编译 `fvtt-ai-companion.exe`，并在 loopback、本机模式下\n默认启用页面引导的 Codex Companion。显式设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=0` 可以关闭它；构建失败时不会启动旧页面\n或残缺服务。它不是热更新服务器，修改前端后重新运行命令即可生成新的页面资源。\n\n#### 无命令式 Companion 配对\n\n打开 `http://127.0.0.1:5173` 的“AI 连接”面板后，下载并双击\n`fvtt-ai-companion.exe`，选择模型并点击“连接本机 Companion”即可完成配对；用户不需要\n打开 PowerShell、复制启动命令或查看配对 Token。留空模型时使用这台电脑当前 Codex CLI\n默认模型；填写模型时，主模型和审查模型都会在连接前各自经过“不允许调用工具”的实际检查。\n\nCompanion 的 `127.0.0.1:43173` 只用于本机控制（health、pair、disconnect、shutdown），\n不是第二个 Web 地址，也不接受局域网连接。它只绑定 `127.0.0.1`，使用 control protocol\nv2。本机开发页只能来自精确的 `http://127.0.0.1:5173`。公开网页必须是 HTTPS：用户点击\n连接后会打开本机确认页，确认页显示精确的网站地址；只有用户点允许后，该网站才会在五分钟\n内拿到一次性配对授权。授权只保留在内存，不能写入 URL、命令行、日志或下载文件；配对、\n断开和关闭也都需要各自的一次性控制凭据。浏览器拒绝本地网络访问、弹窗被拦截、用户拒绝、\n授权过期或 Companion 退出时，页面会显示下一步处理方法。\n\n仅支持最新版 Windows Chrome 和 Edge；Firefox 不在本次支持范围。开发 EXE 使用隐藏控制台\n编译，未签名且可能触发 Windows SmartScreen；页面会显示构建产物 SHA-256，便于本机核对。\n生产 `web:start` 默认不启用 Companion；服务器管理员明确设置\n`FVTT_WEB_CODEX_COMPANION_ENABLED=1` 后，公开网页才会显示并允许使用它。\n\n### 公开/反向代理模式（显式开启）\n\n公开模式必须同时设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\n```\n\n该 token 是服务器之间的凭据，不是给浏览器页面填写的登录密码。推荐部署方式是：\n\n1. Bun 仍绑定 `127.0.0.1`；\n2. Nginx、Caddy、Cloudflare Access 或同类入口先验证真实用户；\n3. 反向代理在转发到 Bun 时注入 `Authorization: Bearer \u003cFVTT_WEB_AUTH_TOKEN>`；\n4. 浏览器永远不能读取或提交 VPS 的翻译 key、爬站 cookie、密码或这个 bearer token。\n\n如确实要直接监听网络接口，还必须显式设置 `FVTT_WEB_HOST=0.0.0.0`（或指定地址）。静态页面可以被读取，但所有 `/api/*` 请求仍必须携带正确 bearer token；不建议把这种直接绑定当作完整用户身份系统。\n\n## 环境变量\n\n部署与鉴权：\n\n- `FVTT_WEB_HOST`：监听地址，默认 `127.0.0.1`。\n- `FVTT_WEB_API_PORT`：端口，默认 `5174`。\n- `FVTT_WEB_CODEX_COMPANION_ENABLED=1`：显式启用本机 Codex Companion；`web:dev`\n  在非公开 loopback 模式下默认设置为 `1`，生产/VPS 启动默认关闭。\n- `FVTT_WEB_PUBLIC_MODE=1`：启用公开/代理模式；没有它时非回环绑定会失败。\n- `FVTT_WEB_AUTH_TOKEN`：公开模式必填，至少 32 个字符；不要提交到 Git、浏览器或日志。\n- `FVTT_WEB_TRUSTED_PROXIES`：允许提供客户端转发链的代理字面 IP，逗号分隔，例如 `127.0.0.1,10.0.0.2`。不支持主机名或隐式“信任全部”。\n\n资源边界（默认值）：\n\n- `FVTT_WEB_SHORT_REQUEST_LIMIT=10`：每客户端每分钟非 GET 请求数。\n- `FVTT_WEB_GLOBAL_SHORT_REQUEST_LIMIT=100`：所有客户端合计每分钟非 GET 请求数。\n- `FVTT_WEB_LONG_JOBS_PER_CLIENT=1`：每客户端同时运行的长任务数。\n- `FVTT_WEB_GLOBAL_LONG_JOBS=4`：整个进程同时运行的长任务数。\n- `FVTT_WEB_JOB_RETENTION_HOURS=24`：终态任务产物保留小时数。\n- `FVTT_WEB_MAX_RETAINED_JOBS=100`：未过期终态任务的最大保留数量；超过时最旧优先清理。\n\n工作流能力：\n\n- `FVTT_WEB_ENABLE_PATH_MODE=1`：允许读取服务器 workspace 路径和运行 `vault-sync`。公开部署通常不要开启。\n- `MONSTER_INTAKE_AUTH_MODE`：`api-key` 或 `codex-oauth`，默认 `api-key`。\n- `MONSTER_INTAKE_API_KEY`：API Key 模式的 AI 怪物资料整理专用 provider key；只保留在服务端。\n- `MONSTER_INTAKE_BASE_URL`：API Key 模式的 OpenAI-compatible API 根地址，例如 `https://api.openai.com/v1`。\n- `MONSTER_INTAKE_CODEX_OAUTH_BASE_URL`：Codex OAuth 本机兼容桥地址，默认 `http://127.0.0.1:8787/v1`；必须是 loopback 地址。\n- `MONSTER_INTAKE_CODEX_OAUTH_BRIDGE_TOKEN`：可选的本机桥 bearer token；默认是非秘密占位值，OAuth 凭据不放在这里。\n- `MONSTER_INTAKE_MODEL`：discovery、extraction 和 repair 使用的模型；Codex OAuth 兼容桥模式未填写时默认 `gpt-5.6-luna`。这不是 Companion 的模型设置：Companion 留空时使用用户本机 Codex CLI 当前默认模型。\n- `MONSTER_INTAKE_CODEX_OAUTH_REASONING_EFFORT`：Codex OAuth 推理强度；默认 `xhigh`，对应 Codex 界面里的 `ultra`，也接受填写 `ultra` 并自动归一化。\n- `MONSTER_INTAKE_REVIEW_MODEL`：独立 review 模型；未设置时使用 `MONSTER_INTAKE_MODEL`。\n- `MONSTER_INTAKE_TIMEOUT_MS`：普通 Intake 阶段超时；API Key 模式默认 `60000` 毫秒，Codex OAuth 模式默认 `300000` 毫秒。\n- `MONSTER_INTAKE_REPAIR_TIMEOUT_MS`：Intake 证据修复阶段的单独超时，默认至少 `180000` 毫秒；可设为 `1000` 到 `600000` 之间的整数。\n- `TRANSLATION_API_KEY` 或 `OPENAI_API_KEY`：服务器端翻译/AI normalize 凭据。\n- `GODDESSFANTASY_COOKIE`：服务器端 Goddess Fantasy crawl cookie。\n- `GODDESSFANTASY_USERNAME` / `GODDESSFANTASY_PASSWORD`：服务器端爬站登录凭据。\n- `FVTT_WEB_EXPOSE_ERRORS=1`：返回内部错误详情，仅限本机调试；公开部署不要开启。\n\n可选图片上传默认完全关闭，不再内置任何真实服务器地址。启用时必须在服务端同时配置：\n\n- `FVTT_WEB_IMAGE_SSH_TARGET`：SSH 目标，例如 `operator@assets.example.invalid`；\n- `FVTT_WEB_IMAGE_REMOTE_ROOT`：远端图片根目录；\n- `FVTT_WEB_IMAGE_PUBLIC_BASE_URL`：生成 JSON 使用的公开图片 URL 前缀；\n- `FVTT_WEB_IMAGE_TOKEN_FRAME`：可选 Token 边框文件，默认使用仓库内的小型边框资源；\n- `FVTT_WEB_IMAGE_ALLOW_HTTP=1`：仅在明确接受明文 HTTP 风险时设置；默认只接受 HTTPS；\n- `FVTT_WEB_IMAGE_ACTOR_DIR`、`FVTT_WEB_IMAGE_TOKEN_DIR`、`FVTT_WEB_IMAGE_TOKEN_SIZE`：可选目录名和尺寸调整。\n\n缺少 SSH 目标、远端根、公开 URL 或 Token 边框中的任一项时，图片能力保持“未配置”，Actor JSON 仍可生成，但不会把本机默认值或真实生产目标偷偷带入任务。\n\n浏览器只能看到“某项能力是否已配置”，不能取得上述凭据值。\n\nAI 怪物资料整理只读取专用的 `MONSTER_INTAKE_*` 变量，不会回退到翻译或通用 OpenAI 变量。`codex-oauth` 只适用于本机或受信任的 loopback 兼容桥，不应把它作为公开 Web 服务的远程认证方式。粘贴或上传的 TXT/MD 原文会发送给该 provider，因此公开部署必须在用户提交前明确告知这一点，并按 provider 的数据政策处理。服务端审计只记录 provider、model、prompt version、耗时、调用计数和错误码，不记录 key、请求头或隐藏推理。\n\n单次 Intake 最多 200,000 个 JavaScript UTF-16 字符、50 只怪物；长文本按 24,000 字符分块并保留 1,000 字符重叠，逐怪物 extraction 并发为 2。每只怪物最多 1 次 extraction、1 次独立 review 和 1 次 semantic repair；各阶段可对 timeout、429 或网络错误重试一次。模型不能自行增加循环或调用工具。`needs_review` 任务可下载 source、IR、候选 Markdown 和报告，但 Web 不会把候选 Actor JSON 注册为正式下载；只有 accepted 才注册 Actor JSON/ZIP。\n\n## 固定资源保护\n\n- Bun 在读取请求体前实施 25 MiB HTTP body 上限；有 `Content-Length` 时，API 还会在调用 `request.text()` 前拒绝超限或畸形长度。\n- 单文件内容上限是 5 MiB；合集/JSON 内容上限是 20 MiB。\n- 客户端身份来自真实 socket。只有直接 socket 对端在 `FVTT_WEB_TRUSTED_PROXIES` 内，才会从右向左解析转发链；伪造或畸形链不会创建新限流身份。\n- 每客户端和全局请求/长任务上限同时生效，不能仅靠更换转发头绕过。\n- 当前进程真正 queued/running 的任务不会被清理；过期终态任务先清理，数量仍超限时再最旧优先清理。\n- 500 错误默认隐藏内部详情。下载接口仍只服务任务登记过的文件。\n\n这些是纵深防御，不代替公开入口的真实用户鉴权、TLS、防火墙和操作系统资源限制。\n\n## Nginx 示例\n\n下面的 Basic Auth 验证浏览器用户；`Authorization` 在代理到 Bun 时被替换为服务器端 bearer。把 token 放入仅 root 可读的 Nginx 配置片段，不要写进公开仓库。\n\n```nginx\nserver {\n  listen 443 ssl;\n  server_name example.com;\n\n  client_max_body_size 25m;\n\n  location / {\n    auth_basic \"fvtt workbench\";\n    auth_basic_user_file /etc/nginx/fvtt.htpasswd;\n\n    proxy_pass http://127.0.0.1:5174;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    proxy_set_header Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\";\n  }\n}\n```\n\nBun 侧至少设置：\n\n```bash\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n如果 Nginx 与 Bun 不在同一网络命名空间，`FVTT_WEB_TRUSTED_PROXIES` 应填写 Bun 实际看到的直接代理 IP，而不是盲填公网客户端 IP。\n\n## Caddy 示例\n\n```caddyfile\nexample.com {\n  request_body {\n    max_size 25MB\n  }\n\n  basic_auth {\n    operator REPLACE_WITH_CADDY_PASSWORD_HASH\n  }\n\n  reverse_proxy 127.0.0.1:5174 {\n    header_up Authorization \"Bearer REPLACE_WITH_THE_SAME_32_PLUS_CHARACTER_TOKEN\"\n    header_up X-Real-IP {remote_host}\n  }\n}\n```\n\n同样设置 `FVTT_WEB_PUBLIC_MODE=1`、同一个 `FVTT_WEB_AUTH_TOKEN`，并将 Caddy 的直接 socket IP 加入 `FVTT_WEB_TRUSTED_PROXIES`。\n\n## systemd 示例\n\n把 secret 放在权限受限的 `/etc/fvtt-web.env`，而不是直接写进 unit 或仓库：\n\n```ini\n[Unit]\nDescription=fvttV12Json Web\nAfter=network.target\n\n[Service]\nWorkingDirectory=/opt/fvttV12Json\nExecStart=/usr/local/bin/bun run web:start\nRestart=always\nEnvironmentFile=/etc/fvtt-web.env\n\n[Install]\nWantedBy=multi-user.target\n```\n\n`/etc/fvtt-web.env` 示例：\n\n```bash\nFVTT_WEB_HOST=127.0.0.1\nFVTT_WEB_API_PORT=5174\nFVTT_WEB_PUBLIC_MODE=1\nFVTT_WEB_AUTH_TOKEN=\u003c至少32个字符的高熵随机值>\nFVTT_WEB_TRUSTED_PROXIES=127.0.0.1\n```\n\n## 产物目录\n\n所有 Web 任务写入：\n\n```text\ntemp/web/jobs/\u003cjobId>/\n  input/\n  output/\n  result.json\n```\n\n下载接口只允许下载任务登记过的产物。ZIP 下载会把成功产物打包为使用 UTF-8 文件名的 ZIP；清理策略按上文的年龄和数量边界执行。\n","foundry-modules/chat-memory-guard/README.zh-CN.md":"# Chat Memory Guard / 聊天内存保护\n\n这是一个拥有独立 manifest、版本、构建、测试、安装保护和验收边界的 Foundry module release unit。\n它不依赖本仓库的 Actor generator、AI Intake、workflow、crawler 或其他 Foundry module 私有实现。\n\n## 支持范围\n\n- ServerNext manifest 静态候选范围：Foundry VTT 14.368 / dnd5e 6.0.2–6.0.6（`verified` 保持 6.0.2）\n- 原 Server Mirror 1.0.0：Foundry VTT 14.364 / dnd5e 5.3.3，仅作历史对照\n- 模块 ID：`chat-memory-guard`\n- 当前候选：`1.1.0`；6.0.2 的历史证据保留。2026-10-25 在 6.0.6 已接受一次25条测试消息/20张页面卡、禁用并重载后25张卡/0裁剪、再启用重载恢复20张卡，以及真实帮助窗口；世界历史始终保留。系统后备头像可见，真实缩略图转换、有效的滚动暂停反证和长会话仍未覆盖\n\n模块只裁剪当前浏览器已经渲染的聊天卡片。它调用 Foundry 公开的\n`ChatLog.deleteMessage()`，不会调用 `ChatMessage.delete()`，不会修改世界中的聊天数据库记录，\n也不会修改 Foundry、dnd5e、MIDI-QOL 或其他模块源码。\n\n6.0.2、6.0.5 与 6.0.6 的锁定 dnd5e 源码都在 `module/documents/chat-message.mjs` 中以相同签名触发\n`dnd5e.renderChatMessage`。当前本地候选保留这些渲染入口，补齐缓存清理、重复注册保护和设置变化时的异步取消；已安装到原ServerNext，真实接受限于上述范围。\n\n## 独立构建与测试\n\n在本 workspace clone 中，先从仓库根目录安装锁定依赖，再进入本目录运行独立门禁：\n\n```powershell\nbun install --frozen-lockfile\ncd foundry-modules/chat-memory-guard\nbun run typecheck\nbun test\nbun run build\n```\n\n未来从过滤后的独立仓库 clone 构建时，由该仓库自己的 `bun.lock` 提供 frozen install；本次\nworkspace 迁移不把主仓库 lockfile 复制成第二份权威文件。\n\n构建输出：\n\n- `dist/module/`：可直接安装的 module 目录；\n- `dist/chat-memory-guard.zip`：独立发布包。\n\n在主 workspace 根目录仍可使用兼容命令：\n\n```powershell\nbun run test:chat-memory-guard\nbun run build:chat-memory-guard\n```\n\n旧 `install:chat-memory-guard` 只指向本地 Server Mirror，且包含与当前无备份规则冲突的历史替换逻辑；`1.1.0` 构建在任何写入前会被此入口拒绝。ServerNext 只按迁移交接的离线定点安装流程处理，不创建备份，不运行旧安装入口。\n\n## 设置\n\n在“游戏设置 → 模块设置 → 聊天内存保护”中打开设置窗口：\n\n- GM 世界默认值：供整个世界使用。\n- 本浏览器个人覆盖：每位玩家可以跟随世界设置，或只覆盖自己的客户端。\n- 默认保留 40 条已渲染消息。\n- 默认优先 Token 图，并生成最长边 128px、质量 75 的会话级 WebP 缩略图。\n\n设置保存后立即重新渲染当前卡片并应用。缩略图只存在于当前页面会话，刷新或关闭页面后释放。\n\n设置窗口的“使用帮助”按钮不会保存设置。GM 在统一手册合集已启用且接口可用时定位本模块条目；玩家或合集不可用时打开随包只读说明。正文与离线手册共用本模块 `docs/manual.json`，阅读不改变世界默认值或个人覆盖。\n\n本地候选在设置更新时使旧缩略图请求失效；旧结果返回后释放资源，不能覆盖新的头像。停止优化或关闭聊天窗口后不再派发后续裁剪，已经开始的单张卡片移除可能完成；调高保留数量也会取消按旧设置排定的后续删除。清理和重新启动不会累积本模块的事件监听。上述异步边界由局部检查保护，6.0.6 实机另已接受阈值裁剪、禁用/重载、再启用及帮助窗口；窗口统计稳定为1不等于实测全部Hook总数。测试消息与设置已清理，原世界文档、设置和已采集账号范围恢复一致；取证期间发现的Monk's界面偏好也已按精确原指纹恢复。完整证据和限制见[执行总账](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。\n\n## 诊断\n\n在浏览器控制台运行：\n\n```js\ngame.modules.get(\"chat-memory-guard\").api.getStats()\n```\n\n结果只包含渲染数量、裁剪数量、pending 删除数量、缩略图缓存数量/估算字节、失败数、模块监听器\n数量和当前有效设置，不包含消息正文。`moduleListenerCount`按已挂接聊天窗口计数；失败数为本次缓存周期内的生成失败次数，清理缓存时归零。失败来源的去重记忆同样有容量上限，日志只提示失败，不输出头像路径、URL或原始错误内容。\n\n## 已知边界\n\n- dnd5e 在 Core `renderChatMessageHTML` 之后才创建头像。本模块在\n  `dnd5e.renderChatMessage` 阶段、卡片插入聊天 DOM 之前尽量替换头像，但不声称能够阻止浏览器\n  发起首次原图请求。\n- 自动化和短时 A/B 运行时证据不能证明长时间跑团内存永不增长。\n- 完整第三方聊天卡矩阵和少见动画头像仍需在真实跑团中持续抽查。\n- 精确目标源码已核对 `ChatLog.deleteMessage()`、聊天 DOM、Core 与 dnd5e 渲染 Hook；这些静态依据不代替下面分项记录的真实客户端验收。\n- ServerNext 的独立 Chrome 批次已核对模块正常启用、重载保持、临时客户端上限20下的聊天 DOM 25→20及新消息21→20；临时客户端设置已恢复。世界 ChatMessage 存储计数、滚动阅读暂停、头像缩略图/失败回退与 `getStats()` 未取得充分证据，因此仍是部分验收。\n- workspace 物理迁移不会升级历史运行时验收结论；旧目标的真实运行时证据仍以\n  `docs/acceptance/chat-memory-guard-runtime-report.zh-CN.md` 为准。\n","foundry-modules/fvtt-babele-rolltable-embed-translation/README.zh-CN.md":"# Babele RollTable `@Embed` 翻译兼容模块\n\n这个模块修复 Foundry v14 渲染下面这种内容时的运行时缺口：\n\n```text\n@Embed[Compendium.dnd-players-handbook.tables.RollTable.phbWildMagicSurg rollable caption=false classes=\"wild-magic-surge\"]\n```\n\nBabele 可以把随机表标题翻译成中文，但 Foundry 原生的 `_buildEmbedHTML` 直接从当前 `results` 集合取英文行。模块只在这个渲染入口读取 Babele 的临时翻译结果，按 `_id` 优先、`range` 回退重新填充显示内容；文档型结果继续使用原始 `documentUuid` 生成 content-link。当前世界语言为 `zh-CN`、译包注册语言为 `cn` 时，模块只对嵌入表格按需读取 Babele 的 `cn` 翻译会话，不更改世界语言或 Babele 的全局翻译状态。\n\n它不会修改随机表、角色、特性、Item、Journal 或世界设置。翻译源仍然由现有的 `dnd-simplified-chinese-babele-patch` 提供。\n\n## ServerNext 0.2.1 历史验证与当前范围\n\n当前 manifest 范围为 Foundry 14.368、dnd5e 6.0.2–6.0.6（`verified` 保持 6.0.2）、Babele 2.9.1 与 libWrapper 1.13.5.1。旧 0.1.0 只在 Server Mirror 的 14.364 / 5.3.3 通过，不能作为 Next 已验收证据。运行时代码仍只包装同一个表格嵌入入口；6.0.2、6.0.5 与 6.0.6 锁定源码中的 dnd5e chat/result API 没有目标变更，14.368 本机源码保留表格嵌入方法、两列表格和结果行结构，Babele 2.9.1 提供只读的按语言会话 API。2026-10-25 已在 Next 14.368 / 6.0.6 实际接受狂野魔法浪涌 25/25 中文行、困惑术 5/5 中文行、“基本方位”原 UUID 的 content-link、重复渲染和真实窗口显示；来源及世界文档保持不变。其它表仍需按实际用途核对。\n\n构建和局部检查：\n\n```text\nbun run build:fvtt-babele-rolltable-embed-translation\nbun run test:fvtt-babele-rolltable-embed-translation\n```\n\n旧的 `install:fvtt-babele-rolltable-embed-translation` / `verify-install:fvtt-babele-rolltable-embed-translation` 仍是 Mirror 专用入口，不能用于 Next。Next 的定点更新从本工作树 `dist/module` 取包，先正常关闭原世界，核服务、世界锁及任务已安装的旧文件哈希，再更新 `server-next/Data/modules/fvtt-babele-rolltable-embed-translation` 的两个文件并逐文件核哈希；不创建备份或直接改世界数据库。\n\n重启并正常进入本地 ServerNext 后，在实际 UI 中检查：\n\n- 狂野魔法浪涌：25 行范围和 25 行中文结果，骰子按钮仍可用；\n- 困惑术行为：5 个结果全部存在，文档型的“基本方位”仍为原 UUID 的 content-link；\n- 重复打开/渲染不改变源表，也不写入世界文档。\n\n## 本地重构候选的匹配与回退\n\n匹配逻辑归于 `src/result-matching.ts`。同 ID 的唯一翻译优先；按范围回退要求来源与候选都能唯一定位。重复 ID、重复范围或缺少翻译时保留原文，不选最后一条。翻译对象只提供名称和描述，不能改变 TableResult ID、范围、类型、抽取状态或文档 UUID。\n\n所有行完成翻译和富文本处理后才一起替换显示；中途失败保留整张原生表。重复注册不会重复包装同一 libWrapper 实例；正常禁用模块后需重新加载世界。本候选已完成 6.0.6 两表的限定原生接受，完整表库、英文表头、内联标签和实际掷表仍未覆盖。精确构建与恢复证据见[执行总账](../../docs/plans/2026-10-11-fvtt-suite-refactor/EXECUTION_LEDGER.md)。\n","foundry-modules/fvtt-battlefield-painter/README.zh-CN.md":"# Battlefield Painter · 0.3.0-alpha.2\n\n这是GM使用的战场地形画笔。当前目录包含42个选项：36个地形配置和6个月蚀矿图案，支持阶段、部分颜色与光照、可选环境音，以及按网格绘制、擦除和历史恢复。当前进度与实际接受范围见[接续入口](docs/CONTINUATION.md)。\n\n## 版本与接受范围\n\n运行代码精确放行Foundry14.364/dnd5e5.3.3、Mirror14.368/5.3.3，以及Next14.368/6.0.2、6.0.5、6.0.6；其它配对失败关闭。6.0.6在本地Next已接受一格FireI事务、Region距离/成本、linked Token falling、普通重载、精确清理及非GM权限边界：玩家公开能力为`canMutate=false`，Painter工具栏缺席，observer Token无HUD且外来Token不可更新；绘制仅向GM开放，玩家入口拒绝已验；完整地形目录、所有网格/效果组合、长时和生产仍未接受。角色验收环境的额外消息已准确删除并确认原生缺席，作者和唯一whisper均为本轮TempPlayer，别名Dice So Nice!，Atlas归因假设已否证并符合已实装DSN6.3.1欢迎源；native terminal 的 Task 宏、原92宏行 hash、原7 User `_id` 读回、safeMLD/尺寸/viewport/UI、Core 与 Inspector 限定恢复均已闭合，但不等于旧A或完整User/所有Setting恢复。manifest范围声明不代表所有组合和地形已接受。14.364的代表样本有真实三格型证据；既有Next接受只覆盖其报告里的Square Fire切片。Mirror14.368/5.3.3已取得本轮三格型代表交互、GM/SY实际移动、HexCols26basic/36阶段与音源技术生命周期证据，具体范围见[本轮技术验收](docs/completion-2026-10-05.md)。\n\n6.0.6 的16个源码变更文件未触及本画笔使用的 Region 接口；`TokenDocument5e` 的 falling 更新按 Actor `lastMovedToken` 标记和指定用户工作。本地代表链已核对真实距离10/成本15、A升空后B地走清除 falling、三次原生移动、普通重载和完整来源恢复；该结果只覆盖本例和模块拥有的对象。\n\n素材为本项目原创或按明确许可制作，用户已确认的火焰、冰霜、荆棘及后续图案按来源记录保留。原版Tile Arsenal在本地作为独立模块安装和比较，文件不并入本模块。\n\n## 使用\n\n1. 以GM身份进入支持的世界并查看一个有网格的场景，在Tiles控制组点击火焰图标“战场地形画笔”。\n2. 选择地形及其已有阶段。各配置有1至4阶段；单阶段配置不提供阶段升级。\n3. 支持换色的13类地形提供原色加12色：火焰、薄雾、毒雾、雷电区域、魔法阵、魔法光、传送门、四种符文、组合符文与浓烟。灯光随颜色调整，颜色和素材选择存入地形文档。\n4. 选择绘制、擦除或切换阶段，以及自由、直线、填充形状和0至4格半径。填充使用拖动两端的网格范围。\n5. 启用画笔后按住左键拖动，松开提交整笔。擦除只处理模块拥有的格位；切换阶段保留未命中的格位。撤销/重做会核对当前笔画，发现外部修改时拒绝覆盖。\n6. 需要沿Region铺设时先选中Region，再点击面板入口或Shift+P。按格心判断覆盖，处理孔洞及重叠去重。\n7. 按住Shift选择地形会收起面板，落笔完成后恢复。清除本场景地形时先核数量预览，再明确确认。\n\n## 视觉与玩法\n\n火焰、冰霜、荆棘及其它地表使用已确认的原生Tile素材；火焰、冰霜和酸液等依配置生成原生光源。冰霜按薄霜/冰面分层，酸液与熔融熔岩有轻微内部流动。旧独立Fire/Frost标记仍有兼容渲染，新增火焰采用原生素材；它们的性能和画面证据分别记录。\n\n荆棘界面顺序为疏根、密枝、棘墙，原来的存储索引保持。疏根正常移动；密枝与棘墙消耗翻倍，棘墙只阻挡移动。现有荆棘规则对飞行也增加成本，未宣称与原版完全相同。碎石、碎木、地裂、油脂、沙地和地刺只增加步行成本；力场阻挡外周移动，石柱阻挡移动与视线。其它配置按面板说明使用，伤害、滑倒、坠落、传送、治疗和法术由GM裁定。\n\n蛛网及整张类图案每笔一张，随范围放大，擦除固定原图框并裁去格位。血迹、碎石、碎木等在新绘制时选取变体，之后刷新与历史保持选图。六个月蚀矿选项固定使用所选图形，作为静态场景覆盖物，不自动腐化或伤害。\n\n## 环境音\n\n环境音默认关闭，只影响接下来绘制的笔画。9类地形使用7个声音源：火焰、熔岩、酸液、能量、圣光、法阵与邪光。能量沿用已认可的5.24秒原文件，其余6条为约180秒立体声环境音；火焰/熔岩、圣光/法阵分别使用独立声音。每笔一个原生AmbientSound，范围覆盖笔画；随阶段、擦除和历史保存或清理。已放置声音可在声音图层调整或静音。\n\n用户选择按原版方向重做自有声音。V3替换其它声音并调整新笔画起始音量：火焰0.8、酸液0.26/0.4、圣光0.3、邪光0.7、熔岩0.8、法阵0.25；能量三类仍0.1。机械解码、接缝与原能量hash通过不代表听感接受，V3的技术实机与主观试听状态见[接入记录](docs/audio-v3-integration-2026-10-04.md)。素材许可见[声音署名](assets/audio/ATTRIBUTION.md)。旧白噪声继续退役；旧场景数据不自动迁移，既有四个相同文件路径的音频内容随模块更新，已放置文档的音量仍保留原值。\n\n## 安装与检查\n\n在模块目录运行`bun run test:coverage`、`bun run typecheck`和`bun run build`。构建产生完整module目录和ZIP；机械通过不等于真实画布、玩家端或声音接受。\n\n本地安装器只接受批准的Mirror路径。`bun run install:local`预览，`bun run install:local -- --apply`只安装到不存在的目标；已有目录会被拒绝。已有共享安装的升级按[本轮维护记录](../../docs/reviews/2026-10-03-foundry-14-365-mirror-upgrade-and-tile-arsenal.md)及Foundry Ops门禁处理，需核服务、实际代码和文件hash。测试结束恢复本轮对象/设置/场景并保留常驻服务。\n\n## 证据与限制\n\n- [非音效三格型接受](docs/non-audio-acceptance-2026-09-12.md)：荆棘、酸液光、彩色火焰/符文、Region孔洞、历史/重载与Shift代表样本。\n- [26项批量记录](docs/remaining-catalog-2026-09-10.md)：仍有特定格型、实际拖动、重载与独立玩家缺口，少量代表样本不覆盖全部目录。\n- [月蚀矿接受](docs/ruidium-integration-2026-09-12.md)、[素材来源](docs/asset-provenance.md)、[原版功能对照](docs/tile-arsenal-functional-parity-2026-09-12.md)。\n- [ServerNext范围](docs/server-next-candidate.md)：旧6.x切片不代替Mirror5.3.3新Core接受。\n- 狂野魔法和裂隙的深入功能暂缓；跨客户端并发锁、自动伤害、完整性能/长时和生产接受未在本轮关闭。\n\n## 场景事务读回（本地重构候选）\n\n一次笔划只有在创建数量、唯一新ID、实际Scene集合与计划归属一致后才报告成功。创建为空、只完成一部分、返回外来ID或其他创建步骤产生未报告对象时，事务会失败并报告。\n\n失败时只回滚本次返回且读回确认的对象；既有、外来、身份变化或未报告对象保留。删除被拒或回滚后仍有对象，会明确报告残留，不能把它解释为已经恢复干净。本次未新增或重做效果，原有Square Fire视觉证据保持历史范围；6.0.6 本地事务、Region移动、linked falling、普通重载和模块拥有对象的精确清理已在限定样本中接受，另接受非GM公开能力/工具栏/observer权限边界；绘制仅向GM开放，玩家入口拒绝已验；完整目录、全网格/效果组合、长时与生产仍待。角色验收环境的额外消息已准确删除并确认原生缺席；native terminal 的 Task 宏、原92宏行 hash、原7 User `_id` 读回、safeMLD/尺寸/viewport/UI、Core 与 Inspector 限定恢复已闭合，但不等于旧A或完整User/所有Setting恢复。\n","foundry-modules/fvtt-battlefield-painter/docs/CONTINUATION.md":"# Battlefield Painter 接续入口\n\n## 当前本地集成授权（2026-10-05）\n\n用户随后明确要求“那合并到master吧”，已授权按[核清的本地范围](local-integration-scope-2026-10-05.md)提交并合并到本地 master；不包含远端 push、Forge 0.4.0 蓝图业务源、Foundry 安装/服务操作或工作树清理。原技术验收保持完成停止，本次只执行文件集成。\n\n本次新的验证依据是候选需要吸收 master `cdf387a` 已提交的 17 文件；这是此前
